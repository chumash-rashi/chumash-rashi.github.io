ּבֵינֶ֑ךָ וְנִכְרְתָ֥ה בְרִ֖ית עִמָּֽךְ׃", "pasuk_en": "וַיֹּאמְרוּ רָאוֹ רָאִינוּ כִּי־הָיָה ה׳ עִמָּךְ וַנֹּאמְרָה נָּא בְרִית בֵּינוֹתֵינוּ בֵּינְךָ וּבֵינֵנוּ וְנִכְרְתָה בְרִית עִמָּךְ.", "rashi_he": "ראו ראינו. רָאִינוּ בְאָבִיךָ, רָאִינוּ בְךָ:", "rashi_en": "הלשון הכפולה “ראו ראינו” מלמדת על שתי ראיות: ראינו שה׳ היה עם אביך אברהם, ואנו רואים שהוא עמך.", "note": "", "points": [{"q": "מדוע נאמר בלשון כפולה “ראו ראינו”?", "options": ["ראינו שה׳ היה עם אביך, ורואים שהוא גם עמך", "ראינו בעינינו, וגם שמענו זאת מאחרים", "ראינו כשגירשנוך, וראינו שוב כשחזרת לגרר"], "kasha": "הפסוק כופל את לשון הראייה בלי צורך נראה לעין.", "answer": "ראינו באביך וראינו בך – שה׳ היה עם אברהם וגם עם יצחק."}]}, {"id": "26:28.2", "ch": 26, "v": 28, "n": 2, "dh": "תהי נא אלה בינותינו", "pasuk_html": "וַיֹּאמְר֗וּ רָא֣וֹ רָאִ֘ינוּ֮ כִּֽי־הָיָ֣ה יְהֹוָ֣ה&thinsp;׀&thinsp;עִמָּךְ֒ וַנֹּ֗אמֶר <mark>תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖ינוּ</mark> בֵּינֵ֣ינוּ וּבֵינֶ֑ךָ וְנִכְרְתָ֥ה בְרִ֖ית עִמָּֽךְ׃", "pasuk_en": "וַיֹּאמְרוּ כִּי רָאִינוּ כִּי־הָיָה יְהוָה עִמָּךְ וַנֹּאמְרָה תְּהִי־נָא אָלָה בֵּינוֹתֵינוּ בֵּינִים וּבֵינֶךָ וְנִכְרְתָה בְּרִית עִמָּךְ", "rashi_he": "תהי נא אלה בינותינו וגו'. הָאָלָה אֲשֶׁר בֵּינוֹתֵינוּ מִימֵי אָבִיךָ תְּהִי גַּם עַתָּה בינינו וביניך:", "rashi_en": "השבועה שהייתה בין אנשי גרר לבין אברהם עוד מימיו – אבימלך מבקש שתהיה קיימת גם עכשיו בינם לבין יצחק.", "note": "", "points": [{"q": "לאיזו אלה מתכוון אבימלך באמרו “תהי נא אלה בינותינו”?", "options": ["לשבועה שהייתה עם אברהם, שתהיה קיימת גם עם יצחק", "לשבועה חדשה לגמרי, שלא הייתה ביניהם קודם לכן", "לקללה שתחול על מי שיפר את הברית שביניהם"], "kasha": "הפסוק אומר “בינותינו” ואחר כך “בינינו ובינך”, ונראה ככפילות.", "answer": "האלה אשר בינותינו מימי אביך – תהי גם עתה בינינו ובינך."}]}, {"id": "26:29.1", "ch": 26, "v": 29, "n": 1, "dh": "לא נגענוך", "pasuk_html": "אִם־תַּעֲשֵׂ֨ה עִמָּ֜נוּ רָעָ֗ה כַּאֲשֶׁר֙ <mark>לֹ֣א נְגַֽעֲנ֔וּךָ</mark> וְכַאֲשֶׁ֨ר עָשִׂ֤ינוּ עִמְּךָ֙ רַק־ט֔וֹב וַנְּשַׁלֵּֽחֲךָ֖ בְּשָׁל֑וֹם אַתָּ֥ה עַתָּ֖ה בְּר֥וּךְ יְהֹוָֽה׃", "pasuk_en": "לְּךָ לוֹא תַעֲשֶׂה־לָּנוּ רָעָה כַּאֲשֶׁר לֹא־נָגַעְנוּ בְּךָ וְכַאֲשֶׁר עָשִׂינוּ אִתְּךָ רַק־טוֹב וַנִּשְׁלָּחְךָ בְּשָׁלוֹם אַתָּה עַתָּה בְּרוּךְ יְהוָה", "rashi_he": "לא נגענוך. כְּשֶׁאָמַרְנוּ לֵךְ לְךָ מֵעִמָּנוּ:", "rashi_en": "אבימלך אומר שגם כשאמרו ליצחק “לך מעמנו” ושלחוהו מארצם – לא פגעו בו.", "note": "", "points": [{"q": "מתי, לדברי אבימלך, “לא נגענוך”?", "options": ["כשאמרו ליצחק “לך מעמנו” ושלחוהו מארצם", "כשסתמו את הבארות שחפרו עבדי אברהם", "כשרבו רועי גרר עם רועי יצחק על המים"], "kasha": "הרי גירשו את יצחק מארצם, ואיך יכלו לומר שלא נגעו בו?", "answer": "כשאמרנו לך “לך מעמנו” – אמנם שלחנוך, אבל לא פגענו בך."}]}, {"id": "26:29.2", "ch": 26, "v": 29, "n": 2, "dh": "אתה", "pasuk_html": "אִם־תַּעֲשֵׂ֨ה עִמָּ֜נוּ רָעָ֗ה כַּאֲשֶׁר֙ לֹ֣א נְגַֽעֲנ֔וּךָ וְכַאֲשֶׁ֨ר עָשִׂ֤ינוּ עִמְּךָ֙ רַק־ט֔וֹב וַנְּשַׁלֵּֽחֲךָ֖ בְּשָׁל֑וֹם <mark>אַתָּ֥ה</mark> עַתָּ֖ה בְּר֥וּךְ יְהֹוָֽה׃", "pasuk_en": "לְּךָ לוֹא תַעֲשֶׂה־לָּנוּ רָעָה כַּאֲשֶׁר לֹא־נָגַעְנוּ בְּךָ וְכַאֲשֶׁר עָשִׂינוּ אִתְּךָ רַק־טוֹב וַנִּשְׁלָּחְךָ בְּשָׁלוֹם אַתָּה עַתָּה בְּרוּךְ יְהוָה", "rashi_he": "אתה. גַּם אַתָּה עֲשֵׂה לָנוּ כְּמוֹ כֵן:", "rashi_en": "“אתה” הוא המשך הבקשה: כשם שאנו לא פגענו בך ועשינו עמך רק טוב, גם אתה עשה לנו כך.", "note": "", "points": [{"q": "מה פירוש המילה “אתה” בדברי אבימלך ליצחק?", "options": ["גם אתה עשה לנו כמו שעשינו לך", "אתה לבדך ברוך ה׳, ולא אנשי ביתך", "אתה צריך לבוא אלינו לגרר לכרות ברית"], "kasha": "המילה “אתה” נראית מיותרת ומנותקת מהמשך הפסוק.", "answer": "גם אתה עשה לנו כמו כן – כשם שאנו עשינו עמך."}]}, {"id": "26:33.1", "ch": 26, "v": 33, "n": 1, "dh": "שבעה", "pasuk_html": "וַיִּקְרָ֥א אֹתָ֖הּ <mark>שִׁבְעָ֑ה</mark> עַל־כֵּ֤ן שֵׁם־הָעִיר֙ בְּאֵ֣ר שֶׁ֔בַע עַ֖ד הַיּ֥וֹם הַזֶּֽה׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיִּקְרָא אֶת־שֵׁם־הַבְּאֵר שִׁבְעָה עַל־כֵּן שֵׁם־הָעִיר בְּאֵר שָׁבַע עַד הַיּוֹם הַזֶּה", "rashi_he": "שבעה. עַל שֵׁם הַבְּרִית:", "rashi_en": "יצחק קרא לבאר “שבעה” על שם הברית והשבועה שנשבעו הוא ואבימלך זה לזה.", "note": "", "points": [{"q": "על שם מה קרא יצחק לבאר “שבעה”?", "options": ["על שם הברית והשבועה שכרת עם אבימלך", "על שם שבע הכבשות שנתן אברהם לאבימלך", "על שם שבע הבארות שחפרו עבדי יצחק"], "kasha": "הפסוק אינו מפרש מה טעם השם “שבעה”.", "answer": "על שם הברית – השבועה שנשבעו יצחק ואבימלך."}]}, {"id": "26:34.1", "ch": 26, "v": 34, "n": 1, "dh": "בן ארבעים שנה", "pasuk_html": "וַיְהִ֤י עֵשָׂו֙ <mark>בֶּן־אַרְבָּעִ֣ים שָׁנָ֔ה</mark> וַיִּקַּ֤ח אִשָּׁה֙ אֶת־יְהוּדִ֔ית בַּת־בְּאֵרִ֖י הַֽחִתִּ֑י וְאֶת־בָּ֣שְׂמַ֔ת בַּת־אֵילֹ֖ן הַֽחִתִּֽי׃", "pasuk_en": "וַיִּהְיוּ בְנֵי־עֵשָׂיו בִּן־אַרְבָּעִים שָׁנָה וַיִּשַׁח אֶת־יְהוּדִית בַּת־בְּאֵרִי הַחִתִּי וְאֶת־בָּשְׂמַת בַּת־אֵילוֹן הַחִתִּי", "rashi_he": "בן ארבעים שנה. עֵשָׂו הָיָה נִמְשָׁל לַחֲזִיר, שֶׁנֶּאֱמַר יְכַרְסְמֶנָּה חֲזִיר מִיָּעַר (תהילים פ'), הַחֲזִיר הַזֶּה כְּשֶׁהוּא שׁוֹכֵב, פּוֹשֵׁט טְלָפָיו, לוֹמַר רְאוּ שֶׁאֲנִי טָהוֹר; כָּךְ אֵלּוּ גּוֹזְלִים וְחוֹמְסִים וּמַרְאִים עַצְמָם כְּשֵׁרִים; כָּל מ' שָׁנָה הָיָה עֵשָׂו צָד נָשִׁים מִתַּחַת בַּעֲלֵיהֶן וּמְעַנֶּה אוֹתָם, כְּשֶׁהָיָה בֶּן מ' אָמַר אַבָּא בֶּן מ' שָׁנָה נָשָׂא אִשָּׁה, אַף אֲנִי כֵן:", "rashi_en": "עשו נמשל לחזיר, שפושט את טלפיו כאילו הוא טהור – כך הוא גזל וחמס והראה עצמו כשר. כל ארבעים שנה צד נשים מבעליהן ועינה אותן, וכשהגיע לגיל ארבעים אמר: אבא נשא אשה בגיל ארבעים, גם אני כן.", "note": "", "points": [{"q": "מדוע מציינת התורה שעשו נשא אשה בן ארבעים שנה?", "options": ["כדי להראות עצמו כשר, כאביו שנשא אשה בגיל ארבעים", "כי עד אז עסק בציד ולא היה פנוי לנישואין", "כי יצחק ציווה עליו שלא יישא אשה לפני כן"], "kasha": "מה חשיבות יש לגיל שבו נשא עשו אשה?", "answer": "עשו אמר: אבא נשא אשה בן ארבעים, אף אני כן – ובכל השנים שקודם לכן צד נשים מתחת בעליהן ועינה אותן."}, {"q": "במה דומה עשו לחזיר?", "options": ["החזיר מראה טלפיו כאילו הוא טהור, ועשו מראה עצמו כשר", "החזיר אוכל כל דבר, ועשו היה רעבתן ואכל בלי הבחנה", "החזיר חי ביער, ועשו היה איש שדה ויודע ציד"], "kasha": "עשו נשא אשה כאביו כאילו היה צדיק, והרי כל ימיו גזל וחמס.", "answer": "החזיר כשהוא שוכב פושט טלפיו לומר ראו שאני טהור; כך הם גוזלים וחומסים ומראים עצמם כשרים."}]}, {"id": "26:35.1", "ch": 26, "v": 35, "n": 1, "dh": "מרת רוח", "pasuk_html": "וַתִּהְיֶ֖יןָ <mark>מֹ֣רַת ר֑וּחַ</mark> לְיִצְחָ֖ק וּלְרִבְקָֽה׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיִּהְיוּ מָרַת רוּחַ לְיִצְחָק וּלְרִבְקָה.", "rashi_he": "מרת רוח. לְשׁוֹן הַמְרָאוֹת רוּחַ, כְּמוֹ מַמְרִים הֱיִיתֶם, כָּל מַעֲשֵׂיהֶן הָיוּ לְהַכְעִיס וּלְעִצָּבוֹן:", "rashi_en": "“מרת רוח” הוא לשון המראה ומרי, כמו “ממרים הייתם”: כל מעשיהן של נשי עשו נועדו להכעיס ולצער.", "note": "", "points": [{"q": "מאיזו לשון היא המילה “מרת” לפי רש״י?", "options": ["מלשון המראה ומרי, כמו “ממרים הייתם”", "מלשון מרירות, כמו מים מרים", "מלשון מראה, כמו מראה עיניים"], "kasha": "המילה “מרת” אינה ברורה – ממה היא נגזרת ומה פירושה?", "answer": "לשון המראות רוח, כמו “ממרים הייתם” – כל מעשיהן היו להכעיס ולעצבון."}]}, {"id": "26:35.2", "ch": 26, "v": 35, "n": 2, "dh": "ליצחק ולרבקה", "pasuk_html": "וַתִּהְיֶ֖יןָ מֹ֣רַת ר֑וּחַ <mark>לְיִצְחָ֖ק וּלְרִבְקָֽה׃</mark>&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיִּהְיוּ מָרַת רוּחַ לְיִצְחָק וּלְרִבְקָה.", "rashi_he": "ליצחק ולרבקה. שֶׁהָיוּ עוֹבְדוֹת עֲ\"זָ (בראשית רבה):", "rashi_en": "נשי עשו היו עובדות עבודה זרה, ולכן היו למורת רוח ליצחק ולרבקה.", "note": "", "points": [{"q": "מדוע היו נשי עשו “מרת רוח ליצחק ולרבקה”?", "options": ["כי היו עובדות עבודה זרה", "כי לא רצו לגור בבית יצחק ורבקה", "כי דיברו בחוצפה אל יצחק ורבקה"], "kasha": "הפסוק אינו מפרש במה ציערו נשי עשו את יצחק ואת רבקה.", "answer": "שהיו עובדות עבודה זרה."}]}, {"id": "27:1.1", "ch": 27, "v": 1, "n": 1, "dh": "ותכהין", "pasuk_html": "וַֽיְהִי֙ כִּֽי־זָקֵ֣ן יִצְחָ֔ק <mark>וַתִּכְהֶ֥יןָ</mark> עֵינָ֖יו מֵרְאֹ֑ת וַיִּקְרָ֞א אֶת־עֵשָׂ֣ו&thinsp;׀ בְּנ֣וֹ הַגָּדֹ֗ל וַיֹּ֤אמֶר אֵלָיו֙ בְּנִ֔י וַיֹּ֥אמֶר אֵלָ֖יו הִנֵּֽנִי׃", "pasuk_en": "וַיְהִי כִּי־זָקֵן יִצְחָק וַתִּכְהֶינָה עֵינָיו מֵרְאוֹת וַיִּקְרָא אֶת־עֵשָׂו בְּנוֹ הַגָּדוֹל וַיֹּאמֶר אֵלָיו בְּנִי וַיֹּאמֶר אֵלָיו הִנֵּנִי.", "rashi_he": "ותכהין. בַּעֲשָׁנָן שֶׁל אֵלּוּ. דָּ\"אַ כְּשֶׁנֶּעֱקַד עַ\"גַּ הַמִּזְבֵּחַ וְהָיָה אָבִיו רוֹצֶה לְשָׁחֳטוֹ, בְּאוֹתָהּ שָׁעָה נִפְתְּחוּ הַשָּׁמַיִם וְרָאוּ מַלְאֲכֵי הַשָּׁרֵת וְהָיוּ בוֹכִים, וְיָרְדוּ דִמְעוֹתֵיהֶם וְנָפְלוּ עַל עֵינָיו, לְפִיכָךְ כָּהוּ עֵינָיו. דָּ\"אַ כְּדֵי שֶׁיִּטֹּל יַעֲקֹב אֶת הַבְּרָכוֹת:", "rashi_en": "שלושה טעמים לכהות עיני יצחק: מעשן הקטורת שהקטירו נשי עשו לעבודה זרה; מדמעות מלאכי השרת שבכו בשעת העקידה ונפלו על עיניו; וכדי שיעקב יקבל את הברכות.", "note": "", "points": [{"q": "לפי הפירוש הראשון ברש״י, ממה כהו עיני יצחק?", "options": ["מעשן העבודה זרה של נשי עשו", "מזקנה מופלגת ומחולשת הגוף", "מבכי רב על צער בניו"], "kasha": "הפסוק אינו מפרש מה גרם לעיני יצחק לכהות.", "answer": "בעשנן של אלו – מעשן הקטורת שהקטירו נשי עשו לעבודה זרה."}, {"q": "מה קרה בשעת העקידה שגרם לכהות עיני יצחק?", "options": ["דמעות מלאכי השרת נפלו על עיניו", "אור גדול מן השמים סינוור את עיניו", "עשן העצים שעל המזבח נכנס לעיניו"], "kasha": "הפסוק אינו מפרש מה גרם לעיני יצחק לכהות.", "answer": "כשאביו רצה לשחטו נפתחו השמים, מלאכי השרת ראו ובכו, ודמעותיהם נפלו על עיניו."}]}, {"id": "27:2.1", "ch": 27, "v": 2, "n": 1, "dh": "לא ידעתי יום מותי", "pasuk_html": "וַיֹּ֕אמֶר הִנֵּה־נָ֖א זָקַ֑נְתִּי <mark>לֹ֥א יָדַ֖עְתִּי י֥וֹם מוֹתִֽי׃</mark>", "pasuk_en": "וַיֹּאמֶר הִנֵּה־נָא זָקַנְתִּי וְלֹא־יָדַעְתִּי יוֹם מוֹתִי.", "rashi_he": "לא ידעתי יום מותי. אָמַר רַבִּי יְהוֹשֻׁעַ בֶּן קָרְחָה אִם מַגִּיעַ אָדָם לְפֶרֶק אֲבוֹתָיו יִדְאַג חָמֵשׁ שָׁנִים לִפְנֵיהֶן וְחָמֵשׁ לְאַחַר כֵּן; וְיִצְחָק הָיָה בֶּן קכ\"ג, אָמַר שֶׁמָּא לְפֶרֶק אִמִּי אֲנִי מַגִּיעַ וְהִיא מֵתָה בַּת קכ\"ז וַהֲרֵינִי בֶן ה' שָׁנִים סָמוּךְ לְפִרְקָהּ; לְפִיכָךְ לא ידעתי יום מותי, שֶׁמָּא לְפֶרֶק אִמִּי, שֶׁמָּא לְפֶרֶק אַבָּא:", "rashi_en": "אדם שמגיע לגיל שבו מתו הוריו ידאג חמש שנים לפני כן וחמש שנים אחר כך. יצחק היה בן קכ״ג, קרוב בפחות מחמש שנים לגיל שבו מתה אמו (קכ״ז), ולכן לא ידע אם ימות כגיל אמו או כגיל אביו.", "note": "", "points": [{"q": "מדוע חשש יצחק למותו כשהיה בן מאה עשרים ושלוש?", "options": ["כי התקרב לגיל שבו מתה אמו, בת מאה עשרים ושבע", "כי הגיע לגיל שבו מת אביו אברהם", "כי חלה והרגיש שכוחותיו הולכים ופוחתים"], "kasha": "יצחק לא היה חולה, ומדוע אמר “לא ידעתי יום מותי”?", "answer": "אדם המגיע לפרק אבותיו ידאג חמש שנים לפניהן; יצחק היה בן קכ״ג ואמו מתה בת קכ״ז, ולכן לא ידע אם ימות כגיל אמו או כגיל אביו."}]}, {"id": "27:3.1", "ch": 27, "v": 3, "n": 1, "dh": "שא נא", "pasuk_html": "וְעַתָּה֙ <mark>שָׂא־נָ֣א</mark> כֵלֶ֔יךָ תֶּלְיְךָ֖ וְקַשְׁתֶּ֑ךָ וְצֵא֙ הַשָּׂדֶ֔ה וְצ֥וּדָה לִּ֖י (צידה) [צָֽיִד]׃", "pasuk_en": "שָׂא נָא אֶת־כְּלִיךָ אֶת־אַשְׁפָּתְךָ וְאֶת־קַשְׁתְּךָ וְצֵא הַשָּׂדֶה וְצוּד לִי צָיִד.", "rashi_he": "שא נא. לְשׁוֹן הַשְׁחָזָה, כְּאוֹתָהּ שֶׁשָּׁנִינוּ אֵין מַשְׁחִיזִין אֶת הַסַּכִּין, אֲבָל מַשִּׂיאָהּ עַל גַּבֵּי חֲבֶרְתָּהּ (ביצה כ\"ח), חַדֵּד סַכִּינְךָ וּשְׁחֹט יָפֶה, שֶׁלֹּא תַאֲכִילֵנִי נְבֵלָה (בראשית רבה):", "rashi_en": "“שא” הוא לשון השחזה, כמו במשנה “משיאה על גבי חברתה”. יצחק אמר לעשו: חדד את סכינך ושחט כראוי, שלא תאכילני נבלה.", "note": "", "points": [{"q": "מה פירוש “שא נא כליך”?", "options": ["חדד את סכינך", "הרם את כלי הציד שלך", "קח את כליך מן הבית"], "kasha": "מדוע צריך לומר לעשו “שא” את כליו, הרי ממילא לוקח אותם לציד?", "answer": "לשון השחזה, כמו “משיאה על גבי חברתה” – חדד סכינך."}, {"q": "מדוע הקפיד יצחק שעשו יחדד את סכינו?", "options": ["כדי שישחט כראוי ולא יאכילנו נבלה", "כדי שיוכל לצוד חיות גדולות וחזקות", "כדי שיכין את המטעמים במהירות"], "kasha": "מה איכפת ליצחק במצב הסכין של עשו?", "answer": "חדד סכינך ושחט יפה, שלא תאכילני נבלה."}]}, {"id": "27:3.2", "ch": 27, "v": 3, "n": 2, "dh": "תליך", "pasuk_html": "וְעַתָּה֙ שָׂא־נָ֣א כֵלֶ֔יךָ <mark>תֶּלְיְךָ֖</mark> וְקַשְׁתֶּ֑ךָ וְצֵא֙ הַשָּׂדֶ֔ה וְצ֥וּדָה לִּ֖י (צידה) [צָֽיִד]׃", "pasuk_en": "קַח אֶת־כְּלֵיךָ, אֶת־אַשְׁפַּתְךָ וְקַשְׁתְּךָ, וְצֵא הַשָּׂדֶה וְצוּד לִי צָיִד.", "rashi_he": "תליך. חַרְבְּךָ שֶׁדֶּרֶךְ לִתְלוֹתָהּ:", "rashi_en": "“תליך” היא החרב, שדרך לתלות אותה בצד הגוף.", "note": "", "points": [{"q": "מהו “תליך”, ומדוע הוא נקרא כך?", "options": ["חרבו של עשו, שדרך לתלות אותה", "אשפת החצים, שתולים אותה על הכתף", "הרשת שבה תולים את הציד שנלכד"], "kasha": "המילה “תליך” אינה מוכרת, ולא ברור לאיזה כלי היא מכוונת.", "answer": "חרבך, שדרך לתלותה."}]}, {"id": "27:3.3", "ch": 27, "v": 3, "n": 3, "dh": "וצודה לי", "pasuk_html": "וְעַתָּה֙ שָׂא־נָ֣א כֵלֶ֔יךָ תֶּלְיְךָ֖ וְקַשְׁתֶּ֑ךָ וְצֵא֙ הַשָּׂדֶ֔ה <mark>וְצ֥וּדָה לִּ֖י</mark> (צידה) [צָֽיִד]׃", "pasuk_en": "קַח אֶת־כְּלֵיךָ, אֶת־אַשְׁפַּתְךָ וְקַשְׁתְּךָ, וְצֵא הַשָּׂדֶה וְצוּד לִי צָיִד.", "rashi_he": "וצודה לי. מִן הַהֶפְקֵר וְלֹא מִן הַגֶּזֶל:", "rashi_en": "יצחק ביקש שעשו יצוד מן ההפקר, ולא יביא בשר גזול.", "note": "", "points": [{"q": "מה ביקש יצחק להדגיש באמרו “וצודה לי”?", "options": ["שיצוד מן ההפקר ולא מן הגזל", "שיצוד רק בשבילו ולא בשביל אחרים", "שיצוד בעצמו ולא ישלח את עבדיו"], "kasha": "כבר נאמר “וצא השדה”, ומה מוסיף “וצודה לי”?", "answer": "מן ההפקר ולא מן הגזל."}]}, {"id": "27:5.1", "ch": 27, "v": 5, "n": 1, "dh": "לצוד ציד להביא", "pasuk_html": "וְרִבְקָ֣ה שֹׁמַ֔עַת בְּדַבֵּ֣ר יִצְחָ֔ק אֶל־עֵשָׂ֖ו בְּנ֑וֹ וַיֵּ֤לֶךְ עֵשָׂו֙ הַשָּׂדֶ֔ה <mark>לָצ֥וּד צַ֖יִד לְהָבִֽיא׃</mark>", "pasuk_en": "וְרִבְקָה שׁוֹמַעַת בִּדְבַר־יִצְחָק אֶל־עֵשָׂו בְנוֹ. וַיֵּלֶךְ עֵשָׂו הַשָּׂדֶה לִצְדּוֹת צָיִד לְהָבִיא.", "rashi_he": "לצוד ציד להביא. מַהוּ לְהָבִיא? אִם לֹא יִמְצָא צַיִד יָבִיא מִן הַגֶּזֶל:", "rashi_en": "המילה “להביא” נראית מיותרת, והיא מלמדת שעשו התכוון: אם לא ימצא ציד – יביא מן הגזל.", "note": "", "points": [{"q": "מה מלמדת המילה “להביא” שאחרי “לצוד ציד”?", "options": ["שאם לא ימצא ציד, יביא מן הגזל", "שמיהר להביא את הציד לפני מות אביו", "שהתכוון להביא את הציד בעצמו ולא בידי אחר"], "kasha": "אחרי “לצוד ציד” המילה “להביא” נראית מיותרת.", "answer": "אם לא ימצא ציד, יביא מן הגזל."}]}, {"id": "27:7.1", "ch": 27, "v": 7, "n": 1, "dh": "לפני ה'", "pasuk_html": "הָבִ֨יאָה לִּ֥י צַ֛יִד וַעֲשֵׂה־לִ֥י מַטְעַמִּ֖ים וְאֹכֵ֑לָה וַאֲבָרֶכְכָ֛ה <mark>לִפְנֵ֥י יְהֹוָ֖ה</mark> לִפְנֵ֥י מוֹתִֽי׃", "pasuk_en": "הָבִיא־לִּי צָיִד וַעֲשֵׂה־לִּי מַטְעַמִּים וְאֹכְלָה, בַּעֲבוּר תְּבָרֶכְךָ נַפְשִׁי לִפְנֵי־ה׳ בְּטֶרֶם אָמוּת.", "rashi_he": "לפני ה'. בִּרְשׁוּתוֹ, שֶׁיַּסְכִּים עַל יָדִי:", "rashi_en": "“לפני ה׳” פירושו ברשות ה׳ – שה׳ יסכים לברכה שיצחק מברך.", "note": "", "points": [{"q": "מה פירוש “ואברככה לפני ה׳”?", "options": ["ברשות ה׳, שיסכים לברכה שאתן", "במקום קדוש, לפני המזבח", "בתפילה שה׳ יברך אותך במקומי"], "kasha": "מה משמעות “לפני ה׳” בברכה שיצחק מברך את בנו?", "answer": "ברשותו – שיסכים על ידי."}]}, {"id": "27:9.1", "ch": 27, "v": 9, "n": 1, "dh": "וקח לי", "pasuk_html": "לֶךְ־נָא֙ אֶל־הַצֹּ֔אן <mark>וְקַֽח־לִ֣י</mark> מִשָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְאֶֽעֱשֶׂ֨ה אֹתָ֧ם מַטְעַמִּ֛ים לְאָבִ֖יךָ כַּאֲשֶׁ֥ר אָהֵֽב׃", "pasuk_en": "לֵךְ־נָא אֶל־הַצּוֹאן וְקַח־לִּי מִשָּׁם שְׁנֵי גְּדָיֵי עִזִּים טוֹבִים, וְאַעֲשֶׂה אוֹתָם מַטְעַמִּים לְאָבִיךָ כַּאֲשֶׁר אָהֵב.", "rashi_he": "וקח לי. מִשֶּׁלִּי הֵם וְאֵינָם גֶּזֶל, שֶׁכָּךְ כָּתַב לָהּ יִצְחָק בִּכְתֻבָּתָהּ לִטֹּל שְׁנֵי גְּדָיֵי עִזִּים בְּכָל יוֹם (בראשית רבה):", "rashi_en": "“לי” – משלי. הגדיים היו של רבקה ולא גזל, שכך כתב לה יצחק בכתובתה: ליטול שני גדיי עזים בכל יום.", "note": "", "points": [{"q": "מדוע אמרה רבקה “וקח לי”?", "options": ["כי הגדיים היו שלה לפי כתובתה, ואינם גזל", "כי רצתה להכין בעצמה את המטעמים", "כי חששה שיעקב ייקח מן הצאן בלי רשות"], "kasha": "המטעמים נועדו ליצחק, ולמה אמרה רבקה “קח לי”?", "answer": "משלי הם ואינם גזל – שיצחק כתב לה בכתובתה ליטול שני גדיי עזים בכל יום."}]}, {"id": "27:9.2", "ch": 27, "v": 9, "n": 2, "dh": "שני גדיי עזים", "pasuk_html": "לֶךְ־נָא֙ אֶל־הַצֹּ֔אן וְקַֽח־לִ֣י מִשָּׁ֗ם <mark>שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים</mark> טֹבִ֑ים וְאֶֽעֱשֶׂ֨ה אֹתָ֧ם מַטְעַמִּ֛ים לְאָבִ֖יךָ כַּאֲשֶׁ֥ר אָהֵֽב׃", "pasuk_en": "לך אל הצאן וקח לי משם שני גדיי עזים טובים ואעשה אותם מטעמים לאביך כאשר הוא אוהב.", "rashi_he": "שני גדיי עזים. וְכִי שְׁנֵי גְּדָיֵי עִזִּים הָיָה מַאֲכָל שֶׁל יִצְחָק? אֶלָּא הָאֶחָד הִקְרִיב לְפִסְחוֹ וְהָאֶחָד עָשָׂה מַטְעַמִּים; בְּפִרְקֵי רַבִּי אֱלִיעֶזֶר:", "rashi_en": "וכי יצחק אכל שני גדיים בסעודה אחת? אלא היה זה פסח: את האחד הקריב לקרבן פסח, ומן השני עשה מטעמים.", "note": "", "points": [{"q": "מדוע נצרכו שני גדיי עזים?", "options": ["אחד לקרבן פסח, ואחד למטעמים", "אחד ליצחק, ואחד ליעקב שיאכל עמו", "כדי להלביש את עורות שניהם על יעקב"], "kasha": "וכי שני גדיי עזים היו מאכל של יצחק?", "answer": "האחד הקריב לפסחו, והאחד עשה ממנו מטעמים."}]}, {"id": "27:9.3", "ch": 27, "v": 9, "n": 3, "dh": "כאשר אהב", "pasuk_html": "לֶךְ־נָא֙ אֶל־הַצֹּ֔אן וְקַֽח־לִ֣י מִשָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְאֶֽעֱשֶׂ֨ה אֹתָ֧ם מַטְעַמִּ֛ים לְאָבִ֖יךָ <mark>כַּאֲשֶׁ֥ר אָהֵֽב׃</mark>", "pasuk_en": "לך אל הצאן וקח לי משם שני גדיי עזים טובים ואעשה אותם מטעמים לאביך כאשר הוא אוהב.", "rashi_he": "כאשר אהב. כִּי טַעַם הַגְּדִי כְּטַעַם הַצְּבִי:", "rashi_en": "רבקה יכלה להכין מגדי מטעמים “כאשר אהב” יצחק, כי טעם הגדי כטעם הצבי.", "note": "", "points": [{"q": "כיצד יכלה רבקה להכין מגדי מטעמים “כאשר אהב” יצחק?", "options": ["כי טעם הגדי דומה לטעם הצבי", "כי יצחק אהב גדיים יותר מבשר ציד", "כי תבלינים מיוחדים הסתירו את טעם הגדי"], "kasha": "יצחק אהב בשר ציד, ואיך יהיה הגדי “כאשר אהב”?", "answer": "כי טעם הגדי כטעם הצבי."}]}, {"id": "27:11.1", "ch": 27, "v": 11, "n": 1, "dh": "איש שעיר", "pasuk_html": "וַיֹּ֣אמֶר יַעֲקֹ֔ב אֶל־רִבְקָ֖ה אִמּ֑וֹ הֵ֣ן עֵשָׂ֤ו אָחִי֙ <mark>אִ֣ישׁ שָׂעִ֔ר</mark> וְאָנֹכִ֖י אִ֥ישׁ חָלָֽק׃", "pasuk_en": "ויאמר יעקב אל רבקה אמו הן עשו אחי איש שער ואני איש חלק.", "rashi_he": "איש שעיר. בַּעַל שֵׂעָר:", "rashi_en": "“איש שער” פירושו אדם בעל שער, ששיער רב על גופו.", "note": "", "points": [{"q": "מה פירוש “איש שער”?", "options": ["אדם שיש לו שיער רב על גופו", "אדם שיושב בשער העיר", "אדם שבא מארץ שעיר"], "kasha": "הצירוף “איש שער” יכול להתפרש בכמה אופנים.", "answer": "בעל שער."}]}, {"id": "27:12.1", "ch": 27, "v": 12, "n": 1, "dh": "ימשני", "pasuk_html": "אוּלַ֤י <mark>יְמֻשֵּׁ֙נִי֙</mark> אָבִ֔י וְהָיִ֥יתִי בְעֵינָ֖יו כִּמְתַעְתֵּ֑עַ וְהֵבֵאתִ֥י עָלַ֛י קְלָלָ֖ה וְלֹ֥א בְרָכָֽה׃", "pasuk_en": "אולי יימשני אבי והייתי בעיניו כמתעתע והבאתי עליי קללה ולא ברכה.", "rashi_he": "ימשני. כְּמוֹ מְמַשֵּׁשׁ בַּצָּהֳרַיִם:", "rashi_en": "“ימשני” הוא מלשון מישוש, כמו “ממשש בצהרים” – יעקב חשש שאביו ימשש אותו בידיו.", "note": "", "points": [{"q": "מה פירוש “ימשני”?", "options": ["ימשש אותי בידיו, כמו “ממשש בצהרים”", "ימשוך אותי אליו בכוח", "יבחן אותי בשאלות ויגלה מי אני"], "kasha": "המילה “ימשני” אינה רגילה, ולא ברור מה פירושה.", "answer": "לשון מישוש, כמו “ממשש בצהרים”."}]}, {"id": "27:15.1", "ch": 27, "v": 15, "n": 1, "dh": "החמדות", "pasuk_html": "וַתִּקַּ֣ח רִ֠בְקָ֠ה אֶת־בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤הּ הַגָּדֹל֙ <mark>הַחֲמֻדֹ֔ת</mark> אֲשֶׁ֥ר אִתָּ֖הּ בַּבָּ֑יִת וַתַּלְבֵּ֥שׁ אֶֽת־יַעֲקֹ֖ב בְּנָ֥הּ הַקָּטָֽן׃", "pasuk_en": "ותקח רבקה את בגדי עשו בנה הגדול החמדות אשר אתה בבית ותלבש את יעקב בנה הקטן.", "rashi_he": "החמדת. הַנְּקִיּוֹת, כְּתַרְגּוּמוֹ דָּכְיָתָא, דָּ\"אַ שֶׁחָמַד אוֹתָן מִן נִמְרוֹד:", "rashi_en": "“החמדת” הם הבגדים הנקיים, כתרגום אונקלוס “דכיתא”. דבר אחר: נקראו כך משום שעשו חמד אותם מנמרוד.", "note": "", "points": [{"q": "לפי הפירוש הראשון ברש״י, מה הם בגדי עשו “החמדת”?", "options": ["הבגדים הנקיים, כתרגומו “דכיתא”", "הבגדים החדשים שלא לבש מעולם", "הבגדים המיוחדים לציד בשדה"], "kasha": "לא ברור מה פירוש התואר “החמדת” לבגדים.", "answer": "הנקיות, כתרגומו “דכיתא”."}, {"q": "לפי הפירוש השני, מדוע נקראו הבגדים “החמדת”?", "options": ["כי עשו חמד אותם מנמרוד", "כי יצחק חמד אותם ונתנם לעשו", "כי היו משובצים זהב ואבנים יקרות"], "kasha": "לא ברור מה פירוש התואר “החמדת” לבגדים.", "answer": "שחמד אותן מן נמרוד."}]}, {"id": "27:15.2", "ch": 27, "v": 15, "n": 2, "dh": "אשר אתה בבית", "pasuk_html": "וַתִּקַּ֣ח רִ֠בְקָ֠ה אֶת־בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤הּ הַגָּדֹל֙ הַחֲמֻדֹ֔ת <mark>אֲשֶׁ֥ר אִתָּ֖הּ בַּבָּ֑יִת</mark> וַתַּלְבֵּ֥שׁ אֶֽת־יַעֲקֹ֖ב בְּנָ֥הּ הַקָּטָֽן׃", "pasuk_en": "וַתִּקַּח רִבְקָה אֶת־בִּגְדֵי עֵשָׂו בְנָהּ הַגָּדוֹל הַחֲמֻדוֹת אֲשֶׁר אִתָּהּ בַּבָּיִת וַתַּלְבֵּשׁ אֶת־יַעֲקֹב בְנָהּ הַקָּטָן.", "rashi_he": "אשר אתה בבית. וַהֲלֹא כַמָּה נָשִׁים הָיוּ לוֹ, וְהוּא מַפְקִיד אֵצֶל אִמּוֹ? אֶלָּא שֶׁהָיָה בָקִי בְמַעֲשֵׂיהֶן וְחוֹשְׁדָן:", "rashi_en": "לעשו היו כמה נשים, ובכל זאת הפקיד את בגדיו אצל אמו – משום שהכיר את מעשיהן וחשד בהן.", "note": "", "points": [{"q": "מדוע היו בגדי עשו אצל רבקה ולא אצל נשותיו?", "options": ["כי הכיר את מעשי נשותיו וחשד בהן", "כי לא היה לו בית משלו, וגר אצל הוריו", "כי רבקה ביקשה לשמור עליהם בעצמה"], "kasha": "הרי היו לעשו כמה נשים, ולמה הפקיד את בגדיו אצל אמו?", "answer": "שהיה בקי במעשיהן וחושדן."}]}, {"id": "27:19.1", "ch": 27, "v": 19, "n": 1, "dh": "אנכי עשו בכורך", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־אָבִ֗יו <mark>אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔ךָ</mark> עָשִׂ֕יתִי כַּאֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑י קֽוּם־נָ֣א שְׁבָ֗ה וְאׇכְלָה֙ מִצֵּידִ֔י בַּעֲב֖וּר תְּבָרְכַ֥נִּי נַפְשֶֽׁךָ׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו אָנֹכִי עֵשָׂו בִּכְרְךָ עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי קוּם־נָא שְׁבָה וְאֵכְלָה מִצֵּידִי בַּעֲבוּר תְּבָרֲכַנִּי נַפְשְׁךָ.", "rashi_he": "אנכי עשו בכורך. אָנֹכִי הַמֵּבִיא לְךָ וְעֵשָׂו הוּא בְּכוֹרֶךָ:", "rashi_en": "יעקב לא אמר שקר: “אנכי” – אני הוא המביא לך, ו“עשו” – הוא בכורך.", "note": "", "points": [{"q": "כיצד מפרש רש״י את דברי יעקב “אנכי עשו בכרך”?", "options": ["“אנכי” המביא לך, ו“עשו” הוא בכורך", "אני עשו, כי קניתי ממנו את הבכורה", "אני כמו עשו, שעשיתי כמצוותך"], "kasha": "איך אמר יעקב לאביו דבר שקר?", "answer": "אנכי המביא לך, ועשו הוא בכורך."}]}, {"id": "27:19.2", "ch": 27, "v": 19, "n": 2, "dh": "עשיתי", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־אָבִ֗יו אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔ךָ <mark>עָשִׂ֕יתִי</mark> כַּאֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑י קֽוּם־נָ֣א שְׁבָ֗ה וְאׇכְלָה֙ מִצֵּידִ֔י בַּעֲב֖וּר תְּבָרְכַ֥נִּי נַפְשֶֽׁךָ׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו אָנֹכִי עֵשָׂו בִּכְרְךָ עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי קוּם־נָא שְׁבָה וְאֵכְלָה מִצֵּידִי בַּעֲבוּר תְּבָרֲכַנִּי נַפְשְׁךָ.", "rashi_he": "עשיתי. כַמָּה דְבָרִים כַּאֲשֶׁר דִּבַּרְתָּ אֵלַי:", "rashi_en": "יעקב אמר ״עשיתי כאשר דברת אלי״, וכוונתו: עשיתי כמה וכמה דברים כפי שדיברת אליי.", "note": "", "points": [{"q": "לפי רש״י, למה התכוון יעקב באומרו ״עשיתי כאשר דברת אלי״?", "options": ["עשיתי כמה דברים כפי שדיברת אליי", "הכנתי את המטעמים בדיוק כפי שביקשת", "צדתי ציד בשדה כפי שציווית עליי"], "kasha": "יעקב לא צד ציד כפי שביקש יצחק מעשו, ואיך אמר ״עשיתי כאשר דברת אלי״?", "answer": "״עשיתי״ פירושו: עשיתי כמה דברים כפי שדיברת אליי, ולא דווקא את הציד."}]}, {"id": "27:19.3", "ch": 27, "v": 19, "n": 3, "dh": "שבה", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־אָבִ֗יו אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔ךָ עָשִׂ֕יתִי כַּאֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑י קֽוּם־נָ֣א <mark>שְׁבָ֗ה</mark> וְאׇכְלָה֙ מִצֵּידִ֔י בַּעֲב֖וּר תְּבָרְכַ֥נִּי נַפְשֶֽׁךָ׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו אָנֹכִי עֵשָׂו בִּכְרְךָ עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי קוּם־נָא שְׁבָה וְאֵכְלָה מִצֵּידִי בַּעֲבוּר תְּבָרֲכַנִּי נַפְשְׁךָ.", "rashi_he": "שבה. לְשׁוֹן מֵסֵב עַל הַשֻּׁלְחָן, לְכָךְ מְתֻרְגָּם אִסְתָּחַר:", "rashi_en": "״שבה״ כאן פירושו הסב ליד השולחן לסעודה, ולכן אונקלוס מתרגם ״אסתחר״, מלשון סיבוב.", "note": "", "points": [{"q": "מה פירוש ״קום נא שבה״ לפי רש״י?", "options": ["הסב ליד השולחן לסעודה", "שוב אליי ממקום הציד", "שב בשקט ואל תדבר"], "kasha": "מדוע מתרגם אונקלוס ״שבה״ במילה ״אסתחר״ ולא בלשון ישיבה רגילה?", "answer": "״שבה״ הוא לשון מסב על השולחן, ולכן תרגומו ״אסתחר״, לשון סיבוב."}]}, {"id": "27:21.1", "ch": 27, "v": 21, "n": 1, "dh": "גשה נא ואמשך", "pasuk_html": "וַיֹּ֤אמֶר יִצְחָק֙ אֶֽל־יַעֲקֹ֔ב <mark>גְּשָׁה־נָּ֥א וַאֲמֻֽשְׁךָ֖</mark> בְּנִ֑י הַֽאַתָּ֥ה זֶ֛ה בְּנִ֥י עֵשָׂ֖ו אִם־לֹֽא׃", "pasuk_en": "וַיֹּאמֶר יִצְחָק אֶל־יַעֲקֹב גְּשָׁה־נָּא וַאֲמוּשְׁךָ בְנִי הַאַתָּה זֶה בְנִי עֵשָׂו אִם־לֹא.", "rashi_he": "גשה נא ואמשך. אָמַר יִצְחָק בְּלִבּוֹ אֵין דֶּרֶךְ עֵשָׂו לִהְיוֹת שֵׁם שָׁמַיִם שָׁגוּר בְּפִיו, וְזֶה אָמַר כִּי הִקְרָה ה' אֱלֹהֶיךָ:", "rashi_en": "יצחק חשד בלבו, כי אין דרכו של עשו להזכיר שם שמים, וזה אמר ״כי הקרה ה׳ אלהיך״. לכן ביקש למשש אותו.", "note": "", "points": [{"q": "מדוע ביקש יצחק למשש את בנו?", "options": ["כי הזכיר שם שמים, ואין זה מדרכו של עשו", "כי קולו נשמע לו צעיר מקולו של עשו", "כי חזר מן הציד מהר מדי ממה שציפה"], "kasha": "מה עורר את חשדו של יצחק עד שביקש למשש את בנו?", "answer": "יצחק אמר בלבו: אין דרכו של עשו ששם שמים יהיה שגור בפיו, וזה אמר ״כי הקרה ה׳ אלהיך״."}]}, {"id": "27:22.1", "ch": 27, "v": 22, "n": 1, "dh": "קול יעקב", "pasuk_html": "וַיִּגַּ֧שׁ יַעֲקֹ֛ב אֶל־יִצְחָ֥ק אָבִ֖יו וַיְמֻשֵּׁ֑הוּ וַיֹּ֗אמֶר הַקֹּל֙ <mark>ק֣וֹל יַעֲקֹ֔ב</mark> וְהַיָּדַ֖יִם יְדֵ֥י עֵשָֽׂו׃", "pasuk_en": "וַיִּגַּשׁ יַעֲקֹב אֶל יִצְחָק אָבִיו, וַיְמֻשֵּׁהוּ, וַיֹּאמֶר הַקּוֹל קוֹל יַעֲקֹב, וְהַיָּדַיִם יְדֵי עֵשָׂו.", "rashi_he": "קול יעקב. שֶׁמְּדַבֵּר בִּלְשׁוֹן תַּחֲנוּנִים קוּם נָא, אֲבָל עֵשָׂו קִנְטוּרְיָא דִּבֵּר יָקֻם אָבִי:", "rashi_en": "יעקב דיבר בלשון תחנונים, ״קום נא״, ואילו עשו מדבר בלשון קשה ותובענית, ״יקם אבי״.", "note": "", "points": [{"q": "מה היה ״קול יעקב״ שזיהה יצחק?", "options": ["לשון תחנונים ובקשה: ״קום נא״", "קול צעיר ודק מקולו של עשו", "דיבור איטי ושקט מן הרגיל אצלו"], "kasha": "יעקב התחפש לעשו, ומה בדיוק בדיבורו הסגיר אותו?", "answer": "יעקב מדבר בלשון תחנונים, ״קום נא״, אבל עשו מדבר בלשון קנטור: ״יקם אבי״."}]}, {"id": "27:24.1", "ch": 27, "v": 24, "n": 1, "dh": "ויאמר אני", "pasuk_html": "וַיֹּ֕אמֶר אַתָּ֥ה זֶ֖ה בְּנִ֣י עֵשָׂ֑ו <mark>וַיֹּ֖אמֶר אָֽנִי׃</mark>", "pasuk_en": "וַיֹּאמֶר הַאַתָּה זֶה בְנִי עֵשָׂו, וַיֹּאמֶר אָנִי.", "rashi_he": "ויאמר אני. לֹא אָמַר אֲנִי עֵשָׂו אֶלָּא אָנִי:", "rashi_en": "כשנשאל ״אתה זה בני עשו״, לא אמר יעקב ״אני עשו״ אלא ״אני״ בלבד.", "note": "", "points": [{"q": "מה בדיוק ענה יעקב כשנשאל ״אתה זה בני עשו״?", "options": ["רק ״אני״, ולא ״אני עשו״", "״אני עשו בכורך״, כמו בפעם הקודמת", "לא ענה דבר, אלא התקרב אליו"], "kasha": "מדוע מדגיש הפסוק שיעקב ענה ״אני״ בלבד?", "answer": "יעקב לא אמר ״אני עשו״, אלא ״אני״."}]}, {"id": "27:27.1", "ch": 27, "v": 27, "n": 1, "dh": "וירח את ריח בגדיו", "pasuk_html": "וַיִּגַּשׁ֙ וַיִּשַּׁק־ל֔וֹ <mark>וַיָּ֛רַח אֶת־רֵ֥יחַ בְּגָדָ֖יו</mark> וַֽיְבָרְכֵ֑הוּ וַיֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔י כְּרֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרְכ֖וֹ יְהֹוָֽה׃", "pasuk_en": "וַיִּגַּשׁ וַיִּשַּׁק לוֹ, וַיָּרַח אֶת־רִיחַ בְּגָדָיו וַיְבָרְכֵהוּ, וַיֹּאמֶר, רְאֵה רִיחַ בְּנִי כְּרִיחַ שָׂדֶה אֲשֶׁר בֵּרָכוֹ יְהוָה.", "rashi_he": "וירח וגו'. וַהֲלֹא אֵין רֵיחַ רַע יוֹתֵר מִשֶּׁטֶף הָעִזִּים? אֶלָּא מְלַמֵּד שֶׁנִּכְנְסָה עִמּוֹ רֵיחַ גַּן עֵדֶן;", "rashi_en": "לעורות עזים משוטפים יש ריח רע מאוד, אלא שעם יעקב נכנס ריח גן עדן, ואותו הריח יצחק.", "note": "", "points": [{"q": "איזה ריח הריח יצחק לפי רש״י?", "options": ["ריח גן עדן שנכנס עם יעקב", "ריח עורות הגדיים שעל ידיו", "ריח המטעמים שהכינה רבקה"], "kasha": "אין ריח רע יותר מריח עורות עזים משוטפים, ואיך אמר יצחק ״ראה ריח בני״?", "answer": "הפסוק מלמד שנכנס עם יעקב ריח גן עדן."}]}, {"id": "27:27.2", "ch": 27, "v": 27, "n": 2, "dh": "כריח שדה אשר ברכו", "pasuk_html": "וַיִּגַּשׁ֙ וַיִּשַּׁק־ל֔וֹ וַיָּ֛רַח אֶת־רֵ֥יחַ בְּגָדָ֖יו וַֽיְבָרְכֵ֑הוּ וַיֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔י <mark>כְּרֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרְכ֖וֹ</mark> יְהֹוָֽה׃", "pasuk_en": "וַיֹּאמֶר רְאֵה רִיחַ בְּנִי כְּרִיחַ שָׂדֶה אֲשֶׁר בֵּרָכוֹ יְהוָה.", "rashi_he": "כריח שדה אשר ברכו ה'. שֶׁנָּתַן בּוֹ רֵיחַ טוֹב וְזֶהוּ שְׂדֵה תַּפּוּחִים, כָּךְ דָּרְשׁוּ רַזִ\"לִ:", "rashi_en": "זהו שדה שה׳ נתן בו ריח טוב, וחז״ל דרשו שהוא שדה תפוחים.", "note": "", "points": [{"q": "מהו ״שדה אשר ברכו ה׳״ לפי רש״י?", "options": ["שדה תפוחים שה׳ נתן בו ריח טוב", "שדה חיטה מלא ומבורך בתבואה", "שדה מרעה שבו רועות העזים"], "kasha": "מהו ״שדה אשר ברכו ה׳״, ובמה הוא מבורך?", "answer": "שדה שה׳ נתן בו ריח טוב, וזהו שדה תפוחים, כפי שדרשו חז״ל."}]}, {"id": "27:28.1", "ch": 27, "v": 28, "n": 1, "dh": "ויתן לך", "pasuk_html": "<mark>וְיִֽתֶּן־לְךָ֙</mark> הָאֱלֹהִ֔ים מִטַּל֙ הַשָּׁמַ֔יִם וּמִשְׁמַנֵּ֖י הָאָ֑רֶץ וְרֹ֥ב דָּגָ֖ן וְתִירֹֽשׁ׃", "pasuk_en": "וִיתֵן לְךָ אֱלֹהִים, מִטַּל הַשָּׁמַיִם וּמִשְׁמַנֵּי הָאָרֶץ, וְרֹב דָּגָן וְתִירוֹשׁ.", "rashi_he": "ויתן לך. יִתֵּן וְיַחֲזֹר וְיִתֵּן (בראשית רבה). וּלְפִי פְשׁוּטוֹ מוּסָב לְעִנְיָן הָרִאשׁוֹן: רְאֵה רֵיחַ בְּנִי שֶׁנָּתַן לוֹ הַקָּבָּ\"ה כְּרֵיחַ שָׂדֶה וְגוֹ' וְעוֹד יִתֵּן לְךָ מִטַּל הַשָּׁמַיִם וְגוֹ':", "rashi_en": "לפי המדרש: יתן ויחזור ויתן. ולפי הפשט הברכה ממשיכה את הפסוק הקודם: ריח בני, שנתן לו הקב״ה כריח שדה, ועוד יתן לך מטל השמים.", "note": "", "points": [{"q": "מה דרשו חז״ל מן המילה ״ויתן״ שבתחילת הברכה?", "options": ["יתן ויחזור ויתן, שוב ושוב", "יתן לך ולזרעך אחריך", "יתן לך רק אם תהיה ראוי"], "kasha": "מדוע פותחת הברכה בו״ו החיבור, ״ויתן״?", "answer": "לפי המדרש: יתן ויחזור ויתן."}, {"q": "לפי הפשט, למה מתחברת המילה ״ויתן״?", "options": ["לפסוק הקודם: נתן לו ריח טוב, ועוד יתן לך", "לברכה שבירך אברהם את יצחק בנו", "לבקשת יצחק מעשו להביא לו ציד"], "kasha": "הו״ו ב״ויתן״ מחברת את הברכה לדבר שקדם לה, ולאיזה דבר?", "answer": "לפי פשוטו זה מוסב על העניין הראשון: ראה ריח בני שנתן לו הקב״ה כריח שדה, ועוד יתן לך מטל השמים."}]}, {"id": "27:28.2", "ch": 27, "v": 28, "n": 2, "dh": "מטל השמים", "pasuk_html": "וְיִֽתֶּן־לְךָ֙ הָאֱלֹהִ֔ים <mark>מִטַּל֙ הַשָּׁמַ֔יִם</mark> וּמִשְׁמַנֵּ֖י הָאָ֑רֶץ וְרֹ֥ב דָּגָ֖ן וְתִירֹֽשׁ׃", "pasuk_en": "יִתֶּן לְךָ אֱלֹהִים מִטַּל הַשָּׁמַיִם וּמִשְׁמַן הָאָרֶץ וְרֹב דָּגָן וְתִירוֹשׁ.", "rashi_he": "מטל השמים. כְּמַשְׁמָעוֹ; וּמִדְרְשֵׁי אַגָּדָה יֵשׁ לְהַרְבֵּה פָנִים:", "rashi_en": "״מטל השמים״ יש לפרש כמשמעו, טל ממש; ויש לו גם מדרשי אגדה לכמה פנים.", "note": "", "points": [{"q": "איך מפרש רש״י את ״מטל השמים״ לפי הפשט?", "options": ["כמשמעו, טל ממש היורד מן השמים", "משל לתורה היורדת מן השמים", "רמז לגשמים היורדים בעונתם"], "kasha": "האם ״טל השמים״ כאן הוא טל ממש או רמז לדבר אחר?", "answer": "כמשמעו, טל ממש; ומדרשי אגדה יש לו לכמה פנים."}]}, {"id": "27:28.3", "ch": 27, "v": 28, "n": 3, "dh": "האלהים", "pasuk_html": "וְיִֽתֶּן־לְךָ֙ <mark>הָאֱלֹהִ֔ים</mark> מִטַּל֙ הַשָּׁמַ֔יִם וּמִשְׁמַנֵּ֖י הָאָ֑רֶץ וְרֹ֥ב דָּגָ֖ן וְתִירֹֽשׁ׃", "pasuk_en": "יְשִׁמְרְךָ אֱלוֹהִים מִטַּל הַשָּׁמַיִם וּמִשְׁמַנֵּי הָאָרֶץ וְרֹב דָּגָן וְתִירוֹשׁ", "rashi_he": "האלהים. מַהוּ הָאֱלֹהִים? בַּדִּין; אִם רָאוּי לְךָ יִתֵּן לְךָ וְאִם לָאו לֹא יִתֵּן לְךָ, אֲבָל לְעֵשָׂו אָמַר מִשְׁמַנֵּי הָאָרֶץ יִהְיֶה מוֹשָׁבֶךָ, בֵּין צַדִּיק בֵּין רָשָׁע יִתֵּן לְךָ; וּמִמֶּנּוּ לָמַד שְׁלֹמֹה, כְּשֶׁעָשָׂה הַבַּיִת סִדֵּר תְּפִלָּתוֹ. יִשְׂרָאֵל שֶׁהוּא בַעַל אֱמוּנָה וּמַצְדִּיק עָלָיו אֶת הַדִּין לֹא יִקְרָא עָלֶיךָ תִּגָּר, לְפִיכָךְ וְנָתַתָּ לָאִישׁ בְכָל דְּרָכָיו אֲשֶׁר תֵּדַע אֶת לְבָבוֹ (מלכים א, ח'), אֲבָל נָכְרִי מְחֻסַּר אֲמָנָה, לְפִיכָךְ אָמַר אַתָּה תִּשְׁמַע הַשָּׁמַיִם, וְעָשִׂיתָ כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ הַנָּכְרִי (שם), בֵּין רָאוּי בֵּין שֶׁאֵינוֹ רָאוּי תֵּן לוֹ, כְּדֵי שֶׁלֹּא יִקְרָא עָלֶיךָ תִּגָּר:", "rashi_en": "״האלהים״ הוא מידת הדין: אם תהיה ראוי, יתן לך. לעשו בירך בלי תנאי, בין צדיק בין רשע. מכאן למד שלמה בתפילתו: לישראל לפי דרכיו, ולנכרי בכל מקרה, כדי שלא יקרא תגר.", "note": "", "points": [{"q": "מה מלמד השם ״האלהים״ בברכת יעקב?", "options": ["ה׳ יתן לך בדין, רק אם תהיה ראוי", "ה׳ יתן לך ברחמים, גם אם לא תהיה ראוי", "ה׳ יתן לך בזכות אביך ואמך"], "kasha": "מדוע נאמר בברכה ״האלהים״, שהוא שם מידת הדין?", "answer": "הברכה היא בדין: אם ראוי לך יתן לך, ואם לאו לא יתן לך; אבל לעשו אמר ״משמני הארץ יהיה מושבך״, בין צדיק בין רשע."}, {"q": "מה למד שלמה מברכת יצחק בתפילתו כשבנה את המקדש?", "options": ["לישראל ביקש לפי דרכיו, ולנכרי גם אם אינו ראוי", "לנכרי ביקש לפי דרכיו, ולישראל גם אם אינו ראוי", "לכל אדם ביקש שתתקבל בקשתו בלי שום תנאי"], "kasha": "מדוע בתפילת שלמה יש הבדל בין בקשת ישראל לבקשת הנכרי?", "answer": "ישראל, בעל אמונה המצדיק עליו את הדין, לא יקרא תגר, ולכן ״ונתת לאיש בכל דרכיו״; אבל הנכרי מחוסר אמונה, ולכן ״ועשית ככל אשר יקרא אליך הנכרי״, כדי שלא יקרא תגר."}]}, {"id": "27:29.1", "ch": 27, "v": 29, "n": 1, "dh": "בני אמך", "pasuk_html": "יַֽעַבְד֣וּךָ עַמִּ֗ים (וישתחו) [וְיִֽשְׁתַּחֲו֤וּ] לְךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְאַחֶ֔יךָ וְיִשְׁתַּחֲו֥וּ לְךָ֖ <mark>בְּנֵ֣י אִמֶּ֑ךָ</mark> אֹרְרֶ֣יךָ אָר֔וּר וּֽמְבָרְכֶ֖יךָ בָּרֽוּךְ׃", "pasuk_en": "יַעַבְדוּךָ עַמִּים וְתִשְׁתַּחֲווּ לְךָ לְאֻמִּים וֶהְיֵה גְבִיר לְאַחֶיךָ וְיִשְׁתַּחֲווּ לְךָ בְנֵי אִמְּךָ אָרְרִים אֹרְרֶיךָ וּבָרוּךְ בָּרֶכֶיךָ.", "rashi_he": "בני אמך. וְיַעֲקֹב אָמַר לִיהוּדָה בְּנֵי אָבִיךָ, לְפִי שֶׁהָיוּ לוֹ בָנִים מִכַּמָּה אִמָּהוֹת, וְכָאן, שֶׁלֹּא נָשָׂא אֶלָּא אִשָּׁה אַחַת, אוֹמֵר בְּנֵי אִמֶּךָ (בראשית רבה):", "rashi_en": "יעקב אמר ליהודה ״בני אביך״, כי היו לו בנים מכמה אמהות; יצחק, שנשא אישה אחת בלבד, אמר ״בני אמך״.", "note": "", "points": [{"q": "מדוע אמר יצחק ״בני אמך״, ואילו יעקב אמר ליהודה ״בני אביך״?", "options": ["כי ליצחק הייתה אישה אחת בלבד", "כי רבקה היא שדאגה לברכת יעקב", "כי עשו היה קרוב יותר לאמו"], "kasha": "יעקב בירך את יהודה ״ישתחוו לך בני אביך״, ומדוע כאן נאמר ״בני אמך״?", "answer": "ליעקב היו בנים מכמה אמהות, ולכן אמר ״בני אביך״; יצחק לא נשא אלא אישה אחת, ולכן אמר ״בני אמך״."}]}, {"id": "27:29.2", "ch": 27, "v": 29, "n": 2, "dh": "ארריך ארור ומברכיך ברוך", "pasuk_html": "יַֽעַבְד֣וּךָ עַמִּ֗ים (וישתחו) [וְיִֽשְׁתַּחֲו֤וּ] לְךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְאַחֶ֔יךָ וְיִשְׁתַּחֲו֥וּ לְךָ֖ בְּנֵ֣י אִמֶּ֑ךָ <mark>אֹרְרֶ֣יךָ אָר֔וּר וּֽמְבָרְכֶ֖יךָ בָּרֽוּךְ׃</mark>", "pasuk_en": "יִשְׁמְדוּ עַמִּים לָךְ וּלְאֻמִּים יִשְׁתַּחֲווּ לָךְ הֱיֵה־גְבִר עַל־אַחֶיךָ וְיִשְׁתַּחֲווּ לְךָ בְנֵי־אִמֶּךָ אָרוּר אָרְרִיךָ וּמְבָרֵךְ בְּרוּךְ אָתָּה", "rashi_he": "ארריך ארור ומברכיך ברוך. וּבְבִלְעָם הוּא אוֹמֵר מְבָרְכֶיךָ בָרוּךְ וְאֹרְרֶיךָ אָרוּר? הַצַּדִּיקִים תְּחִלָּתָם יִסּוּרִים וְסוֹפָן שַׁלְוָה וְאוֹרְרֵיהֶם וּמְצָעֲרֵיהֶם קוֹדְמִים לִמְבָרְכֵיהֶם, לְפִיכָךְ יִצְחָק הִקְדִּים קִלְלַת אוֹרְרִים לְבִרְכַת מְבָרְכִים; הָרְשָׁעִים תְּחִלָּתָן שַׁלְוָה וְסוֹפָן יִסּוּרִין, לְפִיכָךְ בִּלְעָם הִקְדִּים בְּרָכָה לִקְלָלָה (בראשית רבה):", "rashi_en": "הצדיקים תחילתם ייסורים וסופם שלווה, ולכן יצחק הקדים את קללת האוררים; הרשעים תחילתם שלווה וסופם ייסורים, ולכן בלעם הקדים את הברכה לקללה.", "note": "", "points": [{"q": "מדוע הקדים יצחק ״ארריך ארור״ ל״מברכיך ברוך״, ובלעם עשה להפך?", "options": ["צדיקים תחילתם ייסורים וסופם שלווה, ורשעים להפך", "בעיני יצחק הקללה חשובה יותר מן הברכה", "בלעם רצה לקלל את ישראל ולכן הסתיר את הקללה"], "kasha": "בלעם אמר ״מברכיך ברוך וארריך ארור״, ומדוע אצל יצחק הסדר הפוך?", "answer": "הצדיקים תחילתם ייסורים וסופם שלווה, ואורריהם ומצעריהם קודמים למברכיהם, לכן הקדים יצחק קללה לברכה; הרשעים תחילתם שלווה וסופם ייסורים, לכן הקדים בלעם ברכה לקללה."}]}, {"id": "27:30.1", "ch": 27, "v": 30, "n": 1, "dh": "יצא יצא", "pasuk_html": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלָּ֣ה יִצְחָק֮ לְבָרֵ֣ךְ אֶֽת־יַעֲקֹב֒ וַיְהִ֗י אַ֣ךְ <mark>יָצֹ֤א יָצָא֙</mark> יַעֲקֹ֔ב מֵאֵ֥ת פְּנֵ֖י יִצְחָ֣ק אָבִ֑יו וְעֵשָׂ֣ו אָחִ֔יו בָּ֖א מִצֵּידֽוֹ׃", "pasuk_en": "וַיְהִי כַּאֲשֶׁר כִּלָּה יִצְחָק לְבָרֵךְ אֶת יַעֲקֹב וַיְהִי אַךְ יָצָא יָצָא יַעֲקֹב מֵאֶת פְּנֵי יִצְחָק אָבִיו וְעֵשָׂו אָחִיו בָּא מִצֵּידוֹ.", "rashi_he": "יצא יצא. זֶה יוֹצֵא וְזֶה בָא:", "rashi_en": "הכפילות מלמדת שבאותו רגע שיעקב יצא, נכנס עשו.", "note": "", "points": [{"q": "מה מלמדת הכפילות ״יצא יצא״?", "options": ["זה יצא וזה בא באותו רגע", "יעקב יצא בבהלה ובמהירות רבה", "יעקב יצא פעמיים מלפני אביו"], "kasha": "מדוע נכפלה המילה ״יצא״?", "answer": "זה יוצא וזה בא."}]}, {"id": "27:33.1", "ch": 27, "v": 33, "n": 1, "dh": "ויחרד", "pasuk_html": "<mark>וַיֶּחֱרַ֨ד</mark> יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד־מְאֹד֒ וַיֹּ֡אמֶר מִֽי־אֵפ֡וֹא ה֣וּא הַצָּֽד־צַ֩יִד֩ וַיָּ֨בֵא לִ֜י וָאֹכַ֥ל מִכֹּ֛ל בְּטֶ֥רֶם תָּב֖וֹא וָאֲבָרְכֵ֑הוּ גַּם־בָּר֖וּךְ יִהְיֶֽה׃", "pasuk_en": "וַיִּחְרַד יִצְחָק חֲרָדָה גְדוֹלָה עַד־מְאֹד וַיֹּאמֶר מִי־אִפוֹא צַד־צַיִד וַיָּבֵא לִי וָאֹכַל מִכֹּל בְּטֶרֶם תָּבוֹא וָאֲבָרְכֵהוּ גַּם בָּרוּךְ יִהְיֶה", "rashi_he": "ויחרד. כְּתַרְגּוּמוֹ וּתְוַהּ, לְשׁוֹן תְּמִיהָ. וּמִדְרָשׁוֹ רָאָה גֵּיהִנֹּם פְּתוּחָה מִתַּחְתָּיו:", "rashi_en": "לפי התרגום ״ותוה״, יצחק תמה ונדהם. ולפי המדרש ראה גיהנם פתוחה מתחתיו.", "note": "", "points": [{"q": "לפי התרגום, מה פירוש ״ויחרד יצחק״?", "options": ["תמה ונדהם, כתרגומו ״ותוה״", "רעד מפחד שמא עשו יהרוג אותו", "כעס מאוד על יעקב שרימה אותו"], "kasha": "מה פירוש החרדה כאן, פחד או דבר אחר?", "answer": "כתרגומו ״ותוה״, לשון תמיהה."}, {"q": "לפי המדרש, מה גרם ליצחק לחרוד?", "options": ["ראה גיהנם פתוחה מתחתיו", "ראה מלאך עומד לפניו", "שמע את עשו בוכה בקול"], "kasha": "מה גרם ליצחק חרדה ״גדלה עד מאד״?", "answer": "לפי המדרש ראה גיהנם פתוחה מתחתיו."}]}, {"id": "27:33.2", "ch": 27, "v": 33, "n": 2, "dh": "מי אפוא", "pasuk_html": "וַיֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד־מְאֹד֒ וַיֹּ֡אמֶר <mark>מִֽי־אֵפ֡וֹא</mark> ה֣וּא הַצָּֽד־צַ֩יִד֩ וַיָּ֨בֵא לִ֜י וָאֹכַ֥ל מִכֹּ֛ל בְּטֶ֥רֶם תָּב֖וֹא וָאֲבָרְכֵ֑הוּ גַּם־בָּר֖וּךְ יִהְיֶֽה׃", "pasuk_en": "וַיִּחְרַד יִצְחָק חֲרָדָה גְדוֹלָה מְאֹד וַיֹּאמֶר מִי אֵפוֹא הוּא הַצָּד צַיִד וַיָּבֵא לִי וָאֹכַל מִכֹּל בְּטֶרֶם תָּבוֹא וָאֲבָרְכֵהוּ גַּם בָּרוּךְ יִהְיֶה", "rashi_he": "מי אפוא. לָשׁוֹן לְעַצְמוֹ מְשַׁמֵּשׁ עִם כַּמָּה דְבָרִים; אֵיפֹה – אַיֵּה פֹה, מִי הוּא וְאֵיפֹה הוּא הַצָּד צַיִד?", "rashi_en": "״אפוא״ היא מילה בפני עצמה המשמשת בכמה עניינים. ויש לפרשה ״איה פה״: מי הוא ואיפה הוא זה שצד ציד?", "note": "", "points": [{"q": "לפי הפירוש ״איה פה״, מה פירוש ״מי אפוא הוא הצד ציד״?", "options": ["מי הוא ואיפה הוא זה שצד ציד?", "מי עכשיו יוכל לצוד לי ציד אחר?", "האם באמת אתה הוא שצדת ציד?"], "kasha": "מה משמעות המילה ״אפוא״ בפסוק?", "answer": "״אפוא״ היא מילה בפני עצמה המשמשת בכמה עניינים, ויש לפרשה ״איה פה״: מי הוא ואיפה הוא הצד ציד?"}]}, {"id": "27:33.3", "ch": 27, "v": 33, "n": 3, "dh": "ואכל מכל", "pasuk_html": "וַיֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד־מְאֹד֒ וַיֹּ֡אמֶר מִֽי־אֵפ֡וֹא ה֣וּא הַצָּֽד־צַ֩יִד֩ וַיָּ֨בֵא לִ֜י <mark>וָאֹכַ֥ל מִכֹּ֛ל</mark> בְּטֶ֥רֶם תָּב֖וֹא וָאֲבָרְכֵ֑הוּ גַּם־בָּר֖וּךְ יִהְיֶֽה׃", "pasuk_en": "וַיִּחְרַד יִצְחָק חֲרָדָה גְדוֹלָה מְאֹד וַיֹּאמֶר מִי אֵפוֹא הוּא הַצָּד צַיִד וַיָּבֵא לִי וָאֹכַל מִכֹּל בְּטֶרֶם תָּבוֹא וָאֲבָרְכֵהוּ גַּם בָּרוּךְ יִהְיֶה", "rashi_he": "ואכל מכל. מִכָּל טְעָמִים שֶׁבִּקַּשְׁתִּי לִטְעֹם, טָעַמְתִּי בוֹ (בראשית רבה):", "rashi_en": "כל הטעמים שביקשתי לטעום, טעמתי במטעמים שהביא לי.", "note": "", "points": [{"q": "מה פירוש ״ואכל מכל״ לפי רש״י?", "options": ["טעמתי בו כל טעם שביקשתי לטעום", "אכלתי מכל המנות שהביא לי", "אכלתי הכול ולא השארתי לך דבר"], "kasha": "וכי הביא לו יעקב כל מיני מאכלים, שנאמר ״מכל״?", "answer": "מכל הטעמים שביקשתי לטעום, טעמתי בו."}]}, {"id": "27:33.4", "ch": 27, "v": 33, "n": 4, "dh": "גם ברוך יהיה", "pasuk_html": "וַיֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד־מְאֹד֒ וַיֹּ֡אמֶר מִֽי־אֵפ֡וֹא ה֣וּא הַצָּֽד־צַ֩יִד֩ וַיָּ֨בֵא לִ֜י וָאֹכַ֥ל מִכֹּ֛ל בְּטֶ֥רֶם תָּב֖וֹא וָאֲבָרְכֵ֑הוּ <mark>גַּם־בָּר֖וּךְ יִהְיֶֽה׃</mark>", "pasuk_en": "וַיִּחְרַד יִצְחָק חֲרָדָה גְדוֹלָה מְאֹד וַיֹּאמֶר מִי אֵפוֹא הוּא הַצָּד צַיִד וַיָּבֵא לִי וָאֹכַל מִכֹּל בְּטֶרֶם תָּבוֹא וָאֲבָרְכֵהוּ גַּם בָּרוּךְ יִהְיֶה", "rashi_he": "גם ברוך יהיה. שֶׁלֹּא תֹאמַר אִלּוּלֵי שֶׁרִמָּה יַעֲקֹב לְאָבִיו לֹא נָטַל אֶת הַבְּרָכוֹת, לְכָךְ הִסְכִּים וּבֵרְכוֹ מִדַּעְתּוֹ (בראשית רבה):", "rashi_en": "כדי שלא יאמרו שיעקב קיבל את הברכות רק משום שרימה את אביו, הסכים יצחק ובירך אותו מדעתו.", "note": "", "points": [{"q": "מדוע אמר יצחק ״גם ברוך יהיה״?", "options": ["כדי שלא יאמרו שיעקב זכה בברכות רק ברמאות", "כי לא היה ביכולתו לבטל ברכה שכבר נתן", "כדי לפייס את רבקה שרצתה בברכת יעקב"], "kasha": "הברכה כבר ניתנה, ולמה הוסיף יצחק ״גם ברוך יהיה״?", "answer": "שלא תאמר: אלמלא רימה יעקב את אביו לא היה נוטל את הברכות; לכן הסכים יצחק ובירכו מדעתו."}]}, {"id": "27:35.1", "ch": 27, "v": 35, "n": 1, "dh": "במרמה", "pasuk_html": "וַיֹּ֕אמֶר בָּ֥א אָחִ֖יךָ <mark>בְּמִרְמָ֑ה</mark> וַיִּקַּ֖ח בִּרְכָתֶֽךָ׃", "pasuk_en": "וַיֹּאמֶר כִּי בִמְרוּמוֹ יַעֲקֹב אָחִיךָ וַיִּקַּחְ בִּרְכָתְךָ", "rashi_he": "במרמה. בְּחָכְמָה:", "rashi_en": "״במרמה״ כאן פירושו בחכמה.", "note": "", "points": [{"q": "מה פירוש ״במרמה״ לפי רש״י?", "options": ["בחכמה", "בשקר", "בחוצפה"], "kasha": "וכי יצחק מעיד על יעקב שנהג ברמאות?", "answer": "״במרמה״ פירושו בחכמה."}]}, {"id": "27:36.1", "ch": 27, "v": 36, "n": 1, "dh": "הכי קרא שמו", "pasuk_html": "וַיֹּ֡אמֶר <mark>הֲכִי֩ קָרָ֨א שְׁמ֜וֹ</mark> יַעֲקֹ֗ב וַֽיַּעְקְבֵ֙נִי֙ זֶ֣ה פַעֲמַ֔יִם אֶת־בְּכֹרָתִ֣י לָקָ֔ח וְהִנֵּ֥ה עַתָּ֖ה לָקַ֣ח בִּרְכָתִ֑י וַיֹּאמַ֕ר הֲלֹא־אָצַ֥לְתָּ לִּ֖י בְּרָכָֽה׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו הַכִּי קָרָא שְׁמוֹ יַעֲקֹב וַיַּעְקְבֵנִי זֶה פַּעֲמַיִם אֶת־בְּכֹרָתִי לָקַח וְהִנֵּה עַתָּה לָקַח אֶת־בִּרְכָתִי וַיֹּאמֶר הֲלֹא אָצַלְתָּ לִּי בְּרָכָה", "rashi_he": "הכי קרא שמו. לְשׁוֹן תֵּמַהּ הוּא, כְּמוֹ הֲכִי אָחִי אַתָּה, שֶׁמָּא לְכָךְ נִקְרָא שְׁמוֹ יַעֲקֹב עַל שֵׁם סוֹפוֹ שֶׁהוּא עָתִיד לְעָקְבֵנִי? תַּנְחוּמָא. לָמָּה חָרַד יִצְחָק? אָמַר שֶׁמָּא עָוֹן יֵשׁ בִּי שֶׁבֵּרַכְתִּי קָטָן לִפְנֵי גָּדוֹל וְשִׁנִּיתִי סֵדֶר הַיַּחַס, הִתְחִיל עֵשָׂו מְצָעֵק וַיַּעְקְבֵנִי זֶה פַעֲמַיִם, אָמַר לוֹ אָבִיו מֶה עָשָׂה לְךָ? אָמַר לוֹ אֶת בְּכֹרָתִי לָקָח, אָמַר בְּכָךְ הָיִיתִי מֵצֵר וְחָרֵד שֶׁמָּא עָבַרְתִּי עַל שׁוּרַת הַדִּין, עַכְשָׁו לַבְּכוֹר בֵּרַכְתִּי, גַּם בָּרוּךְ יִהְיֶה:", "rashi_en": "עשו שואל בתמיהה: שמא לכן נקרא יעקב, על שם שעתיד לעקבני? יצחק חרד שמא חטא כשבירך את הצעיר לפני הבכור, וכששמע שיעקב קנה את הבכורה אמר: לבכור בירכתי, ״גם ברוך יהיה״.", "note": "", "points": [{"q": "מה פירוש ״הכי קרא שמו יעקב״?", "options": ["תמיהה: שמא לכן נקרא יעקב, על שם סופו", "קביעה: לכן נקרא יעקב, כי אחז בעקב אחיו", "תלונה: למה קראו לו הוריו בשם יעקב"], "kasha": "האם עשו קובע עובדה במילה ״הכי״, או שואל?", "answer": "זו לשון תמיהה, כמו ״הכי אחי אתה״: שמא לכך נקרא שמו יעקב על שם סופו, שהוא עתיד לעקבני."}, {"q": "לפי רש״י, ממה חרד יצחק, ומה הרגיע אותו?", "options": ["שמא בירך קטן לפני גדול; נרגע כששמע על הבכורה", "שמא עשו יהרוג את יעקב; נרגע כשיעקב ברח", "שמא הברכה לא תחול; נרגע כשראה את עשו"], "kasha": "מדוע חרד יצחק חרדה גדולה, ובכל זאת אמר ״גם ברוך יהיה״?", "answer": "חשש שמא יש בו עוון, שבירך קטן לפני גדול ושינה את סדר היחס; כשאמר עשו ״את בכרתי לקח״, אמר: עכשיו לבכור בירכתי, ״גם ברוך יהיה״."}]}, {"id": "27:36.2", "ch": 27, "v": 36, "n": 2, "dh": "ויעקבני", "pasuk_html": "וַיֹּ֡אמֶר הֲכִי֩ קָרָ֨א שְׁמ֜וֹ יַעֲקֹ֗ב <mark>וַֽיַּעְקְבֵ֙נִי֙</mark> זֶ֣ה פַעֲמַ֔יִם אֶת־בְּכֹרָתִ֣י לָקָ֔ח וְהִנֵּ֥ה עַתָּ֖ה לָקַ֣ח בִּרְכָתִ֑י וַיֹּאמַ֕ר הֲלֹא־אָצַ֥לְתָּ לִּ֖י בְּרָכָֽה׃", "pasuk_en": "אמר עשו: 'הכי קרא שמו יעקוב שיעקבני גַּם פַּעַם הַזֹּאת? את בכורתי לקח, והנה עתה לקח את ברכתי.' ויאמר: 'הלוא אצלת לי ברכה?'", "rashi_he": "ויעקבני. כְּתַרְגּוּמוֹ וּכְמַנִי – אֲרָבַנִי; וְאָרַב – וּכְמַן. וְיֵשׁ מְתַרְגְּמִין וְחַכְּמַנִי, נִתְחַכֵּם לִי:", "rashi_en": "כתרגומו ״וכמני״, כלומר ארב לי, כמו ש״וארב״ מתורגם ״וכמן״. ויש מתרגמים ״וחכמני״, כלומר התחכם לי.", "note": "", "points": [{"q": "מה פירוש ״ויעקבני״ לפי התרגום שמביא רש״י?", "options": ["ארב לי, כתרגומו ״וכמני״", "הלך אחריי בעקבותיי", "אחז בעקבי בשעת הלידה"], "kasha": "מה פירוש ״ויעקבני״, ומה עשה יעקב לעשו?", "answer": "כתרגומו ״וכמני״, ארב לי, כמו ״וארב״ שמתורגם ״וכמן״; ויש מתרגמים ״וחכמני״, התחכם לי."}]}, {"id": "27:36.3", "ch": 27, "v": 36, "n": 3, "dh": "אצלת", "pasuk_html": "וַיֹּ֡אמֶר הֲכִי֩ קָרָ֨א שְׁמ֜וֹ יַעֲקֹ֗ב וַֽיַּעְקְבֵ֙נִי֙ זֶ֣ה פַעֲמַ֔יִם אֶת־בְּכֹרָתִ֣י לָקָ֔ח וְהִנֵּ֥ה עַתָּ֖ה לָקַ֣ח בִּרְכָתִ֑י וַיֹּאמַ֕ר הֲלֹא־<mark>אָצַ֥לְתָּ</mark> לִּ֖י בְּרָכָֽה׃", "pasuk_en": "אמר עשו: 'הכי קרא שמו יעקוב שיעקבני גַּם פַּעַם הַזֹּאת? את בכורתי לקח, והנה עתה לקח את ברכתי.' ויאמר: 'הלוא אצלת לי ברכה?'", "rashi_he": "אצלת. לְשׁוֹן הַפְרָשָׁה כְּמוֹ וַיָּאצֶל:", "rashi_en": "״אצלת״ הוא לשון הפרשה והבדלה, כמו ״ויאצל״: האם לא הפרשת לי ברכה?", "note": "", "points": [{"q": "מה פירוש ״הלא אצלת לי ברכה״?", "options": ["האם לא הפרשת לי ברכה?", "האם לא הבטחת לי ברכה?", "האם לא בירכת אותי בעבר?"], "kasha": "מה פירוש המילה הנדירה ״אצלת״?", "answer": "לשון הפרשה, כמו ״ויאצל״."}]}, {"id": "27:37.1", "ch": 27, "v": 37, "n": 1, "dh": "הן גביר", "pasuk_html": "וַיַּ֨עַן יִצְחָ֜ק וַיֹּ֣אמֶר לְעֵשָׂ֗ו <mark>הֵ֣ן גְּבִ֞יר</mark> שַׂמְתִּ֥יו לָךְ֙ וְאֶת־כׇּל־אֶחָ֗יו נָתַ֤תִּי לוֹ֙ לַעֲבָדִ֔ים וְדָגָ֥ן וְתִירֹ֖שׁ סְמַכְתִּ֑יו וּלְכָ֣ה אֵפ֔וֹא מָ֥ה אֶֽעֱשֶׂ֖ה בְּנִֽי׃", "pasuk_en": "ויַעַן יִצְחָק וַיֹּאמֶר אֶל עֵשָׂו: הֵן גְּבִיר שַׂמְתִּיו לָךְ, וְאֶת כָּל אֶחָיו נָתַתִּי לוֹ לַעֲבָדִים, וְדָגָן וְתִירוֹשׁ סְמַכְתִּיו, וּמַה אָכוּל אֲעֶשׂה לְךָ בְנִי?", "rashi_he": "הן גביר. בְּרָכָה זוֹ שְׁבִיעִית הִיא, וְהוּא עוֹשֶׂה אוֹתָהּ רִאשׁוֹנָה? אֶלָּא אָמַר לוֹ מַה תּוֹעֶלֶת לְךָ בַּבְּרָכָה? אִם תִּקְנֶה נְכָסִים, שֶׁלּוֹ הֵם, שֶׁהֲרֵי גְּבִיר שַׂמְתִּיו לָךְ, וּמַה שֶּׁקָּנָה עֶבֶד קָנָה רַבּוֹ:", "rashi_en": "״הוה גביר לאחיך״ היא הברכה השביעית, ובכל זאת הזכיר אותה יצחק ראשונה, כי אמר לעשו: מה תועיל לך ברכה? כל מה שתקנה יהיה של יעקב, שהרי מה שקנה עבד קנה רבו.", "note": "", "points": [{"q": "מדוע פתח יצחק דווקא ב״הן גביר״, אף שהיא הברכה השביעית?", "options": ["כי כל מה שיקנה עשו יהיה של יעקב אדונו", "כי זו הברכה החשובה ביותר בעיני יצחק", "כי עשו שאל במפורש על השלטון במשפחה"], "kasha": "ברכה זו היא השביעית בברכות יעקב, ומדוע מזכיר אותה יצחק ראשונה?", "answer": "יצחק אמר לעשו: מה תועלת לך בברכה? אם תקנה נכסים, שלו הם, שהרי גביר שמתיו לך, ומה שקנה עבד קנה רבו."}]}, {"id": "27:37.2", "ch": 27, "v": 37, "n": 2, "dh": "ולכה אפא מה אעשה", "pasuk_html": "וַיַּ֨עַן יִצְחָ֜ק וַיֹּ֣אמֶר לְעֵשָׂ֗ו הֵ֣ן גְּבִ֞יר שַׂמְתִּ֥יו לָךְ֙ וְאֶת־כׇּל־אֶחָ֗יו נָתַ֤תִּי לוֹ֙ לַעֲבָדִ֔ים וְדָגָ֥ן וְתִירֹ֖שׁ סְמַכְתִּ֑יו <mark>וּלְכָ֣ה אֵפ֔וֹא מָ֥ה אֶֽעֱשֶׂ֖ה</mark> בְּנִֽי׃", "pasuk_en": "ויַעַן יִצְחָק וַיֹּאמֶר אֶל עֵשָׂו: הֵן גְּבִיר שַׂמְתִּיו לָךְ, וְאֶת כָּל אֶחָיו נָתַתִּי לוֹ לַעֲבָדִים, וְדָגָן וְתִירוֹשׁ סְמַכְתִּיו, וּמַה אָכוּל אֲעֶשׂה לְךָ בְנִי?", "rashi_he": "ולכה אפא מה אעשה. אַיֵּה אֵיפֹא אֲבַקֵּשׁ מַה לַּעֲשׂוֹת לְךָ:", "rashi_en": "יצחק אומר לעשו: איפה אפוא אחפש דבר שאוכל לעשות לך?", "note": "", "points": [{"q": "מה פירוש ״ולכה אפוא מה אעשה בני״?", "options": ["איפה אמצא דבר שאוכל לעשות לך?", "לך מכאן, כי אין לי מה לעשות", "מה עשית לי, בני, שבאת באיחור?"], "kasha": "מה משמעות ״אפוא״ בדברי יצחק לעשו?", "answer": "איה איפוא אבקש מה לעשות לך."}]}, {"id": "27:38.1", "ch": 27, "v": 38, "n": 1, "dh": "הברכה אחת", "pasuk_html": "וַיֹּ֨אמֶר עֵשָׂ֜ו אֶל־אָבִ֗יו <mark>הַֽבְרָכָ֨ה אַחַ֤ת</mark> הִֽוא־לְךָ֙ אָבִ֔י בָּרְכֵ֥נִי גַם־אָ֖נִי אָבִ֑י וַיִּשָּׂ֥א עֵשָׂ֛ו קֹל֖וֹ וַיֵּֽבְךְּ׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו אֶל־אָבִיו: 'הַאִם בְּרָכָה אַחַת בִּי אָבִי? בָּרֲכֵנִי גַּם־אָנִי אָבִי!' וַיִּשְׂא עֵשָׂו אֶת־קוֹלוֹ וַיֵּבְךְ.", "rashi_he": "הברכה אחת. הֵ\"א זוֹ מְשַׁמֶּשֶׁת לְשׁוֹן תְּמִיהָ, כְּמוֹ הַבְּמַחֲנִים? הַשְּׁמֵנָה הִיא? הַכְּמוֹת נָבָל?", "rashi_en": "הה״א שבתחילת המילה \"הברכה\" היא ה״א השאלה. עשו שואל בתמיהה: וכי יש לך רק ברכה אחת? כמו \"הבמחנים\", \"השמנה היא\", \"הכמות נבל\".", "note": "", "points": [{"q": "מה תפקידה של הה״א במילה \"הברכה\" לפי רש״י?", "options": ["ה״א השאלה – עשו תמה אם יש רק ברכה אחת", "ה״א הידיעה – הברכה המיוחדת שקיבל יעקב", "ה״א המגמה – הברכה שצריכה לעבור אליו"], "kasha": "המילים \"הברכה אחת הוא לך\" נשמעות כקביעה, ולא ברור מה עשו אומר בהן.", "answer": "הה״א משמשת לשון תמיהה, כמו \"הבמחנים\", \"השמנה היא\", \"הכמות נבל\" – כלומר: וכי ברכה אחת בלבד יש לך?"}]}, {"id": "27:39.1", "ch": 27, "v": 39, "n": 1, "dh": "משמני ארץ וגו", "pasuk_html": "וַיַּ֛עַן יִצְחָ֥ק אָבִ֖יו וַיֹּ֣אמֶר אֵלָ֑יו הִנֵּ֞ה <mark>מִשְׁמַנֵּ֤י הָאָ֙רֶץ֙</mark> יִהְיֶ֣ה מֽוֹשָׁבֶ֔ךָ וּמִטַּ֥ל הַשָּׁמַ֖יִם מֵעָֽל׃", "pasuk_en": "וַיַּעַן יִצְחָק אָבִיו וַיֹּאמֶר אֵלָיו: הִנֵּה מִשְׁמַנֵּי הָאָרֶץ יִהְיֶה מוֹשָׁבְךָ וּמִטַּל הַשָּׁמַיִם מֵעָל.", "rashi_he": "משמני ארץ וגו'. זוֹ אִיטָלִיאָה שֶׁל יָוָן:", "rashi_en": "הברכה \"משמני הארץ יהיה מושבך\" שקיבל עשו מכוונת לאיטליה של יוון, ארץ שמנה ופורייה.", "note": "", "points": [{"q": "לאיזה מקום מכוונת הברכה \"משמני הארץ יהיה מושבך\"?", "options": ["לאיטליה של יוון", "להר שעיר וארץ אדום", "לארץ כנען וגבולותיה"], "kasha": "הפסוק אינו מפרש איזו ארץ שמנה הובטחה לעשו.", "answer": "זו איטליאה של יון – שם יהיה מושבו של עשו."}]}, {"id": "27:40.1", "ch": 27, "v": 40, "n": 1, "dh": "ועל חרבך", "pasuk_html": "<mark>וְעַל־חַרְבְּךָ֣</mark> תִֽחְיֶ֔ה וְאֶת־אָחִ֖יךָ תַּעֲבֹ֑ד וְהָיָה֙ כַּאֲשֶׁ֣ר תָּרִ֔יד וּפָרַקְתָּ֥ עֻלּ֖וֹ מֵעַ֥ל צַוָּארֶֽךָ׃", "pasuk_en": "וְעַל חַרְבְּךָ תִּחְיֶה וְאֶת־אָחִיךָ תַּעֲבֹד וְהָיָה כַּאֲשֶׁר תָּרִיד וּפָרַקְתָּ עֻלּוֹ מֵעַל צַוָּארְךָ.", "rashi_he": "ועל חרבך. כְּמוֹ בְּחַרְבְּךָ, יֵשׁ עַל בִּמְקוֹם בְּ', כְּמוֹ עֲמַדְתֶּם עַל חַרְבְּכֶם – בְּחַרְבְּכֶם; עַל צִבְאֹתָם – בְּצִבְאֹתָם:", "rashi_en": "\"על חרבך\" פירושו \"בחרבך\" – באמצעות החרב תחיה. לפעמים בא \"על\" במקום האות ב׳, כמו \"עמדתם על חרבכם\" ו\"על צבאתם\".", "note": "", "points": [{"q": "מה פירוש \"ועל חרבך תחיה\" לפי רש״י?", "options": ["בחרבך – באמצעות החרב תתקיים ותחיה", "בשביל חרבך – כדי לשמור על כלי נשקך", "מעל חרבך – תחיה בלי להזדקק לחרב"], "kasha": "\"על חרבך\" נשמע כאילו יחיה על גבי החרב, ואין לכך משמעות ברורה.", "answer": "\"על\" בא כאן במקום ב׳, כלומר \"בחרבך\", כמו \"עמדתם על חרבכם\" – בחרבכם, ו\"על צבאתם\" – בצבאתם."}]}, {"id": "27:40.2", "ch": 27, "v": 40, "n": 2, "dh": "תריד", "pasuk_html": "וְעַל־חַרְבְּךָ֣ תִֽחְיֶ֔ה וְאֶת־אָחִ֖יךָ תַּעֲבֹ֑ד וְהָיָה֙ כַּאֲשֶׁ֣ר <mark>תָּרִ֔יד</mark> וּפָרַקְתָּ֥ עֻלּ֖וֹ מֵעַ֥ל צַוָּארֶֽךָ׃", "pasuk_en": "וְעַל חַרְבְּךָ תִּחְיֶה וְאֶת־אָחִיךָ תַּעֲבֹד וְהָיָה כַּאֲשֶׁר תָּרִיד וּפָרַקְתָּ עֻלּוֹ מֵעַל צַוָּארְךָ.", "rashi_he": "תריד. לְשׁוֹן צַעַר כְּמוֹ אָרִיד בְּשִׂיחִי, כְּלוֹמַר, כְּשֶׁיַּעַבְרוּ יִשְׂרָאֵל עַל הַתּוֹרָה וְיִהְיֶה לְךָ פִּתְחוֹן פֶּה לְהִצְטַעֵר עַל הַבְּרָכוֹת שֶׁנָּטַל, ופרקת עלו וגומר:", "rashi_en": "\"תריד\" הוא לשון צער, כמו \"אריד בשיחי\". כלומר: כשישראל יעברו על התורה, ויהיה לעשו פתחון פה להצטער על הברכות שנטל יעקב – אז יפרוק את עולו מעל צווארו.", "note": "", "points": [{"q": "מה פירוש המילה \"תריד\" לפי רש״י?", "options": ["לשון צער, כמו \"אריד בשיחי\"", "לשון ירידה, כשיעקב ירד ממעלתו", "לשון שלטון, כמו \"וירד מים עד ים\""], "kasha": "המילה \"תריד\" אינה מצויה, ולא ברור מה משמעה.", "answer": "תריד הוא לשון צער, כמו \"אריד בשיחי\"."}, {"q": "מתי יוכל עשו לפרוק את עולו של יעקב?", "options": ["כשישראל יעברו על התורה", "כשיתגבר עשו בכוח חרבו", "כשיקבל עשו ברכה נוספת מיצחק"], "kasha": "הפסוק אינו מפרש באיזה מצב יוכל עשו לפרוק את העול.", "answer": "כשיעברו ישראל על התורה ויהיה לעשו פתחון פה להצטער על הברכות שנטל יעקב – אז \"ופרקת עלו\"."}]}, {"id": "27:41.1", "ch": 27, "v": 41, "n": 1, "dh": "יקרבו ימי אבל אבי", "pasuk_html": "וַיִּשְׂטֹ֤ם עֵשָׂו֙ אֶֽת־יַעֲקֹ֔ב עַ֨ל־הַבְּרָכָ֔ה אֲשֶׁ֥ר בֵּרְכ֖וֹ אָבִ֑יו וַיֹּ֨אמֶר עֵשָׂ֜ו בְּלִבּ֗וֹ <mark>יִקְרְבוּ֙ יְמֵי֙ אֵ֣בֶל אָבִ֔י</mark> וְאַֽהַרְגָ֖ה אֶת־יַעֲקֹ֥ב אָחִֽי׃", "pasuk_en": "וַיִּשְׂנָא עֵשָׂו אֶת־יַעֲקֹב עַל־הַבְּרָכָה אֲשֶׁר בֵּרַךְ אוֹתוֹ אָבִיו וַיֹּאמֶר עֵשָׂו בְּלִבּוֹ יִקְרְבוּ יְמֵי אֵבֶל אָבִי וְאַהַרְגָה אֶת־יַעֲקֹב אָחִי.", "rashi_he": "יקרבו ימי אבל אבי. כְּמִשְׁמָעוֹ, שֶׁלֹּא אֲצָעֵר אֶת אַבָּא, וּמִדְרְשֵׁי אַגָּדָה לְכַמָּה פָנִים יֵשׁ:", "rashi_en": "לפי פשוטו, עשו מתכוון לחכות עד שימות יצחק ויגיעו ימי האבל עליו, ורק אז להרוג את יעקב, כדי שלא לצער את אביו. ויש על כך גם מדרשי אגדה רבים.", "note": "", "points": [{"q": "מדוע רצה עשו לחכות לימי האבל על אביו לפני שיהרוג את יעקב?", "options": ["כדי שלא לצער את אביו", "כדי לרשת לבדו את נכסי אביו", "כדי שיעקב לא יחשוד בו מראש"], "kasha": "לא ברור מדוע עשו קושר את תוכניתו להרוג את יעקב לימי האבל על אביו.", "answer": "כמשמעו – יחכה עד שימות אביו, שלא יצער את אביו; ומדרשי אגדה לכמה פנים יש בדבר."}]}, {"id": "27:42.1", "ch": 27, "v": 42, "n": 1, "dh": "ויגד לרבקה", "pasuk_html": "<mark>וַיֻּגַּ֣ד לְרִבְקָ֔ה</mark> אֶת־דִּבְרֵ֥י עֵשָׂ֖ו בְּנָ֣הּ הַגָּדֹ֑ל וַתִּשְׁלַ֞ח וַתִּקְרָ֤א לְיַעֲקֹב֙ בְּנָ֣הּ הַקָּטָ֔ן וַתֹּ֣אמֶר אֵלָ֔יו הִנֵּה֙ עֵשָׂ֣ו אָחִ֔יךָ מִתְנַחֵ֥ם לְךָ֖ לְהׇרְגֶֽךָ׃", "pasuk_en": "וַיֻּגַּד לְרִבְקָה אֶת־דִּבְרֵי אֵשָׂו בְנָהּ הַגָּדוֹל, וַתִּשְׁלַח וַתִּקְרָא לְיַעֲקֹב בְנָהּ הַקָּטוֹן, וַתֹּאמֶר אֵלָיו: הִנֵּה אָחִיךָ אֵשָׂו מִתְנַחֵם לְךָ, לְהָרְגְךָ.", "rashi_he": "ויגד לרבקה. בְּרוּחַ הַקֹּדֶשׁ הֻגַּד לָהּ מַה שֶּׁעֵשָׂו מְהַרְהֵר בְּלִבּוֹ:", "rashi_en": "עשו חשב את מחשבתו רק בלבו, ולכן הוגד לרבקה ברוח הקודש מה שהוא מהרהר.", "note": "", "points": [{"q": "כיצד נודע לרבקה מה שתכנן עשו?", "options": ["ברוח הקודש הוגד לה", "עשו סיפר זאת לאנשי ביתו", "יצחק שמע ממנו וסיפר לה"], "kasha": "עשו אמר את דבריו \"בלבו\", ואם כן כיצד הוגדו לרבקה?", "answer": "ברוח הקודש הוגד לה מה שעשו מהרהר בלבו."}]}, {"id": "27:42.2", "ch": 27, "v": 42, "n": 2, "dh": "מתנחם לך", "pasuk_html": "וַיֻּגַּ֣ד לְרִבְקָ֔ה אֶת־דִּבְרֵ֥י עֵשָׂ֖ו בְּנָ֣הּ הַגָּדֹ֑ל וַתִּשְׁלַ֞ח וַתִּקְרָ֤א לְיַעֲקֹב֙ בְּנָ֣הּ הַקָּטָ֔ן וַתֹּ֣אמֶר אֵלָ֔יו הִנֵּה֙ עֵשָׂ֣ו אָחִ֔יךָ <mark>מִתְנַחֵ֥ם לְךָ֖</mark> לְהׇרְגֶֽךָ׃", "pasuk_en": "וַיֻּגַּד לְרִבְקָה אֶת־דִּבְרֵי אֵשָׂו בְנָהּ הַגָּדוֹל, וַתִּשְׁלַח וַתִּקְרָא לְיַעֲקֹב בְנָהּ הַקָּטוֹן, וַתֹּאמֶר אֵלָיו: הִנֵּה אָחִיךָ אֵשָׂו מִתְנַחֵם לְךָ, לְהָרְגְךָ.", "rashi_he": "מתנחם לך. נִחָם עַל הָאַחְוָה לַחֲשֹׁב מַחֲשָׁבָה אַחֶרֶת לְהִתְנַכֵּר לְךָ וּלְהָרְגְּךָ. וּמִדְרַשׁ אַגָּדָה כְּבָר אַתָּה מֵת בְּעֵינָיו וְשָׁתָה עָלֶיךָ כּוֹס שֶׁל תַּנְחוּמִים. וּלְפִי פְּשׁוּטוֹ לְשׁוֹן תַּנְחוּמִים, מִתְנַחֵם הוּא עַל הַבְּרָכוֹת בַּהֲרִיגָתְךָ:", "rashi_en": "רש״י מביא שלושה פירושים: עשו מתחרט על האחווה וחושב להתנכר ליעקב ולהרגו; לפי המדרש – בעיניו יעקב כבר מת, והוא שתה עליו כוס של תנחומים; ולפי הפשט – עשו מתנחם על הברכות בכך שיהרוג את יעקב.", "note": "", "points": [{"q": "לפי הפירוש הראשון, מה פירוש \"מתנחם\" אצל עשו?", "options": ["מתחרט על האחווה וחושב להתנכר ליעקב ולהרגו", "מתחרט על שמכר את הבכורה ליעקב בנזיד", "מתחרט על כעסו ורוצה להשלים עם יעקב"], "kasha": "\"מתנחם\" נראה לשון נחמה, ואינו מתאים למי שמתכנן לרצוח.", "answer": "\"נחם\" כאן לשון חרטה: עשו התחרט על האחווה וחושב מחשבה אחרת – להתנכר לו ולהרגו."}, {"q": "לפי פשוטו, במה מתנחם עשו על הברכות שהפסיד?", "options": ["בכך שיהרוג את יעקב", "בברכת הטל שקיבל מאביו", "בנישואיו לבת ישמעאל"], "kasha": "אם \"מתנחם\" הוא לשון תנחומים, יש לברר במה מתנחם עשו ועל מה.", "answer": "לפי פשוטו זה לשון תנחומים: עשו מתנחם על הברכות בהריגתו של יעקב. ולפי המדרש, יעקב כבר מת בעיניו והוא שתה עליו כוס של תנחומים."}]}, {"id": "27:44.1", "ch": 27, "v": 44, "n": 1, "dh": "אחדים", "pasuk_html": "וְיָשַׁבְתָּ֥ עִמּ֖וֹ יָמִ֣ים <mark>אֲחָדִ֑ים</mark> עַ֥ד אֲשֶׁר־תָּשׁ֖וּב חֲמַ֥ת אָחִֽיךָ׃", "pasuk_en": "שְׁבִי עִם־לָבָן אַחֲדִים, עַד אֲשֶׁר תָּשׁוּב חֲמַת אָחִיךָ.", "rashi_he": "אחדים. מֻעָטִים:", "rashi_en": "\"ימים אחדים\" – ימים מעטים. רבקה אמרה ליעקב לשהות אצל לבן זמן קצר.", "note": "", "points": [{"q": "מה פירוש \"ימים אחדים\" לפי רש״י?", "options": ["ימים מעטים", "ימים רצופים", "יום אחד בלבד"], "kasha": "\"אחדים\" נשמע מלשון \"אחד\", ולא ברור כמה זמן הכוונה.", "answer": "אחדים פירושו מעטים."}]}, {"id": "27:45.1", "ch": 27, "v": 45, "n": 1, "dh": "למה אשכל", "pasuk_html": "עַד־שׁ֨וּב אַף־אָחִ֜יךָ מִמְּךָ֗ וְשָׁכַח֙ אֵ֣ת אֲשֶׁר־עָשִׂ֣יתָ לּ֔וֹ וְשָׁלַחְתִּ֖י וּלְקַחְתִּ֣יךָ מִשָּׁ֑ם <mark>לָמָ֥ה אֶשְׁכַּ֛ל</mark> גַּם־שְׁנֵיכֶ֖ם י֥וֹם אֶחָֽד׃", "pasuk_en": "עַד אֲשֶׁר תָּשׁוּב חֲמַת־אָחִיךָ מִמְּךָ, וְשָׁכַח אֵת אֲשֶׁר־עָשִׂיתָ לוֹ; וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם. לָמָּה אֶשְׁכַּל גַּם־שְׁנֵיכֶם בְּיוֹם אֶחָד?", "rashi_he": "למה אשכל. אֶהְיֶה שַׁכּוּלָה מִשְּׁנֵיכֶם. הַקּוֹבֵר אֶת בָּנָיו קָרוּי שַׁכּוּל, וְכֵן בְּיַעֲקֹב אָמַר כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי:", "rashi_en": "רבקה אומרת: למה אהיה שכולה משני בניי? מי שקובר את בניו נקרא שכול, וכן אמר יעקב \"כאשר שכלתי שכלתי\".", "note": "", "points": [{"q": "מה פירוש \"למה אשכל\" לפי רש״י?", "options": ["למה אהיה שכולה משניכם, כמי שקוברת את בניה", "למה אאבד את שכלי מרוב צער ודאגה", "למה אשאר בודדה בלי בעלי ובלי בניי"], "kasha": "יש לברר מה משמעות לשון \"שכול\" בדברי רבקה.", "answer": "אהיה שכולה משניכם; הקובר את בניו קרוי שכול, וכן ביעקב נאמר \"כאשר שכלתי שכלתי\"."}]}, {"id": "27:45.2", "ch": 27, "v": 45, "n": 2, "dh": "גם שניכם", "pasuk_html": "עַד־שׁ֨וּב אַף־אָחִ֜יךָ מִמְּךָ֗ וְשָׁכַח֙ אֵ֣ת אֲשֶׁר־עָשִׂ֣יתָ לּ֔וֹ וְשָׁלַחְתִּ֖י וּלְקַחְתִּ֣יךָ מִשָּׁ֑ם לָמָ֥ה אֶשְׁכַּ֛ל <mark>גַּם־שְׁנֵיכֶ֖ם</mark> י֥וֹם אֶחָֽד׃", "pasuk_en": "עַד אֲשֶׁר תָּשׁוּב חֲמַת־אָחִיךָ מִמְּךָ, וְשָׁכַח אֵת אֲשֶׁר־עָשִׂיתָ לוֹ; וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם. לָמָּה אֶשְׁכַּל גַּם־שְׁנֵיכֶם בְּיוֹם אֶחָד?", "rashi_he": "גם שניכם. אִם יָקוּם עָלֶיךָ וְאַתָּה תַּהַרְגֶנּוּ יַעַמְדוּ בָנָיו וְיַהַרְגוּךָ; וְרוּחַ הַקֹּדֶשׁ נִזְרְקָה בָהּ וְנִתְנַבְּאָה שֶׁבְּיוֹם א' יָמוּתוּ, כְּמוֹ שֶׁמְּפֹרָשׁ בְּפֶרֶק הַמְקַנֵּא לְאִשְׁתּוֹ:", "rashi_en": "אם עשו יקום על יעקב ויעקב יהרוג אותו, יקומו בני עשו ויהרגו את יעקב. ועוד, רוח הקודש נזרקה ברבקה והיא ניבאה ששניהם ימותו ביום אחד, כמבואר בפרק המקנא לאשתו.", "note": "", "points": [{"q": "מדוע חששה רבקה לאבד את שני בניה, ולא רק את יעקב?", "options": ["אם יעקב יהרוג את עשו, יקומו בני עשו ויהרגו את יעקב", "כי חששה שיצחק יכעס ויגרש את שניהם מן הבית", "כי עשו יהרוג את יעקב ואחר כך ייענש במיתה"], "kasha": "עשו איים להרוג רק את יעקב, ומדוע אמרה רבקה שתשכל את שניהם?", "answer": "אם יקום עשו על יעקב ויעקב יהרגנו, יעמדו בניו של עשו ויהרגו את יעקב."}, {"q": "מה ניבאה רבקה במילים \"יום אחד\"?", "options": ["ששני בניה ימותו ביום אחד", "שיעקב ישוב לביתו ביום אחד", "שעשו ישכח את כעסו ביום אחד"], "kasha": "מדוע הוסיפה רבקה את המילים \"יום אחד\"?", "answer": "רוח הקודש נזרקה בה ונתנבאה שביום אחד ימותו, כמו שמפורש בפרק המקנא לאשתו."}]}, {"id": "27:46.1", "ch": 27, "v": 46, "n": 1, "dh": "קצתי בחיי", "pasuk_html": "וַתֹּ֤אמֶר רִבְקָה֙ אֶל־יִצְחָ֔ק <mark>קַ֣צְתִּי בְחַיַּ֔י</mark> מִפְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם־לֹקֵ֣חַ יַ֠עֲקֹ֠ב אִשָּׁ֨ה מִבְּנֽוֹת־חֵ֤ת כָּאֵ֙לֶּה֙ מִבְּנ֣וֹת הָאָ֔רֶץ לָ֥מָּה לִּ֖י חַיִּֽים׃", "pasuk_en": "רִבְקָה אָמְרָה לְיִצְחָק: קָצִיתִי בְחַיַּי מִפְּנֵי בְנוֹת חֵת. אִם יִשְׂמוֹר יַעֲקֹב אִשָּׁה מִבְּנוֹת חֵת כָּאֵלֶּה מִבְּנוֹת הָאָרֶץ לָמָּה לִּי חַיִּים?", "rashi_he": "קצתי בחיי. מָאַסְתִּי בְחַיַּי:", "rashi_en": "רבקה אמרה ליצחק שמאסה בחייה בגלל בנות חת.", "note": "", "points": [{"q": "מה פירוש \"קצתי בחיי\" לפי רש״י?", "options": ["מאסתי בחיי", "קיצרתי את חיי", "הגעתי לקץ חיי"], "kasha": "המילה \"קצתי\" יכולה להתפרש בכמה אופנים, ולא ברור מה כוונתה כאן.", "answer": "קצתי פירושו מאסתי."}]}, {"id": "28:2.1", "ch": 28, "v": 2, "n": 1, "dh": "פדנה", "pasuk_html": "ק֥וּם לֵךְ֙ <mark>פַּדֶּ֣נָֽה</mark> אֲרָ֔ם בֵּ֥יתָה בְתוּאֵ֖ל אֲבִ֣י אִמֶּ֑ךָ וְקַח־לְךָ֤ מִשָּׁם֙ אִשָּׁ֔ה מִבְּנ֥וֹת לָבָ֖ן אֲחִ֥י אִמֶּֽךָ׃", "pasuk_en": "קוּם לֵךְ פַּדְנָה אֲרָם בֵּיתָה בְתוּאֵל אֲבִי אִמְּךָ וְקַח לְךָ אִשָּׁה מִשָּׁם מִבְּנוֹת לָבָן אֲחִי אִמְּךָ", "rashi_he": "פדנה. כְּמוֹ לְפַדָּן:", "rashi_en": "\"פדנה\" פירושו \"לפדן\" – אל פדן ארם. הה״א בסוף המילה באה במקום למ״ד בתחילתה.", "note": "", "points": [{"q": "מה פירוש \"פדנה\" לפי רש״י?", "options": ["לפדן – אל פדן ארם", "בפדן – בתוך פדן ארם", "מפדן – מן פדן ארם"], "kasha": "לא ברור מה תפקידה של הה״א בסוף המילה \"פדנה\".", "answer": "פדנה כמו לפדן."}]}, {"id": "28:2.2", "ch": 28, "v": 2, "n": 2, "dh": "ביתה בתואל", "pasuk_html": "ק֥וּם לֵךְ֙ פַּדֶּ֣נָֽה אֲרָ֔ם <mark>בֵּ֥יתָה בְתוּאֵ֖ל</mark> אֲבִ֣י אִמֶּ֑ךָ וְקַח־לְךָ֤ מִשָּׁם֙ אִשָּׁ֔ה מִבְּנ֥וֹת לָבָ֖ן אֲחִ֥י אִמֶּֽךָ׃", "pasuk_en": "קוּם לֵךְ פַּדְנָה אֲרָם בֵּיתָה בְתוּאֵל אֲבִי אִמְּךָ וְקַח לְךָ אִשָּׁה מִשָּׁם מִבְּנוֹת לָבָן אֲחִי אִמְּךָ", "rashi_he": "ביתה בתואל. לְבֵית בְּתוּאֵל, כָּל תֵּבָה שֶׁצְּרִיכָה לָמֶ\"ד בִּתְחִלָּתָהּ הֵטִיל לָהּ הֵ\"א בְּסוֹפָהּ (יבמות י\"ג):", "rashi_en": "\"ביתה בתואל\" פירושו \"לבית בתואל\". כל מילה שצריכה למ״ד בתחילתה, אפשר להוסיף לה ה״א בסופה במקומה.", "note": "", "points": [{"q": "מה תפקידה של הה״א בסוף המילה \"ביתה\"?", "options": ["במקום למ״ד בתחילת המילה – לבית בתואל", "כינוי לנקבה – הבית של רבקה אמו", "לשון שייכות – הבית ששייך לבתואל"], "kasha": "\"ביתה\" נשמע כמו \"הבית שלה\", ואין זה מתאים להקשר.", "answer": "ביתה בתואל – לבית בתואל; כל תיבה שצריכה למ״ד בתחילתה, הטיל לה ה״א בסופה."}]}, {"id": "28:3.1", "ch": 28, "v": 3, "n": 1, "dh": "ואל שדי", "pasuk_html": "<mark>וְאֵ֤ל שַׁדַּי֙</mark> יְבָרֵ֣ךְ אֹֽתְךָ֔ וְיַפְרְךָ֖ וְיַרְבֶּ֑ךָ וְהָיִ֖יתָ לִקְהַ֥ל עַמִּֽים׃", "pasuk_en": "וַיֹּאמֶר לוֹ אֱלֹהִים אֲנִי אֵל שַׁדַּי פְּרֵה וּרְבֵה גוֹיִם וּמְלוּכִים מִמְּךָ יִשּׁוּ", "rashi_he": "ואל שדי. מִי שֶׁדַּי בְּבִרְכוֹתָיו לַמִּתְבָּרְכִין מִפִּיו, יברך אותך:", "rashi_en": "יצחק מברך את יעקב בשם \"אל שדי\" – מי שיש די בברכותיו לכל המתברכים מפיו, הוא יברך אותך.", "note": "", "points": [{"q": "מה פירוש השם \"שדי\" בברכה זו לפי רש״י?", "options": ["מי שיש די בברכותיו למתברכים מפיו", "מי ששולט בכל כוחות הטבע והשמים", "מי שמשדד ומכלה את כל אויביו"], "kasha": "מדוע הזכיר יצחק דווקא את השם \"אל שדי\" כשבירך את יעקב?", "answer": "מי שדי בברכותיו למתברכין מפיו – הוא יברך אותך."}]}, {"id": "28:4.1", "ch": 28, "v": 4, "n": 1, "dh": "את ברכת אברהם", "pasuk_html": "וְיִֽתֶּן־לְךָ֙ <mark>אֶת־בִּרְכַּ֣ת אַבְרָהָ֔ם</mark> לְךָ֖ וּלְזַרְעֲךָ֣ אִתָּ֑ךְ לְרִשְׁתְּךָ֙ אֶת־אֶ֣רֶץ מְגֻרֶ֔יךָ אֲשֶׁר־נָתַ֥ן אֱלֹהִ֖ים לְאַבְרָהָֽם׃", "pasuk_en": "וְאֶת בִּרְכַּת אַבְרָהָם תִּשְׁמוֹר לְךָ וּלְזַרְעֲךָ אִתְּךָ לָרֶשֶׁת אֶת אֶרֶץ מְגוּרֶיךָ אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם", "rashi_he": "את ברכת אברהם. שֶׁאָמַר לוֹ וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וְהִתְבָּרְכוּ בְזַרְעֲךָ יִהְיוּ אוֹתָן בְּרָכוֹת אֲמוּרוֹת בִּשְׁבִילְךָ – מִמְּךָ יֵצֵא אוֹתוֹ הַגּוֹי וְאוֹתוֹ הַזֶּרַע הַמְבֹרָךְ:", "rashi_en": "יצחק מברך את יעקב שהברכות שנאמרו לאברהם – \"ואעשך לגוי גדול\" ו\"והתברכו בזרעך\" – יתקיימו בו, וממנו יצא הגוי הגדול והזרע המבורך.", "note": "", "points": [{"q": "לאיזו ברכה של אברהם מתכוון יצחק?", "options": ["\"ואעשך לגוי גדול\" ו\"והתברכו בזרעך\" – שיתקיימו ביעקב", "ברכת העושר והנכסים הרבים שהיו לאברהם", "ברכת אריכות הימים והשיבה הטובה של אברהם"], "kasha": "לא ברור איזו ברכה מסוימת של אברהם מעביר יצחק ליעקב.", "answer": "הברכות \"ואעשך לגוי גדול\" ו\"והתברכו בזרעך\" יהיו אמורות בשבילך – ממך יצא אותו הגוי ואותו הזרע המבורך."}]}, {"id": "28:5.1", "ch": 28, "v": 5, "n": 1, "dh": "אם יעקב ועשו", "pasuk_html": "וַיִּשְׁלַ֤ח יִצְחָק֙ אֶֽת־יַעֲקֹ֔ב וַיֵּ֖לֶךְ פַּדֶּ֣נָֽה אֲרָ֑ם אֶל־לָבָ֤ן בֶּן־בְּתוּאֵל֙ הָֽאֲרַמִּ֔י אֲחִ֣י רִבְקָ֔ה <mark>אֵ֥ם יַעֲקֹ֖ב וְעֵשָֽׂו׃</mark>", "pasuk_en": "וַיִּשְׁלַח יִצְחָק אֶת יַעֲקֹב וַיֵּלֶךְ לְפַדַּן אָרָם אֶל לָבָן בֶּן בְּתוּאֵל הָאֲרַמִּי אֲחִי רִבְקָה אֵם יַעֲקֹב וְעֵשָׂו.", "rashi_he": "אם יעקב ועשו. אֵינִי יוֹדֵעַ מַה מְּלַמְּדֵנוּ:", "rashi_en": "רש״י אומר שאינו יודע מה מלמדות אותנו המילים \"אם יעקב ועשו\", שהרי כבר ידוע שרבקה היא אמם.", "note": "", "points": [{"q": "מה אומר רש״י על המילים \"אם יעקב ועשו\"?", "options": ["שאינו יודע מה הן מלמדות", "שהן מלמדות שרבקה אהבה את שניהם", "שהן מלמדות שעשו היה הבכור"], "kasha": "כבר ידוע שרבקה היא אמם של יעקב ועשו, ומה מוסיף הכתוב?", "answer": "רש״י אומר: \"איני יודע מה מלמדנו\"."}]}, {"id": "28:7.1", "ch": 28, "v": 7, "n": 1, "dh": "וישמע יעקב", "pasuk_html": "<mark>וַיִּשְׁמַ֣ע יַעֲקֹ֔ב</mark> אֶל־אָבִ֖יו וְאֶל־אִמּ֑וֹ וַיֵּ֖לֶךְ פַּדֶּ֥נָֽה אֲרָֽם׃", "pasuk_en": "וַיִּשְׁמַע יַעֲקֹב אֶל אָבִיו וְאֶל אִמּוֹ וַיֵּלֶךְ לְפַדַּן אָרָם.", "rashi_he": "וישמע יעקב. מְחֻבָּר לָעִנְיָן שֶׁל מַעְלָה, וַיַּרְא עֵשָׂו כִּי בֵרַךְ יִצְחָק וְגוֹ' וְכִי שִׁלַּח אוֹתוֹ פַּדֶּנָה אֲרָם, וְכִי שָׁמַע יַעֲקֹב אֶל אָבִיו וְהָלַךְ פַּדֶּנָה אֲרָם, וְכִי רָעוֹת בְּנוֹת כְּנַעַן, וְהָלַךְ גַּם הוּא אֶל יִשְׁמָעֵאל:", "rashi_en": "הפסוק מחובר לעניין שלפניו: עשו ראה שיצחק בירך את יעקב ושלחו לפדן ארם, ושיעקב שמע לאביו ולאמו והלך, ושבנות כנען רעות בעיני אביו – ולכן הלך גם הוא אל ישמעאל.", "note": "", "points": [{"q": "מדוע נכתב כאן שיעקב שמע לאביו ולאמו והלך?", "options": ["זה חלק ממה שראה עשו, ולכן הלך גם הוא אל ישמעאל", "כדי ללמד שיעקב יצא לחרן בלי רשות מאמו", "כדי להודיע שיעקב יצא לדרכו מיד באותו היום"], "kasha": "הפסוק נראה כחזרה מיותרת באמצע הסיפור על עשו.", "answer": "הפסוק מחובר לעניין שלמעלה: עשו ראה שבירך יצחק את יעקב, ששלחו לפדן ארם, שיעקב שמע לאביו והלך, ושרעות בנות כנען – והלך גם הוא אל ישמעאל."}]}, {"id": "28:9.1", "ch": 28, "v": 9, "n": 1, "dh": "אחות נביות", "pasuk_html": "וַיֵּ֥לֶךְ עֵשָׂ֖ו אֶל־יִשְׁמָעֵ֑אל וַיִּקַּ֡ח אֶֽת־מָחֲלַ֣ת&thinsp;׀ בַּת־יִשְׁמָעֵ֨אל בֶּן־אַבְרָהָ֜ם <mark>אֲח֧וֹת נְבָי֛וֹת</mark> עַל־נָשָׁ֖יו ל֥וֹ לְאִשָּֽׁה׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיִּשְׁמַע יַעֲקֹב אֶל אָבִיו וְאֶל אִמּוֹ וַיֵּלֶךְ לְפַדַּן אָרָם.", "rashi_he": "אחות נביות. מִמַּשְׁמָע שֶׁנֶּאֱמַר בַּת יִשְׁמָעֵאל אֵינִי יוֹדֵעַ שֶׁהִיא אֲחוֹת נְבָיוֹת? אֶלָּא לָמַדְנוּ שֶׁמֵּת יִשְׁמָעֵאל מִשֶּׁיְּעָדָהּ לְעֵשָׂו קֹדֶם נִשּׂוּאֶיהָ וְהִשִּׂיאָהּ נְבָיוֹת אָחִיהָ, וְלָמַדְנוּ שֶׁהָיָה יַעֲקֹב בְּאוֹתוֹ הַפֶּרֶק בֶּן ס\"ג שָׁנִים, שֶׁהֲרֵי יִשְׁמָעֵאל בֶּן ע\"ד שָׁנִים הָיָה כְּשֶׁנּוֹלַד יַעֲקֹב, י\"ד שָׁנָה הָיָה גָדוֹל יִשְׁמָעֵאל מִיִּצְחָק, וְיִצְחָק בֶּן ס' שָׁנָה בְּלֶדֶת אוֹתָם הֲרֵי ע\"ד, וּשְׁנוֹתָיו הָיוּ קל\"ז, שֶׁנֶּאֱמַר וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל וְגוֹ', נִמְצָא יַעֲקֹב כְּשֶׁמֵּת יִשְׁמָעֵאל בֶּן ס\"ג שָׁנִים הָיָה, וְלָמַדְנוּ מִכָּאן שֶׁנִּטְמַן בְּבֵית עֵבֶר י\"ד שָׁנָה וְאַחַר כָּךְ הָלַךְ לְחָרָן, שֶׁהֲרֵי לֹא שָׁהָה בְּבֵית לָבָן לִפְנֵי לֵדָתוֹ שֶׁל יוֹסֵף אֶלָּא י\"ד שָׁנָה, שֶׁנֶּאֱמַר עֲבַדְתִּיךָ אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ, וּשְׂכַר הַצֹּאן מִשֶּׁנּוֹלַד יוֹסֵף הָיָה, שֶׁנֶּאֱמַר וַיְהִי כַּאֲשֶׁר יָלְדָה רָחֵל אֶת יוֹסֵף וְגוֹ'; וְיוֹסֵף בֶּן ל' שָׁנָה הָיָה כְּשֶׁמָּלַךְ, וּמִשָּׁם עַד שֶׁיָּרַד יַעֲקֹב לְמִצְרַיִם ט' שָׁנִים, ז' שֶׁל שָׂבָע וּב' שֶׁל רָעָב, וְיַעֲקֹב אָמַר לְפַרְעֹה יְמֵי שְׁנֵי מְגוּרַי שְׁלֹשִׁים וּמְאַת שָׁנָה – צֵא וַחֲשֹׁב י\"ד שֶׁלִּפְנֵי לֵדַת יוֹסֵף וּשְׁלֹשִׁים שֶׁל יוֹסֵף וְתֵשַׁע מִשֶּׁמָּלַךְ עַד שֶׁבָּא יַעֲקֹב, הֲרֵי נ\"ג, וּכְשֶׁפֵּרֵשׁ מֵאָבִיו הָיָה בֶּן ס\"ג, הֲרֵי קי\"ו, וְהוּא אוֹמֵר שְׁלֹשִׁים וּמְאַת שָׁנָה, הֲרֵי חֲסֵרִים י\"ד שָׁנִים, הָא לָמַדְתָּ שֶׁאַחַר שֶׁקִּבֵּל הַבְּרָכוֹת נִטְמַן בְּבֵית עֵבֶר י\"ד שָׁנִים, אֲבָל לֹא נֶעֱנַשׁ בִּזְכוּת הַתּוֹרָה; שֶׁהֲרֵי לֹא פֵּרֵשׁ יוֹסֵף מֵאָבִיו אֶלָּא כ\"ב שָׁנָה, דְּהַיְנוּ מִי\"ז עַד ל\"ט, כְּנֶגֶד כ\"ב שֶׁפֵּרֵשׁ יַעֲקֹב מֵאָבִיו וְלֹא כִבְּדוֹ, וְהֵם כ' שָׁנִים בְּבֵית לָבָן וּשְׁתֵּי שָׁנִים שֶׁשָּׁהָה בַדֶּרֶךְ, כְּדִכְתִיב וַיִּבֶן לוֹ בָּיִת וּלְמִקְנֵהוּ עָשָׂה סֻכֹּת, וּפֵר' רַזִ\"לִ מִזֶּה הַפָּסוּק שֶׁשָּׁהָה י\"ח חֳדָשִׁים בַּדֶּרֶךְ – דְּבַיִת הֲוָה בִּימוֹת הַגְּשָׁמִים וְסֻכֹּת הֲווּ בִּימוֹת הַחַמָּה – וּלְחֶשְׁבּוֹן הַפְּסוּקִים שֶׁחָשַׁבְנוּ לְעֵיל מִשֶּׁפֵּרֵשׁ מֵאָבִיו עַד שֶׁיָּרַד לְמִצְרַיִם שֶׁהָיָה בֶּן ק\"ל שָׁנִים, שֶׁשָּׁם אָנוּ מוֹצְאִים עוֹד י\"ד שָׁנִים – אֶלָּא וַדַּאי נִטְמַן בְּבֵית עֵבֶר בַּהֲלִיכָתוֹ לְבֵית לָבָן לִלְמֹד תּוֹרָה מִמֶּנּוּ, וּבִשְׁבִיל זְכוּת הַתּוֹרָה לֹא נֶעֱנַשׁ עֲלֵיהֶם וְלֹא פֵּרֵשׁ יוֹסֵף מִמֶּנּוּ אֶלָּא כ\"ב שָׁנָה – מִדָּה כְּנֶגֶד מִדָּה – עַ\"כַּ בְּרַשִׁ\"י יָשָׁן:", "rashi_en": "מכך שמחלת היא בת ישמעאל ברור שהיא אחות נביות, אלא בא ללמד שישמעאל מת אחרי שייעד אותה לעשו וקודם נישואיה, ונביות אחיה השיא אותה. מכאן מחשבים שיעקב היה אז בן ס״ג, ושלפני שהלך לחרן נטמן י״ד שנה בבית עבר ללמוד תורה, ובזכות התורה לא נענש על השנים האלו.", "note": "", "points": [{"q": "מה מלמדת התוספת \"אחות נביות\"?", "options": ["שישמעאל מת לפני נישואיה, ונביות אחיה השיא אותה", "שנביות היה הבכור והחשוב מבני ישמעאל", "שמחלת הייתה אחותו של נביות מאב ומאם"], "kasha": "ממה שנאמר \"בת ישמעאל\" כבר יודעים שהיא אחות נביות, ומדוע הוצרך הכתוב לפרש?", "answer": "למדנו שמת ישמעאל אחרי שייעד אותה לעשו וקודם נישואיה, והשיאה נביות אחיה."}, {"q": "היכן היה יעקב בי״ד השנים החסרות בחשבון שנותיו?", "options": ["נטמן בבית עבר ולמד שם תורה", "נשאר בבית אביו ושירת אותו", "עבד אצל לבן לפני שנשא את נשיו"], "kasha": "בחשבון שנותיו של יעקב מאז שיצא מבית אביו ועד שירד למצרים חסרות י״ד שנים.", "answer": "אחרי שקיבל את הברכות נטמן בבית עבר י״ד שנים ללמוד תורה, ורק אחר כך הלך לחרן; ובזכות התורה לא נענש עליהן, ולכן פרש ממנו יוסף רק כ״ב שנה – מידה כנגד מידה."}]}, {"id": "28:9.2", "ch": 28, "v": 9, "n": 2, "dh": "על נשיו", "pasuk_html": "וַיֵּ֥לֶךְ עֵשָׂ֖ו אֶל־יִשְׁמָעֵ֑אל וַיִּקַּ֡ח אֶֽת־מָחֲלַ֣ת&thinsp;׀ בַּת־יִשְׁמָעֵ֨אל בֶּן־אַבְרָהָ֜ם אֲח֧וֹת נְבָי֛וֹת <mark>עַל־נָשָׁ֖יו</mark> ל֥וֹ לְאִשָּֽׁה׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל וַיִּקַּח אֶת מַחְלַת בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם אֲחוֹת נְבָיוֹת עַל נָשָׁיו לוֹ לְאִשָּׁה.", "rashi_he": "על נשיו. הוֹסִיף רִשְׁעָה עַל רִשְׁעָתוֹ, שֶׁלֹּא גֵרֵשׁ אֶת הָרִאשׁוֹנוֹת:", "rashi_en": "עשו לקח את מחלת נוסף על נשיו הקודמות ולא גירש אותן, וכך הוסיף רשעה על רשעתו.", "note": "", "points": [{"q": "מה מלמדות המילים \"על נשיו\"?", "options": ["שהוסיף רשעה על רשעתו ולא גירש את הראשונות", "שעשו חזר בתשובה וגירש את נשיו הכנעניות", "שמחלת הייתה חשובה בעיניו מכל נשיו"], "kasha": "מדוע הוצרך הכתוב לציין שלקח אותה \"על נשיו\"?", "answer": "הוסיף רשעה על רשעתו, שלא גירש את נשיו הראשונות."}]}];

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function order(id){const a=[0,1,2];let h=hash(id);for(let k=2;k>0;k--){const j=h%(k+1);h=Math.floor(h/7)+13;[a[k],a[j]]=[a[j],a[k]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function heWrap(s){s=String(s).replace(/(^|[^א-ת])(ה|וגו|ית|וכו|וגומ)'/g,'$1$2׳');return esc(s).replace(/([֐-׿](?:[֐-׿״׳\- ]*[֐-׿״׳])?)/g,'<span lang="he" dir="rtl">$1</span>')}
const $=id=>document.getElementById(id);

// jump menu: one option per posuk that has Rashi
(function(){const sel=$('jump');let lastCh=0,grp;
  DATA.forEach((x,k)=>{ if(x.n!==1) return;
    if(x.ch!==lastCh){grp=document.createElement('optgroup');grp.label='Perek '+x.ch+' ('+gem(x.ch)+')';sel.appendChild(grp);lastCh=x.ch}
    const o=document.createElement('option');o.value=k;o.textContent=x.ch+':'+x.v+'  —  '+x.dh;grp.appendChild(o)});
  sel.addEventListener('change',()=>{go(+sel.value)});
})();

const P=(x,j)=>x.id+'#'+j;
function picked(x,j){return st.p[P(x,j)]}
function nDone(x){let n=0;while(n<x.points.length&&picked(x,n)!==undefined)n++;return n}
function rashiDone(x){return nDone(x)===x.points.length}
function stats(){let done=0,pts=0,נכון=0,totalPts=0;DATA.forEach(x=>{totalPts+=x.points.length;if(rashiDone(x))done++;x.points.forEach((_,j)=>{const v=picked(x,j);if(v!==undefined){pts++;if(v===0)נכון++}})});return{done,pts,נכון,totalPts}}
function rashiRight(x){return x.points.every((_,j)=>picked(x,j)===0)}
function header(){const s=stats();$('count').innerHTML='<b>'+s.done+'</b> / '+DATA.length+' רש״יות · '+s.נכון+' / '+s.pts+' נכון';
  $('barfill').style.width=(s.pts/s.totalPts*100)+'%';
  let best=0;DATA.forEach((x,k)=>{if(x.n===1&&k<=st.i)best=k});$('jump').value=best}

let curPt=null;
function go(i){clearTimeout(window._aa);curPt=null;st.i=Math.max(0,Math.min(DATA.length,i));save();render();$('main').scrollTo({top:0})}

function pointHTML(x,j){const v=picked(x,j);const ord=order(x.id+'#'+j);const multi=x.points.length>1;const pt=x.points[j];
  return `<div class="point" id="pt${j}">
    ${multi?`<div class="pnum">נקודה ${j+1} מתוך ${x.points.length}</div>`:''}
    <p class="q">${heWrap(pt.q)}</p>
    <div class="opts">${ord.map((o,k)=>{let c='';if(v!==undefined){c=o===0?'נכון':(o===v?'wrong':'dim')}
      return `<button class="opt ${c}" type="button" data-j="${j}" data-o="${o}" ${v!==undefined?'disabled':''}><span class="k">${k+1}</span><span>${heWrap(pt.options[o])}</span></button>`}).join('')}</div>
    ${(v!==undefined||j===nDone(x))?`<div class="reveal"${v===undefined?' style="visibility:hidden" aria-hidden="true"':''}>
      <div class="verdict ${v===0?'ok':'no'}">${v===0?'נכון.':'לא בדיוק.'}</div>
      ${pt.kasha?`<div class="row"><span class="t">מה מקשה רש״י</span><p>${heWrap(pt.kasha)}</p></div>`:''}
      <div class="row"><span class="t">רש״י אומר</span><p>${heWrap(pt.answer)}</p></div></div>`:''}
  </div>`}

function render(){
  header();
  const m=$('main');
  if(st.i>=DATA.length){
    const s=stats();const missed=DATA.map((x,k)=>[x,k]).filter(([x])=>rashiDone(x)&&!rashiRight(x));
    const skipped=DATA.map((x,k)=>[x,k]).filter(([x])=>!rashiDone(x));
    m.innerHTML='<section class="card done"><h2>סליק פרשת תולדות</h2><p>סיימת '+s.done+' מתוך '+DATA.length+' רש״יות · '+s.נכון+' מתוך '+s.pts+' נכון.</p>'+
      (skipped.length?'<p>'+skipped.length+' רש״יות not finished. <button class="ghost" id="gs" type="button">עבור אל first one</button></p>':'')+
      (missed.length?'<p>'+missed.length+' רש״יות לחזרה: '+missed.map(([x,k])=>'<button class="ghost" data-k="'+k+'" type="button">'+x.ch+':'+x.v+(x.n>1?' ('+x.n+')':'')+'</button>').join(' ')+'</p>':'')+
      '<div class="nav"><button class="btn sec" id="back" type="button">חזור →</button></div></section>';
    m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>go(+b.dataset.k));
    if($('gs'))$('gs').onclick=()=>go(skipped[0][1]);
    $('back').onclick=()=>go(DATA.length-1);return}
  const x=DATA[st.i];const on=DATA.filter(y=>y.ch===x.ch&&y.v===x.v).length;
  const nd=nDone(x);const cur=curPt!==null?curPt:Math.min(nd,x.points.length-1);
  const pts=pointHTML(x,cur);const ans=picked(x,cur)!==undefined;
  const all=rashiDone(x);
  m.innerHTML=`<section class="card" aria-live="polite">
    <div class="ref"><span>בראשית ${x.ch}:${x.v} · ${gem(x.ch)}:${gem(x.v)}</span><span>${on>1?'רש״י '+x.n+' מתוך '+on+' על פסוק זה':'רש״י 1 על פסוק זה'} · #${st.i+1}</span></div>
    ${x.note?'<div class="count">'+esc(x.note)+'</div>':''}
    <div class="pasuk" lang="he">${x.pasuk_html}</div>
    <div class="pasuk-en">${esc(x.pasuk_en)}</div>
    <div class="dh"><span class="w" lang="he">${esc(x.dh)}</span><span class="lbl">רש״י על</span>${x.points.length>1?`<span class="lbl pts">${x.points.length} נקודות</span>`:''}</div>
    ${pts}
    ${all?`<details><summary>הצג את לשון רש״י</summary><div class="full">
      <div class="he" lang="he"><b>${esc(x.dh)}</b> ${x.rashi_he}</div>
      <div class="en">${x.rashi_en}</div>
      <div class="src">Text: Sefaria (Hebrew); translation: Metsudah רש״י Chumash</div>
    </div></details>`:'<details style="visibility:hidden" aria-hidden="true"><summary>הצג את לשון רש״י</summary></details>'}
    <div class="nav"><button class="btn sec" id="back" type="button" ${st.i===0?'disabled':''}>חזור →</button><button class="btn" id="next" type="button" ${ans?'':'disabled'}>${all?'רש״י הבא ←':(ans?'נקודה הבאה ←':'ענה כדי להמשיך')}</button></div>
  </section>`;
  m.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>pick(+b.dataset.j,+b.dataset.o));
  $('back').onclick=()=>go(st.i-1);$('next').onclick=()=>{if(!ans)return;clearTimeout(window._aa);if(rashiDone(x))go(st.i+1);else{curPt=null;render()}};
}
function pick(j,o){const x=DATA[st.i];if(picked(x,j)!==undefined)return;st.p[P(x,j)]=o;save();curPt=j;render();
  clearTimeout(window._aa);
}
$('nextUnanswered').onclick=()=>{let k=DATA.findIndex((x,k)=>k>st.i&&!rashiDone(x));if(k<0)k=DATA.findIndex(x=>!rashiDone(x));go(k<0?DATA.length:k)};
function askReset(){const z=$('resetZone');z.innerHTML='<span class="confirm">למחוק התקדמות? <button class="ghost" id="yes" type="button">כן, התחל מחדש</button><button class="ghost" id="no" type="button">ביטול</button></span>';
  $('yes').onclick=()=>{st={i:0,p:{}};save();z.innerHTML='<button class="ghost" id="reset" type="button">התחל מחדש</button>';$('reset').onclick=askReset;render()};
  $('no').onclick=()=>{z.innerHTML='<button class="ghost" id="reset" type="button">התחל מחדש</button>';$('reset').onclick=askReset}}
$('reset').onclick=askReset;
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(['1','2','3'].includes(e.key)){const b=document.querySelectorAll('.opt:not([disabled])')[+e.key-1];if(b)b.click()}
  else if(e.key==='Enter'||e.key==='ArrowRight'){const n=$('next');if(n&&!n.disabled&&document.activeElement.tagName!=='SUMMARY'){e.preventDefault();n.click()}}
  else if(e.key==='ArrowLeft'){const b=$('back');if(b&&!b.disabled)b.click()}});

function foot(){const h=document.querySelector('.hint');const x=DATA[st.i];
  const c=$('count').textContent;
  if(!x){h.textContent=c;return}
  const on=DATA.filter(y=>y.ch===x.ch&&y.v===x.v).length;
  h.innerHTML='<span>בראשית '+x.ch+':'+x.v+' · '+gem(x.ch)+':'+gem(x.v)+'</span><span>רש״י '+x.n+' מתוך '+on+' על פסוק זה · #'+(st.i+1)+'</span><span>'+esc(c)+'</span><span>מקשים: 1-3 לתשובה · Enter להבא · ← / → לניווט</span>'}
function fit(){const c=document.querySelector('.card');if(!c)return;const r=document.documentElement;
  const bs=(set,over,lo,hi)=>{for(let i=0;i<10;i++){const m=(lo+hi)/2;set(m);if(over())hi=m;else lo=m}set(lo)};
  if(matchMedia('(min-width:900px)').matches){const p=c.querySelector('.pasuk'),pt=c.querySelector('.point');
    bs(v=>r.style.setProperty('--sp',v),()=>p.scrollHeight>p.clientHeight+1,.5,3.2);
    bs(v=>r.style.setProperty('--s',v),()=>pt.scrollHeight>pt.clientHeight+1,.5,2.4)}
  else bs(v=>r.style.setProperty('--s',v),()=>c.scrollHeight>c.clientHeight+1,.6,6)}
function placeReveal(){const c=document.querySelector('.card'),r=c&&c.querySelector('.reveal'),n=c&&c.querySelector('.nav'),o=c&&c.querySelector('.opts');if(!r)return;
  if(matchMedia('(min-width:900px)').matches){r.style.bottom='0';r.style.top=(o?o.offsetTop:0)+'px'}
  else{r.style.top='';if(n)r.style.bottom=(c.clientHeight-n.offsetTop+6)+'px'}}
const _render=render;render=function(){_render();foot();fit();placeReveal()};
addEventListener('resize',placeReveal);
addEventListener('resize',fit);if(document.fonts)document.fonts.ready.then(fit);
render();
</script>

</body>
</html>
