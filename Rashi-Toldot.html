<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toldot Rashi</title>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body dir="rtl">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-soft:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100dvh;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:4px;height:100%}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.top{display:contents}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
h1 span{display:none}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.count b{color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:none}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-heb);font-size:22px;line-height:1.55;direction:rtl;text-align:right}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{display:none}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:6px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:8px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:18px;line-height:1.45;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:center;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-body);font-size:17px;line-height:1.4;width:100%;direction:rtl}
.opt .k{flex:none;font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-soft)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.row{display:flex;flex-direction:column;gap:2px}
.row .t{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);direction:rtl}
.row p{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:14px;line-height:1.6;direction:rtl;text-align:right}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface);font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line);font-size:14px}
.hint{font-size:11px;color:var(--muted);text-align:center;flex-shrink:0}
.verdict{font-weight:600;font-size:16px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:20px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* taamim: Frank Ruhl lacks cantillation glyphs, so those letters fell back to another font */
.pasuk{font-family:"Noto Serif Hebrew",var(--f-heb)}
/* pasuk panel: visually separate the verse from the question */
.pasuk{background:var(--accent-soft);border-inline-start:5px solid var(--accent);border-radius:10px;padding:calc(var(--s,1)*6px) calc(var(--s,1)*12px)}
.point{border-top:1px solid var(--line);padding-top:calc(var(--s,1)*8px)}
/* fit layout: only pasuk + question + options in the card; fine print lives in the footer */
.wrap{max-width:min(1500px,100%)}
header .top,.tools,.ref,.dh{display:none}
.card{gap:calc(var(--s,1)*8px)}
.pasuk{font-size:calc(var(--s,1)*22px)}
.q{font-size:calc(var(--s,1)*18px)}
.opt{font-size:calc(var(--s,1)*17px);padding:calc(var(--s,1)*7px) calc(var(--s,1)*10px)}
.opt .k{width:calc(var(--s,1)*20px);height:calc(var(--s,1)*20px);font-size:calc(var(--s,1)*11px)}
.row p{font-size:25px;line-height:1.35}
.verdict{font-size:26px;font-weight:700}
.row .t{font-size:16px}
.point{gap:calc(var(--s,1)*10px)}
.card{position:relative}
.reveal{position:absolute;inset-inline:12px;bottom:56px;z-index:3;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.nav .btn{padding:4px 12px;font-size:13px}
@media (max-width:460px){.pasuk{font-size:calc(var(--s,1)*22px)}}
.hint{font-size:11px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}

/* wide screens: split layout (pasuk | question+answers), fonts auto-fit each side */
@media (min-width:900px){
.wrap{max-width:min(1800px,100%)}
.card{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr) auto auto;column-gap:22px;row-gap:8px;overflow:hidden}
.card>.pasuk{grid-column:1;grid-row:1;overflow:hidden;align-self:stretch;font-size:calc(var(--sp,1)*22px);padding:calc(var(--sp,1)*10px) calc(var(--sp,1)*14px)}
.card>.point{position:relative;grid-column:2;grid-row:1;min-height:0;overflow:hidden;border-top:0;padding-top:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--s,1)*12px)}
.card>details{grid-column:1/-1;grid-row:2}
.card>.nav{grid-column:1/-1;grid-row:3}
.reveal{position:absolute;inset:auto 0 0 0;z-index:3;max-height:none;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.row p{font-size:24px;line-height:1.4}
.verdict{font-size:28px;font-weight:700}
.row .t{font-size:16px}
.q{font-size:calc(var(--s,1)*21px)}
.opt{font-size:calc(var(--s,1)*21px)}
}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <h1>רש״י · תולדות <span>רש״י על תולדות</span></h1>
      <div class="count" id="count"></div>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="tools">
      <label for="jump" class="count">עבור אל</label>
      <select id="jump"></select>
      <button class="ghost" id="nextUnanswered" type="button">הבא ללא מענה</button>
      <span id="resetZone"><button class="ghost" id="reset" type="button">התחל מחדש</button></span>
    </div>
  </header>
  <main id="main"></main>
  <div class="hint">מקשים: 1-3 לתשובה · Enter להבא · ← / → לניווט</div>
</div>

<script>
const DATA = [{"id": "25:19.1", "ch": 25, "v": 19, "n": 1, "dh": "ואלה תולדות יצחק", "pasuk_html": "<mark>וְאֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק</mark> בֶּן־אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת־יִצְחָֽק׃", "pasuk_en": "וְאֵלֶּה תּוֹלְדוֹת יִצְחָק בֶּן־אַבְרָהָם אַבְרָהָם הוֹלִיד אֶת־יִצְחָק׃", "rashi_he": "ואלה תולדות יצחק. יַעֲקֹב וְעֵשָׂו הָאֲמוּרִים בַּפָּרָשָׁה:", "rashi_en": "תולדות יצחק הם בניו יעקב ועשו, שעליהם מסופר בפרשה.", "note": "", "points": [{"q": "לפי רש״י, מי הם ה'תולדות' של יצחק שהפסוק מדבר עליהם?", "options": ["יעקב ועשו, שעליהם מסופר בפרשה", "המאורעות שעברו על יצחק בימי חייו", "כל צאצאי יצחק לדורותיהם עד משה"], "kasha": "לא מפורש בפסוק מי הם התולדות שהכתוב מתכוון אליהם.", "answer": "תולדות יצחק הם יעקב ועשו, האמורים בפרשה."}]}, {"id": "25:19.2", "ch": 25, "v": 19, "n": 2, "dh": "אברהם הוליד את יצחק", "pasuk_html": "וְאֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן־אַבְרָהָ֑ם <mark>אַבְרָהָ֖ם הוֹלִ֥יד אֶת־יִצְחָֽק׃</mark>", "pasuk_en": "וְאֵלֶּה תּוֹלְדוֹת יִצְחָק בֶּן־אַבְרָהָם אַבְרָהָם הוֹלִיד אֶת־יִצְחָק׃", "rashi_he": "אברהם הוליד את יצחק. עַל יְדֵי שֶׁכָּתַב הַכָּתוּב יִצְחָק בֶּן אַבְרָהָם הֻזְקַק לוֹמַר אַבְרָהָם הוֹלִיד אֶת יִצְחָק; לְפִי שֶׁהָיוּ לֵיצָנֵי הַדּוֹר אוֹמְרִים מֵאֲבִימֶלֶךְ נִתְעַבְּרָה שָׂרָה, שֶׁהֲרֵי כַּמָּה שָׁנִים שָׁהֲתָה עִם אַבְרָהָם וְלֹא נִתְעַבְּרָה הֵימֶנּוּ; מֶה עָשָׂה הַקָּבָּ\"ה? צָר קְלַסְתֵּר פָּנָיו שֶׁל יִצְחָק דּוֹמֶה לְאַבְרָהָם, וְהֵעִידוּ הַכֹּל אַבְרָהָם הוֹלִיד אֶת יִצְחָק, וְזֶהוּ שֶׁכָּתוּב כָּאן יִצְחָק בֶּן אַבְרָהָם, שֶׁהֲרֵי עֵדוּת יֵשׁ שֶׁאַבְרָהָם הוֹלִיד אֶת יִצְחָק:", "rashi_en": "ליצני הדור אמרו ששרה נתעברה מאבימלך, כי שהתה שנים רבות עם אברהם ולא נתעברה ממנו. הקב״ה עשה את פני יצחק דומים לפני אברהם, וכולם העידו שאברהם הוליד את יצחק; לכן הכתוב מדגיש זאת.", "note": "", "points": [{"q": "מדוע הוצרך הכתוב לומר 'אברהם הוליד את יצחק' אחרי שכבר אמר 'יצחק בן אברהם'?", "options": ["כנגד ליצני הדור שאמרו ששרה נתעברה מאבימלך", "כדי ללמד שיצחק נולד כשאברהם היה זקן מאוד", "כדי להבדיל בין יצחק לבין ישמעאל בן הגר"], "kasha": "יש כא  של יצחק בנישואיו עם מה שנאמר קודם על לידת רבקה.", "answer": "בשובו מהר המוריה נתבשר אברהם שנולדה רבקה, ויצחק היה אז בן 37, ששרה ילדה בת 90 ומתה בת 127 בשעת העקדה. יצחק המתין שלוש שנים עד שתהיה ראויה לביאה, ונשאה."}]}, {"id": "25:20.2", "ch": 25, "v": 20, "n": 2, "dh": "בת בתואל מפדן ארם אחות לבן", "pasuk_html": "וַיְהִ֤י יִצְחָק֙ בֶּן־אַרְבָּעִ֣ים שָׁנָ֔ה בְּקַחְתּ֣וֹ אֶת־רִבְקָ֗ה בַּת־<mark>בְּתוּאֵל֙ הָֽאֲרַמִּ֔י מִפַּדַּ֖ן אֲרָ֑ם אֲח֛וֹת לָבָ֥ן</mark> הָאֲרַמִּ֖י ל֥וֹ לְאִשָּֽׁה׃", "pasuk_en": "וְיִצְחָק בֶּן־אַרְבָּעִים שָׁנָה לָקַח אֶת־רִבְקָה בַּת־בְּתוּאֵל הָאֲרַמִּי מִפַּדַּן־אֲרָם אֲחוֹת לָבָן הָאֲרַמִּי לוֹ לְאִשָּׁה׃", "rashi_he": "בת בתואל מפדן ארם אחות לבן. וְכִי עֲדַיִן לֹא נִכְתַּב שֶׁהִיא בַּת בְּתוּאֵל וַאֲחוֹת לָבָן וּמִפַּדַּן אֲרָם? אֶלָּא לְהַגִּיד שִׁבְחָהּ, שֶׁהָיְתָה בַּת רָשָׁע וַאֲחוֹת רָשָׁע וּמְקוֹמָהּ אַנְשֵׁי רֶשַׁע וְלֹא לָמְדָה מִמַּעֲשֵׂיהֶם:", "rashi_en": "הכתוב כבר סיפר שרבקה היא בת בתואל ואחות לבן ומפדן ארם, וחוזר על כך כדי לשבחה: אף שגדלה בין רשעים, לא למדה ממעשיהם.", "note": "", "points": [{"q": "מדוע חוזר הכתוב ומזכיר את משפחתה ומקומה של רבקה?", "options": ["לשבחה, שגדלה בין רשעים ולא למדה ממעשיהם", "להזכיר שיצחק נשא אשה ממשפחת אברהם", "להסביר מדוע ברח יעקב אחר כך אל לבן"], "kasha": "כבר נכתב בפרשה הקודמת שרבקה היא בת בתואל ואחות לבן ומפדן ארם, ומה הצורך לחזור על כך?", "answer": "להגיד שבחה: היתה בת רשע ואחות רשע ומקומה אנשי רשע, ולא למדה ממעשיהם."}]}, {"id": "25:20.3", "ch": 25, "v": 20, "n": 3, "dh": "מפדן ארם", "pasuk_html": "וַיְהִ֤י יִצְחָק֙ בֶּן־אַרְבָּעִ֣ים שָׁנָ֔ה בְּקַחְתּ֣וֹ אֶת־רִבְקָ֗ה בַּת־בְּתוּאֵל֙ הָֽאֲרַמִּ֔י <mark>מִפַּדַּ֖ן אֲרָ֑ם</mark> אֲח֛וֹת לָבָ֥ן הָאֲרַמִּ֖י ל֥וֹ לְאִשָּֽׁה׃", "pasuk_en": "וְיִצְחָק בֶּן־אַרְבָּעִים שָׁנָה לָקַח אֶת־רִבְקָה בַּת־בְּתוּאֵל הָאֲרַמִּי מִפַּדַּן־אֲרָם אֲחוֹת לָבָן הָאֲרַמִּי לוֹ לְאִשָּׁה׃", "rashi_he": "מפדן ארם. עַל שֵׁם שֶׁשְּׁנֵי אֲרָם הָיוּ, אֲרַם נַהֲרַיִם וַאֲרַם צוֹבָה, קוֹרֵא אוֹתוֹ פַּדָּן, לְשׁוֹן צֶמֶד בָּקָר, תַּרְגּוּם פַּדָּן תּוֹרִין; וְיֵשׁ פּוֹתְרִין פַּדַּן אֲרָם כְּמוֹ שְׂדֵה אֲרָם, שֶׁבִּלְשׁוֹן יִשְׁמָעֵאל קוֹרִין לְשָׂדֶה פַדַּן:", "rashi_en": "המקום נקרא 'פדן ארם' משום שהיו שני ארם, ארם נהרים וארם צובה, ו'פדן' פירושו זוג, כמו 'צמד בקר' שתרגומו 'פדן תורין'. ויש מפרשים 'פדן ארם' כמו 'שדה ארם', שבלשון ישמעאל קוראים לשדה פדן.", "note": "", "points": [{"q": "לפי הפירוש הראשון ברש״י, מה פירוש המילה 'פדן'?", "options": ["זוג, על שם שני ארם: ארם נהרים וארם צובה", "גבול, כי שם עבר הגבול בין ארם לכנען", "נהר, על שם הנהר הגדול שעבר בארץ ארם"], "kasha": "צריך להבין מדוע נקרא המקום 'פדן ארם' ולא 'ארם' סתם.", "answer": "משום שהיו שני ארם, ארם נהרים וארם צובה, נקרא 'פדן', לשון צמד בקר, שתרגומו 'פדן תורין'."}, {"q": "מהו הפירוש השני שמביא רש״י ל'פדן ארם'?", "options": ["שדה ארם, שבלשון ישמעאל קוראים לשדה פדן", "עיר ארם, שבלשון ארמית קוראים לעיר פדן", "הר ארם, שבלשון ישמעאל קוראים להר פדן"], "kasha": "המילה 'פדן' אינה מוכרת בלשון הקודש, ויש לפרשה.", "answer": "יש מפרשים 'פדן ארם' כמו 'שדה ארם', שבלשון ישמעאל קוראים לשדה פדן."}]}, {"id": "25:21.1", "ch": 25, "v": 21, "n": 1, "dh": "ויעתר", "pasuk_html": "<mark>וַיֶּעְתַּ֨ר</mark> יִצְחָ֤ק לַֽיהֹוָה֙ לְנֹ֣כַח אִשְׁתּ֔וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא וַיֵּעָ֤תֶר לוֹ֙ יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיֶּעְתַּר יִצְחָק לַה' לְנוֹכַח אִשְׁתּוֹ כִּי עֲקָרָה הִוא וַיִּעָתֶר לוֹ ה' וַתַּהַר רִבְקָה אִשְׁתּוֹ.", "rashi_he": "ויעתר. הִרְבָּה וְהִפְצִיר בִּתְפִלָּה:", "rashi_en": "'ויעתר' פירושו שיצחק הרבה בתפילה והפציר בה.", "note": "", "points": [{"q": "מה מלמדת המילה 'ויעתר' על תפילתו של יצחק?", "options": ["שהרבה בתפילה והפציר בה", "שהתפלל בקול רם לפני כולם", "שהתפלל פעם אחת ובקצרה"], "kasha": "הכתוב לא אמר 'ויתפלל' אלא 'ויעתר', ויש לפרש מה מוסיפה לשון זו.", "answer": "הרבה והפציר בתפילה."}]}, {"id": "25:21.2", "ch": 25, "v": 21, "n": 2, "dh": "ויעתר לו", "pasuk_html": "וַיֶּעְתַּ֨ר יִצְחָ֤ק לַֽיהֹוָה֙ לְנֹ֣כַח אִשְׁתּ֔וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא <mark>וַיֵּעָ֤תֶר לוֹ֙</mark> יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיֶּעְתַּר יִצְחָק לַה' לְנוֹכַח אִשְׁתּוֹ כִּי עֲקָרָה הִוא וַיִּעָתֶר לוֹ ה' וַתַּהַר רִבְקָה אִשְׁתּוֹ.", "rashi_he": "ויעתר לו. נִתְפַּצֵּר וְנִתְפַּיֵּס וְנִתְפַּתָּה לוֹ. וְאוֹמֵר אֲנִי, כָּל לְשׁוֹן עֶתֶר לְשׁוֹן הַפְצָרָה וְרִבּוּי הוּא, וְכֵן וַעֲתַר עֲנַן הַקְּטֹרֶת (יחז' ח') – מַרְבִּית עֲלִיַּת הֶעָשָׁן, וְכֵן וְהַעְתַּרְתֶּם עָלַי דִּבְרֵיכֶם (שם ל\"ה), וְכֵן וְנַעְתָּרוֹת נְשִׁיקוֹת שׂוֹנֵא (משלי כ\"ז) – דּוֹמוֹת לִמְרֻבּוֹת וְהִנָּם לְמַשָּׂא; אנקרי\"שרא בלע\"ז:", "rashi_en": "ה' נתפצר ונתפייס ונתפתה ליצחק, כלומר נענה להפצרותיו. רש״י מוסיף שכל לשון 'עתר' היא לשון הפצרה וריבוי, כמו 'ועתר ענן הקטרת' שפירושו ריבוי העשן העולה.", "note": "", "points": [{"q": "מה פירוש 'ויעתר לו' האמור על הקב״ה?", "options": ["נתפצר ונתפייס ונתפתה ליצחק", "ענה ליצחק מיד בלי שום עיכוב", "הבטיח ליצחק בנים רבים מאוד"], "kasha": "לשון 'ויעתר' נאמרה גם על יצחק וגם על ה', ויש להבין מה משמעותה אצל ה'.", "answer": "נתפצר ונתפיס ונתפתה לו, כלומר ה' נענה להפצרותיו של יצחק."}, {"q": "מהי המשמעות הכללית של השורש 'עתר' לדעת רש״י?", "options": ["הפצרה וריבוי", "בקשה בלחש ובשקט", "עמידה ממושכת במקום אחד"], "kasha": "השורש 'עתר' מופיע במקומות שונים במקרא, ויש לברר את משמעותו המשותפת.", "answer": "כל לשון עתר לשון הפצרה וריבוי, כמו 'ועתר ענן הקטרת', שהוא ריבוי עליית העשן, וכן 'והעתרתם עלי דבריכם' ו'נעתרות נשיקות שונא'."}]}, {"id": "25:21.3", "ch": 25, "v": 21, "n": 3, "dh": "לנכח אשתו", "pasuk_html": "וַיֶּעְתַּ֨ר יִצְחָ֤ק לַֽיהֹוָה֙ <mark>לְנֹ֣כַח אִשְׁתּ֔וֹ</mark> כִּ֥י עֲקָרָ֖ה הִ֑וא וַיֵּעָ֤תֶר לוֹ֙ יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיֶּעְתַּר יִצְחָק לַה' לְנוֹכַח אִשְׁתּוֹ כִּי עֲקָרָה הִוא וַיִּעָתֶר לוֹ ה' וַתַּהַר רִבְקָה אִשְׁתּוֹ.", "rashi_he": "לנכח אשתו. זֶה עוֹמֵד בְּזָוִית זוֹ וּמִתְפַּלֵּל וְזוֹ עוֹמֶדֶת בְּזָוִית זוֹ וּמִתְפַּלֶּלֶת:", "rashi_en": "יצחק עמד בזווית אחת והתפלל, ורבקה עמדה בזווית שכנגדו והתפללה.", "note": "", "points": [{"q": "מה פירוש 'לנכח אשתו' לפי רש״י?", "options": ["יצחק ורבקה התפללו כל אחד בזווית, זה כנגד זה", "יצחק התפלל בעד אשתו בלי שהיא ידעה מכך", "יצחק התפלל, ורבקה עמדה לידו ושתקה"], "kasha": "מה פירוש 'לנכח', והרי אדם מתפלל לפני ה' ולא כנגד אשתו?", "answer": "זה עומד בזווית זו ומתפלל, וזו עומדת בזווית זו ומתפללת."}]}, {"id": "25:21.4", "ch": 25, "v": 21, "n": 4, "dh": "ויעתר לו", "pasuk_html": "וַיֶּעְתַּ֨ר יִצְחָ֤ק לַֽיהֹוָה֙ לְנֹ֣כַח אִשְׁתּ֔וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא <mark>וַיֵּעָ֤תֶר לוֹ֙</mark> יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיֶּעְתַּר יִצְחָק לַה' לְנוֹכַח אִשְׁתּוֹ כִּי עֲקָרָה הִוא וַיִּעָתֶר לוֹ ה' וַתַּהַר רִבְקָה אִשְׁתּוֹ.", "rashi_he": "ויעתר לו. לוֹ וְלֹא לָהּ, שֶׁאֵין דּוֹמָה תְפִלַּת צַדִּיק בֶּן צַדִּיק לִתְפִלַּת צַדִּיק בֶּן רָשָׁע, לְפִיכָךְ לוֹ וְלֹא לָהּ (יבמות ס\"ד):", "rashi_en": "ה' נענה לתפילת יצחק ולא לתפילת רבקה, כי תפילת צדיק בן צדיק אינה דומה לתפילת צדיק בן רשע.", "note": "", "points": [{"q": "מדוע נאמר 'ויעתר לו' – ליצחק ולא לרבקה?", "options": ["תפילת צדיק בן צדיק גדולה מתפילת צדיק בן רשע", "רבקה לא התפללה כלל, ורק יצחק התפלל", "יצחק התפלל זמן רב יותר מרבקה"], "kasha": "שניהם התפללו, ומדוע נאמר 'ויעתר לו' – ליצחק בלבד?", "answer": "לו ולא לה, שאין דומה תפילת צדיק בן צדיק לתפילת צדיק בן רשע."}]}, {"id": "25:22.1", "ch": 25, "v": 22, "n": 1, "dh": "ויתרוצצו", "pasuk_html": "<mark>וַיִּתְרֹֽצְצ֤וּ</mark> הַבָּנִים֙ בְּקִרְבָּ֔הּ וַתֹּ֣אמֶר אִם־כֵּ֔ן לָ֥מָּה זֶּ֖ה אָנֹ֑כִי וַתֵּ֖לֶךְ לִדְרֹ֥שׁ אֶת־יְהֹוָֽה׃", "pasuk_en": "וַיִּתְרֹצְצוּ הַבָּנִים בְקִרְבָּהּ וַתֹּאמֶר אִם־כֵּן לָמָּה זֶה אָנֹכִי", "rashi_he": "ויתרוצצו. עַ\"כָּ הַמִּקְרָא הַזֶּה אוֹמֵר דָּרְשֵׁנִי, שֶׁסָּתַם מַה הִיא רְצִיצָה זוֹ וְכָתַב אִם כֵּן לָמָּה זֶּה אָנֹכִי? רַבּוֹתֵינוּ דְּרָשׁוּהוּ לְשׁוֹן רִיצָה; כְּשֶׁהָיְתָה עוֹבֶרֶת עַל פִּתְחֵי תּוֹרָה שֶׁל שֵׁם וָעֵבֶר יַעֲקֹב רָץ וּמְפַרְכֵּס לָצֵאת, עוֹבֶרֶת עַל פֶּתַח עֲבוֹדַת אֱלִילִים, עֵשָׂו מְפַרְכֵּס לָצֵאת. דָּבָר אַחֵר מִתְרוֹצְצִים זֶה עִם זֶה וּמְרִיבִים בְּנַחֲלַת שְׁנֵי עוֹלָמוֹת.", "rashi_en": "הפסוק אינו מפרש מה הייתה הרציצה, ורבקה אמרה 'אם כן למה זה אנכי', ולכן יש לדרשו. חז״ל דרשו מלשון ריצה: כשעברה ליד בית מדרשם של שם ועבר יעקב פרכס לצאת, וליד בית עבודה זרה עשו פרכס לצאת. דבר אחר: הבנים התרוצצו ורבו זה עם זה על נחלת שני העולמות.", "note": "", "points": [{"q": "מדוע אומר רש״י שהמקרא הזה 'אומר דרשני'?", "options": ["הכתוב סתם מה הייתה הרציצה, ורבקה אמרה 'למה זה אנכי'", "הכתוב לא פירש מי מהבנים התחיל ראשון במריבה", "הכתוב לא אמר כמה זמן נמשכה הרציצה בבטנה"], "kasha": "הכתוב אינו מפרש מה הייתה הרציצה, ותגובת רבקה מראה שהיה זה דבר חריג.", "answer": "המקרא אומר דרשני, שסתם מה היא רציצה זו וכתב 'אם כן למה זה אנכי'."}, {"q": "לפי הדרש הראשון, מה קרה כשרבקה עברה ליד בית מדרשם של שם ועבר?", "options": ["יעקב רץ ופרכס לצאת", "עשו רץ ופרכס לצאת", "שני הבנים נרגעו ושקטו"], "kasha": "יש לפרש מה עניין ה'התרוצצות' של הבנים בבטן.", "answer": "רבותינו דרשוהו לשון ריצה: כשעברה על פתחי תורה של שם ועבר יעקב רץ ומפרכס לצאת, וכשעברה על פתח עבודה זרה עשו מפרכס לצאת. דבר אחר: מתרוצצים זה עם זה ומריבים בנחלת שני עולמות."}]}, {"id": "25:22.2", "ch": 25, "v": 22, "n": 2, "dh": "ותאמר אם כן", "pasuk_html": "וַיִּתְרֹֽצְצ֤וּ הַבָּנִים֙ בְּקִרְבָּ֔הּ <mark>וַתֹּ֣אמֶר אִם־כֵּ֔ן</mark> לָ֥מָּה זֶּ֖ה אָנֹ֑כִי וַתֵּ֖לֶךְ לִדְרֹ֥שׁ אֶת־יְהֹוָֽה׃", "pasuk_en": "וַיִּתְרֹצְצוּ הַבָּנִים בְקִרְבָּהּ וַתֹּאמֶר אִם כֵּן לָמָּה זֶה אָנֹכִי", "rashi_he": "ותאמר אם כן. גָּדוֹל צַעַר הָעִבּוּר.", "rashi_en": "רבקה אמרה: אם כה גדול צער ההריון...", "note": "", "points": [{"q": "על מה מוסבות המילים 'אם כן' בדברי רבקה?", "options": ["אם כה גדול צער ההריון", "אם יהיו לי שני בנים שונים", "אם לא אלד בזמן הראוי"], "kasha": "המילים 'אם כן' סתומות ואינן מפרשות למה הכוונה.", "answer": "אם כן גדול צער העיבור."}]}, {"id": "25:22.3", "ch": 25, "v": 22, "n": 3, "dh": "למה זה אנכי", "pasuk_html": "וַיִּתְרֹֽצְצ֤וּ הַבָּנִים֙ בְּקִרְבָּ֔הּ וַתֹּ֣אמֶר אִם־כֵּ֔ן <mark>לָ֥מָּה זֶּ֖ה אָנֹ֑כִי</mark> וַתֵּ֖לֶךְ לִדְרֹ֥שׁ אֶת־יְהֹוָֽה׃", "pasuk_en": "וַיִּתְרֹצְצוּ הַבָּנִים בְקִרְבָּהּ וַתֹּאמֶר אִם כֵּן לָמָּה זֶה אָנֹכִי", "rashi_he": "למה זה אנכי. מִתְאַוָּה וּמִתְפַּלֶּלֶת עַל הֵרָיוֹן:", "rashi_en": "רבקה שאלה: אם הצער כה גדול, למה אני מתאווה ומתפללת על הריון?", "note": "", "points": [{"q": "מה שאלה רבקה במילים 'למה זה אנכי'?", "options": ["למה אני מתאווה ומתפללת על הריון", "למה דווקא אני נבחרתי ללדת תאומים", "למה אני שונה משאר הנשים ההרות"], "kasha": "דברי רבקה 'למה זה אנכי' חסרים ואינם מבוארים.", "answer": "למה זה אנכי מתאווה ומתפללת על הריון."}]}, {"id": "25:22.4", "ch": 25, "v": 22, "n": 4, "dh": "ותלך לדרוש", "pasuk_html": "וַיִּתְרֹֽצְצ֤וּ הַבָּנִים֙ בְּקִרְבָּ֔הּ וַתֹּ֣אמֶר אִם־כֵּ֔ן לָ֥מָּה זֶּ֖ה אָנֹ֑כִי <mark>וַתֵּ֖לֶךְ לִדְרֹ֥שׁ</mark> אֶת־יְהֹוָֽה׃", "pasuk_en": "וַתֵּלֶךְ לִדְרוֹשׁ אֶת ה'", "rashi_he": "ותלך לדרוש. לְבֵית מִדְרָשׁוֹ שֶׁל שֵׁם:", "rashi_en": "רבקה הלכה לבית מדרשו של שם.", "note": "", "points": [{"q": "לאן הלכה רבקה כדי 'לדרוש'?", "options": ["לבית מדרשו של שם", "לאוהל אברהם, אבי בעלה", "להר המוריה, מקום העקדה"], "kasha": "לא נאמר לאן הלכה רבקה כדי לדרוש את ה'.", "answer": "לבית מדרשו של שם."}]}, {"id": "25:22.5", "ch": 25, "v": 22, "n": 5, "dh": "לדרוש את ה׳", "pasuk_html": "וַיִּתְרֹֽצְצ֤וּ הַבָּנִים֙ בְּקִרְבָּ֔הּ וַתֹּ֣אמֶר אִם־כֵּ֔ן לָ֥מָּה זֶּ֖ה אָנֹ֑כִי וַתֵּ֖לֶךְ <mark>לִדְרֹ֥שׁ אֶת־יְהֹוָֽה׃</mark>", "pasuk_en": "וַתִּשְׁאַל אֶת ה'", "rashi_he": "לדרוש את ה'. שֶׁיַּגִּיד לָהּ מַה תְּהֵא בְּסוֹפָהּ:", "rashi_en": "רבקה ביקשה שה' יגיד לה מה יהיה בסופה.", "note": "", "points": [{"q": "מה ביקשה רבקה לדעת כשהלכה לדרוש את ה׳?", "options": ["מה יהיה בסופה", "אם הוולד שבבטנה זכר או נקבה", "איך תוכל להקל על צער ההריון"], "kasha": "לא נאמר מה ביקשה רבקה לדרוש מאת ה'.", "answer": "שיגיד לה מה תהא בסופה."}]}, {"id": "25:23.1", "ch": 25, "v": 23, "n": 1, "dh": "ויאמר ה׳ לה", "pasuk_html": "<mark>וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ</mark> שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ וּשְׁנֵ֣י לְאֻמִּ֔ים מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ וּלְאֹם֙ מִלְאֹ֣ם יֶֽאֱמָ֔ץ וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וַיֹּאמֶר ה' לָהּ", "rashi_he": "ויאמר ה' לה. עַל יְדֵי שָׁלִיחַ; לְשֵׁם נֶאֱמַר בְּרוּחַ הַקֹּדֶשׁ וְהוּא אָמַר לָהּ (בראשית רבה):", "rashi_en": "ה' לא דיבר עם רבקה ישירות אלא על ידי שליח: לשם נאמרו הדברים ברוח הקודש, והוא אמר אותם לה.", "note": "", "points": [{"q": "כיצד נאמרו לרבקה דברי ה׳?", "options": ["על ידי שם, שנאמר לו ברוח הקודש", "בחלום הלילה, כמו שנאמר לאבימלך", "על ידי מלאך שנגלה אליה בדרך"], "kasha": "וכי ה' דיבר עם רבקה בעצמו?", "answer": "על ידי שליח: לשם נאמר ברוח הקודש, והוא אמר לה."}]}, {"id": "25:23.2", "ch": 25, "v": 23, "n": 2, "dh": "שני גוים בבטנך", "pasuk_html": "וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ וּשְׁנֵ֣י לְאֻמִּ֔ים מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ וּלְאֹם֙ מִלְאֹ֣ם יֶֽאֱמָ֔ץ וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וַיֹּאמֶר יְהוָה לָהּ שְׁנֵי גוֹיִם בִּבִטְנֵךְ וּשְׁנֵי לְאֻמִּים מִמְּעַיִךְ יִפָּרֵדוּ וּלְאֹם מִלְאֹם יֶאֱמָץ וְרַב יַעֲבֹד אֶת הַקָּטָן", "rashi_he": "שני גוים בבטנך. גיים כְּתִיב; אֵלּוּ אַנְטוֹנִינוּס וְרַבִּי, שֶׁלֹּא פָסְקוּ מֵעַל שֻׁלְחָנָם לֹא צְנוֹן וְלֹא חֲזֶרֶת לֹא בִימוֹת הַחַמָּה וְלֹא בִימוֹת הַגְּשָׁמִים (עבודה זרה י\"א):", "rashi_en": "המילה כתובה 'גיים', ורומזת לאנטונינוס ולרבי, שעל שולחנם לא חסרו צנון וחזרת לא בקיץ ולא בחורף.", "note": "", "points": [{"q": "מה דורש רש״י מכך שכתוב 'גיים'?", "options": ["רמז לאנטונינוס ורבי, שעל שולחנם לא חסרו צנון וחזרת", "רמז לכך שיעקב ועשו יהיו שני עמים נפרדים", "רמז לכך שמבני עשו ייצאו גרים צדיקים"], "kasha": "המילה 'גוים' כתובה בכתיב שונה, 'גיים', ויש לדרוש את השינוי.", "answer": "גיים כתיב: אלו אנטונינוס ורבי, שלא פסקו מעל שולחנם צנון וחזרת, לא בימות החמה ולא בימות הגשמים."}]}, {"id": "25:23.3", "ch": 25, "v": 23, "n": 3, "dh": "ושני לאמים", "pasuk_html": "וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ <mark>וּשְׁנֵ֣י לְאֻמִּ֔ים</mark> מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ וּלְאֹם֙ מִלְאֹ֣ם יֶֽאֱמָ֔ץ וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וַיֹּאמֶר יְהוָה לָהּ שְׁנֵי גוֹיִם בִּבִטְנֵךְ וּשְׁנֵי לְאֻמִּים מִמְּעַיִךְ יִפָּרֵדוּ וּלְאֹם מִלְאֹם יֶאֱמָץ וְרַב יַעֲבֹד אֶת הַקָּטָן", "rashi_he": "ושני לאמים. אֵין לְאֹם אֶלָּא מַלְכוּת:", "rashi_en": "'לאום' פירושו מלכות: מבטנה ייצאו שתי מלכויות.", "note": "", "points": [{"q": "מה פירוש 'לאמים' לפי רש״י?", "options": ["מלכויות", "שבטים", "לשונות"], "kasha": "הכתוב כבר אמר 'שני גוים', ומה מוסיף 'ושני לאמים'?", "answer": "אין לאום אלא מלכות."}]}, {"id": "25:23.4", "ch": 25, "v": 23, "n": 4, "dh": "ממעיך יפרדו", "pasuk_html": "וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ וּשְׁנֵ֣י לְאֻמִּ֔ים <mark>מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ</mark> וּלְאֹם֙ מִלְאֹ֣ם יֶֽאֱמָ֔ץ וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת וְהִנֵּה תְאוֹמִים בְּבִטְנָהּ", "rashi_he": "ממעיך יפרדו. מִן הַמֵּעַיִם הֵם נִפְרָדִים זֶה לְרִשְׁעוֹ וְזֶה לְתֻמּוֹ:", "rashi_en": "כבר מן הרחם ייפרדו הבנים בדרכיהם: זה לרשעו וזה לתומו.", "note": "", "points": [{"q": "מה מלמד 'ממעיך יפרדו'?", "options": ["כבר מן הרחם ייפרדו, זה לרשעו וזה לתומו", "כשיגדלו ייפרדו ויגורו בארצות שונות", "בשעת הלידה ייפרדו זה מזה בכוח"], "kasha": "מה החידוש בכך שהתאומים ייפרדו 'ממעיך'?", "answer": "מן המעיים הם נפרדים, זה לרשעו וזה לתומו."}]}, {"id": "25:23.5", "ch": 25, "v": 23, "n": 5, "dh": "מלאם יאמץ", "pasuk_html": "וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ וּשְׁנֵ֣י לְאֻמִּ֔ים מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ וּלְאֹם֙ <mark>מִלְאֹ֣ם יֶֽאֱמָ֔ץ</mark> וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וְלְאֹם מִלְאֹם יֶאֱמָץ וְרַב יַעֲבֹד אֶת הַקָּטָן", "rashi_he": "מלאם יאמץ. לֹא יִשְׁווּ בִּגְדֻלָּה, כְּשֶׁזֶּה קָם זֶה נוֹפֵל, וְכֵן הוּא אוֹמֵר אִמָּלְאָה הָחֳרָבָה (יחזקאל כ\"ו), לֹא נִתְמַלְּאָה צוֹר אֶלָּא מֵחֻרְבָּנָהּ שֶׁל יְרוּשָׁלַיִם:", "rashi_en": "שני העמים לא יהיו גדולים בבת אחת: כשזה קם זה נופל. כך אמרה צור 'אמלאה החרבה' – צור התמלאה רק מחורבנה של ירושלים.", "note": "", "points": [{"q": "מה מלמד 'ולאם מלאם יאמץ'?", "options": ["לא ישוו בגדולה – כשזה קם זה נופל", "שניהם יהיו חזקים יחד לעולם", "עשו יהיה תמיד חזק מיעקב"], "kasha": "יש להבין מה פירוש שלאום אחד יתחזק מן הלאום האחר.", "answer": "לא ישוו בגדולה; כשזה קם זה נופל, כמו שנאמר 'אמלאה החרבה' – לא נתמלאה צור אלא מחורבנה של ירושלים."}]}, {"id": "25:24.1", "ch": 25, "v": 24, "n": 1, "dh": "וימלאו ימיה", "pasuk_html": "<mark>וַיִּמְלְא֥וּ יָמֶ֖יהָ</mark> לָלֶ֑דֶת וְהִנֵּ֥ה תוֹמִ֖ם בְּבִטְנָֽהּ׃", "pasuk_en": "וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת וְהִנֵּה תְאוֹמִים בְּבִטְנָהּ", "rashi_he": "וימלאו ימיה. אֲבָל בְּתָמָר כְּתִיב וַיְהִי בְּעֵת לִדְתָּהּ (בראשית ל״ח:כ״ז), שֶׁלֹּא מָלְאוּ יָמֶיהָ, כִּי לְז' חֳדָשִׁים יְלָדָתַם:", "rashi_en": "אצל רבקה נאמר 'וימלאו ימיה', אבל אצל תמר נאמר 'ויהי בעת לדתה', כי ימיה לא מלאו – היא ילדה לשבעה חודשים.", "note": "", "points": [{"q": "מדוע אצל תמר לא נאמר 'וימלאו ימיה' כמו אצל רבקה?", "options": ["תמר ילדה לשבעה חודשים, ולא מלאו ימיה", "תמר ילדה בצער גדול יותר מרבקה", "תמר לא התפללה על הריונה כמו רבקה"], "kasha": "מה בא הכתוב ללמד באמרו כאן 'וימלאו ימיה', כשאצל תמר נאמרה לשון אחרת?", "answer": "אצל רבקה מלאו ימיה, אבל בתמר כתוב 'ויהי בעת לדתה', שלא מלאו ימיה, כי לשבעה חודשים ילדתם."}]}, {"id": "25:24.2", "ch": 25, "v": 24, "n": 2, "dh": "והנה תומם", "pasuk_html": "וַיִּמְלְא֥וּ יָמֶ֖יהָ לָלֶ֑דֶת <mark>וְהִנֵּ֥ה תוֹמִ֖ם</mark> בְּבִטְנָֽהּ׃", "pasuk_en": "וּלְעֵת לִדְתָּהּ, הִנֵּה תוֹמִם בְּבִטְנָהּ.", "rashi_he": "והנה תומם. חָסֵר, וּבְתָמָר תְּאוֹמִים מָלֵא, לְפִי שֶׁשְּׁנֵיהֶם צַדִּיקִים; אֲבָל כָּאן אֶחָד צַדִּיק וְאֶחָד רָשָׁע:", "rashi_en": "המילה 'תומם' כתובה חסר, ואצל תמר 'תאומים' כתוב מלא, כי שני בני תמר היו צדיקים, ואילו כאן אחד צדיק ואחד רשע.", "note": "", "points": [{"q": "מדוע 'תומם' כתוב חסר, ואצל תמר 'תאומים' כתוב מלא?", "options": ["כאן אחד צדיק ואחד רשע, ובני תמר שניהם צדיקים", "כאן נולדו התאומים בזמנם, ותמר ילדה לשבעה", "כאן נולד אחד מהם חלש וקטן מאחיו"], "kasha": "המילה 'תומם' כתובה בכתיב חסר, שלא כמו אצל תמר.", "answer": "בתמר 'תאומים' מלא, לפי ששניהם צדיקים, אבל כאן אחד צדיק ואחד רשע."}]}, {"id": "25:25.1", "ch": 25, "v": 25, "n": 1, "dh": "אדמוני", "pasuk_html": "וַיֵּצֵ֤א הָרִאשׁוֹן֙ <mark>אַדְמוֹנִ֔י</mark> כֻּלּ֖וֹ כְּאַדֶּ֣רֶת שֵׂעָ֑ר וַיִּקְרְא֥וּ שְׁמ֖וֹ עֵשָֽׂו׃", "pasuk_en": "וַיֵּצֵא הָרִאשׁוֹן אַדְמוֹנִי, כֻּלּוֹ כַּאֲדֶרֶת שֵׂעָר; וַיִּקְרְאוּ שְׁמוֹ עֵשָׂו.", "rashi_he": "אדמוני. סִימָן הוּא שֶׁיְּהֵא שׁוֹפֵךְ דָּמִים (בראשית רבה):", "rashi_en": "צבעו האדום של עשו היה סימן שיהיה שופך דמים.", "note": "", "points": [{"q": "על מה מרמז היותו של עשו 'אדמוני'?", "options": ["שיהיה שופך דמים", "שיהיה איש שדה וצייד", "שיהיה עשיר ובעל נכסים"], "kasha": "מדוע מספר הכתוב על צבעו של עשו בשעת לידתו?", "answer": "סימן הוא שיהא שופך דמים."}]}, {"id": "25:25.2", "ch": 25, "v": 25, "n": 2, "dh": "כלו כאדרת שער", "pasuk_html": "וַיֵּצֵ֤א הָרִאשׁוֹן֙ אַדְמוֹנִ֔י <mark>כֻּלּ֖וֹ כְּאַדֶּ֣רֶת שֵׂעָ֑ר</mark> וַיִּקְרְא֥וּ שְׁמ֖וֹ עֵשָֽׂו׃", "pasuk_en": "וַיֵּצֵא הָרִאשׁוֹן אַדְמוֹנִי, כֻּלּוֹ כַּאֲדֶרֶת שֵׂעָר; וַיִּקְרְאוּ שְׁמוֹ עֵשָׂו.", "rashi_he": "כלו כאדרת שער. מָלֵא שֵׂעָר כְּטַלִּית שֶׁל צֶמֶר הַמְלֵאָה שֵׂעָר, פלוקי\"דא בלע\"ז:", "rashi_en": "עשו היה מלא שיער, כמו טלית של צמר המלאה שיער.", "note": "", "points": [{"q": "למה מדמה הכתוב את עשו במילים 'כאדרת שער'?", "options": ["לטלית של צמר המלאה שיער", "לאדרת מלכים מפוארת ויקרה", "לעורו של תיש שעיר"], "kasha": "מה פירוש 'אדרת שער' בהקשר זה?", "answer": "מלא שיער כטלית של צמר המלאה שיער (פלוקי״דא בלע״ז)."}]}, {"id": "25:25.3", "ch": 25, "v": 25, "n": 3, "dh": "ויקראו שמו עשו", "pasuk_html": "וַיֵּצֵ֤א הָרִאשׁוֹן֙ אַדְמוֹנִ֔י כֻּלּ֖וֹ כְּאַדֶּ֣רֶת שֵׂעָ֑ר <mark>וַיִּקְרְא֥וּ שְׁמ֖וֹ עֵשָֽׂו׃</mark>", "pasuk_en": "וַיֵּצֵא הָרִאשׁוֹן אַדְמוֹנִי, כֻּלּוֹ כַּאֲדֶרֶת שֵׂעָר; וַיִּקְרְאוּ שְׁמוֹ עֵשָׂו.", "rashi_he": "ויקראו שמו עשו. הַכֹּל קָרְאוּ לוֹ כֵן, לְפִי שֶׁהָיָה נַעֲשֶׂה וְנִגְמָר בִּשְׂעָרוֹ כְבֶן שָׁנִים הַרְבֵּה:", "rashi_en": "כולם קראו לו עשו, כי כבר בלידתו היה ״עשוי״ וגמור בשערו, כמו ילד בן כמה שנים.", "note": "", "points": [{"q": "מדוע נקרא שמו של עשו בשם זה?", "options": ["כי נולד עשוי וגמור בשערו כבן שנים רבות", "כי עשה מעשים רעים כבר בבטן אמו", "כי נולד אדמוני כולו, כצבע הדם"], "kasha": "הכתוב אינו מסביר מה טעם השם ״עשו״.", "answer": "לפי שהיה נעשה ונגמר בשערו כבן שנים הרבה."}, {"q": "מי קרא לעשו בשמו, לפי רש״י?", "options": ["כל האנשים קראו לו כן", "יצחק אביו בלבד קרא לו כן", "הקב״ה קרא לו כן"], "kasha": "נאמר ״ויקראו״ בלשון רבים, ולא נאמר מי קרא לו.", "answer": "הכל קראו לו כן."}]}, {"id": "25:26.1", "ch": 25, "v": 26, "n": 1, "dh": "ואחרי כן יצא אחיו", "pasuk_html": "<mark>וְאַֽחֲרֵי־כֵ֞ן יָצָ֣א אָחִ֗יו</mark> וְיָד֤וֹ אֹחֶ֙זֶת֙ בַּעֲקֵ֣ב עֵשָׂ֔ו וַיִּקְרָ֥א שְׁמ֖וֹ יַעֲקֹ֑ב וְיִצְחָ֛ק בֶּן־שִׁשִּׁ֥ים שָׁנָ֖ה בְּלֶ֥דֶת אֹתָֽם׃", "pasuk_en": "וְאַחֲרֵי כֵן יָצָא אָחִיו וְיָדוֹ אוֹחֶזֶת בַּעֲקֵב עֵשָׂו; וַיִּקְרָא שְׁמוֹ יַעֲקֹב.", "rashi_he": "ואחרי כן יצא אחיו וגו'. שָׁמַעְתִּי מִ\"אַ הַדּוֹרְשׁוֹ לְפִי פְּשׁוּטוֹ, בְּדִין הָיָה אוֹחֵז בּוֹ לְעַכְּבוֹ, יַעֲקֹב נוֹצַר מִטִּפָּה רִאשׁוֹנָה וְעֵשָׂו מִן הַשְּׁנִיָּה; צֵא וּלְמַד מִשְּׁפוֹפֶרֶת שֶׁפִּיהָ קְצָרָה, תֵּן לָהּ שְׁתֵּי אֲבָנִים זוֹ אַחַר זוֹ – הַנִּכְנֶסֶת רִאשׁוֹנָה תֵּצֵא אַחֲרוֹנָה וְהַנִּכְנֶסֶת אַחֲרוֹנָה תֵּצֵא רִאשׁוֹנָה; נִמְצָא עֵשָׂו הַנּוֹצָר בָּאַחֲרוֹנָה יָצָא רִאשׁוֹן וְיַעֲקֹב שֶׁנּוֹצַר רִאשׁוֹנָה יָצָא אַחֲרוֹן, וְיַעֲקֹב בָּא לְעַכְּבוֹ, שֶׁיְּהֵא רִאשׁוֹן לְלֵדָה כְּרִאשׁוֹן לִיצִירָה, וְיִפְטֹר אֶת רַחְמָהּ וְיִטֹּל אֶת הַבְּכוֹרָה מִן הַדִּין:", "rashi_en": "יעקב נוצר מן הטיפה הראשונה ועשו מן השנייה. כמו בשפופרת צרה, מה שנכנס ראשון יוצא אחרון, ולכן עשו יצא ראשון. יעקב אחז בו בצדק כדי לעכבו, לצאת ראשון ולקבל את הבכורה כדין.", "note": "", "points": [{"q": "לפי המדרש שהביא רש״י, מדוע אחז יעקב בעקב עשו?", "options": ["כדי לעכבו ולצאת ראשון, כי הוא נוצר ראשון", "כדי להראות שהוא חזק מעשו כבר בבטן", "כדי שלא ייפרדו זה מזה בשעת הלידה"], "kasha": "מה טעם יש בכך שיעקב אחז בעקב אחיו בשעת הלידה?", "answer": "בדין היה אוחז בו לעכבו, שיהא ראשון ללידה כמו שהיה ראשון ליצירה, ויטול את הבכורה מן הדין."}, {"q": "מה מלמד משל השפופרת שפיה קצרה?", "options": ["שהנכנס ראשון יוצא אחרון, ולכן יעקב שנוצר ראשון יצא אחרון", "שהגדול והחזק יוצא תמיד ראשון מן הרחם", "שהתאומים נוצרו יחד ויצאו זה אחר זה במקרה"], "kasha": "אם יעקב נוצר ראשון, מדוע יצא עשו לפניו?", "answer": "בשפופרת צרה, האבן שנכנסת ראשונה יוצאת אחרונה; לכן עשו שנוצר אחרון יצא ראשון, ויעקב שנוצר ראשון יצא אחרון."}]}, {"id": "25:26.2", "ch": 25, "v": 26, "n": 2, "dh": "בעקב עשו", "pasuk_html": "וְאַֽחֲרֵי־כֵ֞ן יָצָ֣א אָחִ֗יו וְיָד֤וֹ אֹחֶ֙זֶת֙ <mark>בַּעֲקֵ֣ב עֵשָׂ֔ו</mark> וַיִּקְרָ֥א שְׁמ֖וֹ יַעֲקֹ֑ב וְיִצְחָ֛ק בֶּן־שִׁשִּׁ֥ים שָׁנָ֖ה בְּלֶ֥דֶת אֹתָֽם׃", "pasuk_en": "וְאַחַר כֵּן יָצָא אָחִיו וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו וַיִּקְרָא שְׁמוֹ יַעֲקֹב וְיִצְחָק בֶּן־שִׁשִּׁים שָׁנָה בְּלֶדְתָּם אֶת־הַתּוֹם׃", "rashi_he": "בעקב עשו. סִימָן שֶׁאֵין זֶה מַסְפִּיק לִגְמֹר מַלְכוּתוֹ עַד שֶׁזֶּה עוֹמֵד וְנוֹטְלָהּ הֵימֶנּוּ:", "rashi_en": "האחיזה בעקב היא סימן שעשו בקושי יספיק לגמור את מלכותו, וכבר יקום יעקב ויטול אותה ממנו.", "note": "", "points": [{"q": "על מה רומזת אחיזת יד יעקב דווקא בעקב עשו?", "options": ["שמלכות עשו לא תיגמר עד שיעקב יקום ויטלנה ממנו", "שיעקב ישתעבד לעשו עד סוף כל הדורות", "שעשו ויעקב ימלכו יחד באותו הזמן"], "kasha": "מדוע מדגיש הכתוב שהיד אחזה דווקא בעקב?", "answer": "סימן שאין עשו מספיק לגמור את מלכותו עד שיעקב עומד ונוטלה ממנו."}]}, {"id": "25:26.3", "ch": 25, "v": 26, "n": 3, "dh": "ויקרא שמו יעקב", "pasuk_html": "וְאַֽחֲרֵי־כֵ֞ן יָצָ֣א אָחִ֗יו וְיָד֤וֹ אֹחֶ֙זֶת֙ בַּעֲקֵ֣ב עֵשָׂ֔ו <mark>וַיִּקְרָ֥א שְׁמ֖וֹ יַעֲקֹ֑ב</mark> וְיִצְחָ֛ק בֶּן־שִׁשִּׁ֥ים שָׁנָ֖ה בְּלֶ֥דֶת אֹתָֽם׃", "pasuk_en": "וְאַחַר כֵּן יָצָא אָחִיו וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו וַיִּקְרָא שְׁמוֹ יַעֲקֹב וְיִצְחָק בֶּן־שִׁשִּׁים שָׁנָה בְּלֶדְתָּם אֶת־הַתּוֹם׃", "rashi_he": "ויקרא שמו יעקב. הַקָּבָּ\"ה; דָּ\"אַ אָבִיו קָרָא לוֹ יַעֲקֹב עַל שֵׁם אֲחִיזַת הֶעָקֵב:", "rashi_en": "הקב״ה קרא לו יעקב. ולפי פירוש אחר, יצחק אביו קרא לו כך על שם שאחז בעקב אחיו.", "note": "", "points": [{"q": "לפי הפירוש הראשון ברש״י, מי קרא ליעקב בשמו?", "options": ["הקב״ה קרא לו יעקב", "יצחק אביו קרא לו יעקב", "רבקה אמו קראה לו יעקב"], "kasha": "נאמר ״ויקרא״ בלשון יחיד ולא נאמר מי קרא, בשונה מ״ויקראו״ שנאמר אצל עשו.", "answer": "הקב״ה קרא לו יעקב."}, {"q": "לפי ה״דבר אחר״ ברש״י, על שם מה קרא לו אביו יעקב?", "options": ["על שם שאחז בעקב אחיו בשעת הלידה", "על שם שעתיד לעקוב את אחיו ולרמותו", "על שם שיצא אחרון, בעקבות אחיו"], "kasha": "הכתוב אינו מפרש את טעם השם ״יעקב״.", "answer": "אביו קרא לו יעקב על שם אחיזת העקב."}]}, {"id": "25:26.4", "ch": 25, "v": 26, "n": 4, "dh": "בן ששים שנה", "pasuk_html": "וְאַֽחֲרֵי־כֵ֞ן יָצָ֣א אָחִ֗יו וְיָד֤וֹ אֹחֶ֙זֶת֙ בַּעֲקֵ֣ב עֵשָׂ֔ו וַיִּקְרָ֥א שְׁמ֖וֹ יַעֲקֹ֑ב וְיִצְחָ֛ק <mark>בֶּן־שִׁשִּׁ֥ים שָׁנָ֖ה</mark> בְּלֶ֥דֶת אֹתָֽם׃", "pasuk_en": "וְאַחַר כֵּן יָצָא אָחִיו וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו וַיִּקְרָא שְׁמוֹ יַעֲקֹב וְיִצְחָק בֶּן־שִׁשִּׁים שָׁנָה בְּלֶדְתָּם אֶת־הַתּוֹם׃", "rashi_he": "בן ששים שנה. י' שָׁנִים מִשֶּׁנְּשָׂאָהּ עַד שֶׁנַּעֲשֵׂית בַּת י\"ג שָׁנָה וּרְאוּיָה לְהֵרָיוֹן, וְי' שָׁנִים הַלָּלוּ צָפָה וְהִִמְתִּין לָהּ, כְּמוֹ שֶׁעָשָׂה אָבִיו לְשָׂרָה; כֵּיוָן שֶׁלֹּא נִתְעַבְּרָה, יָדַע שֶׁהִיא עֲקָרָה, וְהִתְפַּלֵּל עָלֶיהָ (יבמות ס\"ד), וְשִׁפְחָה לֹא רָצָה לִשָּׂא, לְפִי שֶׁנִּתְקַדֵּשׁ בְּהַר הַמּוֹרִיָּה לִהְיוֹת עוֹלָה תְמִימָה:", "rashi_en": "יצחק המתין עשר שנים עד שרבקה הגיעה לגיל שלוש עשרה והייתה ראויה להריון, ועוד עשר שנים כמו שעשה אברהם לשרה. כשלא נתעברה, הבין שהיא עקרה והתפלל עליה. שפחה לא רצה לשאת, כי נתקדש בהר המוריה להיות עולה תמימה.", "note": "", "points": [{"q": "מדוע עברו עשרים שנה עד שהתפלל יצחק על רבקה?", "options": ["עשר עד שרבקה הייתה ראויה להריון, ועוד עשר כמו אברהם", "כי עשרים שנה הם הזמן שקבעה התורה לכל אשה", "כי חיכה שרבקה תתפלל בעצמה תחילה ותיענה"], "kasha": "מדוע מציין הכתוב את גילו של יצחק בלידת בניו?", "answer": "עשר שנים משנשאה עד שנעשתה בת שלוש עשרה וראויה להריון, ועוד עשר שנים צפה והמתין לה, כמו שעשה אביו לשרה; וכיון שלא נתעברה, ידע שהיא עקרה והתפלל עליה."}, {"q": "מדוע לא נשא יצחק שפחה, כמו שעשה אברהם?", "options": ["כי נתקדש בהר המוריה להיות עולה תמימה", "כי רבקה לא הסכימה לתת לו את שפחתה", "כי ראה שהשפחה גרמה צרות בבית אברהם"], "kasha": "אברהם נשא את הגר כששרה לא ילדה; מדוע יצחק לא עשה כן?", "answer": "שפחה לא רצה לשאת, לפי שנתקדש בהר המוריה להיות עולה תמימה."}]}, {"id": "25:27.1", "ch": 25, "v": 27, "n": 1, "dh": "ויגדלו הנערים", "pasuk_html": "<mark>וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים</mark> וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃", "pasuk_en": "וַיִּגְדְּלוּ הַנְּעָרִים וַיְהִי עֵשָׂו אִישׁ יֹדֵעַ צַיִד אִישׁ שָׂדֶה וְיַעֲקֹב אִישׁ תָּם יֹשֵׁב אֹהָלִים׃", "rashi_he": "ויגדלו … ויהי עשו. כָּל זְמַן שֶׁהָיוּ קְטַנִּים, לֹא הָיוּ נִכָּרִים בְּמַעֲשֵׂיהֶם, וְאֵין אָדָם מְדַקְדֵּק בָּהֶם מַה טִּיבָם; כֵּיוָן שֶׁנַּעֲשׂוּ בְנֵי שְׁלשׁ עֶשְׂרֵה שָׁנָה, זֶה פֵּרֵשׁ לְבָתֵּי מִדְרָשׁוֹת וְזֶה פֵּרֵשׁ לַעֲ\"זָ:", "rashi_en": "כל זמן שהיו קטנים לא היה ההבדל ביניהם ניכר. כשהגיעו לגיל שלוש עשרה, יעקב פנה לבתי המדרש ועשו פנה לעבודה זרה.", "note": "", "points": [{"q": "מתי התגלה ההבדל בין יעקב לעשו?", "options": ["כשהגיעו לגיל שלוש עשרה", "כבר ביום שנולדו", "ביום שמת אברהם סבם"], "kasha": "מדוע ההבדל בין האחים מתואר דווקא אחרי ״ויגדלו הנערים״?", "answer": "כל זמן שהיו קטנים לא היו ניכרים במעשיהם; כיון שנעשו בני שלוש עשרה, זה פרש לבתי מדרשות וזה פרש לעבודה זרה."}]}, {"id": "25:27.2", "ch": 25, "v": 27, "n": 2, "dh": "ידע ציד", "pasuk_html": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ <mark>יֹדֵ֥עַ צַ֖יִד</mark> אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃", "pasuk_en": "וַיִּגְדְּלוּ הַנְּעָרִים וַיְהִי עֵשָׂו אִישׁ יֹדֵעַ צַיִד אִישׁ שָׂדֶה וְיַעֲקֹב אִישׁ תָּם יֹשֵׁב אֹהָלִים׃", "rashi_he": "ידע ציד. לָצוּד וּלְרַמּוֹת אֶת אָבִיו בְּפִיו וְשׁוֹאֲלוֹ אַבָּא, הַאֵיךְ מְעַשְּׂרִין אֶת הַמֶּלַח וְאֶת הַתֶּבֶן? כַּסָּבוּר אָבִיו שֶׁהוּא מְדַקְדֵּק בְּמִצְוֹת (תנחומא):", "rashi_en": "עשו ידע ״לצוד״ את אביו בדיבורו: הוא שאל שאלות כמו איך מעשרים מלח ותבן, ויצחק חשב שהוא מדקדק במצוות.", "note": "", "points": [{"q": "מה פירוש ״ידע ציד״ לפי רש״י?", "options": ["ידע לצוד ולרמות את אביו בדיבורו", "ידע לצוד חיות ועופות בקשתו", "ידע להכין מטעמים מן הציד לאביו"], "kasha": "צייד חיות כבר מתואר ב״איש שדה״; מה מוסיף ״ידע ציד״?", "answer": "ידע לצוד ולרמות את אביו בפיו."}, {"q": "מה רצה עשו להשיג בשאלה ״האיך מעשרין את המלח ואת התבן״?", "options": ["שאביו יחשוב שהוא מדקדק במצוות", "ללמוד באמת את הלכות המעשרות", "להקשות על אביו ולהביך אותו"], "kasha": "כיצד הצליח עשו לרמות את אביו בפיו?", "answer": "שאל את אביו איך מעשרים את המלח ואת התבן, וסבר אביו שהוא מדקדק במצוות."}]}, {"id": "25:27.3", "ch": 25, "v": 27, "n": 3, "dh": "איש שדה", "pasuk_html": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד <mark>אִ֣ישׁ שָׂדֶ֑ה</mark> וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃", "pasuk_en": "כַּאֲשֶׁר גָּדְלוּ הַנְּעָרִים, הָיָה עֵשָׂו אִישׁ יוֹדֵעַ צַיִד אִישׁ שָׂדֶה; וְיַעֲקֹב אִישׁ תָּם יוֹשֵׁב אֹהָלִים.", "rashi_he": "איש שדה. כְּמַשְׁמָעוֹ, אָדָם בָּטֵל וְצוֹדֶה בְקַשְׁתּוֹ חַיּוֹת וְעוֹפוֹת:", "rashi_en": "כפשוטו: אדם בטל, שצד בקשתו חיות ועופות.", "note": "", "points": [{"q": "מה פירוש ״איש שדה״ לפי רש״י?", "options": ["אדם בטל שצד בקשתו חיות ועופות", "חקלאי שעובד את שדותיו כל היום", "אדם שגר בשדות, רחוק מן העיר"], "kasha": "״איש שדה״ יכול להתפרש גם כעובד אדמה; מה כוונת הכתוב?", "answer": "כמשמעו: אדם בטל, וצד בקשתו חיות ועופות."}]}, {"id": "25:27.4", "ch": 25, "v": 27, "n": 4, "dh": "תם", "pasuk_html": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ <mark>תָּ֔ם</mark> יֹשֵׁ֖ב אֹהָלִֽים׃", "pasuk_en": "כַּאֲשֶׁר גָּדְלוּ הַנְּעָרִים, הָיָה עֵשָׂו אִישׁ יוֹדֵעַ צַיִד אִישׁ שָׂדֶה; וְיַעֲקֹב אִישׁ תָּם יוֹשֵׁב אֹהָלִים.", "rashi_he": "תם. אֵינוֹ בָקִי בְכָל אֵלֶּה, כְּלִבּוֹ כֵּן פִּיו, מִי שֶׁאֵינוֹ חָרִיף לְרַמּוֹת קָרוּי תָּם:", "rashi_en": "יעקב לא היה בקי בכל הרמאויות האלה; מה שבליבו היה בפיו. מי שאינו חריף לרמות נקרא תם.", "note": "", "points": [{"q": "מה פירוש ״תם״ אצל יעקב?", "options": ["מי שאינו חריף לרמות, וכלבו כן פיו", "מי שאינו מבין דבר ואינו יודע ללמוד", "מי ששלם בגופו ואין בו שום מום"], "kasha": "״תם״ בא כניגוד ל״ידע ציד״ של עשו; מה פירושו?", "answer": "אינו בקי בכל אלה; כלבו כן פיו, ומי שאינו חריף לרמות קרוי תם."}]}, {"id": "25:27.5", "ch": 25, "v": 27, "n": 5, "dh": "יושב אהלים", "pasuk_html": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם <mark>יֹשֵׁ֖ב אֹהָלִֽים׃</mark>", "pasuk_en": "כַּאֲשֶׁר גָּדְלוּ הַנְּעָרִים, הָיָה עֵשָׂו אִישׁ יוֹדֵעַ צַיִד אִישׁ שָׂדֶה; וְיַעֲקֹב אִישׁ תָּם יוֹשֵׁב אֹהָלִים.", "rashi_he": "ישב אהלים. אָהֳלוֹ שֶׁל שֵׁם וְאָהֳלוֹ שֶׁל עֵבֶר:", "rashi_en": "״אהלים״ בלשון רבים: אוהלו של שם ואוהלו של עבר.", "note": "", "points": [{"q": "אילו אוהלים הם ה״אהלים״ שבהם ישב יעקב?", "options": ["אוהלו של שם ואוהלו של עבר", "אוהלו של אברהם ואוהלו של יצחק", "אוהל אביו ואוהל אמו"], "kasha": "מדוע נאמר ״אהלים״ בלשון רבים?", "answer": "אהלו של שם ואהלו של עבר."}]}, {"id": "25:28.1", "ch": 25, "v": 28, "n": 1, "dh": "בפיו", "pasuk_html": "וַיֶּאֱהַ֥ב יִצְחָ֛ק אֶת־עֵשָׂ֖ו כִּי־צַ֣יִד <mark>בְּפִ֑יו</mark> וְרִבְקָ֖ה אֹהֶ֥בֶת אֶֽת־יַעֲקֹֽב׃", "pasuk_en": "וַיֶּאֱהַב יִצְחָק אֶת־עֵשָׂו כִּי־צַיִד בְּפִיו וְרִבְקָה אֹהֶבֶת אֶת־יַעֲקֹב", "rashi_he": "בפיו. כְּתַרְגּוּמוֹ בְּפִיו שֶׁל יִצְחָק. וּמִדְרָשׁוֹ בְּפִיו שֶׁל עֵשָׂו, שֶׁהָיָה צָד אוֹתוֹ וּמְרַמֵּהוּ בִדְבָרָיו:", "rashi_en": "לפי התרגום, הציד היה בפיו של יצחק, שאכל ממנו. לפי המדרש, הציד היה בפיו של עשו, שצד את אביו ורימה אותו בדבריו.", "note": "", "points": [{"q": "לפי התרגום, בפיו של מי היה הציד?", "options": ["בפיו של יצחק, שאכל מן הציד", "בפיו של עשו, שרימה את אביו בדבריו", "בפיו של יעקב, שבישל את התבשיל"], "kasha": "המילה ״בפיו״ אינה מפרשת בפיו של מי מדובר.", "answer": "כתרגומו: בפיו של יצחק."}, {"q": "לפי המדרש, מה פירוש ״כי ציד בפיו״?", "options": ["עשו צד את אביו ורימה אותו בדבריו", "יצחק אהב לאכול מטעמים מן הציד", "עשו היה מספר לאביו על הצידים שלו"], "kasha": "המילה ״בפיו״ אינה מפרשת בפיו של מי מדובר.", "answer": "בפיו של עשו, שהיה צד את אביו ומרמה אותו בדבריו."}]}, {"id": "25:29.1", "ch": 25, "v": 29, "n": 1, "dh": "ויזד", "pasuk_html": "<mark>וַיָּ֥זֶד</mark> יַעֲקֹ֖ב נָזִ֑יד וַיָּבֹ֥א עֵשָׂ֛ו מִן־הַשָּׂדֶ֖ה וְה֥וּא עָיֵֽף׃", "pasuk_en": "וְיַעֲקֹב בִּישֵׁל נָזִיד וַיָּבֹא עֵשָׂו מִן־הַשָּׂדֶה וְהוּא עָיֵף.", "rashi_he": "ויזד. לְשׁוֹן בִּשּׁוּל, כְּתַרְגּוּמוֹ:", "rashi_en": "״ויזד״ פירושו בישל, כמו שתרגם אונקלוס.", "note": "", "points": [{"q": "מה פירוש המילה ״ויזד״?", "options": ["לשון בישול: יעקב בישל תבשיל", "לשון זדון: יעקב עשה מעשה רשע", "לשון הכנה: יעקב הכין לחם"], "kasha": "״ויזד״ היא מילה נדירה ואינה ברורה.", "answer": "לשון בישול, כתרגומו."}]}, {"id": "25:29.2", "ch": 25, "v": 29, "n": 2, "dh": "והוא עיף", "pasuk_html": "וַיָּ֥זֶד יַעֲקֹ֖ב נָזִ֑יד וַיָּבֹ֥א עֵשָׂ֛ו מִן־הַשָּׂדֶ֖ה <mark>וְה֥וּא עָיֵֽף׃</mark>", "pasuk_en": "וַעֲטָרוּ וַיָּבוֹא עֵשָׂו מִן־הַשָּׂדֶה וְהוּא עָיֵף.", "rashi_he": "והוא עיף. בִּרְצִיחָה, כְּמָה דְּתֵימָא כִּי עָיְפָה נַפְשִׁי לְהֹרְגִים (ירמיהו ד') (בראשית רבה):", "rashi_en": "עשו היה עייף מרציחה, כמו בפסוק ״כי עיפה נפשי להרגים״.", "note": "", "points": [{"q": "ממה היה עשו עייף, לפי רש״י?", "options": ["מרציחה, כמו ״כי עיפה נפשי להרגים״", "מצידת חיות ועופות בשדה כל היום", "מעבודת השדה ומחום השמש"], "kasha": "מדוע מספר הכתוב שעשו היה עייף, וממה?", "answer": "עייף ברציחה, כמו שנאמר ״כי עיפה נפשי להרגים״."}]}, {"id": "25:30.1", "ch": 25, "v": 30, "n": 1, "dh": "הלעיטני", "pasuk_html": "וַיֹּ֨אמֶר עֵשָׂ֜ו אֶֽל־יַעֲקֹ֗ב <mark>הַלְעִיטֵ֤נִי</mark> נָא֙ מִן־הָאָדֹ֤ם הָאָדֹם֙ הַזֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל־כֵּ֥ן קָרָֽא־שְׁמ֖וֹ אֱדֽוֹם׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו אֶל־יַעֲקֹב הַלְעִיטֵנִי נָא מִן־הָאָדֹם הַזֶּה כִּי עָיֵף אָנוֹכִי.", "rashi_he": "הלעיטני. אֶפְתַּח פִּי וּשְׁפֹךְ הַרְבֵּה לְתוֹכָהּ, כְּמוֹ שֶׁשָּׁנִינוּ אֵין אוֹבְסִין אֶת הַגָּמָל אֲבָל מַלְעִיטִין אוֹתוֹ:", "rashi_en": "עשו אמר: אפתח את פי ותשפוך לתוכו הרבה, כמו שמלעיטים גמל.", "note": "", "points": [{"q": "מה ביקש עשו במילה ״הלעיטני״?", "options": ["שיפתח את פיו ויעקב ישפוך לתוכו הרבה", "שיעקב ייתן לו לטעום מעט מן התבשיל", "שיעקב ימכור לו את התבשיל בכסף"], "kasha": "מדוע לא אמר עשו ״האכילני״, אלא השתמש במילה ״הלעיטני״?", "answer": "אפתח פי ושפוך הרבה לתוכו, כמו ששנינו ״אין אובסין את הגמל אבל מלעיטין אותו״."}]}, {"id": "25:30.2", "ch": 25, "v": 30, "n": 2, "dh": "מן האדם האדם", "pasuk_html": "וַיֹּ֨אמֶר עֵשָׂ֜ו אֶֽל־יַעֲקֹ֗ב הַלְעִיטֵ֤נִי נָא֙ <mark>מִן־הָאָדֹ֤ם הָאָדֹם֙</mark> הַזֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל־כֵּ֥ן קָרָֽא־שְׁמ֖וֹ אֱדֽוֹם׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו אֶל־יַעֲקֹב הַלְעִיטֵנִי נָא מִן־הָאָדֹם הַזֶּה כִּי עָיֵף אָנוֹכִי.", "rashi_he": "מן האדם האדם. עֲדָשִׁים אֲדֻמּוֹת, וְאוֹתוֹ הַיּוֹם מֵת אַבְרָהָם, שֶׁלֹּא יִרְאֶה אֶת עֵשָׂו בֶּן בְּנוֹ יוֹצֵא לְתַרְבּוּת רָעָה, וְאֵין זוֹ שֵׂיבָה טוֹבָה שֶׁהִבְטִיחוֹ הַקָּבָּ\"ה; לְפִיכָךְ קִצֵּר הַקָּבָּ\"ה ה' שָׁנִים מִשְּׁנוֹתָיו, שֶׁיִּצְחָק חַי ק\"פ שָׁנָה וְזֶה קע\"ה, וּבִשֵּׁל יַעֲקֹב עֲדָשִׁים לְהַבְרוֹת אֶת הָאָבֵל. וְלָמָּה עֲדָשִׁים? שֶׁדּוֹמוֹת לְגַלְגַּל, שֶׁהָאֲבֵלוּת גַּלְגַּל הַחוֹזֵר בָּעוֹלָם (וְעוֹד מָה עֲדָשִׁים אֵין לָהֶם פֶּה, כָּךְ הָאָבֵל אֵין לוֹ פֶה, שֶׁאָסוּר לְדַבֵּר, וּלְפִיכָךְ הַמִּנְהָג לְהַבְרוֹת הָאָבֵל בִּתְחִלַּת מַאֲכָלוֹ בֵּיצִים, שֶׁהֵם עֲגֻלִּים וְאֵין לָהֶם פֶּה, כָּךְ אָבֵל אֵין לוֹ פֶה, כִּדְאָמְרִינַן בְּמוֹעֵד קָטָן (מועד קטן כא:) אָבֵל כָּל שְׁלֹשָׁה יָמִים הָרִאשׁוֹנִים אֵינוֹ מֵשִׁיב שָׁלוֹם לְכָל אָדָם וְכָ\"שֶׁ שֶׁאֵינוֹ שׁוֹאֵל בַּתְּחִלָּה, מִג' וְעַד ז' מֵשִׁיב וְאֵינוֹ שׁוֹאֵל וְכוּ'; בְּרַשִׁ\"י יָשָׁן):", "rashi_en": "מדובר בעדשים אדומות. באותו יום מת אברהם, חמש שנים לפני זמנו, כדי שלא יראה את עשו יוצא לתרבות רעה. יעקב בישל עדשים לסעודת הבראה לאבל, כי הן עגולות כגלגל, והאבלות היא גלגל החוזר בעולם.", "note": "", "points": [{"q": "מדוע קיצר הקב״ה חמש שנים משנות אברהם?", "options": ["שלא יראה את עשו נכדו יוצא לתרבות רעה", "כי נחלש מצערו על מות שרה אשתו", "כדי שיצחק יירש את מקומו בעוד מועד"], "kasha": "מה היה מיוחד באותו יום, שיעקב בישל בו עדשים?", "answer": "באותו יום מת אברהם, שלא יראה את עשו יוצא לתרבות רעה, ואין זו שיבה טובה שהבטיחו הקב״ה; לכן קיצר חמש שנים משנותיו: יצחק חי מאה ושמונים שנה, ואברהם מאה שבעים וחמש."}, {"q": "מדוע מבריאים את האבל דווקא בעדשים?", "options": ["כי הן עגולות כגלגל, והאבלות גלגל החוזר בעולם", "כי הן אדומות, כצבע הדם והמוות", "כי הן מאכל פשוט וזול, כראוי לאבל"], "kasha": "מדוע בישל יעקב דווקא עדשים לסעודת האבל?", "answer": "שדומות לגלגל, שהאבלות גלגל החוזר בעולם; ועוד, מה עדשים אין להן פה, כך האבל אין לו פה, שאסור לו לדבר."}]}, {"id": "25:31.1", "ch": 25, "v": 31, "n": 1, "dh": "מכרה כיום", "pasuk_html": "וַיֹּ֖אמֶר יַעֲקֹ֑ב <mark>מִכְרָ֥ה כַיּ֛וֹם</mark> אֶת־בְּכֹרָתְךָ֖ לִֽי׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב הִמְכְּרָה לִי אֶת־בְּכוֹרָתְךָ כַּיּוֹם.", "rashi_he": "מכרה כיום. כְּתַרְגּוּמוֹ כְּיוֹם דִּלְהֵן, כַּיּוֹם שֶׁהוּא בָרוּר, כָךְ מְכֹר לִי מְכִירָה בְרוּרָה:", "rashi_en": "כמו שהיום ברור וודאי, כך תמכור לי את הבכורה מכירה ברורה.", "note": "", "points": [{"q": "מה פירוש ״כיום״ בדברי יעקב?", "options": ["כמו שהיום ברור, כך תהיה המכירה ברורה", "מכור לי מיד, היום, בלי לדחות", "מכור לי כמו שמוכרים ביום השוק"], "kasha": "מה פירוש כ״ף הדמיון במילה ״כיום״?", "answer": "כתרגומו ״כיום דלהן״: כיום שהוא ברור, כך מכור לי מכירה ברורה."}]}, {"id": "25:31.2", "ch": 25, "v": 31, "n": 2, "dh": "בכרתך", "pasuk_html": "וַיֹּ֖אמֶר יַעֲקֹ֑ב מִכְרָ֥ה כַיּ֛וֹם אֶת־<mark>בְּכֹרָתְךָ֖</mark> לִֽי׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב הִמְכְּרָה לִי אֶת־בְּכוֹרָתְךָ כַּיּוֹם.", "rashi_he": "בכרתך. לְפִי שֶׁהָעֲבוֹדָה בַּבְּכוֹרוֹת, אָמַר יַעֲקֹב אֵין רָשָׁע זֶה כְדַאי שֶׁיַּקְרִיב לְהַקָּבָּ\"ה:", "rashi_en": "באותו זמן עבודת הקרבנות הייתה בבכורות, ויעקב אמר שרשע כעשו אינו ראוי להקריב לקב״ה.", "note": "", "points": [{"q": "מדוע רצה יעקב לקנות את הבכורה?", "options": ["שעשו הרשע לא יקריב קרבנות לפני הקב״ה", "כדי לקבל פי שניים בירושת אביו", "כדי שיוכל לשלוט על אחיו בעתיד"], "kasha": "מה ראה יעקב לבקש דווקא את הבכורה?", "answer": "לפי שהעבודה בבכורות, אמר יעקב: אין רשע זה כדאי שיקריב להקב״ה."}]}, {"id": "25:32.1", "ch": 25, "v": 32, "n": 1, "dh": "הנה אנכי הולך למות", "pasuk_html": "וַיֹּ֣אמֶר עֵשָׂ֔ו <mark>הִנֵּ֛ה אָנֹכִ֥י הוֹלֵ֖ךְ לָמ֑וּת</mark> וְלָמָּה־זֶּ֥ה לִ֖י בְּכֹרָֽה׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו הִנִּי הוֹלֵךְ לָמוּת וְלָמָּה זֶּה לִי בְכוֹרָה?", "rashi_he": "הנה אנכי הולך למות. (מִתְנוֹדֶדֶת וְהוֹלֶכֶת הִיא הַבְּכוֹרָה שֶׁלֹּא תְהֵא כָל עֵת הָעֲבוֹדָה בַּבְּכוֹרוֹת, כִּי שֵׁבֶט לֵוִי יִטֹּל אוֹתָהּ, וְעוֹד) אָמַר עֵשָׂו: מַה טִּיבָהּ שֶׁל עֲבוֹדָה זוֹ? אָמַר לוֹ: כַּמָּה אַזְהָרוֹת וָעֳנָשִׁין וּמִיתוֹת תְּלוּיִין בָּהּ כְּאוֹתָהּ שֶׁשָּׁנִינוּ, אֵלּוּ הֵן שֶׁבְּמִיתָה: שְׁתוּיֵי יַיִן וּפְרוּעֵי רֹאשׁ; אָמַר: אֲנִי הוֹלֵךְ לָמוּת עַל יָדָהּ, אִם כֵּן מַה חֵפֶץ לִי בָהּ?", "rashi_en": "עשו שאל מה טיבה של העבודה, ויעקב אמר לו שתלויים בה אזהרות, עונשים ומיתות, כגון שתויי יין ופרועי ראש. אמר עשו: אם אמות בגללה, מה חפץ לי בה? ועוד, הבכורה אינה יציבה, כי שבט לוי עתיד ליטול את העבודה.", "note": "", "points": [{"q": "מה הקשר בין ״הולך למות״ לבין הבכורה?", "options": ["בעבודת הבכורה תלויות מיתות, ועשו חשש למות בגללה", "עשו היה רעב מאוד וחשב שימות מרעב", "עשו חשב שימות לפני אביו ולא יירש"], "kasha": "מה עניין מיתתו של עשו למכירת הבכורה?", "answer": "יעקב אמר לו שכמה אזהרות ועונשים ומיתות תלויים בעבודה, כגון שתויי יין ופרועי ראש; אמר עשו: אני הולך למות על ידה, ואם כן מה חפץ לי בה?"}, {"q": "מדוע הבכורה ״מתנודדת והולכת״?", "options": ["כי שבט לוי עתיד ליטול את העבודה מן הבכורות", "כי היא שייכת ממילא ליעקב, שנוצר ראשון", "כי אין בה ממון, ולכן אינה שווה דבר"], "kasha": "מדוע זלזל עשו בבכורה?", "answer": "מתנודדת והולכת היא הבכורה, שלא תהיה כל הזמן העבודה בבכורות, כי שבט לוי ייטול אותה."}]}, {"id": "25:34.1", "ch": 25, "v": 34, "n": 1, "dh": "ויבז עשו", "pasuk_html": "וְיַעֲקֹ֞ב נָתַ֣ן לְעֵשָׂ֗ו לֶ֚חֶם וּנְזִ֣יד עֲדָשִׁ֔ים וַיֹּ֣אכַל וַיֵּ֔שְׁתְּ וַיָּ֖קׇם וַיֵּלַ֑ךְ <mark>וַיִּ֥בֶז עֵשָׂ֖ו</mark> אֶת־הַבְּכֹרָֽה׃&nbsp;{פ}", "pasuk_en": "וַיִּתֵּן יַעֲקֹב לְעֵשָׂו לֶחֶם וּנְזִיד עֲדָשִׁים וַיֹּאכַל וַיִּשְׁתְּ וַיָּקָם וַיֵּלַךְ וַיִּבֶז עֵשָׂו אֶת־הַבְּכוֹרָה.", "rashi_he": "ויבז עשו. הֵעִיד הַכָּתוּב עַל רִשְׁעוֹ שֶׁבִּזָּה עֲבוֹדָתוֹ שֶׁל מָקוֹם:", "rashi_en": "הכתוב מעיד על רשעו של עשו, שזלזל בעבודת ה׳.", "note": "", "points": [{"q": "מה בא הכתוב ללמד במילים ״ויבז עשו״?", "options": ["להעיד על רשעו, שבזה לעבודת המקום", "לספר שעשו התחרט מיד על המכירה", "ללמד שיעקב רימה את עשו במכירה"], "kasha": "הסיפור כבר הסתיים; מדוע מוסיף הכתוב ״ויבז עשו את הבכורה״?", "answer": "העיד הכתוב על רשעו, שבזה לעבודתו של מקום."}]}, {"id": "26:2.1", "ch": 26, "v": 2, "n": 1, "dh": "אל תרד מצרימה", "pasuk_html": "וַיֵּרָ֤א אֵלָיו֙ יְהֹוָ֔ה וַיֹּ֖אמֶר <mark>אַל־תֵּרֵ֣ד מִצְרָ֑יְמָה</mark> שְׁכֹ֣ן בָּאָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "וַיֵּרָא אֵלָיו ה' וַיֹּאמֶר אַל־תֵּרֶד מִצְרַיְמָה שְׁכֹּן בָּאָרֶץ אֲשֶׁר אוֹמַר אֵלֶיךָ.", "rashi_he": "אל תרד מצרימה. שֶׁהָיָה דַּעְתּוֹ לָרֶדֶת מִצְרַיְמָה, כְּמוֹ שֶׁיָּרַד אָבִיו בִּימֵי הָרָעָב; אָמַר לוֹ: אַל תֵּרֵד מִצְרָיְמָה, שֶׁאַתָּה עוֹלָה תְמִימָה, וְאֵין חוּצָה לָאָרֶץ כְּדַאי לְךָ:", "rashi_en": "יצחק חשב לרדת למצרים כמו שירד אביו בימי הרעב. ה׳ אמר לו שלא ירד, כי הוא עולה תמימה ואין חוץ לארץ ראויה לו.", "note": "", "points": [{"q": "מדוע אמר ה׳ ליצחק שלא ירד למצרים?", "options": ["כי הוא עולה תמימה, ואין חוץ לארץ כדאי לו", "כי המצרים עלולים לקחת ממנו את רבקה", "כי הרעב במצרים היה קשה מן הרעב בכנען"], "kasha": "לא נאמר שיצחק רצה לרדת למצרים; מדוע נאמר לו ״אל תרד״?", "answer": "שהיה בדעתו לרדת מצרימה כמו שירד אביו בימי הרעב; אמר לו: אל תרד, שאתה עולה תמימה ואין חוץ לארץ כדאי לך."}]}, {"id": "26:3.1", "ch": 26, "v": 3, "n": 1, "dh": "האל", "pasuk_html": "גּ֚וּר בָּאָ֣רֶץ הַזֹּ֔את וְאֶֽהְיֶ֥ה עִמְּךָ֖ וַאֲבָרְכֶ֑ךָּ כִּֽי־לְךָ֣ וּֽלְזַרְעֲךָ֗ אֶתֵּן֙ אֶת־כׇּל־הָֽאֲרָצֹ֣ת <mark>הָאֵ֔ל</mark> וַהֲקִֽמֹתִי֙ אֶת־הַשְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְאַבְרָהָ֥ם אָבִֽיךָ׃", "pasuk_en": "שְׁכֹּן בָּאָרֶץ הַזֹּאת וְאֶהְיֶה עִמְּךָ וַאֲבָרְכְךָ כִּי לְךָ וּלְזַרְעֲךָ אֶתֵּן אֶת־כָּל־הָאָרְצוֹת הָאֵלּ וַהֲקִמֹתִי אֶת־הַשְּׁבוּעָה אֲשֶׁר נִשְׁמַרְתִּי לְאַבְרָהָם אָבִיךָ.", "rashi_he": "האל. כְּמוֹ הָאֵלֶּה:", "rashi_en": "״האל״ כאן פירושו ״האלה״: הארצות האלה.", "note": "", "points": [{"q": "מה פירוש המילה ״האל״ בפסוק?", "options": ["כמו ״האלה״: הארצות האלה", "שם של הקב״ה: ״האל״", "לשון אלה ושבועה"], "kasha": "״האל״ נראה כשם ה׳, אבל אין זה מתאים להקשר ״כל הארצות האל״.", "answer": "האל כמו האלה."}]}, {"id": "26:4.1", "ch": 26, "v": 4, "n": 1, "dh": "והתברכו בזרעך", "pasuk_html": "וְהִרְבֵּיתִ֤י אֶֽת־זַרְעֲךָ֙ כְּכוֹכְבֵ֣י הַשָּׁמַ֔יִם וְנָתַתִּ֣י לְזַרְעֲךָ֔ אֵ֥ת כׇּל־הָאֲרָצֹ֖ת הָאֵ֑ל <mark>וְהִתְבָּרְכ֣וּ בְזַרְעֲךָ֔</mark> כֹּ֖ל גּוֹיֵ֥י הָאָֽרֶץ׃", "pasuk_en": "וְהַרְבֵּיתִי אֶת־זַרְעֲךָ כְּכוֹכְבֵי הַשָּׁמַיִם וְנָתַתִּי לְזַרְעֲךָ אֶת־כָּל־הָאָרְצוֹת הָאֵלּ וְנִשְׁמְּרוּ בְּזַרְעֲךָ כָּל־גּוֹיֵי הָאָרֶץ.", "rashi_he": "והתברכו בזרעך. אָדָם אוֹמֵר לִבְנוֹ יְהֵא זַרְעֲךָ כְּזַרְעוֹ שֶׁל יִצְחָק, וְכֵן בְּכָל הַמִּקְרָא, וְזֶה אָב לְכֻלָּן בְּךָ יְבָרֵךְ יִשְׂרָאֵל לֵאמֹר יְשִׂמְךָ וְגוֹ' (בראשית מ״ח:כ׳); וְאַף לְעִנְיַן הַקְּלָלָה מָצִינוּ כֵן וְהָיְתָה הָאִשָּׁה לְאָלָה (במדבר ה'), שֶׁהַמְקַלֵּל שׂוֹנְאוֹ אוֹמֵר תְּהֵא כִּפְלוֹנִית, וְכֵן וְהִנַּחְתֶּם שִׁמְכֶם לִשְׁבוּעָה לִבְחִירַי (ישעיהו ס\"ה), שֶׁהַנִּשְׁבָּע אוֹמֵר אֱהֵא כִפְלוֹנִי אִם עָשִׂיתִי כָּךְ וְכָךְ:", "rashi_en": "אדם יברך את בנו: ״יהא זרעך כזרעו של יצחק״. כך פירוש לשון זו בכל המקרא, והמקור לכך הוא ״בך יברך ישראל לאמר ישמך וגו׳״. וכן בקללה ובשבועה: אומרים ״תהא כפלונית״ או ״אהא כפלוני״.", "note": "", "points": [{"q": "מה פירוש ״והתברכו בזרעך כל גויי הארץ״?", "options": ["אדם יברך את בנו: יהא זרעך כזרעו של יצחק", "כל הגויים יקבלו ברכה בזכות זרע יצחק", "זרע יצחק עצמו יברך את כל הגויים"], "kasha": "מה פירוש שהגויים ״יתברכו״ בזרעו של יצחק?", "answer": "אדם אומר לבנו: יהא זרעך כזרעו של יצחק; וכן בכל המקרא, והאב לכולן הוא ״בך יברך ישראל לאמר ישמך וגו׳״."}, {"q": "כיצד מתפרש ״והיתה האשה לאלה״ לפי אותו כלל?", "options": ["המקלל את שונאו אומר לו: תהא כפלונית", "האשה עצמה תקלל את כל מי שפוגע בה", "האשה תישבע שבועה לפני הכהן"], "kasha": "האם הכלל הזה נוהג רק בברכה, או גם בקללה ובשבועה?", "answer": "גם בקללה מצינו כן: המקלל את שונאו אומר ״תהא כפלונית״; וכן בשבועה, הנשבע אומר ״אהא כפלוני אם עשיתי כך וכך״."}]}, {"id": "26:5.1", "ch": 26, "v": 5, "n": 1, "dh": "שמע אברהם בקולי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־<mark>שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י</mark> וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י מִצְוֺתַ֖י חֻקּוֹתַ֥י וְתוֹרֹתָֽי׃", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "שמע אברהם בקולי. כְּשֶׁנִּסִּיתִי אוֹתוֹ:", "rashi_en": "אברהם שמע בקול ה׳ כשה׳ ניסה אותו.", "note": "", "points": [{"q": "מתי ״שמע אברהם בקולי״, לפי רש״י?", "options": ["כשניסה אותו הקב״ה", "כשהתפלל לפני ה׳ על אנשי סדום", "כשקיבל את דברי שרה לגרש את הגר"], "kasha": "על איזו שמיעה בקול ה׳ מדובר כאן?", "answer": "כשנסיתי אותו."}]}, {"id": "26:5.2", "ch": 26, "v": 5, "n": 2, "dh": "וישמר משמרתי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י <mark>וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י</mark> מִצְוֺתַ֖י חֻקּוֹתַ֥י וְתוֹרֹתָֽי׃", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "וישמר משמרתי. גְּזֵרוֹת לְהַרְחָקָה עַל הָאַזְהָרוֹת שֶׁבַּתּוֹרָה, כְּגוֹן שְׁנִיּוֹת לָעֲרָיוֹת וּשְׁבוּת לַשַּׁבָּת (יבמות כ\"א):", "rashi_en": "״משמרתי״ הן גזרות שנועדו להרחיק את האדם מעבירה על איסורי התורה, כגון שניות לעריות ואיסורי שבות בשבת.", "note": "", "points": [{"q": "לפי רש״י, למה מכוונות המילים ״וישמר משמרתי״?", "options": ["לגזרות להרחקה מאיסורי התורה, כגון שניות לעריות ושבות", "למצוות שהשכל מחייב אותן, כגון איסור גזל ורציחה", "לחוקים שאין להם טעם, כגון איסור חזיר ושעטנז"], "kasha": "הפסוק מונה כמה סוגי מצוות, ויש להבין מה מיוחד ב״משמרתי״ ומה הוא כולל.", "answer": "״משמרתי״ הן גזרות להרחקה על האזהרות שבתורה, כגון שניות לעריות ושבות לשבת."}]}, {"id": "26:5.3", "ch": 26, "v": 5, "n": 3, "dh": "מצותי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י <mark>מִצְוֺתַ֖י</mark> חֻקּוֹתַ֥י וְתוֹרֹתָֽי׃", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "מצותי. דְּבָרִים שֶׁאִלּוּ לֹא נִכְתְּבוּ רְאוּיִן הֵם לְהִצְטַוּוֹת, כְּגוֹן גֶּזֶל וּשְׁפִיכוּת דָּמִים:", "rashi_en": "״מצותי״ הן מצוות שגם אילו לא נכתבו בתורה היה ראוי שיצטוו עליהן, כמו איסור גזל ושפיכות דמים.", "note": "", "points": [{"q": "אילו מצוות כלולות לפי רש״י במילה ״מצותי״?", "options": ["מצוות שראוי היה לצוות עליהן גם אילו לא נכתבו, כגון גזל ורצח", "גזרות שנועדו להרחיק את האדם מאיסורי התורה", "הלכות שנמסרו בעל פה למשה מסיני"], "kasha": "הפסוק מונה ״מצותי״ לצד ״חקותי״ ו״תורתי״, ויש להבין מה ההבדל ביניהם.", "answer": "״מצותי״ הם דברים שאילו לא נכתבו ראויים הם להצטוות, כגון גזל ושפיכות דמים."}]}, {"id": "26:5.4", "ch": 26, "v": 5, "n": 4, "dh": "חקותי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י מִצְוֺתַ֖י <mark>חֻקּוֹתַ֥י</mark> וְתוֹרֹתָֽי׃", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "חקותי. דְּבָרִים שֶׁיֵּצֶר הָרָע וְאֻמּוֹת הָעוֹלָם מְשִׁיבִין עֲלֵיהֶם, כְּגוֹן אֲכִילַת חֲזִיר וּלְבִישַׁת שַׁעַטְנֵז, שֶׁאֵין טַעַם בַּדָּבָר, אֶלָּא גְּזֵרַת הַמֶּלֶךְ וְחֻקּוֹתָיו עַל עֲבָדָיו:", "rashi_en": "״חקותי״ הן מצוות שאין להן טעם גלוי, כמו איסור חזיר ושעטנז, ולכן יצר הרע ואומות העולם מקשים עליהן; אבל הן גזרת המלך על עבדיו.", "note": "", "points": [{"q": "מה מאפיין את המצוות הנקראות ״חקותי״?", "options": ["אין להן טעם גלוי, ויצר הרע והגויים מקשים עליהן", "השכל מחייב אותן גם אילו לא נכתבו בתורה", "הן גזרות שנועדו להרחיק מעבירה על איסורי תורה"], "kasha": "יש להבין מה ייחודן של ״חקותי״ לעומת שאר סוגי המצוות שבפסוק.", "answer": "״חקותי״ הם דברים שיצר הרע ואומות העולם משיבים עליהם, כגון אכילת חזיר ולבישת שעטנז, שאין בהם טעם אלא גזרת המלך וחקותיו על עבדיו."}]}, {"id": "26:5.5", "ch": 26, "v": 5, "n": 5, "dh": "ותורתי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י מִצְוֺתַ֖י חֻקּוֹתַ֥י <mark>וְתוֹרֹתָֽי׃</mark>", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "ותורתי. לְהָבִיא תּוֹרָה שֶׁבְּעַל פֶּה הֲלָכָה לְמֹשֶׁה מִסִּינַי (בראשית רבה):", "rashi_en": "המילה ״ותורתי״ באה לרבות גם את התורה שבעל פה – הלכה למשה מסיני.", "note": "", "points": [{"q": "מה בא רש״י לרבות מן המילה ״ותורתי״?", "options": ["את התורה שבעל פה, הלכה למשה מסיני", "את הגזרות שתיקנו חכמים להרחקה מעבירה", "את שבע מצוות בני נח שנצטוו בהן הכול"], "kasha": "״תורתי״ נאמר בלשון רבים, ומשמע שיש יותר מתורה אחת.", "answer": "״ותורתי״ בא להביא את התורה שבעל פה, הלכה למשה מסיני."}]}, {"id": "26:7.1", "ch": 26, "v": 7, "n": 1, "dh": "לאשתו", "pasuk_html": "וַֽיִּשְׁאֲל֞וּ אַנְשֵׁ֤י הַמָּקוֹם֙ <mark>לְאִשְׁתּ֔וֹ</mark> וַיֹּ֖אמֶר אֲחֹ֣תִי הִ֑וא כִּ֤י יָרֵא֙ לֵאמֹ֣ר אִשְׁתִּ֔י פֶּן־יַֽהַרְגֻ֜נִי אַנְשֵׁ֤י הַמָּקוֹם֙ עַל־רִבְקָ֔ה כִּֽי־טוֹבַ֥ת מַרְאֶ֖ה הִֽוא׃", "pasuk_en": "כִּי יָרֵא לוֹמַר אִשְׁתִּי פֶּן יַהַרְגוּנִי אַנְשֵׁי הַמָּקוֹם עַל רִבְקָה כִּי טוֹבַת מַרְאֶה הִיא", "rashi_he": "לאשתו. עַל אִשְׁתּוֹ, כְּמוֹ אִמְרִי לִי אָחִי הוּא (בראשית כ׳:י״ג):", "rashi_en": "״וישאלו... לאשתו״ פירושו ששאלו על אשתו, כמו ״אמרי לי אחי הוא״ שפירושו אמרי עליי.", "note": "", "points": [{"q": "מה פירוש ״וישאלו אנשי המקום לאשתו״?", "options": ["שאלו את יצחק על אשתו, מי היא", "שאלו את רבקה עצמה מי היא ומאין באה", "ביקשו מיצחק לתת להם את אשתו"], "kasha": "״לאשתו״ משמע שפנו אל אשתו, אבל ההמשך ״ויאמר אחתי הוא״ מלמד שיצחק הוא שענה.", "answer": "״לאשתו״ פירושו ״על אשתו״, כמו ״אמרי לי אחי הוא״ שפירושו אמרי עליי."}]}, {"id": "26:8.2", "ch": 26, "v": 8, "n": 2, "dh": "וישקף אבימלך וגומר", "pasuk_html": "וַיְהִ֗י כִּ֣י אָֽרְכוּ־ל֥וֹ שָׁם֙ הַיָּמִ֔ים וַיַּשְׁקֵ֗ף אֲבִימֶ֙לֶךְ֙ מֶ֣לֶךְ פְּלִשְׁתִּ֔ים בְּעַ֖ד הַֽחַלּ֑וֹן וַיַּ֗רְא וְהִנֵּ֤ה יִצְחָק֙ מְצַחֵ֔ק אֵ֖ת רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיִּשְׁקֹף אֲבִימֶלֶךְ מֶלֶךְ פְּלִשְׁתִּים בְּעַד הַחַלּוֹן וַיַּרְא וְהִנֵּה יִצְחָק מְצַחֵק אֶת רִבְקָה אִשְׁתּוֹ", "rashi_he": "וישקף אבימלך וגומר. רָאָהוּ מְשַׁמֵּשׁ מִטָּתוֹ:", "rashi_en": "אבימלך ראה את יצחק ורבקה בדרך אישות, ומכך הבין שהם בעל ואשה ולא אח ואחות.", "note": "", "points": [{"q": "מה ראה אבימלך, שממנו הבין שרבקה היא אשת יצחק?", "options": ["ראה את יצחק עם רבקה בדרך אישות", "ראה את יצחק משחק עם רבקה בצחוק", "שמע את יצחק קורא לרבקה ״אשתי״"], "kasha": "מן המילה ״מצחק״ לבדה אין הוכחה ברורה שרבקה היא אשתו ולא אחותו.", "answer": "ראהו משמש מטתו."}]}, {"id": "26:10.1", "ch": 26, "v": 10, "n": 1, "dh": "אחד העם", "pasuk_html": "וַיֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה־זֹּ֖את עָשִׂ֣יתָ לָּ֑נוּ כִּ֠מְעַ֠ט שָׁכַ֞ב <mark>אַחַ֤ד הָעָם֙</mark> אֶת־אִשְׁתֶּ֔ךָ וְהֵבֵאתָ֥ עָלֵ֖ינוּ אָשָֽׁם׃", "pasuk_en": "וַיֹּאמֶר אֲבִימֶלֶךְ מַה זֶּה עָשִׂיתָ לָּנוּ וּמַה חָטָאתִי לָךְ כִּי הֵבֵאתָ עלַי וְעַל מַלְכוּתִי חֲטָאָה גְדוֹלָה", "rashi_he": "אחד העם. הַמְיֻחָד בָּעָם, זֶה הַמֶּלֶךְ:", "rashi_en": "״אחד העם״ פירושו המיוחד שבעם, כלומר המלך – אבימלך עצמו.", "note": "", "points": [{"q": "למי מתכוון אבימלך באמרו ״אחד העם״?", "options": ["למלך, המיוחד שבעם, כלומר לעצמו", "לאחד מפשוטי העם, אדם כלשהו", "לאחד משרי המלך, כגון פיכל שר הצבא"], "kasha": "הלשון ״אחד העם״ סתמית, ולא ברור במי מדובר.", "answer": "״אחד העם״ הוא המיוחד בעם, זה המלך."}]}, {"id": "26:10.2", "ch": 26, "v": 10, "n": 2, "dh": "והבאת עלינו אשם", "pasuk_html": "וַיֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה־זֹּ֖את עָשִׂ֣יתָ לָּ֑נוּ כִּ֠מְעַ֠ט שָׁכַ֞ב אַחַ֤ד הָעָם֙ אֶת־אִשְׁתֶּ֔ךָ <mark>וְהֵבֵאתָ֥ עָלֵ֖ינוּ אָשָֽׁם׃</mark>", "pasuk_en": "וַיֹּאמֶר אֲבִימֶלֶךְ מַה זֶּה עָשִׂיתָ לָּנוּ וּמַה חָטָאתִי לָךְ כִּי הֵבֵאתָ עלַי וְעַל מַלְכוּתִי חֲטָאָה גְדוֹלָה", "rashi_he": "והבאת עלינו אשם. אִם שָׁכַב כְּבָר, הֵבֵאתָ עָלֵינוּ אָשָׁם:", "rashi_en": "אבימלך אומר ליצחק: אילו כבר שכב איתה מישהו, היית מביא עלינו אשמה.", "note": "", "points": [{"q": "מה פירוש ״והבאת עלינו אשם״ לפי רש״י?", "options": ["אילו כבר שכב איתה, היית מביא עלינו אשמה", "כבר הבאת עלינו אשמה בשקר שאמרת לנו", "עלינו להביא קרבן אשם על מה שאירע"], "kasha": "הרי איש לא שכב עם רבקה, ומה האשם שהביא יצחק עליהם?", "answer": "הכוונה: אם שכב כבר, הבאת עלינו אשם."}]}, {"id": "26:12.1", "ch": 26, "v": 12, "n": 1, "dh": "בארץ ההוא", "pasuk_html": "וַיִּזְרַ֤ע יִצְחָק֙ <mark>בָּאָ֣רֶץ הַהִ֔וא</mark> וַיִּמְצָ֛א בַּשָּׁנָ֥ה הַהִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "pasuk_en": "וַיִּזְרַע יִצְחָק בָּאָרֶץ הַהִיא וַיִּמְצָא בַּשָּׁנָה הַהִיא מֵאָה שְׁעָרִים וַיְבָרְכֵהוּ ה׳", "rashi_he": "בארץ ההוא. אַעַ\"פִּ שֶׁאֵינוֹ חֲשׁוּבָה כְּאֶרֶץ יִשְׂרָאֵל עַצְמָהּ, כְּאֶרֶץ שִׁבְעָה גוֹיִם (בראשית רבה):", "rashi_en": "יצחק הצליח בזריעתו אף על פי שארץ גרר אינה חשובה כארץ ישראל עצמה, ארץ שבעת העממים.", "note": "", "points": [{"q": "מה בא הכתוב להדגיש במילים ״בארץ ההוא״?", "options": ["שהצליח אף שגרר אינה חשובה כארץ שבעה גויים", "שגרר הייתה הארץ הפורייה ביותר באזור", "שבארץ ההיא לא זרע איש לפני יצחק"], "kasha": "כבר ידוע היכן ישב יצחק, ומה צורך לציין ״בארץ ההוא״?", "answer": "אף על פי שאינה חשובה כארץ ישראל עצמה, כארץ שבעה גויים."}]}, {"id": "26:12.2", "ch": 26, "v": 12, "n": 2, "dh": "בשנה ההיא", "pasuk_html": "וַיִּזְרַ֤ע יִצְחָק֙ בָּאָ֣רֶץ הַהִ֔וא וַיִּמְצָ֛א <mark>בַּשָּׁנָ֥ה הַהִ֖וא</mark> מֵאָ֣ה שְׁעָרִ֑ים וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "pasuk_en": "יצחק זרע בארץ ההיא וַיִּקְצֹר בשנה ההיא מאה שיעורים. וַיְבָרְכֵהוּ ה׳,", "rashi_he": "בשנה ההיא. אַעַ\"פִּ שֶׁאֵינָהּ כְּתִקְנָהּ, שֶׁהָיְתָה שְׁנַת רְעָבוֹן (בראשית רבה):", "rashi_en": "יצחק הצליח אף על פי שהשנה ההיא לא הייתה שנה רגילה, אלא שנת רעב.", "note": "", "points": [{"q": "מה מיוחד ב״שנה ההוא״ שבה זרע יצחק?", "options": ["הייתה שנת רעב, ולא שנה כתקנה", "הייתה שנת שמיטה, שאסור לזרוע בה", "הייתה השנה הראשונה לבואו לגרר"], "kasha": "לשם מה מציין הכתוב באיזו שנה זרע יצחק?", "answer": "אף על פי שאינה כתקנה, שהייתה שנת רעבון."}]}, {"id": "26:12.3", "ch": 26, "v": 12, "n": 3, "dh": "בארץ ההיא בשנה ההיא", "pasuk_html": "וַיִּזְרַ֤ע יִצְחָק֙ בָּאָ֣רֶץ הַהִ֔וא וַיִּמְצָ֛א בַּשָּׁנָ֥ה הַהִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "pasuk_en": "יצחק זרע בארץ ההיא וַיִּקְצֹר בשנה ההיא מאה שיעורים. וַיְבָרְכֵהוּ ה׳,", "rashi_he": "בארץ ההיא בשנה ההיא. שְׁנֵיהֶם לָמָּה? לוֹמַר, שֶׁהָאָרֶץ קָשָׁה וְהַשָּׁנָה קָשָׁה:", "rashi_en": "הכתוב מזכיר גם את הארץ וגם את השנה כדי ללמד ששתיהן היו קשות, ובכל זאת הצליח יצחק.", "note": "", "points": [{"q": "למה מזכיר הכתוב גם ״בארץ ההוא״ וגם ״בשנה ההוא״?", "options": ["ללמד שגם הארץ קשה וגם השנה קשה", "ללמד שהשנה הייתה קשה אך הארץ טובה", "ללמד שזרע בכל שנה באותה הארץ"], "kasha": "די היה לכתוב ״ויזרע יצחק... וימצא מאה שערים״, ולמה צריך את שני הציונים?", "answer": "לומר שהארץ קשה והשנה קשה."}]}, {"id": "26:12.4", "ch": 26, "v": 12, "n": 4, "dh": "מאה שערים", "pasuk_html": "וַיִּזְרַ֤ע יִצְחָק֙ בָּאָ֣רֶץ הַהִ֔וא וַיִּמְצָ֛א בַּשָּׁנָ֥ה הַהִ֖וא <mark>מֵאָ֣ה שְׁעָרִ֑ים</mark> וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "pasuk_en": "יצחק זרע בארץ ההיא וַיִּקְצֹר בשנה ההיא מאה שיעורים. וַיְבָרְכֵהוּ ה׳,", "rashi_he": "מאה שערים. שֶׁאֲמָדוּהָ כַּמָּה רְאוּיָה לַעֲשׂוֹת, וְעָשְׂתָה עַל אַחַת שֶׁאֲמָדוּהָ מֵאָה. וְרַבּוֹתֵינוּ אָמְרוּ אֹמֶד זֶה לְמַעַשְׂרוֹת הָיָה:", "rashi_en": "אמדו כמה ראוי השדה להניב, והוא הניב פי מאה מן האומדן. ורבותינו אמרו שהאומד נעשה לצורך הפרשת מעשרות.", "note": "", "points": [{"q": "מה פירוש ״וימצא... מאה שערים״?", "options": ["השדה הניב פי מאה ממה שאמדו שראוי להניב", "יצחק קצר בדיוק מאה סאה מכל שדה", "התבואה נמכרה במאה שערי העיר גרר"], "kasha": "״שערים״ הוא לשון אומד ושיעור, ויש להבין ביחס למה נמדדו ה״מאה״.", "answer": "אמדוה כמה ראויה לעשות, ועשתה מאה על כל אחת שאמדוה."}, {"q": "לפי רבותינו, לשם מה אמדו את התבואה?", "options": ["כדי להפריש ממנה מעשרות", "כדי למכור אותה לפלשתים", "כדי לשלם ממנה מס לאבימלך"], "kasha": "אדם שמתברך אינו נוהג למדוד את תבואתו, שאין הברכה מצויה בדבר המדוד; ולמה אמדוה?", "answer": "רבותינו אמרו שהאומד הזה היה למעשרות."}]}, {"id": "26:13.1", "ch": 26, "v": 13, "n": 1, "dh": "כי גדל מאוד", "pasuk_html": "וַיִּגְדַּ֖ל הָאִ֑ישׁ וַיֵּ֤לֶךְ הָלוֹךְ֙ וְגָדֵ֔ל עַ֥ד <mark>כִּֽי־גָדַ֖ל מְאֹֽד׃</mark>", "pasuk_en": "וַיִּגְדַּל הָאִישׁ וַיֵּלֶךְ הָלוֹךְ וְגָדֵל עַד כִּי גָדוֹל מְאֹד:", "rashi_he": "כי גדל מאוד. שֶׁהָיוּ אוֹמְרִים זֶבֶל פִּרְדּוֹתָיו שֶׁל יִצְחָק וְלֹא כַסְפּוֹ וּזְהָבוֹ שֶׁל אֲבִימֶלֶךְ (בראשית רבה):", "rashi_en": "יצחק התעשר כל כך, עד שהיו אומרים: מוטב זבל פרדותיו של יצחק מכספו וזהבו של אבימלך.", "note": "", "points": [{"q": "עד כמה גדל יצחק לפי רש״י?", "options": ["אמרו: זבל פרדותיו של יצחק ולא כספו וזהבו של אבימלך", "אמרו שעושרו גדול מעושר כל מלכי כנען יחד", "אבימלך מינה אותו לשר על כל ארץ פלשתים"], "kasha": "הפסוק אומר ״עד כי גדל מאד״, ויש להבין מה הייתה מידת גדולתו.", "answer": "שהיו אומרים: זבל פרדותיו של יצחק ולא כספו וזהבו של אבימלך."}]}, {"id": "26:14.1", "ch": 26, "v": 14, "n": 1, "dh": "ועבדה רבה", "pasuk_html": "וַֽיְהִי־ל֤וֹ מִקְנֵה־צֹאן֙ וּמִקְנֵ֣ה בָקָ֔ר <mark>וַעֲבֻדָּ֖ה רַבָּ֑ה</mark> וַיְקַנְא֥וּ אֹת֖וֹ פְּלִשְׁתִּֽים׃", "pasuk_en": "וַיְהִי לוֹ צֹאן וּבָקָר וְעַבְדִּים הַרְבֵּה וַיְקַנְאוּ אֹתוֹ פְלִשְׁתִּים:", "rashi_he": "ועבדה רבה. פְּעֻלָּה רַבָּה בִּלְשׁוֹן לע\"ז אוברי\"נא, עֲבוֹדָה מַשְׁמָע עֲבוֹדָה אַחַת; עֲבֻדָּה מַשְׁמָע פְּעֻלָּה רַבָּה:", "rashi_en": "״עבדה רבה״ פירושה עסקים ומלאכות רבות (בלע״ז אוברינ״א). ״עבודה״ משמעה מלאכה אחת, ואילו ״עבדה״ משמעה הרבה מלאכות.", "note": "", "points": [{"q": "מה ההבדל בין ״עבודה״ ל״עבדה״ לפי רש״י?", "options": ["עבודה היא מלאכה אחת, ועבדה היא מלאכות רבות", "עבודה היא מלאכה קשה, ועבדה היא מלאכה קלה", "עבודה היא עבודת ה׳, ועבדה היא עבודת השדה"], "kasha": "למה נאמר כאן ״עבדה״ ולא ״עבודה״ כרגיל?", "answer": "״עבודה״ משמע עבודה אחת, ״עבדה״ משמע פעולה רבה – כלומר עסקים ומלאכות רבים."}]}, {"id": "26:15.1", "ch": 26, "v": 15, "n": 1, "dh": "סתמום פלשתים", "pasuk_html": "וְכׇל־הַבְּאֵרֹ֗ת אֲשֶׁ֤ר חָֽפְרוּ֙ עַבְדֵ֣י אָבִ֔יו בִּימֵ֖י אַבְרָהָ֣ם אָבִ֑יו <mark>סִתְּמ֣וּם פְּלִשְׁתִּ֔ים</mark> וַיְמַלְא֖וּם עָפָֽר׃", "pasuk_en": "וַיִּסְתְּמוּ הַפְּלִשְׁתִּים אֶת־כׇּל־הַבְּאֵרוֹת אֲשֶׁר חָפְרוּ עַבְדֵי־אָבִיו בִּימֵי אַבְרָהָם אָבִיו וַיְמַלְאוּם עָפָר.", "rashi_he": "סתמום פלשתים. מִפְּנֵי שֶׁאָמְרוּ תַּקָּלָה הֵם לָנוּ מִפְּנֵי הַגְּיָסוֹת הַבָּאוֹת עָלֵינוּ, טַמּוֹנוּן פְּלִשְׁתָּאֵי לְשׁוֹן סְתִימָה, וּבִלְשׁוֹן הַתַּלְמוּד מְטַמְטֵם אֶת הַלֵּב:", "rashi_en": "הפלשתים סתמו את הבארות כי חששו שיהיו להם למכשול, שהגייסות הפולשים יבואו בגללן. אונקלוס מתרגם ״טמונון״, שהוא לשון סתימה, כמו ״מטמטם את הלב״ בלשון התלמוד.", "note": "", "points": [{"q": "מדוע סתמו הפלשתים את הבארות?", "options": ["אמרו שהן תקלה להם מפני הגייסות הבאים עליהם", "קינאו ביצחק ורצו שלא יהיו לו מים לצאנו", "רצו להשכיח מן הארץ את שמו של אברהם"], "kasha": "בארות מים הן תועלת לכל, ולמה סתמו אותן הפלשתים?", "answer": "מפני שאמרו: תקלה הם לנו מפני הגייסות הבאים עלינו."}, {"q": "מה משמעות המילה ״טמונון״ שבה מתרגם אונקלוס ״סתמום״?", "options": ["לשון סתימה, כמו ״מטמטם את הלב״", "לשון הטמנה, כמו הסתרת אוצר באדמה", "לשון טומאה, שטימאו את מי הבארות"], "kasha": "התרגום ״טמונון״ נשמע כלשון הטמנה והסתרה, ולא כלשון סתימה.", "answer": "״טמונון״ הוא לשון סתימה, ובלשון התלמוד ״מטמטם את הלב״."}]}, {"id": "26:17.1", "ch": 26, "v": 17, "n": 1, "dh": "בנחל גרר", "pasuk_html": "וַיֵּ֥לֶךְ מִשָּׁ֖ם יִצְחָ֑ק וַיִּ֥חַן <mark>בְּנַֽחַל־גְּרָ֖ר</mark> וַיֵּ֥שֶׁב שָֽׁם׃", "pasuk_en": "וַיִּשַׂע מִשָּׁם יִצְחָק וַיִּחַן בְּנַחַל גְּרָר וַיֵּשֶׁב שָׁם.", "rashi_he": "בנחל גרר. רָחוֹק מִן הָעִיר:", "rashi_en": "יצחק חנה בנחל גרר, מקום רחוק מן העיר.", "note": "", "points": [{"q": "היכן חנה יצחק כשנאמר ״ויחן בנחל גרר״?", "options": ["במקום רחוק מן העיר גרר", "בתוך העיר גרר, סמוך לבית המלך", "בבאר שבע, בגבול ארץ פלשתים"], "kasha": "אבימלך אמר לו ״לך מעמנו״, ואם כן איך נשאר יצחק בגרר?", "answer": "נחל גרר רחוק מן העיר."}]}, {"id": "26:18.1", "ch": 26, "v": 18, "n": 1, "dh": "וישב ויחפר", "pasuk_html": "וַיָּ֨שׇׁב יִצְחָ֜ק וַיַּחְפֹּ֣ר&thinsp;׀ אֶת־בְּאֵרֹ֣ת הַמַּ֗יִם אֲשֶׁ֤ר חָֽפְרוּ֙ בִּימֵי֙ אַבְרָהָ֣ם אָבִ֔יו וַיְסַתְּמ֣וּם פְּלִשְׁתִּ֔ים אַחֲרֵ֖י מ֣וֹת אַבְרָהָ֑ם וַיִּקְרָ֤א לָהֶן֙ שֵׁמ֔וֹת כַּשֵּׁמֹ֕ת אֲשֶׁר־קָרָ֥א לָהֶ֖ן אָבִֽיו׃", "pasuk_en": "וַיַּחְפֹּר יִצְחָק אֶת־בְּאֵרוֹת הַמַּיִם אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו וַיִּסְתְּמוּם הַפְּלִישְׁתִּים אַחֲרֵי מוֹת אַבְרָהָם וַיִּקְרָא לָהֶם שֵׁמוֹת כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶם אָבִיו.", "rashi_he": "וישב ויחפר. הַבְּאֵרוֹת אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו וּפְלִשְׁתִּים סִתְּמוּם, מִקֹּדֶם שֶׁנָּסַע יִצְחָק מִגְּרָר, חָזַר וַחֲפָרָן:", "rashi_en": "את הבארות שחפרו בימי אברהם, ושסתמו הפלשתים עוד לפני שנסע יצחק מגרר, חזר יצחק וחפר מחדש.", "note": "", "points": [{"q": "מה פירוש ״וישב יצחק ויחפר את בארות המים״?", "options": ["חזר וחפר מחדש את בארות אברהם שסתמו הפלשתים", "ישב במקום ההוא וחפר שם בארות חדשות לגמרי", "חזר לעיר גרר כדי לחפור בארות לאבימלך"], "kasha": "״וישב״ נשמע לשון ישיבה, וכבר סופר בפסוק טו על סתימת הבארות; מה מוסיף כאן הכתוב?", "answer": "הבארות שחפרו בימי אברהם אביו ושהפלשתים סתמו עוד קודם שנסע יצחק מגרר – חזר יצחק וחפר אותן."}]}, {"id": "26:20.1", "ch": 26, "v": 20, "n": 1, "dh": "עשק", "pasuk_html": "וַיָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם־רֹעֵ֥י יִצְחָ֛ק לֵאמֹ֖ר לָ֣נוּ הַמָּ֑יִם וַיִּקְרָ֤א שֵֽׁם־הַבְּאֵר֙ <mark>עֵ֔שֶׂק</mark> כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽוֹ׃", "pasuk_en": "וַיָּרִיבוּ רוֹעֵי גְרָר אֶת־רוֹעֵי יִצְחָק לֵאמֹר לָנוּ הַמָּיִם וַיִּקְרָא שֵׁם־הַבְּאֵר עֵשֶׂק כִּי הִתְעַשְּׂקוּ עִמּוֹ.", "rashi_he": "עשק. עִרְעוּר:", "rashi_en": "״עשק״ פירושו ערעור – מחלוקת על הבעלות על הבאר.", "note": "", "points": [{"q": "מה פירוש השם ״עשק״ שנתן יצחק לבאר?", "options": ["ערעור ומחלוקת על הבאר", "גזל ועושק בכוח הזרוע", "עסק ועמל רב בחפירה"], "kasha": "מה משמעות השם ״עשק״?", "answer": "״עשק״ פירושו ערעור."}]}, {"id": "26:20.2", "ch": 26, "v": 20, "n": 2, "dh": "כי התעשקו עמו", "pasuk_html": "וַיָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם־רֹעֵ֥י יִצְחָ֛ק לֵאמֹ֖ר לָ֣נוּ הַמָּ֑יִם וַיִּקְרָ֤א שֵֽׁם־הַבְּאֵר֙ עֵ֔שֶׂק <mark>כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽוֹ׃</mark>", "pasuk_en": "וַיָּרִיבוּ רוֹעֵי גְרָר אֶת־רוֹעֵי יִצְחָק לֵאמֹר לָנוּ הַמָּיִם וַיִּקְרָא שֵׁם־הַבְּאֵר עֵשֶׂק כִּי הִתְעַשְּׂקוּ עִמּוֹ.", "rashi_he": "כי התעשקו עמו. נִתְעַשְּׂקוּ עִמּוֹ עָלֶיהָ בִּמְרִיבָה וְעִרְעוּר:", "rashi_en": "רועי גרר התעסקו עם יצחק על הבאר במריבה וערעור.", "note": "", "points": [{"q": "מה פירוש ״כי התעשקו עמו״?", "options": ["התעסקו עמו על הבאר במריבה ובערעור", "עשקו אותו וגזלו ממנו את הבאר בכוח", "עזרו לו בחפירת הבאר ועסקו בה עמו"], "kasha": "יש להבין את פירוש ״התעשקו״ ומה עשו רועי גרר ליצחק.", "answer": "נתעסקו עמו עליה במריבה וערעור."}]}, {"id": "26:21.1", "ch": 26, "v": 21, "n": 1, "dh": "שטנה", "pasuk_html": "וַֽיַּחְפְּרוּ֙ בְּאֵ֣ר אַחֶ֔רֶת וַיָּרִ֖יבוּ גַּם־עָלֶ֑יהָ וַיִּקְרָ֥א שְׁמָ֖הּ <mark>שִׂטְנָֽה׃</mark>", "pasuk_en": "וַיִּחְפְּרוּ בְאֵר אַחֶרֶת וַיָּרִיבוּ גַּם־עָלֶיהָ וַיִּקְרָא שְׁמָהּ שִׂטְנָה.", "rashi_he": "שטנה. נושימנ\"ט:", "rashi_en": "״שטנה״ פירושה היזק והפרעה, ובלע״ז נושימנ״ט.", "note": "", "points": [{"q": "מה פירוש השם ״שטנה״ לפי רש״י?", "options": ["היזק והפרעה (בלע״ז נושימנ״ט)", "שנאה ואיבה עמוקה בין הרועים", "קטרוג והלשנה לפני המלך"], "kasha": "מה משמעות השם ״שטנה״ שנתן יצחק לבאר השנייה?", "answer": "רש״י מפרש בלע״ז ״נושימנ״ט״, כלומר היזק והפרעה."}]}, {"id": "26:22.1", "ch": 26, "v": 22, "n": 1, "dh": "ופרינו בארץ", "pasuk_html": "וַיַּעְתֵּ֣ק מִשָּׁ֗ם וַיַּחְפֹּר֙ בְּאֵ֣ר אַחֶ֔רֶת וְלֹ֥א רָב֖וּ עָלֶ֑יהָ וַיִּקְרָ֤א שְׁמָהּ֙ רְחֹב֔וֹת וַיֹּ֗אמֶר כִּֽי־עַתָּ֞ה הִרְחִ֧יב יְהֹוָ֛ה לָ֖נוּ <mark>וּפָרִ֥ינוּ בָאָֽרֶץ׃</mark>", "pasuk_en": "וַיִּסַּע מִשָּׁם בְּאֵר אַחֶרֶת וַיִּחְפְּרוּ וְלֹא־רָבוּ עָלֶיהָ וַיִּקְרָא שְׁמָהּ רְחֹבוֹת וַיֹּאמֶר כִּי־עַתָּה הִרְחִיב ה׳ לָנוּ וּפָרִינוּ בָּאָרֶץ.", "rashi_he": "ופרינו בארץ. כְּתַרְגּוּמוֹ וְנֵיפוּשׁ בְּאַרְעָא:", "rashi_en": "״ופרינו בארץ״ פירושו כתרגום אונקלוס ״וניפוש בארעא״ – ונרבה בארץ.", "note": "", "points": [{"q": "מה פירוש ״ופרינו בארץ״ לפי התרגום שמביא רש״י?", "options": ["ונרבה ונתרבה בארץ", "ונגדל פירות רבים בארץ", "ונתפזר לכל רוחות הארץ"], "kasha": "״ופרינו״ עלול להתפרש מלשון פרי האדמה ולא מלשון ריבוי.", "answer": "כתרגומו ״וניפוש בארעא״, כלומר ונרבה בארץ."}]}, {"id": "26:26.1", "ch": 26, "v": 26, "n": 1, "dh": "ואחזת מרעהו", "pasuk_html": "וַאֲבִימֶ֕לֶךְ הָלַ֥ךְ אֵלָ֖יו מִגְּרָ֑ר <mark>וַאֲחֻזַּת֙ מֵֽרֵעֵ֔הוּ</mark> וּפִיכֹ֖ל שַׂר־צְבָאֽוֹ׃", "pasuk_en": "וַיָּבֹא אֵלָיו אֲבִימֶלֶךְ מִגְּרָר וַאַחוּזַּת מֵרֵעָיו וּפִיכֹל שַׂר־צְבָאוֹ.", "rashi_he": "ואחזת מרעהו. כְּתַרְגּוּמוֹ וְסִיעַת מֵרַחֲמוֹהִי, סִיעַת מֵאוֹהֲבָיו. וְיֵשׁ פּוֹתְרִין מֵרֵעֵהוּ מ' מִיסוֹד הַתֵּבָה, כְּמוֹ שְׁלֹשִׁים מֵרֵעִים דְּשִׁמְשׁוֹן, כְּדֵי שֶׁתִּהְיֶה תֵּבַת וַאֲחֻזַּת דְּבוּקָה; אֲבָל אֵין דֶּרֶךְ אֶרֶץ לְדַבֵּר עַל הַמַּלְכוּת כֵּן, סִיעַת אוֹהֲבָיו, שֶׁאִם כֵּן, כָּל סִיעַת אוֹהֲבָיו הוֹלִיךְ עִמּוֹ, וְלֹא הָיָה לוֹ אֶלָּא סִיעָה אַחַת שֶׁל אוֹהֲבִים – לָכֵן יֵשׁ לְפָתְרוֹ בַּלָּשׁוֹן הָרִאשׁוֹן; וְאַל תִּתְמַהּ עַל תָּי\"ו שֶׁל אֲחֻזַּת וְאַעַ\"פִּ שֶׁאֵין תֵּבָה סְמוּכָה, יֵשׁ דֻּגְמָתָהּ בַּמִּקְרָא עֶזְרָת מִצָּר (תהילים ס'), וּשְׁכֻרַת וְלֹא מִיָּיִן (ישעיהו נ\"א):", "rashi_en": "כתרגום: ״וסיעת מרחמוהי״ – קבוצה מתוך אוהביו. יש שפירשו ״מרעהו״ מלשון ״מרעים״ ו״אחזת״ סמוכה לו – ״סיעת אוהביו״, אבל אין דרך ארץ לומר כך על מלך, שמשמע שלא הייתה לו אלא סיעת אוהבים אחת. והתי״ו של ״אחזת״ אינה ראיה לסמיכות, שיש כדוגמתה ״עזרת מצר״ ו״שכרת ולא מיין״.", "note": "", "points": [{"q": "לפי הפירוש שרש״י מקבל, מה פירוש ״ואחזת מרעהו״?", "options": ["קבוצה מתוך אוהביו – המ״ם במשמעות ״מן״", "כל קבוצת אוהביו – המ״ם משורש המילה", "האחוזה והנחלה של רעהו של אבימלך"], "kasha": "לא ברור אם המ״ם של ״מרעהו״ היא שימושית (״מן״) או חלק מן המילה ״מרע״.", "answer": "כתרגומו ״וסיעת מרחמוהי״ – סיעה מאוהביו, והמ״ם במשמעות ״מן״."}, {"q": "מדוע דוחה רש״י את הפירוש ״סיעת אוהביו״, שהמ״ם משורש המילה?", "options": ["אין דרך ארץ לומר על מלך שהייתה לו סיעת אוהבים אחת בלבד", "כי המילה ״מרעים״ אינה מופיעה בשום מקום במקרא", "כי לאבימלך לא היו אוהבים כלל, אלא עבדים בלבד"], "kasha": "התי״ו של ״אחזת״ מורה לכאורה על סמיכות, ולכן יש שפירשו ״סיעת אוהביו״.", "answer": "אין דרך ארץ לדבר כך על המלכות, שאם כן כל סיעת אוהביו הוליך עמו ולא הייתה לו אלא סיעה אחת. והתי״ו אינה ראיה, שיש כדוגמתה ״עזרת מצר״ ו״שכרת ולא מיין״."}]}, {"id": "26:26.2", "ch": 26, "v": 26, "n": 2, "dh": "אחזת", "pasuk_html": "וַאֲבִימֶ֕לֶךְ הָלַ֥ךְ אֵלָ֖יו מִגְּרָ֑ר <mark>וַאֲחֻזַּת֙</mark> מֵֽרֵעֵ֔הוּ וּפִיכֹ֖ל שַׂר־צְבָאֽוֹ׃", "pasuk_en": "וַיָּבֹא אֵלָיו אֲבִימֶלֶךְ מִגְּרָר וַאַחוּזַּת מֵרֵעָיו וּפִיכֹל שַׂר־צְבָאוֹ.", "rashi_he": "אחזת. לְשׁוֹן קְבִיצָה וַאֲגֻדָּה שֶׁנֶּאֱחָזִין יַחַד:", "rashi_en": "״אחזת״ היא קבוצה ואגודה של אנשים, שנקראת כך משום שהם אחוזים יחד.", "note": "", "points": [{"q": "מה פירוש המילה ״אחזת״ בפסוק?", "options": ["קבוצה ואגודה של אנשים האחוזים יחד", "נחלה ואחוזת קרקע של המלך", "תפיסה בכוח, לשון שבי ומאסר"], "kasha": "״אחזה״ משמעה בדרך כלל נחלה, ומה ענינה כאן?", "answer": "לשון קיבוץ ואגודה, שנאחזים יחד."}]}, {"id": "26:28.1", "ch": 26, "v": 28, "n": 1, "dh": "ראו ראינו", "pasuk_html": "וַיֹּאמְר֗וּ <mark>רָא֣וֹ רָאִ֘ינוּ֮</mark> כִּֽי־הָיָ֣ה יְהֹוָ֣ה&thinsp;׀&thinsp;עִמָּךְ֒ וַנֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖ינוּ בֵּינֵ֣ינוּ ו
