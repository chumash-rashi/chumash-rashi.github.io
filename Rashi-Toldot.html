<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toldot Rashi</title>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body dir="rtl">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-soft:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100dvh;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:4px;height:100%}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.top{display:contents}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
h1 span{display:none}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.count b{color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:none}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-heb);font-size:22px;line-height:1.55;direction:rtl;text-align:right}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{display:none}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:6px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:8px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:18px;line-height:1.45;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:center;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-body);font-size:17px;line-height:1.4;width:100%;direction:rtl}
.opt .k{flex:none;font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-soft)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.row{display:flex;flex-direction:column;gap:2px}
.row .t{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);direction:rtl}
.row p{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:14px;line-height:1.6;direction:rtl;text-align:right}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface);font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line);font-size:14px}
.hint{font-size:11px;color:var(--muted);text-align:center;flex-shrink:0}
.verdict{font-weight:600;font-size:16px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:20px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* taamim: Frank Ruhl lacks cantillation glyphs, so those letters fell back to another font */
.pasuk{font-family:"Noto Serif Hebrew",var(--f-heb)}
/* pasuk panel: visually separate the verse from the question */
.pasuk{background:var(--accent-soft);border-inline-start:5px solid var(--accent);border-radius:10px;padding:calc(var(--s,1)*6px) calc(var(--s,1)*12px)}
.point{border-top:1px solid var(--line);padding-top:calc(var(--s,1)*8px)}
/* fit layout: only pasuk + question + options in the card; fine print lives in the footer */
.wrap{max-width:min(1500px,100%)}
header .top,.tools,.ref,.dh{display:none}
.card{gap:calc(var(--s,1)*8px)}
.pasuk{font-size:calc(var(--s,1)*22px)}
.q{font-size:calc(var(--s,1)*18px)}
.opt{font-size:calc(var(--s,1)*17px);padding:calc(var(--s,1)*7px) calc(var(--s,1)*10px)}
.opt .k{width:calc(var(--s,1)*20px);height:calc(var(--s,1)*20px);font-size:calc(var(--s,1)*11px)}
.row p{font-size:25px;line-height:1.35}
.verdict{font-size:26px;font-weight:700}
.row .t{font-size:16px}
.point{gap:calc(var(--s,1)*10px)}
.card{position:relative}
.reveal{position:absolute;inset-inline:12px;bottom:56px;z-index:3;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.nav .btn{padding:4px 12px;font-size:13px}
@media (max-width:460px){.pasuk{font-size:calc(var(--s,1)*22px)}}
.hint{font-size:11px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}

/* wide screens: split layout (pasuk | question+answers), fonts auto-fit each side */
@media (min-width:900px){
.wrap{max-width:min(1800px,100%)}
.card{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr) auto auto;column-gap:22px;row-gap:8px;overflow:hidden}
.card>.pasuk{grid-column:1;grid-row:1;overflow:hidden;align-self:stretch;font-size:calc(var(--sp,1)*22px);padding:calc(var(--sp,1)*10px) calc(var(--sp,1)*14px)}
.card>.point{position:relative;grid-column:2;grid-row:1;min-height:0;overflow:hidden;border-top:0;padding-top:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--s,1)*12px)}
.card>details{grid-column:1/-1;grid-row:2}
.card>.nav{grid-column:1/-1;grid-row:3}
.reveal{position:absolute;inset:auto 0 0 0;z-index:3;max-height:none;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.row p{font-size:24px;line-height:1.4}
.verdict{font-size:28px;font-weight:700}
.row .t{font-size:16px}
.q{font-size:calc(var(--s,1)*21px)}
.opt{font-size:calc(var(--s,1)*21px)}
}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <h1>רש״י · תולדות <span>רש״י על תולדות</span></h1>
      <div class="count" id="count"></div>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="tools">
      <label for="jump" class="count">עבור אל</label>
      <select id="jump"></select>
      <button class="ghost" id="nextUnanswered" type="button">הבא ללא מענה</button>
      <span id="resetZone"><button class="ghost" id="reset" type="button">התחל מחדש</button></span>
    </div>
  </header>
  <main id="main"></main>
  <div class="hint">מקשים: 1-3 לתשובה · Enter להבא · ← / → לניווט</div>
</div>

const DATA = [{"id": "25:19.1", "ch": 25, "v": 19, "n": 1, "dh": "ואלה תולדות יצחק", "pasuk_html": "<mark>וְאֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק</mark> בֶּן־אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת־יִצְחָֽק׃", "pasuk_en": "וְאֵלֶּה תּוֹלְדוֹת יִצְחָק בֶּן־אַבְרָהָם אַבְרָהָם הוֹלִיד אֶת־יִצְחָק׃", "rashi_he": "ואלה תולדות יצחק. יַעֲקֹב וְעֵשָׂו הָאֲמוּרִים בַּפָּרָשָׁה:", "rashi_en": "וְאֵלֶּה תּוֹלְדוֹת יִצְחָק — יַעֲקֹב וְעֵשָׂו הַמְּדוּבָּרִים בַּחֵלֶק הַזֶּה.", "note": "", "points": [{"q": "לפי רַשִׁ״י, מִי הֵם הַנּוֹשְׂאִים הָעִקָּרִיִּים שֶׁל הַתּוֹלְדוֹת שֶׁל יִצְחָק הַמּוּזְכָּרִים בַּחֵלֶק הַזֶּה?", "options": ["יַעֲקֹב וְעֵשָׂו", "יִצְחָק וְאַבְרָהָם", "יִשְׁמָעֵאל וְיִצְחָק"], "kasha": "הַפָּסוּק אוֹמֵר 'אֵלֶּה תּוֹלְדוֹת יִצְחָק' אֲבָל מִיָּד חוֹזֵר וְאוֹמֵר 'וְאַבְרָהָם הוֹלִיד אֶת יִצְחָק', וְנִרְאֶה שֶׁמַּעְבִּיר אֶת הַמֹּקֵד מִנִּשְׁמֵי יִצְחָק.", "answer": "רַשִׁ״י מַסְבִּיר שֶׁהַמּוֹנָח 'תּוֹלְדוֹת יִצְחָק' מַתְכַּוֵּן לְיַעֲקֹב וְעֵשָׂו, שֶׁהֵם הַנּוֹשְׂאִים הָעִקָּרִיִּים הַמְּדוּבָּרִים בַּחֵלֶק הַתּוֹרָה הַזֶּה."}]}, {"id": "25:19.2", "ch": 25, "v": 19, "n": 2, "dh": "אברהם הוליד את יצחק", "pasuk_html": "וְאֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן־אַבְרָהָ֑ם <mark>אַבְרָהָ֖ם הוֹלִ֥יד אֶת־יִצְחָֽק׃</mark>", "pasuk_en": "וְאֵלֶּה תּוֹלְדוֹת יִצְחָק בֶּן־אַבְרָהָם אַבְרָהָם הוֹלִיד אֶת־יִצְחָק׃", "rashi_he": "אברהם הוליד את יצחק. עַל יְדֵי שֶׁכָּתַב הַכָּתוּב יִצְחָק בֶּן אַבְרָהָם הֻזְקַק לוֹמַר אַבְרָהָם הוֹלִיד אֶת יִצְחָק; לְפִי שֶׁהָיוּ לֵיצָנֵי הַדּוֹר אוֹמְרִים מֵאֲבִימֶלֶךְ נִתְעַבְּרָה שָׂרָה, שֶׁהֲרֵי כַּמָּה שָׁנִים שָׁהֲתָה עִם אַבְרָהָם וְלֹא נִתְעַבְּרָה הֵימֶנּוּ; מֶה עָשָׂה הַקָּבָּ\"ה? צָר קְלַסְתֵּר פָּנָיו שֶׁל יִצְחָק דּוֹמֶה לְאַבְרָהָם, וְהֵעִידוּ הַכֹּל אַבְרָהָם הוֹלִיד אֶת יִצְחָק, וְזֶהוּ שֶׁכָּתוּב כָּאן יִצְחָק בֶּן אַבְרָהָם, שֶׁהֲרֵי עֵדוּת יֵשׁ שֶׁאַבְרָהָם הוֹלִיד אֶת יִצְחָק:", "rashi_en": "אַבְרָהָם הוֹלִיד אֶת יִצְחָק — שׁוּם דָּבָר שֶׁלֹּא כָתַב הַכָּתוּב 'בֶּן־אַבְרָהָם' וְאָמַר 'אַבְרָהָם הוֹלִיד אֶת יִצְחָק', לְפִי שֶׁהַקָּנְטְרָנִי ְחָק֙ בֶּן־אַרְבָּעִ֣ים שָׁנָ֔ה בְּקַחְתּ֣וֹ אֶת־רִבְקָ֗ה בַּת־<mark>בְּתוּאֵל֙ הָֽאֲרַמִּ֔י מִפַּדַּ֖ן אֲרָ֑ם אֲח֛וֹת לָבָ֥ן</mark> הָאֲרַמִּ֖י ל֥וֹ לְאִשָּֽׁה׃", "pasuk_en": "וְיִצְחָק בֶּן־אַרְבָּעִים שָׁנָה לָקַח אֶת־רִבְקָה בַּת־בְּתוּאֵל הָאֲרַמִּי מִפַּדַּן־אֲרָם אֲחוֹת לָבָן הָאֲרַמִּי לוֹ לְאִשָּׁה׃", "rashi_he": "בת בתואל מפדן ארם אחות לבן. וְכִי עֲדַיִן לֹא נִכְתַּב שֶׁהִיא בַּת בְּתוּאֵל וַאֲחוֹת לָבָן וּמִפַּדַּן אֲרָם? אֶלָּא לְהַגִּיד שִׁבְחָהּ, שֶׁהָיְתָה בַּת רָשָׁע וַאֲחוֹת רָשָׁע וּמְקוֹמָהּ אַנְשֵׁי רֶשַׁע וְלֹא לָמְדָה מִמַּעֲשֵׂיהֶם:", "rashi_en": "בַּת־בְּתוּאֵל הָאֲרַמִּי מִפַּדַּן־אֲרָם אֲחוֹת לָבָן — הֲלוֹא כְּבָר כָּתוּב שֶׁהִיא בַּת בְּתוּאֵל וְאֲחוֹת לָבָן מִפַּדַּן־אֲרָם? אֶלָּא הִשְׁנִיתִו הַכָּתוּב לְשִׁבְחָהּ שֶׁהִיא בַּת אִישׁ רָשָׁע וְאֲחוֹת אִישׁ רָשָׁע וּמְגוּרָהּ בִּמְדִּינָה שֶׁל רָשָׁעִים וְלֹא לָמְדָה מִמַּעֲשֵׂיהֶם.", "note": "", "points": [{"q": "לָמָּה חוֹשֵׁב רַשִׁ״י שֶׁהַפָּסוּק חוֹזֵר וְחוֹזֵר שֶׁרִבְקָה הִיא בַּת בְּתוּאֵל, אֲחוֹת לָבָן, וּמִפַּדַּן־אֲרָם?", "options": ["לְהִשְׁתַּבַּח אֶת רִבְקָה עַל שֶׁלֹּא לָמְדָה רִשְׁעוּת מִמִּשְׁפַּחְתָּהּ הָרְשָׁעוֹת וּמִסִּבִּיבָתָהּ", "לְהַדְגִּישׁ אֶת הַמֶּרְחַק הַגָּדוֹל שֶׁנָּסַע אַבְרָהָם כְּדֵי לִמְצֹא אוֹתָהּ", "לְהַקִּים אֶת זְכוּת־הַחִקּוּק שֶׁלָּהּ לִנְשֹׂא בְּתוֹךְ הַמִּשְׁפָּחָה"], "kasha": "הַפְּרָטִים הַלָּלוּ עַל יָחֲסֵי רִבְקָה וּמְקוֹרָהּ כְּבָר הוּזְכְּרוּ קוֹדְמוֹנִית, אִם־כֵּן לָמָּה לִחְזֹר עֲלֵיהֶם?", "answer": "רַשִׁ״י מַסְבִּיר שֶׁהַחִזְרוּר מִיועַד לְהִשְׁתַּבַּח אֶת פִּקּוּדָּהּ שֶׁל רִבְקָה—אַף־עַל־פִּי שֶׁהִיא בַּת אִישׁ רָשָׁע, אֲחוֹת אִישׁ רָשָׁע, וּגְדוּלָתָהּ הִיא בְּמִדִּנָה שֶׁל רָשָׁעִים, עָדַיִן לֹא לָמְדָה מִדְּרָכֵיהֶם."}]}, {"id": "25:20.3", "ch": 25, "v": 20, "n": 3, "dh": "מפדן ארם", "pasuk_html": "וַיְהִ֤י יִצְחָק֙ בֶּן־אַרְבָּעִ֣ים שָׁנָ֔ה בְּקַחְתּ֣וֹ אֶת־רִבְקָ֗ה בַּת־בְּתוּאֵל֙ הָֽאֲרַמִּ֔י <mark>מִפַּדַּ֖ן אֲרָ֑ם</mark> אֲח֛וֹת לָבָ֥ן הָאֲרַמִּ֖י ל֥וֹ לְאִשָּֽׁה׃", "pasuk_en": "וְיִצְחָק בֶּן־אַרְבָּעִים שָׁנָה לָקַח אֶת־רִבְקָה בַּת־בְּתוּאֵל הָאֲרַמִּי מִפַּדַּן־אֲרָם אֲחוֹת לָבָן הָאֲרַמִּי לוֹ לְאִשָּׁה׃", "rashi_he": "מפדן ארם. עַל שֵׁם שֶׁשְּׁנֵי אֲרָם הָיוּ, אֲרַם נַהֲרַיִם וַאֲרַם צוֹבָה, קוֹרֵא אוֹתוֹ פַּדָּן, לְשׁוֹן צֶמֶד בָּקָר, תַּרְגּוּם פַּדָּן תּוֹרִין; וְיֵשׁ פּוֹתְרִין פַּדַּן אֲרָם כְּמוֹ שְׂדֵה אֲרָם, שֶׁבִּלְשׁוֹן יִשְׁמָעֵאל קוֹרִין לְשָׂדֶה פַדַּן:", "rashi_en": "מִפַּדַּן־אֲרָם — עַל שֵׁם שֶׁהָיוּ שְׁנֵי אֲרָמִּים אֲרַם נַהֲרַיִם וַאֲרַם צוֹבָה קְרוּיָה פַּדַּן־אֲרָם פַּדַּן פִּרְשׁוּ זוּג כַּמִּלַּת צְמַד בָּקָר שֶׁנֶּאֱמַר וַיִּקַּח צֶמֶד בָּקָר וַדַּאי שֶׁצְּמַד פִּרְשׁוּ זוּג וְתַרְגּוּם פַּדַּן תּוֹרִין זוּג שׁוֹרִים כֵּן פַּדַּן פִּרְשׁוּ זוּג וְיֵשׁ אוֹמְרִים פַּדַּן־אֲרָם כְּמוֹ שְׂדֵה אֲרָם שֶׁנֶּאֱמַר בַּלִּשּׁוֹן הַעֲרַבִּי שָׂדֶה קוּרָא פַּדָּן.", "note": "", "points": [{"q": "מַה אוֹמֵר רַשִׁ״י שֶׁמַּשְׁמַעוּת הַמִּלָּה 'פַּדַּן' בִּ'פַּדַּן־אֲרָם'?", "options": ["זוּג אוֹ עוֹל (כְּמוֹ זוּג קָרוֹת בָּקָר)", "שָׂדֶה פּוֹרִי אוֹ מִישׁוֹר", "יְחִידַת מִדָּה שֶׁל מֶרְחַק"], "kasha": "הַנִּשְׁמַרְתָּא 'פַּדַּן־אֲרָם' אִיָּ־תוֹ בִּלְבַד וּדּוֹרֶשֶׁת הֲבָרָה שֶׁל הַמַּשְׁמַעוּת שֶׁל 'פַּדַּן'.", "answer": "רַשִׁ״י מַסְבִּיר שֶׁ'פַּדַּן' פִּרְשׁוּ זוּג, דּוֹמֶה לַעוֹל שֶׁל בָּקָר, וְנִשְׁתַּמַּשׁ בוֹ כִּי הָיוּ שְׁנֵי אֲרָמִּים (אֲרַם נַהֲרַיִם וְאֲרַם צוֹבָה), לָכֵן 'פַּדַּן־אֲרָם' אוֹ 'הַזּוּג שֶׁל הָאֲרָמִּים'."}]}, {"id": "25:21.1", "ch": 25, "v": 21, "n": 1, "dh": "ויעתר", "pasuk_html": "<mark>וַיֶּעְתַּ֨ר</mark> יִצְחָ֤ק לַֽיהֹוָה֙ לְנֹ֣כַח אִשְׁתּ֔וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא וַיֵּעָ֤תֶר לוֹ֙ יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיֶּעְתַּר יִצְחָק לַה' לְנוֹכַח אִשְׁתּוֹ כִּי עֲקָרָה הִוא וַיִּעָתֶר לוֹ ה' וַתַּהַר רִבְקָה אִשְׁתּוֹ.", "rashi_he": "ויעתר. הִרְבָּה וְהִפְצִיר בִּתְפִלָּה:", "rashi_en": "וַיְעַתֵּר - הִתְפַּלֵּל הַרְבֵּה וּבְדַחְיוּת.", "note": "", "points": [{"q": "מה אומר רש״י שהמילה 'וַיְעַתֵּר' (וַיִּתְחַנַּן) אומרת בנוגע לאופן שבו התפלל יִצְחָק?", "options": ["הִתְפַּלֵּל הַרְבֵּה וּבְדַחְיוּת", "הִתְפַּלֵּל בִּשְׁתִיקָה בְּלִי מִילִים", "הִתְפַּלֵּל רַק פַּעַם אַחַת בֶּאֱמוּנָה גְּדוֹלָה"], "kasha": "הַפּוֹעַל 'וַיְעַתֵּר' אֵינוֹ מִלָּה נָפוֹצָה לִתְפִילָה וּמִשְׁמַעוּתוֹ הַמְדוּיֶּקֶת צְרִיכָה הַבְהָרָה.", "answer": "רש״י מְלַמֵּד שֶׁ'וַיְעַתֵּר' פִּרְשׁוֹ הִתְפַּלֵּל הַרְבֵּה (בְּשִׂפְלוּת) וּבְדַחְיוּת, וּמַעֲבִיר מַשְׁמַעוּת שֶׁל בַּקָּשָׁה עִזָּה וַחֲזוּרָה."}]}, {"id": "25:21.2", "ch": 25, "v": 21, "n": 2, "dh": "ויעתר לו", "pasuk_html": "וַיֶּעְתַּ֨ר יִצְחָ֤ק לַֽיהֹוָה֙ לְנֹ֣כַח אִשְׁתּ֔וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא <mark>וַיֵּעָ֤תֶר לוֹ֙</mark> יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיֶּעְתַּר יִצְחָק לַה' לְנוֹכַח אִשְׁתּוֹ כִּי עֲקָרָה הִוא וַיִּעָתֶר לוֹ ה' וַתַּהַר רִבְקָה אִשְׁתּוֹ.", "rashi_he": "ויעתר לו. נִתְפַּצֵּר וְנִתְפַּיֵּס וְנִתְפַּתָּה לוֹ. וְאוֹמֵר אֲנִי, כָּל לְשׁוֹן עֶתֶר לְשׁוֹן הַפְצָרָה וְרִבּוּי הוּא, וְכֵן וַעֲתַר עֲנַן הַקְּטֹרֶת (יחז' ח') – מַרְבִּית עֲלִיַּת הֶעָשָׁן, וְכֵן וְהַעְתַּרְתֶּם עָלַי דִּבְרֵיכֶם (שם ל\"ה), וְכֵן וְנַעְתָּרוֹת נְשִׁיקוֹת שׂוֹנֵא (משלי כ\"ז) – דּוֹמוֹת לִמְרֻבּוֹת וְהִנָּם לְמַשָּׂא; אנקרי\"שרא בלע\"ז:", "rashi_en": "וַיִּעָתֶר לוֹ - הִשְׁמִיעַ אֶת עַצְמוֹ לְהִשָּׁמַע, הִרְפֵּה וְנִשְׁמַר מִיָּדוֹ. וַאֲנִי אוֹמֵר שֶׁבְּכָל מָקוֹם שֶׁנִּשְׁמַר הַשּׁוֹרֶשׁ עתר יֵשׁ בּוֹ הַמִּשְׁמָעוּת שֶׁל צְבִירָה וַהַרְבָּיָה. כְּמוֹ (יְחֶזְקְאֵל ח:יא) 'וַעֲנַן עתר' שֶׁהוּא רוֹב הַשֵּׁם הַעוֹלֶה, וּכְמוֹ (יְחֶזְקְאֵל לה:יג) 'וְהַעתַרְתֶּם עָלַי דִּבְרֵיכֶם' רַבִּיתֶם הַדְּבָרִים שֶׁלָּכֶם עָלַי, וּכְמוֹ (מִשְׁלֵי כז:ו) 'נְעתָרוֹת נִשְׁקוֹת אוֹיֵב' שֶׁנִּרְאוּ הַרְבֵּה וּמִשּׁוּם כָּךְ הֵם כַּבְּדִים.", "note": "", "points": [{"q": "לְפִי הַבְּיָרוּר שֶׁל רש״י לַמִּלָּה 'וַיִּעָתֶר לוֹ,' מָה הוּא הַשּׁוֹרֶשׁ הָעִקָּרִי שֶׁל הַמִּלָּה 'עתר'?", "options": ["צְבִירָה, הַרְבָּיָה, אוֹ הַכְפָּלָה", "עִמִּידָה אוֹ הִשְׁתַּמְּרוּת בִּמְקוֹם", "הִשְׁמַע אוֹ הֲקְשָׁבָה בְּתַשְׁמֵת אַזְנָיִם"], "kasha": "הַצִּירוּף 'וַיִּעָתֶר לוֹ' מִשְׁתַּמֵּשׁ בַּשּׁוֹרֶשׁ 'עתר', וּמִשְׁמַעוּתוֹ הַמְדוּיֶּקֶת צְרִיכָה הִבָּנוּת מִן הַהִקְשֵׁר וּמִשִּׁמּוּשִׁים בִּבְלִיִּים אֲחֵרִים.", "answer": "רש״י מְבָאֵר שֶׁבְּכָל מָקוֹם שֶׁהַשּׁוֹרֶשׁ 'עתר' מוֹפִיעַ, לוֹ הַמִּשְׁמָעוּת שֶׁל צְבִירָה, הַרְבָּיָה אוֹ הַכְפָּלָה, כַּמּוֹ שֶׁנִּרְאָה בְּפָסוּקִים בִּבְלִיִּים אֲחֵרִים עַל גַּבֵּי שִׁפְעַת וַעֲצִילוּת."}]}, {"id": "25:21.3", "ch": 25, "v": 21, "n": 3, "dh": "לנכח אשתו", "pasuk_html": "וַיֶּעְתַּ֨ר יִצְחָ֤ק לַֽיהֹוָה֙ <mark>לְנֹ֣כַח אִשְׁתּ֔וֹ</mark> כִּ֥י עֲקָרָ֖ה הִ֑וא וַיֵּעָ֤תֶר לוֹ֙ יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיֶּעְתַּר יִצְחָק לַה' לְנוֹכַח אִשְׁתּוֹ כִּי עֲקָרָה הִוא וַיִּעָתֶר לוֹ ה' וַתַּהַר רִבְקָה אִשְׁתּוֹ.", "rashi_he": "לנכח אשתו. זֶה עוֹמֵד בְּזָוִית זוֹ וּמִתְפַּלֵּל וְזוֹ עוֹמֶדֶת בְּזָוִית זוֹ וּמִתְפַּלֶּלֶת:", "rashi_en": "לְנוֹכַח אִשְׁתּוֹ - עָמַד הוּא בִּקְצָה אַחַת וּמִתְפַּלֵּל, וְהִיא עוֹמֶדֶת בִּקְצָה שְׁנִיָּה וּמִתְפַּלֶּלֶת.", "note": "", "points": [{"q": "מה אומר רש״י בנוגע לאופן שבו התפללו יִצְחָק וְרִבְקָה לגבי עמדתם 'מול' אחד לשני?", "options": ["הוא עמד בקרן אחת וחנן בעוד היא עמדה בקרן שנייה והתפללה", "שניהם כרעו ביחד באותו המזבח", "עמדו מול אחד לשני כדי שיוכלו לראות אחד את השני בהתפללותם"], "kasha": "הַצִּירוּף 'לְנוֹכַח אִשְׁתּוֹ' (מול אשתו) מְתַאֵר קַשֶּׁרֶת מְרוּחָקִית בִּזְמַן תְּפִילָה שְׁצָרִיכָה הַבְהָרָה.", "answer": "רש״י מְלַמֵּד שֶׁיִצְחָק עָמַד בִּקְצָה אַחַת וְהִתְפַּלֵּל בְּעוֹד רִבְקָה עָמְדָה בִּקְצָה שְׁנִיָּה וְהִתְפַּלְּלָה, כָּל אַחַד מִחִנַּן לִפְנֵי ה' בִּנְפָרָד."}]}, {"id": "25:21.4", "ch": 25, "v": 21, "n": 4, "dh": "ויעתר לו", "pasuk_html": "וַיֶּעְתַּ֨ר יִצְחָ֤ק לַֽיהֹוָה֙ לְנֹ֣כַח אִשְׁתּ֔וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא <mark>וַיֵּעָ֤תֶר לוֹ֙</mark> יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיֶּעְתַּר יִצְחָק לַה' לְנוֹכַח אִשְׁתּוֹ כִּי עֲקָרָה הִוא וַיִּעָתֶר לוֹ ה' וַתַּהַר רִבְקָה אִשְׁתּוֹ.", "rashi_he": "ויעתר לו. לוֹ וְלֹא לָהּ, שֶׁאֵין דּוֹמָה תְפִלַּת צַדִּיק בֶּן צַדִּיק לִתְפִלַּת צַדִּיק בֶּן רָשָׁע, לְפִיכָךְ לוֹ וְלֹא לָהּ (יבמות ס\"ד):", "rashi_en": "וַיִּעָתֶר לוֹ - לוֹ וְלֹא לָהּ, שֶׁאֵין דּוֹמֶה תְּפִילַת צַדִּיק שֶׁהוּא בֵן לְצַדִּיק לִתְפִילַת צַדִּיק שֶׁהוּא בֵן לְרָשָׁע, לְפִיכָךְ נִשְׁמַר ה' לִתְפִילַת יִצְחָק וְלֹא לִתְפִילָתָהּ.", "note": "", "points": [{"q": "לָמָה הָאֱלוֹהִים שָׁמַע לִתְפִילַת יִצְחָק וְלֹא לִתְפִילַת רִבְקָה, לְפִי רש״י?", "options": ["מִשּׁוּם שֶׁיִצְחָק הָיָה בֵן לָאָב צַדִּיק, מִה שֶּׁעָשָׂה לִתְפִילָתוֹ יוֹתֵר עַז מִתְּפִילַת אִשָּׁה צַדֶּקֶת שֶׁנּוֹלְדָה לְאָב רָשָׁע", "מִשּׁוּם שֶׁה' שׁוֹמֵעַ רַק לִתְפִילוֹת אָנָשִׁים וְלֹא לִתְפִילוֹת נָשִׁים", "מִשּׁוּם שֶׁיִצְחָק הִתְפַּלֵּל בְּקוֹל רָם יוֹתֵר וּבְעִזּוּז גָּדוֹל יוֹתֵר מִרִבְקָה"], "kasha": "הַפָּסוּק אוֹמֵר שֶׁה' נִשְׁמַע 'לוֹ', אַךְ לֹא מְבָאֵר לָמָה ה' שָׁמַע לִתְפִילַת יִצְחָק בִּמְיוּחַד וְלֹא לִתְפִילַת רִבְקָה.", "answer": "רש״י מְבָאֵר שֶׁתְּפִילַת אִישׁ צַדִּיק שֶׁהוּא בֵן לְאָב צַדִּיק הִיא בִּשְׁקַל יוֹתֵר מִתְּפִילַת אִישׁ צַדִּיק שֶׁהוּא וְלַד אָב רָשָׁע, וּמִשּׁוּם כָּךְ ה' הִשְׁמִיעַ עַצְמוֹ לִתְפִילַת יִצְחָק וְלֹא לִתְפִילָתָהּ."}]}, {"id": "25:22.1", "ch": 25, "v": 22, "n": 1, "dh": "ויתרוצצו", "pasuk_html": "<mark>וַיִּתְרֹֽצְצ֤וּ</mark> הַבָּנִים֙ בְּקִרְבָּ֔הּ וַתֹּ֣אמֶר אִם־כֵּ֔ן לָ֥מָּה זֶּ֖ה אָנֹ֑כִי וַתֵּ֖לֶךְ לִדְרֹ֥שׁ אֶת־יְהֹוָֽה׃", "pasuk_en": "וַיִּתְרֹצְצוּ הַבָּנִים בְקִרְבָּהּ וַתֹּאמֶר אִם־כֵּן לָמָּה זֶה אָנֹכִי", "rashi_he": "ויתרוצצו. עַ\"כָּ הַמִּקְרָא הַזֶּה אוֹמֵר דָּרְשֵׁנִי, שֶׁסָּתַם מַה הִיא רְצִיצָה זוֹ וְכָתַב אִם כֵּן לָמָּה זֶּה אָנֹכִי? רַבּוֹתֵינוּ דְּרָשׁוּהוּ לְשׁוֹן רִיצָה; כְּשֶׁהָיְתָה עוֹבֶרֶת עַל פִּתְחֵי תּוֹרָה שֶׁל שֵׁם וָעֵבֶר יַעֲקֹב רָץ וּמְפַרְכֵּס לָצֵאת, עוֹבֶרֶת עַל פֶּתַח עֲבוֹדַת אֱלִילִים, עֵשָׂו מְפַרְכֵּס לָצֵאת. דָּבָר אַחֵר מִתְרוֹצְצִים זֶה עִם זֶה וּמְרִיבִים בְּנַחֲלַת שְׁנֵי עוֹלָמוֹת.", "rashi_en": "וַיִּתְרֹצְצוּ - צָרִיךְ לוֹמַר שֶׁהַפָּסוּק זֶה צָרִיךְ לְמִדְרָשִׁי עַל־דֶּרֶךְ שֶׁהוּא מִשְׁתַּעְשַׁע וַאֲנַחְנוּ צָרִיכִים לֵידַע מָה הַתְּרִיצָה הַזֹּאת. רַבּוֹתֵינוּ אוֹמְרִים שֶׁויִּתְרֹצְצוּ הוּא לְשׁוֹן רוּץ וְתִנּוּעַ קַל. כְּשֶׁהִיא עוֹבֶרֶת בִּפְתַח בֵּית הַמִּדְרָשׁ הַיַּחִידִי שֶׁל־שֵׁם וְעֵבֶר - יַעֲקֹב מִתְרוֹצֵץ לִהִשָּׁמַע מֵהַבֶּטֶן. וְכִשְׁהִיא עוֹבֶרֶת עַל־שַׁעַר בֵּית־כְּנֶסֶת לַעֲבוֹדַת אֱלִילִים - עֵשָׂו מִתְרוֹצֵץ לִהִשָּׁמַע מֵהַבֶּטֶן. וְדָבָר אַחֵר הִשְׁתַּדְּלוּ זֶה בְזֶה עַל חַלּוּקַת שְׁנֵי הָעוֹלָמוֹת.", "note": "", "points": [{"q": "כיצד מסביר רש״י את המשמעות של 'ויתרוצצו' (התנגשות) של הילדים בבטן רבקה?", "options": ["שני העוברים רצו ונעו בתנועות אלימות - יעקב לעבר בתי מדרש של תורה כשרבקה עברה על פניהם, ועשו לעבר אלילות כשעברה על פני בתי כניסה ליעבודת כוכבים", "הילדים נלחמו זה בזה ממש על מי יישמח ראשון מהבטן", "רבקה חוותה אי-נוחות הריון רגילה שכל אישה בהריון חוותה"], "kasha": "הפסוק משתמש בביטוי ויתרוצצו (התנגשות) אך לא מסביר מה מייצגת התנגשות זו או למה היא הדחיקה את רבקה לשאלתה הקיומית על הריונה.", "answer": "רש״י מפרש את ויתרוצצו כתנועה מהירה, ומסביר שכל ילד נמשך לעברן הרוחני שלהם - יעקב נעו בתנועות אלימות לעבר מרכזי תורה בכל פעם שרבקה עברה עליהם, וגם עשו נעו אלימות לעבר בתי כניסה לעבודת אלילים, המייצגים את הטבעים הרוחניים המנוגדים שלהם."}, {"q": "מה מציע הפירוש החלופי של רש״י על טבעה של הסכסוך בין התאומים?", "options": ["הם ריבו על התורשה וחלוקת שני העולמות ביניהם", "הם התחרו זה בזה רק כדי לראות מי יצא מהבטן ראשון", "הם התנגשו כי הרגישו בחוסר נוחות במרחב הצר של הבטן"], "kasha": "הפסוק מתאר התנגשות פיזית אך לא מספק הקשר למה התנגשות זו התרחשה או מה היא סימנה.", "answer": "רש״י מציע אפשרות חלופית שהתאומים התנגשו זה בזה כשהם ריבו כיצד לחלוק את שני העולמות כתורשה שלהם, מה שמצביע על סכסוך רוחני ולא רק פיזי."}]}, {"id": "25:22.2", "ch": 25, "v": 22, "n": 2, "dh": "ותאמר אם כן", "pasuk_html": "וַיִּתְרֹֽצְצ֤וּ הַבָּנִים֙ בְּקִרְבָּ֔הּ <mark>וַתֹּ֣אמֶר אִם־כֵּ֔ן</mark> לָ֥מָּה זֶּ֖ה אָנֹ֑כִי וַתֵּ֖לֶךְ לִדְרֹ֥שׁ אֶת־יְהֹוָֽה׃", "pasuk_en": "וַיִּתְרֹצְצוּ הַבָּנִים בְקִרְבָּהּ וַתֹּאמֶר אִם כֵּן לָמָּה זֶה אָנֹכִי", "rashi_he": "ותאמר אם כן. גָּדוֹל צַעַר הָעִבּוּר.", "rashi_en": "וַתֹּאמֶר אִם כֵּן - וַתֹּאמֶר אִם כָּכָה כּוֹאֵב הַהוֹרָה", "note": "", "points": [{"q": "מה הכוונה של רִבְקָה כשהיא אומרת 'אם כן למה זה אנכי' לפי רַשִׁ״י?", ים גְּדוֹלִים בֶּעָתִיד", "הַתְּאוֹמִים יִהְיוּ מְייצְּגִים שְׁנֵי מַמְלָכוֹת שׁוֹנוֹת שֶׁיִּתְפַּתְּחוּ בְּנִפְרָד"], "kasha": "הַמִּלָּה 'גוֹיִם' (לְאוּמִים) כְּתוּבָה בִּכְתִיבָה יְחוּדִית; הַמִּשְׁמָעוּת הַפָּשׁוּטָה מִתְיַחֶסֶת לִבְנֵי עֵשָׂו וְיַעֲקֹב, אַךְ הַשִּׁנּוּי בִּכְתִיבָה קוֹרֵא לְהוֹרָאָה עֲמוּקָה יוֹתֵר.", "answer": "רַשִׁ\"י מִשְׁמַר שֶׁגִּים כָּתוּב בִּכְתִיבָה יְחוּדִית (גוֹיִם בְּלִי הַוָּו) שֶׁמַּשְׁמַעוּת שְׁלָהּ 'אָדָם נִשְׂגָּב', וְהוּא מְפָרֵשׁ זֹאת כַּשִּׁמּוּשׁ לַאַנְטוֹנִינוּס וּלְרַבִּי (רַבִּי יְהוּדָה הַנָּשִׂיא), שֶׁעַל שֻׁלְחָנָם לֹא הָיָה חִסָּרוֹן בִּצְלִילִית אוֹ בֶּחָסַל בְּכָל עוֹנָה, מוֹכִיחַ הִכְנָסַת אוֹרְחִים יוֹצְאִית."}]}, {"id": "25:23.3", "ch": 25, "v": 23, "n": 3, "dh": "ושני לאמים", "pasuk_html": "וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ <mark>וּשְׁנֵ֣י לְאֻמִּ֔ים</mark> מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ וּלְאֹם֙ מִלְאֹ֣ם יֶֽאֱמָ֔ץ וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וַיֹּאמֶר יְהוָה לָהּ שְׁנֵי גוֹיִם בִּבִטְנֵךְ וּשְׁנֵי לְאֻמִּים מִמְּעַיִךְ יִפָּרֵדוּ וּלְאֹם מִלְאֹם יֶאֱמָץ וְרַב יַעֲבֹד אֶת הַקָּטָן", "rashi_he": "ושני לאמים. אֵין לְאֹם אֶלָּא מַלְכוּת:", "rashi_en": "וּשְׁנֵי לְאֻמִּים - הַמִּלָּה לְאוּם תָּמִיד מַשְׁמַעוּת עַם שֶׁיֵּשׁ לוֹ כָּל מַתְנוּת הַמַּמְלָכָה", "note": "", "points": [{"q": "עַל פִּי רַשִׁ\"י, מָה הַמַּשְׁמָעוּת שֶׁל הַמִּלָּה 'לְאוּם' (גוֹי/עַם) בִּנְבוּאַת אֱלֹהִים לְרִבְקָה?", "options": ["זֶה מִתְיַחֵס בִּמְיוּחַס לְאוּמּוֹת שֶׁיֵּשׁ לָהֶם כָּל מַתְנוּת הַמַּמְלָכָה", "זֶה פָּשׁוּט אוֹמֵר כָּל קְבוּצַת אָדָם, בְּלֹא קְשׁוּר לְמִבְנֶה פּוֹלִיטִי", "זֶה מִתְיַחֵס רַק לִבְנֵי אַבְרָהָם"], "kasha": "הַפָּסוּק שׁוֹמֵר בִּמְלַת 'לְאוּם' (לְאוּם) וְלֹא בִּמְלוֹת אַחֵרוֹת לַעַם; מָה עוֹשֶׂה אֶת הַמִּלָּה הַזּוֹ חָשׁוּבָה?", "answer": "הַמִּלָּה 'לְאוּם' מַשְׁמַעוּת עַם שֶׁיֵּשׁ לוֹ כָּל מַתְנוּת הַמַּמְלָכָה, לֹא רַק קְבוּצַת אָנָשִׁים. זֶה מְדַגִּיש שֶׁבְּנֵי עֵשָׂו וְיַעֲקֹב יִתְפַּתְּחוּ לִלְאוּמוֹת מֻקָּמוֹת בִּשְׁלֵמוּת."}]}, {"id": "25:23.4", "ch": 25, "v": 23, "n": 4, "dh": "ממעיך יפרדו", "pasuk_html": "וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ וּשְׁנֵ֣י לְאֻמִּ֔ים <mark>מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ</mark> וּלְאֹם֙ מִלְאֹ֣ם יֶֽאֱמָ֔ץ וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת וְהִנֵּה תְאוֹמִים בְּבִטְנָהּ", "rashi_he": "ממעיך יפרדו. מִן הַמֵּעַיִם הֵם נִפְרָדִים זֶה לְרִשְׁעוֹ וְזֶה לְתֻמּוֹ:", "rashi_en": "וַיִּמְלְאוּ יָמֶיהָ - בְּרֶגַע שֶׁהֵם יוֹצְאִים מִמְּעַיִךְ כָּל אֶחָד נוֹשֵׂא אַחֲרוֹ דֶּרֶךְ אַחֶרֶת - אֶחָד לִדְרָכָיו הָרִשְׁעוֹת וְאֶחָד לִדְרַךְ הַיָּשָׁר", "note": "", "points": [{"q": "מָה כּוּנְיַת רַשִׁ\"י בְּאוֹמְרוֹ שֶׁהַתְּאוֹמִים יִהְיוּ 'נִפְרָדִים מִן הַמֵּעַיִם'?", "options": ["הֵם יִלְכוּ דְרָכִים מוֹרָלִית וְרוּחָנִית שׁוֹנוֹת מֻשְׁמוּ הִוָּלְדוּת", "הַהִפְרָדוּת הַפִּיזִית שֶׁלָּהֶם בִּיְלִידָה תִּהְיֶה יִיחוּת כָּאֵב", "הֵם יִהְיוּ מִוּפְרָדִים גְּאוֹגְרָפִית מִשׁוּם שֶׁהֵם יִוָּלְדוּ"], "kasha": "מָה בִּדְיוּק מַשְׁמַעוּת הַפְּרִיצָה 'יִפָּרְדוּ מִן הַמֵּעַיִם' לַטִּבְעַ שֶׁל שְׁנֵי הָעַמִּים הַלָּלוּ?", "answer": "בְּרֶגַע שֶׁהֵם יוֹצְאִים מִן גּוּפָהּ שֶׁל רִבְקָה, הֵם יִלְכוּ דְרָכִים שׁוֹנוֹת בִּמְהֻרְתִּי - אֶחָד לִדְרָכָיו הָרִשְׁעִים, וְאֶחָד לְדַרְכּוֹ הַיָּשָׁר - וּמְקוֹמוֹת אִתִּיוֹתָיו הַנִּפְרָדוֹת מִן הַמֵּעַיִם."}]}, {"id": "25:23.5", "ch": 25, "v": 23, "n": 5, "dh": "מלאם יאמץ", "pasuk_html": "וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ וּשְׁנֵ֣י לְאֻמִּ֔ים מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ וּלְאֹם֙ <mark>מִלְאֹ֣ם יֶֽאֱמָ֔ץ</mark> וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וְלְאֹם מִלְאֹם יֶאֱמָץ וְרַב יַעֲבֹד אֶת הַקָּטָן", "rashi_he": "מלאם יאמץ. לֹא יִשְׁווּ בִּגְדֻלָּה, כְּשֶׁזֶּה קָם זֶה נוֹפֵל, וְכֵן הוּא אוֹמֵר אִמָּלְאָה הָחֳרָבָה (יחזקאל כ\"ו), לֹא נִתְמַלְּאָה צוֹר אֶלָּא מֵחֻרְבָּנָהּ שֶׁל יְרוּשָׁלַיִם:", "rashi_en": "וּלְאֹם מִלְאֹם יֶאֱמָץ - לֹא יִהְיוּ שְׁנֵיהֶם גְּדוֹלִים בִּבְחִינַת אַחַת, כִּי אִם כַּאֲשֶׁר זֶה עוֹלֶה, זֶה נוֹפֵל. שֶׁנֶּאֱמַר בְּצוֹר (איכה א) 'מִלְאִי חָרְבּוֹת' - צוֹר נִמְלְאָה רַק בַּחֹרְבַּן שֶׁל יְרוּשָׁלַיִם", "note": "", "points": [{"q": "מַה מַלֵּמֵד רַשִׁ\"י עַל הַיַּחַס בֵּין כֹּחָם שֶׁל שְׁנֵי הָעַמִּים וְעוֹדְפָנוּתָם?", "options": ["הֵם לֹא יַגִּיעוּ לִגְדוּלוּת שָׁוָה בִּבְחִינַת אַחַת; כַּאֲשֶׁר אֶחָד עוֹלֶה, הַשֵּׁנִי נוֹפֵל", "עַם אֶחָד יִהְיֶה עַד לְעוֹלָם עַל הַשֵּׁנִי", "הֵם יִשְׁתָּרְרוּ וְיִשְׁמְרוּ מֻשׁוֹמוֹת שָׁוֹת שֶׁל עִנְיָנִים"], "kasha": "הַפָּסוּק אוֹמֵר שְׁעַם אֶחָד יִהְיֶה עָצוּם מִן הַשֵּׁנִי, אַךְ כֵּיצַד זֶה מִתְבַּטֵּא עִם הַזְּמַן?", "answer": "שְׁנֵי הַעַמִּים לֹא יַגִּיעוּ לִגְדוּלוּת שָׁוָה בִּבְחִינַת אַחַת: כַּאֲשֶׁר אֶחָד עוֹלֶה לִשְׁלִיטוֹן, הַשֵּׁנִי יִפּוֹל - מוּדְגָּם בְּכֵיצַד צוֹר שׁוּגְּרַת מִן הַחֻרְבַּן שֶׁל יְרוּשָׁלַיִם, כְּלוֹמַר כֹּחוֹ שֶׁל עַם אַחָד בָּא עַל שִׁמּוּשׁ הַשֵּׁנִי."}]}, {"id": "25:24.1", "ch": 25, "v": 24, "n": 1, "dh": "וימלאו ימיה", "pasuk_html": "<mark>וַיִּמְלְא֥וּ יָמֶ֖יהָ</mark> לָלֶ֑דֶת וְהִנֵּ֥ה תוֹמִ֖ם בְּבִטְנָֽהּ׃", "pasuk_en": "וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת וְהִנֵּה תְאוֹמִים בְּבִטְנָהּ", "rashi_he": "וימלאו ימיה. אֲבָל בְּתָמָר כְּתִיב וַיְהִי בְּעֵת לִדְתָּהּ (בראשית ל״ח:כ״ז), שֶׁלֹּא מָלְאוּ יָמֶיהָ, כִּי לְז' חֳדָשִׁים יְלָדָתַם:", "rashi_en": "וַיִּמְלְאוּ יָמֶיהָ - וּבְתָמָר נֶאֱמַר 'וַיְהִי בְעֵת לִדְתָּהּ' כִּי לֹא מָלְאוּ יָמֶיהָ שֶׁיָּלְדָה בְּשִׁבְעָה חוֹדָשִׁים", "note": "", "points": [{"q": "לָמָה רַשִׁ\"י מְשַׁווֶּה אֶת הַהֱרוֹן שֶׁל רִבְקָה לְהֶרוֹן שֶׁל תָּמָר בִּשְׁבִיל הַצִּיּוּן 'יָמֶיהָ מָלְאוּ'?", "options": ["לְהַרְאוֹת שֶׁרִבְקָה הִנַּשְּׁלָה אֶת הֵרוֹנָהּ עַד הַסּוֹף בַּעוֹד תָּמָר הוֹלִידָה בִּזְמַן מוּקְדַּם בַּחֹדֶשׁ הַשְּׁבִיעִי", "לְהַרְאוֹת שֶׁשְׁתֵּי הַנָּשִׁים הָיוּ בֹעָלוֹת הֵרוֹן מִשּׁוּמָא דוֹמִים", "לְהַרְאוֹת שֶׁבְּנֵי רִבְקָה יִהְיוּ צַדִּיקִים יוֹתֵר מִבְּנֵי תָּמָר"], "kasha": "לָמָה הַטֶּקְסְט מְפָרֵשׁ שֶׁיָּמֵי הֵרוֹן שֶׁל רִבְקָה הָיוּ 'מְלֵאִים' בַּעוֹד שֶׁלְּתָמָר הַטֶּקְסְט שׁוֹמֵר בִּלְשׁוֹן אַחֶרֶת?", "answer": "הַהִפְרוּד בִּלְשׁוֹן מוֹדְגֵּם שֶׁרִבְקָה הִנַּשְּׁלָה אֶת הֵרוֹנָהּ לִשְׁלֵמוּת, בַּעוֹד שֶׁתָּמָר הוֹלִידָה בַּחֹדֶשׁ הַשְּׁבִיעִי וַיָּמֶיהָ לֹא הוּשְׁלְמוּ - הִבְחָן חָשׁוּב בֵּין שְׁתֵּי הֵרוֹנוֹת."}]}, {"id": "25:24.2", "ch": 25, "v": 24, "n": 2, "dh": "והנה תומם", "pasuk_html": "וַיִּמְלְא֥וּ יָמֶ֖יהָ לָלֶ֑דֶת <mark>וְהִנֵּ֥ה תוֹמִ֖ם</mark> בְּבִטְנָֽהּ׃", "pasuk_en": "וּלְעֵת לִדְתָּהּ, הִנֵּה תוֹמִם בְּבִטְנָהּ.", "rashi_he": "והנה תומם. חָסֵר, וּבְתָמָר תְּאוֹמִים מָלֵא, לְפִי שֶׁשְּׁנֵיהֶם צַדִּיקִים; אֲבָל כָּאן אֶחָד צַדִּיק וְאֶחָד רָשָׁע:", "rashi_en": "וְהִנֵּה תוֹמִם - הַמִּלָּה לִתְאוֹמִים כְּתוּבָה חָסֵרָה (בְלִי א וְי), אֲבָל בַּמַּקְרֵה שֶׁל תָּמָר כְּתוּבָה תְּאוֹמִים (עִם א וְי); כִּי בַמַּקְרֵה הַשֵּׁנִי שְׁנֵי הַבָּנִים הָיוּ צַדִּיקִים, אֲבָל כָּאן אֶחָד הָיָה צַדִּיק וְהַשֵּׁנִי רָשָׁע (בְרֵאשִׁית רַבָּה סג:ח).", "note": "", "points": [{"q": "מָה מְלַמֵּד הַכְּתִיב הַחָסֵר שֶׁל הַמִּלָּה לִתְאוֹמִים עַל טִבְעַת בְנֵי רִבְקָה?", "options": ["אֶחָד מִן הַתְּאוֹמִים הָיָה צַדִּיק וְהַשֵּׁנִי רָשָׁע, בְנִיגוּד לִתְאוֹמֵי תָּמָר שֶׁשְּׁנֵיהֶם הָיוּ צַדִּיקִים", "הַתְּאוֹמִים לֹא הָיוּ כּוֹלְלִים זֵהִים לַמְּעֲשֶׂה שֶׁנּוֹלְדוּ יַחַד", "תְּאוֹמֵי רִבְקָה הָיוּ פָּחוֹת מְפוּתָּחִים מִשְּׁאָר תְּאוֹמִים בַּתָּנָ\"ךְ"], "kasha": "מַדּוּעַ הַמִּלָּה לִתְאוֹמִים כָּתוּבָה חָסֵרָה (חֲסֵרַת אוֹתִיּוֹת) בְמַקְרֵה רִבְקָה, בְעוֹדָהּ כְּתוּבָה שְׁלֵמָה בִּשְׁנֵי הַתְּאוֹמִים שֶׁל תָּמָר?", "answer": "הַכְּתִיב הַחָסֵר מַשְׁקִף שֶׁאֶחָד מִן הַבָּנִים הָיָה צַדִּיק וְאֶחָד הָיָה רָשָׁע. לְעוּמַת זָאת, בִּשְׁנֵי תְּאוֹמֵי תָּמָר הַמִּלָּה כְּתוּבָה שְׁלֵמָה מִפְּנֵי שֶׁשְּׁנֵיהֶם הָיוּ צַדִּיקִים, וְלָכֵן הַמִּלָּה \"שְׁלֵמָה\"."}]}, {"id": "25:25.1", "ch": 25, "v": 25, "n": 1, "dh": "אדמוני", "pasuk_html": "וַיֵּצֵ֤א הָרִאשׁוֹן֙ <mark>אַדְמוֹנִ֔י</mark> כֻּלּ֖וֹ כְּאַדֶּ֣רֶת שֵׂעָ֑ר וַיִּקְרְא֥וּ שְׁמ֖וֹ עֵשָֽׂו׃", "pasuk_en": "וַיֵּצֵא הָרִאשׁוֹן אַדְמוֹנִי, כֻּלּוֹ כַּאֲדֶרֶת שֵׂעָר; וַיִּקְרְאוּ שְׁמוֹ עֵשָׂו.", "rashi_he": "אדמוני. סִימָן הוּא שֶׁיְּהֵא שׁוֹפֵךְ דָּמִים (בראשית רבה):", "rashi_en": "אַדְמוֹנִי - סִימָן שֶׁהוּא עָתִיד לִהְיוֹת שׁוֹפֵךְ דָּמִים (בְרֵאשִׁית רַבָּה סג:ח).", "note": "", "points": [{"q": "מָה מַשְׁמַעַת רַשִׁי בִּשְׁנֵי אָדוֹם עֲלֵי פָּנָיו בִּשְׁעַת הַלֵּדָה?", "options": ["זֶה הָיָה סִימָן שֶׁהוּא יִהְיֶה אִישׁ אַלִּמוּת וּשְׁפִיכוּת דָּמִים", "זֶה הִצְבִּיעַ שֶׁהוּא יִהְיֶה צַיִד גָּדוֹל וּגִבּוֹר מִלְחָמָה", "זֶה הִרְאָה שֶׁהוּא יִהְיֶה קָשׁוּר לְאֶרֶץ אֱדוֹם, שֶׁמַּשְׁמַעַת אָדוֹם"], "kasha": "מַדּוּעַ הַתּוֹרָה מְשַׁמַּעַת עַל כָּךְ שֶׁעֵשָׂו יָצָא אָדוֹם? מָה הַמַּשְׁמָעוּת שֶׁל הַפְּרָט הַגָּוּפָנִי הַזֶּה?", "answer": "הָמוּנוֹ הָאָדוֹם הָיָה סִימָן לַמִּדָּתוֹ הֶעָתִידָה - שֶׁהוּא יִהְיֶה שׁוֹפֵךְ דָּמִים וְעוֹסֵק בְּאַלִּמוּת בְּכָל חַיָּיו."}]}, {"id": "25:25.2", "ch": 25, "v": 25, "n": 2, "dh": "כלו כאדרת שער", "pasuk_html": "וַיֵּצֵ֤א הָרִאשׁוֹן֙ אַדְמוֹנִ֔י <mark>כֻּלּ֖וֹ כְּאַדֶּ֣רֶת שֵׂעָ֑ר</mark> וַיִּקְרְא֥וּ שְׁמ֖וֹ עֵשָֽׂו׃", "pasuk_en": "וַיֵּצֵא הָרִאשׁוֹן אַדְמוֹנִי, כֻּלּוֹ כַּאֲדֶרֶת שֵׂעָר; וַיִּקְרְאוּ שְׁמוֹ עֵשָׂו.", "rashi_he": "כלו כאדרת שער. מָלֵא שֵׂעָר כְּטַלִּית שֶׁל צֶמֶר הַמְלֵאָה שֵׂעָר, פלוקי\"דא בלע\"ז:", "rashi_en": "כֻּלּוֹ כַּאֲדֶרֶת שֵׂעָר מַשְׁמַעַת מָלֵא שֵׂעָר כְּמוֹ בֶגֶד צָמֵר שֶׁהוּא מָלֵא בַּשֵּׂעָר.", "note": "", "points": [{"q": "מָה מַשְׁמַעַת הַהַשְׁוָאָה שֶׁל רַשִׁי \"כְּמוֹ אַדֶּרֶת שֵׂעָר\" לְגַבֵּי מַרְאֵה עֵשָׂו?", "options": ["כָּל גּוּפוֹ הָיָה מְכוּסֶּה בַּשֵּׂעָר כִּמוֹ בֶגֶד צָמֵר עָבָה וּמְלֵא שֵׂעָר", "הוּא הָיָה לוֹבֵשׁ בֶּגֶד בִּפְעַם הַזּוֹ שֶׁעָשׂוּ מִן הַשֵּׂעָר", "רַק חֲלָקִים מְסוּיָּמִים שֶׁל גּוּפוֹ הָיוּ שְׂעִירִים, כְּמוֹ הַזְּרוֹעוֹת וְהַרְגָּלַיִם"], "kasha": "מָה הַמַּשְׁמָעוּת שֶׁל הַתִּיאוּר \"כּוּלּוֹ כַּאֲדֶרֶת שֵׂעָר\"?", "answer": "גּוּפוֹ שֶׁל עֵשָׂו הָיָה מְכוּסֶּה לְחַלּוּטִין בַּשֵּׂעָר, דּוֹמֶה לְבֶגֶד צָמֵר עָבָה וּמְלֵא שֵׂעָר - מַרְאֵה יוּצְאִי דֹּפֶן וּמַשְׁפִּיעַ לַתִּינוֹק בִּשְׁנַת הַלֵּדָה."}]}, {"id": "25:25.3", "ch": 25, "v": 25, "n": 3, "dh": "ויקראו שמו עשו", "pasuk_html": "וַיֵּצֵ֤א הָרִאשׁוֹן֙ אַדְמוֹנִ֔י כֻּלּ֖וֹ כְּאַדֶּ֣רֶת שֵׂעָ֑ר <mark>וַיִּקְרְא֥וּ שְׁמ֖וֹ עֵשָֽׂו׃</mark>", "pasuk_en": "וַיֵּצֵא הָרִאשׁוֹן אַדְמוֹנִי, כֻּלּוֹ כַּאֲדֶרֶת שֵׂעָר; וַיִּקְרְאוּ שְׁמוֹ עֵשָׂו.", "rashi_he": "ויקראו שמו עשו. הַכֹּל קָרְאוּ לוֹ כֵן, לְפִי שֶׁהָיָה נַעֲשֶׂה וְנִגְמָר בִּשְׂעָרוֹ כְבֶן שָׁנִים הַרְבֵּה:", "rashi_en": "וַיִּקְרְאוּ שְׁמוֹ עֵשָׂו - כֻּלָּם קְרָאוּ לוֹ כָּךְ מִפְּנֵי שֶׁהוּא הָיָה עָשׂוּי (עָשָׂה מַשְׁמַעוּתוֹ לַעֲשׂוֹת) וּמוּשְׁלַם עִם שֵׂעָר כְּיֶלֶד בֶּן כַּמָּה שָׁנִים.", "note": "", "points": [{"q": "לְפִי רַשִׁי, מַדּוּעַ בָּחַרוּ בַּשֵּׁם עֵשָׂו (עֲשׂוּ) לַתִּינוֹק הַזֶּה?", "options": ["מִפְּנֵי שֶׁהוּא הָיָה כְּבָר מְפוּתָּח וּמָבוּגָר בַּמַּרְאֶה עִם שֵׂעָר, כִּמוְ יֶלֶד בֶּן כַּמָּה שָׁנִים", "מִפְּנֵי שֶׁזֶה הָיָה שֵׁם מִשְׁפָּחָתִי שֶׁהוּעְבַּר מִאַבְרָהָם", "מִפְּנֵי שֶׁהַשֵּׁם עֵשָׂו מַשְׁמַעוּתוֹ \"אָדוֹם\" בַּלְּשׁוֹן הָעִבְרִית"], "kasha": "מָה הַקֶּשֶׁר בֵּין הַשֵּׁם עֵשָׂו לִתְאוּרַ מַרְאֵהוּ בִּשְׁנַת הַלֵּדָה?", "answer": "הַשֵּׁם עֵשָׂו מוּשְׁרַש מִן הַפּוֹעַל \"עָשָׂה\" (לַעֲשׂוֹת/לְהִשְׁתַּפֵּל), וְהוּא משְׁקִף שֶׁהוּא הָיָה כְּבָר מוּכָּן וּמוּשְׁלַם עִם שֵׂעָר, כְּמוֹ יֶלֶד בֶּן כַּמָּה שָׁנִים וְלֹא תִּינוֹק טָרִי הַלָּדָה."}]}, {"id": "25:26.1", "ch": 25, "v": 26, "n": 1, "dh": "ואחרי כן יצא אחיו", "pasuk_html": "<mark>וְאַֽחֲרֵי־כֵ֞ן יָצָ֣א אָחִ֗יו</mark> וְיָד֤וֹ אֹחֶ֙זֶת֙ בַּעֲקֵ֣ב עֵשָׂ֔ו וַיִּקְרָ֥א שְׁמ֖וֹ יַעֲקֹ֑ב וְיִצְחָ֛ק בֶּן־שִׁשִּׁ֥ים שָׁנָ֖ה בְּלֶ֥דֶת אֹתָֽם׃", "pasuk_en": "וְאַחֲרֵי כֵן יָצָא אָחִיו וְיָדוֹ אוֹחֶזֶת בַּעֲקֵב עֵשָׂו; וַיִּקְרָא שְׁמוֹ יַעֲקֹב.", "rashi_he": "ואחרי כן יצא אחיו וגו'. שָׁמַעְתִּי מִ\"אַ הַדּוֹרְשׁוֹ לְפִי פְּשׁוּטוֹ, בְּדִין הָיָה אוֹחֵז בּוֹ לְעַכְּבוֹ, יַעֲקֹב נוֹצַר מִטִּפָּה רִאשׁוֹנָה וְעֵשָׂו מִן הַשְּׁנִיָּה; צֵא וּלְמַד מִשְּׁפוֹפֶרֶת שֶׁפִּיהָ קְצָרָה, תֵּן לָהּ שְׁתֵּי אֲבָנִים זוֹ אַחַר זוֹ – הַנִּכְנֶסֶת רִאשׁוֹנָה תֵּצֵא אַחֲרוֹנָה וְהַנִּכְנֶסֶת אַחֲרוֹנָה תֵּצֵא רִאשׁוֹנָה; נִמְצָא עֵשָׂו הַנּוֹצָר בָּאַחֲרוֹנָה יָצָא רִאשׁוֹן וְיַעֲקֹב שֶׁנּוֹצַר רִאשׁוֹנָה יָצָא אַחֲרוֹן, וְיַעֲקֹב בָּא לְעַכְּבוֹ, שֶׁיְּהֵא רִאשׁוֹן לְלֵדָה כְּרִאשׁוֹן לִיצִירָה, וְיִפְטֹר אֶת רַחְמָהּ וְיִטֹּל אֶת הַבְּכוֹרָה מִן הַדִּין:", "rashi_en": "וְאַחֲרֵי כֵן יָצָא אָחִיו וְגוֹ - שָׁמַעְתִּי מִדְרָשׁ אַגָּדִי שְׁמְפָרֵשׁ אוֹתוֹ לְפִי פִּשְׁטוֹ: בִּצְדָקָה הָיָה תוֹמְךְ בּוֹ. יַעֲקֹב מֻעַד מִן הַטִּפָּה הָרִאשׁוֹנָה וְעֵשָׂו מִן הַשְּׁנִיָּה. לֵךְ וּלְמַד מִצִּנוֹר שֶׁפִּיו צַר, הַשְׁלֵךְ בּוֹ שְׁנֵי אֲבָנִים אַחַד אַחַר אַחַד, הָאַבֶּן שֶׁנִּכְנְסָה בִּתְחִלָּה יֵצֵא בַּסּוֹף, וְהָאַבֶּן שֶׁנִּכְנְסָה בַּסּוֹף תֵּצֵא בִּתְחִלָּה. נִמְצָא שֶׁעֵשָׂו שֶׁמֻּעַד בַּסּוֹף יָצָא בִּתְחִלָּה, וְיַעֲקֹב שֶׁמֻּעַד בִּתְחִלָּה יָצָא בַּסּוֹף. וּבִשְׁנֵי כָּךְ בָּא יַעֲקֹב לִתְמוֹכִי כְּדֵי שֶׁיְּהֵא רִאשׁוֹן בַּהִוּלָּדוֹת כְּרִאשׁוֹן בַּהַרָּיוֹן וְיִפְתַּח אֶת הָרָּחַם וְיִקַּח הַבְּכוֹרָה בִּצְדָקָה (בְרֵאשִׁית רַבָּה סג:ח).", "note": "", "points": [{"q": "לְפִי דְרַשַׁת הַמִּדְרָשׁ שֶׁל רַשִׁי, מַדּוּעַ הָיָה יַעֲקֹב צוֹדֵק בַּחֲזִיקוֹ בִּשְׁקֹק עֵשָׂו בְּשָׁעַת יְצִיאַת וֹ מִן הַרָּחַם?", "options": ["יַעֲקֹב הָיָה הִוּוָּחַד בִּתְחִלָּה אַךְ יָצָא שֵׁנִי, וּלְכֵן הוּא נִסָּה לַחֲזֹר עַל סֵדֶר הִוּלָּדוּת כְּדֵי שֶׁיִּתְאִים לְסֵדֶר הַהַרָּיוֹן", "יַעֲקֹב רָצָה לִמְנֹעַ מֵעֵשָׂו אֶת הַבְּרָכָה הַבָּאָה לִבְכוֹר", "יַעֲקֹב הָיָה מְנַסֶּה לִגְרֹם נֶזֶק לְעֵשָׂו כְּדֵי שֶׁהוּא יִוּלַּד שֵׁנִי"], "kasha": "הַפָּסוּק מְתַאֵּר שֶׁיַּעֲקֹב תָּפַס בִּשְׁקֹק עֵשָׂו, אַךְ לֹא מִיָּד בָּרוּר מַדּוּעַ הוּא עוֹשֶׂה זֹאת אוֹ אִם הַמַּעֲשֶׂה הַזֶּה הַיָּשָׁר מִן הַצַּד הַמּוּרָלִי.", "answer": "רַשִׁי מִפְרֵשׁ שֶׁיַּעֲקֹב הָיָה הַמּוּעַד מִן הַטִּפָּה הָרִאשׁוֹנָה וְעֵשָׂו מִן הַשְּׁנִיָּה. רַשִׁי מַמְשִׁיל זֹאת לַצִּנוֹר צַר הַפֶּתַח - שִׂים בּוֹ שְׁנֵי אֲבָנִים אַחַד אַחַר אַחַד. הָאַבֶּן שֶׁנִּכְנְסָה בִּתְחִלָּה תִּצֵּא בַּסּוֹף, וְהָאַבֶּן שֶׁנִּכְנְסָה בַּסּוֹף תִּצֵּא בִּתְחִלָּה. מֵכָּאן שֶׁעֵשָׂו, שֶׁהָיָה הַמּוּעַד בַּסּוֹף, יָצָא בִּתְחִלָּה, וְיַעֲקֹב, שֶׁהָיָה הַמּוּעַד בִּתְחִלָּה, יָצָא בַּסּוֹף. וּבִשְׁנֵי כָּךְ בָּא יַעֲקֹב לְתוֹמְכוֹ, כְּדֵי שֶׁהָרִאשׁוֹן בַּהִוּלָּדוּת יִהְיֶה כְּמוֹ הָרִאשׁוֹן בַּהַרָּיוֹן; וְהוּא יִפְתַּח אֶת הָרָּחַם וְיִקַּח אֶת הַבְּכוֹרָה בִּצְדָקָה."}]}, {"id": "25:26.2", "ch": 25, "v": 26, "n": 2, "dh": "בעקב עשו", "pasuk_html": "וְאַֽחֲרֵי־כֵ֞ן יָצָ֣א אָחִ֗יו וְיָד֤וֹ אֹחֶ֙זֶת֙ <mark>בַּעֲקֵ֣ב עֵשָׂ֔ו</mark> וַיִּקְרָ֥א שְׁמ֖וֹ יַעֲקֹ֑ב וְיִצְחָ֛ק בֶּן־שִׁשִּׁ֥ים שָׁנָ֖ה בְּלֶ֥דֶת אֹתָֽם׃", "pasuk_en": "וְאַחַר כֵּן יָצָא אָחִיו וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו וַיִּקְרָא שְׁמוֹ יַעֲקֹב וְיִצְחָק בֶּן־שִׁשִּׁים שָׁנָה בְּלֶדְתָּם אֶת־הַתּוֹם׃", "rashi_he": "בעקב עשו. סִימָן שֶׁאֵין זֶה מַסְפִּיק לִגְמֹר מַלְכוּתוֹ עַד שֶׁזֶּה עוֹמֵד וְנוֹטְלָהּ הֵימֶנּוּ:", "rashi_en": "בְעָקֵב עֵשָׂו - סִמָּן שֶׁזֶּה בְקַשִּׁי יִשְׁלִים אֶת זְמַן מֶמְשַׁלְתּוֹ עַד שֶׁהַשֵּׁנִי יָקוּם וְיִקַּח אוֹתָהּ מִמֶּנּוּ", "note": "", "points": [{"q": "מה אומר רש״י שהתמונה של יעקב אוחז בעקב של עשו מסמלת על עתידם?", "options": ["לעשו לא יהיה זמן להשלים את תקופת הדומיניון שלו לפני שיעקב יקום ויקח ממנו את הכוח", "יעקב יישאר תמיד נחות מעשו לאורך כל חייהם", "שני האחים בסופו של דבר יעשו שלום ויושלו ביחד"], "kasha": "הפסוק מתאר את יעקב אוחז בעקב של עשו, אך הוא לא מציין במפורש איזו משמעות נבואית נושאת פעולה זו לעתידם.", "answer": "רש״י אומר שזה סימן שלעשו בקושי יהיה זמן להשלים את תקופת הדומיניון שלו לפני שהשני יקום ויקח ממנו את הכוח - אחיזת העקב מנבאת את התחלופה הבסופית של כוחו של יעקב על חשבון עשו."}]}, {"id": "25:26.3", "ch": 25, "v": 26, "n": 3, "dh": "ויקרא שמו יעקב", "pasuk_html": "וְאַֽחֲרֵי־כֵ֞ן יָצָ֣א אָחִ֗יו וְיָד֤וֹ אֹחֶ֙זֶת֙ בַּעֲקֵ֣ב עֵשָׂ֔ו <mark>וַיִּקְרָ֥א שְׁמ֖וֹ יַעֲקֹ֑ב</mark> וְיִצְחָ֛ק בֶּן־שִׁשִּׁ֥ים שָׁנָ֖ה בְּלֶ֥דֶת אֹתָֽם׃", "pasuk_en": "וְאַחַר כֵּן יָצָא אָחִיו וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו וַיִּקְרָא שְׁמוֹ יַעֲקֹב וְיִצְחָק בֶּן־שִׁשִּׁים שָׁנָה בְּלֶדְתָּם אֶת־הַתּוֹם׃", "rashi_he": "ויקרא שמו יעקב. הַקָּבָּ\"ה; דָּ\"אַ אָבִיו קָרָא לוֹ יַעֲקֹב עַל שֵׁם אֲחִיזַת הֶעָקֵב:", "rashi_en": "וַיִּקְרָא שְׁמוֹ יַעֲקֹב - הַקָּדוֹשׁ בָּרוּךְ הוּא קָרָא אֶת שְׁמוֹ כְּלָלוּ. וְיֵשׁ אוֹמְרִים: הוּא אָמַר לָהֶם (לַמִּי שֶׁקָּרוּ לְעֵשָׂו): אַתֶּם קָרִיתֶם שֵׁם לִבְנִיכֶם הַבְּכוֹר, וַאֲנִי אַף קוֹרֵא שֵׁם לִבְנִי הַבְּכוֹר. וְהִנּוּ שֶׁכָּתוּב וַיִּקְרָא שְׁמוֹ יַעֲקֹב. וְדָבָר אַחֵר: אָבִיו קָרָא לוֹ יַעֲקֹב עַל שֵׁם שֶׁהָיָה אוֹחֵז בַּעֲקֵב עֵשָׂו.", "note": "", "points": [{"q": "לְפִי אַחַת מִן ההסברים של רש״י, מִי נָתַן לְיַעֲקֹב אֶת שְׁמוֹ וּלָמָה?", "options": ["הַקָּדוֹשׁ בָּרוּךְ הוּא קָרָא לוֹ יַעֲקֹב כְּמִעֲשׂוֹ הַשֶּׁלּוֹ, בִּדְמוּת אֲחֵרִים שֶׁקָּרְאוּ לְעֵשָׂו", "יִצְחָק קָרָא לוֹ יַעֲקֹב מִיָּד לְאַחַר הַלֵּדָה", "רִבְקָה קָרְאָה לוֹ יַעֲקֹב כִּי הוּא הָיָה בְנָהּ הַיָּקִיר"], "kasha": "הַפָּסוּק אוֹמֵר 'וַיִּקְרָא שְׁמוֹ יַעֲקֹב' אַךְ הוּא לֹא מְצַיֵּן מִי בִּצַּע אֶת הַשֵּׁם הַזֶּה - אִם הָיוּ זֶה הַהוֹרִים, הַשִּׁדְלוֹנִים, אוֹ הַקָּדוֹשׁ בָּרוּךְ הוּא.", "answer": "רש״י מַסְבִּיר שֶׁהַקָּדוֹשׁ בָּרוּךְ הוּא קָרָא לוֹ יַעֲקֹב. זֶה מִסְתַּבְּרוּ בַּעֲצַם שֶׁאֲחֵרִים קָרְאוּ לְעֵשָׂו; הַקָּדוֹשׁ בָּרוּךְ הוּא, בְּתוֹרוֹ, נָתַן שֵׁם לִבְנוֹ הַבְּכוֹר שֶׁלּוֹ."}, {"q": "מַה הוּא הַהַסְבֵּר הַחִלּוּפִי שֶׁל רש״י לַשֵּׁם יַעֲקֹב?", "options": ["אָבִיו יִצְחָק קָרָא לוֹ יַעֲקֹב בִּשְׁלַל מַעֲשֵׂהוּ שֶׁאָחַז בַּעֲקֵב עֵשָׂו", "אִמּוֹ רִבְקָה בָּחֲרָה בַּשֵּׁם יַעֲקֹב לְהִכְבּוֹד אֶת אָבִיהָ שֶׁלָּהּ", "הַיֶּלָּדוֹת קָרְאוּ לוֹ יַעֲקֹב בְּהִשְׁתַּנּוּת עַל פִּי הַמַּרְאֶה שֶׁלּוֹ בְּשָׁעַת הַלֵּדָה"], "kasha": "הַשֵּׁם 'יַעֲקֹב' קָשׁוּר לַמִּלָּה הָעִבְרִית 'עָקֵב' (עָקֵב), אַךְ הַפָּסוּק לֹא מַסְבִּיר אֶת הַקֶּשֶׁר בֵּין הַמַּעֲשֶׂה וְהַשֵּׁם.", "answer": "רש״י מַנִּיחַ אַלְטֶרְנָטִיבָה שֶׁאָבִיו יִצְחָק קָרָא לוֹ יַעֲקֹב בִּשְׁלַל שֶׁהוּא הָיָה אוֹחֵז בַּעֲקֵב עֵשָׂו, וְהַשֵּׁם הוּא הִנַּצּוּל לִפְעוּלָה זוֹ שֶׁל אַחִיזַת הָעָקֵב."}]}, {"id": "25:26.4", "ch": 25, "v": 26, "n": 4, "dh": "בן ששים שנה", "pasuk_html": "וְאַֽחֲרֵי־כֵ֞ן יָצָ֣א אָחִ֗יו וְיָד֤וֹ אֹחֶ֙זֶת֙ בַּעֲקֵ֣ב עֵשָׂ֔ו וַיִּקְרָ֥א שְׁמ֖וֹ יַעֲקֹ֑ב וְיִצְחָ֛ק <mark>בֶּן־שִׁשִּׁ֥ים שָׁנָ֖ה</mark> בְּלֶ֥דֶת אֹתָֽם׃", "pasuk_en": "וְאַחַר כֵּן יָצָא אָחִיו וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו וַיִּקְרָא שְׁמוֹ יַעֲקֹב וְיִצְחָק בֶּן־שִׁשִּׁים שָׁנָה בְּלֶדְתָּם אֶת־הַתּוֹם׃", "rashi_he": "בן ששים שנה. י' שָׁנִים מִשֶּׁנְּשָׂאָהּ עַד שֶׁנַּעֲשֵׂית בַּת י\"ג שָׁנָה וּרְאוּיָה לְהֵרָיוֹן, וְי' שָׁנִים הַלָּלוּ צָפָה וְהִִמְתִּין לָהּ, כְּמוֹ שֶׁעָשָׂה אָבִיו לְשָׂרָה; כֵּיוָן שֶׁלֹּא נִתְעַבְּרָה, יָדַע שֶׁהִיא עֲקָרָה, וְהִתְפַּלֵּל עָלֶיהָ (יבמות ס\"ד), וְשִׁפְחָה לֹא רָצָה לִשָּׂא, לְפִי שֶׁנִּתְקַדֵּשׁ בְּהַר הַמּוֹרִיָּה לִהְיוֹת עוֹלָה תְמִימָה:", "rashi_en": "בֶּן שִׁשִּׁים שָׁנָה - עֶשֶׂר שָׁנִים עָבְרוּ מִשָּׁעַת שֶׁנִּשַּׂם אוֹתָהּ עַד שֶׁהִגִּיעַ לִגִּיל שְׁלוֹשׁ עֶשְׂרֶה שָׁנִים וְנִשְׁתָּנְתָה לִיכוֹלֶת הָשׁוֹאָה. וְעִנְיַן הַשְּׁנִיָּה עֲשֶׂרֶת שָׁנִים הִמְתִּין בְּסִבְרוּנוּת כְּמוֹ שֶׁעָשָׂה אַבְרָהָם בִּשְׂרָה. וְלֹא הִוצַּר וְנוֹדַע שֶׁהִיא עֲקָרָה וְהִתְפַּלֵּל עָלֶיהָ וְלֹא רָצָה לָקַחַת שִׁפְחָה שֶׁנִּשְׁתַּנִּית בְּהַר הַמּוֹרִיָּה לִהְיוֹת קָרְבַּן תָּמִים.", "note": "", "points": [{"q": "לְפִי רש״י, לָמָה חִכָּה יִצְחָק עֶשֶׂר שָׁנִים אַחֲרֵי נִישׂוּאִין לִרְבְקָה לִפְנֵי שֶׁהִוצַּר הַהֲרָיוֹן?", "options": ["הוּא חִכָּה שֶׁתַּגִּיע לִגִּיל שְׁלוֹשׁ עֶשְׂרֶה כְּשֶׁנִּשְׁתָּנְתָה לִיכוֹלֶת הָשׁוֹאָה, כְּשֶׁעָשָׂה אַבְרָהָם אִתּוֹ שָׂרָה", "הוּא הָיָה לֹא בָטוּחַ אִם הִכְלִית לְהִיוֹת לוֹ יְלָדִים", "רִבְקָה הָיְתָה נִמְנַעַת בְּכַוָּנָה מִהַהֲרָיוֹן בְּאוֹתָם הַשָּׁנִים הָרִאשׁוֹנוֹת"], "kasha": "יִצְחָק הָיָה בֶן שִׁשִּׁים שָׁנָה כְּשֶׁנוֹלְדוּ הַתְּאוֹמִים, אַךְ גִּילָהּ שֶׁל רִבְקָה בָּעֵת הַנִּישׂוּאִין לֹא נִזְכַּר בִּמְפוֹרָשׁ, וְעַל כֵּן לֹא בָרוּר לָמָה הָיָה עִיכּוּב לִפְנֵי הַהַצָּרוּת.", "answer": "רש״י מַסְבִּיר שֶׁעֶשֶׂר שָׁנִים חָלְפוּ מִשְׁעַת נִישׂוּאָיו לִרְבְקָה עַד שֶׁהִגִּיעַ לִגִּיל שְׁלוֹשׁ עֶשְׂרֶה שָׁנִים וְנִשְׁתָּנְתָה לִיכוֹלֶת הָשׁוֹאָה. יִצְחָק חִכָּה בִּסְבִּרוּנוּת, כְּמוֹ שֶׁעָשָׂה אַבִּיו אַבְרָהָם לִגְבֵי שָׂרָה."}, {"q": "כַּיֵּצַד הִשִּׁיב יִצְחָק כְּשֶׁרִבְקָה עֲדַיִן לֹא הִוצַּר גַּם אַחֲרֵי שֶׁהִגִּיעַ לִגִּיל הַשּׁוֹאָה?", "options": ["הוּא הִתְפַּלֵּל בַּעֲדָהּ אַחֲרֵי שֶׁהִבִּין שֶׁהִיא עֲקָרָה, וְלֹא רָצָה לָקַחַת פִּילֶגֶשׁ כִּי הָיָה מְקֻדָּשׁ בְּהַר הַמּוֹרִיָּה לִהְיוֹת קָרְבַּן תָּמִים בְּלִי מּוּם", "הוּא גָּרַשׁ אוֹתָהּ וְלָקַחַ אִשָּׁה אַחֶרֶת שֶׁיָּכְלָה לִהָּרוֹת", "הוּא שָׁאַל לֵאלֹהִים לִשׁלֹּחַ קָלָלָה עָלֶיהָ בִּשְׁלַל עֲקָרוּתָהּ"], "kasha": "הַפָּסוּק אוֹמֵר שֶׁיִצְחָק הָיָה בֶן שִׁשִּׁים שָׁנָה כְּשֶׁנוֹלְדוּ הַתְּאוֹמִים, אַךְ לֹא מַסְבִּיר מַה עָשָׂה יִצְחָק בְּאוֹתוֹ הַזְּמַן שֶׁל ההמתנות, אוֹ כַּיֵּצַד עִמַּד עִם הָעֲקָרוּת הַנִּרְאָה.", "answer": "כְּשֶׁרִבְקָה עֲדַיִן לֹא הִוצַּר גַּם בְּתוֹךְ הַתְּקוּפָה הַשְּׁנִיָּה שֶׁל ההמתנות, יִצְחָק הִבִּין שֶׁהִיא עֲקָרָה וְהִתְפַּלֵּל בַּעֲדָהּ. הוּא סִירֵב לָקַחַת שִׁפְחָה כִּי הָיָה מְקֻדָּשׁ בְּהַר הַמּוֹרִיָּה לִהְיוֹת קָרְבַּן תָּמִים בְּלִי מּוּם, מְסֻגָּר לַצּוּרְכֵי הַקָּדוֹשׁ בָּרוּךְ הוּא."}]}, {"id": "25:27.1", "ch": 25, "v": 27, "n": 1, "dh": "ויגדלו הנערים", "pasuk_html": "<mark>וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים</mark> וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃", "pasuk_en": "וַיִּגְדְּלוּ הַנְּעָרִים וַיְהִי עֵשָׂו אִישׁ יֹדֵעַ צַיִד אִישׁ שָׂדֶה וְיַעֲקֹב אִישׁ תָּם יֹשֵׁב אֹהָלִים׃", "rashi_he": "ויגדלו … ויהי עשו. כָּל זְמַן שֶׁהָיוּ קְטַנִּים, לֹא הָיוּ נִכָּרִים בְּמַעֲשֵׂיהֶם, וְאֵין אָדָם מְדַקְדֵּק בָּהֶם מַה טִּיבָם; כֵּיוָן שֶׁנַּעֲשׂוּ בְנֵי שְׁלשׁ עֶשְׂרֵה שָׁנָה, זֶה פֵּרֵשׁ לְבָתֵּי מִדְרָשׁוֹת וְזֶה פֵּרֵשׁ לַעֲ\"זָ:", "rashi_en": "וַיִּגְדְּלוּ וַיְהִי עֵשָׂו - כָּל־עוֹד קְטַנִּים הָיוּ אֵינָם נִשְׁמַרִים בְּמַעֲשִׂיהֶם וְאֵין בְּנֵי־אָדָם מִשְׁמֵרִים אֲלֵיהֶם. וּכְשֶׁהִגִּיעוּ לִבְנֵי שְׁלוֹשׁ עֶשְׂרֶה שָׁנָה אֶחָד הָלַךְ לְדֶרֶךְ טוּב וְהַשֵּׁנִי לְדֶרֶךְ רָע, אֶחָד בַּיִת־מִדְרְשׁוֹת וְהַשֵּׁנִי בְּבָתֵּי הַגִּלּוּלִים׃", "note": "", "points": [{"q": "לְפִי רש״י, בְאֵיזֶה גִּיל הִתְחִלּוּ הַתְּכוּנוֹת הַשּׁוֹנוֹת שֶׁל יַעֲקֹב וְעֵשָׂו לִהְיוֹת בְּנָפֶץ?", "options": ["כְּשֶׁהִגִּיעוּ לִגִּיל שְׁלוֹשׁ עֶשְׂרֶה, אֶחָד הָלַךְ לְבָתֵּי הַמִּדְרָשׁ וְהַשֵּׁנִי הָלַךְ לְבָתֵּי כּוֹחַב כּוֹכָבִים", "כְּשֶׁנוֹלְדוּ, עַל־פִּי הַמַּרְאֶה הַגַּשְׁמִי שֶׁלָּהֶם", "כְּשֶׁהִגִּיעוּ לִגִּיל הַבַּגְרוּת, בְּעֵרֶךְ גִּיל עֶשְׂרִים שָׁנָה"], "kasha": "הַפָּסוּק אוֹמֵר בִּפְשׁוּטוּ 'וַיִּגְדְּלוּ הַנְּעָרִים' בְּלִי לְהַצְבִּיעַ עַל הַגִּיל שֶׁעָלָיו הִתְגַּלּוּ הַתְּכוּנוֹת שֶׁלָּהֶם הַשּׁוֹנוֹת אוֹ הִתְבְּרָרוּ לַחוּצוֹנִים.", "answer": "רש״י מַסְבִּיר שֶׁבְּעוֹדָם צְעִירִים לֹא יָכְלוּ לִהְיוֹת מְבוּדָּלִים עַל־יְדֵי הַמַּעֲשִׂים שֶׁלָּהֶם וְאַף אִישׁ לֹא הִשְׁגִּיחַ עַל הַתְּכוּנוֹת שֶׁלָּהֶם, אַךְ כְּשֶׁהִגִּיעוּ לִגִּיל שְׁלוֹשׁ עֶשְׂרֶה, אֶחָד הָלַךְ לְבָתֵּי הַמִּדְרָשׁ וְהַשֵּׁנִי הָלַךְ לְבָתֵּי הָעֲבוֹדָה זָרָה, וְעַל־כֵּן הִתְגַּלּוּ הַתְּכוּנוֹת הַאֲמִתִּיּוֹת שֶׁלָּהֶם."}]}, {"id": "25:27.2", "ch": 25, "v": 27, "n": 2, "dh": "ידע ציד", "pasuk_html": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ <mark>יֹדֵ֥עַ צַ֖יִד</mark> אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃", "pasuk_en": "וַיִּגְדְּלוּ הַנְּעָרִים וַיְהִי עֵשָׂו אִישׁ יֹדֵעַ צַיִד אִישׁ שָׂדֶה וְיַעֲקֹב אִישׁ תָּם יֹשֵׁב אֹהָלִים׃", "rashi_he": "ידע ציד. לָצוּד וּלְרַמּוֹת אֶת אָבִיו בְּפִיו וְשׁוֹאֲלוֹ אַבָּא, הַאֵיךְ מְעַשְּׂרִין אֶת הַמֶּלַח וְאֶת הַתֶּבֶן? כַּסָּבוּר אָבִיו שֶׁהוּא מְדַקְדֵּק בְּמִצְוֹת (תנחומא):", "rashi_en": "יֹדֵעַ צַיִד - יוֹדֵעַ צִידָּה, דֶּרֶךְ הַטַּל וּתַרְמִית הָאָב בְּפִיו, שׁוֹאֵל אוֹתוֹ: אָבִי כִּיצַד מַעַשְׂרוֹת מֶלַח וּמַעַשְׂרוֹת קַשׁ (וְהוּא יוֹדֵעַ שֶׁאֵין מַעַשְׂרוֹת עַל־אֵלֶּה)? וְנִשְׁמַר אָבִיו שֶׁהוּא שָׁמוּר בְּמִצְווֹת הַשֵּׁם יִתְבָּרַךְ מְאֹד׃", "note": "", "points": [{"q": "מַה כּוּנּוּ רש״י בֶּעָת שֶׁהוּא אוֹמֵר שֶׁעֵשָׂו הָיָה מְנוּסָּה בַּצַּיִד לַ'הִטַּל וּלְתַרְמוּת הָאָב בִּפִּיו'?", "options": ["עֵשָׂו הָיָה שׁוֹאֵל לַאָבִיו שְׁאֵלוֹת תַּחְבּוּלִיּוֹת עַל עִנְיָנֵי הַמַּעֲשְׂרוֹת כְּדֵי שֶׁיֵּרָאֶה חָסִיד, וּלְמַעַשׂ הוּא הָיָה לֹא יוֹדֵעַ עַל־זִיו הַדִּינִים", "עֵשָׂו הָיָה שׁוֹקֵר בִּישְׁרִירוּת לַאָבִיו עַל מְקוֹם בִּיאוּר הַצַּיִד שֶׁלּוֹ", "עֵשָׂו הָיָה עוֹשֶׂה שֵׁמוּצִים כְּדֵי לַעֲנוֹת לְאָבִיו לַתֵּן לוֹ כֶּסֶף"], "kasha": "הַפָּסוּק מִתְאָר אֶת עֵשָׂו כְּ'יוֹדֵעַ צַיִד' אַךְ אִינוֹ מַסְבִּיר כִּיצַד זֶה קָשׁוּר לַתּוֹכִי שֶׁלּוֹ אוֹ לְיַחַס שֶׁלּוֹ לַאָבִיו.", "answer": "רש״י מַסְבִּיר שֶׁהַעֲרוּמוּת שֶׁל עֵשָׂו הָיְתָה בִּשְׁאִילַת שְׁאֵלוֹת תַּחְבּוּלִיּוֹת לַאָבִיו, כְּמוֹ: 'אָבִי, כִּיצַד יִתְעַשֵּׂרוּ הַמְּלַח וְהַקַּשׁ?' (אַף שֶׁהוּא יָדַע כִּי אֵלֶּה אֵינָם חַיָּבִים בְּמַעֲשְׂרוֹת). עַל־כֵּן אָבִיו חִשַּׁב שֶׁבְּנוֹ הָיָה מְדוּקְדַּק מְאֹד בִּשְׁמִּירַת הַמִּצְוֹת."}]}, {"id": "25:27.3", "ch": 25, "v": 27, "n": 3, "dh": "איש שדה", "pasuk_html": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד <mark>אִ֣ישׁ שָׂדֶ֑ה</mark> וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃", "pasuk_en": "כַּאֲשֶׁר גָּדְלוּ הַנְּעָרִים, הָיָה עֵשָׂו אִישׁ יוֹדֵעַ צַיִד אִישׁ שָׂדֶה; וְיַעֲקֹב אִישׁ תָּם יוֹשֵׁב אֹהָלִים.", "rashi_he": "איש שדה. כְּמַשְׁמָעוֹ, אָדָם בָּטֵל וְצוֹדֶה בְקַשְׁתּוֹ חַיּוֹת וְעוֹפוֹת:", "rashi_en": "אִישׁ שָׂדֶה — פָּשְׁטֵנִיּוּת: אִישׁ שׁאֵין לוֹ מְלָאכָה קָבוּעָה, שׁוֹצֵד חַיּוֹת וְעוֹפוֹת בְקַשְׁתּוֹ.", "note": "", "points": [{"q": "כיצד מפרש רַשִׁי בדרך פשוּטה את הביטוי 'אִישׁ שָׂדֶה' לגבי עֵשָׂו?", "options": ["אִישׁ ללא עֲסוֹקִים קָבוּעִים שׁוֹצֵד חַיּוֹת וְעוֹפוֹת בְקַשְׁתּוֹ", "אִישׁ שׁיִזְכֶה וּמְנַהֵל קַרְקַע וְגִדּוּלֵי שָׂדֶה", "אִישׁ מָהִיר בְבִנְיַת מִבְנִים בִּשְׂדוֹת פְתוּחִים"], "kasha": "הַביטוּי 'אִישׁ שָׂדֶה' אֵינוֹ בָּרוּר וְאַפְשָׁר לְפָרְשׁוֹ בְמִשְׁמָעוּיוֹת רַבּוֹת—יָכוֹל לִהְיוֹת קָשׁוּר לַחְקלָאוּת, ציְד אוֹ פָּשׁוּט הִיּוֹת בָּחוּץ.", "answer": "רַשִׁי מְבָרֵר זֹאת בִּדְרֶךְ פְשׁוּטָה: עֵשָׂו הוּא אִישׁ ללא עֲסוּקִים קְבוּעִים, אִישׁ שׁוֹצֵד חַיּוֹת וְעוֹפוֹת בְקַשְׁתּוֹ בַשָּׂדוֹת הַפְּתוּחִים."}]}, {"id": "25:27.4", "ch": 25, "v": 27, "n": 4, "dh": "תם", "pasuk_html": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ <mark>תָּ֔ם</mark> יֹשֵׁ֖ב אֹהָלִֽים׃", "pasuk_en": "כַּאֲשֶׁר גָּדְלוּ הַנְּעָרִים, הָיָה עֵשָׂו אִישׁ יוֹדֵעַ צַיִד אִישׁ שָׂדֶה; וְיַעֲקֹב אִישׁ תָּם יוֹשֵׁב אֹהָלִים.", "rashi_he": "תם. אֵינוֹ בָקִי בְכָל אֵלֶּה, כְּלִבּוֹ כֵּן פִּיו, מִי שֶׁאֵינוֹ חָרִיף לְרַמּוֹת קָרוּי תָּם:", "rashi_en": "תָּם — שׁאֵינוֹ בָּקִי בַּדְּבָרִים הָאֵלּוּ: כְּלִבּוֹ כֵּן פִּיו. אִישׁ שׁאֵינוֹ חָרִיף בְהִשְׁתַּמְּלוּת בְנִדֶּה נִקְרָא תָּם.", "note": "", "points": [{"q": "לְפִי רַשִׁי, מָה כַּוָּנַת הַקְּרִיאָה לְיַעֲקֹב 'תָּם' (אִישׁ פָּשׁוּט)?", "options": ["אִישׁ שׁלִבּוֹ וּפִיו אֶחָד—מַחְשְׁבוֹתָיו וּדְבָרָיו מִתְאִימִים—וּשׁאֵינוֹ חָרִיף בְהִתְנַכְּלוּת", "אִישׁ חַלּוּשׁ פִּיזִי אוֹ בִלְתִּי מֻסוּגָל לַעֲבוֹדָה", "אִישׁ שׁהוּא מְשׁוּגָע וְחַסַּר שִׂכְלּוֹן"], "kasha": "הַפָּסוּק מְתָאֵר אֶת יַעֲקֹב כַּ'תָּם' אַךְ לֹא מְבָרֵר בִּבְהִירוּת מַה הַמַּשְׁמָעוּת שֶׁל הַמִּלָּה הַזֹּאת וּכֵיצַד הִיא מִנְתָּקֶת מִתּוֹשׁ עֵשָׂו.", "answer": "רַשִׁי מְבָרֵר שׁ'תָּם' מְתָאֵר אִישׁ שֶׁלִּבּוֹ וּפִיו אֶחָד—כִּשְׁלִבּוֹ כֵּן פִּיו. זוֹ קְרִיאָה לְאִישׁ שׁאֵינוֹ חָרִיף אוֹ חָכִם בְהִתְנַכְּלוּת; אִישׁ יָשָׁר וְחִנְנִי."}]}, {"id": "25:27.5", "ch": 25, "v": 27, "n": 5, "dh": "יושב אהלים", "pasuk_html": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם <mark>יֹשֵׁ֖ב אֹהָלִֽים׃</mark>", "pasuk_en": "כַּאֲשֶׁר גָּדְלוּ הַנְּעָרִים, הָיָה עֵשָׂו אִישׁ יוֹדֵעַ צַיִד אִישׁ שָׂדֶה; וְיַעֲקֹב אִישׁ תָּם יוֹשֵׁב אֹהָלִים.", "rashi_he": "ישב אהלים. אָהֳלוֹ שֶׁל שֵׁם וְאָהֳלוֹ שֶׁל עֵבֶר:", "rashi_en": "יוֹשֵׁב אֹהָלִים — בְאֹהֶל שֵׁם וּבְאֹהֶל עֵבֶר.", "note": "", "points": [{"q": "לְפִי רַשִׁי, בְאֵילוּ אֹהָלִים יָשַׁב יַעֲקֹב כַּאֲשֶׁר הַפָּסוּק אוֹמֵר שׁ'יוֹשֵׁב אֹהָלִים'?", "options": ["בְאֹהֶל שֵׁם וּבְאֹהֶל עֵבֶר", "בְאֹהֶל אַבְרָהָם וּבְאֹהֶל יִצְחָק", "בְאֹהֶל אָדָם וּבְאֹהֶל נֹחַ"], "kasha": "הַפָּסוּק אוֹמֵר שְׁיַעֲקֹב הָיָה אִישׁ תָּם יוֹשֵׁב אֹהָלִים, אַךְ לֹא בָּרוּר בְאֵילוּ אֹהָלִים אוֹ מָה הַמַּשְׁמָעוּת שֶׁל הַדָּבָר.", "answer": "רַשִׁי מְבָרֵר שׁיַעֲקֹב שׁוּכֵן בְאֹהֶל שֵׁם וּבְאֹהֶל עֵבֶר, אַנְשֵׁי צְדָקָה גְּדוֹלִים, כְּדֵי לְהַצִּיג אֶת הַשְׁקִפּוּת הָרוּחָנִית וְהַלִּמּוּד שֶׁלּוֹ."}]}, {"id": "25:28.1", "ch": 25, "v": 28, "n": 1, "dh": "בפיו", "pasuk_html": "וַיֶּאֱהַ֥ב יִצְחָ֛ק אֶת־עֵשָׂ֖ו כִּי־צַ֣יִד <mark>בְּפִ֑יו</mark> וְרִבְקָ֖ה אֹהֶ֥בֶת אֶֽת־יַעֲקֹֽב׃", "pasuk_en": "וַיֶּאֱהַב יִצְחָק אֶת־עֵשָׂו כִּי־צַיִד בְּפִיו וְרִבְקָה אֹהֶבֶת אֶת־יַעֲקֹב", "rashi_he": "בפיו. כְּתַרְגּוּמוֹ בְּפִיו שֶׁל יִצְחָק. וּמִדְרָשׁוֹ בְּפִיו שֶׁל עֵשָׂו, שֶׁהָיָה צָד אוֹתוֹ וּמְרַמֵּהוּ בִדְבָרָיו:", "rashi_en": "צַיִד בְּפִיו - תַרְגֵּם אוֹתוֹ כַּמַּשְׁמָעוּת שֶׁל הַתַּרְגּוּם: בְּפִיו שֶׁל יִצְחָק (יִצְחָק אָכַל אֶת הַבְּשַׂר). וּפִרוּשׁוֹ הַמִּדְרָשִׁי הוּא: צַיִד בְּפִיו שֶׁל עֵשָׂו, כִּי הוּא הָיָה תוֹפֵס וּמַטְעֶה אֶת־אָבִיו בִּדְבָרָיו.", "note": "", "points": [{"q": "מהם שני הפירושים שרש״י נותן לביטוי 'ציד בפיו'?", "options": ["או שהציד היה בפיו של יצחק (הוא אכל אותו) או שעשו הטעה את יצחק דרך דברים חלקלקים", "או שעשו ציד בפומו או שהוא דיבר על ציד כל הזמן", "או שיצחק טעם את הציד או שעשו סירב לאכול"], "kasha": "הביטוי 'ציד בפיו' עמוםעמום - לא ברור של מי הוא הפה הזה ומה המשמעות הממשית שלו.", "answer": "הפשט הוא שהציד היה בפיו של יצחק (יצחק אכל את הבשר), אך המדרש מלמד שעשו השתמש בדברים מעורמים כדי להטעות ולהנדל את אביו."}, {"q": "למה יצחק אהב את עשו לפי הסבר רש״י?", "options": ["כי יצחק נהנה לאכול את הציד שעשו הביא הביתה", "כי עשו היה צייד מיומן וחזק מאוד", "כי עשו דיבר בעמיתות על הרפתקאות הציד שלו"], "kasha": "הטקסט אומר שיצחק אהב את עשו כי 'ציד בפיו', אך צריך להבהיר את הסיבה לאהבה זו.", "answer": "האהבה של יצחק לעשו הייתה מבוססת על תאבונו לבשר ציד שעשו סיפק, מה שמראה שההשתייכות של יצחק הייתה קשורה להנאה גשמית ולא לדמוּת מוסרי."}]}, {"id": "25:29.1", "ch": 25, "v": 29, "n": 1, "dh": "ויזד", "pasuk_html": "<mark>וַיָּ֥זֶד</mark> יַעֲקֹ֖ב נָזִ֑יד וַיָּבֹ֥א עֵשָׂ֛ו מִן־הַשָּׂדֶ֖ה וְה֥וּא עָיֵֽף׃", "pasuk_en": "וְיַעֲקֹב בִּישֵׁל נָזִיד וַיָּבֹא עֵשָׂו מִן־הַשָּׂדֶה וְהוּא עָיֵף.", "rashi_he": "ויזד. לְשׁוֹן בִּשּׁוּל, כְּתַרְגּוּמוֹ:", "rashi_en": "וַיָּזֶד — בִּישׁוּל, כַּאֲשֶׁר מוּתְרְגַּם בַּתַּרְגּוּם.", "note": "", "points": [{"q": "מָה פֵּרוּשׁ הַמִּלָּה 'וַיָּזֶד' לְפִי רַשִׁי?", "options": ["בִּישׁוּל", "קִלִּיָּה", "טִבּוּל"], "kasha": "הַמִּלָּה הָעִברִית 'וַיָּזֶד' אַיְנָהּ מַכְנוֹסָה אוֹ פֵּרוּשָׁהּ אֵינוֹ בָּרוּר לְמִי שֶׁקּוֹרֵא אֶת הַפָּסוּק.", "answer": "רַשִׁי מְבָרֵר שׁ'וַיָּזֶד' פֵּרוּשׁוֹ בִּישׁוּל, כַּפִּי שׁמוּתְרְגַּם בַּתַּרְגּוּם."}]}, {"id": "25:29.2", "ch": 25, "v": 29, "n": 2, "dh": "והוא עיף", "pasuk_html": "וַיָּ֥זֶד יַעֲקֹ֖ב נָזִ֑יד וַיָּבֹ֥א עֵשָׂ֛ו מִן־הַשָּׂדֶ֖ה <mark>וְה֥וּא עָיֵֽף׃</mark>", "pasuk_en": "וַעֲטָרוּ וַיָּבוֹא עֵשָׂו מִן־הַשָּׂדֶה וְהוּא עָיֵף.", "rashi_he": "והוא עיף. בִּרְצִיחָה, כְּמָה דְּתֵימָא כִּי עָיְפָה נַפְשִׁי לְהֹרְגִים (ירמיהו ד') (בראשית רבה):", "rashi_en": "וְהוּא עָיֵף - עָיֵף מֵהֲרִיגַת אָדָם, כְּמוֹ שֶׁנֶּאֱמַר בִּנְבוּאַת יִרְמְיָהוּ: \"כִּי נִשְׁמְעָה קוֹלֵנוּ מֵהָרְגִים\" (ספרא דב ראשית סג:יב).", "note": "", "points": [{"q": "לפי פירוש רשי המדרשי, למה היה עשו עייף כשחזר מן השדה?", "options": ["מהריגת אנשים", "מציד מתיש", "מהליכה למרחק רב"], "kasha": "הפסוק פשוט אומר שעשו היה 'עייף' או 'יגע', אך סיבת העייפות שלו אינה מוצהרת במפורש, מה שגורם לרשי לתת פירוש עמוק יותר.", "answer": "רשי מלמד שעשו היה עייף מהריגת אנשים באותו יום, ומשווה זאת למקום בירמיהו שבו מופיע המילה 'עייף' בקשר להריגה."}]}, {"id": "25:30.1", "ch": 25, "v": 30, "n": 1, "dh": "הלעיטני", "pasuk_html": "וַיֹּ֨אמֶר עֵשָׂ֜ו אֶֽל־יַעֲקֹ֗ב <mark>הַלְעִיטֵ֤נִי</mark> נָא֙ מִן־הָאָדֹ֤ם הָאָדֹם֙ הַזֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל־כֵּ֥ן קָרָֽא־שְׁמ֖וֹ אֱדֽוֹם׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו אֶל־יַעֲקֹב הַלְעִיטֵנִי נָא מִן־הָאָדֹם הַזֶּה כִּי עָיֵף אָנוֹכִי.", "rashi_he": "הלעיטני. אֶפְתַּח פִּי וּשְׁפֹךְ הַרְבֵּה לְתוֹכָהּ, כְּמוֹ שֶׁשָּׁנִינוּ אֵין אוֹבְסִין אֶת הַגָּמָל אֲבָל מַלְעִיטִין אוֹתוֹ:", "rashi_en": "הַלְעִיטֵנִי - פְתַח אֶת־פִּיךָ וְהַשְׁלֵךְ קְצָת הַרְבֵּה לְתוֹכוֹ. הַמִּלָּה נִשְׁתַּמְּשָׁה לַנְקִיַּת בְּעֵלֵי חַיִּים, כַּאֲשֶׁר מָצִינוּ בַמִּשְׁנָה (שַׁבָּת קנ״ה:ב) \"אֵין מְלַעֲטִים אֶת־הַגָּמָל בְּיוֹם הַשַּׁבָּת.\"", "note": "", "points": [{"q": "מה מסביר רשי לגבי המילה 'הַלְעִיטֵנִי' (תַּלְעִיטֵנִי)?", "options": ["זוהי פעולה של פתיחת הפה וזריקת אוכל לתוכו, מלה המשמשת להנקה של בעלי חיים", "זוהי פעולה של לעיסת אוכל במהירות ללא בליעה", "זוהי פעולה של טעימת אוכל לפני אכילת הכמות המלאה"], "kasha": "משמעות המילה 'הַלְעִיטֵנִי' אינה ברורה, כי זו אינה ביטוי נפוץ בשימוש יומיומי.", "answer": "רשי מסביר שהמילה 'הַלְעִיטֵנִי' פירושה פתיחת הפה וזריקת כמות גדולה של אוכל לתוכו, דומה לאופן שבו מנקים את בעלי החיים, כפי שמופיע בדיון במשנה בנוגע להנקה של גמלים."}]}, {"id": "25:30.2", "ch": 25, "v": 30, "n": 2, "dh": "מן האדם האדם", "pasuk_html": "וַיֹּ֨אמֶר עֵשָׂ֜ו אֶֽל־יַעֲקֹ֗ב הַלְעִיטֵ֤נִי נָא֙ <mark>מִן־הָאָדֹ֤ם הָאָדֹם֙</mark> הַזֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל־כֵּ֥ן קָרָֽא־שְׁמ֖וֹ אֱדֽוֹם׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו אֶל־יַעֲקֹב הַלְעִיטֵנִי נָא מִן־הָאָדֹם הַזֶּה כִּי עָיֵף אָנוֹכִי.", "rashi_he": "מן האדם האדם. עֲדָשִׁים אֲדֻמּוֹת, וְאוֹתוֹ הַיּוֹם מֵת אַבְרָהָם, שֶׁלֹּא יִרְאֶה אֶת עֵשָׂו בֶּן בְּנוֹ יוֹצֵא לְתַרְבּוּת רָעָה, וְאֵין זוֹ שֵׂיבָה טוֹבָה שֶׁהִבְטִיחוֹ הַקָּבָּ\"ה; לְפִיכָךְ קִצֵּר הַקָּבָּ\"ה ה' שָׁנִים מִשְּׁנוֹתָיו, שֶׁיִּצְחָק חַי ק\"פ שָׁנָה וְזֶה קע\"ה, וּבִשֵּׁל יַעֲקֹב עֲדָשִׁים לְהַבְרוֹת אֶת הָאָבֵל. וְלָמָּה עֲדָשִׁים? שֶׁדּוֹמוֹת לְגַלְגַּל, שֶׁהָאֲבֵלוּת גַּלְגַּל הַחוֹזֵר בָּעוֹלָם (וְעוֹד מָה עֲדָשִׁים אֵין לָהֶם פֶּה, כָּךְ הָאָבֵל אֵין לוֹ פֶה, שֶׁאָסוּר לְדַבֵּר, וּלְפִיכָךְ הַמִּנְהָג לְהַבְרוֹת הָאָבֵל בִּתְחִלַּת מַאֲכָלוֹ בֵּיצִים, שֶׁהֵם עֲגֻלִּים וְאֵין לָהֶם פֶּה, כָּךְ אָבֵל אֵין לוֹ פֶה, כִּדְאָמְרִינַן בְּמוֹעֵד קָטָן (מועד קטן כא:) אָבֵל כָּל שְׁלֹשָׁה יָמִים הָרִאשׁוֹנִים אֵינוֹ מֵשִׁיב שָׁלוֹם לְכָל אָדָם וְכָ\"שֶׁ שֶׁאֵינוֹ שׁוֹאֵל בַּתְּחִלָּה, מִג' וְעַד ז' מֵשִׁיב וְאֵינוֹ שׁוֹאֵל וְכוּ'; בְּרַשִׁ\"י יָשָׁן):", "rashi_en": "מִן־הָאָדֹם הַזֶּה - עֲדָשִׁים אֲדוּמוֹת. בְּאוֹתוֹ הַיּוֹם מֵת אַבְרָהָם כְּדֵי שֶׁלֹּא יִרְאֶה אֶת־עֵשָׂו נִינוֹ הוֹלֵךְ לַדְּרָכִים רָשׁוֹת. וְלֹא הָיָה זֶה 'שֵׂיבָה טוֹבָה' (בראשית כה:ח) אֲשֶׁר הִבְטִיחַ לוֹ הַקָּדוֹשׁ בָּרוּךְ הוּא; לָכֵן הִקְצַר הַקָּדוֹשׁ בָּרוּךְ הוּא אֶת־יָמָיו בַּחֲמִשָּׁה שָׁנִים - אַבְרָהָם חַי מֵאָה וְשִׁבְעִים וַחֲמִשָּׁה שָׁנָה וְיִצְחָק חַי מֵאָה וּשְׁמוֹנִים שָׁנָה. יַעֲקֹב בִּשֵּׁל עֲדָשִׁים לְהִשְׁמִיט אִכְלִית רִאשׁוֹנָה לָאָבְלִים. וּמְדוּעַ עֲדָשִׁים הִן מַאֲכַל אָבִל? כִּי הֵן עָגוּלוֹת כְּמוֹ גַּלְגַּל וְהַצַּעַר הוּא גַּלְגַּל הַסּוֹבֵב בָּעוֹלָם (בבא בתרא טז:ב). וְעוֹד טַעַם - כַּאֲשֶׁר לָעֲדָשִׁים אֵין פֶּה (הַמִּלָּה פֶּה בִּלְשׁוֹן עִברִי מַשְׁמַעְתָּהּ קָצֶה), גַּם לָאָבְלִים אֵין פֶּה, שֶׁהַדִּבּוּר אָסוּר לָהֶם. מִטַּעַם זֶה גַּם מַנְהִיג לִתֵּן לָאָבֵל בֵּיצָה, שֶׁהִיא עֲגוּלָה וְאֵין לָהּ פֶּה וְכַיּוֹצֵא בָּהּ אָבֵל אֵין לוֹ פֶּה.", "note": "", "points": [{"q": "אֵיזֶה פְרִי מַאֲכָל מְסַדֵּר רשי כ'דָּבָר אָדוּם' שֶׁעֵשָׂו בִּקֵּשׁ?", "options": ["עֲדָשִׁים אֲדוּמוֹת", "בָּשָׂר אָדוּם", "יַיִן אָדוּם"], "kasha": "הַפָּסוּק מַזְכִּיר 'דָּבָר אָדוּם' אַךְ אֵינוֹ מַזְהִיר בִּבְרוּר אֵיזֶה אֹכֶל בִּקֵּשׁ עֵשָׂו.", "answer": "רשי מַזְהִיר שֶׁהַמַּאֲכָל הָאָדוּם הִיא עֲדָשִׁים, אֲשֶׁר יַעֲקֹב בִּשֵּׁל כִּמְאֲכַל לִשְׁכוֹל אַחֲרֵי מִיתַת אַבְרָהָם בְּאוֹתוֹ הַיּוֹם."}, {"q": "לִדְעַת רשי, לָמָּה מֵת אַבְרָהָם בַּיּוֹם הַזֶּה בִּפְרָט?", "options": ["כְדֵי שֶׁלֹּא יִרְאֶה אֶת־נִינוֹ עֵשָׂו הוֹפֵךְ לִישׁ רָשָׁע", "כְדֵי שֶׁיַּעֲקֹב יִמְלְחִק אֶת־בִּרְכָתוֹ מִיָּד", "כְדֵי שֶׁעֵשָׂו לֹא יִקְבַּל אֶת־יְרוּשַׁת אָבִיו"], "kasha": "הַפָּסוּק אֵינוֹ מַזְכִּיר אֶת־מִיתַת אַבְרָהָם, וּלְכֵן הַקִּשּׁוּר בֵּין בִּקּוּשׁ עֵשָׂו וּמִיתַת אַבְרָהָם דּוֹרֵשׁ הִסְבָּר.", "answer": "רשי מְלַמֵּד שֶׁאַבְרָהָם מֵת בַּיּוֹם הַזֶּה כְדֵי שֶׁלֹּא יִרְאֶה אֶת־נִינוֹ עֵשָׂו הוֹפֵךְ לַדְּרָכִים רָשׁוֹת, לִשְׁמוֹר עַל הַהַבְטָחָה שֶׁנָּתַן הַקָּדוֹשׁ בָּרוּךְ הוּא שֶׁיִּזְכֶּה לְ'שֵׂיבָה טוֹבָה'."}, {"q": "לָמָּה מַסְבִּיר רשי שֶׁעֲדָשִׁים מַתְאִימוֹת סִמְבּוֹלִית לַאֲכִילַת אָבֵלִים?", "options": ["כִּי הֵן עָגוּלוֹת כְּמוֹ גַּלְגַּל (כִּי הַצַּעַר מִסְתּוֹבֵב בָּעוֹלָם) וְאֵין לָהֶן פֶּה (כִּי הָאָבְלִים שׁוֹתְקִים)", "כִּי הֵן קָלוֹת לַעִכּוּל וְאֵינָן מַטְרִידוֹת אֶת הַמְּעָה", "כִּי הֵן הָיוּ מִנְחַת הַמוּזִים שֶׁל אַבְרָהָם בְּחַיָּיו"], "kasha": "נִשְׁמַע שִׁרִירוּתִי שֶׁעֲדָשִׁים בִּמְנוּחָה לַאָבְלִים בְּלִי הֵבִין אֶת הַמַּשְׁמָעוּת הַסִּמְבּוֹלִית שֶׁלָּהֶן.", "answer": "רשי מַסְבִּיר שֶׁעֲדָשִׁים עָגוּלוֹת כְּמוֹ גַּלְגַּל (מִקּוֹם שֶׁהַצַּעַר מִסְתּוֹבֵב בָּעוֹלָם) וְאֵין לָהֶן פֶּה (פִּי פֵּרוּשׁ קָצֶה מְשׁוּנֵּנֶת), כָּךְ גַּם לָאָבְלִים אֵין פֶּה, כִּי הִם אֲסוּרִים לְדַבֵּר."}]}, {"id": "25:31.1", "ch": 25, "v": 31, "n": 1, "dh": "מכרה כיום", "pasuk_html": "וַיֹּ֖אמֶר יַעֲקֹ֑ב <mark>מִכְרָ֥ה כַיּ֛וֹם</mark> אֶת־בְּכֹרָתְךָ֖ לִֽי׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב הִמְכְּרָה לִי אֶת־בְּכוֹרָתְךָ כַּיּוֹם.", "rashi_he": "מכרה כיום. כְּתַרְגּוּמוֹ כְּיוֹם דִּלְהֵן, כַּיּוֹם שֶׁהוּא בָרוּר, כָךְ מְכֹר לִי מְכִירָה בְרוּרָה:", "rashi_en": "הִמְכְּרָה לִי כַּיּוֹם - כִּדְבַר הַתַּרְגּוּם: כַּאֲשֶׁר הַיּוֹם וַדַּאי, גַּם זֹאת הַמְּכִירָה תִּהְיֶה וַדַּאת וּבְרוּרָה.", "note": "", "points": [{"q": "כַּיִּךְ מַסְבִּיר רשי אֶת־הַצִּבּוּר 'מִכְרָה לִי כַּיּוֹם'?", "options": ["כַּאֲשֶׁר הַיּוֹם וַדַּאי וּבָרוּר, גַּם הַמְּכִירָה צְרִיכָה לִהְיוֹת וַדַּאת וּבְרוּרָה", "מְכֹר לִי אֶת־הַבְּכוֹרָה רַק לַיּוֹם הַזֶּה, לֹא לָעַד", "הַמְּכִירָה חַיֶּבֶת לִקְרוֹת לִפְנֵי סוֹף הַיּוֹם"], "kasha": "הַצִּבּוּר 'כְּמוֹ הַיּוֹם' הוּא יוּצִיא וּדְרוּשׁ הִשָּׁמְרוּת שֶׁלּוֹ צָרִיךְ בִּיאוּר.", "answer": "רשי, בְּעִקְבוֹת הַתַּרְגּוּם, מַסְבִּיר שֶׁכַּאֲשֶׁר הַיּוֹם הַזֶּה וַדַּאי וּבָרוּר, כְּכָךְ יַעֲקֹב בּוֹקֵשׁ שֶׁהַמְּכִירָה תִּהְיֶה וַדַּאת וְלֹא מְפוּקְפֶּקֶת."}]}, {"id": "25:31.2", "ch": 25, "v": 31, "n": 2, "dh": "בכרתך", "pasuk_html": "וַיֹּ֖אמֶר יַעֲקֹ֑ב מִכְרָ֥ה כַיּ֛וֹם אֶת־<mark>בְּכֹרָתְךָ֖</mark> לִֽי׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב הִמְכְּרָה לִי אֶת־בְּכוֹרָתְךָ כַּיּוֹם.", "rashi_he": "בכרתך. לְפִי שֶׁהָעֲבוֹדָה בַּבְּכוֹרוֹת, אָמַר יַעֲקֹב אֵין רָשָׁע זֶה כְדַאי שֶׁיַּקְרִיב לְהַקָּבָּ\"ה:", "rashi_en": "בְּכוֹרָתְךָ - כִּי הָעֲבוֹדָה הַקְּרְבָּנִית הָיְתָה מִשְׁמֶרֶת הַבְּכוֹר בָּאוֹתוֹ הַזְּמַן, אָמַר יַעֲקֹב 'אִישׁ רָשָׁע זֶה לֹא הוּא רָאוּי לְהַקְרִיב לִפְנֵי הַקָּדוֹשׁ בָּרוּךְ הוּא' (ראשית רבה סג:יג).", "note": "", "points": [{"q": "לָמָּה בְּדִיוּק בִּקֵּשׁ יַעֲקֹב לִקְנוֹת אֶת־בְּכוֹרַת עֵשָׂו לְדִעַת רשי?", "options": ["כִּי הַבְּכוֹר הָיָה חַיָּב בַּקְרְבָּנוֹת, וְיַעֲקֹב הֶאֱמִין שֶׁעֵשָׂו לֹא הִיה רָאוּי לַעֲבוֹד אֶת אֱלֹהִים", "כִּי הַבְּכוֹרָה כָּלְלָה אֶת־כָּל־הַעֹשֶׁר שֶׁל אַבְרָהָם", "כִּי יַעֲקֹב קִנֵּא בִּמְצַבּוֹ שֶׁל עֵשָׂו כִּבְנוֹ הַבְּכוֹר"], "kasha": "הַפָּסוּק אֵינוֹ מַסְבִּיר לָמָּה בִּדְקַת־פִּתְאוֹם יַעֲקֹב אֶת־הַבְּכוֹרָה בָּעֵת הַזּוֹ שֶׁעֵשָׂו הוּא חַלּוּשׁ וּרָעֵב.", "answer": "רשי מְלַמֵּד שֶׁיַּעֲקֹב אָמַר, 'אִישׁ רָשָׁע זֶה לֹא הוּא רָאוּי לְעַבֵּד הָעֲבוֹדָה הַשְּׂרוּפָה הַשְּׁמוּרָה לַבְּכוֹר', וּלְכֵן בִּקֵּשׁ יַעֲקֹב לִקְנוֹת אֶת־הַזִּכְיוֹן הַקָּדוֹשׁ הַזֶּה לַעֲצְמוֹ."}]}, {"id": "25:32.1", "ch": 25, "v": 32, "n": 1, "dh": "הנה אנכי הולך למות", "pasuk_html": "וַיֹּ֣אמֶר עֵשָׂ֔ו <mark>הִנֵּ֛ה אָנֹכִ֥י הוֹלֵ֖ךְ לָמ֑וּת</mark> וְלָמָּה־זֶּ֥ה לִ֖י בְּכֹרָֽה׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו הִנִּי הוֹלֵךְ לָמוּת וְלָמָּה זֶּה לִי בְכוֹרָה?", "rashi_he": "הנה אנכי הולך למות. (מִתְנוֹדֶדֶת וְהוֹלֶכֶת הִיא הַבְּכוֹרָה שֶׁלֹּא תְהֵא כָל עֵת הָעֲבוֹדָה בַּבְּכוֹרוֹת, כִּי שֵׁבֶט לֵוִי יִטֹּל אוֹתָהּ, וְעוֹד) אָמַר עֵשָׂו: מַה טִּיבָהּ שֶׁל עֲבוֹדָה זוֹ? אָמַר לוֹ: כַּמָּה אַזְהָרוֹת וָעֳנָשִׁין וּמִיתוֹת תְּלוּיִין בָּהּ כְּאוֹתָהּ שֶׁשָּׁנִינוּ, אֵלּוּ הֵן שֶׁבְּמִיתָה: שְׁתוּיֵי יַיִן וּפְרוּעֵי רֹאשׁ; אָמַר: אֲנִי הוֹלֵךְ לָמוּת עַל יָדָהּ, אִם כֵּן מַה חֵפֶץ לִי בָהּ?", "rashi_en": "הִנֵּה אָנֹכִי הוֹלֵךְ לָמוּת - הַבְּכוֹרָה דָּבָר לוֹא־קָבוּעַ הוּא, שֶׁלֹּא תָמִיד שׁוֹמְרִים הַבְּכוֹרִים אֶת הַקּוּרְבָּנוֹת, אִם־כִּי שֵׁבֶט לְוִי יִשְׁמְרוּם. וְעוֹד אָמַר עֵשָׂו מַה־טִּבְעַת הָעֲבוֹדָה הַזֹּאת, וַיַּעַן יַעֲקֹב זָאת, אִסּוּרִים וַעֲנָשִׁים הַרְבֵּה וְעַשִׁיּוֹת מַרְבִּיּוֹת שֶׁל עֹנֶשׁ מִיתָה קְשׁוּרוֹת בָּהּ, שֶׁהִנָּחוּ בַמִּשְׁנָה בִּסְנֵהֶדְרִין: כּוֹהֲנִים שׁוֹנִים בִּשְׁכָרוּת וּבִשְׂעָר אָרֹךְ חַיָּבִים מִיתָה. אָמַר לוֹ: אִם עַל־יְדֵי־זוֹ אֲנִי מֵת, לָמָּה אֶחְמֹד בָּהּ?", "note": "", "points": [{"q": "לְפִי רַשִּׁ״י, מַדּוּעַ דָּחָה עֵשָׂו אֶת הַבְּכוֹרָה כְּשֶׁלָּמַד מַה הִיא כְּרוּכָה בָּהּ?", "options": ["כִּי הוּא יָמוּת מִן הַדִּינִים הַקָּשִׁים וְהַעֹנְשִׁים הַקְּשׁוּרִים אֵלֶיהָ", "כִּי שֵׁבֶט לְוִי כְּבָר לָקַח עַל עַצְמוֹ אֶת כָּל הַתַּפְקִידִים הַכּוֹהֲנִיִּם", "כִּי יַעֲקֹב הִטִּיל עָלָיו עַל־יְדֵי הַאֲכִילָה שֶׁל עֲדָשִׁים בִּמְקוֹם הַסְּעוּדָה הַקְּדוֹשָׁה"], "kasha": "הַפָּסוּק מַשְׁמִיעַ לְקוֹל עֵשָׂו לְאָמְרוֹ שְׁהוּא עַל־פִּי מָוֶת וְעַל־כֵּן הַבְּכוֹרָה אֵינָהּ שָׁוָה לוֹ, וְאַךְ אֵינוֹ בָרוּר מַדּוּעַ הוּא חוֹשֵׁב שֶׁהַבְּכוֹרָה תוֹבִיל אוֹתוֹ לְמָוֶת.", "answer": "רַשִּׁ״י מְבָאֵר שֶׁיַּעֲקֹב אָמַר לְעֵשָׂו עַל הַמְּנַיּוֹת הַרַבּוֹת שֶׁל עֹנְשִׁים קָשִׁים וַאֲפִלּוּ עֹנְשֵׁי מִיתָה הַקְּשׁוּרִים לַעֲבוֹדַת הַמִּקְדָּשׁ, כְּגוֹן הַשֵּׁרוּת בִּשְׁכָרוּת אוֹ עִם שֵׂעָר אָרֹךְ. עֵשָׂו הִסִּיק שֶׁהַבְּכוֹרָה תוֹבִיל אוֹתוֹ לְמָוֶת, וּלְכֵן הִשְׁלִיךְ אוֹתָהּ."}, {"q": "מַה אָמַר יַעֲקֹב לְעִנְיַן מַדּוּעַ הַבְּכוֹרָה אֵינָהּ יַצִּיבָה, לְפִי רַשִּׁ״י?", "options": ["כִּי שֵׁבֶט לְוִי בִּסּוֹף הַדְּבָרִים יִטּוֹל עַל עַצְמוֹ אֶת תַּפְקִידֵי הַקּוּרְבָּנוֹת מִן הַבְּכוֹר", "כִּי בְנֵי עֵשָׂו יְמָאֲנוּ לַעֲבוֹד אֶת עֲבוֹדַת הַמִּקְדָּשׁ", "כִּי הַדִּינִים שֶׁל הַבְּכוֹרָה יִשְׁתַּנּוּ עִם כָּל דּוֹר וָדוֹר"], "kasha": "עֵשָׂו דּוֹחֶה אֶת הַבְּכוֹרָה כַּמּוּ־שֶׁדָּבָר שֶׁיָּמוּת אִתּוֹ, וְזוֹ מַעֲלָה הַשְּׁאֵלָה מַה־זֶּה יַעֲקֹב אָמַר עַל־דְּבַר הִתְבַּצְּרוּת הַבְּכוֹרָה וּמַהוּתָהּ.", "answer": "רַשִּׁ״י אוֹמֵר שֶׁהַבְּכוֹרָה אֵינָהּ יַצִּיבָה כִּי לֹא תָמִיד יִשְׁמְרוּ הַבְּכוֹרִים אֶת תַּפְקִידֵי הַקּוּרְבָּנוֹת, כִּי שֵׁבֶט לְוִי יִטּוֹל זֹאת עַל עַצְמוֹ."}]}, {"id": "25:34.1", "ch": 25, "v": 34, "n": 1, "dh": "ויבז עשו", "pasuk_html": "וְיַעֲקֹ֞ב נָתַ֣ן לְעֵשָׂ֗ו לֶ֚חֶם וּנְזִ֣יד עֲדָשִׁ֔ים וַיֹּ֣אכַל וַיֵּ֔שְׁתְּ וַיָּ֖קׇם וַיֵּלַ֑ךְ <mark>וַיִּ֥בֶז עֵשָׂ֖ו</mark> אֶת־הַבְּכֹרָֽה׃&nbsp;{פ}", "pasuk_en": "וַיִּתֵּן יַעֲקֹב לְעֵשָׂו לֶחֶם וּנְזִיד עֲדָשִׁים וַיֹּאכַל וַיִּשְׁתְּ וַיָּקָם וַיֵּלַךְ וַיִּבֶז עֵשָׂו אֶת־הַבְּכוֹרָה.", "rashi_he": "ויבז עשו. הֵעִיד הַכָּתוּב עַל רִשְׁעוֹ שֶׁבִּזָּה עֲבוֹדָתוֹ שֶׁל מָקוֹם:", "rashi_en": "וַיִּבֶז עֵשָׂו - הַכָּתוּב מְעִיד עַל־רִשְׁעוּתוֹ שֶׁבָּזָה אֶת הָעֲבוֹדָה שֶׁל הַקָּדוֹשׁ בָּרוּךְ הוּא!", "note": "", "points": [{"q": "מַה אוֹמֵר רַשִּׁ״י שֶׁהַפָּסוּק מְעִיד עַל־דְּבַר מִדּוֹת עֵשָׂו?", "options": ["הוּא בָזָה אֶת הָעֲבוֹדָה שֶׁל הַקָּדוֹשׁ בָּרוּךְ הוּא, וְזֶה מַרְאֶה אֶת רִשְׁעוּתוֹ", "הוּא רָעֵב בִּלְבַד וְלֹא הֵבִין אֶת הָעֵרֶךְ שֶׁל הַבְּכוֹרָה", "הוּא הָיָה חָכָם דַּיָּק לְהִשִּׂיג לַחְמָא וְנָזִיד בִּתְמוּרַת דָּבָר שֶׁאֵינוֹ שָׁוָה"], "kasha": "הַפָּסוּק אוֹמֵר שֶׁעֵשָׂו בָּזָה אֶת הַבְּכוֹרָה, וְאַךְ אֵינוֹ בָרוּר מִיָּד אִם־זֶה מְשַׁקֵּף עַל־דְּבַר כּוֹלּוֹ שֶׁל עֵשָׂו אוֹ רַק הַחְלָטָה רְגַעִית הַנִּדְחֲפָה עַל־יְדֵי־הַרָעָב.", "answer": "רַשִּׁ״י מְעִיד שֶׁהַפָּסוּק מַרְאֶה אֶת רִשְׁעוּתוֹ שֶׁל עֵשָׂו - הוּא בָזָה לֹא רַק מִנְחָלָה גַּשְׁמִית אֶלָּא בִּמְנַיּוֹ הָעֲבוֹדָה שֶׁל הַקָּדוֹשׁ בָּרוּךְ הוּא, הַיִּחּוּסִין הַדָּתִיִּים הַקְּשׁוּרִים לַבְּכוֹרָה."}]}, {"id": "26:2.1", "ch": 26, "v": 2, "n": 1, "dh": "אל תרד מצרימה", "pasuk_html": "וַיֵּרָ֤א אֵלָיו֙ יְהֹוָ֔ה וַיֹּ֖אמֶר <mark>אַל־תֵּרֵ֣ד מִצְרָ֑יְמָה</mark> שְׁכֹ֣ן בָּאָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "וַיֵּרָא אֵלָיו ה' וַיֹּאמֶר אַל־תֵּרֶד מִצְרַיְמָה שְׁכֹּן בָּאָרֶץ אֲשֶׁר אוֹמַר אֵלֶיךָ.", "rashi_he": "אל תרד מצרימה. שֶׁהָיָה דַּעְתּוֹ לָרֶדֶת מִצְרַיְמָה, כְּמוֹ שֶׁיָּרַד אָבִיו בִּימֵי הָרָעָב; אָמַר לוֹ: אַל תֵּרֵד מִצְרָיְמָה, שֶׁאַתָּה עוֹלָה תְמִימָה, וְאֵין חוּצָה לָאָרֶץ כְּדַאי לְךָ:", "rashi_en": "אַל־תֵּרֶד מִצְרַיְמָה - כִּי חִשַּׁב לְרֶדֶת לְמִצְרַיִם כַּאֲשֶׁר יָרַד אָבִיו בִּימֵי רָעָב. אָמַר לוֹ אַל־תֵּרֶד כִּי אַתָּה עוֹלַת תָּמִים בְּלוּ מוּם וְאַיִן־זֶה נָאֶה לְךָ לִשְׁכֹּן מִחוּץ לָאָרֶץ הַקְּדוֹשָׁה.", "note": "", "points": [{"q": "מַדּוּעַ אָסַר הַקָּדוֹשׁ בָּרוּךְ הוּא לְיִצְחָק לָלֶכֶת לְמִצְרַיִם בִּימֵי הָרָעָב, לְפִי רַשִּׁ״י?", "options": ["כִּי יִצְחָק הוּא כְּעוֹלַת תָּמִים וְאֵינוֹ רָאוּי לִשְׁכֹּן מִחוּץ לָאָרֶץ הַקְּדוֹשָׁה", "כִּי מִצְרַיִם הָיְתָה מְסֻכֶּנֶת וּלוּ מַגֵּפוֹת בָּעֵת הַהִיא", "כִּי אַבְרָהָם אָבִיו כְּבָר הִשְׁחִית אֶת הַבְּרִית בְּלִכְתּוֹ לְמִצְרַיִם"], "kasha": "יִצְחָק מִתְכַּוֵּן לָלֶכֶת לְמִצְרַיִם כַּאֲשֶׁר עָשָׂה אַבְרָהָם אָבִיו בִּימֵי רָעָב, אַךְ הַקָּדוֹשׁ בָּרוּךְ הוּא אוֹסֵר עָלָיו. הַשְּׁאֵלָה הִיא מַה־זֶּה הַשּׁוֹנֶה בְּמַצָּבוּ שֶׁל יִצְחָק מִזֶּה שֶׁל אַבְרָהָם?", "answer": "רַשִּׁ״י מְבָאֵר שֶׁיִּצְחָק הוּא עוֹלַת תָּמִים בְּלוּ מוּם, וְעַל־כֵּן שְׁכִינָה מִחוּץ לָאָרֶץ הַקְּדוֹשָׁה אֵינָהּ נָאָה לוֹ, בְּשִׁלּוּם מִאַבְרָהָם אָבִיו אֲשֶׁר הִרְשַּׁע לִשְׁכֹּן שָׁם."}]}, {"id": "26:3.1", "ch": 26, "v": 3, "n": 1, "dh": "האל", "pasuk_html": "גּ֚וּר בָּאָ֣רֶץ הַזֹּ֔את וְאֶֽהְיֶ֥ה עִמְּךָ֖ וַאֲבָרְכֶ֑ךָּ כִּֽי־לְךָ֣ וּֽלְזַרְעֲךָ֗ אֶתֵּן֙ אֶת־כׇּל־הָֽאֲרָצֹ֣ת <mark>הָאֵ֔ל</mark> וַהֲקִֽמֹתִי֙ אֶת־הַשְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְאַבְרָהָ֥ם אָבִֽיךָ׃", "pasuk_en": "שְׁכֹּן בָּאָרֶץ הַזֹּאת וְאֶהְיֶה עִמְּךָ וַאֲבָרְכְךָ כִּי לְךָ וּלְזַרְעֲךָ אֶתֵּן אֶת־כָּל־הָאָרְצוֹת הָאֵלּ וַהֲקִמֹתִי אֶת־הַשְּׁבוּעָה אֲשֶׁר נִשְׁמַרְתִּי לְאַבְרָהָם אָבִיךָ.", "rashi_he": "האל. כְּמוֹ הָאֵלֶּה:", "rashi_en": "הָאֵלּ - הוּא בִּמְקוֹם הָאֵלֶּה.", "note": "", "points": [{"q": "אֵיזוֹ נוּקּוּדָה דִּקְדּוּקִית מְבָאֶרֶת רַשִּׁ״י בְּנוֹגַע לַמִּלָּה הָאֵלּ בַּפָּסוּק זֶה?", "options": ["הִיא שִׁמּוּשׁ שֶׁל הָאֵלּוֹ בִּמְקוֹם הָאֵלֶּה וְלֹא צוּרָה קָבוּעָה שֶׁל הַמִּלָּה אֱלוֹהִים", "הִיא מִתְיַחֶסֶת לְאֱלוֹהוּת מְיֻחֶּדֶת שֶׁנִּשְׁמְּרָה בִּכְנַעַן", "הִיא צוּרָה נָדִירָה שֶׁל רִבִּים בִּמְיַחֲסִים לַמִּדּוֹת הָאֱלוֹהִיּוֹת הַשּׁוֹנוֹת"], "kasha": "הַמִּלָּה הָאֵלּ עֲלוּלָה לִגְרוֹם בִּלְבוּל כִּי הִיא עֲלוּלָה לִהְיוֹת קְשׁוּרָה לַמִּלָּה אֱלוֹהִים וְלֹא לִהְיוֹת הַשָּׁלוּם בָּרוּר שֶׁל הָאַרְצוֹת הַמְּסוּכָּנוֹת.", "answer": "רַשִּׁ״י מְבָאֵר שֶׁהָאֵלּ מַשְׁמָעוּתוֹ הָאֵלֶּה, וְלָכֵן הַצִּיּוּר מִתְוַחֵּד לִהְיוֹת הִשָּׁמְרוּת בָּרוּר שֶׁל כָּל־הָאָרְצוֹת הַשׁוּמַּר לוֹ עַל־יְדֵי הַקָּדוֹשׁ בָּרוּךְ הוּא וּלְזַרְעוֹ."}]}, {"id": "26:4.1", "ch": 26, "v": 4, "n": 1, "dh": "והתברכו בזרעך", "pasuk_html": "וְהִרְבֵּיתִ֤י אֶֽת־זַרְעֲךָ֙ כְּכוֹכְבֵ֣י הַשָּׁמַ֔יִם וְנָתַתִּ֣י לְזַרְעֲךָ֔ אֵ֥ת כׇּל־הָאֲרָצֹ֖ת הָאֵ֑ל <mark>וְהִתְבָּרְכ֣וּ בְזַרְעֲךָ֔</mark> כֹּ֖ל גּוֹיֵ֥י הָאָֽרֶץ׃", "pasuk_en": "וְהַרְבֵּיתִי אֶת־זַרְעֲךָ כְּכוֹכְבֵי הַשָּׁמַיִם וְנָתַתִּי לְזַרְעֲךָ אֶת־כָּל־הָאָרְצוֹת הָאֵלּ וְנִשְׁמְּרוּ בְּזַרְעֲךָ כָּל־גּוֹיֵי הָאָרֶץ.", "rashi_he": "והתברכו בזרעך. אָדָם אוֹמֵר לִבְנוֹ יְהֵא זַרְעֲךָ כְּזַרְעוֹ שֶׁל יִצְחָק, וְכֵן בְּכָל הַמִּקְרָא, וְזֶה אָב לְכֻלָּן בְּךָ יְבָרֵךְ יִשְׂרָאֵל לֵאמֹר יְשִׂמְךָ וְגוֹ' (בראשית מ״ח:כ׳); וְאַף לְעִנְיַן הַקְּלָלָה מָצִינוּ כֵן וְהָיְתָה הָאִשָּׁה לְאָלָה (במדבר ה'), שֶׁהַמְקַלֵּל שׂוֹנְאוֹ אוֹמֵר תְּהֵא כִּפְלוֹנִית, וְכֵן וְהִנַּחְתֶּם שִׁמְכֶם לִשְׁבוּעָה לִבְחִירַי (ישעיהו ס\"ה), שֶׁהַנִּשְׁבָּע אוֹמֵר אֱהֵא כִפְלוֹנִי אִם עָשִׂיתִי כָּךְ וְכָךְ:", "rashi_en": "וְנִשְׁמְּרוּ בְּזַרְעֲךָ - אָדָם יֹאמַר לִבְנוֹ יְהִי זַרְעֲךָ כִּזְרַע יִצְחָק, כָּכָה תִּהְיֶה הַמַּשְׁמָעוּת שֶׁל הַמִּלִּים הַקְּשׁוּרוֹת לַדָּבָר בַּכּוֹל הַשׁוּמַּר בַּכָּתוּבִים. וְהַהוֹדָעָה הַקְּדוֹמָה מִן הַמִּקְרָה הִיא שֶׁ(מ״ח:כ׳) בְּךָ יְבָרְכוּ יִשְׂרָאֵל אֶת־בְּנֵיהֶם לֵאמֹר יְשִׂמְךָ אֱלוֹהִים כְּאֶפְרַיִם וּכְמְנַשֶּׁה. וְכָכָה גַּם בִּקְלָלָה נִמְצָא הַדּוֹמֶה (בַּמִּדְבַּר ה':כ״ז) וְהָיְתָה הָאִשָּׁה הַהִיא לִקְלָלָה בִּקְרַב עַמָּהּ, שֶׁמַּשְׁמַע שֶׁמִּי־שֶׁמְּקַלְּלֵל יֹאמַר יְהִי אַתָּה כָּמוֹ פְּלוֹנִית וּפְלוֹנִית. וְכָמוֹ גַּם (יְשַׁעְיָה ס״ה:ט״ו) וַהֲנִַחְתֶּם אֶת־שְׁמוֹתֵיכֶם לִקְלָלָה לִבְחִירַי, שֶׁמַּשְׁמַע שֶׁמִּי־שֶׁנִּשְׁמַר בִּשְׁבוּעָה יֹאמַר יְהִי אֲנִי כָּמוֹ פְּלוֹנִי וּפְלוֹנִי אִם־כֵּן עָשִׂיתִי.", "note": "", "points": [{"q": "מַה־הַמַּשְׁמָעוּת שֶׁל הַפָּסוּק וְנִשְׁמְּרוּ בְּךָ כָּל־גּוֹיֵי הָאָרֶץ, לְפִי רַשִּׁ״י?", "options": ["אַנְשִׁים יֹאמְרוּ לִבְנֵיהֶם יְהִי זַרְעֲךָ כִּזְרַע יִצְחָק - זוֹ בְרָכָה", "כָּל־הַגּוֹיִים בָּאָרֶץ יִשְׁתַּחֲוּ לְפָנָיו וְיִשְׁמְּרוּ לַזְּרַע שֶׁלּוֹ", "זְרַע יִצְחָק יִטּוּל בַּעֲצְמוֹ לִבְרֹךְ אֶת־כָּל־הַגּוֹיִים בִּישִׁיר וּבִמְשִׁחַק"], "kasha": "הַמִּלִּים וְנִשְׁמְּרוּ בְּךָ עֲלוּלוֹת לִהְיוֹת בִּלְבוּל כִּי אֵיזוֹ עֵקֶב זוֹ עוֹלֶה מִן הַמִּלִּים הַקְּשׁוּרוֹת לַבְּרָכָה שֶׁל יִצְחָק וּזְרָעוֹ?", "answer": "רַשִּׁ״י מְבָאֵר שֶׁזּוֹ תְּהִי בְּרָכָה בָּהּ אַנְשִׁים יֹאמְרוּ לִבְנֵיהֶם יְהִי זַרְעֲךָ כִּזְרַע יִצְחָק, כַּאֲשֶׁר הַקָּדוֹשׁ בָּרוּךְ הוּא בֵּרַךְ אֶת־אֶפְרַיִם וּמְנַשֶּׁה."}, {"q": "כַּיּוֹצֵא בַּזֶּה, כָּל־הִנָּחוּ בִּקְלָלָה פּוֹעֶלֶת, לְפִי רַשִּׁ״י?", "options": ["מִי־שֶׁמְּקַלְּלֵל אוֹיֵב יֹאמַר לּוֹ יְהִי אַתָּה כָּמוֹ פְּלוֹנִי וּפְלוֹנִי, בַּחֲנִיָּה אַחֶרֶת כִּבְרָכָה", "קְלָלוֹת וּבְרָכוֹת מִשְׁתַּמְּשׁוֹת בִּמִּלִּים הָעִבְרִיּוֹת זוֹהֶה בְּהִקְשָׁרִים שׁוֹנִים", "גַּם קְלָלוֹת וְגַם בְרָכוֹת צְרִיכוֹת עֵדִים וּשְׁבוּעוֹת לִהְיוֹת תוֹקְפִיּוֹת"], "kasha": "הַפָּסוּק דִּבֵּר רַק עַל־בְּרָכוֹת, וְלָכֵן אֲפִשָׁר שֶׁנִּשְׁמַר זוֹ נוּקָּה לַבְּרָכוֹת וְלֹא נִשְׁתַּמְּשָׁהּ בְּהִקְשָׁרִים אַחֵרִים.", "answer": "רַשִּׁ״י מַרְאֶה עַל־יְדֵי קִטּוּל בַּמִּדְבַּר שֶׁמִּי־שֶׁמְּקַלְּלֵל יֹאמַר גַּם כֵּן יְהִי אַתָּה כָּמוֹ פְּלוֹנִית וּפְלוֹנִית, וְזוֹ הַשְּׁמָיָרוּת פּוֹעֶלֶת גַּם בִּקְלָלוֹת."}]}, {"id": "26:5.1", "ch": 26, "v": 5, "n": 1, "dh": "שמע אברהם בקולי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־<mark>שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י</mark> וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י מִצְוֺתַ֖י חֻקּוֹתַ֥י וְתוֹרֹתָֽי׃", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "שמע אברהם בקולי. כְּשֶׁנִּסִּיתִי אוֹתוֹ:", "rashi_en": "שָׁמַע אַבְרָהָם בְקוֹלִי — בִּשְׁעַת שְׁנִיסִּיתִיו.", "note": "", "points": [{"q": "לפי רש״י, מתי הראה אברהם שהוא 'שמע בקולי'?", "options": ["כאשר אלוקים נִסָּה אותו", "כאשר עזב את מולדתו ונָסַע לכנען", "כאשר בנה מזבחות והתפלל לאלוקים לאורך כל חייו"], "kasha": "הפסוק אומר שאברהם שמע בקול אלוקים, אך ההקשר או הרגע המסוים שאליו מתייחסים אינם מפורשים בטקסט.", "answer": "רש״י מבהיר שביטוי 'אברהם שמע בקולי' מתייחס לכאשר אלוקים נִסָּה אותו—כנראה בהתייחסות לנסיונות כמו עקידת יצחק וניסיונות אחרים שהוכיחו את כניעותו של אברהם."}]}, {"id": "26:5.2", "ch": 26, "v": 5, "n": 2, "dh": "וישמר משמרתי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י <mark>וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י</mark> מִצְוֺתַ֖י חֻקּוֹתַ֥י וְתוֹרֹתָֽי׃", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "וישמר משמרתי. גְּזֵרוֹת לְהַרְחָקָה עַל הָאַזְהָרוֹת שֶׁבַּתּוֹרָה, כְּגוֹן שְׁנִיּוֹת לָעֲרָיוֹת וּשְׁבוּת לַשַּׁבָּת (יבמות כ\"א):", "rashi_en": "וַיִּשְׁמֹר מִשְׁמַרְתִּי — גְּזֵרוֹת הֵן לִשְׁמֹר שֶׁלֹּא יַעְבֹרוּ עַל דִּבְרֵי תוֹרָה, כְּגוֹן גִּדּוּר הַחֲכָמִים לִשְׁנִיּוֹת וִידִּידוֹת וַעֲבוֹדַת שַׁבָּת.", "note": "", "points": [{"q": "מה כוונת רש״י בביטוי 'מִשְׁמַרְתִּי' (משמרתי)?", "options": ["אמצעי זהירות של חכמים שנועדו להציל מהפרת אִסּוּרִים של התורה", "הקרבנות היומיים והזבחים שהוקרבו במקדש", "החוקים הכתובים בתורה כפי שהם מופיעים בטקסט"], "kasha": "הביטוי 'שמר משמרתי' אינו חד-משמעי — הוא עשוי להתייחס לחוק בִּבְלִי, להסדר של חכמים, או למשהו אחר לגמרי.", "answer": "רש״י מסביר שביטוי 'משמרתי' מתייחס לאמצעי זהירות (גְּזֵרוֹת) כגון הגבלות של חכמים על נישואין בין קרובים רחוקים או אִסּוּרִים נוספים בשבת, שנועדו להציל מהפרת חוקי התורה."}]}, {"id": "26:5.3", "ch": 26, "v": 5, "n": 3, "dh": "מצותי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י <mark>מִצְוֺתַ֖י</mark> חֻקּוֹתַ֥י וְתוֹרֹתָֽי׃", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "מצותי. דְּבָרִים שֶׁאִלּוּ לֹא נִכְתְּבוּ רְאוּיִן הֵם לְהִצְטַוּוֹת, כְּגוֹן גֶּזֶל וּשְׁפִיכוּת דָּמִים:", "rashi_en": "מִצְוֺתַי — דְּבָרִים שֶׁאִלְמָלֵא כְּתוּבִים בַּתּוֹרָה הָיוּ מַשּׁוּמִים לִהְיוֹת מִצְוָה, כִּגְזֵל וְהָרִיגָה.", "note": "", "points": [{"q": "כיצד רש״י מייחד בין 'מִצְוֺתַי' לבין הקטגוריות האחרות של חוקים?", "options": ["מצוות הן דברים שיהיו הגונים וראויים להציווה גם בלי להיות כתובים בתורה, כגון חוקים נגד גנבה והריגה", "מצוות הן חוקים של חכמים המועברים דרך המסורת העל-פיות", "מצוות הן חוקים החלים רק על הכוהנים ולא על ישראלים רגילים"], "kasha": "הפסוק מונה שלוש סוגים של חוקים — מצוות, חוקים, ותורות — אך ההבדל ביניהם אינו ברור מן ההקשר.", "answer": "רש״י מסביר שמצוות (מִצְוֺת) הן דברים שלולא היו כתובים בתורה, היינו בכל זאת חושבים שהם הגונים וראויים להציווה בהסתמך על הצדק האוניברסלי לבדו, כגון חוקים נגד גנבה והריגה."}]}, {"id": "26:5.4", "ch": 26, "v": 5, "n": 4, "dh": "חקותי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י מִצְוֺתַ֖י <mark>חֻקּוֹתַ֥י</mark> וְתוֹרֹתָֽי׃", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "חקותי. דְּבָרִים שֶׁיֵּצֶר הָרָע וְאֻמּוֹת הָעוֹלָם מְשִׁיבִין עֲלֵיהֶם, כְּגוֹן אֲכִילַת חֲזִיר וּלְבִישַׁת שַׁעַטְנֵז, שֶׁאֵין טַעַם בַּדָּבָר, אֶלָּא גְּזֵרַת הַמֶּלֶךְ וְחֻקּוֹתָיו עַל עֲבָדָיו:", "rashi_en": "חֻקּוֹתַי — דְּבָרִים שֶׁהַיֵּצֶר הָרָע וְאוּמּוֹת הָעוֹלָם מַתְקִיפִים עֲלֵיהֶם, כְּגוֹן אִסּוּר חֲזִיר וּשְׁעַטְנֵז, דְּבָרִים שֶׁאֵין לָהֶם טַעַם, אֶלָּא גְּזֵרַת מֶלֶךְ עַל עֲבָדָיו.", "note": "", "points": [{"q": "לפי רש״י, אֵילוּ סוג של מצוות מתוארות במילה 'חֻקּוֹת' (חוקות)?", "options": ["חוקים שאין להם בסיס הגיוני ברור, כגון איסור אכילת חזיר או ללבישת שותר וקטנז ביחד, אך מקבלים אותם כי הם גזירות המלך", "מצוות ששומרות על בריאות וביטחון הציבור, כגון חוקים על הכנת מזון", "חוקים שהומצאו על ידי האומות הגויות כדי לבדוק את אמונתו של אברהם לאלוקים"], "kasha": "המילה 'חֻקּוֹת' (חוקות) מופיעה לצד 'מִצְוֺת' (מצוות) ו'תוֹרוֹת' (תורות) — מה מבדיל בין חוקות לבין סוגים אחרים של חוקים?", "answer": "רש״י מסביר שחֻקּוֹת הן גזירות שאין להן בסיס הגיוני — אלוקים מציווה אותן בתור גזירות המלך על עבדיו, והן בדיוק החוקים שהיצר הרע והאומות הגויות טוענות נגדם."}]}, {"id": "26:5.5", "ch": 26, "v": 5, "n": 5, "dh": "ותורתי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י מִצְוֺתַ֖י חֻקּוֹתַ֥י <mark>וְתוֹרֹתָֽי׃</mark>", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "ותורתי. לְהָבִיא תּוֹרָה שֶׁבְּעַל פֶּה הֲ
