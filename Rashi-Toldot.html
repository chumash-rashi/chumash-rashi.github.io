ָלַךְ לְחָרָן, שֶׁהֲרֵי לֹא שָׁהָה בְּבֵית לָבָן לִפְנֵי לֵדָתוֹ שֶׁל יוֹסֵף אֶלָּא י\"ד שָׁנָה, שֶׁנֶּאֱמַר עֲבַדְתִּיךָ אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ, וּשְׂכַר הַצֹּאן מִשֶּׁנּוֹלַד יוֹסֵף הָיָה, שֶׁנֶּאֱמַר וַיְהִי כַּאֲשֶׁר יָלְדָה רָחֵל אֶת יוֹסֵף וְגוֹ'; וְיוֹסֵף בֶּן ל' שָׁנָה הָיָה כְּשֶׁמָּלַךְ, וּמִשָּׁם עַד שֶׁיָּרַד יַעֲקֹב לְמִצְרַיִם ט' שָׁנִים, ז' שֶׁל שָׂבָע וּב' שֶׁל רָעָב, וְיַעֲקֹב אָמַר לְפַרְעֹה יְמֵי שְׁנֵי מְגוּרַי שְׁלֹשִׁים וּמְאַת שָׁנָה – צֵא וַחֲשֹׁב י\"ד שֶׁלִּפְנֵי לֵדַת יוֹסֵף וּשְׁלֹשִׁים שֶׁל יוֹסֵף וְתֵשַׁע מִשֶּׁמָּלַךְ עַד שֶׁבָּא יַעֲקֹב, הֲרֵי נ\"ג, וּכְשֶׁפֵּרֵשׁ מֵאָבִיו הָיָה בֶּן ס\"ג, הֲרֵי קי\"ו, וְהוּא אוֹמֵר שְׁלֹשִׁים וּמְאַת שָׁנָה, הֲרֵי חֲסֵרִים י\"ד שָׁנִים, הָא לָמַדְתָּ שֶׁאַחַר שֶׁקִּבֵּל הַבְּרָכוֹת נִטְמַן בְּבֵית עֵבֶר י\"ד שָׁנִים, אֲבָל לֹא נֶעֱנַשׁ בִּזְכוּת הַתּוֹרָה; שֶׁהֲרֵי לֹא פֵּרֵשׁ יוֹסֵף מֵאָבִיו אֶלָּא כ\"ב שָׁנָה, דְּהַיְנוּ מִי\"ז עַד ל\"ט, כְּנֶגֶד כ\"ב שֶׁפֵּרֵשׁ יַעֲקֹב מֵאָבִיו וְלֹא כִבְּדוֹ, וְהֵם כ' שָׁנִים בְּבֵית לָבָן וּשְׁתֵּי שָׁנִים שֶׁשָּׁהָה בַדֶּרֶךְ, כְּדִכְתִיב וַיִּבֶן לוֹ בָּיִת וּלְמִקְנֵהוּ עָשָׂה סֻכֹּת, וּפֵר' רַזִ\"לִ מִזֶּה הַפָּסוּק שֶׁשָּׁהָה י\"ח חֳדָשִׁים בַּדֶּרֶךְ – דְּבַיִת הֲוָה בִּימוֹת הַגְּשָׁמִים וְסֻכֹּת הֲווּ בִּימוֹת הַחַמָּה – וּלְחֶשְׁבּוֹן הַפְּסוּקִים שֶׁחָשַׁבְנוּ לְעֵיל מִשֶּׁפֵּרֵשׁ מֵאָבִיו עַד שֶׁיָּרַד לְמִצְרַיִם שֶׁהָיָה בֶּן ק\"ל שָׁנִים, שֶׁשָּׁם אָנוּ מוֹצְאִים עוֹד י\"ד שָׁנִים – אֶלָּא וַדַּאי נִטְמַן בְּבֵית עֵבֶר בַּהֲלִיכָתוֹ לְבֵית לָבָן לִלְמֹד תּוֹרָה מִמֶּנּוּ, וּבִשְׁבִיל זְכוּת הַתּוֹרָה לֹא נֶעֱנַשׁ עֲלֵיהֶם וְלֹא פֵּרֵשׁ יוֹסֵף מִמֶּנּוּ אֶלָּא כ\"ב שָׁנָה – מִדָּה כְּנֶגֶד מִדָּה – עַ\"כַּ בְּרַשִׁ\"י יָשָׁן:", "rashi_en": "מכך שמחלת היא בת ישמעאל ברור שהיא אחות נביות, אלא בא ללמד שישמעאל מת אחרי שייעד אותה לעשו וקודם נישואיה, ונביות אחיה השיא אותה. מכאן מחשבים שיעקב היה אז בן ס״ג, ושלפני שהלך לחרן נטמן י״ד שנה בבית עבר ללמוד תורה, ובזכות התורה לא נענש על השנים האלו.", "note": "", "points": [{"q": "מָה מְלַמֶּדֶת הַתּוֹסֶפֶת \"אֲחוֹת נְבָיוֹת\"?", "options": ["שֶׁיִּשְׁמָעֵאל מֵת לִפְנֵי נִישּׂוּאֶיהָ, וּנְבָיוֹת אָחִיהָ הִשִּׂיא אוֹתָהּ", "שֶׁנְּבָיוֹת הָיָה הַבְּכוֹר וְהֶחָשׁוּב מִבְּנֵי יִשְׁמָעֵאל", "שֶׁמָּחֲלַת הָיְיתָה אֲחוֹתוֹ שֶׁל נְבָיוֹת מֵאָב וּמֵאֵם"], "kasha": "ממה שנאמר \"בת ישמעאל\" כבר יודעים שהיא אחות נביות, ומדוע הוצרך הכתוב לפרש?", "answer": "למדנו שמת ישמעאל אחרי שייעד אותה לעשו וקודם נישואיה, והשיאה נביות אחיה.", "kp": ["שמת ישמעאל משיעדה לעשו", "קדם נשואיה והשיאה נביות אחיה"]}, {"q": "הֵיכָן הָיָה יַעֲקֹב בִּי״ד הַשָּׁנִים הַחֲסֵרוֹת בְּחֶשְׁבּוֹן שְׁנוֹתָיו?", "options": ["נִטְמַן בְּבֵית עֵבֶר וְלָמַד שָׁם תּוֹרָה", "נִשְׁאַר בְּבֵית אָבִיו וְשֵׁירֵת אוֹתוֹ", "עָבַד אֵצֶל לָבָן לִפְנֵי שֶׁנָּשָׂא אֶת נָשָׁיו"], "kasha": "בחשבון שנותיו של יעקב מאז שיצא מבית אביו ועד שירד למצרים חסרות י״ד שנים.", "answer": "אחרי שקיבל את הברכות נטמן בבית עבר י״ד שנים ללמוד תורה, ורק אחר כך הלך לחרן; ובזכות התורה לא נענש עליהן, ולכן פרש ממנו יוסף רק כ״ב שנה – מידה כנגד מידה.", "kp": ["נטמן בבית עבר בהליכתו", "ללמד תורה ממנו"]}]}, {"id": "28:9.2", "ch": 28, "v": 9, "n": 2, "dh": "על נשיו", "pasuk_html": "וַיֵּ֥לֶךְ עֵשָׂ֖ו אֶל־יִשְׁמָעֵ֑אל וַיִּקַּ֡ח אֶֽת־מָחֲלַ֣ת&thinsp;׀ בַּת־יִשְׁמָעֵ֨אל בֶּן־אַבְרָהָ֜ם אֲח֧וֹת נְבָי֛וֹת <mark>עַל־נָשָׁ֖יו</mark> ל֥וֹ לְאִשָּֽׁה׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל וַיִּקַּח אֶת מַחְלַת בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם אֲחוֹת נְבָיוֹת עַל נָשָׁיו לוֹ לְאִשָּׁה.", "rashi_he": "על נשיו. הוֹסִיף רִשְׁעָה עַל רִשְׁעָתוֹ, שֶׁלֹּא גֵרֵשׁ אֶת הָרִאשׁוֹנוֹת:", "rashi_en": "עשו לקח את מחלת נוסף על נשיו הקודמות ולא גירש אותן, וכך הוסיף רשעה על רשעתו.", "note": "", "points": [{"q": "מָה מְלַמְּדוֹת הַמִּילִּים \"עַל־נָשָׁיו\"?", "options": ["שֶׁהוֹסִיף רִשְׁעָה עַל רִשְׁעָתוֹ וְלֹא גֵּירֵשׁ אֶת הָרִאשׁוֹנוֹת", "שֶׁעֵשָׂו חָזַר בִּתְשׁוּבָה וְגֵירֵשׁ אֶת נָשָׁיו הַכְּנַעֲנִיּוֹת", "שֶׁמָּחֲלַת הָיְיתָה חֲשׁוּבָה בְּעֵינָיו מִכָּל נָשָׁיו"], "kasha": "מדוע הוצרך הכתוב לציין שלקח אותה \"על נשיו\"?", "answer": "הוסיף רשעה על רשעתו, שלא גירש את נשיו הראשונות.", "kp": ["הוסיף רשעה על רשעתו", "שלא גרש את הראשונות"]}]}];
const EN = {"25:19.1":{"e":"The 'toldot' of Yitzchak are his sons Yaakov and Eisav, about whom the parsha tells.","pe":"And these are the descendants of Yitzchok son of Avraham. Avraham was the father of Yitzchok.","re":"These are the descendants of Yitzchok. [תּוֹלְדֹת יִצְחָק refers to:] Yaakov and Eisov who are discussed in this parshah.","p":[{"q":"According to Rashi, who are the 'toldot' of Yitzchak that the verse refers to?","o":["Yaakov and Eisav, about whom the parsha tells","The events that happened to Yitzchak during his lifetime","All of Yitzchak's descendants through the generations until Moshe"]}]},"25:19.2":{"e":"The scoffers of the generation said that Sarah became pregnant from Avimelech, because she had lived with Avraham for many years without conceiving from him. Hashem made Yitzchak's face resemble Avraham's, and everyone testified that Avraham fathered Yitzchak; therefore the verse stresses this.","pe":"And these are the descendants of Yitzchok son of Avraham. Avraham was the father of Yitzchok.","re":"Avraham was the father of Yitzchok. After God [re]named him Avraham, [only] then did he have Yitzchok. An alternate explanation: since the verse was written “Yitzchok son of Avraham,” it became necessary to say, “Avraham was the father of Yitzchok,” because the scoffers of the generations were saying that Sarah conceived by Avimelech, for she had lived with Avraham many years and did not conceive by him. What did God do? He shaped Yitzchok’s facial features similar to Avraham’s so that everyone would testify that “Avraham was the father of Yitzchok.” This is [the meaning of] what is written here: “Yitzchok, son of Avraham” for here is proof that “Avraham was Yitzchok’s father.”","p":[{"q":"Why did the verse need to say 'Avraham fathered Yitzchak' after already saying 'Yitzchak son of Avraham'?","o":["Against the scoffers of the generation who said Sarah became pregnant from Avimelech","To teach that Yitzchak was born when Avraham was very old","To distinguish Yitzchak from Yishmael son of Hagar"]},{"q":"How did it become clear to everyone that Avraham was Yitzchak's father?","o":["Hashem made Yitzchak's face resemble Avraham's","Avimelech himself testified that Sarah had not conceived from him","Yitzchak was born exactly at the time the angels had promised"]}]},"25:20.1":{"e":"When Avraham returned from Har HaMoriah he was told that Rivkah had been born, and Yitzchak was then 37, since Sarah gave birth to him at 90 and died at 127, at the time of the Akeidah. Yitzchak waited three years until Rivkah was fit for marriage, and married her at age 40.","pe":"Yitzchok was forty years old when he took Rivkah, the daughter of Besueil, the Aramite, of Padan Aram, sister of Lavan, the Aramite, for a wife.","re":"Forty years old. For when Avraham returned from Mount Moriah he received the news that Rivkah was born. And Yitzchok was then thirty-seven years old, for it was at that time that Sarah died. And from Yitzchok’s birth until the Akeidah when Sarah died, there were thirty-seven years; because she was ninety at Yitzchok’s birth and one hundred and twenty-seven at her death. For it is said: “The lifetime of Sarah etc.,” making Yitzchok thirty-seven years old, and at that time Rivkah was born. He waited for her until she was fit for marriage—three years—whereupon he married her.","p":[{"q":"How does Rashi calculate that Yitzchak was forty when he married Rivkah?","o":["At the Akeidah he was 37 and Rivkah was born, and he waited three years for her","At the Akeidah he was 40, and he married Rivkah right after it","At the Akeidah he was 37, and he mourned Sarah for three years"]}]},"25:20.2":{"e":"The verse already told us that Rivkah was the daughter of Besuel, the sister of Lavan, and from Padan Aram, and it repeats this in order to praise her: although she grew up among wicked people, she did not learn from their ways.","pe":"Yitzchok was forty years old when he took Rivkah, the daughter of Besueil, the Aramite, of Padan Aram, sister of Lavan, the Aramite, for a wife.","re":"The daughter of Besueil, the Aramite, of Padan Aram, sister of Lavan. But, has is not already been written that she was Besueil’s daughter and Lavan’s sister from Padan Aram? [This is written] only to relate her praise that she was the daughter of a wicked person and the sister of a wicked person and her dwelling place was one of wicked people [yet] she did not learn from their deeds.","p":[{"q":"Why does the verse repeat Rivkah's family and place?","o":["To praise her, that she grew up among the wicked and did not learn from their ways","To mention that Yitzchak married a woman from Avraham's family","To explain why Yaakov later fled to Lavan"]}]},"25:20.3":{"e":"The place is called 'Padan Aram' because there were two Arams, Aram Naharaim and Aram Tzovah, and 'padan' means a pair, like a 'yoke of oxen', which the Targum renders 'padan toreen'. Some explain 'Padan Aram' like 'the field of Aram', since in the language of Yishmael a field is called 'padan'.","pe":"Yitzchok was forty years old when he took Rivkah, the daughter of Besueil, the Aramite, of Padan Aram, sister of Lavan, the Aramite, for a wife.","re":"Of Padan Aram. Because there were two Arams—Aram Nahariyum and Aram Zovah. It is called [collectively] Padan [pair], derived from צֶמֶד בָּקָר [a pair of oxen] which the Targum translates פַּדַּן תּוֹרִין. Others explain פַּדַּן אֲרָם as “The field of Aram” because in Arabic a field is called Padan.","p":[{"q":"According to Rashi's first explanation, what does the word 'padan' mean?","o":["A pair, because of the two Arams: Aram Naharaim and Aram Tzovah","A border, because the border between Aram and Canaan passed there","A river, because of the great river that ran through the land of Aram"]},{"q":"What is the second explanation Rashi brings for 'Padan Aram'?","o":["The field of Aram, since in the language of Yishmael a field is called 'padan'","The city of Aram, since in Aramaic a city is called 'padan'","The mountain of Aram, since in the language of Yishmael a mountain is called 'padan'"]}]},"25:21.1":{"e":"'Vaye'ater' means that Yitzchak prayed a great deal and pleaded intensely.","pe":"Yitzchok prayed to Adonoy across from his wife, for she was barren. Adonoy granted his prayer and his wife, Rivkah, conceived.","re":"[He] prayed. [Meaning:] he [Yitzchok] increased his imploring and praying.","p":[{"q":"What does the word 'vaye'ater' teach about Yitzchak's prayer?","o":["That he prayed a great deal and pleaded intensely","That he prayed aloud in front of everyone","That he prayed once and briefly"]}]},"25:21.2":{"e":"Hashem was entreated, appeased, and persuaded by Yitzchak, meaning He responded to his pleading. Rashi adds that every use of the root 'atar' denotes pleading and abundance, as in 've'atar ananh haketoret', which means an abundance of rising smoke.","pe":"Yitzchok prayed to Adonoy across from his wife, for she was barren. Adonoy granted his prayer and his wife, Rivkah, conceived.","re":"[He] granted his prayer. [Meaning:] He [God] allowed Himself to be implored and to be placated and swayed by him. It is my opinion that wherever a form of the word עתר is used it means imploring and increasing. Similarly, “[וַעֲתַר] And a thick cloud of smoke,” [meaning] an increasing amount of ascending smoke. And similarly: [וְהַעְתַּרְתֶּם] “You increased your words against me.” And similarly: “Exorbitant are the kisses of the enemy,” meaning, they seem exorbitant and are burdensome, encreisement in Old French.","p":[{"q":"What does 'vaye'ater lo' mean when said about Hashem?","o":["He was entreated, appeased, and persuaded by Yitzchak","He answered Yitzchak immediately without any delay","He promised Yitzchak very many children"]},{"q":"What is the general meaning of the root 'atar' according to Rashi?","o":["Pleading and abundance","Quiet, whispered request","Standing for a long time in one place"]}]},"25:21.3":{"e":"Yitzchak stood in one corner and prayed, and Rivkah stood in the opposite corner and prayed.","pe":"Yitzchok prayed to Adonoy across from his wife, for she was barren. Adonoy granted his prayer and his wife, Rivkah, conceived.","re":"Across from his wife. He was standing in one corner and praying, while she was standing in the other corner and praying.","p":[{"q":"What does 'lenochach ishto' mean according to Rashi?","o":["Yitzchak and Rivkah each prayed in a corner, opposite each other","Yitzchak prayed on behalf of his wife without her knowing","Yitzchak prayed, while Rivkah stood beside him silently"]}]},"25:21.4":{"e":"Hashem responded to Yitzchak's prayer and not to Rivkah's, because the prayer of a righteous person who is the child of a righteous person is not like the prayer of a righteous person who is the child of a wicked person.","pe":"Yitzchok prayed to Adonoy across from his wife, for she was barren. Adonoy granted his prayer and his wife, Rivkah, conceived.","re":"[He] granted his prayer. “His” but not hers. For it is not comparable—the prayer of a righteous person, [who is] the child of a righteous person, to the prayer of a righteous person who is the child of an evil person. Therefore, “his” and not hers.","p":[{"q":"Why does it say 'vaye'ater lo' - for him and not for her?","o":["The prayer of a righteous person, child of a righteous person, is greater than that of a righteous person, child of a wicked person","Rivkah did not pray at all, only Yitzchak prayed","Yitzchak prayed for a longer time than Rivkah"]}]},"25:22.1":{"e":"The verse does not explain what the struggling was, and Rivkah said 'if so, why am I', so the verse calls for interpretation. Chazal expounded it from the language of running: when she passed the doors of the study hall of Shem and Ever, Yaakov ran and struggled to come out, and by an idolatry temple Eisav struggled to come out. Another explanation: the sons struggled and quarreled with each other over the inheritance of the two worlds.","pe":"The children clashed inside her, and [when this happened] she said, If this is so, why did I desire this? She [then] went to inquire of Adonoy.","re":"[They] clashed. You must [admit] that this verse asks for a Midrashic explanation, for it does not clarify what this struggle was, and it is written [regarding her exclaiming], “If this is so, why did I desire this?” Our Sages explain it [i.e., וַיִּתְרֹצֲצוּ] as having the meaning of רִיצָה [moving quickly]: When she would pass the doorways of Torah study of Sheim and Eiver, Yaakov would agitate and rush to come out. When she would pass doorways of idol-worshipers, Eisov would agitate to come out. Another explanation: They struggled with one another and argued over how the two worlds should be inherited.","p":[{"q":"Why does Rashi say that this verse 'says darsheini' (calls for interpretation)?","o":["The verse does not specify what the struggling was, and Rivkah said 'why am I'","The verse does not say which of the sons started the quarrel first","The verse does not say how long the struggling lasted in her womb"]},{"q":"According to the first midrash, what happened when Rivkah passed the study hall of Shem and Ever?","o":["Yaakov ran and struggled to come out","Eisav ran and struggled to come out","Both sons calmed down and became still"]}]},"25:22.2":{"e":"Rivkah said: if the pain of pregnancy is this great...","pe":"The children clashed inside her, and [when this happened] she said, If this is so, why did I desire this? She [then] went to inquire of Adonoy.","re":"She said, if this is so. [That] the pain of pregnancy is so great…","p":[{"q":"What do the words 'im ken' refer to in Rivkah's statement?","o":["If the pain of pregnancy is this great","If I will have two different sons","If I do not give birth at the proper time"]}]},"25:22.3":{"e":"Rivkah asked: if the pain is so great, why do I long and pray for pregnancy?","pe":"The children clashed inside her, and [when this happened] she said, If this is so, why did I desire this? She [then] went to inquire of Adonoy.","re":"Why did I desire this? Why did I long and pray to conceive?","p":[{"q":"What did Rivkah ask with the words 'lamah zeh anochi'?","o":["Why do I long and pray for pregnancy","Why was I specifically chosen to give birth to twins","Why am I different from other pregnant women"]}]},"25:22.4":{"e":"Rivkah went to the study hall of Shem.","pe":"The children clashed inside her, and [when this happened] she said, If this is so, why did I desire this? She [then] went to inquire of Adonoy.","re":"She went to inquire. To the house of study of Sheim.","p":[{"q":"Where did Rivkah go 'to inquire'?","o":["To the study hall of Shem","To the tent of Avraham, her husband's father","To Har HaMoriah, the place of the Akeidah"]}]},"25:22.5":{"e":"Rivkah asked that Hashem tell her what would be her end.","pe":"The children clashed inside her, and [when this happened] she said, If this is so, why did I desire this? She [then] went to inquire of Adonoy.","re":"To inquire of Adonoy. To tell her what would happen in the end.","p":[{"q":"What did Rivkah want to know when she went to inquire of Hashem?","o":["What would be her end","Whether the child in her womb was male or female","How she could ease the pain of the pregnancy"]}]},"25:23.1":{"e":"Hashem did not speak with Rivkah directly but through a messenger: the words were said to Shem by divine inspiration, and he told them to her.","pe":"Adonoy said to her, Two nations are in your womb, and two Kingdoms will separate from within you. One government will be mightier than the other, but the greater one will serve the smaller one.","re":"Adonoy said to her. Through an intermediary. Sheim was told through Divine inspiration whereupon, he told her.","p":[{"q":"How were Hashem's words conveyed to Rivkah?","o":["Through Shem, to whom they were said by divine inspiration","In a dream at night, as was said to Avimelech","Through an angel who appeared to her on the way"]}]},"25:23.2":{"e":"The word is written 'gayim', hinting at Antoninus and Rebbi, whose table never lacked radish or lettuce, neither in the summer nor in the rainy season.","pe":"Adonoy said to her, Two nations are in your womb, and two Kingdoms will separate from within you. One government will be mightier than the other, but the greater one will serve the smaller one.","re":"Two nations are in your womb. [גוֹיִם] is written as גיים. This refers to Antoninus and Rabbi whose tables never lacked radish or lettuce neither during summer nor during winter.","p":[{"q":"What does Rashi derive from the fact that it is written 'gayim'?","o":["A hint to Antoninus and Rebbi, whose table never lacked radish and lettuce","A hint that Yaakov and Eisav would be two separate nations","A hint that righteous converts would come from the descendants of Eisav"]}]},"25:23.3":{"e":"'Le'um' means kingdom: two kingdoms will come out of her womb.","pe":"Adonoy said to her, Two nations are in your womb, and two Kingdoms will separate from within you. One government will be mightier than the other, but the greater one will serve the smaller one.","re":"And two Kingdoms. The word לְאוֹם always means kingdom.","p":[{"q":"What does 'le'umim' mean according to Rashi?","o":["Kingdoms","Tribes","Languages"]}]},"25:23.4":{"e":"Already from the womb the sons will separate in their paths: this one to his wickedness and that one to his integrity.","pe":"Adonoy said to her, Two nations are in your womb, and two Kingdoms will separate from within you. One government will be mightier than the other, but the greater one will serve the smaller one.","re":"Will separate from within you. [I.e.,] already from the womb they are separated, one to his evil ways, and the other to his wholesomeness.","p":[{"q":"What does 'mime'ayich yipareidu' teach?","o":["Already from the womb they will separate, one to wickedness and one to integrity","When they grow up they will separate and live in different lands","At birth they will be forcefully separated from each other"]}]},"25:23.5":{"e":"The two nations will not be great at the same time: when one rises the other falls. So Tyre said 'emmale hacharvah' - Tyre was filled only from the destruction of Jerusalem.","pe":"Adonoy said to her, Two nations are in your womb, and two Kingdoms will separate from within you. One government will be mightier than the other, but the greater one will serve the smaller one.","re":"Will be mightier than the other [government]. They will not be equally great. When one rises the other falls. Similarly it is said: “I shall be filled by her that is destroyed,” [i.e.] Tyre was not filled [built up] but from Yerushalayim’s destruction.","p":[{"q":"What does 'ule'om mile'om ye'ematz' teach?","o":["They will not be equal in greatness - when one rises the other falls","They will both be strong together forever","Eisav will always be stronger than Yaakov"]}]},"25:24.1":{"e":"Regarding Rivkah it says 'vayimle'u yameha', but regarding Tamar it says 'vayehi be'eit lidtah', because her days were not completed - she gave birth after seven months.","pe":"When her days of pregnancy were completed, behold, there were twins in her womb.","re":"When her days were completed. Whereas, concerning Tamar it is written: “When the time came for her to give birth” because her [pregnancy] days were not completed for she gave birth to them after seven months.","p":[{"q":"Why does it not say 'vayimle'u yameha' regarding Tamar as it does regarding Rivkah?","o":["Tamar gave birth after seven months, so her days were not completed","Tamar gave birth in greater pain than Rivkah","Tamar did not pray for her pregnancy as Rivkah did"]}]},"25:24.2":{"e":"The word 'tomam' is written defectively, while regarding Tamar 'te'omim' is written fully, because both sons of Tamar were righteous, whereas here one was righteous and one wicked.","pe":"When her days of pregnancy were completed, behold, there were twins in her womb.","re":"Behold, there were twins. [תּוֹמִם is spelled with the letter א'] missing. Whereas concerning Tamar [it is spelled] תְּאוֹמִים —“full” [with the א'] because [there,] they [the twins] were both righteous, whereas, here, one was righteous and the other evil.","p":[{"q":"Why is 'tomam' written defectively, while regarding Tamar 'te'omim' is written fully?","o":["Here one was righteous and one wicked, while both sons of Tamar were righteous","Here the twins were born on time, while Tamar gave birth after seven months","Here one of them was born weak and smaller than his brother"]}]},"25:25.1":{"e":"Eisav's red color was a sign that he would be a shedder of blood.","pe":"The first one came out with a reddish complexion, covered completely with what was like a hairy robe, and they named him Eisov.","re":"Reddish [complexion]. A sign that he will be a murderer.","p":[{"q":"What does Eisav being 'admoni' (ruddy) hint at?","o":["That he would be a shedder of blood","That he would be a man of the field and a hunter","That he would be wealthy and own much property"]}]},"25:25.2":{"e":"Eisav was full of hair, like a woolen cloak full of hair.","pe":"The first one came out with a reddish complexion, covered completely with what was like a hairy robe, and they named him Eisov.","re":"Covered completely with what was like a hairy robe. [Meaning] full of hair like a woolen garment which is full of hair. Flocheide, in Old French.","p":[{"q":"What does the verse compare Eisav to with the words 'ke'aderet se'ar'?","o":["A woolen cloak full of hair","A magnificent and precious royal mantle","The skin of a hairy goat"]}]},"25:25.3":{"e":"Everyone called him Eisav, because already at birth he was 'asui' (fully made) and complete in his hair, like a child of many years.","pe":"The first one came out with a reddish complexion, covered completely with what was like a hairy robe, and they named him Eisov.","re":"And they named him Eisov. Everyone called him so because he was made and developed with hair, as one who is much older.","p":[{"q":"Why was Eisav given this name?","o":["Because he was born fully formed in his hair, like one of many years","Because he did evil deeds already in his mother's womb","Because he was born entirely ruddy, the color of blood"]},{"q":"Who called Eisav by his name, according to Rashi?","o":["All people called him that","Only his father Yitzchak called him that","Hashem called him that"]}]},"25:26.1":{"e":"Yaakov was formed from the first drop and Eisav from the second. As with a narrow-mouthed tube, what enters first exits last, so Eisav came out first. Yaakov rightly held on to him in order to delay him, so that he would come out first and receive the birthright by law.","pe":"After that his brother came out, his hand grasping the heel of Eisov, and he [Yitzchok] named him Yaakov. Yitzchok was sixty years old when she [Rivkah] gave birth to them.","re":"After that his brother came out, etc. I heard an Aggadaic exposition that interprets [the verse] according to its plain meaning: He [Yaakov] rightfully held onto him to [attempt to] hold him [Eisov] back. [For] Yaakov was conceived from the first drop and Eisov from the second. Go and learn this from a narrow tube, insert two stones, one behind the other. The one inserted first will come out last and the one inserted last will come out first. Consequently, Eisov, who was conceived last came out first and Yaakov, who was conceived first came out last. Yaakov, thus, attempted to hold him back so that he [Yaakov] would be born first as he was the first conceived and be the first out of the womb so that he would rightfully gain his birthright.","p":[{"q":"According to the midrash Rashi brings, why did Yaakov hold Eisav's heel?","o":["To delay him and come out first, since Yaakov was formed first","To show that he was stronger than Eisav already in the womb","So that they would not be separated from each other at birth"]},{"q":"What does the parable of the tube with a short mouth teach?","o":["That what enters first comes out last, so Yaakov, formed first, came out last","That the bigger and stronger one always comes out first from the womb","That the twins were formed together and came out one after the other by chance"]}]},"25:26.2":{"e":"Holding the heel is a sign that Eisav would barely finish his kingdom before Yaakov would rise and take it from him.","pe":"After that his brother came out, his hand grasping the heel of Eisov, and he [Yitzchok] named him Yaakov. Yitzchok was sixty years old when she [Rivkah] gave birth to them.","re":"The heel of Eisov. A sign that this one [Eisov] will not yet have completed his dominion before the other one will rise up and take it from him.","p":[{"q":"What does Yaakov's hand holding specifically Eisav's heel hint at?","o":["That Eisav's kingdom would not be completed before Yaakov arose and took it from him","That Yaakov would be subjugated to Eisav until the end of all generations","That Eisav and Yaakov would reign together at the same time"]}]},"25:26.3":{"e":"Hashem called him Yaakov. According to another explanation, Yitzchak his father called him that because he held his brother's heel.","pe":"After that his brother came out, his hand grasping the heel of Eisov, and he [Yitzchok] named him Yaakov. Yitzchok was sixty years old when she [Rivkah] gave birth to them.","re":"And he named him Yaakov. God [called him by this name]. Another explanation: his father called him Yaakov on account of his holding the heel [עֵקֶב].","p":[{"q":"According to Rashi's first explanation, who called Yaakov by his name?","o":["Hashem called him Yaakov","His father Yitzchak called him Yaakov","His mother Rivkah called him Yaakov"]},{"q":"According to the 'davar acher' (another explanation) in Rashi, after what did his father call him Yaakov?","o":["Because he held his brother's heel at birth","Because he would later 'trip up' his brother and deceive him","Because he came out last, following his brother"]}]},"25:26.4":{"e":"Yitzchak waited ten years until Rivkah reached age thirteen and was fit for pregnancy, and another ten years, as his father did for Sarah. When she did not conceive, he understood she was barren and prayed for her. He did not want to marry a maidservant, because he had been sanctified on Har HaMoriah as an unblemished offering.","pe":"After that his brother came out, his hand grasping the heel of Eisov, and he [Yitzchok] named him Yaakov. Yitzchok was sixty years old when she [Rivkah] gave birth to them.","re":"Sixty years old. Ten years from when she was married until she became thirteen years old and capable of conceiving, and the following ten years he hoped and waited for her as his father did regarding Sarah. When she [still] did not become pregnant, he realized that she was barren and prayed for her. [But,] he refused to marry a hand-maid because he was sanctified at Mount Moriah to be a burnt-offering without blemish.","p":[{"q":"Why did twenty years pass before Yitzchak prayed for Rivkah?","o":["Ten until Rivkah was fit for pregnancy, and another ten like Avraham","Because twenty years is the time the Torah set for every woman","Because he waited for Rivkah to pray herself first and be answered"]},{"q":"Why did Yitzchak not marry a maidservant, as Avraham did?","o":["Because he was sanctified on Har HaMoriah as an unblemished offering","Because Rivkah did not agree to give him her maidservant","Because he saw that the maidservant caused trouble in Avraham's house"]}]},"25:27.1":{"e":"As long as they were small, the difference between them was not noticeable. When they reached age thirteen, Yaakov turned to the study halls and Eisav turned to idolatry.","pe":"The lads grew up. Eisov became a skilled trapper, a man of the field. Yaakov was a wholesome man, living in tents.","re":"The lads grew up—Eisov became. As long as they were little they were indistinguishable by their deeds and no one could know their exact character. Once they turned thirteen, one [Yaakov] went his way to houses of study and the other went his way to worshipping idols.","p":[{"q":"When did the difference between Yaakov and Eisav become apparent?","o":["When they reached age thirteen","Already on the day they were born","On the day their grandfather Avraham died"]}]},"25:27.2":{"e":"Eisav knew how to 'trap' his father with his speech: he asked questions such as how to tithe salt and straw, and Yitzchak thought he was scrupulous in mitzvos.","pe":"The lads grew up. Eisov became a skilled trapper, a man of the field. Yaakov was a wholesome man, living in tents.","re":"A skilled trapper. [I.e.,] how to entrap and deceive his father with his mouth, and he would ask him: “Father, how are salt and hay tithed?” His father would thereby think that he meticulously observes the mitzvos.","p":[{"q":"What does 'yodei'a tzayid' mean according to Rashi?","o":["He knew how to trap and deceive his father with his speech","He knew how to hunt animals and birds with his bow","He knew how to prepare delicacies from the game for his father"]},{"q":"What did Eisav want to achieve by asking 'how does one tithe salt and straw'?","o":["That his father would think he was scrupulous in mitzvos","To truly learn the laws of tithes","To challenge his father and embarrass him"]}]},"25:27.3":{"e":"As is plain: an idle man who hunts animals and birds with his bow.","pe":"The lads grew up. Eisov became a skilled trapper, a man of the field. Yaakov was a wholesome man, living in tents.","re":"A man of the field. Should be explained literally: A man with no occupation—who uses his bow to capture animals and birds.","p":[{"q":"What does 'ish sadeh' mean according to Rashi?","o":["An idle man who hunts animals and birds with his bow","A farmer who works his fields all day","A man who lives in the fields, far from the city"]}]},"25:27.4":{"e":"Yaakov was not skilled in all these deceptions; what was in his heart was in his mouth. One who is not sharp at deceiving is called 'tam'.","pe":"The lads grew up. Eisov became a skilled trapper, a man of the field. Yaakov was a wholesome man, living in tents.","re":"Wholesome. [Meaning:] one who is not an expert in all those [matters], as his heart is, so is his mouth. One who is not shrewd at deceiving is referred to as תָם.","p":[{"q":"What does 'tam' mean regarding Yaakov?","o":["One who is not sharp at deceiving, whose heart is like his mouth","One who understands nothing and does not know how to learn","One who is physically whole and has no blemish"]}]},"25:27.5":{"e":"'Ohalim' in the plural: the tent of Shem and the tent of Ever.","pe":"The lads grew up. Eisov became a skilled trapper, a man of the field. Yaakov was a wholesome man, living in tents.","re":"Living in tents. [Referring to:] the tent of Sheim and the tent of Eiver.","p":[{"q":"Which tents are the 'ohalim' in which Yaakov dwelled?","o":["The tent of Shem and the tent of Ever","The tent of Avraham and the tent of Yitzchak","His father's tent and his mother's tent"]}]},"25:28.1":{"e":"According to the Targum, the game was in Yitzchak's mouth, as he ate from it. According to the midrash, it was in Eisav's mouth, as he trapped his father and deceived him with his words.","pe":"Yitzchok loved Eisov because he ate of his trappings, but Rivkah loved Yaakov.","re":"He ate. [Lit. in his mouth.] As Onkelos translates it: In [or into] the mouth of Yitzchok. But, its Midrashic interpretation is: With the mouth of Eisov. I.e., he would entrap him and trick him with his words.","p":[{"q":"According to the Targum, in whose mouth was the game?","o":["In Yitzchak's mouth, who ate from the game","In Eisav's mouth, who deceived his father with his words","In Yaakov's mouth, who cooked the stew"]},{"q":"According to the midrash, what does 'ki tzayid befiv' mean?","o":["Eisav trapped his father and deceived him with his words","Yitzchak loved to eat delicacies from game","Eisav would tell his father about his hunts"]}]},"25:29.1":{"e":"'Vayazed' means he cooked, as Onkelos translated.","pe":"Yaakov was simmering a pottage when Eisov came in from the field, exhausted.","re":"Simmering. Has the meaning of cooking as Onkelos translates it.","p":[{"q":"What does the word 'vayazed' mean?","o":["Cooking: Yaakov cooked a stew","Malice: Yaakov did a wicked deed","Preparation: Yaakov prepared bread"]}]},"25:29.2":{"e":"Eisav was exhausted from murder, as in the verse 'ki ayefah nafshi laharagim'.","pe":"Yaakov was simmering a pottage when Eisov came in from the field, exhausted.","re":"[He was] exhausted. As a result of committing murder as it states: “For my soul is fatigued before the murderers.”","p":[{"q":"From what was Eisav exhausted, according to Rashi?","o":["From murder, as in 'ki ayefah nafshi laharagim'","From hunting animals and birds in the field all day","From work in the field and the heat of the sun"]}]},"25:30.1":{"e":"Eisav said: I will open my mouth and you pour a lot into it, as one force-feeds a camel.","pe":"Eisov said to Yaakov, Please give me a swallow of this red [pottage], for I am exhausted. He was therefore named Edom [Red].","re":"A swallow. [Meaning:] I will open my mouth and pour a lot into it, as we have learned in a Mishnah: “A camel may not be force-fed [on Shabbos] but food may be poured into him.”","p":[{"q":"What did Eisav request with the word 'hal'iteini'?","o":["That he would open his mouth and Yaakov would pour a lot into it","That Yaakov would let him taste a little of the stew","That Yaakov would sell him the stew for money"]}]},"25:30.2":{"e":"This refers to red lentils. On that day Avraham died, so that he would not see Eisav his grandson turn to a bad culture, and that would not be the good old age that Hashem promised him; therefore Hashem shortened five years of his life. Yaakov cooked lentils as a meal of consolation for a mourner, because they are round like a wheel, and mourning is a wheel that turns in the world.","pe":"Eisov said to Yaakov, Please give me a swallow of this red [pottage], for I am exhausted. He was therefore named Edom [Red].","re":"Of this red [pottage]. Red lentils. On that day Avraham died so that he would not see Eisov, his grandson, falling into bad ways, [for] this would not be “the good old age” that God had promised him. It is for this reason that God shortened his life by five years, for Yitzchok lived 180 years whereas, he [Avraham] 175. [Thus,] Yaakov cooked lentils as a first-meal for the mourner. Why [are] lentils [food for a mourner]? Because they are [round] as a wheel, for mourning is a wheel that revolves in the world. (Another reason: Just as lentils have no mouth [i.e., an opening] so, too, a mourner has no mouth, for it is prohibited for him to speak. It is for this reason that it is customary to feed eggs to a mourner for his first meal for they are round and have no “mouth.” So, too, a mourner has no “mouth” as is discussed in Mo’ed Koton: “A mourner—the first three days—may not respond to anyone’s greeting, and, certainly, may not initiate a greeting. From the third until the seventh [day] he may respond but may not greet, etc.—from an old text of Rashi).","p":[{"q":"Why did Hashem cut five years from Avraham's life?","o":["So that he would not see his grandson Eisav turn to a bad culture","Because he weakened from grief over the death of his wife Sarah","So that Yitzchak would inherit his place in good time"]},{"q":"Why is a mourner consoled specifically with lentils?","o":["Because they are round like a wheel, and mourning is a wheel that turns in the world","Because they are red, the color of blood and death","Because they are a simple, cheap food, fitting for a mourner"]}]},"25:31.1":{"e":"Just as the day is clear and certain, so sell me the birthright with a clear sale.","pe":"Yaakov said, As of this day, sell your birthright to me.","re":"As of this day, sell. As Onkelos translates it: “As this day,” i.e., as this day is absolutely clear, so sell it to me, as an absolutely sure sale.","p":[{"q":"What does 'ka'yom' mean in Yaakov's words?","o":["As the day is clear, so the sale shall be clear","Sell to me immediately, today, without delay","Sell to me as one sells on market day"]}]},"25:31.2":{"e":"At that time the sacrificial service was done by the firstborns, and Yaakov said that this wicked man is not fit to offer sacrifices to Hashem.","pe":"Yaakov said, As of this day, sell your birthright to me.","re":"Your birthright. Since the [sacrificial] service was performed by the firstborn, Yaakov thought, this evil person is not fit to perform [sacrificial] service to God.","p":[{"q":"Why did Yaakov want to buy the birthright?","o":["So that the wicked Eisav would not offer sacrifices before Hashem","To receive a double portion in his father's inheritance","So that he could rule over his brother in the future"]}]},"25:32.1":{"e":"Eisav asked what this service involves, and Yaakov told him that many warnings, punishments, and death penalties are connected to it, such as those who drink wine or have unkempt hair. Eisav said: if I will die because of it, what do I want with it? Also, the birthright is unstable, since the tribe of Levi will eventually take over the service.","pe":"Eisov said, Here I am going to die, what [good] is this birthright to me.","re":"Here I am going to die. ([I.e.,] the birthright is unstable and transient for the firstborn will not always perform the sacrifice service for the tribe of Levi will ultimately take it over. Furthermore,) said Eisov [to Yaakov]: “What is the nature of this Service?” He [Yaakov] responded: “There are many prohibitions, punishments, [even] punishments by death that are involved with it—as we learned [in the Mishnah,] ‘The following are punishable by death: [those performing the service] having drunk wine, or without a haircut.’” So he [Eisov] said, “I will eventually die as a result of it [my birthright]; if so, why should I desire it?”","p":[{"q":"What is the connection between 'I am going to die' and the birthright?","o":["Death penalties are connected to the firstborn's service, and Eisav feared dying because of it","Eisav was very hungry and thought he would die of hunger","Eisav thought he would die before his father and not inherit"]},{"q":"Why is the birthright 'wavering'?","o":["Because the tribe of Levi will eventually take the service from the firstborns","Because it belongs to Yaakov anyway, who was formed first","Because it has no money in it, so it is worth nothing"]}]},"25:34.1":{"e":"The verse testifies to Eisav's wickedness, that he despised the service of Hashem.","pe":"Yaakov then gave Eisov bread and a pottage of lentils. He [Eisov] ate and drank, got up and left. [Thus] Eisov scorned the birthright.","re":"Eisov scorned. Scripture testifies to his wickedness, that he was contemptuous of God’s Service.","p":[{"q":"What does the verse come to teach with the words 'vayiviz Eisav'?","o":["To testify to his wickedness, that he despised the service of Hashem","To tell that Eisav immediately regretted the sale","To teach that Yaakov deceived Eisav in the sale"]}]},"26:2.1":{"e":"Yitzchak was thinking of going down to Egypt, as his father had in the days of famine. Hashem told him not to go down, because he is an unblemished offering, and outside the Land is not fitting for him.","pe":"Adonoy appeared to him and said, Do not go down to Egypt. Settle in the land that I will make known to you.","re":"Do not go down to Egypt. Because he [Yitzchok] intended to go down to Egypt as his father had gone down during the days of the famine. He [God] said to him, “Do not go down to Egypt for you are a burnt-offering without blemish and being outside the [Holy] land does not befit you.”","p":[{"q":"Why did Hashem tell Yitzchak not to go down to Egypt?","o":["Because he is an unblemished offering, and outside the Land is not fitting for him","Because the Egyptians might take Rivkah from him","Because the famine in Egypt was worse than the famine in Canaan"]}]},"26:3.1":{"e":"'Ha'el' here means 'ha'eleh': these lands.","pe":"Stay temporarily in this land and I will be with you and bless you, for to you and your descendants I will give all these lands. I will [thus] keep the oath that I swore to Avraham, your father.","re":"These. [הָאֵל is] the same as הָאֵלֶּה [these].","p":[{"q":"What does the word 'ha'el' mean in the verse?","o":["Like 'ha'eleh': these lands","A name of Hashem: 'the Almighty'","An expression of an oath"]}]},"26:4.1":{"e":"A person will bless his son: 'may your offspring be like the offspring of Yitzchak'. This is the meaning of this expression throughout Scripture, and the source is 'becha yevarech Yisrael leimor yesimcha etc.' Likewise with a curse and an oath: people say 'may you be like so-and-so' or 'may I be like so-and-so'.","pe":"I will make your descendants [as numerous] as the stars of the heavens, and I will give your descendants all these lands. Through your descendants shall be blessed all the nations of the world.","re":"Through your descendants shall be blessed. [Meaning:] a man will say to his son, “May your children be like the children of Yitzchok.” This [phrase] has similar meaning in all Scripture. And the following [verse] is the archetype of all: “Through you shall [the People of] Israel bless, saying: ‘May Elohim make you [as Ephraim and Menasheh].’” We also find this concerning a curse: “And the woman shall be a curse” whereby one who curses his enemy says, “May you be like that particular woman.” Similarly: “May you leave your name as an oath to my chosen,” whereby one who takes an oath says, “May I be as that particular person if I did such and such.”","p":[{"q":"What does 'vehitbarchu bezar'acha' mean?","o":["A person will bless his son: may your offspring be like the offspring of Yitzchak","All the nations will receive blessing in the merit of Yitzchak's offspring","Yitzchak's offspring themselves will bless all the nations"]},{"q":"How, according to the same rule, is 'vehaytah ha'ishah le'alah' explained?","o":["One who curses his enemy says to him: may you be like so-and-so","The woman herself will curse everyone who harms her","The woman will swear an oath before the Kohen"]}]},"26:5.1":{"e":"Avraham listened to Hashem's voice when Hashem tested him.","pe":"[All this is] because Avraham listened to My voice, and minded My mandate, My commandments, My decrees and My teachings.","re":"Avraham listened to my voice. When I put him to the test.","p":[{"q":"When did 'Avraham listen to My voice', according to Rashi?","o":["When Hashem tested him","When he prayed before Hashem for the people of Sodom","When he accepted Sarah's words to send away Hagar"]}]},"26:5.2":{"e":"'Mishmarti' refers to decrees meant to distance a person from transgressing the Torah's prohibitions, such as secondary relations (sheniyot) and shevut prohibitions on Shabbos.","pe":"[All this is] because Avraham listened to My voice, and minded My mandate, My commandments, My decrees and My teachings.","re":"Minded My mandate. [Referring to] precautionary measures for the purpose of avoiding [transgressing] on prohibitions [set forth] in the Torah, such as [the prohibition to marry] “second-degree” relations and the Rabbinic prohibitions concerning Shabbos.","p":[{"q":"According to Rashi, what do the words 'vayishmor mishmarti' refer to?","o":["Decrees to distance from the Torah's prohibitions, such as sheniyot and shevut","Mitzvos that logic obligates, such as the prohibitions of theft and murder","Laws without a reason, such as the prohibition of pork and shatnez"]}]},"26:5.3":{"e":"'Mitzvotai' are commandments that even if they had not been written in the Torah would have been fitting to command, such as the prohibitions of theft and bloodshed.","pe":"[All this is] because Avraham listened to My voice, and minded My mandate, My commandments, My decrees and My teachings.","re":"My commandments. [Referring to] things that even if they were not written, would be fit to be included in the commandments, such as [the prohibitions against] robbing and killing.","p":[{"q":"Which mitzvos does Rashi include in the word 'mitzvotai'?","o":["Mitzvos that would have been fitting to command even if not written, such as theft and murder","Decrees meant to distance a person from the Torah's prohibitions","Laws that were transmitted orally to Moshe at Sinai"]}]},"26:5.4":{"e":"'Chukotai' are mitzvos without an apparent reason, such as the prohibitions of pork and shatnez, which the evil inclination and the nations of the world challenge; but they are the King's decree upon His servants.","pe":"[All this is] because Avraham listened to My voice, and minded My mandate, My commandments, My decrees and My teachings.","re":"My decrees. [Referring to] things that the evil inclination and the nations of the world argue against, such as [the prohibitions against] eating pork and wearing garments of wool and linen for which there [apparently] are no reasons, but are the edicts of the King and His decrees upon His subjects.","p":[{"q":"What characterizes the mitzvos called 'chukotai'?","o":["They have no apparent reason, and the evil inclination and the nations challenge them","Logic obligates them even if they had not been written in the Torah","They are decrees meant to distance from transgressing Torah prohibitions"]}]},"26:5.5":{"e":"The word 'vesorotai' comes to include also the Oral Torah - halachah leMoshe miSinai.","pe":"[All this is] because Avraham listened to My voice, and minded My mandate, My commandments, My decrees and My teachings.","re":"And My teachings. To include the Oral Law—laws given by God to Moshe at Sinai.","p":[{"q":"What does Rashi derive from the word 'vesorotai'?","o":["The Oral Torah, halachah leMoshe miSinai","The decrees the Sages enacted to distance from transgression","The seven Noahide mitzvos that everyone was commanded"]}]},"26:7.1":{"e":"'Vayish'alu... le'ishto' means they asked about his wife, as in 'imri li achi hu', which means 'say about me'.","pe":"The local men asked about his wife, and he said, She is my sister. He was afraid to say, [she is] my wife, lest the local men kill me for Rivkah, for she is so good looking.","re":"About his wife. [I.e.,] concerning his wife as in, “Say to me, ‘he is my brother.’”","p":[{"q":"What does 'vayish'alu anshei hamakom le'ishto' mean?","o":["They asked Yitzchak about his wife, who she was","They asked Rivkah herself who she was and where she came from","They asked Yitzchak to give them his wife"]}]},"26:8.2":{"e":"Avimelech saw Yitzchak and Rivkah in intimacy, and from this understood that they were husband and wife and not brother and sister.","pe":"Once, after [Yitzchok] had been there a long while, Avimelech, king of the Philistines, looked at the window, and he saw, and behold, Yitzchok was amusing himself with Rivkah, his wife.","re":"Avimelech looked. He saw him having marital relations.","p":[{"q":"What did Avimelech see, from which he understood that Rivkah was Yitzchak's wife?","o":["He saw Yitzchak with Rivkah in marital intimacy","He saw Yitzchak playing with Rivkah in jest","He heard Yitzchak call Rivkah 'my wife'"]}]},"26:10.1":{"e":"'Achad ha'am' means the unique one among the people, that is, the king - Avimelech himself.","pe":"Avimelech said, What have you done to us? One of the people could have easily slept with your wife, and you would have brought guilt upon us.","re":"One of the people. [Refers to] the one singled out amongst the people, meaning, the king.","p":[{"q":"Whom does Avimelech mean by saying 'achad ha'am'?","o":["The king, the unique one of the people, meaning himself","One of the common people, any person","One of the king's officers, such as Phichol the army commander"]}]},"26:10.2":{"e":"Avimelech says to Yitzchak: had someone already lain with her, you would have brought guilt upon us.","pe":"Avimelech said, What have you done to us? One of the people could have easily slept with your wife, and you would have brought guilt upon us.","re":"And you would have brought guilt upon us. [Meaning:] had he had relations, you already would have brought guilt upon us.","p":[{"q":"What does 'vehevetah aleinu asham' mean according to Rashi?","o":["Had someone already lain with her, you would have brought guilt upon us","You have already brought guilt upon us with the lie you told us","We must bring a guilt offering for what happened"]}]},"26:12.1":{"e":"Yitzchak succeeded in his sowing even though the land of Gerar is not as important as the Land of Israel itself, the land of the seven nations.","pe":"Yitzchok planted in that land, and in that year he reaped a hundred fold, for Adonoy had blessed him.","re":"In that land. Despite the fact that it [Gerar] is not as esteemed as Eretz Yisrael itself, i.e., the land of the Seven Nations.","p":[{"q":"What does the verse come to emphasize with the words 'ba'aretz hahi'?","o":["That he succeeded even though Gerar is not as important as the land of the seven nations","That Gerar was the most fertile land in the region","That no one had sown in that land before Yitzchak"]}]},"26:12.2":{"e":"Yitzchak succeeded even though that year was not a normal year but a year of famine.","pe":"Yitzchok planted in that land, and in that year he reaped a hundred fold, for Adonoy had blessed him.","re":"That year. Despite the fact that it [the year] was abnormal for it was a famine year.","p":[{"q":"What was special about 'that year' in which Yitzchak sowed?","o":["It was a year of famine, not a normal year","It was a Shemittah year, in which it is forbidden to sow","It was the first year of his arrival in Gerar"]}]},"26:12.3":{"e":"The verse mentions both the land and the year to teach that both were difficult, and yet Yitzchak succeeded.","pe":"Yitzchok planted in that land, and in that year he reaped a hundred fold, for Adonoy had blessed him.","re":"In that land, that year. Why are both [the land and the year] mentioned? To tell us that the earth was hard and that the year was a hard one.","p":[{"q":"Why does the verse mention both 'ba'aretz hahi' and 'bashanah hahi'?","o":["To teach that both the land was difficult and the year was difficult","To teach that the year was difficult but the land was good","To teach that he sowed every year in that same land"]}]},"26:12.4":{"e":"They estimated how much the field should yield, and it yielded a hundred times the estimate. Our Sages said that the estimate was made for the purpose of separating tithes.","pe":"Yitzchok planted in that land, and in that year he reaped a hundred fold, for Adonoy had blessed him.","re":"A hundred fold. For they had estimated the amount it ought to produce and for every one estimated, it produced one hundred. Our Sages said, the purpose of this estimate was for tithing.","p":[{"q":"What does 'vayimtza... me'ah she'arim' mean?","o":["The field yielded a hundred times what they estimated it should yield","Yitzchak harvested exactly a hundred se'ah from each field","The grain was sold at the hundred gates of the city of Gerar"]},{"q":"According to our Sages, for what purpose did they estimate the crop?","o":["In order to separate tithes from it","In order to sell it to the Philistines","In order to pay tax from it to Avimelech"]}]},"26:13.1":{"e":"Yitzchak became so wealthy that people said: better the dung of Yitzchak's mules than the silver and gold of Avimelech.","pe":"The man prospered. He continued to prosper until he became very great.","re":"He became very great. So that people would say: “[Rather] the dung of Yitzchok’s mules than the silver and gold of Avimelech.”","p":[{"q":"How great did Yitzchak become, according to Rashi?","o":["They said: the dung of Yitzchak's mules rather than the silver and gold of Avimelech","They said his wealth was greater than the wealth of all the kings of Canaan together","Avimelech appointed him a minister over the entire land of the Philistines"]}]},"26:14.1":{"e":"'Avudah rabbah' means many businesses and works (in Old French 'oberina'). 'Avodah' implies a single task, whereas 'avudah' implies many tasks.","pe":"He owned flocks of sheep, herds of cattle, and many slaves, and the Philistines were jealous of him.","re":"And many slaves. [Meaning:] a great deal of work [or production], ovreine in Old French. עֲבוֹדָה denotes one particular labor [whereas] עֲבֻדָּה denotes a great deal of production.","p":[{"q":"What is the difference between 'avodah' and 'avudah' according to Rashi?","o":["'Avodah' is a single task, and 'avudah' is many tasks","'Avodah' is hard work, and 'avudah' is easy work","'Avodah' is service of Hashem, and 'avudah' is work of the field"]}]},"26:15.1":{"e":"The Philistines stopped up the wells because they feared they would be a stumbling block for them, as invading armies would come because of them. Onkelos translates 'timunun', which means stopping up, like 'mitamtem es halev' in the language of the Talmud.","pe":"All the wells that his father’s servants had dug in the days of his father, Avraham—the Philistines plugged them, and filled them with earth.","re":"The Philistines plugged them. Because they said, “They are a danger to us because they will [provoke] armies to come upon us.” [Onkelos renders it:] טַמּוֹנוּן פְּלִשְׁתָּאֵי meaning stopping up. [We find the] expression in the Talmud “Stops up the heart.”","p":[{"q":"Why did the Philistines stop up the wells?","o":["They said they were a stumbling block for them because of the armies that might come upon them","They were jealous of Yitzchak and wanted him to have no water for his flocks","They wanted to erase the name of Avraham from the land"]},{"q":"What is the meaning of the word 'timunun', with which Onkelos translates 'sitmum'?","o":["An expression of stopping up, like 'mitamtem es halev'","An expression of burying, like hiding treasure in the ground","An expression of impurity, as they made the well water impure"]}]},"26:17.1":{"e":"Yitzchak camped in the valley of Gerar, a place far from the city.","pe":"Yitzchok went away from there. He camped in the valley of Gerar and settled there.","re":"In the valley of Gerar. Far away from the city.","p":[{"q":"Where did Yitzchak camp when it says 'vayichan benachal Gerar'?","o":["In a place far from the city of Gerar","Inside the city of Gerar, near the king's house","In Be'er Sheva, on the border of the land of the Philistines"]}]},"26:18.1":{"e":"The wells that were dug in the days of Avraham, and that the Philistines stopped up before Yitzchak left Gerar, Yitzchak dug again.","pe":"Yitzchok returned and excavated the wells of water which were dug in the days of his father, Avraham, and were plugged by the Philistines after Avraham’s death. He gave them the same names that his father had given them.","re":"Returned, excavated. [Meaning:] those wells that they had dug in the days of his father Avraham and which the Philistines had stopped up, before Yitzchok departed from Gerar he again dug them.","p":[{"q":"What does 'vayashov Yitzchak vayachpor es be'erot hamayim' mean?","o":["He went back and dug again Avraham's wells that the Philistines had stopped up","He stayed in that place and dug entirely new wells there","He returned to the city of Gerar to dig wells for Avimelech"]}]},"26:20.1":{"e":"'Eisek' means a dispute - a quarrel over ownership of the well.","pe":"The shepherds of Gerar argued with the shepherds of Yitzchok, saying, the water is ours. He named the well Eisek [Quarrel], because they had quarreled with him.","re":"Eisek. [Meaning] dispute.","p":[{"q":"What does the name 'Eisek' that Yitzchak gave the well mean?","o":["A dispute and quarrel over the well","Robbery and oppression by force","Business and great toil in digging"]}]},"26:20.2":{"e":"The herdsmen of Gerar contended with Yitzchak over the well with quarrel and dispute.","pe":"The shepherds of Gerar argued with the shepherds of Yitzchok, saying, the water is ours. He named the well Eisek [Quarrel], because they had quarreled with him.","re":"Because they had quarreled with him. They disputed with him over it with strife and contention.","p":[{"q":"What does 'ki hit'ashku imo' mean?","o":["They contended with him over the well with quarrel and dispute","They robbed him and took the well from him by force","They helped him dig the well and worked on it with him"]}]},"26:21.1":{"e":"'Sitnah' means harm and interference, in Old French 'nosiment'.","pe":"They dug another well and they also argued about it. He named the well Sitnah [Obstruction].","re":"Sitnah. Nuisement [in Old French] [obstacle].","p":[{"q":"What does the name 'Sitnah' mean according to Rashi?","o":["Harm and interference (in Old French 'nosiment')","Deep hatred and enmity between the herdsmen","Accusation and informing before the king"]}]},"26:22.1":{"e":"'U'farinu ba'aretz' means as Onkelos's translation 'venifush be'ar'a' - and we shall multiply in the land.","pe":"He moved away from there and he dug another well, and there was no argument over it. He named it Rechovos [Wide Spaces], and said, For now Adonoy has made room for us, and we shall be fruitful in the land.","re":"And we shall be fruitful in the land. As Onkelos translates it: “And we will increase in the land.”","p":[{"q":"What does 'u'farinu ba'aretz' mean according to the Targum that Rashi brings?","o":["And we shall multiply and increase in the land","And we shall grow many fruits in the land","And we shall scatter to all corners of the land"]}]},"26:26.1":{"e":"As the Targum says, 'vesi'at merachamohi' - a group from among his friends. Some explained 'mei'reihu' as from the word 'mere'im' with 'achuzzat' in the construct form - 'a group of his friends', but it is not proper to say this about a king, as it implies that he had only one group of friends. And the tav of 'achuzzat' is no proof of a construct form, since there are parallels such as 'ezrat mitzar' and 'shichrat velo miyayin'.","pe":"Avimelech came to Yitzchok from Gerar along with a group of friends and Pichol, his general.","re":"Along with a group of his friends. As Onkelos translates it וְסִיעַת מֵרַחֲמוֹהִי meaning: a group [formed] from his friends. There are some who explain מֵרֵעֵהוּ the letter מ' being part of the root of the word as in: שְׁלשִׁים מֵרֵעִים, “thirty friends” of Shimshon, so that the word וַאֲחֻזַּת be in the construct state. However, it would be improper to speak of a king in this manner “his group of friends” because this would imply that he brought along his entire group of friends and that he had only one group of friends. It is therefore preferable to explain it in the first way. You need not wonder about the letter תי\"ו of the word אֲחֻזַּת; though the word is not in the construct state we [nevertheless] find similar cases in Scripture: עֶזְרָת מִצָּר —“Help against the oppressor,” וּשְׁכֻרַת וְלֹא מִיָּיִן —“Drunk, but not from wine.”","p":[{"q":"According to the explanation Rashi accepts, what does 'va'achuzzat mei'reihu' mean?","o":["A group from among his friends - the mem means 'from'","The entire group of his friends - the mem is part of the root of the word","The estate and inheritance of Avimelech's friend"]},{"q":"Why does Rashi reject the explanation 'a group of his friends', where the mem is part of the root?","o":["It is not proper to say about a king that he had only one group of friends","Because the word 'mere'im' does not appear anywhere else in Scripture","Because Avimelech had no friends at all, only servants"]}]},"26:26.2":{"e":"'Achuzzat' is a group and association of people, so called because they are held together.","pe":"Avimelech came to Yitzchok from Gerar along with a group of friends and Pichol, his general.","re":"A group. Has the meaning of a gathering or group who are נֶאֻחָזִין יַחַד —held together.","p":[{"q":"What does the word 'achuzzat' mean in the verse?","o":["A group and association of people held together","An estate and landholding of the king","Seizure by force, an expression of captivity and imprisonment"]}]},"26:28.1":{"e":"The double expression 'ra'o ra'inu' teaches two observations: we saw that Hashem was with your father Avraham, and we see that He is with you.","pe":"They said, We have indeed seen that Adonoy is with you, and we said, Let there now be an oath between us, between ourselves and you, and let us make a covenant with you;","re":"We have indeed seen. [Meaning:] “We saw it concerning your father, and we saw it concerning yourself.”","p":[{"q":"Why is it said in the double form 'ra'o ra'inu'?","o":["We saw that Hashem was with your father, and we see that He is also with you","We saw with our own eyes, and we also heard it from others","We saw when we expelled you, and we saw again when you returned to Gerar"]}]},"26:28.2":{"e":"The oath that existed between the people of Gerar and Avraham from his days - Avimelech asks that it remain in effect now as well between them and Yitzchak.","pe":"They said, We have indeed seen that Adonoy is with you, and we said, Let there now be an oath between us, between ourselves and you, and let us make a covenant with you;","re":"Let there now be an oath between us. [Meaning:] that oath that exists between us since your father’s times should now continue between us and yourself.","p":[{"q":"Which 'alah' does Avimelech mean by saying 'tehi na alah beineinu'?","o":["The oath that existed with Avraham, that it should also stand with Yitzchak","An entirely new oath that did not exist between them before","A curse that would fall on whoever breaks the covenant between them"]}]},"26:29.1":{"e":"Avimelech says that even when they told Yitzchak 'go away from us' and sent him out of their land, they did not harm him.","pe":"that you will do us no harm, just as we did not touch you. We did nothing but good to you, and sent you away in peace. You are now the blessed one of Adonoy.","re":"We did not touch you. When we said to you, “Leave us.”","p":[{"q":"When, according to Avimelech, did 'lo nega'enucha' apply?","o":["When they told Yitzchak 'go away from us' and sent him out of their land","When they stopped up the wells that Avraham's servants had dug","When the herdsmen of Gerar quarreled with Yitzchak's herdsmen over the water"]}]},"26:29.2":{"e":"'Atah' continues the request: just as we did not harm you and did only good with you, you too should do so with us.","pe":"that you will do us no harm, just as we did not touch you. We did nothing but good to you, and sent you away in peace. You are now the blessed one of Adonoy.","re":"You. You, also, do with us likewise.","p":[{"q":"What does the word 'atah' mean in Avimelech's words to Yitzchak?","o":["You too do for us as we did for you","You alone are blessed by Hashem, and not your household","You must come to us in Gerar to make a covenant"]}]},"26:33.1":{"e":"Yitzchak called the well 'Shiv'ah' after the covenant and the oath that he and Avimelech swore to each other.","pe":"He named it Shiva. Therefore the city is called Beer Sheva until this very day.","re":"Shiva. so called because of the covenant.","p":[{"q":"After what did Yitzchak call the well 'Shiv'ah'?","o":["After the covenant and oath he made with Avimelech","After the seven sheep that Avraham gave Avimelech","After the seven wells that Yitzchak's servants dug"]}]},"26:34.1":{"e":"Eisav is compared to a pig, which when it lies down stretches out its hooves as if to say 'see that I am kosher'; so too these people rob and plunder and present themselves as righteous. For forty years Eisav hunted women from under their husbands and tormented them, and when he was forty he said: my father married at forty, so will I.","pe":"Eisov was forty years old and he married Yehudis, the daughter of Be’eri, the Chittite and Bosmas, the daughter of Eylon the Chittite.","re":"Forty years old. Eisov is compared to a pig as it is said: “The boar of the forest ravages it.” When the pig lies down it stretches out its hooves as if to say, “See, I am a clean animal.” So, too, these, the descendants of Eisov, rob and extort and make pretensions of being honorable. For [the first] forty years Eisov would kidnap wives from their husbands and take them forcibly; when he turned forty he said, “Father was forty when he married and I will do likewise.”","p":[{"q":"Why does the Torah note that Eisav married at age forty?","o":["To present himself as righteous, like his father who married at forty","Because until then he was busy hunting and not free to marry","Because Yitzchak commanded him not to marry before then"]},{"q":"How is Eisav similar to a pig?","o":["The pig shows its hooves as if it were pure, and Eisav presents himself as righteous","The pig eats everything, and Eisav was gluttonous and ate indiscriminately","The pig lives in the forest, and Eisav was a man of the field who knew hunting"]}]},"26:35.1":{"e":"'Morat ruach' is an expression of rebellion and defiance, as in 'mamrim heitem': all the deeds of Eisav's wives were meant to anger and distress.","pe":"They were rebellious of spirit to Yitzchok and Rivkah.","re":"Rebellious of spirit. An expression meaning: a spirit of rebellion, as in: “[מַמְרִים] You were rebellious.” All their deeds were to anger and cause grief to Yitzchok and to Rivkah because they worshiped idols.","p":[{"q":"From what root is the word 'morat' according to Rashi?","o":["From rebellion and defiance, as in 'mamrim heitem'","From bitterness, as in bitter water","From appearance, as in the appearance of the eyes"]}]},"26:35.2":{"e":"Eisav's wives worshipped idols, and therefore they were a source of bitterness to Yitzchak and Rivkah.","pe":"They were rebellious of spirit to Yitzchok and Rivkah.","re":"","p":[{"q":"Why were Eisav's wives 'morat ruach to Yitzchak and to Rivkah'?","o":["Because they worshipped idols","Because they did not want to live in Yitzchak and Rivkah's house","Because they spoke insolently to Yitzchak and Rivkah"]}]},"27:1.1":{"e":"Three reasons for the dimming of Yitzchak's eyes: from the smoke of the incense that Eisav's wives burned to idols; from the tears of the ministering angels who cried at the Akeidah and fell into his eyes; and so that Yaakov would receive the blessings.","pe":"And when Yitzchok grew old his eyesight faded and he could not see. He called Eisov, his elder son, and said to him, My son. [Eisov] said to him, Here I am.","re":"His eyesight faded. Because of the smoke of these [women] who would burn incense for idol worship. Another explanation: When he was bound on the altar and his father intended to slaughter him, at that moment the heavens opened and the ministering angels saw and cried. Their tears descended and fell upon his eyes. As a result his eyesight dimmed. Another explanation: To enable Yaakov to receive the blessings.","p":[{"q":"According to Rashi's first explanation, from what did Yitzchak's eyes grow dim?","o":["From the smoke of the idolatry of Eisav's wives","From extreme old age and bodily weakness","From much weeping over the suffering of his sons"]},{"q":"What happened at the Akeidah that caused Yitzchak's eyes to grow dim?","o":["The tears of the ministering angels fell into his eyes","A great light from heaven blinded his eyes","The smoke of the wood on the altar entered his eyes"]}]},"27:2.1":{"e":"A person who reaches the age at which his parents died should worry for five years before it and five years after. Yitzchak was 123, less than five years from the age at which his mother died (127), so he did not know whether he would die at his mother's age or his father's age.","pe":"[Yitzchok] said, Behold, if you please, I am old. I do not know the day of my death.","re":"I do not know the day of my death. R. Yehoshua b. Korcho said, when a person nears the age [of the death] of his parents, he should be concerned five years before and five afterwards. Yitzchok was [now] one hundred and twenty-three and he said, “Perhaps I will reach my mother’s age and she died at one hundred and twenty-seven and I am thus within five years of her age. Therefore, “I do not know the day of my death—” perhaps at the age of my mother, perhaps at the age of my father.","p":[{"q":"Why did Yitzchak worry about his death when he was 123?","o":["Because he was approaching the age at which his mother died, 127","Because he had reached the age at which his father Avraham died","Because he became ill and felt his strength declining"]}]},"27:3.1":{"e":"'Se' is an expression of sharpening, as in the Mishnah 'meshi'ah al gabei chavertah'. Yitzchak told Eisav: sharpen your knife and slaughter properly, so that you do not feed me an unslaughtered carcass.","pe":"Now [therefore] please take your equipment, your sword and your bow, and go out to the field and trap [deer] for me.","re":"Please take. [שָׂא] is a term meaning sharpen as we have learned [in the Mishnah]: A knife may not be sharpened [on a sharpening stone] but, [מַשִּׂיאָהּ] may be passed over another knife. [Yitzchok said,] “Sharpen your knife and slaughter [the animal] properly so that you will not feed me נְבֵלָה.","p":[{"q":"What does 'se na kelecha' mean?","o":["Sharpen your knife","Lift up your hunting tools","Take your tools from the house"]},{"q":"Why did Yitzchak insist that Eisav sharpen his knife?","o":["So that he would slaughter properly and not feed him a neveilah","So that he could hunt large and strong animals","So that he could prepare the delicacies quickly"]}]},"27:3.2":{"e":"'Teli'cha' is the sword, which is customarily hung at one's side.","pe":"Now [therefore] please take your equipment, your sword and your bow, and go out to the field and trap [deer] for me.","re":"Your sword. [Meaning] your sword [so called] because it is usually hung [תְּלוּיָה].","p":[{"q":"What is 'teli'cha', and why is it called that?","o":["Eisav's sword, which is customarily hung","The quiver of arrows, which is hung on the shoulder","The net in which captured game is hung"]}]},"27:3.3":{"e":"Yitzchak asked that Eisav hunt from ownerless game and not bring stolen meat.","pe":"Now [therefore] please take your equipment, your sword and your bow, and go out to the field and trap [deer] for me.","re":"And trap for me. From [animals that are] ownerless and not from that which was robbed.","p":[{"q":"What did Yitzchak want to emphasize by saying 'utzudah li'?","o":["That he should hunt from ownerless game and not from stolen goods","That he should hunt only for him and not for others","That he should hunt himself and not send his servants"]}]},"27:5.1":{"e":"The word 'to bring' seems superfluous, and teaches that Eisav intended: if he does not find game, he will bring from stolen goods.","pe":"Rivkah had [over]heard what Yitzchok said to his son, Eisov. Eisov went out to the field to trap [deer] to bring it [home.]","re":"To trap [deer] to bring it [home]. What is the intent of the word לְהָבִיא? [He intended] that if he will not find [meat] from the hunt he will bring [meat] acquired through robbery.","p":[{"q":"What does the word 'lehavi' after 'latzud tzayid' teach?","o":["That if he did not find game, he would bring from stolen goods","That he hurried to bring the game before his father's death","That he intended to bring the game himself and not through another"]}]},"27:7.1":{"e":"'Lifnei Hashem' means with Hashem's permission, that Hashem would agree to the blessing that Yitzchak gives.","pe":"Bring back [deer] for me and make it into a tasty dish for me and I will eat. I will then bless you in the presence of Adonoy before I die.","re":"In the presence of Adonoy. [Meaning:] with His consent—that He should approve of what I do.","p":[{"q":"What does 'va'avarechecha lifnei Hashem' mean?","o":["With Hashem's permission, that He would agree to the blessing I give","In a holy place, before the altar","In prayer that Hashem bless you in my place"]}]},"27:9.1":{"e":"'Li' means 'mine'. The kids were Rivkah's and not stolen, since Yitzchak wrote in her ketubah that she would take two kids of goats every day.","pe":"Go, please, to the sheep and take for me from there two choice young goats, and I will make [from] them a tasty dish for your father as he likes.","re":"And take for me. לִי means “from that which belongs to me” and are not stolen property, because Yitzchok wrote this provision into her marriage contract, that each day she may take two kids from the goats.","p":[{"q":"Why did Rivkah say 'vekach li'?","o":["Because the kids were hers according to her ketubah, and not stolen","Because she wanted to prepare the delicacies herself","Because she feared Yaakov would take from the flock without permission"]}]},"27:9.2":{"e":"Was it Yitzchak's way to eat two kids in one meal? Rather, it was Pesach: one he offered as his Pesach offering, and from the other he made delicacies.","pe":"Go, please, to the sheep and take for me from there two choice young goats, and I will make [from] them a tasty dish for your father as he likes.","re":"Two choice young goats. Did two kids make up Yitzchok’s meal? But, [the explanation is that] it was Pesach. One [kid] he brought as his Paschal offering and one he prepared as delicious food. [This explanation is] in Pirkei d’R. Eliezer.","p":[{"q":"Why were two kids of goats needed?","o":["One for the Pesach offering, and one for the delicacies","One for Yitzchak, and one for Yaakov to eat with him","So that the skins of both could be placed on Yaakov"]}]},"27:9.3":{"e":"Rivkah could prepare delicacies from kids 'as he loved', because the taste of kid is like the taste of venison.","pe":"Go, please, to the sheep and take for me from there two choice young goats, and I will make [from] them a tasty dish for your father as he likes.","re":"As he likes. For the taste of a kid is similar to the taste of deer.","p":[{"q":"How could Rivkah prepare delicacies from kids 'as he loved'?","o":["Because the taste of kid is similar to the taste of venison","Because Yitzchak loved kids more than game meat","Because special spices hid the taste of the kid"]}]},"27:11.1":{"e":"'Ish sa'ir' means a man of hair, with much hair on his body.","pe":"Yaakov said to Rivkah, his mother, Behold, Eisov, my brother is a hairy person and I am a smooth-skinned person.","re":"A hairy person. [Meaning] hirsute.","p":[{"q":"What does 'ish sa'ir' mean?","o":["A man with much hair on his body","A man who sits at the city gate","A man who comes from the land of Seir"]}]},"27:12.1":{"e":"'Yemushheni' is from the language of feeling, as in 'memashesh batzohorayim' - Yaakov feared that his father would feel him with his hands.","pe":"Suppose my father touches me. I will be in his eyes as an impostor. I will bring upon myself a curse—not a blessing.","re":"Touches me. [יִמֻשֵּׁנִי is] similar to מְמַשֵּׁשׁ בַּצָּהֳרַיִם .","p":[{"q":"What does 'yemushsheni' mean?","o":["He will feel me with his hands, as in 'memashesh batzohorayim'","He will pull me toward him by force","He will test me with questions and discover who I am"]}]},"27:15.1":{"e":"'Hachamudot' are the clean garments, as Onkelos translates 'dakhita'. Another explanation: they were so called because Eisav coveted them from Nimrod.","pe":"Rivkah took the garments of Eisov, her elder son, [the garments] that were precious [to him] that were in her keeping in the house, and put them on Yaakov, her younger son.","re":"Precious. [Meaning:] the clean ones, as Onkelos translates it: דָּכְיָתָא [clean ones]. Another explanation: The ones he coveted [שֶׁחָמַד] from Nimrod.","p":[{"q":"According to Rashi's first explanation, what are Eisav's garments called 'hachamudot'?","o":["The clean garments, as the Targum translates 'dakhita'","The new garments that he had never worn","The special garments for hunting in the field"]},{"q":"According to the second explanation, why were the garments called 'hachamudot'?","o":["Because Eisav coveted them from Nimrod","Because Yitzchak coveted them and gave them to Eisav","Because they were studded with gold and precious stones"]}]},"27:15.2":{"e":"Eisav had several wives, and yet he depos
