<!doctype html>

<style>[hidden]{display:none!important}img{max-width:100%}.hint a.fb{color:var(--accent);font-weight:600;font-size:1.15em}
.cite{direction:rtl;font-size:14px;margin-bottom:-4px;color:var(--muted);line-height:1.4}
.cite b{color:var(--ink);font-weight:600}
.cite a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.cite a:hover{text-decoration:underline}
.quote .dhw{font-weight:700}
.quote .qw{text-decoration:underline dotted;text-underline-offset:4px}
.quote .kp{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 2px}
.quote .src{display:block;direction:rtl;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-top:4px}
.quote .src a{color:var(--accent);font-weight:600;text-decoration:none}

.quote{direction:rtl;text-align:right;font-family:var(--f-rashi);font-size:max(19px,calc(var(--s,1)*16px));line-height:1.55;background:var(--bg);border-radius:10px;padding:8px 12px;flex:1 1 0;min-height:24vh;overflow:auto}

<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-soft:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100dvh;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:4px;height:100%}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.top{display:contents}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
h1 span{display:none}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.count b{color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:none}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-heb);font-size:22px;line-height:1.7;letter-spacing:.03em;word-spacing:.08em;direction:rtl;text-align:right}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{display:none}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:6px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:8px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:18px;line-height:1.45;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:center;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-body);font-size:17px;line-height:1.4;width:100%;direction:rtl}
.opt .k{flex:none;font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-soft)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.row{display:flex;flex-direction:column;gap:2px}
.row .t{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);direction:rtl}
.row p{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--accent);font-size:18px;font-weight:600;display:inline-block;padding:5px 16px;border:1.5px solid var(--accent);border-radius:9px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:14px;line-height:1.6;direction:rtl;text-align:right}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface);font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line);font-size:14px}
.hint{font-size:14px;color:var(--muted);text-align:center;flex-shrink:0}
.verdict{font-weight:600;font-size:16px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:20px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* taamim: Frank Ruhl lacks cantillation glyphs, so those letters fell back to another font */
.pasuk{font-family:var(--f-heb)}
/* pasuk panel: visually separate the verse from the question */
.pasuk{background:var(--accent-soft);border-inline-start:5px solid var(--accent);border-radius:10px;padding:calc(var(--s,1)*6px) calc(var(--s,1)*12px)}
.point{border-top:1px solid var(--line);padding-top:calc(var(--s,1)*8px)}
/* fit layout: only pasuk + question + options in the card; fine print lives in the footer */
.wrap{max-width:min(1500px,100%)}
header .top,.tools,.ref,.dh{display:none}
.card{gap:calc(var(--s,1)*8px)}
.pasuk{font-size:calc(var(--s,1)*22px)}
.q{font-size:calc(var(--s,1)*18px)}
.opt{font-size:calc(var(--s,1)*17px);padding:calc(var(--s,1)*7px) calc(var(--s,1)*10px)}
.opt .k{width:calc(var(--s,1)*20px);height:calc(var(--s,1)*20px);font-size:calc(var(--s,1)*11px)}
.row p{font-size:25px;line-height:1.35}
.verdict{font-size:26px;font-weight:700}
.row .t{font-size:16px}
.point{gap:calc(var(--s,1)*10px)}
.card{position:relative}
.reveal{position:absolute;inset-inline:12px;bottom:56px;z-index:3;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.nav .btn{padding:4px 12px;font-size:13px}
@media (max-width:460px){.pasuk{font-size:calc(var(--s,1)*22px)}}
.hint{font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}

/* wide screens: split layout (pasuk | question+answers), fonts auto-fit each side */
@media (min-width:900px){
.wrap{max-width:min(1800px,100%)}
.card{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr) auto auto;column-gap:22px;row-gap:8px;overflow:hidden}
.card>.pasuk{grid-column:1;grid-row:1;overflow:hidden;align-self:stretch;font-size:calc(var(--sp,1)*22px);padding:calc(var(--sp,1)*10px) calc(var(--sp,1)*14px)}
.card>.point{position:relative;grid-column:2;grid-row:1;min-height:0;overflow:hidden;border-top:0;padding-top:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--s,1)*12px)}
.card>details{grid-column:1/-1;grid-row:2}
.card>.nav{grid-column:1/-1;grid-row:3}
.reveal{position:absolute;inset:auto 0 0 0;z-index:3;max-height:none;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.row p{font-size:calc(var(--s,1)*18px);line-height:1.4}
.verdict{font-size:30px;font-weight:700}
.row .t{font-size:20px}
.q{font-size:calc(var(--s,1)*21px)}
.opt{font-size:calc(var(--s,1)*21px)}
}

/*EN*/
html[dir=ltr] .opt{direction:ltr;text-align:left}
html[dir=ltr] .q{direction:ltr;text-align:left}
html[dir=ltr] .pnum{direction:ltr}
.q .hb,.opt .hb{font-family:var(--f-heb);font-size:1.12em}
.pasuk .pen{direction:ltr;text-align:left;font-family:var(--f-body);font-size:17px;line-height:1.4;letter-spacing:0;word-spacing:0;margin-top:.6em;color:var(--muted)}
.quote .enx{direction:ltr;text-align:left;font-family:var(--f-body);font-size:.82em;line-height:1.4;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.quote .enx i{color:var(--muted)}
.quote .src{direction:ltr}
.hint .ghost{padding:3px 10px;font-size:14px}
.hint select{font-size:14px;padding:3px 5px}
#pa{display:none}
@media print{
  @page{margin:14mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}
  body>*:not(#pa){display:none!important}
  #pa{display:block;font-family:var(--f-body);font-size:11.5pt;line-height:1.4;color:#000}
  #pa h1{font-size:18pt;margin:0 0 4pt}
  #pa .pr-meta{display:flex;justify-content:space-between;gap:16pt;border-bottom:1.5pt solid #000;padding:4pt 0 8pt;margin-bottom:10pt;font-size:11pt}
  #pa .pr-r{break-inside:avoid;margin:0 0 12pt;border-top:.75pt solid #999;padding-top:6pt}
  #pa .pr-ref{font-size:9.5pt;color:#444;margin-bottom:3pt}
  #pa .pr-pasuk{font-family:var(--f-heb);font-size:15pt;line-height:1.6;direction:rtl;text-align:right}
  #pa .pr-pasuk mark{background:#e8e8e8;color:#000;text-decoration:underline;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #pa .pr-pen{font-size:9.5pt;color:#333;margin:2pt 0 4pt}
  #pa .pr-q{margin:6pt 0 0}
  #pa .pr-qt{font-weight:600}
  #pa .pr-o{margin:1.5pt 0 0 14pt;display:flex;gap:6pt}
  #pa[dir=rtl] .pr-o{margin:1.5pt 14pt 0 0}
  #pa .pr-o b{flex:none}
  #pa .hb{font-family:var(--f-heb);font-size:1.12em}
  #pa .pr-key{break-before:page}
  #pa .pr-a{break-inside:avoid;margin:0 0 6pt;font-size:10.5pt}
  #pa .pr-ex{display:block;color:#444;font-size:9.5pt}
}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <h1>רש״י · תולדות <span>רש״י על תולדות</span></h1>

const DATA = [{"id": "25:19.1", "ch": 25, "v": 19, "n": 1, "dh": "ואלה תולדות יצחק", "pasuk_html": "<mark>וְאֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק</mark> בֶּן־אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת־יִצְחָֽק׃", "pasuk_en": "וְאֵלֶּה תּוֹלְדוֹת יִצְחָק בֶּן־אַבְרָהָם אַבְרָהָם הוֹלִיד אֶת־יִצְחָק׃", "rashi_he": "ואלה תולדות יצחק. יַעֲקֹב וְעֵשָׂו הָאֲמוּרִים בַּפָּרָשָׁה:", "rashi_en": "תולדות יצחק הם בניו יעקב ועשו, שעליהם מסופר בפרשה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מִי הֵם הַ'תּוֹלְדוֹת' שֶׁל יִצְחָק שֶׁהַפָּסוּק מְדַבֵּר עֲלֵיהֶם?", "options": ["יַעֲקֹב וְעֵשָׂו, שֶׁעֲלֵיהֶם מְסוֹפָּר בַּפָּרָשָׁה", "הַמְּאוֹרָעוֹת שֶׁעָבְרוּ עַל יִצְחָק בִּימֵי חַיָּיו", "כָּל צֶאֱצָאֵי יִצְחָק לְדוֹרוֹתֵיהֶם עַד מֹשֶׁה"], "kasha": "לא מפורש בפסוק מי הם התולדות שהכתוב מתכוון אליהם.", "answer": "תולדות יצחק הם יעקב ועשו, האמורים בפרשה.", "kp": ["יעקב ועשו האמורים בפרשה"]}]}, {"id": "25:19.2", "ch": 25, "v": 19, "n": 2, "dh": "אברהם הוליד את יצחק", "pasuk_html": "וְאֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן־אַבְרָהָ֑ם <mark>אַבְרָהָ֖ם הוֹלִ֥יד אֶת־יִצְחָֽק׃</mark>", "pasuk_en": "וְאֵלֶּה תּוֹלְדוֹת יִצְחָק בֶּן־אַבְרָהָם אַבְרָהָם הוֹלִיד אֶת־יִצְחָק׃", "rashi_he": "אברהם הוליד את יצחק. עַל יְדֵי שֶׁכָּתַב הַכָּתוּב יִצְחָק בֶּן אַבְרָהָם הֻזְקַק לוֹמַר אַבְרָהָם הוֹלִיד אֶת יִצְחָק; לְפִי שֶׁהָיוּ לֵיצָנֵי הַדּוֹר אוֹמְרִים מֵאֲבִימֶלֶךְ נִתְעַבְּרָה שָׂרָה, שֶׁהֲרֵי כַּמָּה שָׁנִים שָׁהֲתָה עִם אַבְרָהָם וְלֹא נִתְעַבְּרָה הֵימֶנּוּ; מֶה עָשָׂה הַקָּבָּ\"ה? צָר קְלַסְתֵּר פָּנָיו שֶׁל יִצְחָק דּוֹמֶה לְאַבְרָהָם, וְהֵעִידוּ הַכֹּל אַבְרָהָם הוֹלִיד אֶת יִצְחָק, וְזֶהוּ שֶׁכָּתוּב כָּאן יִצְחָק בֶּן אַבְרָהָם, שֶׁהֲרֵי עֵדוּת יֵשׁ שֶׁאַבְרָהָם הוֹלִיד אֶת יִצְחָק:", "rashi_en": "ליצני הדור אמרו ששרה נתעברה מאבימלך, כי שהתה שנים רבות עם אברהם ולא נתעברה ממנו. הקב״ה עשה את פני יצחק דומים לפני אברהם, וכולם העידו שאברהם הוליד את יצחק; לכן הכתוב מדגיש זאת.", "note": "", "points": [{"q": "מַדּוּעַ הוּצְרַךְ הַכָּתוּב לוֹמַר 'אַבְרָהָם הוֹלִיד אֶת־יִצְחָק' אַחֲרֵי שֶׁכְּבָר אָמַר 'יִצְחָק בֶּן־אַב דן ארם' כמו 'שדה ארם', שבלשון ישמעאל קוראים לשדה פדן.", "kp": ["כמו שדה ארם", "שבלשון ישמעאל קורין לשדה פדן"]}]}, {"id": "25:21.1", "ch": 25, "v": 21, "n": 1, "dh": "ויעתר", "pasuk_html": "<mark>וַיֶּעְתַּ֨ר</mark> יִצְחָ֤ק לַֽיהֹוָה֙ לְנֹ֣כַח אִשְׁתּ֔וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא וַיֵּעָ֤תֶר לוֹ֙ יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיֶּעְתַּר יִצְחָק לַה' לְנוֹכַח אִשְׁתּוֹ כִּי עֲקָרָה הִוא וַיִּעָתֶר לוֹ ה' וַתַּהַר רִבְקָה אִשְׁתּוֹ.", "rashi_he": "ויעתר. הִרְבָּה וְהִפְצִיר בִּתְפִלָּה:", "rashi_en": "'ויעתר' פירושו שיצחק הרבה בתפילה והפציר בה.", "note": "", "points": [{"q": "מָה מְלַמֶּדֶת הַמִּילָּה 'וַיֶּעְתַּר' עַל תְּפִילָּתוֹ שֶׁל יִצְחָק?", "options": ["שֶׁהִרְבָּה בִּתְפִילָּה וְהִפְצִיר בָּהּ", "שֶׁהִתְפַּלֵּל בְּקוֹל רָם לִפְנֵי כּוּלָּם", "שֶׁהִתְפַּלֵּל פַּעַם אַחַת וּבִקְצָרָה"], "kasha": "הכתוב לא אמר 'ויתפלל' אלא 'ויעתר', ויש לפרש מה מוסיפה לשון זו.", "answer": "הרבה והפציר בתפילה.", "kp": ["הרבה והפציר בתפלה"]}]}, {"id": "25:21.2", "ch": 25, "v": 21, "n": 2, "dh": "ויעתר לו", "pasuk_html": "וַיֶּעְתַּ֨ר יִצְחָ֤ק לַֽיהֹוָה֙ לְנֹ֣כַח אִשְׁתּ֔וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא <mark>וַיֵּעָ֤תֶר לוֹ֙</mark> יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיֶּעְתַּר יִצְחָק לַה' לְנוֹכַח אִשְׁתּוֹ כִּי עֲקָרָה הִוא וַיִּעָתֶר לוֹ ה' וַתַּהַר רִבְקָה אִשְׁתּוֹ.", "rashi_he": "ויעתר לו. נִתְפַּצֵּר וְנִתְפַּיֵּס וְנִתְפַּתָּה לוֹ. וְאוֹמֵר אֲנִי, כָּל לְשׁוֹן עֶתֶר לְשׁוֹן הַפְצָרָה וְרִבּוּי הוּא, וְכֵן וַעֲתַר עֲנַן הַקְּטֹרֶת (יחז' ח') – מַרְבִּית עֲלִיַּת הֶעָשָׁן, וְכֵן וְהַעְתַּרְתֶּם עָלַי דִּבְרֵיכֶם (שם ל\"ה), וְכֵן וְנַעְתָּרוֹת נְשִׁיקוֹת שׂוֹנֵא (משלי כ\"ז) – דּוֹמוֹת לִמְרֻבּוֹת וְהִנָּם לְמַשָּׂא; אנקרי\"שרא בלע\"ז:", "rashi_en": "ה' נתפצר ונתפייס ונתפתה ליצחק, כלומר נענה להפצרותיו. רש״י מוסיף שכל לשון 'עתר' היא לשון הפצרה וריבוי, כמו 'ועתר ענן הקטרת' שפירושו ריבוי העשן העולה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ 'וַיֶּעְתַּר לוֹ' הָאָמוּר עַל הַקָּב״ה?", "options": ["נִתְפַּצֵּר וְנִתְפַּיֵּיס וְנִתְפַּתָּה לְיִצְחָק", "עָנָה לְיִצְחָק מִיָּד בְּלִי שׁוּם עִיכּוּב", "הִבְטִיחַ לְיִצְחָק בָּנִים רַבִּים מְאוֹד"], "kasha": "לשון 'ויעתר' נאמרה גם על יצחק וגם על ה', ויש להבין מה משמעותה אצל ה'.", "answer": "נתפצר ונתפיס ונתפתה לו, כלומר ה' נענה להפצרותיו של יצחק.", "kp": ["נתפצר ונתפיס ונתפתה לו"]}, {"q": "מֵהִי הַמַּשְׁמָעוּת הַכְּלָלִית שֶׁל הַשּׁוֹרֶשׁ 'עֲתַר' לְדַעַת רַשִׁ״י?", "options": ["הַפְצָרָה וְרִיבּוּי", "בַּקָּשָׁה בְּלַחַשׁ וּבְשֶׁקֶט", "עֲמִידָה מְמוּשֶּׁכֶת בְּמָקוֹם אֶחָד"], "kasha": "השורש 'עתר' מופיע במקומות שונים במקרא, ויש לברר את משמעותו המשותפת.", "answer": "כל לשון עתר לשון הפצרה וריבוי, כמו 'ועתר ענן הקטרת', שהוא ריבוי עליית העשן, וכן 'והעתרתם עלי דבריכם' ו'נעתרות נשיקות שונא'.", "kp": ["לשון הפצרה ורבוי הוא"]}]}, {"id": "25:21.3", "ch": 25, "v": 21, "n": 3, "dh": "לנכח אשתו", "pasuk_html": "וַיֶּעְתַּ֨ר יִצְחָ֤ק לַֽיהֹוָה֙ <mark>לְנֹ֣כַח אִשְׁתּ֔וֹ</mark> כִּ֥י עֲקָרָ֖ה הִ֑וא וַיֵּעָ֤תֶר לוֹ֙ יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיֶּעְתַּר יִצְחָק לַה' לְנוֹכַח אִשְׁתּוֹ כִּי עֲקָרָה הִוא וַיִּעָתֶר לוֹ ה' וַתַּהַר רִבְקָה אִשְׁתּוֹ.", "rashi_he": "לנכח אשתו. זֶה עוֹמֵד בְּזָוִית זוֹ וּמִתְפַּלֵּל וְזוֹ עוֹמֶדֶת בְּזָוִית זוֹ וּמִתְפַּלֶּלֶת:", "rashi_en": "יצחק עמד בזווית אחת והתפלל, ורבקה עמדה בזווית שכנגדו והתפללה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ 'לְנֹכַח אִשְׁתּוֹ' לְפִי רש״י?", "options": ["יִצְחָק וְרִבְקָה הִתְפַּלְלוּ כָּל אֶחָד בְּזָוְוִית, זֶה כְּנֶגֶד זֶה", "יִצְחָק הִתְפַּלֵּל בְּעַד אִשְׁתּוֹ בְּלִי שֶׁהִיא יָדְעָה מִכָּךְ", "יִצְחָק הִתְפַּלֵּל, וְרִבְקָה עָמְדָה לְיָדוֹ וְשָׁתְקָה"], "kasha": "מה פירוש 'לנכח', והרי אדם מתפלל לפני ה' ולא כנגד אשתו?", "answer": "זה עומד בזווית זו ומתפלל, וזו עומדת בזווית זו ומתפללת.", "kp": ["זה עומד בזוית זו ומתפלל", "וזו עומדת בזוית זו ומתפללת"]}]}, {"id": "25:21.4", "ch": 25, "v": 21, "n": 4, "dh": "ויעתר לו", "pasuk_html": "וַיֶּעְתַּ֨ר יִצְחָ֤ק לַֽיהֹוָה֙ לְנֹ֣כַח אִשְׁתּ֔וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא <mark>וַיֵּעָ֤תֶר לוֹ֙</mark> יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיֶּעְתַּר יִצְחָק לַה' לְנוֹכַח אִשְׁתּוֹ כִּי עֲקָרָה הִוא וַיִּעָתֶר לוֹ ה' וַתַּהַר רִבְקָה אִשְׁתּוֹ.", "rashi_he": "ויעתר לו. לוֹ וְלֹא לָהּ, שֶׁאֵין דּוֹמָה תְפִלַּת צַדִּיק בֶּן צַדִּיק לִתְפִלַּת צַדִּיק בֶּן רָשָׁע, לְפִיכָךְ לוֹ וְלֹא לָהּ (יבמות ס\"ד):", "rashi_en": "ה' נענה לתפילת יצחק ולא לתפילת רבקה, כי תפילת צדיק בן צדיק אינה דומה לתפילת צדיק בן רשע.", "note": "", "points": [{"q": "מַדּוּעַ נֶאֱמַר 'וַיֶּעְתַּר לוֹ' – לְיִצְחָק וְלֹא לְרִבְקָה?", "options": ["תְּפִילַּת צַדִּיק בֶּן צַדִּיק גְּדוֹלָה מִתְּפִילַּת צַדִּיק בֶּן רָשָׁע", "רִבְקָה לֹא הִתְפַּלְּלָה כְּלָל, וְרַק יִצְחָק הִתְפַּלֵּל", "יִצְחָק הִתְפַּלֵּל זְמַן רַב יוֹתֵר מֵרִבְקָה"], "kasha": "שניהם התפללו, ומדוע נאמר 'ויעתר לו' – ליצחק בלבד?", "answer": "לו ולא לה, שאין דומה תפילת צדיק בן צדיק לתפילת צדיק בן רשע.", "kp": ["שאין דומה תפלת צדיק בן צדיק", "לתפלת צדיק בן רשע"]}]}, {"id": "25:22.1", "ch": 25, "v": 22, "n": 1, "dh": "ויתרוצצו", "pasuk_html": "<mark>וַיִּתְרֹֽצְצ֤וּ</mark> הַבָּנִים֙ בְּקִרְבָּ֔הּ וַתֹּ֣אמֶר אִם־כֵּ֔ן לָ֥מָּה זֶּ֖ה אָנֹ֑כִי וַתֵּ֖לֶךְ לִדְרֹ֥שׁ אֶת־יְהֹוָֽה׃", "pasuk_en": "וַיִּתְרֹצְצוּ הַבָּנִים בְקִרְבָּהּ וַתֹּאמֶר אִם־כֵּן לָמָּה זֶה אָנֹכִי", "rashi_he": "ויתרוצצו. עַ\"כָּ הַמִּקְרָא הַזֶּה אוֹמֵר דָּרְשֵׁנִי, שֶׁסָּתַם מַה הִיא רְצִיצָה זוֹ וְכָתַב אִם כֵּן לָמָּה זֶּה אָנֹכִי? רַבּוֹתֵינוּ דְּרָשׁוּהוּ לְשׁוֹן רִיצָה; כְּשֶׁהָיְתָה עוֹבֶרֶת עַל פִּתְחֵי תּוֹרָה שֶׁל שֵׁם וָעֵבֶר יַעֲקֹב רָץ וּמְפַרְכֵּס לָצֵאת, עוֹבֶרֶת עַל פֶּתַח עֲבוֹדַת אֱלִילִים, עֵשָׂו מְפַרְכֵּס לָצֵאת. דָּבָר אַחֵר מִתְרוֹצְצִים זֶה עִם זֶה וּמְרִיבִים בְּנַחֲלַת שְׁנֵי עוֹלָמוֹת.", "rashi_en": "הפסוק אינו מפרש מה הייתה הרציצה, ורבקה אמרה 'אם כן למה זה אנכי', ולכן יש לדרשו. חז״ל דרשו מלשון ריצה: כשעברה ליד בית מדרשם של שם ועבר יעקב פרכס לצאת, וליד בית עבודה זרה עשו פרכס לצאת. דבר אחר: הבנים התרוצצו ורבו זה עם זה על נחלת שני העולמות.", "note": "", "points": [{"q": "מַדּוּעַ אוֹמֵר רַשִׁ״י שֶׁהַמִּקְרָא הַזֶּה 'אוֹמֵר דָּרְשֵׁנִי'?", "options": ["הַכָּתוּב סָתַם מָה הָיִיתָה הָרְצִיצָה, וְרִבְקָה אָמְרָה 'לָמָּה זֶּה אָנֹכִי'", "הַכָּתוּב לֹא פֵּירֵשׁ מִי מֵהַבָּנִים הִתְחִיל רִאשׁוֹן בַּמְּרִיבָה", "הַכָּתוּב לֹא אָמַר כַּמָּה זְמַן נִמְשְׁכָה הָרְצִיצָה בְּבִטְנָהּ"], "kasha": "הכתוב אינו מפרש מה הייתה הרציצה, ותגובת רבקה מראה שהיה זה דבר חריג.", "answer": "המקרא אומר דרשני, שסתם מה היא רציצה זו וכתב 'אם כן למה זה אנכי'.", "kp": ["שסתם מה היא רציצה זו", "וכתב אם כן למה זה אנכי"]}, {"q": "לְפִי הַדְּרַשׁ הָרִאשׁוֹן, מַה קָּרָה כְּשֶׁרִבְקָה עָבְרָה לְיַד בֵּית מִדְרָשָׁם שֶׁל שֵׁם וָעֵבֶר?", "options": ["יַעֲקֹב רָץ וּפִרְכֵּס לָצֵאת", "עֵשָׂו רָץ וּפִרְכֵּס לָצֵאת", "שְׁנֵי הַבָּנִים נִרְגְּעוּ וְשָׁקְטוּ"], "kasha": "יש לפרש מה עניין ה'התרוצצות' של הבנים בבטן.", "answer": "רבותינו דרשוהו לשון ריצה: כשעברה על פתחי תורה של שם ועבר יעקב רץ ומפרכס לצאת, וכשעברה על פתח עבודה זרה עשו מפרכס לצאת. דבר אחר: מתרוצצים זה עם זה ומריבים בנחלת שני עולמות.", "kp": ["יעקב רץ ומפרכס לצאת"]}]}, {"id": "25:22.2", "ch": 25, "v": 22, "n": 2, "dh": "ותאמר אם כן", "pasuk_html": "וַיִּתְרֹֽצְצ֤וּ הַבָּנִים֙ בְּקִרְבָּ֔הּ <mark>וַתֹּ֣אמֶר אִם־כֵּ֔ן</mark> לָ֥מָּה זֶּ֖ה אָנֹ֑כִי וַתֵּ֖לֶךְ לִדְרֹ֥שׁ אֶת־יְהֹוָֽה׃", "pasuk_en": "וַיִּתְרֹצְצוּ הַבָּנִים בְקִרְבָּהּ וַתֹּאמֶר אִם כֵּן לָמָּה זֶה אָנֹכִי", "rashi_he": "ותאמר אם כן. גָּדוֹל צַעַר הָעִבּוּר.", "rashi_en": "רבקה אמרה: אם כה גדול צער ההריון...", "note": "", "points": [{"q": "עַל מָה מוּסָבּוֹת הַמִּילִּים 'אִם־כֵּן' בְּדִבְרֵי רִבְקָה?", "options": ["אִם כֹּה גָּדוֹל צַעַר הַהֵרָיוֹן", "אִם יִהְיוּ לִי שְׁנֵי בָּנִים שׁוֹנִים", "אִם לֹא אֵלֵד בַּזְּמַן הָרָאוּי"], "kasha": "המילים 'אם כן' סתומות ואינן מפרשות למה הכוונה.", "answer": "אם כן גדול צער העיבור.", "kp": ["ותאמר אם כן", "גדול צער העבור"]}]}, {"id": "25:22.3", "ch": 25, "v": 22, "n": 3, "dh": "למה זה אנכי", "pasuk_html": "וַיִּתְרֹֽצְצ֤וּ הַבָּנִים֙ בְּקִרְבָּ֔הּ וַתֹּ֣אמֶר אִם־כֵּ֔ן <mark>לָ֥מָּה זֶּ֖ה אָנֹ֑כִי</mark> וַתֵּ֖לֶךְ לִדְרֹ֥שׁ אֶת־יְהֹוָֽה׃", "pasuk_en": "וַיִּתְרֹצְצוּ הַבָּנִים בְקִרְבָּהּ וַתֹּאמֶר אִם כֵּן לָמָּה זֶה אָנֹכִי", "rashi_he": "למה זה אנכי. מִתְאַוָּה וּמִתְפַּלֶּלֶת עַל הֵרָיוֹן:", "rashi_en": "רבקה שאלה: אם הצער כה גדול, למה אני מתאווה ומתפללת על הריון?", "note": "", "points": [{"q": "מָה שָׁאֲלָה רִבְקָה בְּמִילִּים 'לָמָּה זֶּה אָנֹכִי'?", "options": ["לָמָּה אֲנִי מִתְאַוְּוָה וּמִתְפַּלֶּלֶת עַל הֵרָיוֹן", "לָמָּה דַּוְוקָא אֲנִי נִבְחַרְתִּי לָלֶדֶת תְּאוֹמִים", "לָמָּה אֲנִי שׁוֹנָה מִשְּׁאָר הַנָּשִׁים הַהָרוֹת"], "kasha": "דברי רבקה 'למה זה אנכי' חסרים ואינם מבוארים.", "answer": "למה זה אנכי מתאווה ומתפללת על הריון.", "kp": ["למה זה אנכי", "מתאוה ומתפללת על הריון"]}]}, {"id": "25:22.4", "ch": 25, "v": 22, "n": 4, "dh": "ותלך לדרוש", "pasuk_html": "וַיִּתְרֹֽצְצ֤וּ הַבָּנִים֙ בְּקִרְבָּ֔הּ וַתֹּ֣אמֶר אִם־כֵּ֔ן לָ֥מָּה זֶּ֖ה אָנֹ֑כִי <mark>וַתֵּ֖לֶךְ לִדְרֹ֥שׁ</mark> אֶת־יְהֹוָֽה׃", "pasuk_en": "וַתֵּלֶךְ לִדְרוֹשׁ אֶת ה'", "rashi_he": "ותלך לדרוש. לְבֵית מִדְרָשׁוֹ שֶׁל שֵׁם:", "rashi_en": "רבקה הלכה לבית מדרשו של שם.", "note": "", "points": [{"q": "לְאָן הָלְכָה רִבְקָה כְּדֵי 'לִדְרוֹשׁ'?", "options": ["לְבֵית מִדְרָשׁוֹ שֶׁל שֵׁם", "לְאוֹהֶל אַבְרָהָם, אֲבִי בַּעְלָהּ", "לְהַר הַמּוֹרִיָּה, מְקוֹם הָעֲקֵדָה"], "kasha": "לא נאמר לאן הלכה רבקה כדי לדרוש את ה'.", "answer": "לבית מדרשו של שם.", "kp": ["לבית מדרשו של שם"]}]}, {"id": "25:22.5", "ch": 25, "v": 22, "n": 5, "dh": "לדרוש את ה׳", "pasuk_html": "וַיִּתְרֹֽצְצ֤וּ הַבָּנִים֙ בְּקִרְבָּ֔הּ וַתֹּ֣אמֶר אִם־כֵּ֔ן לָ֥מָּה זֶּ֖ה אָנֹ֑כִי וַתֵּ֖לֶךְ <mark>לִדְרֹ֥שׁ אֶת־יְהֹוָֽה׃</mark>", "pasuk_en": "וַתִּשְׁאַל אֶת ה'", "rashi_he": "לדרוש את ה'. שֶׁיַּגִּיד לָהּ מַה תְּהֵא בְּסוֹפָהּ:", "rashi_en": "רבקה ביקשה שה' יגיד לה מה יהיה בסופה.", "note": "", "points": [{"q": "מָה בִּיקְשָׁה רִבְקָה לָדַעַת כְּשֶׁהָלְכָה לִדְרוֹשׁ אֶת ה׳?", "options": ["מָה יִהְיֶה בְּסוֹפָהּ", "אִם הַוְּוָלָד שֶׁבְּבִטְנָהּ זָכָר אוֹ נְקֵבָה", "אֵיךְ תּוּכַל לְהָקֵל עַל צַעַר הַהֵרָיוֹן"], "kasha": "לא נאמר מה ביקשה רבקה לדרוש מאת ה'.", "answer": "שיגיד לה מה תהא בסופה.", "kp": ["שיגיד לה מה תהא בסופה"]}]}, {"id": "25:23.1", "ch": 25, "v": 23, "n": 1, "dh": "ויאמר ה׳ לה", "pasuk_html": "<mark>וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ</mark> שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ וּשְׁנֵ֣י לְאֻמִּ֔ים מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ וּלְאֹם֙ מִלְאֹ֣ם יֶֽאֱמָ֔ץ וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וַיֹּאמֶר ה' לָהּ", "rashi_he": "ויאמר ה' לה. עַל יְדֵי שָׁלִיחַ; לְשֵׁם נֶאֱמַר בְּרוּחַ הַקֹּדֶשׁ וְהוּא אָמַר לָהּ (בראשית רבה):", "rashi_en": "ה' לא דיבר עם רבקה ישירות אלא על ידי שליח: לשם נאמרו הדברים ברוח הקודש, והוא אמר אותם לה.", "note": "", "points": [{"q": "כֵּיצַד נֶאֶמְרוּ לְרִבְקָה דִּבְרֵי ה׳?", "options": ["עַל יְדֵי שֵׁם, שֶׁנֶּאֱמַר לוֹ בְּרוּחַ הַקּוֹדֶשׁ", "בַּחֲלוֹם הַלַּיְלָה, כְּמוֹ שֶׁנֶּאֱמַר לַאֲבִימֶלֶךְ", "עַל יְדֵי מַלְאָךְ שֶׁנִּגְלָה אֵלֶיהָ בַּדֶּרֶךְ"], "kasha": "וכי ה' דיבר עם רבקה בעצמו?", "answer": "על ידי שליח: לשם נאמר ברוח הקודש, והוא אמר לה.", "kp": ["על ידי שליח", "לשם נאמר ברוח הקדש"]}]}, {"id": "25:23.2", "ch": 25, "v": 23, "n": 2, "dh": "שני גוים בבטנך", "pasuk_html": "וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ וּשְׁנֵ֣י לְאֻמִּ֔ים מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ וּלְאֹם֙ מִלְאֹ֣ם יֶֽאֱמָ֔ץ וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וַיֹּאמֶר יְהוָה לָהּ שְׁנֵי גוֹיִם בִּבִטְנֵךְ וּשְׁנֵי לְאֻמִּים מִמְּעַיִךְ יִפָּרֵדוּ וּלְאֹם מִלְאֹם יֶאֱמָץ וְרַב יַעֲבֹד אֶת הַקָּטָן", "rashi_he": "שני גוים בבטנך. גיים כְּתִיב; אֵלּוּ אַנְטוֹנִינוּס וְרַבִּי, שֶׁלֹּא פָסְקוּ מֵעַל שֻׁלְחָנָם לֹא צְנוֹן וְלֹא חֲזֶרֶת לֹא בִימוֹת הַחַמָּה וְלֹא בִימוֹת הַגְּשָׁמִים (עבודה זרה י\"א):", "rashi_en": "המילה כתובה 'גיים', ורומזת לאנטונינוס ולרבי, שעל שולחנם לא חסרו צנון וחזרת לא בקיץ ולא בחורף.", "note": "", "points": [{"q": "מָה דּוֹרֵשׁ רַשִׁ״י מִכָּךְ שֶׁכָּתוּב 'גֵּיִים'?", "options": ["רֶמֶז לְאַנְטוֹנִינוּס וְרַבִּי, שֶׁעַל שׁוּלְחָנָם לֹא חָסְרוּ צְנוֹן וַחֲזֶרֶת", "רֶמֶז לְכָךְ שֶׁיַּעֲקֹב וְעֵשָׂו יִהְיוּ שְׁנֵי עַמִּים נִפְרָדִים", "רֶמֶז לְכָךְ שֶׁמִּבְּנֵי עֵשָׂו יֵיצְאוּ גֵּרִים צַדִּיקִים"], "kasha": "המילה 'גוים' כתובה בכתיב שונה, 'גיים', ויש לדרוש את השינוי.", "answer": "גיים כתיב: אלו אנטונינוס ורבי, שלא פסקו מעל שולחנם צנון וחזרת, לא בימות החמה ולא בימות הגשמים.", "kp": ["גיים כתיב; אלו אנטונינוס ורבי", "שלא פסקו מעל שלחנם", "לא צנון ולא חזרת"]}]}, {"id": "25:23.3", "ch": 25, "v": 23, "n": 3, "dh": "ושני לאמים", "pasuk_html": "וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ <mark>וּשְׁנֵ֣י לְאֻמִּ֔ים</mark> מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ וּלְאֹם֙ מִלְאֹ֣ם יֶֽאֱמָ֔ץ וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וַיֹּאמֶר יְהוָה לָהּ שְׁנֵי גוֹיִם בִּבִטְנֵךְ וּשְׁנֵי לְאֻמִּים מִמְּעַיִךְ יִפָּרֵדוּ וּלְאֹם מִלְאֹם יֶאֱמָץ וְרַב יַעֲבֹד אֶת הַקָּטָן", "rashi_he": "ושני לאמים. אֵין לְאֹם אֶלָּא מַלְכוּת:", "rashi_en": "'לאום' פירושו מלכות: מבטנה ייצאו שתי מלכויות.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ 'לְאֻמִּים' לְפִי רַשִׁ״י?", "options": ["מַלְכוּיוֹת", "שְׁבָטִים", "לְשׁוֹנוֹת"], "kasha": "הכתוב כבר אמר 'שני גוים', ומה מוסיף 'ושני לאמים'?", "answer": "אין לאום אלא מלכות.", "kp": ["אין לאם אלא מלכות"]}]}, {"id": "25:23.4", "ch": 25, "v": 23, "n": 4, "dh": "ממעיך יפרדו", "pasuk_html": "וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ וּשְׁנֵ֣י לְאֻמִּ֔ים <mark>מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ</mark> וּלְאֹם֙ מִלְאֹ֣ם יֶֽאֱמָ֔ץ וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת וְהִנֵּה תְאוֹמִים בְּבִטְנָהּ", "rashi_he": "ממעיך יפרדו. מִן הַמֵּעַיִם הֵם נִפְרָדִים זֶה לְרִשְׁעוֹ וְזֶה לְתֻמּוֹ:", "rashi_en": "כבר מן הרחם ייפרדו הבנים בדרכיהם: זה לרשעו וזה לתומו.", "note": "", "points": [{"q": "מָה מְלַמֵּד 'מִמֵּעַיִךְ יִפָּרֵדוּ'?", "options": ["כְּבָר מִן הָרֶחֶם יִיפָּרְדוּ, זֶה לְרִשְׁעוֹ וְזֶה לְתוּמּוֹ", "כְּשֶׁיִּגְדְּלוּ יִיפָּרְדוּ וְיָגוּרוּ בְּאֲרָצוֹת שׁוֹנוֹת", "בִּשְׁעַת הַלֵּידָה יִיפָּרְדוּ זֶה מִזֶּה בְּכוֹחַ"], "kasha": "מה החידוש בכך שהתאומים ייפרדו 'ממעיך'?", "answer": "מן המעיים הם נפרדים, זה לרשעו וזה לתומו.", "kp": ["מן המעים הם נפרדים", "זה לרשעו וזה לתמו"]}]}, {"id": "25:23.5", "ch": 25, "v": 23, "n": 5, "dh": "מלאם יאמץ", "pasuk_html": "וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ שְׁנֵ֤י (גיים) [גוֹיִם֙] בְּבִטְנֵ֔ךְ וּשְׁנֵ֣י לְאֻמִּ֔ים מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ וּלְאֹם֙ <mark>מִלְאֹ֣ם יֶֽאֱמָ֔ץ</mark> וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "pasuk_en": "וְלְאֹם מִלְאֹם יֶאֱמָץ וְרַב יַעֲבֹד אֶת הַקָּטָן", "rashi_he": "מלאם יאמץ. לֹא יִשְׁווּ בִּגְדֻלָּה, כְּשֶׁזֶּה קָם זֶה נוֹפֵל, וְכֵן הוּא אוֹמֵר אִמָּלְאָה הָחֳרָבָה (יחזקאל כ\"ו), לֹא נִתְמַלְּאָה צוֹר אֶלָּא מֵחֻרְבָּנָהּ שֶׁל יְרוּשָׁלַיִם:", "rashi_en": "שני העמים לא יהיו גדולים בבת אחת: כשזה קם זה נופל. כך אמרה צור 'אמלאה החרבה' – צור התמלאה רק מחורבנה של ירושלים.", "note": "", "points": [{"q": "מָה מְלַמֵּד 'וּלְאֹם מִלְאֹם יֶאֱמָץ'?", "options": ["לֹא יִשְׁווּ בִּגְדוּלָּה – כְּשֶׁזֶּה קָם זֶה נוֹפֵל", "שְׁנֵיהֶם יִהְיוּ חֲזָקִים יַחַד לְעוֹלָם", "עֵשָׂו יִהְיֶה תָּמִיד חָזָק מִיַּעֲקֹב"], "kasha": "יש להבין מה פירוש שלאום אחד יתחזק מן הלאום האחר.", "answer": "לא ישוו בגדולה; כשזה קם זה נופל, כמו שנאמר 'אמלאה החרבה' – לא נתמלאה צור אלא מחורבנה של ירושלים.", "kp": ["לא ישוו בגדלה", "כשזה קם זה נופל"]}]}, {"id": "25:24.1", "ch": 25, "v": 24, "n": 1, "dh": "וימלאו ימיה", "pasuk_html": "<mark>וַיִּמְלְא֥וּ יָמֶ֖יהָ</mark> לָלֶ֑דֶת וְהִנֵּ֥ה תוֹמִ֖ם בְּבִטְנָֽהּ׃", "pasuk_en": "וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת וְהִנֵּה תְאוֹמִים בְּבִטְנָהּ", "rashi_he": "וימלאו ימיה. אֲבָל בְּתָמָר כְּתִיב וַיְהִי בְּעֵת לִדְתָּהּ (בראשית ל״ח:כ״ז), שֶׁלֹּא מָלְאוּ יָמֶיהָ, כִּי לְז' חֳדָשִׁים יְלָדָתַם:", "rashi_en": "אצל רבקה נאמר 'וימלאו ימיה', אבל אצל תמר נאמר 'ויהי בעת לדתה', כי ימיה לא מלאו – היא ילדה לשבעה חודשים.", "note": "", "points": [{"q": "מַדּוּעַ אֵצֶל תָּמָר לֹא נֶאֱמַר 'וַיִּמְלְאוּ יָמֶיהָ' כְּמוֹ אֵצֶל רִבְקָה?", "options": ["תָּמָר יָלְדָה לְשִׁבְעָה חוֹדָשִׁים, וְלֹא מָלְאוּ יָמֶיהָ", "תָּמָר יָלְדָה בְּצַעַר גָּדוֹל יוֹתֵר מֵרִבְקָה", "תָּמָר לֹא הִתְפַּלְּלָה עַל הֵרְיוֹנָהּ כְּמוֹ רִבְקָה"], "kasha": "מה בא הכתוב ללמד באמרו כאן 'וימלאו ימיה', כשאצל תמר נאמרה לשון אחרת?", "answer": "אצל רבקה מלאו ימיה, אבל בתמר כתוב 'ויהי בעת לדתה', שלא מלאו ימיה, כי לשבעה חודשים ילדתם.", "kp": ["שלא מלאו ימיה", "כי לז' חדשים ילדתם"]}]}, {"id": "25:24.2", "ch": 25, "v": 24, "n": 2, "dh": "והנה תומם", "pasuk_html": "וַיִּמְלְא֥וּ יָמֶ֖יהָ לָלֶ֑דֶת <mark>וְהִנֵּ֥ה תוֹמִ֖ם</mark> בְּבִטְנָֽהּ׃", "pasuk_en": "וּלְעֵת לִדְתָּהּ, הִנֵּה תוֹמִם בְּבִטְנָהּ.", "rashi_he": "והנה תומם. חָסֵר, וּבְתָמָר תְּאוֹמִים מָלֵא, לְפִי שֶׁשְּׁנֵיהֶם צַדִּיקִים; אֲבָל כָּאן אֶחָד צַדִּיק וְאֶחָד רָשָׁע:", "rashi_en": "המילה 'תומם' כתובה חסר, ואצל תמר 'תאומים' כתוב מלא, כי שני בני תמר היו צדיקים, ואילו כאן אחד צדיק ואחד רשע.", "note": "", "points": [{"q": "מַדּוּעַ 'תוֹמִם' כָּתוּב חָסֵר, וְאֵצֶל תָּמָר 'תְּאוֹמִים' כָּתוּב מָלֵא?", "options": ["כָּאן אֶחָד צַדִּיק וְאֶחָד רָשָׁע, וּבְנֵי תָמָר שְׁנֵיהֶם צַדִּיקִים", "כָּאן נוֹלְדוּ הַתְּאוֹמִים בִּזְמַנָּם, וְתָמָר יָלְדָה לְשִׁבְעָה", "כָּאן נוֹלַד אֶחָד מֵהֶם חַלָּשׁ וְקָטָן מֵאָחִיו"], "kasha": "המילה 'תומם' כתובה בכתיב חסר, שלא כמו אצל תמר.", "answer": "בתמר 'תאומים' מלא, לפי ששניהם צדיקים, אבל כאן אחד צדיק ואחד רשע.", "kp": ["לפי ששניהם צדיקים", "אבל כאן אחד צדיק ואחד רשע"]}]}, {"id": "25:25.1", "ch": 25, "v": 25, "n": 1, "dh": "אדמוני", "pasuk_html": "וַיֵּצֵ֤א הָרִאשׁוֹן֙ <mark>אַדְמוֹנִ֔י</mark> כֻּלּ֖וֹ כְּאַדֶּ֣רֶת שֵׂעָ֑ר וַיִּקְרְא֥וּ שְׁמ֖וֹ עֵשָֽׂו׃", "pasuk_en": "וַיֵּצֵא הָרִאשׁוֹן אַדְמוֹנִי, כֻּלּוֹ כַּאֲדֶרֶת שֵׂעָר; וַיִּקְרְאוּ שְׁמוֹ עֵשָׂו.", "rashi_he": "אדמוני. סִימָן הוּא שֶׁיְּהֵא שׁוֹפֵךְ דָּמִים (בראשית רבה):", "rashi_en": "צבעו האדום של עשו היה סימן שיהיה שופך דמים.", "note": "", "points": [{"q": "עַל מָה מְרַמֵּז הֱיוֹתוֹ שֶׁל עֵשָׂו 'אַדְמוֹנִי'?", "options": ["שֶׁיִּהְיֶה שׁוֹפֵךְ דָּמִים", "שֶׁיִּהְיֶה אִישׁ שָׂדֶה וְצַיָּיד", "שֶׁיִּהְיֶה עָשִׁיר וּבַעַל נְכָסִים"], "kasha": "מדוע מספר הכתוב על צבעו של עשו בשעת לידתו?", "answer": "סימן הוא שיהא שופך דמים.", "kp": ["סימן הוא שיהא שופך דמים"]}]}, {"id": "25:25.2", "ch": 25, "v": 25, "n": 2, "dh": "כלו כאדרת שער", "pasuk_html": "וַיֵּצֵ֤א הָרִאשׁוֹן֙ אַדְמוֹנִ֔י <mark>כֻּלּ֖וֹ כְּאַדֶּ֣רֶת שֵׂעָ֑ר</mark> וַיִּקְרְא֥וּ שְׁמ֖וֹ עֵשָֽׂו׃", "pasuk_en": "וַיֵּצֵא הָרִאשׁוֹן אַדְמוֹנִי, כֻּלּוֹ כַּאֲדֶרֶת שֵׂעָר; וַיִּקְרְאוּ שְׁמוֹ עֵשָׂו.", "rashi_he": "כלו כאדרת שער. מָלֵא שֵׂעָר כְּטַלִּית שֶׁל צֶמֶר הַמְלֵאָה שֵׂעָר, פלוקי\"דא בלע\"ז:", "rashi_en": "עשו היה מלא שיער, כמו טלית של צמר המלאה שיער.", "note": "", "points": [{"q": "לָמָּה מְדַמֶּה הַכָּתוּב אֶת עֵשָׂו בַּמִּילִּים 'כְּאַדֶּרֶת שֵׂעָר'?", "options": ["לְטַלִּית שֶׁל צֶמֶר הַמְלֵאָה שֵׂיעָר", "לְאַדֶּרֶת מְלָכִים מְפוֹאֶרֶת וִיקָרָה", "לְעוֹרוֹ שֶׁל תַּיִשׁ שָׂעִיר"], "kasha": "מה פירוש 'אדרת שער' בהקשר זה?", "answer": "מלא שיער כטלית של צמר המלאה שיער (פלוקי״דא בלע״ז).", "kp": ["כטלית של צמר המלאה שער"]}]}, {"id": "25:25.3", "ch": 25, "v": 25, "n": 3, "dh": "ויקראו שמו עשו", "pasuk_html": "וַיֵּצֵ֤א הָרִאשׁוֹן֙ אַדְמוֹנִ֔י כֻּלּ֖וֹ כְּאַדֶּ֣רֶת שֵׂעָ֑ר <mark>וַיִּקְרְא֥וּ שְׁמ֖וֹ עֵשָֽׂו׃</mark>", "pasuk_en": "וַיֵּצֵא הָרִאשׁוֹן אַדְמוֹנִי, כֻּלּוֹ כַּאֲדֶרֶת שֵׂעָר; וַיִּקְרְאוּ שְׁמוֹ עֵשָׂו.", "rashi_he": "ויקראו שמו עשו. הַכֹּל קָרְאוּ לוֹ כֵן, לְפִי שֶׁהָיָה נַעֲשֶׂה וְנִגְמָר בִּשְׂעָרוֹ כְבֶן שָׁנִים הַרְבֵּה:", "rashi_en": "כולם קראו לו עשו, כי כבר בלידתו היה ״עשוי״ וגמור בשערו, כמו ילד בן כמה שנים.", "note": "", "points": [{"q": "מַדּוּעַ נִקְרָא שְׁמוֹ שֶׁל עֵשָׂו בְּשֵׁם זֶה?", "options": ["כִּי נוֹלַד עָשׂוּי וְגָמוּר בִּשְׂעָרוֹ כְּבֶן שָׁנִים רַבּוֹת", "כִּי עָשָׂה מַעֲשִׂים רָעִים כְּבָר בְּבֶטֶן אִמּוֹ", "כִּי נוֹלַד אַדְמוֹנִי כּוּלּוֹ, כְּצֶבַע הַדָּם"], "kasha": "הכתוב אינו מסביר מה טעם השם ״עשו״.", "answer": "לפי שהיה נעשה ונגמר בשערו כבן שנים הרבה.", "kp": ["לפי שהיה נעשה ונגמר בשערו", "כבן שנים הרבה"]}, {"q": "מִי קָרָא לְעֵשָׂו בִּשְׁמוֹ, לְפִי רַשִׁ״י?", "options": ["כָּל הָאֲנָשִׁים קָרְאוּ לוֹ כֵּן", "יִצְחָק אָבִיו בִּלְבַד קָרָא לוֹ כֵּן", "הַקָּבָּ״ה קָרָא לוֹ כֵּן"], "kasha": "נאמר ״ויקראו״ בלשון רבים, ולא נאמר מי קרא לו.", "answer": "הכל קראו לו כן.", "kp": ["הכל קראו לו כן"]}]}, {"id": "25:26.1", "ch": 25, "v": 26, "n": 1, "dh": "ואחרי כן יצא אחיו", "pasuk_html": "<mark>וְאַֽחֲרֵי־כֵ֞ן יָצָ֣א אָחִ֗יו</mark> וְיָד֤וֹ אֹחֶ֙זֶת֙ בַּעֲקֵ֣ב עֵשָׂ֔ו וַיִּקְרָ֥א שְׁמ֖וֹ יַעֲקֹ֑ב וְיִצְחָ֛ק בֶּן־שִׁשִּׁ֥ים שָׁנָ֖ה בְּלֶ֥דֶת אֹתָֽם׃", "pasuk_en": "וְאַחֲרֵי כֵן יָצָא אָחִיו וְיָדוֹ אוֹחֶזֶת בַּעֲקֵב עֵשָׂו; וַיִּקְרָא שְׁמוֹ יַעֲקֹב.", "rashi_he": "ואחרי כן יצא אחיו וגו'. שָׁמַעְתִּי מִ\"אַ הַדּוֹרְשׁוֹ לְפִי פְּשׁוּטוֹ, בְּדִין הָיָה אוֹחֵז בּוֹ לְעַכְּבוֹ, יַעֲקֹב נוֹצַר מִטִּפָּה רִאשׁוֹנָה וְעֵשָׂו מִן הַשְּׁנִיָּה; צֵא וּלְמַד מִשְּׁפוֹפֶרֶת שֶׁפִּיהָ קְצָרָה, תֵּן לָהּ שְׁתֵּי אֲבָנִים זוֹ אַחַר זוֹ – הַנִּכְנֶסֶת רִאשׁוֹנָה תֵּצֵא אַחֲרוֹנָה וְהַנִּכְנֶסֶת אַחֲרוֹנָה תֵּצֵא רִאשׁוֹנָה; נִמְצָא עֵשָׂו הַנּוֹצָר בָּאַחֲרוֹנָה יָצָא רִאשׁוֹן וְיַעֲקֹב שֶׁנּוֹצַר רִאשׁוֹנָה יָצָא אַחֲרוֹן, וְיַעֲקֹב בָּא לְעַכְּבוֹ, שֶׁיְּהֵא רִאשׁוֹן לְלֵדָה כְּרִאשׁוֹן לִיצִירָה, וְיִפְטֹר אֶת רַחְמָהּ וְיִטֹּל אֶת הַבְּכוֹרָה מִן הַדִּין:", "rashi_en": "יעקב נוצר מן הטיפה הראשונה ועשו מן השנייה. כמו בשפופרת צרה, מה שנכנס ראשון יוצא אחרון, ולכן עשו יצא ראשון. יעקב אחז בו בצדק כדי לעכבו, לצאת ראשון ולקבל את הבכורה כדין.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ שֶׁהֵבִיא רַשִׁ״י, מַדּוּעַ אָחַז יַעֲקֹב בְּעֲקֵב עֵשָׂו?", "options": ["כְּדֵי לְעַכְּבוֹ וְלָצֵאת רִאשׁוֹן, כִּי הוּא נוֹצַר רִאשׁוֹן", "כְּדֵי לְהַרְאוֹת שֶׁהוּא חָזָק מֵעֵשָׂו כְּבָר בַּבֶּטֶן", "כְּדֵי שֶׁלֹּא יִיפָּרְדוּ זֶה מִזֶּה בִּשְׁעַת הַלֵּידָה"], "kasha": "מה טעם יש בכך שיעקב אחז בעקב אחיו בשעת הלידה?", "answer": "בדין היה אוחז בו לעכבו, שיהא ראשון ללידה כמו שהיה ראשון ליצירה, ויטול את הבכורה מן הדין.", "kp": ["בדין היה אוחז בו לעכבו", "יעקב נוצר מטפה ראשונה"]}, {"q": "מָה מְלַמֵּד מְשַׁל הַשְּׁפוֹפֶרֶת שֶׁפִּיהָ קְצָרָה?", "options": ["שֶׁהַנִּכְנָס רִאשׁוֹן יוֹצֵא אַחֲרוֹן, וְלָכֵן יַעֲקֹב שֶׁנּוֹצַר רִאשׁוֹן יָצָא אַחֲרוֹן", "שֶׁהַגָּדוֹל וְהֶחָזָק יוֹצֵא תָּמִיד רִאשׁוֹן מִן הָרֶחֶם", "שֶׁהַתְּאוֹמִים נוֹצְרוּ יַחַד וְיָצְאוּ זֶה אַחַר זֶה בְּמִקְרֶה"], "kasha": "אם יעקב נוצר ראשון, מדוע יצא עשו לפניו?", "answer": "בשפופרת צרה, האבן שנכנסת ראשונה יוצאת אחרונה; לכן עשו שנוצר אחרון יצא ראשון, ויעקב שנוצר ראשון יצא אחרון.", "kp": ["הנכנסת ראשונה ת kasha": "נאמר ״ויקרא״ בלשון יחיד ולא נאמר מי קרא, בשונה מ״ויקראו״ שנאמר אצל עשו.", "answer": "הקב״ה קרא לו יעקב.", "kp": ["הקב\"ה"]}, {"q": "לְפִי ה״דָּבָר אַחֵר״ בְּרַשִׁ״י, עַל שֵׁם מָה קָרָא לוֹ אָבִיו יַעֲקֹב?", "options": ["עַל שֵׁם שֶׁאָחַז בַּעֲקֵב אָחִיו בִּשְׁעַת הַלֵּידָה", "עַל שֵׁם שֶׁעָתִיד לַעֲקוֹב אֶת אָחִיו וּלְרַמּוֹתוֹ", "עַל שֵׁם שֶׁיָּצָא אַחֲרוֹן, בְּעִקְבוֹת אָחִיו"], "kasha": "הכתוב אינו מפרש את טעם השם ״יעקב״.", "answer": "אביו קרא לו יעקב על שם אחיזת העקב.", "kp": ["על שם אחיזת העקב"]}]}, {"id": "25:26.4", "ch": 25, "v": 26, "n": 4, "dh": "בן ששים שנה", "pasuk_html": "וְאַֽחֲרֵי־כֵ֞ן יָצָ֣א אָחִ֗יו וְיָד֤וֹ אֹחֶ֙זֶת֙ בַּעֲקֵ֣ב עֵשָׂ֔ו וַיִּקְרָ֥א שְׁמ֖וֹ יַעֲקֹ֑ב וְיִצְחָ֛ק <mark>בֶּן־שִׁשִּׁ֥ים שָׁנָ֖ה</mark> בְּלֶ֥דֶת אֹתָֽם׃", "pasuk_en": "וְאַחַר כֵּן יָצָא אָחִיו וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו וַיִּקְרָא שְׁמוֹ יַעֲקֹב וְיִצְחָק בֶּן־שִׁשִּׁים שָׁנָה בְּלֶדְתָּם אֶת־הַתּוֹם׃", "rashi_he": "בן ששים שנה. י' שָׁנִים מִשֶּׁנְּשָׂאָהּ עַד שֶׁנַּעֲשֵׂית בַּת י\"ג שָׁנָה וּרְאוּיָה לְהֵרָיוֹן, וְי' שָׁנִים הַלָּלוּ צָפָה וְהִִמְתִּין לָהּ, כְּמוֹ שֶׁעָשָׂה אָבִיו לְשָׂרָה; כֵּיוָן שֶׁלֹּא נִתְעַבְּרָה, יָדַע שֶׁהִיא עֲקָרָה, וְהִתְפַּלֵּל עָלֶיהָ (יבמות ס\"ד), וְשִׁפְחָה לֹא רָצָה לִשָּׂא, לְפִי שֶׁנִּתְקַדֵּשׁ בְּהַר הַמּוֹרִיָּה לִהְיוֹת עוֹלָה תְמִימָה:", "rashi_en": "יצחק המתין עשר שנים עד שרבקה הגיעה לגיל שלוש עשרה והייתה ראויה להריון, ועוד עשר שנים כמו שעשה אברהם לשרה. כשלא נתעברה, הבין שהיא עקרה והתפלל עליה. שפחה לא רצה לשאת, כי נתקדש בהר המוריה להיות עולה תמימה.", "note": "", "points": [{"q": "מַדּוּעַ עָבְרוּ עֶשְׂרִים שָׁנָה עַד שֶׁהִתְפַּלֵּל יִצְחָק עַל רִבְקָה?", "options": ["עֶשֶׂר עַד שֶׁרִבְקָה הָיְיתָה רְאוּיָה לְהֵרָיוֹן, וְעוֹד עֶשֶׂר כְּמוֹ אַבְרָהָם", "כִּי עֶשְׂרִים שָׁנָה הֵם הַזְּמַן שֶׁקָּבְעָה הַתּוֹרָה לְכָל אִשָּׁה", "כִּי חִיכָּה שֶׁרִבְקָה תִּתְפַּלֵּל בְּעַצְמָהּ תְּחִילָּה וְתֵיעָנֶה"], "kasha": "מדוע מציין הכתוב את גילו של יצחק בלידת בניו?", "answer": "עשר שנים משנשאה עד שנעשתה בת שלוש עשרה וראויה להריון, ועוד עשר שנים צפה והמתין לה, כמו שעשה אביו לשרה; וכיון שלא נתעברה, ידע שהיא עקרה והתפלל עליה.", "kp": ["י' שנים משנשאה עד שנעשית", "וי' שנים הללו צפה והמתין לה"]}, {"q": "מַדּוּעַ לֹא נָשָׂא יִצְחָק שִׁפְחָה, כְּמוֹ שֶׁעָשָׂה אַבְרָהָם?", "options": ["כִּי נִתְקַדֵּשׁ בְּהַר הַמּוֹרִיָּה לִהְיוֹת עוֹלָה תְמִימָה", "כִּי רִבְקָה לֹא הִסְכִּימָה לָתֵת לוֹ אֶת שִׁפְחָתָהּ", "כִּי רָאָה שֶׁהַשִּׁפְחָה גָּרְמָה צָרוֹת בְּבֵית אַבְרָהָם"], "kasha": "אברהם נשא את הגר כששרה לא ילדה; מדוע יצחק לא עשה כן?", "answer": "שפחה לא רצה לשאת, לפי שנתקדש בהר המוריה להיות עולה תמימה.", "kp": ["לפי שנתקדש בהר המוריה", "להיות עולה תמימה"]}]}, {"id": "25:27.1", "ch": 25, "v": 27, "n": 1, "dh": "ויגדלו הנערים", "pasuk_html": "<mark>וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים</mark> וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃", "pasuk_en": "וַיִּגְדְּלוּ הַנְּעָרִים וַיְהִי עֵשָׂו אִישׁ יֹדֵעַ צַיִד אִישׁ שָׂדֶה וְיַעֲקֹב אִישׁ תָּם יֹשֵׁב אֹהָלִים׃", "rashi_he": "ויגדלו … ויהי עשו. כָּל זְמַן שֶׁהָיוּ קְטַנִּים, לֹא הָיוּ נִכָּרִים בְּמַעֲשֵׂיהֶם, וְאֵין אָדָם מְדַקְדֵּק בָּהֶם מַה טִּיבָם; כֵּיוָן שֶׁנַּעֲשׂוּ בְנֵי שְׁלשׁ עֶשְׂרֵה שָׁנָה, זֶה פֵּרֵשׁ לְבָתֵּי מִדְרָשׁוֹת וְזֶה פֵּרֵשׁ לַעֲ\"זָ:", "rashi_en": "כל זמן שהיו קטנים לא היה ההבדל ביניהם ניכר. כשהגיעו לגיל שלוש עשרה, יעקב פנה לבתי המדרש ועשו פנה לעבודה זרה.", "note": "", "points": [{"q": "מָתַי הִתְגַּלָּה הַהֶבְדֵּל בֵּין יַעֲקֹב לְעֵשָׂו?", "options": ["כְּשֶׁהִגִּיעוּ לְגִיל שָׁלוֹשׁ עֶשְׂרֵה", "כְּבָר בַּיּוֹם שֶׁנּוֹלְדוּ", "בַּיּוֹם שֶׁמֵּת אַבְרָהָם סָבָם"], "kasha": "מדוע ההבדל בין האחים מתואר דווקא אחרי ״ויגדלו הנערים״?", "answer": "כל זמן שהיו קטנים לא היו ניכרים במעשיהם; כיון שנעשו בני שלוש עשרה, זה פרש לבתי מדרשות וזה פרש לעבודה זרה.", "kp": ["כיון שנעשו בני שלש עשרה שנה"]}]}, {"id": "25:27.2", "ch": 25, "v": 27, "n": 2, "dh": "ידע ציד", "pasuk_html": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ <mark>יֹדֵ֥עַ צַ֖יִד</mark> אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃", "pasuk_en": "וַיִּגְדְּלוּ הַנְּעָרִים וַיְהִי עֵשָׂו אִישׁ יֹדֵעַ צַיִד אִישׁ שָׂדֶה וְיַעֲקֹב אִישׁ תָּם יֹשֵׁב אֹהָלִים׃", "rashi_he": "ידע ציד. לָצוּד וּלְרַמּוֹת אֶת אָבִיו בְּפִיו וְשׁוֹאֲלוֹ אַבָּא, הַאֵיךְ מְעַשְּׂרִין אֶת הַמֶּלַח וְאֶת הַתֶּבֶן? כַּסָּבוּר אָבִיו שֶׁהוּא מְדַקְדֵּק בְּמִצְוֹת (תנחומא):", "rashi_en": "עשו ידע ״לצוד״ את אביו בדיבורו: הוא שאל שאלות כמו איך מעשרים מלח ותבן, ויצחק חשב שהוא מדקדק במצוות.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״יֹדֵעַ צַיִד״ לְפִי רַשִׁ״י?", "options": ["יָדַע לָצוּד וּלְרַמּוֹת אֶת אָבִיו בְּדִיבּוּרוֹ", "יָדַע לָצוּד חַיּוֹת וְעוֹפוֹת בְּקַשְׁתּוֹ", "יָדַע לְהָכִין מַטְעַמִּים מִן הַצַּיִד לְאָבִיו"], "kasha": "צייד חיות כבר מתואר ב״איש שדה״; מה מוסיף ״ידע ציד״?", "answer": "ידע לצוד ולרמות את אביו בפיו.", "kp": ["לצוד ולרמות את אביו בפיו"]}, {"q": "מָה רָצָה עֵשָׂו לְהַשִּׂיג בַּשְּׁאֵלָה ״הַאֵיךְ מְעַשְּׂרִין אֶת הַמֶּלַח וְאֶת הַתֶּבֶן״?", "options": ["שֶׁאָבִיו יַחְשֹׁוב שֶׁהוּא מְדַקְדֵּק בְּמִצְווֹת", "לִלְמוֹד בֶּאֱמֶת אֶת הִלְכוֹת הַמַּעַשְׂרוֹת", "לְהַקְשׁוֹת עַל אָבִיו וּלְהָבִיךְ אוֹתוֹ"], "kasha": "כיצד הצליח עשו לרמות את אביו בפיו?", "answer": "שאל את אביו איך מעשרים את המלח ואת התבן, וסבר אביו שהוא מדקדק במצוות.", "kp": ["כסבור אביו שהוא מדקדק במצות"]}]}, {"id": "25:27.3", "ch": 25, "v": 27, "n": 3, "dh": "איש שדה", "pasuk_html": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד <mark>אִ֣ישׁ שָׂדֶ֑ה</mark> וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃", "pasuk_en": "כַּאֲשֶׁר גָּדְלוּ הַנְּעָרִים, הָיָה עֵשָׂו אִישׁ יוֹדֵעַ צַיִד אִישׁ שָׂדֶה; וְיַעֲקֹב אִישׁ תָּם יוֹשֵׁב אֹהָלִים.", "rashi_he": "איש שדה. כְּמַשְׁמָעוֹ, אָדָם בָּטֵל וְצוֹדֶה בְקַשְׁתּוֹ חַיּוֹת וְעוֹפוֹת:", "rashi_en": "כפשוטו: אדם בטל, שצד בקשתו חיות ועופות.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״אִישׁ שָׂדֶה״ לְפִי רש״י?", "options": ["אָדָם בָּטֵל שֶׁצָּד בַּקָּשָׁתוֹ חַיּוֹת וְעוֹפוֹת", "חַקְלַאי שֶׁעוֹבֵד אֶת שָׂדוֹתָיו כָּל הַיּוֹם", "אָדָם שֶׁגָּר בַּשָּׂדוֹת, רָחוֹק מִן הָעִיר"], "kasha": "״איש שדה״ יכול להתפרש גם כעובד אדמה; מה כוונת הכתוב?", "answer": "כמשמעו: אדם בטל, וצד בקשתו חיות ועופות.", "kp": ["אדם בטל וצודה בקשתו חיות ועופות"]}]}, {"id": "25:27.4", "ch": 25, "v": 27, "n": 4, "dh": "תם", "pasuk_html": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ <mark>תָּ֔ם</mark> יֹשֵׁ֖ב אֹהָלִֽים׃", "pasuk_en": "כַּאֲשֶׁר גָּדְלוּ הַנְּעָרִים, הָיָה עֵשָׂו אִישׁ יוֹדֵעַ צַיִד אִישׁ שָׂדֶה; וְיַעֲקֹב אִישׁ תָּם יוֹשֵׁב אֹהָלִים.", "rashi_he": "תם. אֵינוֹ בָקִי בְכָל אֵלֶּה, כְּלִבּוֹ כֵּן פִּיו, מִי שֶׁאֵינוֹ חָרִיף לְרַמּוֹת קָרוּי תָּם:", "rashi_en": "יעקב לא היה בקי בכל הרמאויות האלה; מה שבליבו היה בפיו. מי שאינו חריף לרמות נקרא תם.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״תָּם״ אֵצֶל יַעֲקֹב?", "options": ["מִי שֶׁאֵינוֹ חָרִיף לְרַמּוֹת, וְכִלְבּוֹ כֵּן פִּיו", "מִי שֶׁאֵינוֹ מֵבִין דָּבָר וְאֵינוֹ יוֹדֵעַ לִלְמוֹד", "מִי שֶׁשָּׁלֵם בְּגוּפוֹ וְאֵין בּוֹ שׁוּם מוּם"], "kasha": "״תם״ בא כניגוד ל״ידע ציד״ של עשו; מה פירושו?", "answer": "אינו בקי בכל אלה; כלבו כן פיו, ומי שאינו חריף לרמות קרוי תם.", "kp": ["כלבו כן פיו", "מי שאינו חריף לרמות"]}]}, {"id": "25:27.5", "ch": 25, "v": 27, "n": 5, "dh": "יושב אהלים", "pasuk_html": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם <mark>יֹשֵׁ֖ב אֹהָלִֽים׃</mark>", "pasuk_en": "כַּאֲשֶׁר גָּדְלוּ הַנְּעָרִים, הָיָה עֵשָׂו אִישׁ יוֹדֵעַ צַיִד אִישׁ שָׂדֶה; וְיַעֲקֹב אִישׁ תָּם יוֹשֵׁב אֹהָלִים.", "rashi_he": "ישב אהלים. אָהֳלוֹ שֶׁל שֵׁם וְאָהֳלוֹ שֶׁל עֵבֶר:", "rashi_en": "״אהלים״ בלשון רבים: אוהלו של שם ואוהלו של עבר.", "note": "", "points": [{"q": "אִילּוּ אוֹהָלִים הֵם ה״אֹהָלִים״ שֶׁבָּהֶם יָשַׁב יַעֲקֹב?", "options": ["אוֹהֳלוֹ שֶׁל שֵׁם וְאוֹהֳלוֹ שֶׁל עֵבֶר", "אוֹהֳלוֹ שֶׁל אַבְרָהָם וְאוֹהֳלוֹ שֶׁל יִצְחָק", "אוֹהֶל אָבִיו וְאוֹהֶל אִמּוֹ"], "kasha": "מדוע נאמר ״אהלים״ בלשון רבים?", "answer": "אהלו של שם ואהלו של עבר.", "kp": ["אהלו של שם ואהלו של עבר"]}]}, {"id": "25:28.1", "ch": 25, "v": 28, "n": 1, "dh": "בפיו", "pasuk_html": "וַיֶּאֱהַ֥ב יִצְחָ֛ק אֶת־עֵשָׂ֖ו כִּי־צַ֣יִד <mark>בְּפִ֑יו</mark> וְרִבְקָ֖ה אֹהֶ֥בֶת אֶֽת־יַעֲקֹֽב׃", "pasuk_en": "וַיֶּאֱהַב יִצְחָק אֶת־עֵשָׂו כִּי־צַיִד בְּפִיו וְרִבְקָה אֹהֶבֶת אֶת־יַעֲקֹב", "rashi_he": "בפיו. כְּתַרְגּוּמוֹ בְּפִיו שֶׁל יִצְחָק. וּמִדְרָשׁוֹ בְּפִיו שֶׁל עֵשָׂו, שֶׁהָיָה צָד אוֹתוֹ וּמְרַמֵּהוּ בִדְבָרָיו:", "rashi_en": "לפי התרגום, הציד היה בפיו של יצחק, שאכל ממנו. לפי המדרש, הציד היה בפיו של עשו, שצד את אביו ורימה אותו בדבריו.", "note": "", "points": [{"q": "לְפִי הַתַּרְגּוּם, בְּפִיו שֶׁל מִי הָיָה הַצַּיִד?", "options": ["בְּפִיו שֶׁל יִצְחָק, שֶׁאָכַל מִן הַצַּיִד", "בְּפִיו שֶׁל עֵשָׂו, שֶׁרִימָּה אֶת אָבִיו בִּדְבָרָיו", "בְּפִיו שֶׁל יַעֲקֹב, שֶׁבִּישֵּׁל אֶת הַתַּבְשִׁיל"], "kasha": "המילה ״בפיו״ אינה מפרשת בפיו של מי מדובר.", "answer": "כתרגומו: בפיו של יצחק.", "kp": ["כתרגומו בפיו של יצחק"]}, {"q": "לְפִי הַמִּדְרָשׁ, מַה פֵּירוּשׁ ״כִּי־צַיִד בְּפִיו״?", "options": ["עֵשָׂו צָד אֶת אָבִיו וְרִימָּה אוֹתוֹ בִּדְבָרָיו", "יִצְחָק אָהַב לֶאֱכוֹל מַטְעַמִּים מִן הַצַּיִד", "עֵשָׂו הָיָה מְסַפֵּר לְאָבִיו עַל הַצֵּידִים שֶׁלּוֹ"], "kasha": "המילה ״בפיו״ אינה מפרשת בפיו של מי מדובר.", "answer": "בפיו של עשו, שהיה צד את אביו ומרמה אותו בדבריו.", "kp": ["שהיה צד אותו ומרמהו בדבריו"]}]}, {"id": "25:29.1", "ch": 25, "v": 29, "n": 1, "dh": "ויזד", "pasuk_html": "<mark>וַיָּ֥זֶד</mark> יַעֲקֹ֖ב נָזִ֑יד וַיָּבֹ֥א עֵשָׂ֛ו מִן־הַשָּׂדֶ֖ה וְה֥וּא עָיֵֽף׃", "pasuk_en": "וְיַעֲקֹב בִּישֵׁל נָזִיד וַיָּבֹא עֵשָׂו מִן־הַשָּׂדֶה וְהוּא עָיֵף.", "rashi_he": "ויזד. לְשׁוֹן בִּשּׁוּל, כְּתַרְגּוּמוֹ:", "rashi_en": "״ויזד״ פירושו בישל, כמו שתרגם אונקלוס.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָה ״וַיָּזֶד״?", "options": ["לְשׁוֹן בִּישּׁוּל: יַעֲקֹב בִּישֵּׁל תַּבְשִׁיל", "לְשׁוֹן זָדוֹן: יַעֲקֹב עָשָׂה מַעֲשֵׂה רֶשַׁע", "לְשׁוֹן הֲכָנָה: יַעֲקֹב הֵכִין לֶחֶם"], "kasha": "״ויזד״ היא מילה נדירה ואינה ברורה.", "answer": "לשון בישול, כתרגומו.", "kp": ["לשון בשול"]}]}, {"id": "25:29.2", "ch": 25, "v": 29, "n": 2, "dh": "והוא עיף", "pasuk_html": "וַיָּ֥זֶד יַעֲקֹ֖ב נָזִ֑יד וַיָּבֹ֥א עֵשָׂ֛ו מִן־הַשָּׂדֶ֖ה <mark>וְה֥וּא עָיֵֽף׃</mark>", "pasuk_en": "וַעֲטָרוּ וַיָּבוֹא עֵשָׂו מִן־הַשָּׂדֶה וְהוּא עָיֵף.", "rashi_he": "והוא עיף. בִּרְצִיחָה, כְּמָה דְּתֵימָא כִּי עָיְפָה נַפְשִׁי לְהֹרְגִים (ירמיהו ד') (בראשית רבה):", "rashi_en": "עשו היה עייף מרציחה, כמו בפסוק ״כי עיפה נפשי להרגים״.", "note": "", "points": [{"q": "מִמָּה הָיָה עֵשָׂו עָיֵיף, לְפִי רש״י?", "options": ["מֵרְצִיחָה, כְּמוֹ ״כִּי עָיְפָה נַפְשִׁי לְהֹרְגִים״", "מִצֵּידַת חַיּוֹת וְעוֹפוֹת בַּשָּׂדֶה כָּל הַיּוֹם", "מֵעֲבוֹדַת הַשָּׂדֶה וּמֵחוֹם הַשֶּׁמֶשׁ"], "kasha": "מדוע מספר הכתוב שעשו היה עייף, וממה?", "answer": "עייף ברציחה, כמו שנאמר ״כי עיפה נפשי להרגים״.", "kp": ["ברציחה", "כי עיפה נפשי להרגים"]}]}, {"id": "25:30.1", "ch": 25, "v": 30, "n": 1, "dh": "הלעיטני", "pasuk_html": "וַיֹּ֨אמֶר עֵשָׂ֜ו אֶֽל־יַעֲקֹ֗ב <mark>הַלְעִיטֵ֤נִי</mark> נָא֙ מִן־הָאָדֹ֤ם הָאָדֹם֙ הַזֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל־כֵּ֥ן קָרָֽא־שְׁמ֖וֹ אֱדֽוֹם׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו אֶל־יַעֲקֹב הַלְעִיטֵנִי נָא מִן־הָאָדֹם הַזֶּה כִּי עָיֵף אָנוֹכִי.", "rashi_he": "הלעיטני. אֶפְתַּח פִּי וּשְׁפֹךְ הַרְבֵּה לְתוֹכָהּ, כְּמוֹ שֶׁשָּׁנִינוּ אֵין אוֹבְסִין אֶת הַגָּמָל אֲבָל מַלְעִיטִין אוֹתוֹ:", "rashi_en": "עשו אמר: אפתח את פי ותשפוך לתוכו הרבה, כמו שמלעיטים גמל.", "note": "", "points": [{"q": "מָה בִּיקֵּשׁ עֵשָׂו בַּמִּילָּה ״הַלְעִיטֵנִי״?", "options": ["שֶׁיִּפְתַּח אֶת פִּיו וְיַעֲקֹב יִשְׁפּוֹךְ לְתוֹכוֹ הַרְבֵּה", "שֶׁיַּעֲקֹב יִיתֵּן לוֹ לִטְעוֹם מְעַט מִן הַתַּבְשִׁיל", "שֶׁיַּעֲקֹב יִמְכּוֹר לוֹ אֶת הַתַּבְשִׁיל בְּכֶסֶף"], "kasha": "מדוע לא אמר עשו ״האכילני״, אלא השתמש במילה ״הלעיטני״?", "answer": "אפתח פי ושפוך הרבה לתוכו, כמו ששנינו ״אין אובסין את הגמל אבל מלעיטין אותו״.", "kp": ["אפתח פי ושפך הרבה לתוכה"]}]}, {"id": "25:30.2", "ch": 25, "v": 30, "n": 2, "dh": "מן האדם האדם", "pasuk_html": "וַיֹּ֨אמֶר עֵשָׂ֜ו אֶֽל־יַעֲקֹ֗ב הַלְעִיטֵ֤נִי נָא֙ <mark>מִן־הָאָדֹ֤ם הָאָדֹם֙</mark> הַזֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל־כֵּ֥ן קָרָֽא־שְׁמ֖וֹ אֱדֽוֹם׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו אֶל־יַעֲקֹב הַלְעִיטֵנִי נָא מִן־הָאָדֹם הַזֶּה כִּי עָיֵף אָנוֹכִי.", "rashi_he": "מן האדם האדם. עֲדָשִׁים אֲדֻמּוֹת, וְאוֹתוֹ הַיּוֹם מֵת אַבְרָהָם, שֶׁלֹּא יִרְאֶה אֶת עֵשָׂו בֶּן בְּנוֹ יוֹצֵא לְתַרְבּוּת רָעָה, וְאֵין זוֹ שֵׂיבָה טוֹבָה שֶׁהִבְטִיחוֹ הַקָּבָּ\"ה; לְפִיכָךְ קִצֵּר הַקָּבָּ\"ה ה' שָׁנִים מִשְּׁנוֹתָיו, שֶׁיִּצְחָק חַי ק\"פ שָׁנָה וְזֶה קע\"ה, וּבִשֵּׁל יַעֲקֹב עֲדָשִׁים לְהַבְרוֹת אֶת הָאָבֵל. וְלָמָּה עֲדָשִׁים? שֶׁדּוֹמוֹת לְגַלְגַּל, שֶׁהָאֲבֵלוּת גַּלְגַּל הַחוֹזֵר בָּעוֹלָם (וְעוֹד מָה עֲדָשִׁים אֵין לָהֶם פֶּה, כָּךְ הָאָבֵל אֵין לוֹ פֶה, שֶׁאָסוּר לְדַבֵּר, וּלְפִיכָךְ הַמִּנְהָג לְהַבְרוֹת הָאָבֵל בִּתְחִלַּת מַאֲכָלוֹ בֵּיצִים, שֶׁהֵם עֲגֻלִּים וְאֵין לָהֶם פֶּה, כָּךְ אָבֵל אֵין לוֹ פֶה, כִּדְאָמְרִינַן בְּמוֹעֵד קָטָן (מועד קטן כא:) אָבֵל כָּל שְׁלֹשָׁה יָמִים הָרִאשׁוֹנִים אֵינוֹ מֵשִׁיב שָׁלוֹם לְכָל אָדָם וְכָ\"שֶׁ שֶׁאֵינוֹ שׁוֹאֵל בַּתְּחִלָּה, מִג' וְעַד ז' מֵשִׁיב וְאֵינוֹ שׁוֹאֵל וְכוּ'; בְּרַשִׁ\"י יָשָׁן):", "rashi_en": "מדובר בעדשים אדומות. באותו יום מת אברהם, חמש שנים לפני זמנו, כדי שלא יראה את עשו יוצא לתרבות רעה. יעקב בישל עדשים לסעודת הבראה לאבל, כי הן עגולות כגלגל, והאבלות היא גלגל החוזר בעולם.", "note": "", "points": [{"q": "מַדּוּעַ קִיצֵּר הַקָּב״ה חָמֵשׁ שָׁנִים מִשְּׁנוֹת אַבְרָהָם?", "options": ["שֶׁלֹּא יִרְאֶה אֶת עֵשָׂו נֶכְדּוֹ יוֹצֵא לְתַרְבּוּת רָעָה", "כִּי נֶחֱלַשׁ מִצַּעֲרוֹ עַל מוֹת שָׂרָה אִשְׁתּוֹ", "כְּדֵי שֶׁיִּצְחָק יִירַשׁ אֶת מְקוֹמוֹ בְּעוֹד מוֹעֵד"], "kasha": "מה היה מיוחד באותו יום, שיעקב בישל בו עדשים?", "answer": "באותו יום מת אברהם, שלא יראה את עשו יוצא לתרבות רעה, ואין זו שיבה טובה שהבטיחו הקב״ה; לכן קיצר חמש שנים משנותיו: יצחק חי מאה ושמונים שנה, ואברהם מאה שבעים וחמש.", "kp": ["שלא יראה את עשו בן בנו", "יוצא לתרבות רעה"]}, {"q": "מַדּוּעַ מַבְרִיאִים אֶת הָאָבֵל דַּוְוקָא בַּעֲדָשִׁים?", "options": ["כִּי הֵן עֲגוּלּוֹת כְּגַלְגַּל, וְהָאֲבֵלוּת גַּלְגַּל הַחוֹזֵר בָּעוֹלָם", "כִּי הֵן אֲדוּמּוֹת, כְּצֶבַע הַדָּם וְהַמָּוֶות", "כִּי הֵן מַאֲכָל פָּשׁוּט וְזוֹל, כָּרָאוּי לָאָבֵל"], "kasha": "מדוע בישל יעקב דווקא עדשים לסעודת האבל?", "answer": "שדומות לגלגל, שהאבלות גלגל החוזר בעולם; ועוד, מה עדשים אין להן פה, כך האבל אין לו פה, שאסור לו לדבר.", "kp": ["שדומות לגלגל", "שהאבלות גלגל החוזר בעולם"]}]}, {"id": "25:31.1", "ch": 25, "v": 31, "n": 1, "dh": "מכרה כיום", "pasuk_html": "וַיֹּ֖אמֶר יַעֲקֹ֑ב <mark>מִכְרָ֥ה כַיּ֛וֹם</mark> אֶת־בְּכֹרָתְךָ֖ לִֽי׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב הִמְכְּרָה לִי אֶת־בְּכוֹרָתְךָ כַּיּוֹם.", "rashi_he": "מכרה כיום. כְּתַרְגּוּמוֹ כְּיוֹם דִּלְהֵן, כַּיּוֹם שֶׁהוּא בָרוּר, כָךְ מְכֹר לִי מְכִירָה בְרוּרָה:", "rashi_en": "כמו שהיום ברור וודאי, כך תמכור לי את הבכורה מכירה ברורה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״כַיּוֹם״ בְּדִבְרֵי יַעֲקֹב?", "options": ["כְּמוֹ שֶׁהַיּוֹם בָּרוּר, כָּךְ תִּהְיֶה הַמְּכִירָה בְּרוּרָה", "מְכוֹר לִי מִיָּד, הַיּוֹם, בְּלִי לִדְחוֹת", "מִכוֹר לִי כְּמוֹ שֶׁמּוֹכְרִים בְּיוֹם הַשּׁוּק"], "kasha": "מה פירוש כ״ף הדמיון במילה ״כיום״?", "answer": "כתרגומו ״כיום דלהן״: כיום שהוא ברור, כך מכור לי מכירה ברורה.", "kp": ["כיום שהוא ברור", "כך מכר לי מכירה ברורה"]}]}, {"id": "25:31.2", "ch": 25, "v": 31, "n": 2, "dh": "בכרתך", "pasuk_html": "וַיֹּ֖אמֶר יַעֲקֹ֑ב מִכְרָ֥ה כַיּ֛וֹם אֶת־<mark>בְּכֹרָתְךָ֖</mark> לִֽי׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב הִמְכְּרָה לִי אֶת־בְּכוֹרָתְךָ כַּיּוֹם.", "rashi_he": "בכרתך. לְפִי שֶׁהָעֲבוֹדָה בַּבְּכוֹרוֹת, אָמַר יַעֲקֹב אֵין רָשָׁע זֶה כְדַאי שֶׁיַּקְרִיב לְהַקָּבָּ\"ה:", "rashi_en": "באותו זמן עבודת הקרבנות הייתה בבכורות, ויעקב אמר שרשע כעשו אינו ראוי להקריב לקב״ה.", "note": "", "points": [{"q": "מַדּוּעַ רָצָה יַעֲקֹב לִקְנוֹת אֶת הַבְּכוֹרָה?", "options": ["שֶׁעֵשָׂו הָרָשָׁע לֹא יַקְרִיב קָרְבָּנוֹת לִפְנֵי הַקָּבָּ״ה", "כְּדֵי לְקַבֵּל פִּי שְׁנַיִים בִּירוּשַּׁת אָבִיו", "כְּדֵי שֶׁיּוּכַל לִשְׁלוֹט עַל אָחִיו בֶּעָתִיד"], "kasha": "מה ראה יעקב לבקש דווקא את הבכורה?", "answer": "לפי שהעבודה בבכורות, אמר יעקב: אין רשע זה כדאי שיקריב להקב״ה.", "kp": ["אין רשע זה כדאי שיקריב להקב\"ה"]}]}, {"id": "25:32.1", "ch": 25, "v": 32, "n": 1, "dh": "הנה אנכי הולך למות", "pasuk_html": "וַיֹּ֣אמֶר עֵשָׂ֔ו <mark>הִנֵּ֛ה אָנֹכִ֥י הוֹלֵ֖ךְ לָמ֑וּת</mark> וְלָמָּה־זֶּ֥ה לִ֖י בְּכֹרָֽה׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו הִנִּי הוֹלֵךְ לָמוּת וְלָמָּה זֶּה לִי בְכוֹרָה?", "rashi_he": "הנה אנכי הולך למות. (מִתְנוֹדֶדֶת וְהוֹלֶכֶת הִיא הַבְּכוֹרָה שֶׁלֹּא תְהֵא כָל עֵת הָעֲבוֹדָה בַּבְּכוֹרוֹת, כִּי שֵׁבֶט לֵוִי יִטֹּל אוֹתָהּ, וְעוֹד) אָמַר עֵשָׂו: מַה טִּיבָהּ שֶׁל עֲבוֹדָה זוֹ? אָמַר לוֹ: כַּמָּה אַזְהָרוֹת וָעֳנָשִׁין וּמִיתוֹת תְּלוּיִין בָּהּ כְּאוֹתָהּ שֶׁשָּׁנִינוּ, אֵלּוּ הֵן שֶׁבְּמִיתָה: שְׁתוּיֵי יַיִן וּפְרוּעֵי רֹאשׁ; אָמַר: אֲנִי הוֹלֵךְ לָמוּת עַל יָדָהּ, אִם כֵּן מַה חֵפֶץ לִי בָהּ?", "rashi_en": "עשו שאל מה טיבה של העבודה, ויעקב אמר לו שתלויים בה אזהרות, עונשים ומיתות, כגון שתויי יין ופרועי ראש. אמר עשו: אם אמות בגללה, מה חפץ לי בה? ועוד, הבכורה אינה יציבה, כי שבט לוי עתיד ליטול את העבודה.", "note": "", "points": [{"q": "מָה הַקֶּשֶׁר בֵּין ״הוֹלֵךְ לָמוּת״ לְבֵין הַבְּכוֹרָה?", "options": ["בַּעֲבוֹדַת הַבְּכוֹרָה תְּלוּיוֹת מִיתוֹת, וְעֵשָׂו חָשַׁשׁ לָמוּת בִּגְלָלָהּ", "עֵשָׂו הָיָה רָעֵב מְאוֹד וְחָשַׁב שֶׁיָּמוּת מֵרָעָב", "עֵשָׂו חָשַׁב שֶׁיָּמוּת לִפְנֵי אָבִיו וְלֹא יִירַשׁ"], "kasha": "מה עניין מיתתו של עשו למכירת הבכורה?", "answer": "יעקב אמר לו שכמה אזהרות ועונשים ומיתות תלויים בעבודה, כגון שתויי יין ופרועי ראש; אמר עשו: אני הולך למות על ידה, ואם כן מה חפץ לי בה?", "kp": ["כמה אזהרות וענשין ומיתות תלויין בה", "אני הולך למות על ידה"]}, {"q": "מַדּוּעַ הַבְּכוֹרָה ״מִתְנוֹדֶדֶת וְהוֹלֶכֶת״?", "options": ["כִּי שֵׁבֶט לֵוִי עָתִיד לִיטּוֹל אֶת הָעֲבוֹדָה מִן הַבְּכוֹרוֹת", "כִּי הִיא שַׁיָּיכֶת מִמֵּילָא לְיַעֲקֹב, שֶׁנּוֹצַר רִאשׁוֹן", "כִּי אֵין בָּהּ מָמוֹן, וְלָכֵן אֵינָהּ שָׁווֶה דָּבָר"], "kasha": "מדוע זלזל עשו בבכורה?", "answer": "מתנודדת והולכת היא הבכורה, שלא תהיה כל הזמן העבודה בבכורות, כי שבט לוי ייטול אותה.", "kp": ["כי שבט לוי יטל אותה"]}]}, {"id": "25:34.1", "ch": 25, "v": 34, "n": 1, "dh": "ויבז עשו", "pasuk_html": "וְיַעֲקֹ֞ב נָתַ֣ן לְעֵשָׂ֗ו לֶ֚חֶם וּנְזִ֣יד עֲדָשִׁ֔ים וַיֹּ֣אכַל וַיֵּ֔שְׁתְּ וַיָּ֖קׇם וַיֵּלַ֑ךְ <mark>וַיִּ֥בֶז עֵשָׂ֖ו</mark> אֶת־הַבְּכֹרָֽה׃&nbsp;{פ}", "pasuk_en": "וַיִּתֵּן יַעֲקֹב לְעֵשָׂו לֶחֶם וּנְזִיד עֲדָשִׁים וַיֹּאכַל וַיִּשְׁתְּ וַיָּקָם וַיֵּלַךְ וַיִּבֶז עֵשָׂו אֶת־הַבְּכוֹרָה.", "rashi_he": "ויבז עשו. הֵעִיד הַכָּתוּב עַל רִשְׁעוֹ שֶׁבִּזָּה עֲבוֹדָתוֹ שֶׁל מָקוֹם:", "rashi_en": "הכתוב מעיד על רשעו של עשו, שזלזל בעבודת ה׳.", "note": "", "points": [{"q": "מָה בָּא הַכָּתוּב לְלַמֵּד בְּמִילִּים ״וַיִּבֶז עֵשָׂו״?", "options": ["לְהָעִיד עַל רִשְׁעוֹ, שֶׁבָּזָה לַעֲבוֹדַת הַמָּקוֹם", "לְסַפֵּר שֶׁעֵשָׂו הִתְחָרֵט מִיָּד עַל הַמְּכִירָה", "לְלַמֵּד שֶׁיַּעֲקֹב רִימָּה אֶת עֵשָׂו בַּמְּכִירָה"], "kasha": "הסיפור כבר הסתיים; מדוע מוסיף הכתוב ״ויבז עשו את הבכורה״?", "answer": "העיד הכתוב על רשעו, שבזה לעבודתו של מקום.", "kp": ["העיד הכתוב על רשעו", "שבזה עבודתו של מקום"]}]}, {"id": "26:2.1", "ch": 26, "v": 2, "n": 1, "dh": "אל תרד מצרימה", "pasuk_html": "וַיֵּרָ֤א אֵלָיו֙ יְהֹוָ֔ה וַיֹּ֖אמֶר <mark>אַל־תֵּרֵ֣ד מִצְרָ֑יְמָה</mark> שְׁכֹ֣ן בָּאָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "וַיֵּרָא אֵלָיו ה' וַיֹּאמֶר אַל־תֵּרֶד מִצְרַיְמָה שְׁכֹּן בָּאָרֶץ אֲשֶׁר אוֹמַר אֵלֶיךָ.", "rashi_he": "אל תרד מצרימה. שֶׁהָיָה דַּעְתּוֹ לָרֶדֶת מִצְרַיְמָה, כְּמוֹ שֶׁיָּרַד אָבִיו בִּימֵי הָרָעָב; אָמַר לוֹ: אַל תֵּרֵד מִצְרָיְמָה, שֶׁאַתָּה עוֹלָה תְמִימָה, וְאֵין חוּצָה לָאָרֶץ כְּדַאי לְךָ:", "rashi_en": "יצחק חשב לרדת למצרים כמו שירד אביו בימי הרעב. ה׳ אמר לו שלא ירד, כי הוא עולה תמימה ואין חוץ לארץ ראויה לו.", "note": "", "points": [{"q": "מַדּוּעַ אָמַר ה׳ לְיִצְחָק שֶׁלֹּא יֵרֵד לְמִצְרַיִם?", "options": ["כִּי הוּא עוֹלָה תְמִימָה, וְאֵין חוּץ לָאָרֶץ כְּדַאי לוֹ", "כִּי הַמִּצְרִים עֲלוּלִים לָקַחַת מִמֶּנּוּ אֶת רִבְקָה", "כִּי הָרָעָב בְּמִצְרַיִם הָיָה קָשֶׁה מִן הָרָעָב בִּכְנַעַן"], "kasha": "לא נאמר שיצחק רצה לרדת למצרים; מדוע נאמר לו ״אל תרד״?", "answer": "שהיה בדעתו לרדת מצרימה כמו שירד אביו בימי הרעב; אמר לו: אל תרד, שאתה עולה תמימה ואין חוץ לארץ כדאי לך.", "kp": ["שאתה עולה תמימה", "ואין חוצה לארץ כדאי לך"]}]}, {"id": "26:3.1", "ch": 26, "v": 3, "n": 1, "dh": "האל", "pasuk_html": "גּ֚וּר בָּאָ֣רֶץ הַזֹּ֔את וְאֶֽהְיֶ֥ה עִמְּךָ֖ וַאֲבָרְכֶ֑ךָּ כִּֽי־לְךָ֣ וּֽלְזַרְעֲךָ֗ אֶתֵּן֙ אֶת־כׇּל־הָֽאֲרָצֹ֣ת <mark>הָאֵ֔ל</mark> וַהֲקִֽמֹתִי֙ אֶת־הַשְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְאַבְרָהָ֥ם אָבִֽיךָ׃", "pasuk_en": "שְׁכֹּן בָּאָרֶץ הַזֹּאת וְאֶהְיֶה עִמְּךָ וַאֲבָרְכְךָ כִּי לְךָ וּלְזַרְעֲךָ אֶתֵּן אֶת־כָּל־הָאָרְצוֹת הָאֵלּ וַהֲקִמֹתִי אֶת־הַשְּׁבוּעָה אֲשֶׁר נִשְׁמַרְתִּי לְאַבְרָהָם אָבִיךָ.", "rashi_he": "האל. כְּמוֹ הָאֵלֶּה:", "rashi_en": "״האל״ כאן פירושו ״האלה״: הארצות האלה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָּה ״הָאֵל״ בַּפָּסוּק?", "options": ["כְּמוֹ ״הָאֵלֶּה״: הָאֲרָצוֹת הָאֵלֶּה", "שֵׁם שֶׁל הַקָּבָּ״ה: ״הָאֵל״", "לְשׁוֹן אָלָה וּשְׁבוּעָה"], "kasha": "״האל״ נראה כשם ה׳, אבל אין זה מתאים להקשר ״כל הארצות האל״.", "answer": "האל כמו האלה.", "kp": ["כמו האלה"]}]}, {"id": "26:4.1", "ch": 26, "v": 4, "n": 1, "dh": "והתברכו בזרעך", "pasuk_html": "וְהִרְבֵּיתִ֤י אֶֽת־זַרְעֲךָ֙ כְּכוֹכְבֵ֣י הַשָּׁמַ֔יִם וְנָתַתִּ֣י לְזַרְעֲךָ֔ אֵ֥ת כׇּל־הָאֲרָצֹ֖ת הָאֵ֑ל <mark>וְהִתְבָּרְכ֣וּ בְזַרְעֲךָ֔</mark> כֹּ֖ל גּוֹיֵ֥י הָאָֽרֶץ׃", "pasuk_en": "וְהַרְבֵּיתִי אֶת־זַרְעֲךָ כְּכוֹכְבֵי הַשָּׁמַיִם וְנָתַתִּי לְזַרְעֲךָ אֶת־כָּל־הָאָרְצוֹת הָאֵלּ וְנִשְׁמְּרוּ בְּזַרְעֲךָ כָּל־גּוֹיֵי הָאָרֶץ.", "rashi_he": "והתברכו בזרעך. אָדָם אוֹמֵר לִבְנוֹ יְהֵא זַרְעֲךָ כְּזַרְעוֹ שֶׁל יִצְחָק, וְכֵן בְּכָל הַמִּקְרָא, וְזֶה אָב לְכֻלָּן בְּךָ יְבָרֵךְ יִשְׂרָאֵל לֵאמֹר יְשִׂמְךָ וְגוֹ' (בראשית מ״ח:כ׳); וְאַף לְעִנְיַן הַקְּלָלָה מָצִינוּ כֵן וְהָיְתָה הָאִשָּׁה לְאָלָה (במדבר ה'), שֶׁהַמְקַלֵּל שׂוֹנְאוֹ אוֹמֵר תְּהֵא כִּפְלוֹנִית, וְכֵן וְהִנַּחְתֶּם שִׁמְכֶם לִשְׁבוּעָה לִבְחִירַי (ישעיהו ס\"ה), שֶׁהַנִּשְׁבָּע אוֹמֵר אֱהֵא כִפְלוֹנִי אִם עָשִׂיתִי כָּךְ וְכָךְ:", "rashi_en": "אדם יברך את בנו: ״יהא זרעך כזרעו של יצחק״. כך פירוש לשון זו בכל המקרא, והמקור לכך הוא ״בך יברך ישראל לאמר ישמך וגו׳״. וכן בקללה ובשבועה: אומרים ״תהא כפלונית״ או ״אהא כפלוני״.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״וְהִתְבָּרְכוּ בְזַרְעֲךָ כׇּל גּוֹיֵי הָאָרֶץ״?", "options": ["אָדָם יְבָרֵךְ אֶת בְּנוֹ: יְהֵא זַרְעֲךָ כְּזַרְעוֹ שֶׁל יִצְחָק", "כָּל הַגּוֹיִים יְקַבְּלוּ בְּרָכָה בִּזְכוּת זֶרַע יִצְחָק", "זֶרַע יִצְחָק עַצְמוֹ יְבָרֵךְ אֶת כָּל הַגּוֹיִים"], "kasha": "מה פירוש שהגויים ״יתברכו״ בזרעו של יצחק?", "answer": "אדם אומר לבנו: יהא זרעך כזרעו של יצחק; וכן בכל המקרא, והאב לכולן הוא ״בך יברך ישראל לאמר ישמך וגו׳״.", "kp": ["אדם אומר לבנו יהא זרעך", "כזרעו של יצחק"]}, {"q": "כֵּיצַד מִתְפָּרֵשׁ ״וְהָיְתָה הָאִשָּׁה לְאָלָה״ לְפִי אוֹתוֹ כְּלָל?", "options": ["הַמְקַלֵּל אֶת שׂוֹנְאוֹ אוֹמֵר לוֹ: תְּהֵא כְּפְלוֹנִית", "הָאִשָּׁה עַצְמָהּ תְּקַלֵּל אֶת כָּל מִי שֶׁפּוֹגֵעַ בָּהּ", "הָאִשָּׁה תִּישָּׁבַע שְׁבוּעָה לִפְנֵי הַכֹּהֵן"], "kasha": "האם הכלל הזה נוהג רק בברכה, או גם בקללה ובשבועה?", "answer": "גם בקללה מצינו כן: המקלל את שונאו אומר ״תהא כפלונית״; וכן בשבועה, הנשבע אומר ״אהא כפלוני אם עשיתי כך וכך״.", "kp": ["שהמקלל שונאו אומר תהא כפלונית"]}]}, {"id": "26:5.1", "ch": 26, "v": 5, "n": 1, "dh": "שמע אברהם בקולי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־<mark>שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י</mark> וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י מִצְוֺתַ֖י חֻקּוֹתַ֥י וְתוֹרֹתָֽי׃", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "שמע אברהם בקולי. כְּשֶׁנִּסִּיתִי אוֹתוֹ:", "rashi_en": "אברהם שמע בקול ה׳ כשה׳ ניסה אותו.", "note": "", "points": [{"q": "מָתַי ״שָׁמַע אַבְרָהָם בְּקוֹלִי״, לְפִי רַשִׁ״י?", "options": ["כְּשֶׁנִּיסָּה אוֹתוֹ הַקָּבָּ״ה", "כְּשֶׁהִתְפַּלֵּל לִפְנֵי ה׳ עַל אַנְשֵׁי סְדוֹם", "כְּשֶׁקִּיבֵּל אֶת דִּבְרֵי שָׂרָה לְגָרֵשׁ אֶת הָגָר"], "kasha": "על איזו שמיעה בקול ה׳ מדובר כאן?", "answer": "כשנסיתי אותו.", "kp": ["כשנסיתי אותו"]}]}, {"id": "26:5.2", "ch": 26, "v": 5, "n": 2, "dh": "וישמר משמרתי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י <mark>וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י</mark> מִצְוֺתַ֖י חֻקּוֹתַ֥י וְתוֹרֹתָֽי׃", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "וישמר משמרתי. גְּזֵרוֹת לְהַרְחָקָה עַל הָאַזְהָרוֹת שֶׁבַּתּוֹרָה, כְּגוֹן שְׁנִיּוֹת לָעֲרָיוֹת וּשְׁבוּת לַשַּׁבָּת (יבמות כ\"א):", "rashi_en": "״משמרתי״ הן גזרות שנועדו להרחיק את האדם מעבירה על איסורי התורה, כגון שניות לעריות ואיסורי שבות בשבת.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, לָמָּה מְכוּוָּנוֹת הַמִּילִים ״וַיִּשְׁמֹר מִשְׁמַרְתִּי״?", "options": ["לִגְזֵרוֹת לְהַרְחָקָה מֵאִיסּוּרֵי הַתּוֹרָה, כְּגוֹן שְׁנִיּוֹת לָעֲרָיוֹת וּשְׁבוּת", "לְמִצְווֹת שֶׁהַשֵּׂכֶל מְחַיֵּיב אוֹתָן, כְּגוֹן אִיסּוּר גֶּזֶל וּרְצִיחָה", "לְחֻוקִּים שֶׁאֵין לָהֶם טַעַם, כְּגוֹן אִיסּוּר חֲזִיר וְשַׁעַטְנֵז"], "kasha": "הפסוק מונה כמה סוגי מצוות, ויש להבין מה מיוחד ב״משמרתי״ ומה הוא כולל.", "answer": "״משמרתי״ הן גזרות להרחקה על האזהרות שבתורה, כגון שניות לעריות ושבות לשבת.", "kp": ["גזרות להרחקה על האזהרות שבתורה", "כגון שניות לעריות ושבות לשבת"]}]}, {"id": "26:5.3", "ch": 26, "v": 5, "n": 3, "dh": "מצותי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י <mark>מִצְוֺתַ֖י</mark> חֻקּוֹתַ֥י וְתוֹרֹתָֽי׃", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "מצותי. דְּבָרִים שֶׁאִלּוּ לֹא נִכְתְּבוּ רְאוּיִן הֵם לְהִצְטַוּוֹת, כְּגוֹן גֶּזֶל וּשְׁפִיכוּת דָּמִים:", "rashi_en": "״מצותי״ הן מצוות שגם אילו לא נכתבו בתורה היה ראוי שיצטוו עליהן, כמו איסור גזל ושפיכות דמים.", "note": "", "points": [{"q": "אֵילּוּ מִצְווֹת כְּלוּלוֹת לְפִי רַשִׁ״י בַּמִּילָה ״מִצְוֺתַי״?", "options": ["מִצְווֹת שֶׁרָאוּי הָיָה לְצַוּוֹת עֲלֵיהֶן גַּם אִילּוּ לֹא נִכְתְּבוּ, כְּגוֹן גָּזֵל וְרֶצַח", "גְּזֵרוֹת שֶׁנּוֹעֲדוּ לְהַרְחִיק אֶת הָאָדָם מֵאִיסּוּרֵי הַתּוֹרָה", "הֲלָכוֹת שֶׁנִּמְסְרוּ בְּעַל פֶּה לְמֹשֶׁה מִסִּינַי"], "kasha": "הפסוק מונה ״מצותי״ לצד ״חקותי״ ו״תורתי״, ויש להבין מה ההבדל ביניהם.", "answer": "״מצותי״ הם דברים שאילו לא נכתבו ראויים הם להצטוות, כגון גזל ושפיכות דמים.", "kp": ["דברים שאלו לא נכתבו", "ראוין הם להצטוות", "כגון גזל ושפיכות דמים"]}]}, {"id": "26:5.4", "ch": 26, "v": 5, "n": 4, "dh": "חקותי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י מִצְוֺתַ֖י <mark>חֻקּוֹתַ֥י</mark> וְתוֹרֹתָֽי׃", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "חקותי. דְּבָרִים שֶׁיֵּצֶר הָרָע וְאֻמּוֹת הָעוֹלָם מְשִׁיבִין עֲלֵיהֶם, כְּגוֹן אֲכִילַת חֲזִיר וּלְבִישַׁת שַׁעַטְנֵז, שֶׁאֵין טַעַם בַּדָּבָר, אֶלָּא גְּזֵרַת הַמֶּלֶךְ וְחֻקּוֹתָיו עַל עֲבָדָיו:", "rashi_en": "״חקותי״ הן מצוות שאין להן טעם גלוי, כמו איסור חזיר ושעטנז, ולכן יצר הרע ואומות העולם מקשים עליהן; אבל הן גזרת המלך על עבדיו.", "note": "", "points": [{"q": "מָה מְאַפְיֵין אֶת הַמִּצְווֹת הַנִּקְרָאוֹת ״חֻקּוֹתַי״?", "options": ["אֵין לָהֶן טַעַם גָּלוּי, וְיֵצֶר הָרָע וְהַגּוֹיִים מְקַשִּׁים עֲלֵיהֶן", "הַשֵּׂכֶל מְחַיֵּיב אוֹתָן גַּם אִילּוּ לֹא נִכְתְּבוּ בַּתּוֹרָה", "הֵן גְּזֵרוֹת שֶׁנּוֹעֲדוּ לְהַרְחִיק מֵעֲבֵירָה עַל אִיסּוּרֵי תוֹרָה"], "kasha": "יש להבין מה ייחודן של ״חקותי״ לעומת שאר סוגי המצוות שבפסוק.", "answer": "״חקותי״ הם דברים שיצר הרע ואומות העולם משיבים עליהם, כגון אכילת חזיר ולבישת שעטנז, שאין בהם טעם אלא גזרת המלך וחקותיו על עבדיו.", "kp": ["שיצר הרע ואמות העולם משיבין עליהם", "שאין טעם בדבר"]}]}, {"id": "26:5.5", "ch": 26, "v": 5, "n": 5, "dh": "ותורתי", "pasuk_html": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י מִצְוֺתַ֖י חֻקּוֹתַ֥י <mark>וְתוֹרֹתָֽי׃</mark>", "pasuk_en": "יַעַן אֲשֶׁר שָׁמַע אַבְרָהָם בְקוֹלִי וַיִּשְׁמֹר מִשְׁמַרְתִּי מִצְוֺתַי חֻקּוֹתַי וְתוֹרוֹתַי׃", "rashi_he": "ותורתי. לְהָבִיא תּוֹרָה שֶׁבְּעַל פֶּה הֲלָכָה לְמֹשֶׁה מִסִּינַי (בראשית רבה):", "rashi_en": "המילה ״ותורתי״ באה לרבות גם את התורה שבעל פה – הלכה למשה מסיני.", "note": "", "points": [{"q": "מָה בָּא רַשִׁ״י לְרַבּוֹת מִן הַמִּילָּה ״וְתוֹרֹתָי״?", "options": ["אֶת הַתּוֹרָה שֶׁבְּעַל פֶּה, הֲלָכָה לְמֹשֶׁה מִסִּינַי", "אֶת הַגְּזֵרוֹת שֶׁתִּיקְּנוּ חֲכָמִים לְהַרְחָקָה מֵעֲבֵירָה", "אֶת שֶׁבַע מִצְווֹת בְּנֵי נֹחַ שֶׁנִּצְטַוּוּ בָּהֶן הַכּוֹל"], "kasha": "״תורתי״ נאמר בלשון רבים, ומשמע שיש יותר מתורה אחת.", "answer": "״ותורתי״ בא להביא את התורה שבעל פה, הלכה למשה מסיני.", "kp": ["להביא תורה שבעל פה", "הלכה למשה מסיני"]}]}, {"id": "26:7.1", "ch": 26, "v": 7, "n": 1, "dh": "לאשתו", "pasuk_html": "וַֽיִּשְׁאֲל֞וּ אַנְשֵׁ֤י הַמָּקוֹם֙ <mark>לְאִשְׁתּ֔וֹ</mark> וַיֹּ֖אמֶר אֲחֹ֣תִי הִ֑וא כִּ֤י יָרֵא֙ לֵאמֹ֣ר אִשְׁתִּ֔י פֶּן־יַֽהַרְגֻ֜נִי אַנְשֵׁ֤י הַמָּקוֹם֙ עַל־רִבְקָ֔ה כִּֽי־טוֹבַ֥ת מַרְאֶ֖ה הִֽוא׃", "pasuk_en": "כִּי יָרֵא לוֹמַר אִשְׁתִּי פֶּן יַהַרְגוּנִי אַנְשֵׁי הַמָּקוֹם עַל רִבְקָה כִּי טוֹבַת מַרְאֶה הִיא", "rashi_he": "לאשתו. עַל אִשְׁתּוֹ, כְּמוֹ אִמְרִי לִי אָחִי הוּא (בראשית כ׳:י״ג):", "rashi_en": "״וישאלו... לאשתו״ פירושו ששאלו על אשתו, כמו ״אמרי לי אחי הוא״ שפירושו אמרי עליי.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״וַיִּשְׁאֲלוּ אַנְשֵׁי הַמָּקוֹם לְאִשְׁתּוֹ״?", "options": ["שָׁאֲלוּ אֶת יִצְחָק עַל אִשְׁתּוֹ, מִי הִיא", "שָׁאֲלוּ אֶת רִבְקָה עַצְמָהּ מִי הִיא וּמֵאַיִן בָּאָה", "בִּיקְשׁוּ מִיִּצְחָק לָתֵת לָהֶם אֶת אִשְׁתּוֹ"], "kasha": "״לאשתו״ משמע שפנו אל אשתו, אבל ההמשך ״ויאמר אחתי הוא״ מלמד שיצחק הוא שענה.", "answer": "״לאשתו״ פירושו ״על אשתו״, כמו ״אמרי לי אחי הוא״ שפירושו אמרי עליי.", "kp": ["על אשתו, כמו", "אמרי לי אחי הוא"]}]}, {"id": "26:8.2", "ch": 26, "v": 8, "n": 2, "dh": "וישקף אבימלך וגומר", "pasuk_html": "וַיְהִ֗י כִּ֣י אָֽרְכוּ־ל֥וֹ שָׁם֙ הַיָּמִ֔ים וַיַּשְׁקֵ֗ף אֲבִימֶ֙לֶךְ֙ מֶ֣לֶךְ פְּלִשְׁתִּ֔ים בְּעַ֖ד הַֽחַלּ֑וֹן וַיַּ֗רְא וְהִנֵּ֤ה יִצְחָק֙ מְצַחֵ֔ק אֵ֖ת רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיִּשְׁקֹף אֲבִימֶלֶךְ מֶלֶךְ פְּלִשְׁתִּים בְּעַד הַחַלּוֹן וַיַּרְא וְהִנֵּה יִצְחָק מְצַחֵק אֶת רִבְקָה אִשְׁתּוֹ", "rashi_he": "וישקף אבימלך וגומר. רָאָהוּ מְשַׁמֵּשׁ מִטָּתוֹ:", "rashi_en": "אבימלך ראה את יצחק ורבקה בדרך אישות, ומכך הבין שהם בעל ואשה ולא אח ואחות.", "note": "", "points": [{"q": "מָה רָאָה אֲבִימֶלֶךְ, שֶׁמִּמֶּנּוּ הֵבִין שֶׁרִבְקָה הִיא אֵשֶׁת יִצְחָק?", "options": ["רָאָה אֶת יִצְחָק עִם רִבְקָה בְּדֶרֶךְ אִישׁוּת", "רָאָה אֶת יִצְחָק מְשַׂחֵק עִם רִבְקָה בִּצְחוֹק", "שָׁמַע אֶת יִצְחָק קוֹרֵא לְרִבְקָה ״אִשְׁתִּי״"], "kasha": "מן המילה ״מצחק״ לבדה אין הוכחה ברורה שרבקה היא אשתו ולא אחותו.", "answer": "ראהו משמש מטתו.", "kp": ["ראהו משמש מטתו"]}]}, {"id": "26:10.1", "ch": 26, "v": 10, "n": 1, "dh": "אחד העם", "pasuk_html": "וַיֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה־זֹּ֖את עָשִׂ֣יתָ לָּ֑נוּ כִּ֠מְעַ֠ט שָׁכַ֞ב <mark>אַחַ֤ד הָעָם֙</mark> אֶת־אִשְׁתֶּ֔ךָ וְהֵבֵאתָ֥ עָלֵ֖ינוּ אָשָֽׁם׃", "pasuk_en": "וַיֹּאמֶר אֲבִימֶלֶךְ מַה זֶּה עָשִׂיתָ לָּנוּ וּמַה חָטָאתִי לָךְ כִּי הֵבֵאתָ עלַי וְעַל מַלְכוּתִי חֲטָאָה גְדוֹלָה", "rashi_he": "אחד העם. הַמְיֻחָד בָּעָם, זֶה הַמֶּלֶךְ:", "rashi_en": "״אחד העם״ פירושו המיוחד שבעם, כלומר המלך – אבימלך עצמו.", "note": "", "points": [{"q": "לְמִי מִתְכַּוֵּון אֲבִימֶלֶךְ בְּאָמְרוֹ ״אַחַד הָעָם״?", "options": ["לַמֶּלֶךְ, הַמְיוּחָד שֶׁבָּעָם, כְּלוֹמַר לְעַצְמוֹ", "לְאֶחָד מִפְּשׁוּטֵי הָעָם, אָדָם כָּלְשֶׁהוּ", "לְאֶחָד מִשָּׂרֵי הַמֶּלֶךְ, כְּגוֹן פִּיכֹל שַׂר הַצָּבָא"], "kasha": "הלשון ״אחד העם״ סתמית, ולא ברור במי מדובר.", "answer": "״אחד העם״ הוא המיוחד בעם, זה המלך.", "kp": ["המיחד בעם, זה המלך"]}]}, {"id": "26:10.2", "ch": 26, "v": 10, "n": 2, "dh": "והבאת עלינו אשם", "pasuk_html": "וַיֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה־זֹּ֖את עָשִׂ֣יתָ לָּ֑נוּ כִּ֠מְעַ֠ט שָׁכַ֞ב אַחַ֤ד הָעָם֙ אֶת־אִשְׁתֶּ֔ךָ <mark>וְהֵבֵאתָ֥ עָלֵ֖ינוּ אָשָֽׁם׃</mark>", "pasuk_en": "וַיֹּאמֶר אֲבִימֶלֶךְ מַה זֶּה עָשִׂיתָ לָּנוּ וּמַה חָטָאתִי לָךְ כִּי הֵבֵאתָ עלַי וְעַל מַלְכוּתִי חֲטָאָה גְדוֹלָה", "rashi_he": "והבאת עלינו אשם. אִם שָׁכַב כְּבָר, הֵבֵאתָ עָלֵינוּ אָשָׁם:", "rashi_en": "אבימלך אומר ליצחק: אילו כבר שכב איתה מישהו, היית מביא עלינו אשמה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״וְהֵבֵאתָ עָלֵינוּ אָשָׁם״ לְפִי רַשִׁ״י?", "options": ["אִילּוּ כְּבָר שָׁכַב אִיתָּהּ, הָיִיתָ מֵבִיא עָלֵינוּ אַשְׁמָה", "כְּבָר הֵבֵאתָ עָלֵינוּ אַשְׁמָה בַּשֶּׁקֶר שֶׁאָמַרְתָּ לָּנוּ", "עָלֵינוּ לְהָבִיא קָרְבַּן אָשָׁם עַל מָה שֶׁאֵירַע"], "kasha": "הרי איש לא שכב עם רבקה, ומה האשם שהביא יצחק עליהם?", "answer": "הכוונה: אם שכב כבר, הבאת עלינו אשם.", "kp": ["אם שכב כבר, הבאת עלינו אשם"]}]}, {"id": "26:12.1", "ch": 26, "v": 12, "n": 1, "dh": "בארץ ההוא", "pasuk_html": "וַיִּזְרַ֤ע יִצְחָק֙ <mark>בָּאָ֣רֶץ הַהִ֔וא</mark> וַיִּמְצָ֛א בַּשָּׁנָ֥ה הַהִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "pasuk_en": "וַיִּזְרַע יִצְחָק בָּאָרֶץ הַהִיא וַיִּמְצָא בַּשָּׁנָה הַהִיא מֵאָה שְׁעָרִים וַיְבָרְכֵהוּ ה׳", "rashi_he": "בארץ ההוא. אַעַ\"פִּ שֶׁאֵינוֹ חֲשׁוּבָה כְּאֶרֶץ יִשְׂרָאֵל עַצְמָהּ, כְּאֶרֶץ שִׁבְעָה גוֹיִם (בראשית רבה):", "rashi_en": "יצחק הצליח בזריעתו אף על פי שארץ גרר אינה חשובה כארץ ישראל עצמה, ארץ שבעת העממים.", "note": "", "points": [{"q": "מָה בָּא הַכָּתוּב לְהַדְגִּישׁ בַּמִּילִּים ״בָּאָרֶץ הַהִוא״?", "options": ["שֶׁהִצְלִיחַ אַף שֶׁגְּרָר אֵינָהּ חֲשׁוּבָה כְּאֶרֶץ שִׁבְעָה גּוֹיִים", "שֶׁגְּרָר הָיְיתָה הָאָרֶץ הַפּוֹרִיָּיה בְּיוֹתֵר בָּאֵזוֹר", "שֶׁבָּאָרֶץ הַהִיא לֹא זָרַע אִישׁ לִפְנֵי יִצְחָק"], "kasha": "כבר ידוע היכן ישב יצחק, ומה צורך לציין ״בארץ ההוא״?", "answer": "אף על פי שאינה חשובה כארץ ישראל עצמה, כארץ שבעה גויים.", "kp": ["אע\"פ שאינו חשובה", "כארץ שבעה גוים"]}]}, {"id": "26:12.2", "ch": 26, "v": 12, "n": 2, "dh": "בשנה ההיא", "pasuk_html": "וַיִּזְרַ֤ע יִצְחָק֙ בָּאָ֣רֶץ הַהִ֔וא וַיִּמְצָ֛א <mark>בַּשָּׁנָ֥ה הַהִ֖וא</mark> מֵאָ֣ה שְׁעָרִ֑ים וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "pasuk_en": "יצחק זרע בארץ ההיא וַיִּקְצֹר בשנה ההיא מאה שיעורים. וַיְבָרְכֵהוּ ה׳,", "rashi_he": "בשנה ההיא. אַעַ\"פִּ שֶׁאֵינָהּ כְּתִקְנָהּ, שֶׁהָיְתָה שְׁנַת רְעָבוֹן (בראשית רבה):", "rashi_en": "יצחק הצליח אף על פי שהשנה ההיא לא הייתה שנה רגילה, אלא שנת רעב.", "note": "", "points": [{"q": "מַה מְיוּחָד בְּ״שָׁנָה הַהִוא״ שֶׁבָּהּ זָרַע יִצְחָק?", "options": ["הָיְיתָה שְׁנַת רָעָב, וְלֹא שָׁנָה כְּתִקְנָהּ", "הָיְיתָה שְׁנַת שְׁמִיטָּה, שֶׁאָסוּר לִזְרוֹעַ בָּהּ", "הָיִיתָה הַשָּׁנָה הָרִאשׁוֹנָה לְבוֹאוֹ לִגְרָר"], "kasha": "לשם מה מציין הכתוב באיזו שנה זרע יצחק?", "answer": "אף על פי שאינה כתקנה, שהייתה שנת רעבון.", "kp": ["שהיתה שנת רעבון", "אע\"פ שאינה כתקנה"]}]}, {"id": "26:12.3", "ch": 26, "v": 12, "n": 3, "dh": "בארץ ההיא בשנה ההיא", "pasuk_html": "וַיִּזְרַ֤ע יִצְחָק֙ בָּאָ֣רֶץ הַהִ֔וא וַיִּמְצָ֛א בַּשָּׁנָ֥ה הַהִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "pasuk_en": "יצחק זרע בארץ ההיא וַיִּקְצֹר בשנה ההיא מאה שיעורים. וַיְבָרְכֵהוּ ה׳,", "rashi_he": "בארץ ההיא בשנה ההיא. שְׁנֵיהֶם לָמָּה? לוֹמַר, שֶׁהָאָרֶץ קָשָׁה וְהַשָּׁנָה קָשָׁה:", "rashi_en": "הכתוב מזכיר גם את הארץ וגם את השנה כדי ללמד ששתיהן היו קשות, ובכל זאת הצליח יצחק.", "note": "", "points": [{"q": "לָמָּה מַזְכִּיר הַכָּתוּב גַּם ״בָּאָרֶץ הַהִוא״ וְגַם ״בַּשָּׁנָה הַהִוא״?", "options": ["לְלַמֵּד שֶׁגַּם הָאָרֶץ קָשָׁה וְגַם הַשָּׁנָה קָשָׁה", "לְלַמֵּד שֶׁהַשָּׁנָה הָיְיתָה קָשָׁה אַךְ הָאָרֶץ טוֹבָה", "לְלַמֵּד שֶׁזָּרַע בְּכָל שָׁנָה בְּאוֹתָהּ הָאָרֶץ"], "kasha": "די היה לכתוב ״ויזרע יצחק... וימצא מאה שערים״, ולמה צריך את שני הציונים?", "answer": "לומר שהארץ קשה והשנה קשה.", "kp": ["לומר, שהארץ קשה והשנה קשה"]}]}, {"id": "26:12.4", "ch": 26, "v": 12, "n": 4, "dh": "מאה שערים", "pasuk_html": "וַיִּזְרַ֤ע יִצְחָק֙ בָּאָ֣רֶץ הַהִ֔וא וַיִּמְצָ֛א בַּשָּׁנָ֥ה הַהִ֖וא <mark>מֵאָ֣ה שְׁעָרִ֑ים</mark> וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "pasuk_en": "יצחק זרע בארץ ההיא וַיִּקְצֹר בשנה ההיא מאה שיעורים. וַיְבָרְכֵהוּ ה׳,", "rashi_he": "מאה שערים. שֶׁאֲמָדוּהָ כַּמָּה רְאוּיָה לַעֲשׂוֹת, וְעָשְׂתָה עַל אַחַת שֶׁאֲמָדוּהָ מֵאָה. וְרַבּוֹתֵינוּ אָמְרוּ אֹמֶד זֶה לְמַעַשְׂרוֹת הָיָה:", "rashi_en": "אמדו כמה ראוי השדה להניב, והוא הניב פי מאה מן האומדן. ורבותינו אמרו שהאומד נעשה לצורך הפרשת מעשרות.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״וַיִּמְצָא... מֵאָה שְׁעָרִים״?", "options": ["הַשָּׂדֶה הֵנִיב פִּי מֵאָה מִמַּה שֶּׁאָמְדוּ שֶׁרָאוּי לְהָנִיב", "יִצְחָק קָצַר בְּדִיּוּק מֵאָה סְאָה מִכָּל שָׂדֶה", "הַתְּבוּאָה נִמְכְּרָה בְּמֵאָה שַׁעֲרֵי הָעִיר גְּרָר"], "kasha": "״שערים״ הוא לשון אומד ושיעור, ויש להבין ביחס למה נמדדו ה״מאה״.", "answer": "אמדוה כמה ראויה לעשות, ועשתה מאה על כל אחת שאמדוה.", "kp": ["שאמדוה כמה ראויה לעשות", "ועשתה על אחת שאמדוה מאה"]}, {"q": "לְפִי רַבּוֹתֵינוּ, לְשֵׁם מָה אָמְדוּ אֶת הַתְּבוּאָה?", "options": ["כְּדֵי לְהַפְרִישׁ מִמֶּנָּה מַעַשְׂרוֹת", "כְּדֵי לִמְכּוֹר אוֹתָהּ לַפְּלִשְׁתִּים", "כְּדֵי לְשַׁלֵּם מִמֶּנָּה מַס לַאֲבִימֶלֶךְ"], "kasha": "אדם שמתברך אינו נוהג למדוד את תבואתו, שאין הברכה מצויה בדבר המדוד; ולמה אמדוה?", "answer": "רבותינו אמרו שהאומד הזה היה למעשרות.", "kp": ["אמד זה למעשרות היה"]}]}, {"id": "26:13.1", "ch": 26, "v": 13, "n": 1, "dh": "כי גדל מאוד", "pasuk_html": "וַיִּגְדַּ֖ל הָאִ֑ישׁ וַיֵּ֤לֶךְ הָלוֹךְ֙ וְגָדֵ֔ל עַ֥ד <mark>כִּֽי־גָדַ֖ל מְאֹֽד׃</mark>", "pasuk_en": "וַיִּגְדַּל הָאִישׁ וַיֵּלֶךְ הָלוֹךְ וְגָדֵל עַד כִּי גָדוֹל מְאֹד:", "rashi_he": "כי גדל מאוד. שֶׁהָיוּ אוֹמְרִים זֶבֶל פִּרְדּוֹתָיו שֶׁל יִצְחָק וְלֹא כַסְפּוֹ וּזְהָבוֹ שֶׁל אֲבִימֶלֶךְ (בראשית רבה):", "rashi_en": "יצחק התעשר כל כך, עד שהיו אומרים: מוטב זבל פרדותיו של יצחק מכספו וזהבו של אבימלך.", "note": "", "points": [{"q": "עַד כַּמָּה גָּדַל יִצְחָק לְפִי רַשִׁ״י?", "options": ["אָמְרוּ: זֶבֶל פִּרְדוֹתָיו שֶׁל יִצְחָק וְלֹא כַּסְפּוֹ וּזְהָבוֹ שֶׁל אֲבִימֶלֶךְ", "אָמְרוּ שֶׁעוֹשְׁרוֹ גָּדוֹל מֵעוֹשֶׁר כָּל מַלְכֵי כְּנַעַן יַחַד", "אֲבִימֶלֶךְ מִינָּה אוֹתוֹ לְשַׂר עַל כָּל אֶרֶץ פְּלִשְׁתִּים"], "kasha": "הפסוק אומר ״עד כי גדל מאד״, ויש להבין מה הייתה מידת גדולתו.", "answer": "שהיו אומרים: זבל פרדותיו של יצחק ולא כספו וזהבו של אבימלך.", "kp": ["שהיו אומרים זבל פרדותיו של יצחק", "ולא כספו וזהבו של אבימלך"]}]}, {"id": "26:14.1", "ch": 26, "v": 14, "n": 1, "dh": "ועבדה רבה", "pasuk_html": "וַֽיְהִי־ל֤וֹ מִקְנֵה־צֹאן֙ וּמִקְנֵ֣ה בָקָ֔ר <mark>וַעֲבֻדָּ֖ה רַבָּ֑ה</mark> וַיְקַנְא֥וּ אֹת֖וֹ פְּלִשְׁתִּֽים׃", "pasuk_en": "וַיְהִי לוֹ צֹאן וּבָקָר וְעַבְדִּים הַרְבֵּה וַיְקַנְאוּ אֹתוֹ פְלִשְׁתִּים:", "rashi_he": "ועבדה רבה. פְּעֻלָּה רַבָּה בִּלְשׁוֹן לע\"ז אוברי\"נא, עֲבוֹדָה מַשְׁמָע עֲבוֹדָה אַחַת; עֲבֻדָּה מַשְׁמָע פְּעֻלָּה רַבָּה:", "rashi_en": "״עבדה רבה״ פירושה עסקים ומלאכות רבות (בלע״ז אוברינ״א). ״עבודה״ משמעה מלאכה אחת, ואילו ״עבדה״ משמעה הרבה מלאכות.", "note": "", "points": [{"q": "מָה הַהֶבְדֵּל בֵּין ״עֲבוֹדָה״ לְ״עֲבֻדָּה״ לְפִי רַשִׁ״י?", "options": ["עֲבוֹדָה הִיא מְלָאכָה אַחַת, וַעֲבֻדָּה הִיא מְלָאכוֹת רַבּוֹת", "עֲבוֹדָה הִיא מְלָאכָה קָשָׁה, וְעַבְדָּה הִיא מְלָאכָה קַלָּה", "עֲבוֹדָה הִיא עֲבוֹדַת ה׳, וַעֲבֻדָּה הִיא עֲבוֹדַת הַשָּׂדֶה"], "kasha": "למה נאמר כאן ״עבדה״ ולא ״עבודה״ כרגיל?", "answer": "״עבודה״ משמע עבודה אחת, ״עבדה״ משמע פעולה רבה – כלומר עסקים ומלאכות רבים.", "kp": ["עבודה משמע עבודה אחת", "עבדה משמע פעלה רבה"]}]}, {"id": "26:15.1", "ch": 26, "v": 15, "n": 1, "dh": "סתמום פלשתים", "pasuk_html": "וְכׇל־הַבְּאֵרֹ֗ת אֲשֶׁ֤ר חָֽפְרוּ֙ עַבְדֵ֣י אָבִ֔יו בִּימֵ֖י אַבְרָהָ֣ם אָבִ֑יו <mark>סִתְּמ֣וּם פְּלִשְׁתִּ֔ים</mark> וַיְמַלְא֖וּם עָפָֽר׃", "pasuk_en": "וַיִּסְתְּמוּ הַפְּלִשְׁתִּים אֶת־כׇּל־הַבְּאֵרוֹת אֲשֶׁר חָפְרוּ עַבְדֵי־אָבִיו בִּימֵי אַבְרָהָם אָבִיו וַיְמַלְאוּם עָפָר.", "rashi_he": "סתמום פלשתים. מִפְּנֵי שֶׁאָמְרוּ תַּקָּלָה הֵם לָנוּ מִפְּנֵי הַגְּיָסוֹת הַבָּאוֹת עָלֵינוּ, טַמּוֹנוּן פְּלִשְׁתָּאֵי לְשׁוֹן סְתִימָה, וּבִלְשׁוֹן הַתַּלְמוּד מְטַמְטֵם אֶת הַלֵּב:", "rashi_en": "הפלשתים סתמו את הבארות כי חששו שיהיו להם למכשול, שהגייסות הפולשים יבואו בגללן. אונקלוס מתרגם ״טמונון״, שהוא לשון סתימה, כמו ״מטמטם את הלב״ בלשון התלמוד.", "note": "", "points": [{"q": "מַדּוּעַ סָתְמוּ הַפְּלִשְׁתִּים אֶת הַבְּאֵרוֹת?", "options": ["אָמְרוּ שֶׁהֵן תַּקָּלָה לָהֶם מִפְּנֵי הַגְּיָיסוֹת הַבָּאִים עֲלֵיהֶם", "קִינְּאוּ בְּיִצְחָק וְרָצוּ שֶׁלֹּא יִהְיוּ לוֹ מַיִם לְצֹאנוֹ", "רָצוּ לְהַשְׁכִּיחַ מִן הָאָרֶץ אֶת שְׁמוֹ שֶׁל אַבְרָהָם"], "kasha": "בארות מים הן תועלת לכל, ולמה סתמו אותן הפלשתים?", "answer": "מפני שאמרו: תקלה הם לנו מפני הגייסות הבאים עלינו.", "kp": ["מפני שאמרו תקלה הם לנו", "מפני הגיסות הבאות עלינו"]}, {"q": "מָה מַשְׁמָעוּת הַמִּילָּה ״טְמוּנוֹן״ שֶׁבָּה מְתַרְגֵּם אוּנְקְלוֹס ״סִתְּמוּם״?", "options": ["לָשׁוֹן סְתִימָה, כְּמוֹ ״מְטַמְטֵם אֶת הַלֵּב״", "לְשׁוֹן הַטְמָנָה, כְּמוֹ הַסְתָּרַת אוֹצָר בָּאֲדָמָה", "לְשׁוֹן טוּמְאָה, שֶׁטִּימְּאוּ אֶת מֵי הַבְּאֵרוֹת"], "kasha": "התרגום ״טמונון״ נשמע כלשון הטמנה והסתרה, ולא כלשון סתימה.", "answer": "״טמונון״ הוא לשון סתימה, ובלשון התלמוד ״מטמטם את הלב״.", "kp": ["טמונון פלשתאי לשון סתימה", "ובלשון התלמוד מטמטם את הלב"]}]}, {"id": "26:17.1", "ch": 26, "v": 17, "n": 1, "dh": "בנחל גרר", "pasuk_html": "וַיֵּ֥לֶךְ מִשָּׁ֖ם יִצְחָ֑ק וַיִּ֥חַן <mark>בְּנַֽחַל־גְּרָ֖ר</mark> וַיֵּ֥שֶׁב שָֽׁם׃", "pasuk_en": "וַיִּשַׂע מִשָּׁם יִצְחָק וַיִּחַן בְּנַחַל גְּרָר וַיֵּשֶׁב שָׁם.", "rashi_he": "בנחל גרר. רָחוֹק מִן הָעִיר:", "rashi_en": "יצחק חנה בנחל גרר, מקום רחוק מן העיר.", "note": "", "points": [{"q": "הֵיכָן חָנָה יִצְחָק כְּשֶׁנֶּאֱמַר ״וַיִּחַן בְּנַחַל־גְּרָר״?", "options": ["בְּמָקוֹם רָחוֹק מִן הָעִיר גְּרָר", "בְּתוֹךְ הָעִיר גְּרָר, סָמוּךְ לְבֵית הַמֶּלֶךְ", "בִּבְאֵר שֶׁבַע, בִּגְבוּל אֶרֶץ פְּלִשְׁתִּים"], "kasha": "אבימלך אמר לו ״לך מעמנו״, ואם כן איך נשאר יצחק בגרר?", "answer": "נחל גרר רחוק מן העיר.", "kp": ["רחוק מן העיר"]}]}, {"id": "26:18.1", "ch": 26, "v": 18, "n": 1, "dh": "וישב ויחפר", "pasuk_html": "וַיָּ֨שׇׁב יִצְחָ֜ק וַיַּחְפֹּ֣ר&thinsp;׀ אֶת־בְּאֵרֹ֣ת הַמַּ֗יִם אֲשֶׁ֤ר חָֽפְרוּ֙ בִּימֵי֙ אַבְרָהָ֣ם אָבִ֔יו וַיְסַתְּמ֣וּם פְּלִשְׁתִּ֔ים אַחֲרֵ֖י מ֣וֹת אַבְרָהָ֑ם וַיִּקְרָ֤א לָהֶן֙ שֵׁמ֔וֹת כַּשֵּׁמֹ֕ת אֲשֶׁר־קָרָ֥א לָהֶ֖ן אָבִֽיו׃", "pasuk_en": "וַיַּחְפֹּר יִצְחָק אֶת־בְּאֵרוֹת הַמַּיִם אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו וַיִּסְתְּמוּם הַפְּלִישְׁתִּים אַחֲרֵי מוֹת אַבְרָהָם וַיִּקְרָא לָהֶם שֵׁמוֹת כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶם אָבִיו.", "rashi_he": "וישב ויחפר. הַבְּאֵרוֹת אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו וּפְלִשְׁתִּים סִתְּמוּם, מִקֹּדֶם שֶׁנָּסַע יִצְחָק מִגְּרָר, חָזַר וַחֲפָרָן:", "rashi_en": "את הבארות שחפרו בימי אברהם, ושסתמו הפלשתים עוד לפני שנסע יצחק מגרר, חזר יצחק וחפר מחדש.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״וַיָּשׇׁב יִצְחָק וַיַּחְפֹּר אֶת בְּאֵרוֹת הַמַּיִם״?", "options": ["חָזַר וְחָפַר מֵחָדָשׁ אֶת בְּאֵרוֹת אַבְרָהָם שֶׁסָּתְמוּ הַפְּלִשְׁתִּים", "יָשַׁב בַּמָ
