לָכָה לְמֹשֶׁה מִסִּינַי (בראשית רבה):", "rashi_en": "וְתוֹרוֹתַי — לָרַבּוֹת אַף אֶת הַתּוֹרָה שֶׁבְּעַל פֶּה, שֵׁן גַּם הִיא מִסִּינַי.", "note": "", "points": [{"q": "למה רש״י מדגיש שהמילה 'תוֹרוֹת' (תורות) היא בלשון רבים?", "options": ["כדי להציין שגם התורה שבכתב וגם התורה שבעל פה כלולות בה, כשהעל פה היא מסורת עתיקה מזמן משה בסיני", "כדי להראות שישנם סוגים רבים של תורות השונים לפי אזור", "כדי להדגיש שאברהם קיבל מספר חדר הרצאות נפרדות מאלוקים"], "kasha": "המילה 'תוֹרוֹת' מופיעה בלשון רבים — מה לנו ללמוד מצורה זו אודות היקף החוקים שאותם שמר אברהם?", "answer": "צורת הרבים כוללת גם את התורה שבכתב וגם את התורה שבעל פה (הלכה), שתיהן מקבילות בקדימות כגזרות אלוקיות קדומות שהעבירו למשה בסיני, מה שהופך אותן לחלק שווה ברורות של הוראות אלוקים."}]}, {"id": "26:7.1", "ch": 26, "v": 7, "n": 1, "dh": "לאשתו", "pasuk_html": "וַֽיִּשְׁאֲל֞וּ אַנְשֵׁ֤י הַמָּקוֹם֙ <mark>לְאִשְׁתּ֔וֹ</mark> וַיֹּ֖אמֶר אֲחֹ֣תִי הִ֑וא כִּ֤י יָרֵא֙ לֵאמֹ֣ר אִשְׁתִּ֔י פֶּן־יַֽהַרְגֻ֜נִי אַנְשֵׁ֤י הַמָּקוֹם֙ עַל־רִבְקָ֔ה כִּֽי־טוֹבַ֥ת מַרְאֶ֖ה הִֽוא׃", "pasuk_en": "כִּי יָרֵא לוֹמַר אִשְׁתִּי פֶּן יַהַרְגוּנִי אַנְשֵׁי הַמָּקוֹם עַל רִבְקָה כִּי טוֹבַת מַרְאֶה הִיא", "rashi_he": "לאשתו. עַל אִשְׁתּוֹ, כְּמוֹ אִמְרִי לִי אָחִי הוּא (בראשית כ׳:י״ג):", "rashi_en": "לְאִשְׁתּוֹ פירושו בִּדְבַר אִשְׁתּוֹ, כְשֵׁם שֶׁ(כ׳:יג׳) 'אֱמֹר עלַי הוּא אָחִי'", "note": "", "points": [{"q": "איזה בנייה דקדוקית משתמש רש״י כדי להסביר את המשמעות של לאִשְׁתוֹ (על אשתו)?", "options": ["הוא משווה זאת לניסוח דומה בבראשית כ׳:יג׳ שבו 'לִי' פירושו 'עלַי' ולא 'אֵלַי'", "הוא מציין שלאִשְׁתוֹ היא צורת רבים חריגה המתייחסת לכמה נשים", "הוא מסביר שלאִשְׁתוֹ היא פועל ציווי הגוזר על יצחק לדבר על אשתו"], "kasha": "הטקסט אומר 'וַיִּשְׁאֲלוּ אַנְשֵׁי הַמָּקוֹם לְאִשְׁתּוֹ' — האם זה אומר שהם שאלו את אשתו, או שאלו עַל אשתו?", "answer": "רש״י מבהיר שלְאִשְׁתּוֹ פירושו 'בִּדְבַר' או 'עַל' אשתו (לא 'אֶל' אשתו), על ידי השוואה לניסוח המקביל בבראשית כ׳:יג׳ שבו 'לִי' (עלַי) מראה בנייה זהה."}]}, {"id": "26:8.2", "ch": 26, "v": 8, "n": 2, "dh": "וישקף אבימלך וגומר", "pasuk_html": "וַיְהִ֗י כִּ֣י אָֽרְכוּ־ל֥וֹ שָׁם֙ הַיָּמִ֔ים וַיַּשְׁקֵ֗ף אֲבִימֶ֙לֶךְ֙ מֶ֣לֶךְ פְּלִשְׁתִּ֔ים בְּעַ֖ד הַֽחַלּ֑וֹן וַיַּ֗רְא וְהִנֵּ֤ה יִצְחָק֙ מְצַחֵ֔ק אֵ֖ת רִבְקָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיִּשְׁקֹף אֲבִימֶלֶךְ מֶלֶךְ פְּלִשְׁתִּים בְּעַד הַחַלּוֹן וַיַּרְא וְהִנֵּה יִצְחָק מְצַחֵק אֶת רִבְקָה אִשְׁתּוֹ", "rashi_he": "וישקף אבימלך וגומר. רָאָהוּ מְשַׁמֵּשׁ מִטָּתוֹ:", "rashi_en": "וַיִּשְׁקֹף אֲבִימֶלֶךְ וְגוֹמֵר — ראה אותו עוסק בתשמיש הַמִּטָּה (בראשית רַבָּה ס״ד:ה׳)", "note": "", "points": [{"q": "איזה פעולה ספציפית אמר רש״י שאבימלך ראה כאשר הסתכל דרך החלון?", "options": ["יצחק עוסק ביחסים מיניים עם רבקה", "יצחק ורבקה מדברים בשיחה פרטית", "יצחק מראה לרבקה גן או קרקע"], "kasha": "הפסוק אומר שאבימלך 'ראה' משהו — מה בדיוק הוא שם שהבחין בו שגרם לו להכיר שרבקה לא יכולה להיות אחות יצחק?", "answer": "רש״י מסביר שאבימלך ראה יצחק עוסק בפעילות מינית עם רבקה, דבר שהבהיר את הקשר האינטימי שלהם והפריך את טענת יצחק שהיא אחותו."}]}, {"id": "26:10.1", "ch": 26, "v": 10, "n": 1, "dh": "אחד העם", "pasuk_html": "וַיֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה־זֹּ֖את עָשִׂ֣יתָ לָּ֑נוּ כִּ֠מְעַ֠ט שָׁכַ֞ב <mark>אַחַ֤ד הָעָם֙</mark> אֶת־אִשְׁתֶּ֔ךָ וְהֵבֵאתָ֥ עָלֵ֖ינוּ אָשָֽׁם׃", "pasuk_en": "וַיֹּאמֶר אֲבִימֶלֶךְ מַה זֶּה עָשִׂיתָ לָּנוּ וּמַה חָטָאתִי לָךְ כִּי הֵבֵאתָ עלַי וְעַל מַלְכוּתִי חֲטָאָה גְדוֹלָה", "rashi_he": "אחד העם. הַמְיֻחָד בָּעָם, זֶה הַמֶּלֶךְ:", "rashi_en": "אַחַד הָעָם — הַנִּבְדַּל מִן הָעָם, כְּלוֹמַר, הַמֶּלֶךְ (לִשְׁקַל עִם הַתַּרְגּוּם)", "note": "", "points": [{"q": "למי מזהה רש״י את 'אַחַד הָעָם' בהצהרת אבימלך?", "options": ["המלך עצמו, אבימלך, כאחד המובדל מן העם הפשוט", "חייל אקראי מצבא פלישתי", "סוחר זר המבקר בגְרָר"], "kasha": "מדוע אבימלך מתייחס לעצמו בעקיפין כ'אחד מהעם' במקום לומר 'אני עלול לשכב עם אשתך'?", "answer": "רש״י מזהה את 'אַחַד הָעָם' כמתייחס ספציפית למלך, הפרט המובדל והמופלג מן העם, ומפרש זאת כהתייחסות עקיפה שלו לעצמו."}]}, {"id": "26:10.2", "ch": 26, "v": 10, "n": 2, "dh": "והבאת עלינו אשם", "pasuk_html": "וַיֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה־זֹּ֖את עָשִׂ֣יתָ לָּ֑נוּ כִּ֠מְעַ֠ט שָׁכַ֞ב אַחַ֤ד הָעָם֙ אֶת־אִשְׁתֶּ֔ךָ <mark>וְהֵבֵאתָ֥ עָלֵ֖ינוּ אָשָֽׁם׃</mark>", "pasuk_en": "וַיֹּאמֶר אֲבִימֶלֶךְ מַה זֶּה עָשִׂיתָ לָּנוּ וּמַה חָטָאתִי לָךְ כִּי הֵבֵאתָ עלַי וְעַל מַלְכוּתִי חֲטָאָה גְדוֹלָה", "rashi_he": "והבאת עלינו אשם. אִם שָׁכַב כְּבָר, הֵבֵאתָ עָלֵינוּ אָשָׁם:", "rashi_en": "וְהֵבֵאתָ עלַיְנוּ אָשָׁם — אִם כָּבָר שָׁכַב אִתָּהּ, אַתָּה הָבֵאתָ עלַיְנוּ אָשָׁם", "note": "", "points": [{"q": "לפי קריאתו של רש״י, מה הוא הקשר הזמני בין הפעולה וההשמה בפסוק זה?", "options": ["אם אבימלך כבר שכב עם רבקה בעבר, זה היה מביא השמה על כולם", "אבימלך אומר שההשמה תבוא בעתיד אם מישהו ישכב איתה", "ההשמה מתייחסת לפעולות שכבר התרחשו"], "kasha": "האם 'וְהֵבֵאתָ עלַיְנוּ אָשָׁם' מתייחסת לדבר שקרה בעבר, או לדבר שיקרה בעתיד?", "answer": "רש״י קורא זאת כתנאי: אם אבימלך כבר שכב איתה, אז יצחק היה מביא השמה עליהם בכך שהסתיר את זהותה — ההשמה הייתה חוזרת לפני הפעולה ההיא."}]}, {"id": "26:12.1", "ch": 26, "v": 12, "n": 1, "dh": "בארץ ההוא", "pasuk_html": "וַיִּזְרַ֤ע יִצְחָק֙ <mark>בָּאָ֣רֶץ הַהִ֔וא</mark> וַיִּמְצָ֛א בַּשָּׁנָ֥ה הַהִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "pasuk_en": "וַיִּזְרַע יִצְחָק בָּאָרֶץ הַהִיא וַיִּמְצָא בַּשָּׁנָה הַהִיא מֵאָה שְׁעָרִים וַיְבָרְכֵהוּ ה׳", "rashi_he": "בארץ ההוא. אַעַ\"פִּ שֶׁאֵינוֹ חֲשׁוּבָה כְּאֶרֶץ יִשְׂרָאֵל עַצְמָהּ, כְּאֶרֶץ שִׁבְעָה גוֹיִם (בראשית רבה):", "rashi_en": "בָּאָרֶץ הַהִיא — אַף כִּי גְרָר לא הייתה בעלת חשיבות קדוש כאֶרֶץ יִשְׂרָאֵל הראשית, דְּהַיְנוּ שֶׁהִיא בִשְׁטַח שְׁבַע הָעַמִּים, וְלָכֵן אֵינָה פֹּרִיָּה כָּמוֹ הָאָרֶץ הַקְּדוֹשָׁה", "note": "", "points": [{"q": "מדוע רש״י מדגיש שגְרָר לא הייתה חשובה כמו אֶרֶץ יִשְׂרָאֵל הראשית?", "options": ["כדי להסביר שלמרות שהאדמה לא הייתה בעלת מעמד קדוש כיִשְׂרָאֵל (להיות שטח של שבע האומות), יצחק עדיין קיבל קציר चудесный של מאה שעורים", "כדי להצביע על כך שיצחק היה צריך להעזוב את גְרָר ולהלוך לישראל", "כדי להצביע על כך שחקלאות אינה חשובה בארצות שאינן קדושות"], "kasha": "הטקסט מדגיש את הצלחתו של יצחק בגְרָר, אך האם הוא לא היה צריך ללכת לארץ המובטחת במקום זאת? איזו נקודה מועלית לגבי אדמה זו?", "answer": "רש״י מציין שלמרות שלגְרָר לא הייתה החשיבות הקדושה וה-פֶּרֶך של אֶרֶץ יִשְׂרָאֵל הראשית (להיות חלק משטח שבע האומות), אלוקים עדיין ברך את יצחק בקציר יוצא דופן שם."}]}, {"id": "26:12.2", "ch": 26, "v": 12, "n": 2, "dh": "בשנה ההיא", "pasuk_html": "וַיִּזְרַ֤ע יִצְחָק֙ בָּאָ֣רֶץ הַהִ֔וא וַיִּמְצָ֛א <mark>בַּשָּׁנָ֥ה הַהִ֖וא</mark> מֵאָ֣ה שְׁעָרִ֑ים וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "pasuk_en": "יצחק זרע בארץ ההיא וַיִּקְצֹר בשנה ההיא מאה שיעורים. וַיְבָרְכֵהוּ ה׳,", "rashi_he": "בשנה ההיא. אַעַ\"פִּ שֶׁאֵינָהּ כְּתִקְנָהּ, שֶׁהָיְתָה שְׁנַת רְעָבוֹן (בראשית רבה):", "rashi_en": "בִשְׁנָה הַהִיא בשנה ההיא, אף על פי שלא הייתה שנה רגילה, כי היא הייתה שנת בצורת.", "note": "", "points": [{"q": "מה הופך את השנה שבה יצחק קצר מאה שיעורים למיוחדת במיוחד לפי רש״י?", "options": ["זוהי הייתה שנת בצורת, ובכל זאת למרות תנאים חריגים יצחק השיג קציר יוצא דופן", "זוהי הייתה שנה משובעת עם חודש נוסף", "היא היתה השנה היחידה שבה גרר קיבלה גשם"], "kasha": "כיצד יכול היה יצחק להשיג קציר מאה שיעורים בשנה רגילה? מה הופך את הקציר הזה להופלאי עוד יותר?", "answer": "רש״י מסביר שזוהי לא הייתה שנה רגילה אלא שנת בצורת, מה שהופך את קציר המאה שיעורים של יצחק להופלאי עוד יותר והוא סימן ברור לברכת אלוקים."}]}, {"id": "26:12.3", "ch": 26, "v": 12, "n": 3, "dh": "בארץ ההיא בשנה ההיא", "pasuk_html": "וַיִּזְרַ֤ע יִצְחָק֙ בָּאָ֣רֶץ הַהִ֔וא וַיִּמְצָ֛א בַּשָּׁנָ֥ה הַהִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "pasuk_en": "יצחק זרע בארץ ההיא וַיִּקְצֹר בשנה ההיא מאה שיעורים. וַיְבָרְכֵהוּ ה׳,", "rashi_he": "בארץ ההיא בשנה ההיא. שְׁנֵיהֶם לָמָּה? לוֹמַר, שֶׁהָאָרֶץ קָשָׁה וְהַשָּׁנָה קָשָׁה:", "rashi_en": "בְאֶרֶץ הַהִיא בִשְׁנָה הַהִיא בארץ ההיא ובשנה ההיא — מדוע הזכרון של השניים — הארץ והשנה? לומר לך שהקרקע ההיא הייתה קשה והשנה ההיא הייתה קשה (בראשית רבה סד:ו).", "note": "", "points": [{"q": "מדוע הפסוק מזכיר הן את 'הארץ' והן את 'השנה' בקפידה?", "options": ["כדי להצביע על כך שהקרקע והשנה היו תנאים קשים כאחד", "כדי להדגיש את הדיוק ההיסטורי של הספור", "כדי להראות שיצחק עבר למיקום חדש בשנה זו"], "kasha": "הפסוק חוזר על הביטוי 'בארץ ההיא' ו'בשנה ההיא' — מדוע החזרה הכפולה הזו נחוצה?", "answer": "רש״י מסביר שההחזרה באה ללמדנו שהקרקע הייתה קשה והשנה הייתה קשה, מה שהופך את קציר המאה שיעורים של יצחק להופלאי עוד יותר."}]}, {"id": "26:12.4", "ch": 26, "v": 12, "n": 4, "dh": "מאה שערים", "pasuk_html": "וַיִּזְרַ֤ע יִצְחָק֙ בָּאָ֣רֶץ הַהִ֔וא וַיִּמְצָ֛א בַּשָּׁנָ֥ה הַהִ֖וא <mark>מֵאָ֣ה שְׁעָרִ֑ים</mark> וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "pasuk_en": "יצחק זרע בארץ ההיא וַיִּקְצֹר בשנה ההיא מאה שיעורים. וַיְבָרְכֵהוּ ה׳,", "rashi_he": "מאה שערים. שֶׁאֲמָדוּהָ כַּמָּה רְאוּיָה לַעֲשׂוֹת, וְעָשְׂתָה עַל אַחַת שֶׁאֲמָדוּהָ מֵאָה. וְרַבּוֹתֵינוּ אָמְרוּ אֹמֶד זֶה לְמַעַשְׂרוֹת הָיָה:", "rashi_en": "מֵאָה שִׁעוּרִים מאה שיעורים — כי נשערו כמה הוא היה צריך להפיק והוא הפיק מאה עבור כל שיעור שנשערו. רבותינו אמרו שהערכה נעשתה לצורך התרומה (בראשית רבה סד:ו).", "note": "", "points": [{"q": "לפי רש״י, מה פירוש 'מאה שיעורים' בהקשר זה?", "options": ["על כל שיעור שנאמד שיהיה תולדת השדה, השדה בפועל הפיק מאה שיעורים", "יצחק קצר בדיוק מאה מדות של דגן", "התשואה הייתה מאה פעמים טובה יותר מכל שנה קודמת"], "kasha": "על מה מתייחס הביטוי 'קצר מאה שיעורים' בדיוק — האם זהו מספר קבוע או יחס?", "answer": "רש״י מבהיר שמאה שיעורים פירושו שעל כל שיעור שנאמדו שהשדה אמור להפיק, הוא בפועל הניב מאה שיעורים, וההערכה נעשתה לצורך חישוב התרומות."}]}, {"id": "26:13.1", "ch": 26, "v": 13, "n": 1, "dh": "כי גדל מאוד", "pasuk_html": "וַיִּגְדַּ֖ל הָאִ֑ישׁ וַיֵּ֤לֶךְ הָלוֹךְ֙ וְגָדֵ֔ל עַ֥ד <mark>כִּֽי־גָדַ֖ל מְאֹֽד׃</mark>", "pasuk_en": "וַיִּגְדַּל הָאִישׁ וַיֵּלֶךְ הָלוֹךְ וְגָדֵל עַד כִּי גָדוֹל מְאֹד:", "rashi_he": "כי גדל מאוד. שֶׁהָיוּ אוֹמְרִים זֶבֶל פִּרְדּוֹתָיו שֶׁל יִצְחָק וְלֹא כַסְפּוֹ וּזְהָבוֹ שֶׁל אֲבִימֶלֶךְ (בראשית רבה):", "rashi_en": "כִּי גָדוֹל מְאֹד עד כי גדול מאד — כל כך שאנשים היו אומרים 'עדיף את פרשי הדומם של יצחק מאשר כל זהב וכסף של אבימלך' (בראשית רבה סד:ז).", "note": "", "points": [{"q": "מה היה כל כך מדהים בעושר של יצחק לפי תורת רש״י?", "options": ["אנשים אמרו שפרשי הדומם של יצחק היו שווי יותר מכל הזהב והכסף של אבימלך", "יצחק הייתה בידו כמות גדולה יותר של זהב וכסף מאשר למלך אבימלך", "בהמות יצחק היו רבות מאה פעמים יותר מבהמות אבימלך"], "kasha": "כיצד מודגמת גדולת יצחק בסוף הפסוק הזה — איזו השוואה ממחישה את עושרו?", "answer": "רש״י מלמד שאנשים היו אומרים 'עדיף את פרשי הדומם של יצחק מאשר כל הזהב והכסף של אבימלך', מה שמראה שתולדות הבהמות העשירות של יצחק נחשבו יותר בעלות ערך מן האוצרות של המלך."}]}, {"id": "26:14.1", "ch": 26, "v": 14, "n": 1, "dh": "ועבדה רבה", "pasuk_html": "וַֽיְהִי־ל֤וֹ מִקְנֵה־צֹאן֙ וּמִקְנֵ֣ה בָקָ֔ר <mark>וַעֲבֻדָּ֖ה רַבָּ֑ה</mark> וַיְקַנְא֥וּ אֹת֖וֹ פְּלִשְׁתִּֽים׃", "pasuk_en": "וַיְהִי לוֹ צֹאן וּבָקָר וְעַבְדִּים הַרְבֵּה וַיְקַנְאוּ אֹתוֹ פְלִשְׁתִּים:", "rashi_he": "ועבדה רבה. פְּעֻלָּה רַבָּה בִּלְשׁוֹן לע\"ז אוברי\"נא, עֲבוֹדָה מַשְׁמָע עֲבוֹדָה אַחַת; עֲבֻדָּה מַשְׁמָע פְּעֻלָּה רַבָּה:", "rashi_en": "וַעֲבֻדָּה רַבָּה משמעות דברים רבים לעשות (כלומר מפעלים גדולים). המילה עֲבוֹדָה מסמנת דבר אחד לעשות בעוד עֲבֻדָּה מסמנת דברים רבים לעשות (שם עצם קולקטיבי).", "note": "", "points": [{"q": "מה ההבדל בין המילים עֲבוֹדָה (עבודה) לעֲבֻדָּה (עבודה)?", "options": ["עבודה מתייחסת למשימה אחת, בעוד עבודה מתייחסת למשימות רבות או למפעלים גדולים", "עבודה משמעותה עושר בעוד עבודה משמעותה בהמות", "עבודה מתייחסת לעבדים בעוד עבודה מתייחסת לעבודתם"], "kasha": "מה המשמעות של המילה עֲבֻדָּה כאן, וכיצד היא קשורה לעושר של יצחק?", "answer": "רש״י מסביר שעֲבֻדָּה (עם שווא) היא שם עצם קולקטיבי המשמעות דברים רבים לעשות או מפעלים גדולים, בניגוד לעֲבוֹדָה המסמנת משימה אחת."}]}, {"id": "26:15.1", "ch": 26, "v": 15, "n": 1, "dh": "סתמום פלשתים", "pasuk_html": "וְכׇל־הַבְּאֵרֹ֗ת אֲשֶׁ֤ר חָֽפְרוּ֙ עַבְדֵ֣י אָבִ֔יו בִּימֵ֖י אַבְרָהָ֣ם אָבִ֑יו <mark>סִתְּמ֣וּם פְּלִשְׁתִּ֔ים</mark> וַיְמַלְא֖וּם עָפָֽר׃", "pasuk_en": "וַיִּסְתְּמוּ הַפְּלִשְׁתִּים אֶת־כׇּל־הַבְּאֵרוֹת אֲשֶׁר חָפְרוּ עַבְדֵי־אָבִיו בִּימֵי אַבְרָהָם אָבִיו וַיְמַלְאוּם עָפָר.", "rashi_he": "סתמום פלשתים. מִפְּנֵי שֶׁאָמְרוּ תַּקָּלָה הֵם לָנוּ מִפְּנֵי הַגְּיָסוֹת הַבָּאוֹת עָלֵינוּ, טַמּוֹנוּן פְּלִשְׁתָּאֵי לְשׁוֹן סְתִימָה, וּבִלְשׁוֹן הַתַּלְמוּד מְטַמְטֵם אֶת הַלֵּב:", "rashi_en": "וַיִּסְתְּמוּ הַפְּלִשְׁתִּים הַפְּלִשְׁתִּים סִתְּמוּם וַיֹּאמְרוּ שֶׁיָּכוֹל לִהְיוֹת לָנוּ לְסַכָּנָה מִפְּנֵי צְבָאוֹת נוֹשְׁמִים שֶׁיִּכָּנְסוּ אֵלֵינוּ וַחֲזָקָה וּכְמוֹ־כֵן הַתַּרְגּוּם כׇּל־דָּבָר וְנִמְצָא בִּלְשׁוֹן הַתַּלְמוּד.", "note": "", "points": [{"q": "לפי רַשְׁ״י, מַדּוּעַ סִתְּמוּ הַפְּלִשְׁתִּים אֶת־הַבְּאֵרוֹת?", "options": ["יָרְאוּ שֶׁהַבְּאֵרוֹת יִהְיוּ לְסַכָּנָה לָהֶם אִם צְבָאוֹת אוֹיְבִים יִכָּנְסוּ לָאָרֶץ וְיִבְקְשׁוּ מַיִם", "רָצוּ לִגְנוֹב אֶת־הַמַּיִם מֵהַבְּאֵרוֹת לְעַצְמָם", "הִנִּיחוּ אֶת־יִצְחָק עַל־עָשְׁרוֹ וְהַצְלָחָתוֹ"], "kasha": "מָה הִנְעִיעַ אֶת־הַפְּלִשְׁתִּים לַעֲשׂוֹת אֶת־הַמַּעֲשֶׂה שֶׁל־סִתּוּם הַבְּאֵרוֹת שֶׁחָפַר אַבְרָהָם?", "answer": "רַשְׁ״י מְבָאֵר שֶׁהַפְּלִשְׁתִּים סִתְּמוּ אֶת־הַבְּאֵרוֹת כִּי אָמְרוּ שֶׁהֵן יָכוֹלוֹת לִהְיוֹת סַכָּנָה בְעֵת הִשְׁתַּלְּחוּת צְבָאוֹת, שֶׁכִּי הַחַיָּלִים הַנּוֹשְׁמִים עַל־הַמְּדִינָה יוּכְלוּ לְהִשְׁתַּמֵּשׁ בָּהֶם כְּדֵי לְהַסְתִּיר מַיִם בַּמַּלְחָמָה נֶגֶד־קַרְקַע פְּלִישְׁתִּית."}]}, {"id": "26:17.1", "ch": 26, "v": 17, "n": 1, "dh": "בנחל גרר", "pasuk_html": "וַיֵּ֥לֶךְ מִשָּׁ֖ם יִצְחָ֑ק וַיִּ֥חַן <mark>בְּנַֽחַל־גְּרָ֖ר</mark> וַיֵּ֥שֶׁב שָֽׁם׃", "pasuk_en": "וַיִּשַׂע מִשָּׁם יִצְחָק וַיִּחַן בְּנַחַל גְּרָר וַיֵּשֶׁב שָׁם.", "rashi_he": "בנחל גרר. רָחוֹק מִן הָעִיר:", "rashi_en": "בְּנַחַל גְּרָר רָחוֹק מִן־הָעִיר.", "note": "", "points": [{"q": "מָה מְלַמֵּד רַשְׁ״י אַל־בְּרִירַת יִצְחָק לַחֲנוֹת בַּנַּחַל שֶׁל־גְּרָר?", "options": ["בָּחַר בִּמְקוֹם רָחוֹק מְאוֹד מִן־הָעִיר", "בָּחַר בַּנַּחַל הַפּוֹרְיָנִי בְיוֹתֵר בָּאֵזוֹר", "בָּחַר בִּמְקוֹם קָרוֹב לָעִיר לִשְׁמִירָה"], "kasha": "לָמָּה הַפָּסוּק מְיַחֵד שֶׁיִּצְחָק חָנָה בַּנַּחַל אוֹ בַּגַּיְא שֶׁל־גְּרָר—מַה־הַחִשְׁיבוּת שֶׁל־מִקוֹם זֶה?", "answer": "רַשְׁ״י מְלַמֵּד שֶׁהַנַּחַל שֶׁל־גְּרָר הָיָה רָחוֹק מְאוֹד מִן־הָעִיר, וְהַכּוּנָּה שֶׁיִּצְחָק בָּחַר בְּמֵתוֹק קְמוּעַ, כִּי בַּדַּרְכּוֹ לִשְׁמוֹר מִנִּזְקִים נוֹסָפִים מִן־הַפְּלִישְׁתִּים."}]}, {"id": "26:18.1", "ch": 26, "v": 18, "n": 1, "dh": "וישב ויחפר", "pasuk_html": "וַיָּ֨שׇׁב יִצְחָ֜ק וַיַּחְפֹּ֣ר&thinsp;׀ אֶת־בְּאֵרֹ֣ת הַמַּ֗יִם אֲשֶׁ֤ר חָֽפְרוּ֙ בִּימֵי֙ אַבְרָהָ֣ם אָבִ֔יו וַיְסַתְּמ֣וּם פְּלִשְׁתִּ֔ים אַחֲרֵ֖י מ֣וֹת אַבְרָהָ֑ם וַיִּקְרָ֤א לָהֶן֙ שֵׁמ֔וֹת כַּשֵּׁמֹ֕ת אֲשֶׁר־קָרָ֥א לָהֶ֖ן אָבִֽיו׃", "pasuk_en": "וַיַּחְפֹּר יִצְחָק אֶת־בְּאֵרוֹת הַמַּיִם אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו וַיִּסְתְּמוּם הַפְּלִישְׁתִּים אַחֲרֵי מוֹת אַבְרָהָם וַיִּקְרָא לָהֶם שֵׁמוֹת כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶם אָבִיו.", "rashi_he": "וישב ויחפר. הַבְּאֵרוֹת אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו וּפְלִשְׁתִּים סִתְּמוּם, מִקֹּדֶם שֶׁנָּסַע יִצְחָק מִגְּרָר, חָזַר וַחֲפָרָן:", "rashi_en": "וַיַּחְפֹּר יִצְחָק אֶת־בְּאֵרוֹת הַמַּיִם אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו אֲשֶׁר סִתְּמוּם הַפְּלִישְׁתִּים לִפְנֵי שֶׁיָּצָא יִצְחָק מִגְּרָר חָזַר וַחֲפָרָן.", "note": "", "points": [{"q": "אֵיזוֹ סִדְרִית שֶׁל־אֵרוּעִים מְבָאֵר רַשְׁ״י בְּנִדּוּן חְפִירַת הַבְּאֵרוֹת עַל־יְדֵי יִצְחָק?", "options": ["הַבְּאֵרוֹת סֻתְּמוּ לִפְנֵי שֶׁיִּצְחָק עָזַב אֶת־גְּרָר, וְאַחַר־כָּךְ חָזַר וַחֲפָרָן שׁוּב", "יִצְחָק חָפַר אֶת־הַבְּאֵרוֹת לָרִאשׁוֹנָה לְאַחַר בּוֹאוֹ לְגְּרָר", "יִצְחָק חָפַר בְּאֵרוֹת חֲדָשׁוֹת בְּעוֹד הוּא דָּר בָּעִיר שֶׁל־גְּרָר"], "kasha": "הַפָּסוּק נִרְאֶה לְתָאֵר פְּעוּלוֹת שֶׁקָּרוּ בִּזְמַנִּים שׁוֹנִים—בְּאֵיזוֹ עֵת בִּדְוָקָא חָפַר יִצְחָק אֶת־הַבְּאֵרוֹת בִּיחוּס לַעֲזִיבַת גְּרָר?", "answer": "רַשְׁ״י מְבָאֵר שֶׁהַפְּלִישְׁתִּים סִתְּמוּ אֶת־הַבְּאֵרוֹת הַלָּלוּ לִפְנֵי שֶׁיִּצְחָק עָזַב אֶת־גְּרָר; רַק לְאַחַר עֲזִיבָתוֹ חָזַר וַחֲפָרָן שׁוּב."}]}, {"id": "26:20.1", "ch": 26, "v": 20, "n": 1, "dh": "עשק", "pasuk_html": "וַיָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם־רֹעֵ֥י יִצְחָ֛ק לֵאמֹ֖ר לָ֣נוּ הַמָּ֑יִם וַיִּקְרָ֤א שֵֽׁם־הַבְּאֵר֙ <mark>עֵ֔שֶׂק</mark> כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽוֹ׃", "pasuk_en": "וַיָּרִיבוּ רוֹעֵי גְרָר אֶת־רוֹעֵי יִצְחָק לֵאמֹר לָנוּ הַמָּיִם וַיִּקְרָא שֵׁם־הַבְּאֵר עֵשֶׂק כִּי הִתְעַשְּׂקוּ עִמּוֹ.", "rashi_he": "עשק. עִרְעוּר:", "rashi_en": "עֵשֶׂק הִיא רִיב.", "note": "", "points": [{"q": "מָה הַמַּשְׁמָעוּת שֶׁל־הַמִּלָּה 'עֵשֶׂק' בִּשְׁמוֹ שֶׁנָּתַן יִצְחָק לַבְּאֵר?", "options": ["הַמַּשְׁמָעוּת הִיא רִיב אוֹ מַחְלֹקֶת", "הַמַּשְׁמָעוּת הִיא מַיִם אוֹ מַעְיָן", "הַמַּשְׁמָעוּת הִיא בּוֹר עָמוּק אוֹ חִפּוּר"], "kasha": "לָמָּה בָּחַר יִצְחָק אֶת־הַשֵּׁם הַמְּיֻחָד הַזֶּה לַבְּאֵר, וּמָה הִיא מְשַׁמַּעְתּוֹ?", "answer": "רַשְׁ״י מְלַמֵּד שֶׁ'עֵשֶׂק' הִיא מַשְׁמָעוּת רִיב, וּמַשְׁקִיף לַמִּחְלֹקֶת (עִרְעוּר) שֶׁהִזְדַּחֲתָה בַּדַּיִךְ בֵּין רוֹעֵי יִצְחָק לִרְעֵי הַפְּלִישְׁתִּים עַל מֵימֵי הַבְּאֵר."}]}, {"id": "26:20.2", "ch": 26, "v": 20, "n": 2, "dh": "כי התעשקו עמו", "pasuk_html": "וַיָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם־רֹעֵ֥י יִצְחָ֛ק לֵאמֹ֖ר לָ֣נוּ הַמָּ֑יִם וַיִּקְרָ֤א שֵֽׁם־הַבְּאֵר֙ עֵ֔שֶׂק <mark>כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽוֹ׃</mark>", "pasuk_en": "וַיָּרִיבוּ רוֹעֵי גְרָר אֶת־רוֹעֵי יִצְחָק לֵאמֹר לָנוּ הַמָּיִם וַיִּקְרָא שֵׁם־הַבְּאֵר עֵשֶׂק כִּי הִתְעַשְּׂקוּ עִמּוֹ.", "rashi_he": "כי התעשקו עמו. נִתְעַשְּׂקוּ עִמּוֹ עָלֶיהָ בִּמְרִיבָה וְעִרְעוּר:", "rashi_en": "כִּי הִתְעַשְּׂקוּ עִמּוֹ בַּרִיב וּמַחֲלֹקֶת.", "note": "", "points": [{"q": "מָה הַכַּוָּנָה שֶׁל־רַשְׁ״י בֶּאֱמוֹר שֶׁהָרוֹעִים 'הִתְעַשְּׂקוּ עִמּוֹ בִּרְדִי וּמַחֲלֹקֶת'?", "options": ["הִרִיבוּ וְנִשְׂתַּלְּמוּ עִם יִצְחָק עַל הַבְּאֵר בִּדְבָרִים", "נִלְחַמוּ בַּגּוּפוּ עִם עַבְדֵי יִצְחָק", "הִתְעַלְּמוּ מִיִּצְחָק וְלָקְחוּ אֶת־הַמַּיִם בְּלִי הִתְחַשְּׁבוּת"], "kasha": "הַפָּסוּק שׁוֹמֵשׁ בַּמִּלָּה הִתְעַשְּׂקוּ (hitashku), אֲשֶׁר יָכוֹל לִהְיוֹת לֹא בָּרוּר בְּמַשְׁמָעוּתוֹ הַמְּדוּיֶּקֶת.", "answer": "רַשְׁ״י מְבָאֵר שֶׁהִתְעַשְּׂקוּ הִיא הַכָּוָנָה שֶׁהֵם הִשְׁתַּלְּמוּ עִם יִצְחָק בְּרִדִי וּמַחֲלֹקֶת פָּנִים כִּי זֶה עַל הַמַּיִם, וּמַגִּידָה לִתְבוּנַת־הַקְּרָב שֶׁלָּהֶם הִיא שֶׁנוּשְׂמוּ דִּבָּרִים וִשִׁנּוּן תַּחְבּוּלוֹת."}]}, {"id": "26:21.1", "ch": 26, "v": 21, "n": 1, "dh": "שטנה", "pasuk_html": "וַֽיַּחְפְּרוּ֙ בְּאֵ֣ר אַחֶ֔רֶת וַיָּרִ֖יבוּ גַּם־עָלֶ֑יהָ וַיִּקְרָ֥א שְׁמָ֖הּ <mark>שִׂטְנָֽה׃</mark>", "pasuk_en": "וַיִּחְפְּרוּ בְאֵר אַחֶרֶת וַיָּרִיבוּ גַּם־עָלֶיהָ וַיִּקְרָא שְׁמָהּ שִׂטְנָה.", "rashi_he": "שטנה. נושימנ\"ט:", "rashi_en": "שִׂטְנָה - לַשׁוֹן פְּרַצְסִית יְשָׁנָה 'nuisement'; עִבְרִית הַטְרָדָה.", "note": "", "points": [{"q": "לפי רש״י, מה משמעות המילה העברית 'שִׂטְנָה'?", "options": ["הַטְרָדָה אוֹ עִכּוּב", "בְאֵר עמוּקָה אוֹ בּוֹר", "קִנְאָה אוֹ קִנּוּי"], "kasha": "הַמִּלָּה שִׂטְנָה הִיא מוֹנָח עִבְרִי הַדּוֹרֵשׁ תַּרְגּוּם כְּדֵי לְהָבִין אֶת הַתִּכּוּנָה שֶׁהַבְּאֵר מְתוֹכָהּ מְתוּאֶרֶת.", "answer": "רַשׁ״י מְתַרְגֵּם שִׂטְנָה בְעַזְרַת פְּרַצְסִית יְשָׁנָה (nuisement) לְמַשְׁמָעוּת הַטְרָדָה אוֹ עִכּוּב, כַּוַּוָּנָה שֶׁגַּם בְּאֵר זוֹ הוֹצִיאָה צָרוֹת וּמַעֲנִיעוּת מִצַּד רוֹעֵי אֲבִימֶלֶךְ."}]}, {"id": "26:22.1", "ch": 26, "v": 22, "n": 1, "dh": "ופרינו בארץ", "pasuk_html": "וַיַּעְתֵּ֣ק מִשָּׁ֗ם וַיַּחְפֹּר֙ בְּאֵ֣ר אַחֶ֔רֶת וְלֹ֥א רָב֖וּ עָלֶ֑יהָ וַיִּקְרָ֤א שְׁמָהּ֙ רְחֹב֔וֹת וַיֹּ֗אמֶר כִּֽי־עַתָּ֞ה הִרְחִ֧יב יְהֹוָ֛ה לָ֖נוּ <mark>וּפָרִ֥ינוּ בָאָֽרֶץ׃</mark>", "pasuk_en": "וַיִּסַּע מִשָּׁם בְּאֵר אַחֶרֶת וַיִּחְפְּרוּ וְלֹא־רָבוּ עָלֶיהָ וַיִּקְרָא שְׁמָהּ רְחֹבוֹת וַיֹּאמֶר כִּי־עַתָּה הִרְחִיב ה׳ לָנוּ וּפָרִינוּ בָּאָרֶץ.", "rashi_he": "ופרינו בארץ. כְּתַרְגּוּמוֹ וְנֵיפוּשׁ בְּאַרְעָא:", "rashi_en": "וּפָרִינוּ בָּאָרֶץ - כְּתַרְגּוּם: וְנִפּוּשׁ בְּאָרְעָא וְנִגְדַּל בָּאָרֶץ.", "note": "", "points": [{"q": "מַה אוֹמֵר רַשׁ״י שֶׁמִּשְׁמַעוּת הַפָּסוּק 'וּפָרִינוּ בָּאָרֶץ' הִיא, לְפִי הַתַּרְגּוּם?", "options": ["נִגְדַּל וְנִשְׂמַח בָּאָרֶץ", "נִזְרַע תְּבוּאוֹת וְנִקְצֹר אוֹתָן", "נִמְשֹׁל עַל־הָאָרֶץ"], "kasha": "צוּרַת הַפָּעַל הָעִבְרִית וּמִשְׁמָעוּתָהּ הַמְדוּיֶּקֶת מִתּוֹךְ מַה שֶׁיִּצְחָק מִתְבָּרֵךְ בּוֹ צְרִיכִים הַבְהָרָה.", "answer": "רַשׁ״י מָנִיחַ תַּרְגּוּם כְּדֵי לְהַרְאוֹת שֶׁ'וּפָרִינוּ' פִּרְשׁוֹ נִגְדַּל וְנִשְׂמַח (וְנִפּוּשׁ) בָּאָרֶץ, מְקַשֵּׁר אֶת־הַבְּרָכָה מִתּוֹךְ מָקוֹם עִם הַיְכוֹלֶת לְהִשְׁתַּרְעַע וּלְהַצְלִיחַ."}]}, {"id": "26:26.1", "ch": 26, "v": 26, "n": 1, "dh": "ואחזת מרעהו", "pasuk_html": "וַאֲבִימֶ֕לֶךְ הָלַ֥ךְ אֵלָ֖יו מִגְּרָ֑ר <mark>וַאֲחֻזַּת֙ מֵֽרֵעֵ֔הוּ</mark> וּפִיכֹ֖ל שַׂר־צְבָאֽוֹ׃", "pasuk_en": "וַיָּבֹא אֵלָיו אֲבִימֶלֶךְ מִגְּרָר וַאַחוּזַּת מֵרֵעָיו וּפִיכֹל שַׂר־צְבָאוֹ.", "rashi_he": "ואחזת מרעהו. כְּתַרְגּוּמוֹ וְסִיעַת מֵרַחֲמוֹהִי, סִיעַת מֵאוֹהֲבָיו. וְיֵשׁ פּוֹתְרִין מֵרֵעֵהוּ מ' מִיסוֹד הַתֵּבָה, כְּמוֹ שְׁלֹשִׁים מֵרֵעִים דְּשִׁמְשׁוֹן, כְּדֵי שֶׁתִּהְיֶה תֵּבַת וַאֲחֻזַּת דְּבוּקָה; אֲבָל אֵין דֶּרֶךְ אֶרֶץ לְדַבֵּר עַל הַמַּלְכוּת כֵּן, סִיעַת אוֹהֲבָיו, שֶׁאִם כֵּן, כָּל סִיעַת אוֹהֲבָיו הוֹלִיךְ עִמּוֹ, וְלֹא הָיָה לוֹ אֶלָּא סִיעָה אַחַת שֶׁל אוֹהֲבִים – לָכֵן יֵשׁ לְפָתְרוֹ בַּלָּשׁוֹן הָרִאשׁוֹן; וְאַל תִּתְמַהּ עַל תָּי\"ו שֶׁל אֲחֻזַּת וְאַעַ\"פִּ שֶׁאֵין תֵּבָה סְמוּכָה, יֵשׁ דֻּגְמָתָהּ בַּמִּקְרָא עֶזְרָת מִצָּר (תהילים ס'), וּשְׁכֻרַת וְלֹא מִיָּיִן (ישעיהו נ\"א):", "rashi_en": "וַאַחוּזַּת מֵרֵעָיו - כְּתַרְגּוּם: וְסִיעְתָא מִן־חַבְרוֹהִי סִיעָה מִן־חֲבֵרִים, הַמֵּם בִּמְיוּחַד מִן. סִיעָה מִן־אוֹהֲבָיו. יֵשׁ מִי שֶׁפּוֹרֵשׁ בִּמְיוּחַד שֶׁבִּמְיוּחַד בִּמְיוּחַד 'מֵרֵעָיו' הַמֵּם הוּא מֵחוּלֵק הַשֵּׁם מֵרַע, כִּי בִמְיוּחַד (שׁוּפְטִים י״ד:י״א) שְׁלֹשִׁים מֵרָעִים בְּסִפּוּר שִׁמְשׁוֹן, כְּדֵי שֶׁהַמִּלָּה וַאַחוּזַּת תִּהְיֶה סָמוּכָה לִמְיוּחַד מֵרֵעָיו. אַךְ לֹא הָיָה דֶּרֶךְ אֶרֶץ לָדַבֵּר כָּךְ עַל־הַמְלוּכָה - חִבּוּר מִתּוֹךְ חֲבֵרָיו, כִּי אִם הָיָה זֶה הַפֵּרוּשׁ הַיָּשׁ הִשְׁתַּמַּעוּת שֶׁלָּקַח עִמּוֹ אֶת־כָּל־סִיעַת־חֲבֵרָיו וְאֵיןּ לוֹ אֶלָּא סִיעָה אַחַת מִתּוֹךְ חֲבֵרִים. עַל־כֵּן צָרִיךְ לִפְרֹשׁ בַּדֶּרֶךְ הָרִאשׁוֹנָה (שֶׁאַחוּזַּת אֵינָהּ סָמוּכָה). וְאַל־תִּתְמַהּ עַל־הַתֶּת שֶׁל־אַחוּזַּת אַף־עַל־פִּי שֶׁהַמִּלָּה אֵינָהּ סָמוּכָה, כִּי יֵשׁ לָנוּ דוֹמִים בַּמִּקְרָא: (תְּהִלִּים ס׳:י״ג) עֶזְרַת (עַד־הַצַּר) וּ(יְשַׁעְיָה נ״א:כ״א) שִׁכּוֹרֶת (וַלֹּא בַּיַּיִן).", "note": "", "points": [{"q": "מַה אוֹמֵר רַשׁ״י שֶׁ'אַחוּזַּת מֵרֵעָיו' פִּרְשׁוֹ לְפִי הַתַּרְגּוּם?", "options": ["חִבּוּר אוֹ קְבוּצָה מִחֲבֵרָיו הִצְטָרְפוּ אֵלָיו", "יוֹעֲצוֹ הִקּוֹב וַחֲבֵרוֹ הַנֶּאֱמָן", "קוֹמַנְדָּנְטוֹ צְבָאִי וְאִישׁ הַאִסְטְרַטֶגְיָה שֶׁלּוֹ"], "kasha": "הַצִּיּוּר הָעִבְרִי 'אַחוּזַּת מֵרֵעָיו' הוּא עָמִום - הוּא יָכוֹל לְהִמָּנוֹת דְּבָרִים שׁוֹנִים תַּלְמוּד עַל אֵיךְ מִלִּים אֵלּוּ מְחוּלָּקוֹת.", "answer": "רַשׁ״י מְבָרֵר דֶּרֶךְ הַתַּרְגּוּם שֶׁאַחוּזַּת הִיא חִבּוּר (סִיעָה) שֶׁנִּשְׁמְרָה מֵחֲבֵרִים שֶׁל־אֲבִימֶלֶךְ, כְּלוֹמַר שְׁלוּחִים מִתּוֹךְ חֲבֵרִים הִלְכוּ עִמּוֹ וַלֹּא רַק יוֹעֵץ אֶחָד."}, {"q": "לָמָּה רַשׁ״י דּוֹחֶה אֶת־הַרַעְיוֹן שֶׁ'אַחוּזַּת' הִיא בַּסְמִיכוּת?", "options": ["כִּי הָיָה חַסַּר־כָּבוֹד לוֹמַר שׁלְמֶלֶךְ הָיָה רַק חִבּוּר אֶחָד מִתּוֹךְ חֲבֵרִים", "כִּי הַדִּקְדּוּק הָעִבְרִי אֵינוּ מֶתִּיר צוּרוֹת סְמִיכוּת עִם הַמִּלָּה הַזֹּאת", "כִּי הַתַּרְגּוּם בִּמְיוּחַד אוֹסֵר עַל־הַפִּרְשׁוּת הַזֹּאת"], "kasha": "הַמִּבְנֶה הַדִּקְדּוּקִי שֶׁל־'אַחוּזַּת מֵרֵעָיו' יָכוֹל לְהַצִּיעַ יַחֲסִים שׁוֹנִים בֵּין הַמִּלּוֹת.", "answer": "רַשׁ״י טוֹעֵן שֶׁהָיָה חַסַּר־כָּבוֹד (לֹא דֶּרֶךְ אֶרֶץ) לוֹמַר עַל־הַמְלוּכָה שֶׁיֶּשׁ לָהּ 'חִבּוּר מִתּוֹךְ חֲבֵרִים' בִּלְבַד, כִּי אִם הָיָה זֶה הַפֵּרוּשׁ זֶה הָיָה מַשְׁמָע שֶׁאֲבִימֶלֶךְ לָקַח עִמּוֹ אֶת־כָּל־הַחִבּוּר מִתּוֹךְ חֲבֵרָיו וְשֶׁאֵין לוֹ אֶלָּא חִבּוּר אֶחָד מִתּוֹךְ חֲבֵרִים, לָכֵן יָשׁ לִפְרֹשׁ בַּדֶּרֶךְ הָרִאשׁוֹנָה (שֶׁאַחוּזַּת אֵינָהּ בַּסְמִיכוּת)."}]}, {"id": "26:26.2", "ch": 26, "v": 26, "n": 2, "dh": "אחזת", "pasuk_html": "וַאֲבִימֶ֕לֶךְ הָלַ֥ךְ אֵלָ֖יו מִגְּרָ֑ר <mark>וַאֲחֻזַּת֙</mark> מֵֽרֵעֵ֔הוּ וּפִיכֹ֖ל שַׂר־צְבָאֽוֹ׃", "pasuk_en": "וַיָּבֹא אֵלָיו אֲבִימֶלֶךְ מִגְּרָר וַאַחוּזַּת מֵרֵעָיו וּפִיכֹל שַׂר־צְבָאוֹ.", "rashi_he": "אחזת. לְשׁוֹן קְבִיצָה וַאֲגֻדָּה שֶׁנֶּאֱחָזִין יַחַד:", "rashi_en": "אַחוּזַּת - קִבּוּץ וַחִבּוּר, וּחִבּוּר נִקְרָא כָּךְ כִּי הַאֲנָשִׁים הַמּוֹרְכָּבִים מִמֶּנּוּ נֶאֱחָזִים בְּיַחַד.", "note": "", "points": [{"q": "מַה אוֹמֵר רַשׁ״י עַל־הַמִּלָּה 'אַחוּזַּת' עַצְמָהּ, בְנוֹגַע לַמִּשְׁמַעוּת הָאֶטִּימוֹלוֹגִית שֶׁלָּהּ?", "options": ["הִיא מַשְׁמָעוּת קִבּוּץ אוֹ חִבּוּר מִתּוֹךְ אֲנָשִׁים שֶׁהֻחְזְקוּ בְּיַחַד", "הִיא נִגְזֶרֶת מִן־הַמִּלָּה לִ'כּוֹחַ' אוֹ 'עִז'", "הִיא מְשַׁמֶּנֶת יְחִידָה צְבָאִית אוֹ פּוֹלוּגוּ"], "kasha": "הַמִּשְׁמַעוּת וְהָאֶטִּימוֹלוֹגְיָה שֶׁל־הַמִּלָּה הָעִבְרִית 'אַחוּזַּת' עַצְמָהּ צְרִיכִים הַבְהָרָה כְּדֵי לְהָבִין לָמָּה הִיא מִשְׁמַעוּת קִבּוּץ.", "answer": "רַשׁ״י מְבָרֵר שֶׁאַחוּזַּת הִיא קִבּוּץ וְחִבּוּר, וַאֲנָשִׁים אֵלּוּ נִקְרָאִים 'חִבּוּר' כִּי הֵם נֶאֱחָזִים בְּיַחַד כְּקְבוּצָה מְאוּחֶּדֶת."}]}, {"id": "26:28.1", "ch": 26, "v": 28, "n": 1, "dh": "ראו ראינו", "pasuk_html": "וַיֹּאמְר֗וּ <mark>רָא֣וֹ רָאִ֘ינוּ֮</mark> כִּֽי־הָיָ֣ה יְהֹוָ֣ה&thinsp;׀&thinsp;עִמָּךְ֒ וַנֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖ינוּ בֵּינֵ֣ינוּ וּבֵינֶ֑ךָ וְנִכְרְתָ֥ה בְרִ֖ית עִמָּֽךְ׃", "pasuk_en": "וַיֹּאמְרוּ רָאוֹ רָאִינוּ כִּי־הָיָה ה׳ עִמָּךְ וַנֹּאמְרָה נָּא בְרִית בֵּינוֹתֵינוּ בֵּינְךָ וּבֵינֵנוּ וְנִכְרְתָה בְרִית עִמָּךְ.", "rashi_he": "ראו ראינו. רָאִינוּ בְאָבִיךָ, רָאִינוּ בְךָ:", "rashi_en": "רָאוֹ רָאִינוּ - רָאִינוּ בַּאֲבִי שֶׁלְּךָ וְרוֹאִים אָנוּ בְּךָ (בְּרֵאשִׁית רַבָּה ס״ד:י׳).", "note": "", "points": [{"q": "מַה מְבָרֵר רַשׁ״י עַל־הַצִּיּוּר הַחוּזֵר 'רָאוֹ רָאִינוּ'?", "options": ["הֵם רָאוּ אֶת־הַבְּרָכָה שֶׁל־אֲבִי יִצְחָק וּמִמְשִׁיכִים לִרְאוֹת אוֹתָהּ עִם יִצְחָק", "הֵם רָאוּ אֶת־הַבְּרָכָה שְׁתַּיִם - פַּעַם בְּחָזוֹן וּפַעַם בַּמַּצִּיאוּת", "הֵם מְדַגִּישִׁים כַּמָּה הָיָה הַדָּבָר נִפְלָא"], "kasha": "הַחֲזִירוּת שֶׁל־הַצִּיּוּר (רָאוֹ רָאִינוּ - פִּשְׁמִיטּוּת 'רִאָה רָאִינוּ') הִיא אֶמְפַּטִּית וְצָרִיכָה הַבְהָרָה מִתּוֹךְ מָה שֶׁהִיא מַדְגִּישָׁה.", "answer": "רַשׁ״י מְבָרֵר שֶׁהַצִּיּוּר הַחוּזֵר פִּרְשׁוּ שֶׁהֵם רָאוּ אֶת־הַבְּרָכָה שֶׁל־אֱלֹהִים בְּעֵנְיַן אֲבָדוֹ (אֲבִי יִצְחָק) וּמִמְשִׁיכִים לִרְאוֹת אוֹתָהּ בִּעֵנְיַן יִצְחָק עַצְמוֹ, מַרְאֶה שְׁנִיּוּת שֶׁל־הַחֶסֶד שֶׁל־אֱלֹהִים דּוֹר אַחַר דּוֹר."}]}, {"id": "26:28.2", "ch": 26, "v": 28, "n": 2, "dh": "תהי נא אלה בינותינו", "pasuk_html": "וַיֹּאמְר֗וּ רָא֣וֹ רָאִ֘ינוּ֮ כִּֽי־הָיָ֣ה יְהֹוָ֣ה&thinsp;׀&thinsp;עִמָּךְ֒ וַנֹּ֗אמֶר <mark>תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖ינוּ</mark> בֵּינֵ֣ינוּ וּבֵינֶ֑ךָ וְנִכְרְתָ֥ה בְרִ֖ית עִמָּֽךְ׃", "pasuk_en": "וַיֹּאמְרוּ כִּי רָאִינוּ כִּי־הָיָה יְהוָה עִמָּךְ וַנֹּאמְרָה תְּהִי־נָא אָלָה בֵּינוֹתֵינוּ בֵּינִים וּבֵינֶךָ וְנִכְרְתָה בְּרִית עִמָּךְ", "rashi_he": "תהי נא אלה בינותינו וגו'. הָאָלָה אֲשֶׁר בֵּינוֹתֵינוּ מִימֵי אָבִיךָ תְּהִי גַּם עַתָּה בינינו וביניך:", "rashi_en": "תְּהִי נָא אָלָה בֵּינוֹתִינוּ וְגוֹ - הַשְּׁבוּעָה שֶׁהָיְתָה בֵּינֵינוּ מִימֵי אָבִיךָ תִּמְשׁוֹךְ עַתָּה בֵּינֵינוּ וּבֵינְךָ.", "note": "", "points": [{"q": "לְדִבְרֵי רַשִׁ״י, מַה הַכָּוָנָה כְּשֶׁאָבִימֶלֶךְ אוֹמֵר 'תְּהִי־נָא אָלָה בֵּינוֹתֵינוּ'?", "options": ["שֶׁהַשְּׁבוּעָה שֶׁהָיְתָה בֵּינֵיהֶם מִימֵי אַבְרָהָם תִּמְשׁוֹךְ עַתָּה בְּךָ וּבֵינוֹ", "שֶׁנַּעֲשֶׂה שְׁבוּעָה חֲדָשָׁה שֶׁלִּעוֹלָם לֹא הָיְתָה קוֹדֶם לְכֵן", "שֶׁנִּשָּׁמַר שְׁבוּעָה בֵּין קוֹמַנְדַּנְטִים צְבָאִיִּים בִּלְבַד"], "kasha": "טִבְעָהּ שֶׁל הַשְּׁבוּעָה וְהַקְּשׁוּר שֶׁלָּהּ לְהַסְכָּמָה הַקַּדְמוֹנִית עִם אַבְרָהָם זְקוּקִים לְהַבְהָרָה.", "answer": "רַשִׁ״י מְבָאֵר שֶׁאָבִימֶלֶךְ מִתְחַנֵּן שֶׁהַשְּׁבוּעָה שֶׁהָיְתָה בֵּינֵיהֶם מִימֵי אָבִיךָ (אַבְרָהָם) תִּמְשׁוֹךְ עַתָּה בַּחֲזָרָה בֵּינוֹ וּבֵין יִצְחָק."}]}, {"id": "26:29.1", "ch": 26, "v": 29, "n": 1, "dh": "לא נגענוך", "pasuk_html": "אִם־תַּעֲשֵׂ֨ה עִמָּ֜נוּ רָעָ֗ה כַּאֲשֶׁר֙ <mark>לֹ֣א נְגַֽעֲנ֔וּךָ</mark> וְכַאֲשֶׁ֨ר עָשִׂ֤ינוּ עִמְּךָ֙ רַק־ט֔וֹב וַנְּשַׁלֵּֽחֲךָ֖ בְּשָׁל֑וֹם אַתָּ֥ה עַתָּ֖ה בְּר֥וּךְ יְהֹוָֽה׃", "pasuk_en": "לְּךָ לוֹא תַעֲשֶׂה־לָּנוּ רָעָה כַּאֲשֶׁר לֹא־נָגַעְנוּ בְּךָ וְכַאֲשֶׁר עָשִׂינוּ אִתְּךָ רַק־טוֹב וַנִּשְׁלָּחְךָ בְּשָׁלוֹם אַתָּה עַתָּה בְּרוּךְ יְהוָה", "rashi_he": "לא נגענוך. כְּשֶׁאָמַרְנוּ לֵךְ לְךָ מֵעִמָּנוּ:", "rashi_en": "לֹא נָגַעְנוּ בְךָ בִּשְׁעַת שֶׁאָמַרְנוּ לְךָ לֵךְ מֵעִמָּנוּ.", "note": "", "points": [{"q": "מַה אוֹמֵר רַשִׁ״י שֶׁהַמִּלִּים 'לֹא נָגַעְנוּ בְךָ' מִשְׁתַּמְּרוֹת אֵלָיו בַּהִקְשׁוּר הַזֶּה?", "options": ["כַּאֲשֶׁר אָבִימֶלֶךְ אָמַר לְיִצְחָק לֵלֶכֶת - לֹא הִכּוּ אוֹתוֹ בִּשְׁעַת הִשְׁמָרוּתוֹ", "בְּכָל זְמַן שֶׁיִּצְחָק הָיָה בִּגְרָר - הֵם לֹא פָּגְעוּ בּוֹ פְּגִיעָה פִּיזִית", "בַּמַּחֲלֹקֶת עַל הַבְּאֵרוֹת - לֹא שַׁלְחוּ יָד בּוֹ"], "kasha": "הַמִּלִּים 'לֹא נָגַעְנוּ בְךָ' יָכוֹלוֹת לְהִשְׁתַּמֵּר לְמוֹמֶנְטִים שׁוֹנִים בַּנַּרָטִיב, וְרַשִׁ״י מְבָאֵר אֵיזֶה אֶחָד.", "answer": "רַשִׁ״י מְבָאֵר שֶׁ'לֹא נָגַעְנוּ בְךָ' מִשְׁתַּמֵּר לַחְזֹר בִּשְׁנֵיהֶם שָׁאמְרוּ לוֹ 'לֵךְ מֵעִמָּנוּ' - פֵּרוּשׁ בִּשְׁעַת שֶׁבִּקְּשׁוּ אוֹתוֹ לֵלֶכֶת, לֹא הִכּוּ אוֹתוֹ וְלֹא הִתְנַפְּלוּ עָלָיו בַּמִּדִּין."}]}, {"id": "26:29.2", "ch": 26, "v": 29, "n": 2, "dh": "אתה", "pasuk_html": "אִם־תַּעֲשֵׂ֨ה עִמָּ֜נוּ רָעָ֗ה כַּאֲשֶׁר֙ לֹ֣א נְגַֽעֲנ֔וּךָ וְכַאֲשֶׁ֨ר עָשִׂ֤ינוּ עִמְּךָ֙ רַק־ט֔וֹב וַנְּשַׁלֵּֽחֲךָ֖ בְּשָׁל֑וֹם <mark>אַתָּ֥ה</mark> עַתָּ֖ה בְּר֥וּךְ יְהֹוָֽה׃", "pasuk_en": "לְּךָ לוֹא תַעֲשֶׂה־לָּנוּ רָעָה כַּאֲשֶׁר לֹא־נָגַעְנוּ בְּךָ וְכַאֲשֶׁר עָשִׂינוּ אִתְּךָ רַק־טוֹב וַנִּשְׁלָּחְךָ בְּשָׁלוֹם אַתָּה עַתָּה בְּרוּךְ יְהוָה", "rashi_he": "אתה. גַּם אַתָּה עֲשֵׂה לָנוּ כְּמוֹ כֵן:", "rashi_en": "אַתָּה - אַתָּה גַּם־כֵּן עֲשֵׂה עִמָּנוּ כְּמוֹ־כֵן.", "note": "", "points": [{"q": "מַה אוֹמֵר רַשִׁ״י שֶׁאָבִימֶלֶךְ מִתְחַנֵּן מִיִּצְחָק לַעֲשׂוֹת בְּתָמוּתוֹ?", "options": ["שֶׁיִּתְנַהֵג עִם אָבִימֶלֶךְ וְעַם־וֹ בְּטוֹבוּת, כַּאֲשֶׁר הִתְנַהֲגוּ עִמּוֹ בְּטוֹבוּת", "שֶׁיִּסְלַח לְאָבִימֶלֶךְ עַל כָּל־מַחֲלֹקוֹת הַקַּדְמוֹנִיוֹת", "שֶׁיִּשָּׁמַר לְעוֹלָם לְבִלְתִּי חֲזֹר לְאַרְצוֹ שֶׁל אָבִימֶלֶךְ"], "kasha": "הַמִּלָּה 'אַתָּה' בְּסוֹף הַפָּסוּק נִרְאָה שִׁמָּהּ דִּגְשׁוּת מִיֻּחֶדֶת שְׁזָקָה לְהַבְהָרָה - מַה הִיא?", "answer": "רַשִׁ״י מְבָאֵר שֶׁאָבִימֶלֶךְ מִתְחַנֵּן לְחֲזָרַת־מִדָּה: 'גַּם אַתָּה עֲשֵׂה עִמָּנוּ כְּמוֹ־כֵן.' הַדִּגְשׁוּת עַל 'אַתָּה' מַדְגִּישׁ שֶׁאָבִימֶלֶךְ רוֹצֶה שֶׁיִּצְחָק יִשְׁקֵף אֶת הַתְּנַהֲגוּת הַטּוֹבָה שֶׁהֵם הִשְׁתַּמְּרוּ לוֹ בּוֹ."}]}, {"id": "26:33.1", "ch": 26, "v": 33, "n": 1, "dh": "שבעה", "pasuk_html": "וַיִּקְרָ֥א אֹתָ֖הּ <mark>שִׁבְעָ֑ה</mark> עַל־כֵּ֤ן שֵׁם־הָעִיר֙ בְּאֵ֣ר שֶׁ֔בַע עַ֖ד הַיּ֥וֹם הַזֶּֽה׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיִּקְרָא אֶת־שֵׁם־הַבְּאֵר שִׁבְעָה עַל־כֵּן שֵׁם־הָעִיר בְּאֵר שָׁבַע עַד הַיּוֹם הַזֶּה", "rashi_he": "שבעה. עַל שֵׁם הַבְּרִית:", "rashi_en": "שִׁבְעָה - בִּרְמִיזַת הַבְּרִית (וַיִּשָּׁמְרוּ וְגוֹ').", "note": "", "points": [{"q": "לָמָה אוֹמֵר רַשִׁ״י שֶׁהַבְּאֵר נִקְרְאָה 'שִׁבְעָה' (שֶׁמַּשְׁמַעוּתוֹ 'שִׁבְעָה')?", "options": ["הִיא מִשְׁתַּמֶּרֶת לַבְּרִית וְהַשְּׁבוּעָה שֶׁנִּשְׁמְרוּ בֵּין יִצְחָק וְאָבִימֶלֶךְ", "יִצְחָק חָפַר שֶׁבַע בְּאֵרוֹת בַּמִּקוֹם הַהוּא קוֹדֶם לַהְנָחוֹת שֵׁם לַזּוֹ הַזָּאת", "הַבְּאֵר הָיְתָה חוֹתְמִית בְּשִׁבְעַת אַבְנִים כְּסִימָן הַהַסְכָּמָה"], "kasha": "הַשֵּׁם 'שִׁבְעָה' מַשְׁמַעוּתוֹ 'שִׁבְעָה', אָךְ הַפָּסוּק לֹא מַזְכִּיר אֶת הַמִּסְפָּר שִׁבְעָה. מַה עֵרֶךְ הַשֵּׁם הַזֶּה?", "answer": "רַשִׁ״י מְבָאֵר שֶׁ'שִׁבְעָה' נִקְרַאת בִּתְחוּם־סִימּוּן לַבְּרִית, וְהִיא מְחַזֶּקֶת אוֹתָהּ לַשְּׁבוּעָה־הַנִּשְׁמְרוּת בֵּין יִצְחָק וְאָבִימֶלֶךְ, בְּהִתְּחִזּוּקוּת עַל דְּמִיוּת בֵּין 'שֶׁבַע' (שְׁבוּעָה) וְ'שִׁבְעָה' (שִׁבְעָה)."}]}, {"id": "26:34.1", "ch": 26, "v": 34, "n": 1, "dh": "בן ארבעים שנה", "pasuk_html": "וַיְהִ֤י עֵשָׂו֙ <mark>בֶּן־אַרְבָּעִ֣ים שָׁנָ֔ה</mark> וַיִּקַּ֤ח אִשָּׁה֙ אֶת־יְהוּדִ֔ית בַּת־בְּאֵרִ֖י הַֽחִתִּ֑י וְאֶת־בָּ֣שְׂמַ֔ת בַּת־אֵילֹ֖ן הַֽחִתִּֽי׃", "pasuk_en": "וַיִּהְיוּ בְנֵי־עֵשָׂיו בִּן־אַרְבָּעִים שָׁנָה וַיִּשַׁח אֶת־יְהוּדִית בַּת־בְּאֵרִי הַחִתִּי וְאֶת־בָּשְׂמַת בַּת־אֵילוֹן הַחִתִּי", "rashi_he": "בן ארבעים שנה. עֵשָׂו הָיָה נִמְשָׁל לַחֲזִיר, שֶׁנֶּאֱמַר יְכַרְסְמֶנָּה חֲזִיר מִיָּעַר (תהילים פ'), הַחֲזִיר הַזֶּה כְּשֶׁהוּא שׁוֹכֵב, פּוֹשֵׁט טְלָפָיו, לוֹמַר רְאוּ שֶׁאֲנִי טָהוֹר; כָּךְ אֵלּוּ גּוֹזְלִים וְחוֹמְסִים וּמַרְאִים עַצְמָם כְּשֵׁרִים; כָּל מ' שָׁנָה הָיָה עֵשָׂו צָד נָשִׁים מִתַּחַת בַּעֲלֵיהֶן וּמְעַנֶּה אוֹתָם, כְּשֶׁהָיָה בֶּן מ' אָמַר אַבָּא בֶּן מ' שָׁנָה נָשָׂא אִשָּׁה, אַף אֲנִי כֵן:", "rashi_en": "בִּן אַרְבָּעִים שָׁנָה - עֵשָׂיו מֻשְׁוַל לַחֲזִיר, שֶׁנֶּאֱמַר (תהלים פ, יג) 'הִשְׁמִיתֶהָ־חֲזִיר מִיַּעַר'. הַחֲזִיר כְּשֶׁהוּא שׁוֹכֵב פּוֹרֵשׂ אֶת־כִּפּוֹתָיו (הַשְׁמוּרוֹת) כִּלְלוֹמַר (כְּאִלּוּ) 'רְאוּ שֶׁאֲנִי טָהוֹר' (וְעִם־זֶה הוּא טָמֵא), וְכָל־אֵלֶּה הַדּוּכִים שֶׁל עֵשָׂיו גּוֹזְלִים וְחוֹמְסִים וּמִתְנַהֲגִים כְּאִלּוּ טוֹבוּת־לִבָּם (בראשית רבה סה א). כָּל־הָאַרְבָּעִים שָׁנָה פִּתָּה נָשִׁים מִן־בַּעְלֵיהֶן וְנִתְנַהֵג בָּהֶן בְּרָעוּת; כְּשֶׁהִשִּׂיג לְגִיל אַרְבָּעִים אָמַר, אֲבִי לָקַח אִשָּׁה בְּגִיל אַרְבָּעִים וַאֲנִי אֶעֱשֶׂה כֵן (בראשית רבה סה).", "note": "", "points": [{"q": "לְדִבְרֵי רַשִׁ״י, מַה הָעֲיוּן הַהִשְׁוָּאָה בֵּין עֵשָׂיו לַחֲזִיר עַל מַה זֶה?", "options": ["לְהַרְאוֹת שֶׁעֵשָׂיו נִהַג בִּגְנֵבָה וּמִרְמָה בְּעוֹד שֶׁהוּא שׁוֹמֵר עַל הֶחָדוֹן שֶׁלּוֹ", "לְהַסְבִּיר מַדּוּעַ עֵשָׂיו לֹא יָכוֹל לִמְצֹא נָשִׁים מַתְאִימוֹת מִשְּׁבֶטַת מִשְׁפַּחְתּוֹ", "לְהַדְגִּים שֶׁעֵשָׂיו הָיָה פִּיזִית לֹא טָהוֹר וְלֹא מַתְאִים לִירוּשָׁה"], "kasha": "הַפָּסוּק פָּשׁוּט אוֹמֵר אֶת גִּילּוֹ שֶׁל עֵשָׂיו וְכִי לָקַח נָשִׁים. מָה מוֹסִיף רַשִׁ״י עַל התְנַהֲגוּת עֵשָׂיו קוֹדֶם לְנִשּׁוּאָיו?", "answer": "רַשִׁ״י שׁוֹמֵר אֶת הַמְּטָפוֹרָה שֶׁל הַחֲזִיר לְהַיוּר אֶת אִיּוּבוֹ הַמִּרְמִי שֶׁל עֵשָׂיו: בְּדוּמְיָה לַחֲזִיר שֶׁמַּצִּיג אֶת כִּפּוֹת־שַׁקָּלוֹ הַנִּשְׁמוּרוֹת כְּדֵי לְהִצַּג כִּשׁוֹר טָהוֹר בְּעוֹד שֶׁהוּא לֹא טָהוֹר, כָּךְ עֵשָׂיו גָּנַב וְחָמַס בְּעוֹד שֶׁהוּא דּוֹמֶה לִהְיוֹת שׁוֹמֵר־מִצְווֹת. בְּגִיל אַרְבָּעִים, עֵשָׂיו מַחֲקֶה אֶת אָבִיו יִצְחָק, אָךְ נִשּׁוּאָיו הָיוּ תוֹצָאָה שֶׁל אַרְבָּעִים שָׁנִים שֶׁל הִתְנַהֲגוּת לֹא־חָגֵק עִם נָשִׁים."}, {"q": "מַה אוֹמֵר רַשִׁ״י שֶׁעֵשָׂיו עָשָׂה בְּמַשֶּׁךְ אַרְבָּעִים שָׁנִים קוֹדֶם לְלִקְּחַת אִשָּׁה?", "options": ["הִפְתָּה נָשִׁים מִן־בַּעְלֵיהֶן וְהִתְנַהֵג בָּהֶן בְּאַכְזָרִיוּת", "עָבַד כַּצַּיָּד לִצְבֹר עוֹשֶׁר לִמְחִיר כַּלָּה", "נָסַע לַאֲרָצוֹת רְחוֹקוֹת לִבְקֹשׁ אִשָּׁה מִדָּתוֹ"], "kasha": "The verse simply states Esau's age and that he took wives. What does רש״י add about Esau's conduct leading up to this marriage?", "answer": "רַשִׁ״י מְבָאֵר שֶׁבְּמַשֶּׁךְ אַרְבָּעִים שָׁנִים קוֹדֶם לִלְקִיחַת אִשָּׁה, עֵשָׂיו הִפְתָּה נָשִׁים מִן־בַּעְלֵיהֶן וְהִתְנַהֵג בָּהֶן בְּאַכְזָרִיוּת, וּבְכָךְ הַדְגִּים אֶת אִיּוּבוֹ הַמִּרְמִי וְהַתּוֹקְפָנִי אַף קוֹדֶם לְנִשּׁוּאָיו הַפּוֹרְמָלִיִּים."}]}, {"id": "26:35.1", "ch": 26, "v": 35, "n": 1, "dh": "מרת רוח", "pasuk_html": "וַתִּהְיֶ֖יןָ <mark>מֹ֣רַת ר֑וּחַ</mark> לְיִצְחָ֖ק וּלְרִבְקָֽה׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיִּהְיוּ מָרַת רוּחַ לְיִצְחָק וּלְרִבְקָה.", "rashi_he": "מרת רוח. לְשׁוֹן הַמְרָאוֹת רוּחַ, כְּמוֹ מַמְרִים הֱיִיתֶם, כָּל מַעֲשֵׂיהֶן הָיוּ לְהַכְעִיס וּלְעִצָּבוֹן:", "rashi_en": "מָרַת רוּחַ — הַמִּלָּה מַשְׁמַעְתָּהּ הִתְקוֹמְמוּת כְּנֶגֶד הָרוּחַ שֶׁל אָדָם. הַמִּלָּה הָרִאשׁוֹנָה הִיא מִן הַשֹּׁרֶשׁ כַּמּוֹ בַּדְּבָרִים (ט:כד), \"וַתִּמְרוּ אֶת־יי\": כָּל פְּעוּלוֹתֵיהֶם הָיוּ מִתְאַפַּיְנוֹת בִּהְיוֹתָן עֲגָמַת נֶפֶשׁ", "note": "", "points": [{"q": "מָה אוֹמֵר רַשִּׁ״י שֶׁ'מָרַת רוּחַ' (מָרוּר הָרוּחַ) פִּירוּשׁוֹ?", "options": ["הִתְקוֹמְמוּת אוֹ מֶרֶד כְּנֶגֶד הָרוּחַ—פְּעוּלוֹת הַנָּשִׁים גָּרְמוּ עֲגָמַת נֶפֶשׁ וְכַעַס", "מַחֲלַת גוּף שֶׁהִשְׁפִּיעָה עַל הַמַּצָּב הַנִּפְשִׁי שֶׁל יִצְחָק וְרִבְקָה", "הַפְסָדִּים כַּסְפִּיִּים שֶׁהִכְבִּידוּ עַל הַבַּיִת"], "kasha": "הַמִּלָּה 'מָרַת רוּחַ' אֵינָהּ רְגִילָה. מָה הִיא הַמַּשְׁמָעוּת הַמִּלּוּלִית שֶׁלָּהּ וּכֵיצַד הִיא קְשׁוּרָה לְהִתְנַהֲגוּת הַנָּשִׁים?", "answer": "רַשִּׁ״י קוֹשֵׁר 'מָרַת רוּחַ' לַשֹּׁרֶשׁ בִּמְשְׁמַע 'מֶרֶד' (כַּמּוֹ 'מְמָרִים' - מוֹרְדִים), וּמְבָאֵר שֶׁכָּל פְּעוּלוֹת הַנָּשִׁים הָיוּ מְעֻצָּבוֹת כְּדֵי לִגְרוֹם עֲגָמַת נֶפֶשׁ וְכַעַס; הֵן הִתְקוֹמְמוּ וּמָרַדוּ כְּנֶגֶד רְצוֹנוֹ שֶׁל יִצְחָק וְרִבְקָה."}]}, {"id": "26:35.2", "ch": 26, "v": 35, "n": 2, "dh": "ליצחק ולרבקה", "pasuk_html": "וַתִּהְיֶ֖יןָ מֹ֣רַת ר֑וּחַ <mark>לְיִצְחָ֖ק וּלְרִבְקָֽה׃</mark>&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיִּהְיוּ מָרַת רוּחַ לְיִצְחָק וּלְרִבְקָה.", "rashi_he": "ליצחק ולרבקה. שֶׁהָיוּ עוֹבְדוֹת עֲ\"זָ (בראשית רבה):", "rashi_en": "לְיִצְחָק וּלְרִבְקָה — עַל שֶׁהָיוּ עוֹבְדוֹת עֲבוֹדַת אֱלִילִים (בְּרֵאשִׁית רַבָּה סה:ד).", "note": "", "points": [{"q": "לְפִי רַשִּׁ״י, מָה הִיא הַהִתְנַהֲגוּת הַמִּסּוּכָּנֶת שֶׁל הַנָּשִׁים שֶׁגָּרְמָה עֲגָמַת נֶפֶשׁ לְיִצְחָק וּלְרִבְקָה?", "options": ["הַעֲבוֹדַת אֱלִילִים", "סְרִיבָה לִשְׁמֹר אֶת חֻקֵּי הַטְּרֵפָה שֶׁל בֵּית אַבְרָהָם", "דְּחִיַּת סְמִיכוּתוֹ שֶׁל יִצְחָק וְתָכְנוּנוֹ"], "kasha": "הַפָּסוּק אוֹמֵר שֶׁהַנָּשִׁים הָיוּ מָרַת רוּחַ לְיִצְחָק וּלְרִבְקָה, אַךְ אַיִן הוּא מוֹדִיעַ בַּמַּה. מָה הִיא הַסִּבָּה הַיְסוֹדִית לַעֲגָמַת נַפְשָׁם?", "answer": "רַשִּׁ״י מְבָאֵר שֶׁהַנָּשִׁים עָבְדוּ אֱלִילִים, וְזֶה הָיָה הַמָּקוֹר הָעִקְרִי לִמְרִידָתָן וּלַעֲגָמַת הַנֶּפֶשׁ שֶׁגָּרְמוּ לְיִצְחָק וּלְרִבְקָה."}]}, {"id": "27:1.1", "ch": 27, "v": 1, "n": 1, "dh": "ותכהין", "pasuk_html": "וַֽיְהִי֙ כִּֽי־זָקֵ֣ן יִצְחָ֔ק <mark>וַתִּכְהֶ֥יןָ</mark> עֵינָ֖יו מֵרְאֹ֑ת וַיִּקְרָ֞א אֶת־עֵשָׂ֣ו&thinsp;׀ בְּנ֣וֹ הַגָּדֹ֗ל וַיֹּ֤אמֶר אֵלָיו֙ בְּנִ֔י וַיֹּ֥אמֶר אֵלָ֖יו הִנֵּֽנִי׃", "pasuk_en": "וַיְהִי כִּי־זָקֵן יִצְחָק וַתִּכְהֶינָה עֵינָיו מֵרְאוֹת וַיִּקְרָא אֶת־עֵשָׂו בְּנוֹ הַגָּדוֹל וַיֹּאמֶר אֵלָיו בְּנִי וַיֹּאמֶר אֵלָיו הִנֵּנִי.", "rashi_he": "ותכהין. בַּעֲשָׁנָן שֶׁל אֵלּוּ. דָּ\"אַ כְּשֶׁנֶּעֱקַד עַ\"גַּ הַמִּזְבֵּחַ וְהָיָה אָבִיו רוֹצֶה לְשָׁחֳטוֹ, בְּאוֹתָהּ שָׁעָה נִפְתְּחוּ הַשָּׁמַיִם וְרָאוּ מַלְאֲכֵי הַשָּׁרֵת וְהָיוּ בוֹכִים, וְיָרְדוּ דִמְעוֹתֵיהֶם וְנָפְלוּ עַל עֵינָיו, לְפִיכָךְ כָּהוּ עֵינָיו. דָּ\"אַ כְּדֵי שֶׁיִּטֹּל יַעֲקֹב אֶת הַבְּרָכוֹת:", "rashi_en": "וַתִּכְהֶינָה עֵינָיו — מִן הַעָשָׁן שֶׁהוֹצִיאוּ הַנָּשִׁים הַלָּלוּ בִּקְטֹרֶת לַאֱלִילִים (מִדְרַשׁ תַּנְחוּמָא תוֹלְדוֹת ח). וְדִבּוּר אַחֵר: בִּשְׁעַת שֶׁנִּשְׁמַר יִצְחָק עַל־הַמִּזְבֵּחַ וַעֲבוֹדַת־אָבִיו הָיָה עוֹמֵד לִשְׁחֹט אוֹתוֹ, בַּשָּׁעָה הַהִיא נִפְתְּחוּ הַשָּׁמַיִם וְרָאוּ מַלְאֲכֵי הַשָּׁרֵת וַיִּבְכּוּ וְנָפְלוּ דְּמַעוֹתֵיהֶם עַל־עֵינֵי יִצְחָק וַתִּכְהֶינָה (בְּרֵאשִׁית רַבָּה סה:י). וְדִבּוּר אַחֵר: כָּהוּ עֵינָיו בִּשְׁבִיל שֶׁיִּקַּח יַעֲקֹב אֶת־הַבְּרָכוֹת (בְּרֵאשִׁית רַבָּה סה:ח).", "note": "", "points": [{"q": "לְפִי הַהַסְבֵּר הָרִאשׁוֹן שֶׁנָּתַן רַשִּׁ״י, מַדּוּעַ כָּהוּ עֵינֵי יִצְחָק?", "options": ["מִן הַעָשָׁן שֶׁעָלָה מִקְטֹרֶת שֶׁקִּטְּרוּ נְשֵׁי עֵשָׂו לַאֱלִילִים", "מִן הַבְּכִיָּה עַל הִתְנַהֲגוּתוֹ הַמּוֹרֶדֶת שֶׁל עֵשָׂו כְּנֶגֶד הוֹרָיו", "מִן הִשְׁתָּאֲרוּת הַשֶּׁמֶשׁ בַּשָּׂדוֹת בִּזְמַן הַצַּיִד"], "kasha": "הַטֶּקְסְט אוֹמֵר שֶׁעֵינֵי יִצְחָק הָיוּ כֵּהוֹת, אַךְ אַיִן הוּא מַסְבִּיר עַל מָה זֶה קָרָה. מָה הִיא הַסִּבָּה לִעֵוּרוֹנוֹ?", "answer": "הַהַסְבֵּר הָרִאשׁוֹן שֶׁנָּתַן רַשִּׁ״י אוֹמֵר שֶׁעֵינֵי יִצְחָק כָּהוּ מִן הַעָשָׁן שֶׁעָלָה מִקְטֹרֶת שֶׁקִּטְּרוּ נְשֵׁי עֵשָׂו לַאֱלִילִים."}, {"q": "מָה הִיא הַהַסְבֵּר הַשְּׁלִישִׁי שֶׁנָּתַן רַשִּׁ״י לַמַּדּוּעַ כָּהוּ עֵינֵי יִצְחָק בַּזְּמַן הַזֶּה?", "options": ["עֵינָיו כָּהוּ כְּדֵי שֶׁיַּעֲקֹב יִקַּח אֶת הַבְּרָכוֹת בְּמָקוֹם עֵשָׂו", "עֵינָיו כָּהוּ כְּעוֹנֵשׁ עַל שֶׁלּוֹ דִּיֵּן אֶת עֵשָׂו כִּגְרָעוּת", "עֵינָיו כָּהוּ כְּתוֹצָאָה טִבְעִית שֶׁל הַזִּקְנָה וְהַדְּאָגָה"], "kasha": "הִסְבָּרוּת מִשׁוֹנוֹת מוּצַּעוֹת לַעֵוּרוֹן שֶׁל יִצְחָק. אֵיזוֹ תְּכוּנִית אֱלוֹקִית מַצִּיעַ הַהַסְבֵּר הַשְּׁלִישִׁי?", "answer": "הַהַסְבֵּר הַשְּׁלִישִׁי שֶׁנָּתַן רַשִּׁ״י הוּא שֶׁעֵינֵי יִצְחָק כָּהוּ דִּוְקָא כְּדֵי שֶׁיַּעֲקֹב יִקַּח אֶת הַבְּרָכוֹת, מַצִּיעַ בִּפְנֵי עַצְמוֹ הִשְׁתַּדְּלוּת אֱלוֹקִית בַּהִתְפַּתְּחוּת הָאֵירוּעִים."}]}, {"id": "27:2.1", "ch": 27, "v": 2, "n": 1, "dh": "לא ידעתי יום מותי", "pasuk_html": "וַיֹּ֕אמֶר הִנֵּה־נָ֖א זָקַ֑נְתִּי <mark>לֹ֥א יָדַ֖עְתִּי י֥וֹם מוֹתִֽי׃</mark>", "pasuk_en": "וַיֹּאמֶר הִנֵּה־נָא זָקַנְתִּי וְלֹא־יָדַעְתִּי יוֹם מוֹתִי.", "rashi_he": "לא ידעתי יום מותי. אָמַר רַבִּי יְהוֹשֻׁעַ בֶּן קָרְחָה אִם מַגִּיעַ אָדָם לְפֶרֶק אֲבוֹתָיו יִדְאַג חָמֵשׁ שָׁנִים לִפְנֵיהֶן וְחָמֵשׁ לְאַחַר כֵּן; וְיִצְחָק הָיָה בֶּן קכ\"ג, אָמַר שֶׁמָּא לְפֶרֶק אִמִּי אֲנִי מַגִּיעַ וְהִיא מֵתָה בַּת קכ\"ז וַהֲרֵינִי בֶן ה' שָׁנִים סָמוּךְ לְפִרְקָהּ; לְפִיכָךְ לא ידעתי יום מותי, שֶׁמָּא לְפֶרֶק אִמִּי, שֶׁמָּא לְפֶרֶק אַבָּא:", "rashi_en": "לֹא־יָדַעְתִּי יוֹם מוֹתִי — אָמַר רַבִּי יְהוֹשֻׁעַ בֶּן קָרְחָה: כִּי־אִם בַּאֲשֶׁר קָרוֹב אָדָם לַגִּיל שֶׁמֵּתוּ־בוֹ הוֹרָיו, רָאוּי לוֹ שֶׁיְהִי דָּאוּג חָמֵשׁ שָׁנִים קוֹדֶם וְחָמֵשׁ שָׁנִים אַחֲרֵי. וְיִצְחָק הָיָה אָז בֶּן קְכ״ג שָׁנִים וְאָמַר: אוּלַי לֹא אַשִּׂיג אֶת־גִּיל אִמִּי שֶׁמֵּתָה בְּגִיל קְכ״ז וַאֲנִי כַּעֵת בַּחָמֵשׁ שָׁנִים מִגִּילָהּ, לָכֵן לֹא־יָדַעְתִּי יוֹם מוֹתִי—אִם לֹא אַשִּׂיג אֶת־גִּיל אִמִּי אוֹ אִם אַשִּׂיג אֶת־גִּיל אָבִי (בְּרֵאשִׁית רַבָּה סה:יב).", "note": "", "points": [{"q": "לְפִי רַשִּׁ״י, מַדּוּעַ הָיָה יִצְחָק דָּאוּג לְמוֹתוֹ בָּעִדָּן הַזֶּה בִּמְיוּחַד?", "options": ["הוּא הִקְרִיב לַגִּיל בּוֹ מֵתוּ הוֹרָיו שְׁנֵיהֶם, וְזֶה גָּרַם לוֹ דְּאָגָה", "הוּא קִבֵּל נְבוּאָה שֶׁמוֹתוֹ קָרוֹב", "עֵשָׂו הִשְׁתַּמַּר לַהֲרוֹג אוֹתוֹ כְּדֵי לִקַּח אֶת־הַנַּחֲלָה"], "kasha": "יִצְחָק אוֹמֵר שֶׁאֵינוֹ יוֹדֵעַ אֶת־יוֹם מוֹתוֹ—מַדּוּעַ הוּא מְבַטֵּא דְּאָגָה זוֹ כָּעֶת, וּמָה בֶּאֱמֶת עוֹשֶׂה אוֹתוֹ דָּאוּג?", "answer": "רַשִּׁ״י מְבָאֵר שֶׁיִּצְחָק בְּגִיל קכ״ג שָׁנִים הִקְרִיב לַגִּיל שֶׁבּוֹ מֵתָה אִמּוֹ (בְּגִיל קכ״ז) וְאַפְשָׁר לַגִּיל שֶׁבּוֹ מֵת אָבִיו. הוּא הָיָה בְּתוֹךְ חָמֵשׁ שָׁנִים מִגִּיל אִמּוֹ, וּלְכָךְ הָיָה דָּאוּג אִם יִגִּיעַ רַק לַגִּיל שֶׁל אִמּוֹ אוֹ לַגִּיל שֶׁל אָבִיו, וּלְפִיכָךְ אוֹמֵר \"לֹא־יָדַעְתִּי יוֹם מוֹתִי\"."}]}, {"id": "27:3.1", "ch": 27, "v": 3, "n": 1, "dh": "שא נא", "pasuk_html": "וְעַתָּה֙ <mark>שָׂא־נָ֣א</mark> כֵלֶ֔יךָ תֶּלְיְךָ֖ וְקַשְׁתֶּ֑ךָ וְצֵא֙ הַשָּׂדֶ֔ה וְצ֥וּדָה לִּ֖י (צידה) [צָֽיִד]׃", "pasuk_en": "שָׂא נָא אֶת־כְּלִיךָ אֶת־אַשְׁפָּתְךָ וְאֶת־קַשְׁתְּךָ וְצֵא הַשָּׂדֶה וְצוּד לִי צָיִד.", "rashi_he": "שא נא. לְשׁוֹן הַשְׁחָזָה, כְּאוֹתָהּ שֶׁשָּׁנִינוּ אֵין מַשְׁחִיזִין אֶת הַסַּכִּין, אֲבָל מַשִּׂיאָהּ עַל גַּבֵּי חֲבֶרְתָּהּ (ביצה כ\"ח), חַדֵּד סַכִּינְךָ וּשְׁחֹט יָפֶה, שֶׁלֹּא תַאֲכִילֵנִי נְבֵלָה (בראשית רבה):", "rashi_en": "שָׂא נָא — מִלַּת שָׂא בִּמְשְׁמַע שְׁחִיזָה, כְּמוֹ שֶׁנִּקְרָא בַּמִּשְׁנָה (בֵּיצָה כ״ח א) \"אֵין שׁוֹחְזִים בְּדֶרֶךְ הַמְּלָאכָה אֲבָל שׁוֹחְזִים בִּשְׁמִישׁוּן הַחֲרָב (בִּמְשִׁיחַת הַחֲרָב עַל חֲרָב אַחֶרֶת)\". אָמַר יִצְחָק לְעֵשָׂו: שְׁחוֹז אֶת־חֲרָב הַשּׁוֹחֵט וּשְׁחַט חַיָּה כְּתִקּוּן הַדִּין כְּדֵי שֶׁלֹּא תִּתֵּן לִי בָּשַׂר נְבֵלָה (בְּרֵאשִׁית רַבָּה סה:יג).", "note": "", "points": [{"q": "מָה אוֹמֵר רַשִּׁ״י שֶׁמַּשְׁמַעוּת הַמִּלָּה 'שָׂא' (שא) בַּהוֹרָאַת יִצְחָק לְעֵשָׂו?", "options": ["לִשְׁחוֹז (אֶת־הַחֲרָב), לְהַכְנָה לִשְׁחִיטָה כְּשֵׁרָה", "לִשְׁאוֹת אוֹ לִנְשׂוֹא (אֶת־כְּלֵי הַצַּיִד)", "לְהָכִין אוֹ לַעֲדוּ (אֶת־הַמָּזוֹן)"], "kasha": "הַמִּלָּה 'שָׂא' בִּ'שָׂא נָא' נִשְׁמַעַת לֹא־רְגִילָה בַּהַקְשָׁרוֹ הַזֶּה. מָה הִיא הַמַּשְׁמָעוּת הַאֲמִתִּית שֶׁלָּהּ וּמַה הַמַּטָּרוֹת שֶׁלָּהּ?", "answer": "רַשִּׁ״י מְבָאֵר שֶׁ'שָׂא' פִּרְשׁוֹ 'לִשְׁחוֹז', וְיִצְחָק מְצַוֶּה עַל עֵשָׂו לִשְׁחוֹז אֶת־הַחֲרָב וּלִשְׁחוֹט חַיָּה כְּדִין שִׁחִיטָה כְּדֵי שֶׁלֹּא יִתֵּן לְיִצְחָק בָּשַׂר נְבֵלָה (בָּשַׂר שֶׁאֵינוֹ שָׁחוּט כְּתִקּוּן)."}]}, {"id": "27:3.2", "ch": 27, "v": 3, "n": 2, "dh": "תליך", "pasuk_html": "וְעַתָּה֙ שָׂא־נָ֣א כֵלֶ֔יךָ <mark>תֶּלְיְךָ֖</mark> וְקַשְׁתֶּ֑ךָ וְצֵא֙ הַשָּׂדֶ֔ה וְצ֥וּדָה לִּ֖י (צידה) [צָֽיִד]׃", "pasuk_en": "קַח אֶת־כְּלֵיךָ, אֶת־אַשְׁפַּתְךָ וְקַשְׁתְּךָ, וְצֵא הַשָּׂדֶה וְצוּד לִי צָיִד.", "rashi_he": "תליך. חַרְבְּךָ שֶׁדֶּרֶךְ לִתְלוֹתָהּ:", "rashi_en": "תְלִיךָ פֵּרוּשׁוֹ חַרְבְּךָ הַתְּלוּיָה בִרְגִיל.", "note": "", "points": [{"q": "לפִי רַשִׁ\"י, מַה הַמִּלָּה 'תְלִיךָ' מִתְיַחֶסֶת בִּצְוַוּת יִצְחָק לְעֵשָׂו?", "options": ["חֶרֶב הַתְּלוּיָה בַצַּד", "אַשְׁפָּה לְהַחְזִיק חִצִּים", "חֲלַק מֵעֲדָיֵי צַיִד"], "kasha": "הַמִּלָּה 'תְלִיךָ' אֵינָהּ וָדוֹק בְמַשְׁמָעוּתָהּ וּצְרִיכָה הַסְבָּרָה לְהָבִין אֶת־הַצִּוּוּי שֶׁל־יִצְחָק לְעֵשָׂו.", "answer": "רַשִׁ\"י מְפָרֵשׁ שֶׁ'תְלִיךָ' פֵּרוּשׁוֹ חֶרֶב, דִּיוּק חֶרֶב הַתְּלוּיָה בִרְגִיל בַצַּד שֶׁל גּוּף הָאָדָם."}]}, {"id": "27:3.3", "ch": 27, "v": 3, "n": 3, "dh": "וצודה לי", "pasuk_html": "וְעַתָּה֙ שָׂא־נָ֣א כֵלֶ֔יךָ תֶּלְיְךָ֖ וְקַשְׁתֶּ֑ךָ וְצֵא֙ הַשָּׂדֶ֔ה <mark>וְצ֥וּדָה לִּ֖י</mark> (צידה) [צָֽיִד]׃", "pasuk_en": "קַח אֶת־כְּלֵיךָ, אֶת־אַשְׁפַּתְךָ וְקַשְׁתְּךָ, וְצֵא הַשָּׂדֶה וְצוּד לִי צָיִד.", "rashi_he": "וצודה לי. מִן הַהֶפְקֵר וְלֹא מִן הַגֶּזֶל:", "rashi_en": "צוּד לִי - מִחַיּוֹת הֶפְקֵר, וְלֹא מִיֵּשׁ הַגָּזוּל.", "note": "", "points": [{"q": "אֵיזוֹ הַגְבָּלָה חֲשׁוּבָה מוֹסִיף רַשִׁ\"י לְצִוַּוּי יִצְחָק שֶׁעֵשָׂו יִצוּד לוֹ?", "options": ["הַצַּיִד חַיָּב לִהְיוֹת מִחַיּוֹת הֶפְקֵר, לֹא גְנוּבוֹת", "הַצַּיִד חַיָּב לִהְיוֹת בַשַּׁבָּת בִּלְבַד", "הַצַּיִד חַיָּב לִהִשְׁלוֹם קֹדֶם הַשְּׁקִיעָה"], "kasha": "הַפָּסוּק אוֹמֵר פָּשׁוּט 'צוּד לִי,' אַךְ רַשִׁ\"י מַכִּיר הִשְׁלָכוּת אֶתִית שֶׁצְּרִיכָה הַבְהָרָה בִּשְׁאֵלַת הַמָּקוֹר שֶׁל הַצָּיִד.", "answer": "רַשִׁ\"י מַבְהִיר שֶׁהַצַּיִד חַיָּב לִהְיוֹת מִחַיּוֹת הֶפְקֵר, לֹא מִחַיּוֹת שֶׁנִּרְכְּשׁוּ עַל־יְדֵי גְנֵבָה אוֹ גָּזֵל."}]}, {"id": "27:5.1", "ch": 27, "v": 5, "n": 1, "dh": "לצוד ציד להביא", "pasuk_html": "וְרִבְקָ֣ה שֹׁמַ֔עַת בְּדַבֵּ֣ר יִצְחָ֔ק אֶל־עֵשָׂ֖ו בְּנ֑וֹ וַיֵּ֤לֶךְ עֵשָׂו֙ הַשָּׂדֶ֔ה <mark>לָצ֥וּד צַ֖יִד לְהָבִֽיא׃</mark>", "pasuk_en": "וְרִבְקָה שׁוֹמַעַת בִּדְבַר־יִצְחָק אֶל־עֵשָׂו בְנוֹ. וַיֵּלֶךְ עֵשָׂו הַשָּׂדֶה לִצְדּוֹת צָיִד לְהָבִיא.", "rashi_he": "לצוד ציד להביא. מַהוּ לְהָבִיא? אִם לֹא יִמְצָא צַיִד יָבִיא מִן הַגֶּזֶל:", "rashi_en": "לִצְדּוֹת צָיִד לְהָבִיא - מַה טַּעַם 'לְהָבִיא'? רוֹצֶה לוֹמַר שֶׁעֶדֶר לוֹ שְׁנִי אִם לֹא יִמְצָא צָיִד, יָבִיא לִי מִשֶּׁנִּגְנַב.", "note": "", "points": [{"q": "מַה רַשִׁ\"י שׁוֹקֵל הָיְתָה הַכַּוָּנָה הַאֲמִתִּית שֶׁל־עֵשָׂו כַּאֲשֶׁר אָמַר שֶׁיָּבִיא בְשַׂר־צַיִד בַּיְתָה?", "options": ["אִם לֹא יִמְצָא בְשַׂר־צַיִד בַּר, יָבִיא בָּשָׂר גָּנוּב", "הוא תִכְנֵן לַצּוּד רַק בְשָׁעוֹת הַיּוֹם", "הוא יִתְכַּוֵּן לְהַקְרִיב חֵלֶק מִן־הַבָּשָׂר לַה'"], "kasha": "הַמִּלִּים 'לְהָבִיא' נִשְׁמַעוֹת יְתֵרוּת אַחֲרֵי שְׁנֶאֱמַר 'לִצְדּוֹת צָיִד,' וְזֶה גוֹרֵם לְרַשִׁ\"י לְהַסְבִּיר אֵיזוּ כַּוָּנָה עֲמוּקָה יוֹתֵר זוֹ גִּלְיָה.", "answer": "רַשִׁ\"י מְלַמֵּד שֶׁכַּוָּנַת עֵשָׂו הָיְתָה שֶׁאִם לֹא יִמְצָא בְשַׂר־צַיִד מִחַיָּה בַּר (חַיַּת הֶפְקֵר), יָבִיא בַיְתָה בָּשָׂר שֶׁנִּרְכַּשׁ עַל־יְדֵי גְנֵבָה."}]}, {"id": "27:7.1", "ch": 27, "v": 7, "n": 1, "dh": "לפני ה'", "pasuk_html": "הָבִ֨יאָה לִּ֥י צַ֛יִד וַעֲשֵׂה־לִ֥י מַטְעַמִּ֖ים וְאֹכֵ֑לָה וַאֲבָרֶכְכָ֛ה <mark>לִפְנֵ֥י יְהֹוָ֖ה</mark> לִפְנֵ֥י מוֹתִֽי׃", "pasuk_en": "הָבִיא־לִּי צָיִד וַעֲשֵׂה־לִּי מַטְעַמִּים וְאֹכְלָה, בַּעֲבוּר תְּבָרֶכְךָ נַפְשִׁי לִפְנֵי־ה׳ בְּטֶרֶם אָמוּת.", "rashi_he": "לפני ה'. בִּרְשׁוּתוֹ, שֶׁיַּסְכִּים עַל יָדִי:", "rashi_en": "לִפְנֵי־ה׳ - בִּרְשׁוּתוֹ, שֶׁיִּשְׁמוֹר עִם־מַה שֶׁאֲנִי עוֹשֶׂה.", "note": "", "points": [{"q": "מַה רַשִׁ\"י מְפָרֵשׁ יִצְחָק כּוֹנֶה לִפְנֵי־ה׳ בִּשְׁעַת בְּרָכַת יַעֲקֹב?", "options": ["שֶׁהַקָּדוֹשׁ־בָּרוּךְ־הוּא יִשְׁמוֹר וְיִסְכִּים עִם־הַבְּרָכָה", "שֶׁהַבְּרָכָה תִּהְיֶה כְּתוּבָה בְּרַבִּים", "שֶׁהַבְּרָכָה תִּהְיֶה בְּמִקְדָּשׁ"], "kasha": "הַמִּלִּים 'לִפְנֵי־ה׳' צְרִיכוֹת הַבְהָרָה בִּשְׁאֵלַת אֵיזוֹ תַּפְקִיד יֵשׁ לַה׳ בְּבְרָכַת יִצְחָק אֶת־בְּנוֹ.", "answer": "רַשִׁ\"י מְבָאֵר שֶׁזֶּה פֵּרוּשׁוֹ בִּרְשׁוּת הַקָּדוֹשׁ־בָּרוּךְ־הוּא - שֶׁהוּא יִשְׁמוֹר וְיִסְכִּים עִם־מַה־שֶּׁיִּצְחָק יַעֲשֶׂה בִּתְנִימַת הַבְּרָכָה."}]}, {"id": "27:9.1", "ch": 27, "v": 9, "n": 1, "dh": "וקח לי", "pasuk_html": "לֶךְ־נָא֙ אֶל־הַצֹּ֔אן <mark>וְקַֽח־לִ֣י</mark> מִשָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְאֶֽעֱשֶׂ֨ה אֹתָ֧ם מַטְעַמִּ֛ים לְאָבִ֖יךָ כַּאֲשֶׁ֥ר אָהֵֽב׃", "pasuk_en": "לֵךְ־נָא אֶל־הַצּוֹאן וְקַח־לִּי מִשָּׁם שְׁנֵי גְּדָיֵי עִזִּים טוֹבִים, וְאַעֲשֶׂה אוֹתָם מַטְעַמִּים לְאָבִיךָ כַּאֲשֶׁר אָהֵב.", "rashi_he": "וקח לי. מִשֶּׁלִּי הֵם וְאֵינָם גֶּזֶל, שֶׁכָּךְ כָּתַב לָהּ יִצְחָק בִּכְתֻבָּתָהּ לִטֹּל שְׁנֵי גְּדָיֵי עִזִּים בְּכָל יוֹם (בראשית רבה):", "rashi_en": "וְקַח־לִּי - מִשֶּׁהוּא שֶׁלִּי, וְלֹא מִדְּמֵי גֵּזֵל. יִצְחָק עָשָׂה לָהּ תְּנַאי בִּכְתֻבָּתָהּ שֶׁתִּהְיֶה בַּת־קְבִיעוּת שְׁנֵי גְּדָיִים בְּכָל־יוֹם.", "note": "", "points": [{"q": "מַדּוּעַ רַשִׁ\"י מְדַגִּישׁ שֶׁהַגְּדָיִים שֶׁרִבְקָה מְצַוָּה עַל־יַעֲקֹב לָקַחַת אֵינָם גְּנוּבִים?", "options": ["כִּי כְתוֹנַת הַנִּשׂוּאִים שֶׁל־יִצְחָק צִוְּתָה שֶׁתִּקְבַּל שְׁנֵי גְּדָיִים יוֹמִיִּים כִּמְלוֹנָהּ", "כִּי הַצּוֹאן הָיוּ שֶׁל־יַעֲקֹב, לֹא שֶׁל־יִצְחָק", "כִּי חוּקֵי הַפֶּסַח אָסְרוּ אֲכִילַת בָּשָׂר גָּנוּב"], "kasha": "הַצִּוּוּי לָקַחַת שְׁנֵי גְּדָיִים צְרִיךְ הַבְהָרָה בִּשְׁאֵלַת הַלִּגִּיטִימוּת שֶׁלָּהֶם, בִּמְיֻחַד בְּעוֹמֶק הַקִּשּׁוּר לַהֲכָנַת עֵשָׂו לִשְׁתּוֹשׁ בַּשָּׂר גָּנוּב.", "answer": "רַשִׁ\"י מְבָאֵר שֶׁהַגְּדָיִים הַלָּלוּ הֵם מִקְנַת רִבְקָה עַצְמָהּ עַל־פִּי כְתוֹנַת הַנִּשׂוּאִים שֶׁלָּהּ עִם יִצְחָק, הַמַּעֲנִיקָה לָהּ זְכוּת לְקַבֵּל שְׁנֵי גְּדָיִים מִן־הַצּוֹאן יוֹם־יוֹם."}]}, {"id": "27:9.2", "ch": 27, "v": 9, "n": 2, "dh": "שני גדיי עזים", "pasuk_html": "לֶךְ־נָא֙ אֶל־הַצֹּ֔אן וְקַֽח־לִ֣י מִשָּׁ֗ם <mark>שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים</mark> טֹבִ֑ים וְאֶֽעֱשֶׂ֨ה אֹתָ֧ם מַטְעַמִּ֛ים לְאָבִ֖יךָ כַּאֲשֶׁ֥ר אָהֵֽב׃", "pasuk_en": "לך אל הצאן וקח לי משם שני גדיי עזים טובים ואעשה אותם מטעמים לאביך כאשר הוא אוהב.", "rashi_he": "שני גדיי עזים. וְכִי שְׁנֵי גְּדָיֵי עִזִּים הָיָה מַאֲכָל שֶׁל יִצְחָק? אֶלָּא הָאֶחָד הִקְרִיב לְפִסְחוֹ וְהָאֶחָד עָשָׂה מַטְעַמִּים; בְּפִרְקֵי רַבִּי אֱלִיעֶזֶר:", "rashi_en": "שני גדיי עזים - שניים הם יצאו מן הצאן לארוחה לישחק? אלא כך הוא: שהיה פסח, הקריב אחד מהם קרבן פסח וממנו עשה את המטעמים. וכן נאמר בפרקי דרבי אליעזר פרק לב.", "note": "", "points": [{"q": "לפי רש״י, מדוע הייתה צריכה רבקה שני גדיי עזים לארוחה אחת?", "options": ["אחד היה מוקרב כקרבן פסח ואחד היה מוכן כאוכל", "אחד היה נאכל ואחד היה שמור ליום הבא", "אחד היה לישחק ואחד היה לעשו"], "kasha": "שני גדיים שלמים נראים כמות יתר מדי לארוחה אחת לאדם אחד, מה שדורש הסבר לתכליתם השונה.", "answer": "רש״י מלמד שהתרחיש הזה התרחש בעת הפסח: אחד הגדיים היה מוקרב כקרבן פסח והשני היה מוכן כאוכל טעים שביקש ישחק."}]}, {"id": "27:9.3", "ch": 27, "v": 9, "n": 3, "dh": "כאשר אהב", "pasuk_html": "לֶךְ־נָא֙ אֶל־הַצֹּ֔אן וְקַֽח־לִ֣י מִשָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְאֶֽעֱשֶׂ֨ה אֹתָ֧ם מַטְעַמִּ֛ים לְאָבִ֖יךָ <mark>כַּאֲשֶׁ֥ר אָהֵֽב׃</mark>", "pasuk_en": "לך אל הצאן וקח לי משם שני גדיי עזים טובים ואעשה אותם מטעמים לאביך כאשר הוא אוהב.", "rashi_he": "כאשר אהב. כִּי טַעַם הַגְּדִי כְּטַעַם הַצְּבִי:", "rashi_en": "כאשר אהב - כי טעם גדיי העזים דומה לטעם בשר הצבי.", "note": "", "points": [{"q": "מה חשף רש״י על כך שישחק אהב את טעם גדיי העזים?", "options": ["כי טעמו דומה לטעם בשר צבי בר", "כי זה היה מה שהוא אכל כילד", "כי עזים נחשבו כשרות יותר מצבי"], "kasha": "ישחק ביקש בשר צבי אך רבקה מכינה בשר גדיים במקומו, לכן רש״י מסביר מדוע החלפה זו תספק את חוש הטעם של ישחק.", "answer": "רש״י מסביר שטעם גדיי העזים דומה לטעם בשר הצבי, מה שמפקח את ההחלפה של עזים במקום צבי כדי לספק את ישחק."}]}, {"id": "27:11.1", "ch": 27, "v": 11, "n": 1, "dh": "איש שעיר", "pasuk_html": "וַיֹּ֣אמֶר יַעֲקֹ֔ב אֶל־רִבְקָ֖ה אִמּ֑וֹ הֵ֣ן עֵשָׂ֤ו אָחִי֙ <mark>אִ֣ישׁ שָׂעִ֔ר</mark> וְאָנֹכִ֖י אִ֥ישׁ חָלָֽק׃", "pasuk_en": "ויאמר יעקב אל רבקה אמו הן עשו אחי איש שער ואני איש חלק.", "rashi_he": "איש שעיר. בַּעַל שֵׂעָר:", "rashi_en": "איש שער - אדם שערוני.", "note": "", "points": [{"q": "מה משמעות הביטוי 'איש שער' לפי רש״י?", "options": ["אדם שערוני", "אדם משדה", "אדם מכוח"], "kasha": "המונח 'איש שער' צריך להיתרגם בבהירות כדי להבין את חששו של יעקב מהחזקת דמות של עשו.", "answer": "רש״י מסביר שביטוי 'איש שער' פשוט משמעו אדם שערוני - אדם שמתאפיין בעלותו שערות על גופו."}]}, {"id": "27:12.1", "ch": 27, "v": 12, "n": 1, "dh": "ימשני", "pasuk_html": "אוּלַ֤י <mark>יְמֻשֵּׁ֙נִי֙</mark> אָבִ֔י וְהָיִ֥יתִי בְעֵינָ֖יו כִּמְתַעְתֵּ֑עַ וְהֵבֵאתִ֥י עָלַ֛י קְלָלָ֖ה וְלֹ֥א בְרָכָֽה׃", "pasuk_en": "אולי יימשני אבי והייתי בעיניו כמתעתע והבאתי עליי קללה ולא ברכה.", "rashi_he": "ימשני. כְּמוֹ מְמַשֵּׁשׁ בַּצָּהֳרַיִם:", "rashi_en": "ימשני - מלשון ממשש (דברים כח:כט) 'וממשת בצהריים כאשר ממשש העיוור בחשך'.", "note": "", "points": [{"q": "מה מסביר רש״י על משמעות המילה 'ימשני' (יגע בי)?", "options": ["היא מגיעה מאותו שורש כמו המילה למישוש או הליכה בטישטוש, כמו בדברים כח:כט", "זה משמעו בדיקה זהירה או בחינה בעין קשה", "זה מתייחס למגע עדין המשמש לזיהוי מישהו לפי מרקם או ביגוד"], "kasha": "משמעות הפועל 'ימשני' בהקשר של חשש יעקב שאביו עלול להכירו באמצעות נגיעה.", "answer": "רש״י מחבר את 'ימשני' לפועל 'ממשש' (מישוש או הליכה בטישטוש) המופיע בדברים כח:כט, המסמן חקירה טקטילית לזיהוי או הכרה במישהו."}]}, {"id": "27:15.1", "ch": 27, "v": 15, "n": 1, "dh": "החמדות", "pasuk_html": "וַתִּקַּ֣ח רִ֠בְקָ֠ה אֶת־בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤הּ הַגָּדֹל֙ <mark>הַחֲמֻדֹ֔ת</mark> אֲשֶׁ֥ר אִתָּ֖הּ בַּבָּ֑יִת וַתַּלְבֵּ֥שׁ אֶֽת־יַעֲקֹ֖ב בְּנָ֥הּ הַקָּטָֽן׃", "pasuk_en": "ותקח רבקה את בגדי עשו בנה הגדול החמדות אשר אתה בבית ותלבש את יעקב בנה הקטן.", "rashi_he": "החמדת. הַנְּקִיּוֹת, כְּתַרְגּוּמוֹ דָּכְיָתָא, דָּ\"אַ שֶׁחָמַד אוֹתָן מִן נִמְרוֹד:", "rashi_en": "החמדות - הנקיים, כמו שתרגם התרגום דכיתא. וכן דברי הרשב\"ם. דבר אחר: חמדות שמו של דבר זה כי חמדם מנמרוד, שהוא גם כן צייד מפורסם. וכן אמרו בבראשית רבה סה:טז.", "note": "", "points": [{"q": "מה אומר רש״י שמשמעות 'החמדות' (הבגדים היקרים) לפי התרגום?", "options": ["בגדים נקיים", "בגדים יקרים או מותרים", "בגדים המתאימים לציד"], "kasha": "המילה 'החמדות' חריגה ומשמעותה בהקשר זה אינה ברורה - מדוע בגדי עשו מתוארים כך?", "answer": "רש״י מסביר שמילת 'החמדות' משמעותה בגדים נקיים, על סמך תרגום ארמי של התרגום כ'דכיתא' (נקיים)."}, {"q": "לפי ההסבר החלופי שרש״י מסביר, מדוע בגדים אלה נקראים 'חמדות' (המיוחלים)?", "options": ["כי עשו חמד אותם מנמרוד, הציד", "כי הם היו עשויים מחומרים הטובים ביותר הזמינים", "כי רבקה בפרט רצתה אותם ליעקב"], "kasha": "ההמשךולוגיה והמשמעות של המונח 'חמדות' (בעברית 'החמודים') דורשים הסבר.", "answer": "רש״י מביא הסבר מדרשי שבגדי עשו נקראים 'חמדות' כי הוא חמד אותם מנמרוד, שהיה גם הוא ציד מהולל, וכך מחברים את החפצים היקרים של שני הצידים."}]}, {"id": "27:15.2", "ch": 27, "v": 15, "n": 2, "dh": "אשר אתה בבית", "pasuk_html": "וַתִּקַּ֣ח רִ֠בְקָ֠ה אֶת־בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤הּ הַגָּדֹל֙ הַחֲמֻדֹ֔ת <mark>אֲשֶׁ֥ר אִתָּ֖הּ בַּבָּ֑יִת</mark> וַתַּלְבֵּ֥שׁ אֶֽת־יַעֲקֹ֖ב בְּנָ֥הּ הַקָּטָֽן׃", "pasuk_en": "וַתִּקַּח רִבְקָה אֶת־בִּגְדֵי עֵשָׂו בְנָהּ הַגָּדוֹל הַחֲמֻדוֹת אֲשֶׁר אִתָּהּ בַּבָּיִת וַתַּלְבֵּשׁ אֶת־יַעֲקֹב בְנָהּ הַקָּטָן.", "rashi_he": "אשר אתה בבית. וַהֲלֹא כַמָּה נָשִׁים הָיוּ לוֹ, וְהוּא מַפְקִיד אֵצֶל אִמּוֹ? אֶלָּא שֶׁהָיָה בָקִי בְמַעֲשֵׂיהֶן וְחוֹשְׁדָן:", "rashi_en": "אֲשֶׁר אִתָּהּ בַּבָּיִת — וְהָלוּ הִשְׁתַּדֵּל לוֹ נָשִׁים הַרְבֵּה? אֶלָּא מִשּׁוּם שֶׁהָיָה יוֹדֵעַ אֶת־תֻּשְׁלוּמֹתֵיהֶן וְחוֹשֵׁד בָּהֶן (שֶׁמָּא יִגְנְבוּ אֶת־בְּגָדָיו).", "note": "", "points": [{"q": "מה הבעיה הטקסטואלית שרש״י מטפל בה בפירוש הביטוי 'אשר אתה בבית' (שהיו אתה בבית)?", "options": ["מדוע עשו היה אוחז בבגדיו אצל אמו כשהיה לו מספר נשים?", "מדוע לרבקה הייתה גישה לבגדי הציד היקרים של עשו?", "מדוע הבגדים הללו היו שמורים בבית רבקה ולא באוהל של עשו?"], "kasha": "זה נראה מוזר שעשו, למרות שהיו לו מספר נשים, היה שומר את בגדיו אצל אמו.", "answer": "רש״י מסביר שעשו שמר את בגדיו אצל אמו משום שהיה מכיר את מנהגיהם של נשיו וחשד בהן — פחד שהן יגנבו את בגדיו."}]}, {"id": "27:19.1", "ch": 27, "v": 19, "n": 1, "dh": "אנכי עשו בכורך", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־אָבִ֗יו <mark>אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔ךָ</mark> עָשִׂ֕יתִי כַּאֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑י קֽוּם־נָ֣א שְׁבָ֗ה וְאׇכְלָה֙ מִצֵּידִ֔י בַּעֲב֖וּר תְּבָרְכַ֥נִּי נַפְשֶֽׁךָ׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו אָנֹכִי עֵשָׂו בִּכְרְךָ עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי קוּם־נָא שְׁבָה וְאֵכְלָה מִצֵּידִי בַּעֲבוּר תְּבָרֲכַנִּי נַפְשְׁךָ.", "rashi_he": "אנכי עשו בכורך. אָנֹכִי הַמֵּבִיא לְךָ וְעֵשָׂו הוּא בְּכוֹרֶךָ:", "rashi_en": "אָנֹכִי עֵשָׂו בִּכְרְךָ — אָנֹכִי הַמָּבִיא לְךָ אוֹכֶל וְעֵשָׂו בִּכְרְךָ.", "note": "", "points": [{"q": "כיצד רש״י פוסק את הַמִּשְׁפָּט 'אָנֹכִי עֵשָׂו בִּכְרְךָ' (אני עשו בכורך)?", "options": ["יַעֲקֹב מתכוון: 'אני הַמָּבִיא לְךָ אָכֶל, וְעֵשָׂו הוּא בִּכְרְךָ' — נִסּוּחַ זָהִיר כְּדֵי לִהְיוֹת לֹא שֶׁקֶר מוֹחְלָט", "יַעֲקֹב פּוֹשְׁטוּ תוֹאֵם שֶׁהוּא עֵשָׂו בְלִי הִשְׁמָרוּת", "יַעֲקֹב מַצְהִיר שֶׁהוּא וְעֵשָׂו שְׁנֵיהֶם בְנֵי־בְכוֹרָה"], "kasha": "הַמִּבְנֶה הַדִּקְדּוּקִי וְהַמַּשְׁמָעוּת הַלּוֹגִית שֶׁל הַפִּתְחַת יַעֲקֹב דּוֹרְשִׁים הַבָּהָרָה, בִּמְיוּחַד בִּשְׁל שֶׁהוּא מְנַסֶּה הַטְעָיָה.", "answer": "רש״י מסביר שיַעֲקֹב יוֹצֵר בִּנְסִיחוּ הַזָּהִיר 'אָנֹכִי הַמָּבִיא לְךָ אוֹכֶל, וְעֵשָׂו בִּכְרְךָ', וּבְכָךְ הַמִּשְׁפָּט יָכוֹל לְהִיוָּפֵרֵס כִּשְׁתֵּי הַצְהָרוֹת נִפְרָדוֹת בִּמְקוֹם שִׁקֶר יָחִיד."}]}, {"id": "27:19.2", "ch": 27, "v": 19, "n": 2, "dh": "עשיתי", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־אָבִ֗יו אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔ךָ <mark>עָשִׂ֕יתִי</mark> כַּאֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑י קֽוּם־נָ֣א שְׁבָ֗ה וְאׇכְלָה֙ מִצֵּידִ֔י בַּעֲב֖וּר תְּבָרְכַ֥נִּי נַפְשֶֽׁךָ׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו אָנֹכִי עֵשָׂו בִּכְרְךָ עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי קוּם־נָא שְׁבָה וְאֵכְלָה מִצֵּידִי בַּעֲבוּר תְּבָרֲכַנִּי נַפְשְׁךָ.", "rashi_he": "עשיתי. כַמָּה דְבָרִים כַּאֲשֶׁר דִּבַּרְתָּ אֵלַי:", "rashi_en": "עָשִׂיתִי — דְבָרִים רַבִּים בִּזְמַנִּים שׁוֹנִים כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי.", "note": "", "points": [{"q": "מַה כּוּנַּת רש״י כְּשֶׁהוּא מַסְבִּיר 'עָשִׂיתִי' כּ'דְבָרִים רַבִּים בִּזְמַנִּים שׁוֹנִים'?", "options": ["יַעֲקֹב עָשָׂה פְּעוּלוֹת הֲכִנוּת רַבּוֹת בְמֶשֶׁךְ זְמַן כְּפִי שְׁצִוָּה אָבִיו", "יַעֲקֹב הִשְׁלִים אֶת הַמְּלָאכָה בִּמְהִירוּת וּבְיְעִילוּת", "יַעֲקֹב מַתְכַּוֵּן לְמִסְפַּר יְצִיאוֹת צַיִד קוֹדְמוֹת"], "kasha": "הַבִּטּוּי 'עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי' יָכוֹל לַהִיוֹת מְרַמֵּז לְפְּעוּלָה יְחִידָה אוֹ לְמִסְפַּר שְׁלָבִים הֲכִנוּתִיִּים.", "answer": "רש״י מסביר שֶׁ'עָשִׂיתִי' מַתְכַּוֵּן לִכְמוֹ שיַעֲקֹב עָשָׂה דְבָרִים רַבִּים אוֹ מִסְפַּר שְׁלָבִים בַּמֶּשֶׁךְ זְמַן, הַכֹּל בִּהִשְׁמָרוּת עִם הַהוֹרָאוֹת שֶׁל אָבִיו כְּדֵי לְהַטְעוֹת אוֹתוֹ."}]}, {"id": "27:19.3", "ch": 27, "v": 19, "n": 3, "dh": "שבה", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־אָבִ֗יו אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔ךָ עָשִׂ֕יתִי כַּאֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑י קֽוּם־נָ֣א <mark>שְׁבָ֗ה</mark> וְאׇכְלָה֙ מִצֵּידִ֔י בַּעֲב֖וּר תְּבָרְכַ֥נִּי נַפְשֶֽׁךָ׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו אָנֹכִי עֵשָׂו בִּכְרְךָ עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי קוּם־נָא שְׁבָה וְאֵכְלָה מִצֵּידִי בַּעֲבוּר תְּבָרֲכַנִּי נַפְשְׁךָ.", "rashi_he": "שבה. לְשׁוֹן מֵסֵב עַל הַשֻּׁלְחָן, לְכָךְ מְתֻרְגָּם אִסְתָּחַר:", "rashi_en": "שְׁבָה — הַמִּלָּה מַשְׁמַעְתָּהּ לִשְׁמוֹר בִּשְׁתִּי יָדַיִם בִּימִי סְעוּדָה וּלְכֵן הִיא מִתְרְגֶּמֶת בַּתַּרְגּוּם בִּ'אֶסְתְּחַר' (מִן סָחַר לְ'סָבַב', הַדּוֹמֶה לַעִברִית סָבַב, וּמִשּׁוֹרֶשׁ זֶה הַמִּלָּה מֵסֵב לִשְׁמוֹר בִּשְׁתִּי יָדַיִם בִּימִי סְעוּדָה נִגְזָרָה).", "note": "", "points": [{"q": "מַה מַשְׁמַעוּת הַמִּלָּה 'שְׁבָה' לְפִי רש״י?", "options": ["לִשְׁמוֹר בִּשְׁתִּי יָדַיִם בִּימִי סְעוּדָה", "לְהִתְעוֹרֵר אוֹ לָקוּם מִשְּׁנַת", "לַחְזוֹר לַמְּקוֹם שֶׁלּוֹ"], "kasha": "הַמִּלָּה 'שְׁבָה' (שֵׁב) בְּהִקָּשֶׁר לְאָכִילָה דּוֹרֶשׁ הַבָּהָרָה שֶׁל מַשְׁמַעוּתָהּ הַמְּדוּיֶּקֶת.", "answer": "רש״י מסביר שֶׁ'שְׁבָה' פֵּרוּשׁוֹ לִשְׁמוֹר אוֹ לִהְיוֹת מוּשְׁכַּב בִּשְׁתִּי יָדַיִם בִּימִי סְעוּדָה, וְהוּא מוּתְגַּזַּר מִשּׁוֹרֶשׁ 'סָבַב' (לִסּוֹב), וּלְכֵן הַתַּרְגּוּם מִתְרְגֵּם אוֹתוֹ בִּ'אֶסְתְּחַר' (לִהְיוֹת מוּשְׁכַּב בִּימִי סְעוּדָה)."}]}, {"id": "27:21.1", "ch": 27, "v": 21, "n": 1, "dh": "גשה נא ואמשך", "pasuk_html": "וַיֹּ֤אמֶר יִצְחָק֙ אֶֽל־יַעֲקֹ֔ב <mark>גְּשָׁה־נָּ֥א וַאֲמֻֽשְׁךָ֖</mark> בְּנִ֑י הַֽאַתָּ֥ה זֶ֛ה בְּנִ֥י עֵשָׂ֖ו אִם־לֹֽא׃", "pasuk_en": "וַיֹּאמֶר יִצְחָק אֶל־יַעֲקֹב גְּשָׁה־נָּא וַאֲמוּשְׁךָ בְנִי הַאַתָּה זֶה בְנִי עֵשָׂו אִם־לֹא.", "rashi_he": "גשה נא ואמשך. אָמַר יִצְחָק בְּלִבּוֹ אֵין דֶּרֶךְ עֵשָׂו לִהְיוֹת שֵׁם שָׁמַיִם שָׁגוּר בְּפִיו, וְזֶה אָמַר כִּי הִקְרָה ה' אֱלֹהֶיךָ:", "rashi_en": "וַיֹּאמֶר יִצְחָק לְעַצְמוֹ אֵין דֶּרֶךְ עֵשָׂו לְהִזְכִּיר שֵׁם אֱלֹהִים בְּיַד רַמָּה וְזֶה אוֹמֵר 'כִּי הִשְׁמַר יְהוָה אֱלֹהֶיךָ אֶת־זֶה לִי' לֹא דֶּרֶךְ עֵשָׂו.", "note": "", "points": [{"q": "לְפִי רש״י, מַה הִגְרִים לְיִצְחָק שְׁחַק שֶׁזֶּה אֶפְשַׁר שֶׁלֹּא בֶּן עֵשָׂו אָמִתִּי?", "options": ["הַגָּבֶר הַזֶּה הִזְכִּיר אֶת שֵׁם אֱלֹהִים, שֶׁלֹּא זֶה דֶּרֶךְ עֵשָׂו לְדַבֵּר", "הַגָּבֶר הַזֶּה הִיָּה רַך וּמְכֻבָּד בְּטוֹנוּ", "הַגָּבֶר הַזֶּה הָיָה לוֹבֵשׁ בְּגָדִים שֶׁלֹּא הִרְגִּישׁוּ כִּבְגָדֵי צַיִד"], "kasha": "יִצְחָק הוּא חוֹשֵׁד לַמַּרְמוּת לַמִּרְשַׁם; מַה הַרֶמֶז הַלְּשׁוֹנִי גְּרַם לוֹ לִחְשֹׁד?", "answer": "רש״י מסביר שיִצְחָק אָמַר לְעַצְמוֹ שֶׁלֹּא זֶה דֶּרֶךְ עֵשָׂו לְהִזְכִּיר שֵׁם אֱלֹהִים בִּנְדִיבוּת, וְהַעֲדוּת שֶׁהַמַּשְׁמִיע אָמַר 'כִּי הִשְׁמַר יְהוָה אֱלֹהֶיךָ אֶת־זֶה לִי' הָיְתָה לֹא־מִדְרַךְ עֵשָׂו, מָה שֶׁהִגְרִים לְיִצְחָק לִחְשֹׁד."}]}, {"id": "27:22.1", "ch": 27, "v": 22, "n": 1, "dh": "קול יעקב", "pasuk_html": "וַיִּגַּ֧שׁ יַעֲקֹ֛ב אֶל־יִצְחָ֥ק אָבִ֖יו וַיְמֻשֵּׁ֑הוּ וַיֹּ֗אמֶר הַקֹּל֙ <mark>ק֣וֹל יַעֲקֹ֔ב</mark> וְהַיָּדַ֖יִם יְדֵ֥י עֵשָֽׂו׃", "pasuk_en": "וַיִּגַּשׁ יַעֲקֹב אֶל יִצְחָק אָבִיו, וַיְמֻשֵּׁהוּ, וַיֹּאמֶר הַקּוֹל קוֹל יַעֲקֹב, וְהַיָּדַיִם יְדֵי עֵשָׂו.", "rashi_he": "קול יעקב. שֶׁמְּדַבֵּר בִּלְשׁוֹן תַּחֲנוּנִים קוּם נָא, אֲבָל עֵשָׂו קִנְטוּרְיָא דִּבֵּר יָקֻם אָבִי:", "rashi_en": "קוֹל יַעֲקֹב — כִּי דִּבְּרוֹ בְּדֶרֶךְ בַּקָּשָׁה 'קוּם נָא'. עֵשָׂו הִשְׁתַּמֵּשׁ בִּקּוֹל קָשֶׁה (בְּפָסוּק לא) 'יָקוּם אָבִי'.", "note": "", "points": [{"q": "לפִי רַשִׁ״י, כֵּיצַד נִשְׁתָּנָה הַטּוֹן שֶׁל דִּבְרֵי יַעֲקֹב מִטּוֹן שֶׁל דִּבְרֵי עֵשָׂו?", "options": ["יַעֲקֹב דִּבֵּר בְּטוֹן בַּקָּשָׁה וְעָנָוָה בְּעוֹדוֹ עֵשָׂו דִּבֵּר בְּקוֹל קָשֶׁה וְתִקְצִיבִי", "יַעֲקֹב הִשְׁתַּמֵּשׁ בִּלְשׁוֹן רִשְׁמִי בְּעוֹדוֹ עֵשָׂו דִּבֵּר בִּלְשׁוֹן יוֹמְיוֹמִי", "יַעֲקֹב הָיָה שׁוֹתֵק בְּעוֹדוֹ עֵשָׂו הָיָה קוֹלוֹ חָזָק"], "kasha": "יִצְחָק הִכִּיר אֶת הַקּוֹל כְּשֶׁל יַעֲקֹב — מַה זֶּה בַּדֶּרֶךְ שֶׁבּוֹ דִּבֵּר שֶׁגִּילָּה אֶת הַזְּהוּת שֶׁלּוֹ?", "answer": "רַשִׁ״י מַסְבִּיר שֶׁיַּעֲקֹב דִּבֵּר בְּטוֹן בַּקָּשָׁה וּכְנִימִיּוּת, וַיֹּאמֶר 'קוּם נָא' בְּעוֹדוֹ עֵשָׂו דִּבֵּר בְּקוֹל קָשֶׁה וּמְשִׁמַּע כִּמְפַקֵּד, וַיֹּאמֶר 'יָקוּם אָבִי'."}]}, {"id": "27:24.1", "ch": 27, "v": 24, "n": 1, "dh": "ויאמר אני", "pasuk_html": "וַיֹּ֕אמֶר אַתָּ֥ה זֶ֖ה בְּנִ֣י עֵשָׂ֑ו <mark>וַיֹּ֖אמֶר אָֽנִי׃</mark>", "pasuk_en": "וַיֹּאמֶר הַאַתָּה זֶה בְנִי עֵשָׂו, וַיֹּאמֶר אָנִי.", "rashi_he": "ויאמר אני. לֹא אָמַר אֲנִי עֵשָׂו אֶלָּא אָנִי:", "rashi_en": "וַיֹּאמֶר אָנִי — לֹא אָמַר אָנִי עֵשָׂו, אֵלָּא אָנִי.", "note": "", "points": [{"q": "מַה מַפְנִים רַשִׁ״י בְּתוֹךְ תְּשׁוּבַת יַעֲקֹב כְּשֶׁיִּצְחָק שׁוֹאֲלוֹ אִם הוּא עֵשָׂו?", "options": ["יַעֲקֹב אָמַר רַק 'אָנִי' וְלֹא אָמַר בִּפְרוּשׁ 'אָנִי עֵשָׂו'", "יַעֲקֹב סִירֵב לַעֲנוֹת לִשְׁאֵלַת יִצְחָק בְּיָשִׁירוּת", "יַעֲקֹב שִׁקֵּר וְטָעַן שֶׁהוּא עֵשָׂו"], "kasha": "הַטֶּקְסְט מְתַעֵד שֶׁיַּעֲקֹב אָמַר 'אָנִי', אוֹלָם לֹא מְבִרֵר אִם הוּא בֵּרַר אֶת עַצְמוֹ כֹּה וְכֹה שֶׁהוּא עֵשָׂו, מַה שֶּׁמֵּעוֹרֵר שְׁאֵלוֹת לְגַבֵּי מַה בְּדִיּוּק הוּא טָעַן.", "answer": "יַעֲקֹב בִּחַר בִּדְקָדּוּק בְּמִלִּים, וַיֹּאמֶר 'אָנִי' מִבְּלִי לוֹמַר בִּפְרוּשׁ אֶת שֵׁם עֵשָׂו, מַה שֶּׁמְּגַלֶּה הִזְהִירוּת בַּהַתְעָלְמוּת."}]}, {"id": "27:27.1", "ch": 27, "v": 27, "n": 1, "dh": "וירח את ריח בגדיו", "pasuk_html": "וַיִּגַּשׁ֙ וַיִּשַּׁק־ל֔וֹ <mark>וַיָּ֛רַח אֶת־רֵ֥יחַ בְּגָדָ֖יו</mark> וַֽיְבָרְכֵ֑הוּ וַיֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔י כְּרֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרְכ֖וֹ יְהֹוָֽה׃", "pasuk_en": "וַיִּגַּשׁ וַיִּשַּׁק לוֹ, וַיָּרַח אֶת־רִיחַ בְּגָדָיו וַיְבָרְכֵהוּ, וַיֹּאמֶר, רְאֵה רִיחַ בְּנִי כְּרִיחַ שָׂדֶה אֲשֶׁר בֵּרָכוֹ יְהוָה.", "rashi_he": "וירח וגו'. וַהֲלֹא אֵין רֵיחַ רַע יוֹתֵר מִשֶּׁטֶף הָעִזִּים? אֶלָּא מְלַמֵּד שֶׁנִּכְנְסָה עִמּוֹ רֵיחַ גַּן עֵדֶן;", "rashi_en": "וַיָּרַח וַגּוֹ וַיָּרַח אֶת־רִיחַ בְּגָדָיו — וַדַּאי אֵין רִיחַ קָלוֹן מִן הָעֹרוֹת־גְּדָיִם שֶׁנִּשְׁטָפוּ! אוֹלָם הַפָּסוּק מּוֹדִיעַ לָנוּ בִּטָּעַם שֶׁבֹּשֶׁם הַגַּן־עֵדֶן נִכְנַס לַחֲדַר עִמּוֹ.", "note": "", "points": [{"q": "מַדּוּעַ רַשִׁ״י חִשׁ שֶׁצָּרִיךְ לְהַעִיר עַל רִיחַ בִּגְדֵי עֵשָׂו שֶׁהוּא שֵׁם?", "options": ["עֹרוֹת־גְּדָיִם בַּעֲלֵי רִיחַ נוֹרָא, לָכֵן נִדְמֶה בִּלְתִּי אַפְשָׁרִי שֶׁיִּצְחָק יָרִיחַ רִיחַ נַעִים", "יִצְחָק הָיָה עִוֵּר וְלֹא יָכוֹל לְהָרִיחַ דָּבָר", "הַפָּסוּק לֹא מְבִרֵר אִילוּ בִּגְדִים הָיוּ עַל גוּף יַעֲקֹב"], "kasha": "יִצְחָק מִזְהֶה אֶת הָרִיחַ כִּנְתוֹן־בְּיוֹתֵר נַעִים וּמְחֻבַּר לַבְּרָכָה שֶׁל הַשֵּׁם יִתְבָּרֵךְ, מַה שֶּׁמַּצִּיעַ שֶׁהִנָּחוּ יוֹתֵר מֵרִיחַ רְגִיל.", "answer": "רַשִׁ״י מַסְבִּיר שֶׁהִנִּיחַ הַגַּן־עֵדֶן בִּרְכָּתוֹ נִכְנַס לַחֲדַר עִם יַעֲקֹב, מַה שֶּׁהַסְבִּיר אֶת הָרִיחַ הַנַּעִים בִּי־הִיּוּת הַבִּגְדִים שֶׁעָשׂוּיִם מֵעֹרוֹת־גְּדָיִם."}, {"q": "לְפִי רַשִׁ״י, אֵיזוּ תַּכּוּנָה מִיוּחֶדֶת שֵׁם יִצְחָק בָּרִיחַ שֶׁל בִּגְדֵי יַעֲקֹב?", "options": ["הַבֹּשֶׂם שֶׁל גַּן־עֵדֶן", "הַמִּשְׁק הַטִּבְעִי שֶׁל שְׂדֵי־צַיִד שֶׁל עֵשָׂו", "קְטוֹרֶת יַקְרָה שֶׁרִבְקָה הִשְׁמִיעָה"], "kasha": "Isaac identifies the smell as exceptionally pleasant and connects it to God's blessing, suggesting it was more than an ordinary scent.", "answer": "הַבֹּשֶׂם הָיָה שֶׁל גַּן־עֵדֶן, אֲשֶׁר בִּישׁוּעַ אֱלֹהִית לָוָה אֶת יַעֲקֹב לְמַעַן יִצְחָק יִכּוֹל לְהַכִּיר אֶת הַבְּרָכָה שֶׁל הַשֵּׁם עָלָיו."}]}, {"id": "27:27.2", "ch": 27, "v": 27, "n": 2, "dh": "כריח שדה אשר ברכו", "pasuk_html": "וַיִּגַּשׁ֙ וַיִּשַּׁק־ל֔וֹ וַיָּ֛רַח אֶת־רֵ֥יחַ בְּגָדָ֖יו וַֽיְבָרְכֵ֑הוּ וַיֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔י <mark>כְּרֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרְכ֖וֹ</mark> יְהֹוָֽה׃", "pasuk_en": "וַיֹּאמֶר רְאֵה רִיחַ בְּנִי כְּרִיחַ שָׂדֶה אֲשֶׁר בֵּרָכוֹ יְהוָה.", "rashi_he": "כריח שדה אשר ברכו ה'. שֶׁנָּתַן בּוֹ רֵיחַ טוֹב וְזֶהוּ שְׂדֵה תַּפּוּחִים, כָּךְ דָּרְשׁוּ רַזִ\"לִ:", "rashi_en": "כְּרִיחַ שָׂדֶה אֲשֶׁר בֵּרָכוֹ יְהוָה — אֲשֶׁר נָתַן לוֹ הַשֵּׁם בֹּשֶׁם נַעִים, וְהוּא שָׂדֶה שֶׁל עֵצֵי תַּפּוּחִים. כָּכָה פִּרְשׁוּ רַבּוֹתֵינוּ זִכְרוֹנָם לִבְרָכָה.", "note": "", "points": [{"q": "אֵיזוּ סְפֵקִיּוּת מְיוּחֶדֶת שֶׁל שָׂדֶה מִזְהֶה רַשִׁ״י כַּמְּקוֹר שֶׁל הָרִיחַ הַנַּעִים שֶׁיִּצְחָק מַשְׁווָה?", "options": ["שָׂדֶה שֶׁל עֵצֵי תַּפּוּחִים", "שָׂדֶה שֶׁל דָּגָן וּשְׂעוֹרָה", "שָׂדֶה שֶׁל עֵשְׂבֵי־בֹשֶׂם וְתַבְלִינִים"], "kasha": "יִצְחָק מַשְׁווָה אֶת הָרִיחַ לְשָׂדֶה מְבוּרָךְ, אוֹלָם סוּג הַשָּׂדֶה אֵינוֹ מְצוּיֵּן בַּפָּסוּק.", "answer": "רַשִׁ״י, בְּהִצְטִטוּת הַחֲכָמִים, מִזְהֶה אוֹתוֹ כְּשָׂדֶה שֶׁל עֵצֵי תַּפּוּחִים אֲשֶׁר הַשֵּׁם נָתַן לוֹ בֹּשֶׁם נַעִים."}]}, {"id": "27:28.1", "ch": 27, "v": 28, "n": 1, "dh": "ויתן לך", "pasuk_html": "<mark>וְיִֽתֶּן־לְךָ֙</mark> הָאֱלֹהִ֔ים מִטַּל֙ הַשָּׁמַ֔יִם וּמִשְׁמַנֵּ֖י הָאָ֑רֶץ וְרֹ֥ב דָּגָ֖ן וְתִירֹֽשׁ׃", "pasuk_en": "וִיתֵן לְךָ אֱלֹהִים, מִטַּל הַשָּׁמַיִם וּמִשְׁמַנֵּי הָאָרֶץ, וְרֹב דָּגָן וְתִירוֹשׁ.", "rashi_he": "ויתן לך. יִתֵּן וְיַחֲזֹר וְיִתֵּן (בראשית רבה). וּלְפִי פְשׁוּטוֹ מוּסָב לְעִנְיָן הָרִאשׁוֹן: רְאֵה רֵיחַ בְּנִי שֶׁנָּתַן לוֹ הַקָּבָּ\"ה כְּרֵיחַ שָׂדֶה וְגוֹ' וְעוֹד יִתֵּן לְךָ מִטַּל הַשָּׁמַיִם וְגוֹ':", "rashi_en": "וִיתֵן לְךָ אֱלֹהִים — וִיתֵן לְךָ וִיתֵן לְךָ עוֹד וְעוֹד. אוּלָם לְפִי הֵשׁ שֶׁלּוֹ צָרִיךְ לְהִשָּׁמַר מִן הַמִּשְׁפַּט הַקּוֹדֵם — דֶּרֶךְ, עִם הַמִּלִּים 'רְאֵה רִיחַ בְּנִי אֲשֶׁר נָתַן־בוֹ הַקָּדוֹשׁ בָּרוּךְ הוּא עָלָיו הוּא כְּרִיחַ הַשָּׂדֶה.' וִיתֵן לְךָ גַּם אַתָּה מִטַּל הַשָּׁמַיִם.", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ״י מַסְבִּיר אֶת מִבְנֶה הַבְּרָכָה שֶׁל יִצְחָק שֶׁמַּתְחִילָה בִּ'יִתֵּן לְךָ אֱלֹהִים'?", "options": ["הִיא מִמְשִׁיכָה אֶת הַמַּחְשָׁבָה שֶׁעַל הַשָּׂדֶה הַמְּבוּרָךְ שֶׁנִּזְכַּר קוֹדֶם לֵן, וְלִשְׁאָר נוֹשְׂאִים", "הִיא תוֹקְפָנִית מִסְתוֹבֶבֶת מִן הָרִיחַ לִבְרָכוֹת חוּמְרִיּוֹת", "הִיא מִתְיַחֶסֶת לַרִיחַ שֶׁמִּתְחַזֵּר בַּחַיִּים שֶׁל יַעֲקֹב"], "kasha": "הַבְּרָכָה 'יִתֵּן לְךָ אֱלֹהִים' נִרְאֶת כִּמוּ מִצְטִרֶפֶת נוֹשֵׂא חָדָשׁ, אֵולָם הַקֶּשֶׁר שֶׁלָּהּ לַפָּסוּק הַקּוֹדֵם עַל הָרִיחַ אֵינוֹ בָּרוּר.", "answer": "רַשִׁ״י מְשַׁנִּה אוֹתָהּ לַמִּשְׁפַּט הַקּוֹדֵם: בְּדִיּוּק כְּמוֹ שֶׁהַשֵּׁם נָתַן לְיַעֲקֹב אֶת הָרִיחַ הַמְּבוּרָךְ שֶׁל הַשָּׂדֶה, הוּא גַּם יִתֵּן לוֹ בְּרָכוֹת חוּמְרִיּוֹת שֶׁל טַל וּשְׁמָנִים עַל הָאָרֶץ."}]}, {"id": "27:28.2", "ch": 27, "v": 28, "n": 2, "dh": "מטל השמים", "pasuk_html": "וְיִֽתֶּן־לְךָ֙ הָאֱלֹהִ֔ים <mark>מִטַּל֙ הַשָּׁמַ֔יִם</mark> וּמִשְׁמַנֵּ֖י הָאָ֑רֶץ וְרֹ֥ב דָּגָ֖ן וְתִירֹֽשׁ׃", "pasuk_en": "יִתֶּן לְךָ אֱלֹהִים מִטַּל הַשָּׁמַיִם וּמִשְׁמַן הָאָרֶץ וְרֹב דָּגָן וְתִירוֹשׁ.", "rashi_he": "מטל השמים. כְּמַשְׁמָעוֹ; וּמִדְרְשֵׁי אַגָּדָה יֵשׁ לְהַרְבֵּה פָנִים:", "rashi_en": "מִטַּל הַשָּׁמַיִם — הַנְּחֵהוּ בַּמַּשְׁמָעוּת הָפְּשׁוּטָה שֶׁל הַדִּבּוּר, וְאוּלָם יֵשׁ הַסְּבָרִים מִדְרָשִׁיִּים הַרְבֵּה שׁוֹנִים.", "note": "", "points": [{"q": "מה ממליץ רש״י כדרך הראשית להבין את ביטוי 'טַל מִשְּׁמַיִם'?", "options": ["לקחת זאת בְּמַשְׁמָעוּתָהּ הַפְּשׁוּטָה וְהָרְגִילָה", "לִפְרוֹשׁ זאת רַק דֶּרֶךְ הַמִּדְרָשִׁים", "לְהָבִין זאת כִּמְטָפוֹרָה לִבְרָכָה אֱלֹהִית"], "kasha": "הַבִּטּוּי 'טַל מִשְּׁמַיִם' עוּלֶה לִהִלָּקַח בְּמִשְׁמָעוּת פְּשׁוּטָה אוֹ לִפְרוֹשׁ דֶּרֶךְ הַסְּבָרִים הַמִּדְרָשִׁיִּים הַשּׁוֹנִים.", "answer": "רש״י ממליץ להבין זאת בְּמַשְׁמָעוּתָהּ הַפְּשׁוּטָה וּבִרְגִילָה שֶׁל הַדִּבּוּר, וּבְעוֹדוֹ מַכִּיר שֶׁיֵּשׁ הַסְּבָרִים מִדְרָשִׁיִּים הַרְבֵּה שׁוֹנִים."}]}, {"id": "27:28.3", "ch": 27, "v": 28, "n": 3, "dh": "האלהים", "pasuk_html": "וְיִֽתֶּן־לְךָ֙ <mark>הָאֱלֹהִ֔ים</mark> מִטַּל֙ הַשָּׁמַ֔יִם וּמִשְׁמַנֵּ֖י הָאָ֑רֶץ וְרֹ֥ב דָּגָ֖ן וְתִירֹֽשׁ׃", "pasuk_en": "יְשִׁמְרְךָ אֱלוֹהִים מִטַּל הַשָּׁמַיִם וּמִשְׁמַנֵּי הָאָרֶץ וְרֹב דָּגָן וְתִירוֹשׁ", "rashi_he": "האלהים. מַהוּ הָאֱלֹהִים? בַּדִּין; אִם רָאוּי לְךָ יִתֵּן לְךָ וְאִם לָאו לֹא יִתֵּן לְךָ, אֲבָל לְעֵשָׂו אָמַר מִשְׁמַנֵּי הָאָרֶץ יִהְיֶה מוֹשָׁבֶךָ, בֵּין צַדִּיק בֵּין רָשָׁע יִתֵּן לְךָ; וּמִמֶּנּוּ לָמַד שְׁלֹמֹה, כְּשֶׁעָשָׂה הַבַּיִת סִדֵּר תְּפִלָּתוֹ. יִשְׂרָאֵל שֶׁהוּא בַעַל אֱמוּנָה וּמַצְדִּיק עָלָיו אֶת הַדִּין לֹא יִקְרָא עָלֶיךָ תִּגָּר, לְפִיכָךְ וְנָתַתָּ לָאִישׁ בְכָל דְּרָכָיו אֲשֶׁר תֵּדַע אֶת לְבָבוֹ (מלכים א, ח'), אֲבָל נָכְרִי מְחֻסַּר אֲמָנָה, לְפִיכָךְ אָמַר אַתָּה תִּשְׁמַע הַשָּׁמַיִם, וְעָשִׂיתָ כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ הַנָּכְרִי (שם), בֵּין רָאוּי בֵּין שֶׁאֵינוֹ רָאוּי תֵּן לוֹ, כְּדֵי שֶׁלֹּא יִקְרָא עָלֶיךָ תִּגָּר:", "rashi_en": "אֱלוֹהִים - מַה־זֶּה שֶׁהִשְׁתַּמֵּשׁ כָּאן בְּשֵׁם אֱלוֹהִים שֶׁמַּשְׁמָעוּתוֹ הַדִּין? אִם אַתָּה זַכָּאי יִתֵּן לְךָ, וְאִם־אֵינְךָ זַכָּאי אַל־יִתֵּן לְךָ. וּלְעֵשָׂו אָמַר (בראשית כז, לט) 'שִׁמְנֵי הָאָרֶץ יִהְיוּ מִשְׁכָּנְךָ' - בֵּין צַדִּיק בֵּין רָשָׁע יִתֵּן לְךָ. מִכָּאן שָׁלֹם מָצָא כַּאֲשֶׁר בָּנָה אֶת־בֵּית־הַמִּקְדָּשׁ כֵּיצַד לְהִתְפַּלֵּל בִּתְפִלָּה זוֹ: יִשְׂרָאֵלִי שֶׁהוּא בַּעַל־אֱמוּנָה וּמַכִּיר שֶׁדִּין אֱלוֹהִים צָדֵק - לֹא יִלִּין אַף עָלֶיךָ. לָכֵן אָמַר (מלכים א' ח, לט) 'וְנָתַתָּ לְכָל־אִישׁ כִּדְרָכָיו'. הַגֵּר אֶבֶל חָסֵר אֱמוּנָה, לָכֵן אָמַר (מלכים א' ח, מג) 'שְׁמַע בַּשָּׁמַיִם וַעֲשֵׂה כְּכֹל אֲשֶׁר יִקְרָא־אֵלֶיךָ הַגֵּר'.", "note": "", "points": [{"q": "למה רש״י מדגיש שיצחק השתמש בשם אלוהי שמציין צדק (אלוהים) ולא בשם הרחמים (יהוה)?", "options": ["כדי להראות שהברכה מותנית בראוותו של יעקב, בניגוד לברכת עשו שאינה מותנית", "כדי להוכיח שהתעלומה של יעקב תביא לו צדק", "כדי להציין שרק הצדיקים ראויים לברכות חומריות"], "kasha": "הבחירה של השם אלוהי (צדק) לעומת אדני/יהוה (רחמים) בברכות שונות דורשת הסברה.", "answer": "שימוש של יצחק באלוהים אומר שהברכה תלויה בצדק אלוהי - אלוהים יתן אם יעקב ראוי, אך לא אם הוא לא ראוי, מה שמשקף את ההבדל בין איך הצדיקים והרשעים מקבלים ברכות."}, {"q": "לפי רש״י, איזה שיעור למד שלמה מבחירת יצחק בשם אלוהי זה?", "options": ["כשמתפללים עבור ישראלים לקבל ברכות מותנות, ועבור גרים לקבל סיוע ללא תנאי כדי למנוע כעס", "תמיד להשתמש בשם הצדק בכל התפילות", "שזרים צריכים לקבל יותר ברכות מישראל"], "kasha": "ההקשר בין נוסחת הברכה של יצחק ותפילת בית המקדש של שלמה אינו ברור מיד מהטקסט.", "answer": "שלמה יישם עיקרון זה: בעד ישראלים בעלי אמונה, התפלל שאלוהים יתן על פי ראויותם, אך בעד גרים חסרי אמונה, התפלל שהוא יתן את בקשתם ללא תנאי כדי למנוע מהם שיתגעגעו לאלוהים."}]}, {"id": "27:29.1", "ch": 27, "v": 29, "n": 1, "dh": "בני אמך", "pasuk_html": "יַֽעַבְד֣וּךָ עַמִּ֗ים (וישתחו) [וְיִֽשְׁתַּחֲו֤וּ] לְךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְאַחֶ֔יךָ וְיִשְׁתַּחֲו֥וּ לְךָ֖ <mark>בְּנֵ֣י אִמֶּ֑ךָ</mark> אֹרְרֶ֣יךָ אָר֔וּר וּֽמְבָרְכֶ֖יךָ בָּרֽוּךְ׃", "pasuk_en": "יַעַבְדוּךָ עַמִּים וְתִשְׁתַּחֲווּ לְךָ לְאֻמִּים וֶהְיֵה גְבִיר לְאַחֶיךָ וְיִשְׁתַּחֲווּ לְךָ בְנֵי אִמְּךָ אָרְרִים אֹרְרֶיךָ וּבָרוּךְ בָּרֶכֶיךָ.", "rashi_he": "בני אמך. וְיַעֲקֹב אָמַר לִיהוּדָה בְּנֵי אָבִיךָ, לְפִי שֶׁהָיוּ לוֹ בָנִים מִכַּמָּה אִמָּהוֹת, וְכָאן, שֶׁלֹּא נָשָׂא אֶלָּא אִשָּׁה אַחַת, אוֹמֵר בְּנֵי אִמֶּךָ (בראשית רבה):", "rashi_en": "בְנֵי אִמְּךָ — וַיַּעֲקֹב אָמַר לִיהוּדָה (בְּרֵאשִׁית מ״ט:ח׳) 'יִשְׁתַּחֲווּ לְךָ בְנֵי אָבִיךָ', מִפְּנֵי שֶׁהָיוּ לוֹ בָּנִים מִנָּשִׁים הַרְבֵּה, אַךְ כָּאן מִפְּנֵי שֶׁלָּהּ אִשָּׁה אַחַת בִּלְבַד אָמַר 'בְנֵי אִמְּךָ' (בְּרֵאשִׁית רַבָּה סו:ד׳).", "note": "", "points": [{"q": "מַדּוּעַ רש״י מַשְׁווֶה בֵּין בְּרָכַת יִצְחָק לְיַעֲקֹב לְבֵין בְּרָכַת יַעֲקֹב לִיהוּדָה?", "options": ["כְּדֵי לְהַסְבִּיר מַדּוּעַ יִצְחָק אָמַר 'בְנֵי אִמְּךָ' וּיַעֲקֹב אָמַר מֵאַחַר 'בְנֵי אָבִיךָ'", "כְּדֵי לְהַרְאוֹת שֶׁשְּׁתֵּי הַבְּרָכוֹת זֵהוֹת בַּלְּשׁוֹנָם", "כְּדֵי לְהוֹכִיחַ שֶׁיַּעֲקֹב הִעְתִּיק אֶת נוּסַח הַבְּרָכָה שֶׁל יִצְחָק"], "kasha": "יִצְחָק אוֹמֵר 'בְנֵי אִמְּךָ' אֲבָל יַעֲקֹב הִשְׁתַּמַּשׁ בִּיהוּדָה בִּ'בְנֵי אָבִיךָ' — הַהִבְדָּל בִּלְשׁוֹנִים צְרִיךְ הַסְּבָר.", "answer": "יִצְחָק הָיָה לוֹ רַק אִשָּׁה אַחַת, לָכֵן בִּטְבִעִי אָמַר 'בְנֵי אִמְּךָ', בְּעוֹדוֹ לְיַעֲקֹב הָיוּ בָּנִים מֵאִשּׁוֹת רַבּוֹת, לָכֵן אָמַר לִיהוּדָה 'בְנֵי אָבִיךָ'."}]}, {"id": "27:29.2", "ch": 27, "v": 29, "n": 2, "dh": "ארריך ארור ומברכיך ברוך", "pasuk_html": "יַֽעַבְד֣וּךָ עַמִּ֗ים (וישתחו) [וְיִֽשְׁתַּחֲו֤וּ] לְךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְאַחֶ֔יךָ וְיִשְׁתַּחֲו֥וּ לְךָ֖ בְּנֵ֣י אִמֶּ֑ךָ <mark>אֹרְרֶ֣יךָ אָר֔וּר וּֽמְבָרְכֶ֖יךָ בָּרֽוּךְ׃</mark>", "pasuk_en": "יִשְׁמְדוּ עַמִּים לָךְ וּלְאֻמִּים יִשְׁתַּחֲווּ לָךְ הֱיֵה־גְבִר עַל־אַחֶיךָ וְיִשְׁתַּחֲווּ לְךָ בְנֵי־אִמֶּךָ אָרוּר אָרְרִיךָ וּמְבָרֵךְ בְּרוּךְ אָתָּה", "rashi_he": "ארריך ארור ומברכיך ברוך. וּבְבִלְעָם הוּא אוֹמֵר מְבָרְכֶיךָ בָרוּךְ וְאֹרְרֶיךָ אָרוּר? הַצַּדִּיקִים תְּחִלָּתָם יִסּוּרִים וְסוֹפָן שַׁלְוָה וְאוֹרְרֵיהֶם וּמְצָעֲרֵיהֶם קוֹדְמִים לִמְבָרְכֵיהֶם, לְפִיכָךְ יִצְחָק הִקְדִּים קִלְלַת אוֹרְרִים לְבִרְכַת מְבָרְכִים; הָרְשָׁעִים תְּחִלָּתָן שַׁלְוָה וְסוֹפָן יִסּוּרִין, לְפִיכָךְ בִּלְעָם הִקְדִּים בְּרָכָה לִקְלָלָה (בראשית רבה):", "rashi_en": "אָרוּר אָרְרִיךָ וּמְבָרֵךְ בְּרוּךְ אָתָּה - וּבִמְקוֹם בִּלְעָם נֶאֱמַר (במדבר כד, ט) 'בָּרוּךְ אֹרְרִיךָ וְאָרוּר קֹלְלִיךָ'. הַטַּעַם הוּא שֶׁהַצַּדִּיקִים חוּשֵּׁי רָדוּף לְאַחַר כָּךְ אֹשֶׁר, לָכֵן אָרְרִיךְ בְּתִחִלָּה בְּנִקּוּדַת זְמַן לִפְנֵי מְבָרְךְ - לָכֵן יִצְחָק צַדִּיק מַצַּר אָרְרִי לִפְנֵי מְבָרְךְ. הָרְשָׁעִים חוּשֵּׁי אֹשֶׁר לְאַחַר כָּךְ רָדוּף, לָכֵן מְבָרְךְ בִּנְקּוּדַת זְמַן לִפְנֵי אָרְרִי - לָכֵן בִּלְעָם רָשָׁע מַצַּר מְבָרְךְ לִפְנֵי אָרְרִי.", "note": "", "points": [{"q": "למה יצחק קובע קללה לפני ברכה, בניגוד לברכת בלעם?", "options": ["כי הצדיקים חווים סבל לפני אושר, אז אלה שמקללים אותם בא כרונולוגית לפני אלה שמברכים אותם", "כי יצחק היה יותר זועם מבלעם", "כי יעקב הטעה את יצחק ולכן היה ראוי לקללות תחילה"], "kasha": "יצחק ובלעם משתמשים בסדרים הפוכים בברכותיהם על קללות וברכות - היפוך זה דורש הסברה.", "answer": "הצדיקים חווים ניסיונות תחילה ואחר כך אושר, אז מקללים את הצדיק מגיעים טבעית לפני מברכים; כך יצחק, שהוא צדיק, מסדר את הקללה לפני הברכה."}, {"q": "לפי הסברת רש״י, למה בלעם, אדם רשע, מציין ברכות לפני קללות?", "options": ["כי הרשעים חווים אושר תחילה וסבל לאחר מכן, אז מברכים אותם בא לפני מקללים אותם", "כי בלעם היה צדיק יותר מיצחק", "כי ברכות תמיד חזקות יותר מקללות"], "kasha": "הסדר ההפוך בנוסחת בלעם דורש צדקה תיאולוגית מעבר להעדפה סגנונית בלבד.", "answer": "הרשעים חווים אושר תחילה ואחר כך סבל, אז מברכים אותם מגיעים כרונולוגית לפני מקללים אותם; כך בלעם, שהוא רשע, מציין את הברכה לפני הקללה."}]}, {"id": "27:30.1", "ch": 27, "v": 30, "n": 1, "dh": "יצא יצא", "pasuk_html": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלָּ֣ה יִצְחָק֮ לְבָרֵ֣ךְ אֶֽת־יַעֲקֹב֒ וַיְהִ֗י אַ֣ךְ <mark>יָצֹ֤א יָצָא֙</mark> יַעֲקֹ֔ב מֵאֵ֥ת פְּנֵ֖י יִצְחָ֣ק אָבִ֑יו וְעֵשָׂ֣ו אָחִ֔יו בָּ֖א מִצֵּידֽוֹ׃", "pasuk_en": "וַיְהִי כַּאֲשֶׁר כִּלָּה יִצְחָק לְבָרֵךְ אֶת יַעֲקֹב וַיְהִי אַךְ יָצָא יָצָא יַעֲקֹב מֵאֶת פְּנֵי יִצְחָק אָבִיו וְעֵשָׂו אָחִיו בָּא מִצֵּידוֹ.", "rashi_he": "יצא יצא. זֶה יוֹצֵא וְזֶה בָא:", "rashi_en": "אַךְ יָצָא יָצָא — פֵּרוּשׁוֹ זֶה: כְּשֶׁאֶחָד יוֹצֵא הַשֵּׁנִי נִכְנַס (מִדְרַשׁ תַּנְחוּמָא תּוֹלְדוֹת יא׳).", "note": "", "points": [{"q": "מַה מַסְבִּיר רש״י בִּשְׁנִיַּת הַמִּלָּה 'יָצָא יָצָא' (יַעֲקֹב יָצָא, יָצָא)?", "options": ["יַעֲקֹב כִּמְעַט יָצָא כְּשֶׁעֵשָׂו הָיָה בְּאוֹתוֹ הָרֶגַע בָּא", "יַעֲקֹב יָצָא פַּעֲמַיִם בִּשְׁנֵי זְמַנִּים נִפְרָדִים", "יַעֲקֹב הָיָה מְבוּלְבַּל עַל אֵיזוֹ כִּיוּוּן לָלֶכֶת"], "kasha": "מַדּוּעַ הַפָּסוּק שׁוֹנֵה 'יָצָא יָצָא' בִּמְקוֹם לוֹמַר זֶה פַּעַם אַחַת?", "answer": "הַשְּׁנִיַּת הַמִּלָּה מַדְגִּישָׁה אֶת דִּיּוּק הַזְּמַן: בְּאוֹתוֹ הָרֶגַע שֶׁיַּעֲקֹב הָיָה יוֹצֵא, אָחִיו עֵשָׂו הָיָה בָּא — הֵם כִּמְעַט הִצְטָלְבוּ זֶה עִם זֶה."}]}, {"id": "27:33.1", "ch": 27, "v": 33, "n": 1, "dh": "ויחרד", "pasuk_html": "<mark>וַיֶּחֱרַ֨ד</mark> יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד־מְאֹד֒ וַיֹּ֡אמֶר מִֽי־אֵפ֡וֹא ה֣וּא הַצָּֽד־צַ֩יִד֩ וַיָּ֨בֵא לִ֜י וָאֹכַ֥ל מִכֹּ֛ל בְּטֶ֥רֶם תָּב֖וֹא וָאֲבָרְכֵ֑הוּ גַּם־בָּר֖וּךְ יִהְיֶֽה׃", "pasuk_en": "וַיִּחְרַד יִצְחָק חֲרָדָה גְדוֹלָה עַד־מְאֹד וַיֹּאמֶר מִי־אִפוֹא צַד־צַיִד וַיָּבֵא לִי וָאֹכַל מִכֹּל בְּטֶרֶם תָּבוֹא וָאֲבָרְכֵהוּ גַּם בָּרוּךְ יִהְיֶה", "rashi_he": "ויחרד. כְּתַרְגּוּמוֹ וּתְוַהּ, לְשׁוֹן תְּמִיהָ. וּמִדְרָשׁוֹ רָאָה גֵּיהִנֹּם פְּתוּחָה מִתַּחְתָּיו:", "rashi_en": "וַיִּחְרַד - תַּרְגֵּם אוֹתוֹ כַּמַּשְׁמָעוּת שֶׁל הַתַּרְגּוּם: נִשְׁתַּמַּם עַל דַּעְתּוֹ. וּפִרוּשׁוֹ הַמִּדְרָשִׁי הוּא שֶׁהוּא רָאָה אֶת גֵּיהִנּוֹם נִפְתַּחַת מִתַּחְתָּיו.", "note": "", "points": [{"q": "לפי רש״י, מה משמעות המילה 'ויחרד' (ויצחק רעד)?", "options": ["יצחק היה בתוהו או מבולבל", "יצחק רעד מקור", "יצחק כעס על יעקב"], "kasha": "מה משמעות המילה 'ויחרד' בהקשר זה?", "answer": "זה אומר שיצחק היה מבולבל או המום, המבטא בהלם ולא רק רעידה פיזית."}, {"q": "מה מציעה ההסברה המדרשית שיצחק חווה כאשר הוא רעד?", "options": ["הוא ראה גהינום (גיהנום) נפתח מתחתיו של עשו", "הוא הבין שהוא עשה טעות נוראה", "הוא הרגיש חולה פיזית מהאוכל"], "kasha": "למה יצחק היה לו תגובה כל כך חזקה של רעידה מעבר לבלבול?", "answer": "לפי המדרש, יצחק היה לו חזון רוחני של גהינום שנפתח מתחתיו של עשו, חושף את ירידתו הרוחנית העתידית של עשו."}]}, {"id": "27:33.2", "ch": 27, "v": 33, "n": 2, "dh": "מי אפוא", "pasuk_html": "וַיֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד־מְאֹד֒ וַיֹּ֡אמֶר <mark>מִֽי־אֵפ֡וֹא</mark> ה֣וּא הַצָּֽד־צַ֩יִד֩ וַיָּ֨בֵא לִ֜י וָאֹכַ֥ל מִכֹּ֛ל בְּטֶ֥רֶם תָּב֖וֹא וָאֲבָרְכֵ֑הוּ גַּם־בָּר֖וּךְ יִהְיֶֽה׃", "pasuk_en": "וַיִּחְרַד יִצְחָק חֲרָדָה גְדוֹלָה מְאֹד וַיֹּאמֶר מִי אֵפוֹא הוּא הַצָּד צַיִד וַיָּבֵא לִי וָאֹכַל מִכֹּל בְּטֶרֶם תָּבוֹא וָאֲבָרְכֵהוּ גַּם בָּרוּךְ יִהְיֶה", "rashi_he": "מי אפוא. לָשׁוֹן לְעַצְמוֹ מְשַׁמֵּשׁ עִם כַּמָּה דְבָרִים; אֵיפֹה – אַיֵּה פֹה, מִי הוּא וְאֵיפֹה הוּא הַצָּד צַיִד?", "rashi_en": "מִי אֵפוֹא - הַמִּלָּה אֵפוֹא הִיא חֲלָקִיק עַצְמָאִי וְאֵין לָהּ קִשּׁוּר אֶטִימוֹלוֹגִי עִם שׁוּם מִלָּה אַחֶרֶת בָּעִבְרִית. וּמִפְרֵשׁ אַחֵר הוּא שֶׁאֵפוֹא הוּא כְּמוֹ אֵיּה פֹה, וּכְכָךְ מִי אֵפוֹא מִשְׁמַע מִי הוּא וְאֵיפֹה הוּא שֶׁצָּד צַיִד.", "note": "", "points": [{"q": "כֵּיצַד מְפָרְשׁ רַשִׁ״י אֶת הַמִּלָּה 'אֵפוֹא' בִּ'מִי אֵפוֹא'?", "options": ["זֶה חֲלָקִיק עַצְמָאִי שֶׁיָּכוֹל לְהִשְׁמַע 'אֵיפֹה' אוֹ 'מִי', וְהוּא מַשְׁמַע גַּם זֶהוּת וְגַם מָקוֹם", "זֶה מִשּׁוֹרֶשׁ הַמִּלָּה שְׁמַעְנוּ 'תַּפּוּחַ'", "זֶה מִלָּה זָרָה שֶׁנִּלְוְתָה מִלָּשׁוֹן אַחֶרֶת"], "kasha": "מַה פֵּרוּשׁ הַמִּלָּה הַיְשִׁירָה 'אֵפוֹא', וְכֵיצַד הִיא מִשְׁתַּלֶּבֶת בַּשְּׁאֵלָה שֶׁל יִצְחָק?", "answer": "רַשִׁ״י מְבָאֵר שֶׁ'אֵפוֹא' יָכוֹל לְהִיפָּרֵש כּ'אֵיּה פֹה' (אֵיפֹה כָּאן), וְכָךְ 'מִי אֵפוֹא' מִשְׁמַע 'מִי הוּא וְאֵיפֹה הוּא שֶׁצָּד צַיִד?'"}]}, {"id": "27:33.3", "ch": 27, "v": 33, "n": 3, "dh": "ואכל מכל", "pasuk_html": "וַיֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד־מְאֹד֒ וַיֹּ֡אמֶר מִֽי־אֵפ֡וֹא ה֣וּא הַצָּֽד־צַ֩יִד֩ וַיָּ֨בֵא לִ֜י <mark>וָאֹכַ֥ל מִכֹּ֛ל</mark> בְּטֶ֥רֶם תָּב֖וֹא וָאֲבָרְכֵ֑הוּ גַּם־בָּר֖וּךְ יִהְיֶֽה׃", "pasuk_en": "וַיִּחְרַד יִצְחָק חֲרָדָה גְדוֹלָה מְאֹד וַיֹּאמֶר מִי אֵפוֹא הוּא הַצָּד צַיִד וַיָּבֵא לִי וָאֹכַל מִכֹּל בְּטֶרֶם תָּבוֹא וָאֲבָרְכֵהוּ גַּם בָּרוּךְ יִהְיֶה", "rashi_he": "ואכל מכל. מִכָּל טְעָמִים שֶׁבִּקַּשְׁתִּי לִטְעֹם, טָעַמְתִּי בוֹ (בראשית רבה):", "rashi_en": "וָאֹכַל מִכֹּל - כׇּל טְעָמִים שֶׁחִפַּצְתִּי לִמְצֹא בּוֹ מָצָאתִי בּוֹ.", "note": "", "points": [{"q": "מַה כּוּנַת רַשִ
