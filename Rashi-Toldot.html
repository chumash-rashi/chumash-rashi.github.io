ּקוֹם הַהוּא וְחָפַר שָׁם בְּאֵרוֹת חֲדָשׁוֹת לְגַמְרֵי", "חָזַר לְעִיר גְּרָר כְּדֵי לַחְפּוֹר בְּאֵרוֹת לַאֲבִימֶלֶךְ"], "kasha": "״וישב״ נשמע לשון ישיבה, וכבר סופר בפסוק טו על סתימת הבארות; מה מוסיף כאן הכתוב?", "answer": "הבארות שחפרו בימי אברהם אביו ושהפלשתים סתמו עוד קודם שנסע יצחק מגרר – חזר יצחק וחפר אותן.", "kp": ["הבארות אשר חפרו בימי אברהם אביו", "חזר וחפרן"]}]}, {"id": "26:20.1", "ch": 26, "v": 20, "n": 1, "dh": "עשק", "pasuk_html": "וַיָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם־רֹעֵ֥י יִצְחָ֛ק לֵאמֹ֖ר לָ֣נוּ הַמָּ֑יִם וַיִּקְרָ֤א שֵֽׁם־הַבְּאֵר֙ <mark>עֵ֔שֶׂק</mark> כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽוֹ׃", "pasuk_en": "וַיָּרִיבוּ רוֹעֵי גְרָר אֶת־רוֹעֵי יִצְחָק לֵאמֹר לָנוּ הַמָּיִם וַיִּקְרָא שֵׁם־הַבְּאֵר עֵשֶׂק כִּי הִתְעַשְּׂקוּ עִמּוֹ.", "rashi_he": "עשק. עִרְעוּר:", "rashi_en": "״עשק״ פירושו ערעור – מחלוקת על הבעלות על הבאר.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַשֵּׁם ״עֵשֶׂק״ שֶׁנָּתַן יִצְחָק לַבְּאֵר?", "options": ["עֵרְעוּר וּמַחֲלוֹקֶת עַל הַבְּאֵר", "גֶּזֶל וְעוֹשֶׁק בְּכוֹחַ הַזְּרוֹעַ", "עֵסֶק וְעָמָל רַב בַּחֲפִירָה"], "kasha": "מה משמעות השם ״עשק״?", "answer": "״עשק״ פירושו ערעור.", "kp": ["ערעור"]}]}, {"id": "26:20.2", "ch": 26, "v": 20, "n": 2, "dh": "כי התעשקו עמו", "pasuk_html": "וַיָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם־רֹעֵ֥י יִצְחָ֛ק לֵאמֹ֖ר לָ֣נוּ הַמָּ֑יִם וַיִּקְרָ֤א שֵֽׁם־הַבְּאֵר֙ עֵ֔שֶׂק <mark>כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽוֹ׃</mark>", "pasuk_en": "וַיָּרִיבוּ רוֹעֵי גְרָר אֶת־רוֹעֵי יִצְחָק לֵאמֹר לָנוּ הַמָּיִם וַיִּקְרָא שֵׁם־הַבְּאֵר עֵשֶׂק כִּי הִתְעַשְּׂקוּ עִמּוֹ.", "rashi_he": "כי התעשקו עמו. נִתְעַשְּׂקוּ עִמּוֹ עָלֶיהָ בִּמְרִיבָה וְעִרְעוּר:", "rashi_en": "רועי גרר התעסקו עם יצחק על הבאר במריבה וערעור.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״כִּי הִתְעַשְּׂקוּ עִמּוֹ״?", "options": ["הִתְעַסְּקוּ עִמּוֹ עַל הַבְּאֵר בִּמְרִיבָה וּבְעִרְעוּר", "עָשְׁקוּ אוֹתוֹ וְגָזְלוּ מִמֶּנּוּ אֶת הַבְּאֵר בְּכוֹחַ", "עָזְרוּ לוֹ בַּחֲפִירַת הַבְּאֵר וְעָסְקוּ בָּהּ עִמּוֹ"], "kasha": "יש להבין את פירוש ״התעשקו״ ומה עשו רועי גרר ליצחק.", "answer": "נתעסקו עמו עליה במריבה וערעור.", "kp": ["נתעשקו עמו עליה", "במריבה וערעור"]}]}, {"id": "26:21.1", "ch": 26, "v": 21, "n": 1, "dh": "שטנה", "pasuk_html": "וַֽיַּחְפְּרוּ֙ בְּאֵ֣ר אַחֶ֔רֶת וַיָּרִ֖יבוּ גַּם־עָלֶ֑יהָ וַיִּקְרָ֥א שְׁמָ֖הּ <mark>שִׂטְנָֽה׃</mark>", "pasuk_en": "וַיִּחְפְּרוּ בְאֵר אַחֶרֶת וַיָּרִיבוּ גַּם־עָלֶיהָ וַיִּקְרָא שְׁמָהּ שִׂטְנָה.", "rashi_he": "שטנה. נושימנ\"ט:", "rashi_en": "״שטנה״ פירושה היזק והפרעה, ובלע״ז נושימנ״ט.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַשֵּׁם ״שִׂטְנָה״ לְפִי רַשִׁ״י?", "options": ["הֶיזֵּק וְהַפְרָעָה (בְּלַעַ״ז נוֹשִׁימְנְ״ט)", "שִׂנְאָה וְאֵיבָה עֲמוּקָּה בֵּין הָרוֹעִים", "קִטְרוּג וְהַלְשָׁנָה לִפְנֵי הַמֶּלֶךְ"], "kasha": "מה משמעות השם ״שטנה״ שנתן יצחק לבאר השנייה?", "answer": "רש״י מפרש בלע״ז ״נושימנ״ט״, כלומר היזק והפרעה.", "kp": ["נושימנ\"ט"]}]}, {"id": "26:22.1", "ch": 26, "v": 22, "n": 1, "dh": "ופרינו בארץ", "pasuk_html": "וַיַּעְתֵּ֣ק מִשָּׁ֗ם וַיַּחְפֹּר֙ בְּאֵ֣ר אַחֶ֔רֶת וְלֹ֥א רָב֖וּ עָלֶ֑יהָ וַיִּקְרָ֤א שְׁמָהּ֙ רְחֹב֔וֹת וַיֹּ֗אמֶר כִּֽי־עַתָּ֞ה הִרְחִ֧יב יְהֹוָ֛ה לָ֖נוּ <mark>וּפָרִ֥ינוּ בָאָֽרֶץ׃</mark>", "pasuk_en": "וַיִּסַּע מִשָּׁם בְּאֵר אַחֶרֶת וַיִּחְפְּרוּ וְלֹא־רָבוּ עָלֶיהָ וַיִּקְרָא שְׁמָהּ רְחֹבוֹת וַיֹּאמֶר כִּי־עַתָּה הִרְחִיב ה׳ לָנוּ וּפָרִינוּ בָּאָרֶץ.", "rashi_he": "ופרינו בארץ. כְּתַרְגּוּמוֹ וְנֵיפוּשׁ בְּאַרְעָא:", "rashi_en": "״ופרינו בארץ״ פירושו כתרגום אונקלוס ״וניפוש בארעא״ – ונרבה בארץ.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ ״וּפָרִינוּ בָאָרֶץ״ לְפִי הַתַּרְגּוּם שֶׁמֵּבִיא רַשִׁ״י?", "options": ["וְנִרְבֶּה וְנִתְרַבֶּה בָּאָרֶץ", "וְנִגְדַּל פֵּירוֹת רַבִּים בָּאָרֶץ", "וְנִתְפַּזֵּר לְכָל רוּחוֹת הָאָרֶץ"], "kasha": "״ופרינו״ עלול להתפרש מלשון פרי האדמה ולא מלשון ריבוי.", "answer": "כתרגומו ״וניפוש בארעא״, כלומר ונרבה בארץ.", "kp": ["וניפוש בארעא"]}]}, {"id": "26:26.1", "ch": 26, "v": 26, "n": 1, "dh": "ואחזת מרעהו", "pasuk_html": "וַאֲבִימֶ֕לֶךְ הָלַ֥ךְ אֵלָ֖יו מִגְּרָ֑ר <mark>וַאֲחֻזַּת֙ מֵֽרֵעֵ֔הוּ</mark> וּפִיכֹ֖ל שַׂר־צְבָאֽוֹ׃", "pasuk_en": "וַיָּבֹא אֵלָיו אֲבִימֶלֶךְ מִגְּרָר וַאַחוּזַּת מֵרֵעָיו וּפִיכֹל שַׂר־צְבָאוֹ.", "rashi_he": "ואחזת מרעהו. כְּתַרְגּוּמוֹ וְסִיעַת מֵרַחֲמוֹהִי, סִיעַת מֵאוֹהֲבָיו. וְיֵשׁ פּוֹתְרִין מֵרֵעֵהוּ מ' מִיסוֹד הַתֵּבָה, כְּמוֹ שְׁלֹשִׁים מֵרֵעִים דְּשִׁמְשׁוֹן, כְּדֵי שֶׁתִּהְיֶה תֵּבַת וַאֲחֻזַּת דְּבוּקָה; אֲבָל אֵין דֶּרֶךְ אֶרֶץ לְדַבֵּר עַל הַמַּלְכוּת כֵּן, סִיעַת אוֹהֲבָיו, שֶׁאִם כֵּן, כָּל סִיעַת אוֹהֲבָיו הוֹלִיךְ עִמּוֹ, וְלֹא הָיָה לוֹ אֶלָּא סִיעָה אַחַת שֶׁל אוֹהֲבִים – לָכֵן יֵשׁ לְפָתְרוֹ בַּלָּשׁוֹן הָרִאשׁוֹן; וְאַל תִּתְמַהּ עַל תָּי\"ו שֶׁל אֲחֻזַּת וְאַעַ\"פִּ שֶׁאֵין תֵּבָה סְמוּכָה, יֵשׁ דֻּגְמָתָהּ בַּמִּקְרָא עֶזְרָת מִצָּר (תהילים ס'), וּשְׁכֻרַת וְלֹא מִיָּיִן (ישעיהו נ\"א):", "rashi_en": "כתרגום: ״וסיעת מרחמוהי״ – קבוצה מתוך אוהביו. יש שפירשו ״מרעהו״ מלשון ״מרעים״ ו״אחזת״ סמוכה לו – ״סיעת אוהביו״, אבל אין דרך ארץ לומר כך על מלך, שמשמע שלא הייתה לו אלא סיעת אוהבים אחת. והתי״ו של ״אחזת״ אינה ראיה לסמיכות, שיש כדוגמתה ״עזרת מצר״ ו״שכרת ולא מיין״.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ שֶׁרַשִׁ״י מְקַבֵּל, מָה פֵּירוּשׁ ״וַאֲחֻזַּת מֵרֵעֵהוּ״?", "options": ["קְבוּצָה מִתּוֹךְ אוֹהֲבָיו – הַמֵּ״ם בְּמַשְׁמָעוּת ״מִן״", "כָּל קְבוּצַת אוֹהֲבָיו – הַמ״ם מִשּׁוֹרֶשׁ הַמִּילָּה", "הָאֲחוּזָּה וְהַנַּחֲלָה שֶׁל רֵעֵהוּ שֶׁל אֲבִימֶלֶךְ"], "kasha": "לא ברור אם המ״ם של ״מרעהו״ היא שימושית (״מן״) או חלק מן המילה ״מרע״.", "answer": "כתרגומו ״וסיעת מרחמוהי״ – סיעה מאוהביו, והמ״ם במשמעות ״מן״.", "kp": ["כתרגומו וסיעת מרחמוהי", "סיעת מאוהביו"]}, {"q": "מַדּוּעַ דּוֹחֶה רַשִׁ״י אֶת הַפֵּירוּשׁ ״סִיעַת אוֹהֲבָיו״, שֶׁהַמֵּ״ם מִשּׁוֹרֶשׁ הַמִּילָה?", "options": ["אֵין דֶּרֶךְ אֶרֶץ לוֹמַר עַל מֶלֶךְ שֶׁהָיְיתָה לוֹ סִיעַת אוֹהֲבִים אַחַת בִּלְבַד", "כִּי הַמִּילָה ״מְרֵעִים״ אֵינָהּ מוֹפִיעָה בְּשׁוּם מָקוֹם בַּמִּקְרָא", "כִּי לַאֲבִימֶלֶךְ לֹא הָיוּ אוֹהֲבִים כְּלָל, אֶלָּא עֲבָדִים בִּלְבַד"], "kasha": "התי״ו של ״אחזת״ מורה לכאורה על סמיכות, ולכן יש שפירשו ״סיעת אוהביו״.", "answer": "אין דרך ארץ לדבר כך על המלכות, שאם כן כל סיעת אוהביו הוליך עמו ולא הייתה לו אלא סיעה אחת. והתי״ו אינה ראיה, שיש כדוגמתה ״עזרת מצר״ ו״שכרת ולא מיין״.", "kp": ["אין דרך ארץ לדבר על המלכות", "ולא היה לו אלא סיעה אחת"]}]}, {"id": "26:26.2", "ch": 26, "v": 26, "n": 2, "dh": "אחזת", "pasuk_html": "וַאֲבִימֶ֕לֶךְ הָלַ֥ךְ אֵלָ֖יו מִגְּרָ֑ר <mark>וַאֲחֻזַּת֙</mark> מֵֽרֵעֵ֔הוּ וּפִיכֹ֖ל שַׂר־צְבָאֽוֹ׃", "pasuk_en": "וַיָּבֹא אֵלָיו אֲבִימֶלֶךְ מִגְּרָר וַאַחוּזַּת מֵרֵעָיו וּפִיכֹל שַׂר־צְבָאוֹ.", "rashi_he": "אחזת. לְשׁוֹן קְבִיצָה וַאֲגֻדָּה שֶׁנֶּאֱחָזִין יַחַד:", "rashi_en": "״אחזת״ היא קבוצה ואגודה של אנשים, שנקראת כך משום שהם אחוזים יחד.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָּה ״אֲחֻזַּת״ בַּפָּסוּק?", "options": ["קְבוּצָה וַאֲגוּדָּה שֶׁל אֲנָשִׁים הָאֲחוּזִים יַחַד", "נַחֲלָה וַאֲחוּזַּת קַרְקַע שֶׁל הַמֶּלֶךְ", "תְּפִיסָה בְּכוֹחַ, לְשׁוֹן שְׁבִי וּמַאֲסָר"], "kasha": "״אחזה״ משמעה בדרך כלל נחלה, ומה ענינה כאן?", "answer": "לשון קיבוץ ואגודה, שנאחזים יחד.", "kp": ["לשון קביצה ואגדה", "שנאחזין יחד"]}]}, {"id": "26:28.1", "ch": 26, "v": 28, "n": 1, "dh": "ראו ראינו", "pasuk_html": "וַיֹּאמְר֗וּ <mark>רָא֣וֹ רָאִ֘ינוּ֮</mark> כִּֽי־הָיָ֣ה יְהֹוָ֣ה&thinsp;׀&thinsp;עִמָּךְ֒ וַנֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖ינוּ בֵּינֵ֣ינוּ וּבֵינֶ֑ךָ וְנִכְרְתָ֥ה בְרִ֖ית עִמָּֽךְ׃", "pasuk_en": "וַיֹּאמְרוּ רָאוֹ רָאִינוּ כִּי־הָיָה ה׳ עִמָּךְ וַנֹּאמְרָה נָּא בְרִית בֵּינוֹתֵינוּ בֵּינְךָ וּבֵינֵנוּ וְנִכְרְתָה בְרִית עִמָּךְ.", "rashi_he": "ראו ראינו. רָאִינוּ בְאָבִיךָ, רָאִינוּ בְךָ:", "rashi_en": "הלשון הכפולה “ראו ראינו” מלמדת על שתי ראיות: ראינו שה׳ היה עם אביך אברהם, ואנו רואים שהוא עמך.", "note": "", "points": [{"q": "מַדּוּעַ נֶאֱמַר בִּלְשׁוֹן כְּפוּלָה “רָאוֹ רָאִינוּ”?", "options": ["רָאִינוּ שֶׁה׳ הָיָה עִם אָבִיךָ, וְרוֹאִים שֶׁהוּא גַּם עִמָּךְ", "רָאִינוּ בְּעֵינֵינוּ, וְגַם שָׁמַעְנוּ זֹאת מֵאֲחֵרִים", "רָאִינוּ כְּשֶׁגֵּירַשְׁנוּךָ, וְרָאִינוּ שׁוּב כְּשֶׁחָזַרְתָּ לִגְרָר"], "kasha": "הפסוק כופל את לשון הראייה בלי צורך נראה לעין.", "answer": "ראינו באביך וראינו בך – שה׳ היה עם אברהם וגם עם יצחק.", "kp": ["ראינו באביך", "ראינו בך"]}]}, {"id": "26:28.2", "ch": 26, "v": 28, "n": 2, "dh": "תהי נא אלה בינותינו", "pasuk_html": "וַיֹּאמְר֗וּ רָא֣וֹ רָאִ֘ינוּ֮ כִּֽי־הָיָ֣ה יְהֹוָ֣ה&thinsp;׀&thinsp;עִמָּךְ֒ וַנֹּ֗אמֶר <mark>תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖ינוּ</mark> בֵּינֵ֣ינוּ וּבֵינֶ֑ךָ וְנִכְרְתָ֥ה בְרִ֖ית עִמָּֽךְ׃", "pasuk_en": "וַיֹּאמְרוּ כִּי רָאִינוּ כִּי־הָיָה יְהוָה עִמָּךְ וַנֹּאמְרָה תְּהִי־נָא אָלָה בֵּינוֹתֵינוּ בֵּינִים וּבֵינֶךָ וְנִכְרְתָה בְּרִית עִמָּךְ", "rashi_he": "תהי נא אלה בינותינו וגו'. הָאָלָה אֲשֶׁר בֵּינוֹתֵינוּ מִימֵי אָבִיךָ תְּהִי גַּם עַתָּה בינינו וביניך:", "rashi_en": "השבועה שהייתה בין אנשי גרר לבין אברהם עוד מימיו – אבימלך מבקש שתהיה קיימת גם עכשיו בינם לבין יצחק.", "note": "", "points": [{"q": "לְאֵיזוֹ אָלָה מִתְכַּוֵּון אֲבִימֶלֶךְ בְּאָמְרוֹ “תְּהִי נָא אָלָה בֵּינוֹתֵינוּ”?", "options": ["לַשְּׁבוּעָה שֶׁהָיְיתָה עִם אַבְרָהָם, שֶׁתִּהְיֶה קַיֶּימֶת גַּם עִם יִצְחָק", "לִשְׁבוּעָה חֲדָשָׁה לְגַמְרֵי, שֶׁלֹּא הָיְיתָה בֵּינֵיהֶם קוֹדֶם לָכֵן", "לִקְלָלָה שֶׁתָּחוֹל עַל מִי שֶׁיָּפֵר אֶת הַבְּרִית שֶׁבֵּינֵיהֶם"], "kasha": "הפסוק אומר “בינותינו” ואחר כך “בינינו ובינך”, ונראה ככפילות.", "answer": "האלה אשר בינותינו מימי אביך – תהי גם עתה בינינו ובינך.", "kp": ["האלה אשר בינותינו מימי אביך", "תהי גם עתה בינינו וביניך"]}]}, {"id": "26:29.1", "ch": 26, "v": 29, "n": 1, "dh": "לא נגענוך", "pasuk_html": "אִם־תַּעֲשֵׂ֨ה עִמָּ֜נוּ רָעָ֗ה כַּאֲשֶׁר֙ <mark>לֹ֣א נְגַֽעֲנ֔וּךָ</mark> וְכַאֲשֶׁ֨ר עָשִׂ֤ינוּ עִמְּךָ֙ רַק־ט֔וֹב וַנְּשַׁלֵּֽחֲךָ֖ בְּשָׁל֑וֹם אַתָּ֥ה עַתָּ֖ה בְּר֥וּךְ יְהֹוָֽה׃", "pasuk_en": "לְּךָ לוֹא תַעֲשֶׂה־לָּנוּ רָעָה כַּאֲשֶׁר לֹא־נָגַעְנוּ בְּךָ וְכַאֲשֶׁר עָשִׂינוּ אִתְּךָ רַק־טוֹב וַנִּשְׁלָּחְךָ בְּשָׁלוֹם אַתָּה עַתָּה בְּרוּךְ יְהוָה", "rashi_he": "לא נגענוך. כְּשֶׁאָמַרְנוּ לֵךְ לְךָ מֵעִמָּנוּ:", "rashi_en": "אבימלך אומר שגם כשאמרו ליצחק “לך מעמנו” ושלחוהו מארצם – לא פגעו בו.", "note": "", "points": [{"q": "מָתַי, לְדִבְרֵי אֲבִימֶלֶךְ, “לֹא נְגַעֲנוּךָ”?", "options": ["כְּשֶׁאָמְרוּ לְיִצְחָק “לֵךְ מֵעִמָּנוּ” וְשִׁלְּחוּהוּ מֵאַרְצָם", "כְּשֶׁסָּתְמוּ אֶת הַבְּאֵרוֹת שֶׁחָפְרוּ עַבְדֵי אַבְרָהָם", "כְּשֶׁרָבוּ רוֹעֵי גְרָר עִם רוֹעֵי יִצְחָק עַל הַמַּיִם"], "kasha": "הרי גירשו את יצחק מארצם, ואיך יכלו לומר שלא נגעו בו?", "answer": "כשאמרנו לך “לך מעמנו” – אמנם שלחנוך, אבל לא פגענו בך.", "kp": ["כשאמרנו לך לך מעמנו"]}]}, {"id": "26:29.2", "ch": 26, "v": 29, "n": 2, "dh": "אתה", "pasuk_html": "אִם־תַּעֲשֵׂ֨ה עִמָּ֜נוּ רָעָ֗ה כַּאֲשֶׁר֙ לֹ֣א נְגַֽעֲנ֔וּךָ וְכַאֲשֶׁ֨ר עָשִׂ֤ינוּ עִמְּךָ֙ רַק־ט֔וֹב וַנְּשַׁלֵּֽחֲךָ֖ בְּשָׁל֑וֹם <mark>אַתָּ֥ה</mark> עַתָּ֖ה בְּר֥וּךְ יְהֹוָֽה׃", "pasuk_en": "לְּךָ לוֹא תַעֲשֶׂה־לָּנוּ רָעָה כַּאֲשֶׁר לֹא־נָגַעְנוּ בְּךָ וְכַאֲשֶׁר עָשִׂינוּ אִתְּךָ רַק־טוֹב וַנִּשְׁלָּחְךָ בְּשָׁלוֹם אַתָּה עַתָּה בְּרוּךְ יְהוָה", "rashi_he": "אתה. גַּם אַתָּה עֲשֵׂה לָנוּ כְּמוֹ כֵן:", "rashi_en": "“אתה” הוא המשך הבקשה: כשם שאנו לא פגענו בך ועשינו עמך רק טוב, גם אתה עשה לנו כך.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָּה “אַתָּה” בְּדִבְרֵי אֲבִימֶלֶךְ לְיִצְחָק?", "options": ["גַּם אַתָּה עֲשֵׂה לָנוּ כְּמוֹ שֶׁעָשִׂינוּ לְךָ", "אַתָּה לְבַדְּךָ בָּרוּךְ ה׳, וְלֹא אַנְשֵׁי בֵיתְךָ", "אַתָּה צָרִיךְ לָבוֹא אֵלֵינוּ לִגְרָר לִכְרוֹת בְּרִית"], "kasha": "המילה “אתה” נראית מיותרת ומנותקת מהמשך הפסוק.", "answer": "גם אתה עשה לנו כמו כן – כשם שאנו עשינו עמך.", "kp": ["גם אתה עשה לנו כמו כן"]}]}, {"id": "26:33.1", "ch": 26, "v": 33, "n": 1, "dh": "שבעה", "pasuk_html": "וַיִּקְרָ֥א אֹתָ֖הּ <mark>שִׁבְעָ֑ה</mark> עַל־כֵּ֤ן שֵׁם־הָעִיר֙ בְּאֵ֣ר שֶׁ֔בַע עַ֖ד הַיּ֥וֹם הַזֶּֽה׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיִּקְרָא אֶת־שֵׁם־הַבְּאֵר שִׁבְעָה עַל־כֵּן שֵׁם־הָעִיר בְּאֵר שָׁבַע עַד הַיּוֹם הַזֶּה", "rashi_he": "שבעה. עַל שֵׁם הַבְּרִית:", "rashi_en": "יצחק קרא לבאר “שבעה” על שם הברית והשבועה שנשבעו הוא ואבימלך זה לזה.", "note": "", "points": [{"q": "עַל שֵׁם מָה קָרָא יִצְחָק לַבְּאֵר “שִׁבְעָה”?", "options": ["עַל שֵׁם הַבְּרִית וְהַשְּׁבוּעָה שֶׁכָּרַת עִם אֲבִימֶלֶךְ", "עַל שֵׁם שֶׁבַע הַכְּבָשׂוֹת שֶׁנָּתַן אַבְרָהָם לַאֲבִימֶלֶךְ", "עַל שֵׁם שֶׁבַע הַבְּאֵרוֹת שֶׁחָפְרוּ עַבְדֵי יִצְחָק"], "kasha": "הפסוק אינו מפרש מה טעם השם “שבעה”.", "answer": "על שם הברית – השבועה שנשבעו יצחק ואבימלך.", "kp": ["על שם הברית"]}]}, {"id": "26:34.1", "ch": 26, "v": 34, "n": 1, "dh": "בן ארבעים שנה", "pasuk_html": "וַיְהִ֤י עֵשָׂו֙ <mark>בֶּן־אַרְבָּעִ֣ים שָׁנָ֔ה</mark> וַיִּקַּ֤ח אִשָּׁה֙ אֶת־יְהוּדִ֔ית בַּת־בְּאֵרִ֖י הַֽחִתִּ֑י וְאֶת־בָּ֣שְׂמַ֔ת בַּת־אֵילֹ֖ן הַֽחִתִּֽי׃", "pasuk_en": "וַיִּהְיוּ בְנֵי־עֵשָׂיו בִּן־אַרְבָּעִים שָׁנָה וַיִּשַׁח אֶת־יְהוּדִית בַּת־בְּאֵרִי הַחִתִּי וְאֶת־בָּשְׂמַת בַּת־אֵילוֹן הַחִתִּי", "rashi_he": "בן ארבעים שנה. עֵשָׂו הָיָה נִמְשָׁל לַחֲזִיר, שֶׁנֶּאֱמַר יְכַרְסְמֶנָּה חֲזִיר מִיָּעַר (תהילים פ'), הַחֲזִיר הַזֶּה כְּשֶׁהוּא שׁוֹכֵב, פּוֹשֵׁט טְלָפָיו, לוֹמַר רְאוּ שֶׁאֲנִי טָהוֹר; כָּךְ אֵלּוּ גּוֹזְלִים וְחוֹמְסִים וּמַרְאִים עַצְמָם כְּשֵׁרִים; כָּל מ' שָׁנָה הָיָה עֵשָׂו צָד נָשִׁים מִתַּחַת בַּעֲלֵיהֶן וּמְעַנֶּה אוֹתָם, כְּשֶׁהָיָה בֶּן מ' אָמַר אַבָּא בֶּן מ' שָׁנָה נָשָׂא אִשָּׁה, אַף אֲנִי כֵן:", "rashi_en": "עשו נמשל לחזיר, שפושט את טלפיו כאילו הוא טהור – כך הוא גזל וחמס והראה עצמו כשר. כל ארבעים שנה צד נשים מבעליהן ועינה אותן, וכשהגיע לגיל ארבעים אמר: אבא נשא אשה בגיל ארבעים, גם אני כן.", "note": "", "points": [{"q": "מַדּוּעַ מְצַיֶּינֶת הַתּוֹרָה שֶׁעֵשָׂו נָשָׂא אִשָּׁה בֶּן אַרְבָּעִים שָׁנָה?", "options": ["כְּדֵי לְהַרְאוֹת עַצְמוֹ כָּשֵׁר, כְּאָבִיו שֶׁנָּשָׂא אִשָּׁה בְּגִיל אַרְבָּעִים", "כִּי עַד אָז עָסַק בְּצַיִד וְלֹא הָיָה פָּנוּי לְנִישּׂוּאִין", "כִּי יִצְחָק צִיווָּה עָלָיו שֶׁלֹּא יִישָּׂא אִשָּׁה לִפְנֵי כֵן"], "kasha": "מה חשיבות יש לגיל שבו נשא עשו אשה?", "answer": "עשו אמר: אבא נשא אשה בן ארבעים, אף אני כן – ובכל השנים שקודם לכן צד נשים מתחת בעליהן ועינה אותן.", "kp": ["ומראים עצמם כשרים", "אמר אבא בן מ' שנה"]}, {"q": "בַּמֶּה דּוֹמֶה עֵשָׂו לַחֲזִיר?", "options": ["הַחֲזִיר מַרְאֶה טְלָפָיו כְּאִילּוּ הוּא טָהוֹר, וְעֵשָׂו מַרְאֶה עַצְמוֹ כָּשֵׁר", "הַחֲזִיר אוֹכֵל כָּל דָּבָר, וְעֵשָׂו הָיָה רַעְבְתָן וְאָכַל בְּלִי הֶבְחֵנָה", "הַחֲזִיר חַי בַּיַּעַר, וְעֵשָׂו הָיָה אִישׁ שָׂדֶה וְיוֹדֵעַ צַיִד"], "kasha": "עשו נשא אשה כאביו כאילו היה צדיק, והרי כל ימיו גזל וחמס.", "answer": "החזיר כשהוא שוכב פושט טלפיו לומר ראו שאני טהור; כך הם גוזלים וחומסים ומראים עצמם כשרים.", "kp": ["החזיר הזה כשהוא שוכב, פושט טלפיו", "לומר ראו שאני טהור"]}]}, {"id": "26:35.1", "ch": 26, "v": 35, "n": 1, "dh": "מרת רוח", "pasuk_html": "וַתִּהְיֶ֖יןָ <mark>מֹ֣רַת ר֑וּחַ</mark> לְיִצְחָ֖ק וּלְרִבְקָֽה׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיִּהְיוּ מָרַת רוּחַ לְיִצְחָק וּלְרִבְקָה.", "rashi_he": "מרת רוח. לְשׁוֹן הַמְרָאוֹת רוּחַ, כְּמוֹ מַמְרִים הֱיִיתֶם, כָּל מַעֲשֵׂיהֶן הָיוּ לְהַכְעִיס וּלְעִצָּבוֹן:", "rashi_en": "“מרת רוח” הוא לשון המראה ומרי, כמו “ממרים הייתם”: כל מעשיהן של נשי עשו נועדו להכעיס ולצער.", "note": "", "points": [{"q": "מֵאֵיזוֹ לָשׁוֹן הִיא הַמִּילָּה “מֹרַת” לְפִי רש״י?", "options": ["מִלְּשׁוֹן הַמְרָאָה וּמֶרִי, כְּמוֹ “מַמְרִים הֱיִיתֶם”", "מִלְּשׁוֹן מְרִירוּת, כְּמוֹ מַיִם מָרִים", "מִלְּשׁוֹן מַרְאֶה, כְּמוֹ מַרְאֵה עֵינַיִים"], "kasha": "המילה “מרת” אינה ברורה – ממה היא נגזרת ומה פירושה?", "answer": "לשון המראות רוח, כמו “ממרים הייתם” – כל מעשיהן היו להכעיס ולעצבון.", "kp": ["לשון המראות רוח", "כמו ממרים הייתם"]}]}, {"id": "26:35.2", "ch": 26, "v": 35, "n": 2, "dh": "ליצחק ולרבקה", "pasuk_html": "וַתִּהְיֶ֖יןָ מֹ֣רַת ר֑וּחַ <mark>לְיִצְחָ֖ק וּלְרִבְקָֽה׃</mark>&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיִּהְיוּ מָרַת רוּחַ לְיִצְחָק וּלְרִבְקָה.", "rashi_he": "ליצחק ולרבקה. שֶׁהָיוּ עוֹבְדוֹת עֲ\"זָ (בראשית רבה):", "rashi_en": "נשי עשו היו עובדות עבודה זרה, ולכן היו למורת רוח ליצחק ולרבקה.", "note": "", "points": [{"q": "מַדּוּעַ הָיוּ נְשֵׁי עֵשָׂו “מֹרַת רוּחַ לְיִצְחָק וּלְרִבְקָה”?", "options": ["כִּי הָיוּ עוֹבְדוֹת עֲבוֹדָה זָרָה", "כִּי לֹא רָצוּ לָגוּר בְּבֵית יִצְחָק וְרִבְקָה", "כִּי דִּיבְּרוּ בְּחוּצְפָּה אֶל יִצְחָק וְרִבְקָה"], "kasha": "הפסוק אינו מפרש במה ציערו נשי עשו את יצחק ואת רבקה.", "answer": "שהיו עובדות עבודה זרה.", "kp": ["שהיו עובדות ע\"ז"]}]}, {"id": "27:1.1", "ch": 27, "v": 1, "n": 1, "dh": "ותכהין", "pasuk_html": "וַֽיְהִי֙ כִּֽי־זָקֵ֣ן יִצְחָ֔ק <mark>וַתִּכְהֶ֥יןָ</mark> עֵינָ֖יו מֵרְאֹ֑ת וַיִּקְרָ֞א אֶת־עֵשָׂ֣ו&thinsp;׀ בְּנ֣וֹ הַגָּדֹ֗ל וַיֹּ֤אמֶר אֵלָיו֙ בְּנִ֔י וַיֹּ֥אמֶר אֵלָ֖יו הִנֵּֽנִי׃", "pasuk_en": "וַיְהִי כִּי־זָקֵן יִצְחָק וַתִּכְהֶינָה עֵינָיו מֵרְאוֹת וַיִּקְרָא אֶת־עֵשָׂו בְּנוֹ הַגָּדוֹל וַיֹּאמֶר אֵלָיו בְּנִי וַיֹּאמֶר אֵלָיו הִנֵּנִי.", "rashi_he": "ותכהין. בַּעֲשָׁנָן שֶׁל אֵלּוּ. דָּ\"אַ כְּשֶׁנֶּעֱקַד עַ\"גַּ הַמִּזְבֵּחַ וְהָיָה אָבִיו רוֹצֶה לְשָׁחֳטוֹ, בְּאוֹתָהּ שָׁעָה נִפְתְּחוּ הַשָּׁמַיִם וְרָאוּ מַלְאֲכֵי הַשָּׁרֵת וְהָיוּ בוֹכִים, וְיָרְדוּ דִמְעוֹתֵיהֶם וְנָפְלוּ עַל עֵינָיו, לְפִיכָךְ כָּהוּ עֵינָיו. דָּ\"אַ כְּדֵי שֶׁיִּטֹּל יַעֲקֹב אֶת הַבְּרָכוֹת:", "rashi_en": "שלושה טעמים לכהות עיני יצחק: מעשן הקטורת שהקטירו נשי עשו לעבודה זרה; מדמעות מלאכי השרת שבכו בשעת העקידה ונפלו על עיניו; וכדי שיעקב יקבל את הברכות.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן בְּרַשִׁ״י, מִמָּה כָּהוּ עֵינֵי יִצְחָק?", "options": ["מֵעֲשַׁן הָעֲבוֹדָה זָרָה שֶׁל נְשֵׁי עֵשָׂו", "מִזִּקְנָה מוּפְלֶגֶת וּמֵחוּלְשַׁת הַגּוּף", "מִבֶּכִי רַב עַל צַעַר בָּנָיו"], "kasha": "הפסוק אינו מפרש מה גרם לעיני יצחק לכהות.", "answer": "בעשנן של אלו – מעשן הקטורת שהקטירו נשי עשו לעבודה זרה.", "kp": ["בעשנן של אלו"]}, {"q": "מָה קָרָה בִּשְׁעַת הָעֲקֵידָה שֶׁגָּרַם לִכְהוֹת עֵינֵי יִצְחָק?", "options": ["דִּמְעוֹת מַלְאֲכֵי הַשָּׁרֵת נָפְלוּ עַל עֵינָיו", "אוֹר גָּדוֹל מִן הַשָּׁמַיִם סִינְוֵור אֶת עֵינָיו", "עֲשַׁן הָעֵצִים שֶׁעַל הַמִּזְבֵּחַ נִכְנַס לְעֵינָיו"], "kasha": "הפסוק אינו מפרש מה גרם לעיני יצחק לכהות.", "answer": "כשאביו רצה לשחטו נפתחו השמים, מלאכי השרת ראו ובכו, ודמעותיהם נפלו על עיניו.", "kp": ["וראו מלאכי השרת והיו בוכים", "וירדו דמעותיהם ונפלו על עיניו"]}]}, {"id": "27:2.1", "ch": 27, "v": 2, "n": 1, "dh": "לא ידעתי יום מותי", "pasuk_html": "וַיֹּ֕אמֶר הִנֵּה־נָ֖א זָקַ֑נְתִּי <mark>לֹ֥א יָדַ֖עְתִּי י֥וֹם מוֹתִֽי׃</mark>", "pasuk_en": "וַיֹּאמֶר הִנֵּה־נָא זָקַנְתִּי וְלֹא־יָדַעְתִּי יוֹם מוֹתִי.", "rashi_he": "לא ידעתי יום מותי. אָמַר רַבִּי יְהוֹשֻׁעַ בֶּן קָרְחָה אִם מַגִּיעַ אָדָם לְפֶרֶק אֲבוֹתָיו יִדְאַג חָמֵשׁ שָׁנִים לִפְנֵיהֶן וְחָמֵשׁ לְאַחַר כֵּן; וְיִצְחָק הָיָה בֶּן קכ\"ג, אָמַר שֶׁמָּא לְפֶרֶק אִמִּי אֲנִי מַגִּיעַ וְהִיא מֵתָה בַּת קכ\"ז וַהֲרֵינִי בֶן ה' שָׁנִים סָמוּךְ לְפִרְקָהּ; לְפִיכָךְ לא ידעתי יום מותי, שֶׁמָּא לְפֶרֶק אִמִּי, שֶׁמָּא לְפֶרֶק אַבָּא:", "rashi_en": "אדם שמגיע לגיל שבו מתו הוריו ידאג חמש שנים לפני כן וחמש שנים אחר כך. יצחק היה בן קכ״ג, קרוב בפחות מחמש שנים לגיל שבו מתה אמו (קכ״ז), ולכן לא ידע אם ימות כגיל אמו או כגיל אביו.", "note": "", "points": [{"q": "מַדּוּעַ חָשַׁשׁ יִצְחָק לְמוֹתוֹ כְּשֶׁהָיָה בֶּן מֵאָה עֶשְׂרִים וְשָׁלוֹשׁ?", "options": ["כִּי הִתְקָרֵב לְגִיל שֶׁבּוֹ מֵתָה אִמּוֹ, בַּת מֵאָה עֶשְׂרִים וָשֶׁבַע", "כִּי הִגִּיעַ לְגִיל שֶׁבּוֹ מֵת אָבִיו אַבְרָהָם", "כִּי חָלָה וְהִרְגִּישׁ שֶׁכּוֹחוֹתָיו הוֹלְכִים וּפוֹחֲתִים"], "kasha": "יצחק לא היה חולה, ומדוע אמר “לא ידעתי יום מותי”?", "answer": "אדם המגיע לפרק אבותיו ידאג חמש שנים לפניהן; יצחק היה בן קכ״ג ואמו מתה בת קכ״ז, ולכן לא ידע אם ימות כגיל אמו או כגיל אביו.", "kp": ["שמא לפרק אמי אני מגיע", "והיא מתה בת קכ\"ז"]}]}, {"id": "27:3.1", "ch": 27, "v": 3, "n": 1, "dh": "שא נא", "pasuk_html": "וְעַתָּה֙ <mark>שָׂא־נָ֣א</mark> כֵלֶ֔יךָ תֶּלְיְךָ֖ וְקַשְׁתֶּ֑ךָ וְצֵא֙ הַשָּׂדֶ֔ה וְצ֥וּדָה לִּ֖י (צידה) [צָֽיִד]׃", "pasuk_en": "שָׂא נָא אֶת־כְּלִיךָ אֶת־אַשְׁפָּתְךָ וְאֶת־קַשְׁתְּךָ וְצֵא הַשָּׂדֶה וְצוּד לִי צָיִד.", "rashi_he": "שא נא. לְשׁוֹן הַשְׁחָזָה, כְּאוֹתָהּ שֶׁשָּׁנִינוּ אֵין מַשְׁחִיזִין אֶת הַסַּכִּין, אֲבָל מַשִּׂיאָהּ עַל גַּבֵּי חֲבֶרְתָּהּ (ביצה כ\"ח), חַדֵּד סַכִּינְךָ וּשְׁחֹט יָפֶה, שֶׁלֹּא תַאֲכִילֵנִי נְבֵלָה (בראשית רבה):", "rashi_en": "“שא” הוא לשון השחזה, כמו במשנה “משיאה על גבי חברתה”. יצחק אמר לעשו: חדד את סכינך ושחט כראוי, שלא תאכילני נבלה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ “שָׂא־נָא כֵלֶיךָ”?", "options": ["חַדֵּד אֶת סַכִּינְךָ", "הָרֵם אֶת כְּלֵי הַצַּיִד שֶׁלְּךָ", "קַח אֶת כֵּלֶיךָ מִן הַבַּיִת"], "kasha": "מדוע צריך לומר לעשו “שא” את כליו, הרי ממילא לוקח אותם לציד?", "answer": "לשון השחזה, כמו “משיאה על גבי חברתה” – חדד סכינך.", "kp": ["לשון השחזה", "חדד סכינך"]}, {"q": "מַדּוּעַ הִקְפִּיד יִצְחָק שֶׁעֵשָׂו יְחַדֵּד אֶת סַכִּינוֹ?", "options": ["כְּדֵי שֶׁיִּשָּׁחֵט כָּרָאוּי וְלֹא יַאֲכִילֶנּוּ נְבֵלָה", "כְּדֵי שֶׁיּוּכַל לָצוּד חַיּוֹת גְּדוֹלוֹת וַחֲזָקוֹת", "כְּדֵי שֶׁיָּכִין אֶת הַמַּטְעַמִּים בִּמְהִירוּת"], "kasha": "מה איכפת ליצחק במצב הסכין של עשו?", "answer": "חדד סכינך ושחט יפה, שלא תאכילני נבלה.", "kp": ["ושחט יפה", "שלא תאכילני נבלה"]}]}, {"id": "27:3.2", "ch": 27, "v": 3, "n": 2, "dh": "תליך", "pasuk_html": "וְעַתָּה֙ שָׂא־נָ֣א כֵלֶ֔יךָ <mark>תֶּלְיְךָ֖</mark> וְקַשְׁתֶּ֑ךָ וְצֵא֙ הַשָּׂדֶ֔ה וְצ֥וּדָה לִּ֖י (צידה) [צָֽיִד]׃", "pasuk_en": "קַח אֶת־כְּלֵיךָ, אֶת־אַשְׁפַּתְךָ וְקַשְׁתְּךָ, וְצֵא הַשָּׂדֶה וְצוּד לִי צָיִד.", "rashi_he": "תליך. חַרְבְּךָ שֶׁדֶּרֶךְ לִתְלוֹתָהּ:", "rashi_en": "“תליך” היא החרב, שדרך לתלות אותה בצד הגוף.", "note": "", "points": [{"q": "מַהוּ “תֶּלְיְךָ”, וּמַדּוּעַ הוּא נִקְרָא כָּךְ?", "options": ["חַרְבּוֹ שֶׁל עֵשָׂו, שֶׁדֶּרֶךְ לִתְלוֹת אוֹתָהּ", "אַשְׁפַּת הַחִצִּים, שֶׁתּוֹלִים אוֹתָהּ עַל הַכָּתֵף", "הָרֶשֶׁת שֶׁבָּהּ תּוֹלִים אֶת הַצַּיִד שֶׁנִּלְכַּד"], "kasha": "המילה “תליך” אינה מוכרת, ולא ברור לאיזה כלי היא מכוונת.", "answer": "חרבך, שדרך לתלותה.", "kp": ["חרבך שדרך לתלותה"]}]}, {"id": "27:3.3", "ch": 27, "v": 3, "n": 3, "dh": "וצודה לי", "pasuk_html": "וְעַתָּה֙ שָׂא־נָ֣א כֵלֶ֔יךָ תֶּלְיְךָ֖ וְקַשְׁתֶּ֑ךָ וְצֵא֙ הַשָּׂדֶ֔ה <mark>וְצ֥וּדָה לִּ֖י</mark> (צידה) [צָֽיִד]׃", "pasuk_en": "קַח אֶת־כְּלֵיךָ, אֶת־אַשְׁפַּתְךָ וְקַשְׁתְּךָ, וְצֵא הַשָּׂדֶה וְצוּד לִי צָיִד.", "rashi_he": "וצודה לי. מִן הַהֶפְקֵר וְלֹא מִן הַגֶּזֶל:", "rashi_en": "יצחק ביקש שעשו יצוד מן ההפקר, ולא יביא בשר גזול.", "note": "", "points": [{"q": "מָה בִּיקֵּשׁ יִצְחָק לְהַדְגִּישׁ בְּאָמְרוֹ “וְצוּדָה לִּי”?", "options": ["שֶׁיָּצוּד מִן הַהֶפְקֵר וְלֹא מִן הַגָּזֵל", "שֶׁיָּצוּד רַק בִּשְׁבִילוֹ וְלֹא בִּשְׁבִיל אֲחֵרִים", "שֶׁיָּצוּד בְּעַצְמוֹ וְלֹא יִשְׁלַח אֶת עֲבָדָיו"], "kasha": "כבר נאמר “וצא השדה”, ומה מוסיף “וצודה לי”?", "answer": "מן ההפקר ולא מן הגזל.", "kp": ["מן ההפקר ולא מן הגזל"]}]}, {"id": "27:5.1", "ch": 27, "v": 5, "n": 1, "dh": "לצוד ציד להביא", "pasuk_html": "וְרִבְקָ֣ה שֹׁמַ֔עַת בְּדַבֵּ֣ר יִצְחָ֔ק אֶל־עֵשָׂ֖ו בְּנ֑וֹ וַיֵּ֤לֶךְ עֵשָׂו֙ הַשָּׂדֶ֔ה <mark>לָצ֥וּד צַ֖יִד לְהָבִֽיא׃</mark>", "pasuk_en": "וְרִבְקָה שׁוֹמַעַת בִּדְבַר־יִצְחָק אֶל־עֵשָׂו בְנוֹ. וַיֵּלֶךְ עֵשָׂו הַשָּׂדֶה לִצְדּוֹת צָיִד לְהָבִיא.", "rashi_he": "לצוד ציד להביא. מַהוּ לְהָבִיא? אִם לֹא יִמְצָא צַיִד יָבִיא מִן הַגֶּזֶל:", "rashi_en": "המילה “להביא” נראית מיותרת, והיא מלמדת שעשו התכוון: אם לא ימצא ציד – יביא מן הגזל.", "note": "", "points": [{"q": "מָה מְלַמֶּדֶת הַמִּילָה “לְהָבִיא” שֶׁאַחֲרֵי “לָצוּד צַיִד”?", "options": ["שֶׁאִם לֹא יִמְצָא צַיִד, יָבִיא מִן הַגֶּזֶל", "שֶׁמִּיהֵר לְהָבִיא אֶת הַצַּיִד לִפְנֵי מוֹת אָבִיו", "שֶׁהִתְכַּווֵּן לְהָבִיא אֶת הַצַּיִד בְּעַצְמוֹ וְלֹא בִּידֵי אַחֵר"], "kasha": "אחרי “לצוד ציד” המילה “להביא” נראית מיותרת.", "answer": "אם לא ימצא ציד, יביא מן הגזל.", "kp": ["אם לא ימצא ציד", "יביא מן הגזל"]}]}, {"id": "27:7.1", "ch": 27, "v": 7, "n": 1, "dh": "לפני ה'", "pasuk_html": "הָבִ֨יאָה לִּ֥י צַ֛יִד וַעֲשֵׂה־לִ֥י מַטְעַמִּ֖ים וְאֹכֵ֑לָה וַאֲבָרֶכְכָ֛ה <mark>לִפְנֵ֥י יְהֹוָ֖ה</mark> לִפְנֵ֥י מוֹתִֽי׃", "pasuk_en": "הָבִיא־לִּי צָיִד וַעֲשֵׂה־לִּי מַטְעַמִּים וְאֹכְלָה, בַּעֲבוּר תְּבָרֶכְךָ נַפְשִׁי לִפְנֵי־ה׳ בְּטֶרֶם אָמוּת.", "rashi_he": "לפני ה'. בִּרְשׁוּתוֹ, שֶׁיַּסְכִּים עַל יָדִי:", "rashi_en": "“לפני ה׳” פירושו ברשות ה׳ – שה׳ יסכים לברכה שיצחק מברך.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ “וַאֲבָרֶכְכָה לִפְנֵי ה׳”?", "options": ["בִּרְשׁוּת ה׳, שֶׁיַּסְכִּים לַבְּרָכָה שֶׁאֶתֵּן", "בְּמָקוֹם קָדוֹשׁ, לִפְנֵי הַמִּזְבֵּחַ", "בִּתְפִילָּה שֶׁה׳ יְבָרֵךְ אוֹתְךָ בִּמְקוֹמִי"], "kasha": "מה משמעות “לפני ה׳” בברכה שיצחק מברך את בנו?", "answer": "ברשותו – שיסכים על ידי.", "kp": ["ברשותו, שיסכים על ידי"]}]}, {"id": "27:9.1", "ch": 27, "v": 9, "n": 1, "dh": "וקח לי", "pasuk_html": "לֶךְ־נָא֙ אֶל־הַצֹּ֔אן <mark>וְקַֽח־לִ֣י</mark> מִשָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְאֶֽעֱשֶׂ֨ה אֹתָ֧ם מַטְעַמִּ֛ים לְאָבִ֖יךָ כַּאֲשֶׁ֥ר אָהֵֽב׃", "pasuk_en": "לֵךְ־נָא אֶל־הַצּוֹאן וְקַח־לִּי מִשָּׁם שְׁנֵי גְּדָיֵי עִזִּים טוֹבִים, וְאַעֲשֶׂה אוֹתָם מַטְעַמִּים לְאָבִיךָ כַּאֲשֶׁר אָהֵב.", "rashi_he": "וקח לי. מִשֶּׁלִּי הֵם וְאֵינָם גֶּזֶל, שֶׁכָּךְ כָּתַב לָהּ יִצְחָק בִּכְתֻבָּתָהּ לִטֹּל שְׁנֵי גְּדָיֵי עִזִּים בְּכָל יוֹם (בראשית רבה):", "rashi_en": "“לי” – משלי. הגדיים היו של רבקה ולא גזל, שכך כתב לה יצחק בכתובתה: ליטול שני גדיי עזים בכל יום.", "note": "", "points": [{"q": "מַדּוּעַ אָמְרָה רִבְקָה “וְקַח־לִי”?", "options": ["כִּי הַגְּדָיִים הָיוּ שֶׁלָּהּ לְפִי כְּתוּבָּתָהּ, וְאֵינָם גֶּזֶל", "כִּי רָצְתָה לְהָכִין בְּעַצְמָהּ אֶת הַמַּטְעַמִּים", "כִּי חָשְׁשָׁה שֶׁיַּעֲקֹב יִיקַּח מִן הַצֹּאן בְּלִי רְשׁוּת"], "kasha": "המטעמים נועדו ליצחק, ולמה אמרה רבקה “קח לי”?", "answer": "משלי הם ואינם גזל – שיצחק כתב לה בכתובתה ליטול שני גדיי עזים בכל יום.", "kp": ["משלי הם ואינם גזל", "שכך כתב לה יצחק בכתבתה"]}]}, {"id": "27:9.2", "ch": 27, "v": 9, "n": 2, "dh": "שני גדיי עזים", "pasuk_html": "לֶךְ־נָא֙ אֶל־הַצֹּ֔אן וְקַֽח־לִ֣י מִשָּׁ֗ם <mark>שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים</mark> טֹבִ֑ים וְאֶֽעֱשֶׂ֨ה אֹתָ֧ם מַטְעַמִּ֛ים לְאָבִ֖יךָ כַּאֲשֶׁ֥ר אָהֵֽב׃", "pasuk_en": "לך אל הצאן וקח לי משם שני גדיי עזים טובים ואעשה אותם מטעמים לאביך כאשר הוא אוהב.", "rashi_he": "שני גדיי עזים. וְכִי שְׁנֵי גְּדָיֵי עִזִּים הָיָה מַאֲכָל שֶׁל יִצְחָק? אֶלָּא הָאֶחָד הִקְרִיב לְפִסְחוֹ וְהָאֶחָד עָשָׂה מַטְעַמִּים; בְּפִרְקֵי רַבִּי אֱלִיעֶזֶר:", "rashi_en": "וכי יצחק אכל שני גדיים בסעודה אחת? אלא היה זה פסח: את האחד הקריב לקרבן פסח, ומן השני עשה מטעמים.", "note": "", "points": [{"q": "מַדּוּעַ נִצְרְכוּ שְׁנֵי גְּדָיֵי עִזִּים?", "options": ["אֶחָד לְקָרְבַּן פֶּסַח, וְאֶחָד לְמַטְעַמִּים", "אֶחָד לְיִצְחָק, וְאֶחָד לְיַעֲקֹב שֶׁיֹּאכַל עִמּוֹ", "כְּדֵי לְהַלְבִּישׁ אֶת עוֹרוֹת שְׁנֵיהֶם עַל יַעֲקֹב"], "kasha": "וכי שני גדיי עזים היו מאכל של יצחק?", "answer": "האחד הקריב לפסחו, והאחד עשה ממנו מטעמים.", "kp": ["האחד הקריב לפסחו", "והאחד עשה מטעמים"]}]}, {"id": "27:9.3", "ch": 27, "v": 9, "n": 3, "dh": "כאשר אהב", "pasuk_html": "לֶךְ־נָא֙ אֶל־הַצֹּ֔אן וְקַֽח־לִ֣י מִשָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְאֶֽעֱשֶׂ֨ה אֹתָ֧ם מַטְעַמִּ֛ים לְאָבִ֖יךָ <mark>כַּאֲשֶׁ֥ר אָהֵֽב׃</mark>", "pasuk_en": "לך אל הצאן וקח לי משם שני גדיי עזים טובים ואעשה אותם מטעמים לאביך כאשר הוא אוהב.", "rashi_he": "כאשר אהב. כִּי טַעַם הַגְּדִי כְּטַעַם הַצְּבִי:", "rashi_en": "רבקה יכלה להכין מגדי מטעמים “כאשר אהב” יצחק, כי טעם הגדי כטעם הצבי.", "note": "", "points": [{"q": "כֵּיצַד יָכְלָה רִבְקָה לְהָכִין מַגְדֵּי מַטְעַמִּים “כַּאֲשֶׁר אָהֵב” יִצְחָק?", "options": ["כִּי טַעַם הַגְּדִי דּוֹמֶה לְטַעַם הַצְּבִי", "כִּי יִצְחָק אָהַב גְּדָיִים יוֹתֵר מִבְּשַׂר צַיִד", "כִּי תַּבְלִינִים מְיוּחָדִים הִסְתִּירוּ אֶת טַעַם הַגְּדִי"], "kasha": "יצחק אהב בשר ציד, ואיך יהיה הגדי “כאשר אהב”?", "answer": "כי טעם הגדי כטעם הצבי.", "kp": ["כי טעם הגדי כטעם הצבי"]}]}, {"id": "27:11.1", "ch": 27, "v": 11, "n": 1, "dh": "איש שעיר", "pasuk_html": "וַיֹּ֣אמֶר יַעֲקֹ֔ב אֶל־רִבְקָ֖ה אִמּ֑וֹ הֵ֣ן עֵשָׂ֤ו אָחִי֙ <mark>אִ֣ישׁ שָׂעִ֔ר</mark> וְאָנֹכִ֖י אִ֥ישׁ חָלָֽק׃", "pasuk_en": "ויאמר יעקב אל רבקה אמו הן עשו אחי איש שער ואני איש חלק.", "rashi_he": "איש שעיר. בַּעַל שֵׂעָר:", "rashi_en": "“איש שער” פירושו אדם בעל שער, ששיער רב על גופו.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ “אִישׁ שָׂעִר”?", "options": ["אָדָם שֶׁיֵּשׁ לוֹ שֵׂיעָר רַב עַל גּוּפוֹ", "אָדָם שֶׁיּוֹשֵׁב בְּשַׁעַר הָעִיר", "אָדָם שֶׁבָּא מֵאֶרֶץ שֵׂעִיר"], "kasha": "הצירוף “איש שער” יכול להתפרש בכמה אופנים.", "answer": "בעל שער.", "kp": ["בעל שער"]}]}, {"id": "27:12.1", "ch": 27, "v": 12, "n": 1, "dh": "ימשני", "pasuk_html": "אוּלַ֤י <mark>יְמֻשֵּׁ֙נִי֙</mark> אָבִ֔י וְהָיִ֥יתִי בְעֵינָ֖יו כִּמְתַעְתֵּ֑עַ וְהֵבֵאתִ֥י עָלַ֛י קְלָלָ֖ה וְלֹ֥א בְרָכָֽה׃", "pasuk_en": "אולי יימשני אבי והייתי בעיניו כמתעתע והבאתי עליי קללה ולא ברכה.", "rashi_he": "ימשני. כְּמוֹ מְמַשֵּׁשׁ בַּצָּהֳרַיִם:", "rashi_en": "“ימשני” הוא מלשון מישוש, כמו “ממשש בצהרים” – יעקב חשש שאביו ימשש אותו בידיו.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ “יְמֻשֵּׁנִי”?", "options": ["יְמַשֵּׁשׁ אוֹתִי בְּיָדָיו, כְּמוֹ “מְמַשֵּׁשׁ בַּצָּהֳרַיִם”", "יִמְשׁוֹךְ אוֹתִי אֵלָיו בְּכוֹחַ", "יִבְחַן אוֹתִי בִּשְׁאֵלוֹת וְיִגְלֶה מִי אֲנִי"], "kasha": "המילה “ימשני” אינה רגילה, ולא ברור מה פירושה.", "answer": "לשון מישוש, כמו “ממשש בצהרים”.", "kp": ["ימשני", "כמו ממשש בצהרים"]}]}, {"id": "27:15.1", "ch": 27, "v": 15, "n": 1, "dh": "החמדות", "pasuk_html": "וַתִּקַּ֣ח רִ֠בְקָ֠ה אֶת־בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤הּ הַגָּדֹל֙ <mark>הַחֲמֻדֹ֔ת</mark> אֲשֶׁ֥ר אִתָּ֖הּ בַּבָּ֑יִת וַתַּלְבֵּ֥שׁ אֶֽת־יַעֲקֹ֖ב בְּנָ֥הּ הַקָּטָֽן׃", "pasuk_en": "ותקח רבקה את בגדי עשו בנה הגדול החמדות אשר אתה בבית ותלבש את יעקב בנה הקטן.", "rashi_he": "החמדת. הַנְּקִיּוֹת, כְּתַרְגּוּמוֹ דָּכְיָתָא, דָּ\"אַ שֶׁחָמַד אוֹתָן מִן נִמְרוֹד:", "rashi_en": "“החמדת” הם הבגדים הנקיים, כתרגום אונקלוס “דכיתא”. דבר אחר: נקראו כך משום שעשו חמד אותם מנמרוד.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן בְּרַשִׁ״י, מַה הֵם בִּגְדֵי עֵשָׂו “הַחֲמֻדֹת”?", "options": ["הַבְּגָדִים הַנְּקִיִּים, כְּתַרְגּוּמוֹ “דְּכִיתָא”", "הַבְּגָדִים הַחֲדָשִׁים שֶׁלֹּא לָבַשׁ מֵעוֹלָם", "הַבְּגָדִים הַמְיוּחָדִים לְצַיִד בַּשָּׂדֶה"], "kasha": "לא ברור מה פירוש התואר “החמדת” לבגדים.", "answer": "הנקיות, כתרגומו “דכיתא”.", "kp": ["הנקיות, כתרגומו דכיתא"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי, מַדּוּעַ נִקְרְאוּ הַבְּגָדִים “הַחֲמֻדֹת”?", "options": ["כִּי עֵשָׂו חָמַד אוֹתָם מִנִּמְרוֹד", "כִּי יִצְחָק חָמַד אוֹתָם וּנְתָנָם לְעֵשָׂו", "כִּי הָיוּ מְשׁוּבָּצִים זָהָב וַאֲבָנִים יְקָרוֹת"], "kasha": "לא ברור מה פירוש התואר “החמדת” לבגדים.", "answer": "שחמד אותן מן נמרוד.", "kp": ["שחמד אותן מן נמרוד"]}]}, {"id": "27:15.2", "ch": 27, "v": 15, "n": 2, "dh": "אשר אתה בבית", "pasuk_html": "וַתִּקַּ֣ח רִ֠בְקָ֠ה אֶת־בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤הּ הַגָּדֹל֙ הַחֲמֻדֹ֔ת <mark>אֲשֶׁ֥ר אִתָּ֖הּ בַּבָּ֑יִת</mark> וַתַּלְבֵּ֥שׁ אֶֽת־יַעֲקֹ֖ב בְּנָ֥הּ הַקָּטָֽן׃", "pasuk_en": "וַתִּקַּח רִבְקָה אֶת־בִּגְדֵי עֵשָׂו בְנָהּ הַגָּדוֹל הַחֲמֻדוֹת אֲשֶׁר אִתָּהּ בַּבָּיִת וַתַּלְבֵּשׁ אֶת־יַעֲקֹב בְנָהּ הַקָּטָן.", "rashi_he": "אשר אתה בבית. וַהֲלֹא כַמָּה נָשִׁים הָיוּ לוֹ, וְהוּא מַפְקִיד אֵצֶל אִמּוֹ? אֶלָּא שֶׁהָיָה בָקִי בְמַעֲשֵׂיהֶן וְחוֹשְׁדָן:", "rashi_en": "לעשו היו כמה נשים, ובכל זאת הפקיד את בגדיו אצל אמו – משום שהכיר את מעשיהן וחשד בהן.", "note": "", "points": [{"q": "מַדּוּעַ הָיוּ בִּגְדֵי עֵשָׂו אֵצֶל רִבְקָה וְלֹא אֵצֶל נְשׁוֹתָיו?", "options": ["כִּי הִכִּיר אֶת מַעֲשֵׂי נְשׁוֹתָיו וְחָשַׁד בָּהֶן", "כִּי לֹא הָיָה לוֹ בַּיִת מִשֶּׁלּוֹ, וְגָר אֵצֶל הוֹרָיו", "כִּי רִבְקָה בִּיקְּשָׁה לִשְׁמוֹר עֲלֵיהֶם בְּעַצְמָהּ"], "kasha": "הרי היו לעשו כמה נשים, ולמה הפקיד את בגדיו אצל אמו?", "answer": "שהיה בקי במעשיהן וחושדן.", "kp": ["שהיה בקי במעשיהן", "וחושדן"]}]}, {"id": "27:19.1", "ch": 27, "v": 19, "n": 1, "dh": "אנכי עשו בכורך", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־אָבִ֗יו <mark>אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔ךָ</mark> עָשִׂ֕יתִי כַּאֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑י קֽוּם־נָ֣א שְׁבָ֗ה וְאׇכְלָה֙ מִצֵּידִ֔י בַּעֲב֖וּר תְּבָרְכַ֥נִּי נַפְשֶֽׁךָ׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו אָנֹכִי עֵשָׂו בִּכְרְךָ עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי קוּם־נָא שְׁבָה וְאֵכְלָה מִצֵּידִי בַּעֲבוּר תְּבָרֲכַנִּי נַפְשְׁךָ.", "rashi_he": "אנכי עשו בכורך. אָנֹכִי הַמֵּבִיא לְךָ וְעֵשָׂו הוּא בְּכוֹרֶךָ:", "rashi_en": "יעקב לא אמר שקר: “אנכי” – אני הוא המביא לך, ו“עשו” – הוא בכורך.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת דִּבְרֵי יַעֲקֹב “אָנֹכִי עֵשָׂו בְּכֹרֶךָ”?", "options": ["“אָנֹכִי” הַמֵּבִיא לְךָ, וְ“עֵשָׂו” הוּא בְּכוֹרֶךָ", "אֲנִי עֵשָׂו, כִּי קָנִיתִי מִמֶּנּוּ אֶת הַבְּכוֹרָה", "אֲנִי כְּמוֹ עֵשָׂו, שֶׁעָשִׂיתִי כְּמִצְוָוֹתְךָ"], "kasha": "איך אמר יעקב לאביו דבר שקר?", "answer": "אנכי המביא לך, ועשו הוא בכורך.", "kp": ["אנכי המביא לך", "ועשו הוא בכורך"]}]}, {"id": "27:19.2", "ch": 27, "v": 19, "n": 2, "dh": "עשיתי", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־אָבִ֗יו אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔ךָ <mark>עָשִׂ֕יתִי</mark> כַּאֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑י קֽוּם־נָ֣א שְׁבָ֗ה וְאׇכְלָה֙ מִצֵּידִ֔י בַּעֲב֖וּר תְּבָרְכַ֥נִּי נַפְשֶֽׁךָ׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו אָנֹכִי עֵשָׂו בִּכְרְךָ עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי קוּם־נָא שְׁבָה וְאֵכְלָה מִצֵּידִי בַּעֲבוּר תְּבָרֲכַנִּי נַפְשְׁךָ.", "rashi_he": "עשיתי. כַמָּה דְבָרִים כַּאֲשֶׁר דִּבַּרְתָּ אֵלַי:", "rashi_en": "יעקב אמר ״עשיתי כאשר דברת אלי״, וכוונתו: עשיתי כמה וכמה דברים כפי שדיברת אליי.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, לָמָּה הִתְכַּוֵּון יַעֲקֹב בְּאָומְרוֹ ״עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי״?", "options": ["עָשִׂיתִי כַּמָּה דְּבָרִים כְּפִי שֶׁדִּיבַּרְתָּ אֵלַיי", "הֵכַנְתִּי אֶת הַמַּטְעַמִּים בְּדִיּוּק כְּפִי שֶׁבִּיקַּשְׁתָּ", "צַדְתִּי צַיִד בַּשָּׂדֶה כְּפִי שֶׁצִּיווִּיתָ עָלַיי"], "kasha": "יעקב לא צד ציד כפי שביקש יצחק מעשו, ואיך אמר ״עשיתי כאשר דברת אלי״?", "answer": "״עשיתי״ פירושו: עשיתי כמה דברים כפי שדיברת אליי, ולא דווקא את הציד.", "kp": ["כמה דברים כאשר דברת אלי"]}]}, {"id": "27:19.3", "ch": 27, "v": 19, "n": 3, "dh": "שבה", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־אָבִ֗יו אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔ךָ עָשִׂ֕יתִי כַּאֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑י קֽוּם־נָ֣א <mark>שְׁבָ֗ה</mark> וְאׇכְלָה֙ מִצֵּידִ֔י בַּעֲב֖וּר תְּבָרְכַ֥נִּי נַפְשֶֽׁךָ׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו אָנֹכִי עֵשָׂו בִּכְרְךָ עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי קוּם־נָא שְׁבָה וְאֵכְלָה מִצֵּידִי בַּעֲבוּר תְּבָרֲכַנִּי נַפְשְׁךָ.", "rashi_he": "שבה. לְשׁוֹן מֵסֵב עַל הַשֻּׁלְחָן, לְכָךְ מְתֻרְגָּם אִסְתָּחַר:", "rashi_en": "״שבה״ כאן פירושו הסב ליד השולחן לסעודה, ולכן אונקלוס מתרגם ״אסתחר״, מלשון סיבוב.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״קוּם־נָא שְׁבָה״ לְפִי רש״י?", "options": ["הֵסֵב לְיַד הַשּׁוּלְחָן לִסְעוּדָה", "שׁוּב אֵלַיי מִמְּקוֹם הַצַּיִד", "שֵׁב בְּשֶׁקֶט וְאַל תְּדַבֵּר"], "kasha": "מדוע מתרגם אונקלוס ״שבה״ במילה ״אסתחר״ ולא בלשון ישיבה רגילה?", "answer": "״שבה״ הוא לשון מסב על השולחן, ולכן תרגומו ״אסתחר״, לשון סיבוב.", "kp": ["לשון מסב על השלחן"]}]}, {"id": "27:21.1", "ch": 27, "v": 21, "n": 1, "dh": "גשה נא ואמשך", "pasuk_html": "וַיֹּ֤אמֶר יִצְחָק֙ אֶֽל־יַעֲקֹ֔ב <mark>גְּשָׁה־נָּ֥א וַאֲמֻֽשְׁךָ֖</mark> בְּנִ֑י הַֽאַתָּ֥ה זֶ֛ה בְּנִ֥י עֵשָׂ֖ו אִם־לֹֽא׃", "pasuk_en": "וַיֹּאמֶר יִצְחָק אֶל־יַעֲקֹב גְּשָׁה־נָּא וַאֲמוּשְׁךָ בְנִי הַאַתָּה זֶה בְנִי עֵשָׂו אִם־לֹא.", "rashi_he": "גשה נא ואמשך. אָמַר יִצְחָק בְּלִבּוֹ אֵין דֶּרֶךְ עֵשָׂו לִהְיוֹת שֵׁם שָׁמַיִם שָׁגוּר בְּפִיו, וְזֶה אָמַר כִּי הִקְרָה ה' אֱלֹהֶיךָ:", "rashi_en": "יצחק חשד בלבו, כי אין דרכו של עשו להזכיר שם שמים, וזה אמר ״כי הקרה ה׳ אלהיך״. לכן ביקש למשש אותו.", "note": "", "points": [{"q": "מַדּוּעַ בִּיקֵּשׁ יִצְחָק לְמַשֵּׁשׁ אֶת בְּנוֹ?", "options": ["כִּי הִזְכִּיר שֵׁם שָׁמַיִם, וְאֵין זֶה מִדַּרְכּוֹ שֶׁל עֵשָׂו", "כִּי קוֹלוֹ נִשְׁמַע לוֹ צָעִיר מִקּוֹלוֹ שֶׁל עֵשָׂו", "כִּי חָזַר מִן הַצַּיִד מַהֵר מִדַּי מִמָּה שֶׁצִּיפָּה"], "kasha": "מה עורר את חשדו של יצחק עד שביקש למשש את בנו?", "answer": "יצחק אמר בלבו: אין דרכו של עשו ששם שמים יהיה שגור בפיו, וזה אמר ״כי הקרה ה׳ אלהיך״.", "kp": ["אין דרך עשו להיות", "שם שמים שגור בפיו"]}]}, {"id": "27:22.1", "ch": 27, "v": 22, "n": 1, "dh": "קול יעקב", "pasuk_html": "וַיִּגַּ֧שׁ יַעֲקֹ֛ב אֶל־יִצְחָ֥ק אָבִ֖יו וַיְמֻשֵּׁ֑הוּ וַיֹּ֗אמֶר הַקֹּל֙ <mark>ק֣וֹל יַעֲקֹ֔ב</mark> וְהַיָּדַ֖יִם יְדֵ֥י עֵשָֽׂו׃", "pasuk_en": "וַיִּגַּשׁ יַעֲקֹב אֶל יִצְחָק אָבִיו, וַיְמֻשֵּׁהוּ, וַיֹּאמֶר הַקּוֹל קוֹל יַעֲקֹב, וְהַיָּדַיִם יְדֵי עֵשָׂו.", "rashi_he": "קול יעקב. שֶׁמְּדַבֵּר בִּלְשׁוֹן תַּחֲנוּנִים קוּם נָא, אֲבָל עֵשָׂו קִנְטוּרְיָא דִּבֵּר יָקֻם אָבִי:", "rashi_en": "יעקב דיבר בלשון תחנונים, ״קום נא״, ואילו עשו מדבר בלשון קשה ותובענית, ״יקם אבי״.", "note": "", "points": [{"q": "מָה הָיָה ״קוֹל יַעֲקֹב״ שֶׁזִּיהָה יִצְחָק?", "options": ["לְשׁוֹן תַּחֲנוּנִים וּבַקָּשָׁה: ״קוּם נָא״", "קוֹל צָעִיר וְדַק מִקּוֹלוֹ שֶׁל עֵשָׂו", "דִּיבּוּר אִיטִּי וְשָׁקֵט מִן הָרָגִיל אֶצְלוֹ"], "kasha": "יעקב התחפש לעשו, ומה בדיוק בדיבורו הסגיר אותו?", "answer": "יעקב מדבר בלשון תחנונים, ״קום נא״, אבל עשו מדבר בלשון קנטור: ״יקם אבי״.", "kp": ["שמדבר בלשון תחנונים קום נא"]}]}, {"id": "27:24.1", "ch": 27, "v": 24, "n": 1, "dh": "ויאמר אני", "pasuk_html": "וַיֹּ֕אמֶר אַתָּ֥ה זֶ֖ה בְּנִ֣י עֵשָׂ֑ו <mark>וַיֹּ֖אמֶר אָֽנִי׃</mark>", "pasuk_en": "וַיֹּאמֶר הַאַתָּה זֶה בְנִי עֵשָׂו, וַיֹּאמֶר אָנִי.", "rashi_he": "ויאמר אני. לֹא אָמַר אֲנִי עֵשָׂו אֶלָּא אָנִי:", "rashi_en": "כשנשאל ״אתה זה בני עשו״, לא אמר יעקב ״אני עשו״ אלא ״אני״ בלבד.", "note": "", "points": [{"q": "מַה בְּדִיּוּק עָנָה יַעֲקֹב כְּשֶׁנִּשְׁאַל ״אַתָּה זֶה בְּנִי עֵשָׂו״?", "options": ["רַק ״אָנִי״, וְלֹא ״אָנִי עֵשָׂו״", "״אָנִי עֵשָׂו בְּכוֹרֶךָ״, כְּמוֹ בַּפַּעַם הַקּוֹדֶמֶת", "לֹא עָנָה דָּבָר, אֶלָּא הִתְקָרֵב אֵלָיו"], "kasha": "מדוע מדגיש הפסוק שיעקב ענה ״אני״ בלבד?", "answer": "יעקב לא אמר ״אני עשו״, אלא ״אני״.", "kp": ["לא אמר אני עשו אלא אני"]}]}, {"id": "27:27.1", "ch": 27, "v": 27, "n": 1, "dh": "וירח את ריח בגדיו", "pasuk_html": "וַיִּגַּשׁ֙ וַיִּשַּׁק־ל֔וֹ <mark>וַיָּ֛רַח אֶת־רֵ֥יחַ בְּגָדָ֖יו</mark> וַֽיְבָרְכֵ֑הוּ וַיֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔י כְּרֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרְכ֖וֹ יְהֹוָֽה׃", "pasuk_en": "וַיִּגַּשׁ וַיִּשַּׁק לוֹ, וַיָּרַח אֶת־רִיחַ בְּגָדָיו וַיְבָרְכֵהוּ, וַיֹּאמֶר, רְאֵה רִיחַ בְּנִי כְּרִיחַ שָׂדֶה אֲשֶׁר בֵּרָכוֹ יְהוָה.", "rashi_he": "וירח וגו'. וַהֲלֹא אֵין רֵיחַ רַע יוֹתֵר מִשֶּׁטֶף הָעִזִּים? אֶלָּא מְלַמֵּד שֶׁנִּכְנְסָה עִמּוֹ רֵיחַ גַּן עֵדֶן;", "rashi_en": "לעורות עזים משוטפים יש ריח רע מאוד, אלא שעם יעקב נכנס ריח גן עדן, ואותו הריח יצחק.", "note": "", "points": [{"q": "אֵיזֶה רֵיחַ הֵרִיחַ יִצְחָק לְפִי רש״י?", "options": ["רֵיחַ גַּן עֵדֶן שֶׁנִּכְנַס עִם יַעֲקֹב", "רֵיחַ עוֹרוֹת הַגְּדָיִים שֶׁעַל יָדָיו", "רֵיחַ הַמַּטְעַמִּים שֶׁהֵכִינָה רִבְקָה"], "kasha": "אין ריח רע יותר מריח עורות עזים משוטפים, ואיך אמר יצחק ״ראה ריח בני״?", "answer": "הפסוק מלמד שנכנס עם יעקב ריח גן עדן.", "kp": ["מלמד שנכנסה עמו ריח גן עדן"]}]}, {"id": "27:27.2", "ch": 27, "v": 27, "n": 2, "dh": "כריח שדה אשר ברכו", "pasuk_html": "וַיִּגַּשׁ֙ וַיִּשַּׁק־ל֔וֹ וַיָּ֛רַח אֶת־רֵ֥יחַ בְּגָדָ֖יו וַֽיְבָרְכֵ֑הוּ וַיֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔י <mark>כְּרֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרְכ֖וֹ</mark> יְהֹוָֽה׃", "pasuk_en": "וַיֹּאמֶר רְאֵה רִיחַ בְּנִי כְּרִיחַ שָׂדֶה אֲשֶׁר בֵּרָכוֹ יְהוָה.", "rashi_he": "כריח שדה אשר ברכו ה'. שֶׁנָּתַן בּוֹ רֵיחַ טוֹב וְזֶהוּ שְׂדֵה תַּפּוּחִים, כָּךְ דָּרְשׁוּ רַזִ\"לִ:", "rashi_en": "זהו שדה שה׳ נתן בו ריח טוב, וחז״ל דרשו שהוא שדה תפוחים.", "note": "", "points": [{"q": "מַהוּ ״שָׂדֶה אֲשֶׁר בֵּרְכוֹ ה׳״ לְפִי רַשִׁ״י?", "options": ["שְׂדֵה תַּפּוּחִים שֶׁה׳ נָתַן בּוֹ רֵיחַ טוֹב", "שְׂדֵה חִיטָּה מָלֵא וּמְבוֹרָךְ בִּתְבוּאָה", "שָׂדֶה מִרְעֶה שֶׁבּוֹ רוֹעוֹת הָעִזִּים"], "kasha": "מהו ״שדה אשר ברכו ה׳״, ובמה הוא מבורך?", "answer": "שדה שה׳ נתן בו ריח טוב, וזהו שדה תפוחים, כפי שדרשו חז״ל.", "kp": ["שנתן בו ריח טוב", "וזהו שדה תפוחים"]}]}, {"id": "27:28.1", "ch": 27, "v": 28, "n": 1, "dh": "ויתן לך", "pasuk_html": "<mark>וְיִֽתֶּן־לְךָ֙</mark> הָאֱלֹהִ֔ים מִטַּל֙ הַשָּׁמַ֔יִם וּמִשְׁמַנֵּ֖י הָאָ֑רֶץ וְרֹ֥ב דָּגָ֖ן וְתִירֹֽשׁ׃", "pasuk_en": "וִיתֵן לְךָ אֱלֹהִים, מִטַּל הַשָּׁמַיִם וּמִשְׁמַנֵּי הָאָרֶץ, וְרֹב דָּגָן וְתִירוֹשׁ.", "rashi_he": "ויתן לך. יִתֵּן וְיַחֲזֹר וְיִתֵּן (בראשית רבה). וּלְפִי פְשׁוּטוֹ מוּסָב לְעִנְיָן הָרִאשׁוֹן: רְאֵה רֵיחַ בְּנִי שֶׁנָּתַן לוֹ הַקָּבָּ\"ה כְּרֵיחַ שָׂדֶה וְגוֹ' וְעוֹד יִתֵּן לְךָ מִטַּל הַשָּׁמַיִם וְגוֹ':", "rashi_en": "לפי המדרש: יתן ויחזור ויתן. ולפי הפשט הברכה ממשיכה את הפסוק הקודם: ריח בני, שנתן לו הקב״ה כריח שדה, ועוד יתן לך מטל השמים.", "note": "", "points": [{"q": "מָה דָּרְשׁוּ חז״ל מִן הַמִּילָּה ״וְיִתֶּן־״ שֶׁבִּתְחִילַּת הַבְּרָכָה?", "options": ["יִתֵּן וְיַחֲזוֹר וְיִתֵּן, שׁוּב וָשׁוּב", "יִתֵּן לְךָ וּלְזַרְעֲךָ אַחֲרֶיךָ", "יִתֵּן לְךָ רַק אִם תִּהְיֶה רָאוּי"], "kasha": "מדוע פותחת הברכה בו״ו החיבור, ״ויתן״?", "answer": "לפי המדרש: יתן ויחזור ויתן.", "kp": ["יתן ויחזר ויתן"]}, {"q": "לְפִי הַפְּשָׁט, לָמָּה מִתְחַבֶּרֶת הַמִּילָּה ״וְיִתֶּן־״?", "options": ["לַפָּסוּק הַקּוֹדֵם: נָתַן לוֹ רֵיחַ טוֹב, וְעוֹד יִתֵּן לְךָ", "לַבְּרָכָה שֶׁבֵּירַךְ אַבְרָהָם אֶת יִצְחָק בְּנוֹ", "לְבַקָּשַׁת יִצְחָק מֵעֵשָׂו לְהָבִיא לוֹ צַיִד"], "kasha": "הו״ו ב״ויתן״ מחברת את הברכה לדבר שקדם לה, ולאיזה דבר?", "answer": "לפי פשוטו זה מוסב על העניין הראשון: ראה ריח בני שנתן לו הקב״ה כריח שדה, ועוד יתן לך מטל השמים.", "kp": ["ולפי פשוטו מוסב לענין הראשון", "שנתן לו הקב\"ה כריח שדה", "ועוד יתן לך"]}]}, {"id": "27:28.2", "ch": 27, "v": 28, "n": 2, "dh": "מטל השמים", "pasuk_html": "וְיִֽתֶּן־לְךָ֙ הָאֱלֹהִ֔ים <mark>מִטַּל֙ הַשָּׁמַ֔יִם</mark> וּמִשְׁמַנֵּ֖י הָאָ֑רֶץ וְרֹ֥ב דָּגָ֖ן וְתִירֹֽשׁ׃", "pasuk_en": "יִתֶּן לְךָ אֱלֹהִים מִטַּל הַשָּׁמַיִם וּמִשְׁמַן הָאָרֶץ וְרֹב דָּגָן וְתִירוֹשׁ.", "rashi_he": "מטל השמים. כְּמַשְׁמָעוֹ; וּמִדְרְשֵׁי אַגָּדָה יֵשׁ לְהַרְבֵּה פָנִים:", "rashi_en": "״מטל השמים״ יש לפרש כמשמעו, טל ממש; ויש לו גם מדרשי אגדה לכמה פנים.", "note": "", "points": [{"q": "אֵיךְ מְפָרֵשׁ רַשִׁ״י אֶת ״מִטַּל הַשָּׁמַיִם״ לְפִי הַפְּשָׁט?", "options": ["כְּמַשְׁמָעוֹ, טַל מַמָּשׁ הַיּוֹרֵד מִן הַשָּׁמַיִם", "מָשָׁל לַתּוֹרָה הַיּוֹרֶדֶת מִן הַשָּׁמַיִם", "רֶמֶז לִגְשָׁמִים הַיּוֹרְדִים בְּעוֹנָתָם"], "kasha": "האם ״טל השמים״ כאן הוא טל ממש או רמז לדבר אחר?", "answer": "כמשמעו, טל ממש; ומדרשי אגדה יש לו לכמה פנים.", "kp": ["כמשמעו"]}]}, {"id": "27:28.3", "ch": 27, "v": 28, "n": 3, "dh": "האלהים", "pasuk_html": "וְיִֽתֶּן־לְךָ֙ <mark>הָאֱלֹהִ֔ים</mark> מִטַּל֙ הַשָּׁמַ֔יִם וּמִשְׁמַנֵּ֖י הָאָ֑רֶץ וְרֹ֥ב דָּגָ֖ן וְתִירֹֽשׁ׃", "pasuk_en": "יְשִׁמְרְךָ אֱלוֹהִים מִטַּל הַשָּׁמַיִם וּמִשְׁמַנֵּי הָאָרֶץ וְרֹב דָּגָן וְתִירוֹשׁ", "rashi_he": "האלהים. מַהוּ הָאֱלֹהִים? בַּדִּין; אִם רָאוּי לְךָ יִתֵּן לְךָ וְאִם לָאו לֹא יִתֵּן לְךָ, אֲבָל לְעֵשָׂו אָמַר מִשְׁמַנֵּי הָאָרֶץ יִהְיֶה מוֹשָׁבֶךָ, בֵּין צַדִּיק בֵּין רָשָׁע יִתֵּן לְךָ; וּמִמֶּנּוּ לָמַד שְׁלֹמֹה, כְּשֶׁעָשָׂה הַבַּיִת סִדֵּר תְּפִלָּתוֹ. יִשְׂרָאֵל שֶׁהוּא בַעַל אֱמוּנָה וּמַצְדִּיק עָלָיו אֶת הַדִּין לֹא יִקְרָא עָלֶיךָ תִּגָּר, לְפִיכָךְ וְנָתַתָּ לָאִישׁ בְכָל דְּרָכָיו אֲשֶׁר תֵּדַע אֶת לְבָבוֹ (מלכים א, ח'), אֲבָל נָכְרִי מְחֻסַּר אֲמָנָה, לְפִיכָךְ אָמַר אַתָּה תִּשְׁמַע הַשָּׁמַיִם, וְעָשִׂיתָ כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ הַנָּכְרִי (שם), בֵּין רָאוּי בֵּין שֶׁאֵינוֹ רָאוּי תֵּן לוֹ, כְּדֵי שֶׁלֹּא יִקְרָא עָלֶיךָ תִּגָּר:", "rashi_en": "״האלהים״ הוא מידת הדין: אם תהיה ראוי, יתן לך. לעשו בירך בלי תנאי, בין צדיק בין רשע. מכאן למד שלמה בתפילתו: לישראל לפי דרכיו, ולנכרי בכל מקרה, כדי שלא יקרא תגר.", "note": "", "points": [{"q": "מָה מְלַמֵּד הַשֵּׁם ״הָאֱלֹהִים״ בְּבִרְכַּת יַעֲקֹב?", "options": ["ה׳ יִתֵּן לְךָ בְּדִין, רַק אִם תִּהְיֶה רָאוּי", "ה׳ יִתֵּן לְךָ בְּרַחֲמִים, גַּם אִם לֹא תִהְיֶה רָאוּי", "ה׳ יִתֵּן לְךָ בִּזְכוּת אָבִיךָ וְאִמֶּךָ"], "kasha": "מדוע נאמר בברכה ״האלהים״, שהוא שם מידת הדין?", "answer": "הברכה היא בדין: אם ראוי לך יתן לך, ואם לאו לא יתן לך; אבל לעשו אמר ״משמני הארץ יהיה מושבך״, בין צדיק בין רשע.", "kp": ["בדין; אם ראוי לך", "ואם לאו לא יתן לך"]}, {"q": "מָה לָמַד שְׁלֹמֹה מִבִּרְכַּת יִצְחָק בִּתְפִילָּתוֹ כְּשֶׁבָּנָה אֶת הַמִּקְדָּשׁ?", "options": ["לְיִשְׂרָאֵל בִּיקֵּשׁ לְפִי דְרָכָיו, וְלַנָּכְרִי גַּם אִם אֵינוֹ רָאוּי", "לְנָכְרִי בִּיקֵּשׁ לְפִי דְּרָכָיו, וּלְיִשְׂרָאֵל גַּם אִם אֵינוֹ רָאוּי", "לְכָל אָדָם בִּיקֵּשׁ שֶׁתִּתְקַבֵּל בַּקָּשָׁתוֹ בְּלִי שׁוּם תְּנַאי"], "kasha": "מדוע בתפילת שלמה יש הבדל בין בקשת ישראל לבקשת הנכרי?", "answer": "ישראל, בעל אמונה המצדיק עליו את הדין, לא יקרא תגר, ולכן ״ונתת לאיש בכל דרכיו״; אבל הנכרי מחוסר אמונה, ולכן ״ועשית ככל אשר יקרא אליך הנכרי״, כדי שלא יקרא תגר.", "kp": ["לפיכך ונתת לאיש בכל דרכיו", "בין ראוי בין שאינו ראוי"]}]}, {"id": "27:29.1", "ch": 27, "v": 29, "n": 1, "dh": "בני אמך", "pasuk_html": "יַֽעַבְד֣וּךָ עַמִּ֗ים (וישתחו) [וְיִֽשְׁתַּחֲו֤וּ] לְךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְאַחֶ֔יךָ וְיִשְׁתַּחֲו֥וּ לְךָ֖ <mark>בְּנֵ֣י אִמֶּ֑ךָ</mark> אֹרְרֶ֣יךָ אָר֔וּר וּֽמְבָרְכֶ֖יךָ בָּרֽוּךְ׃", "pasuk_en": "יַעַבְדוּךָ עַמִּים וְתִשְׁתַּחֲווּ לְךָ לְאֻמִּים וֶהְיֵה גְבִיר לְאַחֶיךָ וְיִשְׁתַּחֲווּ לְךָ בְנֵי אִמְּךָ אָרְרִים אֹרְרֶיךָ וּבָרוּךְ בָּרֶכֶיךָ.", "rashi_he": "בני אמך. וְיַעֲקֹב אָמַר לִיהוּדָה בְּנֵי אָבִיךָ, לְפִי שֶׁהָיוּ לוֹ בָנִים מִכַּמָּה אִמָּהוֹת, וְכָאן, שֶׁלֹּא נָשָׂא אֶלָּא אִשָּׁה אַחַת, אוֹמֵר בְּנֵי אִמֶּךָ (בראשית רבה):", "rashi_en": "יעקב אמר ליהודה ״בני אביך״, כי היו לו בנים מכמה אמהות; יצחק, שנשא אישה אחת בלבד, אמר ״בני אמך״.", "note": "", "points": [{"q": "מַדּוּעַ אָמַר יִצְחָק ״בְּנֵי אִמֶּךָ״, וְאִילּוּ יַעֲקֹב אָמַר לִיהוּדָה ״בְּנֵי אָבִיךָ״?", "options": ["כִּי לְיִצְחָק הָיְיתָה אִישָׁה אַחַת בִּלְבַד", "כִּי רִבְקָה הִיא שֶׁדָּאֲגָה לִבְרָכַת יַעֲקֹב", "כִּי עֵשָׂו הָיָה קָרוֹב יוֹתֵר לְאִמּוֹ"], "kasha": "יעקב בירך את יהודה ״ישתחוו לך בני אביך״, ומדוע כאן נאמר ״בני אמך״?", "answer": "ליעקב היו בנים מכמה אמהות, ולכן אמר ״בני אביך״; יצחק לא נשא אלא אישה אחת, ולכן אמר ״בני אמך״.", "kp": ["שלא נשא אלא אשה אחת"]}]}, {"id": "27:29.2", "ch": 27, "v": 29, "n": 2, "dh": "ארריך ארור ומברכיך ברוך", "pasuk_html": "יַֽעַבְד֣וּךָ עַמִּ֗ים (וישתחו) [וְיִֽשְׁתַּחֲו֤וּ] לְךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְאַחֶ֔יךָ וְיִשְׁתַּחֲו֥וּ לְךָ֖ בְּנֵ֣י אִמֶּ֑ךָ <mark>אֹרְרֶ֣יךָ אָר֔וּר וּֽמְבָרְכֶ֖יךָ בָּרֽוּךְ׃</mark>", "pasuk_en": "יִשְׁמְדוּ עַמִּים לָךְ וּלְאֻמִּים יִשְׁתַּחֲווּ לָךְ הֱיֵה־גְבִר עַל־אַחֶיךָ וְיִשְׁתַּחֲווּ לְךָ בְנֵי־אִמֶּךָ אָרוּר אָרְרִיךָ וּמְבָרֵךְ בְּרוּךְ אָתָּה", "rashi_he": "ארריך ארור ומברכיך ברוך. וּבְבִלְעָם הוּא אוֹמֵר מְבָרְכֶיךָ בָרוּךְ וְאֹרְרֶיךָ אָרוּר? הַצַּדִּיקִים תְּחִלָּתָם יִסּוּרִים וְסוֹפָן שַׁלְוָה וְאוֹרְרֵיהֶם וּמְצָעֲרֵיהֶם קוֹדְמִים לִמְבָרְכֵיהֶם, לְפִיכָךְ יִצְחָק הִקְדִּים קִלְלַת אוֹרְרִים לְבִרְכַת מְבָרְכִים; הָרְשָׁעִים תְּחִלָּתָן שַׁלְוָה וְסוֹפָן יִסּוּרִין, לְפִיכָךְ בִּלְעָם הִקְדִּים בְּרָכָה לִקְלָלָה (בראשית רבה):", "rashi_en": "הצדיקים תחילתם ייסורים וסופם שלווה, ולכן יצחק הקדים את קללת האוררים; הרשעים תחילתם שלווה וסופם ייסורים, ולכן בלעם הקדים את הברכה לקללה.", "note": "", "points": [{"q": "מַדּוּעַ הִקְדִּים יִצְחָק ״אֹרְרֶיךָ אָרוּר״ ל״מְבָרְכֶיךָ בָּרוּךְ״, וּבִלְעָם עָשָׂה לְהֵפֶךְ?", "options": ["צַדִּיקִים תְּחִילָּתָם יִיסּוּרִים וְסוֹפָם שַׁלְוָוה, וּרְשָׁעִים לְהֵפֶךְ", "בְּעֵינֵי יִצְחָק הַקְּלָלָה חֲשׁוּבָה יוֹתֵר מִן הַבְּרָכָה", "בִּלְעָם רָצָה לְקַלֵּל אֶת יִשְׂרָאֵל וְלָכֵן הִסְתִּיר אֶת הַקְּלָלָה"], "kasha": "בלעם אמר ״מברכיך ברוך וארריך ארור״, ומדוע אצל יצחק הסדר הפוך?", "answer": "הצדיקים תחילתם ייסורים וסופם שלווה, ואורריהם ומצעריהם קודמים למברכיהם, לכן הקדים יצחק קללה לברכה; הרשעים תחילתם שלווה וסופם ייסורים, לכן הקדים בלעם ברכה לקללה.", "kp": ["הצדיקים תחלתם יסורים וסופן שלוה", "הרשעים תחלתן שלוה וסופן יסורין"]}]}, {"id": "27:30.1", "ch": 27, "v": 30, "n": 1, "dh": "יצא יצא", "pasuk_html": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלָּ֣ה יִצְחָק֮ לְבָרֵ֣ךְ אֶֽת־יַעֲקֹב֒ וַיְהִ֗י אַ֣ךְ <mark>יָצֹ֤א יָצָא֙</mark> יַעֲקֹ֔ב מֵאֵ֥ת פְּנֵ֖י יִצְחָ֣ק אָבִ֑יו וְעֵשָׂ֣ו אָחִ֔יו בָּ֖א מִצֵּידֽוֹ׃", "pasuk_en": "וַיְהִי כַּאֲשֶׁר כִּלָּה יִצְחָק לְבָרֵךְ אֶת יַעֲקֹב וַיְהִי אַךְ יָצָא יָצָא יַעֲקֹב מֵאֶת פְּנֵי יִצְחָק אָבִיו וְעֵשָׂו אָחִיו בָּא מִצֵּידוֹ.", "rashi_he": "יצא יצא. זֶה יוֹצֵא וְזֶה בָא:", "rashi_en": "הכפילות מלמדת שבאותו רגע שיעקב יצא, נכנס עשו.", "note": "", "points": [{"q": "מָה מְלַמֶּדֶת הַכְּפִילוּת ״יָצֹא יָצֹא״?", "options": ["זֶה יָצָא וְזֶה בָּא בְּאוֹתוֹ רֶגַע", "יַעֲקֹב יָצָא בִּבֶהָלָה וּבִמְהִירוּת רַבָּה", "יַעֲקֹב יָצָא פַּעֲמַיִים מִלִּפְנֵי אָבִיו"], "kasha": "מדוע נכפלה המילה ״יצא״?", "answer": "זה יוצא וזה בא.", "kp": ["זה יוצא וזה בא"]}]}, {"id": "27:33.1", "ch": 27, "v": 33, "n": 1, "dh": "ויחרד", "pasuk_html": "<mark>וַיֶּחֱרַ֨ד</mark> יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד־מְאֹד֒ וַיֹּ֡אמֶר מִֽי־אֵפ֡וֹא ה֣וּא הַצָּֽד־צַ֩יִד֩ וַיָּ֨בֵא לִ֜י וָאֹכַ֥ל מִכֹּ֛ל בְּטֶ֥רֶם תָּב֖וֹא וָאֲבָרְכֵ֑הוּ גַּם־בָּר֖וּךְ יִהְיֶֽה׃", "pasuk_en": "וַיִּחְרַד יִצְחָק חֲרָדָה גְדוֹלָה עַד־מְאֹד וַיֹּאמֶר מִי־אִפוֹא צַד־צַיִד וַיָּבֵא לִי וָאֹכַל מִכֹּל בְּטֶרֶם תָּבוֹא וָאֲבָרְכֵהוּ גַּם בָּרוּךְ יִהְיֶה", "rashi_he": "ויחרד. כְּתַרְגּוּמוֹ וּתְוַהּ, לְשׁוֹן תְּמִיהָ. וּמִדְרָשׁוֹ רָאָה גֵּיהִנֹּם פְּתוּחָה מִתַּחְתָּיו:", "rashi_en": "לפי התרגום ״ותוה״, יצחק תמה ונדהם. ולפי המדרש ראה גיהנם פתוחה מתחתיו.", "note": "", "points": [{"q": "לְפִי הַתַּרְגּוּם, מָה פֵּירוּשׁ ״וַיֶּחֱרַד יִצְחָק״?", "options": ["תָּמַהּ וְנִדְהַם, כְּתַרְגּוּמוֹ ״וְתָוַהּ״", "רָעַד מִפַּחַד שֶׁמָּא עֵשָׂו יַהֲרוֹג אוֹתוֹ", "כָּעַס מְאוֹד עַל יַעֲקֹב שֶׁרִימָּה אוֹתוֹ"], "kasha": "מה פירוש החרדה כאן, פחד או דבר אחר?", "answer": "כתרגומו ״ותוה״, לשון תמיהה.", "kp": ["לשון תמיה", "כתרגומו ותוה"]}, {"q": "לְפִי הַמִּדְרָשׁ, מָה גָּרַם לְיִצְחָק לַחֲרוֹד?", "options": ["רָאָה גֵּיהִנֹּם פְּתוּחָה מִתַּחְתָּיו", "רָאָה מַלְאָךְ עוֹמֵד לְפָנָיו", "שָׁמַע אֶת עֵשָׂו בּוֹכֶה בְּקוֹל"], "kasha": "מה גרם ליצחק חרדה ״גדלה עד מאד״?", "answer": "לפי המדרש ראה גיהנם פתוחה מתחתיו.", "kp": ["ראה גיהנם פתוחה מתחתיו"]}]}, {"id": "27:33.2", "ch": 27, "v": 33, "n": 2, "dh": "מי אפוא", "pasuk_html": "וַיֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד־מְאֹד֒ וַיֹּ֡אמֶר <mark>מִֽי־אֵפ֡וֹא</mark> ה֣וּא הַצָּֽד־צַ֩יִד֩ וַיָּ֨בֵא לִ֜י וָאֹכַ֥ל מִכֹּ֛ל בְּטֶ֥רֶם תָּב֖וֹא וָאֲבָרְכֵ֑הוּ גַּם־בָּר֖וּךְ יִהְיֶֽה׃", "pasuk_en": "וַיִּחְרַד יִצְחָק חֲרָדָה גְדוֹלָה מְאֹד וַיֹּאמֶר מִי אֵפוֹא הוּא הַצָּד צַיִד וַיָּבֵא לִי וָאֹכַל מִכֹּל בְּטֶרֶם תָּבוֹא וָאֲבָרְכֵהוּ גַּם בָּרוּךְ יִהְיֶה", "rashi_he": "מי אפוא. לָשׁוֹן לְעַצְמוֹ מְשַׁמֵּשׁ עִם כַּמָּה דְבָרִים; אֵיפֹה – אַיֵּה פֹה, מִי הוּא וְאֵיפֹה הוּא הַצָּד צַיִד?", "rashi_en": "״אפוא״ היא מילה בפני עצמה המשמשת בכמה עניינים. ויש לפרשה ״איה פה״: מי הוא ואיפה הוא זה שצד ציד?", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ ״אַיֵּה פֹּה״, מַה פֵּירוּשׁ ״מִי־אֵפוֹא הוּא הַצָּד־צַיִד״?", "options": ["מִי הוּא וְאֵיפֹה הוּא זֶה שֶׁצָּד צַיִד?", "מִי עַכְשָׁיו יוּכַל לָצוּד לִי צַיִד אַחֵר?", "הַאִם בֶּאֱמֶת אַתָּה הוּא שֶׁצָּדָתָ צַיִד?"], "kasha": "מה משמעות המילה ״אפוא״ בפסוק?", "answer": "״אפוא״ היא מילה בפני עצמה המשמשת בכמה עניינים, ויש לפרשה ״איה פה״: מי הוא ואיפה הוא הצד ציד?", "kp": ["איה פה, מי הוא", "ואיפה הוא הצד ציד"]}]}, {"id": "27:33.3", "ch": 27, "v": 33, "n": 3, "dh": "ואכל מכל", "pasuk_html": "וַיֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד־מְאֹד֒ וַיֹּ֡אמֶר מִֽי־אֵפ֡וֹא ה֣וּא הַצָּֽד־צַ֩יִד֩ וַיָּ֨בֵא לִ֜י <mark>וָאֹכַ֥ל מִכֹּ֛ל</mark> בְּטֶ֥רֶם תָּב֖וֹא וָאֲבָרְכֵ֑הוּ גַּם־בָּר֖וּךְ יִהְיֶֽה׃", "pasuk_en": "וַיִּחְרַד יִצְחָק חֲרָדָה גְדוֹלָה מְאֹד וַיֹּאמֶר מִי אֵפוֹא הוּא הַצָּד צַיִד וַיָּבֵא לִי וָאֹכַל מִכֹּל בְּטֶרֶם תָּבוֹא וָאֲבָרְכֵהוּ גַּם בָּרוּךְ יִהְיֶה", "rashi_he": "ואכל מכל. מִכָּל טְעָמִים שֶׁבִּקַּשְׁתִּי לִטְעֹם, טָעַמְתִּי בוֹ (בראשית רבה):", "rashi_en": "כל הטעמים שביקשתי לטעום, טעמתי במטעמים שהביא לי.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ ״וָאֹכַל מִכֹּל״ לְפִי רַשִׁ״י?", "options": ["טָעַמְתִּי בּוֹ כָּל טַעַם שֶׁבִּיקַּשְׁתִּי לִטְעוֹם", "אָכַלְתִּי מִכָּל הַמָּנוֹת שֶׁהֵבִיא לִי", "אָכַלְתִּי הַכּוֹל וְלֹא הִשְׁאַרְתִּי לְךָ דָּבָר"], "kasha": "וכי הביא לו יעקב כל מיני מאכלים, שנאמר ״מכל״?", "answer": "מכל הטעמים שביקשתי לטעום, טעמתי בו.", "kp": ["מכל טעמים שבקשתי לטעם", "טעמתי בו"]}]}, {"id": "27:33.4", "ch": 27, "v": 33, "n": 4, "dh": "גם ברוך יהיה", "pasuk_html": "וַיֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד־מְאֹד֒ וַיֹּ֡אמֶר מִֽי־אֵפ֡וֹא ה֣וּא הַצָּֽד־צַ֩יִד֩ וַיָּ֨בֵא לִ֜י וָאֹכַ֥ל מִכֹּ֛ל בְּטֶ֥רֶם תָּב֖וֹא וָאֲבָרְכֵ֑הוּ <mark>גַּם־בָּר֖וּךְ יִהְיֶֽה׃</mark>", "pasuk_en": "וַיִּחְרַד יִצְחָק חֲרָדָה גְדוֹלָה מְאֹד וַיֹּאמֶר מִי אֵפוֹא הוּא הַצָּד צַיִד וַיָּבֵא לִי וָאֹכַל מִכֹּל בְּטֶרֶם תָּבוֹא וָאֲבָרְכֵהוּ גַּם בָּרוּךְ יִהְיֶה", "rashi_he": "גם ברוך יהיה. שֶׁלֹּא תֹאמַר אִלּוּלֵי שֶׁרִמָּה יַעֲקֹב לְאָבִיו לֹא נָטַל אֶת הַבְּרָכוֹת, לְכָךְ הִסְכִּים וּבֵרְכוֹ מִדַּעְתּוֹ (בראשית רבה):", "rashi_en": "כדי שלא יאמרו שיעקב קיבל את הברכות רק משום שרימה את אביו, הסכים יצחק ובירך אותו מדעתו.", "note": "", "points": [{"q": "מַדּוּעַ אָמַר יִצְחָק ״גַּם־בָּרוּךְ יִהְיֶה״?", "options": ["כְּדֵי שֶׁלֹּא יֹאמְרוּ שֶׁיַּעֲקֹב זָכָה בַּבְּרָכוֹת רַק בְּרַמָּאוּת", "כִּי לֹא הָיָה בִּיכוֹלְתּוֹ לְבַטֵּל בְּרָכָה שֶׁכְּבָר נָתַן", "כְּדֵי לְפַיֵּיס אֶת רִבְקָה שֶׁרָצְתָה בְּבִרְכַּת יַעֲקֹב"], "kasha": "הברכה כבר ניתנה, ולמה הוסיף יצחק ״גם ברוך יהיה״?", "answer": "שלא תאמר: אלמלא רימה יעקב את אביו לא היה נוטל את הברכות; לכן הסכים יצחק ובירכו מדעתו.", "kp": ["שלא תאמר אלולי שרמה יעקב", "לא נטל את הברכות"]}]}, {"id": "27:35.1", "ch": 27, "v": 35, "n": 1, "dh": "במרמה", "pasuk_html": "וַיֹּ֕אמֶר בָּ֥א אָחִ֖יךָ <mark>בְּמִרְמָ֑ה</mark> וַיִּקַּ֖ח בִּרְכָתֶֽךָ׃", "pasuk_en": "וַיֹּאמֶר כִּי בִמְרוּמוֹ יַעֲקֹב אָחִיךָ וַיִּקַּחְ בִּרְכָתְךָ", "rashi_he": "במרמה. בְּחָכְמָה:", "rashi_en": "״במרמה״ כאן פירושו בחכמה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״בְּמִרְמָה״ לְפִי רַשִׁ״י?", "options": ["בְּחָכְמָה", "בְּשֶׁקֶר", "בְּחוּצְפָּה"], "kasha": "וכי יצחק מעיד על יעקב שנהג ברמאות?", "answer": "״במרמה״ פירושו בחכמה.", "kp": ["בחכמה"]}]}, {"id": "27:36.1", "ch": 27, "v": 36, "n": 1, "dh": "הכי קרא שמו", "pasuk_html": "וַיֹּ֡אמֶר <mark>הֲכִי֩ קָרָ֨א שְׁמ֜וֹ</mark> יַעֲקֹ֗ב וַֽיַּעְקְבֵ֙נִי֙ זֶ֣ה פַעֲמַ֔יִם אֶת־בְּכֹרָתִ֣י לָקָ֔ח וְהִנֵּ֥ה עַתָּ֖ה לָקַ֣ח בִּרְכָתִ֑י וַיֹּאמַ֕ר הֲלֹא־אָצַ֥לְתָּ לִּ֖י בְּרָכָֽה׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו הַכִּי קָרָא שְׁמוֹ יַעֲקֹב וַיַּעְקְבֵנִי זֶה פַּעֲמַיִם אֶת־בְּכֹרָתִי לָקַח וְהִנֵּה עַתָּה לָקַח אֶת־בִּרְכָתִי וַיֹּאמֶר הֲלֹא אָצַלְתָּ לִּי בְּרָכָה", "rashi_he": "הכי קרא שמו. לְשׁוֹן תֵּמַהּ הוּא, כְּמוֹ הֲכִי אָחִי אַתָּה, שֶׁמָּא לְכָךְ נִקְרָא שְׁמוֹ יַעֲקֹב עַל שֵׁם סוֹפוֹ שֶׁהוּא עָתִיד לְעָקְבֵנִי? תַּנְחוּמָא. לָמָּה חָרַד יִצְחָק? אָמַר שֶׁמָּא עָוֹן יֵשׁ בִּי שֶׁבֵּרַכְתִּי קָטָן לִפְנֵי גָּדוֹל וְשִׁנִּיתִי סֵדֶר הַיַּחַס, הִתְחִיל עֵשָׂו מְצָעֵק וַיַּעְקְבֵנִי זֶה פַעֲמַיִם, אָמַר לוֹ אָבִיו מֶה עָשָׂה לְךָ? אָמַר לוֹ אֶת בְּכֹרָתִי לָקָח, אָמַר בְּכָךְ הָיִיתִי מֵצֵר וְחָרֵד שֶׁמָּא עָבַרְתִּי עַל שׁוּרַת הַדִּין, עַכְשָׁו לַבְּכוֹר בֵּרַכְתִּי, גַּם בָּרוּךְ יִהְיֶה:", "rashi_en": "עשו שואל בתמיהה: שמא לכן נקרא יעקב, על שם שעתיד לעקבני? יצחק חרד שמא חטא כשבירך את הצעיר לפני הבכור, וכששמע שיעקב קנה את הבכורה אמר: לבכור בירכתי, ״גם ברוך יהיה״.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״הֲכִי קָרָא שְׁמוֹ יַעֲקֹב״?", "options": ["תְּמִיהָה: שֶׁמָּא לָכֵן נִקְרָא יַעֲקֹב, עַל שֵׁם סוֹפוֹ", "קְבִיעָה: לָכֵן נִקְרָא יַעֲקֹב, כִּי אָחַז בְּעָקֵב אָחִיו", "תְּלוּנָה: לָמָּה קָרְאוּ לוֹ הוֹרָיו בְּשֵׁם יַעֲקֹב"], "kasha": "האם עשו קובע עובדה במילה ״הכי״, או שואל?", "answer": "זו לשון תמיהה, כמו ״הכי אחי אתה״: שמא לכך נקרא שמו יעקב על שם סופו, שהוא עתיד לעקבני.", "kp": ["לשון תמה הוא", "שמא לכך נקרא שמו יעקב", "על שם סופו"]}, {"q": "לְפִי רַשִׁ״י, מִמָּה חָרַד יִצְחָק, וּמָה הִרְגִּיעַ אוֹתוֹ?", "options": ["שֶׁמָּא בֵּירַךְ קָטָן לִפְנֵי גָּדוֹל; נִרְגַּע כְּשֶׁשָּׁמַע עַל הַבְּכוֹרָה", "שֶׁמָּא עֵשָׂו יַהֲרוֹג אֶת יַעֲקֹב; נִרְגַּע כְּשֶׁיַּעֲקֹב בָּרַח", "שֶׁמָּא הַבְּרָכָה לֹא תָּחוּל; נִרְגַּע כְּשֶׁרָאָה אֶת עֵשָׂו"], "kasha": "מדוע חרד יצחק חרדה גדולה, ובכל זאת אמר ״גם ברוך יהיה״?", "answer": "חשש שמא יש בו עוון, שבירך קטן לפני גדול ושינה את סדר היחס; כשאמר עשו ״את בכרתי לקח״, אמר: עכשיו לבכור בירכתי, ״גם ברוך יהיה״.", "kp": ["שברכתי קטן לפני גדול", "עכשו לבכור ברכתי"]}]}, {"id": "27:36.2", "ch": 27, "v": 36, "n": 2, "dh": "ויעקבני", "pasuk_html": "וַיֹּ֡אמֶר הֲכִי֩ קָרָ֨א שְׁמ֜וֹ יַעֲקֹ֗ב <mark>וַֽיַּעְקְבֵ֙נִי֙</mark> זֶ֣ה פַעֲמַ֔יִם אֶת־בְּכֹרָתִ֣י לָקָ֔ח וְהִנֵּ֥ה עַתָּ֖ה לָקַ֣ח בִּרְכָתִ֑י וַיֹּאמַ֕ר הֲלֹא־אָצַ֥לְתָּ לִּ֖י בְּרָכָֽה׃", "pasuk_en": "אמר עשו: 'הכי קרא שמו יעקוב שיעקבני גַּם פַּעַם הַזֹּאת? את בכורתי לקח, והנה עתה לקח את ברכתי.' ויאמר: 'הלוא אצלת לי ברכה?'", "rashi_he": "ויעקבני. כְּתַרְגּוּמוֹ וּכְמַנִי – אֲרָבַנִי; וְאָרַב – וּכְמַן. וְיֵשׁ מְתַרְגְּמִין וְחַכְּמַנִי, נִתְחַכֵּם לִי:", "rashi_en": "כתרגומו ״וכמני״, כלומר ארב לי, כמו ש״וארב״ מתורגם ״וכמן״. ויש מתרגמים ״וחכמני״, כלומר התחכם לי.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״וַיַּעְקְבֵנִי״ לְפִי הַתַּרְגּוּם שֶׁמֵּבִיא רש״י?", "options": ["אָרַב לִי, כְּתַרְגּוּמוֹ ״וְכַמְנִי״", "הָלַךְ אַחֲרַיי בְּעִקְבוֹתַיי", "אָחַז בְּעֲקֵבִי בִּשְׁעַת הַלֵּידָה"], "kasha": "מה פירוש ״ויעקבני״, ומה עשה יעקב לעשו?", "answer": "כתרגומו ״וכמני״, ארב לי, כמו ״וארב״ שמתורגם ״וכמן״; ויש מתרגמים ״וחכמני״, התחכם לי.", "kp": ["כתרגומו וכמני", "ארבני"]}]}, {"id": "27:36.3", "ch": 27, "v": 36, "n": 3, "dh": "אצלת", "pasuk_html": "וַיֹּ֡אמֶר הֲכִי֩ קָרָ֨א שְׁמ֜וֹ יַעֲקֹ֗ב וַֽיַּעְקְבֵ֙נִי֙ זֶ֣ה פַעֲמַ֔יִם אֶת־בְּכֹרָתִ֣י לָקָ֔ח וְהִנֵּ֥ה עַתָּ֖ה לָקַ֣ח בִּרְכָתִ֑י וַיֹּאמַ֕ר הֲלֹא־<mark>אָצַ֥לְתָּ</mark> לִּ֖י בְּרָכָֽה׃", "pasuk_en": "אמר עשו: 'הכי קרא שמו יעקוב שיעקבני גַּם פַּעַם הַזֹּאת? את בכורתי לקח, והנה עתה לקח את ברכתי.' ויאמר: 'הלוא אצלת לי ברכה?'", "rashi_he": "אצלת. לְשׁוֹן הַפְרָשָׁה כְּמוֹ וַיָּאצֶל:", "rashi_en": "״אצלת״ הוא לשון הפרשה והבדלה, כמו ״ויאצל״: האם לא הפרשת לי ברכה?", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״הֲלֹא־אָצַלְתָּ לִּי בְּרָכָה״?", "options": ["הַאִם לֹא הִפְרַשְׁתָּ לִּי בְּרָכָה?", "הַאִם לֹא הִבְטַחְתָּ לִּי בְּרָכָה?", "הַאִם לֹא בֵּירַכְתָּ אוֹתִי בָּעָבָר?"], "kasha": "מה פירוש המילה הנדירה ״אצלת״?", "answer": "לשון הפרשה, כמו ״ויאצל״.", "kp": ["לשון הפרשה"]}]}, {"id": "27:37.1", "ch": 27, "v": 37, "n": 1, "dh": "הן גביר", "pasuk_html": "וַיַּ֨עַן יִצְחָ֜ק וַיֹּ֣אמֶר לְעֵשָׂ֗ו <mark>הֵ֣ן גְּבִ֞יר</mark> שַׂמְתִּ֥יו לָךְ֙ וְאֶת־כׇּל־אֶחָ֗יו נָתַ֤תִּי לוֹ֙ לַעֲבָדִ֔ים וְדָגָ֥ן וְתִירֹ֖שׁ סְמַכְתִּ֑יו וּלְכָ֣ה אֵפ֔וֹא מָ֥ה אֶֽעֱשֶׂ֖ה בְּנִֽי׃", "pasuk_en": "ויַעַן יִצְחָק וַיֹּאמֶר אֶל עֵשָׂו: הֵן גְּבִיר שַׂמְתִּיו לָךְ, וְאֶת כָּל אֶחָיו נָתַתִּי לוֹ לַעֲבָדִים, וְדָגָן וְתִירוֹשׁ סְמַכְתִּיו, וּמַה אָכוּל אֲעֶשׂה לְךָ בְנִי?", "rashi_he": "הן גביר. בְּרָכָה זוֹ שְׁבִיעִית הִיא, וְהוּא עוֹשֶׂה אוֹתָהּ רִאשׁוֹנָה? אֶלָּא אָמַר לוֹ מַה תּוֹעֶלֶת לְךָ בַּבְּרָכָה? אִם תִּקְנֶה נְכָסִים, שֶׁלּוֹ הֵם, שֶׁהֲרֵי גְּבִיר שַׂמְתִּיו לָךְ, וּמַה שֶּׁקָּנָה עֶבֶד קָנָה רַבּוֹ:", "rashi_en": "״הוה גביר לאחיך״ היא הברכה השביעית, ובכל זאת הזכיר אותה יצחק ראשונה, כי אמר לעשו: מה תועיל לך ברכה? כל מה שתקנה יהיה של יעקב, שהרי מה שקנה עבד קנה רבו.", "note": "", "points": [{"q": "מַדּוּעַ פָּתַח יִצְחָק דַּוְוקָא בְּ״הֵן גְּבִיר״, אַף שֶׁהִיא הַבְּרָכָה הַשְּׁבִיעִית?", "options": ["כִּי כָּל מַה שֶּׁיִּקְנֶה עֵשָׂו יִהְיֶה שֶׁל יַעֲקֹב אֲדוֹנוֹ", "כִּי זוֹ הַבְּרָכָה הַחֲשׁוּבָה בְּיוֹתֵר בְּעֵינֵי יִצְחָק", "כִּי עֵשָׂו שָׁאַל בִּמְפוֹרָשׁ עַל הַשִּׁלְטוֹן בַּמִּשְׁפָּחָה"], "kasha": "ברכה זו היא השביעית בברכות יעקב, ומדוע מזכיר אותה יצחק ראשונה?", "answer": "יצחק אמר לעשו: מה תועלת לך בברכה? אם תקנה נכסים, שלו הם, שהרי גביר שמתיו לך, ומה שקנה עבד קנה רבו.", "kp": ["שלו הם, שהרי גביר שמתיו לך", "ומה שקנה עבד קנה רבו"]}]}, {"id": "27:37.2", "ch": 27, "v": 37, "n": 2, "dh": "ולכה אפא מה אעשה", "pasuk_html": "וַיַּ֨עַן יִצְחָ֜ק וַיֹּ֣אמֶר לְעֵשָׂ֗ו הֵ֣ן גְּבִ֞יר שַׂמְתִּ֥יו לָךְ֙ וְאֶת־כׇּל־אֶחָ֗יו נָתַ֤תִּי לוֹ֙ לַעֲבָדִ֔ים וְדָגָ֥ן וְתִירֹ֖שׁ סְמַכְתִּ֑יו <mark>וּלְכָ֣ה אֵפ֔וֹא מָ֥ה אֶֽעֱשֶׂ֖ה</mark> בְּנִֽי׃", "pasuk_en": "ויַעַן יִצְחָק וַיֹּאמֶר אֶל עֵשָׂו: הֵן גְּבִיר שַׂמְתִּיו לָךְ, וְאֶת כָּל אֶחָיו נָתַתִּי לוֹ לַעֲבָדִים, וְדָגָן וְתִירוֹשׁ סְמַכְתִּיו, וּמַה אָכוּל אֲעֶשׂה לְךָ בְנִי?", "rashi_he": "ולכה אפא מה אעשה. אַיֵּה אֵיפֹא אֲבַקֵּשׁ מַה לַּעֲשׂוֹת לְךָ:", "rashi_en": "יצחק אומר לעשו: איפה אפוא אחפש דבר שאוכל לעשות לך?", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״וּלְכָה אֵפוֹא מָה אֶעֱשֶׂה בְּנִי״?", "options": ["אֵיפֹה אֶמְצָא דָּבָר שֶׁאוּכַל לַעֲשׂוֹת לְךָ?", "לֵךְ מִכָּאן, כִּי אֵין לִי מָה לַעֲשׂוֹת", "מָה עָשִׂיתָ לִּי, בְּנִי, שֶׁבָּאתָ בְּאִיחוּר?"], "kasha": "מה משמעות ״אפוא״ בדברי יצחק לעשו?", "answer": "איה איפוא אבקש מה לעשות לך.", "kp": ["איה איפא אבקש מה לעשות לך"]}]}, {"id": "27:38.1", "ch": 27, "v": 38, "n": 1, "dh": "הברכה אחת", "pasuk_html": "וַיֹּ֨אמֶר עֵשָׂ֜ו אֶל־אָבִ֗יו <mark>הַֽבְרָכָ֨ה אַחַ֤ת</mark> הִֽוא־לְךָ֙ אָבִ֔י בָּרְכֵ֥נִי גַם־אָ֖נִי אָבִ֑י וַיִּשָּׂ֥א עֵשָׂ֛ו קֹל֖וֹ וַיֵּֽבְךְּ׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו אֶל־אָבִיו: 'הַאִם בְּרָכָה אַחַת בִּי אָבִי? בָּרֲכֵנִי גַּם־אָנִי אָבִי!' וַיִּשְׂא עֵשָׂו אֶת־קוֹלוֹ וַיֵּבְךְ.", "rashi_he": "הברכה אחת. הֵ\"א זוֹ מְשַׁמֶּשֶׁת לְשׁוֹן תְּמִיהָ, כְּמוֹ הַבְּמַחֲנִים? הַשְּׁמֵנָה הִיא? הַכְּמוֹת נָבָל?", "rashi_en": "הה״א שבתחילת המילה \"הברכה\" היא ה״א השאלה. עשו שואל בתמיהה: וכי יש לך רק ברכה אחת? כמו \"הבמחנים\", \"השמנה היא\", \"הכמות נבל\".", "note": "", "points": [{"q": "מָה תַּפְקִידָהּ שֶׁל הַהֵ״א בַּמִּילָּה \"הַבְרָכָה\" לְפִי רַשִׁ״י?", "options": ["ה״א הַשְּׁאֵלָה – עֵשָׂו תָּמַה אִם יֵשׁ רַק בְּרָכָה אַחַת", "הֵ״א הַיְדִיעָה – הַבְּרָכָה הַמְיוּחֶדֶת שֶׁקִּיבֵּל יַעֲקֹב", "הֵ״א הַמַּגְמָה – הַבְּרָכָה שֶׁצְּרִיכָה לַעֲבוֹר אֵלָיו"], "kasha": "המילים \"הברכה אחת הוא לך\" נשמעות כקביעה, ולא ברור מה עשו אומר בהן.", "answer": "הה״א משמשת לשון תמיהה, כמו \"הבמחנים\", \"השמנה היא\", \"הכמות נבל\" – כלומר: וכי ברכה אחת בלבד יש לך?", "kp": ["ה\"א זו משמשת לשון תמיה", "הברכה אחת"]}]}, {"id": "27:39.1", "ch": 27, "v": 39, "n": 1, "dh": "משמני ארץ וגו", "pasuk_html": "וַיַּ֛עַן יִצְחָ֥ק אָבִ֖יו וַיֹּ֣אמֶר אֵלָ֑יו הִנֵּ֞ה <mark>מִשְׁמַנֵּ֤י הָאָ֙רֶץ֙</mark> יִהְיֶ֣ה מֽוֹשָׁבֶ֔ךָ וּמִטַּ֥ל הַשָּׁמַ֖יִם מֵעָֽל׃", "pasuk_en": "וַיַּעַן יִצְחָק אָבִיו וַיֹּאמֶר אֵלָיו: הִנֵּה מִשְׁמַנֵּי הָאָרֶץ יִהְיֶה מוֹשָׁבְךָ וּמִטַּל הַשָּׁמַיִם מֵעָל.", "rashi_he": "משמני ארץ וגו'. זוֹ אִיטָלִיאָה שֶׁל יָוָן:", "rashi_en": "הברכה \"משמני הארץ יהיה מושבך\" שקיבל עשו מכוונת לאיטליה של יוון, ארץ שמנה ופורייה.", "note": "", "points": [{"q": "לְאֵיזֶה מָקוֹם מְכֻוֶּונֶת הַבְּרָכָה \"מִשְׁמַנֵּי הָאָרֶץ יִהְיֶה מוֹשָׁבֶךָ\"?", "options": ["לְאִיטַלְיָה שֶׁל יָוָוְן", "לְהַר שֵׂעִיר וְאֶרֶץ אֱדוֹם", "לְאֶרֶץ כְּנַעַן וּגְבוּלוֹתֶיהָ"], "kasha": "הפסוק אינו מפרש איזו ארץ שמנה הובטחה לעשו.", "answer": "זו איטליאה של יון – שם יהיה מושבו של עשו.", "kp": ["זו איטליאה של יון"]}]}, {"id": "27:40.1", "ch": 27, "v": 40, "n": 1, "dh": "ועל חרבך", "pasuk_html": "<mark>וְעַל־חַרְבְּךָ֣</mark> תִֽחְיֶ֔ה וְאֶת־אָחִ֖יךָ תַּעֲבֹ֑ד וְהָיָה֙ כַּאֲשֶׁ֣ר תָּרִ֔יד וּפָרַקְתָּ֥ עֻלּ֖וֹ מֵעַ֥ל צַוָּארֶֽךָ׃", "pasuk_en": "וְעַל חַרְבְּךָ תִּחְיֶה וְאֶת־אָחִיךָ תַּעֲבֹד וְהָיָה כַּאֲשֶׁר תָּרִיד וּפָרַקְתָּ עֻלּוֹ מֵעַל צַוָּארְךָ.", "rashi_he": "ועל חרבך. כְּמוֹ בְּחַרְבְּךָ, יֵשׁ עַל בִּמְקוֹם בְּ', כְּמוֹ עֲמַדְתֶּם עַל חַרְבְּכֶם – בְּחַרְבְּכֶם; עַל צִבְאֹתָם – בְּצִבְאֹתָם:", "rashi_en": "\"על חרבך\" פירושו \"בחרבך\" – באמצעות החרב תחיה. לפעמים בא \"על\" במקום האות ב׳, כמו \"עמדתם על חרבכם\" ו\"על צבאתם\".", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וְעַל־חַרְבְּךָ תִחְיֶה\" לְפִי רש״י?", "options": ["בְּחַרְבְּךָ – בְּאֶמְצָעוּת הַחֶרֶב תִּתְקַיֵּים וְתִחְיֶה", "בִּשְׁבִיל חַרְבְּךָ – כְּדֵי לִשְׁמוֹר עַל כְּלֵי נִשְׁקֶךָ", "מֵעַל חַרְבְּךָ – תִּחְיֶה בְּלִי לְהִזְדַּקֵּק לְחֶרֶב"], "kasha": "\"על חרבך\" נשמע כאילו יחיה על גבי החרב, ואין לכך משמעות ברורה.", "answer": "\"על\" בא כאן במקום ב׳, כלומר \"בחרבך\", כמו \"עמדתם על חרבכם\" – בחרבכם, ו\"על צבאתם\" – בצבאתם.", "kp": ["כמו בחרבך"]}]}, {"id": "27:40.2", "ch": 27, "v": 40, "n": 2, "dh": "תריד", "pasuk_html": "וְעַל־חַרְבְּךָ֣ תִֽחְיֶ֔ה וְאֶת־אָחִ֖יךָ תַּעֲבֹ֑ד וְהָיָה֙ כַּאֲשֶׁ֣ר <mark>תָּרִ֔יד</mark> וּפָרַקְתָּ֥ עֻלּ֖וֹ מֵעַ֥ל צַוָּארֶֽךָ׃", "pasuk_en": "וְעַל חַרְבְּךָ תִּחְיֶה וְאֶת־אָחִיךָ תַּעֲבֹד וְהָיָה כַּאֲשֶׁר תָּרִיד וּפָרַקְתָּ עֻלּוֹ מֵעַל צַוָּארְךָ.", "rashi_he": "תריד. לְשׁוֹן צַעַר כְּמוֹ אָרִיד בְּשִׂיחִי, כְּלוֹמַר, כְּשֶׁיַּעַבְרוּ יִשְׂרָאֵל עַל הַתּוֹרָה וְיִהְיֶה לְךָ פִּתְחוֹן פֶּה לְהִצְטַעֵר עַל הַבְּרָכוֹת שֶׁנָּטַל, ופרקת עלו וגומר:", "rashi_en": "\"תריד\" הוא לשון צער, כמו \"אריד בשיחי\". כלומר: כשישראל יעברו על התורה, ויהיה לעשו פתחון פה להצטער על הברכות שנטל יעקב – אז יפרוק את עולו מעל צווארו.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָּה \"תָּרִיד\" לְפִי רש״י?", "options": ["לְשׁוֹן צַעַר, כְּמוֹ \"אָרִיד בְּשִׂיחִי\"", "לְשׁוֹן יְרִידָה, כְּשֶׁיַּעֲקֹב יָרַד מִמַּעֲלָתוֹ", "לְשׁוֹן שִׁלְטוֹן, כְּמוֹ \"וְיֵרְד מִיָּם עַד יָם\""], "kasha": "המילה \"תריד\" אינה מצויה, ולא ברור מה משמעה.", "answer": "תריד הוא לשון צער, כמו \"אריד בשיחי\".", "kp": ["לשון צער כמו אריד בשיחי"]}, {"q": "מָתַי יוּכַל עֵשָׂו לִפְרוֹק אֶת עוּלּוֹ שֶׁל יַעֲקֹב?", "options": ["כְּשֶׁיִּשְׂרָאֵל יַעַבְרוּ עַל הַתּוֹרָה", "כְּשֶׁיִּתְגַּבֵּר עֵשָׂו בְּכוֹחַ חַרְבּוֹ", "כְּשֶׁיְּקַבֵּל עֵשָׂו בְּרָכָה נוֹסֶפֶת מִיִּצְחָק"], "kasha": "הפסוק אינו מפרש באיזה מצב יוכל עשו לפרוק את העול.", "answer": "כשיעברו ישראל על התורה ויהיה לעשו פתחון פה להצטער על הברכות שנטל יעקב – אז \"ופרקת עלו\".", "kp": ["כשיעברו ישראל על התורה"]}]}, {"id": "27:41.1", "ch": 27, "v": 41, "n": 1, "dh": "יקרבו ימי אבל אבי", "pasuk_html": "וַיִּשְׂטֹ֤ם עֵשָׂו֙ אֶֽת־יַעֲקֹ֔ב עַ֨ל־הַבְּרָכָ֔ה אֲשֶׁ֥ר בֵּרְכ֖וֹ אָבִ֑יו וַיֹּ֨אמֶר עֵשָׂ֜ו בְּלִבּ֗וֹ <mark>יִקְרְבוּ֙ יְמֵי֙ אֵ֣בֶל אָבִ֔י</mark> וְאַֽהַרְגָ֖ה אֶת־יַעֲקֹ֥ב אָחִֽי׃", "pasuk_en": "וַיִּשְׂנָא עֵשָׂו אֶת־יַעֲקֹב עַל־הַבְּרָכָה אֲשֶׁר בֵּרַךְ אוֹתוֹ אָבִיו וַיֹּאמֶר עֵשָׂו בְּלִבּוֹ יִקְרְבוּ יְמֵי אֵבֶל אָבִי וְאַהַרְגָה אֶת־יַעֲקֹב אָחִי.", "rashi_he": "יקרבו ימי אבל אבי. כְּמִשְׁמָעוֹ, שֶׁלֹּא אֲצָעֵר אֶת אַבָּא, וּמִדְרְשֵׁי אַגָּדָה לְכַמָּה פָנִים יֵשׁ:", "rashi_en": "לפי פשוטו, עשו מתכוון לחכות עד שימות יצחק ויגיעו ימי האבל עליו, ורק אז להרוג את יעקב, כדי שלא לצער את אביו. ויש על כך גם מדרשי אגדה רבים.", "note": "", "points": [{"q": "מַדּוּעַ רָצָה עֵשָׂו לְחַכּוֹת לִימֵי הָאֵבֶל עַל אָבִיו לִפְנֵי שֶׁיַּהֲרוֹג אֶת יַעֲקֹב?", "options": ["כְּדֵי שֶׁלֹּא לְצַעֵר אֶת אָבִיו", "כְּדֵי לָרֶשֶׁת לְבַדּוֹ אֶת נִכְסֵי אָבִיו", "כְּדֵי שֶׁיַּעֲקֹב לֹא יֶחְשׁוֹד בּוֹ מֵרֹאשׁ"], "kasha": "לא ברור מדוע עשו קושר את תוכניתו להרוג את יעקב לימי האבל על אביו.", "answer": "כמשמעו – יחכה עד שימות אביו, שלא יצער את אביו; ומדרשי אגדה לכמה פנים יש בדבר.", "kp": ["שלא אצער את אבא"]}]}, {"id": "27:42.1", "ch": 27, "v": 42, "n": 1, "dh": "ויגד לרבקה", "pasuk_html": "<mark>וַיֻּגַּ֣ד לְרִבְקָ֔ה</mark> אֶת־דִּבְרֵ֥י עֵשָׂ֖ו בְּנָ֣הּ הַגָּדֹ֑ל וַתִּשְׁלַ֞ח וַתִּקְרָ֤א לְיַעֲקֹב֙ בְּנָ֣הּ הַקָּטָ֔ן וַתֹּ֣אמֶר אֵלָ֔יו הִנֵּה֙ עֵשָׂ֣ו אָחִ֔יךָ מִתְנַחֵ֥ם לְךָ֖ לְהׇרְגֶֽךָ׃", "pasuk_en": "וַיֻּגַּד לְרִבְקָה אֶת־דִּבְרֵי אֵשָׂו בְנָהּ הַגָּדוֹל, וַתִּשְׁלַח וַתִּקְרָא לְיַעֲקֹב בְנָהּ הַקָּטוֹן, וַתֹּאמֶר אֵלָיו: הִנֵּה אָחִיךָ אֵשָׂו מִתְנַחֵם לְךָ, לְהָרְגְךָ.", "rashi_he": "ויגד לרבקה. בְּרוּחַ הַקֹּדֶשׁ הֻגַּד לָהּ מַה שֶּׁעֵשָׂו מְהַרְהֵר בְּלִבּוֹ:", "rashi_en": "עשו חשב את מחשבתו רק בלבו, ולכן הוגד לרבקה ברוח הקודש מה שהוא מהרהר.", "note": "", "points": [{"q": "כֵּיצַד נוֹדַע לְרִבְקָה מַה שֶּׁתִּכְנֵן עֵשָׂו?", "options": ["בְּרוּחַ הַקּוֹדֶשׁ הוּגַּד לָהּ", "עֵשָׂו סִיפֵּר זֹאת לְאַנְשֵׁי בֵּיתוֹ", "יִצְחָק שָׁמַע מִמֶּנּוּ וְסִיפֵּר לָהּ"], "kasha": "עשו אמר את דבריו \"בלבו\", ואם כן כיצד הוגדו לרבקה?", "answer": "ברוח הקודש הוגד לה מה שעשו מהרהר בלבו.", "kp": ["ברוח הקדש הגד לה"]}]}, {"id": "27:42.2", "ch": 27, "v": 42, "n": 2, "dh": "מתנחם לך", "pasuk_html": "וַיֻּגַּ֣ד לְרִבְקָ֔ה אֶת־דִּבְרֵ֥י עֵשָׂ֖ו בְּנָ֣הּ הַגָּדֹ֑ל וַתִּשְׁלַ֞ח וַתִּקְרָ֤א לְיַעֲקֹב֙ בְּנָ֣הּ הַקָּטָ֔ן וַתֹּ֣אמֶר אֵלָ֔יו הִנֵּה֙ עֵשָׂ֣ו אָחִ֔יךָ <mark>מִתְנַחֵ֥ם לְךָ֖</mark> לְהׇרְגֶֽךָ׃", "pasuk_en": "וַיֻּגַּד לְרִבְקָה אֶת־דִּבְרֵי אֵשָׂו בְנָהּ הַגָּדוֹל, וַתִּשְׁלַח וַתִּקְרָא לְיַעֲקֹב בְנָהּ הַקָּטוֹן, וַתֹּאמֶר אֵלָיו: הִנֵּה אָחִיךָ אֵשָׂו מִתְנַחֵם לְךָ, לְהָרְגְךָ.", "rashi_he": "מתנחם לך. נִחָם עַל הָאַחְוָה לַחֲשֹׁב מַחֲשָׁבָה אַחֶרֶת לְהִתְנַכֵּר לְךָ וּלְהָרְגְּךָ. וּמִדְרַשׁ אַגָּדָה כְּבָר אַתָּה מֵת בְּעֵינָיו וְשָׁתָה עָלֶיךָ כּוֹס שֶׁל תַּנְחוּמִים. וּלְפִי פְּשׁוּטוֹ לְשׁוֹן תַּנְחוּמִים, מִתְנַחֵם הוּא עַל הַבְּרָכוֹת בַּהֲרִיגָתְךָ:", "rashi_en": "רש״י מביא שלושה פירושים: עשו מתחרט על האחווה וחושב להתנכר ליעקב ולהרגו; לפי המדרש – בעיניו יעקב כבר מת, והוא שתה עליו כוס של תנחומים; ולפי הפשט – עשו מתנחם על הברכות בכך שיהרוג את יעקב.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן, מָה פֵּירוּשׁ \"מִתְנַחֵם\" אֵצֶל עֵשָׂו?", "options": ["מִתְחָרֵט עַל הָאַחֲווָה וְחוֹשֵׁב לְהִתְנַכֵּר לְיַעֲקֹב וּלְהָרְגוֹ", "מִתְחָרֵט עַל שֶׁמָּכַר אֶת הַבְּכוֹרָה לְיַעֲקֹב בְּנָזִיד", "מִתְחָרֵט עַל כַּעֲסוֹ וְרוֹצֶה לְהַשְׁלִים עִם יַעֲקֹב"], "kasha": "\"מתנחם\" נראה לשון נחמה, ואינו מתאים למי שמתכנן לרצוח.", "answer": "\"נחם\" כאן לשון חרטה: עשו התחרט על האחווה וחושב מחשבה אחרת – להתנכר לו ולהרגו.", "kp": ["נחם על האחוה לחשב מחשבה אחרת", "להתנכר לך ולהרגך"]}, {"q": "לְפִי פְּשׁוּטוֹ, בַּמָּה מִתְנַחֵם עֵשָׂו עַל הַבְּרָכוֹת שֶׁהִפְסִיד?", "options": ["בְּכָךְ שֶׁיַּהֲרוֹג אֶת יַעֲקֹב", "בְּבִרְכַּת הַטַּל שֶׁקִּיבֵּל מֵאָבִיו", "בְּנִישּׂוּאָיו לְבַת יִשְׁמָעֵאל"], "kasha": "אם \"מתנחם\" הוא לשון תנחומים, יש לברר במה מתנחם עשו ועל מה.", "answer": "לפי פשוטו זה לשון תנחומים: עשו מתנחם על הברכות בהריגתו של יעקב. ולפי המדרש, יעקב כבר מת בעיניו והוא שתה עליו כוס של תנחומים.", "kp": ["מתנחם הוא על הברכות בהריגתך"]}]}, {"id": "27:44.1", "ch": 27, "v": 44, "n": 1, "dh": "אחדים", "pasuk_html": "וְיָשַׁבְתָּ֥ עִמּ֖וֹ יָמִ֣ים <mark>אֲחָדִ֑ים</mark> עַ֥ד אֲשֶׁר־תָּשׁ֖וּב חֲמַ֥ת אָחִֽיךָ׃", "pasuk_en": "שְׁבִי עִם־לָבָן אַחֲדִים, עַד אֲשֶׁר תָּשׁוּב חֲמַת אָחִיךָ.", "rashi_he": "אחדים. מֻעָטִים:", "rashi_en": "\"ימים אחדים\" – ימים מעטים. רבקה אמרה ליעקב לשהות אצל לבן זמן קצר.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"יָמִים אֲחָדִים\" לְפִי רַשִׁ״י?", "options": ["יָמִים מְעַטִּים", "יָמִים רְצוּפִים", "יוֹם אֶחָד בִּלְבַד"], "kasha": "\"אחדים\" נשמע מלשון \"אחד\", ולא ברור כמה זמן הכוונה.", "answer": "אחדים פירושו מעטים.", "kp": ["מעטים"]}]}, {"id": "27:45.1", "ch": 27, "v": 45, "n": 1, "dh": "למה אשכל", "pasuk_html": "עַד־שׁ֨וּב אַף־אָחִ֜יךָ מִמְּךָ֗ וְשָׁכַח֙ אֵ֣ת אֲשֶׁר־עָשִׂ֣יתָ לּ֔וֹ וְשָׁלַחְתִּ֖י וּלְקַחְתִּ֣יךָ מִשָּׁ֑ם <mark>לָמָ֥ה אֶשְׁכַּ֛ל</mark> גַּם־שְׁנֵיכֶ֖ם י֥וֹם אֶחָֽד׃", "pasuk_en": "עַד אֲשֶׁר תָּשׁוּב חֲמַת־אָחִיךָ מִמְּךָ, וְשָׁכַח אֵת אֲשֶׁר־עָשִׂיתָ לוֹ; וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם. לָמָּה אֶשְׁכַּל גַּם־שְׁנֵיכֶם בְּיוֹם אֶחָד?", "rashi_he": "למה אשכל. אֶהְיֶה שַׁכּוּלָה מִשְּׁנֵיכֶם. הַקּוֹבֵר אֶת בָּנָיו קָרוּי שַׁכּוּל, וְכֵן בְּיַעֲקֹב אָמַר כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי:", "rashi_en": "רבקה אומרת: למה אהיה שכולה משני בניי? מי שקובר את בניו נקרא שכול, וכן אמר יעקב \"כאשר שכלתי שכלתי\".", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"לָמָה אֶשְׁכַּל\" לְפִי רַשִׁ״י?", "options": ["לָמָּה אֶהְיֶה שְׁכוּלָה מִשְּׁנֵיכֶם, כְּמִי שֶׁקּוֹבֶרֶת אֶת בָּנֶיהָ", "לָמָּה אֲאַבֵּד אֶת שִׂכְלִי מֵרוֹב צַעַר וְדֶאָגָה", "לָמָּה אֶשָּׁאֵר בּוֹדֵדָה בְּלִי בַּעֲלִי וּבְלִי בָּנַיי"], "kasha": "יש לברר מה משמעות לשון \"שכול\" בדברי רבקה.", "answer": "אהיה שכולה משניכם; הקובר את בניו קרוי שכול, וכן ביעקב נאמר \"כאשר שכלתי שכלתי\".", "kp": ["אהיה שכולה משניכם", "הקובר את בניו קרוי שכול"]}]}, {"id": "27:45.2", "ch": 27, "v": 45, "n": 2, "dh": "גם שניכם", "pasuk_html": "עַד־שׁ֨וּב אַף־אָחִ֜יךָ מִמְּךָ֗ וְשָׁכַח֙ אֵ֣ת אֲשֶׁר־עָשִׂ֣יתָ לּ֔וֹ וְשָׁלַחְתִּ֖י וּלְקַחְתִּ֣יךָ מִשָּׁ֑ם לָמָ֥ה אֶשְׁכַּ֛ל <mark>גַּם־שְׁנֵיכֶ֖ם</mark> י֥וֹם אֶחָֽד׃", "pasuk_en": "עַד אֲשֶׁר תָּשׁוּב חֲמַת־אָחִיךָ מִמְּךָ, וְשָׁכַח אֵת אֲשֶׁר־עָשִׂיתָ לוֹ; וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם. לָמָּה אֶשְׁכַּל גַּם־שְׁנֵיכֶם בְּיוֹם אֶחָד?", "rashi_he": "גם שניכם. אִם יָקוּם עָלֶיךָ וְאַתָּה תַּהַרְגֶנּוּ יַעַמְדוּ בָנָיו וְיַהַרְגוּךָ; וְרוּחַ הַקֹּדֶשׁ נִזְרְקָה בָהּ וְנִתְנַבְּאָה שֶׁבְּיוֹם א' יָמוּתוּ, כְּמוֹ שֶׁמְּפֹרָשׁ בְּפֶרֶק הַמְקַנֵּא לְאִשְׁתּוֹ:", "rashi_en": "אם עשו יקום על יעקב ויעקב יהרוג אותו, יקומו בני עשו ויהרגו את יעקב. ועוד, רוח הקודש נזרקה ברבקה והיא ניבאה ששניהם ימותו ביום אחד, כמבואר בפרק המקנא לאשתו.", "note": "", "points": [{"q": "מַדּוּעַ חָשְׁשָׁה רִבְקָה לְאַבֵּד אֶת שְׁנֵי בָּנֶיהָ, וְלֹא רַק אֶת יַעֲקֹב?", "options": ["אִם יַעֲקֹב יַהֲרוֹג אֶת עֵשָׂו, יָקוּמוּ בְּנֵי עֵשָׂו וְיַהַרְגוּ אֶת יַעֲקֹב", "כִּי חָשְׁשָׁה שֶׁיִּצְחָק יִכְעַס וִיגָרֵשׁ אֶת שְׁנֵיהֶם מִן הַבַּיִת", "כִּי עֵשָׂו יַהֲרוֹג אֶת יַעֲקֹב וְאַחַר כָּךְ יֵיעָנֵשׁ בְּמִיתָה"], "kasha": "עשו איים להרוג רק את יעקב, ומדוע אמרה רבקה שתשכל את שניהם?", "answer": "אם יקום עשו על יעקב ויעקב יהרגנו, יעמדו בניו של עשו ויהרגו את יעקב.", "kp": ["אם יקום עליך ואתה תהרגנו", "יעמדו בניו ויהרגוך"]}, {"q": "מָה נִיבְּאָה רִבְקָה בַּמִּילִּים \"יוֹם אֶחָד\"?", "options": ["שֶׁשְּׁנֵי בָּנֶיהָ יָמוּתוּ בְּיוֹם אֶחָד", "שֶׁיַּעֲקֹב יָשׁוּב לְבֵיתוֹ בְּיוֹם אֶחָד", "שֶׁעֵשָׂו יִשְׁכַּח אֶת כַּעְסוֹ בְּיוֹם אֶחָד"], "kasha": "מדוע הוסיפה רבקה את המילים \"יום אחד\"?", "answer": "רוח הקודש נזרקה בה ונתנבאה שביום אחד ימותו, כמו שמפורש בפרק המקנא לאשתו.", "kp": ["ונתנבאה שביום א' ימותו"]}]}, {"id": "27:46.1", "ch": 27, "v": 46, "n": 1, "dh": "קצתי בחיי", "pasuk_html": "וַתֹּ֤אמֶר רִבְקָה֙ אֶל־יִצְחָ֔ק <mark>קַ֣צְתִּי בְחַיַּ֔י</mark> מִפְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם־לֹקֵ֣חַ יַ֠עֲקֹ֠ב אִשָּׁ֨ה מִבְּנֽוֹת־חֵ֤ת כָּאֵ֙לֶּה֙ מִבְּנ֣וֹת הָאָ֔רֶץ לָ֥מָּה לִּ֖י חַיִּֽים׃", "pasuk_en": "רִבְקָה אָמְרָה לְיִצְחָק: קָצִיתִי בְחַיַּי מִפְּנֵי בְנוֹת חֵת. אִם יִשְׂמוֹר יַעֲקֹב אִשָּׁה מִבְּנוֹת חֵת כָּאֵלֶּה מִבְּנוֹת הָאָרֶץ לָמָּה לִּי חַיִּים?", "rashi_he": "קצתי בחיי. מָאַסְתִּי בְחַיַּי:", "rashi_en": "רבקה אמרה ליצחק שמאסה בחייה בגלל בנות חת.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"קַצְתִּי בְחַיַּי\" לְפִי רַשִׁ״י?", "options": ["מָאַסְתִּי בְּחַיַּי", "קִיצַּרְתִּי אֶת חַיַּי", "הִגַּעְתִּי לְקֵץ חַיַּי"], "kasha": "המילה \"קצתי\" יכולה להתפרש בכמה אופנים, ולא ברור מה כוונתה כאן.", "answer": "קצתי פירושו מאסתי.", "kp": ["מאסתי בחיי"]}]}, {"id": "28:2.1", "ch": 28, "v": 2, "n": 1, "dh": "פדנה", "pasuk_html": "ק֥וּם לֵךְ֙ <mark>פַּדֶּ֣נָֽה</mark> אֲרָ֔ם בֵּ֥יתָה בְתוּאֵ֖ל אֲבִ֣י אִמֶּ֑ךָ וְקַח־לְךָ֤ מִשָּׁם֙ אִשָּׁ֔ה מִבְּנ֥וֹת לָבָ֖ן אֲחִ֥י אִמֶּֽךָ׃", "pasuk_en": "קוּם לֵךְ פַּדְנָה אֲרָם בֵּיתָה בְתוּאֵל אֲבִי אִמְּךָ וְקַח לְךָ אִשָּׁה מִשָּׁם מִבְּנוֹת לָבָן אֲחִי אִמְּךָ", "rashi_he": "פדנה. כְּמוֹ לְפַדָּן:", "rashi_en": "\"פדנה\" פירושו \"לפדן\" – אל פדן ארם. הה״א בסוף המילה באה במקום למ״ד בתחילתה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"פַּדֶּנָה\" לְפִי רַשִׁ״י?", "options": ["לְפַדָּן – אֶל פַּדַּן אֲרָם", "בְּפַדָּן – בְּתוֹךְ פַּדַּן אֲרָם", "מִפַּדָּן – מִן פַּדַּן אֲרָם"], "kasha": "לא ברור מה תפקידה של הה״א בסוף המילה \"פדנה\".", "answer": "פדנה כמו לפדן.", "kp": ["כמו לפדן"]}]}, {"id": "28:2.2", "ch": 28, "v": 2, "n": 2, "dh": "ביתה בתואל", "pasuk_html": "ק֥וּם לֵךְ֙ פַּדֶּ֣נָֽה אֲרָ֔ם <mark>בֵּ֥יתָה בְתוּאֵ֖ל</mark> אֲבִ֣י אִמֶּ֑ךָ וְקַח־לְךָ֤ מִשָּׁם֙ אִשָּׁ֔ה מִבְּנ֥וֹת לָבָ֖ן אֲחִ֥י אִמֶּֽךָ׃", "pasuk_en": "קוּם לֵךְ פַּדְנָה אֲרָם בֵּיתָה בְתוּאֵל אֲבִי אִמְּךָ וְקַח לְךָ אִשָּׁה מִשָּׁם מִבְּנוֹת לָבָן אֲחִי אִמְּךָ", "rashi_he": "ביתה בתואל. לְבֵית בְּתוּאֵל, כָּל תֵּבָה שֶׁצְּרִיכָה לָמֶ\"ד בִּתְחִלָּתָהּ הֵטִיל לָהּ הֵ\"א בְּסוֹפָהּ (יבמות י\"ג):", "rashi_en": "\"ביתה בתואל\" פירושו \"לבית בתואל\". כל מילה שצריכה למ״ד בתחילתה, אפשר להוסיף לה ה״א בסופה במקומה.", "note": "", "points": [{"q": "מָה תַּפְקִידָהּ שֶׁל הַהֵ״א בְּסוֹף הַמִּילָה \"בֵּיתָה\"?", "options": ["בִּמְקוֹם לָמֶ״ד בִּתְחִילַּת הַמִּילָּה – לְבֵית בְּתוּאֵל", "כִּינּוּי לִנְקֵבָה – הַבַּיִת שֶׁל רִבְקָה אִמּוֹ", "לְשׁוֹן שַׁיָּיכוּת – הַבַּיִת שֶׁשַּׁיָּיךְ לִבְתוּאֵל"], "kasha": "\"ביתה\" נשמע כמו \"הבית שלה\", ואין זה מתאים להקשר.", "answer": "ביתה בתואל – לבית בתואל; כל תיבה שצריכה למ״ד בתחילתה, הטיל לה ה״א בסופה.", "kp": ["לבית בתואל", "הטיל לה ה\"א בסופה"]}]}, {"id": "28:3.1", "ch": 28, "v": 3, "n": 1, "dh": "ואל שדי", "pasuk_html": "<mark>וְאֵ֤ל שַׁדַּי֙</mark> יְבָרֵ֣ךְ אֹֽתְךָ֔ וְיַפְרְךָ֖ וְיַרְבֶּ֑ךָ וְהָיִ֖יתָ לִקְהַ֥ל עַמִּֽים׃", "pasuk_en": "וַיֹּאמֶר לוֹ אֱלֹהִים אֲנִי אֵל שַׁדַּי פְּרֵה וּרְבֵה גוֹיִם וּמְלוּכִים מִמְּךָ יִשּׁוּ", "rashi_he": "ואל שדי. מִי שֶׁדַּי בְּבִרְכוֹתָיו לַמִּתְבָּרְכִין מִפִּיו, יברך אותך:", "rashi_en": "יצחק מברך את יעקב בשם \"אל שדי\" – מי שיש די בברכותיו לכל המתברכים מפיו, הוא יברך אותך.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַשֵּׁם \"שַׁדַּי\" בַּבְּרָכָה זוֹ לְפִי רש״י?", "options": ["מִי שֶׁיֵּשׁ דַּי בִּבְרָכוֹתָיו לַמִּתְבָּרְכִים מִפִּיו", "מִי שֶׁשּׁוֹלֵט בְּכָל כּוֹחוֹת הַטֶּבַע וְהַשָּׁמַיִם", "מִי שֶׁמְּשַׁדֵּד וּמְכַלֶּה אֶת כָּל אוֹיְבָיו"], "kasha": "מדוע הזכיר יצחק דווקא את השם \"אל שדי\" כשבירך את יעקב?", "answer": "מי שדי בברכותיו למתברכין מפיו – הוא יברך אותך.", "kp": ["מי שדי בברכותיו למתברכין מפיו"]}]}, {"id": "28:4.1", "ch": 28, "v": 4, "n": 1, "dh": "את ברכת אברהם", "pasuk_html": "וְיִֽתֶּן־לְךָ֙ <mark>אֶת־בִּרְכַּ֣ת אַבְרָהָ֔ם</mark> לְךָ֖ וּלְזַרְעֲךָ֣ אִתָּ֑ךְ לְרִשְׁתְּךָ֙ אֶת־אֶ֣רֶץ מְגֻרֶ֔יךָ אֲשֶׁר־נָתַ֥ן אֱלֹהִ֖ים לְאַבְרָהָֽם׃", "pasuk_en": "וְאֶת בִּרְכַּת אַבְרָהָם תִּשְׁמוֹר לְךָ וּלְזַרְעֲךָ אִתְּךָ לָרֶשֶׁת אֶת אֶרֶץ מְגוּרֶיךָ אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם", "rashi_he": "את ברכת אברהם. שֶׁאָמַר לוֹ וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וְהִתְבָּרְכוּ בְזַרְעֲךָ יִהְיוּ אוֹתָן בְּרָכוֹת אֲמוּרוֹת בִּשְׁבִילְךָ – מִמְּךָ יֵצֵא אוֹתוֹ הַגּוֹי וְאוֹתוֹ הַזֶּרַע הַמְבֹרָךְ:", "rashi_en": "יצחק מברך את יעקב שהברכות שנאמרו לאברהם – \"ואעשך לגוי גדול\" ו\"והתברכו בזרעך\" – יתקיימו בו, וממנו יצא הגוי הגדול והזרע המבורך.", "note": "", "points": [{"q": "לְאֵיזוֹ בְּרָכָה שֶׁל אַבְרָהָם מִתְכַּוֵּון יִצְחָק?", "options": ["\"וַאֲעֶשְׂךָ לְגוֹי גָּדוֹל\" ו\"וְהִתְבָּרְכוּ בְזַרְעֶךָ\" – שֶׁיִּתְקַיְּימוּ בְּיַעֲקֹב", "בִּרְכַּת הָעוֹשֶׁר וְהַנְּכָסִים הָרַבִּים שֶׁהָיוּ לְאַבְרָהָם", "בִּרְכַּת אֲרִיכוּת הַיָּמִים וְהַשֵּׂיבָה הַטּוֹבָה שֶׁל אַבְרָהָם"], "kasha": "לא ברור איזו ברכה מסוימת של אברהם מעביר יצחק ליעקב.", "answer": "הברכות \"ואעשך לגוי גדול\" ו\"והתברכו בזרעך\" יהיו אמורות בשבילך – ממך יצא אותו הגוי ואותו הזרע המבורך.", "kp": ["ואעשך לגוי גדול", "והתברכו בזרעך"]}]}, {"id": "28:5.1", "ch": 28, "v": 5, "n": 1, "dh": "אם יעקב ועשו", "pasuk_html": "וַיִּשְׁלַ֤ח יִצְחָק֙ אֶֽת־יַעֲקֹ֔ב וַיֵּ֖לֶךְ פַּדֶּ֣נָֽה אֲרָ֑ם אֶל־לָבָ֤ן בֶּן־בְּתוּאֵל֙ הָֽאֲרַמִּ֔י אֲחִ֣י רִבְקָ֔ה <mark>אֵ֥ם יַעֲקֹ֖ב וְעֵשָֽׂו׃</mark>", "pasuk_en": "וַיִּשְׁלַח יִצְחָק אֶת יַעֲקֹב וַיֵּלֶךְ לְפַדַּן אָרָם אֶל לָבָן בֶּן בְּתוּאֵל הָאֲרַמִּי אֲחִי רִבְקָה אֵם יַעֲקֹב וְעֵשָׂו.", "rashi_he": "אם יעקב ועשו. אֵינִי יוֹדֵעַ מַה מְּלַמְּדֵנוּ:", "rashi_en": "רש״י אומר שאינו יודע מה מלמדות אותנו המילים \"אם יעקב ועשו\", שהרי כבר ידוע שרבקה היא אמם.", "note": "", "points": [{"q": "מָה אוֹמֵר רַשִׁ״י עַל הַמִּילִים \"אֵם יַעֲקֹב וְעֵשָׂו\"?", "options": ["שֶׁאֵינוֹ יוֹדֵעַ מָה הֵן מְלַמְּדוֹת", "שֶׁהֵן מְלַמְּדוֹת שֶׁרִבְקָה אָהֲבָה אֶת שְׁנֵיהֶם", "שֶׁהֵן מְלַמְּדוֹת שֶׁעֵשָׂו הָיָה הַבְּכוֹר"], "kasha": "כבר ידוע שרבקה היא אמם של יעקב ועשו, ומה מוסיף הכתוב?", "answer": "רש״י אומר: \"איני יודע מה מלמדנו\".", "kp": ["איני יודע מה מלמדנו"]}]}, {"id": "28:7.1", "ch": 28, "v": 7, "n": 1, "dh": "וישמע יעקב", "pasuk_html": "<mark>וַיִּשְׁמַ֣ע יַעֲקֹ֔ב</mark> אֶל־אָבִ֖יו וְאֶל־אִמּ֑וֹ וַיֵּ֖לֶךְ פַּדֶּ֥נָֽה אֲרָֽם׃", "pasuk_en": "וַיִּשְׁמַע יַעֲקֹב אֶל אָבִיו וְאֶל אִמּוֹ וַיֵּלֶךְ לְפַדַּן אָרָם.", "rashi_he": "וישמע יעקב. מְחֻבָּר לָעִנְיָן שֶׁל מַעְלָה, וַיַּרְא עֵשָׂו כִּי בֵרַךְ יִצְחָק וְגוֹ' וְכִי שִׁלַּח אוֹתוֹ פַּדֶּנָה אֲרָם, וְכִי שָׁמַע יַעֲקֹב אֶל אָבִיו וְהָלַךְ פַּדֶּנָה אֲרָם, וְכִי רָעוֹת בְּנוֹת כְּנַעַן, וְהָלַךְ גַּם הוּא אֶל יִשְׁמָעֵאל:", "rashi_en": "הפסוק מחובר לעניין שלפניו: עשו ראה שיצחק בירך את יעקב ושלחו לפדן ארם, ושיעקב שמע לאביו ולאמו והלך, ושבנות כנען רעות בעיני אביו – ולכן הלך גם הוא אל ישמעאל.", "note": "", "points": [{"q": "מַדּוּעַ נִכְתַּב כָּאן שֶׁיַּעֲקֹב שָׁמַע לְאָבִיו וּלְאִמּוֹ וְהָלַךְ?", "options": ["זֶה חֵלֶק מִמָּה שֶׁרָאָה עֵשָׂו, וּלְכֵן הָלַךְ גַּם הוּא אֶל יִשְׁמָעֵאל", "כְּדֵי לְלַמֵּד שֶׁיַּעֲקֹב יָצָא לְחָרָן בְּלִי רְשׁוּת מֵאִמּוֹ", "כְּדֵי לְהוֹדִיעַ שֶׁיַּעֲקֹב יָצָא לְדַרְכּוֹ מִיָּד בְּאוֹתוֹ הַיּוֹם"], "kasha": "הפסוק נראה כחזרה מיותרת באמצע הסיפור על עשו.", "answer": "הפסוק מחובר לעניין שלמעלה: עשו ראה שבירך יצחק את יעקב, ששלחו לפדן ארם, שיעקב שמע לאביו והלך, ושרעות בנות כנען – והלך גם הוא אל ישמעאל.", "kp": ["מחבר לענין של מעלה", "והלך גם הוא אל ישמעאל"]}]}, {"id": "28:9.1", "ch": 28, "v": 9, "n": 1, "dh": "אחות נביות", "pasuk_html": "וַיֵּ֥לֶךְ עֵשָׂ֖ו אֶל־יִשְׁמָעֵ֑אל וַיִּקַּ֡ח אֶֽת־מָחֲלַ֣ת&thinsp;׀ בַּת־יִשְׁמָעֵ֨אל בֶּן־אַבְרָהָ֜ם <mark>אֲח֧וֹת נְבָי֛וֹת</mark> עַל־נָשָׁ֖יו ל֥וֹ לְאִשָּֽׁה׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "וַיִּשְׁמַע יַעֲקֹב אֶל אָבִיו וְאֶל אִמּוֹ וַיֵּלֶךְ לְפַדַּן אָרָם.", "rashi_he": "אחות נביות. מִמַּשְׁמָע שֶׁנֶּאֱמַר בַּת יִשְׁמָעֵאל אֵינִי יוֹדֵעַ שֶׁהִיא אֲחוֹת נְבָיוֹת? אֶלָּא לָמַדְנוּ שֶׁמֵּת יִשְׁמָעֵאל מִשֶּׁיְּעָדָהּ לְעֵשָׂו קֹדֶם נִשּׂוּאֶיהָ וְהִשִּׂיאָהּ נְבָיוֹת אָחִיהָ, וְלָמַדְנוּ שֶׁהָיָה יַעֲקֹב בְּאוֹתוֹ הַפֶּרֶק בֶּן ס\"ג שָׁנִים, שֶׁהֲרֵי יִשְׁמָעֵאל בֶּן ע\"ד שָׁנִים הָיָה כְּשֶׁנּוֹלַד יַעֲקֹב, י\"ד שָׁנָה הָיָה גָדוֹל יִשְׁמָעֵאל מִיִּצְחָק, וְיִצְחָק בֶּן ס' שָׁנָה בְּלֶדֶת אוֹתָם הֲרֵי ע\"ד, וּשְׁנוֹתָיו הָיוּ קל\"ז, שֶׁנֶּאֱמַר וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל וְגוֹ', נִמְצָא יַעֲקֹב כְּשֶׁמֵּת יִשְׁמָעֵאל בֶּן ס\"ג שָׁנִים הָיָה, וְלָמַדְנוּ מִכָּאן שֶׁנִּטְמַן בְּבֵית עֵבֶר י\"ד שָׁנָה וְאַחַר כָּךְ ה
