ut those that will be born from now on, ‘These were here from the beginning,’ And, furthermore, that you may not say to me ‘It was because of the speckled and spotted males that the females gave birth in their [the males’] likeness from this point on.’”","p":[{"q":"According to Rashi, which sheep and goats would be Yaakov's wages?","o":["Only those born from now on that are speckled, spotted, and dark","All the speckled and spotted ones now in the flock","All the flock born during the years he would work for Lavan"]},{"q":"Why did Yaakov ask to set apart the existing spotted animals and hand them to Lavan's sons?","o":["So that Lavan could not claim they were there before or that the males caused it","So that Lavan's sons would also profit from the deal","Because they were sick and unfit for grazing"]}]},"30:33.1":{"e":"Yaakov said: if you suspect that I took anything from you, my righteousness will testify against me, for you will find in my flock only speckled and spotted animals; and anything you find that is not like that is known to have been stolen from you.","pe":"My righteousness shall testify for me in the future when it comes before you regarding my wage. Any goat which is not speckled or spotted, and any sheep that is [not] dark, is stolen [if it is] in my possession.","re":"Shall testify, etc. “If you suspect that I am taking anything of yours, then my righteousness will testify for me—for my righteousness will come and testify before you concerning my wages—that you will not find in my flock anything but speckled and spotted [animals]. Any that you may find among them [any] that is not speckled or spotted or dark brown—it will be obvious that I have stolen it from you—and it is through theft that it is in my possession.","p":[{"q":"What will Yaakov's \"tzidkasi\" (righteousness) testify to, according to Rashi?","o":["That his flock has only speckled and spotted animals, and he took nothing of Lavan's","That he served Lavan faithfully all the years","That Lavan's flock increased because of him"]}]},"30:34.1":{"e":"\"Hen\" is an expression of accepting words: Lavan agrees to Yaakov's proposal.","pe":"Lavan said, Agreed, may it be as you say.","re":"Agreed. A term indicating acceptance of terms.","p":[{"q":"What does the word \"hen\" mean in Lavan's words?","o":["An expression of accepting words: agreement to Yaakov's proposal","An expression of \"behold\": pointing to the flock in front of him","An expression of doubt: perhaps it will be as you say"]}]},"30:34.2":{"e":"Lavan said: I wish you would want this and not go back on it.","pe":"Lavan said, Agreed, may it be as you say.","re":"May it be as you say. [Meaning:] “If only you remain satisfied with this!.”","p":[{"q":"What did Lavan mean by saying \"lu yehi kidvarecha\"?","o":["I wish you would want this and stay satisfied","I agree only if you work another seven years","I fear this deal will harm me"]}]},"30:35.1":{"e":"It was Lavan who removed the ringed and spotted animals on that day.","pe":"That day he [Lavan] removed the he-goats that were ringed and spotted, and all the she-goats that were speckled and spotted, everyone that had white in it, and all the dark ones among the sheep; and he gave them to his sons.","re":"He removed. [I.e.,] Lavan [removed] on that day, etc.","p":[{"q":"Who removed the ringed and spotted he-goats?","o":["Lavan","Yaakov","Lavan's sons"]}]},"30:35.2":{"e":"\"Teishim\" are male goats.","pe":"That day he [Lavan] removed the he-goats that were ringed and spotted, and all the she-goats that were speckled and spotted, everyone that had white in it, and all the dark ones among the sheep; and he gave them to his sons.","re":"The he-goats. [תְּיָשִים are] male goats.","p":[{"q":"What are \"hatteishim\"?","o":["Male goats","Male sheep","Young goats"]}]},"30:35.3":{"e":"\"Kol asher lavan bo\" means any animal that had a white patch on it.","pe":"That day he [Lavan] removed the he-goats that were ringed and spotted, and all the she-goats that were speckled and spotted, everyone that had white in it, and all the dark ones among the sheep; and he gave them to his sons.","re":"Everyone that had white in it. [I.e.,] all those that had white spots.","p":[{"q":"What does \"kol asher lavan bo\" mean?","o":["Any animal that had a white patch","Any animal that was completely white","All the flock that belonged to Lavan"]}]},"30:35.4":{"e":"The one who placed the flock in his sons' hands was Lavan.","pe":"That day he [Lavan] removed the he-goats that were ringed and spotted, and all the she-goats that were speckled and spotted, everyone that had white in it, and all the dark ones among the sheep; and he gave them to his sons.","re":"And he gave them. [I.e.,] Lavan [gave] to his sons.","p":[{"q":"According to Rashi, who placed the flock in the hands of his sons?","o":["Lavan","Yaakov","Rachel and Leah"]}]},"30:36.1":{"e":"Lavan handed Yaakov to tend only the inferior flock: the sick and the barren, which were mere leftovers.","pe":"He placed a three days journey between himself and Yaakov. Yaakov tended Lavan’s remaining flocks.","re":"Remaining. [Meaning:] the defective ones among them, the sick ones and the barren ones which were only the residue. Those were the ones that he gave him.","p":[{"q":"What is the meaning of \"the remaining\" flock that Lavan handed over to Yaakov?","o":["The inferior flock: the sick and the barren","The flock that remained after Yaakov took his wages","The flock that stayed home and did not go out to graze"]}]},"30:37.1":{"e":"\"Livneh\" is the name of a tree, as in \"under oak and livneh.\" Rashi says it is the tree called trinbal\"a in the vernacular, which is white.","pe":"Yaakov took rods of poplar that were fresh, hazel and chestnut [trees], and peeled white stripes in them by uncovering the white which is in the rods.","re":"Rod[s] of poplar. It is a tree called לִבְנֶה as it states: “Under oaks and לִבְנֶה .” And I say that it is the one called tremble in Old French, which is white.","p":[{"q":"What is the meaning of \"maklel livneh\"?","o":["A rod from a tree named livneh, a white tree","A rod whose color is white because he peeled it","A rod he cut at night by the light of the moon"]}]},"30:37.2":{"e":"\"Lach\" means the rod was moist, still fresh.","pe":"Yaakov took rods of poplar that were fresh, hazel and chestnut [trees], and peeled white stripes in them by uncovering the white which is in the rods.","re":"Fresh. When it was moist.","p":[{"q":"What does \"lach\" mean in the verse?","o":["That the rod was moist and still fresh","The name of another tree, like livneh and luz","That the rod was thin and small"]}]},"30:37.3":{"e":"Yaakov also took a rod of the luz tree, a tree on which small nuts grow.","pe":"Yaakov took rods of poplar that were fresh, hazel and chestnut [trees], and peeled white stripes in them by uncovering the white which is in the rods.","re":"Hazel. He also took a stick from לוּז —a tree which grows small nuts, called coldre in Old French.","p":[{"q":"What is the \"luz\" tree according to Rashi?","o":["A tree on which small nuts grow","A tree with especially white bark","A tree on which large chestnuts grow"]}]},"30:37.4":{"e":"Armon is the chestnut tree, called kashtani\"r in the vernacular.","pe":"Yaakov took rods of poplar that were fresh, hazel and chestnut [trees], and peeled white stripes in them by uncovering the white which is in the rods.","re":"Chestnut. Chestenier in Old French.","p":[{"q":"What is \"armon\" according to Rashi?","o":["The chestnut tree, kashtani\"r in the vernacular","The willow tree","The oak tree"]}]},"30:37.5":{"e":"\"Petzalot\" are strips peeled at intervals, which Yaakov made on the rods so they would look speckled.","pe":"Yaakov took rods of poplar that were fresh, hazel and chestnut [trees], and peeled white stripes in them by uncovering the white which is in the rods.","re":"Stripes. Peeled at intervals which gave it a striped appearance.","p":[{"q":"What were the \"petzalot\" that Yaakov made on the rods?","o":["Strips peeled at intervals, which made the rod look speckled","Deep grooves along the whole length of the rod","Small branches that he trimmed from the rods"]}]},"30:37.6":{"e":"\"Machsof halavan\" is the uncovering of the white of the rod: when Yaakov peeled off the bark, the rod's white showed at the peeled spot.","pe":"Yaakov took rods of poplar that were fresh, hazel and chestnut [trees], and peeled white stripes in them by uncovering the white which is in the rods.","re":"By uncovering the white. The uncovered white part of the sticks. When he peeled it there became uncovered and visible its white area where it was peeled.","p":[{"q":"What is the \"machsof halavan\" that Yaakov made on the rods?","o":["Uncovering the white of the rod where he peeled","White paint he smeared on the rods","White branches that grew on the rods"]}]},"30:38.1":{"e":"\"Vayatzeg\" is translated \"vedaitz,\" which in Aramaic means inserting and sticking in, and this is found often in the Talmud: \"datza ushalfa.\"","pe":"He stuck the rods that he had peeled into the ducts of the watering troughs where the flock [ewes] came to drink, facing the flock [rams]; that they should become heated when they came to drink.","re":"He stuck. Onkelos translates it וְדָעִיץ, meaning inserting and piercing in Aramaic. It occurs often in the Talmud: דָצָהּ וּשְׁלָפָהּ —he inserted it and pulled it out, דֵָּץ בֵּיה מִידֵּי —he inserted something into it. the word דָּצָהּ is the same as דְּעָצָהּ but just a shortened version.","p":[{"q":"What does \"vayatzeg\" mean according to Rashi?","o":["He inserted and stuck the rods in","He gently laid the rods on the water","He tied the rods to one another"]}]},"30:38.2":{"e":"\"Rehatim\" are channels in which water runs, pools made in the ground to water the flock there.","pe":"He stuck the rods that he had peeled into the ducts of the watering troughs where the flock [ewes] came to drink, facing the flock [rams]; that they should become heated when they came to drink.","re":"In the ducts. [Meaning:] where the water was running in the channels made in the ground where the sheep are made to drink.","p":[{"q":"What are the \"rehatim\" in which Yaakov placed the rods?","o":["Water channels made in the ground for watering the flock","Small vessels from which the flock is fed","Wooden fences surrounding the grazing place"]}]},"30:38.3":{"e":"In the troughs to which the flock would come to drink, there Yaakov placed the rods in front of the flock.","pe":"He stuck the rods that he had peeled into the ducts of the watering troughs where the flock [ewes] came to drink, facing the flock [rams]; that they should become heated when they came to drink.","re":"Where the sheep came, etc. In the ducts where the sheep came to drink, there he set up the sticks opposite the sheep.","p":[{"q":"Where exactly did Yaakov place the rods?","o":["In the troughs where the flock came to drink, facing the flock","At the entrance of the pen where the flock spent the night","In the grazing field, along the road to the well"]}]},"30:38.4":{"e":"The animal saw the rods and recoiled backward, the male mated with her, and she gave birth to young like the rods. Rabbi Hoshaya says the water turned into seed in their wombs, and they did not need a male.","pe":"He stuck the rods that he had peeled into the ducts of the watering troughs where the flock [ewes] came to drink, facing the flock [rams]; that they should become heated when they came to drink.","re":"That they should become heated. The [female] animal would see the sticks and be startled backwards whereupon the male would couple with her and she would give birth to something similar. R. Hoshaya says: The water [miraculously] became sperm in their wombs and they did not require a male. That is the intent of the word וַיֵּחַמְנָה, etc.","p":[{"q":"According to the first explanation in Rashi, how did the rods cause young that resembled them?","o":["The animal recoiled from the rods, the male mated with her, and she bore similar young","Yaakov dyed the flock to look like the rods","The rods changed the taste of the water and the color of the flock"]},{"q":"What does Rabbi Hoshaya add in explaining \"vayechamna\"?","o":["The water turned into seed in their wombs, and they did not need a male","The males became heated from the water and therefore mated","Only the strong animals drank the water and became pregnant"]}]},"30:39.1":{"e":"The flock conceived while looking at the appearance of the rods.","pe":"The flock became heated [and mated] before the rods, and the flock gave birth to ringed, speckled and spotted [offspring].","re":"Before the rods. [Meaning:] to the appearance of the sticks.","p":[{"q":"What does it mean that the flock conceived \"el hamakkelot\" according to Rashi?","o":["The flock conceived when they saw the appearance of the rods","The flock conceived when they touched the rods","The flock conceived when they ate from the leaves of the rods"]}]},"30:39.2":{"e":"\"Akudim\" are animals whose color differs at the place where they are tied, that is, at the ankles of their forelegs and hind legs.","pe":"The flock became heated [and mated] before the rods, and the flock gave birth to ringed, speckled and spotted [offspring].","re":"Ringed. They were different at the place they are bound, which is the ankles of their forelegs and hindlegs.","p":[{"q":"What does \"akudim\" mean according to Rashi?","o":["Different in color at the ankles of the forelegs and hind legs","Marked with small dots all over the body","Having large white patches on the back"]}]},"30:40.1":{"e":"Yaakov separated those born ringed and spotted and made them into separate flocks. Then he led the ringed flock in front of the flock, so that the flock following behind looked at them. This is the meaning of \"vayiten penei hatzon el akod.\"","pe":"Yaakov separated the lambs. He set the faces of the flock toward the ringed ones and all the dark ones; [he did so] with Lavan’s flocks. He formed separate flocks of his own, and did not set them with Lavan’s flocks.","re":"Yaakov separated the lambs. Those that were born spotted and speckled he separated and set them apart for themselves and made them into separate flocks. He then passed the spotted flock in front of the flock whereby the face of the flock that followed behind them would be looking at them. This is meant by what is said: “He set the faces of the flock toward the ringed ones,” so that the flock faced the spotted and towards all the brown ones that he found among Lavan’s flock.","p":[{"q":"What did Yaakov do with the sheep that were born ringed and spotted?","o":["Separated them into a separate flock and led them in front of the flock","Hid them behind the flock so that Lavan would not see","Sold them immediately to enrich himself"]},{"q":"What does \"vayiten penei hatzon el akod\" mean?","o":["The flock walking behind looked at the ringed ones in front of it","Yaakov placed the rods in front of the flock","Yaakov marked the faces of the flock with ringed marks"]}]},"30:40.2":{"e":"Rashi refers to what he explained above: Yaakov separated those born ringed and spotted and made them into flocks for himself.","pe":"Yaakov separated the lambs. He set the faces of the flock toward the ringed ones and all the dark ones; [he did so] with Lavan’s flocks. He formed separate flocks of his own, and did not set them with Lavan’s flocks.","re":"He formed flocks of his own. As I have [previously] explained.","p":[{"q":"What are the flocks that Yaakov made \"for himself\" alone?","o":["Those born ringed and spotted, which he separated for himself","Flocks he bought with money outside Lavan's house","Sheep he took from Lavan without his permission"]}]},"30:41.1":{"e":"According to Onkelos, \"hamkushshorot\" are the early ones (those that conceive quickly), but there is no proof from Scripture. Menachem interprets it from the root of kesher (binding): those that bind together to hasten their conception.","pe":"When the early-bearing flock were heated [to mate], Yaakov placed the rods before the flock’s eyes at the ducts, so they would be in heat among the rods.","re":"Stronger. As Onkelos translates it [מְבַכְּרָתָה]—the early bearing ones. However, I have no evidence in Scripture. Menachem relates it to, “Achitofel is among the [קוֹשְׁרִים] conspirators, [and] “The conspiracy [קֶשֶׁר] was strong.” [Here it would mean] those [animals] who mated together in order to hurry their conceiving.","p":[{"q":"What does \"hamkushshorot\" mean according to Menachem?","o":["Those that bind together to hasten their conception","Sheep tied with a rope to the trough","The weak and late sheep"]}]},"30:42.1":{"e":"According to Onkelos, \"ha'atif\" is an expression of lateness: the late flock. Menachem interprets it from wrapping a garment: the flock wrap themselves in their skin and wool and do not desire to mate with the males.","pe":"But when the flock were late-bearing, he did not place [the rods before them]. Thus the late-bearing ones were Lavan’s, and the early-bearing ones became the possession of Yaakov.","re":"But when they [the flock] were late-bearing. A term meaning being late as Onkelos translates it: וּבְלַקִּישׁוּת. Menachem relates it to הַמַחֲלָצוֹת וְהַמַעֲטָפוֹת meaning, the wrapping oneself in a garment; here meaning, they are wrapped in their skin and wool and have no desire to be warmed by the males.","p":[{"q":"What does \"uvehaatif hatzon\" mean according to Onkelos?","o":["An expression of lateness: sheep that mate late","An expression of wrapping: sheep covered with a lot of wool","An expression of weakness: sheep that were hungry on the way"]},{"q":"How does Menachem explain the word \"ha'atif\"?","o":["They wrap themselves in their skin and wool and do not desire the males","They delay giving birth until the end of the season","They become weak and cannot give birth at all"]}]},"30:43.1":{"e":"\"Rabbot\" does not mean only many sheep, but sheep that are more fruitful and multiply more than other sheep.","pe":"The man became tremendously prosperous. He had multipying flocks, female slaves and male slaves, camels and donkeys.","re":"Multiplying flocks. [רַבוֹת means] that are fruitful and multiply more than other flock.","p":[{"q":"What does \"tzon rabbot\" mean according to Rashi?","o":["Sheep that are more fruitful and multiply more than other sheep","Flocks very large in number","Sheep larger and fatter than all of Lavan's sheep"]}]},"30:43.2":{"e":"Yaakov sold his flock at a high price, and with the money bought for himself maidservants, servants, camels, and donkeys.","pe":"The man became tremendously prosperous. He had multipying flocks, female slaves and male slaves, camels and donkeys.","re":"Female slaves and male slaves. He would sell his flock at a high price and buy for himself all these.","p":[{"q":"How did Yaakov come to have maidservants and servants, when his wages from Lavan were only sheep?","o":["He sold his flock at a high price and bought all these with the money","Lavan gave them to him as an addition to his wages","He received them as a gift from his father's house"]}]},"31:1.1":{"e":"\"Asah\" here means gathered, collected, as in \"vaya'as chayil vayach et Amalek.\"","pe":"He [Yaakov] heard the words of Lavan’s sons [who were] saying, Yaakov has taken all that belonged to our father. From that which was our father’s, he made all this wealth.","re":"He made. [Here meaning:] gathered, as in “He gathered an army and struck Amaleik.”","p":[{"q":"What does \"asah\" mean in the verse according to Rashi?","o":["Gathered and collected all this wealth","Built all these houses","Acquired all this honor in people's eyes"]}]},"31:3.1":{"e":"Hashem told Yaakov to return to the land of his fathers, and there He would be with him. As long as he is connected to the impure Lavan, it is impossible for the Divine Presence to rest upon him.","pe":"Adonoy said to Yaakov, Return to the land of your fathers and to your birthplace, and I will be with you.","re":"Return to the land of your fathers. And there I will be with you. But, while you still associate with someone unclean it is not possible to rest My Divine Presence upon you.","p":[{"q":"Why is \"ve'ehyeh imach\" (I will be with you) dependent on Yaakov's return to the land?","o":["Because as long as he is connected to an impure person, the Divine Presence cannot rest on him","Because outside the land the Holy One does not watch over a person","Because in Charan he had to work without help from above"]}]},"31:4.1":{"e":"The verse mentions Rachel before Leah because Rachel was the mainstay of the home; it was for her that Yaakov joined with Lavan's family. Even Leah's descendants admit this: Boaz and his court, from the tribe of Yehuda, said \"like Rachel and like Leah, who both built...\" and mentioned Rachel first.","pe":"Yaakov sent and called Rochel and Leah to [come to] the field, to his flock.","re":"He called Rochel and Leah. First Rochel and then Leah, for she [Rochel] was the principal wife because it was for her that Yaakov accepted to be related to Lavan. Even Leah’s descendants admit to this for Boaz and his court who were of Yehudah’s tribe say, “Like Rochel and like Leah, who both built, etc.,” placing Rochel ahead of Leah.","p":[{"q":"Why does the verse mention Rachel before Leah?","o":["Rachel was the mainstay of the home, for whom Yaakov joined with Lavan","Rachel was the elder of the two sisters","Rachel was closer to where Yaakov stood"]},{"q":"What is the proof that even Leah's descendants admit that Rachel is the primary one?","o":["Boaz and his court from the tribe of Yehuda said \"like Rachel and like Leah\"","Leah herself called Rachel the mainstay of the home","King David mentioned Rachel first in the book of Tehillim"]}]},"31:7.1":{"e":"A \"moneh\" is not less than ten, so \"asderet manim\" means ten times ten, that is, Lavan changed Yaakov's wages very many times.","pe":"Your father cheated me and changed my wage ten countings; but Elohim did not let him harm me.","re":"Ten countings. [Each] מוֹנִים is no less than ten.","p":[{"q":"What does \"aseret manim\" mean according to Rashi?","o":["Ten \"monim,\" each of which is at least ten","Exactly ten times, no more","Ten kinds of sheep that he exchanged"]}]},"31:7.2":{"e":"\"Manim\" means a sum of tens, so \"aseret manim\" is one hundred. We learn that Lavan changed his terms one hundred times.","pe":"Your father cheated me and changed my wage ten countings; but Elohim did not let him harm me.","re":"Times. Meaning, the sum—the total of counting which are tens. We thus learn that he changed his conditions 100 times.","p":[{"q":"How many times did Lavan change his terms according to Rashi?","o":["One hundred times","Ten times","Twenty times"]}]},"31:10.1":{"e":"Even though Lavan separated all the spotted males so that the flock would not bear young like them, the angels would bring them from the flock handed over to Lavan's sons to the flock in Yaakov's hands.","pe":"At the time the flock were in heat [to mate], I lifted my eyes, and in a dream I saw that the males going upon the flock were ringed, speckled and striped.","re":"That the males. Although Lavan separated all of them so that the flock not conceive their likeness, the angels would bring them from the flock that had been placed in the charge of Lavan’s sons to the flock that was in Yaakov’s charge.","p":[{"q":"How did ringed he-goats mate with Yaakov's flock if Lavan had separated them?","o":["Angels brought them from the flock of Lavan's sons to Yaakov's flock","Yaakov stole them at night from the flock of Lavan's sons","New males were born in Yaakov's flock"]}]},"31:10.2":{"e":"\"Berudim\" as Onkelos translates, \"ufatzichin\": a white thread encircles its body all around, and its patches are open and run from one to the other. Rashi adds that there is no proof for this from Scripture.","pe":"At the time the flock were in heat [to mate], I lifted my eyes, and in a dream I saw that the males going upon the flock were ringed, speckled and striped.","re":"And striped. Onkelos translates it וּפַצִיחִין, peised in Old French. A white strand encircled its body and its spots were open and running through from end to end. I have no support [for this interpretation] from Scripture.","p":[{"q":"What are \"berudim\" according to Rashi?","o":["Sheep with a white thread encircling their body and patches running together","Sheep with small white spots like hail scattered on them","Sheep that are entirely white from head to foot"]}]},"31:13.1":{"e":"\"Ha'el beit el\" means the same as \"el beit el,\" and the heh is superfluous. This is the way of Scripture, as in \"ki atem ba'im el ha'aretz Kenaan.\"","pe":"I am the Almighty of Elohim who appeared to you in Beis Eil, where you anointed a monument, where you made a vow to Me. Now arise and leave this land, and return to the land of your birthplace.","re":"The Almighty of Beis Eil. The same as אֵל בֵּית אֵל the letter ה\"א being superfluous. It is usual for Scripture to speak this way as in “For you are coming to [הָאָרֶץ] the Land of Canaan.","p":[{"q":"How does Rashi explain the phrase \"ha'el beit el\"?","o":["Like \"el beit el\"; the heh is superfluous, and this is the way of Scripture","The God who appeared to you at Beit El; the heh is the definite article","Hashem is called by the name \"Beit El\" after the place"]}]},"31:13.2":{"e":"Anointing is an expression of increase and greatness, as when a king is anointed. So Yaakov poured oil on the pillar so that it would be anointed for an altar.","pe":"I am the Almighty of Elohim who appeared to you in Beis Eil, where you anointed a monument, where you made a vow to Me. Now arise and leave this land, and return to the land of your birthplace.","re":"Where you anointed. Meaning distinction and greatness similar to the anointing of a king. Similarly: “And he poured oil on top of it,” so that it be anointed as an altar.","p":[{"q":"What is the meaning of anointing the pillar according to Rashi?","o":["An expression of greatness, so that it would be anointed for an altar","To mark the place so he could find it","To clean the stone before sleeping on it"]}]},"31:13.3":{"e":"Hashem reminded Yaakov of his vow, which he must fulfill: he said \"yihyeh beit Elokim,\" meaning that he would offer sacrifices there.","pe":"I am the Almighty of Elohim who appeared to you in Beis Eil, where you anointed a monument, where you made a vow to Me. Now arise and leave this land, and return to the land of your birthplace.","re":"You made a vow to Me. And you must fulfill it, for you said that it shall be a House of God, [implying] that you will offer sacrifices there.","p":[{"q":"Why did Hashem remind Yaakov of the vow he made?","o":["So that he would fulfill it and offer sacrifices there","To remind him that Hashem had already fulfilled His promises","So that he would return to Beit El and live there all his days"]}]},"31:14.1":{"e":"Rachel and Leah said to Yaakov: why should we delay you from returning? Do we hope to inherit anything from our father's property when he has sons?","pe":"Rochel and Leah replied and said to him, Do we still have a portion and an inheritance in our father’s house?","re":"Do we still have? Why should we prevent you from returning? Do we have any hope of inheriting anything of the estate of our father, among the males [of his family]?","p":[{"q":"What do Rachel and Leah mean by the question \"ha'od lanu chelek venachala\"?","o":["There is no reason to delay you, since we will not inherit from our father","Our father owes us a share, and we should demand it before we go","Let us stay here, since we still have an inheritance in our father's house"]}]},"31:15.1":{"e":"Even at the time of marriage, when people customarily give a dowry to their daughters, Lavan treated his daughters like foreigners: he gave them nothing, but sold them to Yaakov for his labor.","pe":"Are we not considered by him as strangers? For he has sold us, and has completely consumed our money.","re":"Are we not considered by him as strangers? Even when it is customary for people to give a dowry to their daughters at the time of their marriage he acted toward us as strangers, for he sold us to you as wages for your work.","p":[{"q":"In what way did Lavan treat his daughters like foreigners?","o":["He gave them no dowry, but sold them to Yaakov for his labor","He did not let them speak with Yaakov in his house","He had them live in the field with the flock"]}]},"31:15.2":{"e":"Rachel and Leah said that Lavan \"consumed our money,\" because he withheld Yaakov's wages for his work.","pe":"Are we not considered by him as strangers? For he has sold us, and has completely consumed our money.","re":"Our money. For he withheld the wages for your work.","p":[{"q":"What money did Rachel and Leah mean by \"et kaspenu\"?","o":["Yaakov's wages for his work, which Lavan withheld","The dowry they received from their mother","The money Lavan received from selling the flock"]}]},"31:16.1":{"e":"The word \"ki\" here means \"rather\": we have nothing of our father's, but what Hashem saved from our father is ours.","pe":"All the wealth that Elohim rescued from our father belongs to us and our children. Now, whatever God has said to you, do it.","re":"All the wealth. The word כִּי here is used as but, as if to say: “We have nothing of our father’s [wealth] but that which God salvaged from our father that is what is ours.”","p":[{"q":"What does the word \"ki\" mean in Rachel and Leah's words \"ki kol ha'osher\"?","o":["\"Rather\": we have nothing, except what Hashem saved","\"Because\": because Hashem saved the wealth","\"If\": if Hashem will save the wealth"]}]},"31:16.2":{"e":"\"Hitzil\" means separated. Every expression of rescue in Scripture is an expression of separation, as it separates a person from harm and from the enemy.","pe":"All the wealth that Elohim rescued from our father belongs to us and our children. Now, whatever God has said to you, do it.","re":"Rescued. [הִצִיל] means He separated. Similarly, all terms of הַצָלָה in Scripture has the meaning of separation for he separates him from the evil or from the enemy.","p":[{"q":"What does \"hitzil\" mean in the verse?","o":["Separated: Hashem separated the wealth from our father","Saved: Hashem rescued the wealth from robbers","Granted: Hashem gave us a gift from our father"]}]},"31:17.1":{"e":"Yaakov mentioned the males before the females, whereas Eisav mentioned the females before the males, as it says \"vayikach Eisav et nashav ve'et banav.\"","pe":"Yaakov rose and lifted his sons and his wives upon the camels.","re":"His sons and his wives. He put the males ahead of the females whereas Eisov put the females ahead of the males as it is said: “And Eisov took his wives and sons, etc.”","p":[{"q":"What does the Torah teach by mentioning \"banav\" (his sons) before \"nashav\" (his wives)?","o":["Yaakov put males before females, whereas Eisav put females before males","That the sons were grown and could ride alone","That Yaakov feared Lavan would pursue specifically the sons"]}]},"31:18.1":{"e":"\"Mikneh kinyano\" is what Yaakov bought with his flock: servants, maidservants, camels, and donkeys.","pe":"He led away all his livestock, and all his possessions that he had acquired, which he had purchased with his own livestock that he had acquired in Padan Aram, [in order] to come to Yitzchok, his father, to the land of Canaan.","re":"Which he had purchased with his own livestock. Meaning: that which he had obtained for his sheep: menservants, maidservants, camels and donkeys.","p":[{"q":"What is \"mikneh kinyano\" according to Rashi?","o":["What he bought with his flock: servants, maidservants, camels, and donkeys","The flock that was born to him ringed and spotted","The gifts he received from Lavan for his work"]}]},"31:19.1":{"e":"Lavan went to shear the flock that he had put in his sons' hands, which was three days' distance between him and Yaakov.","pe":"Lavan [meanwhile] had gone to shear his flock, and Rochel stole the idols that belonged to her father.","re":"To shear his flock. [The flock] that he had given to his sons—a distance of three-days’ travel between himself and Yaakov.","p":[{"q":"Which flock did Lavan go to shear according to Rashi?","o":["The flock he gave to his sons, three days away","The flock Yaakov tended for him in the nearby field","Sheep he had just bought in another city"]}]},"31:19.2":{"e":"Rachel stole the teraphim in order to distance her father from idolatry.","pe":"Lavan [meanwhile] had gone to shear his flock, and Rochel stole the idols that belonged to her father.","re":"And Rochel stole the idols. She intended to remove her father from idol-worship.","p":[{"q":"Why did Rachel steal the teraphim?","o":["To separate her father from idolatry","To take them with her and worship them","To receive her share of the inheritance in exchange for them"]}]},"31:22.1":{"e":"Only on the third day was Lavan told that Yaakov had fled, because there was a distance of three days' walk between them.","pe":"Lavan was told on the third day that Yaakov had fled.","re":"On the third day. For there was a distance of three-days’ travel between them.","p":[{"q":"Why was Lavan told only on the third day?","o":["Because there was a distance of three days' journey between them","Because Yaakov fled at night and no one saw him","Because Lavan's sons hid the escape from him"]}]},"31:23.1":{"e":"Lavan's \"brothers\" are his relatives.","pe":"He took his brothers [kinsmen] with him, and pursued him a distance of seven days. He overtook him in Mount Gilod.","re":"His brothers. [Meaning:] his kinsmen.","p":[{"q":"Whom did Lavan take with him when he pursued Yaakov?","o":["His relatives","Only his brothers from his father and mother","His shepherds"]}]},"31:23.2":{"e":"During the three days that the messenger went to tell Lavan, Yaakov kept traveling, so he was six days away from Lavan, and on the seventh day Lavan overtook him. We learn that what Yaakov traveled in seven days, Lavan traveled in one day.","pe":"He took his brothers [kinsmen] with him, and pursued him a distance of seven days. He overtook him in Mount Gilod.","re":"A distance of seven days. The entire three days that it took the messenger to [reach and] tell Lavan, Yaakov continued on his journey. Consequently, Yaakov was six-days’ distance from Lavan. And on the seventh [day] Lavan overtook him. We [can, therefore,] infer that the entire distance that Yaakov traveled in seven days Lavan traveled in one day (as it is said: “He pursued him a distance of seven days,” and it does not say, he pursued him for seven days.)","p":[{"q":"What does Rashi learn from the fact that it says \"derech shiv'at yamim\" and not \"shiv'at yamim\"?","o":["That Lavan covered in one day the distance Yaakov traveled in seven days","That Lavan pursued Yaakov for seven full days","That Yaakov walked slowly so that Lavan would catch him"]}]},"31:24.1":{"e":"Hashem warned Lavan not to speak with Yaakov even good, because all the good of the wicked is evil to the righteous.","pe":"Elohim appeared to Lavan the Aramean, in a dream that night, and said to him, Guard yourself, that you do not speak to Yaakov either good or evil.","re":"Either good or evil. All that is considered good by the wicked is bad as regards to the righteous.","p":[{"q":"Why was Lavan warned even against speaking \"mitov\" (good) with Yaakov?","o":["Because all the good of the wicked is evil to the righteous","Because Hashem did not want Lavan to persuade Yaakov to return","Because kind words from Lavan would arouse Yaakov's suspicion"]}]},"31:26.1":{"e":"Any army that comes to war is called \"cherev,\" and Lavan says that Yaakov led his daughters like captives of an army.","pe":"Lavan said to Yaakov, What have you done? You fooled me, and led my daughters away like prisoners of war.","re":"Like prisoners of war (חָרֶב). An army going to war is called “sword.”","p":[{"q":"What does \"cherev\" mean in the phrase \"keshivyot cherev\"?","o":["An army that comes to war is called \"cherev\"","The weapon used to threaten captives","The destruction and desolation of a conquered city"]}]},"31:27.1":{"e":"Lavan said: you stole my mind, that is, you deceived me.","pe":"Why did you flee so stealthily? You robbed me and did not tell me. I would have sent you away, with joy and with song, with drum and harp.","re":"You robbed me. [Meaning:] you stole my mind, [i.e., you misled me].","p":[{"q":"What does \"vatignov oti\" mean according to Rashi?","o":["You stole my mind and deceived me","You stole my teraphim","You stole my daughters and my flock"]}]},"31:29.1":{"e":"\"El\" here means power: I have the power and strength to do you harm. And every \"El\" that is a holy name is so called because of strength and abundant might.","pe":"It is within the power of my hand to harm you, but the God of your father spoke to me last night saying, Guard yourself not to speak to Yaakov either good or evil.","re":"It is within the power of my hand. [Meaning:] There is strength and power in my hand to do you evil. Everytime אֵל is used to denote a Divine Name it represents strength and great power.","p":[{"q":"What does the word \"El\" mean in Lavan's words according to Rashi?","o":["Power and strength","A name of Hashem: God is my help","Will: it is in my mind and intention"]},{"q":"According to Rashi, why is the Holy One called \"El\"?","o":["Because of strength and abundant might","Because of kindness and mercy","Because of law and judgment"]}]},"31:30.1":{"e":"\"Nichsafta\" means you desired and longed, and this expression is found often in Scripture, as in \"nichsefa vegam calta nafshi.\"","pe":"Now you have gone for you yearned for your father’s house, but why did you steal my gods?","re":"You yearned. [נִכְסַפְתָּה means] you yearned. There are many [such usages] in Scripture. “My soul yearns and even pines,” [or] “You yearn for the work of your hands.”","p":[{"q":"What does the word \"nichsafta\" mean?","o":["You desired and longed","You took money from your father's house","You were embarrassed to ask permission"]}]},"31:31.1":{"e":"Yaakov answered Lavan in the order of his claims, so he began by answering his first claim, \"vatenahem et benotai.\"","pe":"Yaakov replied and said to Lavan, Because I was afraid, for I said you might forcibly take your daughters from me.","re":"Because I was afraid, etc. He answered his first [question] first for he [Lavan] had [first] said to him: “You led my daughters away,” etc.","p":[{"q":"To which of Lavan's claims did Yaakov respond with the words \"ki yareti\"?","o":["To the first claim, \"vatenahem et benotai\"","To the last claim, \"lamah ganavta et elohai\"","To the claim that he did not let him kiss his children"]}]},"31:32.1":{"e":"Yaakov said that whoever stole the teraphim \"lo yichyeh\" (shall not live), and from that curse Rachel died on the way.","pe":"With whomsoever you find your gods, he shall not live. In the presence of our brethren, identify anything belonging to you that is here with me and take it back with you. Yaakov did not know that Rochel had stolen them.","re":"He shall not live. It was due to this curse that Rochel died on the journey.","p":[{"q":"What resulted from Yaakov's words \"lo yichyeh\"?","o":["Rachel died on the way because of the curse","Lavan died shortly afterward","The curse did not take effect at all"]}]},"31:32.2":{"e":"Yaakov told Lavan: recognize what is with me that is yours, and take it.","pe":"With whomsoever you find your gods, he shall not live. In the presence of our brethren, identify anything belonging to you that is here with me and take it back with you. Yaakov did not know that Rochel had stolen them.","re":"Here with me. Of yours.","p":[{"q":"What did Yaakov mean by saying \"hakker lecha mah imadi\"?","o":["Recognize what is with me that is yours","Recognize all the property I have","Recognize who the people traveling with me are"]}]},"31:33.1":{"e":"\"Yaakov's tent\" is Rachel's tent, because Yaakov was always with her. Similarly it says \"the sons of Rachel, Yaakov's wife,\" while for the others \"Yaakov's wife\" is not said.","pe":"Lavan came into Yaakov’s tent, and into Leah’s tent, and into the tents of the two handmaids, but he found nothing. He left Leah’s tent and came into Rochel’s tent.","re":"Into Yaakov’s tent. [אֹהֶל יַעֲקֹב] is the same as the tent of Rochel [It was so called] because Yaakov was constantly with her. This is similar to what is said: “The sons of Rochel, the wife of Yaakov”; whereas by the others it does not say: “The wife of Yaakov.”","p":[{"q":"What is the \"ohel Yaakov\" that Lavan entered?","o":["Rachel's tent, since Yaakov was constantly with her","A special tent that belonged to Yaakov alone","Leah's tent, since she was his first wife"]}]},"31:33.2":{"e":"When Lavan left Leah's tent, he returned to Rachel's tent before searching the maidservants' tent, because he recognized that she was a \"meshamsheit,\" one who touches and feels everything.","pe":"Lavan came into Yaakov’s tent, and into Leah’s tent, and into the tents of the two handmaids, but he found nothing. He left Leah’s tent and came into Rochel’s tent.","re":"And came into Rochel’s tent. When he left Leah’s tent he returned to Rochel’s tent before searching the tent of the two handmaidens. Why [did he bother doing] all this [in Rochel’s tent]? Because he knew her to be one who touches everything.","p":[{"q":"Why did Lavan return to Rachel's tent before searching the maidservants' tent?","o":["Because he recognized that she was a meshamsheit, touching and feeling everything","Because he saw signs there that the teraphim were hidden in it","Because Rachel's tent was the closest to Leah's tent"]}]},"31:34.1":{"e":"\"Kar\" is like cushions and pillows. \"Kar hagamal\" is a saddle-pad made like a cushion, which in the Aramaic translation is \"be'avita digmala.\"","pe":"Rochel had taken the idols, and placed them in the camel’s saddle-pillow, and sat upon them. Lavan searched the whole tent and found nothing.","re":"In the camel’s saddle-pillow. Meaning the same as כָּרִים וּכְסָתוֹת —pillows and mats, as Onkelos translates it בַּעֲבִיטָא דְגַמְלָא —which is a saddlebag made like a pillow. In Eruvin [we find:] “They enclosed it with עֲבִיטִין” which are camels’ saddlebags, bastel in Old French.","p":[{"q":"What is the \"kar hagamal\" according to Rashi?","o":["A saddle-pad made like a cushion on the camel's back","The grazing place where the camel feeds","A sack of grain tied to the camel's side"]}]},"31:36.1":{"e":"\"Dalakta\" means you pursued, as in \"al heharim dalakunu\" and \"midlak acharei Plishtim.\"","pe":"Yaakov was angry and he argued with Lavan. Yaakov replied and said to Lavan, What is my crime? What sin did I commit that you were in such hot pursuit of me?","re":"You were in such hot pursuit. [Meaning:] You pursued, as in “They pursued us upon the mountains,” and as in: “From chasing the Philistines.”","p":[{"q":"What does \"dalakta\" mean according to Rashi?","o":["You pursued after me","You lit a fire behind me","You were angry at me in fury"]}]},"31:37.1":{"e":"\"Veyochichu\" means they will clarify who is in the right in the judgment; in the vernacular, aprobi\"r.","pe":"When you searched all my goods, what did you find of all your household goods? Place it here in the presence of my brethren and your brethren, and let them decide between the two of us.","re":"And let them decide. [Meaning] let them determine who is right, aprover in Old French.","p":[{"q":"What does \"veyochichu bein shenayinu\" mean?","o":["They will clarify with whom the right lies, which of us is correct","They will punish the one who stole from his fellow","They will rebuke both of us for quarreling"]}]},"31:38.1":{"e":"\"Lo shickelu\" means they did not miscarry their young, as in \"rechem meshakkil.\"","pe":"These twenty years that I was with you, your ewes and she-goats never miscarried, and I did not eat any rams of your flocks.","re":"Never miscarried. [Meaning] they have not miscarried, as in, “A miscarrying womb” [or,] “His cow expels [the calf] without miscarrying.”","p":[{"q":"What does \"lo shickelu\" mean?","o":["They did not miscarry their young","They did not die of hunger in the field","They were not torn apart by animals"]}]},"31:38.2":{"e":"From here they learned that even a one-day-old ram is called an \"ayil,\" for if not, what is the praise? That he did not eat rams but did eat sheep? Then he would be a robber.","pe":"These twenty years that I was with you, your ewes and she-goats never miscarried, and I did not eat any rams of your flocks.","re":"Rams of your flocks. From here they [the Sages] derive that [even] a one-day-old ram is called אַיִל because, otherwise, why would this be praiseworthy; [did he mean to say that] he had not eaten rams but lambs he had eaten? If this were the case, then he would be a thief.","p":[{"q":"What did the Sages learn from Yaakov's words \"ve'eilei tzonecha lo achalti\"?","o":["That even a one-day-old ram is called an ayil","That Yaakov ate no meat all twenty years","That a shepherd is permitted to eat from the small sheep"]}]},"31:39.1":{"e":"\"Teirefa\" here is an animal that was torn apart by a lion or wolf.","pe":"I never brought you a mutilated animal. I will take the blame for it. You demanded compensation from my hand whether [an animal] was stolen from me by day or whether it was stolen from me by night.","re":"A mutilated animal. [Mutilated] by a lion or wolf.","p":[{"q":"Which \"teirefa\" does Yaakov mention in his words to Lavan?","o":["An animal torn by a lion or wolf","An animal stolen by thieves at night","An animal that died of disease within the flock"]}]},"31:39.2":{"e":"\"Achatenah\" is from the expression of lacking, as in \"velo yecheta\" and \"chata'im.\" Yaakov said: if an animal was lacking, the loss is on me, for you would demand it from my hand.","pe":"I never brought you a mutilated animal. I will take the blame for it. You demanded compensation from my hand whether [an animal] was stolen from me by day or whether it was stolen from me by night.","re":"I will take the blame for it. Having the same meaning as [יַחֲטִא in the verse]: “Sling stones at a hair’s breadth without missing” [יַחֲטִא] [or:] “I and my son, Shlomo, shall be losers,” [חֲטָאִים] [חֲטָאִים meaning] missing. [Yaakov, in effect was saying:] “I will suffer its loss. If it be missing then I will be the one missing it because you may demand it from me.”","p":[{"q":"What does \"anochi achatenah\" mean?","o":["I would make up for its lack, and the loss would be on me","I would sin with it, taking it for myself","I would search for it until I found it"]}]},"31:39.3":{"e":"Onkelos translates \"dahavat sagi mimnina\": what was missing from the count. Similarly, \"velo nifkad mimenu ish\" is translated \"lo saga,\" meaning not missing.","pe":"I never brought you a mutilated animal. I will take the blame for it. You demanded compensation from my hand whether [an animal] was stolen from me by day or whether it was stolen from me by night.","re":"I will take the blame for it. Onkelos translates it: דַּהֲוַת שָׁגְיָא מִמִּנְיָנָא. [Meaning] that which is lacking and missing, as in, “Not one person is missing from us” which Onkelos translates וְלָא שְׁגָא [there was not missing].","p":[{"q":"According to Onkelos's translation, what does \"achatenah\" mean?","o":["An expression of lacking: what was missing from the count","An expression of sin: I sinned with it","An expression of slaughtering: I slaughtered it"]}]},"31:39.4":{"e":"Yaakov said: whether an animal was stolen by day or stolen by night, I paid for everything.","pe":"I never brought you a mutilated animal. I will take the blame for it. You demanded compensation from my hand whether [an animal] was stolen from me by day or whether it was stolen from me by night.","re":"Whether [an animal] was stolen from me by day, or whether it was stolen from me by night. “Whether stolen by day or by night—I compensated for everything.”","p":[{"q":"What does \"gnuvti yom ugnuvti layla\" mean according to Rashi?","o":["Stolen by day or stolen by night, I paid for everything","I stole from myself my night's sleep and my day's rest","I stole hours from my work by day and by night"]}]},"31:39.5":{"e":"The yud at the end of \"gnuvti\" does not mean \"I stole\"; it is like the yud in \"rabbati vagoyim,\" \"malleti mishpat,\" and \"ahavti lados,\" and means: stolen.","pe":"I never brought you a mutilated animal. I will take the blame for it. You demanded compensation from my hand whether [an animal] was stolen from me by day or whether it was stolen from me by night.","re":"Stolen from me. [The יוּ\"ד ending is] the same as: “[רַבָּתִי] Great among nations, [שָׂרָתִי] a princess among states,” [or] “[מְלֵאֲתִי] That was full of justice,” [or] “[אוֹהַבְתִּי] that loves to thresh.”","p":[{"q":"According to Rashi, what is the meaning of the yud at the end of the word \"gnuvti\"?","o":["Like \"rabbati vagoyim\"; it means: that was stolen","A first-person form: I stole by day and night","A second-person form: you stole from me"]}]},"31:40.1":{"e":"\"Achalani\" is an expression of consuming fire: the burning heat consumed Yaakov like a devouring fire.","pe":"I was consumed by the burning heat by day and ice at night. My sleep was taken from my eyes.","re":"I was consumed by the burning heat. [אֲכָלַנִי has] the same meaning as a consuming fire.","p":[{"q":"Why did Yaakov say about the heat \"achalani\" (consumed me)?","o":["Like a devouring fire, the heat consumed me","Because from the heat I could not eat","Because beasts of prey ate from the flock by day"]}]},"31:40.2":{"e":"\"Kerach\" is cold and frost, as in \"mashlich kachho,\" and its translation is \"gelida.\"","pe":"I was consumed by the burning heat by day and ice at night. My sleep was taken from my eyes.","re":"And ice. as in, “He hurls his ice” which is translated by Targum as גְלִידָא — frost.","p":[{"q":"What does \"vekerach\" mean in Yaakov's words?","o":["Cold and frost, as in \"mashlich kachho\"","Baldness, hair falling out from grief","Hunger and lack of food at night"]}]},"31:40.3":{"e":"\"Sheni\" is from the word for sleep.","pe":"I was consumed by the burning heat by day and ice at night. My sleep was taken from my eyes.","re":"My sleep. A term referring to sleep.","p":[{"q":"What does the word \"sheniti\" mean in the verse?","o":["My sleep","My year","My change"]}]},"31:41.1":{"e":"Yaakov told Lavan that he kept changing the terms between them: sometimes speckled and sometimes spotted, sometimes ringed and sometimes berudim.","pe":"These twenty years that I have been in your house, I served you fourteen years for your two daughters, and six years for your sheep, but you changed my wages ten times.","re":"You changed my wages. You kept changing the condition between us, from speckled to spotted, and from streaked to ringed ones.","p":[{"q":"How did Lavan change Yaakov's wages?","o":["He changed the terms, from speckled to spotted and from ringed to berudim","He reduced the number of sheep he promised Yaakov","He paid him in money instead of sheep"]}]},"31:42.1":{"e":"Yaakov did not say \"Elokei Yitzchak,\" because Hashem does not attach His name to the righteous during their lifetime. Even though Hashem Himself said \"and the God of Yitzchak,\" that was because Yitzchak's eyes had dimmed and he was like dead; still, Yaakov was afraid to say \"my God\" and said \"pachad.\"","pe":"Had not the God of my father, the God of Avraham and the Fear of Yitzchok been with me, you would have sent me away empty-handed. My misery and the labor of my hands was seen by Elohim, and He reprimanded you last night.","re":"And the fear of Yitzchok. He did not wish to say אֱלֹהֵי יִצְחָק because God does not associate His Name with the righteous while they are alive. Although He said to him [Yaakov] when he left Beer Sheva: “I am Adonoy, the God of Avraham, your father, And God of Yitzchok,” because his [Yitzchok’s] eyesight had dimmed and he was therefore considered as dead. [Nevertheless] Yaakov was afraid to say אֱלֹהֵי and [instead] said וּפַחַד.","p":[{"q":"Why did Yaakov say \"pachad Yitzchak\" and not \"Elokei Yitzchak\"?","o":["Because Hashem does not attach His name to the righteous in their lifetime","Because Yitzchak feared Hashem more than his father Avraham","Because Hashem had not yet revealed Himself to Yitzchak as He did to Avraham"]},{"q":"Why did Hashem Himself say to Yaakov \"and the God of Yitzchak\" when he left Be'er Sheva?","o":["Because Yitzchak's eyes had dimmed, and he was like dead","Because at that time Yitzchak had already passed away","Because Yaakov asked Hashem to attach His name to his father"]}]},"31:42.2":{"e":"\"Vayochach\" is an expression of rebuke, meaning that Hashem reproved Lavan, and not an expression of proof and clarification.","pe":"Had not the God of my father, the God of Avraham and the Fear of Yitzchok been with me, you would have sent me away empty-handed. My misery and the labor of my hands was seen by Elohim, and He reprimanded you last night.","re":"And He reprimanded you. A term meaning reproof and not a term meaning to determine.","p":[{"q":"What does \"vayochach\" mean in Yaakov's words to Lavan?","o":["An expression of rebuke: Hashem reproved you last night","An expression of proof: Hashem clarified and decided who is right","An expression of testimony: Hashem testified that I am faithful"]}]},"31:43.1":{"e":"Lavan said: how could it enter my heart to harm my daughters?","pe":"Lavan replied and said to Yaakov, The daughters are my daughters, and the sons are my sons, and the[se] flocks are my flocks. All that you see is mine. What can I do unto these, my daughters, today, or to their children that they have born.","re":"What can I do unto these. [Meaning:] “How could it enter my heart to cause them any harm?”","p":[{"q":"What did Lavan mean when he said he could do nothing \"la'eileh\"?","o":["How could it enter my heart to harm them","What can I give them as a gift","How can I bring them back to my house"]}]},"31:44.1":{"e":"The witness to the covenant between Yaakov and Lavan is the Holy One.","pe":"Now come [therefore] let us make a pact, I and you. Let Him be witness between me and you.","re":"Let Him be witness. [Referring to] God [being the witness].","p":[{"q":"Who is the witness in the phrase \"vehayah le'ed\"?","o":["The Holy One","The mound they built from stones","Yaakov's brothers who were there"]}]},"31:46.1":{"e":"\"His brothers\" are Yaakov's sons, who were like brothers to him and stood by his side in trouble and in war.","pe":"Yaakov said to his brethren, Gather stones. They took stones and made a mound, and they ate on the mound.","re":"To his brethren. This refers to his sons who were as brothers to him, standing by him in his troubles and wars.","p":[{"q":"Who are Yaakov's \"echav\" (brothers) in the verse?","o":["His sons, who stood by him like brothers in trouble and in war","Eisav and his household, who came toward him","Lavan's men, who were his relatives"]}]},"31:47.1":{"e":"\"Yegar sahaduta\" is the Aramaic translation of \"Gal'ed\"; Lavan and Yaakov called the one place by two names in two languages.","pe":"Lavan called it Yegar Sohadusa, but Yaakov called it Galeid.","re":"Yegar Sohadusa. This is the Targum of Galeid.","p":[{"q":"What is \"Yegar Sahaduta\"?","o":["The Aramaic translation of \"Gal'ed\"","The name of another place near Gil'ad","The name of one of Lavan's idols"]}]},"31:47.2":{"e":"\"Gal'ed\" is made of two words: gal ed, a mound of witness.","pe":"Lavan called it Yegar Sohadusa, but Yaakov called it Galeid.","re":"Galeid. [Made up of two words:] גַל עֵד —a witness mound.","p":[{"q":"What does the name \"Gal'ed\" mean according to Rashi?","o":["Gal ed, a mound of witness","A high and steep mountain","A place of springs and water"]}]},"31:49.1":{"e":"The Mitzpah is the place on Mount Gil'ad mentioned in the book of Shoftim. It was called \"Mitzpah\" because each said to the other: may Hashem keep watch between us if you break the covenant.","pe":"And [he also called it] Mitzpah [Watchtower] because he said, Adonoy will watch between me and you, when we are concealed from each other[’s sight].","re":"And Mitzpah, because he said, etc. This Mitzpah is the one on Mount Gilad as is written: “And he passed over Mitzpah of Gilad.” Why was its name Mitzpah? Because each of them said to the other: “May God watch [יִצֶף] between us whether you will transgress the covenant.”","p":[{"q":"Why was the place called \"Mitzpah\"?","o":["Each said to the other: may Hashem keep watch between me and you if you transgress","Because from there one can look far over the whole area","Because Yaakov watched from there as his family crossed"]}]},"31:49.2":{"e":"\"Ki nistar\" means: when we do not see one another, Hashem will watch between us.","pe":"And [he also called it] Mitzpah [Watchtower] because he said, Adonoy will watch between me and you, when we are concealed from each other[’s sight].","re":"When we are concealed. And shall not see one another.","p":[{"q":"What does \"ki nistar ish mere'ehu\" mean?","o":["When we do not see each other, when we are far apart","When one of us hides something from the other","Because each of us will hide from the other"]}]},"31:50.1":{"e":"The word \"b'notai\" was said twice because Bilha and Zilpa were also Lavan's daughters, from a concubine.","pe":"If you afflict my daughters, or marry other wives in addition to my daughters, there may be no man with us, but see, Elohim is witness between me and you.","re":"My daughters, my daughters. [בְנֹתַי] twice [a total of four daughters]. Bilhah and Zilpah were also his daughters from a concubine.","p":[{"q":"Why does Lavan say \"b'notai\" twice in the verse?","o":["Because Bilha and Zilpa were also his daughters, from a concubine","To emphasize his great love for his daughters","Because once was for Leah and once was for Rachel"]}]},"31:50.2":{"e":"Lavan warns Yaakov not to afflict his daughters by withholding marital relations from them.","pe":"If you afflict my daughters, or marry other wives in addition to my daughters, there may be no man with us, but see, Elohim is witness between me and you.","re":"If you afflict my daughters. By refusing them marital relations.","p":[{"q":"What is the affliction that Lavan feared, according to Rashi?","o":["That he would withhold marital relations from them","That he would make them do hard labor in the field","That he would withhold food and clothing from them"]}]},"31:51.1":{"e":"\"Yaritti\" is an expression of casting, as in \"yarah vayam,\" like one who shoots an arrow.","pe":"Lavan said to Yaakov, Here is this mound, and here is this monument that I have cast between me and you.","re":"I have cast. The same as יָרָה בַיָּם —“Cast into the sea,” as one casts an arrow [spear].","p":[{"q":"What does \"yaritti\" mean according to Rashi?","o":["I cast, like \"yarah vayam,\" like one shooting an arrow","I taught and instructed, from the word for teaching","I feared, from the word for fear"]}]},"31:52.1":{"e":"The word \"im\" here is used in the sense of \"asher\" (that), as in \"ad im dibarti devarai.\"","pe":"This mound is witness, and the monument is witness, that I will not cross over to you beyond this mound; and you are not to cross over to me beyond this mound and this monument for harmful purposes.","re":"That I. Here אִם is used to mean “that” as in: “Until that I have spoken my words.”","p":[{"q":"What is the meaning of the word \"im\" in the words \"im ani lo e'evor\"?","o":["\"Asher\" (that): that I will not cross","A conditional: if I cross, then he will be punished","A question: will I cross?"]}]},"31:52.2":{"e":"It is forbidden to cross the mound in order to do harm, but it is permitted to cross for the sake of trade.","pe":"This mound is witness, and the monument is witness, that I will not cross over to you beyond this mound; and you are not to cross over to me beyond this mound and this monument for harmful purposes.","re":"For harmful purposes. For evil purposes you may not pass, but you may pass for business purposes.","p":[{"q":"What does the word \"ra'ah\" (for harm) teach?","o":["That it is forbidden to cross the mound only to do harm, but for trade it is permitted","That it is forbidden to cross the mound at all","That it is permitted to cross the mound only to visit the daughters"]}]},"31:53.1":{"e":"The words \"Elokei Avraham\" are a holy name.","pe":"The God of Avraham and the god of Nachor, the god of their fathers will judge between us. Yaakov swore by the Fear of his father, Yitzchok.","re":"The God of Avraham. [אֱלֹהֵי is] holy, [i.e., the Divine Name].","p":[{"q":"Is \"Elokei Avraham\" in Lavan's words a holy name or a secular one?","o":["Holy","Secular, like the god of Nachor","Doubtful, and therefore it is not erased"]}]},"31:53.2":{"e":"The word \"Elohei\" regarding Nachor is secular, meaning it refers to idolatry and not to Hashem.","pe":"The God of Avraham and the god of Nachor, the god of their fathers will judge between us. Yaakov swore by the Fear of his father, Yitzchok.","re":"And the god of Nachor. [Here אֱלֹהֵי is] profane [i.e., referring to an idol].","p":[{"q":"What is the meaning of the word \"Elohei\" in the phrase \"ve'Elohei Nachor\"?","o":["Secular: it refers to idolatry","Holy: it refers to Hashem as with Avraham","An expression of judges and magistrates of Nachor"]}]},"31:53.3":{"e":"The word \"Elohei\" in the words \"Elohei avihem\" is secular, and is not a holy name.","pe":"The God of Avraham and the god of Nachor, the god of their fathers will judge between us. Yaakov swore by the Fear of his father, Yitzchok.","re":"The god of their fathers. [אֱלֹהֵי here, too, is] profane.","p":[{"q":"What is the nature of the word \"Elohei\" in the words \"Elohei avihem\"?","o":["Secular: it is not a holy name","Holy: it refers to Hashem, God of Avraham","Judges: the magistrates of their family"]}]},"31:54.1":{"e":"Yaakov slaughtered animals in order to make a feast.","pe":"Yaakov slaughtered animals on the mountain, and invited his brethren to eat bread [a meal]. They ate bread and spent the night on the mountain.","re":"Yaakov slaughtered animals. He slaughtered animals for a feast.","p":[{"q":"What was the \"zevach\" that Yaakov offered on the mountain?","o":["Slaughtering animals for a feast","A burnt offering to Hashem for being saved from Lavan","A peace offering in honor of the covenant"]}]},"31:54.2":{"e":"\"His brothers\" here are Yaakov's friends who were with Lavan.","pe":"Yaakov slaughtered animals on the mountain, and invited his brethren to eat bread [a meal]. They ate bread and spent the night on the mountain.","re":"His brethren. Here לְאֶחָיו means, for his friends who were with Lavan.","p":[{"q":"Who are the \"echav\" whom Yaakov called to eat bread?","o":["His friends who were with Lavan","His sons who were born to him in Charan","His brother Eisav and his men"]}]},"31:54.3":{"e":"Any food is called \"lechem,\" as in \"avad lechem rav\" and \"nashchita etz belachmo.\"","pe":"Yaakov slaughtered animals on the mountain, and invited his brethren to eat bread [a meal]. They ate bread and spent the night on the mountain.","re":"To eat bread [a meal]. Food, in general, is called לֶחֶם — bread, as in, “He made a great feast,” [or] “Let us destroy the tree with its fruit.”","p":[{"q":"What does \"lechem\" mean in the verse according to Rashi?","o":["Any food, not necessarily bread","Bread only, without the meat of the sacrifice","Matzah bread that was offered with the sacrifice"]}]},"32:2.1":{"e":"Angels of Eretz Yisrael came toward Yaakov in order to accompany him to the land.","pe":"Yaakov went on his way, and the angels of Elohim met him.","re":"And the angles of Elohim met him. Angels of Eretz Yisrael came to meet him in order to accompany him into the [Holy] Land.","p":[{"q":"Which angels met Yaakov, and for what purpose?","o":["Angels of Eretz Yisrael, who came to accompany him to the land","Angels of outside the land, who came to take leave of him","Angels whom Hashem sent to fight Eisav"]}]},"32:3.1":{"e":"\"Machanayim\" are two camps of angels: the angels of outside the land who accompanied Yaakov until here, and the angels of Eretz Yisrael who came toward him.","pe":"When Yaakov saw them, he said, This is Elohim’s camp. He named the place Machanayim.","re":"Machanayim. [מַחֲנָיִם means] two camps—[the angels] from outside Eretz Yisrael that accompanied him to this point and those of Eretz Yisrael that came to meet him.","p":[{"q":"Which two camps are hinted at in the name \"Machanayim\"?","o":["Angels of outside the land who accompanied him and angels of Eretz Yisrael who came toward him","Yaakov's camp and Lavan's camp, who parted there","Yaakov's camp and the camp of Eisav who came toward him"]}]}};

const VDICT={'הוא':'הוּא','היא':'הִיא','לו':'לוֹ','וגו׳':'וְגוֹ׳',"וגו'":'וְגוֹ׳','וגומר':'וְגוֹמֵר','ההיא':'הַהִיא','כל':'כֹּל','טוב':'טוֹב','מאה':'מֵאָה','מאוד':'מְאֹד','סדום':'סְדֹם','אורח':'אֹרַח',"לה'":'לַה׳','אותה':'אוֹתָהּ','חלילה':'חָלִילָה','יושב':'יוֹשֵׁב','עושה':'עֹשֶׂה','לדרוש':'לִדְרֹשׁ','חום':'חֹם','כחום':'כְּחֹם','באלוני':'בְּאֵלֹנֵי','לספוד':'לִסְפֹּד','ולבכותה':'וְלִבְכֹּתָהּ','לטושים':'לִטּוּשִׁים','ומגדנות':'וּמִגְדָּנוֹת','בקולי':'בְּקֹלִי','אחזת':'אֲחֻזַּת','תעבורו':'תַּעֲבֹרוּ','ויתרוצצו':'וַיִּתְרֹצֲצוּ','תולדות':'תּוֹלְדֹת','מארצך':'מֵאַרְצְךָ','אראך':'אַרְאֶךָּ','נתת':'נָתַתָּ',"בה'":'בַּה׳',"וה'":'וַה׳','ולרבקה':'וּלְרִבְקָה','ארץ':'אֶרֶץ','וגו':'וְגוֹ׳','סורו':'סוּרוּ','שוב':'שׁוּב'};
function vdh(x){const nz=w=>w.replace(/[֑-ׇ]/g,'').replace(/[^א-ת]/g,'');const loose=k=>k.replace(/[וי]/g,'');
  const strip=t=>t.replace(/[֑-ֽ֯׀׃-ׅ]/g,'').replace(/[^א-תְ-ׇ]/g,'');

  src.forEach(t=>{const s=strip(t),k=nz(t);if(k&&/[ְ-ֻ]/.test(s)){if(!m[k])m[k]=s;const q=loose(k);if(q&&!l[q])l[q]=s}});
  return x.dh.split(/\s+/).map(w=>{const k=nz(w);if(!k)return w;if(VDICT[w])return VDICT[w];if(VDICT[k])return VDICT[k];return m[k]||l[loose(k)]||w}).join(' ')}

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

function rashiHTML(x,pt){
  const nz=w=>w.replace(/[֑-ׇ]/g,'').replace(/[^א-ת]/g,'');
  const toks=String(x.rashi_he).replace(/<\/?b>/g,'').split(/\s+/).filter(Boolean),n=toks.map(nz);
  const cls=toks.map(()=>'');
  const dh=x.dh.split(/\s+/).map(nz).filter(Boolean);
  let dl=0;if(dh.length&&dh.every((w,i)=>n[i]===w))dl=dh.length;else{let k=0;while(k<dh.length&&k<n.length&&n[k]===dh[k])k++;dl=k}
  for(let i=0;i<dl;i++)cls[i]+=' dhw';
  const pw=x.pasuk_html.replace(/<[^>]+>/g,'').replace(/־/g,' ').split(/\s+/).map(nz).filter(Boolean);
  for(let i=dl;i<n.length;i++){let best=0;for(let p=0;p<pw.length;p++){let k=0;while(i+k<n.length&&p+k<pw.length&&n[i+k]&&n[i+k]===pw[p+k])k++;if(k>best)best=k}
    if(best>=2){for(let k=0;k<best;k++)cls[i+k]+=' qw';i+=best-1}}
  if(pt&&pt.kp)[].concat(pt.kp).forEach(ph=>{const kw=String(ph).split(/\s+/).map(nz).filter(Boolean);
    if(kw.length)for(let i=0;i+kw.length<=n.length;i++){if(kw.every((w,k)=>n[i+k]===w)){for(let k=0;k<kw.length;k++)cls[i+k]+=' kp';break}}});
  const out=[];for(let i=0;i<toks.length;){const c=cls[i].trim();if(!c){out.push(esc(toks[i]));i++;continue}let j=i;while(j<toks.length&&cls[j].trim()===c)j++;out.push(`<span class="${c}">${toks.slice(i,j).map(esc).join(' ')}</span>`);i=j}
  return out.join(' ')}

    const kids=[...pt.children].filter(e=>e!==rv||shown),gap=parseFloat(getComputedStyle(pt).rowGap)||0;
    const need=()=>kids.reduce((t,e)=>t+(e.classList.contains('quote')?innerHeight*.24:Math.max(e.offsetHeight,e.scrollHeight)),0)+gap*(kids.length-1)+(shown?14:0);
    bs(v=>r.style.setProperty('--s',v),()=>need()>pt.clientHeight*1+1,.5,2.4)}
  else bs(v=>r.style.setProperty('--s',v),()=>c.scrollHeight>c.clientHeight+1,.6,6);
  if(rv){rv.style.display='';rv.style.position=''}}
function placeReveal(){const c=document.querySelector('.card'),r=c&&c.querySelector('.reveal'),n=c&&c.querySelector('.nav'),o=c&&c.querySelector('.opts');if(!r)return;
  if(matchMedia('(min-width:900px)').matches){const pp=c.querySelector('.point');if(pp&&!r.hasAttribute('aria-hidden'))pp.style.justifyContent='flex-start';r.style.bottom='auto';r.style.top=(o?o.offsetTop+Math.max(o.offsetHeight,o.scrollHeight)+8:0)+'px';r.style.overflow='auto'}
  else{r.style.top=(o?o.offsetTop+o.offsetHeight+8:'')+'px';r.style.overflow='auto';if(n)r.style.bottom=(c.clientHeight-n.offsetTop+6)+'px'}}
const _render=render;render=function(){_render();foot();fit();placeReveal()};
const refit=()=>{fit();placeReveal()};
addEventListener('resize',refit);if(document.fonts)document.fonts.ready.then(refit);
applyLang();
render();
</script>
