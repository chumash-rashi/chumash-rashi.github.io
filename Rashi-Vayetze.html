<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-soft:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;--f-pasuk:"Taamey Frank CLM","Cardo","Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100dvh;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:4px;height:100%}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.top{display:contents}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
h1 span{display:none}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.count b{color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:none}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-pasuk);font-size:22px;line-height:1.7;letter-spacing:.03em;word-spacing:.08em;direction:rtl;text-align:right}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{display:none}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:6px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:8px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:18px;line-height:1.45;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:center;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-body);font-size:17px;line-height:1.4;width:100%;direction:rtl}
.opt .k{flex:none;font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-soft)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.row{display:flex;flex-direction:column;gap:2px}
.row .t{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);direction:rtl}
.row p{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--accent);font-size:18px;font-weight:600;display:inline-block;padding:5px 16px;border:1.5px solid var(--accent);border-radius:9px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:14px;line-height:1.6;direction:rtl;text-align:right}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface);font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line);font-size:14px}
.hint{font-size:14px;color:var(--muted);text-align:center;flex-shrink:0}
.verdict{font-weight:600;font-size:16px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:20px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* taamim: Frank Ruhl lacks cantillation glyphs, so those letters fell back to another font */
.pasuk{font-family:var(--f-pasuk)}
/* pasuk panel: visually separate the verse from the question */
.pasuk{background:var(--accent-soft);border-inline-start:5px solid var(--accent);border-radius:10px;padding:calc(var(--s,1)*6px) calc(var(--s,1)*12px)}
.point{border-top:1px solid var(--line);padding-top:calc(var(--s,1)*8px)}
/* fit layout: only pasuk + question + options in the card; fine print lives in the footer */
.wrap{max-width:min(1500px,100%)}
header .top,.tools,.ref,.dh{display:none}
.card{gap:calc(var(--s,1)*8px)}
.pasuk{font-size:calc(var(--s,1)*22px)}
.q{font-size:calc(var(--s,1)*18px)}
.opt{font-size:calc(var(--s,1)*17px);padding:calc(var(--s,1)*7px) calc(var(--s,1)*10px)}
.opt .k{width:calc(var(--s,1)*20px);height:calc(var(--s,1)*20px);font-size:calc(var(--s,1)*11px)}
.row p{font-size:25px;line-height:1.35}
.verdict{font-size:26px;font-weight:700}
.row .t{font-size:16px}
.point{gap:calc(var(--s,1)*10px)}
.card{position:relative}
.reveal{position:absolute;inset-inline:12px;bottom:56px;z-index:3;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.nav .btn{padding:4px 12px;font-size:13px}
@media (max-width:460px){.pasuk{font-size:calc(var(--s,1)*22px)}}
.hint{font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}

/* wide screens: split layout (pasuk | question+answers), fonts auto-fit each side */
@media (min-width:900px){
.wrap{max-width:min(1800px,100%)}
.card{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr) auto auto;column-gap:22px;row-gap:8px;overflow:hidden}
.card>.pasuk{grid-column:1;grid-row:1;overflow:hidden;align-self:stretch;font-size:calc(var(--sp,1)*22px);padding:calc(var(--sp,1)*10px) calc(var(--sp,1)*14px)}
.card>.point{position:relative;grid-column:2;grid-row:1;min-height:0;overflow:hidden;border-top:0;padding-top:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--s,1)*12px)}
.card>details{grid-column:1/-1;grid-row:2}
.card>.nav{grid-column:1/-1;grid-row:3}
.reveal{position:absolute;inset:auto 0 0 0;z-index:3;max-height:none;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.row p{font-size:calc(var(--s,1)*18px);line-height:1.4}
.verdict{font-size:30px;font-weight:700}
.row .t{font-size:20px}
.q{font-size:calc(var(--s,1)*21px)}
.opt{font-size:calc(var(--s,1)*21px)}
}

/*EN*/

.quote .enx{direction:ltr;text-align:left;font-family:var(--f-body);font-size:.82em;line-height:1.4;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}

<script>
const DATA = [{"id": "28:10.1", "ch": 28, "v": 10, "n": 1, "dh": "ויצא יעקב", "pasuk_html": "<mark>וַיֵּצֵ֥א יַעֲקֹ֖ב</mark> מִבְּאֵ֣ר שָׁ֑בַע וַיֵּ֖לֶךְ חָרָֽנָה׃", "pasuk_en": "וַיֵּצֵא יַעֲקֹב מִבְּאֵר שָׁבַע וַיֵּלֶךְ חָרָנָה׃", "rashi_he": "ויצא יעקב. עַל יְדֵי שֶׁבִּשְׁבִיל שֶׁרָעוֹת בְּנוֹת כְּנַעַן בְּעֵינֵי יִצְחָק אָבִיו הָלַךְ עֵשָׂו אֶל יִשְׁמָעֵאל, הִפְסִיק הָעִנְיָן בְּפָרָשָׁתוֹ שֶׁל יַעֲקֹב, וּכְתִיב וַיַּרְא עֵשָׂו כִּי בֵרַךְ וְגוֹ', וּמִשֶּׁגָּמַר חָזַר לָעִנְיָן הָרִאשׁוֹן:", "rashi_en": "התורה חוזרת לספר שיעקב יצא, כי באמצע סיפורו הפסיקה כדי לספר שעשו הלך אל ישמעאל, בגלל שבנות כנען רעו בעיני יצחק. כשסיימה את סיפור עשו, חזרה לעניין הראשון.", "note": "", "points": [{"q": "מַדּוּעַ חוֹזֶרֶת הַתּוֹרָה לוֹמַר \"וַיֵּצֵא יַעֲקֹב\", אַף שֶׁכְּבָר סוּפַּר שֶׁיַּעֲקֹב נִשְׁלַח לְפַדַּן אֲרָם?", "options": ["כִּי הִפְסִיקָה לְסַפֵּר עַל עֵשָׂו, וְעַכְשָׁיו הִיא חוֹזֶרֶת לְסִיפּוּר יַעֲקֹב", "כִּי זוֹ יְצִיאָה שְׁנִיָּיה שֶׁל יַעֲקֹב מִבְּאֵר שֶׁבַע", "כִּי קוֹדֶם סוּפַּר רַק עַל הַהַחְלָטָה לִשְׁלוֹחַ אוֹתוֹ"], "kasha": "כבר נאמר לפני כן שיצחק שלח את יעקב והוא הלך פדנה ארם, ולמה חוזר הכתוב ואומר שיצא?", "answer": "באמצע סיפור יעקב הפסיקה התורה לספר שעשו הלך אל ישמעאל בגלל שבנות כנען רעו בעיני יצחק, ומשגמרה חזרה לעניין הראשון.", "kp": ["הפסיק הענין בפרשתו של יעקב", "ומשגמר חזר לענין הראשון"]}]}, {"id": "28:10.2", "ch": 28, "v": 10, "n": 2, "dh": "ויצא", "pasuk_html": "<mark>וַיֵּצֵ֥א</mark> יַעֲקֹ֖ב מִבְּאֵ֣ר שָׁ֑בַע וַיֵּ֖לֶךְ חָרָֽנָה׃", "pasuk_en": "וַיֵּצֵא יַעֲקֹב מִבְּאֵר שָׁבַע וַיֵּלֶךְ חָרָנָה׃", "rashi_he": "ויצא. לֹא הָיָה צָרִיךְ לִכְתֹּב אֶלָּא וַיֵּלֶךְ יַעֲקֹב חָרָנָה, וְלָמָּה הִזְכִּיר יְצִיאָתוֹ? אֶלָּא מַגִּיד שֶׁיְּצִיאַת צַדִּיק מִן הַמָּקוֹם עוֹשָׂה רֹשֶׁם, שֶׁבִּזְמַן שֶׁהַצַּדִּיק בָּעִיר, הוּא הוֹדָהּ הוּא זִיוָהּ הוּא הֲדָרָהּ; יָצָא מִשָּׁם, פָּנָה הוֹדָהּ פָּנָה זִיוָהּ פָּנָה הֲדָרָהּ. וְכֵן וַתֵּצֵא מִן הַמָּקוֹם הָאָמוּר בְּנָעֳמִי וְרוּת (רות א'):", "rashi_en": "היה די לכתוב שיעקב הלך לחרן, והתורה מזכירה גם את יציאתו מבאר שבע כדי ללמד שיציאת צדיק מן העיר משאירה רושם: כשהוא שם הוא הודה, זיוה והדרה, וכשהוא יוצא כל אלה נעלמים.", "note": "", "points": [{"q": "לָמָּה הִזְכִּירָה הַתּוֹרָה 'וַיֵּצֵא יַעֲקֹב מִבְּאֵר שָׁבַע' וְלֹא כָּתְבָה רַק 'וַיֵּלֶךְ חָרָנָה'?", "options": ["לְלַמֵּד שֶׁיְּצִיאַת צַדִּיק מִן הַמָּקוֹם עוֹשֶׂה רוֹשֶׁם", "לְלַמֵּד שֶׁיַּעֲקֹב בָּרַח מִבְּאֵר שֶׁבַע בַּחֲשַׁאי", "לְלַמֵּד שֶׁבְּאֵר שֶׁבַע הָיְיתָה מְקוֹם תְּפִילָּה שֶׁל אֲבוֹתָיו"], "kasha": "היה מספיק לכתוב 'וילך יעקב חרנה', ולמה הוזכרה היציאה?", "answer": "מגיד שיציאת צדיק מן המקום עושה רושם, שבזמן שהצדיק בעיר הוא הודה, זיוה והדרה, וכשיצא פנו כולם.", "kp": ["שיציאת צדיק מן המקום עושה רשם"]}, {"q": "לְפִי רַשִׁ\"י, מָה קוֹרֶה לָעִיר כְּשֶׁהַצַּדִּיק יוֹצֵא מִמֶּנָּה?", "options": ["פּוֹנִים מִמֶּנָּה הוֹדָהּ, זִיוָהּ וַהֲדָרָהּ", "תּוֹשְׁבֶיהָ נֶעֱנָשִׁים עַל שֶׁלֹּא עִיכְּבוּהוּ", "הִיא מְאַבֶּדֶת אֶת הַבְּרָכָה בְּפַרְנָסָתָהּ"], "kasha": "מה הרושם שהיציאה עושה, שבגללו הזכירה אותה התורה?", "answer": "בזמן שהצדיק בעיר הוא הודה, הוא זיוה, הוא הדרה; יצא משם, פנה הודה, פנה זיוה, פנה הדרה.", "kp": ["פנה הודה פנה זיוה פנה הדרה"]}]}, {"id": "28:10.3", "ch": 28, "v": 10, "n": 3, "dh": "וילך חרנה", "pasuk_html": "וַיֵּצֵ֥א יַעֲקֹ֖ב מִבְּאֵ֣ר שָׁ֑בַע <mark>וַיֵּ֖לֶךְ חָרָֽנָה׃</mark>", "pasuk_en": "וַיֵּצֵא יַעֲקֹב מִבְּאֵר שָׁבַע וַיֵּלֶךְ חָרָנָה׃", "rashi_he": "וילך חרנה. יָצָא לָלֶכֶת לְחָרָן:", "rashi_en": "רש\"י מסביר שיעקב עדיין לא הגיע לחרן, אלא יצא לדרכו כדי ללכת לשם.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וַיֵּלֶךְ חָרָנָה\" לְפִי רַשִׁ\"י?", "options": ["יָצָא לַדֶּרֶךְ כְּדֵי לָלֶכֶת לְחָרָן, וְעֲדַיִין לֹא הִגִּיעַ", "הִגִּיעַ לְחָרָן בְּסוֹף אוֹתוֹ הַיּוֹם", "חָזַר לְחָרָן אַחֲרֵי שֶׁשָּׁהָה זְמַן מָה בִּבְאֵר שֶׁבַע"], "kasha": "בהמשך מסופר שיעקב לן במקום אחר בדרך, ולכן קשה לומר שכבר הגיע לחרן.", "answer": "\"וילך חרנה\" פירושו שיצא ללכת לחרן, כלומר יצא לדרכו לשם.", "kp": ["יצא ללכת לחרן"]}]}, {"id": "28:11.1", "ch": 28, "v": 11, "n": 1, "dh": "ויפגע במקום", "pasuk_html": "<mark>וַיִּפְגַּ֨ע בַּמָּק֜וֹם</mark> וַיָּ֤לֶן שָׁם֙ כִּי־בָ֣א הַשֶּׁ֔מֶשׁ וַיִּקַּח֙ מֵאַבְנֵ֣י הַמָּק֔וֹם וַיָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑יו וַיִּשְׁכַּ֖ב בַּמָּק֥וֹם הַהֽוּא׃", "pasuk_en": "וַיִּפְגַּע בַּמָּקוֹם וַיָּלֶן שָׁם כִּי־בָא הַשֶּׁמֶשׁ וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם וַיָּשֶׂם מְרַאֲשֹׁתָיו וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא׃", "rashi_he": "ויפגע במקום. לֹא הִזְכִּיר הַכָּתוּב בְּאֵיזֶה מָקוֹם אֶלָּא בַּמָּקוֹם – הַנִּזְכָּר בְּמָקוֹם אַחֵר, הוּא הַר הַמּוֹרִיָּה, שֶׁנֶּאֱמַר בּוֹ וַיַּרְא אֶת הַמָּקוֹם מֵרָחֹק:", "rashi_en": "הכתוב אומר \"במקום\" בה\"א הידיעה ואינו מפרש איזה מקום, כי הכוונה למקום הידוע שכבר הוזכר בתורה – הר המוריה, שנאמר עליו בעקדה \"וירא את המקום מרחק\".", "note": "", "points": [{"q": "לְאֵיזֶה מָקוֹם מִתְכַּוְּוֵן הַכָּתוּב בְּמִילִּים \"וַיִּפְגַּע בַּמָּקוֹם\"?", "options": ["לְהַר הַמּוֹרִיָּה, הַמָּקוֹם שֶׁהוּזְכַּר בַּעֲקֵדַת יִצְחָק", "לְחָרָן, הַמָּקוֹם שֶׁיַּעֲקֹב הָיָה בְּדַרְכּוֹ אֵלָיו", "לִבְאֵר שֶׁבַע, הַמָּקוֹם שֶׁמִּמֶּנּוּ יָצָא יַעֲקֹב"], "kasha": "הכתוב אומר \"במקום\" כאילו מדובר במקום ידוע, ואינו מפרש באיזה מקום מדובר.", "answer": "זהו המקום שהוזכר במקום אחר, הר המוריה, שנאמר בו \"וירא את המקום מרחק\".", "kp": ["הוא הר המוריה", "הנזכר במקום אחר"]}]}, {"id": "28:11.2", "ch": 28, "v": 11, "n": 2, "dh": "ויפגע", "pasuk_html": "<mark>וַיִּפְגַּ֨ע</mark> בַּמָּק֜וֹם וַיָּ֤לֶן שָׁם֙ כִּי־בָ֣א הַשֶּׁ֔מֶשׁ וַיִּקַּח֙ מֵאַבְנֵ֣י הַמָּק֔וֹם וַיָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑יו וַיִּשְׁכַּ֖ב בַּמָּק֥וֹם הַהֽוּא׃", "pasuk_en": "וַיִּפְגַּע בַּמָּקוֹם וַיָּלֶן שָׁם כִּי־בָא הַשֶּׁמֶשׁ וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם וַיָּשֶׂם מְרַאֲשֹׁתָיו וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא׃", "rashi_he": "ויפגע. כְּמוֹ וּפָגַע בִּירִיחוֹ וּפָגַע בְּדַבָּשֶׁת (יהושע ט\"ז וי\"ט) וְרַבּוֹתֵינוּ פֵּרְשׁוּ לְשׁוֹן תְּפִלָּה (ברכות כ\"ו), כְּמוֹ וְאַל תִּפְגַּע בִּי (ירמיהו ז'), וְלָמַדְנוּ שֶׁתִּקֵּן תְּפִלַּת עַרְבִית. וְשִׁנָּה הַכָּתוּב וְלֹא כָּתַב וַיִּתְפַּלֵּל, לְלַמֶּדְךָ שֶׁקָּפְצָה לוֹ הָאָרֶץ, כְּמוֹ שֶׁמְּפֹרָשׁ בְּפֶרֶק גִּיד הַנָּשֶׁה (חולין צ\"א):", "rashi_en": "לפי הפשט \"ויפגע\" פירושו הגיע. רבותינו פירשו שזו לשון תפילה, ולמדו מכאן שיעקב תיקן תפילת ערבית. ומה שלא נכתב \"ויתפלל\" הוא כדי ללמד שקפצה לו הארץ.", "note": "", "points": [{"q": "לְפִי רַבּוֹתֵינוּ, מָה לוֹמְדִים מֵהַמִּילָּה \"וַיִּפְגַּע\"?", "options": ["שֶׁיַּעֲקֹב תִּיקֵּן אֶת תְּפִילַּת עַרְבִית", "שֶׁיַּעֲקֹב פָּגַשׁ בַּמָּקוֹם מַלְאָכִים", "שֶׁיַּעֲקֹב נִתְקַל בְּאֶבֶן בְּדַרְכּוֹ"], "kasha": "המילה \"ויפגע\" אינה הלשון הרגילה לתיאור הגעה למקום.", "answer": "לפי הפשט \"ויפגע\" הוא הגיע, כמו \"ופגע ביריחו\"; ורבותינו פירשו לשון תפילה, כמו \"ואל תפגע בי\", ולמדו שיעקב תיקן תפילת ערבית.", "kp": ["ולמדנו שתקן תפלת ערבית"]}, {"q": "מַדּוּעַ כָּתְבָה הַתּוֹרָה \"וַיִּפְגַּע\" וְלֹא \"וַיִּתְפַּלֵּל\"?", "options": ["כְּדֵי לְלַמֵּד שֶׁקָּפְצָה לוֹ הָאָרֶץ", "כְּדֵי לְלַמֵּד שֶׁהִתְפַּלֵּל בְּלַחַשׁ", "כְּדֵי לְלַמֵּד שֶׁתְּפִילָּתוֹ הָיְיתָה קְצָרָה"], "kasha": "אם הכוונה לתפילה, היה ראוי לכתוב בפירוש \"ויתפלל\".", "answer": "שינה הכתוב ולא כתב \"ויתפלל\", ללמד שקפצה לו הארץ, כמבואר במסכת חולין.", "kp": ["ללמדך שקפצה לו הארץ"]}]}, {"id": "28:11.3", "ch": 28, "v": 11, "n": 3, "dh": "כי בא השמש", "pasuk_html": "וַיִּפְגַּ֨ע בַּמָּק֜וֹם וַיָּ֤לֶן שָׁם֙ <mark>כִּי־בָ֣א הַשֶּׁ֔מֶשׁ</mark> וַיִּקַּח֙ מֵאַבְנֵ֣י הַמָּק֔וֹם וַיָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑יו וַיִּשְׁכַּ֖ב בַּמָּק֥וֹם הַהֽוּא׃", "pasuk_en": "וַיִּפְגַּע בַּמָּקוֹם וַיָּלֶן שָׁם כִּי־בָא הַשֶּׁמֶשׁ וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם וַיָּשֶׂם מְרַאֲשֹׁתָיו וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא׃", "rashi_he": "כי בא השמש. הָיָה לוֹ לִכְתֹּב וַיָּבֹא הַשֶּׁמֶשׁ וַיָּלֶן שָׁם, כִּי בָא הַשֶּׁמֶשׁ מַשְׁמַע שֶׁשָּׁקְעָה לוֹ חַמָּה פִּתְאוֹם, שֶׁלֹּא בְּעוֹנָתָהּ, כְּדֵי שֶׁיָּלִין שָׁם:", "rashi_en": "התורה לא כתבה ״ויבא השמש וילן שם״, אלא ״וילן שם כי בא השמש״. מכאן לומדים שהשמש שקעה פתאום, לפני זמנה, כדי שיעקב ילין במקום הזה.", "note": "", "points": [{"q": "מָה מְלַמֵּד רַשִׁ״י מִכָּךְ שֶׁהַפָּסוּק כּוֹתֵב שֶׁיַּעֲקֹב לָן שָׁם מִפְּנֵי שֶׁבָּא הַשֶּׁמֶשׁ?", "options": ["שֶׁהַשֶּׁמֶשׁ שָׁקְעָה פִּתְאוֹם שֶׁלֹּא בִּזְמַנָּהּ, כְּדֵי שֶׁיָּלִין שָׁם", "שֶׁיַּעֲקֹב נָהַג לִישׁוֹן תָּמִיד מִיָּד בִּשְׁקִיעַת הַחַמָּה", "שֶׁיַּעֲקֹב פָּחַד לָלֶכֶת בַּדֶּרֶךְ בַּלַּיְלָה מִפְּנֵי הַחַיּוֹת"], "kasha": "היה לתורה לכתוב בפשטות ״ויבא השמש וילן שם״; למה נכתב הלינה כתוצאה מביאת השמש?", "answer": "הלשון ״כי בא השמש״ משמעה ששקעה לו חמה פתאום, שלא בעונתה, כדי שילין שם.", "kp": ["ששקעה לו חמה פתאום", "שלא בעונתה, כדי שילין שם"]}]}, {"id": "28:11.4", "ch": 28, "v": 11, "n": 4, "dh": "וישם מראשותיו", "pasuk_html": "וַיִּפְגַּ֨ע בַּמָּק֜וֹם וַיָּ֤לֶן שָׁם֙ כִּי־בָ֣א הַשֶּׁ֔מֶשׁ וַיִּקַּח֙ מֵאַבְנֵ֣י הַמָּק֔וֹם <mark>וַיָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑יו</mark> וַיִּשְׁכַּ֖ב בַּמָּק֥וֹם הַהֽוּא׃", "pasuk_en": "וַיִּפְגַּע בַּמָּקוֹם וַיָּלֶן שָׁם כִּי־בָא הַשֶּׁמֶשׁ וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם וַיָּשֶׂם מְרַאֲשֹׁתָיו וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא׃", "rashi_he": "וישם מראשותיו. עֲשָׂאָן כְּמִין מַרְזֵב סָבִיב לְרֹאשׁוֹ, שֶׁיָּרֵא מִפְּנֵי חַיּוֹת רָעוֹת; הִתְחִילוּ מְרִיבוֹת זוֹ אֶת זוֹ, זֹאת אוֹמֶרֶת עָלַי יָנִיחַ צַדִּיק אֶת רֹאשׁוֹ וְזֹאת אוֹמֶרֶת עָלַי יָנִיחַ; מִיָּד עֲשָׂאָן הַקָּבָּ\"ה אֶבֶן אַחַת, וְזֶהוּ שֶׁנֶּאֱמַר וַיִּקַּח אֶת הָאֶבֶן אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו:", "rashi_en": "יעקב סידר כמה אבנים סביב ראשו כדי להגן על עצמו מחיות רעות. האבנים התווכחו ביניהן על מי יניח הצדיק את ראשו, והקב״ה הפך אותן לאבן אחת.", "note": "", "points": [{"q": "לָמָּה סִידֵּר יַעֲקֹב אֶת הָאֲבָנִים סָבִיב רֹאשׁוֹ?", "options": ["כְּדֵי לְהָגֵן עַל עַצְמוֹ מִפְּנֵי חַיּוֹת רָעוֹת", "כְּדֵי שֶׁיִּהְיֶה לוֹ נוֹחַ יוֹתֵר לִישׁוֹן", "כְּדֵי לִבְנוֹת מִזְבֵּחַ לִפְנֵי הַשֵּׁינָה"], "kasha": "כאן כתוב ״מאבני המקום״ בלשון רבים, ולמה צריך כמה אבנים לשים מראשותיו?", "answer": "הוא עשה אותן כמין מרזב סביב לראשו, מפני שפחד מחיות רעות.", "kp": ["שירא מפני חיות רעות"]}, {"q": "אֵיךְ מְיַיֵּשֵׁב רַשִׁ״י אֶת הַסְּתִירָה בֵּין ״מֵאַבְנֵי הַמָּקוֹם״ לְבֵין ״הָאֶבֶן״ שֶׁנֶּאֱמַר אַחַר כָּךְ?", "options": ["הָאֲבָנִים רָבוּ מִי תִּהְיֶה תַּחַת רֹאשׁ הַצַּדִּיק, וַה׳ עֲשָׂאָן אֶבֶן אַחַת", "יַעֲקֹב בָּחַר בַּבּוֹקֶר אֶבֶן אַחַת מִתּוֹכָן וְהִשְׁלִיךְ אֶת הַשְּׁאָר", "יַעֲקֹב לָקַח בַּתְּחִילָּה אֶבֶן אַחַת וְהוֹסִיף עָלֶיהָ אֲבָנִים בַּלַּיְלָה"], "kasha": "בהמשך כתוב ״ויקח את האבן אשר שם מראשתיו״ בלשון יחיד, ואילו כאן כתוב ״מאבני המקום״ בלשון רבים.", "answer": "האבנים התחילו לריב זו עם זו, כל אחת אומרת עלי יניח צדיק את ראשו, ומיד עשאן הקב״ה אבן אחת.", "kp": ["התחילו מריבות זו את זו", "מיד עשאן הקב\"ה אבן אחת"]}]}, {"id": "28:11.5", "ch": 28, "v": 11, "n": 5, "dh": "וישכב במקום ההוא", "pasuk_html": "וַיִּפְגַּ֨ע בַּמָּק֜וֹם וַיָּ֤לֶן שָׁם֙ כִּי־בָ֣א הַשֶּׁ֔מֶשׁ וַיִּקַּח֙ מֵאַבְנֵ֣י הַמָּק֔וֹם וַיָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑יו <mark>וַיִּשְׁכַּ֖ב בַּמָּק֥וֹם הַהֽוּא׃</mark>", "pasuk_en": "וַיִּפְגַּע בַּמָּקוֹם וַיָּלֶן שָׁם כִּי־בָא הַשֶּׁמֶשׁ וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם וַיָּשֶׂם מְרַאֲשֹׁתָיו וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא׃", "rashi_he": "וישכב במקום ההוא. לְשׁוֹן מִעוּט; בְּאוֹתוֹ מָקוֹם שָׁכַב אֲבָל י\"ד שָׁנִים שֶׁשִּׁמֵּשׁ בְּבֵית עֵבֶר לֹא שָׁכַב בַּלַּיְלָה, שֶׁהָיָה עוֹסֵק בַּתּוֹרָה:", "rashi_en": "המילה \"ההוא\" באה למעט: רק במקום ההוא שכב יעקב לישון, אבל בארבע עשרה השנים שלמד בבית עבר לא שכב בלילה, כי עסק בתורה.", "note": "", "points": [{"q": "מָה בָּא רַשִׁ\"י לִלְמוֹד מֵהַמִּילִּים \"בַּמָּקוֹם הַהוּא\"?", "options": ["שֶׁרַק שָׁם שָׁכַב, אֲבָל בַּשָּׁנִים שֶׁלָּמַד בְּבֵית עֵבֶר לֹא שָׁכַב בַּלַּיְלָה", "שֶׁהַמָּקוֹם הַהוּא הָיָה הַמָּקוֹם שֶׁבּוֹ נֶעֱקַד יִצְחָק עַל הַמִּזְבֵּחַ", "שֶׁבַּמָּקוֹם הַהוּא שָׁכַב יַעֲקֹב בְּכָל לֵילוֹת מַסָּעוֹ לְחָרָן"], "kasha": "מדוע הפסוק מוסיף \"במקום ההוא\", והרי כבר נאמר \"וילן שם\"?", "answer": "\"ההוא\" הוא לשון מיעוט: באותו מקום שכב, אבל ארבע עשרה שנים ששימש בבית עבר לא שכב בלילה, שהיה עוסק בתורה.", "kp": ["לשון מעוט", "באותו מקום שכב", "לא שכב בלילה"]}]}, {"id": "28:12.1", "ch": 28, "v": 12, "n": 1, "dh": "עולים וירדים", "pasuk_html": "וַֽיַּחֲלֹ֗ם וְהִנֵּ֤ה סֻלָּם֙ מֻצָּ֣ב אַ֔רְצָה וְרֹאשׁ֖וֹ מַגִּ֣יעַ הַשָּׁמָ֑יְמָה וְהִנֵּה֙ מַלְאֲכֵ֣י אֱלֹהִ֔ים <mark>עֹלִ֥ים וְיֹרְדִ֖ים</mark> בּֽוֹ׃", "pasuk_en": "וַיַּחֲלֹם וְהִנֵּה סֻלָּם מֻצָּב אַרְצָה וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה וְהִנֵּה מַלְאֲכֵי אֱלֹהִים עֹלִים וְיֹרְדִים בּוֹ׃", "rashi_he": "עולים וירדים. עוֹלִים תְּחִלָּה וְאַחַר כָּךְ יוֹרְדִים? מַלְאָכִים שֶׁלִּוּוּהוּ בָּאָרֶץ אֵין יוֹצְאִים חוּצָה לָאָרֶץ, וְעָלוּ לָרָקִיעַ וְיָרְדוּ מַלְאֲכֵי חוּצָה לָאָרֶץ לְלַוּוֹתוֹ:", "rashi_en": "המלאכים שליוו את יעקב בארץ ישראל אינם יוצאים לחוץ לארץ, ולכן עלו תחילה לרקיע, ואחר כך ירדו מלאכי חוץ לארץ ללוות אותו.", "note": "", "points": [{"q": "מַדּוּעַ נֶאֱמַר \"עֹלִים וְיֹרְדִים\", עוֹלִים תְּחִילָּה וְאַחַר כָּךְ יוֹרְדִים?", "options": ["מַלְאֲכֵי אֶרֶץ יִשְׂרָאֵל עָלוּ לָרָקִיעַ, וּמַלְאֲכֵי חוּץ לָאָרֶץ יָרְדוּ לְלַוּוֹתוֹ", "הַמַּלְאָכִים עָלוּ לְבַקֵּשׁ רְשׁוּת לְהָגֵן עָלָיו, וְאַחַר כָּךְ יָרְדוּ", "הַמַּלְאָכִים עָלוּ לְהִתְפַּלֵּל בַּעֲדוֹ, וְאַחַר כָּךְ יָרְדוּ לְהָבִיא בְּרָכָה"], "kasha": "מלאכים מקומם בשמים, והיה ראוי לומר שהם יורדים תחילה ואחר כך עולים.", "answer": "המלאכים שליוו את יעקב בארץ ישראל אינם יוצאים לחוץ לארץ, ולכן עלו לרקיע, וירדו מלאכי חוץ לארץ ללוותו.", "kp": ["מלאכים שלווהו בארץ", "ועלו לרקיע", "וירדו מלאכי חוצה לארץ"]}]}, {"id": "28:13.1", "ch": 28, "v": 13, "n": 1, "dh": "נצב עליו", "pasuk_html": "וְהִנֵּ֨ה יְהוָ֜ה <mark>נִצָּ֣ב עָלָיו֮</mark> וַיֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔יךָ וֵאלֹהֵ֖י יִצְחָ֑ק הָאָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔יהָ לְךָ֥ אֶתְּנֶ֖נָּה וּלְזַרְעֶֽךָ׃", "pasuk_en": "וְהִנֵּה יְהוָה נִצָּב עָלָיו וַיֹּאמַר אֲנִי יְהוָה אֱלֹהֵי אַבְרָהָם אָבִיךָ וֵאלֹהֵי יִצְחָק הָאָרֶץ אֲשֶׁר אַתָּה שֹׁכֵב עָלֶיהָ לְךָ אֶתְּנֶנָּה וּלְזַרְעֶךָ׃", "rashi_he": "נצב עליו. לְשָׁמְרוֹ:", "rashi_en": "ה' עמד על יעקב כדי לשמור עליו.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ 'נִצָּב עָלָיו' לְפִי רַשִׁ\"י?", "options": ["ה' עָמַד עַל יַעֲקֹב כְּדֵי לִשְׁמֹור אוֹתוֹ", "ה' עָמַד עַל רֹאשׁ הַסּוּלָּם מֵעַל הַמַּלְאָכִים", "ה' עָמַד לִפְנֵי יַעֲקֹב כְּדֵי לְדַבֵּר אִיתּוֹ פָּנִים אֶל פָּנִים"], "kasha": "מה פשר עמידתו של ה' 'עליו', על יעקב?", "answer": "לשמרו.", "kp": ["נצב עליו", "לשמרו"]}]}, {"id": "28:13.2", "ch": 28, "v": 13, "n": 2, "dh": "ואלהי יצחק", "pasuk_html": "וְהִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָיו֮ וַיֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔יךָ <mark>וֵאלֹהֵ֖י יִצְחָ֑ק</mark> הָאָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔יהָ לְךָ֥ אֶתְּנֶ֖נָּה וּלְזַרְעֶֽךָ׃", "pasuk_en": "וְהִנֵּה יְהוָה נִצָּב עָלָיו וַיֹּאמַר אֲנִי יְהוָה אֱלֹהֵי אַבְרָהָם אָבִיךָ וֵאלֹהֵי יִצְחָק הָאָרֶץ אֲשֶׁר אַתָּה שֹׁכֵב עָלֶיהָ לְךָ אֶתְּנֶנָּה וּלְזַרְעֶךָ׃", "rashi_he": "ואלהי יצחק. אַעַ\"פִּ שֶׁלֹּא מָצִינוּ בַּמִּקְרָא שֶׁיִּחֵד הַקָּבָּ\"ה שְׁמוֹ עַל הַצַּדִּיקִים בְּחַיֵּיהֶם לִכְתֹּב אֱלֹהֵי פְּלוֹנִי, מִשּׁוּם שֶׁנֶּאֱמַר הֵן בִּקְדֹשָׁו לֹא יַאֲמִין (איוב ט\"ו), כָּאן יִחֵד שְׁמוֹ עַל יִצְחָק, לְפִי שֶׁכָּהוּ עֵינָיו וְכָלוּא בַבַּיִת, וַהֲרֵי הוּא כְמֵת וְיֵצֶר הָרָע פָּסַק מִמֶּנּוּ, תַּנְחוּמָא:", "rashi_en": "בדרך כלל הקב\"ה אינו מייחד את שמו על צדיק בחייו, שהרי \"הן בקדשו לא יאמין\". אצל יצחק עשה כן, כי עיניו כהו והוא היה כלוא בביתו, ולכן נחשב כמת ויצר הרע פסק ממנו.", "note": "", "points": [{"q": "מַדּוּעַ יִיחֵד הַקָּבָּ\"ה אֶת שְׁמוֹ עַל יִצְחָק בְּעוֹדוֹ חַי?", "options": ["כִּי עֵינָיו כָּהוּ וְהָיָה כָּלוּא בַּבַּיִת, וְנֶחְשָׁב כְּמֵת", "כִּי יִצְחָק נֶעֱקַד עַל הַמִּזְבֵּחַ וְנֶחְשַׁב כְּקָרְבָּן שָׁלֵם", "כִּי יִצְחָק כְּבָר נִפְטַר בְּאוֹתָהּ שָׁעָה"], "kasha": "הקב\"ה אינו מייחד את שמו על צדיקים בחייהם, ויצחק עדיין היה חי.", "answer": "אף שאין הקב\"ה מייחד שמו על צדיקים בחייהם, כאן ייחד שמו על יצחק, לפי שכהו עיניו והיה כלוא בבית, והרי הוא כמת ויצר הרע פסק ממנו.", "kp": ["לפי שכהו עיניו וכלוא בבית", "והרי הוא כמת"]}]}, {"id": "28:13.3", "ch": 28, "v": 13, "n": 3, "dh": "שכב עליה", "pasuk_html": "וְהִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָיו֮ וַיֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔יךָ וֵאלֹהֵ֖י יִצְחָ֑ק הָאָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ <mark>שֹׁכֵ֣ב עָלֶ֔יהָ</mark> לְךָ֥ אֶתְּנֶ֖נָּה וּלְזַרְעֶֽךָ׃", "pasuk_en": "וְהִנֵּה יְהוָה נִצָּב עָלָיו וַיֹּאמַר אֲנִי יְהוָה אֱלֹהֵי אַבְרָהָם אָבִיךָ וֵאלֹהֵי יִצְחָק הָאָרֶץ אֲשֶׁר אַתָּה שֹׁכֵב עָלֶיהָ לְךָ אֶתְּנֶנָּה וּלְזַרְעֶךָ׃", "rashi_he": "שכב עליה. קִפֵּל הַקָּבָּ\"ה כָּל אֶרֶץ יִשְׂרָאֵל תַּחְתָּיו, רָמַז לוֹ שֶׁתְּהֵא נוֹחָה לִכָּבֵשׁ לְבָנָיו כְּד' אַמּוֹת שֶׁזֶּה מְקוֹמוֹ שֶׁל אָדָם (חולין שם):", "rashi_en": "הקב\"ה קיפל את כל ארץ ישראל תחת יעקב, וכך רמז לו שהארץ תהיה קלה לכיבוש לבניו כמו ארבע אמות, שהן מקומו של אדם.", "note": "", "points": [{"q": "מַדּוּעַ נֶאֱמַר עַל כָּל הָאָרֶץ \"אֲשֶׁר אַתָּה שֹׁכֵב עָלֶיהָ\", וַהֲרֵי יַעֲקֹב שָׁכַב עַל מָקוֹם קָטָן?", "options": ["הַקָּבָּ\"ה קִיפֵּל אֶת כָּל אֶרֶץ יִשְׂרָאֵל תַּחַת יַעֲקֹב", "הַכַּוָּונָה רַק לְאַרְבַּע הָאַמּוֹת שֶׁעֲלֵיהֶן שָׁכַב יַעֲקֹב", "יַעֲקֹב שָׁכַב עַל אֶבֶן שֶׁנִּלְקְחָה מִכָּל אֶרֶץ יִשְׂרָאֵל"], "kasha": "יעקב שכב על מקום קטן, ואיך נאמר שהוא שוכב על הארץ כולה שתינתן לו.", "answer": "הקב\"ה קיפל את כל ארץ ישראל תחתיו.", "kp": ["קפל הקב\"ה כל ארץ ישראל תחתיו"]}, {"q": "מָה רָמַז הַקָּב\"ה לְיַעֲקֹב בְּכָךְ שֶׁקִּיפֵּל אֶת הָאָרֶץ תַּחְתָּיו?", "options": ["שֶׁהָאָרֶץ תִּהְיֶה נוֹחָה לְבָנָיו לִכְבּוֹשׁ כְּמוֹ אַרְבַּע אַמּוֹת", "שֶׁהָאָרֶץ תִּהְיֶה קְטַנָּה וְלֹא תַּסְפִּיק לְכָל בָּנָיו", "שֶׁיַּעֲקֹב עַצְמוֹ יִכְבּוֹשׁ אֶת כָּל הָאָרֶץ בְּחַיָּיו"], "kasha": "יש להבין מה טעם הנס שהקב\"ה קיפל את הארץ תחת יעקב.", "answer": "רמז לו שתהיה הארץ נוחה לכבוש לבניו כארבע אמות, שזה מקומו של אדם.", "kp": ["רמז לו שתהא נוחה לכבש לבניו", "כד' אמות"]}]}, {"id": "28:14.1", "ch": 28, "v": 14, "n": 1, "dh": "ופרצת", "pasuk_html": "וְהָיָ֤ה זַרְעֲךָ֙ כַּעֲפַ֣ר הָאָ֔רֶץ <mark>וּפָרַצְתָּ֛</mark> יָ֥מָּה וָקֵ֖דְמָה וְצָפֹ֣נָה וָנֶ֑גְבָּה וְנִבְרֲכ֥וּ בְךָ֛ כָּל־מִשְׁפְּחֹ֥ת הָאֲדָמָ֖ה וּבְזַרְעֶֽךָ׃", "pasuk_en": "וְהָיָה זַרְעֲךָ כַּעֲפַר הָאָרֶץ וּפָרַצְתָּ יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה וְנִבְרֲכוּ בְךָ כָּל־מִשְׁפְּחֹת הָאֲדָמָה וּבְזַרְעֶךָ׃", "rashi_he": "ופרצת. וְחָזַקְתָּ, כְּמוֹ וְכֵן יִפְרֹץ:", "rashi_en": "\"ופרצת\" פירושו: ותתחזק ותתרבה, כמו \"וכן יפרץ\".", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וּפָרַצְתָּ\" לְפִי רַשִׁ\"י?", "options": ["וַתִּתְחַזֵּק", "וְתִשְׁבּוֹר חוֹמוֹת שֶׁל אוֹיְבִים", "וְתִתְפַּזֵּר בַּגָּלוּת בֵּין הָעַמִּים"], "kasha": "\"ופרצת\" נשמע כלשון פריצה ושבירה, ואינו מתאים לברכה.", "answer": "\"ופרצת\" פירושו \"וחזקת\", כמו \"וכן יפרץ\".", "kp": ["וחזקת"]}]}, {"id": "28:15.1", "ch": 28, "v": 15, "n": 1, "dh": "אנכי עמך", "pasuk_html": "וְהִנֵּ֨ה <mark>אָנֹכִ֜י עִמָּ֗ךְ</mark> וּשְׁמַרְתִּ֙יךָ֙ בְּכֹ֣ל אֲשֶׁר־תֵּלֵ֔ךְ וַהֲשִׁ֣בֹתִ֔יךָ אֶל־הָאֲדָמָ֖ה הַזֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְךָ֔ עַ֚ד אֲשֶׁ֣ר אִם־עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר־דִּבַּ֖רְתִּי לָֽךְ׃", "pasuk_en": "וְהִנֵּה אָנֹכִי עִמָּךְ וּשְׁמַרְתִּיךָ בְּכֹל אֲשֶׁר־תֵּלֵךְ וַהֲשִׁבֹתִיךָ אֶל־הָאֲדָמָה הַזֹּאת כִּי לֹא אֶעֱזָבְךָ עַד אֲשֶׁר אִם־עָשִׂיתִי אֵת אֲשֶׁר־דִּבַּרְתִּי לָךְ׃", "rashi_he": "אנכי עמך. לְפִי שֶׁהָיָה יָרֵא מֵעֵשָׂו וּמִלָּבָן:", "rashi_en": "ה׳ הבטיח ליעקב להיות עמו, מפני שיעקב פחד גם מעשו וגם מלבן.", "note": "", "points": [{"q": "לָמָּה הוּצְרַךְ ה׳ לְהַבְטִיחַ לְיַעֲקֹב ״אָנֹכִי עִמָּךְ״?", "options": ["מִפְּנֵי שֶׁיַּעֲקֹב פָּחַד מֵעֵשָׂו וּמִלָּבָן", "מִפְּנֵי שֶׁיַּעֲקֹב פָּחַד מֵחַיּוֹת הַשָּׂדֶה בַּדֶּרֶךְ", "מִפְּנֵי שֶׁיַּעֲקֹב חָשַׁשׁ שֶׁלֹּא יִמְצָא אִשָּׁה בְּחָרָן"], "kasha": "מה הצורך בהבטחה מיוחדת שה׳ יהיה עם יעקב?", "answer": "לפי שהיה ירא מעשו ומלבן.", "kp": ["לפי שהיה ירא מעשו ומלבן"]}]}, {"id": "28:15.2", "ch": 28, "v": 15, "n": 2, "dh": "עד אשר אם עשיתי", "pasuk_html": "וְהִנֵּ֨ה אָנֹכִ֜י עִמָּ֗ךְ וּשְׁמַרְתִּ֙יךָ֙ בְּכֹ֣ל אֲשֶׁר־תֵּלֵ֔ךְ וַהֲשִׁ֣בֹתִ֔יךָ אֶל־הָאֲדָמָ֖ה הַזֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְךָ֔ <mark>עַ֚ד אֲשֶׁ֣ר אִם־עָשִׂ֔יתִי</mark> אֵ֥ת אֲשֶׁר־דִּבַּ֖רְתִּי לָֽךְ׃", "pasuk_en": "וְהִנֵּה אָנֹכִי עִמָּךְ וּשְׁמַרְתִּיךָ בְּכֹל אֲשֶׁר־תֵּלֵךְ וַהֲשִׁבֹתִיךָ אֶל־הָאֲדָמָה הַזֹּאת כִּי לֹא אֶעֱזָבְךָ עַד אֲשֶׁר אִם־עָשִׂיתִי אֵת אֲשֶׁר־דִּבַּרְתִּי לָךְ׃", "rashi_he": "עד אשר אם עשיתי. אִם מְשַׁמֵּשׁ בִּלְשׁוֹן כִּי (גיטין צ'):", "rashi_en": "המילה ״אם״ כאן אינה לשון תנאי אלא במשמעות ״כי״, כלומר: עד שאעשה את מה שהבטחתי לך.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָּה ״אִם־״ בַּבִּיטּוּי ״עַד אֲשֶׁר אִם־עָשִׂיתִי״?", "options": ["בִּלְשׁוֹן ״כִּי״, כְּלוֹמַר: עַד שֶׁאֶעֱשֶׂה", "לְשׁוֹן תְּנַאי: אִם אֶעֱשֶׂה וְאִם לֹא אֶעֱשֶׂה", "לְשׁוֹן שְׁאֵלָה: הַאִם עָשִׂיתִי"], "kasha": "המילה ״אם״ היא בדרך כלל לשון תנאי, ואין לתנאי מקום בהבטחה ודאית של ה׳.", "answer": "״אם״ כאן משמש בלשון ״כי״, כלומר עד שאעשה את אשר דיברתי לך.", "kp": ["אם משמש בלשון כי"]}]}, {"id": "28:15.3", "ch": 28, "v": 15, "n": 3, "dh": "דברתי לך", "pasuk_html": "וְהִנֵּ֨ה אָנֹכִ֜י עִמָּ֗ךְ וּשְׁמַרְתִּ֙יךָ֙ בְּכֹ֣ל אֲשֶׁר־תֵּלֵ֔ךְ וַהֲשִׁ֣בֹתִ֔יךָ אֶל־הָאֲדָמָ֖ה הַזֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְךָ֔ עַ֚ד אֲשֶׁ֣ר אִם־עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר־<mark>דִּבַּ֖רְתִּי לָֽךְ׃</mark>", "pasuk_en": "וְהִנֵּה אָנֹכִי עִמָּךְ וּשְׁמַרְתִּיךָ בְּכֹל אֲשֶׁר־תֵּלֵךְ וַהֲשִׁבֹתִיךָ אֶל־הָאֲדָמָה הַזֹּאת כִּי לֹא אֶעֱזָבְךָ עַד אֲשֶׁר אִם־עָשִׂיתִי אֵת אֲשֶׁר־דִּבַּרְתִּי לָךְ׃", "rashi_he": "דברתי לך. לְצָרְכְּךָ וְעָלֶיךָ; מַה שֶּׁהִבְטַחְתִּי לְאַבְרָהָם עַל זַרְעוֹ, לְךָ הִבְטַחְתִּיו וְלֹא לְעֵשָׂו, שֶׁלֹּא אָמַרְתִּי לוֹ כִּי יִצְחָק יִקָּרֵא לְךָ זָרַע אֶלָּא כִּי בְיִצְחָק, וְלֹא כָּל יִצְחָק, וְכֵן כָּל לִי וּלְךָ וְלוֹ וְלָהֶם הַסְּמוּכִים אֵצֶל דִּבּוּר מְשַׁמְּשִׁים לְשוֹן עַל, וְזֶה יוֹכִיחַ, שֶׁהֲרֵי עִם יַעֲקֹב לֹא דִבֵּר קֹדֶם לָכֵן:", "rashi_en": "\"לך\" כאן פירושו עליך ולצרכך: מה שהבטיח ה' לאברהם על זרעו נאמר על יעקב ולא על עשו, שהרי נאמר \"כי ביצחק\" – ולא כל יצחק. וכן כל \"לי, לך, לו, להם\" הסמוכים ללשון דיבור פירושם \"על\".", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"לָךְ\" בְּמִילִּים \"דִּבַּרְתִּי לָךְ\"?", "options": ["עָלֶיךָ וּלְצָרְכֶּךָ – הַדִּיבּוּר נֶאֱמַר בְּעִנְיָינֶךָ", "אֵלֶיךָ – הַדִּיבּוּר נֶאֱמַר לְיַעֲקֹב עַצְמוֹ קוֹדֶם לָכֵן", "לְפָנֶיךָ – דִּיבּוּר שֶׁנֶּאֱמַר בְּנוֹכְחוּתְךָ לְאָבִיךָ"], "kasha": "ה' לא דיבר עם יעקב לפני כן, ומה פירוש \"אשר דברתי לך\"?", "answer": "\"לך\" פירושו לצרכך ועליך, שהרי עם יעקב לא דיבר קודם לכן; וכן כל לי ולך ולו ולהם הסמוכים לדיבור משמשים לשון \"על\".", "kp": ["לצרכך ועליך"]}, {"q": "לְאֵיזֶה דִּיבּוּר קוֹדֵם מִתְכַּוֵּון ה' לְפִי רַשִׁ\"י?", "options": ["לַהַבְטָחָה לְאַבְרָהָם עַל זַרְעוֹ, שֶׁנֶּאֶמְרָה עַל יַעֲקֹב וְלֹא עַל עֵשָׂו", "לַבְּרָכָה שֶׁבֵּירַךְ יִצְחָק אֶת יַעֲקֹב לִפְנֵי צֵאתוֹ לְחָרָן", "לִנְבוּאָה שֶׁנֶּאֶמְרָה לְרִבְקָה שֶׁרַב יַעֲבוֹד צָעִיר"], "kasha": "על איזו הבטחה קודמת חוזר ה' כשהוא אומר \"את אשר דברתי לך\"?", "answer": "על מה שהבטיח לאברהם על זרעו; לא נאמר \"כי יצחק יקרא לך זרע\" אלא \"כי ביצחק\" – ולא כל יצחק, ולכן ההבטחה היא ליעקב ולא לעשו.", "kp": ["מה שהבטחתי לאברהם על זרעו", "לך הבטחתיו ולא לעשו"]}]}, {"id": "28:16.1", "ch": 28, "v": 16, "n": 1, "dh": "ואנכי לא ידעתי", "pasuk_html": "וַיִּיקַ֣ץ יַעֲקֹב֮ מִשְּׁנָתוֹ֒ וַיֹּ֕אמֶר אָכֵן֙ יֵ֣שׁ יְהוָ֔ה בַּמָּק֖וֹם הַזֶּ֑ה <mark>וְאָנֹכִ֖י לֹ֥א יָדָֽעְתִּי׃</mark>", "pasuk_en": "וַיִּיקַץ יַעֲקֹב מִשְּׁנָתוֹ וַיֹּאמֶר אָכֵן יֵשׁ יְהוָה בַּמָּקוֹם הַזֶּה וְאָנֹכִי לֹא יָדָעְתִּי׃", "rashi_he": "ואנכי לא ידעתי. שֶׁאִם יָדַעְתִּי, לֹא יָשַׁנְתִּי בְּמָקוֹם קָדוֹשׁ כָּזֶה:", "rashi_en": "יעקב אומר שאילו ידע שהמקום קדוש כל כך, לא היה ישן בו.", "note": "", "points": [{"q": "מָה רָצָה יַעֲקֹב לוֹמַר בְּמִילִּים \"וְאָנֹכִי לֹא יָדָעְתִּי\"?", "options": ["שֶׁאִילּוּ יָדַע שֶׁהַמָּקוֹם קָדוֹשׁ, לֹא הָיָה יָשֵׁן בּוֹ", "שֶׁלֹּא יָדַע שֶׁה׳ מִתְגַּלֶּה גַּם מִחוּץ לְבֵית אָבִיו", "שֶׁלֹּא יָדַע שֶׁהַמַּלְאָכִים מְלַוִּוים אוֹתוֹ בְּדַרְכּוֹ"], "kasha": "מה החשיבות בכך שיעקב לא ידע, ולמה הוא מזכיר זאת?", "answer": "שאם היה יודע, לא היה ישן במקום קדוש כזה.", "kp": ["שאם ידעתי, לא ישנתי", "במקום קדוש כזה"]}]}, {"id": "28:17.1", "ch": 28, "v": 17, "n": 1, "dh": "כי אם בית אלהים", "pasuk_html": "וַיִּירָא֙ וַיֹּאמַ֔ר מַה־נּוֹרָ֖א הַמָּק֣וֹם הַזֶּ֑ה אֵ֣ין זֶ֗ה <mark>כִּ֚י אִם־בֵּ֣ית אֱלֹהִ֔ים</mark> וְזֶ֖ה שַׁ֥עַר הַשָּׁמָֽיִם׃", "pasuk_en": "וַיִּירָא וַיֹּאמַר מַה־נּוֹרָא הַמָּקוֹם הַזֶּה אֵין זֶה כִּי אִם־בֵּית אֱלֹהִים וְזֶה שַׁעַר הַשָּׁמָיִם׃", "rashi_he": "כי אם בית אלהים. אָ\"רַ אֶלְעָזָר בְּשֵׁם רַבִּי יוֹסֵי בֶּן זִמְרָא, הַסֻּלָּם הַזֶּה עוֹמֵד בִּבְאֵר שֶׁבַע וְאֶמְצַע שִׁפּוּעוֹ מַגִּיעַ כְּנֶגֶד בֵּית הַמִּקְדָשׁ, שֶׁבְּאֵר שֶׁבַע עוֹמֵד בִּדְרוֹמָהּ שֶׁל יְהוּדָה, וִירוּשָׁלַיִם בִּצְפוֹנָהּ, בַּגְּבוּל שֶׁבֵּין יְהוּדָה וּבִנְיָמִין, וּבֵית אֵל הָיָה בַּצָּפוֹן שֶׁל נַחֲלַת בִּנְיָמִין, בַּגְּבוּל שֶׁבֵּין בִּנְיָמִין וּבֵין בְּנֵי יוֹסֵף; נִמְצָא סֻלָּם שֶׁרַגְלָיו בִּבְאֵר שֶׁבַע וְרֹאשׁוֹ בְּבֵית אֵל מַגִּיעַ אֶמְצַע שִׁפּוּעוֹ נֶגֶד יְרוּשָׁלַיִם; וּכְלַפֵּי שֶׁאָמְרוּ רַבּוֹתֵינוּ שֶׁאָמַר הַקָּבָּ\"ה צַדִּיק זֶה בָּא לְבֵית מְלוֹנִי וְיִפָּטֵר בְּלֹא לִינָה, וְאָמְרוּ יַעֲקֹב קְרָאָהּ לִירוּשָׁלַיִם בֵּית אֵל וְזוֹ לוּז הִיא וְלֹא יְרוּשָׁלַיִם, וּמֵהֵיכָן לָמְדוּ לוֹמַר כֵּן? אֲנִי אוֹמֵר שֶׁנֶּעֱקַר הַר הַמּוֹרִיָה וּבָא לְכָאן, וְזוֹ הִיא קְפִיצַת הָאָרֶץ הָאֲמוּרָה בִּשְׁחִיטַת חֻלִּין, שֶׁבָּא בֵּית הַמִּקְדָשׁ לִקְרָאתוֹ עַד בֵּית אֵל, וְזֶהוּ וַיִּפְגַּע בַּמָּקוֹם. וְאִם תֹּאמַר כְּשֶׁעָבַר יַעֲקֹב עַל בֵּית הַמִּקְדָשׁ, מַדּוּעַ לֹא עִכְּבוֹ שָׁם? אִיהוּ לָא יְהַב לִבֵּיהּ לְהִתְפַּלֵּל בַּמָּקוֹם שֶׁהִתְפַּלְּלוּ אֲבוֹתָיו, וּמִן הַשָּׁמַיִם יְעַכְּבוּהוּ? אִיהוּ עַד חָרָן אֲזַל, כִּדְאָמְרִינַן בְּפֶרֶק גִּיד הַנָּשֶׁה; וּקְרָא מוֹכִיחַ וַיֵּלֶךְ חָרָנָה; כִּי מְטָא לְחָרָן אָמַר, אֶפְשָׁר שֶׁעָבַרְתִּי עַל מָקוֹם שֶׁהִתְפַּלְּלוּ אֲבוֹתַי וְלֹא הִתְפַּלַּלְתִּי בּוֹ? יְהַב דַּעְתֵּיהּ לְמֶהֱדַר וְחָזַר עַד בֵּית אֵל וְקָפְצָה לוֹ הָאָרֶץ. הַאי בֵּית אֵל לֹא הַסָּמוּךְ לָעַי אֶלָּא לִירוּשָׁלַיִם, וְעַל שֵׁם יִהְיֶה בֵּית אֱלֹהִים קְרָאוֹ בֵּית אֵל, וְהוּא הַר הַמּוֹרִיָה שֶׁהִתְפַּלֵּל בּוֹ אַבְרָהָם, וְהוּא שָׂדֶה שֶׁהִתְפַּלֵּל בּוֹ יִצְחָק, כְּדִכְתִיב לָשׂוּחַ בַּשָּׂדֶה; דְּהָכִי אָמְרִינַן בִּפְסָחִים \"אֶל הַר ד' וְאֶל בֵּית אֱלֹהֵי יַעֲקֹב\" – מַאי שְׁנָא יַעֲקֹב? אֶלָּא לֹא כְּאַבְרָהָם שֶׁקְּרָאוֹ הַר, דִּכְתִיב בְּהַר ד' יֵרָאֶה, וְלֹא כְּיִצְחָק שֶׁקְּרָאוֹ שָׂדֶה, דִּכְתִיב לָשׂוּחַ בַּשָּׂדֶה, אֶלָּא כְּיַעֲקֹב שֶׁקְּרָאוֹ בַּיִת (עַ\"כַּ פֵּרַשִׁ\"י מְדֻיָּק):", "rashi_en": "הסולם עמד בבאר שבע וראשו בבית אל, ואמצע שיפועו היה כנגד ירושלים. רש\"י מסביר שהר המוריה נעקר ובא לקראת יעקב עד בית אל, וזו קפיצת הארץ. יעקב הגיע עד חרן, הצטער שעבר על מקום שהתפללו בו אבותיו ולא התפלל, חזר, וקפצה לו הארץ.", "note": "", "points": [{"q": "אֵיךְ מְיַיֵּשֵׁב רַשִׁ\"י שֶׁיַּעֲקֹב הָיָה בְּלוּז, וּבְכָל זֹאת חַז\"ל אוֹמְרִים שֶׁזֶּה מְקוֹם בֵּית הַמִּקְדָּשׁ?", "options": ["הַר הַמּוֹרִיָּה נֶעֱקַר וּבָא לִקְרָאתוֹ עַד בֵּית אֵל", "לוּז וִירוּשָׁלַיִם הֵן שְׁנֵי שֵׁמוֹת לְאוֹתָהּ עִיר", "יַעֲקֹב חָלַם שֶׁהוּא נִמְצָא בִּירוּשָׁלַיִם אַף שֶׁהָיָה בְּלוּז"], "kasha": "המקום שיעקב קרא לו בית אל הוא לוז ולא ירושלים, ומהיכן למדו חז\"ל שזה מקום המקדש?", "answer": "הר המוריה נעקר ובא לכאן, וזו קפיצת הארץ האמורה בחולין, שבא בית המקדש לקראתו עד בית אל.", "kp": ["שנעקר הר המוריה ובא לכאן", "שבא בית המקדש לקראתו"]}, {"q": "לָמָּה לֹא עִיכְּבוּ מִן הַשָּׁמַיִם אֶת יַעֲקֹב כְּשֶׁעָבַר עַל מְקוֹם הַמִּקְדָּשׁ בְּדַרְכּוֹ לְחָרָן?", "options": ["כִּי הוּא עַצְמוֹ לֹא שָׂם לִבּוֹ לְהִתְפַּלֵּל שָׁם", "כִּי עֲדַיִין לֹא הִגִּיעַ זְמַן בִּנְיַית הַמִּקְדָּשׁ", "כִּי הָיָה צָרִיךְ לְמַהֵר מִפְּנֵי עֵשָׂו שֶׁרָדַף אַחֲרָיו"], "kasha": "אם עבר יעקב על מקום המקדש, מדוע לא עכבוהו שם?", "answer": "הוא לא נתן לבו להתפלל במקום שהתפללו אבותיו, ומן השמים יעכבוהו? כשהגיע לחרן הצטער, החליט לחזור, וחזר עד בית אל וקפצה לו הארץ.", "kp": ["איהו לא יהב לביה להתפלל", "ומן השמים יעכבוהו"]}]}, {"id": "28:17.2", "ch": 28, "v": 17, "n": 2, "dh": "מה נורא", "pasuk_html": "וַיִּירָא֙ וַיֹּאמַ֔ר <mark>מַה־נּוֹרָ֖א</mark> הַמָּק֣וֹם הַזֶּ֑ה אֵ֣ין זֶ֗ה כִּ֚י אִם־בֵּ֣ית אֱלֹהִ֔ים וְזֶ֖ה שַׁ֥עַר הַשָּׁמָֽיִם׃", "pasuk_en": "וַיִּירָא וַיֹּאמַר מַה־נּוֹרָא הַמָּקוֹם הַזֶּה אֵין זֶה כִּי אִם־בֵּית אֱלֹהִים וְזֶה שַׁעַר הַשָּׁמָיִם׃", "rashi_he": "מה נורא. תַּרְגּוּם מַה דְּחִילוּ אַתְרָא הָדֵין, דְּחִילוּ שֵׁם דָּבָר הוּא, כְּמוֹ סוּכְלְתָנוּ וּכְסוּ לְמִלְבָּשׁ:", "rashi_en": "אונקלוס תרגם \"מה דחילו אתרא הדין\". רש\"י מסביר ש\"דחילו\" הוא שם דבר (יראה), כמו \"סוכלתנו\" ו\"כסו למלבש\".", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַה צוּרַת הַמִּילָּה \"דְּחִילוּ\" בְּתַרְגּוּם אוּנְקְלוֹס?", "options": ["שֵׁם דָּבָר שֶׁפֵּירוּשׁוֹ יִרְאֶה, כְּמוֹ \"סוּכְלְתָנוּ\" וְ\"כִּסּוּ\"", "לְשׁוֹן רַבִּים: אֲנָשִׁים יְרֵאִים", "פּוֹעַל בֶּעָבָר: הֵם פָּחֲדוּ מִן הַמָּקוֹם"], "kasha": "המילה \"דחילו\" בתרגום נראית כלשון רבים או כפועל, ויש לברר את צורתה.", "answer": "\"דחילו\" הוא שם דבר, כמו \"סוכלתנו\" ו\"כסו למלבש\".", "kp": ["דחילו שם דבר הוא", "כמו סוכלתנו וכסו למלבש"]}]}, {"id": "28:17.3", "ch": 28, "v": 17, "n": 3, "dh": "וזה שער השמים", "pasuk_html": "וַיִּירָא֙ וַיֹּאמַ֔ר מַה־נּוֹרָ֖א הַמָּק֣וֹם הַזֶּ֑ה אֵ֣ין זֶ֗ה כִּ֚י אִם־בֵּ֣ית אֱלֹהִ֔ים <mark>וְזֶ֖ה שַׁ֥עַר הַשָּׁמָֽיִם׃</mark>", "pasuk_en": "וַיִּירָא וַיֹּאמַר מַה־נּוֹרָא הַמָּקוֹם הַזֶּה אֵין זֶה כִּי אִם־בֵּית אֱלֹהִים וְזֶה שַׁעַר הַשָּׁמָיִם׃", "rashi_he": "וזה שער השמים. מְקוֹם תְּפִלָּה לַעֲלוֹת תְּפִלָּתָם הַשָּׁמַיְמָה. וּמִדְרָשׁוֹ, שֶׁבֵּית הַמִּקְדָשׁ שֶׁל מַעְלָה מְכֻוָּן כְּנֶגֶד בֵּית הַמִּקְדָשׁ שֶׁל מַטָּה:", "rashi_en": "לפי הפשט, זהו מקום תפילה, שממנו עולות התפילות לשמים. ולפי המדרש, בית המקדש של מעלה מכוון בדיוק כנגד בית המקדש של מטה, שעתיד להיבנות במקום הזה.", "note": "", "points": [{"q": "לְפִי הַפְּשָׁט, מַדּוּעַ נִקְרָא הַמָּקוֹם \"שַׁעַר הַשָּׁמָיִם\"?", "options": ["כִּי מִשָּׁם עוֹלוֹת הַתְּפִילּוֹת לַשָּׁמַיִם", "כִּי מִמֶּנּוּ עָלוּ וְיָרְדוּ הַמַּלְאָכִים בַּסֻּולָּם", "כִּי שָׁם נִפְתְּחוּ הַשָּׁמַיִם וְנִגְלָה כְּבוֹד ה'"], "kasha": "אין לשמים שער ממשי, ויש להבין מה פירוש \"שער השמים\".", "answer": "זהו מקום תפילה, שבו עולות התפילות השמימה.", "kp": ["מקום תפלה לעלות תפלתם השמימה"]}, {"q": "מָה מְלַמֵּד הַמִּדְרָשׁ עַל \"שַׁעַר הַשָּׁמָיִם\"?", "options": ["בֵּית הַמִּקְדָּשׁ שֶׁל מַעְלָה מְכוּוָּן כְּנֶגֶד בֵּית הַמִּקְדָּשׁ שֶׁל מַטָּה", "בֶּעָתִיד יִיבָּנֶה בַּמָּקוֹם הַזֶּה שַׁעַר לָעִיר יְרוּשָׁלַיִם", "הַמַּלְאָכִים שׁוֹמְרִים עַל שַׁעַר הַשָּׁמַיִם בַּמָּקוֹם הַזֶּה"], "kasha": "המילה \"שער\" מרמזת על מעבר ישיר בין המקום הזה לשמים.", "answer": "לפי המדרש, בית המקדש של מעלה מכוון כנגד בית המקדש של מטה.", "kp": ["שבית המקדש של מעלה מכון", "כנגד בית המקדש של מטה"]}]}, {"id": "28:20.1", "ch": 28, "v": 20, "n": 1, "dh": "אם יהיה אלהים עמדי", "pasuk_html": "וַיִּדַּ֥ר יַעֲקֹ֖ב נֶ֣דֶר לֵאמֹ֑ר <mark>אִם־יִהְיֶ֨ה אֱלֹהִ֜ים עִמָּדִ֗י</mark> וּשְׁמָרַ֙נִי֙ בַּדֶּ֤רֶךְ הַזֶּה֙ אֲשֶׁ֣ר אָנֹכִ֣י הוֹלֵ֔ךְ וְנָֽתַן־לִ֥י לֶ֛חֶם לֶאֱכֹ֖ל וּבֶ֥גֶד לִלְבֹּֽשׁ׃", "pasuk_en": "וַיִּדַּר יַעֲקֹב נֶדֶר לֵאמֹר אִם־יִהְיֶה אֱלֹהִים עִמָּדִי וּשְׁמָרַנִי בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ וְנָתַן־לִי לֶחֶם לֶאֱכֹל וּבֶגֶד לִלְבֹּשׁ׃", "rashi_he": "אם יהיה אלהים עמדי. אִם יִשְׁמֹר לִי הַבְטָחוֹת הַלָּלוּ שֶׁהִבְטִיחַנִי לִהְיוֹת עִמָּדִי, כְּמוֹ שֶׁאָמַר לִי וְהִנֵּה אָנֹכִי עִמָּךְ:", "rashi_en": "יעקב לא הסתפק בהבטחת ה', אלא התכוון: אם ישמור ה' את ההבטחות שהבטיח לי להיות עמי, כמו שאמר \"והנה אנכי עמך\".", "note": "", "points": [{"q": "מָה כַּוָּונַת יַעֲקֹב בְּאָמְרוֹ \"אִם־יִהְיֶה אֱלֹהִים עִמָּדִי\"?", "options": ["אִם ה' יְקַיֵּים אֶת הַבְטָחָתוֹ לִהְיוֹת עִמּוֹ", "אִם ה' יִתְגַּלֶּה אֵלָיו שׁוּב בַּחֲלוֹם", "אִם ה' יַחֲזִיר אוֹתוֹ מִיָּד לְבֵית אָבִיו"], "kasha": "ה' כבר הבטיח ליעקב \"והנה אנכי עמך\", ומדוע הוא אומר \"אם\"?", "answer": "אם ישמור לי ה' את ההבטחות שהבטיחני להיות עמי, כמו שאמר לי \"והנה אנכי עמך\".", "kp": ["אם ישמר לי הבטחות הללו", "שהבטיחני להיות עמדי"]}]}, {"id": "28:20.2", "ch": 28, "v": 20, "n": 2, "dh": "ושמרני", "pasuk_html": "וַיִּדַּ֥ר יַעֲקֹ֖ב נֶ֣דֶר לֵאמֹ֑ר אִם־יִהְיֶ֨ה אֱלֹהִ֜ים עִמָּדִ֗י <mark>וּשְׁמָרַ֙נִי֙</mark> בַּדֶּ֤רֶךְ הַזֶּה֙ אֲשֶׁ֣ר אָנֹכִ֣י הוֹלֵ֔ךְ וְנָֽתַן־לִ֥י לֶ֛חֶם לֶאֱכֹ֖ל וּבֶ֥גֶד לִלְבֹּֽשׁ׃", "pasuk_en": "וַיִּדַּר יַעֲקֹב נֶדֶר לֵאמֹר אִם־יִהְיֶה אֱלֹהִים עִמָּדִי וּשְׁמָרַנִי בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ וְנָתַן־לִי לֶחֶם לֶאֱכֹל וּבֶגֶד לִלְבֹּשׁ׃", "rashi_he": "ושמרני. כְּמוֹ שֶׁאָמַר לִי וּשְׁמַרְתִּיךָ בְּכֹל אֲשֶׁר תֵּלֵךְ:", "rashi_en": "יעקב ביקש ״ושמרני״ כפי שה׳ כבר הבטיח לו: ״ושמרתיך בכל אשר תלך״.", "note": "", "points": [{"q": "עַל מָה מְבוּסֶּסֶת בַּקָּשָׁתוֹ שֶׁל יַעֲקֹב ״וּשְׁמָרַנִי״?", "options": ["עַל הַבְטָחַת ה׳ ״וּשְׁמַרְתִּיךָ בְּכֹל אֲשֶׁר תֵּלֵךְ״", "עַל הַבְּרָכָה שֶׁבֵּירַךְ אוֹתוֹ יִצְחָק אָבִיו", "עַל הַבְטָחָה שֶׁנָּתַן ה׳ לְאַבְרָהָם בִּבְרִית בֵּין הַבְּתָרִים"], "kasha": "ה׳ כבר הבטיח לשמור את יעקב; מה פשר בקשתו ״ושמרני״?", "answer": "יעקב מבקש שיתקיים מה שאמר לו ה׳: ״ושמרתיך בכל אשר תלך״.", "kp": ["ושמרתיך בכל אשר תלך"]}]}, {"id": "28:20.3", "ch": 28, "v": 20, "n": 3, "dh": "ונתן לי לחם לאכל", "pasuk_html": "וַיִּדַּ֥ר יַעֲקֹ֖ב נֶ֣דֶר לֵאמֹ֑ר אִם־יִהְיֶ֨ה אֱלֹהִ֜ים עִמָּדִ֗י וּשְׁמָרַ֙נִי֙ בַּדֶּ֤רֶךְ הַזֶּה֙ אֲשֶׁ֣ר אָנֹכִ֣י הוֹלֵ֔ךְ <mark>וְנָֽתַן־לִ֥י לֶ֛חֶם לֶאֱכֹ֖ל</mark> וּבֶ֥גֶד לִלְבֹּֽשׁ׃", "pasuk_en": "וַיִּדַּר יַעֲקֹב נֶדֶר לֵאמֹר אִם־יִהְיֶה אֱלֹהִים עִמָּדִי וּשְׁמָרַנִי בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ וְנָתַן־לִי לֶחֶם לֶאֱכֹל וּבֶגֶד לִלְבֹּשׁ׃", "rashi_he": "ונתן לי לחם לאכל. כְּמוֹ שֶׁאָמַר כִּי לֹא אֶעֱזָבְךָ, וְהַמְבַקֵּשׁ לֶחֶם הוּא קָרוּי נֶעֱזָב, שֶׁנֶּאֱמַר וְלֹא רָאִיתִי צַדִּיק נֶעֱזָב וְזַרְעוֹ מְבַקֶּשׁ לָחֶם (תהילים ל\"ז):", "rashi_en": "יעקב ביקש בדיוק מה שה׳ הבטיח לו ״כי לא אעזבך״, כי מי שצריך לבקש לחם נקרא ״נעזב״, כמו שכתוב ״ולא ראיתי צדיק נעזב וזרעו מבקש לחם״.", "note": "", "points": [{"q": "עַל אֵיזוֹ הַבְטָחָה שֶׁל ה׳ מְבוּסֶּסֶת בַּקָּשָׁתוֹ שֶׁל יַעֲקֹב ״וְנָתַן־לִי לֶחֶם לֶאֱכֹל״?", "options": ["עַל הַהַבְטָחָה ״כִּי לֹא אֶעֶזָבְךָ״", "עַל הַהַבְטָחָה ״וַהֲשִׁבֹתִיךָ אֶל הָאֲדָמָה הַזֹּאת״", "עַל הַהַבְטָחָה ״וּפָרַצְתָּ יָמָּה וָקֵדְמָה״"], "kasha": "ה׳ לא הבטיח ליעקב במפורש לחם, ולמה הוא מבקש זאת כחלק ממה שהובטח לו?", "answer": "כך אמר ה׳ ״כי לא אעזבך״, ומי שמבקש לחם נקרא נעזב, שנאמר ״ולא ראיתי צדיק נעזב וזרעו מבקש לחם״.", "kp": ["כמו שאמר כי לא אעזבך"]}]}, {"id": "28:21.1", "ch": 28, "v": 21, "n": 1, "dh": "ושבתי", "pasuk_html": "<mark>וְשַׁבְתִּ֥י</mark> בְשָׁל֖וֹם אֶל־בֵּ֣ית אָבִ֑י וְהָיָ֧ה יְהוָ֛ה לִ֖י לֵאלֹהִֽים׃", "pasuk_en": "וְשַׁבְתִּי בְשָׁלוֹם אֶל־בֵּית אָבִי וְהָיָה יְהוָה לִי לֵאלֹהִים׃", "rashi_he": "ושבתי. כְּמוֹ שֶׁאָמַר לִי וַהֲשִׁבֹתִיךָ אֶל הָאֲדָמָה:", "rashi_en": "יעקב אומר \"ושבתי בשלום\" כפי שה' אמר לו קודם \"והשבתיך אל האדמה\".", "note": "", "points": [{"q": "מַדּוּעַ מַזְכִּיר יַעֲקֹב בְּנִדְרוֹ \"וְשַׁבְתִּי בְשָׁלוֹם\"?", "options": ["כִּי כָּךְ אָמַר לוֹ ה': וַהֲשִׁבֹתִיךָ אֶל הָאֲדָמָה", "כִּי חָשַׁשׁ שֶׁלֹּא יִזְכֶּה לַחֲזוֹר לָעוֹלָם לְבֵית אָבִיו", "כִּי הִבְטִיחַ לְאִמּוֹ רִבְקָה שֶׁיַּחֲזוֹר אֵלֶיהָ בִּמְהֵרָה"], "kasha": "מאין לקח יעקב את התנאי לחזור בשלום אל בית אביו?", "answer": "כמו שאמר לו ה' \"והשבתיך אל האדמה\" – יעקב חוזר על מה שהובטח לו.", "kp": ["והשבתיך אל האדמה"]}]}, {"id": "28:21.2", "ch": 28, "v": 21, "n": 2, "dh": "בשלום", "pasuk_html": "וְשַׁבְתִּ֥י <mark>בְשָׁל֖וֹם</mark> אֶל־בֵּ֣ית אָבִ֑י וְהָיָ֧ה יְהוָ֛ה לִ֖י לֵאלֹהִֽים׃", "pasuk_en": "וְשַׁבְתִּי בְשָׁלוֹם אֶל־בֵּית אָבִי וְהָיָה יְהוָה לִי לֵאלֹהִים׃", "rashi_he": "בשלום. שָׁלֵם מִן הַחֵטְא, שֶׁלֹּא אֶלְמַד מִדַּרְכֵי לָבָן:", "rashi_en": "יעקב מבקש לחזור לבית אביו שלם מן החטא, כלומר שלא ילמד מדרכיו הרעות של לבן.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, לְאֵיזֶה שָׁלוֹם מִתְכַּוֵּון יַעֲקֹב בְּאָמְרוֹ \"וְשַׁבְתִּי בְשָׁלוֹם\"?", "options": ["שָׁלֵם מִן הַחֵטְא, שֶׁלֹּא יִלְמַד מִדַּרְכֵי לָבָן", "שֶׁלֹּא יִפְגַּע בּוֹ עֵשָׂו כְּשֶׁיָּשׁוּב לָאָרֶץ", "שֶׁיַּחֲזוֹר עִם עוֹשֶׁר רַב וּבְלִי שׁוּם חִסָּרוֹן"], "kasha": "שמירה מפני סכנות כבר ביקש יעקב (\"ושמרני בדרך הזה\"), ומה מוסיפה המילה \"בשלום\"?", "answer": "\"בשלום\" פירושו שלם מן החטא, שלא ילמד מדרכי לבן.", "kp": ["שלם מן החטא", "שלא אלמד מדרכי לבן"]}]}, {"id": "28:21.3", "ch": 28, "v": 21, "n": 3, "dh": "והיה ה' לי לאלהים", "pasuk_html": "וְשַׁבְתִּ֥י בְשָׁל֖וֹם אֶל־בֵּ֣ית אָבִ֑י <mark>וְהָיָ֧ה יְהוָ֛ה לִ֖י לֵאלֹהִֽים׃</mark>", "pasuk_en": "וְשַׁבְתִּי בְשָׁלוֹם אֶל־בֵּית אָבִי וְהָיָה יְהוָה לִי לֵאלֹהִים׃", "rashi_he": "והיה ה' לי לאלהים. שֶׁיָּחוּל שְׁמוֹ עָלַי מִתְּחִלָּה וְעַד סוֹף, שֶׁלֹּא יִמָּצֵא פְּסוּל בְּזַרְעִי, כְּמוֹ שֶׁנֶּאֱמַר אֲשֶׁר דִּבַּרְתִּי לָךְ; וְהַבְטָחָה זוֹ הִבְטִיחַ לְאַבְרָהָם, שֶׁנֶּאֱמַר לִהְיוֹת לְךָ לֵאלֹהִים וּלְזַרְעֲךָ אַחֲרֶיךָ (בראשית י״ז:ז׳):", "rashi_en": "יעקב מבקש ששם ה' יחול עליו מתחילה ועד סוף, כלומר שלא יימצא פסול בזרעו. זו ההבטחה שה' הבטיח לאברהם: 'להיות לך לאלהים ולזרעך אחריך'.", "note": "", "points": [{"q": "מָה מְבַקֵּשׁ יַעֲקֹב בְּאוֹמְרוֹ 'וְהָיָה יְהוָה לִי לֵאלֹהִים'?", "options": ["שֶׁשֵּׁם ה' יָחוּל עָלָיו וְלֹא יִימָּצֵא פְּסוּל בְּזַרְעוֹ", "שֶׁה' יִשְׁמוֹר עָלָיו בַּדֶּרֶךְ וְיַחֲזִירוֹ בְּשָׁלוֹם", "שֶׁה' יִתֵּן לוֹ לֶחֶם לֶאֱכוֹל וּבֶגֶד לִלְבּוֹשׁ"], "kasha": "ה' כבר אלוהיו של יעקב, ומה הוא מוסיף בתנאי 'והיה יהוה לי לאלהים'?", "answer": "שיחול שמו עלי מתחילה ועד סוף, שלא יימצא פסול בזרעי, כמו שהבטיח לאברהם 'להיות לך לאלהים ולזרעך אחריך'.", "kp": ["שיחול שמו עלי מתחלה ועד סוף", "שלא ימצא פסול בזרעי"]}]}, {"id": "28:22.1", "ch": 28, "v": 22, "n": 1, "dh": "והאבן הזאת", "pasuk_html": "<mark>וְהָאֶ֣בֶן הַזֹּ֗את</mark> אֲשֶׁר־שַׂ֙מְתִּי֙ מַצֵּבָ֔ה יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְכֹל֙ אֲשֶׁ֣ר תִּתֶּן־לִ֔י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥נּוּ לָֽךְ׃", "pasuk_en": "וְהָאֶבֶן הַזֹּאת אֲשֶׁר־שַׂמְתִּי מַצֵּבָה יִהְיֶה בֵּית אֱלֹהִים וְכֹל אֲשֶׁר תִּתֶּן־לִי עַשֵּׂר אֲעַשְּׂרֶנּוּ לָךְ׃", "rashi_he": "והאבן הזאת. כָּךְ תְּפָרֵשׁ וָי\"ו זוֹ שֶׁל וְהָאֶבֶן: אִם תַּעֲשֶׂה לִי אֶת אֵלֶּה, אֲנִי אֶעֱשֶׂה זֹאת:", "rashi_en": "רש\"י מסביר שהוי\"ו של \"והאבן\" פותחת את התחייבותו של יעקב: אם תעשה לי את כל אלה, גם אני אעשה זאת.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ\"י אֶת הַוָּי\"ו שֶׁל \"וְהָאֶבֶן\"?", "options": ["אִם תַּעֲשֶׂה לִּי אֶת אֵלֶּה, אֲנִי אֶעֱשֶׂה זֹאת", "וָי\"ו הַחִיבּוּר: וְעוֹד אֶבֶן נוֹסֶפֶת אָקִים", "הֶמְשֵׁךְ הַתְּנַאי: וְאִם תִּשְׁמוֹר גַּם עַל הָאֶבֶן הַזֹּאת"], "kasha": "הוי\"ו נראית כחיבור רגיל, אך כאן מתחיל חלק חדש בנדר של יעקב.", "answer": "כך תפרש וי\"ו זו של \"והאבן\": אם תעשה לי את אלה, אני אעשה זאת.", "kp": ["אם תעשה לי את אלה", "אני אעשה זאת"]}]}, {"id": "28:22.2", "ch": 28, "v": 22, "n": 2, "dh": "והאבן הזאת אשר שמתי מצבה וגו'", "pasuk_html": "<mark>וְהָאֶ֣בֶן הַזֹּ֗את אֲשֶׁר־שַׂ֙מְתִּי֙ מַצֵּבָ֔ה</mark> יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְכֹל֙ אֲשֶׁ֣ר תִּתֶּן־לִ֔י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥נּוּ לָֽךְ׃", "pasuk_en": "וְהָאֶבֶן הַזֹּאת אֲשֶׁר־שַׂמְתִּי מַצֵּבָה יִהְיֶה בֵּית אֱלֹהִים וְכֹל אֲשֶׁר תִּתֶּן־לִי עַשֵּׂר אֲעַשְּׂרֶנּוּ לָךְ׃", "rashi_he": "והאבן הזאת אשר שמתי מצבה וגו'. כְּתַרְגּוּמוֹ אֱהִי פָלַח עֲלָהּ קֳדָם ה', וְכֵן עָשָׂה בְש הַהֲלִיכָה", "שֶׁהָלַךְ לְאַט וּבְרַגְלַיִים כְּבֵדוֹת מִפַּחַד עֵשָׂו", "שֶׁהָיָה עָיֵיף וְהִתְקַשָּׁה לָקוּם מִן הַשְּׁכִיבָה"], "kasha": "מדוע לא נאמר פשוט \"וילך יעקב\", ומה פירוש \"נשא רגליו\"?", "answer": "משנתבשר בשורה טובה שהובטח בשמירה, נשא לבו את רגליו ונעשה קל ללכת.", "kp": ["משנתבשר בשורה טובה", "ונעשה קל ללכת"]}]}, {"id": "29:2.1", "ch": 29, "v": 2, "n": 1, "dh": "ישקו העדרים", "pasuk_html": "וַיַּ֞רְא וְהִנֵּ֧ה בְאֵ֣ר בַּשָּׂדֶ֗ה וְהִנֵּה־שָׁ֞ם שְׁלֹשָׁ֤ה עֶדְרֵי־צֹאן֙ רֹבְצִ֣ים עָלֶ֔יהָ כִּ֚י מִן־הַבְּאֵ֣ר הַהִ֔וא <mark>יַשְׁק֖וּ הָעֲדָרִ֑ים</mark> וְהָאֶ֥בֶן גְּדֹלָ֖ה עַל־פִּ֥י הַבְּאֵֽר׃", "pasuk_en": "וַיַּרְא וְהִנֵּה בְאֵר בַּשָּׂדֶה וְהִנֵּה־שָׁם שְׁלֹשָׁה עֶדְרֵי־צֹאן רֹבְצִים עָלֶיהָ כִּי מִן־הַבְּאֵר הַהִוא יַשְׁקוּ הָעֲדָרִים וְהָאֶבֶן גְּדֹלָה עַל־פִּי הַבְּאֵר׃", "rashi_he": "ישקו העדרים. מַשְׁקִים הָרוֹעִים אֶת הָעֲדָרִים, וְהַמִּקְרָא דִבֵּר בְּלָשׁוֹן קְצָרָה:", "rashi_en": "העדרים אינם משקים את עצמם; הכוונה שהרועים משקים את העדרים, והפסוק דיבר בלשון קצרה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מִי מַשְׁקֶה בְּמִילִּים ״יַשְׁקוּ הָעֲדָרִים״?", "options": ["הָרוֹעִים מַשְׁקִים אֶת הָעֲדָרִים, וְהַפָּסוּק קִיצֵּר", "הָעֲדָרִים שׁוֹתִים בְּעַצְמָם מִן הַבְּאֵר", "בְּנוֹת הָעִיר מַשְׁקוֹת אֶת הָעֲדָרִים"], "kasha": "הלשון ״ישקו העדרים״ משמעה שהעדרים משקים, והרי הם השותים ולא המשקים.", "answer": "משקים הרועים את העדרים, והמקרא דיבר בלשון קצרה.", "kp": ["משקים הרועים את העדרים", "והמקרא דבר בלשון קצרה"]}]}, {"id": "29:3.1", "ch": 29, "v": 3, "n": 1, "dh": "ונאספו", "pasuk_html": "<mark>וְנֶאֶסְפוּ</mark>־שָׁ֣מָּה כָל־הָעֲדָרִ֗ים וְגָלֲל֤וּ אֶת־הָאֶ֙בֶן֙ מֵעַל֙ פִּ֣י הַבְּאֵ֔ר וְהִשְׁק֖וּ אֶת־הַצֹּ֑אן וְהֵשִׁ֧יבוּ אֶת־הָאֶ֛בֶן עַל־פִּ֥י הַבְּאֵ֖ר לִמְקֹמָֽהּ׃", "pasuk_en": "וְנֶאֶסְפוּ־שָׁמָּה כָל־הָעֲדָרִים וְגָלֲלוּ אֶת־הָאֶבֶן מֵעַל פִּי הַבְּאֵר וְהִשְׁקוּ אֶת־הַצֹּאן וְהֵשִׁיבוּ אֶת־הָאֶבֶן עַל־פִּי הַבְּאֵר לִמְקֹמָהּ׃", "rashi_he": "ונאספו. רְגִילִים הָיוּ לְהֵאָסֵף, לְפִי שֶׁהָיְתָה הָאֶבֶן גְּדוֹלָה:", "rashi_en": "הרועים היו רגילים להתאסף כולם יחד ליד הבאר, מפני שהאבן הייתה גדולה ולא היה אפשר להזיז אותה בלי כולם.", "note": "", "points": [{"q": "מָה מְלַמְּדֵנוּ רַשִׁ״י בַּמִּילָּה ״וְנֶאֶסְפוּ־״?", "options": ["שֶׁהָיוּ רְגִילִים לְהִתְאַסֵּף כָּךְ, מִפְּנֵי שֶׁהָאֶבֶן הָיְיתָה גְּדוֹלָה", "שֶׁהִתְאַסְּפוּ בְּאוֹתוֹ יוֹם בִּמְיוּחָד לִכְבוֹד בּוֹאוֹ שֶׁל יַעֲקֹב", "שֶׁהִתְאַסְּפוּ כְּדֵי לְהִתְוַוכֵּחַ מִי יַשְׁקֶה רִאשׁוֹן"], "kasha": "הפסוק מתאר מעשה של פעם אחת או מנהג קבוע?", "answer": "רגילים היו להיאסף, לפי שהייתה האבן גדולה.", "kp": ["רגילים היו להאסף", "לפי שהיתה האבן גדולה"]}]}, {"id": "29:3.2", "ch": 29, "v": 3, "n": 2, "dh": "וגללו", "pasuk_html": "וְנֶאֶסְפוּ־שָׁ֣מָּה כָל־הָעֲדָרִ֗ים <mark>וְגָלֲל֤וּ</mark> אֶת־הָאֶ֙בֶן֙ מֵעַל֙ פִּ֣י הַבְּאֵ֔ר וְהִשְׁק֖וּ אֶת־הַצֹּ֑אן וְהֵשִׁ֧יבוּ אֶת־הָאֶ֛בֶן עַל־פִּ֥י הַבְּאֵ֖ר לִמְקֹמָֽהּ׃", "pasuk_en": "וְנֶאֶסְפוּ־שָׁמָּה כָל־הָעֲדָרִים וְגָלֲלוּ אֶת־הָאֶבֶן מֵעַל פִּי הַבְּאֵר וְהִשְׁקוּ אֶת־הַצֹּאן וְהֵשִׁיבוּ אֶת־הָאֶבֶן עַל־פִּי הַבְּאֵר לִמְקֹמָהּ׃", "rashi_he": "וגללו. וְגוֹלְלִים, וְתַרְגּוּמוֹ וּמְגַנְדְּרִין, כָּל לְשׁוֹן הוֹוֶה מִשְׁתַּנֶּה לְדַבֵּר בִּלְשׁוֹן עָתִיד וּבִלְשׁוֹן עָבָר, לְפִי שֶׁכָּל דָּבָר הַהוֹוֶה תָּמִיד כְּבָר הָיָה וְעָתִיד לִהְיוֹת:", "rashi_en": "\"וגללו\" פירושו \"וגוללים\" – כך היו הרועים נוהגים תמיד. לשון הווה מתמשך נכתבת לפעמים בלשון עבר ולפעמים בלשון עתיד, כי דבר שקורה תמיד כבר היה ועתיד להיות.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וְגָלֲלוּ\" לְפִי רַשִׁ\"י?", "options": ["וְגוֹלְלִים – כָּךְ הָיוּ הָרוֹעִים נוֹהֲגִים לַעֲשׂוֹת תָּמִיד", "וְגָלֲלוּ – פַּעַם אַחַת, בְּאוֹתוֹ יוֹם שֶׁבָּא יַעֲקֹב", "וְיִגְלְלוּ – בֶּעָתִיד, כְּשֶׁיָּבוֹאוּ כָּל הָעֲדָרִים"], "kasha": "הפסוק מתאר מנהג קבוע של הרועים, ולמה הוא כתוב בלשון עבר?", "answer": "\"וגללו\" כמו \"וגוללים\"; כל לשון הווה נכתבת גם בלשון עבר וגם בלשון עתיד, כי כל דבר ההווה תמיד כבר היה ועתיד להיות.", "kp": ["וגוללים", "לפי שכל דבר ההווה תמיד"]}]}, {"id": "29:3.3", "ch": 29, "v": 3, "n": 3, "dh": "והשיבו", "pasuk_html": "וְנֶאֶסְפוּ־שָׁ֣מָּה כָל־הָעֲדָרִ֗ים וְגָלֲל֤וּ אֶת־הָאֶ֙בֶן֙ מֵעַל֙ פִּ֣י הַבְּאֵ֔ר וְהִשְׁק֖וּ אֶת־הַצֹּ֑אן <mark>וְהֵשִׁ֧יבוּ</mark> אֶת־הָאֶ֛בֶן עַל־פִּ֥י הַבְּאֵ֖ר לִמְקֹמָֽהּ׃", "pasuk_en": "וְנֶאֶסְפוּ־שָׁמָּה כָל־הָעֲדָרִים וְגָלֲלוּ אֶת־הָאֶבֶן מֵעַל פִּי הַבְּאֵר וְהִשְׁקוּ אֶת־הַצֹּאן וְהֵשִׁיבוּ אֶת־הָאֶבֶן עַל־פִּי הַבְּאֵר לִמְקֹמָהּ׃", "rashi_he": "והשיבו. תַּרְגּוּמוֹ וּמְתִיבִין:", "rashi_en": "אונקלוס מתרגם \"ומתיבין\", בלשון הווה: כך היה מנהג הרועים תמיד, שאחרי ההשקאה היו משיבים את האבן למקומה.", "note": "", "points": [{"q": "מָה מְלַמֵּד תַּרְגּוּם אוּנְקְלוֹס \"וּמְתִיבִין\" עַל הַמִּילָּה \"וְהֵשִׁיבוּ\"?", "options": ["שֶׁזֶּה מִנְהָג קָבוּעַ: בְּכָל פַּעַם הָיוּ מְשִׁיבִים אֶת הָאֶבֶן", "שֶׁהָרוֹעִים הֵשִׁיבוּ אֶת הָאֶבֶן פַּעַם אַחַת, בְּאוֹתוֹ יוֹם", "שֶׁיַּעֲקֹב הוּא שֶׁהֵשִׁיב אֶת הָאֶבֶן לִמְקוֹמָהּ"], "kasha": "\"והשיבו\" נשמע כלשון עבר, כאילו כבר השיבו את האבן, והרי עדיין לא השקו את הצאן.", "answer": "תרגומו \"ומתיבין\", כלומר בלשון הווה: כך היו נוהגים להשיב את האבן.", "kp": ["והשיבו", "תרגומו ומתיבין"]}]}, {"id": "29:6.1", "ch": 29, "v": 6, "n": 1, "dh": "באה עם הצאן", "pasuk_html": "וַיֹּ֥אמֶר לָהֶ֖ם הֲשָׁל֣וֹם ל֑וֹ וַיֹּאמְר֣וּ שָׁל֔וֹם וְהִנֵּה֙ רָחֵ֣ל בִּתּ֔וֹ <mark>בָּאָ֖ה עִם־הַצֹּֽאן׃</mark>", "pasuk_en": "וַיֹּאמֶר לָהֶם הֲשָׁלוֹם לוֹ וַיֹּאמְרוּ שָׁלוֹם וְהִנֵּה רָחֵל בִּתּוֹ בָּאָה עִם־הַצֹּאן׃", "rashi_he": "באה עם הצאן. הַטַּעַם בָּאָלֶ\"ף וְתַרְגּוּמוֹ אָתְיָא; וְרָחֵל בָּאָה – הַטַּעַם לְמַעְלָה בַּבֵּי\"ת וְתַרְגּוּמוֹ אֲתָת; הָרִאשׁוֹן לְשׁוֹן עוֹשָׂה וְהַשֵּׁנִי לְשׁוֹן עָשְׂתָה:", "rashi_en": "כאן 'באה' מוטעמת בסוף המילה (באל\"ף) ופירושה שהיא בדרך, באה עכשיו. בפסוק ט' 'ורחל באה' מוטעמת בבי\"ת ופירושה שכבר באה.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַה הַהֶבְדֵּל בֵּין 'בָּאָה' כָּאן וּבֵין 'וְרָחֵל בָּאָה' בַּפָּסוּק ט'?", "options": ["כָּאן הִיא בְּדַרְכָּהּ לָבוֹא, וְשָׁם הִיא כְּבָר בָּאָה", "כָּאן הִיא בָּאָה לְבַדָּהּ, וְשָׁם בָּאָה עִם הַצֹּאן", "כָּאן מְדוּבָּר בְּרָחֵל, וְשָׁם מְדוּבָּר בְּלֵאָה אֲחוֹתָהּ"], "kasha": "אותה מילה 'באה' מופיעה פעמיים, והאם משמעותה זהה בשני המקומות?", "answer": "כאן הטעם באל\"ף ותרגומו 'אתיא', לשון עושה; ושם הטעם בבי\"ת ותרגומו 'אתת', לשון עשתה.", "kp": ["הראשון לשון עושה", "והשני לשון עשתה"]}]}, {"id": "29:7.1", "ch": 29, "v": 7, "n": 1, "dh": "הן עוד היום גדול", "pasuk_html": "וַיֹּ֗אמֶר <mark>הֵ֥ן עוֹד֙ הַיּ֣וֹם גָּד֔וֹל</mark> לֹא־עֵ֖ת הֵאָסֵ֣ף הַמִּקְנֶ֑ה הַשְׁק֥וּ הַצֹּ֖אן וּלְכ֥וּ רְעֽוּ׃", "pasuk_en": "וַיֹּאמֶר הֵן עוֹד הַיּוֹם גָּדוֹל לֹא־עֵת הֵאָסֵף הַמִּקְנֶה הַשְׁקוּ הַצֹּאן וּלְכוּ רְעוּ׃", "rashi_he": "הן עוד היום גדול. לְפִי שֶׁרָאָה אוֹתָם רוֹבְצִים, כַּסָּבוּר שֶׁרוֹצִים לֶאֱסֹף הַמִּקְנֶה הַבַּיְתָה וְלֹא יִרְעוּ עוֹד, אָמַר לָהֶן הֵן עוֹד הַיּוֹם גָּדוֹל, כְּלוֹמַר אִם שְׂכִירִים אַתֶּם לֹא שִׁלַּמְתֶּם פְּעֻלַּת הַיּוֹם, וְאִם הַבְּהֵמוֹת שֶׁלָּכֶם אַעַ\"פִּ כֵן לֹא עֵת הֵאָסֵף הַמִּקְנֶה וְגו' (בראשית רבה):", "rashi_en": "יעקב ראה את הרועים רובצים וחשב שהם רוצים לאסוף את הצאן הביתה ולהפסיק לרעות. לכן אמר להם: אם אתם שכירים, עדיין לא השלמתם יום עבודה; ואם הצאן שלכם, בכל זאת עדיין לא הגיע זמן האסיפה.", "note": "", "points": [{"q": "מַדּוּעַ אָמַר יַעֲקֹב לָרוֹעִים \"הֵן עוֹד הַיּוֹם גָּדוֹל\"?", "options": ["רָאָה אוֹתָם רוֹבְצִים וְחָשַׁב שֶׁרוֹצִים לֶאֱסוֹף אֶת הַצֹּאן הַבַּיְתָה", "רָצָה לְהַרְחִיק אוֹתָם כְּדֵי לִפְגּוֹשׁ אֶת רָחֵל לְבַדָּהּ", "רָאָה שֶׁהַצֹּאן צְמֵאִים וְהָרוֹעִים מִתְעַצְּלִים לְהַשְׁקוֹתָם"], "kasha": "מדוע יעקב, אורח זר, מעיר לרועים על מנהגם?", "answer": "לפי שראה אותם רובצים, סבר שרוצים לאסוף את המקנה הביתה ולא ירעו עוד, ולכן אמר להם \"הן עוד היום גדול\".", "kp": ["לפי שראה אותם רובצים", "כסבור שרוצים לאסף המקנה הביתה"]}, {"q": "מָה טָעַן יַעֲקֹב לָרוֹעִים לְמִקְרֶה שֶׁהַצֹּאן שֶׁלָּהֶם עַצְמָם?", "options": ["שֶׁגַּם כָּךְ עֲדַיִין לֹא הִגִּיעַ זְמַן לֶאֱסוֹף אֶת הַמִּקְנֶה", "שֶׁאֵין לָהֶם לַחְשׁוֹשׁ מִבַּעַל הַבַּיִת וִיכוֹלִים לָנוּחַ", "שֶׁעֲלֵיהֶם לְהַשְׁקוֹת קוֹדֶם אֶת צֹאן לָבָן"], "kasha": "יעקב מוסיף \"לא עת האסף המקנה\", ויש להבין מה טענה זו מוסיפה.", "answer": "אם שכירים אתם, לא השלמתם פעולת היום; ואם הבהמות שלכם, אף על פי כן לא עת האסף המקנה.", "kp": ["לא עת האסף המקנה"]}]}, {"id": "29:8.1", "ch": 29, "v": 8, "n": 1, "dh": "לא נוכל", "pasuk_html": "וַיֹּאמְרוּ֮ <mark>לֹ֣א נוּכַל֒</mark> עַ֣ד אֲשֶׁ֤ר יֵאָֽסְפוּ֙ כָּל־הָ֣עֲדָרִ֔ים וְגָֽלֲלוּ֙ אֶת־הָאֶ֔בֶן מֵעַ֖ל פִּ֣י הַבְּאֵ֑ר וְהִשְׁקִ֖ינוּ הַצֹּֽאן׃", "pasuk_en": "וַיֹּאמְרוּ לֹא נוּכַל עַד אֲשֶׁר יֵאָסְפוּ כָּל־הָעֲדָרִים וְגָלֲלוּ אֶת־הָאֶבֶן מֵעַל פִּי הַבְּאֵר וְהִשְׁקִינוּ הַצֹּאן׃", "rashi_he": "לא נוכל. לְהַשְׁקוֹת, לְפִי שֶׁהָאֶבֶן גְּדוֹלָה:", "rashi_en": "הרועים אמרו שאינם יכולים להשקות את הצאן, כי האבן שעל פי הבאר גדולה, ורק כשיתאספו כל הרועים יוכלו לגלול אותה.", "note": "", "points": [{"q": "מַדּוּעַ אָמְרוּ הָרוֹעִים \"לֹא נוּכַל\" לְהַשְׁקוֹת אֶת הַצֹּאן?", "options": ["כִּי הָאֶבֶן גְּדוֹלָה וְאֵינָם יְכוֹלִים לִגְלוֹל אוֹתָהּ לְבַדָּם", "כִּי עֲדַיִין לֹא הִגִּיעַ הַזְּמַן הַקָּבוּעַ לְהַשְׁקוֹת", "כִּי בַּעַל הַבְּאֵר אָסַר לְהַשְׁקוֹת שֶׁלֹּא בְּנוֹכְחוּתוֹ"], "kasha": "לא מפורש מה מונע מהרועים להשקות את הצאן.", "answer": "אינם יכולים להשקות, לפי שהאבן גדולה.", "kp": ["לא נוכל", "לפי שהאבן גדולה"]}]}, {"id": "29:8.2", "ch": 29, "v": 8, "n": 2, "dh": "וגללו", "pasuk_html": "וַיֹּאמְרוּ֮ לֹ֣א נוּכַל֒ עַ֣ד אֲשֶׁ֤ר יֵאָֽסְפוּ֙ כָּל־הָ֣עֲדָרִ֔ים <mark>וְגָֽלֲלוּ֙</mark> אֶת־הָאֶ֔בֶן מֵעַ֖ל פִּ֣י הַבְּאֵ֑ר וְהִשְׁקִ֖ינוּ הַצֹּֽאן׃", "pasuk_en": "וַיֹּאמְרוּ לֹא נוּכַל עַד אֲשֶׁר יֵאָסְפוּ כָּל־הָעֲדָרִים וְגָלֲלוּ אֶת־הָאֶבֶן מֵעַל פִּי הַבְּאֵר וְהִשְׁקִינוּ הַצֹּאן׃", "rashi_he": "וגללו. זֶה מְתֻרְגָּם וִיגַנְדְּרוּן, לְפִי שֶׁהוּא לְשׁוֹן עָתִיד:", "rashi_en": "אונקלוס מתרגם \"וגללו\" בלשון עתיד (\"ויגנדרון\"), כי הרועים מדברים על מה שיעשו אחרי שייאספו כל העדרים.", "note": "", "points": [{"q": "מַדּוּעַ אוּנְקְלוֹס מְתַרְגֵּם \"וְגָלֲלוּ\" בִּלְשׁוֹן עָתִיד?", "options": ["כִּי הָרוֹעִים מְתָאֲרִים מָה שֶׁיַּעֲשׂוּ כְּשֶׁיִּיאָסְפוּ הָעֲדָרִים", "כִּי הָרוֹעִים כְּבָר גָּלְלוּ אֶת הָאֶבֶן קוֹדֶם לָכֵן", "כִּי הָרוֹעִים מְצוּוִּים עַל יַעֲקֹב לִגְלוֹל אֶת הָאֶבֶן"], "kasha": "\"וגללו\" נראה כלשון עבר, אבל הרועים מדברים על מה שעתיד לקרות.", "answer": "אונקלוס מתרגם \"ויגנדרון\", לפי שהוא לשון עתיד.", "kp": ["לפי שהוא לשון עתיד"]}]}, {"id": "29:10.1", "ch": 29, "v": 10, "n": 1, "dh": "ויגש יעקב ויגל", "pasuk_html": "וַיְהִ֡י כַּאֲשֶׁר֩ רָאָ֨ה יַעֲקֹ֜ב אֶת־רָחֵ֗ל בַּת־לָבָן֙ אֲחִ֣י אִמּ֔וֹ וְאֶת־צֹ֥אן לָבָ֖ן אֲחִ֣י אִמּ֑וֹ <mark>וַיִּגַּ֣שׁ יַעֲקֹ֗ב וַיָּ֤גֶל</mark> אֶת־הָאֶ֙בֶן֙ מֵעַל֙ פִּ֣י הַבְּאֵ֔ר וַיַּ֕שְׁקְ אֶת־צֹ֥אן לָבָ֖ן אֲחִ֥י אִמּֽוֹ׃", "pasuk_en": "וַיְהִי כַּאֲשֶׁר רָאָה יַעֲקֹב אֶת־רָחֵל בַּת־לָבָן אֲחִי אִמּוֹ וְאֶת־צֹאן לָבָן אֲחִי אִמּוֹ וַיִּגַּשׁ יַעֲקֹב וַיָּגֶל אֶת־הָאֶבֶן מֵעַל פִּי הַבְּאֵר וַיַּשְׁקְ אֶת־צֹאן לָבָן אֲחִי אִמּוֹ׃", "rashi_he": "ויגש יעקב ויגל. כְּמִי שֶׁמַּעֲבִיר אֶת הַפְּקָק מֵעַל פִּי צְלוֹחִית; לְהוֹדִיעֲךָ שֶׁכֹּחוֹ גָּדוֹל (בראשית רבה):", "rashi_en": "יעקב גלל את האבן הגדולה בקלות, כמו מי שמסיר פקק מפי בקבוק. התורה מספרת זאת כדי ללמדנו שכוחו היה גדול.", "note": "", "points": [{"q": "מָה בָּא הַפָּסוּק לְלַמֵּד כְּשֶׁמְסַפֵּר שֶׁיַּעֲקֹב גָּלַל אֶת הָאֶבֶן לְבַדּוֹ?", "options": ["שֶׁכּוֹחוֹ הָיָה גָּדוֹל, וְהֵסִיר אוֹתָהּ כְּמוֹ פְּקָק מִבַּקְבּוּק", "שֶׁהָאֶבֶן הָיְיתָה קְטַנָּה וְקַלָּה מְאוֹד", "שֶׁהָרוֹעִים עָזְרוּ לוֹ לָגְלוֹל אֶת הָאֶבֶן"], "kasha": "האבן הייתה גדולה וכל הרועים יחד היו צריכים לגלול אותה; איך גלל אותה יעקב לבדו?", "answer": "יעקב גלל אותה כמי שמעביר את הפקק מעל פי צלוחית, להודיעך שכוחו גדול.", "kp": ["כמי שמעביר את הפקק", "להודיעך שכחו גדול"]}]}, {"id": "29:11.1", "ch": 29, "v": 11, "n": 1, "dh": "ויבך", "pasuk_html": "וַיִּשַּׁ֥ק יַעֲקֹ֖ב לְרָחֵ֑ל וַיִּשָּׂ֥א אֶת־קֹל֖וֹ <mark>וַיֵּֽבְךְּ׃</mark>", "pasuk_en": "וַיִּשַּׁק יַעֲקֹב לְרָחֵל וַיִּשָּׂא אֶת־קֹלוֹ וַיֵּבְךְּ׃", "rashi_he": "ויבך. לְפִי שֶׁצָּפָה בְרוּח הַקֹּדֶש שֶאֵינָהּ נִכְנֶסֶת עִמּוֹ לִקְבוּרָה. דָּ\"אַ לְפִי שֶׁבָּא בְּיָדַיִם רֵקָנִיּוֹת; אָמַר, אֱלִיעֶזֶר עֶבֶד אֲבִי אַבָּא הָיוּ בְיָדָיו נְזָמִים וּצְמִידִים וּמִגְדָּנוֹת וַאֲנִי אֵין בְּיָדִי כְלוּם; לְפִי שֶׁרָדַף אֶלִיפַז בֶּן עֵשָׂו בְּמִצְוַת אָבִיו אַחֲרָיו לְהָרְגוֹ וְהִשִּׂיגוֹ, וּלְפִי שֶׁגָּדַל אֶלִיפַז בְּחֵיקוֹ שֶׁל יִצְחָק, מָשַׁךְ יָדָיו. אָמַר לוֹ מָה אֱעֱשֶׂה לַצִּוּוּי שֶׁל אַבָּא? אָמַר לוֹ יַעֲקֹב טֹל מַה שֶּׁבְּיָדִי, וְהֶעָנִי חָשׁוּב כַּמֵּת:", "rashi_en": "יעקב בכה כי ראה ברוח הקודש שרחל לא תיקבר איתו. ועוד, כי בא בידיים ריקות: אליפז בן עשו רדף אחריו להורגו, ויעקב נתן לו את כל רכושו, כי העני חשוב כמת.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן, מַדּוּעַ בָּכָה יַעֲקֹב כְּשֶׁפָּגַשׁ אֶת רָחֵל?", "options": ["רָאָה בְּרוּחַ הַקּוֹדֶשׁ שֶׁרָחֵל לֹא תִּיקָּבֵר עִמּוֹ", "הִתְרַגֵּשׁ מְאוֹד לִפְגּוֹשׁ סוֹף סוֹף אֶת קְרוֹבַת מִשְׁפַּחְתּוֹ", "חָשַׁשׁ שֶׁלָּבָן לֹא יַסְכִּים לָתֵת לוֹ אֶת רָחֵל"], "kasha": "רגע של שמחה ופגישה עם בת משפחה, ומדוע בכה יעקב?", "answer": "לפי שצפה ברוח הקודש שאינה נכנסת עמו לקבורה.", "kp": ["לפי שצפה ברוח הקדש", "שאינה נכנסת עמו לקבורה"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי, מַדּוּעַ הִגִּיעַ יַעֲקֹב בִּידַיִים רֵיקוֹת?", "options": ["אֱלִיפַז רָדַף לְהוֹרְגוֹ, וְיַעֲקֹב נָתַן לוֹ הַכֹּל כִּי הֶעָנִי חָשׁוּב כְּמֵת", "שׁוֹדְדִים בַּדֶּרֶךְ גָּזְלוּ מִמֶּנּוּ אֶת כָּל מָה שֶׁהֵבִיא", "יִצְחָק שְׁלָחוֹ בְּכַוָּונָה בְּלִי מַתָּנוֹת כְּדֵי שֶׁיַּעֲבוֹד"], "kasha": "מדוע יעקב, שבא לקחת אישה, לא הביא מתנות כמו אליעזר עבד אברהם?", "answer": "אליפז בן עשו רדף אחריו במצוות אביו להורגו, ולפי שגדל בחיקו של יצחק משך ידיו; ויעקב אמר לו: טול מה שבידי, והעני חשוב כמת.", "kp": ["לפי שרדף אליפז בן עשו", "אמר לו יעקב טל מה שבידי", "והעני חשוב כמת"]}]}, {"id": "29:12.1", "ch": 29, "v": 12, "n": 1, "dh": "כי אחי אביה הוא", "pasuk_html": "וַיַּגֵּ֨ד יַעֲקֹ֜ב לְרָחֵ֗ל <mark>כִּ֣י אֲחִ֤י אָבִ֙יהָ֙ ה֔וּא</mark> וְכִ֥י בֶן־רִבְקָ֖ה ה֑וּא וַתָּ֖רָץ וַתַּגֵּ֥ד לְאָבִֽיהָ׃", "pasuk_en": "וַיַּגֵּד יַעֲקֹב לְרָחֵל כִּי אֲחִי אָבִיהָ הוּא וְכִי בֶן־רִבְקָה הוּא וַתָּרָץ וַתַּגֵּד לְאָבִיהָ׃", "rashi_he": "כי אחי אביה הוא. קָרוֹב לְאָבִיהָ, כְּמוֹ אֲנָשִׁים אַחִים אֲנָחְנוּ. וּמִדְרָשׁוֹ, אִם לְרַמָּאוּת הוּא בָא, גַם אֲנִי אָחִיו בְּרַמָּאוּת, וְאִם אָדָם כָּשֵׁר הוּא, גַּם אֲנִי בֶן רִבְקָה אֲחוֹתוֹ הַכְּשֵׁרָה:", "rashi_en": "לפי הפשט \"אחי\" פירושו קרוב, כמו \"אנשים אחים אנחנו\". ולפי המדרש יעקב רמז: אם לבן בא לרמות – גם אני אחיו ברמאות; ואם הוא כשר – גם אני בן רבקה אחותו הכשרה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"אֲחִי אָבִיהָ\" לְפִי פְּשׁוּטוֹ?", "options": ["קָרוֹב שֶׁל אָבִיהָ, כְּמוֹ \"אֲנָשִׁים אַחִים אֲנָחְנוּ\"", "אָחִיו מַמָּשׁ שֶׁל לָבָן, בֵּן לְאוֹתוֹ אָב", "חֲבֵרוֹ הַקָּרוֹב שֶׁל לָבָן מִימֵי נְעוּרָיו"], "kasha": "יעקב היה בן אחותו של לבן, ולמה קרא לעצמו \"אחי אביה\"?", "answer": "\"אחי\" כאן פירושו קרוב לאביה, כמו \"אנשים אחים אנחנו\".", "kp": ["קרוב לאביה", "כמו אנשים אחים אנחנו"]}, {"q": "לְפִי הַמִּדְרָשׁ, מָה רָמַז יַעֲקֹב בְּאוֹמְרוֹ \"אֲחִי אָבִיהָ\" וְגַם \"בֶן־רִבְקָה\"?", "options": ["אִם לָבָן יְרַמֶּה – גַּם הוּא יְרַמֶּה; וְאִם לָבָן כָּשֵׁר – גַּם הוּא כָּשֵׁר", "שֶׁהוּא רָאוּי לְרָחֵל יוֹתֵר מִכָּל שְׁאָר הָרוֹעִים", "שֶׁלָּבָן חַיִּיב לְאָרֵחַ אוֹתוֹ בְּבֵיתוֹ מִפְּנֵי שֶׁהוּא קְרוֹבוֹ"], "kasha": "מדוע הוסיף יעקב \"וכי בן רבקה הוא\" אחרי שכבר אמר שהוא קרוב?", "answer": "אם לרמאות לבן בא – גם אני אחיו ברמאות; ואם אדם כשר הוא – גם אני בן רבקה אחותו הכשרה.", "kp": ["אם לרמאות הוא בא", "גם אני אחיו ברמאות", "ואם אדם כשר הוא"]}]}, {"id": "29:12.2", "ch": 29, "v": 12, "n": 2, "dh": "ותגד לאביה", "pasuk_html": "וַיַּגֵּ֨ד יַעֲקֹ֜ב לְרָחֵ֗ל כִּ֣י אֲחִ֤י אָבִ֙יהָ֙ ה֔וּא וְכִ֥י בֶן־רִבְקָ֖ה ה֑וּא וַתָּ֖רָץ <mark>וַתַּגֵּ֥ד לְאָבִֽיהָ׃</mark>", "pasuk_en": "וַיַּגֵּד יַעֲקֹב לְרָחֵל כִּי אֲחִי אָבִיהָ הוּא וְכִי בֶן־רִבְקָה הוּא וַתָּרָץ וַתַּגֵּד לְאָבִיהָ׃", "rashi_he": "ותגד לאביה. לְפִי שֶׁאִמָּהּ מֵתָה, וְלֹא הָיָה לָהּ לְהַגִּיד אֶלָּא לוֹ (בראשית רבה):", "rashi_en": "רחל סיפרה לאביה, כי אמה כבר מתה ולא היה לה למי לספר אלא לו.", "note": "", "points": [{"q": "מַדּוּעַ סִיפְּרָה רָחֵל דַּוְוקָא לְאָבִיהָ?", "options": ["כִּי אִמָּהּ מֵתָה, וְלֹא הָיָה לָהּ לְמִי לְסַפֵּר אֶלָּא לוֹ", "כִּי רָצְתָה שֶׁלָּבָן יְמַהֵר לְקַבֵּל אֶת פְּנֵי יַעֲקֹב", "כִּי בְּבֵית לָבָן נָהֲגוּ לְסַפֵּר כָּל דָּבָר לָאָב תְּחִילָּה"], "kasha": "אצל רבקה נאמר \"ותגד לבית אמה\", ואילו רחל סיפרה לאביה.", "answer": "לפי שאמה מתה, ולא היה לה להגיד אלא לו.", "kp": ["לפי שאמה מתה", "ולא היה לה להגיד אלא לו"]}]}, {"id": "29:13.1", "ch": 29, "v": 13, "n": 1, "dh": "וירץ לקראתו", "pasuk_html": "וַיְהִי֩ כִשְׁמֹ֨עַ לָבָ֜ן אֶת־שֵׁ֣מַע ׀ יַעֲקֹ֣ב בֶּן־אֲחֹת֗וֹ <mark>וַיָּ֤רָץ לִקְרָאתוֹ֙</mark> וַיְחַבֶּק־לוֹ֙ וַיְנַשֶּׁק־ל֔וֹ וַיְבִיאֵ֖הוּ אֶל־בֵּית֑וֹ וַיְסַפֵּ֣ר לְלָבָ֔ן אֵ֥ת כָּל־הַדְּבָרִ֖ים הָאֵֽלֶּה׃", "pasuk_en": "וַיְהִי כִשְׁמֹעַ לָבָן אֶת־שֵׁמַע יַעֲקֹב בֶּן־אֲחֹתוֹ וַיָּרָץ לִקְרָאתוֹ וַיְחַבֶּק־לוֹ וַיְנַשֶּׁק־לוֹ וַיְבִיאֵהוּ אֶל־בֵּיתוֹ וַיְסַפֵּר לְלָבָן אֵת כָּל־הַדְּבָרִים הָאֵלֶּה׃", "rashi_he": "וירץ לקראתו. כַּסָּבוּר מָמוֹן הוּא טָעוּן, שֶׁהֲרֵי עֶבֶד הַבַּית בָּא לְכָאן בַּעֲשָׂרָה גְמַלִּים טְעוּנִים:", "rashi_en": "לבן רץ לקראת יעקב כי חשב שהוא טעון ממון, שהרי עבד אברהם הגיע לשם בעבר עם עשרה גמלים טעונים.", "note": "", "points": [{"q": "לָמָה רָץ לָבָן לִקְרַאת יַעֲקֹב?", "options": ["כִּי חָשַׁב שֶׁיַּעֲקֹב טָעוּן מָמוֹן כְּמוֹ עֶבֶד אַבְרָהָם", "כִּי שָׂמַח לִפְגֹּושׁ אֶת בֶּן אֲחוֹתוֹ הָאֲהוּבָה", "כִּי רָצָה לִבְדֹּוק אִם יַעֲקֹב בָּא לְהִילָּחֵם בּוֹ"], "kasha": "מדוע מיהר לבן כל כך לרוץ לקראת יעקב?", "answer": "כסבור ממון הוא טעון, שהרי עבד הבית בא לכאן בעשרה גמלים טעונים.", "kp": ["כסבור ממון הוא טעון", "שהרי עבד הבית בא לכאן"]}]}, {"id": "29:13.2", "ch": 29, "v": 13, "n": 2, "dh": "ויחבק", "pasuk_html": "וַיְהִי֩ כִשְׁמֹ֨עַ לָבָ֜ן אֶת־שֵׁ֣מַע ׀ יַעֲקֹ֣ב בֶּן־אֲחֹת֗וֹ וַיָּ֤רָץ לִקְרָאתוֹ֙ <mark>וַיְחַבֶּק</mark>־לוֹ֙ וַיְנַשֶּׁק־ל֔וֹ וַיְבִיאֵ֖הוּ אֶל־בֵּית֑וֹ וַיְסַפֵּ֣ר לְלָבָ֔ן אֵ֥ת כָּל־הַדְּבָרִ֖ים הָאֵֽלֶּה׃", "pasuk_en": "וַיְהִי כִשְׁמֹעַ לָבָן אֶת־שֵׁמַע יַעֲקֹב בֶּן־אֲחֹתוֹ וַיָּרָץ לִקְרָאתוֹ וַיְחַבֶּק־לוֹ וַיְנַשֶּׁק־לוֹ וַיְבִיאֵהוּ אֶל־בֵּיתוֹ וַיְסַפֵּר לְלָבָן אֵת כָּל־הַדְּבָרִים הָאֵלֶּה׃", "rashi_he": "ויחבק. כְּשֶׁלֹּא רָאָה עִמּוֹ כְלוּם, אָמַר שֶׁמָּא זְהוּבִים הֵבִיא וְהִנָּם בְּחֵיקוֹ:", "rashi_en": "לבן ראה שיעקב בא בלי כלום, וחשב שאולי הביא מטבעות זהב שמוסתרים בחיקו, ולכן חיבק אותו.", "note": "", "points": [{"q": "מַדּוּעַ חִיבֵּק לָבָן אֶת יַעֲקֹב לְפִי רַשִׁ\"י?", "options": ["חָשַׁב שֶׁאוּלַי הִסְתִּיר זְהוּבִים בְּחֵיקוֹ", "שָׂמַח בֶּאֱמֶת לִרְאוֹת אֶת בֶּן אֲחוֹתוֹ", "כָּךְ נָהֲגוּ לְקַבֵּל קָרוֹב שֶׁבָּא מֵרָחוֹק"], "kasha": "לבן הרמאי מקבל את יעקב בחיבוק נלהב, ויש להבין מה עמד מאחורי זה.", "answer": "כשלא ראה עמו כלום, אמר: שמא זהובים הביא והנם בחיקו.", "kp": ["שמא זהובים הביא והנם בחיקו"]}]}, {"id": "29:13.3", "ch": 29, "v": 13, "n": 3, "dh": "וינשק לו", "pasuk_html": "וַיְהִי֩ כִשְׁמֹ֨עַ לָבָ֜ן אֶת־שֵׁ֣מַע ׀ יַעֲקֹ֣ב בֶּן־אֲחֹת֗וֹ וַיָּ֤רָץ לִקְרָאתוֹ֙ וַיְחַבֶּק־לוֹ֙ <mark>וַיְנַשֶּׁק־ל֔וֹ</mark> וַיְבִיאֵ֖הוּ אֶל־בֵּית֑וֹ וַיְסַפֵּ֣ר לְלָבָ֔ן אֵ֥ת כָּל־הַדְּבָרִ֖ים הָאֵֽלֶּה׃", "pasuk_en": "וַיְהִי כִשְׁמֹעַ לָבָן אֶת־שֵׁמַע יַעֲקֹב בֶּן־אֲחֹתוֹ וַיָּרָץ לִקְרָאתוֹ וַיְחַבֶּק־לוֹ וַיְנַשֶּׁק־לוֹ וַיְבִיאֵהוּ אֶל־בֵּיתוֹ וַיְסַפֵּר לְלָבָן אֵת כָּל־הַדְּבָרִים הָאֵלֶּה׃", "rashi_he": "וינשק לו. אָמַר שֶׁמָּא מַרְגָּלִיוֹת הֵבִיא וְהֵם בְּפִיו, בְּ\"רַ:", "rashi_en": "לבן נישק את יעקב כי חשב שאולי הביא יעקב מרגליות והן מוסתרות בפיו.", "note": "", "points": [{"q": "מָה חָשַׁב לָבָן כְּשֶׁנִּישֵּׁק אֶת יַעֲקֹב?", "options": ["שֶׁמָּא הֵבִיא יַעֲקֹב מַרְגָּלִיּוֹת וְהֵן בְּפִיו", "שָׂמֵחַ לִרְאוֹת אֶת בֶּן אֲחוֹתוֹ אַחֲרֵי שָׁנִים רַבּוֹת", "רָצָה לְהַרְאוֹת לְאַנְשֵׁי הָעִיר שֶׁיַּעֲקֹב קְרוֹב מִשְׁפַּחְתּוֹ"], "kasha": "לבן היה רודף ממון, ויש להבין מדוע מיהר לנשק את יעקב.", "answer": "לבן אמר בלבו: שמא מרגליות הביא והן בפיו.", "kp": ["שמא מרגליות הביא והם בפיו"]}]}, {"id": "29:13.4", "ch": 29, "v": 13, "n": 4, "dh": "ויספר ללבן", "pasuk_html": "וַיְהִי֩ כִשְׁמֹ֨עַ לָבָ֜ן אֶת־שֵׁ֣מַע ׀ יַעֲקֹ֣ב בֶּן־אֲחֹת֗וֹ וַיָּ֤רָץ לִקְרָאתוֹ֙ וַיְחַבֶּק־לוֹ֙ וַיְנַשֶּׁק־ל֔וֹ וַיְבִיאֵ֖הוּ אֶל־בֵּית֑וֹ <mark>וַיְסַפֵּ֣ר לְלָבָ֔ן</mark> אֵ֥ת כָּל־הַדְּבָרִ֖ים הָאֵֽלֶּה׃", "pasuk_en": "וַיְהִי כִשְׁמֹעַ לָבָן אֶת־שֵׁמַע יַעֲקֹב בֶּן־אֲחֹתוֹ וַיָּרָץ לִקְרָאתוֹ וַיְחַבֶּק־לוֹ וַיְנַשֶּׁק־לוֹ וַיְבִיאֵהוּ אֶל־בֵּיתוֹ וַיְסַפֵּר לְלָבָן אֵת כָּל־הַדְּבָרִים הָאֵלֶּה׃", "rashi_he": "ויספר ללבן. שֶׁלֹּא בָא אֶלָּא מִתּוֹך אֹנֶס אָחִיו, וְשֶׁנָּטְלוּ מָמוֹנוֹ מִמֶּנּוּ:", "rashi_en": "יעקב סיפר ללבן שלא בא אליו אלא מפני שנאלץ לברוח מאחיו, ושלקחו ממנו את כל ממונו.", "note": "", "points": [{"q": "מָה סִיפֵּר יַעֲקֹב לְלָבָן לְפִי רַשִׁ\"י?", "options": ["שֶׁבָּא רַק מֵחֲמַת אָחִיו, וְשֶׁנִּלְקַח מִמֶּנּוּ מָמוֹנוֹ", "שֶׁבָּא לְבַקֵּשׁ אִישָּׁה וְהֵבִיא עִמּוֹ מָמוֹן רַב", "שֶׁרָאָה בַּדֶּרֶךְ מַלְאָכִים עוֹלִים וְיוֹרְדִים בַּסּוּלָּם"], "kasha": "\"את כל הדברים האלה\" סתום, ולא מפורש מה סיפר יעקב.", "answer": "סיפר שלא בא אלא מתוך אונס אחיו, ושנטלו ממנו את ממונו.", "kp": ["שלא בא אלא מתוך אנס אחיו", "ושנטלו ממונו ממנו"]}]}, {"id": "29:14.1", "ch": 29, "v": 14, "n": 1, "dh": "אך עצמי ובשרי", "pasuk_html": "וַיֹּ֤אמֶר לוֹ֙ לָבָ֔ן <mark>אַ֛ךְ עַצְמִ֥י וּבְשָׂרִ֖י</mark> אָ֑תָּה וַיֵּ֥שֶׁב עִמּ֖וֹ חֹ֥דֶשׁ יָמִֽים׃", "pasuk_en": "וַיֹּאמֶר לוֹ לָבָן אַךְ עַצְמִי וּבְשָׂרִי אָתָּה וַיֵּשֶׁב עִמּוֹ חֹדֶשׁ יָמִים׃", "rashi_he": "אך עצמי ובשרי. מֵעַתָּה אֵין לִי לְאָסְפְּךָ הַבַּיְתָה, הוֹאִיל וְאֵין בְּיָדְךָ כְלוּם, אֶלָּא מִפְּנֵי קוּרְבָה אֲטַפֵּל בְּךָ חֹדֶש יָמִים, וְכֵן עָשָׂה, וְאַף זוֹ לֹא לְחִנָּם, שֶׁהָיָה רוֹעֶה צֹאנוֹ:", "rashi_en": "לבן אמר ליעקב: כיון שאין בידך כלום, אין לי סיבה להכניסך לביתי, אבל מפני הקרבה אטפל בך חודש. וכך עשה, ואף זה לא היה בחינם, כי יעקב רעה את צאנו.", "note": "", "points": [{"q": "מָה רָמַז לָבָן בַּמִּילָּה ״אַךְ״ בְּאָמְרוֹ ״אַךְ עַצְמִי וּבְשָׂרִי אָתָּה״?", "options": ["שֶׁאֵין סִיבָּה לְאָרְחוֹ כִּי אֵין בְּיָדוֹ כְּלוּם, וְרַק מִפְּנֵי הַקִּרְבָה יְטַפֵּל בּוֹ חוֹדֶשׁ", "שֶׁהוּא שָׂמֵחַ מְאוֹד לְקַבֵּל אֶת קְרוֹבוֹ לְבֵיתוֹ לְתָמִיד", "שֶׁהוּא חוֹשֵׁד שֶׁיַּעֲקֹב אֵינוֹ בֶּאֱמֶת בֶּן אֲחוֹתוֹ"], "kasha": "מה משמעות המילה ״אך״, המצמצמת את קבלת הפנים של לבן?", "answer": "מעתה אין לי לאספך הביתה, הואיל ואין בידך כלום, אלא מפני קורבה אטפל בך חודש ימים.", "kp": ["הואיל ואין בידך כלום", "אלא מפני קורבה", "אטפל בך חדש ימים"]}, {"q": "הַאִם הַחוֹדֶשׁ שֶׁיָּשַׁב יַעֲקֹב אֵצֶל לָבָן הָיָה בְּחִינָּם?", "options": ["לֹא, כִּי יַעֲקֹב רָעָה אֶת צֹאנוֹ שֶׁל לָבָן", "כֵּן, לָבָן אֵירֵחַ אוֹתוֹ בְּלִי לְבַקֵּשׁ דָּבָר", "לֹא, כִּי יַעֲקֹב שִׁילֵּם לוֹ בַּכֶּסֶף שֶׁהֵבִיא"], "kasha": "הפסוק אומר ״וישב עמו חדש ימים״ כאילו לבן אירח אותו בנדיבות.", "answer": "אף זו לא לחינם, שהיה רועה צאנו.", "kp": ["ואף זו לא לחנם", "שהיה רועה צאנו"]}]}, {"id": "29:15.1", "ch": 29, "v": 15, "n": 1, "dh": "הכי אחי אתה", "pasuk_html": "וַיֹּ֤אמֶר לָבָן֙ לְיַעֲקֹ֔ב <mark>הֲכִי־אָחִ֣י אַ֔תָּה</mark> וַעֲבַדְתַּ֖נִי חִנָּ֑ם הַגִּ֥ידָה לִּ֖י מַה־מַּשְׂכֻּרְתֶּֽךָ׃", "pasuk_en": "וַיֹּאמֶר לָבָן לְיַעֲקֹב הֲכִי־אָחִי אַתָּה וַעֲבַדְתַּנִי חִנָּם הַגִּידָה לִּי מַה־מַּשְׂכֻּרְתֶּךָ׃", "rashi_he": "הכי אחי אתה. לְשׁוֹן תֵּמַהּ, וְכִי בִּשְׁבִיל שֶׁאָחִי אַתָּה תַּעַבְדֵנִי חִנָּם:", "rashi_en": "לבן שואל בתמיהה: וכי בגלל שאתה קרוב משפחתי תעבוד אצלי בחינם?", "note": "", "points": [{"q": "מָה כַּוָּוֹנַת לָבָן בִּשְׁאֵלָתוֹ לְיַעֲקֹב אִם הוּא אָחִיו?", "options": ["תְּמִיהָה: וְכִי בִּגְלַל שֶׁאַתָּה קְרוֹבִי תַּעֲבוֹד בְּחִינָּם?", "קְבִיעָה: מִפְּנֵי שֶׁאַתָּה קְרוֹבִי עָלֶיךָ לַעֲבוֹד בְּחִינָּם", "שְׁאֵלָה אִם יַעֲקֹב בֶּאֱמֶת קְרוֹב מִשְׁפָּחָה שֶׁלּוֹ"], "kasha": "לבן כבר יודע שיעקב קרובו, ומה טעם לשאול זאת?", "answer": "זו לשון תמיהה: וכי בשביל שאחי אתה תעבדני חינם?", "kp": ["לשון תמה", "וכי בשביל שאחי אתה תעבדני חנם"]}]}, {"id": "29:15.2", "ch": 29, "v": 15, "n": 2, "dh": "ועבדתני", "pasuk_html": "וַיֹּ֤אמֶר לָבָן֙ לְיַעֲקֹ֔ב הֲכִי־אָחִ֣י אַ֔תָּה <mark>וַעֲבַדְתַּ֖נִי</mark> חִנָּ֑ם הַגִּ֥ידָה לִּ֖י מַה־מַּשְׂכֻּרְתֶּֽךָ׃", "pasuk_en": "וַיֹּאמֶר לָבָן לְיַעֲקֹב הֲכִי־אָחִי אַתָּה וַעֲבַדְתַּנִי חִנָּם הַגִּידָה לִּי מַה־מַּשְׂכֻּרְתֶּךָ׃", "rashi_he": "ועבדתני. כְּמוֹ וְתַעַבְדֵנִי; וְכֵן כָּל תֵּבָה שֶׁהִיא לְשׁוֹן עָבָר הוֹסִיף וָי\"ו בְּרֹאשָׁהּ, וְהִיא הוֹפֶכֶת הַתֵּבָה לְהַבָּא:", "rashi_en": "\"ועבדתני\" פירושו \"ותעבדני\" – בלשון עתיד. כל מילה בלשון עבר שנוספה וי\"ו בתחילתה הופכת ללשון עתיד.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וַעֲבַדְתַּנִי\" לְפִי רַשִׁ\"י?", "options": ["וְתַעַבְדֵנִי – בֶּעָתִיד, כִּי הַוָּי\"ו הוֹפֶכֶת עָבָר לְעָתִיד", "וַעֲבַדְתָּ אוֹתִי – בֶּעָבָר, עַל הַחוֹדֶשׁ שֶׁכְּבָר עָבַד", "עֲבַדְתָּ אוֹתִי – שְׁאֵלָה אִם כְּבָר עָבַד בְּחִינָּם"], "kasha": "\"עבדתני\" היא לשון עבר, ולבן מדבר על עבודה שיעקב יעבוד מעתה.", "answer": "\"ועבדתני\" כמו \"ותעבדני\"; כל מילה בלשון עבר שנוסף וי\"ו בראשה, הוי\"ו הופכת אותה לעתיד.", "kp": ["כמו ותעבדני", "והיא הופכת התבה להבא"]}]}, {"id": "29:17.1", "ch": 29, "v": 17, "n": 1, "dh": "רכות", "pasuk_html": "וְעֵינֵ֥י לֵאָ֖ה <mark>רַכּ֑וֹת</mark> וְרָחֵל֙ הָֽיְתָ֔ה יְפַת־תֹּ֖אַר וִיפַ֥ת מַרְאֶֽה׃", "pasuk_en": "וְעֵינֵי לֵאָה רַכּוֹת וְרָחֵל הָיְתָה יְפַת־תֹּאַר וִיפַת מַרְאֶה׃", "rashi_he": "רכות. שֶׁהָיְתָה סְבוּרָה לַעֲלוֹת בְּגוֹרָלוֹ שֶׁל עֵשָׂו וּבוֹכָה, שֶׁהָיוּ הַכֹּל אוֹמְרִים שְׁנֵי בָנִים לְרִבְקָה וּשְׁתֵּי בָנוֹת לְלָבָן, הַגְּדוֹלָה לַגָּדוֹל וְהַקְּטַנָּה לַקָּטָן (בבא בתרא קכ\"ג):", "rashi_en": "עיני לאה היו רכות מרוב בכי, כי חשבה שתיפול בגורלו של עשו. כולם אמרו: לרבקה שני בנים וללבן שתי בנות, הגדולה לגדול והקטנה לקטן.", "note": "", "points": [{"q": "מַדּוּעַ הָיוּ עֵינֵי לֵאָה רַכּוֹת?", "options": ["כִּי בָּכְתָה מֵחֲשָׁשׁ שֶׁתִּיפּוֹל בְּגוֹרָלוֹ שֶׁל עֵשָׂו", "כִּי מִטִּבְעָהּ הָיוּ עֵינֶיהָ חֲלָשׁוֹת מִלֵּידָה", "כִּי בָּכְתָה עַל שֶׁיַּעֲקֹב בָּחַר בְּרָחֵל אֲחוֹתָהּ"], "kasha": "למה מספרת התורה על חיסרון בגופה של לאה, ומה גרם לו?", "answer": "היא חשבה שתעלה בגורלו של עשו ובכתה, כי הכול אמרו: שני בנים לרבקה ושתי בנות ללבן, הגדולה לגדול והקטנה לקטן.", "kp": ["שהיתה סבורה לעלות", "בגורלו של עשו ובוכה"]}]}, {"id": "29:17.2", "ch": 29, "v": 17, "n": 2, "dh": "תאר", "pasuk_html": "וְעֵינֵ֥י לֵאָ֖ה רַכּ֑וֹת וְרָחֵל֙ הָֽיְתָ֔ה יְפַת־<mark>תֹּ֖אַר</mark> וִיפַ֥ת מַרְאֶֽה׃", "pasuk_en": "וְעֵינֵי לֵאָה רַכּוֹת וְרָחֵל הָיְתָה יְפַת־תֹּאַר וִיפַת מַרְאֶה׃", "rashi_he": "תאר. הוּא צוּרַת הַפַּרְצוּף, לְשׁוֹן יְתָאֲרֵהוּ בַשֶּׂרֶד: (ישעיהו מ\"ד, י\"ג), קונ\"פאש בלע\"ז:", "rashi_en": "'תאר' הוא צורת הפרצוף, כמו 'יתארהו בשרד' בישעיהו.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָה 'תֹּאַר' בַּפָּסוּק לְפִי רַשִׁ\"י?", "options": ["צוּרַת הַפַּרְצוּף", "צֶבַע הָעוֹר וְהַפָּנִים", "גּוֹבַהּ הַקּוֹמָה וּמִבְנֵה הַגּוּף"], "kasha": "מה ההבדל בין יופי התאר ובין 'ויפת מראה'?", "answer": "תאר הוא צורת הפרצוף, לשון 'יתארהו בשרד'.", "kp": ["הוא צורת הפרצוף"]}]}, {"id": "29:17.3", "ch": 29, "v": 17, "n": 3, "dh": "מראה", "pasuk_html": "וְעֵינֵ֥י לֵאָ֖ה רַכּ֑וֹת וְרָחֵל֙ הָֽיְתָ֔ה יְפַת־תֹּ֖אַר וִיפַ֥ת <mark>מַרְאֶֽה׃</mark>", "pasuk_en": "וְעֵינֵי לֵאָה רַכּוֹת וְרָחֵל הָיְתָה יְפַת־תֹּאַר וִיפַת מַרְאֶה׃", "rashi_he": "מראה. הוּא זִיו קְלַסְתֵּר:", "rashi_en": "\"יפת מראה\" הוא זיו קלסתר הפנים, כלומר זוהר ויופי הפנים.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"מַרְאֶה\" בַּבִּיטּוּי \"וִיפַת מַרְאֶה\" לְפִי רַשִׁ\"י?", "options": ["זִיו קַלַּסְתֵּר הַפָּנִים", "צוּרַת הַגּוּף וְקוֹמָתוֹ הַזְּקוּפָה", "בְּגָדֶיהָ וְתַכְשִׁיטֶיהָ הַנָּאִים"], "kasha": "הפסוק כבר אמר שרחל יפת תואר, ויש לברר מה מוסיף \"ויפת מראה\".", "answer": "מראה הוא זיו קלסתר, כלומר זוהר הפנים.", "kp": ["הוא זיו קלסתר"]}]}, {"id": "29:18.1", "ch": 29, "v": 18, "n": 1, "dh": "אעבדך שבע שנים", "pasuk_html": "וַיֶּאֱהַ֥ב יַעֲקֹ֖ב אֶת־רָחֵ֑ל וַיֹּ֗אמֶר <mark>אֶֽעֱבָדְךָ֙ שֶׁ֣בַע שָׁנִ֔ים</mark> בְּרָחֵ֥ל בִּתְּךָ֖ הַקְּטַנָּֽה׃", "pasuk_en": "וַיֶּאֱהַב יַעֲקֹב אֶת־רָחֵל וַיֹּאמֶר אֶעֱבָדְךָ שֶׁבַע שָׁנִים בְּרָחֵל בִּתְּךָ הַקְּטַנָּה׃", "rashi_he": "אעבדך שבע שנים. הֵם יָמִים אֲחָדִים שֶׁאָמְרָה לוֹ אִמּוֹ וְיָשַׁבְתָּ עִמּוֹ יָמִים אֲחָדִים (בראשית רבה); וְתֵדַע שֶׁכֵּן הוּא, שֶׁהֲרֵי כְתִיב וַיִּהְיוּ בְעֵינָיו כְּיָמִים אֲחָדִים (בראשית כ\"ט):", "rashi_en": "שבע השנים הן ה\"ימים אחדים\" שאמרה רבקה ליעקב \"וישבת עמו ימים אחדים\". והראיה: נאמר אחר כך \"ויהיו בעיניו כימים אחדים\".", "note": "", "points": [{"q": "מַדּוּעַ הִצִּיעַ יַעֲקֹב לַעֲבוֹד דַּוְוקָא שֶׁבַע שָׁנִים?", "options": ["אֵלּוּ הַ\"יָּמִים אֲחָדִים\" שֶׁאָמְרָה לוֹ אִמּוֹ לָשֶׁבֶת אֵצֶל לָבָן", "כִּי זֶה הָיָה הַמְּחִיר הַמְקוּבָּל אָז בַּעֲבוּר אִישָּׁה", "כִּי לָבָן דָּרַשׁ מִמֶּנּוּ שֶׁבַע שָׁנִים תְּמוּרַת רָחֵל"], "kasha": "לא מבואר מדוע קבע יעקב בעצמו דווקא שבע שנים.", "answer": "אלו הם \"ימים אחדים\" שאמרה לו אמו \"וישבת עמו ימים אחדים\", כמו שכתוב \"ויהיו בעיניו כימים אחדים\".", "kp": ["הם ימים אחדים שאמרה לו אמו"]}]}, {"id": "29:18.2", "ch": 29, "v": 18, "n": 2, "dh": "ברחל בתך הקטנה", "pasuk_html": "וַיֶּאֱהַ֥ב יַעֲקֹ֖ב אֶת־רָחֵ֑ל וַיֹּ֗אמֶר אֶֽעֱבָדְךָ֙ שֶׁ֣בַע שָׁנִ֔ים <mark>בְּרָחֵ֥ל בִּתְּךָ֖ הַקְּטַנָּֽה׃</mark>", "pasuk_en": "וַיֶּאֱהַב יַעֲקֹב אֶת־רָחֵל וַיֹּאמֶר אֶעֱבָדְךָ שֶׁבַע שָׁנִים בְּרָחֵל בִּתְּךָ הַקְּטַנָּה׃", "rashi_he": "ברחל בתך הקטנה. כָּל הַסִּימָנִים הַלָּלוּ לָמָּה? לְפִי שֶׁהוּא יוֹדֵעַ בּוֹ שֶׁהוּא רַמַּאי, אָמַר לוֹ, אֶעֱבָדְךָ בְרָחֵל, וְשֶׁמָּא תֹּאמַר רָחֵל אֲחֶרֶת מִן הַשּׁוּק, תַּלְמוּד לוֹמַר בִּתְּךָ, וְשֶׁמָּא תֹּאמַר אַחֲלִיף לְלֵאָה שְׁמָהּ וְאֶקְרָא שְׁמָהּ רָחֵל, תַּלְמוּד לוֹמַר הַקְּטַנָּה; וְאַף עַל פִּי כֵן לֹא הוֹעִיל, שֶׁהֲרֵי רִמָּהוּ:", "rashi_en": "יעקב ידע שלבן רמאי, ולכן פירט: \"ברחל\" - \"בתך\", שלא יביא רחל אחרת מן השוק, \"הקטנה\", שלא יחליף את שם לאה לרחל. ואף על פי כן לבן רימה אותו.", "note": "", "points": [{"q": "מַדּוּעַ פֵּירֵט יַעֲקֹב \"בְּרָחֵל בִּתְּךָ הַקְּטַנָּה\" וְלֹא אָמַר רַק \"בְּרָחֵל\"?", "options": ["כִּי יָדַע שֶׁלָּבָן רַמַּאי, וְרָצָה לִמְנֹועַ מִמֶּנּוּ כָּל תֵּירוּץ", "כִּי רָצָה לְכַבֵּד אֶת רָחֵל בְּתוֹאָרִים מְכוּבָּדִים", "כִּי רָצָה לְהַזְכִּיר לְלָבָן שֶׁלֵּאָה גְּדוֹלָה מִמֶּנָּה"], "kasha": "לכאורה די היה לומר \"ברחל\", ומדוע הוסיף סימנים רבים?", "answer": "לפי שידע שלבן רמאי, אמר \"בתך\" שלא יביא רחל אחרת מן השוק, ו\"הקטנה\" שלא יחליף את שם לאה ויקרא לה רחל. ואף על פי כן לא הועיל, שהרי רימהו.", "kp": ["לפי שהוא יודע בו שהוא רמאי", "ושמא תאמר רחל אחרת"]}, {"q": "מָה בָּא לִמְנוֹעַ הַמִּילָּה \"הַקְּטַנָּה\"?", "options": ["שֶׁלָּבָן יַחֲלִיף אֶת שֵׁם לֵאָה וְיִקְרָא לָהּ רָחֵל", "שֶׁלָּבָן יִיתֵּן לוֹ רָחֵל אַחֶרֶת מִן הַשּׁוּק", "שֶׁלָּבָן יִדְחֶה אֶת הַחֲתוּנָּה לְאַחַר זְמַן רַב"], "kasha": "הרי כבר אמר \"בתך\", ומה מוסיפה המילה \"הקטנה\"?", "answer": "שמא יאמר לבן: אחליף את שם לאה ואקרא שמה רחל; לכן אמר \"הקטנה\".", "kp": ["ושמא תאמר אחליף ללאה שמה", "ואקרא שמה רחל"]}]}, {"id": "29:21.1", "ch": 29, "v": 21, "n": 1, "dh": "מלאו ימי", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֤ב אֶל־לָבָן֙ הָבָ֣ה אֶת־אִשְׁתִּ֔י כִּ֥י <mark>מָלְא֖וּ יָמָ֑י</mark> וְאָב֖וֹאָה אֵלֶֽיהָ׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־לָבָן הָבָה אֶת־אִשְׁתִּי כִּי מָלְאוּ יָמָי וְאָבוֹאָה אֵלֶיהָ׃", "rashi_he": "מלאו ימי. שֶׁאָמְרָה לִי אִמִּי, וְעוֹד מָלְאוּ יָמַי, שֶׁהֲרֵי אֲנִי בֶן פ\"ד שָׁנָה וְאֵימָתַי אַעֲמִיד י\"ב שְׁבָטִים? וְזֶהוּ שֶׁאָמַר וְאָבוֹאָה אֵלֶיהָ, וְהֲלֹא קַל שֶׁבַּקַּלִּים אֵינוֹ אוֹמֵר כֵּן? אֶלָּא לְהוֹלִיד תּוֹלָדוֹת אָמַר כֵּן:", "rashi_en": "״מלאו ימי״ - הימים שאמרה לי אמי. ועוד: מלאו ימי, כי אני בן שמונים וארבע, ומתי אעמיד שנים עשר שבטים? לכן אמר ״ואבואה אליה״, לשון שאפילו פחות שבאנשים לא היה אומר, כי כוונתו להוליד תולדות.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי, לָמָּה אָמַר יַעֲקֹב ״כִּי מָלְאוּ יָמָי״?", "options": ["כִּי הָיָה בֶּן שְׁמוֹנִים וְאַרְבַּע וְצָרִיךְ לְהַעֲמִיד שְׁנֵים עָשָׂר שְׁבָטִים", "כִּי חָשַׁשׁ שֶׁלָּבָן יָמוּת לִפְנֵי הַחֲתוּנָה", "כִּי רָצָה לַחֲזוֹר מַהֵר לְאֶרֶץ כְּנַעַן לְאָבִיו"], "kasha": "על אילו ימים מדבר יעקב באמרו ״מלאו ימי״?", "answer": "הימים שאמרה לו אמו; ועוד, שהרי הוא בן פ״ד שנה, ואימתי יעמיד י״ב שבטים.", "kp": ["ואימתי אעמיד", "שהרי אני בן"]}, {"q": "אֵיךְ מֵסְבִּיר רַשִׁ״י אֶת הַלָּשׁוֹן ״וְאָבוֹאָה אֵלֶיהָ״, שֶׁאֵינָהּ לְשׁוֹן צְנוּעָה?", "options": ["יַעֲקֹב אָמַר כֵּן כִּי כַּוָּונָתוֹ הָיְיתָה לְהוֹלִיד תּוֹלָדוֹת", "יַעֲקֹב רָצָה לְהַרְאוֹת לְלָבָן שֶׁהוּא כּוֹעֵס עָלָיו", "כָּךְ הָיָה נָהוּג לְדַבֵּר בְּחָרָן בְּאוֹתָם יָמִים"], "kasha": "אפילו קל שבקלים אינו מדבר כך; איך אמר יעקב ״ואבואה אליה״?", "answer": "להוליד תולדות אמר כן.", "kp": ["אלא להוליד תולדות אמר כן"]}]}, {"id": "29:25.1", "ch": 29, "v": 25, "n": 1, "dh": "ויהי בבקר והנה היא לאה", "pasuk_html": "<mark>וַיְהִ֣י בַבֹּ֔קֶר וְהִנֵּה־הִ֖וא לֵאָ֑ה</mark> וַיֹּ֣אמֶר אֶל־לָבָ֗ן מ
