lay on a small place?","o":["Hashem folded all of Eretz Yisrael under Yaakov","It refers only to the four cubits on which Yaakov lay","Yaakov lay on a stone that was taken from all of Eretz Yisrael"]},{"q":"What did Hashem hint to Yaakov by folding the land under him?","o":["That the land would be easy for his children to conquer, like four cubits","That the land would be small and not enough for all his children","That Yaakov himself would conquer the whole land in his lifetime"]}]},"28:14.1":{"e":"\"U-faratzta\" means: and you will grow strong and multiply, like \"and so he will increase (yifrotz).\"","pe":"Your descendants shall be as the dust of the earth. You shall spread to the west, to the east, to the north and to the south. Through you shall be blessed all the families of the earth, and through your descendants.","re":"You shall spread. [Meaning:] “You will become strong” as in וְכֵן יִפְרוֹץ “The stronger they became.”","p":[{"q":"What does \"ופרצת\" mean according to Rashi?","o":["And you will grow strong","And you will break the walls of enemies","And you will be scattered in exile among the nations"]}]},"28:15.1":{"e":"Hashem promised Yaakov to be with him because Yaakov was afraid of both Eisav and Lavan.","pe":"Behold, I am with you, and I will guard you wherever you go, and I will bring you back to this land. I will not forsake you until I have done that which I have spoken for you.","re":"I am with you. Because he feared both, Eisov and Lavan.","p":[{"q":"Why did Hashem need to promise Yaakov \"אנכי עמך\"?","o":["Because Yaakov was afraid of Eisav and Lavan","Because Yaakov was afraid of wild animals on the road","Because Yaakov worried he would not find a wife in Charan"]}]},"28:15.2":{"e":"The word \"im\" here is not conditional but means \"ki\" (until), that is: until I do what I promised you.","pe":"Behold, I am with you, and I will guard you wherever you go, and I will bring you back to this land. I will not forsake you until I have done that which I have spoken for you.","re":"Until I have done. אִם, here, is used in the sense of כִּי.","p":[{"q":"What does the word \"אם\" mean in the phrase \"עד אשר אם עשיתי\"?","o":["In the sense of \"ki,\" meaning: until I do","Conditional: if I do and if I do not do","A question: did I do?"]}]},"28:15.3":{"e":"\"Lecha\" here means about you and for your sake: what Hashem promised Avraham about his descendants was said about Yaakov and not about Eisav, since it says \"for in Yitzchak\" and not all of Yitzchak. Likewise every \"li, lecha, lo, lahem\" attached to a term of speech means \"about.\"","pe":"Behold, I am with you, and I will guard you wherever you go, and I will bring you back to this land. I will not forsake you until I have done that which I have spoken for you.","re":"I have spoken for you. [לָךְ means] in your interest and concerning you. That which I promised Avraham regarding his descendants—My promise was referring to you and not to Eisov, for I did not say to him: “for Yitzchok will be called your seed” but, rather: “for בְּיִצְחָק —in Yitzchok” and not all of Yitzchok’s [descendants]. Similarly every לִי, וְלָךְ, וְלוֹ, and לָהֶם that follow any form of the word דִבּוּר are used in terms of “concerning.” This [verse] indicates this [fact] for He had not spoken to Yaakov prior to this.","p":[{"q":"What does \"לך\" mean in the words \"דברתי לך\"?","o":["About you and for your sake; the speech was said concerning you","To you; the speech was said to Yaakov himself earlier","In front of you; speech said in your presence to your father"]},{"q":"Which earlier statement does Hashem mean according to Rashi?","o":["The promise to Avraham about his descendants, which was said about Yaakov and not about Eisav","The blessing Yitzchak gave Yaakov before he left for Charan","The prophecy told to Rivkah that the older shall serve the younger"]}]},"28:16.1":{"e":"Yaakov says that had he known the place was so holy, he would not have slept there.","pe":"Yaakov awoke from his sleep, and said, In truth, Adonoy is in this place, and I did not know it.","re":"And I did not know it. For had I known I would not have slept in such a holy place.”","p":[{"q":"What did Yaakov mean by the words \"ואנכי לא ידעתי\"?","o":["That had he known the place was holy, he would not have slept in it","That he did not know Hashem reveals Himself outside his father's house","That he did not know the angels were accompanying him on his way"]}]},"28:17.1":{"e":"The ladder stood in Be'er Sheva and the middle of its slope reached opposite Jerusalem, with its top at Beit El. Rashi explains that Har HaMoriah was uprooted and came toward Yaakov as far as Beit El, which is the jumping of the earth. Yaakov reached Charan, was distressed that he had passed the place where his fathers prayed without praying there, turned back, and the earth jumped for him.","pe":"He was afraid and said, How awesome is this place! This is none other than the house of Elohim, and this is the gate of heaven.","re":"This is the house of Elohim. Said R. Elazar in the name of R. Yose b. Zimra: This ladder stood in Beer Sheva and [the middle of] its slope reached opposite the Beis Hamikdosh. For Beer Sheva is located south of Yehudah[’s territory] and Yerushalayim to its north on the border between Yehudah and Binyamin. Beis Eil was in the north of Binyamin’s territory on the border between Binyamin and the [territory of] the Children of Yoseif. Consequently, a ladder whose foot is in Beer Sheva and its top is in Beis Eil will have the middle of its slope reaching opposite Yerushalayim. However, regarding what our Sages have stated: that God had said, “This righteous person has come to My Dwelling Place and will depart without staying overnight?!” And they stated furthermore: Yaakov called Yerushalayim, Beis Eil yet this place [that he called Beis Eil] was Luz and not Yerushalayim. Then from where did they derive to say that [i.e., this was the site of the Beis Hamikdosh]? I say that Mount Moriah was uprooted and came here. This is the “shrinking of the ground” to which is referred in Chullin, [i.e.] that the [site of] the Beis Hamikdosh came towards him until Beis Eil. And this is [also the reference] “He reached the place.” Should you ask: when Yaakov passed [the site of] the Beis Hamikdosh why did He [God] not detain him there? [The answer is: if] it did not enter his [Yaakov’s] mind to pray in the place where his fathers prayed then, should Heaven detain him? [Actually,] he had gone as far as Charan as is stated in the chapter Gid Hanasheh. This is also evident in the verse: “And went toward Charan.” When he reached Charan he said, “Is it possible that I passed the place where my fathers prayed without me having prayed there?” He decided to go back and returned as far as Beis Eil [whereupon] the ground “shrank” for him. (This Beis Eil is not the one near Ai but [the one near] Yerushalayim. And because it was the City of God he called it Beis Eil. It is [also] Mount Moriah where Avraham prayed and it is also the field where Yitzchok prayed as is written: “To meditate in the field.” Similarly they [the Sages] stated in Pesachim: [concerning the verse] “Let us ascend to the Mountain of God and to the House of the God of Yaakov.” [It is] not called as Avraham called it—a mountain nor as Yitzchok who called it a field but as Yaakov who called it Beis Eil. To this point [from “This Beis Eil…] is from a corrected Rashi text.)","p":[{"q":"How does Rashi resolve that Yaakov was at Luz, yet the Sages say this was the place of the Beit HaMikdash?","o":["Har HaMoriah was uprooted and came toward him as far as Beit El","Luz and Jerusalem are two names for the same city","Yaakov dreamed he was in Jerusalem even though he was in Luz"]},{"q":"Why did Heaven not stop Yaakov when he passed the place of the Mikdash on his way to Charan?","o":["Because he himself did not set his mind to pray there","Because the time to build the Mikdash had not yet come","Because he had to hurry since Eisav was chasing him"]}]},"28:17.2":{"e":"Onkelos translated \"ma dachilu atra hadein.\" Rashi explains that \"dachilu\" is a noun (awe), like \"sochlsanu\" and \"kasu le-malbush.\"","pe":"He was afraid and said, How awesome is this place! This is none other than the house of Elohim, and this is the gate of heaven.","re":"How awesome. The Targum translates it: “How דְחִילוּ is this place. דְחִילוּ is a noun [though plural] as סוּכְלְתָנוּ [understanding] and as וּכְסוּ לְמִלְבָּשׁ [and a garment to wear].","p":[{"q":"According to Rashi, what is the form of the word \"דחילו\" in Targum Onkelos?","o":["A noun meaning awe, like \"סוכלתנו\" and \"כסו\"","A plural: people who are fearful","A past-tense verb: they feared the place"]}]},"28:17.3":{"e":"On the simple level, this is a place of prayer, from which prayers ascend to heaven. According to the midrash, the Beit HaMikdash above is aligned exactly opposite the Beit HaMikdash below, which is destined to be built at this place.","pe":"He was afraid and said, How awesome is this place! This is none other than the house of Elohim, and this is the gate of heaven.","re":"And this is the gate of heaven. I.e., a place of prayer where their prayers ascend to heaven. Its Midrashic interpretation is that the Heavenly Beis Hamikdosh is situated directly above the Earthly Beis Hamikdosh.","p":[{"q":"According to the simple meaning, why is the place called \"שער השמים\"?","o":["Because prayers rise to heaven from there","Because the angels went up and down the ladder from there","Because the heavens opened there and Hashem's glory was revealed"]},{"q":"What does the midrash teach about \"שער השמים\"?","o":["The Beit HaMikdash above is aligned opposite the Beit HaMikdash below","In the future a gate to the city of Jerusalem will be built at this place","Angels guard the gate of heaven at this place"]}]},"28:20.1":{"e":"Yaakov was not relying only on Hashem's promise, but meant: if Hashem will keep the promises He made me to be with me, as He said, \"And behold, I am with you.\"","pe":"Yaakov made a vow, saying, If Elohim will be with me, and guards me on this path that I am going, and gives me bread to eat and clothing to wear;","re":"If Elohim will be with me. I.e., “If He will keep these promises that He promised me to be with me as He said to me: ‘And behold, I am with you.’”","p":[{"q":"What did Yaakov mean by saying \"אם יהיה אלהים עמדי\"?","o":["If Hashem will fulfill His promise to be with him","If Hashem will appear to him again in a dream","If Hashem will immediately return him to his father's house"]}]},"28:20.2":{"e":"Yaakov asked \"u-shmarani\" as Hashem had already promised him: \"and I will guard you wherever you go.\"","pe":"Yaakov made a vow, saying, If Elohim will be with me, and guards me on this path that I am going, and gives me bread to eat and clothing to wear;","re":"And guard me. “As He said to me; “And I will guard you wherever you go.”","p":[{"q":"On what is Yaakov's request \"ושמרני\" based?","o":["On Hashem's promise \"and I will guard you wherever you go\"","On the blessing his father Yitzchak gave him","On a promise Hashem made to Avraham at the Covenant Between the Parts"]}]},"28:20.3":{"e":"Yaakov asked exactly what Hashem promised him, \"for I will not forsake you,\" because one who has to ask for bread is called 'forsaken,' as it says, \"I have not seen a righteous man forsaken, with his children begging for bread.\"","pe":"Yaakov made a vow, saying, If Elohim will be with me, and guards me on this path that I am going, and gives me bread to eat and clothing to wear;","re":"And give me bread to eat. As He said; “I will not forsake you.” For one who must search for bread is considered “abandoned,” as it is said, “I have never seen a righteous man forsaken and his children searching for bread.”","p":[{"q":"On which promise of Hashem is Yaakov's request \"ונתן לי לחם לאכל\" based?","o":["On the promise \"for I will not forsake you\"","On the promise \"and I will return you to this land\"","On the promise \"and you shall spread out westward and eastward\""]}]},"28:21.1":{"e":"Yaakov says \"and I will return in peace\" as Hashem said to him earlier, \"and I will return you to the land.\"","pe":"And if I return in peace to my father’s house, and Adonoy will be my God;","re":"And if I return. As He told me; “And I will bring you back to [this] land.”","p":[{"q":"Why does Yaakov mention \"ושבתי בשלום\" in his vow?","o":["Because that is what Hashem told him: 'I will return you to the land'","Because he feared he would never merit returning to his father's house","Because he promised his mother Rivkah that he would return to her soon"]}]},"28:21.2":{"e":"Yaakov asks to return to his father's house whole from sin, that is, that he not learn from Lavan's evil ways.","pe":"And if I return in peace to my father’s house, and Adonoy will be my God;","re":"In peace. I.e., completely [שָׁלֵם] free from sin, that I may not learn from the ways of Lavan.","p":[{"q":"According to Rashi, what kind of peace does Yaakov mean by \"ושבתי בשלום\"?","o":["Whole from sin, that he not learn from Lavan's ways","That Eisav not harm him when he returns to the land","That he return with great wealth and lacking nothing"]}]},"28:21.3":{"e":"Yaakov asks that Hashem's name rest upon him from beginning to end, meaning that no flaw be found in his descendants. This is the promise Hashem made to Avraham: 'to be a God to you and to your descendants after you.'","pe":"And if I return in peace to my father’s house, and Adonoy will be my God;","re":"And Adonoy will be my God. [I.e.,] that His Name shall be upon me from beginning to end—that He may not find anyone unfit among my descendants as it is said: [“I will do] that which I have spoken to you.” This [particular] promise he promised to Avraham, for it is said: “To be a God to you and to your descendants after you.” (“Your descendants after you” [meaning:] that nothing in him be found unfit.)","p":[{"q":"What is Yaakov asking when he says 'והיה יהוה לי לאלהים'?","o":["That Hashem's name rest upon him and no flaw be found in his descendants","That Hashem guard him on the way and return him in peace","That Hashem give him bread to eat and clothing to wear"]}]},"28:22.1":{"e":"Rashi explains that the vav of \"ve-ha-even\" opens Yaakov's commitment: if You do all these things for me, I too will do this.","pe":"[Then] this stone which I have set [as] a monument will become a House of God, and of all that You give, I will surely give a tenth to You.","re":"[Then] this stone. This is how to explain this letter וָיו of וְהָאֶבֶן: “If You will do these things I, too, shall do the following:","p":[{"q":"How does Rashi explain the vav of \"והאבן\"?","o":["If You do these things for me, I will do this","A connecting vav: and I will set up yet another stone","A continuation of the condition: and if You also guard this stone"]}]},"28:22.2":{"e":"As Targum Onkelos renders it: 'I will serve upon it before Hashem,' meaning I will worship Hashem upon it. Yaakov did so when he returned from Padan Aram: when Hashem told him 'Arise, go up to Beit El,' it says there, 'And Yaakov set up a pillar and poured a libation on it.'","pe":"[Then] this stone which I have set [as] a monument will become a House of God, and of all that You give, I will surely give a tenth to You.","re":"“This stone which I have set as a monument,” etc. As it is translated by Onkelos: “I shall serve God upon it.” And he, indeed, did so upon his return from Padan Aram when He [God] said to him: “Arise and go up to Beis Eil.” What does it then say? “Yaakov set up a monument—He poured a libation on it.”","p":[{"q":"What did Yaakov mean by saying about the stone \"יהיה בית אלהים\"?","o":["That he would worship Hashem upon it, as Targum Onkelos says","That he would build a dwelling house for his family upon it","That the stone itself would be holy and forbidden to touch"]},{"q":"When did Yaakov fulfill what he said about the stone?","o":["On his return from Padan Aram, when he set up a pillar and poured a libation on it","Immediately that same morning, when he first set up the stone","When he met Eisav and offered a thanksgiving offering there"]}]},"29:1.1":{"e":"After Yaakov received the good news that Hashem would guard him, his heart rejoiced, and his heart, as it were, lifted his feet, making it easy for him to walk.","pe":"Yaakov [then] lifted his feet and went toward the land of the people of the East.","re":"Yaakov [then] lifted his feet. Once he was foretold the good tiding that he was assured of [God’s] protection, his heart lifted his feet and it became easy for him to go [swiftly]. It is thus explained in Bereishis Rabbah.","p":[{"q":"What does the expression \"וישא יעקב רגליו\" teach?","o":["That the joy of the good news made walking easier for him","That he walked slowly and heavy-footed out of fear of Eisav","That he was tired and had difficulty getting up from lying down"]}]},"29:2.1":{"e":"The flocks do not water themselves; it means that the shepherds water the flocks, and the verse spoke in abbreviated language.","pe":"He looked and [saw] a well in the field; and behold there were three flocks of sheep lying beside it, for from that well the flocks are watered. There was a large stone over the mouth of the well.","re":"The flocks are watered. The shepherds give the flocks to drink. The verse speaks elliptically.","p":[{"q":"According to Rashi, who does the watering in the words \"ישקו העדרים\"?","o":["The shepherds water the flocks, and the verse abbreviated","The flocks drink from the well themselves","The girls of the town water the flocks"]}]},"29:3.1":{"e":"The shepherds were accustomed to gather all together at the well, because the stone was large and could not be moved without all of them.","pe":"When all the flocks would gather, [the shepherds] would roll the stone from the well’s mouth, and water the sheep. They would [then] return the stone to its place over the mouth of the well.","re":"Would gather. [Meaning:] they would regularly gather because the stone was large.","p":[{"q":"What does Rashi teach us with the word \"ונאספו\"?","o":["That they were accustomed to gather like this, because the stone was large","That they gathered on that day specially in honor of Yaakov's arrival","That they gathered to argue over who would water first"]}]},"29:3.2":{"e":"\"Ve-galelu\" means \"and they roll\": this is what the shepherds always did. A continuous present tense is sometimes written in the past tense and sometimes in the future, because something that happens constantly already happened and will happen.","pe":"When all the flocks would gather, [the shepherds] would roll the stone from the well’s mouth, and water the sheep. They would [then] return the stone to its place over the mouth of the well.","re":"Would roll. [Meaning:] and they would roll. Its Targum translation is וּמְגַנְדְרִין. Every expression in the [ongoing] present tense can variably be expressed in the future tense as well as in the past tense because anything that is ongoing in the present tense has already happened and will continue to happen.","p":[{"q":"What does \"וגללו\" mean according to Rashi?","o":["And they roll: this is what the shepherds always used to do","And they rolled: once, on the day Yaakov came","And they will roll: in the future, when all the flocks come"]}]},"29:3.3":{"e":"Onkelos translates \"u-mativin,\" in the present tense: it was the shepherds' constant custom that after watering they would return the stone to its place.","pe":"When all the flocks would gather, [the shepherds] would roll the stone from the well’s mouth, and water the sheep. They would [then] return the stone to its place over the mouth of the well.","re":"They would [then] return. Its Targum translation is וּמְתִיבִין .","p":[{"q":"What does Targum Onkelos' \"ומתיבין\" teach about the word \"והשיבו\"?","o":["That it was a fixed custom: every time they would return the stone","That the shepherds returned the stone once, that day","That Yaakov was the one who returned the stone to its place"]}]},"29:6.1":{"e":"Here \"ba'ah\" is accented on the last syllable (the alef) and means she is on her way, coming now. In verse 9, \"ve-Rachel ba'ah\" is accented on the first syllable (the bet) and means she had already come.","pe":"He said to them, Is he doing well? They said, He is doing well. Behold Rochel, his daughter, is coming with the sheep.","re":"Is coming. The accent is on the letter אל\"ף [of בָּאָה] and the Targum translation is אָתְיָא [whereas in] וְרָחֵל בָּאָה [v. 9] the accent is on the first syllable on the בי\"ת and the Targum translation is אָתַת. The former term means she is doing and the latter means she has done.","p":[{"q":"According to Rashi, what is the difference between \"ba'ah\" here and \"ve-Rachel ba'ah\" in verse 9?","o":["Here she is on her way coming, and there she had already come","Here she comes alone, and there she came with the flock","Here it refers to Rachel, and there it refers to her sister Leah"]}]},"29:7.1":{"e":"Yaakov saw the shepherds lying down and thought they wanted to gather the flocks home and stop grazing. So he told them: if you are hired workers, you have not yet completed a day's work; and if the flock is yours, still it is not yet time to gather the livestock.","pe":"He said to them, The day is yet long, it is not yet time for the sheep to be gathered, water the sheep and go pasture them.","re":"The day is yet long. Because he saw them lying down, he thought that their intention was to gather the cattle into the house, and graze no longer. [Whereupon,] he said to them, “The day is yet long.” I.e., “If you are hired workers then you have not completed a day’s work. And if the animals are yours nevertheless, it is not yet time for the sheep to be gathered, etc.”","p":[{"q":"Why did Yaakov say to the shepherds \"הן עוד היום גדול\"?","o":["He saw them lying down and thought they wanted to gather the flocks home","He wanted to send them away so he could meet Rachel alone","He saw the flocks were thirsty and the shepherds were slow to water them"]},{"q":"What did Yaakov argue to the shepherds in case the flock was their own?","o":["That even so it was not yet time to gather the livestock","That they need not fear the owner and could rest","That they should first water Lavan's flock"]}]},"29:8.1":{"e":"The shepherds said they cannot water the flocks, because the stone on the mouth of the well is large, and only when all the shepherds gather can they roll it away.","pe":"They said, We cannot [do so] until all the flocks have gathered and [the shepherds] roll the stone from the mouth of the well. Then we can water the sheep.","re":"We cannot [do so]. To give them drink because the stone is large.","p":[{"q":"Why did the shepherds say \"לא נוכל\" to water the flocks?","o":["Because the stone is large and they cannot roll it away alone","Because the fixed time for watering had not yet come","Because the owner of the well forbade watering without his presence"]}]},"29:8.2":{"e":"Onkelos translates \"ve-galelu\" in the future tense (\"ve-yignedrun\"), because the shepherds are speaking about what they will do after all the flocks have gathered.","pe":"They said, We cannot [do so] until all the flocks have gathered and [the shepherds] roll the stone from the mouth of the well. Then we can water the sheep.","re":"And [the shepherds] roll. This is translated by Onkelos— וִיגַנְדְרוּן because it is in the future tense.","p":[{"q":"Why does Onkelos translate \"וגללו\" in the future tense?","o":["Because the shepherds are describing what they will do when the flocks gather","Because the shepherds had already rolled the stone earlier","Because the shepherds are commanding Yaakov to roll the stone"]}]},"29:10.1":{"e":"Yaakov rolled the large stone easily, like one who removes a stopper from the mouth of a bottle. The Torah tells this to teach us that his strength was great.","pe":"When Yaakov saw Rochel, the daughter of Lavan, his mother’s brother, with the sheep of Lavan, his mother’s brother, he stepped near and rolled the stone from the mouth of the well. He then watered the sheep of Lavan, his mother’s brother.","re":"He stepped near and rolled. As one removes a stopper from a bottle opening to let you know that his strength was great.","p":[{"q":"What does the verse come to teach by telling that Yaakov rolled the stone alone?","o":["That his strength was great, and he removed it like a stopper from a bottle","That the stone was very small and light","That the shepherds helped him roll the stone"]}]},"29:11.1":{"e":"Yaakov wept because he saw through ruach hakodesh that Rachel would not be buried with him. Also, because he came empty-handed: Eliphaz son of Eisav pursued him to kill him, and Yaakov gave him all his possessions, since a poor person is considered as dead.","pe":"Yaakov kissed Rochel and cried in a loud voice.","re":"And cried. Because he foresaw through Divine Inspiration that she would not be buried together with him. Another explanation: because he came empty-handed. He thought: My grandfather’s servant, Eliezer, had with him rings, bracelets, and delicacies whereas, I, have nothing with me [This was so] because Elifaz, the son of Eisov, pursued him [Yaakov] by order of his father in order to kill him, and he caught up to him. But, since Elifaz was raised on Yitzchok’s lap he refrained [from killing him.] He [Elifaz then] said to him: “What should I do about my father’s order?” Yaakov replied to him: “Take whatever I have with me because a poor person is considered as dead.”","p":[{"q":"According to the first explanation, why did Yaakov weep when he met Rachel?","o":["He saw through ruach hakodesh that Rachel would not be buried with him","He was very moved to finally meet his relative","He feared that Lavan would not agree to give him Rachel"]},{"q":"According to the second explanation, why did Yaakov arrive empty-handed?","o":["Eliphaz pursued him to kill him, and Yaakov gave him everything because a poor person is considered dead","Robbers on the road stole everything he brought","Yitzchak deliberately sent him without gifts so that he would work"]}]},"29:12.1":{"e":"On the simple level, \"achi\" means a relative, like \"we are men who are brothers.\" According to the midrash, Yaakov hinted: if Lavan comes to deceive, I too am his brother in deceit; and if he is upright, I too am the son of Rivkah, his upright sister.","pe":"Yaakov told Rochel that he was a relative of her father, that he was the son of Rivkah. She ran and told her father.","re":"That he was a relative [lit. brother] of her father [Meaning:] a relative of her father, as in “For we are kinsmen.” Its Midrashic interpretation is: [Yaakov meant:] “If he [Lavan] intends to be deceitful then I, too, am his brother in deception but, if he is an honest person then, I, too, am the son of the righteous Rivkah.”","p":[{"q":"What does \"אחי אביה\" mean according to its simple meaning?","o":["A relative of her father, like \"אנשים אחים אנחנו\"","Lavan's actual brother, from the same father","Lavan's close friend from his youth"]},{"q":"According to the midrash, what did Yaakov hint by saying both \"אחי אביה\" and \"בן רבקה\"?","o":["If Lavan deceives, so will he; and if Lavan is upright, so is he","That he is more fitting for Rachel than all other shepherds","That Lavan must host him in his house because he is his relative"]}]},"29:12.2":{"e":"Rachel told her father because her mother had already died and she had no one to tell but him.","pe":"Yaakov told Rochel that he was a relative of her father, that he was the son of Rivkah. She ran and told her father.","re":"And told her father. Because her mother had died and she had no one to tell but him.","p":[{"q":"Why did Rachel tell specifically her father?","o":["Because her mother had died and she had no one else to tell","Because she wanted Lavan to hurry to greet Yaakov","Because in Lavan's house it was customary to tell the father everything first"]}]},"29:13.1":{"e":"Lavan ran toward Yaakov because he thought he was laden with money, since Avraham's servant had once arrived there with ten loaded camels.","pe":"When Lavan heard the news of Yaakov, his sister’s son, he ran to greet him. He embraced him and kissed him, and brought him to his house. [Yaakov] told Lavan all that had happened.","re":"He ran to greet him. He thought that he [Yaakov] was loaded with money for the servant of the house had come here with ten loaded camels.","p":[{"q":"Why did Lavan run toward Yaakov?","o":["Because he thought Yaakov was laden with money, like Avraham's servant","Because he was happy to meet his beloved sister's son","Because he wanted to check whether Yaakov had come to fight him"]}]},"29:13.2":{"e":"Lavan saw that Yaakov had come with nothing, and thought perhaps he had brought gold coins hidden in his bosom, so he embraced him.","pe":"When Lavan heard the news of Yaakov, his sister’s son, he ran to greet him. He embraced him and kissed him, and brought him to his house. [Yaakov] told Lavan all that had happened.","re":"He embraced. When he saw that he [Yaakov] had nothing with him, he thought: “Maybe he has brought gold coins and he has them in his bosom.”","p":[{"q":"According to Rashi, why did Lavan embrace Yaakov?","o":["He thought perhaps Yaakov had hidden gold coins in his bosom","He was truly happy to see his sister's son","That was how a relative who came from afar was received"]}]},"29:13.3":{"e":"Lavan kissed Yaakov because he thought perhaps Yaakov had brought pearls hidden in his mouth.","pe":"When Lavan heard the news of Yaakov, his sister’s son, he ran to greet him. He embraced him and kissed him, and brought him to his house. [Yaakov] told Lavan all that had happened.","re":"And kissed him. He thought: “Maybe he has brought jewels and he has them in his mouth.”","p":[{"q":"What did Lavan think when he kissed Yaakov?","o":["That perhaps Yaakov had brought pearls in his mouth","That he was happy to see his sister's son after many years","That he wanted to show the townspeople that Yaakov was his relative"]}]},"29:13.4":{"e":"Yaakov told Lavan that he had come only because he was forced to flee from his brother, and that his brother had taken all his money.","pe":"When Lavan heard the news of Yaakov, his sister’s son, he ran to greet him. He embraced him and kissed him, and brought him to his house. [Yaakov] told Lavan all that had happened.","re":"He told Lavan. That he came only under duress, because of his brother [Eisov], and that all his money was taken from him.","p":[{"q":"What did Yaakov tell Lavan according to Rashi?","o":["That he came only because of his brother, and that his money was taken from him","That he came to seek a wife and brought much money with him","That he saw angels going up and down a ladder on the way"]}]},"29:14.1":{"e":"Lavan said to Yaakov: since you have nothing, I have no reason to take you into my house, but because of the kinship I will care for you for a month. And so he did, yet even this was not free, since Yaakov shepherded his flock.","pe":"Lavan said to him, Nevertheless, you are my bone and flesh. [Yaakov] lived with him for a month.","re":"Nevertheless, [you are] my bone and flesh. I.e., “Now I have no [reason] to take you into the house since you have nothing with you, but because we are related I will put up with you for a month.” And he did so. But, even this was not for nothing for he was the shepherd of his sheep.","p":[{"q":"What did Lavan hint with the word \"אך\" in saying \"אך עצמי ובשרי אתה\"?","o":["That there is no reason to host him since he has nothing, and only because of the kinship will he care for him for a month","That he is very happy to receive his relative into his home permanently","That he suspects Yaakov is not truly his sister's son"]},{"q":"Was the month Yaakov stayed with Lavan free of charge?","o":["No, because Yaakov shepherded Lavan's flock","Yes, Lavan hosted him without asking for anything","No, because Yaakov paid him with money he had brought"]}]},"29:15.1":{"e":"Lavan asks in astonishment: because you are my relative, will you work for me for nothing?","pe":"Lavan said to Yaakov, Just because you are my relative, must you work for me without pay? Tell me, [what should] your wages [be]?","re":"Just because you are my relative. [The ה\"א prefix of הֲכִי is] an expression of an incredulous question. Just because you are my brother, should you work for me for nothing?","p":[{"q":"What did Lavan mean by asking Yaakov whether he is his brother?","o":["Astonishment: because you are my relative, will you work for free?","A statement: because you are my relative, you must work for free","A question whether Yaakov is truly his relative"]}]},"29:15.2":{"e":"\"Ve-avadtani\" means \"ve-ta'avdeni,\" in the future tense. Any past-tense word to which a vav is added at the beginning is turned into the future.","pe":"Lavan said to Yaakov, Just because you are my relative, must you work for me without pay? Tell me, [what should] your wages [be]?","re":"Must you work for me. Has the same meaning as וְתַעַבְדֵנִי. Similarly, every word which is in the past tense, if a וי\"ו is added at the beginning, transforms the word into the future tense.","p":[{"q":"What does \"ועבדתני\" mean according to Rashi?","o":["And you will serve me, in the future, since the vav turns past into future","And you served me, in the past, for the month he already worked","You served me: a question whether he already worked for free"]}]},"29:17.1":{"e":"Leah's eyes were soft from much weeping, because she thought she would fall to Eisav's lot. Everyone said: Rivkah has two sons and Lavan has two daughters, the older to the older and the younger to the younger.","pe":"The eyes of Leah were tender. Rochel was of beautiful form and of beautiful appearance.","re":"Tender. Because she had thought that she would fall to the lot of Eisov and so she cried. For everyone would say: Rivkah has two sons and Lavan, two daughters, the older [son would marry] the older [daughter] and the [would marry] the younger daughter.","p":[{"q":"Why were Leah's eyes soft?","o":["Because she wept for fear she would fall to Eisav's lot","Because her eyes were naturally weak from birth","Because she wept that Yaakov chose her sister Rachel"]}]},"29:17.2":{"e":"\"Toar\" is the shape of the face, like \"yetarehu bassered\" in Yeshayahu.","pe":"The eyes of Leah were tender. Rochel was of beautiful form and of beautiful appearance.","re":"Form. [תֹּאַר] refers to the form of the face as in the term יְתָאֲרֵהוּ בַשֶּׂרֶד. Conpas in Old French.","p":[{"q":"What does the word 'תאר' mean in the verse according to Rashi?","o":["The shape of the face","The color of the skin and face","Height and body build"]}]},"29:17.3":{"e":"\"Yefat mareh\" is the radiance of the facial features, that is, the glow and beauty of the face.","pe":"The eyes of Leah were tender. Rochel was of beautiful form and of beautiful appearance.","re":"Appearance. [מַרְאֶה] refers to the beauty of her features.","p":[{"q":"What does \"מראה\" mean in the phrase \"ויפת מראה\" according to Rashi?","o":["The radiance of the facial features","The shape of the body and her upright stature","Her fine clothing and jewelry"]}]},"29:18.1":{"e":"The seven years are the \"few days\" that Rivkah told Yaakov: \"and you shall stay with him a few days.\" The proof is that it later says, \"and they seemed to him like a few days.\"","pe":"Yaakov loved Rochel. and he said, I will work for you seven years for Rochel, your younger daughter.","re":"I will work for you seven years. These are the “few days” that his mother had told him: “Remain with him a short time.” And you may know that this is so for it is written: “They seemed to him like a few days.”","p":[{"q":"Why did Yaakov offer to work specifically seven years?","o":["These are the \"few days\" his mother told him to stay with Lavan","Because that was the customary price then for a wife","Because Lavan demanded seven years from him for Rachel"]}]},"29:18.2":{"e":"Yaakov knew Lavan was a deceiver, so he specified: \"for Rachel,\" \"your daughter,\" so that Lavan would not bring another Rachel from the market, and \"the younger,\" so that he would not switch Leah's name to Rachel. Even so, Lavan deceived him.","pe":"Yaakov loved Rochel. and he said, I will work for you seven years for Rochel, your younger daughter.","re":"For Rochel, your younger daughter. Why all these detailed characteristics? [This was] because he knew that he [Lavan] was a deceitful person. He said to him: “I will work for you for Rochel, and lest you claim [that I mean] a different Rochel, [one] from the street, therefore, I say, ‘Your daughter.’ And lest you say, ‘I will change Leah’s name and call her by the name Rochel’ therefore, I say ‘the younger one’. Despite all this, it did him no good for [in the end] he tricked him.","p":[{"q":"Why did Yaakov specify \"ברחל בתך הקטנה\" and not just say \"ברחל\"?","o":["Because he knew Lavan was a deceiver and wanted to deny him every excuse","Because he wanted to honor Rachel with respectful titles","Because he wanted to remind Lavan that Leah was older than her"]},{"q":"What did the word \"הקטנה\" come to prevent?","o":["That Lavan would switch Leah's name and call her Rachel","That Lavan would give him another Rachel from the market","That Lavan would postpone the wedding for a long time"]}]},"29:21.1":{"e":"\"My days are fulfilled\" means the days my mother told me. Also, my days are fulfilled, for I am eighty-four years old, and when will I establish twelve tribes? Therefore he said \"and I will come to her,\" a phrase that even the lowest of people would not say, because his intent was to bear offspring.","pe":"Yaakov said to Lavan, Give me my wife, for my term is completed; and thus I will consummate the marriage with her.","re":"My term is completed. [יָמָי refers to the days] that my mother told me. Another explanation for מָלְאוּ יָמָי, “For I am already eighty-four years old, and when will I establish the Twelve Tribes. This is what he meant by saying, “And thus I will consummate the marriage with her.” For even the lowest of the low would not express himself in such a manner. But, for the purpose of begetting descendants he spoke in this manner.","p":[{"q":"According to the second explanation, why did Yaakov say \"כי מלאו ימי\"?","o":["Because he was eighty-four and needed to establish twelve tribes","Because he feared Lavan would die before the wedding","Because he wanted to return quickly to his father in Canaan"]},{"q":"How does Rashi explain the phrase \"ואבואה אליה,\" which is not a modest expression?","o":["Yaakov said it because his intent was to bear offspring","Yaakov wanted to show Lavan that he was angry at him","That was how people customarily spoke in Charan in those days"]}]},"29:25.1":{"e":"Only in the morning did Yaakov discover it was Leah, because at night she appeared to him as Rachel: Yaakov had given Rachel signs, and Rachel passed them to Leah so that her sister would not be shamed.","pe":"When it was morning, behold it was Leah! He [Yaakov] said to Lavan, What have you done to me? Did I not work with you for Rochel? Why did you deceive me?","re":"When it was morning, behold it was Leah! But, during the night she was not Leah! For Yaakov had given Rochel [certain] signs and when Rochel saw that Leah was being brought to him she thought: “My sister may now be humiliated,” [whereupon] she readily transmitted those signs to her.","p":[{"q":"Why did Yaakov not notice at night that it was Leah?","o":["Rachel gave Leah the signs that Yaakov had given her","It was pitch dark and Yaakov did not hear her voice","Yaakov was drunk from the feast Lavan made"]}]},"29:27.1":{"e":"\"Sheva\" is in the construct form with \"zot\": the week of this one, meaning the seven days of Leah's wedding feast. It cannot mean an actual week, since then the shin would be vocalized with a patach, and also because \"shavua\" is masculine.","pe":"Complete the [marriage] week for this one. We will then give you the other also—in return for the work that you will do with me for another seven years.","re":"Complete the [marriage] week for this one. [The word שְבוּעַ] is in the construct state for it is vocalized with a sheva [שְׁ] [whereby it means] the seven days of this [woman], referring to the seven feast days [of marriage]. [Source:] Talmud Yerushalmi, Moed Katan. (It is impossible to say [that it refers to] an actual [calendar] week because, if so, the ש' should have been vocalized with a פַּתַּח (קָמַץ). Furthermore, שָׁבוּעַ is masculine, as is written. “[שִבְעָה] Seven weeks shall you count for yourself.” Therefore, שָׁבוּעַ can mean only a seven [day period], septaine in Old French.)","p":[{"q":"What does \"מלא שבע זאת\" mean?","o":["Complete the seven days of Leah's wedding feast","Complete another seven years of work for Leah","Complete another week of work shepherding the flock"]},{"q":"What are the proofs that it should not be explained here as 'this week'?","o":["The vowel under the shin shows the word is in the construct form, and \"shavua\" is masculine","The word is written without a vav, so it means seven years","Lavan always counted in years and not in days or weeks"]}]},"29:27.2":{"e":"\"Ve-nittenah\" is in the plural, like \"nerdah ve-nevalah\" and \"nisrefah,\" and it means \"and we will give\": we will give you.","pe":"Complete the [marriage] week for this one. We will then give you the other also—in return for the work that you will do with me for another seven years.","re":"We will give you. [Here it is in] the plural form [We will give] as in “Let us descend and jumble.” Or וְנִשְׂרְפָה —Let us burn. Here, too, it means we will give.","p":[{"q":"What does the word \"ונתנה\" mean in the verse?","o":["Plural: \"and we will give,\" that is, we will give to you","Feminine: and she will be given to you","Imperative: and give her to yourself"]}]},"29:27.3":{"e":"Lavan tells Yaakov that he will give him Rachel immediately after the seven days of Leah's feast, and Yaakov will work for her after he marries her.","pe":"Complete the [marriage] week for this one. We will then give you the other also—in return for the work that you will do with me for another seven years.","re":"The other also. Immediately after the seven days of the marriage feast, and you may work [for her] after her marriage [to you].","p":[{"q":"When did Yaakov receive Rachel according to Rashi?","o":["Immediately after the seven days of the feast, and he worked afterward","After he worked another seven years for her","On the same day he married Leah"]}]},"29:30.1":{"e":"The Torah equated the last seven years to the first: just as Yaakov worked the first ones faithfully, so too the last ones, even though Lavan had deceived him.","pe":"He [Yaakov] also consummated his marriage with Rochel. He loved Rochel more than Leah, and he worked with [Lavan] additionally, another seven years.","re":"Another seven years. [The Torah] compares the other [seven years] to the first [seven years] just as the first were with faithful [service] so were the latter [seven years] with faithful [service] even though [Lavan] dealt deceptively with him.","p":[{"q":"What do we learn from the word \"אחרות\"?","o":["That even in the last years Yaakov worked faithfully as in the first","That the last years were harder than the first","That Lavan changed the working conditions in the last years"]}]},"29:32.1":{"e":"Our Sages explained that Leah said, \"See the difference between my son and my father-in-law's son\": Eisav sold the birthright to Yaakov, whereas Reuven did not sell his birthright to Yosef and did not contest it, and even sought to take him out of the pit.","pe":"Leah conceived and gave birth to a son. She named him Reuvein, as she said, Adonoy has seen my affliction; for now my husband will love me.","re":"She named him Reuvein Our Sages explained [the word רְאוּבֵן]: She said: “See the difference between my son and the son of my father-in-law who [voluntarily] sold the birthright to Yaakov whereas this one [Reuven] did not sell it to Yoseif and did not protest to him. Not only did he not protest to him but attempted to extricate him from the pit.","p":[{"q":"According to our Sages, what did Leah hint with the name \"Reuven\"?","o":["See the difference between my son and Eisav, who sold the birthright","See that my son will be king over all his brothers","See a son born to me before my sister had one"]}]},"29:34.1":{"e":"The Matriarchs were prophetesses and knew that Yaakov would marry four wives and have twelve tribes. When Leah bore a third son, she said: I have taken my whole share of sons, and from now on he has no complaint against me.","pe":"She conceived again and gave birth to a son. She said, This time my husband will become attached to me, for I have born him three sons. He therefore named him Leivi.","re":"This time my husband will become attached. Since the Matriarchs were prophetesses and they knew that twelve tribes would emerge from Yaakov and that he would marry four wives, she, [therefore,] said, “From now on he will not find fault with me for I have assumed my full share of the children.”","p":[{"q":"Why did Leah say \"הפעם ילוה אישי\" specifically after the third son?","o":["Because she knew Yaakov would marry four wives, and three sons were her share","Because three sons is a presumption that she will keep bearing more","Because Rachel had not yet borne Yaakov any son"]}]},"29:34.2":{"e":"Every tribe about whom \"al ken\" is said in the naming multiplied greatly, except the tribe of Levi, whom the Ark consumed.","pe":"She conceived again and gave birth to a son. She said, This time my husband will become attached to me, for I have born him three sons. He therefore named him Leivi.","re":"Therefore. By whomever [which ever tribe] the term עַל כֵּן is said, [that tribe] had a large population with the exception of Leivi, because the Ark decimated them.","p":[{"q":"What does Rashi teach from the words \"על כן\" in the naming of Levi?","o":["A tribe about which \"על כן\" is said multiplies, except Levi, whom the Ark consumed","That Levi was the most numerous of all the tribes","That the tribe of Levi was chosen for the Temple service because of its name"]}]},"29:34.3":{"e":"For all the tribes it says \"va-tikra,\" but for Levi it says \"kara.\" According to the midrash, Hashem sent Gavriel, who brought Levi before Him, and Hashem called him this name and gave him twenty-four priestly gifts, since He 'accompanied' (livah) him with gifts.","pe":"She conceived again and gave birth to a son. She said, This time my husband will become attached to me, for I have born him three sons. He therefore named him Leivi.","re":"Named him Leivi. Concerning all of them [the sons] it is written: “And she called” whereas concerning this one it states, “He called.” There is a Midrashic explanation [to this] in Devarim Rabbah that God send [the angel] Gavriel and he brought him [Leivi] before Him and He called him by this name and gave him [the rights to] the twenty-four priestly gifts. And since he “accompanied” [לִוָּהוּ] him with the gifts he called him לֵוִי [accompanied].","p":[{"q":"What does Rashi teach from the fact that it says \"קרא שמו לוי\" and not \"ותקרא\"?","o":["Hashem called him by this name and gave him twenty-four priestly gifts","Yaakov named him, and not his mother Leah","The angel Gavriel chose the name without the parents' knowledge"]}]},"29:35.1":{"e":"Leah said: since I received more than my share, from now on I must thank Hashem.","pe":"She conceived again and gave birth to a son. She said, This time I will praise Adonoy. She therefore named him Yehudah. She then stopped giving birth.","re":"This time I will praise. “For I have taken more than my share consequently I ought to be thankful.”","p":[{"q":"Why did Leah say \"הפעם אודה\" specifically at Yehuda's birth?","o":["Because now she received more than her share, so she must give thanks","Because now Yaakov finally loved her more than Rachel","Because she knew this was the last son she would bear"]}]},"30:1.1":{"e":"Rachel envied Leah's good deeds. She said: had she not been more righteous than me, she would not have merited children.","pe":"Rochel saw that she was not bearing children to Yaakov. Rochel became jealous of her sister, and she said to Yaakov, Give me children; if not I am [considered] dead.","re":"Rochel became jealous of her sister. She was envious of her good deeds. She thought: “Were she not more righteous than I she would not merit bearing children.”","p":[{"q":"What did Rachel envy in Leah, according to Rashi?","o":["Her good deeds, in whose merit she had children","That Yaakov loved Leah more than her","Her beauty and her status as the older sister"]}]},"30:1.2":{"e":"Rachel hinted to Yaakov: did your father Yitzchak do this to your mother Rivkah? Surely he prayed for her.","pe":"Rochel saw that she was not bearing children to Yaakov. Rochel became jealous of her sister, and she said to Yaakov, Give me children; if not I am [considered] dead.","re":"Give me. [She implied:] “Did your father act this way to your mother? Did he not pray for her?”","p":[{"q":"According to Rashi, what did Rachel mean when she asked Yaakov for children?","o":["That Yaakov should pray for her as Yitzchak prayed for Rivkah","That Yaakov should give her his maidservant so she could be built up through her","That Yaakov should love her more than Leah"]}]},"30:1.3":{"e":"From Rachel's words we learn that one who has no children is considered as dead.","pe":"Rochel saw that she was not bearing children to Yaakov. Rochel became jealous of her sister, and she said to Yaakov, Give me children; if not I am [considered] dead.","re":"I am [considered] dead. From here [we learn] that one who has no children is considered as if dead.","p":[{"q":"What do we learn from Rachel's words \"מתה אנכי\"?","o":["That one who has no children is considered dead","That Rachel threatened to harm herself out of grief","That Rachel feared she would die in childbirth"]}]},"30:2.1":{"e":"Yaakov said to Rachel: am I in the place of Hashem? It is He who withheld the fruit of the womb from you.","pe":"Yaakov became very angry with Rochel, and he said, Am I in God’s place? [It is He] who has withheld from you the fruit of the womb.","re":"In [God’s] place. [הֲתַחַת meaning:] “Am I in His stead?”","p":[{"q":"What is the meaning of Yaakov's words \"התחת אלהים אנכי\"?","o":["Am I in the place of Hashem?","Am I under Hashem's rule?","Do I fear Hashem less than you do?"]}]},"30:2.2":{"e":"Rachel asked Yaakov to pray for her as his father Yitzchak did. Yaakov replied: I am not like my father; my father had no children and I have children; Hashem withheld children from you and not from me.","pe":"Yaakov became very angry with Rochel, and he said, Am I in God’s place? [It is He] who has withheld from you the fruit of the womb.","re":"Who has withheld from you. “You tell [me] to act as did my father. I am not [my situation is not] like my father. My father had no children [whereas,] I have children. It is from you that He has withheld [children], not from me.”","p":[{"q":"What did Yaakov mean to emphasize with the words \"אשר מנע ממך\"?","o":["That Hashem withheld children from her and not from him, so he is not like Yitzchak","That Hashem withheld children from both of them, and nothing can be done","That Hashem will withhold children from her forever so there is no point praying"]}]},"30:3.1":{"e":"Rachel said \"and she will bear on my knees,\" and as Targum Onkelos renders it: and I will raise them.","pe":"She said, Here is my handmaid, Bilhah, consummate a marriage with her. Let her give birth upon my knees, and I too will have a son through her.","re":"Upon my knees. As Onkelos translates: “And I will rear them.”","p":[{"q":"What does \"ותלד על ברכי\" mean according to Rashi and Targum Onkelos?","o":["And I will raise the children","Bilhah will give birth while sitting on Rachel's knees","Rachel will nurse the children herself"]}]},"30:3.2":{"e":"Rachel told Yaakov that Avraham, although he had children from Hagar, prayed for Sarah. Yaakov answered that Sarah brought her rival into her house, and Rachel said: if that is what is holding things up, here is my maidservant Bilhah.","pe":"She said, Here is my handmaid, Bilhah, consummate a marriage with her. Let her give birth upon my knees, and I too will have a son through her.","re":"And I too will have a son. What is the intent of גַם —also? She said to him, “Your grandfather Avraham, had children from Hagar, [yet] he ‘girded his loins’ [he interceded] on behalf of Sarah. [He prayed for her.]” He answered her, “My grandmother [Sarah] brought a rival-wife into her house.” She [thereupon] responded, “If that is what prevents [my having children] ‘Here is my handmaid …’”","p":[{"q":"What does the word \"גם\" mean in Rachel's words \"ואבנה גם אנכי\"?","o":["I too, like Sarah, who brought her rival into her house","I too, like Leah, who already has children","I too, like Bilhah, who will bear children for Yaakov"]}]},"30:3.3":{"e":"Rachel said: I too will merit children through my maidservant, like Sarah.","pe":"She said, Here is my handmaid, Bilhah, consummate a marriage with her. Let her give birth upon my knees, and I too will have a son through her.","re":"And I too will have a son through her. As did Sarah.","p":[{"q":"Whom does Rachel mean by the words \"גם אנכי\"?","o":["Sarah, who was built up through her maidservant","Leah, who had already borne four sons","Rivkah, who was remembered after many years"]}]},"30:6.1":{"e":"Hashem judged Rachel twice: first He found her guilty, and in the end He vindicated her.","pe":"Rochel said, Elohim has judged me. He has also heard my voice, and has given me a son. She therefore named him Don.","re":"Elohim has judged me. He has judged me and found me guilty. [He has judged me] and found me innocent.","p":[{"q":"What does \"דנני אלהים\" mean according to Rashi?","o":["Hashem judged me: first He found me guilty and afterward vindicated me","Hashem found me guilty, and has not yet had mercy on me","Hashem vindicated me immediately and did not find me guilty at all"]}]},"30:8.1":{"e":"Menachem ben Saruk explains \"naftulei\" as from \"tzemid pattil,\" a joining: I joined with my sister through joinings from Hashem to merit children. Rashi explains it as from \"akash u-petaltol\" (crooked and twisted): I was stubborn and pleaded much with Hashem to be equal to my sister.","pe":"Rochel said, With Elohim’s bonds, I have been joined to my sister, and I have also prevailed. She [therefore] called him Naftali.","re":"With Elohim’s bonds. Menachem ben Saruk explains [נַפְתּוּלֵי] in the Machberes [as having the same root as] צָמִיד פָּתִיל [a covering that פָּתִיל —tied]. [Here meaning:] “With bindings from God have I been joined with my sister to have merited having children.” I [Rashi] explain it [as having a common root with] עִקֵּשׁ וּפְתַלְתּוֹל —perverse and crooked. [Here meaning:] “I have stubbornly pleaded many torturous pleas to God that I may be the equal of my sister.”","p":[{"q":"How does Rashi himself explain 'נפתולי אלהים נפתלתי'?","o":["I was stubborn and pleaded much before Hashem to be equal to my sister","I joined with my sister through joinings from Hashem to merit children","I wrestled with my sister and defeated her with Hashem's help"]},{"q":"According to Menachem ben Saruk, from what root does the word 'נפתולי' come?","o":["From 'צמיד פתיל,' meaning a joining","From 'עקש ופתלתל,' meaning crookedness","From 'פתאום,' meaning something sudden"]}]},"30:8.2":{"e":"\"Yachalti\" means that Hashem agreed to my request. Onkelos explains \"naftulei\" as prayer: I prayed prayers beloved before Hashem, was accepted, and was answered like my sister.","pe":"Rochel said, With Elohim’s bonds, I have been joined to my sister, and I have also prevailed. She [therefore] called him Naftali.","re":"And I have also prevailed. [Meaning:] “He has agreed to accept [my pleas].” Onkelos explains [נַפְתּוּלֵי] from the term תְּפִלָה —prayer “With Elohim’s bonds, I have been joined,” [i.e., “I prayed] many prayers [to God] that were pleasing to Him. I was accepted and my [prayers] answered like my sister.”","p":[{"q":"What does \"יכלתי\" mean according to Rashi?","o":["Hashem agreed to my request","I defeated my sister in the struggle between us","I managed to give birth by my own power"]},{"q":"How did Onkelos explain \"נפתולי אלהים נפתלתי\"?","o":["As prayer: I prayed prayers beloved before Hashem","As struggle: I struggled with my sister with all my strength","As a cord: I was tied to my sister with a strong bond"]}]},"30:8.3":{"e":"\"Naftalti\" means my prayer was accepted. There are also many midrashim that expound the word as a notarikon.","pe":"Rochel said, With Elohim’s bonds, I have been joined to my sister, and I have also prevailed. She [therefore] called him Naftali.","re":"I have been joined. [Meaning:] “My prayer was accepted.” There are [also] many Midrashic interpretations utilizing Notarikon [to explain נִפְתַּלְתִי].","p":[{"q":"According to the simple meaning, what does the word \"נפתלתי\" mean?","o":["My prayer was accepted","I separated from my sister and went my way","I prayed and was not yet answered"]}]},"30:10.1":{"e":"For Zilpah it does not say \"she conceived,\" because she was the youngest of them all and her pregnancy was not noticeable. Lavan gave her to Leah in order to deceive Yaakov, since the custom was to give the older maidservant to the older daughter, so that Yaakov would not realize they were bringing him Leah.","pe":"Zilpah, Leah’s handmaid, bore Yaakov a son.","re":"Zilpah bore. Regarding all the other [wives] it is mentioned that [they were] pregnant except in regard to Zilpah, because she was the youngest of all and a child in years and her pregnancy was not noticable. It was in order to deceive Yaakov that Lavan gave her to Leah so that he [Yaakov] would be unaware that they were [really] bringing him Leah—for this was their custom—to give the older handmaid to the older [sister] and the younger handmaid to the younger [sister].","p":[{"q":"Why is pregnancy not mentioned for Zilpah?","o":["Because she was the youngest of them all, and her pregnancy was not noticeable","Because she gave birth miraculously without pregnancy","Because she was not considered Yaakov's wife"]},{"q":"Why did Lavan give the young Zilpah specifically to Leah?","o":["To deceive Yaakov so that he would not realize they were bringing him Leah","Because Leah asked for a young maidservant to serve her","Because Zilpah was the dearest to him among the maidservants"]}]},"30:11.1":{"e":"\"Ba gad\" means good fortune has come. In the midrash: he was born circumcised, from \"gidu ilana\" (they cut down the tree). And it is written as one word, \"bagad,\" from the sense of betrayal: you betrayed me when you went to my maidservant.","pe":"Leah said, Unexpected success has come, and she named him Gad.","re":"Unexpected success has come. [Meaning:] good luck has come, as in, “Luck to my luck and tire not.” Another similarity to this is, “Who prepare a table for the fortunate.” The Midrashic interpretation is that he was born circumcised as in, “Cut down the tree.” I do not know why it [בָּגָד] is written as one word. Another explanation as to why it is read as one word בָּגָד —[to imply] faithless— traitorous, as if to say, “You were faithless to me when you married my handmaid, as a man who is faithless to the wife of his youth.”","p":[{"q":"What does \"גד\" mean according to the first explanation in Rashi?","o":["Good fortune has come","A troop of people has come","A son born circumcised has come"]},{"q":"According to the last explanation, why is \"בגד\" written as one word?","o":["From the sense of betrayal: you betrayed me when you went to my maidservant","Because the son was born wrapped in a garment","Because Leah sewed him a special garment"]}]},"30:14.1":{"e":"The Torah mentions the harvest time to teach the praise of the tribes: although it was harvest time, Reuven did not take others' wheat or barley, but only mandrakes, which are ownerless and which no one is particular about.","pe":"Reuvein went in the days of the wheat harvest, and found jasmine flowers in the field. He brought them to Leah, his mother. Rochel said to Leah, Please give me some of your son’s jasmine flowers.","re":"In the days of the wheat harvest. [This is] to relate the praise of the Tribes. It was the time of harvest [when much grain is available], yet he did not stretch out his hand to rob by bringing wheat and barley, but only ownerless things that no person minds [their being taken].","p":[{"q":"Why does the Torah mention that Reuven went \"בימי קציר חטים\"?","o":["To show that he did not steal grain but brought only something ownerless","To explain that mandrakes grow only in this season","To teach that Reuven worked in the field with the harvesters"]}]},"30:14.2":{"e":"Mandrakes are a plant, \"sigli,\" and in Arabic it is called yasmin.","pe":"Reuvein went in the days of the wheat harvest, and found jasmine flowers in the field. He brought them to Leah, his mother. Rochel said to Leah, Please give me some of your son’s jasmine flowers.","re":"Jasmine flowers. Mandrakes. It is a plant which in Arabic is called jasmin.","p":[{"q":"What are the \"דודאים\" that Reuven found in the field?","o":["A plant called sigli, and in Arabic yasmin","Fruits of a fig tree growing in the field","Ears of wheat left after the harvest"]}]},"30:15.1":{"e":"Leah asks in astonishment: is it not enough that you took my husband, and will you also do this, to take my son's mandrakes too? Onkelos translates \"u-lemisav,\" an expression of taking.","pe":"She [Leah] said to her, Isn’t it enough that you took my husband? Would you also take my son’s jasmine flowers? Rochel said, Therefore, he shall be with you tonight in exchange for your son’s jasmine flowers.","re":"Would you also take my son’s jasmine flowers? An incredulous question. [Is the taking away of my husband insignificant] and to additionally do the following—to take also my son’s jasmines? Onkelos translates it וּלְמֵיסַב —to take.","p":[{"q":"How should Leah's words \"ולקחת גם\" about the mandrakes be understood?","o":["As a question of astonishment: will you take my son's mandrakes too?","As a command: take my son's mandrakes too","As a description: and you already took my son's mandrakes from me"]}]},"30:15.2":{"e":"Rachel said: tonight Yaakov was supposed to be with me, and I give him to you in exchange for the mandrakes. And because she made light of lying with the tzaddik, she did not merit to be buried with him.","pe":"She [Leah] said to her, Isn’t it enough that you took my husband? Would you also take my son’s jasmine flowers? Rochel said, Therefore, he shall be with you tonight in exchange for your son’s jasmine flowers.","re":"Therefore, he shall be with you tonight. “[Actually,] he was to be with me this night, but, I give it to you in return for your son’s jasmines.” And because she made light of being with such a righteous person she [eventually] did not merit being buried with him.","p":[{"q":"Why did Rachel not merit to be buried with Yaakov, according to Rashi?","o":["Because she made light of lying with the tzaddik when she sold it for mandrakes","Because she stole the teraphim from her father's house","Because she envied her sister and demanded children from Yaakov"]}]},"30:16.1":{"e":"Leah told Yaakov that she had already paid Rachel her price, the mandrakes, in exchange for this night.","pe":"Yaakov came from the field in the evening, and Leah went out to meet him. She said, You will come to me, for I have hired you with my son’s jasmine flowers, and he was with her at night.","re":"I have hired you. [Meaning:] I have given Rochel her payment.","p":[{"q":"To whom did Leah pay the price according to Rashi?","o":["To Rachel, who received the mandrakes in exchange for the night","To Yaakov, who received the mandrakes from her","To Reuven, who brought the mandrakes from the field"]}]},"30:16.2":{"e":"The word \"hu\" hints at Hashem: Hashem helped Yaakov that night, so that Yissachar would be born from it.","pe":"Yaakov came from the field in the evening, and Leah went out to meet him. She said, You will come to me, for I have hired you with my son’s jasmine flowers, and he was with her at night.","re":"At night. God helped him [הוּא —refers to God] that Yissachar should be born from this.","p":[{"q":"What does the word \"הוא\" hint at in the words \"בלילה הוא\"?","o":["That Hashem helped Yaakov, so that Yissachar would be born from there","That it was Rachel's night, which she sold to Leah","That on that night only he lay with her and no more"]}]},"30:17.1":{"e":"Hashem heard Leah's desire, for she longed and strove to increase the number of tribes.","pe":"Elohim perceived Leah’s [wish]. She conceived and bore [her] fifth son to Yaakov.","re":"Elohim perceived Leah’s [wish]. Because she desired and sought to increase the number of tribes.","p":[{"q":"What did Hashem hear from Leah?","o":["That she longed and strove to increase the number of tribes","That she prayed Yaakov would love her more than Rachel","That she regretted taking her son's mandrakes"]}]},"30:20.1":{"e":"\"Zeved tov\" means, as Targum Onkelos renders it, a good portion.","pe":"Leah said, Elohim has given a goodly portion. Now my husband will make his [main] home with me, for I have borne him six sons. She named him Zevulun.","re":"A goodly portion. As Onkelos translates it: [A good portion].","p":[{"q":"What does \"זבד טוב\" mean according to Rashi?","o":["As Targum Onkelos: a good portion","A good house and permanent dwelling","A gift Leah received from her father"]}]},"30:20.2":{"e":"\"Yizbeleni\" is from \"beit zevul,\" a dwelling place. Leah said that from now on Yaakov's main residence would be with her, since she has sons equal to all his other wives.","pe":"Leah said, Elohim has given a goodly portion. Now my husband will make his [main] home with me, for I have borne him six sons. She named him Zevulun.","re":"Will make his main home with me. Having a similar meaning as בֵּית זְבוּל —a dwelling, herberjerie in Old French —a dwelling. [She thought:] From now on his main dwelling place will not be other than with me, for I have as many sons as all of his wives together.","p":[{"q":"What does \"יזבלני אישי\" mean according to Rashi?","o":["Yaakov's main residence will be with me","My husband will give me a good gift","My husband will love me more than Rachel"]}]},"30:21.1":{"e":"Leah judged herself: if this fetus is male, my sister Rachel will not be even like one of the maidservants. She prayed over it, and it was turned into a female, so she called her Dinah.","pe":"Afterwards she gave birth to a daughter, and named her Deenah.","re":"Deenah. The Sages explained that Leah assumed to judge [דָנָה] herself, [thinking:] “If this [child that I carry] is a male my sister Rochel would not even be equal to one of the handmaids.” Whereupon she prayed over it and it was transformed into a female.","p":[{"q":"Why was the daughter called \"Dinah\"?","o":["Because Leah judged herself and prayed, and the fetus was turned into a female","Because Hashem judged Leah and gave her a daughter instead of a son","Because Leah wanted her daughter to be a wise judge"]}]},"30:22.1":{"e":"Hashem remembered for Rachel that she gave her signs to her sister, and that she was distressed lest Yaakov divorce her because she had no children and she would fall to Eisav's lot. Eisav too thought this when he heard she had no children.","pe":"Elohim remembered Rochel and opened her womb.","re":"Elohim remembered Rochel. He remembered that she gave her signs to her sister and that she was concerned lest she fall to Eisov’s lot, should Yaakov divorce her because she had no children. This also entered the mind of the wicked Eisov when he heard that she had no children. This is what the poet alluded to “When the Red One [Eisov] saw that she did not give birth he desired to take her to him and she was petrified.”","p":[{"q":"What merit did Hashem remember for Rachel when He granted her children?","o":["That she gave her signs to her sister Leah","That she prayed every day for children","That she gave her maidservant Bilhah to Yaakov"]},{"q":"What did Rachel fear for as long as she had no children?","o":["That Yaakov would divorce her and she would fall to Eisav's lot","That Leah would be the only mistress of the house","That Lavan would not let Yaakov return to his land"]}]},"30:23.1":{"e":"\"Asaf\" means He brought the disgrace into a place where it would not be seen, that is, hid it. So too \"and it shall not be gathered into the house\" and \"your moon shall not be gathered\": it shall not be hidden.","pe":"She conceived and gave birth to a son. She said, Elohim has removed my shame.","re":"Has removed. [Meaning:] He has brought it into a place where it will not be seen. Similar to: “He brought in our shame,” [or] “It will not have been brought into the house,” [or] “Withdrew their light,” [or] “Your moon will not withdraw,” [meaning] it will not be hidden.","p":[{"q":"What does 'אסף' mean in the verse according to Rashi?","o":["He brought my disgrace into a place where it would not be seen","He gathered all the disgraces I suffered","He added honor for me in place of the disgrace"]}]},"30:23.2":{"e":"Rachel's disgrace was that she was barren, and people said she would fall to the lot of the wicked Eisav. According to the aggadah: a woman who has no son has no one on whom to blame her mishaps, and once she has a son she blames him.","pe":"She conceived and gave birth to a son. She said, Elohim has removed my shame.","re":"My shame. For I had been put to shame having been barren, and that it was said about me that I would fall to the lot of the wicked Eisov. The Aggadah [explains it thus.] As long as a woman has no child she has no one to blame for her faults. Once she has a child, she blames it on him. [E.g.,] “Who broke this vessel? Your child!” “Who ate these figs? Your child!”","p":[{"q":"What was Rachel's disgrace according to the first explanation in Rashi?","o":["That she was barren and people said she would fall to Eisav's lot","That her sister Leah married Yaakov before her","That Yaakov was angry at her when she asked him for children"]},{"q":"According to the aggadah, how does a son remove his mother's disgrace?","o":["She has someone to blame for the mishaps in the house","The son defends her from the neighbors' words","The son gives her honor and inheritance in his father's house"]}]},"30:24.1":{"e":"Rachel knew through prophecy that Yaakov would establish only twelve tribes. So she prayed that the last tribe still to be born would be from her, and she asked for only one more son.","pe":"She named him Yoseif, saying, May Adonoy add to me another son.","re":"May Adonoy add to me another son. She knew prophetically that Yaakov was destined to establish only twelve tribes, so she thought, “May it be His will that the one that he is yet destined to establish should come from me.” She, therefore, prayed for only one more son.","p":[{"q":"Why did Rachel pray for only one son?","o":["She knew Yaakov would establish only twelve tribes, and wanted the last to be from her","She knew by prophecy that she would die in childbirth and not merit more sons","She feared many sons would arouse jealousy between her and Leah"]}]},"30:25.1":{"e":"Yosef is Eisav's adversary, as it says, \"the house of Yaakov will be a fire, the house of Yosef a flame, and the house of Eisav stubble.\" A fire without a flame does not reach far, so only when Yosef was born did Yaakov trust in Hashem and want to return.","pe":"When Rochel had given birth to Yoseif, Yaakov said to Lavan, Send me on my way, and I will go to my own place and to my homeland.","re":"When Rochel had given birth to Yoseif. Now that the adversary of Eisov was born. As it is said, “The House of Yaakov will be a fire, and the House of Yoseif, a flame, and the House of Eisov, straw.” Fire [Yaakov] without a flame [Yoseif] has no effect at a distance. Once Yoseif was born, Yaakov put his trust in God and desired to return.","p":[{"q":"Why did Yaakov ask to return to his land specifically after Yosef was born?","o":["Because Eisav's adversary was born, and he trusted Hashem that he would prevail over him","Because Rachel asked to return to Yitzchak's house","Because Lavan expelled him from his house after the birth"]}]},"30:26.1":{"e":"Yaakov asked Lavan to give him his wives and children, because he did not want to leave except with permission.","pe":"Give me [permission to take] my wives and my children, for whom I worked for you, and I will go; for you know my work that I did for you.","re":"Give me [permission to take] my wives, etc. [I.e.,] I do not wish to leave without permission.","p":[{"q":"Why did Yaakov ask Lavan \"תנה את נשי,\" when they were already his wives?","o":["Because he did not want to leave except with Lavan's permission","Because Lavan had not yet given them to him as wives","Because he wanted Lavan to pay him his wages as well"]}]},"30:27.1":{"e":"Lavan was a diviner, and he tested through his divination that blessing came to him because of Yaakov. When Yaakov came, Lavan had no sons, since he sent his daughter Rachel with the flock; afterward sons were born to him.","pe":"Lavan said to him, If I have found favor in your eyes, I have divined that Adonoy has blessed me because of you.","re":"I have divined. He was a diviner: “I ascertained through my divining that through you a blessing came to me. When you came here I had no sons,” as it is said: “Behold, Rochel, his daughter was coming with the sheep.” Is it possible that he had sons and would send his daughter among the shepherds? [But,] now he had sons, as it is said: “He heard the words of Lavan’s sons.","p":[{"q":"From where does Rashi learn that Lavan had no sons when Yaakov came?","o":["From the fact that his daughter Rachel shepherded the flock","From the fact that Lavan asked Yaakov to work for him","From the fact that Lavan came alone to meet Yaakov"]}]},"30:28.1":{"e":"\"Nokvah\" means, as Targum renders it, \"parosh agrach\": specify and state explicitly what your wage is.","pe":"He said, Set your wage for me, and I will give it.","re":"Set. As Onkelos translates it, “Specify your wages.”","p":[{"q":"What does \"נקבה שכרך\" mean?","o":["Specify and state explicitly what your wage is","Take your wage from the females of the flock","Reduce your wage, because you worked little"]}]},"30:29.1":{"e":"Yaakov reminds Lavan how little his livestock was when it first came into his hands.","pe":"He [Yaakov] said to him, You know how I worked for you, and how your livestock were with me.","re":"And how your livestock were with me. [Meaning:] the meager amount of your livestock—when they first came into my hands—how many were there?","p":[{"q":"What did Yaakov want to remind Lavan of with the words \"מקנך אתי\"?","o":["How little your livestock was when it first came to me","How well I guarded your livestock from animals","That your livestock really belongs to me too"]}]},"30:30.1":{"e":"\"Le-ragli\" means with my feet, that is, in the merit of my coming to you the blessing came to you, like \"the people who are at your feet,\" those who come with you.","pe":"For the little you had before I came here has increased and has become a multitude. Adonoy has blessed you with my coming. Now when will I also do something for my own house?","re":"With my coming. [Meaning:] with my arrival. [I.e.,] because of my arrival, has blessing come to you, as in “The people that have come with you.” [or] “The people that אֲשֶׁר בְּרַגְלָי” [meaning:] that have come with me.","p":[{"q":"What does 'ויברך יהוה אתך לרגלי' mean according to Rashi?","o":["In the merit of my coming to you the blessing came to you","Hashem blessed you everywhere I went","Hashem blessed you as payment for my hard work in the field"]}]},"30:30.2":{"e":"\"Le-veiti\" means for the needs of my household. Until now only Yaakov's sons were providing for his needs, and he too must work with them and help them, and that is the meaning of \"gam.\"","pe":"For the little you had before I came here has increased and has become a multitude. Adonoy has blessed you with my coming. Now when will I also do something for my own house?","re":"I, also, for my own house. [לְבֵיתִי means] for the needs of my household. [I.e.,] as of now only my sons provide my needs and I ought to do so along with them, to give them support. This [idea] is [conveyed by the word] גַם —also.","p":[{"q":"What does the word \"גם\" teach in the phrase \"גם אנכי לביתי\"?","o":["That until now only his sons provided, and he must join and help them","That Lavan too must care for his household like Yaakov","That Yaakov wants to become wealthy as Lavan did"]}]},"30:32.1":{"e":"\"Nakod\" means speckled with small spots like dots, \"pionture\" in Old French.","pe":"I will go through all your flocks this day. I will remove from them every lamb that is speckled, or spotted, and every dark one among the sheep, and every goat that is spotted and speckled. That [kind] will be my wage.","re":"Speckled. [Meaning] speckled with small dot like flecks, pointure in Old French.","p":[{"q":"What does \"נקד\" mean?","o":["Speckled with small spots like dots","Marked with white stripes along its length","Dark brown all over its body"]}]},"30:32.2":{"e":"\"Talu\" is from the word \"te'layim\" (patches), that is, wide spots.","pe":"I will go through all your flocks this day. I will remove from them every lamb that is speckled, or spotted, and every dark one among the sheep, and every goat that is spotted and speckled. That [kind] will be my wage.","re":"Spotted. Having the same root as טְלָאִים —patches, wide spots.","p":[{"q":"What does \"וטלוא\" mean?","o":["Having wide spots, from the word \"te'layim\"","Having small, fine dots","Having white stripes on its legs"]}]},"30:32.3":{"e":"\"Chum\" means a dark color resembling red, and so in the language of the Mishnah, \"shechamtit ve-nimtze'ah levanah,\" regarding grain.","pe":"I will go through all your flocks this day. I will remove from them every lamb that is speckled, or spotted, and every dark one among the sheep, and every goat that is spotted and speckled. That [kind] will be my wage.","re":"Dark [Meaning:] dark brown, similar to red. Ros in Old French. In the language of the Mishnah. “[It was sold as] dark brown and was found to be white,” concerning [the sale of] grain.","p":[{"q":"What does the word \"חום\" mean for sheep according to Rashi?","o":["A dark color, resembling red","A bright white color","Sheep that have dots"]}]},"30:32.4":{"e":"Yaakov said that only the speckled and spotted animals born from now on would be his wages. The ones that already exist should be set apart and handed to Lavan's sons, so that Lavan could not claim they had been there from the start, nor claim that the spotted males caused the females to bear young like themselves.","pe":"I will go through all your flocks this day. I will remove from them every lamb that is speckled, or spotted, and every dark one among the sheep, and every goat that is spotted and speckled. That [kind] will be my wage.","re":"That [kind] will be my wage. “Those that will be born from now on speckled and spotted among the goats and dark brown among the sheep will belong to me. Those [with these characteristics] that are now there separate from the rest and put them in the safekeeping of your sons so that you may not say to me abo
