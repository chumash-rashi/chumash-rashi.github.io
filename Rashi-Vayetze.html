ָ וּלְמוֹלַדְתֶּךָ וְאֶהְיֶה עִמָּךְ׃", "rashi_he": "שוב אל ארץ אבותיך. וְשָׁם אהיה עמך, אֲבָל בְּעוֹדְךָ מְחֻבָּר לַטָּמֵא אִי אֶפְשָׁר לְהַשְׁרוֹת שְׁכִינָתִי עָלֶיךָ (בראשית רבה):", "rashi_en": "ה' אמר ליעקב לשוב לארץ אבותיו, ושם יהיה עמו. כל עוד הוא מחובר ללבן הטמא, אי אפשר שהשכינה תשרה עליו.", "note": "", "points": [{"q": "מַדּוּעַ \"וְאֶהְיֶה עִמָּךְ\" תָּלוּי בְּשִׁיבָתוֹ שֶׁל יַעֲקֹב לָאָרֶץ?", "options": ["כִּי כָּל עוֹד הוּא מְחוּבָּר לַטָּמֵא, הַשְּׁכִינָה לֹא תִּשְׁרֶה עָלָיו", "כִּי מִחוּץ לָאָרֶץ אֵין הַקָּבָּ\"ה שׁוֹמֵר עַל הָאָדָם", "כִּי בְּחָרָן הָיָה עָלָיו לַעֲבוֹד בְּלִי עֶזְרָה מִלְּמַעְלָה"], "kasha": "מדוע הבטחת \"ואהיה עמך\" נאמרת דווקא יחד עם הציווי לשוב?", "answer": "ושם אהיה עמך, אבל בעודך מחובר לטמא אי אפשר להשרות שכינתי עליך.", "kp": ["אבל בעודך מחבר לטמא", "אי אפשר להשרות שכינתי עליך"]}]}, {"id": "31:4.1", "ch": 31, "v": 4, "n": 1, "dh": "ויקרא לרחל וללאה", "pasuk_html": "וַיִּשְׁלַ֣ח יַעֲקֹ֔ב <mark>וַיִּקְרָ֖א לְרָחֵ֣ל וּלְלֵאָ֑ה</mark> הַשָּׂדֶ֖ה אֶל־צֹאנֽוֹ׃", "pasuk_en": "וַיִּשְׁלַח יַעֲקֹב וַיִּקְרָא לְרָחֵל וּלְלֵאָה הַשָּׂדֶה אֶל־צֹאנוֹ׃", "rashi_he": "ויקרא לרחל וללאה. לְרָחֵל תְּחִלָּה וְאַחַר כָּךְ לְלֵאָה, שֶׁהִיא הָיְתָה עֲקֶרֶת הַבַּיִת שֶׁבִּשְׁבִילָהּ נִזְדַּוֵּג יַעֲקֹב עִם לָבָן, וְאַף בָּנֶיהָ שֶׁל לֵאָה מוֹדִים בַּדָּבָר, שֶׁהֲרֵי בֹּעַז וּבֵית דִּינוֹ מִשֵּׁבֶט יְהוּדָה אוֹמְרִים כְּרָחֵל וּכְלֵאָה אֲשֶׁר בָּנוּ שְׁתֵּיהֶם וְגוֹ' – הִקְדִּימוּ רָחֵל לְלֵאָה:", "rashi_en": "הכתוב הקדים את רחל ללאה, כי רחל הייתה עקרת הבית – בשבילה התחתן יעקב עם משפחת לבן. אף צאצאי לאה מודים בכך: בועז ובית דינו משבט יהודה אמרו \"כרחל וכלאה\", והקדימו את רחל.", "note": "", "points": [{"q": "מַדּוּעַ הִקְדִּים הַכָּתוּב אֶת רָחֵל לְלֵאָה?", "options": ["רָחֵל הָיְיתָה עִקֶּרֶת הַבַּיִת, שֶׁבִּשְׁבִילָהּ נִזְדַּוֵּוג יַעֲקֹב עִם לָבָן", "רָחֵל הָיְיתָה הַבְּכוֹרָה מִבֵּין שְׁתֵּי הָאֲחָיוֹת", "רָחֵל הָיְיתָה קְרוֹבָה יוֹתֵר לַמָּקוֹם שֶׁבּוֹ עָמַד יַעֲקֹב"], "kasha": "לאה הייתה הגדולה, ומדוע נקראה רחל לפניה?", "answer": "רחל הייתה עקרת הבית, שבשבילה נזדווג יעקב עם לבן.", "kp": ["שהיא היתה עקרת הבית", "שבשבילה נזדוג יעקב עם לבן"]}, {"q": "מָה הָרְאָיָה שֶׁגַּם צֶאֱצָאֵי לֵאָה מוֹדִים שֶׁרָחֵל הִיא הָעִיקָּר?", "options": ["בּוֹעַז וּבֵית דִּינוֹ מִשֵּׁבֶט יְהוּדָה אָמְרוּ \"כְּרָחֵל וּכְלֵאָה\"", "לֵאָה עַצְמָהּ קָרְאָה לְרָחֵל עֲקֶרֶת הַבַּיִת", "דָּוִד הַמֶּלֶךְ הִקְדִּים אֶת רָחֵל בְּסֵפֶר תְּהִלִּים"], "kasha": "יש לחזק את הטענה שרחל היא עקרת הבית גם בעיני בני לאה.", "answer": "בועז ובית דינו, שהיו משבט יהודה, אמרו \"כרחל וכלאה אשר בנו שתיהם\" – הקדימו רחל ללאה.", "kp": ["בעז ובית דינו משבט יהודה", "אומרים כרחל וכלאה"]}]}, {"id": "31:7.1", "ch": 31, "v": 7, "n": 1, "dh": "עשרת מנים", "pasuk_html": "וַאֲבִיכֶן֙ הֵ֣תֶל בִּ֔י וְהֶחֱלִ֥ף אֶת־מַשְׂכֻּרְתִּ֖י <mark>עֲשֶׂ֣רֶת מֹנִ֑ים</mark> וְלֹֽא־נְתָנ֣וֹ אֱלֹהִ֔ים לְהָרַ֖ע עִמָּדִֽי׃", "pasuk_en": "וַאֲבִיכֶן הֵתֶל בִּי וְהֶחֱלִף אֶת־מַשְׂכֻּרְתִּי עֲשֶׂרֶת מֹנִים וְלֹא־נְתָנוֹ אֱלֹהִים לְהָרַע עִמָּדִי׃", "rashi_he": "עשרת מנים. אֵין מוֹנִים פָּחוֹת מֵעֲשָׂרָה:", "rashi_en": "\"מונה\" אינו פחות מעשרה, ולכן \"עשרת מנים\" הם עשר פעמים עשרה - כלומר לבן שינה את שכרו של יעקב פעמים רבות מאוד.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"עֲשֶׂרֶת מֹנִים\" לְפִי רַשִׁ\"י?", "options": ["עֲשָׂרָה \"מוֹנִים\", שֶׁכָּל אֶחָד מֵהֶם לְפָחוֹת עֲשָׂרָה", "עֶשֶׂר פְּעָמִים בְּדִיּוּק, לֹא יוֹתֵר", "עֲשָׂרָה סוּגִים שֶׁל צֹאן שֶׁהֶחֱלִיף"], "kasha": "מדוע נאמר \"מנים\" ולא \"פעמים\"?", "answer": "אין מונים פחות מעשרה, כלומר כל \"מונה\" הוא לפחות עשר פעמים.", "kp": ["אין מונים פחות מעשרה"]}]}, {"id": "31:7.2", "ch": 31, "v": 7, "n": 2, "dh": "מנים", "pasuk_html": "וַאֲבִיכֶן֙ הֵ֣תֶל בִּ֔י וְהֶחֱלִ֥ף אֶת־מַשְׂכֻּרְתִּ֖י עֲשֶׂ֣רֶת <mark>מֹנִ֑ים</mark> וְלֹֽא־נְתָנ֣וֹ אֱלֹהִ֔ים לְהָרַ֖ע עִמָּדִֽי׃", "pasuk_en": "וַאֲבִיכֶן הֵתֶל בִּי וְהֶחֱלִף אֶת־מַשְׂכֻּרְתִּי עֲשֶׂרֶת מֹנִים וְלֹא־נְתָנוֹ אֱלֹהִים לְהָרַע עִמָּדִי׃", "rashi_he": "מנים. לְשׁוֹן סְכוּם, כְּלַל הַחֶשְׁבּוֹן וְהֵן עֲשִׂירִיּוֹת; לָמַדְנוּ שֶׁהֶחֱלִיף תְּנָאוֹ ק' פְּעָמִים:", "rashi_en": "״מנים״ פירושו סכום של עשרות, ולכן ״עשרת מנים״ הם מאה. למדנו שלבן החליף את תנאו מאה פעמים.", "note": "", "points": [{"q": "כַּמָּה פְּעָמִים הֶחֱלִיף לָבָן אֶת תְּנָאוֹ לְפִי רַשִׁ״י?", "options": ["מֵאָה פְּעָמִים", "עֶשֶׂר פְּעָמִים", "עֶשְׂרִים פְּעָמִים"], "kasha": "מה פירוש ״מנים״, ומה החשבון של ״עשרת מנים״?", "answer": "״מנים״ לשון סכום, והן עשיריות; למדנו שהחליף תנאו ק׳ פעמים.", "kp": ["שהחליף תנאו ק' פעמים"]}]}, {"id": "31:10.1", "ch": 31, "v": 10, "n": 1, "dh": "והנה העתדים", "pasuk_html": "וַיְהִ֗י בְּעֵת֙ יַחֵ֣ם הַצֹּ֔אן וָאֶשָּׂ֥א עֵינַ֛י וָאֵ֖רֶא בַּחֲל֑וֹם <mark>וְהִנֵּ֤ה הָֽעַתֻּדִים֙</mark> הָעֹלִ֣ים עַל־הַצֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּבְרֻדִּֽים׃", "pasuk_en": "וַיְהִי בְּעֵת יַחֵם הַצֹּאן וָאֶשָּׂא עֵינַי וָאֵרֶא בַּחֲלוֹם וְהִנֵּה הָעַתֻּדִים הָעֹלִים עַל־הַצֹּאן עֲקֻדִּים נְקֻדִּים וּבְרֻדִּים׃", "rashi_he": "והנה העתדים. אַעַ\"פִּ שֶׁהִבְדִּילָם לָבָן כֻּלָּם שֶׁלֹּא יִתְעַבְּרוּ הַצֹּאן דֻּגְמָתָן, הָיוּ הַמַּלְאָכִים מְבִיאִין אוֹתָן מֵעֵדֶר הַמָּסוּר בְּיַד בְּנֵי לָבָן לָעֵדֶר שֶׁבְּיַד יַעֲקֹב (בראשית רבה):", "rashi_en": "אף שלבן הפריד את כל הזכרים המנומרים כדי שהצאן לא תלד כמותם, המלאכים היו מביאים אותם מהעדר שאצל בני לבן אל העדר של יעקב.", "note": "", "points": [{"q": "אֵיךְ עָלוּ עַתּוּדִים עֲקוּדִּים עַל צֹאן יַעֲקֹב, אִם לָבָן הִפְרִיד אוֹתָם?", "options": ["הַמַּלְאָכִים הֵבִיאוּ אוֹתָם מֵעֵדֶר בְּנֵי לָבָן לְעֵדֶר יַעֲקֹב", "יַעֲקֹב גָּנַב אוֹתָם בַּלַּיְלָה מֵעֵדֶר בְּנֵי לָבָן", "נוֹלְדוּ זְכָרִים חֲדָשִׁים בָּעֵדֶר שֶׁל יַעֲקֹב"], "kasha": "הרי לבן הבדיל את כל הנקודים והטלואים, ומאין באו ״העתדים העלים עלהצאן עקדים נקדים וברדים״?", "answer": "אף שהבדילם לבן כולם, היו המלאכים מביאים אותם מהעדר המסור ביד בני לבן לעדר שביד יעקב.", "kp": ["היו המלאכים מביאין אותן", "מעדר המסור ביד בני לבן"]}]}, {"id": "31:10.2", "ch": 31, "v": 10, "n": 2, "dh": "וברדים", "pasuk_html": "וַיְהִ֗י בְּעֵת֙ יַחֵ֣ם הַצֹּ֔אן וָאֶשָּׂ֥א עֵינַ֛י וָאֵ֖רֶא בַּחֲל֑וֹם וְהִנֵּ֤ה הָֽעַתֻּדִים֙ הָעֹלִ֣ים עַל־הַצֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים <mark>וּבְרֻדִּֽים׃</mark>", "pasuk_en": "וַיְהִי בְּעֵת יַחֵם הַצֹּאן וָאֶשָּׂא עֵינַי וָאֵרֶא בַּחֲלוֹם וְהִנֵּה הָעַתֻּדִים הָעֹלִים עַל־הַצֹּאן עֲקֻדִּים נְקֻדִּים וּבְרֻדִּים׃", "rashi_he": "וברדים. כְּתַרְגּוּמוֹ וּפַצִּיחִין, פייש\"יר בְּלַעַ\"ז, חוּט שֶׁל לָבָן מַקִּיף אֶת גּוּפוֹ סָבִיב, חֲבַרְבּוּרוֹת שֶׁלּוֹ פְתוּחָה וּמְפֻלֶּשֶׁת מִזּוֹ אֶל זוֹ; וְאֵין לְהָבִיא עֵד מִן הַמִּקְרָא:", "rashi_en": "\"ברדים\" כתרגומו \"ופציחין\": חוט לבן מקיף את גופו סביב, והחברבורות שלו פתוחות ונמשכות מזו לזו. רש\"י מוסיף שאין לכך ראיה מן המקרא.", "note": "", "points": [{"q": "מָה הֵם \"בְרֻדִּים\" לְפִי רַשִׁ\"י?", "options": ["צֹאן שֶׁחוּט לָבָן מַקִּיף אֶת גּוּפָן וְחַבַּרְבּוּרוֹתֵיהֶן נִמְשָׁכוֹת", "צֹאן שֶׁנְּקוּדּוֹת לְבָנוֹת קְטַנּוֹת כְּמוֹ בָּרָד פְּזוּרוֹת עֲלֵיהֶן", "צֹאן שֶׁכּוּלָּן לְבָנוֹת מִכַּף רֶגֶל וְעַד רֹאשׁ"], "kasha": "מה פירוש המילה \"וברדים\", שאינה מוכרת?", "answer": "כתרגומו \"ופציחין\": חוט של לבן מקיף את גופו סביב, וחברבורותיו פתוחות ומפולשות מזו לזו; ואין להביא לכך ראיה מן המקרא.", "kp": ["חוט של לבן מקיף את גופו", "חברבורות שלו פתוחה ומפלשת"]}]}, {"id": "31:13.1", "ch": 31, "v": 13, "n": 1, "dh": "האל בית אל", "pasuk_html": "אָנֹכִ֤י <mark>הָאֵל֙ בֵּֽית־אֵ֔ל</mark> אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן־הָאָ֣רֶץ הַזֹּ֔את וְשׁ֖וּב אֶל־אֶ֥רֶץ מוֹלַדְתֶּֽךָ׃", "pasuk_en": "אָנֹכִי הָאֵל בֵּית־אֵל אֲשֶׁר מָשַׁחְתָּ שָּׁם מַצֵּבָה אֲשֶׁר נָדַרְתָּ לִּי שָׁם נֶדֶר עַתָּה קוּם צֵא מִן־הָאָרֶץ הַזֹּאת וְשׁוּב אֶל־אֶרֶץ מוֹלַדְתֶּךָ׃", "rashi_he": "האל בית אל. כְּמוֹ אֵל בֵּית אֵל, הַהֵ\"א יְתֵרָה, וְדֶרֶךְ מִקְרָאוֹת לְדַבֵּר כֵּן, כְּמוֹ כִּי אַתֶּם בָּאִים אֶל הָאָרֶץ כְּנָעַן (במדבר ל\"ד):", "rashi_en": "\"האל בית אל\" פירושו כמו \"אל בית אל\", והה״א מיותרת. כך דרך המקרא לדבר, כמו \"כי אתם באים אל הארץ כנען\".", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַצֵּירוּף \"הָאֵל בֵּיתְאֵל\"?", "options": ["כְּמוֹ \"אֵל בֵּית אֵל\"; הַהֵ״א מְיוּתֶּרֶת, וְכָךְ דֶּרֶךְ הַמִּקְרָא", "הָאֵל שֶׁנִּגְלָה אֵלֶיךָ בְּבֵית אֵל; הַהֵ״א הִיא הֵ״א הַיְדִיעָה", "ה׳ נִקְרָא בְּשֵׁם \"בֵּית־אֵל\" עַל שֵׁם הַמָּקוֹם"], "kasha": "לא מקובל לכתוב ה״א הידיעה בתחילת מילה נסמכת, כמו \"האל\" הנסמך ל\"בית אל\".", "answer": "זה כמו \"אל בית אל\", והה״א יתרה; ודרך המקראות לדבר כך, כמו \"כי אתם באים אל הארץ כנען\".", "kp": ["כמו אל בית אל", "הה\"א יתרה"]}]}, {"id": "31:13.2", "ch": 31, "v": 13, "n": 2, "dh": "משחת שם", "pasuk_html": "אָנֹכִ֤י הָאֵל֙ בֵּֽית־אֵ֔ל אֲשֶׁ֨ר <mark>מָשַׁ֤חְתָּ שָּׁם֙</mark> מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן־הָאָ֣רֶץ הַזֹּ֔את וְשׁ֖וּב אֶל־אֶ֥רֶץ מוֹלַדְתֶּֽךָ׃", "pasuk_en": "אָנֹכִי הָאֵל בֵּית־אֵל אֲשֶׁר מָשַׁחְתָּ שָּׁם מַצֵּבָה אֲשֶׁר נָדַרְתָּ לִּי שָׁם נֶדֶר עַתָּה קוּם צֵא מִן־הָאָרֶץ הַזֹּאת וְשׁוּב אֶל־אֶרֶץ מוֹלַדְתֶּךָ׃", "rashi_he": "משחת שם. לְ' רִבּוּי וּגְדֻלָּה כְּשֶׁנִּמְשָׁח לַמַּלְכוּת, כָּךְ וַיִּצֹק שֶׁמֶן עַל רֹאשָׁהּ – לִהְיוֹת מְשׁוּחָה לְמִזְבֵּחַ:", "rashi_en": "המשיחה היא לשון רבוי וגדולה, כמו משיחת מלך. כך יעקב יצק שמן על המצבה כדי שתהיה משוחה למזבח.", "note": "", "points": [{"q": "מָה מַשְׁמָעוּת הַמְּשִׁיחָה שֶׁל הַמַּצֵּבָה לְפִי רַשִׁ\"י?", "options": ["לְשׁוֹן גְּדֻולָּה, כְּדֵי שֶׁתִּהְיֶה מְשׁוּחָה לַמִּזְבֵּחַ", "כְּדֵי לְסַמֵּן אֶת הַמָּקוֹם שֶׁיּוּכַל לִמְצוֹא אוֹתוֹ", "כְּדֵי לְנַקּוֹת אֶת הָאֶבֶן לִפְנֵי הַשֵּׁינָה עָלֶיהָ"], "kasha": "למה משח יעקב את המצבה בשמן?", "answer": "לשון רבוי וגדולה, כמו שנמשח למלכות; כך 'ויצק שמן על ראשה', להיות משוחה למזבח.", "kp": ["ל' רבוי וגדלה", "להיות משוחה למזבח"]}]}, {"id": "31:13.3", "ch": 31, "v": 13, "n": 3, "dh": "אשר נדרת לי", "pasuk_html": "אָנֹכִ֤י הָאֵל֙ בֵּֽית־אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה <mark>אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛י</mark> שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן־הָאָ֣רֶץ הַזֹּ֔את וְשׁ֖וּב אֶל־אֶ֥רֶץ מוֹלַדְתֶּֽךָ׃", "pasuk_en": "אָנֹכִי הָאֵל בֵּית־אֵל אֲשֶׁר מָשַׁחְתָּ שָּׁם מַצֵּבָה אֲשֶׁר נָדַרְתָּ לִּי שָׁם נֶדֶר עַתָּה קוּם צֵא מִן־הָאָרֶץ הַזֹּאת וְשׁוּב אֶל־אֶרֶץ מוֹלַדְתֶּךָ׃", "rashi_he": "אשר נדרת לי. וְצָרִיךְ אַתָּה לְשַׁלְּמוֹ, שֶׁאָמַרְתָּ יִהְיֶה בֵּית אֱלֹהִים, שֶׁתַּקְרִיב שָׁם קָרְבָּנוֹת:", "rashi_en": "ה' הזכיר ליעקב את נדרו, ועליו לשלם אותו: הוא אמר \"יהיה בית אלהים\", כלומר שיקריב שם קרבנות.", "note": "", "points": [{"q": "מַדּוּעַ הִזְכִּיר ה' לְיַעֲקֹב אֶת הַנֶּדֶר שֶׁנָּדַר?", "options": ["כְּדֵי שֶׁיְּשַׁלֵּם אוֹתוֹ וְיַקְרִיב שָׁם קָרְבָּנוֹת", "כְּדֵי לְהַזְכִּיר לוֹ שֶׁה' כְּבָר קִיֵּים אֶת הַבְטָחוֹתָיו", "כְּדֵי שֶׁיַּחֲזֹור לְבֵית אֵל וְיָגוּר שָׁם כָּל יָמָיו"], "kasha": "מדוע מזכיר ה' את הנדר דווקא עתה, כשהוא מצווה על יעקב לשוב?", "answer": "וצריך אתה לשלמו, שאמרת \"יהיה בית אלהים\", שתקריב שם קרבנות.", "kp": ["וצריך אתה לשלמו", "שתקריב שם קרבנות"]}]}, {"id": "31:14.1", "ch": 31, "v": 14, "n": 1, "dh": "העוד לנו", "pasuk_html": "וַתַּ֤עַן רָחֵל֙ וְלֵאָ֔ה וַתֹּאמַ֖רְנָה ל֑וֹ <mark>הַע֥וֹד לָ֛נוּ</mark> חֵ֥לֶק וְנַחֲלָ֖ה בְּבֵ֥ית אָבִֽינוּ׃", "pasuk_en": "וַתַּעַן רָחֵל וְלֵאָה וַתֹּאמַרְנָה לוֹ הַעוֹד לָנוּ חֵלֶק וְנַחֲלָה בְּבֵית אָבִינוּ׃", "rashi_he": "העוד לנו. לָמָּה נְעַכֵּב עַל יָדְךָ מִלָּשׁוּב? כְּלוּם אָנוּ מְיַחֲלוֹת לִירַשׁ מִנִּכְסֵי אָבִינוּ כְּלוּם בֵּין הַזְּכָרִים:", "rashi_en": "רחל ולאה אמרו ליעקב: למה נעכב אותך מלשוב? וכי אנו מקוות לרשת משהו מנכסי אבינו, במקום שיש לו בנים זכרים?", "note": "", "points": [{"q": "מָה כַּוָּונַת רָחֵל וְלֵאָה בִּשְׁאֵלָה \"הַעוֹד לָנוּ חֵלֶק וְנַחֲלָה\"?", "options": ["אֵין סִיבָּה לְעַכֵּב אוֹתָךְ, כִּי לֹא נִירַשׁ מֵאָבִינוּ", "אֲבִינוּ חַיָּיב לָנוּ חֵלֶק, וְנִדְרוֹשׁ אוֹתוֹ לִפְנֵי שֶׁנֵּלֵךְ", "נִשְׁאַר כָּאן, כִּי יֵשׁ לָנוּ עֲדַיִין נַחֲלָה בְּבֵית אָבִינוּ"], "kasha": "יעקב ביקש לשוב, ולא ברור מה הקשר בין הירושה לבין תשובתן.", "answer": "למה נעכב על ידך מלשוב? כלום אנו מקוות לרשת מנכסי אבינו כלום, במקום הזכרים?", "kp": ["למה נעכב על ידך מלשוב", "כלום אנו מיחלות לירש מנכסי אבינו"]}]}, {"id": "31:15.1", "ch": 31, "v": 15, "n": 1, "dh": "הלא נכריות נחשבנו לו", "pasuk_html": "<mark>הֲל֧וֹא נָכְרִיּ֛וֹת נֶחְשַׁ֥בְנוּ ל֖וֹ</mark> כִּ֣י מְכָרָ֑נוּ וַיֹּ֥אכַל גַּם־אָכ֖וֹל אֶת־כַּסְפֵּֽנוּ׃", "pasuk_en": "הֲלוֹא נָכְרִיּוֹת נֶחְשַׁבְנוּ לוֹ כִּי מְכָרָנוּ וַיֹּאכַל גַּם־אָכוֹל אֶת־כַּסְפֵּנוּ׃", "rashi_he": "הלא נכריות נחשבנו לו. אֲפִלּוּ בְשָׁעָה שֶׁדֶּרֶךְ בְּנֵי אָדָם לָתֵת נְדוּנְיָה לִבְנוֹתָיו – בִּשְׁעַת נִשּׂוּאִין – נָהַג עִמָּנוּ כְּנָכְרִיּוֹת, כִּי מְכָרָנוּ לְךָ בִּשְׂכַר הַפְּעֻלָּה:", "rashi_en": "גם בשעת הנישואין, כשדרך בני אדם לתת נדוניה לבנותיהם, נהג לבן בבנותיו כבנכריות: לא נתן להן דבר, אלא מכר אותן ליעקב בשכר עבודתו.", "note": "", "points": [{"q": "בַּמֶּה נָהַג לָבָן בִּבְנוֹתָיו כִּבְנָכְרִיּוֹת?", "options": ["לֹא נָתַן לָהֶן נְדוּנְיָה, אֶלָּא מְכָרָן לְיַעֲקֹב בִּשְׂכַר עֲבוֹדָתוֹ", "לֹא הִרְשָׁה לָהֶן לְדַבֵּר עִם יַעֲקֹב בְּבֵיתוֹ", "הוֹשִׁיב אוֹתָן לָגוּר בַּשָּׂדֶה עִם הַצֹּאן"], "kasha": "מה הכוונה שבנות לבן נחשבו לו לנכריות?", "answer": "אפילו בשעה שדרך בני אדם לתת נדוניה לבנותיהם, בשעת נישואין, נהג עמנו כנכריות, כי מכרנו לך בשכר הפעולה.", "kp": ["לתת נדוניה לבנותיו", "כי מכרנו לך בשכר הפעלה"]}]}, {"id": "31:15.2", "ch": 31, "v": 15, "n": 2, "dh": "את כספנו", "pasuk_html": "הֲל֧וֹא נָכְרִיּ֛וֹת נֶחְשַׁ֥בְנוּ ל֖וֹ כִּ֣י מְכָרָ֑נוּ וַיֹּ֥אכַל גַּם־אָכ֖וֹל <mark>אֶת־כַּסְפֵּֽנוּ׃</mark>", "pasuk_en": "הֲלוֹא נָכְרִיּוֹת נֶחְשַׁבְנוּ לוֹ כִּי מְכָרָנוּ וַיֹּאכַל גַּם־אָכוֹל אֶת־כַּסְפֵּנוּ׃", "rashi_he": "את כספנו. שֶׁעִכֵּב דְּמֵי שְׂכַר פְּעֻלָּתְךָ:", "rashi_en": "רחל ולאה אמרו שלבן ״אכל את כספנו״, כי עיכב את שכר עבודתו של יעקב.", "note": "", "points": [{"q": "לְאֵיזֶה כֶּסֶף הִתְכַּוְּונוּ רָחֵל וְלֵאָה בְּאָמְרָן ״אֶת־כַּסְפֵּנוּ״?", "options": ["לִשְׂכַר הָעֲבוֹדָה שֶׁל יַעֲקֹב שֶׁלָּבָן עִיכֵּב", "לְנַדּוּנְיָה שֶׁקִּיבְּלוּ מֵאִמָּן", "לַכֶּסֶף שֶׁקִּיבֵּל לָבָן מִמְּכִירַת הַצֹּאן"], "kasha": "איזה כסף היה לבנות שאביהן אכל?", "answer": "שעיכב דמי שכר פעולתו של יעקב.", "kp": ["שעכב דמי שכר פעלתך"]}]}, {"id": "31:16.1", "ch": 31, "v": 16, "n": 1, "dh": "כי כל העשר", "pasuk_html": "<mark>כִּ֣י כָל־הָעֹ֗שֶׁר</mark> אֲשֶׁ֨ר הִצִּ֤יל אֱלֹהִים֙ מֵֽאָבִ֔ינוּ לָ֥נוּ ה֖וּא וּלְבָנֵ֑ינוּ וְעַתָּ֗ה כֹּל֩ אֲשֶׁ֨ר אָמַ֧ר אֱלֹהִ֛ים אֵלֶ֖יךָ עֲשֵֽׂה׃", "pasuk_en": "כִּי כָל־הָעֹשֶׁר אֲשֶׁר הִצִּיל אֱלֹהִים מֵאָבִינוּ לָנוּ הוּא וּלְבָנֵינוּ וְעַתָּה כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ עֲשֵׂה׃", "rashi_he": "כי כל העשר. כִּי זֶה מְשַׁמֵּשׁ בִּלְשׁוֹן אֶלָּא; כְּלוֹמַר, מִשֶּׁל אָבִינוּ אֵין לָנוּ כְּלוּם, אֶלָּא מַה שֶּׁהִצִּיל הַקָּבָּ\"ה מֵאָבִינוּ שֶׁלָּנוּ הוּא:", "rashi_en": "המילה ״כי״ כאן במשמעות ״אלא״: משל אבינו אין לנו כלום, אלא מה שהציל הקב״ה מאבינו, רק זה שלנו.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָּה ״כִּי״ בְּדִבְרֵי רָחֵל וְלֵאָה ״כִּי כָל־הָעֹשֶׁר״?", "options": ["בִּלְשׁוֹן ״אֶלָּא״: אֵין לָנוּ כְּלוּם, אֶלָּא מַה שֶּׁהִצִּיל ה׳", "בִּלְשׁוֹן ״מִפְּנֵי שֶׁ״: מִפְּנֵי שֶׁה׳ הִצִּיל אֶת הָעוֹשֶׁר", "בִּלְשׁוֹן ״אִם״: אִם ה׳ יַצִּיל אֶת הָעוֹשֶׁר"], "kasha": "הלשון ״כי״ אינה מתיישבת עם מה שנאמר לפני כן, שאין להן חלק ונחלה בבית אביהן.", "answer": "״כי״ משמש בלשון ״אלא״: משל אבינו אין לנו כלום, אלא מה שהציל הקב״ה מאבינו שלנו הוא.", "kp": ["כי זה משמש בלשון אלא", "משל אבינו אין לנו כלום"]}]}, {"id": "31:16.2", "ch": 31, "v": 16, "n": 2, "dh": "הציל", "pasuk_html": "כִּ֣י כָל־הָעֹ֗שֶׁר אֲשֶׁ֨ר <mark>הִצִּ֤יל</mark> אֱלֹהִים֙ מֵֽאָבִ֔ינוּ לָ֥נוּ ה֖וּא וּלְבָנֵ֑ינוּ וְעַתָּ֗ה כֹּל֩ אֲשֶׁ֨ר אָמַ֧ר אֱלֹהִ֛ים אֵלֶ֖יךָ עֲשֵֽׂה׃", "pasuk_en": "כִּי כָל־הָעֹשֶׁר אֲשֶׁר הִצִּיל אֱלֹהִים מֵאָבִינוּ לָנוּ הוּא וּלְבָנֵינוּ וְעַתָּה כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ עֲשֵׂה׃", "rashi_he": "הציל. לְשׁוֹן הִפְרִישׁ, וְכֵן כָּל לְשׁוֹן הַצָּלָה שֶׁבַּמִּקְרָא לְשׁוֹן הַפְרָשָׁה, שֶׁמַּפְרִישׁוֹ מִן הָרָעָה וּמִן הָאוֹיֵב:", "rashi_en": "\"הציל\" פירושו הפריש. וכל לשון הצלה במקרא היא לשון הפרשה, שמפריש את האדם מן הרעה ומן האויב.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"הִצִּיל\" בַּפָּסוּק?", "options": ["הִפְרִישׁ – ה' הִפְרִישׁ אֶת הָעוֹשֶׁר מֵאָבִינוּ", "הוֹשִׁיעַ – ה' הִצִּיל אֶת הָעוֹשֶׁר מִיְּדֵי שׁוֹדְדִים", "הֶעֱנִיק – ה' נָתַן לָנוּ מַתָּנָה מֵאָבִינוּ"], "kasha": "מה שייכת לשון \"הצלה\" לעושר שלקח ה' מלבן?", "answer": "\"הציל\" לשון הפריש; וכל לשון הצלה שבמקרא היא לשון הפרשה, שמפרישו מן הרעה ומן האויב.", "kp": ["לשון הפריש", "שמפרישו מן הרעה"]}]}, {"id": "31:17.1", "ch": 31, "v": 17, "n": 1, "dh": "את בניו ואת נשיו", "pasuk_html": "וַיָּ֖קָם יַעֲקֹ֑ב וַיִּשָּׂ֛א <mark>אֶת־בָּנָ֥יו וְאֶת־נָשָׁ֖יו</mark> עַל־הַגְּמַלִּֽים׃", "pasuk_en": "וַיָּקָם יַעֲקֹב וַיִּשָּׂא אֶת־בָּנָיו וְאֶת־נָשָׁיו עַל־הַגְּמַלִּים׃", "rashi_he": "את בניו ואת נשיו. הִקְדִּים זְכָרִים לִנְקֵבוֹת, וְעֵשָׂו הִקְדִּים נְקֵבוֹת לִזְכָרִים, שֶׁנֶּאֱמַר וַיִּקַּח עֵשָׂו אֶת נָשָׁיו וְאֶת בָּנָיו וְגוֹמֵר:", "rashi_en": "יעקב הקדים את הזכרים לנקבות, ואילו עשו הקדים את הנקבות לזכרים, כמו שנאמר \"ויקח עשו את נשיו ואת בניו\".", "note": "", "points": [{"q": "מָה מְלַמֶּדֶת הַתּוֹרָה בְּכָךְ שֶׁהִזְכִּירָה אֶת \"בָּנָיו\" לִפְנֵי \"נָשָׁיו\"?", "options": ["יַעֲקֹב הִקְדִּים זְכָרִים לִנְקֵבוֹת, וְאִילּוּ עֵשָׂו הִקְדִּים נְקֵבוֹת לִזְכָרִים", "שֶׁהַבָּנִים הָיוּ גְּדוֹלִים וְיָכְלוּ לִרְכּוֹב לְבַדָּם", "שֶׁיַּעֲקֹב חָשַׁשׁ שֶׁלָּבָן יִרְדּוֹף דַּוְוקָא אַחֲרֵי הַבָּנִים"], "kasha": "למה חשוב לתורה לציין באיזה סדר העלה יעקב את בני ביתו על הגמלים?", "answer": "יעקב הקדים זכרים לנקבות, ועשו הקדים נקבות לזכרים, שנאמר \"ויקח עשו את נשיו ואת בניו\".", "kp": ["הקדים זכרים לנקבות", "הקדים נקבות לזכרים"]}]}, {"id": "31:18.1", "ch": 31, "v": 18, "n": 1, "dh": "מקנה קנינו", "pasuk_html": "וַיִּנְהַ֣ג אֶת־כָּל־מִקְנֵ֗הוּ וְאֶת־כָּל־רְכֻשׁוֹ֙ אֲשֶׁ֣ר רָכָ֔שׁ <mark>מִקְנֵה֙ קִנְיָנ֔וֹ</mark> אֲשֶׁ֥ר רָכַ֖שׁ בְּפַדַּ֣ן אֲרָ֑ם לָב֛וֹא אֶל־יִצְחָ֥ק אָבִ֖יו אַ֥רְצָה כְּנָֽעַן׃", "pasuk_en": "וַיִּנְהַג אֶת־כָּל־מִקְנֵהוּ וְאֶת־כָּל־רְכֻשׁוֹ אֲשֶׁר רָכָשׁ מִקְנֵה קִנְיָנוֹ אֲשֶׁר רָכַשׁ בְּפַדַּן אֲרָם לָבוֹא אֶל־יִצְחָק אָבִיו אַרְצָה כְּנָעַן׃", "rashi_he": "מקנה קנינו. מַה שֶּׁקָּנָה מִצֹּאנוֹ, עֲבָדִים וּשְׁפָחוֹת וּגְמַלִּים וַחֲמוֹרִים:", "rashi_en": "'מקנה קנינו' הם מה שקנה יעקב תמורת צאנו: עבדים, שפחות, גמלים וחמורים.", "note": "", "points": [{"q": "מַהוּ 'מִקְנֵה קִנְיָנוֹ' לְפִי רַשִׁ\"י?", "options": ["מָה שֶׁקָּנָה תְּמוּרַת צֹאנוֹ: עֲבָדִים, שְׁפָחוֹת, גְּמַלִּים וַחֲמוֹרִים", "הַצֹּאן שֶׁנּוֹלַד לוֹ בַּעֲקוּדִים וּנְקוּדִים", "הַמַּתָּנוֹת שֶׁקִּיבֵּל מִלָּבָן בִּשְׂכַר עֲבוֹדָתוֹ"], "kasha": "מה מוסיף 'מקנה קנינו' על 'כל מקנהו' שכבר נזכר?", "answer": "מה שקנה מצאנו: עבדים ושפחות וגמלים וחמורים.", "kp": ["מה שקנה מצאנו", "עבדים ושפחות וגמלים וחמורים"]}]}, {"id": "31:19.1", "ch": 31, "v": 19, "n": 1, "dh": "לגזוז את צאנו", "pasuk_html": "וְלָבָ֣ן הָלַ֔ךְ <mark>לִגְזֹ֖ז אֶת־צֹאנ֑וֹ</mark> וַתִּגְנֹ֣ב רָחֵ֔ל אֶת־הַתְּרָפִ֖ים אֲשֶׁ֥ר לְאָבִֽיהָ׃", "pasuk_en": "וְלָבָן הָלַךְ לִגְזֹז אֶת־צֹאנוֹ וַתִּגְנֹב רָחֵל אֶת־הַתְּרָפִים אֲשֶׁר לְאָבִיהָ׃", "rashi_he": "לגזוז את צאנו. שֶׁנָּתַן בְּיַד בָּנָיו דֶּרֶךְ שְׁלֹשֶׁת יָמִים בֵּינוֹ וּבֵין יַעֲקֹב:", "rashi_en": "לבן הלך לגזוז את הצאן שנתן ביד בניו, שהיה במרחק שלושה ימים בינו לבין יעקב.", "note": "", "points": [{"q": "אֵיזֶה צֹאן הָלַךְ לָבָן לִגְזוֹז לְפִי רַשִׁ\"י?", "options": ["הַצֹּאן שֶׁנָּתַן בְּיַד בָּנָיו, בְּמֶרְחַק שְׁלוֹשָׁה יָמִים", "הַצֹּאן שֶׁיַּעֲקֹב רָעָה בִּשְׁבִילוֹ בַּשָּׂדֶה הַסָּמוּךְ", "צֹאן שֶׁקָּנָה זֶה עַתָּה בְּעִיר אַחֶרֶת"], "kasha": "יש לבאר לאן הלך לבן, ומדוע היה רחוק כל כך שלא ידע על בריחת יעקב.", "answer": "הצאן שנתן ביד בניו, דרך שלושת ימים בינו ובין יעקב.", "kp": ["שנתן ביד בניו", "דרך שלשת ימים בינו"]}]}, {"id": "31:19.2", "ch": 31, "v": 19, "n": 2, "dh": "ותגנב רחל את התרפים", "pasuk_html": "וְלָבָ֣ן הָלַ֔ךְ לִגְזֹ֖ז אֶת־צֹאנ֑וֹ <mark>וַתִּגְנֹ֣ב רָחֵ֔ל אֶת־הַתְּרָפִ֖ים</mark> אֲשֶׁ֥ר לְאָבִֽיהָ׃", "pasuk_en": "וְלָבָן הָלַךְ לִגְזֹז אֶת־צֹאנוֹ וַתִּגְנֹב רָחֵל אֶת־הַתְּרָפִים אֲשֶׁר לְאָבִיהָ׃", "rashi_he": "ותגנב רחל את התרפים. לְהַפְרִישׁ אֶת אָבִיהָ מֵעֲ\"זָ נִתְכַּוְּנָה (בראשית רבה):", "rashi_en": "רחל גנבה את התרפים כדי להרחיק את אביה מעבודה זרה.", "note": "", "points": [{"q": "לְשֵׁם מָה גָּנְבָה רָחֵל אֶת הַתְּרָפִים?", "options": ["כְּדֵי לְהַפְרִישׁ אֶת אָבִיהָ מֵעֲבוֹדָה זָרָה", "כְּדֵי לָקַחַת אוֹתָם עִמָּהּ וְלַעֲבוֹד אוֹתָם", "כְּדֵי לְקַבֵּל תְּמוּרָתָם אֶת חֶלְקָהּ בִּירוּשָׁה"], "kasha": "מדוע צדקת כמו רחל גנבה את התרפים של אביה?", "answer": "להפריש את אביה מעבודה זרה נתכוונה.", "kp": ["להפריש את אביה מע\"ז נתכונה"]}]}, {"id": "31:22.1", "ch": 31, "v": 22, "n": 1, "dh": "ביום השלישי", "pasuk_html": "וַיֻּגַּ֥ד לְלָבָ֖ן <mark>בַּיּ֣וֹם הַשְּׁלִישִׁ֑י</mark> כִּ֥י בָרַ֖ח יַעֲקֹֽב׃", "pasuk_en": "וַיֻּגַּד לְלָבָן בַּיּוֹם הַשְּׁלִישִׁי כִּי בָרַח יַעֲקֹב׃", "rashi_he": "ביום השלישי. שֶׁהֲרֵי דֶּרֶךְ שְׁלֹשֶׁת יָמִים הָיָה בֵינֵיהֶם:", "rashi_en": "רק ביום השלישי הוגד ללבן שיעקב ברח, כי היה מרחק שלושה ימי הליכה ביניהם.", "note": "", "points": [{"q": "מַדּוּעַ הוּגַּד לְלָבָן רַק בַּיּוֹם הַשְּׁלִישִׁי?", "options": ["כִּי הָיָה בֵּינֵיהֶם מֶרְחַק דֶּרֶךְ שְׁלוֹשָׁה יָמִים", "כִּי יַעֲקֹב בָּרַח בַּלַּיְלָה וְאִישׁ לֹא רָאָהוּ", "כִּי בְּנֵי לָבָן הִסְתִּירוּ מִמֶּנּוּ אֶת הַבְּרִיחָה"], "kasha": "מדוע עברו שלושה ימים עד שנודע ללבן על הבריחה?", "answer": "שהרי דרך שלושת ימים הייתה ביניהם.", "kp": ["שהרי דרך שלשת ימים היה ביניהם"]}]}, {"id": "31:23.1", "ch": 31, "v": 23, "n": 1, "dh": "את אחיו", "pasuk_html": "וַיִּקַּ֤ח <mark>אֶת־אֶחָיו֙</mark> עִמּ֔וֹ וַיִּרְדֹּ֣ף אַחֲרָ֔יו דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים וַיַּדְבֵּ֥ק אֹת֖וֹ בְּהַ֥ר הַגִּלְעָֽד׃", "pasuk_en": "וַיִּקַּח אֶת־אֶחָיו עִמּוֹ וַיִּרְדֹּף אַחֲרָיו דֶּרֶךְ שִׁבְעַת יָמִים וַיַּדְבֵּק אֹתוֹ בְּהַר הַגִּלְעָד׃", "rashi_he": "את אחיו. קְרוֹבָיו:", "rashi_en": "״אחיו״ של לבן הם קרוביו.", "note": "", "points": [{"q": "אֶת מִי לָקַח לָבָן עִמּוֹ כְּשֶׁרָדַף אַחֲרֵי יַעֲקֹב?", "options": ["אֶת קְרוֹבָיו", "אֶת אָחִיו מֵאָבִיו וּמֵאִמּוֹ בִּלְבַד", "אֶת רוֹעֵי הַצֹּאן שֶׁלּוֹ"], "kasha": "לא מצאנו שהיו ללבן אחים רבים.", "answer": "״אחיו״ - קרוביו.", "kp": ["קרוביו"]}]}, {"id": "31:23.2", "ch": 31, "v": 23, "n": 2, "dh": "דרך שבעת ימים", "pasuk_html": "וַיִּקַּ֤ח אֶת־אֶחָיו֙ עִמּ֔וֹ וַיִּרְדֹּ֣ף אַחֲרָ֔יו <mark>דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים</mark> וַיַּדְבֵּ֥ק אֹת֖וֹ בְּהַ֥ר הַגִּלְעָֽד׃", "pasuk_en": "וַיִּקַּח אֶת־אֶחָיו עִמּוֹ וַיִּרְדֹּף אַחֲרָיו דֶּרֶךְ שִׁבְעַת יָמִים וַיַּדְבֵּק אֹתוֹ בְּהַר הַגִּלְעָד׃", "rashi_he": "דרך שבעת ימים. כָּל אוֹתָן ג' יָמִים שֶׁהָלַךְ הַמַּגִּיד לְהַגִּיד לְלָבָן הָלַךְ יַעֲקֹב לְדַרְכּוֹ, נִמְצָא, יַעֲקֹב רָחוֹק מִלָּבָן שִׁשָּׁה יָמִים, וּבַשְּׁבִיעִי הִשִּׂיגוֹ לָבָן. לָמַדְנוּ שֶׁכָּל מַה שֶּׁהָלַךְ יַעֲקֹב בְּשִׁבְעָה יָמִים הָלַךְ לָבָן בְּיוֹם אֶחָד (שֶׁנֶּאֱמַר וַיִּרְדֹּף אַחֲרָיו דֶּרֶךְ שִׁבְעַת יָמִים, וְלֹא נֶאֱמַר וַיִרְדֹּף אַחֲרָיו שִׁבְעַת יָמִים):", "rashi_en": "במשך שלושת הימים שהשליח הלך להודיע ללבן, יעקב המשיך ללכת, כך שהיה רחוק מלבן שישה ימים, וביום השביעי השיגו לבן. מכאן שמה שהלך יעקב בשבעה ימים הלך לבן ביום אחד.", "note": "", "points": [{"q": "מָה לוֹמֵד רַשִׁ״י מִכָּךְ שֶׁנֶּאֱמַר ״דֶּרֶךְ שִׁבְעַת יָמִים״ וְלֹא ״שִׁבְעַת יָמִים״?", "options": ["שֶׁלָּבָן עָבַר בְּיוֹם אֶחָד דֶּרֶךְ שֶׁיַּעֲקֹב הָלַךְ בְּשִׁבְעָה יָמִים", "שֶׁלָּבָן רָדַף אַחֲרֵי יַעֲקֹב בְּמֶשֶׁךְ שִׁבְעָה יָמִים שְׁלֵמִים", "שֶׁיַּעֲקֹב הָלַךְ לְאַט כְּדֵי שֶׁלָּבָן יַשִּׂיג אוֹתוֹ"], "kasha": "הפסוק אומר ״דרך שבעת ימים״, ואם כן כמה זמן רדף לבן באמת?", "answer": "יעקב היה רחוק מלבן שישה ימים ובשביעי השיגו, למדנו שכל מה שהלך יעקב בשבעה ימים הלך לבן ביום אחד.", "kp": ["שכל מה שהלך יעקב", "הלך לבן ביום אחד"]}]}, {"id": "31:24.1", "ch": 31, "v": 24, "n": 1, "dh": "מטוב עד רע", "pasuk_html": "וַיָּבֹ֧א אֱלֹהִ֛ים אֶל־לָבָ֥ן הָאֲרַמִּ֖י בַּחֲלֹ֣ם הַלָּ֑יְלָה וַיֹּ֣אמֶר ל֗וֹ הִשָּׁ֧מֶר לְךָ֛ פֶּן־תְּדַבֵּ֥ר עִֽם־יַעֲקֹ֖ב <mark>מִטּ֥וֹב עַד־רָֽע׃</mark>", "pasuk_en": "וַיָּבֹא אֱלֹהִים אֶל־לָבָן הָאֲרַמִּי בַּחֲלֹם הַלָּיְלָה וַיֹּאמֶר לוֹ הִשָּׁמֶר לְךָ פֶּן־תְּדַבֵּר עִם־יַעֲקֹב מִטּוֹב עַד־רָע׃", "rashi_he": "מטוב עד רע. כָּל טוֹבָתָן שֶׁל רְשָׁעִים רָעָה הִיא אֵצֶל הַצַּדִּיקִים (יבמות ק\"ג):", "rashi_en": "ה' הזהיר את לבן שלא לדבר עם יעקב אפילו טוב, כי כל טובתם של רשעים רעה היא אצל הצדיקים.", "note": "", "points": [{"q": "מַדּוּעַ הוּזְהַר לָבָן אֲפִילּוּ מִלְּדַבֵּר עִם יַעֲקֹב \"מִטּוֹב\"?", "options": ["כִּי כָּל טוֹבָתָם שֶׁל רְשָׁעִים רָעָה הִיא אֵצֶל הַצַּדִּיקִים", "כִּי ה' לֹא רָצָה שֶׁלָּבָן יְשַׁכְנֵעַ אֶת יַעֲקֹב לַחֲזוֹר", "כִּי דְּבָרִים טוֹבִים מִלָּבָן הָיוּ מְעוֹרְרִים חֲשָׁד אֵצֶל יַעֲקֹב"], "kasha": "מה רע בכך שלבן ידבר עם יעקב דברים טובים?", "answer": "כל טובתן של רשעים רעה היא אצל הצדיקים.", "kp": ["כל טובתן של רשעים", "רעה היא אצל הצדיקים"]}]}, {"id": "31:26.1", "ch": 31, "v": 26, "n": 1, "dh": "כשביות חרב", "pasuk_html": "וַיֹּ֤אמֶר לָבָן֙ לְיַעֲקֹ֔ב מֶ֣ה עָשִׂ֔יתָ וַתִּגְנֹ֖ב אֶת־לְבָבִ֑י וַתְּנַהֵג֙ אֶת־בְּנֹתַ֔י <mark>כִּשְׁבֻי֖וֹת חָֽרֶב׃</mark>", "pasuk_en": "וַיֹּאמֶר לָבָן לְיַעֲקֹב מֶה עָשִׂיתָ וַתִּגְנֹב אֶת־לְבָבִי וַתְּנַהֵג אֶת־בְּנֹתַי כִּשְׁבֻיוֹת חָרֶב׃", "rashi_he": "כשביות חרב. כָּל חַיִל הַבָּא לַמִּלְחָמָה קָרוּי חֶרֶב:", "rashi_en": "כל צבא שיוצא למלחמה נקרא \"חרב\", ולבן אומר שיעקב הוליך את בנותיו כמו שבויות של צבא.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"חָרֶב\" בְּצֵירוּף \"כִּשְׁבֻיוֹת חָרֶב\"?", "options": ["חַיִל הַבָּא לַמִּלְחָמָה נִקְרָא \"חָרֶב\"", "כְּלֵי הַנֶּשֶׁק שֶׁמְּאַיְּימִים בּוֹ עַל הַשְּׁבוּיִים", "חוּרְבָּן וּשְׁמָמָה שֶׁל עִיר שֶׁנִּכְבְּשָׁה"], "kasha": "יעקב לא השתמש בחרב, ומה פירוש \"שביות חרב\"?", "answer": "כל חיל הבא למלחמה קרוי \"חרב\".", "kp": ["כל חיל הבא למלחמה"]}]}, {"id": "31:27.1", "ch": 31, "v": 27, "n": 1, "dh": "ותגנב אתי", "pasuk_html": "לָ֤מָּה נַחְבֵּ֙אתָ֙ לִבְרֹ֔חַ <mark>וַתִּגְנֹ֖ב אֹתִ֑י</mark> וְלֹא־הִגַּ֣דְתָּ לִּ֔י וָֽאֲשַׁלֵּחֲךָ֛ בְּשִׂמְחָ֥ה וּבְשִׁרִ֖ים בְּתֹ֥ף וּבְכִנּֽוֹר׃", "pasuk_en": "לָמָּה נַחְבֵּאתָ לִבְרֹחַ וַתִּגְנֹב אֹתִי וְלֹא־הִגַּדְתָּ לִּי וָאֲשַׁלֵּחֲךָ בְּשִׂמְחָה וּבְשִׁרִים בְּתֹף וּבְכִנּוֹר׃", "rashi_he": "ותגנב אתי. גָּנַבְתָּ אֶת דַּעְתִּי:", "rashi_en": "לבן אמר: גנבת את דעתי, כלומר רימית אותי.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ 'וַתִּגְנֹב אֹתִי' לְפִי רַשִׁ\"י?", "options": ["גָּנַבְתָּ אֶת דַּעְתִּי וְרִימִּיתָ אוֹתִי", "גָּנַבְתָּ אֶת הַתְּרָפִים שֶׁלִּי", "גָּנַבְתָּ אֶת בְּנוֹתַיי וְאֶת צֹאנִי"], "kasha": "איך שייך לומר שגנב את לבן עצמו?", "answer": "גנבת את דעתי.", "kp": ["גנבת את דעתי"]}]}, {"id": "31:29.1", "ch": 31, "v": 29, "n": 1, "dh": "יש לאל ידי", "pasuk_html": "<mark>יֶשׁ־לְאֵ֣ל יָדִ֔י</mark> לַעֲשׂ֥וֹת עִמָּכֶ֖ם רָ֑ע וֵֽאלֹהֵ֨י אֲבִיכֶ֜ם אֶ֣מֶשׁ ׀ אָמַ֧ר אֵלַ֣י לֵאמֹ֗ר הִשָּׁ֧מֶר לְךָ֛ מִדַּבֵּ֥ר עִֽם־יַעֲקֹ֖ב מִטּ֥וֹב עַד־רָֽע׃", "pasuk_en": "יֶשׁ־לְאֵל יָדִי לַעֲשׂוֹת עִמָּכֶם רָע וֵאלֹהֵי אֲבִיכֶם אֶמֶשׁ אָמַר אֵלַי לֵאמֹר הִשָּׁמֶר לְךָ מִדַּבֵּר עִם־יַעֲקֹב מִטּוֹב עַד־רָע׃", "rashi_he": "יש לאל ידי. יֵשׁ כֹּחַ וְחַיִל בְּיָדִי לַעֲשׂוֹת עִמָּכֶם רַע, וְכָל אֵל שֶׁהוּא לְ' קֹדֶש עַל שֵׁם עִזּוּז וְרֹב אוֹנִים הוּא:", "rashi_en": "\"אל\" כאן פירושו כוח: יש כוח וחיל בידי לעשות לכם רע. וכל \"אל\" שהוא שם קודש נקרא כך על שם החוזק ורוב הכוח.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָה \"אֵל\" בְּדִבְרֵי לָבָן לְפִי רַשִׁ\"י?", "options": ["כּוֹחַ וָחַיִל", "שֵׁם ה': הָאֱלוֹהִים בְּעֶזְרִי", "רָצוֹן: יֵשׁ בְּדַעְתִּי וּבְכַוָּוֹנָתִי"], "kasha": "\"אל\" הוא בדרך כלל שם קודש, ואינו מתאים כאן לדברי לבן.", "answer": "יש כוח וחיל בידי לעשות עמכם רע.", "kp": ["יש כח וחיל בידי"]}, {"q": "לְפִי רַשִׁ\"י, עַל שֵׁם מָה נִקְרָא הַקָּבָּ\"ה \"אֵל\"?", "options": ["עַל שֵׁם הַחוֹזֶק וְרוֹב הַכּוֹחַ", "עַל שֵׁם הַחֶסֶד וְהָרַחֲמִים", "עַל שֵׁם הַדִּין וְהַמִּשְׁפָּט"], "kasha": "יש להבין מה הקשר בין \"אל\" שבפסוק לבין שם הקודש.", "answer": "כל \"אל\" שהוא לשון קודש, על שם עזוז ורב אונים הוא.", "kp": ["על שם עזוז ורב אונים"]}]}, {"id": "31:30.1", "ch": 31, "v": 30, "n": 1, "dh": "נכספתה", "pasuk_html": "וְעַתָּה֙ הָלֹ֣ךְ הָלַ֔כְתָּ כִּֽי־נִכְסֹ֥ף <mark>נִכְסַ֖פְתָּה</mark> לְבֵ֣ית אָבִ֑יךָ לָ֥מָּה גָנַ֖בְתָּ אֶת־אֱלֹהָֽי׃", "pasuk_en": "וְעַתָּה הָלֹךְ הָלַכְתָּ כִּי־נִכְסֹף נִכְסַפְתָּה לְבֵית אָבִיךָ לָמָּה גָנַבְתָּ אֶת־אֱלֹהָי׃", "rashi_he": "נכספתה. חָמַדְתָּ, וְהַרְבֵּה יֵשׁ בַּמִּקְרָא, נִכְסְפָה וְגַם כָּלְתָה נַפְשִׁי (תהילים פ\"ד), לְמַעֲשֵׂה יָדֶיךָ תִכְסֹף (איוב י\"ד):", "rashi_en": "\"נכספתה\" פירושו חמדת והשתוקקת, וכך הלשון בפסוקים רבים, כמו \"נכספה וגם כלתה נפשי\".", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָּה \"נִכְסַפְתָּה\"?", "options": ["חָמַדְתָּ וְהִשְׁתּוֹקַקְתָּ", "לָקַחַת כֶּסֶף מִבֵּית אָבִיךָ", "הִתְבַּיֵּישְׁתָּ לְבַקֵּשׁ רְשׁוּת"], "kasha": "המילה \"נכספתה\" אינה מצויה, ויש לברר את פירושה.", "answer": "חמדת; וכן במקרא \"נכספה וגם כלתה נפשי\", \"למעשה ידיך תכסף\".", "kp": ["חמדת"]}]}, {"id": "31:31.1", "ch": 31, "v": 31, "n": 1, "dh": "כי יראתי וגו'", "pasuk_html": "וַיַּ֥עַן יַעֲקֹ֖ב וַיֹּ֣אמֶר לְלָבָ֑ן <mark>כִּ֣י יָרֵ֔אתִי</mark> כִּ֣י אָמַ֔רְתִּי פֶּן־תִּגְזֹ֥ל אֶת־בְּנוֹתֶ֖יךָ מֵעִמִּֽי׃", "pasuk_en": "וַיַּעַן יַעֲקֹב וַיֹּאמֶר לְלָבָן כִּי יָרֵאתִי כִּי אָמַרְתִּי פֶּן־תִּגְזֹל אֶת־בְּנוֹתֶיךָ מֵעִמִּי׃", "rashi_he": "כי יראתי וגו'. הֱשִׁיבוֹ עַל רִאשׁוֹן רִאשׁוֹן, שֶׁאָמַר לוֹ, וַתְּנַהֵג אֶת בְּנֹתַי וְגוֹ':", "rashi_en": "יעקב ענה ללבן לפי סדר טענותיו, ולכן פתח בתשובה על טענתו הראשונה, \"ותנהג את בנתי\".", "note": "", "points": [{"q": "עַל אֵיזוֹ טַעֲנָה שֶׁל לָבָן הֵשִׁיב יַעֲקֹב בְּמִילִּים \"כִּי יָרֵאתִי\"?", "options": ["עַל הַטַּעֲנָה הָרִאשׁוֹנָה, \"וַתְּנַהֵג אֶת בְּנֹתַי\"", "עַל הַטַּעֲנָה הָאַחֲרוֹנָה, \"לָמָּה גָנַבְתָּ אֶת אֱלֹהָי\"", "עַל הַטְּעָנָה שֶׁלֹּא נָתַן לוֹ לְנַשֵּׁק אֶת בָּנָיו"], "kasha": "מדוע פתח יעקב בעניין הבנות, ולא בטענת גניבת התרפים?", "answer": "השיבו על ראשון ראשון, שאמר לו לבן תחילה \"ותנהג את בנתי\".", "kp": ["השיבו על ראשון ראשון", "שאמר לו, ותנהג את בנתי"]}]}, {"id": "31:32.1", "ch": 31, "v": 32, "n": 1, "dh": "לא יחיה", "pasuk_html": "עִ֠ם אֲשֶׁ֨ר תִּמְצָ֣א אֶת־אֱלֹהֶיךָ֮ <mark>לֹ֣א יִֽחְיֶה֒</mark> נֶ֣גֶד אַחֵ֧ינוּ הַֽכֶּר־לְךָ֛ מָ֥ה עִמָּדִ֖י וְקַֽח־לָ֑ךְ וְלֹֽא־יָדַ֣ע יַעֲקֹ֔ב כִּ֥י רָחֵ֖ל גְּנָבָֽתַם׃", "pasuk_en": "עִם אֲשֶׁר תִּמְצָא אֶת־אֱלֹהֶיךָ לֹא יִחְיֶה נֶגֶד אַחֵינוּ הַכֶּר־לְךָ מָה עִמָּדִי וְקַח־לָךְ וְלֹא־יָדַע יַעֲקֹב כִּי רָחֵל גְּנָבָתַם׃", "rashi_he": "לא יחיה. וּמֵאוֹתָהּ קְלָלָה מֵתָה רָחֵל בַּדֶּרֶךְ (בראשית רבה)", "rashi_en": "יעקב אמר שמי שגנב את התרפים ״לא יחיה״, ומאותה קללה מתה רחל בדרך.", "note": "", "points": [{"q": "מָה נִגְרַם מִדִּבְרֵי יַעֲקֹב ״לֹא יִחְיֶה״?", "options": ["רָחֵל מֵתָה בַּדֶּרֶךְ בִּגְלַל הַקְּלָלָה", "לָבָן מֵת זְמַן קָצָר אַחַר כָּךְ", "הַקְּלָלָה לֹא הִתְקַיְּימָה כְּלָל"], "kasha": "יעקב קילל את הגונב בלי לדעת שזו רחל; האם לקללה היה תוקף?", "answer": "מאותה קללה מתה רחל בדרך.", "kp": ["ומאותה קללה מתה רחל בדרך"]}]}, {"id": "31:32.2", "ch": 31, "v": 32, "n": 2, "dh": "מה עמדי", "pasuk_html": "עִ֠ם אֲשֶׁ֨ר תִּמְצָ֣א אֶת־אֱלֹהֶיךָ֮ לֹ֣א יִֽחְיֶה֒ נֶ֣גֶד אַחֵ֧ינוּ הַֽכֶּר־לְךָ֛ <mark>מָ֥ה עִמָּדִ֖י</mark> וְקַֽח־לָ֑ךְ וְלֹֽא־יָדַ֣ע יַעֲקֹ֔ב כִּ֥י רָחֵ֖ל גְּנָבָֽתַם׃", "pasuk_en": "עִם אֲשֶׁר תִּמְצָא אֶת־אֱלֹהֶיךָ לֹא יִחְיֶה נֶגֶד אַחֵינוּ הַכֶּר־לְךָ מָה עִמָּדִי וְקַח־לָךְ וְלֹא־יָדַע יַעֲקֹב כִּי רָחֵל גְּנָבָתַם׃", "rashi_he": "מה עמדי. מִשֶּׁלְּךָ:", "rashi_en": "יעקב אמר ללבן: הכר מה יש אצלי משלך, וקח לך.", "note": "", "points": [{"q": "מָה כַּוָּוֹנַת יַעֲקֹב בְּאָמְרוֹ ״הַכֶּר־לְךָ מָה עִמָּדִי״?", "options": ["הַכֵּר מָה יֵשׁ אֶצְלִי מִשֶּׁלְּךָ", "הַכֵּר מָה כָּל הָרְכוּשׁ שֶׁיֵּשׁ לִי", "הַכֵּר מִי הֵם הָאֲנָשִׁים שֶׁהוֹלְכִים אִיתִּי"], "kasha": "וכי לבן צריך להכיר את כל מה שיש ליעקב?", "answer": "מה עמדי משלך.", "kp": ["משלך"]}]}, {"id": "31:33.1", "ch": 31, "v": 33, "n": 1, "dh": "באהל יעקב", "pasuk_html": "וַיָּבֹ֨א לָבָ֜ן <mark>בְּאֹ֥הֶל יַעֲקֹ֣ב</mark> ׀ וּבְאֹ֣הֶל לֵאָ֗ה וּבְאֹ֛הֶל שְׁתֵּ֥י הָאֲמָהֹ֖ת וְלֹ֣א מָצָ֑א וַיֵּצֵא֙ מֵאֹ֣הֶל לֵאָ֔ה וַיָּבֹ֖א בְּאֹ֥הֶל רָחֵֽל׃", "pasuk_en": "וַיָּבֹא לָבָן בְּאֹהֶל יַעֲקֹב וּבְאֹהֶל לֵאָה וּבְאֹהֶל שְׁתֵּי הָאֲמָהֹת וְלֹא מָצָא וַיֵּצֵא מֵאֹהֶל לֵאָה וַיָּבֹא בְּאֹהֶל רָחֵל׃", "rashi_he": "באהל יעקב. הוּא אֹהֶל רָחֵל, שֶׁהָיָה יַעֲקֹב תָּדִיר אֶצְלָהּ; וְכֵן הוּא אוֹמֵר בְּנֵי רָחֵל אֵשֶׁת יַעֲקֹב וּבְכֻלָּן לֹא נֶאֱמַר אֵשֶׁת יַעֲקֹב:", "rashi_en": "\"אהל יעקב\" הוא אהל רחל, כי יעקב היה תמיד אצלה. וכן נאמר \"בני רחל אשת יעקב\", ובשאר הנשים לא נאמר \"אשת יעקב\".", "note": "", "points": [{"q": "מַהוּ \"אֹהֶל יַעֲקֹב\" שֶׁנִּכְנַס אֵלָיו לָבָן?", "options": ["אֹהֶל רָחֵל, שֶׁיַּעֲקֹב הָיָה תָּדִיר אֶצְלָהּ", "אֹהֶל מְיוּחָד שֶׁהָיָה לְיַעֲקֹב לְבַדּוֹ", "אֹהֶל לֵאָה, שֶׁהָיְיתָה אִשְׁתּוֹ הָרִאשׁוֹנָה"], "kasha": "מהו \"אהל יעקב\", שנזכר כאן לצד אהלי הנשים?", "answer": "הוא אהל רחל, שהיה יעקב תדיר אצלה; וכן נאמר \"בני רחל אשת יעקב\", ובכולן לא נאמר \"אשת יעקב\".", "kp": ["הוא אהל רחל", "שהיה יעקב תדיר אצלה"]}]}, {"id": "31:33.2", "ch": 31, "v": 33, "n": 2, "dh": "ויבא באהל רחל", "pasuk_html": "וַיָּבֹ֨א לָבָ֜ן בְּאֹ֥הֶל יַעֲקֹ֣ב ׀ וּבְאֹ֣הֶל לֵאָ֗ה וּבְאֹ֛הֶל שְׁתֵּ֥י הָאֲמָהֹ֖ת וְלֹ֣א מָצָ֑א וַיֵּצֵא֙ מֵאֹ֣הֶל לֵאָ֔ה <mark>וַיָּבֹ֖א בְּאֹ֥הֶל רָחֵֽל׃</mark>", "pasuk_en": "וַיָּבֹא לָבָן בְּאֹהֶל יַעֲקֹב וּבְאֹהֶל לֵאָה וּבְאֹהֶל שְׁתֵּי הָאֲמָהֹת וְלֹא מָצָא וַיֵּצֵא מֵאֹהֶל לֵאָה וַיָּבֹא בְּאֹהֶל רָחֵל׃", "rashi_he": "ויבא באהל רחל. כְּשֶׁיָּצָא מֵאֹהֶל לֵאָה חָזַר לוֹ לְאֹהֶל רָחֵל קֹדֶם שֶׁיְּחַפֵּשׂ בְּאֹהֶל הָאֲמָהוֹת, וְכָל כָּךְ לָמָּה? שֶׁהָיָה מַכִּיר בָּהּ שֶׁהִיא מַשְׁמְשָׁנִית:", "rashi_en": "כשיצא לבן מאהל לאה, חזר לאהל רחל עוד לפני שחיפש באהל האמהות, כי הכיר בה שהיא \"משמשנית\", שנוגעת וממששת בכל דבר.", "note": "", "points": [{"q": "מַדּוּעַ חָזַר לָבָן לְאֹהֶל רָחֵל לִפְנֵי שֶׁחִיפֵּשׂ בְּאֹהֶל הָאִמָּהוֹת?", "options": ["כִּי הִכִּיר בָּהּ שֶׁהִיא מְשַׁמְּשָׁנִית, נוֹגַעַת וּמְמַשֶּׁשֶׁת בְּכָל דָּבָר", "כִּי רָאָה שָׁם סִימָנִים שֶׁהַתְּרָפִים מוּסְתָּרִים בּוֹ", "כִּי אֹהֶל רָחֵל הָיָה הַקָּרוֹב בְּיוֹתֵר לְאֹהֶל לֵאָה"], "kasha": "הפסוק כבר מנה את האהלים שחיפש בהם, ולמה חוזר ומדגיש שמאהל לאה בא לאהל רחל?", "answer": "כשיצא מאהל לאה חזר לאהל רחל קודם שחיפש באהל האמהות, כי הכיר בה שהיא משמשנית.", "kp": ["שהיה מכיר בה שהיא משמשנית"]}]}, {"id": "31:34.1", "ch": 31, "v": 34, "n": 1, "dh": "בכר הגמל", "pasuk_html": "וְרָחֵ֞ל לָקְחָ֣ה אֶת־הַתְּרָפִ֗ים וַתְּשִׂמֵ֛ם <mark>בְּכַ֥ר הַגָּמָ֖ל</mark> וַתֵּ֣שֶׁב עֲלֵיהֶ֑ם וַיְמַשֵּׁ֥שׁ לָבָ֛ן אֶת־כָּל־הָאֹ֖הֶל וְלֹ֥א מָצָֽא׃", "pasuk_en": "וְרָחֵל לָקְחָה אֶת־הַתְּרָפִים וַתְּשִׂמֵם בְּכַר הַגָּמָל וַתֵּשֶׁב עֲלֵיהֶם וַיְמַשֵּׁשׁ לָבָן אֶת־כָּל־הָאֹהֶל וְלֹא מָצָא׃", "rashi_he": "בכר הגמל. לְשׁוֹן כָּרִים וּכְסָתוֹת, כְּתַרְגּוּמוֹ בַּעֲבִיטָא דְגַמְלָא, וְהִיא מַרְדַּעַת הָעֲשׂוּיָה כְּמִין כַּר; וּבְעֵרוּבִין (דף ט\"ז) שָׁנִינוּ הִקִּיפוּהָ בַּעֲבִיטִין, וְהֵן עֲבִיטֵי גְמַלִּים, בשט\"ו בְּלַעַז:", "rashi_en": "'כר' הוא כמו כרים וכסתות. כר הגמל הוא מרדעת העשויה כמין כר, ובלשון התרגום 'עביטא דגמלא'.", "note": "", "points": [{"q": "מַהוּ 'כַּר הַגָּמָל' לְפִי רַשִׁ\"י?", "options": ["מַרְדַּעַת הָעֲשׂוּיָה כְּמִין כַּר עַל גַּב הַגָּמָל", "מְקוֹם הַמִּרְעֶה שֶׁבּוֹ רוֹעֶה הַגָּמָל", "שַׂק תְּבוּאָה שֶׁקָּשׁוּר לְצַד הַגָּמָל"], "kasha": "מה פירוש 'כר' בצירוף 'כר הגמל'?", "answer": "לשון כרים וכסתות, כתרגומו 'בעביטא דגמלא', והיא מרדעת העשויה כמין כר.", "kp": ["והיא מרדעת העשויה כמין כר"]}]}, {"id": "31:36.1", "ch": 31, "v": 36, "n": 1, "dh": "דלקת", "pasuk_html": "וַיִּ֥חַר לְיַעֲקֹ֖ב וַיָּ֣רֶב בְּלָבָ֑ן וַיַּ֤עַן יַעֲקֹב֙ וַיֹּ֣אמֶר לְלָבָ֔ן מַה־פִּשְׁעִי֙ מַ֣ה חַטָּאתִ֔י כִּ֥י <mark>דָלַ֖קְתָּ</mark> אַחֲרָֽי׃", "pasuk_en": "וַיִּחַר לְיַעֲקֹב וַיָּרֶב בְּלָבָן וַיַּעַן יַעֲקֹב וַיֹּאמֶר לְלָבָן מַה־פִּשְׁעִי מַה חַטָּאתִי כִּי דָלַקְתָּ אַחֲרָי׃", "rashi_he": "דלקת. רָדַפְתָּ, כְּמוֹ עַל הֶהָרִים דְּלָקֻנוּ (איכה ד'), וּכְמוֹ מִדְּלֹק אַחֲרֵי פְלִשְׁתִּים (שמואל א י\"ז):", "rashi_en": "\"דלקת\" פירושו רדפת, כמו \"על ההרים דלקנו\" ו\"מדלק אחרי פלשתים\".", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"דָלַקְתָּ\" לְפִי רַשִׁ\"י?", "options": ["רָדַפְתָּ אַחֲרַי", "הַבְעָרַת אֵשׁ מֵאֲחוֹרַי", "כָּעַסְתָּ עָלַי בְּחֵמָה"], "kasha": "\"דלקת\" נשמע מלשון הדלקת אש, וזה אינו מתאים לעניין.", "answer": "רדפת, כמו \"על ההרים דלקנו\" וכמו \"מדלק אחרי פלשתים\".", "kp": ["רדפת"]}]}, {"id": "31:37.1", "ch": 31, "v": 37, "n": 1, "dh": "ויוכיחו", "pasuk_html": "כִּֽי־מִשַּׁ֣שְׁתָּ אֶת־כָּל־כֵּלַ֗י מַה־מָּצָ֙אתָ֙ מִכֹּ֣ל כְּלֵי־בֵיתֶ֔ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖י וְאַחֶ֑יךָ <mark>וְיוֹכִ֖יחוּ</mark> בֵּ֥ין שְׁנֵֽינוּ׃", "pasuk_en": "כִּי־מִשַּׁשְׁתָּ אֶת־כָּל־כֵּלַי מַה־מָּצָאתָ מִכֹּל כְּלֵי־בֵיתֶךָ שִׂים כֹּה נֶגֶד אַחַי וְאַחֶיךָ וְיוֹכִיחוּ בֵּין שְׁנֵינוּ׃", "rashi_he": "ויוכיחו. וִיבָרְרוּ עִם מִי הַדִּין, אפרובי\"ר בְּלַעַז:", "rashi_en": "\"ויוכיחו\" פירושו יבררו מי צודק בדין, ובלעז אפרובי\"ר.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וְיוֹכִיחוּ בֵּין שְׁנֵינוּ\"?", "options": ["יְבָרְרוּ עִם מִי הַדִּין, מִי מֵאִיתָּנוּ צוֹדֵק", "יַעֲנִישׁוּ אֶת מִי שֶׁגָּנַב מֵחֲבֵרוֹ", "יִגְעֲרוּ בִּשְׁנֵינוּ עַל שֶׁהִתְקוֹטַטְנוּ"], "kasha": "המילה \"ויוכיחו\" יכולה להתפרש תוכחה, ויש לברר את כוונתה כאן.", "answer": "ויבררו עם מי הדין, אפרובי\"ר בלעז.", "kp": ["ויבררו עם מי הדין"]}]}, {"id": "31:38.1", "ch": 31, "v": 38, "n": 1, "dh": "לא שכלו", "pasuk_html": "זֶה֩ עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ עִמָּ֔ךְ רְחֵלֶ֥יךָ וְעִזֶּ֖יךָ <mark>לֹ֣א שִׁכֵּ֑לוּ</mark> וְאֵילֵ֥י צֹאנְךָ֖ לֹ֥א אָכָֽלְתִּי׃", "pasuk_en": "זֶה עֶשְׂרִים שָׁנָה אָנֹכִי עִמָּךְ רְחֵלֶיךָ וְעִזֶּיךָ לֹא שִׁכֵּלוּ וְאֵילֵי צֹאנְךָ לֹא אָכָלְתִּי׃", "rashi_he": "לא שכלו. לֹא הִפִּילוּ עִבּוּרָם, כְּמוֹ רֶחֶם מַשְׁכִּיל (הושע ט'), תְּפַלֵּט פָּרָתוֹ וְלֹא תְשַׁכֵּל (איוב כ\"א):", "rashi_en": "\"לא שכלו\" פירושו: לא הפילו את עובריהן, כמו \"רחם משכיל\".", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"לֹא שִׁכֵּלוּ\"?", "options": ["לֹא הִפִּילוּ אֶת עוּבְּרֵיהֶן", "לֹא מֵתוּ מֵרָעָב בַּשָּׂדֶה", "לֹא נִטְרְפוּ עַל יְדֵי חַיּוֹת"], "kasha": "\"שכול\" הוא בדרך כלל אובדן ילדים, ולא ברור מה הכוונה אצל הצאן.", "answer": "לא הפילו עובריהן, כמו \"רחם משכיל\" ו\"תפלט פרתו ולא תשכל\".", "kp": ["לא הפילו עבורם"]}]}, {"id": "31:38.2", "ch": 31, "v": 38, "n": 2, "dh": "ואילי צאנך", "pasuk_html": "זֶה֩ עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ עִמָּ֔ךְ רְחֵלֶ֥יךָ וְעִזֶּ֖יךָ לֹ֣א שִׁכֵּ֑לוּ <mark>וְאֵילֵ֥י צֹאנְךָ֖</mark> לֹ֥א אָכָֽלְתִּי׃", "pasuk_en": "זֶה עֶשְׂרִים שָׁנָה אָנֹכִי עִמָּךְ רְחֵלֶיךָ וְעִזֶּיךָ לֹא שִׁכֵּלוּ וְאֵילֵי צֹאנְךָ לֹא אָכָלְתִּי׃", "rashi_he": "ואילי צאנך. מִכָּאן אָמְרוּ אַיִל בֶּן יוֹמוֹ קָרוּי אַיִל, שֶׁאִם לֹא כֵן, מַה שִּׁבְחוֹ? אֵלִים לֹא אָכַל, אֲבָל כְּבָשִׂים אָכַל, אִם כֵּן גַּזְלָן הוּא (בבא קמא ס\"ה):", "rashi_en": "מכאן למדו שאפילו איל בן יומו נקרא ״איל״, שאם לא כן מה השבח? שלא אכל אילים אבל כבשים אכל? אם כן גזלן הוא.", "note": "", "points": [{"q": "מָה לָמְדוּ חֲזַ״ל מִדִּבְרֵי יַעֲקֹב ״וְאֵילֵי צֹאנְךָ לֹא אָכָלְתִּי״?", "options": ["שֶׁאֲפִילוּ אַיִל בֶּן יוֹמוֹ נִקְרָא אַיִל", "שֶׁיַּעֲקֹב לֹא אָכַל בָּשָׂר כָּל עֶשְׂרִים הַשָּׁנִים", "שֶׁמּוּתָּר לָרוֹעֶה לֶאֱכוֹל מִן הַכְּבָשִׂים הַקְּטַנִּים"], "kasha": "אם ״אילים״ הם רק גדולים, מה שבח יש בכך - הרי אם אכל כבשים הוא גזלן?", "answer": "איל בן יומו קרוי איל, שאם לא כן, מה שבחו? אילים לא אכל אבל כבשים אכל? אם כן גזלן הוא.", "kp": ["מכאן אמרו איל בן יומו"]}]}, {"id": "31:39.1", "ch": 31, "v": 39, "n": 1, "dh": "טרפה", "pasuk_html": "<mark>טְרֵפָה֙</mark> לֹא־הֵבֵ֣אתִי אֵלֶ֔יךָ אָנֹכִ֣י אֲחַטֶּ֔נָּה מִיָּדִ֖י תְּבַקְשֶׁ֑נָּה גְּנֻֽבְתִ֣י י֔וֹם וּגְנֻֽבְתִ֖י לָֽיְלָה׃", "pasuk_en": "טְרֵפָה לֹא־הֵבֵאתִי אֵלֶיךָ אָנֹכִי אֲחַטֶּנָּה מִיָּדִי תְּבַקְשֶׁנָּה גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה׃", "rashi_he": "טרפה. עַל יְדֵי אֲרִי וּזְאֵב:", "rashi_en": "״טרפה״ כאן היא בהמה שנטרפה על ידי ארי או זאב.", "note": "", "points": [{"q": "אֵיזוֹ ״טְרֵפָה״ מַזְכִּיר יַעֲקֹב בִּדְבָרָיו לְלָבָן?", "options": ["בְּהֵמָה שֶׁנִּטְרְפָה עַל יְדֵי אֲרִי אוֹ זְאֵב", "בְּהֵמָה שֶׁנִּגְנְבָה בִּידֵי גַּנָּבִים בַּלַּיְלָה", "בְּהֵמָה שֶׁמֵּתָה מִמַּחֲלָה בְּתוֹךְ הָעֵדֶר"], "kasha": "מה פירוש ״טרפה״ בהקשר של רועה צאן?", "answer": "טרפה על ידי ארי וזאב.", "kp": ["על ידי ארי וזאב"]}]}, {"id": "31:39.2", "ch": 31, "v": 39, "n": 2, "dh": "אנכי אחטנה", "pasuk_html": "טְרֵפָה֙ לֹא־הֵבֵ֣אתִי אֵלֶ֔יךָ <mark>אָנֹכִ֣י אֲחַטֶּ֔נָּה</mark> מִיָּדִ֖י תְּבַקְשֶׁ֑נָּה גְּנֻֽבְתִ֣י י֔וֹם וּגְנֻֽבְתִ֖י לָֽיְלָה׃", "pasuk_en": "טְרֵפָה לֹא־הֵבֵאתִי אֵלֶיךָ אָנֹכִי אֲחַטֶּנָּה מִיָּדִי תְּבַקְשֶׁנָּה גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה׃", "rashi_he": "אנכי אחטנה. לְשׁוֹן קֹלֵעַ בָּאֶבֶן אֶל הַשַּׂעֲרָה וְלֹא יַחֲטִא (שופטים כ'), אֲנִי וּבְנִי שְׁלֹמֹה חַטָּאִים (מלכים א א') – חֲסֵרִים, אָנֹכִי אַחְסְרֶנָּה, אִם חָסְרָה חָסְרָה לִי, שֶׁמִּיָּדִי תְּבַקְשֶׁנָּה:", "rashi_en": "\"אחטנה\" מלשון חסרון, כמו \"ולא יחטא\" ו\"חטאים\". יעקב אמר: אם חסרה בהמה – ההפסד עליי, כי ממני תבקש אותה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"אָנֹכִי אֲחַטֶּנָּה\"?", "options": ["אֲנִי אֲחַסֵּר אוֹתָהּ – הַהֶפְסֵד יִהְיֶה עָלַיי", "אֲנִי אֶחֱטָא בָּהּ – אֶקַּח אוֹתָהּ לְעַצְמִי", "אֲנִי אֲחַפֵּשׂ אוֹתָהּ עַד שֶׁאֶמְצָא אוֹתָהּ"], "kasha": "מה עניין לשון \"חטא\" לבהמה שנטרפה?", "answer": "\"אחטנה\" לשון חסרון, כמו \"ולא יחטא\" ו\"חטאים\": אנכי אחסרנה – אם חסרה, חסרה לי, שמידי תבקשנה.", "kp": ["חסרים, אנכי אחסרנה", "אם חסרה חסרה לי"]}]}, {"id": "31:39.3", "ch": 31, "v": 39, "n": 3, "dh": "אנכי אחטנה", "pasuk_html": "טְרֵפָה֙ לֹא־הֵבֵ֣אתִי אֵלֶ֔יךָ <mark>אָנֹכִ֣י אֲחַטֶּ֔נָּה</mark> מִיָּדִ֖י תְּבַקְשֶׁ֑נָּה גְּנֻֽבְתִ֣י י֔וֹם וּגְנֻֽבְתִ֖י לָֽיְלָה׃", "pasuk_en": "טְרֵפָה לֹא־הֵבֵאתִי אֵלֶיךָ אָנֹכִי אֲחַטֶּנָּה מִיָּדִי תְּבַקְשֶׁנָּה גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה׃", "rashi_he": "(אנכי אחטנה תַּרְגּוּמוֹ דַּהַוַת שָׁגְיָא מִמִּנְיָנָא, שֶׁהָיְתָה נִפְקֶדֶת וּמְחֻסֶּרֶת, כְּמוֹ וְלֹא נִפְקַד מִמֶּנּוּ אִישׁ (במדבר ל\"א), תַּרְגּוּמוֹ לָא שְׁגָא):", "rashi_en": "אונקלוס מתרגם \"דהות שגיא ממנינא\": מה שהיה חסר מן המניין. כך גם \"ולא נפקד ממנו איש\" מתורגם \"לא שגא\", כלומר לא חסר.", "note": "", "points": [{"q": "לְפִי תַּרְגּוּם אוּנְקְלוֹס, מָה פֵּירוּשׁ \"אֲחַטֶּנָּה\"?", "options": ["לְשׁוֹן חֶסְרוֹן: מַה שֶּׁנֶּחְסַר מִן הַמִּנְיָין", "לְשׁוֹן חֵטְא: אֲנִי חֲטָאתִי בָּהּ", "לְשׁוֹן שְׁחִיטָה: אֲנִי שְׁחַטְתִּי אוֹתָהּ"], "kasha": "\"אחטנה\" נשמע כלשון חטא, ואין זה מתאים לדברי יעקב על הצאן.", "answer": "אונקלוס תרגם \"דהות שגיא ממנינא\": מה שהיה נפקד וחסר מן המניין, כמו \"ולא נפקד ממנו איש\" שתרגומו \"לא שגא\".", "kp": ["שהיתה נפקדת ומחסרת"]}]}, {"id": "31:39.4", "ch": 31, "v": 39, "n": 4, "dh": "גנבתי יום וגנבתי לילה", "pasuk_html": "טְרֵפָה֙ לֹא־הֵבֵ֣אתִי אֵלֶ֔יךָ אָנֹכִ֣י אֲחַטֶּ֔נָּה מִיָּדִ֖י תְּבַקְשֶׁ֑נָּה <mark>גְּנֻֽבְתִ֣י י֔וֹם וּגְנֻֽבְתִ֖י לָֽיְלָה׃</mark>", "pasuk_en": "טְרֵפָה לֹא־הֵבֵאתִי אֵלֶיךָ אָנֹכִי אֲחַטֶּנָּה מִיָּדִי תְּבַקְשֶׁנָּה גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה׃", "rashi_he": "גנבתי יום וגנבתי לילה. גְנוּבַת יוֹם אוֹ גְנוּבַת לַיְלָה, הַכֹּל שִׁלַּמְתִּי:", "rashi_en": "יעקב אמר: בין שנגנבה בהמה ביום ובין שנגנבה בלילה, הכל שילמתי.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ 'גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה' לְפִי רַשִׁ\"י?", "options": ["גְּנוּבַת יוֹם אוֹ גְּנוּבַת לַיְלָה, הַכֹּל שִׁילַּמְתִּי", "גָּנַבְתִּי מֵעַצְמִי אֶת שְׁנַת הַלַּיְלָה וּמְנוּחַת הַיּוֹם", "גָּנַבְתִּי שָׁעוֹת מֵעֲבוֹדָתִי בַּיּוֹם וּבַלַּיְלָה"], "kasha": "וכי יעקב גנב? מה פירוש 'גנבתי' בפיו?", "answer": "גנובת יום או גנובת לילה, הכל שילמתי.", "kp": ["גנובת יום או גנובת לילה"]}]}, {"id": "31:39.5", "ch": 31, "v": 39, "n": 5, "dh": "גנבתי", "pasuk_html": "טְרֵפָה֙ לֹא־הֵבֵ֣אתִי אֵלֶ֔יךָ אָנֹכִ֣י אֲחַטֶּ֔נָּה מִיָּדִ֖י תְּבַקְשֶׁ֑נָּה <mark>גְּנֻֽבְתִ֣י</mark> י֔וֹם וּגְנֻֽבְתִ֖י לָֽיְלָה׃", "pasuk_en": "טְרֵפָה לֹא־הֵבֵאתִי אֵלֶיךָ אָנֹכִי אֲחַטֶּנָּה מִיָּדִי תְּבַקְשֶׁנָּה גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה׃", "rashi_he": "גנבתי. כְּמוֹ רַבָּתִי בַגּוֹיִם שָׂרָתִי בַּמְּדִינוֹת (איכה א'), מְלֵאֲתִי מִשְׁפָּט (ישעיהו א') אֹהַבְתִּי לָדוּשׁ (הושע י'):", "rashi_en": "היו\"ד שבסוף \"גנבתי\" אינה באה לומר \"אני גנבתי\", אלא היא כמו היו\"ד ב\"רבתי בגוים\", \"מלאתי משפט\" ו\"אהבתי לדוש\", ופירושה: גנובה.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מָה מַשְׁמָעוּת הַיּוּ\"ד שֶׁבְּסוֹף הַמִּילָה \"גְּנֻבְתִי\"?", "options": ["כְּמוֹ \"רַבָּתִי בַגּוֹיִם\", וּפֵירוּשׁוֹ: שֶׁנִּגְנְבָה", "לְשׁוֹן מְדַבֵּר: אֲנִי גְּנַבְתִּי בַּיּוֹם וּבַלַּיְלָה", "לְשׁוֹן נוֹכֵחַ: אַתָּה גָּנַבְתָּ מִמֶּנִּי"], "kasha": "\"גנבתי\" נשמע כאילו יעקב אומר שהוא עצמו גנב, וזה אינו מתאים.", "answer": "היו\"ד כמו ב\"רבתי בגוים שרתי במדינות\", \"מלאתי משפט\", \"אהבתי לדוש\".", "kp": ["כמו רבתי בגוים"]}]}, {"id": "31:40.1", "ch": 31, "v": 40, "n": 1, "dh": "אכלני חרב", "pasuk_html": "הָיִ֧יתִי בַיּ֛וֹם <mark>אֲכָלַ֥נִי חֹ֖רֶב</mark> וְקֶ֣רַח בַּלָּ֑יְלָה וַתִּדַּ֥ד שְׁנָתִ֖י מֵֽעֵינָֽי׃", "pasuk_en": "הָיִיתִי בַיּוֹם אֲכָלַנִי חֹרֶב וְקֶרַח בַּלָּיְלָה וַתִּדַּד שְׁנָתִי מֵעֵינָי׃", "rashi_he": "אכלני חרב. לְשׁוֹן אֵשׁ אֹכְלָה:", "rashi_en": "\"אכלני\" הוא לשון אכילת אש: החום השורף כילה את יעקב כמו אש אוכלת.", "note": "", "points": [{"q": "מַדּוּעַ אָמַר יַעֲקֹב עַל הַחוֹם \"אֲכָלַנִי\"?", "options": ["כְּמוֹ אֵשׁ אוֹכֶלֶת, כָּךְ הַחוֹם כִּילָּה אוֹתִי", "כִּי מֵרוֹב חוֹם לֹא יָכוֹלְתִּי לֶאֱכוֹל", "כִּי חַיּוֹת טֶרֶף אָכְלוּ מִן הַצֹּאן בַּיּוֹם"], "kasha": "לא מובן איך שייך לשון אכילה בחום.", "answer": "זהו לשון \"אש אכלה\" – החום כילה אותו כמו אש.", "kp": ["לשון אש אכלה"]}]}, {"id": "31:40.2", "ch": 31, "v": 40, "n": 2, "dh": "וקרח", "pasuk_html": "הָיִ֧יתִי בַיּ֛וֹם אֲכָלַ֥נִי חֹ֖רֶב <mark>וְקֶ֣רַח</mark> בַּלָּ֑יְלָה וַתִּדַּ֥ד שְׁנָתִ֖י מֵֽעֵינָֽי׃", "pasuk_en": "הָיִיתִי בַיּוֹם אֲכָלַנִי חֹרֶב וְקֶרַח בַּלָּיְלָה וַתִּדַּד שְׁנָתִי מֵעֵינָי׃", "rashi_he": "וקרח. כְּמוֹ מַשְׁלִיךְ קַרְחוֹ (תהילים קמ\"ז), תַּרְגּוּמוֹ גְּלִידָא:", "rashi_en": "\"קרח\" הוא קור וכפור, כמו \"משליך קרחו\", ותרגומו \"גלידא\".", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וְקֶרַח\" בְּדִבְרֵי יַעֲקֹב?", "options": ["קוֹר וְכַפּוֹר, כְּמוֹ \"מַשְׁלִיךְ קַרְחוֹ\"", "קָרַחַת, נְשִׁירַת שִׂיעָר מֵרוֹב צַעַר", "רָעָב וְחוֹסֶר מָזוֹן בַּלֵּילוֹת"], "kasha": "המילה \"קרח\" יכולה להתפרש כלשון קרחה, ואינה מובנת כאן.", "answer": "כמו \"משליך קרחו\", ותרגומו \"גלידא\".", "kp": ["וקרח", "כמו משליך קרחו"]}]}, {"id": "31:40.3", "ch": 31, "v": 40, "n": 3, "dh": "שנתי", "pasuk_html": "הָיִ֧יתִי בַיּ֛וֹם אֲכָלַ֥נִי חֹ֖רֶב וְקֶ֣רַח בַּלָּ֑יְלָה וַתִּדַּ֥ד <mark>שְׁנָתִ֖י</mark> מֵֽעֵינָֽי׃", "pasuk_en": "הָיִיתִי בַיּוֹם אֲכָלַנִי חֹרֶב וְקֶרַח בַּלָּיְלָה וַתִּדַּד שְׁנָתִי מֵעֵינָי׃", "rashi_he": "שנתי. לְשׁוֹן שֵׁנָה:", "rashi_en": "״שנתי״ הוא מלשון שינה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָה ״שְׁנָתִי״ בַּפָּסוּק?", "options": ["הַשֵּׁינָה שֶׁלִּי", "הַשָּׁנָה שֶׁלִּי", "הַשִּׁינּוּי שֶׁלִּי"], "kasha": "המילה ״שנתי״ יכולה להתפרש גם מלשון שנה.", "answer": "לשון שינה.", "kp": ["לשון שנה"]}]}, {"id": "31:41.1", "ch": 31, "v": 41, "n": 1, "dh": "ותחלף את משכרתי", "pasuk_html": "זֶה־לִּ֞י עֶשְׂרִ֣ים שָׁנָה֮ בְּבֵיתֶךָ֒ עֲבַדְתִּ֜יךָ אַרְבַּֽע־עֶשְׂרֵ֤ה שָׁנָה֙ בִּשְׁתֵּ֣י בְנֹתֶ֔יךָ וְשֵׁ֥שׁ שָׁנִ֖ים בְּצֹאנֶ֑ךָ <mark>וַתַּחֲלֵ֥ף אֶת־מַשְׂכֻּרְתִּ֖י</mark> עֲשֶׂ֥רֶת מֹנִֽים׃", "pasuk_en": "זֶה־לִּי עֶשְׂרִים שָׁנָה בְּבֵיתֶךָ עֲבַדְתִּיךָ אַרְבַּע־עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ וַתַּחֲלֵף אֶת־מַשְׂכֻּרְתִּי עֲשֶׂרֶת מֹנִים׃", "rashi_he": "ותחלף את משכרתי. הָיִיתָ מְשַׁנֶּה תְּנַאי שֶׁבֵּינֵינוּ, מִנָּקֹד לְטָלוּא, וּמֵעֲקוּדִים לִבְרֻדִּים:", "rashi_en": "יעקב אמר ללבן שהיה משנה כל הזמן את התנאי שביניהם: פעם נקודים ופעם טלואים, פעם עקודים ופעם ברודים.", "note": "", "points": [{"q": "בַּמֶּה הֶחֱלִיף לָבָן אֶת מַשְׂכּוֹרְתּוֹ שֶׁל יַעֲקֹב?", "options": ["שִׁינָּה אֶת הַתְּנַאי, מִנְּקוּדִים לִטְלוּאִים וּמֵעֲקוּדִים לִבְרוּדִים", "הוֹרִיד אֶת מִסְפַּר הַצֹּאן שֶׁהִבְטִיחַ לְיַעֲקֹב", "שִׁילֵּם לוֹ בְּכֶסֶף בִּמְקוֹם בְּצֹאן"], "kasha": "מה פירוש ״ותחלף את משכרתי״, הרי השכר היה צאן מסוים?", "answer": "היית משנה תנאי שבינינו, מנקוד לטלוא ומעקודים לברודים.", "kp": ["היית משנה תנאי שבינינו", "מנקד לטלוא, ומעקודים לברדים"]}]}, {"id": "31:42.1", "ch": 31, "v": 42, "n": 1, "dh": "ופחד יצחק", "pasuk_html": "לוּלֵ֡י אֱלֹהֵ֣י אָבִי֩ אֱלֹהֵ֨י אַבְרָהָ֜ם <mark>וּפַ֤חַד יִצְחָק֙</mark> הָ֣יָה לִ֔י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑נִי אֶת־עָנְיִ֞י וְאֶת־יְגִ֧יעַ כַּפַּ֛י רָאָ֥ה אֱלֹהִ֖ים וַיּ֥וֹכַח אָֽמֶשׁ׃", "pasuk_en": "לוּלֵי אֱלֹהֵי אָבִי אֱלֹהֵי אַבְרָהָם וּפַחַד יִצְחָק הָיָה לִי כִּי עַתָּה רֵיקָם שִׁלַּחְתָּנִי אֶת־עָנְיִי וְאֶת־יְגִיעַ כַּפַּי רָאָה אֱלֹהִים וַיּוֹכַח אָמֶשׁ׃", "rashi_he": "ופחד יצחק. לֹא רָצָה לוֹמַר אֱלֹהֵי יִצְחָק, שֶׁאֵין הַקָּבָּ\"ה מְיַחֵד שְׁמוֹ עַל הַצַּדִּיקִים בְּחַיֵּיהֶם, וְאַעַ\"פִּ שֶׁאָמַר לוֹ בְּצֵאתוֹ מִבְּאֵר שֶׁבַע אֲנִי ה' אֱלֹהֵי אַבְרָהָם אָבִיךָ וֵאלֹהֵי יִצְחָק, בִּשְׁבִיל שֶׁכָּהוּ עֵינָיו, וַהֲרֵי הוּא כַּמֵּת; יַעֲקֹב נִתְיָרֵא לוֹמַר אֱלֹהֵי, וְאָמַר וּפַחַד:", "rashi_en": "יעקב לא אמר \"אלהי יצחק\", כי ה' אינו מייחד שמו על הצדיקים בחייהם. ואף שה' עצמו אמר \"ואלהי יצחק\", זה היה מפני שעיני יצחק כהו והרי הוא כמת; ובכל זאת יעקב נתיירא לומר \"אלהי\" ואמר \"ופחד\".", "note": "", "points": [{"q": "מַדּוּעַ אָמַר יַעֲקֹב \"וּפַחַד יִצְחָק\" וְלֹא \"אֱלֹהֵי יִצְחָק\"?", "options": ["כִּי ה' אֵינוֹ מְיַיחֵד שְׁמוֹ עַל הַצַּדִּיקִים בְּחַיֵּיהֶם", "כִּי יִצְחָק יָרֵא מֵה' יוֹתֵר מֵאַבְרָהָם אָבִיו", "כִּי ה' עוֹד לֹא נִגְלָה לְיִצְחָק כְּמוֹ לְאַבְרָהָם"], "kasha": "מדוע אמר יעקב \"אלהי אברהם\" אבל \"ופחד יצחק\"?", "answer": "לא רצה לומר \"אלהי יצחק\", שאין הקב\"ה מייחד שמו על הצדיקים בחייהם, ולכן אמר \"ופחד\".", "kp": ["מיחד שמו על הצדיקים בחייהם"]}, {"q": "מַדּוּעַ ה' עַצְמוֹ אָמַר לְיַעֲקֹב \"וֵאלֹהֵי יִצְחָק\" כְּשֶׁיָּצָא מִבְּאֵר שֶׁבַע?", "options": ["כִּי עֵינֵי יִצְחָק כָּהוּ, וַהֲרֵי הוּא כְּמֵת", "כִּי בְּאוֹתָהּ שָׁעָה יִצְחָק כְּבָר נִפְטַר", "כִּי יַעֲקֹב בִּיקֵּשׁ מֵה' שֶׁיְּיַחֵד שְׁמוֹ עַל אָבִיו"], "kasha": "אם ה' אינו מייחד שמו על צדיקים בחייהם, איך אמר \"אני ה' אלהי אברהם אביך ואלהי יצחק\"?", "answer": "בשביל שכהו עיני יצחק, והרי הוא כמת; ובכל זאת יעקב נתיירא לומר \"אלהי\" ואמר \"ופחד\".", "kp": ["בשביל שכהו עיניו", "והרי הוא כמת"]}]}, {"id": "31:42.2", "ch": 31, "v": 42, "n": 2, "dh": "ויוכח", "pasuk_html": "לוּלֵ֡י אֱלֹהֵ֣י אָבִי֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּפַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑נִי אֶת־עָנְיִ֞י וְאֶת־יְגִ֧יעַ כַּפַּ֛י רָאָ֥ה אֱלֹהִ֖ים <mark>וַיּ֥וֹכַח</mark> אָֽמֶשׁ׃", "pasuk_en": "לוּלֵי אֱלֹהֵי אָבִי אֱלֹהֵי אַבְרָהָם וּפַחַד יִצְחָק הָיָה לִי כִּי עַתָּה רֵיקָם שִׁלַּחְתָּנִי אֶת־עָנְיִי וְאֶת־יְגִיעַ כַּפַּי רָאָה אֱלֹהִים וַיּוֹכַח אָמֶשׁ׃", "rashi_he": "ויוכח. לְשׁוֹן תּוֹכָחָה הוּא וְלֹא לְשׁוֹן הוֹכָחָה:", "rashi_en": "\"ויוכח\" היא לשון תוכחה, כלומר ה׳ נזף בלבן, ולא לשון הוכחה ובירור.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וַיּוֹכַח\" בְּדִבְרֵי יַעֲקֹב לְלָבָן?", "options": ["לְשׁוֹן תּוֹכֵחָה: ה׳ נָזַף בְּךָ אֶמֶשׁ", "לְשׁוֹן הוֹכָחָה: ה׳ בֵּירֵר וְהִכְרִיעַ מִי צוֹדֵק", "לְשׁוֹן עֵדוּת: ה׳ הֵעִיד שֶׁאֲנִי נֶאֱמָן"], "kasha": "\"ויוכח\" יכול להתפרש כבירור והכרעה, או כנזיפה.", "answer": "זו לשון תוכחה, ולא לשון הוכחה.", "kp": ["לשון תוכחה הוא"]}]}, {"id": "31:43.1", "ch": 31, "v": 43, "n": 1, "dh": "מה אעשה לאלה", "pasuk_html": "וַיַּ֨עַן לָבָ֜ן וַיֹּ֣אמֶר אֶֽל־יַעֲקֹ֗ב הַבָּנ֨וֹת בְּנֹתַ֜י וְהַבָּנִ֤ים בָּנַי֙ וְהַצֹּ֣אן צֹאנִ֔י וְכֹ֛ל אֲשֶׁר־אַתָּ֥ה רֹאֶ֖ה לִי־ה֑וּא וְלִבְנֹתַ֞י <mark>מָֽה־אֶֽעֱשֶׂ֤ה לָאֵ֙לֶּה֙</mark> הַיּ֔וֹם א֥וֹ לִבְנֵיהֶ֖ן אֲשֶׁ֥ר יָלָֽדוּ׃", "pasuk_en": "וַיַּעַן לָבָן וַיֹּאמֶר אֶל־יַעֲקֹב הַבָּנוֹת בְּנֹתַי וְהַבָּנִים בָּנַי וְהַצֹּאן צֹאנִי וְכֹל אֲשֶׁר־אַתָּה רֹאֶה לִי־הוּא וְלִבְנֹתַי מָה־אֶעֱשֶׂה לָאֵלֶּה הַיּוֹם אוֹ לִבְנֵיהֶן אֲשֶׁר יָלָדוּ׃", "rashi_he": "מה אעשה לאלה. אֵיךְ תַּעֲלֶה עַל לִבִּי לְהָרַע לָהֶן:", "rashi_en": "לבן אמר: איך יעלה על לבי להרע לבנותיי?", "note": "", "points": [{"q": "מָה הִתְכַּוֵּון לָבָן כְּשֶׁאָמַר שֶׁאֵינוֹ יָכוֹל לַעֲשׂוֹת דָּבָר 'לָאֵלֶּה'?", "options": ["אֵיךְ יַעֲלֶה עַל לִבִּי לְהָרַע לָהֶן", "מָה אוּכַל לָתֵת לָהֶן כְּמַתָּנָה", "אֵיךְ אוּכַל לְהַחֲזִיר אוֹתָן לְבֵיתִי"], "kasha": "מה פירוש שאלת לבן 'מה אעשה' לבנותיו?", "answer": "איך תעלה על לבי להרע להן.", "kp": ["איך תעלה על לבי להרע להן"]}]}, {"id": "31:44.1", "ch": 31, "v": 44, "n": 1, "dh": "והיה לעד", "pasuk_html": "וְעַתָּ֗ה לְכָ֛ה נִכְרְתָ֥ה בְרִ֖ית אֲנִ֣י וָאָ֑תָּה <mark>וְהָיָ֥ה לְעֵ֖ד</mark> בֵּינִ֥י וּבֵינֶֽךָ׃", "pasuk_en": "וְעַתָּה לְכָה נִכְרְתָה בְרִית אֲנִי וָאָתָּה וְהָיָה לְעֵד בֵּינִי וּבֵינֶךָ׃", "rashi_he": "והיה לעד. הַקָּבָּ\"ה:", "rashi_en": "העד על הברית בין יעקב ללבן הוא הקב\"ה.", "note": "", "points": [{"q": "מִי הוּא הָעֵד בַּבִּיטּוּי \"וְהָיָה לְעֵד\"?", "options": ["הַקָּב\"ה", "הַגַּל שֶׁהֵקִימוּ מֵאֲבָנִים", "אֲחֵי יַעֲקֹב שֶׁהָיוּ שָׁם"], "kasha": "הפסוק אינו מפרש מי יהיה לעד.", "answer": "הקב\"ה הוא העד.", "kp": ["הקב\"ה"]}]}, {"id": "31:46.1", "ch": 31, "v": 46, "n": 1, "dh": "לאחיו", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֤ב <mark>לְאֶחָיו֙</mark> לִקְט֣וּ אֲבָנִ֔ים וַיִּקְח֥וּ אֲבָנִ֖ים וַיַּֽעֲשׂוּ־גָ֑ל וַיֹּ֥אכְלוּ שָׁ֖ם עַל־הַגָּֽל׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב לְאֶחָיו לִקְטוּ אֲבָנִים וַיִּקְחוּ אֲבָנִים וַיַּעֲשׂוּ־גָל וַיֹּאכְלוּ שָׁם עַל־הַגָּל׃", "rashi_he": "לאחיו. הֵם בָּנָיו שֶׁהָיוּ לוֹ אַחִים, נִגָּשִׁים אֵלָיו לְצָרָה וּלְמִלְחָמָה (בראשית רבה):", "rashi_en": "\"אחיו\" הם בניו של יעקב, שהיו לו כאחים ועמדו לצידו בצרה ובמלחמה.", "note": "", "points": [{"q": "מִי הֵם \"אֶחָיו\" שֶׁל יַעֲקֹב בַּפָּסוּק?", "options": ["בָּנָיו, שֶׁעָמְדוּ לְצִידּוֹ כְּאַחִים בְּצָרָה וּבְמִלְחָמָה", "עֵשָׂו וּבְנֵי בֵיתוֹ, שֶׁבָּאוּ לִקְרָאתוֹ", "אַנְשֵׁי לָבָן, שֶׁהָיוּ קְרוֹבֵי מִשְׁפַּחְתּוֹ"], "kasha": "ליעקב לא היו שם אחים, ומי הם \"אחיו\"?", "answer": "הם בניו, שהיו לו כאחים, נגשים אליו לצרה ולמלחמה.", "kp": ["הם בניו שהיו לו אחים", "נגשים אליו לצרה ולמלחמה"]}]}, {"id": "31:47.1", "ch": 31, "v": 47, "n": 1, "dh": "יגר שהדותא", "pasuk_html": "וַיִּקְרָא־ל֣וֹ לָבָ֔ן <mark>יְגַ֖ר שָׂהֲדוּתָ֑א</mark> וְיַֽעֲקֹ֔ב קָ֥רָא ל֖וֹ גַּלְעֵֽד׃", "pasuk_en": "וַיִּקְרָא־לוֹ לָבָן יְגַר שָׂהֲדוּתָא וְיַעֲקֹב קָרָא לוֹ גַּלְעֵד׃", "rashi_he": "יגר שהדותא. תַּרְגּוּמוֹ שֶׁל גַּלְעֵד:", "rashi_en": "\"יגר שהדותא\" הוא התרגום הארמי של \"גלעד\"; לבן ויעקב קראו למקום אחד בשתי לשונות.", "note": "", "points": [{"q": "מַהוּ \"יְגַר שָׂהֲדוּתָא\"?", "options": ["תַּרְגּוּם אֲרָמִי שֶׁל \"גַּלְעֵד\"", "שֵׁם שֶׁל מָקוֹם אַחֵר, סָמוּךְ לַגִּלְעָד", "שֵׁם שֶׁל אֶחָד מֵאֱלִילֵי לָבָן"], "kasha": "לבן ויעקב קראו למקום בשמות שונים, ולא ברור מה הקשר ביניהם.", "answer": "\"יגר שהדותא\" הוא תרגומו של \"גלעד\".", "kp": ["תרגומו של גלעד"]}]}, {"id": "31:47.2", "ch": 31, "v": 47, "n": 2, "dh": "גלעד", "pasuk_html": "וַיִּקְרָא־ל֣וֹ לָבָ֔ן יְגַ֖ר שָׂהֲדוּתָ֑א וְיַֽעֲקֹ֔ב קָ֥רָא ל֖וֹ <mark>גַּלְעֵֽד׃</mark>", "pasuk_en": "וַיִּקְרָא־לוֹ לָבָן יְגַר שָׂהֲדוּתָא וְיַעֲקֹב קָרָא לוֹ גַּלְעֵד׃", "rashi_he": "גלעד. גַּל עֵד:", "rashi_en": "״גלעד״ מורכב משתי מילים: גל עד - גל של עדות.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַשֵּׁם ״גַּלְעֵד״ לְפִי רַשִׁ״י?", "options": ["גַּל עֵד - גַּל שֶׁל עֵדוּת", "הַר גָּבוֹהַּ וְתָלוּל", "מְקוֹם מַעְיְינוֹת וּמַיִם"], "kasha": "מה משמעות השם שקרא יעקב לגל?", "answer": "גלעד - גל עד.", "kp": ["גל עד"]}]}, {"id": "31:49.1", "ch": 31, "v": 49, "n": 1, "dh": "והמצפה אשר אמר וגו'", "pasuk_html": "<mark>וְהַמִּצְפָּה֙ אֲשֶׁ֣ר אָמַ֔ר</mark> יִ֥צֶף יְהוָ֖ה בֵּינִ֣י וּבֵינֶ֑ךָ כִּ֥י נִסָּתֵ֖ר אִ֥ישׁ מֵרֵעֵֽהוּ׃", "pasuk_en": "וְהַמִּצְפָּה אֲשֶׁר אָמַר יִצֶף יְהוָה בֵּינִי וּבֵינֶךָ כִּי נִסָּתֵר אִישׁ מֵרֵעֵהוּ׃", "rashi_he": "והמצפה אשר אמר וגו'. וְהַמִּצְפָּה אֲשֶׁר בְּהַר הַגִּלְעָד, כְּמוֹ שֶׁכָּתוּב וַיַּעֲבֹר אֶת מִצְפֵּה גִלְעָד (שופטים י\"א), וְלָמָּה נִקְרֵאת שְׁמָהּ מִצְפָּה? לְפִי שֶׁאָמַר אֶחָד מֵהֶם לַחֲבֵרוֹ, יִצֶף ה' בֵּינִי וּבֵינֶךָ אִם תַּעֲבֹר אֶת הַבְּרִית:", "rashi_en": "המצפה היא המקום שבהר הגלעד, הנזכר בספר שופטים. היא נקראה ״מצפה״ כי כל אחד אמר לחברו: יצפה ה׳ בינינו אם תעבור על הברית.", "note": "", "points": [{"q": "מַדּוּעַ נִקְרָא הַמָּקוֹם ״מִצְפָּה״?", "options": ["כָּל אֶחָד אָמַר לַחֲבֵרוֹ: יִצֶּף ה׳ בֵּינִי וּבֵינְךָ אִם תַּעֲבוֹר", "מִשּׁוּם שֶׁמִּשָּׁם אֶפְשָׁר לִצְפּוֹת לְמֶרְחוֹק עַל כָּל הַסְּבִיבָה", "מִשּׁוּם שֶׁיַּעֲקֹב צָפָה מִשָּׁם עַל מִשְׁפַּחְתּוֹ שֶׁעָבְרָה"], "kasha": "מהי ״המצפה״ ומה הקשר בין שמה למעשה?", "answer": "זו המצפה שבהר הגלעד, ונקראה כך לפי שאמר אחד מהם לחברו: יצף ה׳ ביני ובינך אם תעבור את הברית.", "kp": ["לפי שאמר אחד מהם לחברו", "יצף ה' ביני ובינך"]}]}, {"id": "31:49.2", "ch": 31, "v": 49, "n": 2, "dh": "כי נסתר", "pasuk_html": "וְהַמִּצְפָּה֙ אֲשֶׁ֣ר אָמַ֔ר יִ֥צֶף יְהוָ֖ה בֵּינִ֣י וּבֵינֶ֑ךָ <mark>כִּ֥י נִסָּתֵ֖ר</mark> אִ֥ישׁ מֵרֵעֵֽהוּ׃", "pasuk_en": "וְהַמִּצְפָּה אֲשֶׁר אָמַר יִצֶף יְהוָה בֵּינִי וּבֵינֶךָ כִּי נִסָּתֵר אִישׁ מֵרֵעֵהוּ׃", "rashi_he": "כי נסתר. וְלֹא נִרְאֶה אִישׁ אֶת רֵעֵהוּ:", "rashi_en": "\"כי נסתר\" פירושו: כאשר לא נראה זה את זה – ה' יצפה בינינו.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"כִּי נִסָּתֵר אִישׁ מֵרֵעֵהוּ\"?", "options": ["כַּאֲשֶׁר לֹא נִרְאֶה אִישׁ אֶת רֵעֵהוּ, כְּשֶׁנִּהְיֶה רְחוֹקִים", "כַּאֲשֶׁר אֶחָד מֵאִיתָּנוּ יַסְתִּיר דָּבָר מֵחֲבֵרוֹ", "כִּי כָּל אֶחָד מֵאִיתָּנוּ יִתְחַבֵּא מִפְּנֵי חֲבֵרוֹ"], "kasha": "באיזה מובן יהיו לבן ויעקב \"נסתרים\" זה מזה?", "answer": "ולא נראה איש את רעהו.", "kp": ["ולא נראה איש את רעהו"]}]}, {"id": "31:50.1", "ch": 31, "v": 50, "n": 1, "dh": "בנתי", "pasuk_html": "אִם־תְּעַנֶּ֣ה אֶת־<mark>בְּנֹתַ֗י</mark> וְאִם־תִּקַּ֤ח נָשִׁים֙ עַל־בְּנֹתַ֔י אֵ֥ין אִ֖ישׁ עִמָּ֑נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥י וּבֵינֶֽךָ׃", "pasuk_en": "אִם־תְּעַנֶּה אֶת־בְּנֹתַי וְאִם־תִּקַּח נָשִׁים עַל־בְּנֹתַי אֵין אִישׁ עִמָּנוּ רְאֵה אֱלֹהִים עֵד בֵּינִי וּבֵינֶךָ׃", "rashi_he": "בנתי, בנתי. שְׁתֵּי פְעָמִים, אַף בִּלְהָה וְזִלְפָּה בְּנוֹתָיו הָיוּ מִפִּילֶגֶשׁ:", "rashi_en": "המילה \"בנתי\" נאמרה פעמיים, כי גם בלהה וזלפה היו בנותיו של לבן מפילגש.", "note": "", "points": [{"q": "מַדּוּעַ אוֹמֵר לָבָן \"בְּנֹתַי\" פַּעֲמַיִים בַּפָּסוּק?", "options": ["כִּי גַּם בִּלְהָה וְזִלְפָּה הָיוּ בְּנוֹתָיו מִפִּילֶגֶשׁ", "כְּדֵי לְהַדְגִּישׁ אֶת אַהֲבָתוֹ הַגְּדוֹלָה לִבְנוֹתָיו", "כִּי פַּעַם אַחַת עַל לֵאָה וּפַעַם אַחַת עַל רָחֵל"], "kasha": "היה די לומר \"בנתי\" פעם אחת, ולמה נכפלה המילה?", "answer": "שתי פעמים נאמר, כי אף בלהה וזלפה היו בנותיו מפילגש.", "kp": ["אף בלהה וזלפה בנותיו היו מפילגש"]}]}, {"id": "31:50.2", "ch": 31, "v": 50, "n": 2, "dh": "אם תענה את בנתי", "pasuk_html": "<mark>אִם־תְּעַנֶּ֣ה אֶת־בְּנֹתַ֗י</mark> וְאִם־תִּקַּ֤ח נָשִׁים֙ עַל־בְּנֹתַ֔י אֵ֥ין אִ֖ישׁ עִמָּ֑נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥י וּבֵינֶֽךָ׃", "pasuk_en": "אִם־תְּעַנֶּה אֶת־בְּנֹתַי וְאִם־תִּקַּח נָשִׁים עַל־בְּנֹתַי אֵין אִישׁ עִמָּנוּ רְאֵה אֱלֹהִים עֵד בֵּינִי וּבֵינֶךָ׃", "rashi_he": "אם תענה את בנתי. לִמְנֹע מֵהֶן עוֹנַת תַּשְׁמִישׁ (יומא ע\"ז):", "rashi_en": "לבן מזהיר את יעקב שלא יענה את בנותיו בכך שימנע מהן עונת תשמיש.", "note": "", "points": [{"q": "מַהוּ הָעִינּוּי שֶׁלָּבָן חָשַׁשׁ מִמֶּנּוּ לְפִי רַשִׁ\"י?", "options": ["שֶׁיִּמְנַע מֵהֶן עוֹנַת תַּשְׁמִישׁ", "שֶׁיַּעֲבִידָן בַּעֲבוֹדָה קָשָׁה בַּשָּׂדֶה", "שֶׁיִּמְנַע מֵהֶן מָזוֹן וּבְגָדִים"], "kasha": "באיזה עינוי מדובר, הרי לקיחת נשים נוספות נזכרה בנפרד?", "answer": "למנוע מהן עונת תשמיש.", "kp": ["למנע מהן עונת תשמיש"]}]}, {"id": "31:51.1", "ch": 31, "v": 51, "n": 1, "dh": "יריתי", "pasuk_html": "וַיֹּ֥אמֶר לָבָ֖ן לְיַעֲקֹ֑ב הִנֵּ֣ה ׀ הַגַּ֣ל הַזֶּ֗ה וְהִנֵּה֙ הַמַצֵּבָ֔ה אֲשֶׁ֥ר <mark>יָרִ֖יתִי</mark> בֵּינִ֥י וּבֵינֶֽךָ׃", "pasuk_en": "וַיֹּאמֶר לָבָן לְיַעֲקֹב הִנֵּה הַגַּל הַזֶּה וְהִנֵּה הַמַצֵּבָה אֲשֶׁר יָרִיתִי בֵּינִי וּבֵינֶךָ׃", "rashi_he": "יריתי. כְּמוֹ יָרָה בַיָּם, כְּזֶה שֶׁהוּא יוֹרֶה הַחֵץ:", "rashi_en": "\"יריתי\" הוא לשון השלכה, כמו \"ירה בים\", כאדם שיורה חץ.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"יָרִיתִי\" לְפִי רַשִׁ\"י?", "options": ["הִשְׁלַכְתִּי, כְּמוֹ \"יָרָה בַיָּם\" וְכַיּוֹרֶה חֵץ", "לִימַּדְתִּי וְהוֹרֵיתִי, מִלְּשׁוֹן הוֹרָאָה", "פָּחַדְתִּי, מִלְּשׁוֹן יִרְאָה"], "kasha": "המילה \"יריתי\" אינה מתאימה במבט ראשון להקמת גל ומצבה.", "answer": "כמו \"ירה בים\", כזה שהוא יורה החץ.", "kp": ["כמו ירה בים"]}]}, {"id": "31:52.1", "ch": 31, "v": 52, "n": 1, "dh": "אם אני", "pasuk_html": "עֵ֚ד הַגַּ֣ל הַזֶּ֔ה וְעֵדָ֖ה הַמַּצֵּבָ֑ה <mark>אִם־אָ֗נִי</mark> לֹֽא־אֶֽעֱבֹ֤ר אֵלֶ֙יךָ֙ אֶת־הַגַּ֣ל הַזֶּ֔ה וְאִם־אַ֠תָּה לֹא־תַעֲבֹ֨ר אֵלַ֜י אֶת־הַגַּ֥ל הַזֶּ֛ה וְאֶת־הַמַּצֵּבָ֥ה הַזֹּ֖את לְרָעָֽה׃", "pasuk_en": "עֵד הַגַּל הַזֶּה וְעֵדָה הַמַּצֵּבָה אִם־אָנִי לֹא־אֶעֱבֹר אֵלֶיךָ אֶת־הַגַּל הַזֶּה וְאִם־אַתָּה לֹא־תַעֲבֹר אֵלַי אֶת־הַגַּל הַזֶּה וְאֶת־הַמַּצֵּבָה הַזֹּאת לְרָעָה׃", "rashi_he": "אם אני. הֲרֵי אִם מְשַׁמֵּשׁ בִּלְשׁוֹן אֲשֶׁר, כְּמוֹ עַד אִם דִּבַּרְתִּי דְּבָרָי:", "rashi_en": "המילה \"אם\" כאן משמשת במובן \"אשר\" (ש-), כמו \"עד אם דברתי דברי\".", "note": "", "points": [{"q": "מָה מַשְׁמָעוּת הַמִּילָה \"אִם־\" בְּמִילִּים \"אִם־אָנִי לֹא־אֶעֱבֹר\"?", "options": ["\"אֲשֶׁר\" – כְּלוֹמַר: שֶׁאֲנִי לֹא אֶעֱבוֹר", "לְשׁוֹן תְּנַאי – אִם אֶעֱבוֹר, אָז יִיעָנֵשׁ", "לְשׁוֹן שְׁאֵלָה – הַאִם אֲנִי אֶעֱבוֹר?"], "kasha": "\"אם\" בלשון תנאי אינו מתאים כאן, כי חסר המשך שיאמר מה יקרה.", "answer": "\"אם\" משמש כאן בלשון \"אשר\", כמו \"עד אם דברתי דברי\".", "kp": ["הרי אם משמש בלשון אשר"]}]}, {"id": "31:52.2", "ch": 31, "v": 52, "n": 2, "dh": "לרעה", "pasuk_html": "עֵ֚ד הַגַּ֣ל הַזֶּ֔ה וְעֵדָ֖ה הַמַּצֵּבָ֑ה אִם־אָ֗נִי לֹֽא־אֶֽעֱבֹ֤ר אֵלֶ֙יךָ֙ אֶת־הַגַּ֣ל הַזֶּ֔ה וְאִם־אַ֠תָּה לֹא־תַעֲבֹ֨ר אֵלַ֜י אֶת־הַגַּ֥ל הַזֶּ֛ה וְאֶת־הַמַּצֵּבָ֥ה הַזֹּ֖את <mark>לְרָעָֽה׃</mark>", "pasuk_en": "עֵד הַגַּל הַזֶּה וְעֵדָה הַמַּצֵּבָה אִם־אָנִי לֹא־אֶעֱבֹר אֵלֶיךָ אֶת־הַגַּל הַזֶּה וְאִם־אַתָּה לֹא־תַעֲבֹר אֵלַי אֶת־הַגַּל הַזֶּה וְאֶת־הַמַּצֵּבָה הַזֹּאת לְרָעָה׃", "rashi_he": "לרעה. לְרָעָה אִי אַתָּה עוֹבֵר, אַבָל אַתָּה עוֹבֵר לִפְרַקְמַטְיָה:", "rashi_en": "אסור לעבור את הגל כדי להרע, אבל מותר לעבור לצורך מסחר.", "note": "", "points": [{"q": "מָה מְלַמֶּדֶת הַמִּילָּה \"לְרָעָה\"?", "options": ["שֶׁאָסוּר לַעֲבוֹר אֶת הַגַּל רַק כְּדֵי לְהָרַע, אֲבָל לִסְחוֹרָה מוּתָּר", "שֶׁאָסוּר לַעֲבֹור אֶת הַגַּל בְּשׁוּם אוֹפֶן", "שֶׁמּוּתָּר לַעֲבֹור אֶת הַגַּל רַק כְּדֵי לְבַקֵּר אֶת הַבָּנוֹת"], "kasha": "אם אסור לעבור את הגל, מדוע הוסיף \"לרעה\"?", "answer": "לרעה אי אתה עובר, אבל אתה עובר לפרקמטיא (לסחורה).", "kp": ["לרעה אי אתה עובר", "אבל אתה עובר לפרקמטיה"]}]}, {"id": "31:53.1", "ch": 31, "v": 53, "n": 1, "dh": "אלהי אברהם", "pasuk_html": "<mark>אֱלֹהֵ֨י אַבְרָהָ֜ם</mark> וֵֽאלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔ינוּ אֱלֹהֵ֖י אֲבִיהֶ֑ם וַיִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּפַ֖חַד אָבִ֥יו יִצְחָֽק׃", "pasuk_en": "אֱלֹהֵי אַבְרָהָם וֵאלֹהֵי נָחוֹר יִשְׁפְּטוּ בֵינֵינוּ אֱלֹהֵי אֲבִיהֶם וַיִּשָּׁבַע יַעֲקֹב בְּפַחַד אָבִיו יִצְחָק׃", "rashi_he": "אלהי אברהם. קֹדֶשׁ (בראשית רבה):", "rashi_en": "המילים ״אלהי אברהם״ הן שם קודש.", "note": "", "points": [{"q": "הַאִם ״אֱלֹהֵי אַבְרָהָם״ בְּדִבְרֵי לָבָן הוּא שֵׁם קוֹדֶשׁ אוֹ חוֹל?", "options": ["קוֹדֶשׁ", "חוֹל, כְּמוֹ אֱלֹהֵי נָחוֹר", "סָפֵק, וְלָכֵן אֵינוֹ נִמְחָק"], "kasha": "לבן מזכיר גם את ״אלהי נחור״, שאינו קודש; האם גם ״אלהי אברהם״ הוא חול?", "answer": "״אלהי אברהם״ - קודש.", "kp": ["קדש"]}]}, {"id": "31:53.2", "ch": 31, "v": 53, "n": 2, "dh": "ואלהי נחור", "pasuk_html": "אֱלֹהֵ֨י אַבְרָהָ֜ם <mark>וֵֽאלֹהֵ֤י נָחוֹר֙</mark> יִשְׁפְּט֣וּ בֵינֵ֔ינוּ אֱלֹהֵ֖י אֲבִיהֶ֑ם וַיִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּפַ֖חַד אָבִ֥יו יִצְחָֽק׃", "pasuk_en": "אֱלֹהֵי אַבְרָהָם וֵאלֹהֵי נָחוֹר יִשְׁפְּטוּ בֵינֵינוּ אֱלֹהֵי אֲבִיהֶם וַיִּשָּׁבַע יַעֲקֹב בְּפַחַד אָבִיו יִצְחָק׃", "rashi_he": "ואלהי נחור. חֹל:", "rashi_en": "המילה ״אלהי״ אצל נחור היא חול, כלומר הכוונה לעבודה זרה ולא לה׳.", "note": "", "points": [{"q": "מָה מַשְׁמָעוּת הַמִּילָּה ״אֱלֹהֵי״ בְּצֵירוּף ״וֵאלֹהֵי נָחוֹר״?", "options": ["חוֹל: הַכַּוָּונָה לַעֲבוֹדָה זָרָה", "קוֹדֶשׁ: הַכַּוָּונָה לַה׳ כְּמוֹ אֵצֶל אַבְרָהָם", "לְשׁוֹן שׁוֹפְטִים וְדַיָּינִים שֶׁל נָחוֹר"], "kasha": "הפסוק מזכיר ״אלהי אברהם ואלהי נחור״ יחד, האם שניהם קודש?", "answer": "״ואלהי נחור״ - חול.", "kp": ["חל"]}]}, {"id": "31:53.3", "ch": 31, "v": 53, "n": 3, "dh": "אלהי אביהם", "pasuk_html": "אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽאלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔ינוּ <mark>אֱלֹהֵ֖י אֲבִיהֶ֑ם</mark> וַיִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּפַ֖חַד אָבִ֥יו יִצְחָֽק׃", "pasuk_en": "אֱלֹהֵי אַבְרָהָם וֵאלֹהֵי נָחוֹר יִשְׁפְּטוּ בֵינֵינוּ אֱלֹהֵי אֲבִיהֶם וַיִּשָּׁבַע יַעֲקֹב בְּפַחַד אָבִיו יִצְחָק׃", "rashi_he": "אלהי אביהם. חֹל:", "rashi_en": "המילה \"אלהי\" במילים \"אלהי אביהם\" היא חול, ואינה שם קודש.", "note": "", "points": [{"q": "מָה טִיבָהּ שֶׁל הַמִּילָּה \"אֱלֹהֵי\" בְּמִילִּים \"אֱלֹהֵי אֲבִיהֶם\"?", "options": ["חוֹל – אֵינָהּ שֵׁם קוֹדֶשׁ", "קוֹדֶשׁ – הַכַּוָּונָה לַה' אֱלֹהֵי אַבְרָהָם", "שׁוֹפְטִים – הַדַּיָּינִים שֶׁל מִשְׁפַּחְתָּם"], "kasha": "האם \"אלהי אביהם\" הוא שם קודש, כמו \"אלהי אברהם\" הסמוך לו?", "answer": "\"אלהי אביהם\" – חול.", "kp": ["חל"]}]}, {"id": "31:54.1", "ch": 31, "v": 54, "n": 1, "dh": "ויזבח יעקב זבח", "pasuk_html": "<mark>וַיִּזְבַּ֨ח יַעֲקֹ֥ב זֶ֙בַח֙</mark> בָּהָ֔ר וַיִּקְרָ֥א לְאֶחָ֖יו לֶאֱכָל־לָ֑חֶם וַיֹּ֣אכְלוּ לֶ֔חֶם וַיָּלִ֖ינוּ בָּהָֽר׃", "pasuk_en": "וַיִּזְבַּח יַעֲקֹב זֶבַח בָּהָר וַיִּקְרָא לְאֶחָיו לֶאֱכָל־לָחֶם וַיֹּאכְלוּ לֶחֶם וַיָּלִינוּ בָּהָר׃", "rashi_he": "ויזבח יעקב זבח. שָׁחַט בְּהֵמוֹת לְמִשְׁתֶּה:", "rashi_en": "יעקב שחט בהמות כדי לערוך סעודה.", "note": "", "points": [{"q": "מָה הָיָה הַ\"זֶבַח\" שֶׁזָּבַח יַעֲקֹב בָּהָר?", "options": ["שְׁחִיטַת בְּהֵמוֹת לִסְעוּדָה", "קָרְבַּן עוֹלָה לַה׳ עַל הַהַצָּלָה מִלָּבָן", "קָרְבַּן שְׁלָמִים לִכְבוֹד הַבְּרִית"], "kasha": "\"זבח\" נשמע כקרבן, אבל בהמשך מדובר על אכילת לחם עם אחיו.", "answer": "שחט בהמות למשתה.", "kp": ["שחט בהמות למשתה"]}]}, {"id": "31:54.2", "ch": 31, "v": 54, "n": 2, "dh": "לאחיו", "pasuk_html": "וַיִּזְבַּ֨ח יַעֲקֹ֥ב זֶ֙בַח֙ בָּהָ֔ר וַיִּקְרָ֥א <mark>לְאֶחָ֖יו</mark> לֶאֱכָל־לָ֑חֶם וַיֹּ֣אכְלוּ לֶ֔חֶם וַיָּלִ֖ינוּ בָּהָֽר׃", "pasuk_en": "וַיִּזְבַּח יַעֲקֹב זֶבַח בָּהָר וַיִּקְרָא לְאֶחָיו לֶאֱכָל־לָחֶם וַיֹּאכְלוּ לֶחֶם וַיָּלִינוּ בָּהָר׃", "rashi_he": "לאחיו. לְאוֹהֲבָיו שֶׁעִם לָבָן:", "rashi_en": "'אחיו' כאן הם אוהביו של יעקב שהיו עם לבן.", "note": "", "points": [{"q": "מִי הֵם 'אֶחָיו' שֶׁיַּעֲקֹב קָרָא לָהֶם לֶאֱכוֹל לָחֶם?", "options": ["אוֹהֲבָיו שֶׁהָיוּ עִם לָבָן", "בָּנָיו שֶׁנּוֹלְדוּ לוֹ בְּחָרָן", "אֶחָיו עֵשָׂו וַאֲנָשָׁיו"], "kasha": "ליעקב לא היו שם אחים, ומי הם 'אחיו'?", "answer": "לאוהביו שעם לבן.", "kp": ["לאוהביו שעם לבן"]}]}, {"id": "31:54.3", "ch": 31, "v": 54, "n": 3, "dh": "לאכל לחם", "pasuk_html": "וַיִּזְבַּ֨ח יַעֲקֹ֥ב זֶ֙בַח֙ בָּהָ֔ר וַיִּקְרָ֥א לְאֶחָ֖יו <mark>לֶאֱכָל־לָ֑חֶם</mark> וַיֹּ֣אכְלוּ לֶ֔חֶם וַיָּלִ֖ינוּ בָּהָֽר׃", "pasuk_en": "וַיִּזְבַּח יַעֲקֹב זֶבַח בָּהָר וַיִּקְרָא לְאֶחָיו לֶאֱכָל־לָחֶם וַיֹּאכְלוּ לֶחֶם וַיָּלִינוּ בָּהָר׃", "rashi_he": "לאכל לחם. כָּל דְּבַר מַאֲכָל קָרוּי לֶחֶם, כְּמוֹ עֲבַד לְחֶם רַב (דניאל ה'), נַשְׁחִיתָה עֵץ בְּלַחְמוֹ (ירמיהו י\"א):", "rashi_en": "כל מאכל נקרא לחם, כמו \"עבד לחם רב\" ו\"נשחיתה עץ בלחמו\".", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"לָחֶם\" בַּפָּסוּק לְפִי רַשִׁ\"י?", "options": ["כָּל מַאֲכָל, וְלֹא דַּוְוקָא לֶחֶם", "לֶחֶם בִּלְבַד, בְּלִי בְּשַׂר הַזֶּבַח", "לֶחֶם מַצּוֹת שֶׁהוּקְרַב עִם הַזֶּבַח"], "kasha": "יעקב זבח זבח והם אכלו בשר, ומדוע נאמר \"לחם\"?", "answer": "כל דבר מאכל קרוי לחם, כמו \"עבד לחם רב\", \"נשחיתה עץ בלחמו\".", "kp": ["כל דבר מאכל קרוי לחם"]}]}, {"id": "32:2.1", "ch": 32, "v": 2, "n": 1, "dh": "ויפגעו בו מלאכי אלהים", "pasuk_html": "וְיַעֲקֹ֖ב הָלַ֣ךְ לְדַרְכּ֑וֹ <mark>וַיִּפְגְּעוּ־ב֖וֹ מַלְאֲכֵ֥י אֱלֹהִֽים׃</mark>", "pasuk_en": "וְיַעֲקֹב הָלַךְ לְדַרְכּוֹ וַיִּפְגְּעוּ־בוֹ מַלְאֲכֵי אֱלֹהִים׃", "rashi_he": "ויפגעו בו מלאכי אלהים. מַלְאָכִים שֶׁל אֶרֶץ יִשְׂרָאֵל בָּאוּ לִקְרָאתוֹ לְלַוּוֹתוֹ לָאָרֶץ:", "rashi_en": "מלאכים של ארץ ישראל באו לקראת יעקב כדי ללוותו לארץ.", "note": "", "points": [{"q": "אֵילוּ מַלְאָכִים פָּגְשׁוּ אֶת יַעֲקֹב, וּלְשֵׁם מָה?", "options": ["מַלְאֲכֵי אֶרֶץ יִשְׂרָאֵל, שֶׁבָּאוּ לְלַוּוֹתוֹ לָאָרֶץ", "מַלְאֲכֵי חוּץ לָאָרֶץ, שֶׁבָּאוּ לְהִיפָּרֵד מִמֶּנּוּ", "מַלְאָכִים שֶׁשָּׁלַח ה' לְהִילָּחֵם בְּעֵשָׂו"], "kasha": "לא מבואר מי היו המלאכים ומה הייתה מטרת פגישתם עם יעקב.", "answer": "מלאכים של ארץ ישראל באו לקראתו ללוותו לארץ.", "kp": ["מלאכים של ארץ ישראל", "ללוותו לארץ"]}]}, {"id": "32:3.1", "ch": 32, "v": 3, "n": 1, "dh": "מחנים", "pasuk_html": "וַיֹּ֤אמֶר יַעֲקֹב֙ כַּאֲשֶׁ֣ר רָאָ֔ם מַחֲנֵ֥ה אֱלֹהִ֖ים זֶ֑ה וַיִּקְרָ֛א שֵֽׁם־הַמָּק֥וֹם הַה֖וּא <mark>מַֽחֲנָֽיִם׃</mark> (פ)", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב כַּאֲשֶׁר רָאָם מַחֲנֵה אֱלֹהִים זֶה וַיִּקְרָא שֵׁם־הַמָּקוֹם הַהוּא מַחֲנָיִם׃", "rashi_he": "מחנים. שְׁתֵּי מַחֲנוֹת, שֶׁל חוּצָה לָאָרֶץ שֶׁבָּאוּ עִמּוֹ עַד כָּאן וְשֶׁל אֶרֶץ יִשְׂרָאֵל שֶׁבָּאוּ לִקְרָאתוֹ (ע' תנחומא פ' וישלח):", "rashi_en": "\"מחנים\" הם שני מחנות של מלאכים: מלאכי חוץ לארץ שליוו את יעקב עד כאן, ומלאכי ארץ ישראל שבאו לקראתו.", "note": "", "points": [{"q": "אֵילּוּ שְׁנֵי מַחֲנוֹת נִרְמָזִים בְּשֵׁם \"מַחֲנָיִם\"?", "options": ["מַלְאֲכֵי חוּץ לָאָרֶץ שֶׁלִּיוָּוּהוּ וּמַלְאֲכֵי אֶרֶץ יִשְׂרָאֵל שֶׁבָּאוּ לִקְרָאתוֹ", "מַחֲנֵה יַעֲקֹב וּמַחֲנֵה לָבָן שֶׁנִּפְרְדוּ שָׁם", "מַחֲנֵה יַעֲקֹב וּמַחֲנֵה עֵשָׂו שֶׁבָּא לִקְרָאתוֹ"], "kasha": "יעקב ראה \"מחנה אלהים\" אחד, ומדוע קרא למקום בלשון זוגית \"מחנים\"?", "answer": "שתי מחנות: של חוצה לארץ שבאו עמו עד כאן, ושל ארץ ישראל שבאו לקראתו.", "kp": ["של חוצה לארץ שבאו עמו", "ושל ארץ ישראל שבאו לקראתו"]}]}];
const EN = {"28:10.1":{"e":"The Torah returns to say that Yaakov left, because in the middle of his story it interrupted to tell that Eisav went to Yishmael, since the daughters of Canaan were evil in Yitzchak's eyes. When it finished Eisav's story, it returned to the original subject.","pe":"Yaakov left Beer Sheva and went toward Charan.","re":"Yaakov left. Since it was due to the fact that the daughters of Canaan were evil in the eyes of his father, Yitzchok that Eisov went to Yishmael, [Scripture] interrupted the narrative of Yaakov and wrote: “Eisov saw that [Yitzchok] blessed, etc.” when it finished [the account of Eisov’s marriage] it went back to the previous subject.","p":[{"q":"Why does the Torah again say \"ויצא יעקב\", although it was already told that Yaakov was sent to Padan Aram?","o":["Because it interrupted to tell about Eisav, and now returns to Yaakov's story","Because this is a second departure of Yaakov from Be'er Sheva","Because earlier it told only of the decision to send him"]}]},"28:10.2":{"e":"It would have sufficed to write that Yaakov went to Charan, and the Torah mentions his departure from Be'er Sheva as well to teach that the departure of a righteous person from a city leaves an impression: while he is there he is its splendor, its radiance and its glory, and when he leaves, all of these are gone.","pe":"Yaakov left Beer Sheva and went toward Charan.","re":"[Yaakov] left. It had only to be written: “And Yaakov went to Charan.” Why, then, mention his departing? But, this tells us that the departure of a righteous person from his place makes an impression, for while a righteous person is in the city, he is its glory, he is its brilliance, he is its splendor. Once he has left there, its glory has departed, its brilliance has departed, its splendor has departed. Similarly, [this applies to the verse] “And she left the place,” which is written concerning Naomi and Ruth.","p":[{"q":"Why did the Torah mention \"ויצא יעקב מבאר שבע\" and not write only \"וילך חרנה\"?","o":["To teach that the departure of a righteous person from a place leaves an impression","To teach that Yaakov fled from Be'er Sheva secretly","To teach that Be'er Sheva was a place of prayer for his forefathers"]},{"q":"According to Rashi, what happens to a city when the righteous person leaves it?","o":["Its splendor, radiance and glory depart from it","Its inhabitants are punished for not detaining him","It loses the blessing in its livelihood"]}]},"28:10.3":{"e":"Rashi explains that Yaakov had not yet arrived in Charan, but had set out on his way to go there.","pe":"Yaakov left Beer Sheva and went toward Charan.","re":"And went toward Charan. [Means:] he left in order to go to Charan.","p":[{"q":"What does \"וילך חרנה\" mean according to Rashi?","o":["He set out on the road to go to Charan, and had not yet arrived","He arrived in Charan at the end of that day","He returned to Charan after staying some time in Be'er Sheva"]}]},"28:11.1":{"e":"The verse says \"ba-makom\" with the definite article and does not specify which place, because it means the well-known place already mentioned in the Torah: Har HaMoriah, about which the Akeidah says, \"and he saw the place from afar.\"","pe":"He reached the place and spent the night there because the sun had set. He took some of the stones of that place, and arranged them around his head, and lay down [to sleep] in that place.","re":"He reached the place. Scripture does not identify which place but, [it refers to] the place mentioned elsewhere, which is Mount Moriah, about which it is said, “And saw the place from afar.”","p":[{"q":"Which place does the verse mean by the words \"ויפגע במקום\"?","o":["Har HaMoriah, the place mentioned in the Akeidah of Yitzchak","Charan, the place Yaakov was heading to","Be'er Sheva, the place Yaakov left from"]}]},"28:11.2":{"e":"On the simple level, \"vayifga\" means he arrived. Our Sages explained it as an expression of prayer, and learned from here that Yaakov instituted the evening prayer. The reason it does not say \"vayitpalel\" is to teach that the earth jumped for him.","pe":"He reached the place and spent the night there because the sun had set. He took some of the stones of that place, and arranged them around his head, and lay down [to sleep] in that place.","re":"He reached. As in, “And it reached Jericho,” [or] “And it reached Dabashes.” The Sages explained it as a term for prayer, as in, “Do not entreat me,” and we learn from this that he established the Evening Prayer [עַרְבִית] Scripture used an alternate [word] and did not write וַיִתְפַּלֵל to teach you [also] that “The earth shrank for him” as is explained in the chapter Gid Hanosheh.","p":[{"q":"According to our Sages, what do we learn from the word \"ויפגע\"?","o":["That Yaakov instituted the evening prayer","That Yaakov met angels at the place","That Yaakov stumbled on a stone on the way"]},{"q":"Why did the Torah write \"ויפגע\" and not \"ויתפלל\"?","o":["To teach that the earth jumped for him","To teach that he prayed silently","To teach that his prayer was short"]}]},"28:11.3":{"e":"The Torah did not write \"the sun set and he lodged there,\" but \"he lodged there because the sun had set.\" From this we learn that the sun set suddenly, before its time, so that Yaakov would stay overnight in this place.","pe":"He reached the place and spent the night there because the sun had set. He took some of the stones of that place, and arranged them around his head, and lay down [to sleep] in that place.","re":"Because the sun has set. It should have said “And the sun set” and he “spent the night there.” “Because the sun has set” implies that the sun set suddenly for him not at its appointed time so that he should stay there overnight.","p":[{"q":"What does Rashi learn from the verse saying that Yaakov lodged there because the sun had set?","o":["That the sun set suddenly, not at its time, so that he would lodge there","That Yaakov always used to sleep right at sunset","That Yaakov was afraid to travel at night because of wild animals"]}]},"28:11.4":{"e":"Yaakov arranged several stones around his head to protect himself from wild animals. The stones quarreled with each other over which one the righteous man would rest his head on, and Hashem made them into one stone.","pe":"He reached the place and spent the night there because the sun had set. He took some of the stones of that place, and arranged them around his head, and lay down [to sleep] in that place.","re":"And arranged them around his head. He made them in the form of a drainpipe around his head out of fear of wild animals. They began to argue with one another; this one saying, “Let the righteous one place his head on me” and another one saying, “Let him place [it] on me.” God immediately, made them into one stone. This is the reason for what is said, “And he took the stone that he had placed at his head.”","p":[{"q":"Why did Yaakov arrange the stones around his head?","o":["To protect himself from wild animals","To make it more comfortable to sleep","To build an altar before sleeping"]},{"q":"How does Rashi resolve the contradiction between 'from the stones of the place' and 'the stone' mentioned afterward?","o":["The stones quarreled over which would be under the tzaddik's head, and Hashem made them one stone","In the morning Yaakov chose one of them and threw away the rest","Yaakov first took one stone and added more stones to it during the night"]}]},"28:11.5":{"e":"The word \"ha-hu\" comes to limit: only in that place did Yaakov lie down to sleep, but during the fourteen years he studied in the house of Ever he did not lie down at night, because he was occupied with Torah.","pe":"He reached the place and spent the night there because the sun had set. He took some of the stones of that place, and arranged them around his head, and lay down [to sleep] in that place.","re":"And lay down [to sleep] in that place. [הַהוּא] is an exclusory term, [i.e.,] in that place he lay down. But, for the fourteen years that he studied in the house of Eiver he did not lay down at night, for he was involved in the study of Torah.","p":[{"q":"What does Rashi learn from the words \"במקום ההוא\"?","o":["That only there did he lie down, but in the years he studied in the house of Ever he did not lie down at night","That this place was where Yitzchak was bound on the altar","That in that place Yaakov lay down on all the nights of his journey to Charan"]}]},"28:12.1":{"e":"The angels that accompanied Yaakov in Eretz Yisrael do not leave the Land, so they first went up to heaven, and afterward the angels of outside the Land came down to accompany him.","pe":"He dreamed, and behold a ladder was set up on the earth and the top of it reached toward heaven; and behold angels of Elohim were ascending and descending on it.","re":"Ascending and descending. It states עוֹלִים —ascending first and יוֹרְדִים —descend_ ing afterwards. Those angels that accompanied him in Eretz Yisrael do not go outside of Eretz Yisrael and ascended to heaven. [Then] the angels of outside of Eretz Yisrael descended to accompany him.","p":[{"q":"Why does it say \"עולים וירדים,\" ascending first and then descending?","o":["The angels of Eretz Yisrael went up to heaven, and the angels of outside the Land came down to accompany him","The angels went up to ask permission to protect him, and then came down","The angels went up to pray for him, and then came down to bring a blessing"]}]},"28:13.1":{"e":"Hashem stood over Yaakov in order to guard him.","pe":"And behold Adonoy stood over him, and said, I am Adonoy, God of Avraham, your father, and God of Yitzchok. The land upon which you are lying, I will give to you and to your descendants.","re":"Stood over him. To guard him.","p":[{"q":"What does 'נצב עליו' mean according to Rashi?","o":["Hashem stood over Yaakov in order to guard him","Hashem stood at the top of the ladder above the angels","Hashem stood before Yaakov to speak with him face to face"]}]},"28:13.2":{"e":"Usually Hashem does not associate His name with a tzaddik during his lifetime, for \"Behold, He does not trust even His holy ones.\" With Yitzchak He did so, because his eyes had dimmed and he was confined to his house, so he was considered as dead and the evil inclination had ceased from him.","pe":"And behold Adonoy stood over him, and said, I am Adonoy, God of Avraham, your father, and God of Yitzchok. The land upon which you are lying, I will give to you and to your descendants.","re":"And God of Yitzchok. Although we never find in Scripture that He should associate His Name with the righteous during their lifetimes, to write “The God of so-and-so,” for it is said, “For [even] in His holy ones He does not put His trust,” [nevertheless,] here He associates His Name with Yitzchok for his eyes had become dim [blind] and he was confined in the house and was considered as if he were dead and the evil inclination had ceased from him.","p":[{"q":"Why did Hashem associate His name with Yitzchak while he was alive?","o":["Because his eyes had dimmed and he was confined to the house, so he was considered dead","Because Yitzchak was bound on the altar and was considered a complete offering","Because Yitzchak had already passed away at that time"]}]},"28:13.3":{"e":"Hashem folded all of Eretz Yisrael under Yaakov, hinting to him that the land would be easy for his children to conquer, like four cubits, which is a person's place.","pe":"And behold Adonoy stood over him, and said, I am Adonoy, God of Avraham, your father, and God of Yitzchok. The land upon which you are lying, I will give to you and to your descendants.","re":"Upon which [you are] lying. God folded the entire Eretz Yisrael beneath him [thereby] he gave him a sign that it will [as] easily be conquered by his descendants as four cubits, the area taken up by a person’s body.","p":[{"q":"Why does it say \"the land on which you are lying\" about the whole land, when Yaakov
