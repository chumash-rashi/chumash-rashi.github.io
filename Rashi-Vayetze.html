ַה־זֹּאת֙ עָשִׂ֣יתָ לִּ֔י הֲלֹ֤א בְרָחֵל֙ עָבַ֣דְתִּי עִמָּ֔ךְ וְלָ֖מָּה רִמִּיתָֽנִי׃", "pasuk_en": "וַיְהִי בַבֹּקֶר וְהִנֵּה־הִוא לֵאָה וַיֹּאמֶר אֶל־לָבָן מַה־זֹּאת עָשִׂיתָ לִּי הֲלֹא בְרָחֵל עָבַדְתִּי עִמָּךְ וְלָמָּה רִמִּיתָנִי׃", "rashi_he": "ויהי בבקר והנה היא לאה. אֲבָל בַּלַּיְלָה לֹא הָיְתָה לֵאָה, לְפִי שֶׁמָּסַר יַעֲקֹב סִימָנִים לְרָחֵל, וּכְשֶׁרָאֲתָה רָחֵל שֶׁמַּכְנִיסִין לוֹ לֵאָה אָמְרָה: עַכְשָׁו תִּכָּלֵם אֲחוֹתִי, עָמְדָה וּמָסְרָה לָהּ אוֹתָן סִימָנִים (מגילה י\"ג):", "rashi_en": "רק בבוקר גילה יעקב שזו לאה, כי בלילה היא נראתה לו כרחל: יעקב מסר לרחל סימנים, ורחל מסרה אותם ללאה כדי שאחותה לא תתבייש.", "note": "", "points": [{"q": "מַדּוּעַ לֹא הִבְחִין יַעֲקֹב בַּלַּיְלָה שֶׁזּוֹ לֵאָה?", "options": ["רָחֵל מָסְרָה לְלֵאָה אֶת הַסִּימָנִים שֶׁיַּעֲקֹב נָתַן לָהּ", "הָיָה חוֹשֶׁךְ גָּמוּר וְיַעֲקֹב לֹא שָׁמַע אֶת קוֹלָהּ", "יַעֲקֹב הָיָה שָׁתוּי מֵהַמִּשְׁתֶּה שֶׁעָשָׂה לָבָן"], "kasha": "הרי יעקב חשש מרמאות לבן, ואיך לא הכיר בלילה שזו לאה?", "answer": "יעקב מסר סימנים לרחל, וכשראתה רחל שמכניסים לו את לאה אמרה עכשיו תיכלם אחותי, ומסרה לה אותם סימנים.", "kp": ["עמדה ומסרה לה אותן סימנים"]}]}, {"id": "29:27.1", "ch": 29, "v": 27, "n": 1, "dh": "מלא שבע זאת", "pasuk_html": "<mark>מַלֵּ֖א שְׁבֻ֣עַ זֹ֑את</mark> וְנִתְּנָ֨ה לְךָ֜ גַּם־אֶת־זֹ֗את בַּעֲבֹדָה֙ אֲשֶׁ֣ר תַּעֲבֹ֣ד עִמָּדִ֔י ע֖וֹד שֶֽׁבַע־שָׁנִ֥ים אֲחֵרֽוֹת׃", "pasuk_en": "מַלֵּא שְׁבֻעַ זֹאת וְנִתְּנָה לְךָ גַּם־אֶת־זֹאת בַּעֲבֹדָה אֲשֶׁר תַּעֲבֹד עִמָּדִי עוֹד שֶׁבַע־שָׁנִים אֲחֵרוֹת׃", "rashi_he": "מלא שבע זאת. דָּבוּק הוּא, שֶׁהֲרֵי נָקוּד בַּחֲטָף, שָׁבוּעַ שֶׁל זֹאת, וְהֵן שִׁבְעַת יְמֵי הַמִּשְׁתֶּה, בְּתַלְמוּד יְרוּשׁ' בְּמוֹעֵד קָטָן (וְאִ\"אֶ לוֹמַר שָׁבוּעַ מַמָּשׁ, שֶׁאִם כֵּן הָיָה צָרִיךְ לְהִנָּקֵד בְּפַתָּח הַשִּׁי\"ן; וְעוֹד שֶׁשָּׁבוּעַ לְשׁוֹן זָכָר, כְּדִכְתִיב שִׁבְעָה שָׁבֻעֹת תִּסְפָּר לָךְ, לְפִיכָךְ אֵין מַשְׁמַע שָׁבוּעַ אֶלָּא שִׁבְעָה, שטיי\"נא בְּלַעַז):", "rashi_en": "\"שבע\" סמוך ל\"זאת\" – שבוע של זאת, כלומר שבעת ימי המשתה של לאה. אי אפשר לפרש שבוע ממש, כי אז היה השי\"ן מנוקד בפתח, ועוד ש\"שבוע\" הוא לשון זכר.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"מַלֵּא שְׁבֻעַ זֹאת\"?", "options": ["הַשְׁלֵם אֶת שִׁבְעַת יְמֵי הַמִּשְׁתֶּה שֶׁל לֵאָה", "הַשְׁלֵם עוֹד שֶׁבַע שְׁנוֹת עֲבוֹדָה בַּעֲבוּר לֵאָה", "הַשְׁלֵם שָׁבוּעַ עֲבוֹדָה נוֹסָף בְּרַעְיַית הַצֹּאן"], "kasha": "לאיזה \"שבע\" מתכוון לבן, ומה פירוש \"זאת\"?", "answer": "\"שבע\" דבוק ל\"זאת\" – שבוע של זאת, והם שבעת ימי המשתה.", "kp": ["והן שבעת ימי המשתה"]}, {"q": "מָה הָרְאָיוֹת שֶׁאֵין לְפָרֵשׁ כָּאן \"הַשָּׁבוּעַ הַזֶּה\"?", "options": ["הַנִּיקּוּד בְּשִׁי\"ן מַרְאֶה שֶׁהַמִּילָה סְמוּכָה, וְ\"שָׁבוּעַ\" לְשׁוֹן זָכָר", "הַמִּילָה כְּתוּבָה בְּלִי וָי\"ו, וְלָכֵן פֵּירוּשָׁהּ שֶׁבַע שָׁנִים", "לָבָן מָנָה תָּמִיד שָׁנִים וְלֹא יָמִים אוֹ שָׁבוּעוֹת"], "kasha": "מדוע לא לפרש \"מלא שבע זאת\" כ\"השלם את השבוע הזה\"?", "answer": "אילו היה שבוע ממש, היה השי\"ן צריך להיות מנוקד בפתח; ועוד, \"שבוע\" לשון זכר, ולכן אין משמעו כאן אלא \"שבעה\" – של זאת.", "kp": ["היה צריך להנקד בפתח", "ועוד ששבוע לשון זכר"]}]}, {"id": "29:27.2", "ch": 29, "v": 27, "n": 2, "dh": "ונתנה לך", "pasuk_html": "מַלֵּ֖א שְׁבֻ֣עַ זֹ֑את <mark>וְנִתְּנָ֨ה לְךָ֜</mark> גַּם־אֶת־זֹ֗את בַּעֲבֹדָה֙ אֲשֶׁ֣ר תַּעֲבֹ֣ד עִמָּדִ֔י ע֖וֹד שֶֽׁבַע־שָׁנִ֥ים אֲחֵרֽוֹת׃", "pasuk_en": "מַלֵּא שְׁבֻעַ זֹאת וְנִתְּנָה לְךָ גַּם־אֶת־זֹאת בַּעֲבֹדָה אֲשֶׁר תַּעֲבֹד עִמָּדִי עוֹד שֶׁבַע־שָׁנִים אֲחֵרוֹת׃", "rashi_he": "ונתנה לך. לְשׁוֹן רַבִּים, כְּמוֹ נֵרְדָה וְנָבְלָה וְנִשְׂרְפָה (בראשית י\"א), אַף זֶה לְשׁוֹן וְנִתֵּן:", "rashi_en": "\"ונתנה\" היא לשון רבים, כמו \"נרדה ונבלה\" ו\"נשרפה\", ופירושה: ונתן, כלומר אנחנו ניתן לך.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָּה \"וְנִתְּנָה\" בַּפָּסוּק?", "options": ["לְשׁוֹן רַבִּים: וְנָתַן, כְּלוֹמַר אֲנַחְנוּ נִיתֵּן לְךָ", "לְשׁוֹן נְקֵבָה: וְהִיא תִּינָּתֵן לָךְ", "לְשׁוֹן צִיווּי: וְתֵן אוֹתָהּ לְעַצְמֶךָ"], "kasha": "\"ונתנה\" נראית כלשון נקבה או סבילה, ולא ברור מי הנותן.", "answer": "זו לשון רבים, כמו \"נרדה ונבלה\" ו\"נשרפה\", ואף כאן פירושו \"ונתן\".", "kp": ["לשון רבים", "אף זה לשון ונתן"]}]}, {"id": "29:27.3", "ch": 29, "v": 27, "n": 3, "dh": "גם את זאת", "pasuk_html": "מַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וְנִתְּנָ֨ה לְךָ֜ <mark>גַּם־אֶת־זֹ֗את</mark> בַּעֲבֹדָה֙ אֲשֶׁ֣ר תַּעֲבֹ֣ד עִמָּדִ֔י ע֖וֹד שֶֽׁבַע־שָׁנִ֥ים אֲחֵרֽוֹת׃", "pasuk_en": "מַלֵּא שְׁבֻעַ זֹאת וְנִתְּנָה לְךָ גַּם־אֶת־זֹאת בַּעֲבֹדָה אֲשֶׁר תַּעֲבֹד עִמָּדִי עוֹד שֶׁבַע־שָׁנִים אֲחֵרוֹת׃", "rashi_he": "גם את זאת. מִיָּד לְאַחַר שִׁבְעַת יְמֵי הַמִּשְׁתֶּה, וְתַעֲבֹד לְאַחַר נִשּׂוּאֶיהָ:", "rashi_en": "לבן אומר ליעקב שייתן לו את רחל מיד אחרי שבעת ימי המשתה של לאה, ויעקב יעבוד בשבילה אחרי שיתחתן איתה.", "note": "", "points": [{"q": "מָתַי קִיבֵּל יַעֲקֹב אֶת רָחֵל לְפִי רַשִׁ\"י?", "options": ["מִיָּד אַחֲרֵי שִׁבְעַת יְמֵי הַמִּשְׁתֶּה, וְעָבַד אַחַר כָּךְ", "אַחֲרֵי שֶׁעָבַד בִּשְׁבִילָהּ עוֹד שֶׁבַע שָׁנִים", "בְּאוֹתוֹ יוֹם שֶׁבּוֹ נָשָׂא אֶת לֵאָה"], "kasha": "האם יעקב צריך לעבוד שבע שנים נוספות לפני שיקבל את רחל?", "answer": "מיד לאחר שבעת ימי המשתה, ותעבוד לאחר נישואיה.", "kp": ["מיד לאחר שבעת ימי המשתה", "ותעבד לאחר נשואיה"]}]}, {"id": "29:30.1", "ch": 29, "v": 30, "n": 1, "dh": "עוד שבע שנים אחרות", "pasuk_html": "וַיָּבֹא֙ גַּ֣ם אֶל־רָחֵ֔ל וַיֶּאֱהַ֥ב גַּֽם־אֶת־רָחֵ֖ל מִלֵּאָ֑ה וַיַּעֲבֹ֣ד עִמּ֔וֹ <mark>ע֖וֹד שֶֽׁבַע־שָׁנִ֥ים אֲחֵרֽוֹת׃</mark>", "pasuk_en": "וַיָּבֹא גַּם אֶל־רָחֵל וַיֶּאֱהַב גַּם־אֶת־רָחֵל מִלֵּאָה וַיַּעֲבֹד עִמּוֹ עוֹד שֶׁבַע־שָׁנִים אֲחֵרוֹת׃", "rashi_he": "עוד שבע שנים אחרות. אֲחֵרוֹת הִקִּישָׁן לָרִאשׁוֹנוֹת, מָה רִאשׁוֹנוֹת בֶּאֱמוּנָה אַף הָאַחֲרוֹנוֹת בֶּאֱמוּנָה, וְאַעַ\"פִּ שֶׁבְּרַמָּאוּת בָּא עָלָיו (בראשית רבה):", "rashi_en": "התורה השוותה את שבע השנים האחרונות לראשונות: כמו שהראשונות עבד יעקב באמונה, כך גם האחרונות, אף שלבן רימה אותו.", "note": "", "points": [{"q": "מָה לוֹמְדִים מֵהַמִּילָּה \"אֲחֵרוֹת\"?", "options": ["שֶׁגַּם בַּשָּׁנִים הָאַחֲרוֹנוֹת עָבַד יַעֲקֹב בֶּאֱמוּנָה כְּמוֹ בָּרִאשׁוֹנוֹת", "שֶׁהַשָּׁנִים הָאַחֲרוֹנוֹת הָיוּ קָשׁוֹת יוֹתֵר מֵהָרִאשׁוֹנוֹת", "שֶׁלָּבָן שִׁינָּה אֶת תְּנָאֵי הָעֲבוֹדָה בַּשָּׁנִים הָאַחֲרוֹנוֹת"], "kasha": "המילה \"אחרות\" נראית מיותרת, שהרי ברור שאלו שנים נוספות.", "answer": "\"אחרות\" הקישן לראשונות: מה ראשונות באמונה, אף האחרונות באמונה, אף על פי שברמאות בא עליו.", "kp": ["אחרות הקישן לראשונות", "מה ראשונות באמונה אף האחרונות באמונה"]}]}, {"id": "29:32.1", "ch": 29, "v": 32, "n": 1, "dh": "ותקרא שמו ראובן", "pasuk_html": "וַתַּ֤הַר לֵאָה֙ וַתֵּ֣לֶד בֵּ֔ן <mark>וַתִּקְרָ֥א שְׁמ֖וֹ רְאוּבֵ֑ן</mark> כִּ֣י אָֽמְרָ֗ה כִּֽי־רָאָ֤ה יְהוָה֙ בְּעָנְיִ֔י כִּ֥י עַתָּ֖ה יֶאֱהָבַ֥נִי אִישִֽׁי׃", "pasuk_en": "וַתַּהַר לֵאָה וַתֵּלֶד בֵּן וַתִּקְרָא שְׁמוֹ רְאוּבֵן כִּי אָמְרָה כִּי־רָאָה יְהוָה בְּעָנְיִי כִּי עַתָּה יֶאֱהָבַנִי אִישִׁי׃", "rashi_he": "(ותקרא שמו ראובן רַבּוֹתֵינוּ פֵּרְשׁוּ, אָמְרָה רְאוּ מַה בֵּין בְּנִי לְבֶן חָמִי שֶׁמָּכַר הַבְּכוֹרָה לְיַעֲקֹב, וְזֶה לֹא מְכָרָהּ לְיוֹסֵף וְלֹא עִרְעֵר עָלָיו, וְלֹא עוֹד שֶׁלֹּא עִרְעֵר עָלָיו אֶלָּא שֶׁבִּקֵּשׁ לְהוֹצִיאוֹ מִן הַבּוֹר) (ברכות ז'):", "rashi_en": "רבותינו פירשו שלאה אמרה \"ראו מה בין בני לבן חמי\": עשו מכר את הבכורה ליעקב, ואילו ראובן לא מכר את בכורתו ליוסף ולא ערער עליו, ואף ביקש להוציאו מן הבור.", "note": "", "points": [{"q": "לְפִי רַבּוֹתֵינוּ, מָה רָמְזָה לֵאָה בְּשֵׁם \"רְאוּבֵן\"?", "options": ["רְאוּ מַה בֵּין בְּנִי לְעֵשָׂו, שֶׁמָּכַר אֶת הַבְּכוֹרָה", "רָאוּ שֶׁבְּנִי יִהְיֶה מֶלֶךְ עַל כָּל אֶחָיו", "רָאוּ בֵּן שֶׁנּוֹלַד לִי לִפְנֵי שֶׁנּוֹלַד לַאֲחוֹתִי"], "kasha": "השם \"ראובן\" מרמז על \"ראו בן\", ויש להבין מה יש לראות בו.", "answer": "אמרה: ראו מה בין בני לבן חמי, שמכר את הבכורה ליעקב; וזה לא מכרה ליוסף ולא ערער עליו, ואף ביקש להוציאו מן הבור.", "kp": ["ראו מה בין בני לבן חמי", "שמכר הבכורה ליעקב"]}]}, {"id": "29:34.1", "ch": 29, "v": 34, "n": 1, "dh": "הפעם ילוה אישי", "pasuk_html": "וַתַּ֣הַר עוֹד֮ וַתֵּ֣לֶד בֵּן֒ וַתֹּ֗אמֶר עַתָּ֤ה <mark>הַפַּ֙עַם֙ יִלָּוֶ֤ה אִישִׁי֙</mark> אֵלַ֔י כִּֽי־יָלַ֥דְתִּי ל֖וֹ שְׁלֹשָׁ֣ה בָנִ֑ים עַל־כֵּ֥ן קָרָֽא־שְׁמ֖וֹ לֵוִֽי׃", "pasuk_en": "וַתַּהַר עוֹד וַתֵּלֶד בֵּן וַתֹּאמֶר עַתָּה הַפַּעַם יִלָּוֶה אִישִׁי אֵלַי כִּי־יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים עַל־כֵּן קָרָא־שְׁמוֹ לֵוִי׃", "rashi_he": "הפעם ילוה אישי. לְפִי שֶׁהָאִמָּהוֹת נְבִיאוֹת הָיוּ, וְיוֹדְעוֹת שֶׁי\"ב שְׁבָטִים יוֹצְאִים מִיַּעֲקֹב וְד' נָשִׁים יִשָּׂא, אָמְרָה, מֵעַתָּה אֵין לוֹ פִתְחוֹן פֶּה עָלַי, שֶׁהֲרֵי נָטַלְתִּי כָּל חֶלְקִי בַּבָּנִים (ברבות ס'):", "rashi_en": "האמהות היו נביאות וידעו שיעקב ישא ארבע נשים ויהיו לו שנים עשר שבטים. כשלאה ילדה בן שלישי, אמרה: נטלתי את כל חלקי בבנים, ומעתה אין ליעקב טענה עלי.", "note": "", "points": [{"q": "מַדּוּעַ אָמְרָה לֵאָה דַּווקָא אַחֲרֵי הַבֵּן הַשְּׁלִישִׁי \"הַפַּעַם יִלָּוֶה אִישִׁי\"?", "options": ["כִּי יָדְעָה שֶׁיַּעֲקֹב יִשָּׂא אַרְבַּע נָשִׁים, וּשְׁלוֹשָׁה בָּנִים הֵם חֶלְקָהּ", "כִּי שְׁלוֹשָׁה בָּנִים הֵם חֶזְקָה שֶׁתַּמְשִׁיךְ לָלֶדֶת עוֹד", "כִּי רָחֵל עֲדַיִין לֹא יָלְדָה לְיַעֲקֹב אַף בֵּן"], "kasha": "מה מיוחד בבן השלישי, שבגללו יתחבר אליה יעקב?", "answer": "האמהות נביאות היו וידעו שי\"ב שבטים יוצאים מיעקב, וארבע נשים ישא; לכן אמרה: מעתה אין לו פתחון פה עלי, שהרי נטלתי כל חלקי בבנים.", "kp": ["לפי שהאמהות נביאות היו", "וד' נשים ישא", "שהרי נטלתי כל חלקי בבנים"]}]}, {"id": "29:34.2", "ch": 29, "v": 34, "n": 2, "dh": "על כן", "pasuk_html": "וַתַּ֣הַר עוֹד֮ וַתֵּ֣לֶד בֵּן֒ וַתֹּ֗אמֶר עַתָּ֤ה הַפַּ֙עַם֙ יִלָּוֶ֤ה אִישִׁי֙ אֵלַ֔י כִּֽי־יָלַ֥דְתִּי ל֖וֹ שְׁלֹשָׁ֣ה בָנִ֑ים <mark>עַל־כֵּ֥ן</mark> קָרָֽא־שְׁמ֖וֹ לֵוִֽי׃", "pasuk_en": "וַתַּהַר עוֹד וַתֵּלֶד בֵּן וַתֹּאמֶר עַתָּה הַפַּעַם יִלָּוֶה אִישִׁי אֵלַי כִּי־יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים עַל־כֵּן קָרָא־שְׁמוֹ לֵוִי׃", "rashi_he": "על כן. כָּל מִי שֶׁנֶּאֱמַר בּוֹ עַל כֵּן מְרֻבֶּה בְּאֻכְלוֹסִין, חוּץ מִלֵּוִי שֶׁהָאָרוֹן הָיָה מְכַלֶּה בָּהֶם:", "rashi_en": "כל שבט שנאמר בו ״על כן״ בקריאת שמו התרבה מאוד, חוץ משבט לוי, שהארון היה מכלה בהם.", "note": "", "points": [{"q": "מָה מְלַמֵּד רַשִׁ״י מֵהַמִּילִּים ״עַל־כֵּן״ בִּקְרִיאַת שֵׁם לֵוִי?", "options": ["שֵׁבֶט שֶׁנֶּאֱמַר בּוֹ ״עַל־כֵּן״ מַרְבֶּה בְּאוֹכְלוֹסִין, חוּץ מִלֵּוִי שֶׁהָאָרוֹן כִּילָּה בָּהֶם", "שֶׁלֵּוִי הָיָה הַמְּרוּבֶּה מִכָּל הַשְּׁבָטִים בְּאוּכְלוּסִין", "שֶׁשֵּׁבֶט לֵוִי נִבְחַר לַעֲבוֹדַת הַמִּקְדָּשׁ בִּגְלַל שְׁמוֹ"], "kasha": "מה מיוחד בלשון ״על כן״ שבקריאת השם?", "answer": "כל מי שנאמר בו ״על כן״ מרבה באוכלוסין, חוץ מלוי שהארון היה מכלה בהם.", "kp": ["כל מי שנאמר בו על כן", "מרבה באכלוסין, חוץ מלוי", "שהארון היה מכלה בהם"]}]}, {"id": "29:34.3", "ch": 29, "v": 34, "n": 3, "dh": "קרא שמו לוי", "pasuk_html": "וַתַּ֣הַר עוֹד֮ וַתֵּ֣לֶד בֵּן֒ וַתֹּ֗אמֶר עַתָּ֤ה הַפַּ֙עַם֙ יִלָּוֶ֤ה אִישִׁי֙ אֵלַ֔י כִּֽי־יָלַ֥דְתִּי ל֖וֹ שְׁלֹשָׁ֣ה בָנִ֑ים עַל־כֵּ֥ן <mark>קָרָֽא־שְׁמ֖וֹ לֵוִֽי׃</mark>", "pasuk_en": "וַתַּהַר עוֹד וַתֵּלֶד בֵּן וַתֹּאמֶר עַתָּה הַפַּעַם יִלָּוֶה אִישִׁי אֵלַי כִּי־יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים עַל־כֵּן קָרָא־שְׁמוֹ לֵוִי׃", "rashi_he": "קרא שמו לוי. בְּכֻלָּם כְּתִיב וַתִּקְרָא, וְזֶה כָתַב בּוֹ קָרָא, וְיֵשׁ מִ\"אַ בְּאֵלֶּה הַדְּבָרִים רַבָּה שֶׁשָּׁלַח הַקָּבָּ\"ה גַּבְרִיאֵל וֶהֱבִיאוֹ לְפָנָיו וְקָרָא לוֹ שֵׁם זֶה, וְנָתַן לוֹ כ\"ד מַתְּנוֹת כְּהֻנָּה, וְעַל שֵׁם שֶׁלִּוָּהוּ בְמַתָּנוֹת קְרָאוֹ לֵוִי:", "rashi_en": "אצל כל השבטים כתוב ״ותקרא״, ואצל לוי כתוב ״קרא״. לפי המדרש, ה׳ שלח את גבריאל שהביא את לוי לפניו, וה׳ קרא לו בשם זה ונתן לו כ״ד מתנות כהונה, כי ״ליווה״ אותו במתנות.", "note": "", "points": [{"q": "מָה מְלַמֵּד רַשִׁ״י מִכָּךְ שֶׁכָּתוּב ״קָרָא־שְׁמוֹ לֵוִי״ וְלֹא ״וַתִּקְרָא״?", "options": ["הַקָּבָּ״ה קָרָא לוֹ בְּשֵׁם זֶה וְנָתַן לוֹ כ״ד מַתְּנוֹת כְּהוּנָּה", "יַעֲקֹב קָרָא לוֹ בְּשֵׁם זֶה וְלֹא לֵאָה אִמּוֹ", "הַמַּלְאָךְ גַּבְרִיאֵל בָּחַר אֶת הַשֵּׁם בְּלִי יְדִיעַת הַהוֹרִים"], "kasha": "אצל כל הבנים כתוב ״ותקרא״, ומדוע אצל לוי כתוב ״קרא״ בלשון זכר?", "answer": "לפי המדרש, ה׳ שלח את גבריאל והביאו לפניו, וקרא לו שם זה ונתן לו כ״ד מתנות כהונה, ועל שם שליווהו במתנות קראו לוי.", "kp": ["וקרא לו שם זה", "ונתן לו", "ועל שם שלוהו במתנות"]}]}, {"id": "29:35.1", "ch": 29, "v": 35, "n": 1, "dh": "הפעם אודה", "pasuk_html": "וַתַּ֨הַר ע֜וֹד וַתֵּ֣לֶד בֵּ֗ן וַתֹּ֙אמֶר֙ <mark>הַפַּ֙עַם֙ אוֹדֶ֣ה</mark> אֶת־יְהוָ֔ה עַל־כֵּ֛ן קָרְאָ֥ה שְׁמ֖וֹ יְהוּדָ֑ה וַֽתַּעֲמֹ֖ד מִלֶּֽדֶת׃", "pasuk_en": "וַתַּהַר עוֹד וַתֵּלֶד בֵּן וַתֹּאמֶר הַפַּעַם אוֹדֶה אֶת־יְהוָה עַל־כֵּן קָרְאָה שְׁמוֹ יְהוּדָה וַתַּעֲמֹד מִלֶּדֶת׃", "rashi_he": "הפעם אודה. שֶׁנָּטַלְתִּי יוֹתֵר מֵחֶלְקִי, מֵעַתָּה יֵשׁ לִי לְהוֹדוֹת:", "rashi_en": "לאה אמרה: כיון שקיבלתי יותר מהחלק המגיע לי, מעתה עליי להודות לה'.", "note": "", "points": [{"q": "מַדּוּעַ אָמְרָה לֵאָה \"הַפַּעַם אוֹדֶה\" דַּוְוקָא בְּלִידַת יְהוּדָה?", "options": ["כִּי עַכְשָׁיו קִיבְּלָה יוֹתֵר מֵחֶלְקָהּ, וְלָכֵן עָלֶיהָ לְהוֹדוֹת", "כִּי עַכְשָׁיו סוֹף סוֹף אָהַב אוֹתָהּ יַעֲקֹב יוֹתֵר מֵרָחֵל", "כִּי יָדְעָה שֶׁזֶּה הַבֵּן הָאַחֲרוֹן שֶׁתֵּלֵד"], "kasha": "מה מיוחד בלידה הזאת שבגללה אמרה לאה \"הפעם אודה\"?", "answer": "שנטלתי יותר מחלקי, ומעתה יש לי להודות.", "kp": ["שנטלתי יותר מחלקי", "מעתה יש לי להודות"]}]}, {"id": "30:1.1", "ch": 30, "v": 1, "n": 1, "dh": "ותקנא רחל באחותה", "pasuk_html": "וַתֵּ֣רֶא רָחֵ֗ל כִּ֣י לֹ֤א יָֽלְדָה֙ לְיַעֲקֹ֔ב <mark>וַתְּקַנֵּ֥א רָחֵ֖ל בַּאֲחֹתָ֑הּ</mark> וַתֹּ֤אמֶר אֶֽל־יַעֲקֹב֙ הָֽבָה־לִּ֣י בָנִ֔ים וְאִם־אַ֖יִן מֵתָ֥ה אָנֹֽכִי׃", "pasuk_en": "וַתֵּרֶא רָחֵל כִּי לֹא יָלְדָה לְיַעֲקֹב וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ וַתֹּאמֶר אֶל־יַעֲקֹב הָבָה־לִּי בָנִים וְאִם־אַיִן מֵתָה אָנֹכִי׃", "rashi_he": "ותקנא רחל באחותה. קִנְּאָה בְמַעֲשֶׂיהָ הַטּוֹבִים, אָמְרָה אִלּוּלֵי שֶׁצָּדְקָה מִמֶּנִּי לֹא זָכְתָה לְבָנִים (בראשית רבה):", "rashi_en": "רחל קינאה במעשיה הטובים של לאה. היא אמרה: אילולא שלאה צדקה ממני, לא הייתה זוכה לבנים.", "note": "", "points": [{"q": "בַּמֶּה קִינְּאָה רָחֵל בְּלֵאָה, לְפִי רַשִׁ״י?", "options": ["בְּמַעֲשֶׂיהָ הַטּוֹבִים, שֶׁבִּזְכוּתָם זָכְתָה לְבָנִים", "בְּכָךְ שֶׁיַּעֲקֹב אָהַב אֶת לֵאָה יוֹתֵר מִמֶּנָּה", "בְּיוֹפְיָיָהּ וּבְמַעֲמָדָהּ כְּאָחוֹת הַבְּכִירָה"], "kasha": "קנאה היא מידה רעה, ואיך ייתכן שרחל הצדקת קינאה באחותה?", "answer": "קינאה במעשיה הטובים, ואמרה: אילולא שצדקה ממני, לא הייתה זוכה לבנים.", "kp": ["קנאה במעשיה הטובים", "לא זכתה לבנים"]}]}, {"id": "30:1.2", "ch": 30, "v": 1, "n": 2, "dh": "הבה לי", "pasuk_html": "וַתֵּ֣רֶא רָחֵ֗ל כִּ֣י לֹ֤א יָֽלְדָה֙ לְיַעֲקֹ֔ב וַתְּקַנֵּ֥א רָחֵ֖ל בַּאֲחֹתָ֑הּ וַתֹּ֤אמֶר אֶֽל־יַעֲקֹב֙ <mark>הָֽבָה־לִּ֣י</mark> בָנִ֔ים וְאִם־אַ֖יִן מֵתָ֥ה אָנֹֽכִי׃", "pasuk_en": "וַתֵּרֶא רָחֵל כִּי לֹא יָלְדָה לְיַעֲקֹב וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ וַתֹּאמֶר אֶל־יַעֲקֹב הָבָה־לִּי בָנִים וְאִם־אַיִן מֵתָה אָנֹכִי׃", "rashi_he": "הבה לי. וְכִי כָּךְ עָשָׂה אָבִיךָ לְאִמְּךָ? וְהֲלֹא הִתְפַּלֵּל עָלֶיהָ:", "rashi_en": "רחל רמזה ליעקב: האם כך עשה אביך יצחק לאמך רבקה? הרי הוא התפלל עליה.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מָה הָיְיתָה כַּוָּונַת רָחֵל כְּשֶׁבִּיקְשָׁה מִיַּעֲקֹב בָּנִים?", "options": ["שֶׁיַּעֲקֹב יִתְפַּלֵּל עָלֶיהָ כְּמוֹ שֶׁיִּצְחָק הִתְפַּלֵּל עַל רִבְקָה", "שֶׁיַּעֲקֹב יִיתֵּן לָהּ אֶת שִׁפְחָתָהּ כְּדֵי שֶׁתִּיבָּנֶה מִמֶּנָּה", "שֶׁיַּעֲקֹב יֶאֱהַב אוֹתָהּ יוֹתֵר מֵאֲשֶׁר אֶת לֵאָה"], "kasha": "וכי בידי יעקב לתת בנים, שרחל דורשת ממנו?", "answer": "וכי כך עשה אביך לאמך? והלא התפלל עליה.", "kp": ["וכי כך עשה אביך לאמך", "והלא התפלל עליה"]}]}, {"id": "30:1.3", "ch": 30, "v": 1, "n": 3, "dh": "מתה אנכי", "pasuk_html": "וַתֵּ֣רֶא רָחֵ֗ל כִּ֣י לֹ֤א יָֽלְדָה֙ לְיַעֲקֹ֔ב וַתְּקַנֵּ֥א רָחֵ֖ל בַּאֲחֹתָ֑הּ וַתֹּ֤אמֶר אֶֽל־יַעֲקֹב֙ הָֽבָה־לִּ֣י בָנִ֔ים וְאִם־אַ֖יִן <mark>מֵתָ֥ה אָנֹֽכִי׃</mark>", "pasuk_en": "וַתֵּרֶא רָחֵל כִּי לֹא יָלְדָה לְיַעֲקֹב וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ וַתֹּאמֶר אֶל־יַעֲקֹב הָבָה־לִּי בָנִים וְאִם־אַיִן מֵתָה אָנֹכִי׃", "rashi_he": "מתה אנכי. מִכָּאן לְמִי שֶׁאֵין לוֹ בָנִים שֶׁחָשׁוּב כַּמֵּת (בראשית רבה):", "rashi_en": "מדברי רחל לומדים שמי שאין לו בנים חשוב כמת.", "note": "", "points": [{"q": "מָה לוֹמְדִים מִדִּבְרֵי רָחֵל \"מֵתָה אָנֹכִי\"?", "options": ["שֶׁמִּי שֶׁאֵין לוֹ בָּנִים חָשׁוּב כְּמֵת", "שֶׁרָחֵל אִיְּימָה לִפְגּוֹעַ בְּעַצְמָהּ מֵרוֹב צַעַר", "שֶׁרָחֵל חָשְׁשָׁה שֶׁתָּמוּת בִּשְׁעַת הַלֵּידָה"], "kasha": "רחל לא הייתה חולה, ומדוע היא אומרת שהיא מתה?", "answer": "מכאן למי שאין לו בנים שחשוב כמת.", "kp": ["מכאן למי שאין לו בנים", "שחשוב כמת"]}]}, {"id": "30:2.1", "ch": 30, "v": 2, "n": 1, "dh": "התחת", "pasuk_html": "וַיִּֽחַר־אַ֥ף יַעֲקֹ֖ב בְּרָחֵ֑ל וַיֹּ֗אמֶר <mark>הֲתַ֤חַת</mark> אֱלֹהִים֙ אָנֹ֔כִי אֲשֶׁר־מָנַ֥ע מִמֵּ֖ךְ פְּרִי־בָֽטֶן׃", "pasuk_en": "וַיִּחַר־אַף יַעֲקֹב בְּרָחֵל וַיֹּאמֶר הֲתַחַת אֱלֹהִים אָנֹכִי אֲשֶׁר־מָנַע מִמֵּךְ פְּרִי־בָטֶן׃", "rashi_he": "התחת. וְכִי בִמְקוֹמוֹ אֲנִי?", "rashi_en": "יעקב אמר לרחל: וכי במקומו של הקב\"ה אני? הוא שמנע ממך פרי בטן.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ דִּבְרֵי יַעֲקֹב \"הֲתַחַת אֱלֹהִים אָנֹכִי\"?", "options": ["וְכִי בִּמְקוֹמוֹ שֶׁל הַקָּב\"ה אֲנִי?", "וְכִי אֲנִי נִמְצָא תַּחַת שְׁלִיטָתוֹ שֶׁל ה'?", "וְכִי אֲנִי יָרֵא אֶת ה' פָּחוֹת מִמְּךָ?"], "kasha": "המילה \"התחת\" יכולה להתפרש \"מתחת\", ויש לברר את כוונתה.", "answer": "\"התחת\" – וכי במקומו אני?", "kp": ["וכי במקומו אני"]}]}, {"id": "30:2.2", "ch": 30, "v": 2, "n": 2, "dh": "אשר מנע ממך", "pasuk_html": "וַיִּֽחַר־אַ֥ף יַעֲקֹ֖ב בְּרָחֵ֑ל וַיֹּ֗אמֶר הֲתַ֤חַת אֱלֹהִים֙ אָנֹ֔כִי <mark>אֲשֶׁר־מָנַ֥ע מִמֵּ֖ךְ</mark> פְּרִי־בָֽטֶן׃", "pasuk_en": "וַיִּחַר־אַף יַעֲקֹב בְּרָחֵל וַיֹּאמֶר הֲתַחַת אֱלֹהִים אָנֹכִי אֲשֶׁר־מָנַע מִמֵּךְ פְּרִי־בָטֶן׃", "rashi_he": "אשר מנע ממך. אַתְּ אוֹמֶרֶת שֶׁאֶעֱשֶׂה כְאַבָּא, אֲנִי אֵינִי כְּאַבָּא, אַבָּא לֹא הָיוּ לוֹ בָנִים, אֲנִי יֵשׁ לִי בָּנִים; מִמֵּךְ מָנַע וְלֹא מִמֶּנִּי:", "rashi_en": "רחל ביקשה מיעקב שיתפלל עליה כמו שעשה אביו יצחק. יעקב השיב: אינני כאבי, לאבי לא היו בנים ולי יש; ממך מנע ה' בנים ולא ממני.", "note": "", "points": [{"q": "מָה בָּא יַעֲקֹב לְהַדְגִּישׁ בְּמִילִּים \"אֲשֶׁר־מָנַע מִמֵּךְ\"?", "options": ["שֶׁה' מָנַע בָּנִים מִמֶּנָּה וְלֹא מִמֶּנּוּ, וּלְכֵן אֵינוֹ כְּיִצְחָק", "שֶׁה' מָנַע בָּנִים מִשְּׁנֵיהֶם, וְאֵין מָה לַעֲשׂוֹת", "שֶׁה' יִמְנַע מִמֶּנָּה בָּנִים לְעוֹלָם וְאֵין טַעַם לְהִתְפַּלֵּל"], "kasha": "מדוע הדגיש יעקב \"ממך\", ומה ענה בזה לבקשת רחל?", "answer": "את אומרת שאעשה כאבא; אני איני כאבא: לאבא לא היו בנים, ולי יש בנים. ממך מנע ולא ממני.", "kp": ["ממך מנע ולא ממני", "אני איני כאבא"]}]}, {"id": "30:3.1", "ch": 30, "v": 3, "n": 1, "dh": "על ברכי", "pasuk_html": "וַתֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥י בִלְהָ֖ה בֹּ֣א אֵלֶ֑יהָ וְתֵלֵד֙ <mark>עַל־בִּרְכַּ֔י</mark> וְאִבָּנֶ֥ה גַם־אָנֹכִ֖י מִמֶּֽנָּה׃", "pasuk_en": "וַתֹּאמֶר הִנֵּה אֲמָתִי בִלְהָה בֹּא אֵלֶיהָ וְתֵלֵד עַל־בִּרְכַּי וְאִבָּנֶה גַם־אָנֹכִי מִמֶּנָּה׃", "rashi_he": "על ברכי. כְּתַרְגּוּמוֹ וַאֲנָא אֱרַבֵּי:", "rashi_en": "רחל אמרה ״ותלד על ברכי״, וכתרגום אונקלוס: ואני אגדל אותם.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״וְתֵלֵד עַל־בִּרְכַּי״ לְפִי רַשִׁ״י וְתַרְגּוּם אוֹנְקְלוֹס?", "options": ["וַאֲנִי אֲגַדֵּל אֶת הַיְלָדִים", "בִּלְהָה תֵּלֵד כְּשֶׁהִיא יוֹשֶׁבֶת עַל בִּרְכֵּי רָחֵל", "רָחֵל תֵּנִיק אֶת הַיְלָדִים בְּעַצְמָהּ"], "kasha": "בלהה היא היולדת; מה פירוש שתלד ״על ברכי״ של רחל?", "answer": "כתרגומו: ״ואנא ארבי״ - ואני אגדל.", "kp": ["כתרגומו ואנא ארבי"]}]}, {"id": "30:3.2", "ch": 30, "v": 3, "n": 2, "dh": "ואבנה גם אנכי", "pasuk_html": "וַתֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥י בִלְהָ֖ה בֹּ֣א אֵלֶ֑יהָ וְתֵלֵד֙ עַל־בִּרְכַּ֔י <mark>וְאִבָּנֶ֥ה גַם־אָנֹכִ֖י</mark> מִמֶּֽנָּה׃", "pasuk_en": "וַתֹּאמֶר הִנֵּה אֲמָתִי בִלְהָה בֹּא אֵלֶיהָ וְתֵלֵד עַל־בִּרְכַּי וְאִבָּנֶה גַם־אָנֹכִי מִמֶּנָּה׃", "rashi_he": "ואבנה גם אנכי. מַהוּ גַּם? אָמְרָה לוֹ זְקֶנְךָ אַבְרָהָם הָיוּ לוֹ בָנִים מֵהָגָר וְחָגַר מָתְנָיו כְּנֶגֶד שָׂרָה, אָמַר לָהּ זְקֵנָתִי הִכְנִיסָה צָרָתָהּ לְבֵיתָהּ, אָמְרָה לוֹ אִם הַדָּבָר הַזֶּה מְעַכֵּב, הִנֵּה אֲמָתִי:", "rashi_en": "רחל אמרה ליעקב שאברהם, אף שהיו לו בנים מהגר, התפלל על שרה. יעקב ענה ששרה הכניסה את צרתה לביתה, ורחל אמרה: אם זה מה שמעכב, הנה אמתי בלהה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָּה ״גַם־״ בְּדִבְרֵי רָחֵל ״וְאִבָּנֶה גַם־אָנֹכִי״?", "options": ["גַּם אֲנִי כְּמוֹ שָׂרָה, שֶׁהִכְנִיסָה צָרָתָהּ לְבֵיתָהּ", "גַּם אֲנִי כְּמוֹ לֵאָה, שֶׁכְּבָר יֵשׁ לָהּ בָּנִים", "גַּם אֲנִי כְּמוֹ בִּלְהָה, שֶׁתֵּלֵד בָּנִים לְיַעֲקֹב"], "kasha": "מה מוסיפה המילה ״גם״, למי משווה רחל את עצמה?", "answer": "יעקב אמר לה שזקנתו שרה הכניסה צרתה לביתה, ורחל אמרה: אם הדבר הזה מעכב, הנה אמתי, כלומר גם אני אעשה כמו שרה.", "kp": ["מהו גם", "אמר לה זקנתי הכניסה צרתה לביתה"]}]}, {"id": "30:3.3", "ch": 30, "v": 3, "n": 3, "dh": "ואבנה גם אנכי", "pasuk_html": "וַתֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥י בִלְהָ֖ה בֹּ֣א אֵלֶ֑יהָ וְתֵלֵד֙ עַל־בִּרְכַּ֔י <mark>וְאִבָּנֶ֥ה גַם־אָנֹכִ֖י</mark> מִמֶּֽנָּה׃", "pasuk_en": "וַתֹּאמֶר הִנֵּה אֲמָתִי בִלְהָה בֹּא אֵלֶיהָ וְתֵלֵד עַל־בִּרְכַּי וְאִבָּנֶה גַם־אָנֹכִי מִמֶּנָּה׃", "rashi_he": "ואבנה גם אנכי. כְּשָׂרָה:", "rashi_en": "רחל אמרה: גם אני אזכה לבנים על ידי שפחתי, כמו שרה.", "note": "", "points": [{"q": "לְמִי מִתְכַּווֶּנֶת רָחֵל בְּמִילִּים \"גַם־אָנֹכִי\"?", "options": ["לְשָׂרָה, שֶׁנִּבְנְתָה עַל יְדֵי שִׁפְחָתָהּ", "לְלֵאָה, שֶׁכְּבָר יָלְדָה אַרְבָּעָה בָּנִים", "לְרִבְקָה, שֶׁנִּפְקְדָה אַחֲרֵי שָׁנִים רַבּוֹת"], "kasha": "מה פירוש \"גם\" – גם אני כמו מי?", "answer": "כשרה – גם אני אבנה מן השפחה כמו שרה.", "kp": ["כשרה"]}]}, {"id": "30:6.1", "ch": 30, "v": 6, "n": 1, "dh": "דנני אלהים", "pasuk_html": "וַתֹּ֤אמֶר רָחֵל֙ <mark>דָּנַ֣נִּי אֱלֹהִ֔ים</mark> וְגַם֙ שָׁמַ֣ע בְּקֹלִ֔י וַיִּתֶּן־לִ֖י בֵּ֑ן עַל־כֵּ֛ן קָרְאָ֥ה שְׁמ֖וֹ דָּֽן׃", "pasuk_en": "וַתֹּאמֶר רָחֵל דָּנַנִּי אֱלֹהִים וְגַם שָׁמַע בְּקֹלִי וַיִּתֶּן־לִי בֵּן עַל־כֵּן קָרְאָה שְׁמוֹ דָּן׃", "rashi_he": "דנני אלהים. דָּנַנִּי וְחִיְּבַנִי וְזִכַּנִי (בראשית רבה):", "rashi_en": "ה׳ דן את רחל פעמיים: בתחילה חייב אותה, ולבסוף זיכה אותה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"דָּנַנִּי אֱלֹהִים\" לְפִי רַשִׁ״י?", "options": ["ה׳ דָּן אוֹתִי: תְּחִילָּה חִיְיבַנִי וְאַחַר כָּךְ זִיכַּנִי", "ה׳ חִייְּבַנִי, וַעֲדַיִין לֹא רִיחֵם עָלַיי", "ה׳ זִיכָּנִי מִיָּד, וְלֹא חִיֵּיבַנִי כְּלָל"], "kasha": "\"דנני\" יכול להיות לטובה או לרעה, ורחל אומרת זאת בשמחה על לידת בן.", "answer": "דנני וחייבני, ודנני וזיכני.", "kp": ["דנני וחיבני וזכני"]}]}, {"id": "30:8.1", "ch": 30, "v": 8, "n": 1, "dh": "נפתולי אלהים", "pasuk_html": "וַתֹּ֣אמֶר רָחֵ֗ל <mark>נַפְתּוּלֵ֨י אֱלֹהִ֧ים</mark> ׀ נִפְתַּ֛לְתִּי עִם־אֲחֹתִ֖י גַּם־יָכֹ֑לְתִּי וַתִּקְרָ֥א שְׁמ֖וֹ נַפְתָּלִֽי׃", "pasuk_en": "וַתֹּאמֶר רָחֵל נַפְתּוּלֵי אֱלֹהִים נִפְתַּלְתִּי עִם־אֲחֹתִי גַּם־יָכֹלְתִּי וַתִּקְרָא שְׁמוֹ נַפְתָּלִי׃", "rashi_he": "נפתולי אלהים. מְנַחֵם בֶּן סָרוּק פֵּרְשׁוֹ בְּמַחְבֶּרֶת צָמִיד פָּתִיל, חִבּוּרִים מֵאֵת הַמָּקוֹם נִתְחַבַּרְתִּי עִם אֲחוֹתִי לִזְכּוֹת לְבָנִים. וַאֲנִי מְפָרְשׁוֹ לְשׁוֹן עִקֵּשׁ וּפְתַלְתֹּל (דברים ל\"ב) – נִתְעַקַּשְׁתִּי וְהִפְצַרְתִּי פְצִירוֹת וְנַפְתּוּלִים הַרְבֵּה לַמָּקוֹם, לִהְיוֹת שָׁוָה לַאֲחוֹתִי:", "rashi_en": "מנחם בן סרוק מפרש 'נפתולי' מלשון 'צמיד פתיל', חיבור: התחברתי עם אחותי בחיבורים מאת ה' לזכות בבנים. רש\"י מפרש מלשון 'עקש ופתלתל': התעקשתי והפצרתי הרבה לפני ה' להיות שווה לאחותי.", "note": "", "points": [{"q": "אֵיךְ מְפָרֵשׁ רַשִׁ\"י עַצְמוֹ אֶת 'נַפְתּוּלֵי אֱלֹהִים נִפְתַּלְתִּי'?", "options": ["הִתְעַקַּשְׁתִּי וְהִפְצַרְתִּי הַרְבֵּה לִפְנֵי ה' לִהְיוֹת שָׁוֶוה לַאֲחוֹתִי", "הִתְחַבַּרְתִּי עִם אֲחוֹתִי בְּחִיבּוּרִים מֵאֵת ה' לִזְכּוֹת לִבְנִים", "נֶאֱבַקְתִּי עִם אֲחוֹתִי וְנִיצַּחְתִּי אוֹתָהּ בְּעֶזְרַת ה'"], "kasha": "מה משמעות המילה 'נפתולי', שאינה מובנת מעצמה?", "answer": "לשון 'עקש ופתלתל': נתעקשתי והפצרתי פצירות ונפתולים הרבה למקום להיות שווה לאחותי.", "kp": ["נתעקשתי והפצרתי פצירות", "להיות שוה לאחותי"]}, {"q": "לְפִי מְנַחֵם בֶּן סָרוּק, מֵאֵיזֶה שׁוֹרֶשׁ בָּאָה הַמִּילָּה 'נַפְתּוּלֵי'?", "options": ["מִלְּשׁוֹן 'צָמִיד פָּתִיל', כְּלוֹמַר חִיבּוּר", "מִלְּשׁוֹן 'עִקֵּשׁ וּפְתַלְתֹּל', כְּלוֹמַר עִיקּוּם", "מִלְּשׁוֹן 'פִּתְאוֹם', כְּלוֹמַר דָּבָר מָהִיר"], "kasha": "יש שני פירושים למילה 'נפתולי', ומה הוא הפירוש הראשון?", "answer": "מנחם פירשו כמו 'צמיד פתיל': חיבורים מאת המקום נתחברתי עם אחותי לזכות לבנים.", "kp": ["במחברת צמיד פתיל", "חבורים מאת המקום"]}]}, {"id": "30:8.2", "ch": 30, "v": 8, "n": 2, "dh": "גם יכלתי", "pasuk_html": "וַתֹּ֣אמֶר רָחֵ֗ל נַפְתּוּלֵ֨י אֱלֹהִ֧ים ׀ נִפְתַּ֛לְתִּי עִם־אֲחֹתִ֖י <mark>גַּם־יָכֹ֑לְתִּי</mark> וַתִּקְרָ֥א שְׁמ֖וֹ נַפְתָּלִֽי׃", "pasuk_en": "וַתֹּאמֶר רָחֵל נַפְתּוּלֵי אֱלֹהִים נִפְתַּלְתִּי עִם־אֲחֹתִי גַּם־יָכֹלְתִּי וַתִּקְרָא שְׁמוֹ נַפְתָּלִי׃", "rashi_he": "גם יכלתי. הִסְכִּים עַל יָדִי; וְאֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן תְּפִלָּה, כְּמוֹ נַפְתּוּלֵי אֱלֹהִים נִתְפַּלְתִּי בַּקָּשׁוֹת הַחֲבִיבוֹת לְפָנָיו; נִתְקַבַּלְתִּי, וְנֶעֱתַרְתִּי כַאֲחוֹתִי:", "rashi_en": "\"יכלתי\" פירושו שהקב\"ה הסכים לבקשתי. ואונקלוס מפרש \"נפתולי\" מלשון תפילה: התפללתי תפילות חביבות לפני ה', נתקבלתי ונענתי כאחותי.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"יָכֹלְתִּי\" לְפִי רַשִׁ\"י?", "options": ["הַקב\"ה הִסְכִּים לְבַקָּשָׁתִי", "נִיצַּחְתִּי אֶת אֲחוֹתִי בְּמַאֲבָק בֵּינֵנוּ", "הִצְלַחְתִּי לְהוֹלִיד בְּכוֹחוֹת עַצְמִי"], "kasha": "\"יכלתי\" נשמע כניצחון במאבק, ולא ברור את מי ניצחה רחל.", "answer": "\"יכלתי\" פירושו: הסכים על ידי, כלומר הקב\"ה הסכים לבקשתי.", "kp": ["הסכים על ידי"]}, {"q": "כֵּיצַד פֵּירֵשׁ אוּנְקְלוֹס אֶת \"נַפְתּוּלֵי אֱלֹהִים נִפְתַּלְתִּי\"?", "options": ["לְשׁוֹן תְּפִילָּה: הִתְפַּלַּלְתִּי תְּפִילּוֹת חֲבִיבוֹת לִפְנֵי ה'", "לְשׁוֹן מַאֲבָק: נֶאֱבַקְתִּי עִם אֲחוֹתִי בְּכָל כּוֹחִי", "לְשׁוֹן פָּתִיל: נִקְשַׁרְתִּי לַאֲחוֹתִי בְּקֶשֶׁר חָזָק"], "kasha": "הביטוי \"נפתולי אלהים\" קשה להבנה ואינו ברור מה פירושו.", "answer": "אונקלוס תרגם לשון תפילה: בקשות החביבות לפניו התפללתי, נתקבלתי ונעתרתי כאחותי.", "kp": ["תרגם לשון תפלה", "בקשות החביבות לפניו"]}]}, {"id": "30:8.3", "ch": 30, "v": 8, "n": 3, "dh": "נפתלתי", "pasuk_html": "וַתֹּ֣אמֶר רָחֵ֗ל נַפְתּוּלֵ֨י אֱלֹהִ֧ים ׀ <mark>נִפְתַּ֛לְתִּי</mark> עִם־אֲחֹתִ֖י גַּם־יָכֹ֑לְתִּי וַתִּקְרָ֥א שְׁמ֖וֹ נַפְתָּלִֽי׃", "pasuk_en": "וַתֹּאמֶר רָחֵל נַפְתּוּלֵי אֱלֹהִים נִפְתַּלְתִּי עִם־אֲחֹתִי גַּם־יָכֹלְתִּי וַתִּקְרָא שְׁמוֹ נַפְתָּלִי׃", "rashi_he": "נפתלתי. נִתְקַבְּלָה תְפִלָּתִי, וּמִ\"אַ יֵשׁ רַבִּים בִּלְשׁוֹן נוֹטָרִיקוֹן:", "rashi_en": "\"נפתלתי\" פירושו נתקבלה תפילתי. ויש גם מדרשים רבים שדורשים את המילה בדרך נוטריקון.", "note": "", "points": [{"q": "לְפִי הַפְּשָׁט, מָה פֵּירוּשׁ הַמִּילָּה \"נִפְתַּלְתִּי\"?", "options": ["נִתְקַבְּלָה תְּפִילָּתִי", "נִפְרַדְתִּי מֵאֲחוֹתִי וְהָלַכְתִּי לְדַרְכִּי", "הִתְפַּלַּלְתִּי וַעֲדַיִין לֹא נֶעֱנֵיתִי"], "kasha": "המילה \"נפתלתי\" אינה מצויה, ולא ברור מה פירושה.", "answer": "נתקבלה תפילתי; ויש מדרשים רבים שדורשים אותה בלשון נוטריקון.", "kp": ["נתקבלה תפלתי"]}]}, {"id": "30:10.1", "ch": 30, "v": 10, "n": 1, "dh": "ותלד זלפה", "pasuk_html": "<mark>וַתֵּ֗לֶד זִלְפָּ֛ה</mark> שִׁפְחַ֥ת לֵאָ֖ה לְיַעֲקֹ֥ב בֵּֽן׃", "pasuk_en": "וַתֵּלֶד זִלְפָּה שִׁפְחַת לֵאָה לְיַעֲקֹב בֵּן׃", "rashi_he": "ותלד זלפה. בְּכֻלָּן נֶאֱמַר הֵרָיוֹן חוּץ מִזִּלְפָּה, לְפִי שֶׁהָיְתָה בַחוּרָה מִכֻּלָּן וְתִינֹקֶת בְּשָׁנִים וְאֵין הֵרָיוֹן נִכָּר בָּהּ; וּכְדֵי לְרַמּוֹת לְיַעֲקֹב, נְתָנָהּ לָבָן לְלֵאָה, שֶׁלֹּא יָבִין שֶׁמַּכְנִיסִין לוֹ אֶת לֵאָה, שֶׁכָּךְ מִנְהָג לִתֵּן שִׁפְחָה הַגְּדוֹלָה לַגְּדוֹלָה וּקְטַנָּה לַקְּטַנָּה:", "rashi_en": "אצל זלפה לא נאמר \"ותהר\", כי הייתה הצעירה מכולן ולא היה הריונה ניכר. לבן נתן אותה ללאה כדי לרמות את יעקב, כי המנהג היה לתת את השפחה הגדולה לבת הגדולה, וכך לא יבין יעקב שמביאים לו את לאה.", "note": "", "points": [{"q": "מַדּוּעַ לֹא נֶאֱמַר הֵרָיוֹן אֵצֶל זִלְפָּה?", "options": ["כִּי הָיְיתָה צְעִירָה מִכּוּלָּן, וְהֵרְיוֹנָהּ לֹא הָיָה נִיכָּר", "כִּי יָלְדָה בְּדֶרֶךְ נֵס בְּלִי הֵרָיוֹן", "כִּי לֹא הָיְיתָה נֶחְשֶׁבֶת לְאִשְׁתּוֹ שֶׁל יַעֲקֹב"], "kasha": "אצל כל האמהות נאמר \"ותהר\", ואצל זלפה נאמר רק \"ותלד\".", "answer": "לפי שהייתה בחורה מכולן ותינוקת בשנים, ואין הריון ניכר בה.", "kp": ["לפי שהיתה בחורה מכלן", "ואין הריון נכר בה"]}, {"q": "מַדּוּעַ נָתַן לָבָן אֶת זִלְפָּה הַצְּעִירָה דַּוְוקָא לְלֵאָה?", "options": ["כְּדֵי לְרַמּוֹת אֶת יַעֲקֹב שֶׁלֹּא יָבִין שֶׁמְּבִיאִים לוֹ אֶת לֵאָה", "כִּי לֵאָה בִּיקְּשָׁה שִׁפְחָה צְעִירָה שֶׁתְּשָׁרֵת אוֹתָהּ", "כִּי זִלְפָּה הָיְיתָה הַחֲבִיבָה עָלָיו מִבֵּין הַשְּׁפָחוֹת"], "kasha": "המנהג היה לתת שפחה גדולה לבת הגדולה, ומדוע קיבלה לאה את הצעירה?", "answer": "כדי לרמות את יעקב, שלא יבין שמכניסים לו את לאה, שכך המנהג לתת שפחה גדולה לגדולה וקטנה לקטנה.", "kp": ["וכדי לרמות ליעקב", "שלא יבין שמכניסין לו את לאה"]}]}, {"id": "30:11.1", "ch": 30, "v": 11, "n": 1, "dh": "בא גד", "pasuk_html": "וַתֹּ֥אמֶר לֵאָ֖ה בגד [<mark>בָּ֣א] [גָ֑ד</mark>] וַתִּקְרָ֥א אֶת־שְׁמ֖וֹ גָּֽד׃", "pasuk_en": "וַתֹּאמֶר לֵאָה בגד [בָּא] [גָד] וַתִּקְרָא אֶת־שְׁמוֹ גָּד׃", "rashi_he": "בא גד. בָּא מַזָּל טוֹב, כְּמוֹ גַּד גַּדִּי וְסָנוּק לָא (שבת ס\"ז), וְדוֹמֶה לוֹ הַעֹרְכִים לַגַּד שֻׁלְחָן (ישעיהו ס\"ה), וּמִ\"אַ שֶׁנּוֹלַד מָהוּל, כְּמוֹ גֹּדּוּ אִילָנָא (דניאל ד'), וְלֹא יָדַעְתִּי עַל מָה נִכְתְּבָה תֵּבָה אַחַת; דָּ\"אַ לָמָּה נִקְרֵאת תֵּבָה אַחַת בָּגָד, כְּמוֹ בָּגַדְתָּ בִּי, כְּשֶׁבָּאתָ אֶל שִׁפְחָתִי, כְּאִישׁ שֶׁבָּגַד בְּאֵשֶׁת נְעוּרִים:", "rashi_en": "״בא גד״ - בא מזל טוב. במדרש: שנולד מהול, מלשון ״גדו אילנא״ (קוצו את האילן). ונקרא כתיבה אחת ״בגד״ מלשון בגידה: בגדת בי כשבאת אל שפחתי.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״גָּד״ לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן בְּרַשִׁ״י?", "options": ["בָּא מַזָּל טוֹב", "בָּא גְּדוּד שֶׁל אֲנָשִׁים", "בָּא בֵּן שֶׁנּוֹלַד מָהוּל"], "kasha": "מה משמעות המילה ״גד״ שבשם הבן?", "answer": "בא מזל טוב, כמו ״גד גדי וסנוק לא״.", "kp": ["בא מזל טוב"]}, {"q": "לְפִי הַפֵּירוּשׁ הָאַחֲרוֹן, לָמָּה נִכְתַּב ״בגד״ בְּמִילָּה אַחַת?", "options": ["מִלְּשׁוֹן בְּגִידָה: בָּגַדְתְּ בִּי כְּשֶׁבָּאתְ אֶל שִׁפְחָתִי", "כִּי הַבֵּן נוֹלַד עָטוּף בְּבֶגֶד", "כִּי לֵאָה תָּפְרָה לוֹ בֶּגֶד מְיוּחָד"], "kasha": "למה ״בא גד״ כתוב כתיבה אחת?", "answer": "כמו ״בגדת בי״ כשבאת אל שפחתי, כאיש שבגד באשת נעורים.", "kp": ["בגדת בי, כשבאת אל שפחתי"]}]}, {"id": "30:14.1", "ch": 30, "v": 14, "n": 1, "dh": "בימי קציר חטים", "pasuk_html": "וַיֵּ֨לֶךְ רְאוּבֵ֜ן <mark>בִּימֵ֣י קְצִיר־חִטִּ֗ים</mark> וַיִּמְצָ֤א דֽוּדָאִים֙ בַּשָּׂדֶ֔ה וַיָּבֵ֣א אֹתָ֔ם אֶל־לֵאָ֖ה אִמּ֑וֹ וַתֹּ֤אמֶר רָחֵל֙ אֶל־לֵאָ֔ה תְּנִי־נָ֣א לִ֔י מִדּוּדָאֵ֖י בְּנֵֽךְ׃", "pasuk_en": "וַיֵּלֶךְ רְאוּבֵן בִּימֵי קְצִיר־חִטִּים וַיִּמְצָא דוּדָאִים בַּשָּׂדֶה וַיָּבֵא אֹתָם אֶל־לֵאָה אִמּוֹ וַתֹּאמֶר רָחֵל אֶל־לֵאָה תְּנִי־נָא לִי מִדּוּדָאֵי בְּנֵךְ׃", "rashi_he": "בימי קציר חטים. לְהַגִּיד שִׁבְחָן שֶׁל שְׁבָטִים; שְׁעַת הַקָּצִיר הָיָה וְלֹא פָשַׁט יָדוֹ בַגֶּזֶל לְהָבִיא חִטִּים וּשְׂעוֹרִים, אֶלָּא דְּבַר הַהֶפְקֵר, שֶׁאֵין אָדָם מַקְפִּיד בּוֹ:", "rashi_en": "התורה מציינת את זמן הקציר כדי ללמד את שבחם של השבטים: אף שהיה זמן קציר, ראובן לא לקח חיטים או שעורים של אחרים אלא רק דודאים, שהם הפקר ואין אדם מקפיד עליהם.", "note": "", "points": [{"q": "מַדּוּעַ מְצַיֶּינֶת הַתּוֹרָה שֶׁרְאוּבֵן הָלַךְ ״בִּימֵי קְצִיר־חִטִּים״?", "options": ["לְהַרְאוֹת שֶׁלֹּא גָּזַל תְּבוּאָה אֶלָּא הֵבִיא רַק דָּבָר הֶפְקֵר", "לְהַסְבִּיר שֶׁהַדּוּדָאִים צוֹמְחִים רַק בָּעוֹנָה זוֹ", "לְלַמֵּד שֶׁרְאוּבֵן עָבַד בַּשָּׂדֶה עִם הַקּוֹצְרִים"], "kasha": "מה הנפקא מינה באיזו עונה מצא ראובן את הדודאים?", "answer": "להגיד שבחן של שבטים: שעת הקציר הייתה ולא פשט ידו בגזל להביא חיטים ושעורים, אלא דבר ההפקר שאין אדם מקפיד בו.", "kp": ["להגיד שבחן של שבטים", "ולא פשט ידו בגזל", "אלא דבר ההפקר"]}]}, {"id": "30:14.2", "ch": 30, "v": 14, "n": 2, "dh": "דודאים", "pasuk_html": "וַיֵּ֨לֶךְ רְאוּבֵ֜ן בִּימֵ֣י קְצִיר־חִטִּ֗ים וַיִּמְצָ֤א <mark>דֽוּדָאִים֙</mark> בַּשָּׂדֶ֔ה וַיָּבֵ֣א אֹתָ֔ם אֶל־לֵאָ֖ה אִמּ֑וֹ וַתֹּ֤אמֶר רָחֵל֙ אֶל־לֵאָ֔ה תְּנִי־נָ֣א לִ֔י מִדּוּדָאֵ֖י בְּנֵֽךְ׃", "pasuk_en": "וַיֵּלֶךְ רְאוּבֵן בִּימֵי קְצִיר־חִטִּים וַיִּמְצָא דוּדָאִים בַּשָּׂדֶה וַיָּבֵא אֹתָם אֶל־לֵאָה אִמּוֹ וַתֹּאמֶר רָחֵל אֶל־לֵאָה תְּנִי־נָא לִי מִדּוּדָאֵי בְּנֵךְ׃", "rashi_he": "דודאים. סִיגְלִי, עֵשֶׂב הוּא (סנהדרין צ\"ט), וּבִלְשׁוֹן יִשְׁמָעֵאל יַסְמִי\"ן:", "rashi_en": "דודאים הם עשב, \"סיגלי\", ובערבית נקרא יסמין.", "note": "", "points": [{"q": "מָה הֵם הַ\"דוּדָאִים\" שֶׁמָּצָא רְאוּבֵן בַּשָּׂדֶה?", "options": ["עֵשֶׂב שֶׁשְּׁמוֹ סִיגְלִי, וּבַעֲרָבִית יַסְמִין", "פֵּירוֹת שֶׁל עֵץ תְּאֵנָה שֶׁגָּדֵל בַּשָּׂדֶה", "שִׁיבּוֹלֵי חִיטָּה שֶׁנִּשְׁאֲרוּ אַחֲרֵי הַקָּצִיר"], "kasha": "מה פירוש המילה הנדירה \"דודאים\"?", "answer": "סיגלי, עשב הוא, ובלשון ישמעאל יסמי\"ן.", "kp": ["סיגלי, עשב הוא", "ובלשון ישמעאל"]}]}, {"id": "30:15.1", "ch": 30, "v": 15, "n": 1, "dh": "ולקחת גם את דודאי בני", "pasuk_html": "וַתֹּ֣אמֶר לָ֗הּ הַמְעַט֙ קַחְתֵּ֣ךְ אֶת־אִישִׁ֔י <mark>וְלָקַ֕חַת גַּ֥ם אֶת־דּוּדָאֵ֖י בְּנִ֑י</mark> וַתֹּ֣אמֶר רָחֵ֗ל לָכֵן֙ יִשְׁכַּ֤ב עִמָּךְ֙ הַלַּ֔יְלָה תַּ֖חַת דּוּדָאֵ֥י בְנֵֽךְ׃", "pasuk_en": "וַתֹּאמֶר לָהּ הַמְעַט קַחְתֵּךְ אֶת־אִישִׁי וְלָקַחַת גַּם אֶת־דּוּדָאֵי בְּנִי וַתֹּאמֶר רָחֵל לָכֵן יִשְׁכַּב עִמָּךְ הַלַּיְלָה תַּחַת דּוּדָאֵי בְנֵךְ׃", "rashi_he": "ולקחת גם את דודאי בני. בִּתְמִיהָ, וְלַעֲשׂוֹת עוֹד זֹאת לִקַּח גַם אֶת דּוּדָאֵי בְּנִי; וְתַרְגּוּמוֹ וּלְמֵיסַב:", "rashi_en": "לאה שואלת בתמיהה: האם לא די שלקחת את אישי, ועוד תעשי גם זאת, לקחת את דודאי בני? אונקלוס מתרגם \"ולמיסב\", לשון לקיחה.", "note": "", "points": [{"q": "כֵּיצַד יֵשׁ לְהָבִין אֶת דִּבְרֵי לֵאָה \"וְלָקַחַת גַּם\" עַל הַדּוּדָאִים?", "options": ["כְּשֶׁאֵלַת תְּמִיהָה: הַאִם תִּיקְחִי עוֹד גַּם אֶת דּוּדָאֵי בְּנִי?", "כְּצִיוּוִי: קְחִי לָךְ גַּם אֶת דּוּדָאֵי בְּנִי", "כְּתֵיאוּר: וּכְבָר לָקַחְתְּ מִמֶּנִּי אֶת דּוּדָאֵי בְּנִי"], "kasha": "מהמילה \"ולקחת\" אפשר להבין כאילו לאה מציעה לרחל לקחת את הדודאים.", "answer": "הדברים נאמרו בתמיהה: לא די שלקחת את אישי, ועוד תעשי זאת, לקחת גם את דודאי בני? ואונקלוס תרגם \"ולמיסב\".", "kp": ["בתמיה", "ולעשות עוד זאת לקח"]}]}, {"id": "30:15.2", "ch": 30, "v": 15, "n": 2, "dh": "לכן ישכב עמך הלילה", "pasuk_html": "וַתֹּ֣אמֶר לָ֗הּ הַמְעַט֙ קַחְתֵּ֣ךְ אֶת־אִישִׁ֔י וְלָקַ֕חַת גַּ֥ם אֶת־דּוּדָאֵ֖י בְּנִ֑י וַתֹּ֣אמֶר רָחֵ֗ל <mark>לָכֵן֙ יִשְׁכַּ֤ב עִמָּךְ֙ הַלַּ֔יְלָה</mark> תַּ֖חַת דּוּדָאֵ֥י בְנֵֽךְ׃", "pasuk_en": "וַתֹּאמֶר לָהּ הַמְעַט קַחְתֵּךְ אֶת־אִישִׁי וְלָקַחַת גַּם אֶת־דּוּדָאֵי בְּנִי וַתֹּאמֶר רָחֵל לָכֵן יִשְׁכַּב עִמָּךְ הַלַּיְלָה תַּחַת דּוּדָאֵי בְנֵךְ׃", "rashi_he": "לכן ישכב עמך הלילה. שֶׁלִּי הָיְתָה שְׁכִיבַת לַיְלָה זוֹ, וַאֲנִי נוֹתְנָה לָךְ תַּחַת דּוּדָאֵי בְנֵךְ, וּלְפִי שֶׁזִּלְזְלָה בְּמִשְׁכַּב הַצַּדִּיק לֹא זָכְתָה לְהִקָּבֵר עִמּוֹ (נדה ל\"א):", "rashi_en": "רחל אמרה: הלילה היה אמור יעקב להיות אצלי, ואני נותנת אותו לך תמורת הדודאים. ומפני שזלזלה בשכיבה עם הצדיק, לא זכתה להיקבר עמו.", "note": "", "points": [{"q": "לָמָּה לֹא זָכְתָה רָחֵל לְהִיקָּבֵר עִם יַעֲקֹב לְפִי רַשִׁ\"י?", "options": ["כִּי זִלְזְלָה בְּמִשְׁכַּב הַצַּדִּיק כְּשֶׁמָּכְרָה אוֹתוֹ בַּדּוּדָאִים", "כִּי גָנְבָה אֶת הַתְּרָפִים מִבֵּית אָבִיהָ", "כִּי קִינְּאָה בַּאֲחוֹתָהּ וְדָרְשָׁה מִיַּעֲקֹב בָּנִים"], "kasha": "רחל נותנת את הלילה שלה ללאה, ומה נלמד מכך?", "answer": "שלה הייתה שכיבת הלילה ונתנה אותה תמורת הדודאים, ולפי שזלזלה במשכב הצדיק לא זכתה להיקבר עמו.", "kp": ["ולפי שזלזלה במשכב הצדיק", "תחת דודאי בנך"]}]}, {"id": "30:16.1", "ch": 30, "v": 16, "n": 1, "dh": "שכר שכרתיך", "pasuk_html": "וַיָּבֹ֨א יַעֲקֹ֣ב מִן־הַשָּׂדֶה֮ בָּעֶרֶב֒ וַתֵּצֵ֨א לֵאָ֜ה לִקְרָאת֗וֹ וַתֹּ֙אמֶר֙ אֵלַ֣י תָּב֔וֹא כִּ֚י <mark>שָׂכֹ֣ר שְׂכַרְתִּ֔יךָ</mark> בְּדוּדָאֵ֖י בְּנִ֑י וַיִּשְׁכַּ֥ב עִמָּ֖הּ בַּלַּ֥יְלָה הֽוּא׃", "pasuk_en": "וַיָּבֹא יַעֲקֹב מִן־הַשָּׂדֶה בָּעֶרֶב וַתֵּצֵא לֵאָה לִקְרָאתוֹ וַתֹּאמֶר אֵלַי תָּבוֹא כִּי שָׂכֹר שְׂכַרְתִּיךָ בְּדוּדָאֵי בְּנִי וַיִּשְׁכַּב עִמָּהּ בַּלַּיְלָה הוּא׃", "rashi_he": "שכר שכרתיך. נָתַתִּי לְרָחֵל שְׂכָרָהּ:", "rashi_en": "לאה אמרה ליעקב שכבר שילמה לרחל את שכרה, את הדודאים, תמורת הלילה הזה.", "note": "", "points": [{"q": "לְמִי שִׁילְּמָה לֵאָה אֶת הַשָּׂכָר לְפִי רַשִׁ\"י?", "options": ["לְרָחֵל, שֶׁקִּיבְּלָה אֶת הַדּוּדָאִים תְּמוּרַת הַלַּיְלָה", "לְיַעֲקֹב, שֶׁקִּיבֵּל מִמֶּנָּה אֶת הַדּוּדָאִים", "לִרְאוּבֵן, שֶׁהֵבִיא אֶת הַדּוּדָאִים מִן הַשָּׂדֶה"], "kasha": "\"שכרתיך\" נשמע כאילו שכרה את יעקב עצמו, ולא מובן למי שילמה.", "answer": "נתתי לרחל שכרה.", "kp": ["נתתי לרחל שכרה"]}]}, {"id": "30:16.2", "ch": 30, "v": 16, "n": 2, "dh": "בלילה הוא", "pasuk_html": "וַיָּבֹ֨א יַעֲקֹ֣ב מִן־הַשָּׂדֶה֮ בָּעֶרֶב֒ וַתֵּצֵ֨א לֵאָ֜ה לִקְרָאת֗וֹ וַתֹּ֙אמֶר֙ אֵלַ֣י תָּב֔וֹא כִּ֚י שָׂכֹ֣ר שְׂכַרְתִּ֔יךָ בְּדוּדָאֵ֖י בְּנִ֑י וַיִּשְׁכַּ֥ב עִמָּ֖הּ <mark>בַּלַּ֥יְלָה הֽוּא׃</mark>", "pasuk_en": "וַיָּבֹא יַעֲקֹב מִן־הַשָּׂדֶה בָּעֶרֶב וַתֵּצֵא לֵאָה לִקְרָאתוֹ וַתֹּאמֶר אֵלַי תָּבוֹא כִּי שָׂכֹר שְׂכַרְתִּיךָ בְּדוּדָאֵי בְּנִי וַיִּשְׁכַּב עִמָּהּ בַּלַּיְלָה הוּא׃", "rashi_he": "בלילה הוא. הַקָּבָּ\"ה סִיְּעוֹ, שֶׁיָּצָא מִשָּׁם יִשָּׂשכָר (בראשית רבה):", "rashi_en": "המילה \"הוא\" רומזת לקב\"ה: הקב\"ה סייע ליעקב באותו לילה, כדי שייוולד משם יששכר.", "note": "", "points": [{"q": "עַל מָה רוֹמֶזֶת הַמִּילָה \"הוּא\" בְּמִילִּים \"בַּלַּיְלָה הוּא\"?", "options": ["שֶׁהַקָּב\"ה סִיֵּיעַ לְיַעֲקֹב, כְּדֵי שֶׁיִּיוָּולֵד מִשָּׁם יִשָּׂשכָר", "שֶׁהָיָה זֶה הַלַּיְלָה שֶׁל רָחֵל, שֶׁמָּכְרָה אוֹתוֹ לְלֵאָה", "שֶׁבְּאוֹתוֹ לַיְלָה בִּלְבַד שָׁכַב עִמָּהּ וְלֹא יוֹתֵר"], "kasha": "המילה \"הוא\" מיותרת, די היה לכתוב \"בלילה\".", "answer": "הקב\"ה סייעו, שיצא משם יששכר.", "kp": ["בלילה הוא", "שיצא משם יששכר"]}]}, {"id": "30:17.1", "ch": 30, "v": 17, "n": 1, "dh": "וישמע אלהים אל לאה", "pasuk_html": "<mark>וַיִּשְׁמַ֥ע אֱלֹהִ֖ים אֶל־לֵאָ֑ה</mark> וַתַּ֛הַר וַתֵּ֥לֶד לְיַעֲקֹ֖ב בֵּ֥ן חֲמִישִֽׁי׃", "pasuk_en": "וַיִּשְׁמַע אֱלֹהִים אֶל־לֵאָה וַתַּהַר וַתֵּלֶד לְיַעֲקֹב בֵּן חֲמִישִׁי׃", "rashi_he": "וישמע אלהים אל לאה. שֶׁהָיְתָה מִתְאַוָּה וּמְחַזֶּרֶת לְהַרְבּוֹת שְׁבָטִים:", "rashi_en": "ה' שמע את רצונה של לאה, שהייתה משתוקקת ומשתדלת להרבות שבטים.", "note": "", "points": [{"q": "מָה שָׁמַע ה' מִלֵּאָה?", "options": ["שֶׁהָיְיתָה מִתְאַוָּוה וּמִשְׁתַּדֶּלֶת לְהַרְבּוֹת שְׁבָטִים", "שֶׁהִתְפַּלְּלָה שֶׁיַּעֲקֹב יֶאֱהַב אוֹתָהּ יוֹתֵר מֵרָחֵל", "שֶׁהִתְחָרְטָה עַל שֶׁלָּקְחָה אֶת דּוּדָאֵי בְּנָהּ"], "kasha": "לא נזכר בפסוק שלאה התפללה, ומה \"שמע\" ה'?", "answer": "שהייתה מתאווה ומחזרת להרבות שבטים.", "kp": ["שהיתה מתאוה ומחזרת להרבות שבטים"]}]}, {"id": "30:20.1", "ch": 30, "v": 20, "n": 1, "dh": "זבד טוב", "pasuk_html": "וַתֹּ֣אמֶר לֵאָ֗ה זְבָדַ֨נִי אֱלֹהִ֥ים ׀ אֹתִי֮ <mark>זֵ֣בֶד טוֹב֒</mark> הַפַּ֙עַם֙ יִזְבְּלֵ֣נִי אִישִׁ֔י כִּֽי־יָלַ֥דְתִּי ל֖וֹ שִׁשָּׁ֣ה בָנִ֑ים וַתִּקְרָ֥א אֶת־שְׁמ֖וֹ זְבֻלֽוּן׃", "pasuk_en": "וַתֹּאמֶר לֵאָה זְבָדַנִי אֱלֹהִים אֹתִי זֵבֶד טוֹב הַפַּעַם יִזְבְּלֵנִי אִישִׁי כִּי־יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים וַתִּקְרָא אֶת־שְׁמוֹ זְבֻלוּן׃", "rashi_he": "זבד טוב. כְּתַרְגּוּמוֹ:", "rashi_en": "״זבד טוב״ פירושו כתרגום אונקלוס: חלק טוב.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״זֵבֶד טוֹב״ לְפִי רַשִׁ״י?", "options": ["כְּתַרְגּוּם אוּנְקְלוֹס: חֵלֶק טוֹב", "בַּיִת טוֹב וּמִשְׁכָּן קָבוּעַ", "מַתָּנָה שֶׁקִּיבְּלָה לֵאָה מֵאָבִיהָ"], "kasha": "המילה ״זבד״ נדירה ואינה מובנת מאליה.", "answer": "כתרגומו - חלק טוב.", "kp": ["כתרגומו"]}]}, {"id": "30:20.2", "ch": 30, "v": 20, "n": 2, "dh": "יזבלני", "pasuk_html": "וַתֹּ֣אמֶר לֵאָ֗ה זְבָדַ֨נִי אֱלֹהִ֥ים ׀ אֹתִי֮ זֵ֣בֶד טוֹב֒ הַפַּ֙עַם֙ <mark>יִזְבְּלֵ֣נִי</mark> אִישִׁ֔י כִּֽי־יָלַ֥דְתִּי ל֖וֹ שִׁשָּׁ֣ה בָנִ֑ים וַתִּקְרָ֥א אֶת־שְׁמ֖וֹ זְבֻלֽוּן׃", "pasuk_en": "וַתֹּאמֶר לֵאָה זְבָדַנִי אֱלֹהִים אֹתִי זֵבֶד טוֹב הַפַּעַם יִזְבְּלֵנִי אִישִׁי כִּי־יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים וַתִּקְרָא אֶת־שְׁמוֹ זְבֻלוּן׃", "rashi_he": "יזבלני. לְ' בֵּית זְבֻל (מלכים א ח' י\"ג), הירבריי\"א בְּלַעַז, בֵּית מָדוֹר, מֵעַתָּה לֹא תְהֵא עִקַּר דִּירָתוֹ אֶלָּא עִמִּי שֶׁיֵּשׁ לִי בָנִים כְּנֶגֶד כָּל נָשָׁיו:", "rashi_en": "״יזבלני״ הוא מלשון ״בית זבול״, כלומר מקום מגורים. לאה אמרה שמעתה עיקר דירתו של יעקב יהיה איתה, כי יש לה בנים כנגד כל שאר נשיו.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״יִזְבְּלֵנִי אִישִׁי״ לְפִי רַשִׁ״י?", "options": ["עִיקַּר דִּירָתוֹ שֶׁל יַעֲקֹב תִּהְיֶה אֶצְלִי", "בַּעְלִי יִתֵּן לִי מַתָּנָה טוֹבָה", "בַּעֲלִי יֶאֱהַב אוֹתִי יוֹתֵר מֵרָחֵל"], "kasha": "מה משמעות המילה הנדירה ״יזבלני״?", "answer": "לשון בית זבול, בית מדור: מעתה לא תהא עיקר דירתו אלא עמי, שיש לי בנים כנגד כל נשיו.", "kp": ["בית מדור", "לא תהא עקר דירתו אלא עמי"]}]}, {"id": "30:21.1", "ch": 30, "v": 21, "n": 1, "dh": "דינה", "pasuk_html": "וְאַחַ֖ר יָ֣לְדָה בַּ֑ת וַתִּקְרָ֥א אֶת־שְׁמָ֖הּ <mark>דִּינָֽה׃</mark>", "pasuk_en": "וְאַחַר יָלְדָה בַּת וַתִּקְרָא אֶת־שְׁמָהּ דִּינָה׃", "rashi_he": "דינה. פֵּרְשׁוּ רַבּוֹתֵינוּ שֶׁדָּנָה לֵאָה דִּין בְּעַצְמָהּ, אִם זֶה זָכָר לֹא תְהֵא רָחֵל אֲחוֹתִי כְּאַחַת הַשְּׁפָחוֹת, וְהִתְפַּלְּלָה עָלָיו וְנֶהְפַּךְ לִנְקֵבָה (ברכות ס'):", "rashi_en": "לאה דנה דין בעצמה: אם העובר הזה יהיה זכר, רחל אחותי לא תהיה אפילו כאחת השפחות. התפללה עליו, ונהפך לנקבה, ולכן קראה לה דינה.", "note": "", "points": [{"q": "מַדּוּעַ נִקְרְאָה הַבַּת \"דִּינָה\"?", "options": ["כִּי לֵאָה דָּנָה דִּין בְּעַצְמָהּ וְהִתְפַּלְּלָה, וְהָעוּבָּר נֶהְפַּךְ לִנְקֵבָה", "כִּי ה' דָּן אֶת לֵאָה וְנָתַן לָהּ בַּת בִּמְקוֹם בֵּן", "כִּי לֵאָה רָצְתָה שֶׁבִּתָּהּ תִּהְיֶה דַּיֶּינֶת חֲכָמָה"], "kasha": "בכל הבנים נאמר טעם לשמם, ומה טעם השם \"דינה\"?", "answer": "דנה לאה דין בעצמה: אם זה זכר לא תהא רחל אחותי כאחת השפחות; והתפללה עליו ונהפך לנקבה.", "kp": ["שדנה לאה דין בעצמה", "והתפללה עליו ונהפך לנקבה"]}]}, {"id": "30:22.1", "ch": 30, "v": 22, "n": 1, "dh": "ויזכור אלהים את רחל", "pasuk_html": "<mark>וַיִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת־רָחֵ֑ל</mark> וַיִּשְׁמַ֤ע אֵלֶ֙יהָ֙ אֱלֹהִ֔ים וַיִּפְתַּ֖ח אֶת־רַחְמָֽהּ׃", "pasuk_en": "וַיִּזְכֹּר אֱלֹהִים אֶת־רָחֵל וַיִּשְׁמַע אֵלֶיהָ אֱלֹהִים וַיִּפְתַּח אֶת־רַחְמָהּ׃", "rashi_he": "ויזכור אלהים את רחל. זָכַר לָהּ שֶׁמָּסְרָה סִימָנֶיהָ לַאֲחוֹתָהּ וְשֶׁהָיְתָה מְצֵרָה שֶׁמָּא תַּעֲלֶה בְּגוֹרָלוֹ שֶׁל עֵשָׂו, שֶׁמָּא יְגָרְשֶׁנָּה יַעֲקֹב לְפִי שֶׁאֵין לָהּ בָּנִים, וְאַף עֵשָׂו הָרָשָׁע כָּךְ עָלָה בְּלִבּוֹ כְּשֶׁשָּׁמַע שֶׁאֵין לָהּ בָּנִים; הוּא שֶׁיִּסֵּד הַפַּיָּט הָאַדְמוֹן כְּבָט שֶׁלֹּא חָלָה, צָבָה לְקַחְתָּהּ לוֹ וְנִתְבֶּהָלָה:", "rashi_en": "ה׳ זכר לרחל שמסרה את סימניה לאחותה, ושהייתה מצטערת שמא יגרש אותה יעקב כי אין לה בנים, ותיפול בגורלו של עשו. גם עשו חשב כך כששמע שאין לה בנים.", "note": "", "points": [{"q": "אֵיזוֹ זְכוּת זָכַר ה׳ לְרָחֵל כְּשֶׁפָּקַד אוֹתָהּ בְּבָנִים?", "options": ["שֶׁמָּסְרָה אֶת סִימָנֶיהָ לַאֲחוֹתָהּ לֵאָה", "שֶׁהִתְפַּלְּלָה בְּכָל יוֹם עַל בָּנִים", "שֶׁנָּתְנָה אֶת בִּלְהָה שִׁפְחָתָהּ לְיַעֲקֹב"], "kasha": "\"ויזכור\" מורה שה׳ זכר לרחל דבר מסוים לטובתה, ומהו?", "answer": "זכר לה שמסרה סימניה לאחותה.", "kp": ["זכר לה שמסרה סימניה לאחותה"]}, {"q": "מִמָּה חָשְׁשָׁה רָחֵל כָּל זְמַן שֶׁלֹּא הָיוּ לָהּ בָּנִים?", "options": ["שֶׁיַּעֲקֹב יְגָרְשֶׁנָּה וְתִיפּוֹל בְּגוֹרָלוֹ שֶׁל עֵשָׂו", "שֶׁלֵּאָה תִּהְיֶה הַגְּבִירָה הַיְּחִידָה בַּבַּיִת", "שֶׁלָּבָן לֹא יַרְשֶׁה לְיַעֲקֹב לַחֲזוֹר לְאַרְצוֹ"], "kasha": "מה היה הצער המיוחד של רחל שבגללו ראויה הייתה שה׳ יזכור אותה?", "answer": "היא הייתה מצטערת שמא יגרשנה יעקב כי אין לה בנים, ותעלה בגורלו של עשו; ואף עשו הרשע חשב כך כששמע שאין לה בנים.", "kp": ["שמא תעלה בגורלו של עשו", "שמא יגרשנה יעקב"]}]}, {"id": "30:23.1", "ch": 30, "v": 23, "n": 1, "dh": "אסף", "pasuk_html": "וַתַּ֖הַר וַתֵּ֣לֶד בֵּ֑ן וַתֹּ֕אמֶר <mark>אָסַ֥ף</mark> אֱלֹהִ֖ים אֶת־חֶרְפָּתִֽי׃", "pasuk_en": "וַתַּהַר וַתֵּלֶד בֵּן וַתֹּאמֶר אָסַף אֱלֹהִים אֶת־חֶרְפָּתִי׃", "rashi_he": "אסף. הִכְנִיסָהּ בְּמָקוֹם שֶׁלֹּא תֵרָאֶה, וְכֵן אֱסֹף חֶרְפָּתֵנוּ (ישעיהו ד'), וְלֹא יֵאָסֵף הַבַּיתָה (שמות ט'), אָסְפוּ נָגְהָם (יואל ד'), וִירֵחֵךְ לֹא יֵאָסֵף (ישעיהו ס') – לֹא יִטָּמֵן:", "rashi_en": "'אסף' פירושו הכניס את החרפה למקום שלא תיראה, כלומר הסתיר אותה. כך גם 'ולא יאסף הביתה' ו'וירחך לא יאסף', לא ייטמן.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ 'אָסַף' בַּפָּסוּק לְפִי רַשִׁ\"י?", "options": ["הִכְנִיס אֶת חֶרְפָּתִי לְמָקוֹם שֶׁלֹּא תֵּירָאֶה", "קִיבֵּץ אֶת כָּל הַחֶרְפּוֹת שֶׁסָּבַלְתִּי", "הוֹסִיף לִי כָּבוֹד בִּמְקוֹם הַחֶרְפָּה"], "kasha": "מה משמעות 'אסף' בהקשר של חרפה?", "answer": "הכניסה במקום שלא תיראה, כמו 'ולא יאסף הביתה' ו'וירחך לא יאסף', לשון הטמנה.", "kp": ["הכניסה במקום שלא תראה"]}]}, {"id": "30:23.2", "ch": 30, "v": 23, "n": 2, "dh": "חרפתי", "pasuk_html": "וַתַּ֖הַר וַתֵּ֣לֶד בֵּ֑ן וַתֹּ֕אמֶר אָסַ֥ף אֱלֹהִ֖ים אֶת־<mark>חֶרְפָּתִֽי׃</mark>", "pasuk_en": "וַתַּהַר וַתֵּלֶד בֵּן וַתֹּאמֶר אָסַף אֱלֹהִים אֶת־חֶרְפָּתִי׃", "rashi_he": "חרפתי. שֶׁהָיִיתִי לְחֶרְפָּה שֶׁאֲנִי עֲקָרָה וְהָיוּ אוֹמְרִים עָלַי שֶׁאֱעֶלֶה לְחֶלְקוֹ שֶׁל עֵשָׂו הָרָשָׁע. וְאַגָּדָה: כָּל זְמַן שֶׁאֵין לָאִשָּׁה בֵּן, אֵין לָהּ בְּמִי לִתְלוֹת סִרְחוֹנָהּ, מִשֶּׁיֵשׁ לָהּ בֵּן תּוֹלָה בוֹ: מִי שִׁבֵּר כְּלִי זֶה? בִּנְךָ. מִי אָכַל תְּאֵנִים אֵלּוּ? בִּנְךָ:", "rashi_en": "חרפתה של רחל הייתה שהייתה עקרה, ואמרו עליה שתיפול בחלקו של עשו הרשע. ולפי האגדה: אשה שאין לה בן אין לה על מי לתלות את קלקוליה, ומשיש לה בן היא תולה בו.", "note": "", "points": [{"q": "מָה הָיְיתָה חֶרְפָּתָהּ שֶׁל רָחֵל לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן בְּרַשִׁ\"י?", "options": ["שֶׁהָיְיתָה עֲקָרָה וְאָמְרוּ שֶׁתִּיפּוֹל בְּחֶלְקוֹ שֶׁל עֵשָׂו", "שֶׁאֲחוֹתָהּ לֵאָה נִישְׂאָה לְיַעֲקֹב לְפָנֶיהָ", "שֶׁיַּעֲקֹב כָּעַס עָלֶיהָ כְּשֶׁבִּיקְשָׁה מִמֶּנּוּ בָּנִים"], "kasha": "יש לברר מהי החרפה שה' אסף כשילדה בן.", "answer": "שהייתי לחרפה שאני עקרה, והיו אומרים עלי שאעלה לחלקו של עשו הרשע.", "kp": ["שהייתי לחרפה שאני עקרה", "שאעלה לחלקו של עשו הרשע"]}, {"q": "לְפִי הָאַגָּדָה, כֵּיצַד מֵסִיר הַבֵּן אֶת חֶרְפַּת אִמּוֹ?", "options": ["יֵשׁ לָהּ עַל מִי לִתְלוֹת אֶת הַקִּלְקוּלִים שֶׁבַּבַּיִת", "הַבֵּן מֵגֵן עָלֶיהָ מִפְּנֵי דִּבְרֵי הַשְּׁכֵנִים", "הַבֵּן מַקְנֶה לָהּ כָּבוֹד וִירוּשָּׁה בְּבֵית אָבִיו"], "kasha": "המילה \"אסף\" מתפרשת כאן כהסתרה, ויש להבין כיצד הבן מסתיר את החרפה.", "answer": "כל זמן שאין לאשה בן, אין לה במי לתלות סרחונה; משיש לה בן, תולה בו: מי שבר כלי זה? בנך.", "kp": ["אין לה במי לתלות סרחונה", "משיש לה בן תולה בו"]}]}, {"id": "30:24.1", "ch": 30, "v": 24, "n": 1, "dh": "יסף ה' לי בן אחר", "pasuk_html": "וַתִּקְרָ֧א אֶת־שְׁמ֛וֹ יוֹסֵ֖ף לֵאמֹ֑ר <mark>יֹסֵ֧ף יְהוָ֛ה לִ֖י בֵּ֥ן אַחֵֽר׃</mark>", "pasuk_en": "וַתִּקְרָא אֶת־שְׁמוֹ יוֹסֵף לֵאמֹר יֹסֵף יְהוָה לִי בֵּן אַחֵר׃", "rashi_he": "יסף ה' לי בן אחר. יוֹדַעַת הָיְתָה בִנְבוּאָה שֶׁאֵין יַעֲקֹב עָתִיד לְהַעֲמִיד אֶלָּא שְׁנֵים עָשָׂר שְׁבָטִים, אָמְרָה יְהִי רָצוֹן שֶׁאוֹתוֹ שֶׁהוּא עָתִיד לְהַעֲמִיד יְהֵא מִמֶּנִּי, לְכָךְ לֹא נִתְפַּלְּלָה אֶלָּא עַל בֵּן אַחֵר:", "rashi_en": "רחל ידעה בנבואה שיעקב יעמיד רק שנים עשר שבטים. לכן התפללה שהשבט האחרון שעוד עתיד להיוולד יהיה ממנה, ולא ביקשה יותר מבן אחד.", "note": "", "points": [{"q": "מַדּוּעַ הִתְפַּלְלָה רָחֵל עַל בֵּן אֶחָד בִּלְבַד?", "options": ["יָדְעָה שֶׁיַּעֲקֹב יַעֲמִיד רַק שְׁנֵים עָשָׂר שְׁבָטִים, וְרָצְתָה שֶׁהָאַחֲרוֹן מִמֶּנָּה", "יָדְעָה בִּנְבוּאָה שֶׁתָּמוּת בַּלֵּידָה וְלֹא תִּזְכֶּה לְבָנִים נוֹסָפִים", "חָשְׁשָׁה שֶׁבָּנִים רַבִּים יְעוֹרְרוּ קִנְאָה בֵּינָהּ לְבֵין לֵאָה"], "kasha": "מדוע לא התפללה רחל על בנים רבים, אלא רק על \"בן אחר\"?", "answer": "ידעה בנבואה שיעקב עתיד להעמיד רק שנים עשר שבטים, ואמרה: יהי רצון שאותו שעתיד להעמיד יהיה ממני; לכך התפללה רק על בן אחד.", "kp": ["יודעת היתה בנבואה", "אמרה יהי רצון שאותו", "יהא ממני"]}]}, {"id": "30:25.1", "ch": 30, "v": 25, "n": 1, "dh": "כאשר ילדה רחל את יוסף", "pasuk_html": "וַיְהִ֕י <mark>כַּאֲשֶׁ֛ר יָלְדָ֥ה רָחֵ֖ל אֶת־יוֹסֵ֑ף</mark> וַיֹּ֤אמֶר יַעֲקֹב֙ אֶל־לָבָ֔ן שַׁלְּחֵ֙נִי֙ וְאֵ֣לְכָ֔ה אֶל־מְקוֹמִ֖י וּלְאַרְצִֽי׃", "pasuk_en": "וַיְהִי כַּאֲשֶׁר יָלְדָה רָחֵל אֶת־יוֹסֵף וַיֹּאמֶר יַעֲקֹב אֶל־לָבָן שַׁלְּחֵנִי וְאֵלְכָה אֶל־מְקוֹמִי וּלְאַרְצִי׃", "rashi_he": "כאשר ילדה רחל את יוסף. מִשֶּׁנּוֹלַד שְׂטָנוֹ שֶׁל עֵשָׂו, שֶׁנֶּאֱמַר וְהָיָה בֵית יַעֲקֹב אֵשׁ וּבֵית יוֹסֵף לֶהָבָה וּבֵית עֵשָׂו לְקַשׁ (עובדיה א'), אֵשׁ בְּלֹא לֶהָבָה אֵינוֹ שׁוֹלֵט לְמֵרָחוֹק, מִשֶּׁנּוֹלַד יוֹסֵף בָּטַח יַעֲקֹב בְּהַקָּבָּ\"ה וְרָצָה לָשׁוּב:", "rashi_en": "יוסף הוא שטנו של עשו, כמו שנאמר \"והיה בית יעקב אש ובית יוסף להבה ובית עשו לקש\". אש בלי להבה אינה שולטת למרחוק, ולכן רק כשנולד יוסף בטח יעקב בה' ורצה לחזור.", "note": "", "points": [{"q": "מַדּוּעַ בִּיקֵּשׁ יַעֲקֹב לָשׁוּב לְאַרְצוֹ דַּוְוקָא אַחֲרֵי שֶׁנּוֹלַד יוֹסֵף?", "options": ["כִּי נוֹלַד שְׂטָנוֹ שֶׁל עֵשָׂו, וּבָטַח בַּה' שֶׁיִּגְבַּר עָלָיו", "כִּי רָחֵל בִּיקְשָׁה לַחֲזוֹר לְבֵית יִצְחָק", "כִּי לָבָן גֵּירֵשׁ אוֹתוֹ מִבֵּיתוֹ לְאַחַר הַלֵּידָה"], "kasha": "מה הקשר בין לידת יוסף לבין רצונו של יעקב לחזור לארצו?", "answer": "משנולד שטנו של עשו, שנאמר \"ובית יוסף להבה ובית עשו לקש\"; אש בלא להבה אינה שולטת למרחוק, ומשנולד יוסף בטח יעקב בהקב\"ה ורצה לשוב.", "kp": ["משנולד שטנו של עשו", "משנולד יוסף בטח יעקב"]}]}, {"id": "30:26.1", "ch": 30, "v": 26, "n": 1, "dh": "תנה את נשי וגו'", "pasuk_html": "<mark>תְּנָ֞ה אֶת־נָשַׁ֣י</mark> וְאֶת־יְלָדַ֗י אֲשֶׁ֨ר עָבַ֧דְתִּי אֹֽתְךָ֛ בָּהֵ֖ן וְאֵלֵ֑כָה כִּ֚י אַתָּ֣ה יָדַ֔עְתָּ אֶת־עֲבֹדָתִ֖י אֲשֶׁ֥ר עֲבַדְתִּֽיךָ׃", "pasuk_en": "תְּנָה אֶת־נָשַׁי וְאֶת־יְלָדַי אֲשֶׁר עָבַדְתִּי אֹתְךָ בָּהֵן וְאֵלֵכָה כִּי אַתָּה יָדַעְתָּ אֶת־עֲבֹדָתִי אֲשֶׁר עֲבַדְתִּיךָ׃", "rashi_he": "תנה את נשי וגו'. אֵינִי רוֹצֶה לָצֵאת כִּי אִם בִּרְשׁוּת:", "rashi_en": "יעקב ביקש מלבן שייתן לו את נשיו וילדיו, כי לא רצה לצאת אלא ברשות.", "note": "", "points": [{"q": "לָמָּה בִּיקֵּשׁ יַעֲקֹב מִלָּבָן ״תְּנָה אֶת־נָשַׁי״, הֲרֵי הֵן כְּבָר נָשׁוֹתָיו?", "options": ["כִּי לֹא רָצָה לָצֵאת אֶלָּא בִּרְשׁוּת לָבָן", "כִּי לָבָן עֲדַיִין לֹא נָתַן לוֹ אוֹתָן לְנָשִׁים", "כִּי רָצָה שֶׁלָּבָן יְשַׁלֵּם לוֹ גַּם אֶת שְׂכָרוֹ"], "kasha": "הנשים והילדים כבר של יעקב; מה פשר הבקשה ״תנה״?", "answer": "איני רוצה לצאת כי אם ברשות.", "kp": ["איני רוצה לצאת כי אם ברשות"]}]}, {"id": "30:27.1", "ch": 30, "v": 27, "n": 1, "dh": "נחשתי", "pasuk_html": "וַיֹּ֤אמֶר אֵלָיו֙ לָבָ֔ן אִם־נָ֛א מָצָ֥אתִי חֵ֖ן בְּעֵינֶ֑יךָ <mark>נִחַ֕שְׁתִּי</mark> וַיְבָרֲכֵ֥נִי יְהוָ֖ה בִּגְלָלֶֽךָ׃", "pasuk_en": "וַיֹּאמֶר אֵלָיו לָבָן אִם־נָא מָצָאתִי חֵן בְּעֵינֶיךָ נִחַשְׁתִּי וַיְבָרֲכֵנִי יְהוָה בִּגְלָלֶךָ׃", "rashi_he": "נחשתי. מְנַחֵשׁ הָיָה, נִסִּיתִי בְּנִחוּשׁ שֶׁלִּי שֶׁעַל יָדְךָ בָּאָה לִי בְרָכָה; כְּשֶׁבָּאתָ לְכָאן לֹא הָיוּ לִי בָנִים, שֶׁנֶּאֱמַר וְהִנֵּה רָחֵל בִּתּוֹ בָּאָה עִם הַצֹּאן (בראשית כ״ט:ו׳), אֶפְשַׁר יֵשׁ לוֹ בָנִים וְהוּא שׁוֹלֵחַ בִתּוֹ אֵצֶל הָרוֹעִים? עַכְשָׁיו הָיוּ לוֹ בָנִים, שֶׁנֶּאֱמַר וַיִּשְׁמַע אֶת דִּבְרֵי בְנֵי לָבָן (שם ל\"א):", "rashi_en": "לבן היה מנחש, ובדק בניחוש שלו שהברכה באה לו בזכות יעקב. כשבא יעקב לא היו ללבן בנים, שהרי שלח את רחל בתו עם הצאן, ואחר כך נולדו לו בנים.", "note": "", "points": [{"q": "מֵאֵיפָה לוֹמֵד רַשִׁ״י שֶׁלָּבָן לֹא הָיוּ בָּנִים כְּשֶׁבָּא יַעֲקֹב?", "options": ["מִכָּךְ שֶׁרָחֵל בִּתּוֹ רָעֲתָה אֶת הַצֹּאן", "מִכָּךְ שֶׁלָּבָן בִּיקֵּשׁ מִיַּעֲקֹב לַעֲבוֹד אֶצְלוֹ", "מִכָּךְ שֶׁלָּבָן בָּא לְבַדּוֹ לִקְרַאת יַעֲקֹב"], "kasha": "איזו ברכה ראה לבן שבאה לו בגלל יעקב?", "answer": "כשבא יעקב לא היו ללבן בנים, שנאמר ״והנה רחל בתו באה עם הצאן״, ואין אדם ששולח בתו אצל הרועים אם יש לו בנים; ועכשיו היו לו בנים, שנאמר ״וישמע את דברי בני לבן״.", "kp": ["והנה רחל בתו באה עם הצאן", "והוא שולח בתו אצל הרועים"]}]}, {"id": "30:28.1", "ch": 30, "v": 28, "n": 1, "dh": "נקבה", "pasuk_html": "וַיֹּאמַ֑ר <mark>נָקְבָ֧ה</mark> שְׂכָרְךָ֛ עָלַ֖י וְאֶתֵּֽנָה׃", "pasuk_en": "וַיֹּאמַר נָקְבָה שְׂכָרְךָ עָלַי וְאֶתֵּנָה׃", "rashi_he": "נקבה. כְּתַרְגּוּמוֹ פָּרֵשׁ אַגְרָךְ:", "rashi_en": "\"נקבה\" פירושו כתרגומו \"פרש אגרך\" – פרט ואמור במפורש מה שכרך.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"נָקְבָה שְׂכָרְךָ\"?", "options": ["פָּרֵשׁ וֶאֱמוֹר בִּמְפוֹרָשׁ מַה שְּׂכָרְךָ", "קַח אֶת שְׂכָרְךָ מִן הַנְּקֵבוֹת שֶׁבַּצֹּאן", "הַפְחַת מִשְּׂכָרְךָ, כִּי עָבַדְתָּ מְעַט"], "kasha": "מה פירוש המילה \"נקבה\" בפסוק?", "answer": "כתרגומו \"פרש אגרך\" – פרט את שכרך.", "kp": ["כתרגומו פרש אגרך"]}]}, {"id": "30:29.1", "ch": 30, "v": 29, "n": 1, "dh": "ואת אשר היה מקנך אתי", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֔יו אַתָּ֣ה יָדַ֔עְתָּ אֵ֖ת אֲשֶׁ֣ר עֲבַדְתִּ֑יךָ <mark>וְאֵ֛ת אֲשֶׁר־הָיָ֥ה מִקְנְךָ֖ אִתִּֽי׃</mark>", "pasuk_en": "וַיֹּאמֶר אֵלָיו אַתָּה יָדַעְתָּ אֵת אֲשֶׁר עֲבַדְתִּיךָ וְאֵת אֲשֶׁר־הָיָה מִקְנְךָ אִתִּי׃", "rashi_he": "ואת אשר היה מקנך אתי. אֶת חֶשְׁבּוֹן מִעוּט מִקְנְךָ שֶׁבָּא לְיָדִי מִתְּחִלָּה, כַּמָּה הָיוּ:", "rashi_en": "יעקב מזכיר ללבן כמה מעט היה מקנהו כשהגיע לידיו בתחילה.", "note": "", "points": [{"q": "מָה רָצָה יַעֲקֹב לְהַזְכִּיר לְלָבָן בְּמִילִּים \"מִקְנְךָ אִתִּי\"?", "options": ["כַּמָּה מְעַט הָיָה מִקְנְךָ כְּשֶׁבָּא לִידִי בַּתְּחִילָּה", "כַּמָּה טוֹב שָׁמַרְתִּי עַל מִקְנֶךָ מִפְּנֵי חַיּוֹת", "שֶׁהַמִּקְנֶה שֶׁלְּךָ שַׁיָּיךְ בְּעֶצֶם גַּם לִי"], "kasha": "לבן ודאי יודע מה היה מקנהו, ומה בא יעקב לומר בכך?", "answer": "את חשבון מיעוט מקנך שבא לידי מתחילה, כמה היו.", "kp": ["את חשבון מעוט מקנך", "שבא לידי מתחלה"]}]}, {"id": "30:30.1", "ch": 30, "v": 30, "n": 1, "dh": "לרגלי", "pasuk_html": "כִּ֡י מְעַט֩ אֲשֶׁר־הָיָ֨ה לְךָ֤ לְפָנַי֙ וַיִּפְרֹ֣ץ לָרֹ֔ב וַיְבָ֧רֶךְ יְהוָ֛ה אֹתְךָ֖ <mark>לְרַגְלִ֑י</mark> וְעַתָּ֗ה מָתַ֛י אֶֽעֱשֶׂ֥ה גַם־אָנֹכִ֖י לְבֵיתִֽי׃", "pasuk_en": "כִּי מְעַט אֲשֶׁר־הָיָה לְךָ לְפָנַי וַיִּפְרֹץ לָרֹב וַיְבָרֶךְ יְהוָה אֹתְךָ לְרַגְלִי וְעַתָּה מָתַי אֶעֱשֶׂה גַם־אָנֹכִי לְבֵיתִי׃", "rashi_he": "לרגלי. עִם רַגְלִי, בִּשְׁבִיל בִּיאַת רַגְלִי בָּאת אֶצְלְךָ הַבְּרָכָה, כְּמוֹ הָעָם אֲשֶׁר בְּרַגְלֶיךָ (שמות י\"א), לָעָם אֲשֶׁר בְּרַגְלָי (שופטים ח') – הַבָּאִים עִמִּי:", "rashi_en": "'לרגלי' פירושו עם רגלי, כלומר בזכות בואי אליך באה אליך הברכה, כמו 'העם אשר ברגליך', הבאים עמך.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ 'וַיְבָרֶךְ יְהוָה אֹתְךָ לְרַגְלִי' לְפִי רַשִׁ\"י?", "options": ["בִּזְכוּת בּוֹאִי אֵלֶיךָ בָּאָה אֵלֶיךָ הַבְּרָכָה", "ה' בֵּרַךְ אוֹתְךָ בְּכָל מָקוֹם שֶׁהָלַכְתִּי בּוֹ", "ה' בֵּרַךְ אוֹתְךָ בִּשְׂכַר עֲבוֹדָתִי הַקָּשָׁה בַּשָּׂדֶה"], "kasha": "מה פירוש המילה 'לרגלי' בדברי יעקב?", "answer": "עם רגלי, בשביל ביאת רגלי באה אצלך הברכה, כמו 'העם אשר ברגליך', הבאים עמי.", "kp": ["בשביל ביאת רגלי", "באת אצלך הברכה"]}]}, {"id": "30:30.2", "ch": 30, "v": 30, "n": 2, "dh": "גם אנכי לביתי", "pasuk_html": "כִּ֡י מְעַט֩ אֲשֶׁר־הָיָ֨ה לְךָ֤ לְפָנַי֙ וַיִּפְרֹ֣ץ לָרֹ֔ב וַיְבָ֧רֶךְ יְהוָ֛ה אֹתְךָ֖ לְרַגְלִ֑י וְעַתָּ֗ה מָתַ֛י אֶֽעֱשֶׂ֥ה <mark>גַם־אָנֹכִ֖י לְבֵיתִֽי׃</mark>", "pasuk_en": "כִּי מְעַט אֲשֶׁר־הָיָה לְךָ לְפָנַי וַיִּפְרֹץ לָרֹב וַיְבָרֶךְ יְהוָה אֹתְךָ לְרַגְלִי וְעַתָּה מָתַי אֶעֱשֶׂה גַם־אָנֹכִי לְבֵיתִי׃", "rashi_he": "גם אנכי לביתי. לְצֹרֶךְ בֵּיתִי; עַכְשָׁו אֵין עוֹשִׂין לְצָרְכִּי אֶלָּא בָּנַי וְצָרִיךְ אֲנִי לִהְיוֹת עוֹשֶׂה גַּם אֲנִי עִמָּהֶם לְסָמְכָן, וְזֶהוּ גַּם:", "rashi_en": "\"לביתי\" פירושו לצורך ביתי. עד עכשיו רק בניו של יעקב דואגים לצרכיו, ועליו גם הוא לעבוד עמהם ולסייע להם, וזו משמעות המילה \"גם\".", "note": "", "points": [{"q": "מָה מְלַמֶּדֶת הַמִּילָה \"גַם־\" בְּבִיטּוּי \"גַם־אָנֹכִי לְבֵיתִי\"?", "options": ["שֶׁעַד עַכְשָׁיו רַק בָּנָיו פִּרְנְסוּ, וְעָלָיו לְהִצְטָרֵף וּלְסַיֵּיעַ לָהֶם", "שֶׁגַּם לָבָן צָרִיךְ לִדְאוֹג לְבֵיתוֹ כְּמוֹ יַעֲקֹב", "שֶׁיַּעֲקֹב רוֹצֶה לְהִתְעַשֵּׁר גַּם הוּא כְּמוֹ לָבָן"], "kasha": "מה פירוש \"גם\", ומי עוד עושה לביתו של יעקב?", "answer": "עכשיו אין עושים לצרכי אלא בני, וצריך אני להיות עושה גם אני עמהם לסמכם, וזהו \"גם\".", "kp": ["עכשו אין עושין לצרכי אלא בני", "וצריך אני להיות עושה"]}]}, {"id": "30:32.1", "ch": 30, "v": 32, "n": 1, "dh": "נקד", "pasuk_html": "אֶֽעֱבֹ֨ר בְּכָל־צֹֽאנְךָ֜ הַיּ֗וֹם הָסֵ֨ר מִשָּׁ֜ם כָּל־שֶׂ֣ה ׀ <mark>נָקֹ֣ד</mark> וְטָל֗וּא וְכָל־שֶׂה־חוּם֙ בַּכְּשָׂבִ֔ים וְטָל֥וּא וְנָקֹ֖ד בָּעִזִּ֑ים וְהָיָ֖ה שְׂכָרִֽי׃", "pasuk_en": "אֶעֱבֹר בְּכָל־צֹאנְךָ הַיּוֹם הָסֵר מִשָּׁם כָּל־שֶׂה נָקֹד וְטָלוּא וְכָל־שֶׂה־חוּם בַּכְּשָׂבִים וְטָלוּא וְנָקֹד בָּעִזִּים וְהָיָה שְׂכָרִי׃", "rashi_he": "נקד. מְנֻמָּר בַּחֲבַרְבּוּרוֹת דַּקּוֹת כּמוֹ נְקֻדּוֹת, פיונטור\"א בְּלַעַז:", "rashi_en": "\"נקד\" הוא מנומר בכתמים קטנים כמו נקודות, ובלעז פיונטור\"א.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"נָקֹד\"?", "options": ["מְנוּמָּר בִּכְתָמִים קְטַנִּים כְּמוֹ נְקוּדּוֹת", "מְסוּמָּן בְּפַסִּים לְבָנִים לְכָל אוֹרְכּוֹ", "בַּעַל צֶבַע חוּם כֵּהֶה בְּכָל גּוּפוֹ"], "kasha": "יש לברר איזה מראה מתאר הכתוב במילה \"נקד\".", "answer": "מנומר בחברבורות דקות כמו נקודות, פיונטור\"א בלעז.", "kp": ["מנמר בחברבורות דקות", "כמו נקדות"]}]}, {"id": "30:32.2", "ch": 30, "v": 32, "n": 2, "dh": "וטלוא", "pasuk_html": "אֶֽעֱבֹ֨ר בְּכָל־צֹֽאנְךָ֜ הַיּ֗וֹם הָסֵ֨ר מִשָּׁ֜ם כָּל־שֶׂ֣ה ׀ נָקֹ֣ד <mark>וְטָל֗וּא</mark> וְכָל־שֶׂה־חוּם֙ בַּכְּשָׂבִ֔ים וְטָל֥וּא וְנָקֹ֖ד בָּעִזִּ֑ים וְהָיָ֖ה שְׂכָרִֽי׃", "pasuk_en": "אֶעֱבֹר בְּכָל־צֹאנְךָ הַיּוֹם הָסֵר מִשָּׁם כָּל־שֶׂה נָקֹד וְטָלוּא וְכָל־שֶׂה־חוּם בַּכְּשָׂבִים וְטָלוּא וְנָקֹד בָּעִזִּים וְהָיָה שְׂכָרִי׃", "rashi_he": "וטלוא. לְשׁוֹן טְלָאִים – חֲבַרְבּוּרוֹת רְחָבוֹת:", "rashi_en": "\"טלוא\" הוא מלשון טלאים, כלומר כתמים רחבים.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וְטָלוּא\"?", "options": ["בַּעַל כְּתָמִים רְחָבִים, מִלְּשׁוֹן טְלָאִים", "בַּעַל נְקוּדּוֹת קְטַנּוֹת וְדַקּוֹת", "בַּעַל פַּסִּים לְבָנִים בְּרַגְלָיו"], "kasha": "המילה \"טלוא\" אינה מוכרת, ולא ברור במה שונה מ\"נקד\".", "answer": "לשון טלאים - חברבורות רחבות.", "kp": ["לשון טלאים", "חברבורות רחבות"]}]}, {"id": "30:32.3", "ch": 30, "v": 32, "n": 3, "dh": "חום", "pasuk_html": "אֶֽעֱבֹ֨ר בְּכָל־צֹֽאנְךָ֜ הַיּ֗וֹם הָסֵ֨ר מִשָּׁ֜ם כָּל־שֶׂ֣ה ׀ נָקֹ֣ד וְטָל֗וּא וְכָל־שֶׂה־<mark>חוּם֙</mark> בַּכְּשָׂבִ֔ים וְטָל֥וּא וְנָקֹ֖ד בָּעִזִּ֑ים וְהָיָ֖ה שְׂכָרִֽי׃", "pasuk_en": "אֶעֱבֹר בְּכָל־צֹאנְךָ הַיּוֹם הָסֵר מִשָּׁם כָּל־שֶׂה נָקֹד וְטָלוּא וְכָל־שֶׂה־חוּם בַּכְּשָׂבִים וְטָלוּא וְנָקֹד בָּעִזִּים וְהָיָה שְׂכָרִי׃", "rashi_he": "חום. שָׁחוּם, דּוֹמֶה לְאָדֹם, רו\"ש בְּלַעַז; לְשׁוֹן מִשְׁנָה שַׁחֲמָתִית וְנִמְצֵאת לְבָנָה, לְעִנְיַן הַתְּבוּאָה:", "rashi_en": "״חום״ פירושו צבע כהה הדומה לאדום, וכן בלשון המשנה ״שחמתית ונמצאת לבנה״ לגבי תבואה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ הַמִּילָּה ״חוּם״ בַּצֹּאן לְפִי רַשִׁ״י?", "options": ["צֶבַע כֵּהֶה, דּוֹמֶה לָאָדוֹם", "צֶבַע לָבָן בָּהִיר", "צֹאן שֶׁיֵּשׁ בָּהֶן נְקוּדּוֹת"], "kasha": "מה פירוש ״חום״, שאינו מילה רגילה במקרא?", "answer": "שחום, דומה לאדום, כמו בלשון משנה ״שחמתית ונמצאת לבנה״.", "kp": ["שחום, דומה לאדם"]}]}, {"id": "30:32.4", "ch": 30, "v": 32, "n": 4, "dh": "והיה שכרי", "pasuk_html": "אֶֽעֱבֹ֨ר בְּכָל־צֹֽאנְךָ֜ הַיּ֗וֹם הָסֵ֨ר מִשָּׁ֜ם כָּל־שֶׂ֣ה ׀ נָקֹ֣ד וְטָל֗וּא וְכָל־שֶׂה־חוּם֙ בַּכְּשָׂבִ֔ים וְטָל֥וּא וְנָקֹ֖ד בָּעִזִּ֑ים <mark>וְהָיָ֖ה שְׂכָרִֽי׃</mark>", "pasuk_en": "אֶעֱבֹר בְּכָל־צֹאנְךָ הַיּוֹם הָסֵר מִשָּׁם כָּל־שֶׂה נָקֹד וְטָלוּא וְכָל־שֶׂה־חוּם בַּכְּשָׂבִים וְטָלוּא וְנָקֹד בָּעִזִּים וְהָיָה שְׂכָרִי׃", "rashi_he": "והיה שכרי. אוֹתָן שֶׁיִּוָּלְדוּ מִכָּאן וּלְהַבָּא נְקֻדִּים וּטְלוּאִים בָּעִזִּים וּשְׁחוּמִים בַּכְּשָׂבִים, יִהְיוּ שֶׁלִּי, וְאוֹתָן שֶׁיֶּשְׁנָן עַכְשָׁו, הַפְרֵשׁ מֵהֶם וְהַפְקִידֵם בְּיַד בָּנֶיךָ, שֶׁלֹּא תֹאמַר לִי עַל הַנּוֹלָדִים מֵעַתָּה אֵלּוּ הָיוּ שָׁם מִתְּחִלָּה, וְעוֹד, שֶׁלֹּא תֹאמַר לִי, עַל יְדֵי הַזְּכָרִים שֶׁהֵן נְקֻדִּים וּטְלוּאִים תֵּלַדְנָה הַנְּקֵבוֹת דֻּגְמָתָן מִכָּאן וָאֵילָךְ:", "rashi_en": "יעקב אמר שרק הנקודים והטלואים שייוולדו מעכשיו יהיו שכרו. את אלו שקיימים כבר יש להפריש ולמסור לבני לבן, כדי שלבן לא יטען שהם היו שם מתחילה, ולא יטען שהזכרים המנומרים גרמו לנקבות ללדת כמותם.", "note": "", "points": [{"q": "אֵילּוּ כְּבָשִׂים וְעִזִּים יִהְיוּ שְׂכָרוֹ שֶׁל יַעֲקֹב לְפִי רַשִׁ״י?", "options": ["רַק אֵלּוּ שֶׁיִּיוָּוְלְדוּ מֵעַכְשָׁיו נְקוּדִּים, טְלוּאִים וְחוּמִים", "כָּל הַנְּקוּדִּים וְהַטְּלוּאִים שֶׁנִּמְצָאִים עַכְשָׁיו בָּעֵדֶר", "כָּל הַצֹּאן שֶׁיִּוָּלֵד בַּשָּׁנִים שֶׁיַּעֲבוֹד אֵצֶל לָבָן"], "kasha": "״והיה שכרי״ - האם הכוונה לצאן שכבר נמצא או לזה שעתיד להיוולד?", "answer": "אותן שיולדו מכאן ולהבא נקודים וטלואים בעזים ושחומים בכשבים יהיו שלי.", "kp": ["אותן שיולדו מכאן ולהבא", "נקדים וטלואים בעזים ושחומים בכשבים"]}, {"q": "מַדּוּעַ בִּיקֵּשׁ יַעֲקֹב לְהַפְרִישׁ אֶת הַמְנוּמָּרִים הַקַּיָּימִים וְלִמְסֹור אוֹתָם לִבְנֵי לָבָן?", "options": ["שֶׁלָּבָן לֹא יִטְעַן שֶׁהָיוּ שָׁם מִקּוֹדֶם אוֹ שֶׁהַזְּכָרִים גָּרְמוּ לְכָךְ", "כְּדֵי שֶׁבְּנֵי לָבָן יַרְוִויחוּ גַּם הֵם מֵהָעִסְקָה", "מִפְּנֵי שֶׁהֵם חוֹלִים וְאֵינָם רְאוּיִים לִרְעִיָּיה"], "kasha": "מדוע צריך להסיר את הצאן המנומר הקיים מן העדר?", "answer": "שלא תאמר לי על הנולדים מעתה ״אלו היו שם מתחילה״, ועוד שלא תאמר שעל ידי הזכרים הנקודים והטלואים ילדו הנקבות כדמותם.", "kp": ["שלא תאמר לי על הנולדים מעתה", "ועוד, שלא תאמר לי", "על ידי הזכרים שהן נקדים"]}]}, {"id": "30:33.1", "ch": 30, "v": 33, "n": 1, "dh": "וענתה בי וגו'", "pasuk_html": "<mark>וְעָֽנְתָה־בִּ֤י</mark> צִדְקָתִי֙ בְּי֣וֹם מָחָ֔ר כִּֽי־תָב֥וֹא עַל־שְׂכָרִ֖י לְפָנֶ֑יךָ כֹּ֣ל אֲשֶׁר־אֵינֶנּוּ֩ נָקֹ֨ד וְטָל֜וּא בָּֽעִזִּ֗ים וְחוּם֙ בַּכְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽי׃", "pasuk_en": "וְעָנְתָה־בִּי צִדְקָתִי בְּיוֹם מָחָר כִּי־תָבוֹא עַל־שְׂכָרִי לְפָנֶיךָ כֹּל אֲשֶׁר־אֵינֶנּוּ נָקֹד וְטָלוּא בָּעִזִּים וְחוּם בַּכְּשָׂבִים גָּנוּב הוּא אִתִּי׃", "rashi_he": "וענתה בי וגו'. אִם תַּחְשְׁדֵנִי שֶׁאֲנִי נוֹטֵל מִשֶּׁלְּךָ כְּלוּם, תַּעֲנֶה בִי צִדְקָתִי כִּי תָבֹא צִדְקָתִי וְתָעִיד עַל שְׂכָרִי לְפָנֶיךָ, שֶׁלֹּא תִמְצָא בְעֶדְרִי כִּי אִם נְקֻדִּים וּטְלוּאִים, וְכָל שֶׁתִּמְצָא בָהֶן שֶׁאֵינוֹ נָקֹד אוֹ טָלוּא אוֹ חוּם, בְּיָדוּעַ שֶׁגְּנַבְתִּיו לְךָ וּבִגְנֵבָה הוּא שָׁרוּי אֶצְלִי:", "rashi_en": "יעקב אמר: אם תחשוד שלקחתי ממך משהו, צדקתי תעיד עליי, כי לא תמצא בעדרי אלא נקודים וטלואים; וכל מה שתמצא שאינו כזה – בידוע שגנבתיו ממך.", "note": "", "points": [{"q": "עַל מָה תָּעִיד \"צִדְקָתִי\" שֶׁל יַעֲקֹב לְפִי רַשִׁ\"י?", "options": ["שֶׁאֵין בְּעֶדְרוֹ אֶלָּא נְקוּדִּים וּטְלוּאִים, וְלֹא לָקַח מִשֶּׁל לָבָן", "שֶׁעָבַד אֶת לָבָן בְּנֶאֱמָנוּת בְּכָל הַשָּׁנִים", "שֶׁהַצֹּאן שֶׁל לָבָן הִתְרַבָּה בִּזְכוּתוֹ"], "kasha": "מה פירוש שצדקתו של יעקב \"תענה\" בו, ומתי תעשה זאת?", "answer": "אם תחשדני שאני נוטל משלך, צדקתי תבוא ותעיד על שכרי לפניך שלא תמצא בעדרי אלא נקודים וטלואים; וכל שאינו כך – בידוע שגנבתיו, ובגניבה הוא אצלי.", "kp": ["ותעיד על שכרי לפניך", "שלא תמצא בעדרי כי אם", "בידוע שגנבתיו לך"]}]}, {"id": "30:34.1", "ch": 30, "v": 34, "n": 1, "dh": "הן", "pasuk_html": "וַיֹּ֥אמֶר לָבָ֖ן <mark>הֵ֑ן</mark> ל֖וּ יְהִ֥י כִדְבָרֶֽךָ׃", "pasuk_en": "וַיֹּאמֶר לָבָן הֵן לוּ יְהִי כִדְבָרֶךָ׃", "rashi_he": "הן. לְ' קַבָּלַת דְּבָרִים:", "rashi_en": "\"הן\" היא לשון קבלת דברים: לבן מסכים להצעת יעקב.", "note": "", "points": [{"q": "מָה מַשְׁמָעוּת הַמִּילָּה \"הֵן\" בְּדִבְרֵי לָבָן?", "options": ["לְשׁוֹן קַבָּלַת דְּבָרִים: הַסְכָּמָה לְהַצָּעַת יַעֲקֹב", "לְשׁוֹן הִנֵּה: הַצְבָּעָה עַל הַצֹּאן שֶׁלְּפָנָיו", "לְשׁוֹן סָפֵק: אוּלַי יִהְיֶה כִּדְבָרֶיךָ"], "kasha": "למילה \"הן\" יש כמה משמעויות במקרא, ולא ברור מה פירושה כאן.", "answer": "\"הן\" היא לשון קבלת דברים.", "kp": ["ל' קבלת דברים"]}]}, {"id": "30:34.2", "ch": 30, "v": 34, "n": 2, "dh": "לו יהי כדברך", "pasuk_html": "וַיֹּ֥אמֶר לָבָ֖ן הֵ֑ן <mark>ל֖וּ יְהִ֥י כִדְבָרֶֽךָ׃</mark>", "pasuk_en": "וַיֹּאמֶר לָבָן הֵן לוּ יְהִי כִדְבָרֶךָ׃", "rashi_he": "לו יהי כדברך. הַלְוַאי שֶׁתַּחְפֹּץ בְּכָךְ:", "rashi_en": "לבן אמר: הלוואי שתרצה בכך ולא תחזור בך.", "note": "", "points": [{"q": "מָה הִתְכַּווֵּן לָבָן בְּאָומְרוֹ 'לוּ יְהִי כִדְבָרֶךָ'?", "options": ["הַלְוַואי שֶׁתִּרְצֶה בְּכָךְ וְתִישָּׁאֵר מְרוּצָּה", "אֲנִי מַסְכִּים רַק אִם תַּעֲבוֹד עוֹד שֶׁבַע שָׁנִים", "אֲנִי חוֹשֵׁשׁ שֶׁהָעִסְקָה הַזּוֹ תַּזִּיק לִי"], "kasha": "מה משמעות המילה 'לו' בתשובת לבן?", "answer": "הלוואי שתחפוץ בכך.", "kp": ["הלואי שתחפץ בכך"]}]}, {"id": "30:35.1", "ch": 30, "v": 35, "n": 1, "dh": "ויסר", "pasuk_html": "<mark>וַיָּ֣סַ : [{"q": "מָה פֵּירוּשׁ ״לָבָן הַנּוֹתָרֹת״ שֶׁמָּסַר לָבָן לְיַעֲקֹב?", "options": ["הַצֹּאן הַגָּרוּעַ: הַחוֹלוֹת וְהָעֲקָרוֹת", "הַצֹּאן שֶׁנִּשְׁאֲרוּ אַחֲרֵי שֶׁיַּעֲקֹב לָקַח אֶת שְׂכָרוֹ", "הַצֹּאן שֶׁנִּשְׁאֲרוּ בַּבַּיִת וְלֹא יָצְאוּ לַמִּרְעֶה"], "kasha": "למה התורה מדגישה שהצאן היה ״הנותרת״?", "answer": "הרעועות שבהן, החולות והעקרות שאינן אלא שיירים, אותן מסר לו.", "kp": ["הרעועות שבהן", "החולות והעקרות"]}]}, {"id": "30:37.1", "ch": 30, "v": 37, "n": 1, "dh": "מקל לבנה", "pasuk_html": "וַיִּֽקַּֽח־ל֣וֹ יַעֲקֹ֗ב <mark>מַקַּ֥ל לִבְנֶ֛ה</mark> לַ֖ח וְל֣וּז וְעֶרְמ֑וֹן וַיְפַצֵּ֤ל בָּהֵן֙ פְּצָל֣וֹת לְבָנ֔וֹת מַחְשֹׂף֙ הַלָּבָ֔ן אֲשֶׁ֖ר עַל־הַמַּקְלֽוֹת׃", "pasuk_en": "וַיִּקַּח־לוֹ יַעֲקֹב מַקַּל לִבְנֶה לַח וְלוּז וְעֶרְמוֹן וַיְפַצֵּל בָּהֵן פְּצָלוֹת לְבָנוֹת מַחְשֹׂף הַלָּבָן אֲשֶׁר עַל־הַמַּקְלוֹת׃", "rashi_he": "מקל לבנה. עֵץ הוּא, וּשְׁמוֹ לִבְנֶה, כְּמָא דְתֵימָא תַּחַת אַלּוֹן וְלִבְנֶה (הושע ד'), וְאוֹמֵר אֲנִי הוּא שֶׁקּוֹרִין טרינבל\"א בְּלַעַ\"ז, שֶׁהוּא לָבָן:", "rashi_en": "\"לבנה\" הוא שם של עץ, כמו \"תחת אלון ולבנה\". רש\"י אומר שזהו העץ הנקרא בלעז טרינבל\"א, שהוא לבן.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"מַקַּל לִבְנֶה\"?", "options": ["מַקֵּל מֵעֵץ שֶׁשְּׁמוֹ לִבְנֶה, עֵץ לָבָן", "מַקֵּל שֶׁצִּבְעוֹ לָבָן כִּי קִילֵּף אוֹתוֹ", "מַקֵּל שֶׁחָתַךְ בַּלַּיְלָה לְאוֹר הַלְּבָנָה"], "kasha": "האם \"לבנה\" כאן הוא תיאור של צבע או שם של עץ?", "answer": "עץ הוא ושמו לבנה, כמו \"תחת אלון ולבנה\"; והוא הנקרא בלעז טרינבל\"א, שהוא לבן.", "kp": ["עץ הוא, ושמו לבנה", "שהוא לבן"]}]}, {"id": "30:37.2", "ch": 30, "v": 37, "n": 2, "dh": "לח", "pasuk_html": "וַיִּֽקַּֽח־ל֣וֹ יַעֲקֹ֗ב מַקַּ֥ל לִבְנֶ֛ה <mark>לַ֖ח</mark> וְל֣וּז וְעֶרְמ֑וֹן וַיְפַצֵּ֤ל בָּהֵן֙ פְּצָל֣וֹת לְבָנ֔וֹת מַחְשֹׂף֙ הַלָּבָ֔ן אֲשֶׁ֖ר עַל־הַמַּקְלֽוֹת׃", "pasuk_en": "וַיִּקַּח־לוֹ יַעֲקֹב מַקַּל לִבְנֶה לַח וְלוּז וְעֶרְמוֹן וַיְפַצֵּל בָּהֵן פְּצָלוֹת לְבָנוֹת מַחְשֹׂף הַלָּבָן אֲשֶׁר עַל־הַמַּקְלוֹת׃", "rashi_he": "לח. כְּשֶׁהוּא רָטֹב:", "rashi_en": "\"לח\" פירושו שהמקל היה רטוב, עדיין טרי.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"לַח\" בַּפָּסוּק?", "options": ["שֶׁהַמַּקֵּל הָיָה רָטוֹב וְעֲדַיִין טָרִי", "שֵׁם שֶׁל עֵץ נוֹסָף, כְּמוֹ לִבְנֶה וָלוּז", "שֶׁהַמַּקֵּל הָיָה דַּק וְקָטָן"], "kasha": "\"לח\" נכתב בין שמות העצים, ואפשר לטעות ולחשוב שגם הוא שם של עץ.", "answer": "\"לח\" פירושו כשהוא רטוב.", "kp": ["כשהוא רטב"]}]}, {"id": "30:37.3", "ch": 30, "v": 37, "n": 3, "dh": "לוז", "pasuk_html": "וַיִּֽקַּֽח־ל֣וֹ יַעֲקֹ֗ב מַקַּ֥ל לִבְנֶ֛ה לַ֖ח <mark>וְל֣וּז</mark> וְעֶרְמ֑וֹן וַיְפַצֵּ֤ל בָּהֵן֙ פְּצָל֣וֹת לְבָנ֔וֹת מַחְשֹׂף֙ הַלָּבָ֔ן אֲשֶׁ֖ר עַל־הַמַּקְלֽוֹת׃", "pasuk_en": "וַיִּקַּח־לוֹ יַעֲקֹב מַקַּל לִבְנֶה לַח וְלוּז וְעֶרְמוֹן וַיְפַצֵּל בָּהֵן פְּצָלוֹת לְבָנוֹת מַחְשֹׂף הַלָּבָן אֲשֶׁר עַל־הַמַּקְלוֹת׃", "rashi_he": "לוז. וְעוֹד לָקַח מַקַּל לוּז, עֵץ שֶׁגְּדֵלִין בּוֹ אֱגוֹזִים דַּקִּים, קולדו\"י בְּלַעַז:", "rashi_en": "יעקב לקח גם מקל מעץ לוז, עץ שגדלים בו אגוזים קטנים.", "note": "", "points": [{"q": "מַהוּ עֵץ הַ'לּוּז' לְפִי רַשִׁ\"י?", "options": ["עֵץ שֶׁגְּדֵלִים בּוֹ אֱגוֹזִים קְטַנִּים", "עֵץ שֶׁקְּלִיפָּתוֹ לְבָנָה בִּמְיוּחָד", "עֵץ שֶׁגְּדֵלִים בּוֹ עַרְמוֹנִים גְּדוֹלִים"], "kasha": "איזה עץ הוא 'לוז' שלקח ממנו יעקב מקל?", "answer": "עוד לקח מקל לוז, עץ שגדלים בו אגוזים דקים.", "kp": ["עץ שגדלין בו אגוזים דקים"]}]}, {"id": "30:37.4", "ch": 30, "v": 37, "n": 4, "dh": "וערמון", "pasuk_html": "וַיִּֽקַּֽח־ל֣וֹ יַעֲקֹ֗ב מַקַּ֥ל לִבְנֶ֛ה לַ֖ח וְל֣וּז <mark>וְעֶרְמ֑וֹן</mark> וַיְפַצֵּ֤ל בָּהֵן֙ פְּצָל֣וֹת לְבָנ֔וֹת מַחְשֹׂף֙ הַלָּבָ֔ן אֲשֶׁ֖ר עַל־הַמַּקְלֽוֹת׃", "pasuk_en": "וַיִּקַּח־לוֹ יַעֲקֹב מַקַּל לִבְנֶה לַח וְלוּז וְעֶרְמוֹן וַיְפַצֵּל בָּהֵן פְּצָלוֹת לְבָנוֹת מַחְשֹׂף הַלָּבָן אֲשֶׁר עַל־הַמַּקְלוֹת׃", "rashi_he": "וערמון. קשטני\"יר בְּלַעַז:", "rashi_en": "ערמון הוא עץ הערמונים, הנקרא בלעז קשטני\"ר.", "note": "", "points": [{"q": "מַהוּ \"וְעֶרְמוֹן\" לְפִי רַשִׁ\"י?", "options": ["עֵץ הָעַרְמוֹנִים, קַשְׁטָנְיֶ\"ר בְּלַעַז", "עֵץ הַדּוֹלֵב", "עֵץ הָאַלּוֹן"], "kasha": "שם העץ אינו מוכר, ויש לזהות אותו.", "answer": "ערמון הוא קשטני\"ר בלעז, כלומר עץ הערמונים.", "kp": ["וערמון", "קשטני\"יר בלעז"]}]}, {"id": "30:37.5", "ch": 30, "v": 37, "n": 5, "dh": "פצלות", "pasuk_html": "וַיִּֽקַּֽח־ל֣וֹ יַעֲקֹ֗ב מַקַּ֥ל לִבְנֶ֛ה לַ֖ח וְל֣וּז וְעֶרְמ֑וֹן וַיְפַצֵּ֤ל בָּהֵן֙ <mark>פְּצָל֣וֹת</mark> לְבָנ֔וֹת מַחְשֹׂף֙ הַלָּבָ֔ן אֲשֶׁ֖ר עַל־הַמַּקְלֽוֹת׃", "pasuk_en": "וַיִּקַּח־לוֹ יַעֲקֹב מַקַּל לִבְנֶה לַח וְלוּז וְעֶרְמוֹן וַיְפַצֵּל בָּהֵן פְּצָלוֹת לְבָנוֹת מַחְשֹׂף הַלָּבָן אֲשֶׁר עַל־הַמַּקְלוֹת׃", "rashi_he": "פצלות. קִלּוּפִים קִלּוּפִים, שֶׁהָיָה עוֹשֵׂהוּ מְנֻמָּר:", "rashi_en": "\"פצלות\" הן קילופים במרווחים, שיעקב עשה במקלות כדי שייראו מנומרים.", "note": "", "points": [{"q": "מָה הֵן הַ\"פְּצָלוֹת\" שֶׁעָשָׂה יַעֲקֹב בַּמַּקְלוֹת?", "options": ["קִילּוּפִים בְּמֵרְוָוחִים, שֶׁעָשׂוּ אֶת הַמַּקֵּל מְנוּמָּר", "חֲרִיצִים עֲמוּקִּים לְכָל אוֹרְכּוֹ שֶׁל הַמַּקֵּל", "עֲנָפִים קְטַנִּים שֶׁקָּטַם מִן הַמַּקְלוֹת"], "kasha": "לא ברור מה פירוש \"פצלות\" ואיך נראו.", "answer": "קלופים קלופים, שהיה עושה את המקל מנומר.", "kp": ["קלופים קלופים", "שהיה עושהו מנמר"]}]}, {"id": "30:37.6", "ch": 30, "v": 37, "n": 6, "dh": "מחשוף הלבן", "pasuk_html": "וַיִּֽקַּֽח־ל֣וֹ יַעֲקֹ֗ב מַקַּ֥ל לִבְנֶ֛ה לַ֖ח וְל֣וּז וְעֶרְמ֑וֹן וַיְפַצֵּ֤ל בָּהֵן֙ פְּצָל֣וֹת לְבָנ֔וֹת <mark>מַחְשֹׂף֙ הַלָּבָ֔ן</mark> אֲשֶׁ֖ר עַל־הַמַּקְלֽוֹת׃", "pasuk_en": "וַיִּקַּח־לוֹ יַעֲקֹב מַקַּל לִבְנֶה לַח וְלוּז וְעֶרְמוֹן וַיְפַצֵּל בָּהֵן פְּצָלוֹת לְבָנוֹת מַחְשֹׂף הַלָּבָן אֲשֶׁר עַל־הַמַּקְלוֹת׃", "rashi_he": "מחשוף הלבן. גִּלּוּי לֹבֶן שֶׁל מַקֵּל, כְּשֶׁהָיָה קוֹלְפוֹ הָיָה נִרְאֶה וְנִגְלֶה לֹבֶן שֶׁלּוֹ בַּמָּקוֹם הַקָּלוּף:", "rashi_en": "\"מחשף הלבן\" הוא גילוי הלבן שבמקל: כשיעקב קילף את הקליפה, נראה הלבן שבמקל במקום הקילוף.", "note": "", "points": [{"q": "מַהוּ \"מַחְשֹׂף הַלָּבָן\" שֶׁעָשָׂה יַעֲקֹב בַּמַּקְלוֹת?", "options": ["גִּילּוּי הַלָּבָן שֶׁבַּמַּקֵּל בַּמָּקוֹם שֶׁקִּילֵּף", "צֶבַע לָבָן שֶׁמָּרַח עַל הַמַּקְלוֹת", "עֲנָפִים לְבָנִים שֶׁצָּמְחוּ עַל הַמַּקְלוֹת"], "kasha": "לא מובן מהו \"מחשף הלבן\" וכיצד נוצרו הפצלות הלבנות.", "answer": "גילוי לבן של מקל: כשהיה קולפו, היה נראה ונגלה הלבן שלו במקום הקילוף.", "kp": ["גלוי לבן של מקל", "במקום הקלוף"]}]}, {"id": "30:38.1", "ch": 30, "v": 38, "n": 1, "dh": "ויצג", "pasuk_html": "<mark>וַיַּצֵּ֗ג</mark> אֶת־הַמַּקְלוֹת֙ אֲשֶׁ֣ר פִּצֵּ֔ל בָּרֳהָטִ֖ים בְּשִֽׁקֲת֣וֹת הַמָּ֑יִם אֲשֶׁר֩ תָּבֹ֨אןָ הַצֹּ֤אן לִשְׁתּוֹת֙ לְנֹ֣כַח הַצֹּ֔אן וַיֵּחַ֖מְנָה בְּבֹאָ֥ן לִשְׁתּֽוֹת׃", "pasuk_en": "וַיַּצֵּג אֶת־הַמַּקְלוֹת אֲשֶׁר פִּצֵּל בָּרֳהָטִים בְּשִׁקֲתוֹת הַמָּיִם אֲשֶׁר תָּבֹאןָ הַצֹּאן לִשְׁתּוֹת לְנֹכַח הַצֹּאן וַיֵּחַמְנָה בְּבֹאָן לִשְׁתּוֹת׃", "rashi_he": "ויצג. תַּרְגּוּמוֹ וְדָעִיץ, לְשׁוֹן תְּחִיבָה וּנְעִיצָה הוּא בִלְשׁוֹן אֲרַמִּי, וְהַרְבֵּה יֵשׁ בַּתַּלְמוּד דָּצָהּ וּשְׁלָפָהּ, דָּץ בֵּיהּ מִידֵי, דָּצָהּ כְּמוֹ דְעָצָהּ, אֶלָּא שֶׁמְּקַצֵּר אֶת לְשׁוֹנוֹ:", "rashi_en": "״ויצג״ תורגם ״ודעיץ״, שבארמית פירושו תחיבה ונעיצה, וכך נמצא הרבה בתלמוד: ״דצה ושלפה״.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״וַיַּצֵּג״ לְפִי רַשִׁ״י?", "options": ["תָּקַע וְנָעַץ אֶת הַמַּקְלוֹת", "הִנִּיחַ אֶת הַמַּקְלוֹת בְּעֲדִינוּת עַל הַמַּיִם", "קָשַׁר אֶת הַמַּקְלוֹת זֶה לָזֶה"], "kasha": "מה פירוש ״ויצג״ בהקשר של המקלות?", "answer": "תרגומו ״ודעיץ״, לשון תחיבה ונעיצה בארמית.", "kp": ["לשון תחיבה ונעיצה"]}]}, {"id": "30:38.2", "ch": 30, "v": 38, "n": 2, "dh": "ברהטים", "pasuk_html": "וַיַּצֵּ֗ג אֶת־הַמַּקְלוֹת֙ אֲשֶׁ֣ר פִּצֵּ֔ל <mark>בָּרֳהָטִ֖ים</mark> בְּשִֽׁקֲת֣וֹת הַמָּ֑יִם אֲשֶׁר֩ תָּבֹ֨אןָ הַצֹּ֤אן לִשְׁתּוֹת֙ לְנֹ֣כַח הַצֹּ֔אן וַיֵּחַ֖מְנָה בְּבֹאָ֥ן לִשְׁתּֽוֹת׃", "pasuk_en": "וַיַּצֵּג אֶת־הַמַּקְלוֹת אֲשֶׁר פִּצֵּל בָּרֳהָטִים בְּשִׁקֲתוֹת הַמָּיִם אֲשֶׁר תָּבֹאןָ הַצֹּאן לִשְׁתּוֹת לְנֹכַח הַצֹּאן וַיֵּחַמְנָה בְּבֹאָן לִשְׁתּוֹת׃", "rashi_he": "ברהטים. בִּמְרוּצוֹת הַמַּיִם, בַּבְּרֵכוֹת הָעֲשׂוּיוֹת בָּאָרֶץ לְהַשְׁקוֹת שָׁם הַצֹּאן:", "rashi_en": "״רהטים״ הם תעלות שבהן המים זורמים, בריכות שעשויות באדמה כדי להשקות שם את הצאן.", "note": "", "points": [{"q": "מָה הֵם הָ״רֳהָטִים״ שֶׁבָּהֶם הִצִּיג יַעֲקֹב מַּקְלוֹת וְהִיא נִרְתַּעַת לַאֲחוֹרֶיהָ וְהַזָּכָר רוֹבְעָהּ וְיוֹלֶדֶת כַּיּוֹצֵא בוֹ. רַבִּי הוֹשַׁעְיָה אוֹמֵר, הַמַּיִם נַעֲשִׂין זֶרַע בִּמְעֵיהֶן וְלֹא הָיוּ צְרִיכוֹת לְזָכָר, וְזֶהוּ וַיֵּחַמְנָה וְגוֹ' (בראשית רבה):", "rashi_en": "הבהמה ראתה את המקלות ונרתעה לאחור, הזכר רבע אותה, והיא ילדה ולד הדומה למקלות. רבי הושעיה אומר שהמים נעשו זרע במעיהן, ולא היו צריכות לזכר.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן בְּרַשִׁ״י, כֵּיצַד גָּרְמוּ הַמַּקְלוֹת לַוְלָדוֹת דּוֹמִים לָהֶם?", "options": ["הַבְּהֵמָה נִרְתְּעָה מֵהַמַּקְלוֹת, הַזָּכָר רָבַע אוֹתָהּ, וְיָלְדָה וָלָד דּוֹמֶה", "יַעֲקֹב צָבַע אֶת הַצֹּאן בְּמַרְאֵה הַמַּקְלוֹת", "הַמַּקְלוֹת שִׁינּוּ אֶת טַעַם הַמַּיִם וְאֶת צֶבַע הַצֹּאן"], "kasha": "לא מובן איך מקלות שבשקתות יכולים להשפיע על מראה הוולדות.", "answer": "הבהמה רואה את המקלות ונרתעת לאחוריה, והזכר רובעה, והיא יולדת ולד הדומה למה שראתה.", "kp": ["והיא נרתעת לאחוריה", "והזכר רובעה ויולדת כיוצא בו"]}, {"q": "מָה מְחַדֵּשׁ רַבִּי הוֹשַׁעְיָה בְּפֵירוּשׁ \"וַיֵּחַמְנָה\"?", "options": ["הַמַּיִם נַעֲשׂוּ זֶרַע בְּמֵעֵיהֶן, וְלֹא הָיוּ צְרִיכוֹת לְזָכָר", "הַזְּכָרִים הִתְחַמְּמוּ מִן הַמַּיִם וּלְכֵן רָבְעוּ", "רַק הַבְּהֵמוֹת הַחֲזָקוֹת שָׁתוּ מֵהַמַּיִם וְהִתְעַבְּרוּ"], "kasha": "\"ויחמנה\" מתואר כאילו ההתעברות קרתה מעצמה, בשעת השתייה.", "answer": "רבי הושעיה אומר: המים נעשו זרע במעיהן ולא היו צריכות לזכר, וזהו \"ויחמנה\".", "kp": ["המים נעשין זרע במעיהן", "ולא היו צריכות לזכר"]}]}, {"id": "30:39.1", "ch": 30, "v": 39, "n": 1, "dh": "אל המקלות", "pasuk_html": "וַיֶּחֱמ֥וּ הַצֹּ֖אן <mark>אֶל־הַמַּקְל֑וֹת</mark> וַתֵּלַ֣דְןָ הַצֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּטְלֻאִֽים׃", "pasuk_en": "וַיֶּחֱמוּ הַצֹּאן אֶל־הַמַּקְלוֹת וַתֵּלַדְןָ הַצֹּאן עֲקֻדִּים נְקֻדִּים וּטְלֻאִים׃", "rashi_he": "אל המקלות. אֶל מַרְאוֹת הַמַּקְלוֹת:", "rashi_en": "הצאן התייחמו כשהם מסתכלים במראה המקלות.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ שֶׁהַצֹּאן הִתְיַיחֲמוּ אֶל הַמַּקְלוֹת לְפִי רַשִׁ\"י?", "options": ["הַצֹּאן הִתְיַיחֲמוּ כְּשֶׁרָאוּ אֶת מַרְאֵה הַמַּקְלוֹת", "הַצֹּאן הִתְייַחֲמוּ כְּשֶׁנָּגְעוּ בַּמַּקְלוֹת", "הַצֹּאן הִתְיַיחֲמוּ כְּשֶׁאָכְלוּ מֵעֲלֵי הַמַּקְלוֹת"], "kasha": "איך שייך שהצאן יתייחמו 'אל המקלות'?", "answer": "אל מראות המקלות.", "kp": ["אל מראות המקלות"]}]}, {"id": "30:39.2", "ch": 30, "v": 39, "n": 2, "dh": "עקדים", "pasuk_html": "וַיֶּחֱמ֥וּ הַצֹּ֖אן אֶל־הַמַּקְל֑וֹת וַתֵּלַ֣דְןָ הַצֹּ֔אן <mark>עֲקֻדִּ֥ים</mark> נְקֻדִּ֖ים וּטְלֻאִֽים׃", "pasuk_en": "וַיֶּחֱמוּ הַצֹּאן אֶל־הַמַּקְלוֹת וַתֵּלַדְןָ הַצֹּאן עֲקֻדִּים נְקֻדִּים וּטְלֻאִים׃", "rashi_he": "עקדים. מְשֻׁנִּים בִּמְקוֹם עֲקִידָתָם, הֵם קַרְסֻלֵּי יְדֵיהֶם וְרַגְלֵיהֶם:", "rashi_en": "עקודים הם צאן שצבעם משונה במקום שבו קושרים אותם, כלומר בקרסולי הידיים והרגליים.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"עֲקֻדִּים\" לְפִי רַשִׁ\"י?", "options": ["מְשׁוּנִּים בְּצִבְעָם בְּקַרְסוֹלֵי הַיָּדַיִים וְהָרַגְלַיִים", "מְנוּקָּדִים בִּנְקוּדּוֹת קְטַנּוֹת עַל כָּל הַגּוּף", "בַּעֲלֵי כְּתָמִים לְבָנִים גְּדוֹלִים עַל הַגַּב"], "kasha": "בפסוק מוזכרים כמה סוגי צאן, ויש להבין במה מיוחדים העקודים.", "answer": "משונים במקום עקידתם, הם קרסולי ידיהם ורגליהם.", "kp": ["משנים במקום עקידתם", "הם קרסלי ידיהם ורגליהם"]}]}, {"id": "30:40.1", "ch": 30, "v": 40, "n": 1, "dh": "והכשבים הפריד יעקב", "pasuk_html": "<mark>וְהַכְּשָׂבִים֮ הִפְרִ֣יד יַעֲקֹב֒</mark> וַ֠יִּתֵּן פְּנֵ֨י הַצֹּ֧אן אֶל־עָקֹ֛ד וְכָל־ח֖וּם בְּצֹ֣אן לָבָ֑ן וַיָּֽשֶׁת־ל֤וֹ עֲדָרִים֙ לְבַדּ֔וֹ וְלֹ֥א שָׁתָ֖ם עַל־צֹ֥אן לָבָֽן׃", "pasuk_en": "וְהַכְּשָׂבִים הִפְרִיד יַעֲקֹב וַיִּתֵּן פְּנֵי הַצֹּאן אֶל־עָקֹד וְכָל־חוּם בְּצֹאן לָבָן וַיָּשֶׁת־לוֹ עֲדָרִים לְבַדּוֹ וְלֹא שָׁתָם עַל־צֹאן לָבָן׃", "rashi_he": "והכשבים הפריד יעקב. הַנּוֹלָדִים עֲקוּדִים נְקֻדִּים הִבְדִיל וְהִפְרִישׁ לְעַצְמָן וְעָשָׂה אוֹתָן עֵדֶר עֵדֶר לְבַדּוֹ, וְהוֹלִיךְ אוֹתוֹ הָעֵדֶר הָעָקוּד לִפְנֵי הַצֹּאן, וּפְנֵי הַצֹּאן הַהוֹלְכִים אַחֲרֵיהֶם צוֹפוֹת אֲלֵיהֶם; וְזֶהוּ שֶׁאָמַר וַיִּתֵּן פְּנֵי הַצֹּאן אֶל עָקֹד, שֶׁהָיוּ פְנֵי הַצֹּאן אֶל הָעֲקוּדִים, וְאֶל כָּל חוּם שֶׁמָּצָא בְּצֹאן לָבָן:", "rashi_en": " מִלָּבָן בְּלִי רְשׁוּתוֹ"], "kasha": "לא ברור מהיכן באו ליעקב עדרים משלו.", "answer": "כמו שפירש רש\"י לעיל: את הנולדים עקודים ונקודים הבדיל יעקב ועשה מהם עדר לעצמו.", "kp": ["וישת לו עדרים", "כמו שפרשתי"]}]}, {"id": "30:41.1", "ch": 30, "v": 41, "n": 1, "dh": "המקשרות", "pasuk_html": "וְהָיָ֗ה בְּכָל־יַחֵם֮ הַצֹּ֣אן <mark>הַמְקֻשָּׁרוֹת֒</mark> וְשָׂ֨ם יַעֲקֹ֧ב אֶת־הַמַּקְל֛וֹת לְעֵינֵ֥י הַצֹּ֖אן בָּרֳהָטִ֑ים לְיַחְמֵ֖נָּה בַּמַּקְלֽוֹת׃", "pasuk_en": "וְהָיָה בְּכָל־יַחֵם הַצֹּאן הַמְקֻשָּׁרוֹת וְשָׂם יַעֲקֹב אֶת־הַמַּקְלוֹת לְעֵינֵי הַצֹּאן בָּרֳהָטִים לְיַחְמֵנָּה בַּמַּקְלוֹת׃", "rashi_he": "המקשרות. כְּתַרְגּוּמוֹ הַבַּכִּירוֹת, וְאֵין לִי עֵד בַּמִּקְרָא; וּמְנַחֵם חִבְּרוֹ עִם אֲחִיתֹפֶל בַּקֹּשְׁרִים (שמואל ב ט\"ו), וַיְהִי הַקֶּשֶׁר אַמִּץ (שם), אוֹתָן הַמִּתְקַשְּׁרוֹת יַחַד לְמַהֵר עִבּוּרָן:", "rashi_en": "לפי אונקלוס ״המקשרות״ הן הבכירות (הממהרות להתעבר), אך אין לכך ראיה מהמקרא. מנחם מפרש מלשון קשר: אלו המתקשרות יחד כדי למהר את עיבורן.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״הַמְקֻשָּׁרוֹת״ לְפִי מְנַחֵם?", "options": ["הַמִּתְקַשְּׁרוֹת יַחַד כְּדֵי לְמַהֵר אֶת עִיבּוּרָן", "הַצֹּאן הַקְּשׁוּרוֹת בְּחֶבֶל אֶל הַשּׁוֹקֶת", "הַצֹּאן הַחֲלָשׁוֹת וְהַמְאוּחָרוֹת"], "kasha": "מה פירוש ״המקשרות״, ומה הקשר לשורש קשר?", "answer": "מנחם חיברו עם ״קושרים״ ו״קשר״: אותן המתקשרות יחד למהר עיבורן.", "kp": ["אותן המתקשרות יחד למהר עבורן"]}]}, {"id": "30:42.1", "ch": 30, "v": 42, "n": 1, "dh": "ובהעטיף", "pasuk_html": "<mark>וּבְהַעֲטִ֥יף</mark> הַצֹּ֖אן לֹ֣א יָשִׂ֑ים וְהָיָ֤ה הָעֲטֻפִים֙ לְלָבָ֔ן וְהַקְּשֻׁרִ֖ים לְיַעֲקֹֽב׃", "pasuk_en": "וּבְהַעֲטִיף הַצֹּאן לֹא יָשִׂים וְהָיָה הָעֲטֻפִים לְלָבָן וְהַקְּשֻׁרִים לְיַעֲקֹב׃", "rashi_he": "ובהעטיף. לְשׁוֹן אִחוּר, כְּתַרְגּוּמוֹ וּבְלַקִּישׁוּת. וּמְנַחֵם חִבְּרוֹ עִם הַמַּחֲלָצוֹת וְהַמַּעֲטָפוֹת (ישעיהו ג'), לְשׁוֹן עֲטִיפַת כְּסוּת, כְּלוֹמַר מִתְעַטְּפוֹת בְּעוֹרָן וְצַמְרָן וְאֵינָן מִתְאַוּוֹת לְהִתְיַחֵם עַ\"יְ הַזְּכָרִים:", "rashi_en": "לפי אונקלוס ״העטיף״ הוא לשון איחור: הצאן המאוחרות. ומנחם מפרש מלשון עטיפת בגד: הצאן מתעטפות בעורן ובצמרן ואינן רוצות להתייחם עם הזכרים.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ ״וּבְהַעֲטִיף הַצֹּאן״ לְפִי אוּנְקְלוֹס?", "options": ["לְשׁוֹן אִיחוּר: הַצֹּאן שֶׁמִּתְיַיחֲמוֹת מְאוּחָר", "לְשׁוֹן עֲטִיפָה: הַצֹּאן שֶׁמְּכוּסּוֹת בְּצֶמֶר רַב", "לְשׁוֹן חוּלְשָׁה: הַצֹּאן שֶׁרָעֲבוּ בַּדֶּרֶךְ"], "kasha": "המילה ״העטיף״ קשה להבנה, ומה היא מתארת?", "answer": "לשון אחור, כתרגומו ״ובלקישות״.", "kp": ["לשון אחור, כתרגומו ובלקישות"]}, {"q": "כֵּיצַד מְפָרֵשׁ מְנַחֵם אֶת הַמִּילָּה ״הַעֲטִיף״?", "options": ["מִתְעַטְּפוֹת בְּעוֹרָן וְצַמְרָן וְאֵינָן מִתְאַוּוֹת לַזְּכָרִים", "מִתְאַחֲרוֹת לָלֶדֶת עַד סוֹף הָעוֹנָה", "נֶחֱלָשׁוֹת וְאֵינָן מְסוּגָּלוֹת לָלֶדֶת כְּלָל"], "kasha": "האם יש למילה ״העטיף״ פירוש אחר, מלשון עטיפה?", "answer": "מנחם חיברו עם ״המחלצות והמעטפות״, לשון עטיפת כסות: מתעטפות בעורן וצמרן ואינן מתאוות להתייחם על ידי הזכרים.", "kp": ["מתעטפות בעורן וצמרן ואינן מתאוות"]}]}, {"id": "30:43.1", "ch": 30, "v": 43, "n": 1, "dh": "צאן רבות", "pasuk_html": "וַיִּפְרֹ֥ץ הָאִ֖ישׁ מְאֹ֣ד מְאֹ֑ד וַֽיְהִי־לוֹ֙ <mark>צֹ֣אן רַבּ֔וֹת</mark> וּשְׁפָחוֹת֙ וַעֲבָדִ֔ים וּגְמַלִּ֖ים וַחֲמֹרִֽים׃", "pasuk_en": "וַיִּפְרֹץ הָאִישׁ מְאֹד מְאֹד וַיְהִי־לוֹ צֹאן רַבּוֹת וּשְׁפָחוֹת וַעֲבָדִים וּגְמַלִּים וַחֲמֹרִים׃", "rashi_he": "צאן רבות. פָּרוֹת וְרָבוֹת מִשְּׁאָר צֹאן:", "rashi_en": "\"רבות\" אין פירושו רק צאן הרבה, אלא צאן שפרות ורבות יותר משאר הצאן.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"צֹאן רַבּוֹת\" לְפִי רַשִׁ\"י?", "options": ["צֹאן שֶׁפָּרוֹת וְרָבּוֹת יוֹתֵר מִשְּׁאָר הַצֹּאן", "עֲדָרִים רַבִּים מְאוֹד בְּמִסְפָּרָם", "צֹאן גְּדוֹלוֹת וּשְׁמֵנוֹת מִכָּל צֹאן לָבָן"], "kasha": "הפסוק כבר אמר \"ויפרץ האיש מאד מאד\", ומה מוסיפה המילה \"רבות\"?", "answer": "\"רבות\" פירושו פרות ורבות יותר משאר צאן.", "kp": ["פרות ורבות משאר צאן"]}]}, {"id": "30:43.2", "ch": 30, "v": 43, "n": 2, "dh": "ושפחות ועבדים", "pasuk_html": "וַיִּפְרֹ֥ץ הָאִ֖ישׁ מְאֹ֣ד מְאֹ֑ד וַֽיְהִי־לוֹ֙ צֹ֣אן רַבּ֔וֹת <mark>וּשְׁפָחוֹת֙ וַעֲבָדִ֔ים</mark> וּגְמַלִּ֖ים וַחֲמֹרִֽים׃", "pasuk_en": "וַיִּפְרֹץ הָאִישׁ מְאֹד מְאֹד וַיְהִי־לוֹ צֹאן רַבּוֹת וּשְׁפָחוֹת וַעֲבָדִים וּגְמַלִּים וַחֲמֹרִים׃", "rashi_he": "ושפחות ועבדים. מוֹכֵר צֹאנוֹ בְדָמִים יְקָרִים וְלוֹקֵחַ לוֹ כָּל אֵלֶּה:", "rashi_en": "יעקב מכר את צאנו במחיר יקר, ובכסף קנה לעצמו שפחות, עבדים, גמלים וחמורים.", "note": "", "points": [{"q": "כֵּיצַד הָיוּ לְיַעֲקֹב שְׁפָחוֹת וַעֲבָדִים, וַהֲרֵי שְׂכָרוֹ מִלָּבָן הָיָה צֹאן בִּלְבָד?", "options": ["מָכַר אֶת צֹאנוֹ בִּמְחִיר יָקָר וְקָנָה בַּכֶּסֶף אֶת כָּל אֵלֶּה", "לָבָן נָתַן לוֹ אוֹתָם כְּתוֹסֶפֶת לִשְׂכָרוֹ", "קִיבֵּל אוֹתָם בְּמַתָּנָה מִבֵּית אָבִיו"], "kasha": "שכרו של יעקב היה רק מן הצאן, ומניין היו לו עבדים, שפחות, גמלים וחמורים?", "answer": "היה מוכר את צאנו בדמים יקרים, ולוקח לו את כל אלה.", "kp": ["מוכר צאנו בדמים יקרים", "ולוקח לו כל אלה"]}]}, {"id": "31:1.1", "ch": 31, "v": 1, "n": 1, "dh": "עשה", "pasuk_html": "וַיִּשְׁמַ֗ע אֶת־דִּבְרֵ֤י בְנֵֽי־לָבָן֙ לֵאמֹ֔ר לָקַ֣ח יַעֲקֹ֔ב אֵ֖ת כָּל־אֲשֶׁ֣ר לְאָבִ֑ינוּ וּמֵאֲשֶׁ֣ר לְאָבִ֔ינוּ <mark>עָשָׂ֕ה</mark> אֵ֥ת כָּל־הַכָּבֹ֖ד הַזֶּֽה׃", "pasuk_en": "וַיִּשְׁמַע אֶת־דִּבְרֵי בְנֵי־לָבָן לֵאמֹר לָקַח יַעֲקֹב אֵת כָּל־אֲשֶׁר לְאָבִינוּ וּמֵאֲשֶׁר לְאָבִינוּ עָשָׂה אֵת כָּל־הַכָּבֹד הַזֶּה׃", "rashi_he": "עשה. כָּנַס, כְּמוֹ וַיַּעַשׂ חַיִל וַיַּךְ אֶת עֲמָלֵק (שמואל א י\"ד):", "rashi_en": "'עשה' כאן פירושו כינס, אסף, כמו 'ויעש חיל ויך את עמלק'.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ 'עָשָׂה' בַּפָּסוּק לְפִי רַשִׁ\"י?", "options": ["כִּינֵּס וְאָסַף אֶת כָּל הָעוֹשֶׁר הַזֶּה", "בָּנָה אֶת כָּל הַבָּתִּים הָאֵלֶּה", "קָנָה אֶת כָּל הַכָּבוֹד הַזֶּה בְּעֵינֵי הַבְּרִיּוֹת"], "kasha": "מה פירוש 'עשה' לגבי עושר שכבר היה של לבן?", "answer": "כינס, כמו 'ויעש חיל ויך את עמלק'.", "kp": ["כנס"]}]}, {"id": "31:3.1", "ch": 31, "v": 3, "n": 1, "dh": "שוב אל ארץ אבותיך", "pasuk_html": "וַיֹּ֤אמֶר יְהוָה֙ אֶֽל־יַעֲקֹ֔ב <mark>שׁ֛וּב אֶל־אֶ֥רֶץ אֲבוֹתֶ֖יךָ</mark> וּלְמוֹלַדְתֶּ֑ךָ וְאֶֽהְיֶ֖ה עִמָּֽךְ׃", "pasuk_en": "וַיֹּאמֶר יְהוָה אֶל־יַעֲקֹב שׁוּב אֶל־אֶרֶץ אֲבוֹתֶיך
