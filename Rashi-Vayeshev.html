\"ויבך אתו אביו\" — קשה מיהו \"אביו\", ומדוע נאמר \"ויבך\" ולא \"ויתאבל\".", "answer": "\"אביו\" הוא יצחק, שבכה מפני צרתו של יעקב, אך לא התאבל כי ידע שיוסף חי.", "kp": ["יצחק בוכה היה מפני צרתו של יעקב", "לא היה מתאבל שהיה יודע שהוא חי"]}]}, {"id": "37:36.1", "ch": 37, "v": 36, "n": 1, "dh": "הטבחים", "pasuk_html": "וְהַ֨מְּדָנִ֔ים מָכְר֥וּ אֹת֖וֹ אֶל־מִצְרָ֑יִם לְפֽוֹטִיפַר֙ סְרִ֣יס פַּרְעֹ֔ה שַׂ֖ר <mark>הַטַּבָּחִֽים׃</mark> (פ)", "pasuk_en": "וְהַמְּדָנִים מָכְרוּ אֹתוֹ אֶל־מִצְרָיִם לְפוֹטִיפַר סְרִיס פַּרְעֹה שַׂר הַטַּבָּחִים׃", "rashi_he": "הטבחים. שׁוֹחֲטֵי בְּהֵמוֹת הַמֶּלֶךְ:", "rashi_en": "רש״י מפרש שהמילה ״טבחים״ אינה במשמעות של מוציאים להורג, אלא שוחטי בהמות של המלך.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ ״שַׂר הַטַּבָּחִים״ לְפִי רַשׁ״י?", "options": ["הַמְמֻונֶּה עַל שְׁחִיטַת בְּהֵמוֹת הַמֶּלֶךְ", "הַמְמֻונֶּה עַל הוֹצָאַת אֲסִירִים לַהֹורֶג", "הַמְמֻונֶּה עַל הַכְנַת מִשְׁתְּאוֹת הַמֶּלֶךְ"], "kasha": "המילה ״טבחים״ עשויה להתפרש כמוציאים להורג או כשוחטים, וצריך לברר מה תפקידו של פוטיפר.", "answer": "רש״י מפרש שטבחים היינו שוחטי בהמות המלך, ולא הורגי אנשים.", "kp": ["שוחטי בהמות המלך"]}]}, {"id": "38:1.1", "ch": 38, "v": 1, "n": 1, "dh": "ויהי בעת ההוא", "pasuk_html": "<mark>וַֽיְהִי֙ בָּעֵ֣ת הַהִ֔וא</mark> וַיֵּ֥רֶד יְהוּדָ֖ה מֵאֵ֣ת אֶחָ֑יו וַיֵּ֛ט עַד־אִ֥ישׁ עֲדֻלָּמִ֖י וּשְׁמ֥וֹ חִירָֽה׃", "pasuk_en": "וַיְהִי בָּעֵת הַהִוא וַיֵּרֶד יְהוּדָה מֵאֵת אֶחָיו וַיֵּט עַד־אִישׁ עֲדֻלָּמִי וּשְׁמוֹ חִירָה׃", "rashi_he": "ויהי בעת ההוא. לָמָּה נִסְמְכָה פָרָשָׁה זוֹ לְכָאן, וְהִפְסִיק בְּפָרָשָׁתוֹ שֶׁל יוֹסֵף? לְלַמֵּד שֶׁהוֹרִידוּהוּ אֶחָיו מִגְּדֻלָּתוֹ כְּשֶׁרָאוּ בְצָרַת אֲבִיהֶם, אָמְרוּ: אַתָּה אָמַרְתָּ לְמָכְרוֹ, אִלּוּ אָמַרְתָּ לַהֲשִׁיבוֹ הָיִינוּ שׁוֹמְעִים לְךָ:", "rashi_en": "רש״י שואל מדוע הפסיקה התורה את סיפור יוסף בסיפור יהודה. הוא מסביר שהאחים הורידו את יהודה מגדולתו כשראו את צער אביהם, ואמרו לו: אתה יעצת למכור, ואילו אמרת להחזירו היינו שומעים לך.", "note": "", "points": [{"q": "מַדּוּעַ הוֹרִידוּ הָאַחִים אֶת יְהוּדָה מִגְּדֻולָּתוֹ?", "options": ["כְּשֶׁרָאוּ צַעַר אֲבִיהֶם, טָעֲנוּ שֶׁהָיָה עָלָיו לְיַיעֵץ לְהָשִׁיב אֶת יוֹסֵף", "כְּעָסוּ עָלָיו שֶׁלֹּא מָנַע מֵהֶם לִמְכֹּור אֶת יוֹסֵף לַמִּדְיָנִים", "חָשְׁשׁוּ שֶׁיְּסַפֵּר לְיַעֲקֹב שֶׁהוּא זֶה שֶׁהִצִּיעַ לִמְכֹּור"], "kasha": "מדוע הפסיקה התורה את פרשת יוסף והכניסה כאן את סיפור יהודה ותמר?", "answer": "האחים הורידוהו מגדולתו כשראו בצרת אביהם, ואמרו: אתה אמרת למכרו, אילו אמרת להשיבו היינו שומעים לך.", "kp": ["הורידוהו אחיו מגדלתו", "אתה אמרת למכרו", "אלו אמרת להשיבו היינו שומעים לך"]}]}, {"id": "38:1.2", "ch": 38, "v": 1, "n": 2, "dh": "ויט", "pasuk_html": "וַֽיְהִי֙ בָּעֵ֣ת הַהִ֔וא וַיֵּ֥רֶד יְהוּדָ֖ה מֵאֵ֣ת אֶחָ֑יו <mark>וַיֵּ֛ט</mark> עַד־אִ֥ישׁ עֲדֻלָּמִ֖י וּשְׁמ֥וֹ חִירָֽה׃", "pasuk_en": "וַיְהִי בָּעֵת הַהִוא וַיֵּרֶד יְהוּדָה מֵאֵת אֶחָיו וַיֵּט עַד־אִישׁ עֲדֻלָּמִי וּשְׁמוֹ חִירָה׃", "rashi_he": "ויט. מֵאֵת אֶחָיו:", "rashi_en": "רש״י מפרש שהמילה ״ויט״ פירושה שיהודה נטה והתרחק מאחיו.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ ״וַיֵּט״ לְפִי רַשׁ״י?", "options": ["שֶׁנָּטָה וְהִתְרַחֵק מֵאֶחָיו", "שֶׁהִטָּה אֶת דַּרְכּוֹ לְעֵבֶר עֲדֻולָּם", "שֶׁנָּטָה מִמַּעֲשָׂיו הַקּוֹדְמִים וְעָשָׂה תְּשׁוּבָה"], "kasha": "הפועל ״ויט״ סתום — צריך לפרש ממי או ממה נטה.", "answer": "רש״י מפרש שפירוש ״ויט״ הוא שנטה מאת אחיו, כלומר עזב אותם.", "kp": ["מאת אחיו"]}]}, {"id": "38:1.3", "ch": 38, "v": 1, "n": 3, "dh": "עד איש עדלמי", "pasuk_html": "וַֽיְהִי֙ בָּעֵ֣ת הַהִ֔וא וַיֵּ֥רֶד יְהוּדָ֖ה מֵאֵ֣ת אֶחָ֑יו וַיֵּ֛ט <mark>עַד־אִ֥ישׁ עֲדֻלָּמִ֖י</mark> וּשְׁמ֥וֹ חִירָֽה׃", "pasuk_en": "וַיְהִי בָּעֵת הַהִוא וַיֵּרֶד יְהוּדָה מֵאֵת אֶחָיו וַיֵּט עַד־אִישׁ עֲדֻלָּמִי וּשְׁמוֹ חִירָה׃", "rashi_he": "עד איש עדלמי. נִשְׁתַּתֵּף עִמּוֹ:", "rashi_en": "רש״י מפרש ש״ויט עד איש עדולמי״ פירושו שיהודה נשתתף עם אותו איש, כלומר נעשה שותף עסקי שלו.", "note": "", "points": [{"q": "מַה הָיָה הַקֶּשֶׁר בֵּין יְהוּדָה לְחִירָה הָעֲדֻולָּמִי לְפִי רַשִׁ״י?", "options": ["הֵם הָיוּ שֻׁותָּפִים בַּעֲסָקִים", "חִירָה אֵירַח אֶת יְהוּדָה בְּבֵיתוֹ", "חִירָה הָיָה עַבְדּוֹ שֶׁל יְהוּדָה"], "kasha": "הביטוי ״ויט עד איש עדולמי״ אינו מבאר את מהות הקשר ביניהם.", "answer": "רש״י מפרש שיהודה נשתתף עם חירה העדולמי, כלומר היה שותפו בעסקים.", "kp": ["נשתתף עמו"]}]}, {"id": "38:2.1", "ch": 38, "v": 2, "n": 1, "dh": "כנעני", "pasuk_html": "וַיַּרְא־שָׁ֧ם יְהוּדָ֛ה בַּת־אִ֥ישׁ <mark>כְּנַעֲנִ֖י</mark> וּשְׁמ֣וֹ שׁ֑וּעַ וַיִּקָּחֶ֖הָ וַיָּבֹ֥א אֵלֶֽיהָ׃", "pasuk_en": "וַיַּרְא־שָׁם יְהוּדָה בַּת־אִישׁ כְּנַעֲנִי וּשְׁמוֹ שׁוּעַ וַיִּקָּחֶהָ וַיָּבֹא אֵלֶיהָ׃", "rashi_he": "כנעני. תַּגְרָא (בראשית רבה):", "rashi_en": "רש\"י מסביר שהמילה \"כנעני\" בפסוק אינה מציינת לאום אלא עיסוק — תגר (סוחר).", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַה פֵּירוּשׁ \"כְּנַעֲנִי\" בַּפָּסוּק זֶה?", "options": ["סוֹחֵר", "אָדָם מֵעַם כְּנַעַן", "עוֹבֵד אֲדָמָה"], "kasha": "המילה \"כנעני\" נראית כשם לאום, אך מדוע הוזכר דווקא כאן?", "answer": "רש\"י מפרש ש\"כנעני\" פירושו תגר, כלומר סוחר, ולא איש מעם כנען.", "kp": ["תגרא"]}]}, {"id": "38:5.1", "ch": 38, "v": 5, "n": 1, "dh": "והיה בכזיב", "pasuk_html": "וַתֹּ֤סֶף עוֹד֙ וַתֵּ֣לֶד בֵּ֔ן וַתִּקְרָ֥א אֶת־שְׁמ֖וֹ שֵׁלָ֑ה <mark>וְהָיָ֥ה בִכְזִ֖יב</mark> בְּלִדְתָּ֥הּ אֹתֽוֹ׃", "pasuk_en": "וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה וְהָיָה בִכְזִיב בְּלִדְתָּהּ אֹתוֹ׃", "rashi_he": "והיה בכזיב. שֵׁם הַמָּקוֹם. וְאוֹמֵר אֲנִי עַל שֵׁם שֶׁפָּסְקָה מִלֶּדֶת נִקְרָא כְזִיב, לְשׁוֹן הָיוֹ תִהְיֶה לִי כְּמוֹ אַכְזָב (ירמיהו ט\"ו), אֲשֶׁר לֹא יְכַזְּבוּ מֵימָיו (ישעיהו נ\"ח), וְאִם לֹא כֵן מַה בָּא לְהוֹדִיעֵנוּ? וּבִבְ\"רַ רָאִיתִי, וַתִּקְרָא שְׁמוֹ שֵׁלָה וגוֹמֵר פְּסַקַת:", "rashi_en": "רש\"י מסביר שכזיב הוא שם מקום, וסובר ששמו נקרא כך משום שבו פסקה מלדת, מלשון אכזב — הפסקה. שהרי אם לא כן, מה בא הכתוב להודיענו?", "note": "", "points": [{"q": "לְדַעַת רַשִׁ\"י, מַדּוּעַ נִקְרָא הַמָּקוֹם \"כְּזִיב\"?", "options": ["כִּי שָׁם פָּסְקָה מִלֶּדֶת, מִלְּשׁוֹן אַכְזָב", "כִּי שָׁם כִּזְּבוּ לָהּ עַל מוֹת בַּעְלָהּ", "כִּי שָׁם נוֹלַד שֵׁלָה וְנִכְזְבָה תִּקְוָותָהּ"], "kasha": "מדוע הכתוב מציין שיהודה היה בכזיב? מה בא הפרט הזה להודיענו?", "answer": "רש\"י סובר שהמקום נקרא כזיב על שם שפסקה מלדת, מלשון אכזב — הפסקה וכזב.", "kp": ["על שם שפסקה מלדת נקרא כזיב", "ואם לא כן מה בא להודיענו"]}]}, {"id": "38:7.1", "ch": 38, "v": 7, "n": 1, "dh": "רע בעיני ה'", "pasuk_html": "וַיְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה <mark>רַ֖ע בְּעֵינֵ֣י יְהוָ֑ה</mark> וַיְמִתֵ֖הוּ יְהוָֽה׃", "pasuk_en": "וַיְהִי עֵר בְּכוֹר יְהוּדָה רַע בְּעֵינֵי יְהוָה וַיְמִתֵהוּ יְהוָה׃", "rashi_he": "רע בעיני ה'. כְּרָעָתוֹ שֶׁל אוֹנָן, מַשְׁחִית זַרְעוֹ, שֶׁנֶּאֱמַר בְּאוֹנָן וַיָּמֶת גַּם אֹתוֹ, כְּמִיתָתוֹ שֶׁל עֵר מִיתָתוֹ שֶׁל אוֹנָן. וְלָמָּה הָיָה עֵר מַשְׁחִית זַרְעוֹ? כְּדֵי שֶׁלֹּא תִּתְעַבֵּר וְיַכְחִישׁ יָפְיָהּ:", "rashi_en": "רש\"י מסביר שחטאו של ער היה כחטא אונן — שהיה משחית זרעו. הוכחה לכך: על אונן נאמר \"וימת גם אותו\", כלומר אותה מיתה כמו ער. וסיבתו של ער — כדי שתמר לא תתעבר ולא יכחיש יופיה.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַדּוּעַ הָיָה עֵר מַשְׁחִית זַרְעוֹ?", "options": ["כְּדֵי שֶׁאִשְׁתּוֹ לֹא תִּתְעַבֵּר וְיַכְחִישׁ יָופְיָהּ", "כְּדֵי שֶׁלֹּא יִצְטָרֵךְ לָזוּן יְלָדִים", "כְּדֵי שֶׁלֹּא יִהְיֶה יוֹרֵשׁ לְנַחֲלַת אָבִיו"], "kasha": "הכתוב אומר שער היה \"רע בעיני ה'\" אך אינו מפרש מה היה חטאו.", "answer": "ער היה משחית זרעו כמו אונן, כדי שאשתו לא תתעבר ולא יכחיש יופיה.", "kp": ["כרעתו של אונן משחית זרעו", "כדי שלא תתעבר ויכחיש יפיה"]}, {"q": "מִנַּייִן לָמַד רַשִׁ\"י שֶׁחֵטְא עֵר זָהֶה לְחֵטְא אוֹנָן?", "options": ["מֵהַמִּילָּה \"גַּם\" — \"וַיָּמֶת גַּם אֹותוֹ\", מַשְׁמָע אוֹתוֹ חֵטְא", "מִכָּךְ שֶׁשְּׁנֵיהֶם מֵתוּ בְּגִיל צָעִיר", "מִכָּךְ שֶׁהַכָּתוּב סָמַךְ אֶת שְׁנֵי הַסִּיפּוּרִים זֶה לָזֶה"], "kasha": "הכתוב מפרט את חטא אונן אבל לא את חטא ער, ואין ראיה ישירה שחטאם זהה.", "answer": "מלשון \"וימת גם אותו\" שנאמר באונן — המילה \"גם\" מלמדת שמיתתו של אונן הייתה כמיתת ער, על אותו חטא.", "kp": ["שנאמר באונן וימת גם אתו", "כמיתתו של ער מיתתו של אונן"]}]}, {"id": "38:8.1", "ch": 38, "v": 8, "n": 1, "dh": "והקם זרע", "pasuk_html": "וַיֹּ֤אמֶר יְהוּדָה֙ לְאוֹנָ֔ן בֹּ֛א אֶל־אֵ֥שֶׁת אָחִ֖יךָ וְיַבֵּ֣ם אֹתָ֑הּ <mark>וְהָקֵ֥ם זֶ֖רַע</mark> לְאָחִֽיךָ׃", "pasuk_en": "וַיֹּאמֶר יְהוּדָה לְאוֹנָן בֹּא אֶל־אֵשֶׁת אָחִיךָ וְיַבֵּם אֹתָהּ וְהָקֵם זֶרַע לְאָחִיךָ׃", "rashi_he": "והקם זרע. הַבֵּן יִקָּרֵא עַל שֵׁם הַמֵּת:", "rashi_en": "רש\"י מסביר שמצוות ייבום נועדה לכך שהבן שייוולד ייקרא על שם האח המת.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַה מַשְׁמָעוּת \"וְהָקֵם זֶרַע לְאָחִיךָ\"?", "options": ["הַבֵּן שֶׁיִּיווָּלֵד ייִקָּרֵא עַל שֵׁם הַמֵּת", "הַבֵּן יַמְשִׁיךְ אֶת עֲבוֹדַת הָאָח הַמֵּת", "הַבֵּן יִירַשׁ אֶת נַחֲלַת הָאָח הַמֵּת"], "kasha": "הביטוי \"והקם זרע לאחיך\" סתום — באיזה אופן הזרע מוקם לאחיו?", "answer": "רש\"י מפרש שהבן הנולד מן הייבום ייקרא על שם האח המת.", "kp": ["הבן יקרא על שם המת"]}]}, {"id": "38:9.1", "ch": 38, "v": 9, "n": 1, "dh": "ושחת ארצה", "pasuk_html": "וַיֵּ֣דַע אוֹנָ֔ן כִּ֛י לֹּ֥א ל֖וֹ יִהְיֶ֣ה הַזָּ֑רַע וְהָיָ֞ה אִם־בָּ֨א אֶל־אֵ֤שֶׁת אָחִיו֙ <mark>וְשִׁחֵ֣ת אַ֔רְצָה</mark> לְבִלְתִּ֥י נְתָן־זֶ֖רַע לְאָחִֽיו׃", "pasuk_en": "וַיֵּדַע אוֹנָן כִּי לֹּא לוֹ יִהְיֶה הַזָּרַע וְהָיָה אִם־בָּא אֶל־אֵשֶׁת אָחִיו וְשִׁחֵת אַרְצָה לְבִלְתִּי נְתָן־זֶרַע לְאָחִיו׃", "rashi_he": "ושחת ארצה. דָּשׁ מִבִּפְנִים וְזוֹרֶה מִבַּחוּץ (בראשית רבה):", "rashi_en": "רש״י מסביר שאונן לא רצה להוליד זרע לאחיו, ולכן היה משמש עם אשת אחיו אך שופך את זרעו בחוץ — \"דש מבפנים וזורה מבחוץ\".", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת \"וְשִׁחֵת אַרְצָה\"?", "options": ["דָּשׁ מִבִּפְנִים וְזוֹרֶה מִבַּחוּץ", "נִמְנַע מִלָּבוֹא אֵלֶיהָ כְּלָל", "שָׁפַךְ אֶת זַרְעוֹ עַל הָאָרֶץ לְאַחַר תַּשְׁמִישׁ"], "kasha": "הביטוי \"ושחת ארצה\" סתום — כיצד בדיוק השחית אונן את זרעו?", "answer": "רש״י מבאר שאונן היה משמש עם אשת אחיו אך שופך את זרעו בחוץ, כלשון חז״ל: דש מבפנים וזורה מבחוץ.", "kp": ["דש מבפנים וזורה מבחוץ"]}]}, {"id": "38:11.1", "ch": 38, "v": 11, "n": 1, "dh": "כי אמר וגו'", "pasuk_html": "וַיֹּ֣אמֶר יְהוּדָה֩ לְתָמָ֨ר כַּלָּת֜וֹ שְׁבִ֧י אַלְמָנָ֣ה בֵית־אָבִ֗יךְ עַד־יִגְדַּל֙ שֵׁלָ֣ה בְנִ֔י <mark>כִּ֣י אָמַ֔ר</mark> פֶּן־יָמ֥וּת גַּם־ה֖וּא כְּאֶחָ֑יו וַתֵּ֣לֶךְ תָּמָ֔ר וַתֵּ֖שֶׁב בֵּ֥ית אָבִֽיהָ׃", "pasuk_en": "וַיֹּאמֶר יְהוּדָה לְתָמָר כַּלָּתוֹ שְׁבִי אַלְמָנָה בֵית־אָבִיךְ עַד־יִגְדַּל שֵׁלָה בְנִי כִּי אָמַר פֶּן־יָמוּת גַּם־הוּא כְּאֶחָיו וַתֵּלֶךְ תָּמָר וַתֵּשֶׁב בֵּית אָבִיהָ׃", "rashi_he": "כי אמר וגו'. כְּלוֹמַר, דּוֹחֶה הָיָה אוֹתָהּ בְּקַשׁ, שֶׁלֹּא הָיָה בְדַעְתּוֹ לְהַשִּׂיאָהּ לוֹ:", "rashi_en": "רש״י מסביר שיהודה לא באמת התכוון להשיא את שלה לתמר, אלא דחה אותה בתירוצים — \"דוחה היה אותה בקש\".", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַה הָיְתָה כַּוָּונָתוֹ הָאֲמִיתִּית שֶׁל יְהוּדָה כְּשֶׁאָמַר לְתָמָר לְהַמְתִּין?", "options": ["דָּחָה אוֹתָהּ בְּתֵירוּץ וְלֹא הִתְכַּווֵּן לְהַשִּׂיאָהּ לְשֵׁלָה", "רָצָה לְהַמְתִּין עַד שֶׁשֵּׁלָה יִגְדַּל בֶּאֱמֶת", "חָשַׁשׁ שֶׁתָּמָר תְּסָרֵב לְהִינָּשֵׂא לְשֵׁלָה"], "kasha": "מדוע כתוב \"כי אמר פן ימות\" — האם יהודה באמת חשש לשלה, או שזו רק אמתלה?", "answer": "רש״י מבאר שיהודה דחה את תמר בקש, ולא היה בדעתו כלל להשיאה לשלה.", "kp": ["דוחה היה אותה בקש", "לא היה בדעתו להשיאה לו"]}]}, {"id": "38:11.2", "ch": 38, "v": 11, "n": 2, "dh": "כי אמר פן ימות", "pasuk_html": "וַיֹּ֣אמֶר יְהוּדָה֩ לְתָמָ֨ר כַּלָּת֜וֹ שְׁבִ֧י אַלְמָנָ֣ה בֵית־אָבִ֗יךְ עַד־יִגְדַּל֙ שֵׁלָ֣ה בְנִ֔י <mark>כִּ֣י אָמַ֔ר פֶּן־יָמ֥וּת</mark> גַּם־ה֖וּא כְּאֶחָ֑יו וַתֵּ֣לֶךְ תָּמָ֔ר וַתֵּ֖שֶׁב בֵּ֥ית אָבִֽיהָ׃", "pasuk_en": "וַיֹּאמֶר יְהוּדָה לְתָמָר כַּלָּתוֹ שְׁבִי אַלְמָנָה בֵית־אָבִיךְ עַד־יִגְדַּל שֵׁלָה בְנִי כִּי אָמַר פֶּן־יָמוּת גַּם־הוּא כְּאֶחָיו וַתֵּלֶךְ תָּמָר וַתֵּשֶׁב בֵּית אָבִיהָ׃", "rashi_he": "כי אמר פן ימות. מֻחְזֶקֶת הִיא זוֹ שֶׁיָּמוּתוּ אֲנָשֶׁיהָ (כתובות מ\"ג):", "rashi_en": "רש״י מביא את דברי חז״ל שיהודה חשש מתמר עצמה, כי סבר שהיא \"מחזקת\" — גורמת למות בעליה.", "note": "", "points": [{"q": "מַדּוּעַ חָשַׁשׁ יְהוּדָה לְהַשִּׂיא אֶת שֵׁלָה לְתָמָר, לְפִי רַשִׁ״י?", "options": ["סָבַר שֶׁתָּמָר מְחַזֶּקֶת שֶׁיָּמוּתוּ בְּעָלֶיהָ", "חָשַׁב שֶׁשֵּׁלָה עֲדַייִן קָטָן מִדַּי לְנִישׂוּאִין", "יָדַע שֶׁתָּמָר אֵינָהּ רְאוּיָה לְבָנָיו"], "kasha": "מה עמד מאחורי החשש \"פן ימות גם הוא כאחיו\" — האם יהודה ראה בתמר את הסיבה למיתת בניו?", "answer": "רש״י מבאר שיהודה סבר שתמר מחזקת — מזלה גורם שימותו אנשיה, כמבואר בכתובות.", "kp": ["מחזקת היא זו שימותו אנשיה"]}]}, {"id": "38:12.1", "ch": 38, "v": 12, "n": 1, "dh": "ויעל על גוזזי צאנו", "pasuk_html": "וַיִּרְבּוּ֙ הַיָּמִ֔ים וַתָּ֖מָת בַּת־שׁ֣וּעַ אֵֽשֶׁת־יְהוּדָ֑ה וַיִּנָּ֣חֶם יְהוּדָ֗ה <mark>וַיַּ֜עַל עַל־גֹּֽזֲזֵ֤י צֹאנוֹ֙</mark> ה֗וּא וְחִירָ֛ה רֵעֵ֥הוּ הָעֲדֻלָּמִ֖י תִּמְנָֽתָה׃", "pasuk_en": "וַיִּרְבּוּ הַיָּמִים וַתָּמָת בַּת־שׁוּעַ אֵשֶׁת־יְהוּדָה וַיִּנָּחֶם יְהוּדָה וַיַּעַל עַל־גֹּזֲזֵי צֹאנוֹ הוּא וְחִירָה רֵעֵהוּ הָעֲדֻלָּמִי תִּמְנָתָה׃", "rashi_he": "ויעל על גוזזי צאנו. וַיַּעַל תִּמְנָתָה לַעֲמֹד עַל גּוֹזְזֵי צֹאנוֹ:", "rashi_en": "רש״י מבאר שהפסוק קיצר, וכוונתו: עלה לתמנה כדי לעמוד על גוזזי צאנו ולפקח עליהם.", "note": "", "points": [{"q": "מַה מְדַייֵּק רַשִׁ״י בַּבִּיטּוּי \"וַיַּעַל עַל גֹּוזְזֵי צֹאנוֹ\"?", "options": ["הַכַּווָּנָה שֶׁעָלָה לְתִמְנָה לְפַקֵּחַ עַל הַגּוֹזְזִים", "הַכַּווָּנָה שֶׁעָלָה עַל גַּב הַצֹּאן בְּעַצְמוֹ לִגְזוֹז", "הַכַּווָּנָה שֶׁעָלָה עִם הַגּוֹזְזִים יַחַד לַחְגֹּוג"], "kasha": "הביטוי \"ויעל על גוזזי\" אינו חלק — מה פירוש \"על\" כאן, ומה חסר בפסוק?", "answer": "רש״י משלים את הפסוק: עלה לתמנה לעמוד על גוזזי צאנו, כלומר לפקח עליהם.", "kp": ["ויעל תמנתה לעמד על גוזזי צאנו"]}]}, {"id": "38:13.1", "ch": 38, "v": 13, "n": 1, "dh": "עלה תמנתה", "pasuk_html": "וַיֻּגַּ֥ד לְתָמָ֖ר לֵאמֹ֑ר הִנֵּ֥ה חָמִ֛יךְ <mark>עֹלֶ֥ה תִמְנָ֖תָה</mark> לָגֹ֥ז צֹאנֽוֹ׃", "pasuk_en": "וַיֻּגַּד לְתָמָר לֵאמֹר הִנֵּה חָמִיךְ עֹלֶה תִמְנָתָה לָגֹז צֹאנוֹ׃", "rashi_he": "עלה תמנתה. וּבְשִׁמְשׁוֹן הוּא אוֹמֵר וַיֵּרֶד שִׁמְשׁוֹן תִּמְנָתָה (שופטים י\"ד)? בְּשִׁפּוּעַ הָהָר הָיְתָה יוֹשֶׁבֶת, עוֹלִין לָהּ מִכָּאן וְיוֹרְדִין לָהּ מִכָּאן:", "rashi_en": "רש״י מקשה שבפרשת שמשון כתוב 'וירד תמנתה', ואילו כאן כתוב 'עולה'. הוא מתרץ שתמנה ישבה בשיפוע הר, כך שמצד אחד עולים אליה ומצד אחר יורדים.", "note": "", "points": [{"q": "מַדּוּעַ כָּאן כָּתוּב 'עֹולֶה' תִּמְנָתָה וְאֵצֶל שִׁמְשׁוֹן 'וַיֵּרֶד' תִּמְנָתָה?", "options": ["תִּמְנָה יָשְׁבָה בְּשִׁיפּוּעַ הַר, וְאֶפְשָׁר לַעֲלוֹת אוֹ לָרֶדֶת אֵלֶיהָ", "שִׁמְשׁוֹן בָּא מִמָּקוֹם גָּבוֹהַ יוֹתֵר מִיהוּדָה", "מְדֻובָּר בִּשְׁתֵּי עָרִים שׁוֹנוֹת בְּשֵׁם תִּמְנָה"], "kasha": "סתירה בין 'עולה תמנתה' כאן לבין 'וירד תמנתה' אצל שמשון.", "answer": "תמנה ישבה בשיפוע ההר, כך שעולים אליה מצד אחד ויורדים אליה מצד אחר, ואין סתירה.", "kp": ["בשפוע ההר היתה יושבת", "עולין לה מכאן ויורדין לה מכאן"]}]}, {"id": "38:14.1", "ch": 38, "v": 14, "n": 1, "dh": "ותתעלף", "pasuk_html": "וַתָּסַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜הּ מֵֽעָלֶ֗יהָ וַתְּכַ֤ס בַּצָּעִיף֙ <mark>וַתִּתְעַלָּ֔ף</mark> וַתֵּ֙שֶׁב֙ בְּפֶ֣תַח עֵינַ֔יִם אֲשֶׁ֖ר עַל־דֶּ֣רֶךְ תִּמְנָ֑תָה כִּ֤י רָאֲתָה֙ כִּֽי־גָדַ֣ל שֵׁלָ֔ה וְהִ֕וא לֹֽא־נִתְּנָ֥ה ל֖וֹ לְאִשָּֽׁה׃", "pasuk_en": "וַתָּסַר בִּגְדֵי אַלְמְנוּתָהּ מֵעָלֶיהָ וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף וַתֵּשֶׁב בְּפֶתַח עֵינַיִם אֲשֶׁר עַל־דֶּרֶךְ תִּמְנָתָה כִּי רָאֲתָה כִּי־גָדַל שֵׁלָה וְהִוא לֹא־נִתְּנָה לוֹ לְאִשָּׁה׃", "rashi_he": "ותתעלף. כִּסְּתָה פָנֶיהָ, שֶׁלֹּא יַכִּיר בָּהּ:", "rashi_en": "רש״י מפרש שהמילה 'ותתעלף' פירושה שכיסתה את פניה כדי שיהודה לא יכיר אותה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ 'וַתִּתְעַלֵּף' לְפִי רַשׁ״י?", "options": ["כִּיסְּתָה אֶת פָּנֶיהָ כְּדֵי שֶׁלֹּא יַכִּיר בָּהּ", "הִתְעַלְּפָה מֵרֹוב פַּחַד לִפְנֵי יְהוּדָה", "הִתְעַטְּפָה בְּבִגְדֵי חֲמוּדוֹת כְּדֵי לִמְשׁוֹךְ תְּשׂוּמַת לֵב"], "kasha": "המילה 'ותתעלף' אינה מובנת מאליה — מה עשתה תמר בדיוק?", "answer": "תמר כיסתה את פניה כדי שיהודה לא יכיר אותה.", "kp": ["כסתה פניה שלא יכיר בה"]}]}, {"id": "38:14.2", "ch": 38, "v": 14, "n": 2, "dh": "ותשב בפתח עינים", "pasuk_html": "וַתָּסַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜הּ מֵֽעָלֶ֗יהָ וַתְּכַ֤ס בַּצָּעִיף֙ וַתִּתְעַלָּ֔ף <mark>וַתֵּ֙שֶׁב֙ בְּפֶ֣תַח עֵינַ֔יִם</mark> אֲשֶׁ֖ר עַל־דֶּ֣רֶךְ תִּמְנָ֑תָה כִּ֤י רָאֲתָה֙ כִּֽי־גָדַ֣ל שֵׁלָ֔ה וְהִ֕וא לֹֽא־נִתְּנָ֥ה ל֖וֹ לְאִשָּֽׁה׃", "pasuk_en": "וַתָּסַר בִּגְדֵי אַלְמְנוּתָהּ מֵעָלֶיהָ וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף וַתֵּשֶׁב בְּפֶתַח עֵינַיִם אֲשֶׁר עַל־דֶּרֶךְ תִּמְנָתָה כִּי רָאֲתָה כִּי־גָדַל שֵׁלָה וְהִוא לֹא־נִתְּנָה לוֹ לְאִשָּׁה׃", "rashi_he": "ותשב בפתח עינים. בִּפְתִיחַת עֵינַיִם, בְּפָרָשַׁת דְּרָכִים שֶׁעַל דֶּרֶךְ תִּמְנָתָה. וְרַבּוֹתֵינוּ דָּרְשׁוּ בְּפִתְחוֹ שֶׁל אַבְרָהָם אָבִינוּ, שֶׁכָּל עֵינַיִם מְצַפּוֹת לִרְאוֹתוֹ (סוטה י'):", "rashi_en": "רש״י מפרש 'פתח עינים' כפשוטו — פרשת דרכים בדרך לתמנה. ולפי המדרש — בפתח קברו של אברהם אבינו, שכל עיניים מצפות לראותו.", "note": "", "points": [{"q": "מַהוּ 'פֶּתַח עֵינַיִם' לְפִי הַפְּשָׁט וּלְפִי הַמִּדְרָשׁ?", "options": ["פָּרָשַׁת דְּרָכִים לְפִי הַפְּשָׁט, וּפֶתַח קֶבֶר אַבְרָהָם לְפִי הַמִּדְרָשׁ", "שַׁעַר עִיר בְּשֵׁם 'עֵינַיִם' לְפִי הַפְּשָׁט, וּמַעְיַין מַיִם לְפִי הַמִּדְרָשׁ", "מָקוֹם גָּבֹוהַּ שֶׁרוֹאִים מִמֶּנּוּ לְפִי הַפְּשָׁט, וּבֵית מִדְרָשׁ לְפִי הַמִּדְרָשׁ"], "kasha": "הביטוי 'פתח עינים' אינו מובן — מהו מקום זה?", "answer": "לפי הפשט מדובר בפרשת דרכים שבדרך לתמנה. לפי חז״ל — בפתחו של אברהם אבינו, שכל עיניים מצפות לראותו.", "kp": ["בפרשת דרכים שעל דרך תמנתה", "בפתחו של אברהם אבינו"]}]}, {"id": "38:14.3", "ch": 38, "v": 14, "n": 3, "dh": "כי ראתה כי גדל שלה וגו'", "pasuk_html": "וַתָּסַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜הּ מֵֽעָלֶ֗יהָ וַתְּכַ֤ס בַּצָּעִיף֙ וַתִּתְעַלָּ֔ף וַתֵּ֙שֶׁב֙ בְּפֶ֣תַח עֵינַ֔יִם אֲשֶׁ֖ר עַל־דֶּ֣רֶךְ תִּמְנָ֑תָה <mark>כִּ֤י רָאֲתָה֙ כִּֽי־גָדַ֣ל שֵׁלָ֔ה</mark> וְהִ֕וא לֹֽא־נִתְּנָ֥ה ל֖וֹ לְאִשָּֽׁה׃", "pasuk_en": "וַתָּסַר בִּגְדֵי אַלְמְנוּתָהּ מֵעָלֶיהָ וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף וַתֵּשֶׁב בְּפֶתַח עֵינַיִם אֲשֶׁר עַל־דֶּרֶךְ תִּמְנָתָה כִּי רָאֲתָה כִּי־גָדַל שֵׁלָה וְהִוא לֹא־נִתְּנָה לוֹ לְאִשָּׁה׃", "rashi_he": "כי ראתה כי גדל שלה וגו'. לְפִיכָךְ הִפְקִירָה עַצְמָהּ אֵצֶל יְהוּדָה, שֶׁהָיְתָה מִתְאַוָּה לְהַעֲמִיד מִמֶּנּוּ בָנִים:", "rashi_en": "רש״י מסביר שתמר ראתה ששלה גדל ולא נתנו לה לאשה, ולכן הפקירה עצמה ליהודה כי התאוותה להעמיד ממנו בנים.", "note": "", "points": [{"q": "מַדּוּעַ הִפְקִירָה תָּמָר עַצְמָהּ לִיהוּדָה, לְפִי רַשִׁ״י?", "options": ["כִּי הִתְאַווְּתָה לְ ּ מְכֻוסּוֹת וְלֹא יָכֹל לִרְאוֹתָהּ", "כִּי עָבַר זְמַן רַב מֵאָז רָאָה אוֹתָהּ", "כִּי יָשְׁבָה בְּמָקוֹם חָשׁוּךְ וְרָחוֹק מִמֶּנּוּ"], "kasha": "לכאורה 'כי כסתה פניה' הוא הסיבה שחשבה לזונה, אך מה עניין כיסוי הפנים לזנות?", "answer": "לפי הפשט, כיסוי הפנים הוא הסיבה שלא הכירה — לא יכל לראותה ולהכירה.", "kp": ["ולא יכול לראותה ולהכירה"]}, {"q": "לְפִי מִדְרַשׁ חַזַ״ל שֶׁרַשִׁ״י מֵבִיא, מַדּוּעַ לֹא חָשַׁד בָּהּ יְהוּדָה?", "options": ["כִּי בְּבֵית חָמִיהָ נָהֲגָה בִּצְנִיעוּת וְכִיסְּתָה פָּנֶיהָ תָּמִיד", "כִּי הוּא לֹא צִיפָּה לִפְגֹּושׁ אוֹתָהּ מִחוּץ לְבֵיתָהּ", "כִּי הִיא שִׁינְּתָה אֶת בְּגָדֶיהָ וְאֶת מַרְאֵה שַׂעֲרָהּ"], "kasha": "מה הקשר בין כיסוי הפנים בעבר לכך שלא חשד בה עכשיו?", "answer": "לפי המדרש, תמר כיסתה תמיד את פניה בבית חמיה מתוך צניעות, ולכן יהודה לא העלה על דעתו שאשה צנועה כמוה תשב כזונה.", "kp": ["כשהיתה בבית חמיה היתה צנועה", "לפיכך לא חשדה"]}]}, {"id": "38:16.1", "ch": 38, "v": 16, "n": 1, "dh": "ויט אליה אל הדרך", "pasuk_html": "<mark>וַיֵּ֨ט אֵלֶ֜יהָ אֶל־הַדֶּ֗רֶךְ</mark> וַיֹּ֙אמֶר֙ הָֽבָה־נָּא֙ אָב֣וֹא אֵלַ֔יִךְ כִּ֚י לֹ֣א יָדַ֔ע כִּ֥י כַלָּת֖וֹ הִ֑וא וַתֹּ֙אמֶר֙ מַה־תִּתֶּן־לִּ֔י כִּ֥י תָב֖וֹא אֵלָֽי׃", "pasuk_en": "וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ וַיֹּאמֶר הָבָה־נָּא אָבוֹא אֵלַיִךְ כִּי לֹא יָדַע כִּי כַלָּתוֹ הִוא וַתֹּאמֶר מַה־תִּתֶּן־לִּי כִּי תָבוֹא אֵלָי׃", "rashi_he": "ויט אליה אל הדרך. מִדֶּרֶךְ שֶׁהָיָה בָהּ, נָטָה אֶל הַדֶּרֶךְ אֲשֶׁר הִיא בָּהּ, וּבִלְשׁוֹן לַעַז דשטורנ\"יר:", "rashi_en": "רש״י מסביר שיהודה סטה מהדרך שהלך בה ופנה אל הדרך שבה ישבה תמר.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַה פֵּירוּשׁ 'וַיֵּט אֵלֶיהָ אֶל הַדֶּרֶךְ'?", "options": ["סָטָה מִדַּרְכּוֹ וּפָנָה אֶל הַדֶּרֶךְ שֶׁהִיא יָשְׁבָה בָּהּ", "עָצַר בַּדֶּרֶךְ שֶׁהָלַךְ בָּהּ וּפָנָה אֵלֶיהָ", "הִטָּה אֶת פָּנָיו אֵלֶיהָ כְּשֶׁעָבַר לְיָדָהּ"], "kasha": "הביטוי 'ויט אליה אל הדרך' תמוה — מדוע נאמר 'אל הדרך' ולא 'אליה' בלבד?", "answer": "רש״י מסביר שיהודה סטה מהדרך שהוא הלך בה ופנה אל הדרך שבה ישבה היא.", "kp": ["מדרך שהיה בה נטה אל הדרך אשר היא בה"]}]}, {"id": "38:16.2", "ch": 38, "v": 16, "n": 2, "dh": "הבה נא", "pasuk_html": "וַיֵּ֨ט אֵלֶ֜יהָ אֶל־הַדֶּ֗רֶךְ וַיֹּ֙אמֶר֙ <mark>הָֽבָה־נָּא֙</mark> אָב֣וֹא אֵלַ֔יִךְ כִּ֚י לֹ֣א יָדַ֔ע כִּ֥י כַלָּת֖וֹ הִ֑וא וַתֹּ֙אמֶר֙ מַה־תִּתֶּן־לִּ֔י כִּ֥י תָב֖וֹא אֵלָֽי׃", "pasuk_en": "וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ וַיֹּאמֶר הָבָה־נָּא אָבוֹא אֵלַיִךְ כִּי לֹא יָדַע כִּי כַלָּתוֹ הִוא וַתֹּאמֶר מַה־תִּתֶּן־לִּי כִּי תָבוֹא אֵלָי׃", "rashi_he": "הבה נא. הָכִינִי עַצְמֵךְ וְדַעְתֵּךְ לְכָךְ. כָּל לְשׁוֹן הָבָה לְשׁוֹן הַזְמָנָה הוּא, חוּץ מִמָּקוֹם שֶׁיֵּשׁ לְתַרְגְּמוֹ בִּלְשׁוֹן נְתִינָה, וְאַף אוֹתָן שֶׁל הַזְמָנָה קְרוֹבִים לִלְשׁוֹן נְתִינָה הֵם:", "rashi_en": "רש״י מסביר שהמילה 'הבה' פירושה הכנה — הכיני עצמך ודעתך לכך. כל 'הבה' בתורה היא לשון הזמנה, מלבד מקומות שמתפרשים כנתינה, ואף לשון ההזמנה קרובה לנתינה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַהוּ פֵּירוּשׁ הַמִּילָּה 'הָבָה' בַּפָּסוּק זֶה?", "options": ["הָכִינִי עַצְמֵךְ וְדַעְתֵּךְ — לְשׁוֹן הַזְמָנָה וְהַכָּנָה", "תְּנִי לִי רְשׁוּת — לְשׁוֹן נְתִינָה וּמַתָּן", "בֹּואִי נָא — לְשׁוֹן קְרִיאָה וְהַזְמָנָה לָבוֹא"], "kasha": "מה פירוש 'הבה נא' — הרי 'הבה' משמעותה בדרך כלל 'תן', ומה נותנים כאן?", "answer": "'הבה' כאן היא לשון הזמנה והכנה, כלומר הכיני עצמך ודעתך לכך, ולא לשון נתינה ממש.", "kp": ["הכיני עצמך ודעתך לכך", "כל לשון הבה לשון הזמנה הוא"]}]}, {"id": "38:17.1", "ch": 38, "v": 17, "n": 1, "dh": "ערבון", "pasuk_html": "וַיֹּ֕אמֶר אָנֹכִ֛י אֲשַׁלַּ֥ח גְּדִֽי־עִזִּ֖ים מִן־הַצֹּ֑אן וַתֹּ֕אמֶר אִם־תִּתֵּ֥ן <mark>עֵרָב֖וֹן</mark> עַ֥ד שָׁלְחֶֽךָ׃", "pasuk_en": "וַיֹּאמֶר אָנֹכִי אֲשַׁלַּח גְּדִי־עִזִּים מִן־הַצֹּאן וַתֹּאמֶר אִם־תִּתֵּן עֵרָבוֹן עַד שָׁלְחֶךָ׃", "rashi_he": "ערבון. מַשְׁכּוֹן:", "rashi_en": "רש״י מפרש שהמילה ערבון פירושה משכון, דהיינו חפץ שניתן כבטוחה עד שישלם.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה \"עֵרָבוֹן\"?", "options": ["מַשְׁכּוֹן — חֵפֶץ הַנִּיתָּן כִּבְטוּחָה", "מַתָּנָה — דָּבָר הַנִּיתָּן חִינָּם", "הַבְטָחָה — הִתְחַיְּיבוּת בְּעַל פֶּה"], "kasha": "המילה \"ערבון\" אינה שגורה, וצריך לבאר את משמעותה.", "answer": "רש״י מפרש שערבון הוא משכון, כלומר חפץ שנמסר כבטוחה.", "kp": ["משכון"]}]}, {"id": "38:18.1", "ch": 38, "v": 18, "n": 1, "dh": "חתמך ופתילך", "pasuk_html": "וַיֹּ֗אמֶר מָ֣ה הָֽעֵרָבוֹן֮ אֲשֶׁ֣ר אֶתֶּן־לָּךְ֒ וַתֹּ֗אמֶר <mark>חֹתָֽמְךָ֙ וּפְתִילֶ֔ךָ</mark> וּמַטְּךָ֖ אֲשֶׁ֣ר בְּיָדֶ֑ךָ וַיִּתֶּן־לָּ֛הּ וַיָּבֹ֥א אֵלֶ֖יהָ וַתַּ֥הַר לֽוֹ׃", "pasuk_en": "וַיֹּאמֶר מָה הָעֵרָבוֹן אֲשֶׁר אֶתֶּן־לָּךְ וַתֹּאמֶר חֹתָמְךָ וּפְתִילֶךָ וּמַטְּךָ אֲשֶׁר בְּיָדֶךָ וַיִּתֶּן־לָּהּ וַיָּבֹא אֵלֶיהָ וַתַּהַר לוֹ׃", "rashi_he": "חתמך ופתילך. עִזְקְתָךְ וְשׁוֹשִׁיפָּךְ – טַבַּעַת שֶׁאַתָה חוֹתֵם בָּהּ וְשִׂמְלָתְךָ שֶׁאַתָּה מִתְכַּסֶּה בָהּ:", "rashi_en": "רש״י מביא את תרגום אונקלוס ומסביר ש\"חותמך\" היא טבעת חותם ו\"פתילך\" היא שמלה שמתכסים בה, ולא חוט כפשוטו.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַהוּ הַ\"פָּתִיל\" שֶׁתָּמָר בִּיקְּשָׁה מִיהוּדָה?", "options": ["שִׂמְלָה שֶׁהוּא מִתְכַּסֶּה בָּהּ", "חוּט אוֹ פְּתִיל שֶׁקּוֹשְׁרִים בּוֹ", "צָמִיד שֶׁעַל יָדוֹ"], "kasha": "המילה \"פתילך\" עשויה להתפרש כחוט או חבל, וצריך לבאר מה באמת נתן לה.", "answer": "רש״י מביא את תרגום אונקלוס \"שושיפך\" ומסביר שהכוונה לשמלה שמתכסים בה.", "kp": ["שמלתך שאתה מתכסה בה", "שושיפך"]}]}, {"id": "38:18.2", "ch": 38, "v": 18, "n": 2, "dh": "ותהר לו", "pasuk_html": "וַיֹּ֗אמֶר מָ֣ה הָֽעֵרָבוֹן֮ אֲשֶׁ֣ר אֶתֶּן־לָּךְ֒ וַתֹּ֗אמֶר חֹתָֽמְךָ֙ וּפְתִילֶ֔ךָ וּמַטְּךָ֖ אֲשֶׁ֣ר בְּיָדֶ֑ךָ וַיִּתֶּן־לָּ֛הּ וַיָּבֹ֥א אֵלֶ֖יהָ <mark>וַתַּ֥הַר לֽוֹ׃</mark>", "pasuk_en": "וַיֹּאמֶר מָה הָעֵרָבוֹן אֲשֶׁר אֶתֶּן־לָּךְ וַתֹּאמֶר חֹתָמְךָ וּפְתִילֶךָ וּמַטְּךָ אֲשֶׁר בְּיָדֶךָ וַיִּתֶּן־לָּהּ וַיָּבֹא אֵלֶיהָ וַתַּהַר לוֹ׃", "rashi_he": "ותהר לו. גִּבּוֹרִים כַּיּוֹצֵא בוֹ, צַדִּיקִים כַּיּוֹצֵא בוֹ.", "rashi_en": "רש״י דורש את המילה \"לו\" — שילדה בנים דומים לו: גיבורים וצדיקים כמותו.", "note": "", "points": [{"q": "מַה דּוֹרֵשׁ רַשִׁ״י מֵהַמִּילָּה \"לוֹ\" בַּבִּיטּוּי \"וַתַּהַר לוֹ\"?", "options": ["שֶׁהַווְּלָדוֹת הָיוּ גִּיבּוֹרִים וְצַדִּיקִים כִּיהוּדָה", "שֶׁהִיא הָרְתָה דַּווְקָא מִבִּיאָה רִאשׁוֹנָה", "שֶׁיְּהוּדָה הִכִּיר שֶׁהַוְּולָדוֹת שֶׁלּוֹ"], "kasha": "המילה \"לו\" נראית מיותרת, שהרי ברור ממי הרתה.", "answer": "רש״י דורש שהמילה \"לו\" מלמדת שילדה גיבורים כמותו וצדיקים כמותו.", "kp": ["גבורים כיוצא בו", "צדיקים כיוצא בו"]}]}, {"id": "38:21.1", "ch": 38, "v": 21, "n": 1, "dh": "הקדשה", "pasuk_html": "וַיִּשְׁאַ֞ל אֶת־אַנְשֵׁ֤י מְקֹמָהּ֙ לֵאמֹ֔ר אַיֵּ֧ה <mark>הַקְּדֵשָׁ֛ה</mark> הִ֥וא בָעֵינַ֖יִם עַל־הַדָּ֑רֶךְ וַיֹּ֣אמְר֔וּ לֹא־הָיְתָ֥ה בָזֶ֖ה קְדֵשָֽׁה׃", "pasuk_en": "וַיִּשְׁאַל אֶת־אַנְשֵׁי מְקֹמָהּ לֵאמֹר אַיֵּה הַקְּדֵשָׁה הִוא בָעֵינַיִם עַל־הַדָּרֶךְ וַיֹּאמְרוּ לֹא־הָיְתָה בָזֶה קְדֵשָׁה׃", "rashi_he": "הקדשה. מְקֻדֶּשֶׁת וּמְזֻמֶּנֶת לִזְנוּת:", "rashi_en": "רש״י מסביר שהכינוי \"קדשה\" בא מלשון מקודשת ומזומנת — כלומר מופקרת ומוכנה לזנות.", "note": "", "points": [{"q": "מַדּוּעַ נִקְרֵאת זוֹנָה בְּשֵׁם \"קְדֵשָׁה\" לְפִי רַשִׁ״י?", "options": ["כִּי הִיא מְקֻודֶּשֶׁת וּמְזֻומֶּנֶת לִזְנוּת", "כִּי הִיא יוֹשֶׁבֶת לְיַד מָקוֹם קָדוֹשׁ", "כִּי הִיא נוֹדֶרֶת נֶדֶר שֶׁל קְדֻושָּׁה"], "kasha": "השם \"קדשה\" נגזר לכאורה משורש ק.ד.ש שמשמעו קדושה, וקשה מה עניינו לזנות.", "answer": "רש״י מסביר שקדשה היא מלשון מקודשת ומזומנת — כלומר מופקרת ומוכנה לזנות.", "kp": ["מקדשת ומזמנת לזנות"]}]}, {"id": "38:23.1", "ch": 38, "v": 23, "n": 1, "dh": "תקח לה", "pasuk_html": "וַיֹּ֤אמֶר יְהוּדָה֙ <mark>תִּֽקַּֽח־לָ֔הּ</mark> פֶּ֖ן נִהְיֶ֣ה לָב֑וּז הִנֵּ֤ה שָׁלַ֙חְתִּי֙ הַגְּדִ֣י הַזֶּ֔ה וְאַתָּ֖ה לֹ֥א מְצָאתָֽהּ׃", "pasuk_en": "וַיֹּאמֶר יְהוּדָה תִּקַּח־לָהּ פֶּן נִהְיֶה לָבוּז הִנֵּה שָׁלַחְתִּי הַגְּדִי הַזֶּה וְאַתָּה לֹא מְצָאתָהּ׃", "rashi_he": "תקח לה. יִהְיֶה שֶׁלָּהּ מַה שְּׁבְּיָדָהּ:", "rashi_en": "רש״י מפרש שהכוונה היא שתמר תשמור לעצמה את המשכון שבידה, כלומר יהודה מוותר עליו.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"תִּקַּח־לָהּ\" לְפִי רַשׁ״י?", "options": ["שֶׁתִּשְׁמֹור לְעַצְמָהּ אֶת מַה שֶּׁבְּיָדָהּ", "שֶׁתֵּלֵךְ וּתְחַפֵּשׂ אֶת יְהוּדָה", "שֶׁתַּחֲזִיר אֶת הַמַּשְׁכּוֹן לַשּׁוֹלֵחַ"], "kasha": "הביטוי \"תקח לה\" אינו ברור — לקחת מה ולאן?", "answer": "רש״י מפרש שהכוונה שמה שבידה יישאר שלה, כלומר יהודה מוותר על המשכון.", "kp": ["יהיה שלה מה שבידה"]}]}, {"id": "38:23.2", "ch": 38, "v": 23, "n": 2, "dh": "פן נהיה לבוז", "pasuk_html": "וַיֹּ֤אמֶר יְהוּדָה֙ תִּֽקַּֽח־לָ֔הּ <mark>פֶּ֖ן נִהְיֶ֣ה לָב֑וּז</mark> הִנֵּ֤ה שָׁלַ֙חְתִּי֙ הַגְּדִ֣י הַזֶּ֔ה וְאַתָּ֖ה לֹ֥א מְצָאתָֽהּ׃", "pasuk_en": "וַיֹּאמֶר יְהוּדָה תִּקַּח־לָהּ פֶּן נִהְיֶה לָבוּז הִנֵּה שָׁלַחְתִּי הַגְּדִי הַזֶּה וְאַתָּה לֹא מְצָאתָהּ׃", "rashi_he": "פן נהיה לבוז. אִם תְּבַקְּשֶׁנָּה עוֹד יִתְפַּרְסֵם הַדָּבָר וְיִהְיֶה גְּנַאי, כִּי מֶה עָלַי לַעֲשׂוֹת עוֹד לְאַמֵּת דְּבָרַי:", "rashi_en": "רש״י מסביר שיהודה חשש שאם ימשיכו לחפש אותה, הדבר יתפרסם ויגרום לגנאי. הוא כבר עשה את שלו — שלח את הגדי — ואין לו מה לעשות יותר.", "note": "", "points": [{"q": "מַדּוּעַ אָמַר יְהוּדָה לְהַפְסִיק לְחַפֵּשׂ אֶת הָאִישָּׁה?", "options": ["חָשַׁשׁ שֶׁהַמֶּשֶׁךְ הַחִיפּוּשׁ יְפַרְסֵם אֶת הַדָּבָר וְיִגְרוֹם לְגִנַּאי", "רָצָה לַחְסֹוךְ כֶּסֶף וְלֹא לִשְׁלֹוחַ שָׁלִיחַ נוֹסָף", "חָשַׁב שֶׁהִיא כְּבָר עָזְבָה אֶת הָאֵזוֹר לְגַמְרֵי"], "kasha": "מדוע יהודה מוכן לוותר על המשכון ולא להמשיך לחפש?", "answer": "לפי רש״י, יהודה חשש שאם ימשיכו לחפש יתפרסם הדבר ויהיה גנאי, שהרי הוא כבר שלח את הגדי ועשה את המוטל עליו.", "kp": ["יתפרסם הדבר ויהיה גנאי", "מה עלי לעשות עוד לאמת דברי"]}]}, {"id": "38:23.3", "ch": 38, "v": 23, "n": 3, "dh": "הנה שלחתי הגדי הזה", "pasuk_html": "וַיֹּ֤אמֶר יְהוּדָה֙ תִּֽקַּֽח־לָ֔הּ פֶּ֖ן נִהְיֶ֣ה לָב֑וּז <mark>הִנֵּ֤ה שָׁלַ֙חְתִּי֙ הַגְּדִ֣י הַזֶּ֔ה</mark> וְאַתָּ֖ה לֹ֥א מְצָאתָֽהּ׃", "pasuk_en": "וַיֹּאמֶר יְהוּדָה תִּקַּח־לָהּ פֶּן נִהְיֶה לָבוּז הִנֵּה שָׁלַחְתִּי הַגְּדִי הַזֶּה וְאַתָּה לֹא מְצָאתָהּ׃", "rashi_he": "הנה שלחתי הגדי הזה. לְפִי שֶׁרִמָּה יְהוּדָה אֶת אָבִיו בִּגְדִי עִזִּים שֶׁהִטְבִּיל כְּתֹנֶת יוֹסֵף בְּדָמוֹ, רִמּוּהוּ גַּם הוּא בִּגְדִי עִזִּים (בראשית רבה):", "rashi_en": "רש״י מביא מדרש שיהודה רימה את אביו בגדי עזים כשהטביל את כתונת יוסף בדמו, ולכן מידה כנגד מידה — הוא עצמו רומה בגדי עזים.", "note": "", "points": [{"q": "מַהוּ הַקֶּשֶׁר שֶׁרַשׁ״י מַצְבִּיעַ עָלָיו בֵּין הַגְּדִי לְבֵין מַעֲשֵׂה יוֹסֵף?", "options": ["יְהוּדָה רִימָּה אֶת אָבִיו בִּגְדֵי עִזִּים וְלָכֵן רֻומָּה גַּם הוּא בִּגְדֵי עִזִּים", "יְהוּדָה נָדַר לִשְׁלוֹחַ גְּדִי לְכָל עָנִי כְּתִיקּוּן עַל מְכִירַת יוֹסֵף", "הַגְּדִי הָיָה מֵאוֹתוֹ עֵדֶר שֶׁמִּמֶּנּוּ לָקְחוּ אֶת הַגְּדִי לִכְתֹּונֶת יוֹסֵף"], "kasha": "מדוע הכתוב מדגיש שיהודה שלח דווקא גדי עזים?", "answer": "לפי רש״י, יהודה רימה את אביו בגדי עזים כשהטביל בדמו את כתונת יוסף, ולכן מידה כנגד מידה — רמוהו גם אותו בגדי עזים.", "kp": ["רמה יהודה את אביו בגדי עזים", "רמוהו גם הוא בגדי עזים"]}]}, {"id": "38:24.1", "ch": 38, "v": 24, "n": 1, "dh": "כמשלש חדשים", "pasuk_html": "וַיְהִ֣י ׀ <mark>כְּמִשְׁלֹ֣שׁ חֳדָשִׁ֗ים</mark> וַיֻּגַּ֨ד לִֽיהוּדָ֤ה לֵֽאמֹר֙ זָֽנְתָה֙ תָּמָ֣ר כַּלָּתֶ֔ךָ וְגַ֛ם הִנֵּ֥ה הָרָ֖ה לִזְנוּנִ֑ים וַיֹּ֣אמֶר יְהוּדָ֔ה הוֹצִיא֖וּהָ וְתִשָּׂרֵֽף׃", "pasuk_en": "וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים וַיֻּגַּד לִיהוּדָה לֵאמֹר זָנְתָה תָּמָר כַּלָּתֶךָ וְגַם הִנֵּה הָרָה לִזְנוּנִים וַיֹּאמֶר יְהוּדָה הוֹצִיאוּהָ וְתִשָּׂרֵף׃", "rashi_he": "כמשלש חדשים. רֻבּוֹ שֶׁל רִאשׁוֹן וְרֻבּוֹ שֶׁל אַחֲרוֹן וְאֶמְצָעִי שָׁלֵם (נדה מ\"נ). וּלְשׁוֹן כְּמִשְׁלֹשׁ חֳדָשִׁים כְּהִשְׁתַּלֵּשׁ הַחֳדָשִׁים, כְּמוֹ וּמִשְׁלֹחַ מָנוֹת (אסתר ט'), מִשְׁלוֹחַ יָדָם (ישעיהו י\"א), וְכֵן תִּרְגֵּם אֻנְקְלוֹס כִּתְלָתוּת יַרְחַיָּא:", "rashi_en": "רש״י מפרש שלא עברו שלושה חודשים מלאים אלא רוב הראשון, האמצעי שלם, ורוב האחרון. הוא גם מסביר שהמילה \"כמשלש\" פירושה השתלשות שלוש פעמים, כמו \"משלוח\" מנות.", "note": "", "points": [{"q": "כַּמָּה זְמַן בַּפֹּועַל עָבַר לְפִי רַשִׁ״י כְּשֶׁנֶּאֱמַר \"כְּמִשְׁלֹשׁ חֳדָשִׁים\"?", "options": ["רוּב הַחֹודֶשׁ הָרִאשׁוֹן, הָאֶמְצָעִי שָׁלֵם, וְרוּב הָאַחֲרוֹן", "שְׁלוֹשָׁה חֳודָשִׁים מְלֵאִים בְּדִיּוּק", "חֳודָשַׁייִם וָחֵצִי בִּלְבַד"], "kasha": "מדוע כתוב \"כמשלש\" ולא \"שלושה חודשים\" — משמע שלא מדובר בשלושה חודשים שלמים.", "answer": "רש״י מפרש שעברו רוב הראשון ורוב האחרון והאמצעי שלם, ולכן נאמר \"כמשלש\" ולא \"שלושה\".", "kp": ["רבו של ראשון ורבו של אחרון ואמצעי שלם"]}, {"q": "מַהִי צוּרַת הַמִּילָּה \"כְּמִשְׁלֹשׁ\" לְפִי רַשׁ״י?", "options": ["לְשׁוֹן הִשְׁתַּלְּשׁוּת שָׁלוֹשׁ פְּעָמִים, כְּמוֹ \"מִשְׁלוֹחַ\" מָנוֹת", "לָשׁוֹן שְׁלִישׁ, כְּלוֹמַר שְׁלִישׁ שָׁנָה", "לְשׁוֹן מְשֻׁולָּשׁ, כְּלוֹמַר דָּבָר בַּעַל שָׁלוֹשׁ פִּינּוֹת"], "kasha": "מהו שורש המילה \"כמשלש\" ומה משקלה?", "answer": "רש״י מסביר שהמילה היא כמו \"משלוח\" מנות ו\"משלוח\" ידם — לשון פעולה חוזרת שלוש פעמים, וכן תירגם אונקלוס \"כתלתות ירחיא\".", "kp": ["כהשתלש החדשים", "כמו ומשלח מנות"]}]}, {"id": "38:24.2", "ch": 38, "v": 24, "n": 2, "dh": "הרה לזנונים", "pasuk_html": "וַיְהִ֣י ׀ כְּמִשְׁלֹ֣שׁ חֳדָשִׁ֗ים וַיֻּגַּ֨ד לִֽיהוּדָ֤ה לֵֽאמֹר֙ זָֽנְתָה֙ תָּמָ֣ר כַּלָּתֶ֔ךָ וְגַ֛ם הִנֵּ֥ה <mark>הָרָ֖ה לִזְנוּנִ֑ים</mark> וַיֹּ֣אמֶר יְהוּדָ֔ה הוֹצִיא֖וּהָ וְתִשָּׂרֵֽף׃", "pasuk_en": "וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים וַיֻּגַּד לִיהוּדָה לֵאמֹר זָנְתָה תָּמָר כַּלָּתֶךָ וְגַם הִנֵּה הָרָה לִזְנוּנִים וַיֹּאמֶר יְהוּדָה הוֹצִיאוּהָ וְתִשָּׂרֵף׃", "rashi_he": "הרה לזנונים. שֵׁם דָּבָר, מְעֻבֶּרֶת כְּמוֹ אִשָּׁה הָרָה, וּכְמוֹ בָּרָה כַּחַמָּה:", "rashi_en": "רש״י מסביר שהמילה \"הרה\" כאן היא שם תואר במשמעות \"מעוברת\", כמו \"אשה הרה\", ולא פועל. הוא מביא דוגמה נוספת מהמילה \"ברה\" שגם היא שם תואר.", "note": "", "points": [{"q": "מַהוּ הַפֵּירוּשׁ הַדִּקְדּוּקִי שֶׁל \"הָרָה\" לְפִי רַשׁ״י?", "options": ["שֵׁם תֹּואַר — מְעֻובֶּרֶת, כְּמוֹ \"אִשָּׁה הָרָה\"", "פּוֹעַל בִּלְשׁוֹן עָבָר — נִכְנְסָה לְהֵרָיוֹן", "שֵׁם עֶצֶם — הֵרָיוֹן שֶׁנִּגְרַם מִזְּנוּת"], "kasha": "מדוע כתוב \"הרה לזנונים\" ולא \"נתעברה לזנונים\" — מה טיב המילה \"הרה\" כאן?", "answer": "\"הרה\" הוא שם תואר (שם דבר) במשמעות מעוברת, כמו \"אשה הרה\" וכמו \"ברה כחמה\".", "kp": ["שם דבר מעברת כמו אשה הרה"]}]}, {"id": "38:24.3", "ch": 38, "v": 24, "n": 3, "dh": "ותשרף", "pasuk_html": "וַיְהִ֣י ׀ כְּמִשְׁלֹ֣שׁ חֳדָשִׁ֗ים וַיֻּגַּ֨ד לִֽיהוּדָ֤ה לֵֽאמֹר֙ זָֽנְתָה֙ תָּמָ֣ר כַּלָּתֶ֔ךָ וְגַ֛ם הִנֵּ֥ה הָרָ֖ה לִזְנוּנִ֑ים וַיֹּ֣אמֶר יְהוּדָ֔ה הוֹצִיא֖וּהָ <mark>וְתִשָּׂרֵֽף׃</mark>", "pasuk_en": "וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים וַיֻּגַּד לִיהוּדָה לֵאמֹר זָנְתָה תָּמָר כַּלָּתֶךָ וְגַם הִנֵּה הָרָה לִזְנוּנִים וַיֹּאמֶר יְהוּדָה הוֹצִיאוּהָ וְתִשָּׂרֵף׃", "rashi_he": "ותשרף. אָמַר אֶפְרַיִם מִקְשָׁאָה מִשּׁוּם רַבִּי מֵאִיר, בִּתּוֹ שֶׁל שֵׁם הָיְתָה, שֶׁהוּא כֹהֵן, לְפִיכָךְ דָּנוּהָ בִשְׂרֵפָה:", "rashi_en": "רש״י מסביר מדוע דנו את תמר בשריפה דווקא: לפי ר׳ מאיר, תמר היתה בתו (צאצאית) של שם, שהיה כהן, ודין בת כהן שזינתה — בשריפה.", "note": "", "points": [{"q": "מַדּוּעַ נִידּוֹנָה תָּמָר בִּשְׂרֵיפָה דַּווְקָא, לְפִי רַשִׁ״י?", "options": ["כִּי הָיְתָה בִּתּוֹ שֶׁל שֵׁם שֶׁהָיָה כֹּהֵן", "כִּי עֹונֶשׁ הַזְּנוּת לְכָל אִשָּׁה נְשׂוּאָה הָיָה שְׂרֵיפָה", "כִּי יְהוּדָה הָיָה מֶלֶךְ וְדִין הַמּוֹרֶדֶת בַּמַּלְכוּת בִּשְׂרֵיפָה"], "kasha": "מדוע נאמר \"ותשרף\" — הרי שריפה אינה העונש הרגיל על זנות?", "answer": "תמר היתה בתו של שם שהיה כהן, ודין בת כהן שזינתה בשריפה.", "kp": ["בתו של שם היתה שהוא כהן", "לפיכך דנוה בשרפה"]}]}, {"id": "38:25.1", "ch": 38, "v": 25, "n": 1, "dh": "הוא מוצאת", "pasuk_html": "<mark>הִ֣וא מוּצֵ֗את</mark> וְהִ֨יא שָׁלְחָ֤ה אֶל־חָמִ֙יהָ֙ לֵאמֹ֔ר לְאִישׁ֙ אֲשֶׁר־אֵ֣לֶּה לּ֔וֹ אָנֹכִ֖י הָרָ֑ה וַתֹּ֙אמֶר֙ הַכֶּר־נָ֔א לְמִ֞י הַחֹתֶ֧מֶת וְהַפְּתִילִ֛ים וְהַמַּטֶּ֖ה הָאֵֽלֶּה׃", "pasuk_en": "הִוא מוּצֵאת וְהִיא שָׁלְחָה אֶל־חָמִיהָ לֵאמֹר לְאִישׁ אֲשֶׁר־אֵלֶּה לּוֹ אָנֹכִי הָרָה וַתֹּאמֶר הַכֶּר־נָא לְמִי הַחֹתֶמֶת וְהַפְּתִילִים וְהַמַּטֶּה הָאֵלֶּה׃", "rashi_he": "הוא מוצאת. לְהִשָּׂרֵף:", "rashi_en": "רש״י מפרש ש\"היא מוצאת\" פירושו שהוציאוה להישרף, כלומר כבר היו בדרך להוציא את גזר הדין לפועל.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"הִיא מוֹצֵאת\" לְפִי רַשׁ״י?", "options": ["מוֹצִיאִים אוֹתָהּ לְהִישָּׂרֵף", "יוֹצֵאת מִבֵּית חָמִיהָ בְּבוּשָׁה", "מוֹצִיאָה אֶת הַחֲפָצִים שֶׁקִּיבְּלָה מִיהוּדָה"], "kasha": "\"מוצאת\" סתמי — להיכן או למה מוציאים אותה?", "answer": "\"מוצאת\" — להישרף, כלומר כבר הוציאוה לביצוע גזר הדין.", "kp": ["להשרף"]}]}, {"id": "38:25.2", "ch": 38, "v": 25, "n": 2, "dh": "והיא שלחה אל חמיה", "pasuk_html": "הִ֣וא מוּצֵ֗את <mark>וְהִ֨יא שָׁלְחָ֤ה אֶל־חָמִ֙יהָ֙</mark> לֵאמֹ֔ר לְאִישׁ֙ אֲשֶׁר־אֵ֣לֶּה לּ֔וֹ אָנֹכִ֖י הָרָ֑ה וַתֹּ֙אמֶר֙ הַכֶּר־נָ֔א לְמִ֞י הַחֹתֶ֧מֶת וְהַפְּתִילִ֛ים וְהַמַּטֶּ֖ה הָאֵֽלֶּה׃", "pasuk_en": "הִוא מוּצֵאת וְהִיא שָׁלְחָה אֶל־חָמִיהָ לֵאמֹר לְאִישׁ אֲשֶׁר־אֵלֶּה לּוֹ אָנֹכִי הָרָה וַתֹּאמֶר הַכֶּר־נָא לְמִי הַחֹתֶמֶת וְהַפְּתִילִים וְהַמַּטֶּה הָאֵלֶּה׃", "rashi_he": "והיא שלחה אל חמיה. לֹא רָצְתָה לְהַלְבִּין פָּנָיו וְלוֹמַר מִמְּךָ אֲנִי מְעֻבֶּרֶת, אֶלָּא לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ, אָמְרָה אִם יוֹדֶה יוֹדֶה מֵעַצְמוֹ, וְאִם לָאו, יִשְׂרְפוּנִי, וְאַל אַלְבִּין פָּנָיו. מִכָּאן אָמְרוּ נוֹחַ לוֹ לָאָדָם שֶׁיַּפִּילוּהוּ לְכִבְשַׁן הָאֵשׁ וְאַל יַלְבִּין פְּנֵי חֲבֵרוֹ בָּרַבִּים:", "rashi_en": "רש״י מסביר שתמר לא אמרה במפורש שיהודה הוא האב, אלא שלחה לו את החפצים ואמרה \"לאיש אשר אלה לו\" — כדי שלא להלבין את פניו. מכאן למדו חז״ל שנוח לו לאדם שייפול לכבשן האש ואל ילבין פני חברו ברבים.", "note": "", "points": [{"q": "מַדּוּעַ לֹא אָמְרָה תָּמָר לִיהוּדָה בִּמְפֹורָשׁ שֶׁהוּא הָאָב?", "options": ["כְּדֵי שֶׁלֹּא לְהַלְבִּין אֶת פָּנָיו בָּרַבִּים", "כִּי חָשְׁשָׁה שֶׁיְּהוּדָה יַכְחִישׁ וְלֹא יַאֲמִינוּ לָהּ", "כִּי רָצְתָה שֶׁבֵּית הַדִּין יְגַלֶּה זֹאת בְּעַצְמוֹ"], "kasha": "מדוע תמר לא גילתה מייד שיהודה הוא האב, והרי חייה היו בסכנה?", "answer": "תמר לא רצתה להלבין את פני יהודה, ואמרה: אם יודה — יודה מעצמו, ואם לאו — ישרפוני ולא אלבין פניו.", "kp": ["לא רצתה להלבין פניו", "אם יודה יודה מעצמו", "ואל אלבין פניו"]}, {"q": "אֵיזֶה כְּלָל מוּסָרִי לָמְדוּ חַז״ל מִמַּעֲשֵׂה תָמָר?", "options": ["נוֹחַ לוֹ לָאָדָם שֶׁייִּפּוֹל לְכִבְשַׁן הָאֵשׁ וְאַל יַלְבִּין פְּנֵי חֲבֵרוֹ", "חַייָּב אָדָם לִמְסֹור נַפְשׁוֹ כְּדֵי לְקַיֵּים מִצְווַת יִיבּוּם", "אָסוּר לְאָדָם לְהָעִיד עַל עַצְמוֹ בִּשְׁעַת סַכָּנָה"], "kasha": "מה הלקח הכללי שחז״ל הסיקו מהתנהגותה של תמר?", "answer": "מכאן אמרו חז״ל: נוח לו לאדם שיפילוהו לכבשן האש ואל ילבין פני חברו ברבים.", "kp": ["נוח לו לאדם שיפילוהו לכבשן האש", "ואל ילבין פני חברו ברבים"]}]}, {"id": "38:25.3", "ch": 38, "v": 25, "n": 3, "dh": "הכר נא", "pasuk_html": "הִ֣וא מוּצֵ֗את וְהִ֨יא שָׁלְחָ֤ה אֶל־חָמִ֙יהָ֙ לֵאמֹ֔ר לְאִישׁ֙ אֲשֶׁר־אֵ֣לֶּה לּ֔וֹ אָנֹכִ֖י הָרָ֑ה וַתֹּ֙אמֶר֙ <mark>הַכֶּר־נָ֔א</mark> לְמִ֞י הַחֹתֶ֧מֶת וְהַפְּתִילִ֛ים וְהַמַּטֶּ֖ה הָאֵֽלֶּה׃", "pasuk_en": "הִוא מוּצֵאת וְהִיא שָׁלְחָה אֶל־חָמִיהָ לֵאמֹר לְאִישׁ אֲשֶׁר־אֵלֶּה לּוֹ אָנֹכִי הָרָה וַתֹּאמֶר הַכֶּר־נָא לְמִי הַחֹתֶמֶת וְהַפְּתִילִים וְהַמַּטֶּה הָאֵלֶּה׃", "rashi_he": "הכר נא. אֵין נָא אֶלָּא לְשׁוֹן בַּקָּשָׁה – הַכֵּר נָא בוֹרַאֲךָ, וְאַל תְּאַבֵּד שָׁלֹשׁ נְפָשׁוֹת:", "rashi_en": "רש״י מסביר שהמילה \"נא\" היא לשון בקשה. תמר ביקשה מיהודה שיכיר בבוראו ולא ישמיד שלוש נפשות.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַה מַשְׁמָעוּת הַמִּילָּה \"נָא\" בְּדִבְרֵי תָּמָר?", "options": ["לְשׁוֹן בַּקָּשָׁה — הִיא מִתְחַנֶּנֶת שֶׁיַּכִּיר בְּבוֹרְאוֹ", "לָשׁוֹן צִיוּוּי — הִיא דּוֹרֶשֶׁת מִמֶּנּוּ לְהוֹדוֹת", "לְשׁוֹן מִייָּדִיּוּת — הִיא רוֹצָה שֶׁיַּכִּיר עַכְשָׁיו"], "kasha": "מדוע תמר משתמשת בלשון \"הכר נא\" ולא אומרת בפשטות למי החפצים שייכים?", "answer": "\"נא\" היא לשון בקשה. תמר מתחננת ליהודה שיכיר בבוראו ולא יאבד שלוש נפשות.", "kp": ["אין נא אלא לשון בקשה", "הכר נא בוראך", "ואל תאבד שלש נפשות"]}]}, {"id": "38:26.1", "ch": 38, "v": 26, "n": 1, "dh": "צדקה", "pasuk_html": "וַיַּכֵּ֣ר יְהוּדָ֗ה וַיֹּ֙אמֶר֙ <mark>צָֽדְקָ֣ה</mark> מִמֶּ֔נִּי כִּֽי־עַל־כֵּ֥ן לֹא־נְתַתִּ֖יהָ לְשֵׁלָ֣ה בְנִ֑י וְלֹֽא־יָסַ֥ף ע֖וֹד לְדַעְתָּֽה׃", "pasuk_en": "וַיַּכֵּר יְהוּדָה וַיֹּאמֶר צָדְקָה מִמֶּנִּי כִּי־עַל־כֵּן לֹא־נְתַתִּיהָ לְשֵׁלָה בְנִי וְלֹא־יָסַף עוֹד לְדַעְתָּה׃", "rashi_he": "צדקה. בִּדְבָרֶיהָ:", "rashi_en": "רש״י מסביר ש\"צדקה\" מתייחס לדבריה של תמר — היא צודקת במה שאמרה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, בַּמָּה בְּדִיּוּק תָּמָר צָדְקָה?", "options": ["בִּדְבָרֶיהָ — בְּמַה שֶׁאָמְרָה", "בְּמַעֲשֶׂיהָ — בְּכָךְ שֶׁהִתְחַפְּשָׂה", "בְּדִינָה — לְפִי חֻוקֵּי הַיִּיבּוּם"], "kasha": "האם \"צדקה\" מתייחס למעשיה של תמר או לדבריה?", "answer": "רש״י מפרש ש\"צדקה\" מוסב על דבריה — היא צודקת במה שטענה.", "kp": ["בדבריה"]}]}, {"id": "38:26.2", "ch": 38, "v": 26, "n": 2, "dh": "ממני", "pasuk_html": "וַיַּכֵּ֣ר יְהוּדָ֗ה וַיֹּ֙אמֶר֙ צָֽדְקָ֣ה <mark>מִמֶּ֔נִּי</mark> כִּֽי־עַל־כֵּ֥ן לֹא־נְתַתִּ֖יהָ לְשֵׁלָ֣ה בְנִ֑י וְלֹֽא־יָסַ֥ף ע֖וֹד לְדַעְתָּֽה׃", "pasuk_en": "וַיַּכֵּר יְהוּדָה וַיֹּאמֶר צָדְקָה מִמֶּנִּי כִּי־עַל־כֵּן לֹא־נְתַתִּיהָ לְשֵׁלָה בְנִי וְלֹא־יָסַף עוֹד לְדַעְתָּה׃", "rashi_he": "ממני. הִיא מְעֻבֶּרֶת. וְרַבּוֹתֵינוּ ז\"ל דָּרְשׁוּ שֶׁיָּצְאָה בַת קוֹל וְאָמְרָה מִמֶּנִּי וּמֵאִתִּי יָצְאוּ הַדְּבָרִים, לְפִי שֶׁהָיְתָה צְנוּעָה בְּבֵית חָמִיהָ, גָּזַרְתִּי שֶׁיֵּצְאוּ מִמֶּנָּה מְלָכִים, וּמִשֵּׁבֶט יְהוּדָה גָּזַרְתִּי לְהַעֲמִיד מְלָכִים בְּיִשְׂרָאֵל:", "rashi_en": "רש״י מביא שני פירושים ל\"ממני\": בפשט — ממני היא מעוברת. ובמדרש — בת קול אמרה \"ממני יצאו הדברים\", מפני שתמר היתה צנועה בבית חמיה, גזר הקב״ה שיצאו ממנה מלכים.", "note": "", "points": [{"q": "מַה הַפֵּירוּשׁ הַפָּשׁוּט שֶׁל \"מִמֶּנִּי\" לְפִי רַשִׁ״י?", "options": ["מִמֶּנִּי הִיא מְעֻובֶּרֶת — יְהוּדָה מוֹדֶה שֶׁהוּא הָאָב", "מִמֶּנִּי יָצְאוּ הַדְּבָרִים — הַקָּב״ה גָּזַר כָּךְ", "מִמֶּנִּי לָמְדָה לַעֲשׂוֹת כָּךְ — יְהוּדָה אָשֵׁם"], "kasha": "האם \"ממני\" מתייחס ליהודה עצמו או שיש לו משמעות אחרת?", "answer": "בפשט, יהודה מודה שהיא מעוברת ממנו. במדרש, בת קול אמרה שממנה (מאת הקב״ה) יצאו הדברים.", "kp": ["היא מעברת", "יצאה בת קול ואמרה ממני ומאתי יצאו הדברים"]}, {"q": "לְפִי הַמִּדְרָשׁ שֶׁרַשׁ״י מֵבִיא, מַדּוּעַ זָכְתָה תָּמָר שֶׁיֵּצְאוּ מִמֶּנָּה מְלָכִים?", "options": ["מִפְּנֵי שֶׁהָיְתָה צְנוּעָה בְּבֵית חָמִיהָ", "מִפְּנֵי שֶׁסֵירְבָה לְבַייֵּשׁ אֶת יְהוּדָה בָּרַבִּים", "מִפְּנֵי שֶׁהִמְתִּינָה בְּסַבְלָנוּת לְשֵׁלָה"], "kasha": "מה הסיבה שהקב״ה גזר שמלכים יצאו דווקא מתמר?", "answer": "לפי שהיתה צנועה בבית חמיה, גזר הקב״ה שיצאו ממנה מלכים.", "kp": ["לפי שהיתה צנועה בבית חמיה", "גזרתי שיצאו ממנה מלכים"]}]}, {"id": "38:26.3", "ch": 38, "v": 26, "n": 3, "dh": "כי על כן לא נתתיה", "pasuk_html": "וַיַּכֵּ֣ר יְהוּדָ֗ה וַיֹּ֙אמֶר֙ צָֽדְקָ֣ה מִמֶּ֔נִּי <mark>כִּֽי־עַל־כֵּ֥ן לֹא־נְתַתִּ֖יהָ</mark> לְשֵׁלָ֣ה בְנִ֑י וְלֹֽא־יָסַ֥ף ע֖וֹד לְדַעְתָּֽה׃", "pasuk_en": "וַיַּכֵּר יְהוּדָה וַיֹּאמֶר צָדְקָה מִמֶּנִּי כִּי־עַל־כֵּן לֹא־נְתַתִּיהָ לְשֵׁלָה בְנִי וְלֹא־יָסַף עוֹד לְדַעְתָּה׃", "rashi_he": "כי על כן לא נתתיה. כִּי בְּדִין עָשְׂתָה, עַל אֲשֶׁר לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי:", "rashi_en": "רש״י מסביר שתמר עשתה כדין, מפני שיהודה לא נתן אותה לשלה בנו כפי שהבטיח.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ מַעֲשֵׂה תָּמָר הָיָה כַּדִּין?", "options": ["כִּי יְהוּדָה לֹא נָתַן אוֹתָהּ לְשֵׁלָה בְּנוֹ", "כִּי הִיא רָצְתָה לְקַייֵּם מִצְווֹת יִיבּוּם בְּדַווְקָא", "כִּי יְהוּדָה עַצְמוֹ הִסְכִּים לְכָךְ מִלְּכַתְּחִילָּה"], "kasha": "מה הצדקה שרש״י מוצא למעשה תמר?", "answer": "תמר עשתה כדין כי יהודה לא קיים את הבטחתו לתת אותה לשלה בנו.", "kp": ["כי בדין עשתה", "על אשר לא נתתיה לשלה בני"]}]}, {"id": "38:26.4", "ch": 38, "v": 26, "n": 4, "dh": "ולא יסף עוד", "pasuk_html": "וַיַּכֵּ֣ר יְהוּדָ֗ה וַיֹּ֙אמֶר֙ צָֽדְקָ֣ה מִמֶּ֔נִּי כִּֽי־עַל־כֵּ֥ן לֹא־נְתַתִּ֖יהָ לְשֵׁלָ֣ה בְנִ֑י <mark>וְלֹֽא־יָסַ֥ף ע֖וֹד</mark> לְדַעְתָּֽה׃", "pasuk_en": "וַיַּכֵּר יְהוּדָה וַיֹּאמֶר צָדְקָה מִמֶּנִּי כִּי־עַל־כֵּן לֹא־נְתַתִּיהָ לְשֵׁלָה בְנִי וְלֹא־יָסַף עוֹד לְדַעְתָּה׃", "rashi_he": "ולא יסף עוד. יֵשׁ אוֹמְרִים לֹא הוֹסִיף, וְיֵשׁ אוֹמְרִים לֹא פָסַק. וַחֲבֵרוֹ גַּבֵּי אֶלְדָּד וּמֵידָד, וְלֹא יָסָפוּ, וּמְתַרְגְּמִינָן וְלָא פְּסָקוּ:", "rashi_en": "רש״י מביא שתי דעות בפירוש 'ולא יסף עוד': יש אומרים שלא הוסיף לדעתה, ויש אומרים שלא פסק מלדעתה. הראיה מאלדד ומידד, שם 'ולא יספו' מתורגם 'ולא פסקו'.", "note": "", "points": [{"q": "מַהֵן שְׁתֵּי הַדֵּעוֹת שֶׁרַשׁ״י מֵבִיא בְּפֵירוּשׁ 'וְלֹא יָסַף עוֹד'?", "options": ["יֵשׁ אוֹמְרִים שֶׁלֹּא הוֹסִיף, וְיֵשׁ אוֹמְרִים שֶׁלֹּא פָּסַק", "יֵשׁ אוֹמְרִים שֶׁהִתְחָרֵט, וְיֵשׁ אוֹמְרִים שֶׁלֹּא הִתְחָרֵט", "יֵשׁ אוֹמְרִים שֶׁגֵּירְשָׁהּ, וְיֵשׁ אוֹמְרִים שֶׁנְּשָׂאָהּ"], "kasha": "הביטוי 'ולא יסף' סובל שני פירושים הפוכים — הפסקה או המשך — וצריך להכריע.", "answer": "רש״י מביא שתי דעות: 'לא הוסיף' — הפסיק לדעתה, או 'לא פסק' — המשיך לדעתה. הראיה מ'ולא יספו' גבי אלדד ומידד שמתורגם 'ולא פסקו'.", "kp": ["לא הוסיף", "לא פסק", "ולא יספו ומתרגמינן ולא פסקו"]}]}, {"id": "38:27.1", "ch": 38, "v": 27, "n": 1, "dh": "בעת לדתה", "pasuk_html": "וַיְהִ֖י <mark>בְּעֵ֣ת לִדְתָּ֑הּ</mark> וְהִנֵּ֥ה תְאוֹמִ֖ים בְּבִטְנָֽהּ׃", "pasuk_en": "וַיְהִי בְּעֵת לִדְתָּהּ וְהִנֵּה תְאוֹמִים בְּבִטְנָהּ׃", "rashi_he": "בעת לדתה. וּבְרִבְקָה הוּא אוֹמֵר וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת? לְהַלָּן לִמְלֵאִים וְכָאן לַחֲסֵרִים:", "rashi_en": "רש״י שואל מדוע כאן כתוב 'בעת לדתה' ואצל רבקה כתוב 'וימלאו ימיה ללדת'. התשובה: רבקה ילדה למלאים (תשעה חודשים), ותמר ילדה לחסרים (לפני הזמן).", "note": "", "points": [{"q": "מַדּוּעַ לְפִי רַשִׁ״י כָּתוּב 'בְּעֵת לִדְתָּהּ' וְלֹא 'וַיִּמְלְאוּ יָמֶיהָ' כְּמוֹ בְּרִבְקָה?", "options": ["כִּי תָּמָר יָלְדָה לַחֲסֵרִים וְלֹא לְמַלֹּאוֹ תִּשְׁעַת הַחֳודָשִׁים", "כִּי תָּמָר יָלְדָה בְּקַלּוּת וְלֹא סָבְלָה כְּמוֹ רִבְקָה", "כִּי הַלֵּידָה הָייְתָה פִּתְאוֹמִית וְלֹא צְפוּיָה מֵרֹאשׁ"], "kasha": "מדוע השתנה הלשון מ'וימלאו ימיה ללדת' ברבקה ל'בעת לדתה' בתמר?", "answer": "ברבקה כתוב 'וימלאו ימיה' כי ילדה למלאים, ואילו תמר ילדה לחסרים, לכן כתוב רק 'בעת לדתה'.", "kp": ["להלן למלאים וכאן לחסרים"]}]}, {"id": "38:27.2", "ch": 38, "v": 27, "n": 2, "dh": "והנה תאומים", "pasuk_html": "וַיְהִ֖י בְּעֵ֣ת לִדְתָּ֑הּ <mark>וְהִנֵּ֥ה תְאוֹמִ֖ים</mark> בְּבִטְנָֽהּ׃", "pasuk_en": "וַיְהִי בְּעֵת לִדְתָּהּ וְהִנֵּה תְאוֹמִים בְּבִטְנָהּ׃", "rashi_he": "והנה תאומים. מָלֵא, וּלְהַלָּן תּוֹמִם חָסֵר, לְפִי שֶׁהָאֶחָד רָשָׁע, אֲבָל אֵלּוּ שְׁנֵיהֶם צַדִּיקִים:", "rashi_en": "רש״י מסביר שכאן 'תאומים' כתוב מלא (עם א׳), ואילו אצל רבקה כתוב 'תומם' חסר. הטעם: אצל רבקה אחד היה רשע, ואילו שני בני תמר היו צדיקים.", "note": "", "points": [{"q": "מַדּוּעַ לְפִי רַשִׁ״י 'תְּאוֹמִים' כָּתוּב כָּאן מָלֵא וְאֵצֶל רִבְקָה חָסֵר?", "options": ["כִּי כָּאן שְׁנֵיהֶם צַדִּיקִים וְשָׁם אֶחָד הָיָה רָשָׁע", "כִּי כָּאן הַלֵּידָה הָייְתָה קַלָּה יוֹתֵר מֵאֵצֶל רִבְקָה", "כִּי כָּאן הָיוּ שְׁנֵי זְכָרִים וְשָׁם זָכָר וּנְקֵבָה"], "kasha": "מדוע כאן כתוב 'תאומים' מלא ואצל רבקה 'תומם' חסר?", "answer": "'תאומים' מלא כי שני בני תמר צדיקים, ואילו אצל רבקה 'תומם' חסר כי עשו היה רשע.", "kp": ["מלא", "תומם חסר", "שניהם צדיקים"]}]}, {"id": "38:28.1", "ch": 38, "v": 28, "n": 1, "dh": "ויתן יד", "pasuk_html": "וַיְהִ֥י בְלִדְתָּ֖הּ <mark>וַיִּתֶּן־יָ֑ד</mark> וַתִּקַּ֣ח הַמְיַלֶּ֗דֶת וַתִּקְשֹׁ֨ר עַל־יָד֤וֹ שָׁנִי֙ לֵאמֹ֔ר זֶ֖ה יָצָ֥א רִאשֹׁנָֽה׃", "pasuk_en": "וַיְהִי בְלִדְתָּהּ וַיִּתֶּן־יָד וַתִּקַּח הַמְיַלֶּדֶת וַתִּקְשֹׁר עַל־יָדוֹ שָׁנִי לֵאמֹר זֶה יָצָא רִאשֹׁנָה׃", "rashi_he": "ויתן יד. הוֹצִיא הָאֶחָד יָדוֹ לַחוּץ, וּלְאַחַר שֶׁקָּשְׁרָה עַל יָדוֹ הַשָּׁנִי הֶחֱזִירָהּ:", "rashi_en": "רש״י מסביר שאחד התינוקות הוציא את ידו החוצה, המיילדת קשרה עליה חוט שני, ואז הוא החזיר את ידו פנימה.", "note": "", "points": [{"q": "מַה קָרָה לְפִי רַשׁ״י אַחֲרֵי שֶׁהַמְּיַילֶּדֶת קָשְׁרָה אֶת הַשֵּׁנִי עַל יָדוֹ?", "options": ["הַתִּינוֹק הֶחְזִיר אֶת יָדוֹ פְּנִימָה", "הַתִּינוֹק יָצָא מִיָּד לְאַחַר הַקְּשִׁירָה", "הַתִּינוֹק הוֹצִיא גַּם אֶת יָדוֹ הַשְּׁנִיָּיה"], "kasha": "מה פשר הוצאת היד וקשירת השני אם התינוק לא יצא ראשון?", "answer": "התינוק הוציא ידו לחוץ, המיילדת קשרה שני על ידו, ואז הוא החזיר את ידו פנימה — ולכן אחיו יצא לפניו.", "kp": ["ולאחר שקשרה על ידו השני החזירה"]}]}, {"id": "38:29.1", "ch": 38, "v": 29, "n": 1, "dh": "פרצת", "pasuk_html": "וַיְהִ֣י ׀ כְּמֵשִׁ֣יב יָד֗וֹ וְהִנֵּה֙ יָצָ֣א אָחִ֔יו וַתֹּ֕אמֶר מַה־<mark>פָּרַ֖צְתָּ</mark> עָלֶ֣יךָ פָּ֑רֶץ וַיִּקְרָ֥א שְׁמ֖וֹ פָּֽרֶץ׃", "pasuk_en": "וַיְהִי כְּמֵשִׁיב יָדוֹ וְהִנֵּה יָצָא אָחִיו וַתֹּאמֶר מַה־פָּרַצְתָּ עָלֶיךָ פָּרֶץ וַיִּקְרָא שְׁמוֹ פָּרֶץ׃", "rashi_he": "פרצת. חָזַקְתָּ עָלֶיךָ חֹזֶק:", "rashi_en": "רש״י מפרש שהמילה 'פרצת' פירושה התחזקת, כלומר: בכוח רב דחקת את דרכך החוצה.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה 'פָּרַצְתָּ'?", "options": ["הִתְחַזַּקְתָּ — דָּחַקְתָּ בְּכֹוחַ", "שָׁבַרְתָּ מְחִיצָה שֶׁהִפְרִידָה בֵּינֵיכֶם", "יָצָאתָ רִאשׁוֹן לִפְנֵי אַחֶיךָ"], "kasha": "מה משמעות הביטוי 'מה פרצת עליך' שאמרה המיילדת?", "answer": "רש״י מפרש ש'פרצת' פירושו חזקת, כלומר דחקת בכוח רב.", "kp": ["חזקת עליך חזק"]}]}, {"id": "38:30.1", "ch": 38, "v": 30, "n": 1, "dh": "אשר על ידו השני", "pasuk_html": "וְאַחַר֙ יָצָ֣א אָחִ֔יו <mark>אֲשֶׁ֥ר עַל־יָד֖וֹ הַשָּׁנִ֑י</mark> וַיִּקְרָ֥א שְׁמ֖וֹ זָֽרַח׃ (ס)", "pasuk_en": "וְאַחַר יָצָא אָחִיו אֲשֶׁר עַל־יָדוֹ הַשָּׁנִי וַיִּקְרָא שְׁמוֹ זָרַח׃", "rashi_he": "אשר על ידו השני. אַרְבַּע יָדוֹת כְּתוּבוֹת כָּאן כְּנֶגֶד אַרְבָּעָה חֲרָמִים שֶׁמָּעַל עָכָן שֶׁיָּצָא מִמֶּנּוּ. וְיֵשׁ אוֹמְרִים כְּנֶגֶד אַרְבָּעָה דְבָרִים שֶׁלָּקַח, אַדֶּרֶת שִׁנְעָר וּשְׁתֵּי חֲתִיכוֹת כֶּסֶף שֶׁל מָאתַיִם שְׁקָלִים וּלְשׁוֹן זָהָב, בְּרֵאשִׁית רַבָּה:", "rashi_en": "רש״י שואל מדוע המילה 'יד' מופיעה ארבע פעמים בפרשה. לפי דעה אחת — כנגד ארבעה חרמים שמעל עכן מצאצאי זרח. לפי דעה אחרת — כנגד ארבעה דברים שלקח עכן ביריחו.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ נִכְתְּבָה הַמִּילָּה 'יָד' אַרְבַּע פְּעָמִים בַּפָּרָשָׁה?", "options": ["כְּנֶגֶד אַרְבָּעָה חֲרָמִים שֶׁמָּעַל עָכָן צֶאֱצָא זֶרַח", "כְּנֶגֶד אַרְבַּעַת הַבָּנִים שֶׁעֲתִידִים לָצֵאת מִזֶּרַח", "כְּנֶגֶד אַרְבַּע אֶצְבָּעוֹת שֶׁקָּשְׁרוּ עֲלֵיהֶן אֶת הַשָּׁנִי"], "kasha": "מדוע חוזרת המילה 'יד' ארבע פעמים בפסוקים אלו, יותר מהנדרש לסיפור?", "answer": "רש״י מסביר שארבע הידות רומזות לעכן שיצא מזרח — כנגד ארבעה חרמים שמעל, או כנגד ארבעה דברים שלקח.", "kp": ["ארבע ידות כתובות כאן", "כנגד ארבעה חרמים שמעל עכן"]}]}, {"id": "38:30.2", "ch": 38, "v": 30, "n": 2, "dh": "ויקרא שמו זרח", "pasuk_html": "וְאַחַר֙ יָצָ֣א אָחִ֔יו אֲשֶׁ֥ר עַל־יָד֖וֹ הַשָּׁנִ֑י <mark>וַיִּקְרָ֥א שְׁמ֖וֹ זָֽרַח׃</mark> (ס)", "pasuk_en": "וְאַחַר יָצָא אָחִיו אֲשֶׁר עַל־יָדוֹ הַשָּׁנִי וַיִּקְרָא שְׁמוֹ זָרַח׃", "rashi_he": "ויקרא שמו זרח. עַל שֵׁם זְרִיחַת מַרְאִית הַשָּׁנִי:", "rashi_en": "רש״י מסביר שהשם 'זרח' ניתן לו בגלל הצבע הזורח של חוט השני שנקשר על ידו.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ נִקְרָא שְׁמוֹ 'זֶרַח'?", "options": ["עַל שֵׁם זְרִיחַת מַרְאֵה חוּט הַשָּׁנִי שֶׁעַל יָדוֹ", "עַל שֵׁם שֶׁזָּרַח וְיָצָא רִאשׁוֹן מֵהָרֶחֶם", "עַל שֵׁם שֶׁנּוֹלַד עִם הַנֵּץ הַחַמָּה"], "kasha": "מה הקשר בין השם 'זרח' לסיפור הלידה?", "answer": "רש״י מפרש שנקרא זרח על שם זריחת מראית השני, כלומר הצבע הבולט של חוט השני.", "kp": ["זריחת מראית השני"]}]}, {"id": "39:1.1", "ch": 39, "v": 1, "n": 1, "dh": "ויוסף הורד", "pasuk_html": "<mark>וְיוֹסֵ֖ף הוּרַ֣ד</mark> מִצְרָ֑יְמָה וַיִּקְנֵ֡הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַטַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִיַּד֙ הַיִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖הוּ שָֽׁמָּה׃", "pasuk_en": "וְיוֹסֵף הוּרַד מִצְרָיְמָה וַיִּקְנֵהוּ פּוֹטִיפַר סְרִיס פַּרְעֹה שַׂר הַטַּבָּחִים אִישׁ מִצְרִי מִיַּד הַיִּשְׁמְעֵאלִים אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה׃", "rashi_he": "ויוסף הורד. חוֹזֵר לְעִנְיָן רִאשׁוֹן, אֶלָּא שֶׁהִפְסִיק בּוֹ כְּדֵי לִסְמֹךְ יְרִידָתוֹ שֶׁל יְהוּדָה לִמְכִירָתוֹ שֶׁל יוֹסֵף לוֹמַר שֶׁבִּשְׁבִילוֹ הוֹרִידוּהוּ מִגְּדֻלָּתוֹ, וְעוֹד כְּדֵי לִסְמֹךְ מַעֲשֵׂה אִשְׁתּוֹ שֶׁל פּוֹטִיפַר לְמַעֲשֵׂה תָמָר לוֹמַר לְךָ, מַה זּוֹ לְשֵׁם שָׁמַיִם אַף זוֹ לְשֵׁם שָׁמַיִם, שֶׁרָאֲתָה בְאִצְטְרוֹלוֹגִין שֶׁלָּהּ שֶׁעֲתִידָה לְהַעֲמִיד בָּנִים מִמֶּנּוּ, וְאֵינָהּ יוֹדַעַת אִם מִמֶּנָּה אִם מִבִּתָּהּ:", "rashi_en": "רש״י מסביר שהתורה חזרה לסיפור יוסף אחרי שהפסיקה בסיפור יהודה ותמר. ההפסקה באה לסמוך ירידת יהודה למכירת יוסף — שבגללה הורידוהו מגדולתו, וגם לסמוך מעשה אשת פוטיפר למעשה תמר — שכשם שתמר פעלה לשם שמים, כך גם אשת פוטיפר, שראתה באצטרולוגין שעתידה להעמיד בנים ממנו.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ הִפְסִיקָה הַתּוֹרָה בְּסִיפּוּר יְהוּדָה בֵּין מְכִירַת יוֹסֵף לִירִידָתוֹ לְמִצְרָיִם?", "options": ["לִסְמוֹךְ יְרִידַת יְהוּדָה לִמְכִירַת יוֹסֵף וּמַעֲשֵׂה תָּמָר לְמַעֲשֵׂה אֵשֶׁת פּוֹטִיפַר", "לְסַפֵּר אֶת תּוֹלְדוֹת שֵׁבֶט יְהוּדָה לִפְנֵי שֶׁמַּמְשִׁיכִים לְסִיפּוּר יוֹסֵף", "לְהַרְאוֹת שֶׁיְּהוּדָה עָזַב אֶת אֶחָיו כְּדֵי לְחַפֵּשׂ אֶת יוֹסֵף"], "kasha": "מדוע התורה קוטעת את סיפור יוסף ומכניסה באמצע את פרשת יהודה ותמר?", "answer": "רש״י מסביר שההפסקה באה לסמוך ירידת יהודה למכירת יוסף — שבגללו הורידוהו מגדולתו, ולסמוך מעשה אשת פוטיפר למעשה תמר — ששתיהן פעלו לשם שמים.", "kp": ["כדי לסמך ירידתו של יהודה למכירתו של יוסף", "מה זו לשם שמים אף זו לשם שמים"]}, {"q": "לְפִי רַשִׁ״י, מַה הַמְּשֻׁותָּף בֵּין תָּמָר לְאֵשֶׁת פּוֹטִיפַר?", "options": ["שְׁתֵּיהֶן פָּעֲלוּ לְשֵׁם שָׁמַיִם כִּי רָאוּ שֶׁיֵּצְאוּ מֵהֶם בָּנִים", "שְׁתֵּיהֶן הִשְׁתַּמְּשׁוּ בְּבֶגֶד כְּדֵי לְהוֹכִיחַ אֶת טַעֲנָתָן", "שְׁתֵּיהֶן רִימּוּ אֶת בַּעֲלֵיהֶן כְּדֵי לְהַשִּׂיג מַטָּרָתָן"], "kasha": "מדוע סמכה התורה את מעשה אשת פוטיפר למעשה תמר?", "answer": "רש״י מלמד שכשם שתמר פעלה לשם שמים, כך אשת פוטיפר — שראתה באצטרולוגין שעתידה להעמיד בנים ממנו, אך לא ידעה אם ממנה או מבתה.", "kp": ["מה זו לשם שמים אף זו לשם שמים", "שראתה באצטרולוגין שלה"]}]}, {"id": "39:3.1", "ch": 39, "v": 3, "n": 1, "dh": "כי ה' אתו", "pasuk_html": "וַיַּ֣רְא אֲדֹנָ֔יו <mark>כִּ֥י יְהוָ֖ה אִתּ֑וֹ</mark> וְכֹל֙ אֲשֶׁר־ה֣וּא עֹשֶׂ֔ה יְהוָ֖ה מַצְלִ֥יחַ בְּיָדֽוֹ׃", "pasuk_en": "וַיַּרְא אֲדֹנָיו כִּי יְהוָה אִתּוֹ וְכֹל אֲשֶׁר־הוּא עֹשֶׂה יְהוָה מַצְלִיחַ בְּיָדוֹ׃", "rashi_he": "כי ה' אתו. שֵׁם שָׁמַיִם שָׁגוּר בְּפִיו:", "rashi_en": "רש״י מסביר שפוטיפר ראה שה׳ עם יוסף, כי שם שמים היה שגור בפיו של יוסף — הוא היה מזכיר את שם ה׳ תדיר.", "note": "", "points": [{"q": "כֵּיצַד יָדַע אֲדֹונָיו שֶׁל יוֹסֵף שֶׁה׳ אִיתּוֹ?", "options": ["שֵׁם שָׁמַיִם הָיָה שָׁגוּר בְּפִיו שֶׁל יוֹסֵף", "כִּי רָאָה נִיסִּים גְּלוּיִים מִתְרַחֲשִׁים סְבִיב יוֹסֵף", "כִּי נָבִיא סִיפֵּר לְפוֹטִיפַר עַל קְדֻושַּׁת יוֹסֵף"], "kasha": "מנין לפוטיפר לדעת שה׳ עם יוסף, הרי אין הוא מכיר את ה׳?", "answer": "יוסף היה מזכיר את שם ה׳ תמיד, ולכן פוטיפר הבחין שה׳ עמו.", "kp": ["שם שמים שגור בפיו"]}]}, {"id": "39:4.1", "ch": 39, "v": 4, "n": 1, "dh": "וכל יש לו", "pasuk_html": "וַיִּמְצָ֨א יוֹסֵ֥ף חֵ֛ן בְּעֵינָ֖יו וַיְשָׁ֣רֶת אֹת֑וֹ וַיַּפְקִדֵ֙הוּ֙ עַל־בֵּית֔וֹ <mark>וְכָל־יֶשׁ־ל֖וֹ</mark> נָתַ֥ן בְּיָדֽוֹ׃", "pasuk_en": "וַיִּמְצָא יוֹסֵף חֵן בְּעֵינָיו וַיְשָׁרֶת אֹתוֹ וַיַּפְקִדֵהוּ עַל־בֵּיתוֹ וְכָל־יֶשׁ־לוֹ נָתַן בְּיָדוֹ׃", "rashi_he": "וכל יש לו. הֲרֵי לָשׁוֹן קָצָר, חָסֵר \"אֲשֶׁר\":", "rashi_en": "רש״י מעיר שהביטוי \"וכל יש לו\" הוא לשון קצר, שחסרה בו המילה \"אשר\" — והכוונה: וכל אשר יש לו.", "note": "", "points": [{"q": "מַה מֵעִיר רַשִׁ״י עַל הַבִּיטּוּי \"וְכָל־יֶשׁ־לוֹ\"?", "options": ["זֶהוּ לָשׁוֹן קָצָר שֶׁחָסְרָה בּוֹ הַמִּילָּה \"אֲשֶׁר\"", "זֶהוּ בִּיטּוּי הַמּוֹרֶה שֶׁלֹּא הָיָה לוֹ רְכוּשׁ רַב", "זֶהוּ בִּיטּוּי חָרִיג שֶׁמַּשְׁמָעוּתוֹ מַתָּנוֹת שֶׁקִּיבֵּל"], "kasha": "הביטוי \"וכל יש לו\" אינו תקין דקדוקית — חסרה בו מילת יחס.", "answer": "הביטוי הוא לשון קצר, שחסרה בו המילה \"אשר\", והכוונה: וכל אשר יש לו.", "kp": ["לשון קצר", "חסר אשר"]}]}, {"id": "39:6.1", "ch": 39, "v": 6, "n": 1, "dh": "ולא ידע אתו מאומה", "pasuk_html": "וַיַּעֲזֹ֣ב כָּל־אֲשֶׁר־לוֹ֮ בְּיַד־יוֹסֵף֒ <mark>וְלֹא־יָדַ֤ע אִתּוֹ֙ מְא֔וּמָה</mark> כִּ֥י אִם־הַלֶּ֖חֶם אֲשֶׁר־ה֣וּא אוֹכֵ֑ל וַיְהִ֣י יוֹסֵ֔ף יְפֵה־תֹ֖אַר וִיפֵ֥ה מַרְאֶֽה׃", "pasuk_en": "וַיַּעֲזֹב כָּל־אֲשֶׁר־לוֹ בְּיַד־יוֹסֵף וְלֹא־יָדַע אִתּוֹ מְאוּמָה כִּי אִם־הַלֶּחֶם אֲשֶׁר־הוּא אוֹכֵל וַיְהִי יוֹסֵף יְפֵה־תֹאַר וִיפֵה מַרְאֶה׃", "rashi_he": "ולא ידע אתו מאומה. לֹא הָיָה נוֹתֵן לִבּוֹ לִכְלוּם:", "rashi_en": "רש״י מפרש ש\"לא ידע אתו מאומה\" פירושו שפוטיפר לא היה נותן לבו לשום דבר מענייני ביתו, כי סמך על יוסף.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת \"וְלֹא־יָדַע אִתּוֹ מְאוּמָה\"?", "options": ["שֶׁלֹּא הָיָה נוֹתֵן לִבּוֹ לִכְלוּם מֵעִנְיְינֵי בֵּיתוֹ", "שֶׁלֹּא יָדַע דָּבָר עַל עַבְרוֹ שֶׁל יוֹסֵף", "שֶׁלֹּא הִכִּיר אֶת יוֹסֵף בְּאֹופֶן אִישִׁי כְּלָל"], "kasha": "הביטוי \"לא ידע אתו מאומה\" אינו ברור — מה בדיוק לא ידע?", "answer": "פוטיפר לא היה נותן לבו לשום דבר, כלומר לא טרח לפקח על ענייניו כלל.", "kp": ["לא היה נותן לבו לכלום"]}]}, {"id": "39:6.2", "ch": 39, "v": 6, "n": 2, "dh": "כי אם הלחם", "pasuk_html": "וַיַּעֲזֹ֣ב כָּל־אֲשֶׁר־לוֹ֮ בְּיַד־יוֹסֵף֒ וְלֹא־יָדַ֤ע אִתּוֹ֙ מְא֔וּמָה <mark>כִּ֥י אִם־הַלֶּ֖חֶם</mark> אֲשֶׁר־ה֣וּא אוֹכֵ֑ל וַיְהִ֣י יוֹסֵ֔ף יְפֵה־תֹ֖אַר וִיפֵ֥ה מַרְאֶֽה׃", "pasuk_en": "וַיַּעֲזֹב כָּל־אֲשֶׁר־לוֹ בְּיַד־יוֹסֵף וְלֹא־יָדַע אִתּוֹ מְאוּמָה כִּי אִם־הַלֶּחֶם אֲשֶׁר־הוּא אוֹכֵל וַיְהִי יוֹסֵף יְפֵה־תֹאַר וִיפֵה מַרְאֶה׃", "rashi_he": "כי אם הלחם. הִיא אִשְׁתּוֹ, אֶלָּא שֶׁדִּבֵּר בְּלָשׁוֹן נְקִיָּה:", "rashi_en": "רש״י מפרש ש\"הלחם\" הוא כינוי לאשתו של פוטיפר, והכתוב דיבר בלשון נקייה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, לָמָּה הַכַּוָּונָה בְּ\"הַלֶּחֶם\" שֶׁפּוֹטִיפַר שָׁמַר לְעַצְמוֹ?", "options": ["לְאִשְׁתּוֹ, וְהַכָּתוּב הִשְׁתַּמֵּשׁ בִּלְשׁוֹן נְקִיָּיה", "לְמַאֲכָלוֹ, כִּי הִקְפִּיד עַל כַּשְׁרוּת אָוכְלוֹ", "לַעֲבוֹדַת הָאֱלִילִים שֶׁלּוֹ שֶׁהָיְיתָה אִישִׁית"], "kasha": "מדוע הכתוב מציין דווקא את הלחם כדבר היחיד שפוטיפר שמר לעצמו?", "answer": "\"הלחם\" הוא כינוי לאשתו של פוטיפר, אלא שהכתוב דיבר בלשון נקייה.", "kp": ["היא אשתו", "דבר בלשון נקיה"]}]}, {"id": "39:6.3", "ch": 39, "v": 6, "n": 3, "dh": "ויהי יוסף יפה תואר", "pasuk_html": "וַיַּעֲזֹ֣ב כָּל־אֲשֶׁר־לוֹ֮ בְּיַד־יוֹסֵף֒ וְלֹא־יָדַ֤ע אִתּוֹ֙ מְא֔וּמָה כִּ֥י אִם־הַלֶּ֖חֶם אֲשֶׁר־ה֣וּא אוֹכֵ֑ל <mark>וַיְהִ֣י יוֹסֵ֔ף יְפֵה־תֹ֖אַר</mark> וִיפֵ֥ה מַרְאֶֽה׃", "pasuk_en": "וַיַּעֲזֹב כָּל־אֲשֶׁר־לוֹ בְּיַד־יוֹסֵף וְלֹא־יָדַע אִתּוֹ מְאוּמָה כִּי אִם־הַלֶּחֶם אֲשֶׁר־הוּא אוֹכֵל וַיְהִי יוֹסֵף יְפֵה־תֹאַר וִיפֵה מַרְאֶה׃", "rashi_he": "ויהי יוסף יפה תואר. כֵּיוָן שֶׁרָאָה עַצְמוֹ מוֹשֵׁל, הִתְחִיל אוֹכֵל וְשׁוֹתֶה וּמְסַלְסֵל בְּשַׂעֲרוֹ, אָמַר הַקָּבָּ\"ה אָבִיךָ מִתְאַבֵּל וְאַתָּה מְסַלְסֵל בִּשְׂעָרְךָ, אֲנִי מְגָרֶה בְךָ אֶת הַדֹּב, מִיָּד:", "rashi_en": "רש״י מסביר שכאשר יוסף ראה את עצמו שליט, הוא התחיל לאכול ולשתות ולסלסל בשערו. הקב״ה אמר לו: אביך מתאבל ואתה מסלסל בשערך — לכן אגרה בך את הדוב (אשת פוטיפר).", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ נֶעֱנַשׁ יוֹסֵף בְּנִסָּיוֹן שֶׁל אֵשֶׁת פּוֹטִיפַר?", "options": ["כִּי הִתְנַהֵג בְּרַווָּחָה וְסִלְסֵל בִּשְׂעָרוֹ בִּזְמַן שֶׁאָבִיו מִתְאַבֵּל", "כִּי סֵירֵב לְהִתְפַּלֵּל עַל אָבִיו שֶׁבְּאֶרֶץ כְּנַעַן", "כִּי הִתְגָּאָה בְּתַפְקִידוֹ וְהִתְנַשֵּׂא עַל שְׁאָר הָעֲבָדִים"], "kasha": "מדוע הפסוק מזכיר את יופיו של יוסף דווקא כאן, מיד אחרי שהצליח בבית פוטיפר?", "answer": "יוסף ראה עצמו מושל והתחיל אוכל ושותה ומסלסל בשערו, ולכן הקב״ה הגרה בו את אשת פוטיפר כעונש על שאביו מתאבל והוא עסוק ביופיו.", "kp": ["התחיל אוכל ושותה ומסלסל בשערו", "אביך מתאבל ואתה מסלסל בשערך", "אני מגרה בך את הדב"]}]}, {"id": "39:7.1", "ch": 39, "v": 7, "n": 1, "dh": "ותשא אשת אדוניו וגו'", "pasuk_html": "וַיְהִ֗י אַחַר֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה <mark>וַתִּשָּׂ֧א אֵֽשֶׁת־אֲדֹנָ֛יו</mark> אֶת־עֵינֶ֖יהָ אֶל־יוֹסֵ֑ף וַתֹּ֖אמֶר שִׁכְבָ֥ה עִמִּֽי׃", "pasuk_en": "וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה וַתִּשָּׂא אֵשֶׁת־אֲדֹנָיו אֶת־עֵינֶיהָ אֶל־יוֹסֵף וַתֹּאמֶר שִׁכְבָה עִמִּי׃", "rashi_he": "ותשא אשת אדוניו וגו'. כָּל מָקוֹם שֶׁנֶּאֱמַר אַחַר סָמוּךְ:", "rashi_en": "רש״י מסביר שהמילה ״אחר״ (ולא ״אחרי״) פירושה מיד אחרי — כלומר, מעשה אשת פוטיפר בא מיד בעקבות סלסול שערו של יוסף.", "note": "", "points": [{"q": "מַה לוֹמֵד רַשִׁ״י מֵהַמִּילָּה ״אַחַר״ שֶׁבַּפָּסוּק?", "options": ["שֶׁהַדָּבָר הָיָה סָמוּךְ — מִיָּד אַחֲרֵי הַמְּאֹורָע הַקּוֹדֵם", "שֶׁעָבַר זְמַן רַב בֵּין הַמְּאוֹרָעוֹת", "שֶׁהַתּוֹרָה חוֹזֶרֶת לְסַפֵּר אֵירוּעַ מֻוקְדָּם יוֹתֵר"], "kasha": "מדוע רש״י מדגיש את לשון ״אחר הדברים האלה״ — מה המשמעות המיוחדת של ״אחר״?", "answer": "כל מקום שנאמר ״אחר״ הכוונה סמוך, כלומר מיד אחרי הדברים שקדמו.", "kp": ["כל מקום שנאמר אחר סמוך"]}]}, {"id": "39:9.1", "ch": 39, "v": 9, "n": 1, "dh": "וחטאתי לאלהים", "pasuk_html": "אֵינֶ֨נּוּ גָד֜וֹל בַּבַּ֣יִת הַזֶּה֮ מִמֶּנִּי֒ וְלֹֽא־חָשַׂ֤ךְ מִמֶּ֙נִּי֙ מְא֔וּמָה כִּ֥י אִם־אוֹתָ֖ךְ בַּאֲשֶׁ֣ר אַתְּ־אִשְׁתּ֑וֹ וְאֵ֨יךְ אֶֽעֱשֶׂ֜ה הָרָעָ֤ה הַגְּדֹלָה֙ הַזֹּ֔את <mark>וְחָטָ֖אתִי לֵֽאלֹהִֽים׃</mark>", "pasuk_en": "אֵינֶנּוּ גָדוֹל בַּבַּיִת הַזֶּה מִמֶּנִּי וְלֹא־חָשַׂךְ מִמֶּנִּי מְאוּמָה כִּי אִם־אוֹתָךְ בַּאֲשֶׁר אַתְּ־אִשְׁתּוֹ וְאֵיךְ אֶעֱשֶׂה הָרָעָה הַגְּדֹלָה הַזֹּאת וְחָטָאתִי לֵאלֹהִים׃", "rashi_he": "וחטאתי לאלהים. בְּנֵי נֹחַ נִצְטַוּוּ עַל הָעֲרָיוֹת:", "rashi_en": "רש״י מסביר שיוסף אמר ״וחטאתי לאלהים״ כי גם בני נח — לא רק ישראל — נצטוו על איסור עריות, ולכן זהו חטא כלפי ְתָה <mark>לַעֲשׂ֣וֹת מְלַאכְתּ֑וֹ</mark> וְאֵ֨ין אִ֜ישׁ מֵאַנְשֵׁ֥י הַבַּ֛יִת שָׁ֖ם בַּבָּֽיִת׃", "pasuk_en": "וַיְהִי כְּהַיּוֹם הַזֶּה וַיָּבֹא הַבַּיְתָה לַעֲשׂוֹת מְלַאכְתּוֹ וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת שָׁם בַּבָּיִת׃", "rashi_he": "לעשות מלאכתו. רַב וּשְׁמוּאֵל, חַד אָמַר מְלַאכְתּוֹ מַמָּשׁ, וְחַד אָמַר לַעֲשׂוֹת צְרָכָיו עִמָּהּ, אֶלָּא שֶׁנִּרְאֵית לוֹ דְּמוּת דְּיוּקְנוֹ שֶׁל אָבִיו וכו' כִּדְאִיתָא בְּמַסֶּכֶת סוֹטָה (דף ל\"ו):", "rashi_en": "רש״י מביא מחלוקת בין רב ושמואל: אחד אומר שיוסף בא לעשות מלאכתו ממש, והשני אומר שהתכוון לעשות צרכיו עמה, אלא שנראתה לו דמות דיוקנו של אביו ונמנע.", "note": "", "points": [{"q": "מַהִי הַמַּחֲלֹוקֶת שֶׁמֵּבִיא רַשׁ״י בְּפֵירוּשׁ \"לַעֲשׂוֹת מְלַאכְתּוֹ\"?", "options": ["אֶחָד אוֹמֵר מְלַאכְתּוֹ מַמָּשׁ וְאֶחָד אוֹמֵר לַעֲשׂוֹת צְרָכָיו עִמָּהּ", "אֶחָד אוֹמֵר מְלֶאכֶת הַבַּיִת וְאֶחָד אוֹמֵר מְלֶאכֶת הַשָּׂדֶה", "אֶחָד אוֹמֵר שֶׁבָּא לְחֶשְׁבּוֹנוֹת וְאֶחָד אוֹמֵר שֶׁבָּא לְבַשֵּׁל"], "kasha": "הביטוי \"לעשות מלאכתו\" סתום — האם הכוונה למלאכה ממש או לדבר אחר?", "answer": "רב ושמואל נחלקו: אחד סובר שבא לעשות מלאכתו ממש, ואחד סובר שהתכוון לעשות צרכיו עמה, אלא שנראתה לו דמות דיוקנו של אביו.", "kp": ["חד אמר מלאכתו ממש", "וחד אמר לעשות צרכיו עמה"]}, {"q": "לְפִי הַדֵּעָה שֶׁיּוֹסֵף הִתְכַּוֵּון לַחֲטֹוא, מַה מָנַע מִמֶּנּוּ?", "options": ["נִרְאֲתָה לוֹ דְּמוּת דְּיוֹקְנוֹ שֶׁל אָבִיו", "נִכְנַס אֶחָד מֵאַנְשֵׁי הַבַּיִת פִּתְאֹום", "נִזְכַּר בַּחֲלוֹמוֹתָיו עַל הֶעָתִיד"], "kasha": "אם אכן התכוון לעשות צרכיו עמה, מדוע בסוף לא חטא?", "answer": "נראתה לו דמות דיוקנו של אביו, וזה מנע ממנו לחטוא.", "kp": ["שנראית לו דמות דיוקנו של אביו"]}]}, {"id": "39:14.1", "ch": 39, "v": 14, "n": 1, "dh": "ראו הביא לנו", "pasuk_html": "וַתִּקְרָ֞א לְאַנְשֵׁ֣י בֵיתָ֗הּ וַתֹּ֤אמֶר לָהֶם֙ לֵאמֹ֔ר <mark>רְא֗וּ הֵ֥בִיא לָ֛נוּ</mark> אִ֥ישׁ עִבְרִ֖י לְצַ֣חֶק בָּ֑נוּ בָּ֤א אֵלַי֙ לִשְׁכַּ֣ב עִמִּ֔י וָאֶקְרָ֖א בְּק֥וֹל גָּדֽוֹל׃", "pasuk_en": "וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ וַתֹּאמֶר לָהֶם לֵאמֹר רְאוּ הֵבִיא לָנוּ אִישׁ עִבְרִי לְצַחֶק בָּנוּ בָּא אֵלַי לִשְׁכַּב עִמִּי וָאֶקְרָא בְּקוֹל גָּדוֹל׃", "rashi_he": "ראו הביא לנו. הֲרֵי זֶה לָשׁוֹן קְצָרָה – הֵבִיא לָנוּ, וְלֹא פֵּרֵשׁ מִי הֱבִיאוֹ, וְעַל בַּעֲלָהּ אוֹמֶרֶת כֵּן:", "rashi_en": "רש״י מסביר שהביטוי \"הביא לנו\" הוא לשון קצרה — לא נאמר מי הביא את יוסף. בפועל היא מתכוונת לבעלה פוטיפר, ומתלוננת שהוא הביא את העבד העברי הזה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַה מְיֻוחָד בַּבִּיטּוּי \"הֵבִיא לָנוּ\"?", "options": ["זֶהוּ לָשׁוֹן קְצָרָה שֶׁלֹּא מְפָרֶשֶׁת מִי הֱבִיאוֹ, וְהַכַּוָּונָה לְבַעְלָהּ", "זֶהוּ בִּיטּוּי שֶׁל כָּבוֹד כְּלַפֵּי אַנְשֵׁי הַבַּיִת", "זֶהוּ לָשׁוֹן רַבִּים כִּי הָיוּ כַּמָּה אֲנָשִׁים שֶׁהֱבִיאוּהוּ"], "kasha": "הביטוי \"הביא לנו\" סתום — מי הוא זה שהביא, ומדוע לא נקבה בשמו?", "answer": "זהו לשון קצרה: לא פירשה מי הביאו, אך כוונתה לבעלה פוטיפר שהביא את יוסף לביתם.", "kp": ["לשון קצרה", "ולא פרש מי הביאו", "ועל בעלה אומרת כן"]}]}, {"id": "39:14.2", "ch": 39, "v": 14, "n": 2, "dh": "עברי", "pasuk_html": "וַתִּקְרָ֞א לְאַנְשֵׁ֣י בֵיתָ֗הּ וַתֹּ֤אמֶר לָהֶם֙ לֵאמֹ֔ר רְא֗וּ הֵ֥בִיא לָ֛נוּ אִ֥ישׁ <mark>עִבְרִ֖י</mark> לְצַ֣חֶק בָּ֑נוּ בָּ֤א אֵלַי֙ לִשְׁכַּ֣ב עִמִּ֔י וָאֶקְרָ֖א בְּק֥וֹל גָּדֽוֹל׃", "pasuk_en": "וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ וַתֹּאמֶר לָהֶם לֵאמֹר רְאוּ הֵבִיא לָנוּ אִישׁ עִבְרִי לְצַחֶק בָּנוּ בָּא אֵלַי לִשְׁכַּב עִמִּי וָאֶקְרָא בְּקוֹל גָּדוֹל׃", "rashi_he": "עברי. מֵעֵבֶר הַנָּהָר, מִבְּנֵי עֵבֶר (בראשית רבה):", "rashi_en": "רש״י מפרש שהמילה 'עברי' משמעותה מי שבא מעבר הנהר, וכן מי שהוא מצאצאי עבר.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה 'עִבְרִי'?", "options": ["מֵעֵבֶר הַנָּהָר, וּמִבְּנֵי עֵבֶר", "יְלִיד אֶרֶץ כְּנַעַן שֶׁעָבַר לְשָׁם", "מִי שֶׁעוֹבֵר מִמָּקוֹם לְמָקוֹם, נוֹדֵד"], "kasha": "מדוע הפסוק קורא ליוסף 'עברי' — מה משמעות הכינוי הזה?", "answer": "רש״י מביא שני פירושים: עברי פירושו שבא מעבר הנהר, וכן שהוא מצאצאי עבר.", "kp": ["מעבר הנהר", "מבני עבר"]}]}, {"id": "39:16.1", "ch": 39, "v": 16, "n": 1, "dh": "אדניו", "pasuk_html": "וַתַּנַּ֥ח בִּגְד֖וֹ אֶצְלָ֑הּ עַד־בּ֥וֹא <mark>אֲדֹנָ֖יו</mark> אֶל־בֵּיתֽוֹ׃", "pasuk_en": "וַתַּנַּח בִּגְדוֹ אֶצְלָהּ עַד־בּוֹא אֲדֹנָיו אֶל־בֵּיתוֹ׃", "rashi_he": "אדניו. שֶׁל יוֹסֵף:", "rashi_en": "רש״י מבהיר שהכינוי 'אדניו' בפסוק מתייחס לאדונו של יוסף, כלומר פוטיפר.", "note": "", "points": [{"q": "לְמִי מִתְייַּחֵס הַכִּינּוּי 'אֲדֹנָיו' לְפִי רַשׁ״י?", "options": ["לַאֲדוֹנוֹ שֶׁל יוֹסֵף, פּוֹטִיפַר", "לַאֲבִיו שֶׁל יוֹסֵף, יַעֲקֹב", "לְפַרְעֹה מֶלֶךְ מִצְרָיִם"], "kasha": "הכינוי 'אדניו' עלול להתפרש כמתייחס לכמה דמויות — למי הכוונה?", "answer": "רש״י מבהיר שהכינוי 'אדניו' מוסב על יוסף, כלומר אדונו של יוסף.", "kp": ["של יוסף"]}]}, {"id": "39:17.1", "ch": 39, "v": 17, "n": 1, "dh": "בא אלי", "pasuk_html": "וַתְּדַבֵּ֣ר אֵלָ֔יו כַּדְּבָרִ֥ים הָאֵ֖לֶּה לֵאמֹ֑ר <mark>בָּֽא־אֵלַ֞י</mark> הָעֶ֧בֶד הָֽעִבְרִ֛י אֲשֶׁר־הֵבֵ֥אתָ לָּ֖נוּ לְצַ֥חֶק בִּֽי׃", "pasuk_en": "וַתְּדַבֵּר אֵלָיו כַּדְּבָרִים הָאֵלֶּה לֵאמֹר בָּא־אֵלַי הָעֶבֶד הָעִבְרִי אֲשֶׁר־הֵבֵאתָ לָּנוּ לְצַחֶק בִּי׃", "rashi_he": "בא אלי. לְצַחֶק בִּי הָעֶבֶד הָעִבְרִי אֲשֶׁר הֵבֵאתָ לָּנוּ:", "rashi_en": "רש״י מסדר מחדש את מילות הפסוק ומראה שהכוונה היא: העבד העברי שהבאת לנו בא אלי לצחק בי.", "note": "", "points": [{"q": "מַה רַשׁ״י עוֹשֶׂה עִם סֵדֶר הַמִּילִּים בַּפָּסוּק?", "options": ["מְסַדֵּר מֵחָדָשׁ: הָעֶבֶד הָעִבְרִי שֶׁהֵבֵאתָ — בָּא אֵלַי לִצְחֹק", "מוֹסִיף מִילִּים שֶׁחֲסֵרוֹת בַּפָּסוּק", "מְפָרֵשׁ שֶׁהִיא שִׁיקְּרָה וְשִׁינְּתָה אֶת הַסֵּדֶר בְּכַוָּונָה"], "kasha": "סדר המילים בפסוק אינו חלק — 'בא אלי... העבד העברי אשר הבאת לנו לצחק בי' — מה הכוונה?", "answer": "רש״י מסדר את המילים כך: העבד העברי אשר הבאת לנו — בא אלי לצחק בי, שהרי המקרא קצר.", "kp": ["לצחק בי העבד העברי אשר הבאת לנו"]}]}, {"id": "39:19.1", "ch": 39, "v": 19, "n": 1, "dh": "ויהי כשמע אדניו וגו'", "pasuk_html": "<mark>וַיְהִי֩ כִשְׁמֹ֨עַ אֲדֹנָ֜יו</mark> אֶת־דִּבְרֵ֣י אִשְׁתּ֗וֹ אֲשֶׁ֨ר דִּבְּרָ֤ה אֵלָיו֙ לֵאמֹ֔ר כַּדְּבָרִ֣ים הָאֵ֔לֶּה עָ֥שָׂהּ לִ֖י עַבְדֶּ֑ךָ וַיִּ֖חַר אַפּֽוֹ׃", "pasuk_en": "וַיְהִי כִשְׁמֹעַ אֲדֹנָיו אֶת־דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו לֵאמֹר כַּדְּבָרִים הָאֵלֶּה עָשָׂהּ לִי עַבְדֶּךָ וַיִּחַר אַפּוֹ׃", "rashi_he": "ויהי כשמע אדניו וגו'. בִּשְׁעַת תַּשְׁמִישׁ אָמְרָה לוֹ כֵן, וְזֶהוּ שֶׁאָמְרָה כַּדְּבָרִים הָאֵלֶּה עָשָׂה לִי עַבְדֶּךָ, עִנְיְנֵי תַשְׁמִישׁ כָּאֵלֶּה:", "rashi_en": "רש״י מפרש שאשת פוטיפר אמרה לבעלה דברים אלו בשעת תשמיש, ו'כדברים האלה' הכוונה לענייני תשמיש כאלה.", "note": "", "points": [{"q": "מָתַי אָמְרָה אֵשֶׁת פּוֹטִיפַר לְבַעְלָהּ אֶת דְּבָרֶיהָ, לְפִי רַשׁ״י?", "options": ["בִּשְׁעַת תַּשְׁמִישׁ עִם בַּעְלָהּ", "מִיָּד כְּשֶׁפּוֹטִיפַר נִכְנַס לַבַּיִת", "לְמָחֳרָת בַּבֹּוקֶר כְּשֶׁנִּרְגְּעָה"], "kasha": "מדוע כתוב 'כדברים האלה עשה לי עבדך' — מה הכוונה ב'כדברים האלה'?", "answer": "רש״י מפרש שאמרה זאת בשעת תשמיש, ו'כדברים האלה' פירושו ענייני תשמיש כאלה עשה לי עבדך.", "kp": ["בשעת תשמיש", "עניני תשמיש כאלה"]}]}, {"id": "39:21.1", "ch": 39, "v": 21, "n": 1, "dh": "ויט אליו חסד", "pasuk_html": "וַיְהִ֤י יְהוָה֙ אֶת־יוֹסֵ֔ף <mark>וַיֵּ֥ט אֵלָ֖יו חָ֑סֶד</mark> וַיִּתֵּ֣ן חִנּ֔וֹ בְּעֵינֵ֖י שַׂ֥ר בֵּית־הַסֹּֽהַר׃", "pasuk_en": "וַיְהִי יְהוָה אֶת־יוֹסֵף וַיֵּט אֵלָיו חָסֶד וַיִּתֵּן חִנּוֹ בְּעֵינֵי שַׂר בֵּית־הַסֹּהַר׃", "rashi_he": "ויט אליו חסד. שֶׁהָיָה מְקֻבָּל לְכָל רוֹאָיו, לְשׁוֹן \"כַּלָּה נָאָה וַחֲסוּדָה\" שֶׁבַּמִּשְׁנָה:", "rashi_en": "רש״י מסביר שהמילה \"חסד\" כאן פירושה שיוסף היה מוצא חן בעיני כל רואיו, כמו הביטוי \"כלה נאה וחסודה\" שבמשנה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"וַיֵּט אֵלָיו חָסֶד\" לְפִי רַשׁ״י?", "options": ["שֶׁהָיָה מְקֻובָּל וְאָהוּב עַל כָּל רוֹאָיו", "שֶׁה׳ הִטָּה אֶת מַזָּלוֹ לְהַצְלָחָה בַּעֲסָקִים", "שֶׁשַּׂר בֵּית הַסֹּוהַר רִיחֵם עָלָיו בְּמִיּוּחָד"], "kasha": "מה משמעות המילה \"חסד\" בפסוק זה, שאינה במובנה הרגיל של מעשה טוב.", "answer": "\"חסד\" כאן פירושו חן ומציאת חן, שיוסף היה מקובל על כל רואיו, כמו \"כלה נאה וחסודה\" במשנה.", "kp": ["מקבל לכל רואיו", "כלה נאה וחסודה"]}]}, {"id": "39:22.1", "ch": 39, "v": 22, "n": 1, "dh": "הוא היה עושה", "pasuk_html": "וַיִּתֵּ֞ן שַׂ֤ר בֵּית־הַסֹּ֙הַר֙ בְּיַד־יוֹסֵ֔ף אֵ֚ת כָּל־הָ֣אֲסִירִ֔ם אֲשֶׁ֖ר בְּבֵ֣ית הַסֹּ֑הַר וְאֵ֨ת כָּל־אֲשֶׁ֤ר עֹשִׂים֙ שָׁ֔ם <mark>ה֖וּא הָיָ֥ה עֹשֶֽׂה׃</mark>", "pasuk_en": "וַיִּתֵּן שַׂר בֵּית־הַסֹּהַר בְּיַד־יוֹסֵף אֵת כָּל־הָאֲסִירִם אֲשֶׁר בְּבֵית הַסֹּהַר וְאֵת כָּל־אֲשֶׁר עֹשִׂים שָׁם הוּא הָיָה עֹשֶׂה׃", "rashi_he": "הוא היה עושה. כְּתַרְגּוּמוֹ בְּמֵימְרֵהּ הֲוָה מִתְעֲבֵיד:", "rashi_en": "רש״י מסביר על פי תרגום אונקלוס שלא יוסף עצמו עשה הכול בידיו, אלא שהדברים נעשו על פי דיבורו ופקודתו.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"הוּא הָיָה עוֹשֶׂה\" לְפִי רַשׁ״י?", "options": ["שֶׁהַכֹּול נַעֲשָׂה עַל פִּי פְּקֻודָּתוֹ וְדִיבּוּרוֹ", "שֶׁיּוֹסֵף עַצְמוֹ עָשָׂה אֶת כָּל הַמְּלָאכוֹת בְּיָדָיו", "שֶׁיּוֹסֵף הָיָה מְמֻונֶּה עַל הַפִּיקּוּחַ בִּלְבַד"], "kasha": "הביטוי \"הוא היה עושה\" משתמע כאילו יוסף עשה הכול לבדו, וזה אינו מתאים למעמדו כממונה.", "answer": "לפי תרגום אונקלוס, \"הוא היה עושה\" פירושו שהדברים נעשו בדיבורו ובפקודתו, לא בעשייה ממש.", "kp": ["במימרה הוה מתעביד"]}]}, {"id": "39:23.1", "ch": 39, "v": 23, "n": 1, "dh": "באשר ה' אתו", "pasuk_html": "אֵ֣ין ׀ שַׂ֣ר בֵּית־הַסֹּ֗הַר רֹאֶ֤ה אֶֽת־כָּל־מְא֙וּמָה֙ בְּיָד֔וֹ <mark>בַּאֲשֶׁ֥ר יְהוָ֖ה אִתּ֑וֹ</mark> וַֽאֲשֶׁר־ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׃ (ס)", "pasuk_en": "אֵין שַׂר בֵּית־הַסֹּהַר רֹאֶה אֶת־כָּל־מְאוּמָה בְּיָדוֹ בַּאֲשֶׁר יְהוָה אִתּוֹ וַאֲשֶׁר־הוּא עֹשֶׂה יְהוָה מַצְלִיחַ׃", "rashi_he": "באשר ה' אתו. בִּשְׁבִיל שֶׁה' אִתּוֹ:", "rashi_en": "רש״י מסביר שהמילה \"באשר\" בפסוק פירושה \"בשביל ש\", כלומר: בגלל שה׳ היה עם יוסף.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילָּה \"בַּאֲשֶׁר\" לְפִי רַשׁ״י?", "options": ["בִּשְׁבִיל שֶׁ — מִילַּת סִיבָּה", "בְּמָקוֹם אֲשֶׁר — מִילַּת מָקוֹם", "כַּאֲשֶׁר — מִילַּת זְמַן"], "kasha": "המילה \"באשר\" עשויה להתפרש בכמה אופנים, ורש״י מבהיר את משמעותה כאן.", "answer": "\"באשר\" פירושו \"בשביל ש\", כלומר הסיבה שהצליח היא שה׳ היה אתו.", "kp": ["בשביל שה׳ אתו"]}]}, {"id": "40:1.1", "ch": 40, "v": 1, "n": 1, "dh": "אחר הדברים האלה", "pasuk_html": "וַיְהִ֗י <mark>אַחַר֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה</mark> חָֽטְא֛וּ מַשְׁקֵ֥ה מֶֽלֶךְ־מִצְרַ֖יִם וְהָאֹפֶ֑ה לַאֲדֹנֵיהֶ֖ם לְמֶ֥לֶךְ מִצְרָֽיִם׃", "pasuk_en": "וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה חָטְאוּ מַשְׁקֵה מֶלֶךְ־מִצְרַיִם וְהָאֹפֶה לַאֲדֹנֵיהֶם לְמֶלֶךְ מִצְרָיִם׃", "rashi_he": "אחר הדברים האלה. לְפִי שֶׁהִרְגִּילָה אוֹתָהּ אֲרוּרָה אֶת הַצַּדִּיק בְּפִי כֻלָּם לְדַבֵּר בּוֹ וּלְגַנּוֹתוֹ, הֵבִיא לָהֶם הַקָּבָּ\"ה סֻרְחָנָם שֶׁל אֵלּוּ, שֶׁיִּפְנוּ אֲלֵיהֶם וְלֹא אֵלָיו, וְעוֹד שֶׁתָּבֹא הָרְוָחָה לַצַּדִּיק עַל יְדֵיהֶם:", "rashi_en": "רש״י מסביר שאשת פוטיפר הרגילה את שם יוסף לגנאי בפי הבריות, ולכן הקב״ה גרם לחטא המשקה והאופה — כדי להסיט את תשומת הלב מיוסף, וגם כדי שדרכם תבוא לו ישועה.", "note": "", "points": [{"q": "מַדּוּעַ הַקָּב״ה גָּרַם לְחֵטְא הַמַּשְׁקֶה וְהָאוֹפֶה דַּוְוקָא בַּזְּמַן הַזֶּה?", "options": ["כְּדֵי לְהַסִּיחַ אֶת דַּעַת הַבְּרִיּוֹת מִגְּנוּת יוֹסֵף וּלְהָבִיא לוֹ יְשׁוּעָה", "כְּדֵי לְהַעֲנִישׁ אֶת פַּרְעֹה עַל שֶׁכָּלָא אֶת יוֹסֵף חִינָּם", "כְּדֵי לְגַלּוֹת לְיוֹסֵף אֶת כֹּוחַ פִּתְרוֹן הַחֲלוֹמוֹת שֶׁלּוֹ"], "kasha": "מה הקשר בין מעשה אשת פוטיפר לבין חטא שר המשקים ושר האופים.", "answer": "אשת פוטיפר גרמה שידברו ביוסף לגנאי, ולכן ה׳ הביא חטא המשקה והאופה כדי להפנות את תשומת הלב אליהם ולא אליו, וגם כדי שתבוא גאולה ליוסף על ידם.", "kp": ["שהרגילה אותה ארורה את הצדיק בפי כלם", "שיפנו אליהם ולא אליו", "שתבא הרוחה לצדיק על ידיהם"]}]}, {"id": "40:1.2", "ch": 40, "v": 1, "n": 2, "dh": "חטאו", "pasuk_html": "וַיְהִ֗י אַחַר֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה <mark>חָֽטְא֛וּ</mark> מַשְׁקֵ֥ה מֶֽלֶךְ־מִצְרַ֖יִם וְהָאֹפֶ֑ה לַאֲדֹנֵיהֶ֖ם לְמֶ֥לֶךְ מִצְרָֽיִם׃", "pasuk_en": "וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה חָטְאוּ מַשְׁקֵה מֶלֶךְ־מִצְרַיִם וְהָאֹפֶה לַאֲדֹנֵיהֶם לְמֶלֶךְ מִצְרָיִם׃", "rashi_he": "חטאו. זֶה נִמְצָא זְבוּב בְּפַיְילִי פּוֹטֵירִין שֶׁלּוֹ, וְזֶה נִמְצָא צְרוֹר בִּגְלוּסְקִין שֶׁלּוֹ:", "rashi_en": "רש״י מפרט מה היה חטאו של כל אחד מהם: במשקה של שר המשקים נמצא זבוב, ובלחם של שר האופים נמצא צרור.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַה הָיָה חֶטְאוֹ שֶׁל שַׂר הַמַּשְׁקִים?", "options": ["נִמְצָא זְבוּב בְּכוֹס הַמַּשְׁקֶה שֶׁלּוֹ", "שָׁפַךְ אֶת הַיַּיִן שֶׁל הַמֶּלֶךְ בִּטָּעוּת", "הִגִּישׁ מַשְׁקֶה מוּרְעָל לַמֶּלֶךְ"], "kasha": "התורה כותבת \"חטאו\" בסתם ולא מפרשת מה עשו, וצריך לדעת מהו החטא של כל אחד.", "answer": "במשקה של שר המשקים נמצא זבוב, ובלחם של שר האופים נמצא צרור.", "kp": ["זה נמצא זבוב בפיילי פוטירין שלו", "וזה נמצא צרור בגלוסקין שלו"]}]}, {"id": "40:1.3", "ch": 40, "v": 1, "n": 3, "dh": "והאפה", "pasuk_html": "וַיְהִ֗י אַחַר֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה חָֽטְא֛וּ מַשְׁקֵ֥ה מֶֽלֶךְ־מִצְרַ֖יִם <mark>וְהָאֹפֶ֑ה</mark> לַאֲדֹנֵיהֶ֖ם לְמֶ֥לֶךְ מִצְרָֽיִם׃", "pasuk_en": "וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה חָטְאוּ מַשְׁקֵה מֶלֶךְ־מִצְרַיִם וְהָאֹפֶה לַאֲדֹנֵיהֶם לְמֶלֶךְ מִצְרָיִם׃", "rashi_he": "והאפה. אֶת פַּת הַמֶּלֶךְ, וְאֵין לְשׁוֹן אֲפִיָּה אֶלָּא בְּפַת, וּבְלַעַז פישטו\"ר:", "rashi_en": "רש״י מסביר שהתואר \"אופה\" מתייחס דווקא ללחם, כי לשון אפייה נאמרת רק על פת.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, עַל מַה מִתְיַיְחֵס לְשׁוֹן \"אֲפִיָּיה\"?", "options": ["רַק עַל פַּת (לֶחֶם)", "עַל כָּל מַאֲכָל שֶׁמְּכִינִים בַּתַּנּוּר", "עַל מַאֲפִים וְעוּגוֹת בִּלְבַד"], "kasha": "מדוע התורה קוראת לו \"האופה\" ולא בשם אחר — מה מלמד תואר זה על תפקידו.", "answer": "לשון אפייה נאמרת רק על פת, כלומר תפקידו היה להכין את הלחם של המלך.", "kp": ["ואין לשון אפיה אלא בפת"]}]}, {"id": "40:4.1", "ch": 40, "v": 4, "n": 1, "dh": "ויפקד שר הטבחים את יוסף", "pasuk_html": "<mark>וַ֠יִּפְקֹד שַׂ֣ר הַטַּבָּחִ֧ים אֶת־יוֹסֵ֛ף</mark> אִתָּ֖ם וַיְשָׁ֣רֶת אֹתָ֑ם וַיִּהְי֥וּ יָמִ֖ים בְּמִשְׁמָֽר׃", "pasuk_en": "וַיִּפְקֹד שַׂר הַטַּבָּחִים אֶת־יוֹסֵף אִתָּם וַיְשָׁרֶת אֹתָם וַיִּהְיוּ יָמִים בְּמִשְׁמָר׃", "rashi_he": "ויפקד שר הטבחים את יוסף. לִהְיוֹת אִתָּם:", "rashi_en": "רש״י מבהיר שמינוי יוסף היה כדי שישרת את שר המשקים ושר האופים בבית הכלא.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, לְאֵיזוֹ מַטָּרָה מִינָּה שַׂר הַטַּבָּחִים אֶת יוֹסֵף?", "options": ["כְּדֵי שֶׁיִּהְיֶה עִם הַשָּׂרִים וִישָׁרֵת אוֹתָם", "כְּדֵי שֶׁיִּשְׁמוֹר עֲלֵיהֶם שֶׁלֹּא יִבְרְחוּ", "כְּדֵי שֶׁיִּפְתּוֹר אֶת חֲלוֹמוֹתֵיהֶם"], "kasha": "הפסוק אומר \"ויפקד... את יוסף אתם\" ולא ברור מה היה תפקידו של יוסף אצלם.", "answer": "שר הטבחים מינה את יוסף להיות עם השרים ולשרת אותם.", "kp": ["להיות אתם"]}]}, {"id": "40:4.2", "ch": 40, "v": 4, "n": 2, "dh": "ויהיו ימים במשמר", "pasuk_html": "וַ֠יִּפְקֹד שַׂ֣ר הַטַּבָּחִ֧ים אֶת־יוֹסֵ֛ף אִתָּ֖ם וַיְשָׁ֣רֶת אֹתָ֑ם <mark>וַיִּהְי֥וּ יָמִ֖ים בְּמִשְׁמָֽר׃</mark>", "pasuk_en": "וַיִּפְקֹד שַׂר הַטַּבָּחִים אֶת־יוֹסֵף אִתָּם וַיְשָׁרֶת אֹתָם וַיִּהְיוּ יָמִים בְּמִשְׁמָר׃", "rashi_he": "ויהיו ימים במשמר. שְׁנֵים עָשָׂר חֹדֶשׁ:", "rashi_en": "רש״י מפרש ש\"ימים\" הכוונה שנים עשר חודש, כלומר שהו במשמר שנה שלמה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, כַּמָּה זְמַן שָׁהוּ שַׂר הַמַּשְׁקִים וְשַׂר הָאוֹפִים בְּמִשְׁמָר?", "options": ["שְׁנֵים עָשָׂר חֹודֶשׁ", "שְׁלוֹשָׁה יָמִים בִּלְבַד", "שָׁלוֹשׁ שָׁנִים"], "kasha": "התורה כותבת \"ויהיו ימים במשמר\" — ולא ברור כמה זמן הכוונה ב\"ימים\".", "answer": "\"ימים\" פירושו שנים עשר חודש, כלומר שנה שלמה.", "kp": ["שנים עשר חדש"]}]}, {"id": "40:5.1", "ch": 40, "v": 5, "n": 1, "dh": "ויחלמו חלום שניהם", "pasuk_html": "<mark>וַיַּֽחַלְמוּ֩ חֲל֨וֹם שְׁנֵיהֶ֜ם</mark> אִ֤ישׁ חֲלֹמוֹ֙ בְּלַ֣יְלָה אֶחָ֔ד אִ֖ישׁ כְּפִתְר֣וֹן חֲלֹמ֑וֹ הַמַּשְׁקֶ֣ה וְהָאֹפֶ֗ה אֲשֶׁר֙ לְמֶ֣לֶךְ מִצְרַ֔יִם אֲשֶׁ֥ר אֲסוּרִ֖ים בְּבֵ֥ית הַסֹּֽהַר׃", "pasuk_en": "וַיַּחַלְמוּ חֲלוֹם שְׁנֵיהֶם אִישׁ חֲלֹמוֹ בְּלַיְלָה אֶחָד אִישׁ כְּפִתְרוֹן חֲלֹמוֹ הַמַּשְׁקֶה וְהָאֹפֶה אֲשֶׁר לְמֶלֶךְ מִצְרַיִם אֲשֶׁר אֲסוּרִים בְּבֵית הַסֹּהַר׃", "rashi_he": "ויחלמו חלום שניהם. וַיַּחַלְמוּ שְׁנֵיהֶם חֲלוֹם, זֶהוּ פְשׁוּטוֹ, וּמִדְרָשׁוֹ כָּל א' חָלַם חֲלוֹם שְׁנֵיהֶם – שֶׁחָלַם אֶת חֲלוֹמוֹ וּפִתְרוֹן חֲבֵרוֹ, וְזֶהוּ שֶׁנֶּאֱמַר וַיַּרְא שַׂר הָאֹפִים כִּי טוֹב פָּתָר:", "rashi_en": "רש\"י נותן שני פירושים. לפי הפשט, שניהם חלמו חלום. לפי המדרש, כל אחד חלם את חלומו שלו ואת פתרון חלום חברו, ולכן שר האופים ידע שיוסף פתר נכון.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ שֶׁרַשׁ\"י מֵבִיא, מַה חָלַם כָּל אֶחָד מֵהֶם?", "options": ["אֶת חֲלוֹמוֹ שֶׁלּוֹ וְאֶת פִּתְרוֹן חֲלוֹם חֲבֵרוֹ", "אֶת חֲלוֹמוֹ שֶׁלּוֹ בִּלְבַד אַךְ בְּצוּרָה כְּפוּלָה", "אֶת חֲלוֹם חֲבֵרוֹ בִּלְבַד וְלֹא אֶת שֶׁלּוֹ"], "kasha": "מדוע כתוב 'חלום שניהם' ולא 'שניהם חלום', ומה המשמעות המיוחדת של סדר המילים הזה?", "answer": "לפי המדרש, כל אחד חלם את חלומו שלו ואת פתרון חלום חברו, ולכן שר האופים ראה שיוסף פתר נכון.", "kp": ["כל א' חלם חלום שניהם", "שחלם את חלומו ופתרון חברו", "וירא שר האפים כי טוב פתר"]}]}, {"id": "40:5.2", "ch": 40, "v": 5, "n": 2, "dh": "איש כפתרון חלומו", "pasuk_html": "וַיַּֽחַלְמוּ֩ חֲל֨וֹם שְׁנֵיהֶ֜ם אִ֤ישׁ חֲלֹמוֹ֙ בְּלַ֣יְלָה אֶחָ֔ד <mark>אִ֖ישׁ כְּפִתְר֣וֹן חֲלֹמ֑וֹ</mark> הַמַּשְׁקֶ֣ה וְהָאֹפֶ֗ה אֲשֶׁר֙ לְמֶ֣לֶךְ מִצְרַ֔יִם אֲשֶׁ֥ר אֲסוּרִ֖ים בְּבֵ֥ית הַסֹּֽהַר׃", "pasuk_en": "וַיַּחַלְמוּ חֲלוֹם שְׁנֵיהֶם אִישׁ חֲלֹמוֹ בְּלַיְלָה אֶחָד אִישׁ כְּפִתְרוֹן חֲלֹמוֹ הַמַּשְׁקֶה וְהָאֹפֶה אֲשֶׁר לְמֶלֶךְ מִצְרַיִם אֲשֶׁר אֲסוּרִים בְּבֵית הַסֹּהַר׃", "rashi_he": "איש כפתרון חלומו. כָּל אֶחָד חָלַם חֲלוֹם הַדּוֹמֶה לְפִתְרוֹן הֶעָתִיד לָבֹא עֲלֵיהֶם:", "rashi_en": "רש\"י מסביר שכל אחד חלם חלום שהיה דומה לפתרון שעתיד היה להתקיים בו.", "note": "", "points": [{"q": "מַה מְסַבֵּיר רַשִׁ\"י בַּמִּילִּים 'אִישׁ כְּפִתְרוֹן חֲלֹומוֹ'?", "options": ["כָּל אֶחָד חָלַם חֲלוֹם הַדּוֹמֶה לְפִתְרוֹן שֶׁעָתִיד לָבוֹא עָלָיו", "כָּל אֶחָד פָּתַר בְּעַצְמוֹ אֶת חֲלוֹם חֲבֵרוֹ", "כָּל אֶחָד חָלַם חֲלוֹם שֶׁמַּשְׁמָעוּתוֹ נִסְתֶּרֶת לְגַמְרֵי"], "kasha": "מה פירוש הביטוי 'כפתרון חלומו' — מה הקשר בין החלום לפתרון?", "answer": "כל אחד חלם חלום שהיה דומה ומתאים לפתרון העתיד לבוא עליו.", "kp": ["חלום הדומה לפתרון העתיד לבא עליהם"]}]}, {"id": "40:6.1", "ch": 40, "v": 6, "n": 1, "dh": "זעפים", "pasuk_html": "וַיָּבֹ֧א אֲלֵיהֶ֛ם יוֹסֵ֖ף בַּבֹּ֑קֶר וַיַּ֣רְא אֹתָ֔ם וְהִנָּ֖ם <mark>זֹעֲפִֽים׃</mark>", "pasuk_en": "וַיָּבֹא אֲלֵיהֶם יוֹסֵף בַּבֹּקֶר וַיַּרְא אֹתָם וְהִנָּם זֹעֲפִים׃", "rashi_he": "זעפים. עֲצֵבִים כְּמוֹ סַר וְזָעֵף (מלכים א כ'), זַעַף ה' אֶשָּׂא (מיכה ז'):", "rashi_en": "רש\"י מפרש שהמילה 'זעפים' פירושה עצובים, ומביא ראיות מפסוקים נוספים.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ\"י אֶת הַמִּילָּה 'זֹעֲפִים'?", "options": ["עֲצַבִּים, כְּמוֹ 'סַר וְזָעֵף'", "כּוֹעֲסִים עַל יוֹסֵף", "מְבֹוהָלִים וּמְפֻוחָדִים מְאֹוד"], "kasha": "מהי משמעות המילה 'זעפים' בפסוק?", "answer": "רש\"י מפרש ש'זעפים' פירושו עצבים, ומביא ראיה מ'סר וזעף' ומ'זעף ה' אשא'.", "kp": ["עצבים"]}]}, {"id": "40:10.1", "ch": 40, "v": 10, "n": 1, "dh": "שריגם", "pasuk_html": "וּבַגֶּ֖פֶן שְׁלֹשָׁ֣ה <mark>שָׂרִיגִ֑ם</mark> וְהִ֤יא כְפֹרַ֙חַת֙ עָלְתָ֣ה נִצָּ֔הּ הִבְשִׁ֥ילוּ אַשְׁכְּלֹתֶ֖יהָ עֲנָבִֽים׃", "pasuk_en": "וּבַגֶּפֶן שְׁלֹשָׁה שָׂרִיגִם וְהִיא כְפֹרַחַת עָלְתָה נִצָּהּ הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים׃", "rashi_he": "שריגם. זְמוֹרוֹת אֲרוּכוֹת, שֶׁקּוֹרִין ווידי\"ץ בְּלַעַז:", "rashi_en": "רש\"י מסביר ש'שריגים' הם זמורות ארוכות של הגפן.", "note": "", "points": [{"q": "מַהֵם 'שָׂרִיגִים' לְפִי רַשׁ\"י?", "options": ["זְמוֹרוֹת אֲרֻוכּוֹת שֶׁל הַגֶּפֶן", "אֶשְׁכֹּולוֹת עֲנָבִים קְטַנִּים", "עָלִים רְחָבִים שֶׁל הַגֶּפֶן"], "kasha": "מהי משמעות המילה 'שריגים' שאינה מוכרת?", "answer": "רש\"י מפרש ש'שריגים' הם זמורות ארוכות.", "kp": ["זמורות ארוכות"]}]}, {"id": "40:10.2", "ch": 40, "v": 10, "n": 2, "dh": "והוא כפרחת", "pasuk_html": "וּבַגֶּ֖פֶן שְׁלֹשָׁ֣ה שָׂרִיגִ֑ם <mark>וְהִ֤יא כְפֹרַ֙חַת֙</mark> עָלְתָ֣ה נִצָּ֔הּ הִבְשִׁ֥ילוּ אַשְׁכְּלֹתֶ֖יהָ עֲנָבִֽים׃", "pasuk_en": "וּבַגֶּפֶן שְׁלֹשָׁה שָׂרִיגִם וְהִיא כְפֹרַחַת עָלְתָה נִצָּהּ הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים׃", "rashi_he": "והוא כפרחת. דּוֹמֶה לְפוֹרַחַת וְהִיא כְפוֹרַחַת – נִדְמָה לִי בַּחֲלוֹמִי כְאִלּוּ הִיא פוֹרַחַת, וְאַחַר הַפֶּרַח עָלְתָה נִצָּה, וְנַעֲשׂוּ סְמָדַר, אשפנ\"יר בְּלַעַז, וְאַחַר כָּךְ הִבְשִׁילוּ, וְהִיא כַּד אַפְרַחַת אַפֵּקַת לַבְלְבִין עַ\"כַּ תַּרְגּוּם שֶׁל פּוֹרַחַת נֵץ גָּדוֹל מִפֶּרַח כְּדִכְתִיב וּבֹסֶר גֹּמֵל יִהְיֶה נִצָּה (ישעיהו י\"ח), וּכְתִיב וַיֹּצֵא פֶרַח, וַהֲדַר וַיָּצֵץ צִיץ (במדבר י\"ז):", "rashi_en": "רש\"י מסביר את שלבי הגדילה שהיו בחלום: קודם פרחה הגפן, אחר כך עלתה נצה (סמדר), ואחר כך הבשילו הענבים. הוא מבהיר שנץ הוא שלב גדול יותר מפרח, ומביא ראיות מפסוקים.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַהוּ הַסֵּדֶר הַנָּכוֹן שֶׁל שְׁלָבֵי הַגְּדִילָה בַּחֲלוֹם?", "options": ["פְּרִיחָה, נֵץ (סְמָדַר), וְאַחַר כָּךְ הַבְשָׁלַת עֲנָבִים", "נֵץ, פְּרִיחָה, וְאַחַר כָּךְ הַבְשָׁלַת עֲנָבִים", "הַבְשָׁלַת עֲנָבִים, פְּרִיחָה, וְאַחַר כָּךְ נֵץ"], "kasha": "לא ברור מהפסוק מה היחס בין פריחה לנץ ומה סדר השלבים.", "answer": "רש\"י מסביר שקודם היתה פריחה, אחר כך עלתה נצה שהיא סמדר, ואחר כך הבשילו הענבים. נץ גדול מפרח.", "kp": ["ואחר הפרח עלתה נצה ונעשו סמדר", "נץ גדול מפרח"]}]}, {"id": "40:11.1", "ch": 40, "v": 11, "n": 1, "dh": "ואשחט", "pasuk_html": "וְכ֥וֹס פַּרְעֹ֖ה בְּיָדִ֑י וָאֶקַּ֣ח אֶת־הָֽעֲנָבִ֗ים <mark>וָֽאֶשְׂחַ֤ט</mark> אֹתָם֙ אֶל־כּ֣וֹס פַּרְעֹ֔ה וָאֶתֵּ֥ן אֶת־הַכּ֖וֹס עַל־כַּ֥ף פַּרְעֹֽה׃", "pasuk_en": "וְכוֹס פַּרְעֹה בְּיָדִי וָאֶקַּח אֶת־הָעֲנָבִים וָאֶשְׂחַט אֹתָם אֶל־כּוֹס פַּרְעֹה וָאֶתֵּן אֶת־הַכּוֹס עַל־כַּף פַּרְעֹה׃", "rashi_he": "ואשחט. כְּתַרְגּוּמוֹ וַעֲצָרִית, וְהַרְבֵּה יֵשׁ בִּלְשׁוֹן מִשְׁנָה:", "rashi_en": "רש\"י מפרש ש\"ואשחט\" פירושו סחיטה, כתרגום אונקלוס \"ועצרית\", ומציין שמילה זו שכיחה בלשון המשנה.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ\"י אֶת הַמִּילָּה \"וָאֶשְׁחַט\"?", "options": ["סָחַטְתִּי, כְּתַרְגּוּם אוּנְקְלוֹס \"וְעַצְרִית\"", "שָׁחַטְתִּי, כְּלוֹמַר חָתַכְתִּי אֶת הָעֲנָבִים", "מָעַכְתִּי, כְּלוֹמַר רִיסַּקְתִּי אוֹתָם בַּיָּד"], "kasha": "המילה \"ואשחט\" עלולה להתפרש כשחיטה או חיתוך, ולא ברור שמדובר בסחיטה.", "answer": "רש\"י מפרש שפירוש \"ואשחט\" הוא סחיטה, כתרגום אונקלוס \"ועצרית\", ומוסיף שהמילה מצויה בלשון המשנה.", "kp": ["כתרגומו ועצרית"]}]}, {"id": "40:12.1", "ch": 40, "v": 12, "n": 1, "dh": "שלשת ימים הם", "pasuk_html": "וַיֹּ֤אמֶר לוֹ֙ יוֹסֵ֔ף זֶ֖ה פִּתְרֹנ֑וֹ שְׁלֹ֙שֶׁת֙ הַשָּׂ֣רִגִ֔ים <mark>שְׁלֹ֥שֶׁת יָמִ֖ים הֵֽם׃</mark>", "pasuk_en": "וַיֹּאמֶר לוֹ יוֹסֵף זֶה פִּתְרֹנוֹ שְׁלֹשֶׁת הַשָּׂרִגִים שְׁלֹשֶׁת יָמִים הֵם׃", "rashi_he": "שלשת ימים הם. סִימָן הֵם לְךָ לִשְׁלֹ
