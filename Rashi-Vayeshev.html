י אתך", "כפתרוני"]}]}, {"id": "40:14.2", "ch": 40, "v": 14, "n": 2, "dh": "ועשית נא עמדי חסד", "pasuk_html": "כִּ֧י אִם־זְכַרְתַּ֣נִי אִתְּךָ֗ כַּאֲשֶׁר֙ יִ֣יטַב לָ֔ךְ <mark>וְעָשִֽׂיתָ־נָּ֥א עִמָּדִ֖י חָ֑סֶד</mark> וְהִזְכַּרְתַּ֙נִי֙ אֶל־פַּרְעֹ֔ה וְהוֹצֵאתַ֖נִי מִן־הַבַּ֥יִת הַזֶּֽה׃", "pasuk_en": "כִּי אִם־זְכַרְתַּנִי אִתְּךָ כַּאֲשֶׁר יִיטַב לָךְ וְעָשִׂיתָ־נָּא עִמָּדִי חָסֶד וְהִזְכַּרְתַּנִי אֶל־פַּרְעֹה וְהוֹצֵאתַנִי מִן־הַבַּיִת הַזֶּה׃", "rashi_he": "ועשית נא עמדי חסד. אֵין נָא אֶלָּא לְשׁוֹן בַּקָּשָׁה:", "rashi_en": "רש״י מבאר שהמילה \"נא\" היא לשון בקשה, כלומר יוסף מתחנן ומבקש מלפני שר המשקים.", "note": "", "points": [{"q": "מַהִי מַשְׁמָעוּת הַמִּילָּה \"נָּא\" לְפִי רַשׁ״י?", "options": ["לְשׁוֹן בַּקָּשָׁה", "לָשׁוֹן צִיוּוּי", "לָשׁוֹן שְׁבוּעָה"], "kasha": "יש לבאר את תפקיד המילה \"נא\" בפסוק.", "answer": "רש״י מפרש שהמילה \"נא\" היא לשון בקשה, כלומר יוסף מתחנן.", "kp": ["אין נא אלא לשון בקשה"]}]}, {"id": "40:16.1", "ch": 40, "v": 16, "n": 1, "dh": "סלי חורי", "pasuk_html": "וַיַּ֥רְא שַׂר־הָאֹפִ֖ים כִּ֣י ט֣וֹב פָּתָ֑ר וַיֹּ֙אמֶר֙ אֶל־יוֹסֵ֔ף אַף־אֲנִי֙ בַּחֲלוֹמִ֔י וְהִנֵּ֗ה שְׁלֹשָׁ֛ה <mark>סַלֵּ֥י חֹרִ֖י</mark> עַל־רֹאשִֽׁי׃", "pasuk_en": "וַיַּרְא שַׂר־הָאֹפִים כִּי טוֹב פָּתָר וַיֹּאמֶר אֶל־יוֹסֵף אַף־אֲנִי בַּחֲלוֹמִי וְהִנֵּה שְׁלֹשָׁה סַלֵּי חֹרִי עַל־רֹאשִׁי׃", "rashi_he": "סלי חורי. סַלִּים שֶׁל נְצָרִים קְלוּפִים חוֹרִין חוֹרִין, וּבִמְקוֹמֵנוּ יֵשׁ הַרְבֵּה, וְדֶרֶךְ מוֹכְרֵי פַת כִּסָּנִין, שֶׁקּוֹרִין אובל\"יש בְּלַעַז, לְתִתָּם בְּאוֹתָם סַלִּים:", "rashi_en": "רש״י מפרש ש\"סלי חורי\" הם סלים העשויים מנצרים קלופים ויש בהם חורים רבים. סלים אלה נפוצים ומוכרי מאפים משתמשים בהם.", "note": "", "points": [{"q": "מַהֵם \"סַלֵּי חֹורִי\" לְפִי רַשׁ״י?", "options": ["סַלֵּי נְצָרִים קְלוּפִים שֶׁיֵּשׁ בָּהֶם חוֹרִים רַבִּים", "סַלִּים חֲדָשִׁים לְבָנִים עֲשׂוּיִים חֶרֶס", "סַלִּים גְּדוֹלִים וּמְכֻוסִּים לִשְׁמִירַת לֶחֶם"], "kasha": "הביטוי \"סלי חורי\" אינו מובן מאליו וצריך לפרש ממה הסלים עשויים ומה טיבם.", "answer": "רש״י מפרש שהם סלים של נצרים קלופים שיש בהם חורים, ודרך מוכרי מאפים לתת את סחורתם בסלים כאלה.", "kp": ["סלים של נצרים קלופים חורין חורין", "דרך מוכרי פת כסנין"]}]}, {"id": "40:20.1", "ch": 40, "v": 20, "n": 1, "dh": "יום הלדת את פרעה", "pasuk_html": "וַיְהִ֣י ׀ בַּיּ֣וֹם הַשְּׁלִישִׁ֗י <mark>י֚וֹם הֻלֶּ֣דֶת אֶת־פַּרְעֹ֔ה</mark> וַיַּ֥עַשׂ מִשְׁתֶּ֖ה לְכָל־עֲבָדָ֑יו וַיִּשָּׂ֞א אֶת־רֹ֣אשׁ ׀ שַׂ֣ר הַמַּשְׁקִ֗ים וְאֶת־רֹ֛אשׁ שַׂ֥ר הָאֹפִ֖ים בְּת֥וֹךְ עֲבָדָֽיו׃", "pasuk_en": "וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה וַיַּעַשׂ מִשְׁתֶּה לְכָל־עֲבָדָיו וַיִּשָּׂא אֶת־רֹאשׁ שַׂר הַמַּשְׁקִים וְאֶת־רֹאשׁ שַׂר הָאֹפִים בְּתוֹךְ עֲבָדָיו׃", "rashi_he": "יום הלדת את פרעה. יוֹם לֵידָתוֹ, וְקוֹרִין לוֹ יוֹם גֵּינוּסְיָא. וּלְשׁוֹן הֻלֶּדֶת, לְפִי שֶׁאֵין הַוָּלָד נוֹצָר אֶלָּא עַל יְדֵי אֲחֵרִים, שֶׁהַחַיָּה מְיַלֶּדֶת אֶת הָאִשָּׁה, וְעַל כֵּן הַחַיָּה נִקְרֵאת מְיַלֶּדֶת, וְכֵן וּמוֹלְדוֹתַיִךְ בְּיוֹם הוּלֶּדֶת אוֹתָךְ (יחזקאל ט\"ז) וְכֵן אַחֲרֵי הֻכַּבֵּס אֶת הַנֶּגַע (ויקרא י\"ג), שֶׁכִּבּוּסוֹ עַל יְדֵי אֲחֵרִים:", "rashi_en": "רש״י מסביר שהמילה \"הלדת\" היא בלשון הופעל, כי התינוק לא נולד בכוחות עצמו אלא על ידי אחרים — המילדת שמיילדת את האשה. לכן נקט הכתוב לשון שמשמעה 'הולדה על ידי אחרים'.", "note": "", "points": [{"q": "מַדּוּעַ הַכָּתוּב מִשְׁתַּמֵּשׁ בְּלָשׁוֹן \"הֻלֶּדֶת\" וְלֹא \"לֵידַת\"?", "options": ["כִּי הַווָּלָד נוֹלַד עַל יְדֵי אֲחֵרִים — הַמְיַלֶּדֶת מְיַיֶּלֶדֶת אֶת הָאִשָּׁה", "כִּי הַמִּילָה מִתְייַחֶסֶת לַחֲגִיגָה שֶׁעוֹרְכִים אֲחֵרִים לִכְבוֹד הַנּוֹלָד", "כִּי הַלֵּידָה נִגְזְרָה עַל יְדֵי הַקב״ה וְלֹא בִּידֵי אָדָם"], "kasha": "מדוע נקט הכתוב לשון \"הלדת\" (הופעל) ולא \"לידת\"?", "answer": "הוולד אינו נוצר אלא על ידי אחרים, שהמילדת מיילדת את האשה, ולכן נקט לשון שמשמעה פעולה הנעשית בידי אחרים.", "kp": ["שאין הולד נוצר אלא על ידי אחרים", "שהחיה מילדת את האשה"]}]}, {"id": "40:20.2", "ch": 40, "v": 20, "n": 2, "dh": "וישא את ראש וגו'", "pasuk_html": "וַיְהִ֣י ׀ בַּיּ֣וֹם הַשְּׁלִישִׁ֗י י֚וֹם הֻלֶּ֣דֶת אֶת־פַּרְעֹ֔ה וַיַּ֥עַשׂ מִשְׁתֶּ֖ה לְכָל־עֲבָדָ֑יו <mark>וַיִּשָּׂ֞א אֶת־רֹ֣אשׁ</mark> ׀ שַׂ֣ר הַמַּשְׁקִ֗ים וְאֶת־רֹ֛אשׁ שַׂ֥ר הָאֹפִ֖ים בְּת֥וֹךְ עֲבָדָֽיו׃", "pasuk_en": "וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה וַיַּעַשׂ מִשְׁתֶּה לְכָל־עֲבָדָיו וַיִּשָּׂא אֶת־רֹאשׁ שַׂר הַמַּשְׁקִים וְאֶת־רֹאשׁ שַׂר הָאֹפִים בְּתוֹךְ עֲבָדָיו׃", "rashi_he": "וישא את ראש וגו'. מְנָאָם עִם שְׁאָר עֲבָדָיו, שֶׁהָיָה מוֹנֶה הַמְּשָׁרְתִים שֶׁיְּשָׁרְתוּ לוֹ בִּסְעוּדָתוֹ וְזָכַר אֶת אֵלּוּ בְתוֹכָם, כְּמוֹ שְׂאוּ אֶת רֹאשׁ (במדבר א'), לְשׁוֹן מִנְיָן:", "rashi_en": "רש״י מסביר ש\"וישא את ראש\" פירושו מנה אותם, כמו \"שאו את ראש\" בספר במדבר. פרעה מנה את המשרתים לסעודתו וזכר את שר המשקים ושר האופים ביניהם.", "note": "", "points": [{"q": "מַהוּ פֵּירוּשׁ \"וַיִּשָּׂא אֶת־רֹאשׁ\" לְפִי רַשׁ״י?", "options": ["מָנָה אוֹתָם יַחַד עִם שְׁאָר עֲבָדָיו לְצֹורֶךְ הַסְּעוּדָה", "נָשָׂא אֶת כְּבוֹדָם וְהֶחְזִירָם לְתַפְקִידָם הַקּוֹדֵם", "חָשַׁב עֲלֵיהֶם וְהֶחְלִיט מַה יֵיעָשֶׂה בָּהֶם"], "kasha": "מהו פירוש הביטוי \"וישא את ראש\" בהקשר הזה?", "answer": "פרעה מנה את עבדיו המשרתים בסעודתו, וזכר את שר המשקים ושר האופים בתוכם. \"נשיאת ראש\" היא לשון מנין.", "kp": ["מנאם עם שאר עבדיו", "לשון מנין"]}]}, {"id": "40:23.1", "ch": 40, "v": 23, "n": 1, "dh": "ולא זכר שר המשקים", "pasuk_html": "<mark>וְלֹֽא־זָכַ֧ר שַֽׂר־הַמַּשְׁקִ֛ים</mark> אֶת־יוֹסֵ֖ף וַיִּשְׁכָּחֵֽהוּ׃ (פ)", "pasuk_en": "וְלֹא־זָכַר שַׂר־הַמַּשְׁקִים אֶת־יוֹסֵף וַיִּשְׁכָּחֵהוּ׃", "rashi_he": "ולא זכר שר המשקים. בּוֹ בַיּוֹם:", "rashi_en": "רש״י מדייק ש\"ולא זכר\" מתייחס לאותו יום עצמו — ביום שהוחזר לתפקידו לא זכר שר המשקים את יוסף.", "note": "", "points": [{"q": "לְמָתַי מִתְייַּחֵס \"וְלֹא־זָכַר\" לְפִי רַשׁ״י?", "options": ["לְאוֹתוֹ יוֹם שֶׁבּוֹ הוּחְזַר שַׂר הַמַּשְׁקִים לְתַפְקִידוֹ", "לְכָל תְּקוּפַת הַשְּׁנָתַייִם שֶׁיּוֹסֵף נוֹתַר בְּבֵית הַסֹּוהַר", "לַיּוֹם שֶׁבּוֹ חָלַם פַּרְעֹה אֶת חֲלוֹמוֹתָיו"], "kasha": "מדוע הכתוב אומר גם \"ולא זכר\" וגם \"וישכחהו\" — מה מוסיף כל ביטוי?", "answer": "\"ולא זכר\" מתייחס לאותו יום עצמו — בו ביום לא זכר את יוסף.", "kp": ["בו ביום"]}]}, {"id": "40:23.2", "ch": 40, "v": 23, "n": 2, "dh": "וישכחהו", "pasuk_html": "וְלֹֽא־זָכַ֧ר שַֽׂר־הַמַּשְׁקִ֛ים אֶת־יוֹסֵ֖ף <mark>וַיִּשְׁכָּחֵֽהוּ׃</mark> (פ)", "pasuk_en": "וְלֹא־זָכַר שַׂר־הַמַּשְׁקִים אֶת־יוֹסֵף וַיִּשְׁכָּחֵהוּ׃", "rashi_he": "וישכחהו. לְאַחַר מִכָּאן. מִפְּנֵי שֶׁתָּלָה בוֹ יוֹסֵף לְזָכְרוֹ, הֻזְקַק לִהְיוֹת אָסוּר שְׁתֵּי שָׁנִים, שֶׁנֶּאֱמַר אַשְׁרֵי הַגֶּבֶר אֲשֶׁר שָׂם ה' מִבְטַחוֹ וְלֹא פָנָה אֶל רְהָבִים (תהילים מ') – וְלֹא בָטַח עַל מִצְרִים, הַקְּרוּיִים רַהַב:", "rashi_en": "רש״י מסביר ש\"וישכחהו\" מתייחס לאחר מכן. מכיוון שיוסף תלה ביטחונו בשר המשקים, נענש ונאסר עוד שנתיים. רש״י מביא ראיה מתהלים: \"אשרי הגבר אשר שם ה׳ מבטחו\" — שלא בטח במצרים הקרויים \"רהבים\".", "note": "", "points": [{"q": "מַדּוּעַ נֶעֱנַשׁ יוֹסֵף בְּשָׁנְתַּיִים נוֹסָפוֹת שֶׁל מַאֲסָר?", "options": ["מִפְּנֵי שֶׁתָּלָה בִּיטְחוֹנוֹ בְּשַׂר הַמַּשְׁקִים בִּמְקוֹם בַּה׳", "מִפְּנֵי שֶׁפָּתַר אֶת הַחֲלוֹמוֹת בְּלִי רְשׁוּת פַּרְעֹה", "מִפְּנֵי שֶׁדִּיבֵּר לָשׁוֹן הָרַע עַל שַׂר הָאוֹפִים"], "kasha": "מדוע הוסיף הכתוב \"וישכחהו\" לאחר שכבר נאמר \"ולא זכר\"?", "answer": "\"וישכחהו\" מתייחס לאחר מכן. בגלל שיוסף תלה ביטחונו בשר המשקים, נגזר עליו להיאסר שנתיים נוספות, שנאמר \"אשרי הגבר אשר שם ה׳ מבטחו\".", "kp": ["מפני שתלה בו יוסף לזכרו", "ולא בטח על מצרים הקרויים רהב"]}]}];
const EN = {"37:1.1":{"e":"Rashi explains why the Torah elaborates on the descendants of Jacob and is brief about the descendants of Esau: because the descendants of Jacob are important before God. He compares this to a pearl that fell in sand — you sift through the sand until you find it, then throw the rest away. In another interpretation, Rashi brings the parable of the flax worker and the charcoal maker: Jacob wondered who could defeat all the chiefs of Esau, and the answer is that one spark from Joseph burns them all.","pe":"Yaakov settled in the land of his father’s residence, in the land of Canaan.","re":"Yaakov settled, etc. After it [Scripture] has written for you concerning the settlements of Eisov and his descendants in a concise manner— because they were neither notable nor important enough to warrant a detailed explanation of how they settled, or the narrative of their wars by which they drove out the Chorites; it now proceeds to detail for you the settlements of Yaakov and his descendants at length and the sequence of events which were their cause. Because they are esteemed before God, they deserve to be discussed at length. You also find [this, concerning] the ten generations from Adam to Noach: “So-and-so gave birth to so-and-so.” But, when it came to Noach [Scripture] discussed him at length. Similarly, concerning the ten generations from Noach till Avraham [Scripture] speaks of them in concise terms, and when [the narrative] reaches Avraham it discusses him at length. This is comparable to a jewel that has fallen into the sand. A person searches the sand and sifts it through a sieve until he finds the jewel. Once he finds the jewel, he discards the pebbles from his hand and takes hold of the jewel. (Another explanation of “Yaakov settled:” [There was once] a particular flax dealer whose camels arrived laden with flax. The blacksmith wondered: “Where will all this flax be stored?” There was a wise man there who responded: “Just one spark that goes out from your bellows burns all of it.” Likewise, Yaakov saw all the chiefs [of Eisov] that are enumerated above. he wondered and said: “Who is it that could vanquish them all?” What is written later? “This the history of Yaakov, Yoseif.” For it is written: “The House of Yaakov shall be a fire and the House of Yoseif a flame and the House of Eisov straw.” [I.e.,] a spark will go out from Yoseif and consume them all. From an old edition of Rashi.)","p":[{"q":"According to Rashi, why does the Torah elaborate on the descendants of Jacob and is brief about the descendants of Esau?","o":["Because the descendants of Jacob are important before God, and it is therefore fitting to elaborate on them","Because the descendants of Esau had already been told in the Book of Chronicles of Seir","Because the descendants of Jacob include more events and wars than the descendants of Esau"]},{"q":"In the parable of the flax worker and the charcoal maker, what does the spark coming out of the bellows represent?","o":["Joseph, from whom comes the power to destroy Esau, as it says וּבֵית יוֹסֵף לֶהָבָה","Jacob himself, who fought Esau's angel and defeated him","The Torah, in whose merit Jacob overcame the chiefs of Esau"]}]},"37:2.1":{"e":"Rashi explains why the verse says \"תּוֹלְדוֹת יַעֲקֹב יוֹסֵף\" — according to the plain meaning, Joseph is the primary reason they went down to Egypt. According to the Midrash, the verse connects Jacob's descendants to Joseph because Jacob worked for Laban for the sake of Rachel, and Joseph's appearance resembled his, and everything that happened to Jacob also happened to Joseph. It is also interpreted: Jacob sought to live in peace and the trouble of Joseph jumped upon him.","pe":"This is the history of Yaakov; Yoseif at the age of seventeen years, would tend the sheep with his brothers, and the lad was with the sons of Bilhah, and the sons of Zilpah, his father’s wives. Yoseif brought back bad reports about them to their father.","re":"This is the history of Yaakov. [Meaning:] This is the history of the children of Yaakov. These are their settlements, and occurrences until they came to their ultimate settlement. The first cause is: “Yoseif at the age of seventeen years.” As a result of this it came about that they went down to Egypt. This follows the plain explanation of Scripture so as to place all phrases in perspective. The Midrash, however, explains [it differently]: Scripture identifies Yaakov’s children as Yoseif for several reasons. First, Yaakov’s entire purpose in working for Lavan was only for the sake of Rochel. [Secondly,] Yoseif’s facial features resembled his [Yaakov’s]. [Also,] everything that happened to Yaakov happened [in similar fashion] to Yoseif: This one was hated, and the other was hated; This one’s brother is seeking to kill him, and the other’s brothers are seeking to kill him. There are many other examples in Bereishis Rabbah. Another Midrashic exposition: “[Yaakov] settled.” Yaakov was seeking to be settled in tranquility, when the troubles of Yoseif were thrust upon him. [Whenever] the righteous seek to be settled in tranquility, God says, “Is it not sufficient for the righteous [to have] what has been prepared for them in the World-to-Come that they should also want to be settled in tranquility in this world?","p":[{"q":"According to the plain meaning, why does the verse say \"תּוֹלְדוֹת יַעֲקֹב יוֹסֵף\"?","o":["Because Joseph is the primary cause that brought about the descent to Egypt","Because Joseph was the firstborn of Rachel and it is therefore fitting to mention him first","Because Joseph was the greatest righteous one among all of Jacob's sons"]},{"q":"According to the Midrash, why did \"the trouble of Joseph jump upon him\" when Jacob sought to live in peace?","o":["God said that the righteous should not seek peace in this world — it is enough for them in the World to Come","Jacob sinned by favoring Joseph over his other sons, and this was his punishment","Joseph was not yet ready to reign, and therefore suffering was decreed upon him"]}]},"37:2.2":{"e":"Rashi explains that the verse calls Joseph \"נַעַר\" because he acted in a youthful, vain way: styling his hair and touching up his eyes to appear handsome.","pe":"This is the history of Yaakov; Yoseif at the age of seventeen years, would tend the sheep with his brothers, and the lad was with the sons of Bilhah, and the sons of Zilpah, his father’s wives. Yoseif brought back bad reports about them to their father.","re":"And the lad. He did things that were childish, he fixed his hair, and touched-up his eyes so that he should appear handsome.","p":[{"q":"According to Rashi, why does the verse call Joseph \"נַעַר\"?","o":["Because he acted in a youthful, vain way — styling his hair and touching up his eyes to appear handsome","Because he was younger than all his brothers and was therefore not yet considered a man","Because he served his older brothers and brought them food in the field"]}]},"37:2.3":{"e":"Rashi explains that Joseph used to spend time with the sons of Bilhah, because his brothers (the sons of Leah) would look down on them and Joseph would draw them close.","pe":"This is the history of Yaakov; Yoseif at the age of seventeen years, would tend the sheep with his brothers, and the lad was with the sons of Bilhah, and the sons of Zilpah, his father’s wives. Yoseif brought back bad reports about them to their father.","re":"With the sons of Bilhah. Meaning that he associated with the sons of Bilhah because his brothers would demean them but, he [Yoseif] would be close with them.","p":[{"q":"According to Rashi, why did Joseph specifically spend time with the sons of Bilhah?","o":["Because his brothers would look down on them and Joseph would draw them close","Because the sons of Bilhah were close to him in age and were his friends","Because Jacob commanded him to tend the flock together with them"]}]},"37:2.4":{"e":"Joseph told his father three bad things about his brothers the sons of Leah: that they ate a limb from a living animal, that they mocked the sons of the maidservants and called them slaves, and that they were suspected of immorality. For each of these bad reports, Joseph was punished measure for measure.","pe":"This is the history of Yaakov; Yoseif at the age of seventeen years, would tend the sheep with his brothers, and the lad was with the sons of Bilhah, and the sons of Zilpah, his father’s wives. Yoseif brought back bad reports about them to their father.","re":"Bad reports about them. Any wrong that he would see in his brothers, the sons of Leah, he would relate to his father: that they ate from the limbs of living animals, and that they demeaned the sons of the hand maidens by calling them “slaves,” and that they are suspect in illicit relationships. He [Yoseif] was, in, turn, smitten by these three: 1) “They slaughtered a goat” when he was sold, and they did not eat it while it was alive. 2) For the slander he related about them that they called their brothers “slaves,” Yoseif was sold as a slave. 3) For the illicit relationship that he related about them “His master’s wife cast her [eyes], etc.”","p":[{"q":"According to Rashi, how was Joseph punished for the bad reports he told about his brothers?","o":["Measure for measure: for each report he was punished in the corresponding matter","He was punished only for one report — that he was sold as a slave","He was not punished at all; rather his brothers were punished for their actions"]},{"q":"According to Rashi, about whom did Joseph tell bad reports?","o":["About his brothers the sons of Leah","About the sons of Bilhah and the sons of Zilpah","About all his brothers without distinction"]}]},"37:2.5":{"e":"Rashi explains that the word 'דִּבָּה' means gossip — any bad thing Joseph could say about his brothers, he said.","pe":"This is the history of Yaakov; Yoseif at the age of seventeen years, would tend the sheep with his brothers, and the lad was with the sons of Bilhah, and the sons of Zilpah, his father’s wives. Yoseif brought back bad reports about them to their father.","re":"Bad reports Wherever the term דִבָּה appears it is parladiz in O.F. [gossip]. Whatever bad he could say of them he would relate.","p":[{"q":"How does Rashi define the word 'דִּבָּה'?","o":["Gossip — any evil thing he could tell, he told","A complete lie he made up about his brothers","A justified complaint he presented to his father"]}]},"37:2.6":{"e":"Rashi connects the word 'דִּבָּה' to the root ד-ב-ב, as in 'דּוֹבֵב שִׂפְתֵי יְשֵׁנִים' — a language of speech.","pe":"This is the history of Yaakov; Yoseif at the age of seventeen years, would tend the sheep with his brothers, and the lad was with the sons of Bilhah, and the sons of Zilpah, his father’s wives. Yoseif brought back bad reports about them to their father.","re":"Dibah. Has the same meaning as [דוֹבֵב] in: “He makes speak the lips of the sleeping.”","p":[{"q":"From which root is the word 'דִּבָּה' derived according to Rashi?","o":["From the language of 'דּוֹבֵב שִׂפְתֵי יְשֵׁנִים' — the root of speech","From the word 'דֹּב' (bear) — like an animal that preys in secret","From the word 'דַּאֲבָה' — sorrow and pain"]}]},"37:3.1":{"e":"Rashi brings three interpretations of the phrase 'בֶּן זְקֻנִים': that he was born to Jacob in his old age; that he was a wise son who learned from him the Torah of Shem and Ever; and that Joseph's face resembled Jacob's face.","pe":"Yisrael loved Yoseif more than any of his sons, for he was a son of his old age to him, and he made him a long, colorful cloak.","re":"Son of his old age. 1) Because he was born to him in his old age. 2) Onkelos translates it: “He was a wise son to him,” [because] all that he [Yaakov] had learned from Sheim and Eiver, he transmitted to him [Yoseif]. 3) Another explanation: That his [Yoseif’s] facial features were identical to his [Yaakov’s].","p":[{"q":"How does Onkelos translate 'בֶּן זְקֻנִים' according to Rashi?","o":["בַּר חֲכִים — a wise son who received the Torah of Shem and Ever","בַּר סֵיב — a son born in old age","בַּר רְחִים — a beloved and cherished son"]},{"q":"What is the third interpretation Rashi brings for 'בֶּן זְקֻנִים'?","o":["That Joseph's face resembled Jacob's face","That Joseph cared for Jacob in his old age","That Joseph acted like a wise elder despite his age"]}]},"37:3.2":{"e":"Rashi gives two explanations for the word פַּסִּים: According to the plain meaning, it is a garment made of fine wool, like crimson and blue wool. According to the Midrash, פַּסִּים hints at Joseph's troubles — that he was sold to Potiphar, to merchants, to the Ishmaelites, and to the Midianites.","pe":"Yisrael loved Yoseif more than any of his sons, for he was a son of his old age to him, and he made him a long, colorful cloak.","re":"Colorful. A term meaning garments of fine wool, as in “Fine linen [כַּרְפַּס], and blue material,” and as the כְּתוֹנֶת הַפַּסִים [that is mentioned] concerning Tamar and Amnon. A Midrashic explanation is [that פַּסִים] is for his [Yoseif’s] misfortunes; that he was sold to Potiphar, traders, Arabs and Midianites.","p":[{"q":"According to Rashi's plain meaning, what is a כְּתֹונֶת פַּסִּים?","o":["A garment made of fine wool, like crimson and blue wool","A garment with stripes of different colors","A long garment that reaches down to the soles of the feet"]},{"q":"According to the Midrash that Rashi cites, why was the garment called פַּסִּים?","o":["Because of Joseph's troubles — that he was sold to Potiphar, to merchants, to the Ishmaelites, and to the Midianites","Because of the four colors that were in it","Because of the four forefathers who wore a similar garment"]}]},"37:4.1":{"e":"Rashi teaches that from the very criticism of the brothers — that they hated Joseph and could not speak to him in peace — we can learn their praise: they were not two-faced, and they did not say one thing with their mouths while thinking something different in their hearts.","pe":"His brothers saw that their father loved him more than all his brothers, and they hated him. They could not speak to him peaceably.","re":"They could not speak to him peaceably. From their denigration we learn their praise, for they did not speak one thing with their mouth [while thinking] another thing in their heart.","p":[{"q":"What is the praise that Rashi finds in the brothers, specifically from their criticism?","o":["That they did not say one thing with their mouths and another in their hearts","That they held themselves back and did not physically harm Joseph","That they only hated him because of their father's honor"]}]},"37:4.2":{"e":"Rashi explains that the word דִּבְּרוּ means \"to speak with him\" — that is, it is used here as a verbal noun, not as a command.","pe":"His brothers saw that their father loved him more than all his brothers, and they hated him. They could not speak to him peaceably.","re":"Speak to him. [דַבְּרוֹ is the same as] לְדַבֵּר עִמוֹ —to speak with him.","p":[{"q":"How does Rashi explain the word דִּבְּרוּ?","o":["To speak with him — a verbal noun","They spoke to him — past tense","Speak to him — a command"]}]},"37:7.1":{"e":"Rashi explains that מְאַלְּמִים אֲלֻמִּים means binding sheaves (bundles of grain), as Targum Onkelos translates, and he brings proofs from Psalms and from the language of the Mishnah.","pe":"Behold, we were binding sheaves in the middle of the field. Behold my sheaf rose and stood up straight; and behold your sheaves surrounded it and prostrated themselves to my sheaf.","re":"Binding sheaves. As Onkelos translates it: binding bundles—sheaves. Similarly: “Carrying its sheaves.” It is similar in Mishnaic Hebrew: “He may take the sheaves and make a pronouncement.”","p":[{"q":"What is the meaning of מְאַלְּמִים אֲלֻמִּים according to Rashi?","o":["Binding sheaves (bundles) of grain","Lifting piles of hay from the field","Sowing seeds in the field"]}]},"37:7.2":{"e":"Rashi explains that the word קָמָה means \"stood upright\" — that is, the sheaf straightened itself up and stood erect.","pe":"Behold, we were binding sheaves in the middle of the field. Behold my sheaf rose and stood up straight; and behold your sheaves surrounded it and prostrated themselves to my sheaf.","re":"My sheaf rose. [קָמָה means] rose up.","p":[{"q":"How does Rashi explain the word קָמָה in the context of the sheaf?","o":["It stood upright — it straightened up and stood erect","It rose up into the air above the ground","It began to move toward the other sheaves"]}]},"37:7.3":{"e":"Rashi explains that the word נִצָּבָה adds to קָמָה — not only did it stand up, but it remained standing firmly and steadily in an upright position.","pe":"Behold, we were binding sheaves in the middle of the field. Behold my sheaf rose and stood up straight; and behold your sheaves surrounded it and prostrated themselves to my sheaf.","re":"And stood up straight. [Meaning:] to stand steadfastly straight.","p":[{"q":"What does the word נִצָּבָה add beyond קָמָה, according to Rashi?","o":["That it remained standing firmly and steadily in an upright position","That it began to walk toward the other sheaves","That it grew and became taller than all the others"]}]},"37:8.1":{"e":"Rashi explains that דְּבָרָיו does not refer to the words of the dreams, but rather to the bad reports that Joseph used to bring about his brothers to their father.","pe":"His brothers said to him, Will you then be a king over us? Will you indeed rule over us? They hated him even more because of his dreams and his words.","re":"And his words. [Meaning:] for the bad reports about them that he would bring to their father.","p":[{"q":"What does וְעַל דְּבָרָיו refer to, according to Rashi?","o":["The bad reports that Joseph used to bring about his brothers to their father","The words of the dream that he told his brothers","The words of rebuke that their father said to them"]}]},"37:10.1":{"e":"Rashi explains the order of events: first Joseph told the dream to his brothers, and afterward he went back and told it to his father in the brothers' presence.","pe":"He told it to his father and to his brothers. His father rebuked him, and said to him, What is this dream that you dreamed? Shall I, your mother and your brothers come and prostrate themselves on the ground to you?","re":"He told it to his father and to his brothers. After he had told it to his brothers he retold it to his father in their presence.","p":[{"q":"How does Rashi explain the order in which Joseph told the dream to his father and brothers?","o":["He told it first to his brothers, and afterward he went back and told it to his father in their presence","He told it to his father and brothers together at the same time","He told it first to his father privately, and afterward to his brothers"]}]},"37:10.2":{"e":"Jacob scolded Joseph for telling his dream to his brothers, because by doing so he was bringing hatred upon himself.","pe":"He told it to his father and to his brothers. His father rebuked him, and said to him, What is this dream that you dreamed? Shall I, your mother and your brothers come and prostrate themselves on the ground to you?","re":"He rebuked him. Because he was bringing hatred upon himself.","p":[{"q":"Why did Jacob scold Joseph according to Rashi?","o":["Because he was bringing hatred upon himself in front of his brothers","Because the dream itself was false and not worth telling","Because it is forbidden to tell dreams in front of family members"]}]},"37:10.3":{"e":"Jacob asked 'הֲבוֹא נָבוֹא אֲנִי וְאִמְּךָ' — but Rachel was already dead. Jacob meant to take the matter out of the brothers' minds so they would not be jealous of Joseph, by arguing that since this part was impossible, the whole dream was worthless. The Sages learned from this that there is no dream without some meaningless elements. In truth, the reference is to Bilhah, who raised Joseph like a mother.","pe":"He told it to his father and to his brothers. His father rebuked him, and said to him, What is this dream that you dreamed? Shall I, your mother and your brothers come and prostrate themselves on the ground to you?","re":"Shall we come? “Has not your mother already died?” But he [Yaakov] did not know that these things were referring to Bilhah who had raised him [Yoseif] like his mother. However, our Sages learned from here that no dream is without meaningless things. But Yaakov intended [by saying “Shall we come?”] to make his sons ignore the whole matter so that they would not be jealous of him. He, therefore, said to him “Shall we come, etc.” [conveying:] “Just as it is impossible concerning your mother, so is the rest [of the dream] meaningless.”","p":[{"q":"What difficulty did Jacob raise about the dream when he said 'הֲבוֹא נָבוֹא אֲנִי וְאִמְּךָ'?","o":["Rachel was already dead, and it was impossible for her to come and bow down","Bilhah is not considered a mother and is not included in the dream","Jacob himself was too old to come and bow down"]},{"q":"What did the Sages learn from the fact that the dream included an impossible detail?","o":["That there is no dream without meaningless elements","That a dream containing an error is entirely null and void","That dreams are only metaphors and have no real substance"]}]},"37:11.1":{"e":"Rashi explains that 'שָׁמַר אֶת הַדָּבָר' means that Jacob waited and looked forward to when the dream would come true, like 'שׁוֹמֵר אֱמוּנִים' — waiting for something to be fulfilled.","pe":"His brothers were jealous of him but his father kept the matter in mind.","re":"Kept the matter in mind. [I.e.,] he waited and looked forward when it would come to be [fulfilled]. Similarly, “That look forward to the keeping of a promise,” and similarly, “לֹא תִשְׁמוֹר for my sin” [meaning:] do not wait.","p":[{"q":"What does 'שָׁמַר אֶת הַדָּבָר' mean according to Rashi?","o":["He was waiting and looking forward to when the dream would come true","He kept the dream secret and did not reveal it to anyone","He remembered the dream and wrote it down as a reminder"]}]},"37:12.1":{"e":"Rashi points out that there are dots written over the word 'אֶת', to teach that the brothers did not go to pasture the flock but to pasture themselves — meaning to eat, drink, and idle about.","pe":"His brothers went off to pasture their father’s sheep in Shechem.","re":"To pasture the sheep. There are dots on the word אֶת [indicating] that they went only to “pasture” themselves.","p":[{"q":"What do the dots over the word 'אֶת' teach according to Rashi?","o":["That the brothers went to look after themselves and not the flock","That the brothers took only part of the flock with them","That the word 'אֶת' is extra and comes to include additional flocks"]}]},"37:13.1":{"e":"Rashi explains that Joseph answered his father with humility and eagerness, and was ready to carry out his father's command even though he knew his brothers hated him.","pe":"Yisrael said to Yoseif, Aren’t your brothers pasturing [the sheep] in Shechem? Come, I will send you to them. He [Yoseif] said to him, Here I am.","re":"“Here I am.” A term indicating humility and readiness. He was ready to fulfill his father’s command, even though he knew that his brothers hated him.","p":[{"q":"According to Rashi, what does Joseph's answer 'הִנֵּנִי' teach about his character?","o":["That he acted with humility and eagerness to fulfill his father's command, even though he knew his brothers hated him","That he agreed to go because he did not know about his brothers' hatred toward him","That he wanted to prove to his father that he was braver than his brothers"]}]},"37:14.1":{"e":"Rashi raises the difficulty that Hebron is in the mountains, not in a valley, and answers that the meaning is a 'deep plan' — God's plan that was told to Abraham at the Covenant Between the Parts, that his descendants would be strangers in a land not their own.","pe":"He [Yisrael] said to him, Go please, see after the well-being of your brothers, and the welfare of the sheep, and bring me a report. He sent [Yoseif] from the depths of Chevron, and he came to Shechem.","re":"From the depths of Chevron. But, is not Chevron on a mountain, as it is said: “They went up to the South and came until Chevron”? But, [“depth” refers to] the deep wisdom of that righteous man [Avraham] buried in Chevron —to fulfill what was said to Avraham at the Covenant of the Split Pieces “For your descendants will be strangers.”","p":[{"q":"Why according to Rashi can 'מֵעֵמֶק חֶבְרוֹן' not be understood literally?","o":["Because Hebron is in the mountains, as it says 'וַיַּעֲלוּ בַנֶּגֶב וַיָּבֹא עַד חֶבְרוֹן'","Because Jacob did not live in Hebron but in Be'er Sheva","Because the valley near Hebron is called by a different name in Scripture"]}]},"37:14.2":{"e":"Rashi explains that Shechem is a place prepared for calamity: there Joseph was sold, there Dinah was violated, and there the kingdom of the House of David was split.","pe":"He [Yisrael] said to him, Go please, see after the well-being of your brothers, and the welfare of the sheep, and bring me a report. He sent [Yoseif] from the depths of Chevron, and he came to Shechem.","re":"And he came to Shechem. It is a place with a predisposition to misfortunes. There the Tribes sinned. [They sold Yoseif]. There they abused Dinah. There the Kingdom of the House of Dovid was divided, as it is said: “And Rechavom went to Shechem.”","p":[{"q":"According to Rashi, why does the verse specify that Joseph arrived specifically at Shechem?","o":["Because Shechem is a place prepared for calamity, where several disasters occurred","Because Shechem had the best pasture and water for the flock","Because his father explicitly commanded him to go to Shechem"]}]},"37:15.1":{"e":"Rashi identifies the 'man' who found Joseph wandering in the field as the angel Gabriel, based on the verse 'וְהָאִישׁ גַּבְרִיאֵל' in the book of Daniel.","pe":"A man found him going astray in the field. The man asked him, What are you seeking?","re":"A man found him. This refers to [the angel] Gavriel, as it is said: “The man [וְהָאִישׁ] Gavriel.”","p":[{"q":"According to Rashi, who is the 'man' who found Joseph wandering in the field?","o":["The angel Gabriel, as it says 'וְהָאִישׁ גַּבְרִיאֵל'","One of Jacob's shepherds who recognized Joseph","A Canaanite passerby who recognized the brothers"]}]},"37:17.1":{"e":"Rashi interprets the expression \"נָסְעוּ מִזֶּה\" not only as a physical journey, but as moving away from feelings of brotherhood toward Joseph.","pe":"The man said, They have traveled on from here, for I heard them say, Let us go to Doson. Yoseif went after his brothers and found them in Doson.","re":"“They have traveled from here.” They have removed themselves from [the feeling of] brotherhood.","p":[{"q":"According to Rashi, what does \"נָסְעוּ מִזֶּה\" mean?","o":["They moved themselves away from brotherhood","They traveled from this place toward Dothan","They left the pasture because the feed ran out"]}]},"37:17.2":{"e":"Rashi gives two interpretations: on the level of derash, \"דֹּתָיְנָה\" means to seek schemes and plots in order to kill Joseph. On the level of peshat, Dothan is the name of a place, and a verse never leaves its plain meaning.","pe":"The man said, They have traveled on from here, for I heard them say, Let us go to Doson. Yoseif went after his brothers and found them in Doson.","re":"“Let us go to Doson.” To seek lawful pretexts concerning you so that they may kill you.” According to the plain meaning it is the name of a place and Scripture never leaves its plain meaning.","p":[{"q":"What is the derash interpretation of \"נֵלְכָה דֹּתָיְנָה\" according to Rashi?","o":["To seek schemes and plots with which to kill him","To go to a place called Dothan to graze the flock","To put him on trial according to Torah law for his dreams"]}]},"37:18.1":{"e":"Rashi explains the word \"וַיִּתְנַכְּלוּ\" to mean they became filled with schemes and cunning — that is, they plotted with tricks and deceit.","pe":"They saw him from a distance, and before he approached them they were plotting against him to kill him.","re":"They were plotting against him. They became filled with conspiracies and deviousness.","p":[{"q":"How does Rashi explain the word \"וַיִּתְנַכְּלוּ\"?","o":["They became filled with schemes and cunning","They had thoughts of regret and pity","They began to argue among themselves about what to do"]}]},"37:18.2":{"e":"Rashi explains that the word \"אֹתוֹ\" here means \"אִתּוֹ\" — with him, meaning toward him — and not in its usual sense as a direct object.","pe":"They saw him from a distance, and before he approached them they were plotting against him to kill him.","re":"Against him. [אוֹתוֹ] is similar to אִתּוֹ —with him [which is the same as] עִמוֹ —with him, meaning אֵלָיו —toward him.","p":[{"q":"How does Rashi explain the word \"אֹתוֹ\" in this verse?","o":["Like \"אִתּוֹ\" — with him, meaning toward him","As a regular direct object — him himself","Like \"that same thing\" — this matter"]}]},"37:20.1":{"e":"Rashi explains that the words \"וְנִרְאֶה מַה יִּהְיוּ חֲלֹמֹתָיו\" are not the brothers' words but the words of the Holy Spirit. The brothers said \"נַהַרְגֵהוּ,\" and the verse ends with \"וְנִרְאֶה\" — meaning, let us see whose words will stand, theirs or God's. For if they killed him, his dreams would automatically be nullified and there would be no point in saying \"וְנִרְאֶה.\"","pe":"Now, come let us kill him and throw him into one of the pits; and we will say that a wild beast devoured him. Then we will see what will become of his dreams.","re":"“Then we will see what will become of his dreams.” R. Yitzchok said: This verse says: “Expound upon me.” It is the Divine Spirit that is saying this: They are saying, “Let us kill him,” but, the verse concludes “Let us see what will become of his dreams,” [i.e.,] let us see whose words will be fulfilled, yours or Mine? It is impossible that it was they [the brothers] who said, “Let us see what will become of his dreams,” for once they kill him, his dreams would [automatically] have no meaning.","p":[{"q":"According to Rashi, who says \"וְנִרְאֶה מַה יִּהְיוּ חֲלֹמֹתָיו\"?","o":["The Holy Spirit, because if they killed him his dreams would automatically be nullified","The brothers, to mock Joseph's dreams","Their father Jacob, who wanted to test whether the dreams would come true"]}]},"37:21.1":{"e":"Rashi explains that the word \"נֶפֶשׁ\" in this verse means a deadly blow — that is, death.","pe":"Reuvein heard and rescued him from their hands. He said, Let us not kill him.","re":"“Let us not kill him.” [נֶפֶשׁ should be explained as]: מַכַּת נֶפֶשׁ —a blow to the soul, which refers to killing.","p":[{"q":"How does Rashi explain the word \"נֶפֶשׁ\" in the phrase \"לֹא נַכֶּנּוּ נָפֶשׁ\"?","o":["מַכַּת נֶפֶשׁ — a blow that means death","A wound to Joseph's spiritual soul","Physical injury that is not death"]}]},"37:22.1":{"e":"Rashi explains that the Holy Spirit testifies that Reuben's real intention was to save Joseph — he would come back later and pull him up out of the pit. Reuben was worried that the blame would fall on him because he was the firstborn.","pe":"Reuvein said to them, Do not commit bloodshed. Throw him into this pit which is in the wilderness, and do not lay a hand on him. His purpose was to rescue him from their hands, to bring him back to his father.","re":"To rescue him. The Divine Spirit testifies concerning Reuvein, that he said this only in order to rescue him, that he may [later] come and rescue him from there. He thought: “I am the firstborn and the oldest of them all; the blame will be put only on me.”","p":[{"q":"According to Rashi, why was Reuben especially worried about Joseph's fate?","o":["Because he is the firstborn and eldest, and the blame would be placed on him","Because he loved Joseph more than the other brothers did","Because Jacob had explicitly commanded him to watch over Joseph"]}]},"37:23.1":{"e":"Rashi explains that \"כְּתֹנֶת\" means a chaluk, which is an undergarment.","pe":"When Yoseif came to his brothers, they stripped him of his coat, the long, colorful coat that he had on.","re":"His coat. [כְּתֹנֶת] is a shirt [or coat].","p":[{"q":"How does Rashi explain the word \"כְּתֹנֶת\"?","o":["A chaluk — an undergarment","An outer cloak","A special garment for firstborns"]}]},"37:23.2":{"e":"Rashi explains that the כְּתֹנֶת הַפַּסִּים was the extra garment that Jacob gave Joseph beyond what he gave his brothers, and that is why they stripped it off him.","pe":"When Yoseif came to his brothers, they stripped him of his coat, the long, colorful coat that he had on.","re":"The long, colorful coat. This is an additional one that his father gave him in excess of what was given to the brothers.","p":[{"q":"What does Rashi point out about the כְּתֹנֶת הַפַּסִּים?","o":["It was the garment his father added for him beyond what his brothers had","It was a garment Joseph bought for himself in the market","It was a garment his brothers gave him as a gift"]}]},"37:24.1":{"e":"Rashi asks: if the pit was empty, it is obvious there is no water in it. From here the Sages taught that there was no water in it, but there were snakes and scorpions in it.","pe":"They took him and threw him into the pit. The pit was empty; there was no water in it.","re":"The pit was empty, there was no water in it. From the statement: “The pit was empty” don’t I know that there was no water in it? Then what does “There was no water” come to teach? [It teaches] there was no water in it but there were snakes and scorpions in it.","p":[{"q":"What did Rashi learn from the seemingly extra words ״אֵין בּוֹ מַיִם״?","o":["There was no water in it, but there were snakes and scorpions in it","The pit was completely dry with absolutely nothing inside it","The pit had been full of water but it had dried up beforehand"]}]},"37:25.1":{"e":"Rashi explains that the word ״אֹרְחַת״ means a caravan, as Targum Onkelos translates it, because they are travelers of the road (אֹרַח).","pe":"They sat down to eat bread. They raised their eyes and saw—behold a Yishmaelite caravan was coming from Gilod. Their camels were carrying spices, balsam and lotus, bringing them down to Egypt.","re":"Caravan. As Onkelos translates it: “A caravan of” [It is called אֹרְחַת] because they travel the road [אֹרַח].","p":[{"q":"How does Rashi explain the word ״אֹרְחַת״?","o":["A caravan, because they are travelers of the road (אֹרַח)","A group of merchants who deal in baking and weaving","A large family traveling together to another land"]}]},"37:25.2":{"e":"Rashi asks why the Torah specifies what the camels were carrying. He explains that Arabs normally carry tar and pitch, which smell bad, but for the sake of Joseph the righteous, spices with a pleasant smell happened to come their way.","pe":"They sat down to eat bread. They raised their eyes and saw—behold a Yishmaelite caravan was coming from Gilod. Their camels were carrying spices, balsam and lotus, bringing them down to Egypt.","re":"Their camels were carrying, etc. Why does Scripture announce what they were carrying? It is to let us know the reward of the righteous. Because it is unusual for Arabs to carry anything, but naphta and itran whose odor is foul. But for this one [Yoseif] it was arranged [that they be carrying] good smelling spices so that he not be harmed by the foul odor.","p":[{"q":"Why, according to Rashi, were the Ishmaelites carrying spices instead of ordinary goods?","o":["So that Joseph the righteous would not suffer from a bad smell","Because spices were the most valuable merchandise of that time","Because they were on their way to trade spices in an Egyptian market"]}]},"37:25.3":{"e":"Rashi explains that נְכֹאת refers to a collection of many spices together, and brings a proof from the verse ״בֵּית נִכֹתֹה״ which means a place where spices are blended. Onkelos translated it as wax.","pe":"They sat down to eat bread. They raised their eyes and saw—behold a Yishmaelite caravan was coming from Gilod. Their camels were carrying spices, balsam and lotus, bringing them down to Egypt.","re":"Spices. Any collection of many types of spices is called נְכֹאת. Similarly, “He showed them the entire house of נְכוֹתֹה .” [נְכֹתֹה meaning:] the place where the spices are mixed. Onkelos, however, translates it was wax.","p":[{"q":"What is ״נְכֹאת״ according to Rashi?","o":["A collection of many spices together","A specific type of expensive perfume","Wax that is produced from camels"]}]},"37:25.4":{"e":"Rashi explains that צֳרִי is the sap that drips from the branches of the stacte tree, and it is the same ״נָטָף״ listed among the spice ingredients of the incense in the Temple.","pe":"They sat down to eat bread. They raised their eyes and saw—behold a Yishmaelite caravan was coming from Gilod. Their camels were carrying spices, balsam and lotus, bringing them down to Egypt.","re":"Balsam. It is a sap that drips from balsam trees. It is [identical with] the נָטָף that is enumerated with the spices of the incense [of the Temple].","p":[{"q":"What is the צֳרִי and why is it familiar to us, according to Rashi?","o":["Sap from the branches of the stacte tree — it is the נָטָף among the incense spices","A fragrant oil used only for healing","Sap from oak trees used for lighting candles"]}]},"37:25.5":{"e":"Rashi explains that לָט is called לוּטִיתָא in the language of the Mishnah, and the Sages explained that it is the root of an herb called astrologia.","pe":"They sat down to eat bread. They raised their eyes and saw—behold a Yishmaelite caravan was coming from Gilod. Their camels were carrying spices, balsam and lotus, bringing them down to Egypt.","re":"And lotus. In Mishnaic Hebrew it is called לוֹטִיתָא. Our Sages explained it as an herb root referred to as aristolochia in Maseches Niddah.","p":[{"q":"How did the Sages explain ״לָט״ according to Rashi?","o":["The root of an herb called astrologia","A fragrant leaf that grows on stacte trees","A type of sap that drips from the lotus"]}]},"37:26.1":{"e":"Rashi explains that the word ״בֶּצַע״ means money and profit, as Targum Onkelos translates it.","pe":"Yehudah said to his brothers, What will we gain if we kill our brother and cover up his blood?","re":"What gain? [מַה בֶּצַע] what profit? as Onkelos translates it.","p":[{"q":"What is the meaning of the word ״בֶּצַע״ according to Rashi?","o":["Money and profit, as Targum Onkelos translates it","A practical benefit or advantage","A sin or moral wrongdoing"]}]},"37:26.2":{"e":"Rashi explains that the expression וְכִסִּינוּ אֶת דָּמוֹ does not mean its literal meaning, but rather that we will hide and conceal Joseph's death from his father.","pe":"Yehudah said to his brothers, What will we gain if we kill our brother and cover up his blood?","re":"And cover up his blood. [Meaning:] and we will conceal his death.","p":[{"q":"According to Rashi, what does וְכִסִּינוּ אֶת דָּמוֹ mean?","o":["We will hide and conceal his death","We will cover his blood with dirt so it will not be found","We will cleanse ourselves from the guilt of bloodshed"]}]},"37:27.1":{"e":"Rashi explains that the word וַיִּשְׁמְעוּ here means they agreed to his words, not merely that they heard with their ears. He brings proof from Targum Onkelos, who translates hearing that means agreement as \"we will accept,\" while hearing with the ears is translated as \"they heard.\"","pe":"Come let us sell him to the Yishmaelites, and let our hands not be upon him; for he is our brother, our own flesh. His brothers listened [to him.].","re":"They listened. [Meaning:] they agreed with him. Everytime the term שְׁמִיעָה is used to mean agreement, as in the case here, and as in “Yaakov listened to his father.” [or] “We will do and we will obey,” Onkelos translates them as נְקַבֵּל. But, wherever it [שְׁמִיעָה] refers to hearing with the ear such as “They heard the voice of God traveling through the garden,” [or] “And Rivkah heard,” [or] “Yisrael heard,” [or] “I heard the complaints,” these are all translated by Onkelos as: they heard, she heard, he heard, it is heard before Me.","p":[{"q":"According to Rashi, what does וַיִּשְׁמְעוּ אֶחָיו mean in this verse?","o":["They agreed and accepted his words","They heard his words with their ears","They understood his hidden intention"]}]},"37:28.1":{"e":"Rashi explains that the Midianites were a separate caravan from the Ishmaelites mentioned earlier, and the verse comes to teach us that Joseph was sold many times.","pe":"Midianite merchants passed by. They [the brothers] pulled Yoseif up from the pit and sold Yoseif to the Yishmaelites for twenty pieces of silver. They brought Yoseif to Egypt.","re":"Midianite merchants passed by. This was another caravan. This verse indicates that he was sold several times.","p":[{"q":"According to Rashi, why are the Midianites mentioned separately from the Ishmaelites?","o":["Because they were a different caravan, and Joseph was sold many times","Because it was the Midianites who pulled Joseph from the pit without the brothers knowing","Because the Midianites were partners with the Ishmaelites in the same caravan"]}]},"37:28.2":{"e":"Rashi explains that Jacob's sons were the ones who pulled Joseph out of the pit and sold him to the Ishmaelites; the Ishmaelites sold him to the Midianites; and the Midianites sold him to Egypt.","pe":"Midianite merchants passed by. They [the brothers] pulled Yoseif up from the pit and sold Yoseif to the Yishmaelites for twenty pieces of silver. They brought Yoseif to Egypt.","re":"They pulled. Yaakov’s sons [pulled] Yoseif from the pit, and sold him to the Yishmaelites; the Yishmaelites to Midianites, and the Midianites to Egyptians.","p":[{"q":"According to Rashi, what was the order of Joseph's sales?","o":["The brothers to the Ishmaelites, the Ishmaelites to the Midianites, and the Midianites to Egypt","The Midianites to the Ishmaelites, and the Ishmaelites to Egypt","The brothers to the Midianites, and the Midianites directly to Egypt"]}]},"37:29.1":{"e":"Rashi explains why Reuben was not present at the time of Joseph's sale. According to one explanation, it was his turn to go and attend to his father. According to another explanation, he was occupied with his sackcloth and fasting over having disturbed his father's bed.","pe":"Reuvein returned to the pit, but behold, Yoseif was not in the pit. He [then] tore his clothes [in grief.]","re":"Reuvein returned. He [Reuvein] was not present when he [Yoseif] was sold, for his day [his turn] had arrived to go and to attend to his father. Another explanation: He was occupied with his sack-cloth and fasting for having disturbed his father’s sleeping arrangement.","p":[{"q":"According to the first explanation in Rashi, why was Reuben not present at the time of the sale?","o":["It was his day to go and attend to his father","He was occupied with fasting over his sin","He went to look for pasture for the flock"]},{"q":"According to the second explanation in Rashi, what was Reuben occupied with?","o":["His sackcloth and fasting over having disturbed his father's bed","Praying about Joseph's dreams","Watching the flock in a distant place"]}]},"37:30.1":{"e":"Rashi explains that אָנָה אֲנִי בָא does not mean where will I go physically, but rather: where can I flee from father's grief — that is, how will I be able to face Jacob's sorrow.","pe":"He returned to his brothers and said, The boy is not there; and I—where can I go.","re":"Where can I go. [I.e.,] where can I flee from my father’s grief?","p":[{"q":"How does Rashi explain the words אָנָה אֲנִי בָא?","o":["Where can I flee from father's grief","To what place can I go from here","How can I return to my brothers"]}]},"37:31.1":{"e":"Rashi explains that the brothers specifically chose a goat because its blood resembles human blood.","pe":"They took Yoseif’s coat, slaughtered a goat, and dipped the coat in the blood.","re":"A goat. Its blood is similar to that of a human.","p":[{"q":"According to Rashi, why did the brothers specifically choose a goat?","o":["Because its blood resembles human blood","Because one was available to them in the flock","Because they wanted to bring a sin-offering"]}]},"37:31.2":{"e":"Rashi explains the form of the word כֻּתֹּנֶת: when it stands on its own it is said as הַכֻּתֹּנֶת, and when it is joined to another word (such as כְּתֹנֶת יוֹסֵף or כְּתֹנֶת פַּסִּים) it takes the construct form and is vowelized differently.","pe":"They took Yoseif’s coat, slaughtered a goat, and dipped the coat in the blood.","re":"The coat. This is [the form of the word as] a noun, [הַכֻּתֹּנֶת]. When it is in the construct state to the word that follows it, for instance, כְּתֹנֶת יוֹסֵף —“Yoseif’s coat.” כְּתֹנֶת פַּסִים —“A colorful coat,” [or] כְּתֹנֶת בַּד —“A linen coat,” it is vocalized thus: כְּתֹנֶת.","p":[{"q":"What does Rashi explain about the form of the word הַכֻּתֹּנֶת?","o":["The difference in vowelization between the independent form and the construct form","That the כֻּתֹּנֶת was made from a special fabric","That the word appears only in the book of Bereishis"]}]},"37:33.1":{"e":"Jacob identified the tunic and said that it was his son Joseph's tunic.","pe":"He recognized it and said, It is my son’s coat. An evil beast has devoured him. Yoseif has been torn to pieces.","re":"And said, “My son’s coat … is this.”","p":[{"q":"What does Rashi add about Jacob's words \"כְּתֹנֶת בְּנִי\"?","o":["Jacob stated with certainty that this was his son's tunic","Jacob was unsure whether it was really the tunic","Jacob asked his sons whether it was Joseph's tunic"]}]},"37:33.2":{"e":"Rashi explains that \"חַיָּה רָעָה\" hints at Potiphar's wife, who would one day try to seduce Joseph — a flash of Divine inspiration shone in Jacob. God did not reveal to Jacob that Joseph was alive because the brothers had placed a ban and a curse on anyone who would tell, and they included God in that ban. Isaac knew that Joseph was alive but did not reveal it because God did not wish to disclose it.","pe":"He recognized it and said, It is my son’s coat. An evil beast has devoured him. Yoseif has been torn to pieces.","re":"An evil beast has devoured him. A spark of the Divine Spirit flickered within him. It is his destiny that Potiphar’s wife would provoke him. Why did God not reveal [everything] to him? Because they [the brothers] banned and cursed anyone who would reveal it and they included God with them. Yitzchok, however, knew that he [Yoseif] was alive, but thought: “How can I reveal it when God does not wish to reveal it to him.”","p":[{"q":"According to Rashi, what did the words \"חַיָּה רָעָה\" hint at in Jacob's prophecy?","o":["Potiphar's wife, who would one day try to seduce Joseph","A wild beast that attacked Joseph in the wilderness","Joseph's brothers, who plotted against him and sold him"]},{"q":"According to Rashi, why did God not reveal to Jacob that Joseph was alive?","o":["Because the brothers had placed a ban on anyone who would tell and included God in that ban","Because God wanted to test Jacob's faith","Because Jacob was not worthy of Divine inspiration at that time"]}]},"37:34.1":{"e":"Rashi explains that \"יָמִים רַבִּים\" means 22 years — from when Joseph separated from Jacob until Jacob went down to Egypt. This corresponds to the 22 years Jacob did not fulfill the commandment of honoring his father and mother: 20 years in Laban's house and 2 years on the journey home.","pe":"Yaakov tore his robes, and placed sackcloth on his loins. He mourned for his son for many days.","re":"For many days. Twenty-two years, from when he left him until Yaakov went down to Egypt. As it is said: “Yoseif was seventeen years old, etc.” and he was thirty years old when he stood before Pharoah. [Add] the seven years of plenty and the two years of hunger, at which time Yaakov came to Egypt, which is a total of twenty-two years, corresponding to the twenty-two years that Yaakov did not fulfill the [precept of] honoring one’s father and mother— the twenty years he was at Lavan’s house and the two years he was en route upon his return from Lavan’s house, one and a half years in Sukkos and six months in Beis Eil. This was [the reference] when he said to Lavan, “These twenty years that I have been in your house.” לִי —to me [means] they are upon me—my responsibility and I will ultimately be punished for them.","p":[{"q":"According to Rashi, what did Jacob's 22 years of mourning correspond to as a punishment?","o":["The 22 years he did not fulfill honoring his father and mother","The 22 years Joseph was a slave in Egypt","The 22 years the brothers concealed what they had done"]}]},"37:35.1":{"e":"Rashi presents a dispute: Rabbi Yehudah says that a twin sister was born with each tribe and the brothers married them. Rabbi Nechemiah says their wives were Canaanite women, and \"his daughters\" refers to his daughters-in-law, since it is customary to call a daughter-in-law \"daughter.\"","pe":"All his sons and all his daughters rose to console him, but he refused to be consoled. He said, I will go down to the grave mourning for my son. His father wept for him.","re":"And all his daughters. R. Yehudah says: A twin sister was born with each brother and each [brother] married one [of the sisters]. R. Nechemia says: [Their wives] were Canaanites. Then what is the meaning of “And all his daughters?” [It means] his daughters-in-law, because a person does not hesitate to call his son-in-law, his son; and his daughter-in-law, his daughter.","p":[{"q":"According to Rabbi Nechemiah in Rashi, who are \"כָּל בְּנֹתָיו\" of Jacob?","o":["His daughters-in-law, since it is customary to call a daughter-in-law a daughter","Twin daughters who were born together with the tribes","Canaanite girls whom Jacob raised in his home"]}]},"37:35.2":{"e":"Rashi explains that Jacob refused to be comforted because one cannot accept consolation for someone who is alive but believed to be dead — for the decree that the deceased be forgotten from the heart applies only to the dead, not to the living.","pe":"All his sons and all his daughters rose to console him, but he refused to be consoled. He said, I will go down to the grave mourning for my son. His father wept for him.","re":"But he refused to be consoled. A person cannot accept consolation for one who is alive, but is thought to be dead, because only for the dead was it decreed that he be forgotten, but not for the living.","p":[{"q":"According to Rashi, why was Jacob unable to be comforted over Joseph?","o":["Because a person cannot accept consolation for someone who is alive but believed to be dead","Because his love for Joseph was too great to be forgotten","Because he knew through Divine inspiration that Joseph was suffering in exile"]}]},"37:35.3":{"e":"Rashi explains that the word \"אֶל\" here is used in the sense of \"עַל\", meaning \"for my son\" or \"because of my son,\" and he brings proof from other verses where \"אֶל\" is used with the meaning of \"עַל\".","pe":"All his sons and all his daughters rose to console him, but he refused to be consoled. He said, I will go down to the grave mourning for my son. His father wept for him.","re":"“I will go down for my son.” [אֶל בְּנִי] is the same as עַל בְּנִי — for my son. Many times אֶל [to] is used for עַל [for]. [E.g.,] [אֶל]—“Because of Saul,” [וְאֶל]—“And because of his bloody house,” [or] [אֶל]—“Because the ark of God was taken,” [וְאֶל] “And because of the death of her father-in-law and her husband.”","p":[{"q":"According to Rashi, what is the meaning of the word \"אֶל\" in \"אֶל בְּנִי\"?","o":["\"אֶל\" is used here in the sense of \"עַל\", meaning for my son","\"אֶל\" means toward, meaning I will go down to the place where my son is","\"אֶל\" means with, meaning I will go down together with my son"]}]},"37:35.4":{"e":"Rashi gives two interpretations: according to the plain meaning, \"שְׁאוֹלָה\" means the grave — in my mourning I will be buried and will not be comforted all my days. According to the Midrash, \"שְׁאוֹלָה\" means Gehinnom — he had a sign from God that if none of his sons died in his lifetime, he was guaranteed not to see Gehinnom.","pe":"All his sons and all his daughters rose to console him, but he refused to be consoled. He said, I will go down to the grave mourning for my son. His father wept for him.","re":"To the grave, mourning. In its plain sense it [שְׁאֹל] means the grave. [Yaakov’s intent was:] while still mourning will I be buried and not be consoled all of my life. The Midrashic explanation [of שְׁאֹל] is Gehinom [hell]. [I.e.,] this was a sign given to me by God that if none of my children die in my lifetime then I am assured not to see Gehinom.","p":[{"q":"What is the meaning of \"שְׁאֵלָה\" according to Rashi's plain interpretation?","o":["The word for grave — in my mourning I will be buried and will not be comforted all my days","The word for question — I will ask after my son until I find him","The word for Gehinnom — I will descend to Gehinnom because of my grief"]},{"q":"According to Rashi's Midrashic interpretation, what was the sign given to Jacob?","o":["If none of his sons died in his lifetime, he would not see Gehinnom","If he merited to bury all his sons, he would merit the Garden of Eden","If none of his sons sinned, they would all merit the World to Come"]}]},"37:35.5":{"e":"Rashi explains that \"his father\" refers to Isaac. Isaac wept because of Jacob's grief, but did not mourn over Joseph because he knew that Joseph was alive.","pe":"All his sons and all his daughters rose to console him, but he refused to be consoled. He said, I will go down to the grave mourning for my son. His father wept for him.","re":"His father wept for him. [“His father” refers to] Yitzchok who cried because of Yaakov’s anguish, but he did not mourn, for he knew that he [Yoseif] was alive.","p":[{"q":"According to Rashi, why did Isaac weep but not mourn?","o":["He wept because of Jacob's sorrow, but he knew that Joseph was alive","He wept because he was old and weak, but did not believe that Joseph was dead","He wept along with Jacob out of politeness, but did not know Joseph well"]}]},"37:36.1":{"e":"Rashi explains that the word טַבָּחִים does not mean executioners, but rather the king's slaughterers of animals.","pe":"The Midianites sold him in Egypt to Potiphar, an officer of Pharaoh, the chief of the slaughterers.","re":"The slaughterers. [הַטַבָּחִים means] the slaughterers of the kings animals.","p":[{"q":"What does שַׂר הַטַּבָּחִים mean according to Rashi?","o":["The one in charge of slaughtering the king's animals","The one in charge of executing prisoners","The one in charge of preparing the king's feasts"]}]},"38:1.1":{"e":"Rashi asks why the Torah interrupts the story of Joseph with the story of Judah. He explains that the brothers demoted Judah from his position of leadership when they saw their father's grief, and said to him: You advised us to sell him, and if you had told us to bring him back, we would have listened to you.","pe":"And it was at that time, that Yehudah descended from his brothers. He turned away [from them], until [he came to] a man, an Adullamite, whose name was Chirah.","re":"At that time. Why is this narrative [of Yehudah] placed here, thereby interrupting the narrative of Yoseif? This is to teach that his brothers demoted him from his important position. When they saw the anguish of their father they said, “You advised us to sell him. Had you advised us to return him we would have listened to you.”","p":[{"q":"Why did the brothers demote Judah from his position of leadership?","o":["When they saw their father's grief, they argued that he should have advised returning Joseph","They were angry at him for not stopping them from selling Joseph to the Midianites","They were afraid he would tell Jacob that he was the one who suggested selling Joseph"]}]},"38:1.2":{"e":"Rashi explains that the word וַיֵּט means that Judah turned aside and distanced himself from his brothers.","pe":"And it was at that time, that Yehudah descended from his brothers. He turned away [from them], until [he came to] a man, an Adullamite, whose name was Chirah.","re":"He turned away. From his brothers.","p":[{"q":"What does וַיֵּט mean according to Rashi?","o":["That he turned aside and distanced himself from his brothers","That he turned his path toward Adullam","That he turned away from his previous actions and repented"]}]},"38:1.3":{"e":"Rashi explains that וַיֵּט עַד אִישׁ עֲדֻלָּמִי means that Judah partnered with that man — that is, he became his business partner.","pe":"And it was at that time, that Yehudah descended from his brothers. He turned away [from them], until [he came to] a man, an Adullamite, whose name was Chirah.","re":"Until [he came to] a man, an Adullamite. He had become his business-partner.","p":[{"q":"What was the relationship between Judah and Hirah the Adullamite according to Rashi?","o":["They were business partners","Hirah hosted Judah in his home","Hirah was Judah's servant"]}]},"38:2.1":{"e":"Rashi explains that the word כְּנַעֲנִי in this verse does not refer to a nationality but to an occupation — a merchant (trader).","pe":"There Yehudah saw the daughter of a Canaanite man whose name was Shu’a. He took her and consummated a marriage with her.","re":"A Canaanite. [Meaning] a merchant.","p":[{"q":"According to Rashi, what does כְּנַעֲנִי mean in this verse?","o":["A merchant","A person from the nation of Canaan","A farmer"]}]},"38:5.1":{"e":"Rashi explains that כְּזִיב is the name of a place, and he holds that it was called that because it was there that she stopped giving birth — from the word אַכְזָב, meaning stoppage. For otherwise, what is the verse coming to tell us?","pe":"She conceived once again and gave birth to a son. She named him Sheilah. He [Yehudah] was in Keziv when she gave birth to him.","re":"He [Yehudah] was in Keziv. [Keziv] is the name of the place. It is my opinion that because [there] she ceased giving birth, it was, therefore, named Keziv; from the same term as, “Will you act towards me as a deceiver [אַכְזָב]”? [or] “Whose waters will not cease.” For if this is not [the reason it was called Keziv] why are we informed [of Yehudah’s whereabouts]? In Bereishis Rabbah I saw [the following]: “She named him Sheilah, etc., ceasing.”","p":[{"q":"According to Rashi, why was the place called כְּזִיב?","o":["Because it was there that she stopped giving birth, from the word אַכְזָב","Because it was there that she was deceived about her husband's death","Because Shelah was born there and her hope was disappointed"]}]},"38:7.1":{"e":"Rashi explains that Er's sin was the same as Onan's sin — that he wasted his seed. The proof: regarding Onan it says וַיָּמֶת גַּם אֹתוֹ, meaning he died the same death as Er. And Er's reason was so that Tamar would not become pregnant and her beauty would not be diminished.","pe":"Er, Yehudah’s firstborn was wicked in the eyes of Adonoy, and Adonoy put him to death.","re":"Wicked in the eyes of Adonoy. The same wickedness as that of Onan. [I.e.] he would waste his seed. For it is said of Onan, God slew him also. [Also, indicating] that Onan’s death was for the same sin as the death of Er. Why did Er waste his seed? So that [his wife] would not conceive thereby diminishing her beauty.","p":[{"q":"According to Rashi, why did Er waste his seed?","o":["So that his wife would not become pregnant and her beauty would not be diminished","So that he would not have to support children","So that there would be no heir to his father's inheritance"]},{"q":"From where did Rashi learn that Er's sin was the same as Onan's sin?","o":["From the word גַּם — וַיָּמֶת גַּם אֹתוֹ — implying the same sin","From the fact that both died at a young age","From the fact that the Torah placed the two stories next to each other"]}]},"38:8.1":{"e":"Rashi explains that the commandment of levirate marriage is intended so that the son who is born will be called by the name of the deceased brother.","pe":"Yehudah said to Onan, Consummate marriage with your brother’s wife, and fulfill the yibum rite with her, and establish seed for your brother.","re":"And establish seed. The son will be called by the name of the one who is dead.","p":[{"q":"According to Rashi, what is the meaning of וְהָקֵם זֶרַע לְאָחִיךָ?","o":["The son who is born will be called by the name of the deceased","The son will continue the work of the deceased brother","The son will inherit the estate of the deceased brother"]}]},"38:9.1":{"e":"Rashi explains that Onan did not want to father children for his brother. So he would be intimate with his brother's wife but would spill his seed outside — \"threshing on the inside and winnowing on the outside.\"","pe":"Onan knew that the descendants would not be his. Whenever he cohabited with his brother’s wife, he let it go to waste on the ground, in order not to give progeny to his brother.","re":"He let it go to waste on the ground. He would thresh [his seed] inside and disperse it on the outside.","p":[{"q":"How does Rashi explain the words \"וְשִׁחֵת אַרְצָה\"?","o":["דָּשׁ מִבִּפְנִים וְזוֹרֶה מִבַּחוּץ — threshing on the inside and winnowing on the outside","He avoided being with her altogether","He spilled his seed on the ground after relations"]}]},"38:11.1":{"e":"Rashi explains that Judah did not truly intend to give Shelah to Tamar in marriage. Instead, he was putting her off with excuses — \"he was pushing her away with a straw.\"","pe":"Yehudah said to Tamar, his daughter-in-law, Live as a widow in your father’s house until my son Sheilah is of age. He said, Lest he also die like his brothers. Tamar went and lived in her father’s house.","re":"He said, etc. Meaning, he pushed her off with a straw, for he had no intention of having her marry him.","p":[{"q":"According to Rashi, what was Judah's real intention when he told Tamar to wait?","o":["He was putting her off with an excuse and did not intend to marry her to Shelah","He genuinely wanted to wait until Shelah grew up","He was afraid that Tamar would refuse to marry Shelah"]}]},"38:11.2":{"e":"Rashi brings the words of the Sages that Judah was afraid of Tamar herself, because he believed she was \"מְחַזֶּקֶת\" — that she caused her husbands to die.","pe":"Yehudah said to Tamar, his daughter-in-law, Live as a widow in your father’s house until my son Sheilah is of age. He said, Lest he also die like his brothers. Tamar went and lived in her father’s house.","re":"He said, “Lest he also die like his brothers.” She is predisposed to her husbands dying.","p":[{"q":"Why was Judah afraid to give Shelah to Tamar, according to Rashi?","o":["He believed that Tamar was מְחַזֶּקֶת — that her husbands would die","He thought Shelah was still too young to marry","He knew that Tamar was not suitable for his sons"]}]},"38:12.1":{"e":"Rashi explains that the verse is brief, and the full meaning is: he went up to Timnah in order to oversee and supervise his sheep-shearers.","pe":"Many days passed, and Shu’a’s daughter, the wife of Yehudah died. Yehudah sought consolation, and went up to his sheep-shearers—he and his friend, Chirah the Adullamite—to Timnah.","re":"And he went up to his sheep shearers. [This must be interpreted as if it would have said]: “He went up to Timnah to stand by his sheep shearers.”","p":[{"q":"What does Rashi point out about the phrase \"וַיַּעַל עַל גֹּוזְזֵי צֹאנוֹ\"?","o":["It means he went up to Timnah to supervise the shearers","It means he personally climbed onto the sheep to shear them","It means he went up together with the shearers to celebrate"]}]},"38:13.1":{"e":"Rashi asks why here the Torah says Judah was 'going up' to Timnah, while in the story of Samson it says he 'went down' to Timnah. He answers that Timnah was situated on a hillside, so from one direction you go up to it and from the other direction you go down.","pe":"Tamar was told, Behold your father-in-law has come to Timnah, to shear his sheep.","re":"Has come [lit. is going up] to Timnah. Whereas concerning Shimshon it is said: “Shimshon went down, etc. to Timnah”! [There is no contradiction because] it was situated on the slope of the mountain; from one side they came up to her and from the other side they came down to her.","p":[{"q":"Why does it say here עֹולֶה — 'going up' — to Timnah, while by Samson it says וַיֵּרֶד — 'went down' — to Timnah?","o":["Timnah was situated on a hillside, so it could be approached by going up or by going down","Samson was coming from a higher place than Judah","These refer to two different towns both named Timnah"]}]},"38:14.1":{"e":"Rashi explains that the word 'וַתִּתְעַלֵּף' means that she covered her face so that Judah would not recognize her.","pe":"She took off her widow’s garb, covered herself with a veil, and disguised herself. She sat at the crossroads which is on the road to Timnah, for she saw that Sheilah had come of age and she had not been given to him for a wife.","re":"And disguised herself. She covered her face so that he not recognize her.","p":[{"q":"What is the meaning of 'וַתִּתְעַלֵּף' according to Rashi?","o":["She covered her face so that he would not recognize her","She fainted from great fear before Judah","She wrapped herself in fine clothes to draw attention"]}]},"38:14.2":{"e":"Rashi explains that 'פֶּתַח עֵינַיִם' according to the plain meaning is a crossroads on the way to Timnah. According to the Midrash, it is the entrance to the tomb of Abraham our forefather, because all eyes long to see him.","pe":"She took off her widow’s garb, covered herself with a veil, and disguised herself. She sat at the crossroads which is on the road to Timnah, for she saw that Sheilah had come of age and she had not been given to him for a wife.","re":"She sat at the crossroads [Literally,] at the opening of the eyes, [meaning:] at the crossroads which was on the way to Timnah. Our Sages explain it midrashically. At the entrance [of the tomb] of our father Avraham, whom all eyes longed to see.","p":[{"q":"What is 'פֶּתַח עֵינַיִם' according to the plain meaning and according to the Midrash?","o":["A crossroads according to the plain meaning, and the entrance to Abraham's tomb according to the Midrash","The gate of a town called Einayim according to the plain meaning, and a water spring according to the Midrash","A high place with a view according to the plain meaning, and a house of study according to the Midrash"]}]},"38:14.3":{"e":"Rashi explains that Tamar saw that Shelah had grown up and yet she had not been given to him as a wife. Therefore she put herself forward to Judah, because she longed to build children from him.","pe":"She took off her widow’s garb, covered herself with a veil, and disguised herself. She sat at the crossroads which is on the road to Timnah, for she saw that Sheilah had come of age and she had not been given to him for a wife.","re":"For she saw that Sheilah had come of age, etc. That was why she offered herself to Yehudah, for she desired to have children by him.","p":[{"q":"Why did Tamar put herself forward to Judah, according to Rashi?","o":["Because she longed to have children from Judah","Because she wanted to take revenge on Judah for not giving her Shelah","Because she thought Judah would marry her in place of Shelah"]}]},"38:15.1":{"e":"Rashi explains that Judah thought Tamar was a prostitute because she was sitting at a crossroads, which is a place where prostitutes are known to sit.","pe":"Yehudah saw her and thought she was a harlot, because she had covered her face.","re":"And thought she was a harlot. Because she was sitting at the crossroads.","p":[{"q":"According to Rashi, why did Judah think Tamar was a prostitute?","o":["Because she was sitting at a crossroads","Because she was wearing colorful clothing","Because she spoke to him in a forward way"]}]},"38:15.2":{"e":"Rashi gives two explanations: According to the plain meaning (peshat), Judah did not recognize her because her face was covered. According to the Midrash, it was specifically because Tamar always covered her face in her father-in-law's house out of modesty that Judah did not suspect she was Tamar.","pe":"Yehudah saw her and thought she was a harlot, because she had covered her face.","re":"Because she had covered her face. And he could [therefore] not see nor recognize her. [However,] In the Midrash of our Sages [we find]: Because she [always] covered her face when she was at her father-in-law’s [Yehudah’s] house, she was a modest woman, therefore, he did not suspect her.","p":[{"q":"According to the plain meaning (peshat) in Rashi, why did Judah not recognize Tamar?","o":["Because her face was covered and he could not see her","Because a long time had passed since he had last seen her","Because she was sitting in a dark place far from him"]},{"q":"According to the Midrash that Rashi cites, why did Judah not suspect it was her?","o":["Because in her father-in-law's house she always behaved modestly and kept her face covered","Because he did not expect to meet her outside of her home","Because she had changed her clothes and the appearance of her hair"]}]},"38:16.1":{"e":"Rashi explains that Judah turned off the road he was traveling and headed toward the road where Tamar was sitting.","pe":"He turned aside to her on the road, and said, Please, let me be with you, for he did not know that she was his daughter-in-law. She said, What will you give me for the privilege of being with me?","re":"He turned aside to her on the road. [Meaning:] from the road which he was [traveling] he turned to the road where she was. In O.F. [וַיֵט means] destolir—to turn.","p":[{"q":"According to Rashi, what is the meaning of 'וַיֵּט אֵלֶיהָ אֶל הַדֶּרֶךְ'?","o":["He turned off his road and headed toward the road where she was sitting","He stopped on the road he was traveling and turned to face her","He turned his face toward her as he passed by her"]}]},"38:16.2":{"e":"Rashi explains that the word 'הָבָה' means preparation — prepare yourself and your mind for this. Every use of 'הָבָה' in the Torah is an expression of invitation, except for places where it is interpreted as giving, and even the sense of invitation is close in meaning to giving.","pe":"He turned aside to her on the road, and said, Please, let me be with you, for he did not know that she was his daughter-in-law. She said, What will you give me for the privilege of being with me?","re":"Please. [Meaning:] prepare yourself and your mind for this. Wherever the term הָבָה appears it has the meaning of preparation except where it can be translated as giving. Moreover, those that mean preparation can almost be translated as giving.","p":[{"q":"According to Rashi, what is the meaning of the word 'הָבָה' in this verse?","o":["Prepare yourself and your mind — an expression of invitation and preparation","Give me permission — an expression of giving and granting","Please come — an expression of calling and inviting someone to come"]}]},"38:17.1":{"e":"Rashi explains that the word עֵרָבוֹן means a pledge — that is, an object given as security until payment is made.","pe":"He said, I will send you a kid from the flock. She said, [Only] if you give me some security until you send it.","re":"Security. [עֵרָבוֹן means] security.","p":[{"q":"How does Rashi explain the word \"עֵרָבוֹן\"?","o":["A pledge — an object given as security","A gift — something given for free","A promise — a verbal commitment"]}]},"38:18.1":{"e":"Rashi cites the Targum of Onkelos and explains that \"חוֹתָמְךָ\" is a signet ring, and \"פְּתִילֶךָ\" is a garment that one wraps oneself in, not a thread or cord as the plain reading might suggest.","pe":"He said, What security shall I give you? She said, Your signet ring, your wrap, and your staff that is in your hand. He gave them to her and was with her, and she became pre
