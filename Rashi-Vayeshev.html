<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vayeshev Rashi</title>
<style>@font-face{font-family:"Taamey Frank CLM";src:url(fonts/TaameyFrankCLM-Medium.ttf) format("truetype");font-weight:400 700;font-display:swap}[hidden]{display:none!important}img{max-width:100%}.hint a.fb{color:var(--accent);font-weight:600;font-size:1.15em}
.cite{direction:rtl;font-size:14px;margin-bottom:-4px;color:var(--muted);line-height:1.4}
.cite b{color:var(--ink);font-weight:600}
.cite a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.cite a:hover{text-decoration:underline}
.quote .dhw{font-weight:700}
.quote .qw{text-decoration:underline dotted;text-underline-offset:4px}
.quote .kp{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 2px}
.quote .src{display:block;direction:rtl;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-top:4px}
.quote .src a{color:var(--accent);font-weight:600;text-decoration:none}

.quote{direction:rtl;text-align:right;font-family:var(--f-rashi);font-size:max(19px,calc(var(--s,1)*16px));line-height:1.55;background:var(--bg);border-radius:10px;padding:8px 12px;flex:1 1 0;min-height:24vh;overflow:auto}
</style>
</head>
<body dir="rtl">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=Cardo:wght@400;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-soft:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;--f-pasuk:"Taamey Frank CLM","Cardo","Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100dvh;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:4px;height:100%}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.top{display:contents}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
h1 span{display:none}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.count b{color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:none}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-pasuk);font-size:22px;line-height:1.7;letter-spacing:.03em;word-spacing:.08em;direction:rtl;text-align:right}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{display:none}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:6px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:8px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:18px;line-height:1.45;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:center;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-body);font-size:17px;line-height:1.4;width:100%;direction:rtl}
.opt .k{flex:none;font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-soft)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.row{display:flex;flex-direction:column;gap:2px}
.row .t{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);direction:rtl}
.row p{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--accent);font-size:18px;font-weight:600;display:inline-block;padding:5px 16px;border:1.5px solid var(--accent);border-radius:9px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:14px;line-height:1.6;direction:rtl;text-align:right}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface);font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line);font-size:14px}
.hint{font-size:14px;color:var(--muted);text-align:center;flex-shrink:0}
.verdict{font-weight:600;font-size:16px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:20px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* taamim: Frank Ruhl lacks cantillation glyphs, so those letters fell back to another font */
.pasuk{font-family:var(--f-pasuk)}
/* pasuk panel: visually separate the verse from the question */
.pasuk{background:var(--accent-soft);border-inline-start:5px solid var(--accent);border-radius:10px;padding:calc(var(--s,1)*6px) calc(var(--s,1)*12px)}
.point{border-top:1px solid var(--line);padding-top:calc(var(--s,1)*8px)}
/* fit layout: only pasuk + question + options in the card; fine print lives in the footer */
.wrap{max-width:min(1500px,100%)}
header .top,.tools,.ref,.dh{display:none}
.card{gap:calc(var(--s,1)*8px)}
.pasuk{font-size:calc(var(--s,1)*22px)}
.q{font-size:calc(var(--s,1)*18px)}
.opt{font-size:calc(var(--s,1)*17px);padding:calc(var(--s,1)*7px) calc(var(--s,1)*10px)}
.opt .k{width:calc(var(--s,1)*20px);height:calc(var(--s,1)*20px);font-size:calc(var(--s,1)*11px)}
.row p{font-size:25px;line-height:1.35}
.verdict{font-size:26px;font-weight:700}
.row .t{font-size:16px}
.point{gap:calc(var(--s,1)*10px)}
.card{position:relative}
.reveal{position:absolute;inset-inline:12px;bottom:56px;z-index:3;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.nav .btn{padding:4px 12px;font-size:13px}
@media (max-width:460px){.pasuk{font-size:calc(var(--s,1)*22px)}}
.hint{font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}

/* wide screens: split layout (pasuk | question+answers), fonts auto-fit each side */
@media (min-width:900px){
.wrap{max-width:min(1800px,100%)}
.card{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr) auto auto;column-gap:22px;row-gap:8px;overflow:hidden}
.card>.pasuk{grid-column:1;grid-row:1;overflow:hidden;align-self:stretch;font-size:calc(var(--sp,1)*22px);padding:calc(var(--sp,1)*10px) calc(var(--sp,1)*14px)}
.card>.point{position:relative;grid-column:2;grid-row:1;min-height:0;overflow:hidden;border-top:0;padding-top:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--s,1)*12px)}
.card>details{grid-column:1/-1;grid-row:2}
.card>.nav{grid-column:1/-1;grid-row:3}
.reveal{position:absolute;inset:auto 0 0 0;z-index:3;max-height:none;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.row p{font-size:calc(var(--s,1)*18px);line-height:1.4}
.verdict{font-size:30px;font-weight:700}
.row .t{font-size:20px}
.q{font-size:calc(var(--s,1)*21px)}
.opt{font-size:calc(var(--s,1)*21px)}
}

/*EN*/
html[dir=ltr] .opt{direction:ltr;text-align:left}
html[dir=ltr] .q{direction:ltr;text-align:left}
html[dir=ltr] .pnum{direction:ltr}
.q .hb,.opt .hb{font-family:var(--f-heb);font-size:1.12em}
.pasuk .pen{direction:ltr;text-align:left;font-family:var(--f-body);font-size:17px;line-height:1.4;letter-spacing:0;word-spacing:0;margin-top:.6em;color:var(--muted)}
.quote .enx{direction:ltr;text-align:left;font-family:var(--f-body);font-size:.82em;line-height:1.4;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.quote .enx i{color:var(--muted)}
.quote .src{direction:ltr}
.hint .ghost{padding:3px 10px;font-size:14px}
.hint select{font-size:14px;padding:3px 5px}
#pa{display:none}
@media print{
  @page{margin:14mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}
  body>*:not(#pa){display:none!important}
  #pa{display:block;font-family:var(--f-body);font-size:11.5pt;line-height:1.4;color:#000}
  #pa h1{font-size:18pt;margin:0 0 4pt}
  #pa .pr-meta{display:flex;justify-content:space-between;gap:16pt;border-bottom:1.5pt solid #000;padding:4pt 0 8pt;margin-bottom:10pt;font-size:11pt}
  #pa .pr-r{break-inside:avoid;margin:0 0 12pt;border-top:.75pt solid #999;padding-top:6pt}
  #pa .pr-ref{font-size:9.5pt;color:#444;margin-bottom:3pt}
  #pa .pr-pasuk{font-family:var(--f-pasuk);font-size:15pt;line-height:1.6;direction:rtl;text-align:right}
  #pa .pr-pasuk mark{background:#e8e8e8;color:#000;text-decoration:underline;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #pa .pr-pen{font-size:9.5pt;color:#333;margin:2pt 0 4pt}
  #pa .pr-q{margin:6pt 0 0}
  #pa .pr-qt{font-weight:600}
  #pa .pr-o{margin:1.5pt 0 0 14pt;display:flex;gap:6pt}
  #pa[dir=rtl] .pr-o{margin:1.5pt 14pt 0 0}
  #pa .pr-o b{flex:none}
  #pa .hb{font-family:var(--f-heb);font-size:1.12em}
  #pa .pr-key{break-before:page}
  #pa .pr-a{break-inside:avoid;margin:0 0 6pt;font-size:10.5pt}
  #pa .pr-ex{display:block;color:#444;font-size:9.5pt}
}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <h1>רש״י · וישב <span>רש״י על וישב</span></h1>
      <div class="count" id="count"></div>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="tools">
      <label for="jump" class="count">עבור אל</label>
      <select id="jump"></select>
      <button class="ghost" id="nextUnanswered" type="button">הבא ללא מענה</button>
      <span id="resetZone"><button class="ghost" id="reset" type="button">התחל מחדש</button></span>
    </div>
  </header>
  <main id="main"></main>
  <div class="hint">מקשים: 1-3 לתשובה · Enter להבא · ← / → לניווט</div>

 "pasuk_en": "אֵלֶּה תֹּלְדוֹת יַעֲקֹב יוֹסֵף בֶּן־שְׁבַע־עֶשְׂרֵה שָׁנָה הָיָה רֹעֶה אֶת־אֶחָיו בַּצֹּאן וְהוּא נַעַר אֶת־בְּנֵי בִלְהָה וְאֶת־בְּנֵי זִלְפָּה נְשֵׁי אָבִיו וַיָּבֵא יוֹסֵף אֶת־דִּבָּתָם רָעָה אֶל־אֲבִיהֶם׃", "rashi_he": "את בני בלהה. כְּלוֹמַר וְרָגִיל אֵצֶל בְּנֵי בִלְהָה, לְפִי שֶׁהָיוּ אֶחָיו מְבַזִּין אוֹתָן וְהוּא מְקָרְבָן:", "rashi_en": "רש״י מפרש שיוסף היה רגיל אצל בני בלהה, מפני שאחיו (בני לאה) היו מבזים אותם והוא היה מקרבם.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ הָיָה יוֹסֵף רָגִיל דַּוְוקָא אֵצֶל בְּנֵי בִּלְהָה?", "options": ["מִפְּנֵי שֶׁאֶחָיו הָיוּ מְבַזִּים אוֹתָם וְיוֹסֵף הָיָה מְקָרְבָם", "מִפְּנֵי שֶׁבְּנֵי בִלְהָה הָיוּ קְרוֹבִים אֵלָיו בְּגִיל וְהָיוּ חֲבֵרָיו", "מִפְּנֵי שֶׁיַּעֲקֹב צִיווָּה עָלָיו לִרְעוֹת אֶת הַצֹּאן יַחַד אִיתָם"], "kasha": "מדוע הכתוב מציין במיוחד שיוסף היה עם בני בלהה?", "answer": "שהיו אחיו מבזים את בני בלהה, ויוסף היה מקרבם.", "kp": ["אחיו מבזין אותן והוא מקרבן"]}]}, {"id": "37:2.4", "ch": 37, "v": 2, "n": 4, "dh": "את דבתם רעה", "pasuk_html": "אֵ֣לֶּה ׀ תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן־שְׁבַֽע־עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת־אֶחָיו֙ בַּצֹּ֔אן וְה֣וּא נַ֗עַר אֶת־בְּנֵ֥י בִלְהָ֛ה וְאֶת־בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑יו וַיָּבֵ֥א יוֹסֵ֛ף <mark>אֶת־דִּבָּתָ֥ם רָעָ֖ה</mark> אֶל־אֲבִיהֶֽם׃", "pasuk_en": "אֵלֶּה תֹּלְדוֹת יַעֲקֹב יוֹסֵף בֶּן־שְׁבַע־עֶשְׂרֵה שָׁנָה הָיָה רֹעֶה אֶת־אֶחָיו בַּצֹּאן וְהוּא נַעַר אֶת־בְּנֵי בִלְהָה וְאֶת־בְּנֵי זִלְפָּה נְשֵׁי אָבִיו וַיָּבֵא יוֹסֵף אֶת־דִּבָּתָם רָעָה אֶל־אֲבִיהֶם׃", "rashi_he": "את דבתם רעה. כָּל רָעָה שֶׁהָיָה רוֹאֶה בְאֶחָיו בְנֵי לֵאָה הָיָה מַגִּיד לְאָבִיו, שֶׁהָיוּ אוֹכְלִין אֵבֶר מִן הַחַי, וּמְזַלְזְלִין בִּבְנֵי הַשְּׁפָחוֹת לִקְרוֹתָן עֲבָדִים, וַחֲשׁוּדִים עַל הָעֲרָיוֹת, וּבִשְׁלָשְׁתָּן לָקָה: וַיִּשְׁחֲטוּ שְׂעִיר עִזִּים בִּמְכִירָתוֹ וְלֹא אֲכָלוּהוּ חַי, וְעַל דִּבָּה שֶׁסִּפֵּר עֲלֵיהֶם שֶׁקּוֹרִין לַאֲחֵיהֶם עֲבָדִים – \"לְעֶבֶד נִמְכַּר יוֹסֵף\", וְעַל עֲרָיוֹת שֶׁסִּפֵּר עֲלֵיהֶם, וַתִּשָּׂא אֵשֶׁת אֲדֹנָיו וְגוֹ:", "rashi_en": "יוסף סיפר לאביו שלושה דברים רעים על אחיו בני לאה: שאכלו אבר מן החי, שזלזלו בבני השפחות וקראו להם עבדים, ושהיו חשודים על העריות. על כל אחת מהדיבות נענש יוסף מידה כנגד מידה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, כֵּיצַד נֶעֱנַשׁ יוֹסֵף עַל הַדִּיבָּה שֶׁסִּיפֵּר עַל אֶחָיו?", "options": ["מִידָּה כְּנֶגֶד מִידָּה: עַל כָּל דִּיבָּה נֶעֱנַשׁ בְּעִנְיַין הַמַּקְבִּיל לָהּ", "נֶעֱנַשׁ רַק עַל דִּיבָּה אַחַת — שֶׁנִּמְכַּר לְעֶבֶד", "לֹא נֶעֱנַשׁ כְּלָל, אֶלָּא אֶחָיו נֶעֱנְשׁוּ עַל מַעֲשֵׂיהֶם"], "kasha": "מדוע התורה מפרטת את תוכן הדיבה, ולא מסתפקת בכך שיוסף סיפר רעה?", "answer": "רש״י מפרט שלוש דיבות ומראה שעל כל אחת נענש יוסף: על אבר מן החי — שחטו שעיר עזים ולא אכלוהו חי; על שקראם עבדים — לעבד נמכר יוסף; על העריות — ותשא אשת אדוניו.", "kp": ["ובשלשתן לקה", "וישחטו שעיר עזים", "לעבד נמכר יוסף"]}, {"q": "לְפִי רַשִׁ״י, עַל מִי סִיפֵּר יוֹסֵף דִּיבָּה?", "options": ["עַל אֶחָיו בְּנֵי לֵאָה", "עַל בְּנֵי בִלְהָה וּבְנֵי זִלְפָּה", "עַל כָּל אֶחָיו לְלֹא הֶבְדֵּל"], "kasha": "הפסוק אומר שיוסף היה עם בני בלהה וזלפה, אז על מי סיפר דיבה?", "answer": "רש״י מבהיר שהדיבה הייתה על אחיו בני לאה, לא על בני השפחות שעמם התרועע.", "kp": ["באחיו בני לאה היה מגיד לאביו"]}]}, {"id": "37:2.5", "ch": 37, "v": 2, "n": 5, "dh": "דבתם", "pasuk_html": "אֵ֣לֶּה ׀ תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן־שְׁבַֽע־עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת־אֶחָיו֙ בַּצֹּ֔אן וְה֣וּא נַ֗עַר אֶת־בְּנֵ֥י בִלְהָ֛ה וְאֶת־בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑יו וַיָּבֵ֥א יוֹסֵ֛ף אֶת־<mark>דִּבָּתָ֥ם</mark> רָעָ֖ה אֶל־אֲבִיהֶֽם׃", "pasuk_en": "אֵלֶּה תֹּלְדוֹת יַעֲקֹב יוֹסֵף בֶּן־שְׁבַע־עֶשְׂרֵה שָׁנָה הָיָה רֹעֶה אֶת־אֶחָיו בַּצֹּאן וְהוּא נַעַר אֶת־בְּנֵי בִלְהָה וְאֶת־בְּנֵי זִלְפָּה נְשֵׁי אָבִיו וַיָּבֵא יוֹסֵף אֶת־דִּבָּתָם רָעָה אֶל־אֲבִיהֶם׃", "rashi_he": "דבתם. כָּל לְשׁוֹן דִּבָּה פרלדי\"ץ בְּלַעַז, כָּל מַה שֶּׁהָיָה יָכוֹל לְדַבֵּר בָּהֶם רָעָה, הָיָה מְסַפֵּר:", "rashi_en": "רש״י מסביר שהמילה 'דבה' פירושה רכילות — כל דבר רע שיוסף יכול היה לומר על אחיו, הוא סיפר.", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ״י מַגְדִּיר אֶת הַמִּילָּה 'דִּבָּה'?", "options": ["רְכִילוּת — כָּל רָעָה שֶׁיָּכוֹל לְסַפֵּר, סִיפֵּר", "שֶׁקֶר מֻוחְלָט שֶׁהִמְצִיא עַל אֶחָיו", "תְּלוּנָה מוּצְדֶּקֶת שֶׁהֵגִישׁ לְאָבִיו"], "kasha": "מה משמעות המילה 'דבה' בפסוק?", "answer": "רש״י מפרש ש'דבה' היא רכילות: כל מה שיוסף יכול היה לדבר בהם רעה, היה מספר.", "kp": ["כל מה שהיה יכול לדבר בהם רעה היה מספר"]}]}, {"id": "37:2.6", "ch": 37, "v": 2, "n": 6, "dh": "דבה", "pasuk_html": "אֵ֣לֶּה ׀ תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן־שְׁבַֽע־עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת־אֶחָיו֙ בַּצֹּ֔אן וְה֣וּא נַ֗עַר אֶת־בְּנֵ֥י בִלְהָ֛ה וְאֶת־בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑יו וַיָּבֵ֥א יוֹסֵ֛ף אֶת־דִּבָּתָ֥ם רָעָ֖ה אֶל־אֲבִיהֶֽם׃", "pasuk_en": "אֵלֶּה תֹּלְדוֹת יַעֲקֹב יוֹסֵף בֶּן־שְׁבַע־עֶשְׂרֵה שָׁנָה הָיָה רֹעֶה אֶת־אֶחָיו בַּצֹּאן וְהוּא נַעַר אֶת־בְּנֵי בִלְהָה וְאֶת־בְּנֵי זִלְפָּה נְשֵׁי אָבִיו וַיָּבֵא יוֹסֵף אֶת־דִּבָּתָם רָעָה אֶל־אֲבִיהֶם׃", "rashi_he": "דבה. לְשׁוֹן דּוֹבֵב שִׂפְתֵי יְשֵׁנִים (שיר ז'):", "rashi_en": "רש״י מקשר את המילה 'דבה' לשורש ד-ב-ב, כמו 'דובב שפתי ישנים' — לשון דיבור.", "note": "", "points": [{"q": "מֵאֵיזֶה שׁוֹרֶשׁ נִגְזֶרֶת הַמִּילָּה 'דִּבָּה' לְפִי רַשִׁ״י?", "options": ["מִלְּשׁוֹן 'דּוֹבֵב שִׂפְתֵי יְשֵׁנִים' — שֹׁורֶשׁ דִּיבּוּר", "מִלְּשׁוֹן 'דֹּוב' — כְּחַיָּה הַטּוֹרֶפֶת בַּסֵּתֶר", "מִלְּשׁוֹן 'דַּאֲבָה' — צַעַר וּכְאֵב"], "kasha": "מה מקור המילה 'דבה' ומה שורשה?", "answer": "רש״י מסביר שהמילה 'דבה' קשורה ללשון 'דובב שפתי ישנים', כלומר שורשה בדיבור.", "kp": ["לשון דובב שפתי ישנים"]}]}, {"id": "37:3.1", "ch": 37, "v": 3, "n": 1, "dh": "בן זקנים", "pasuk_html": "וְיִשְׂרָאֵ֗ל אָהַ֤ב אֶת־יוֹסֵף֙ מִכָּל־בָּנָ֔יו כִּֽי־<mark>בֶן־זְקֻנִ֥ים</mark> ה֖וּא ל֑וֹ וְעָ֥שָׂה ל֖וֹ כְּתֹ֥נֶת פַּסִּֽים׃", "pasuk_en": "וְיִשְׂרָאֵל אָהַב אֶת־יוֹסֵף מִכָּל־בָּנָיו כִּי־בֶן־זְקֻנִים הוּא לוֹ וְעָשָׂה לוֹ כְּתֹנֶת פַּסִּים׃", "rashi_he": "בן זקנים. שֶׁנּוֹלַד לוֹ לְעֵת זִקְנָתוֹ. וְאֻנְקְלוֹס תִּרְגֵּם בַּר חַכִּים הוּא לֵהּ – כָּל מַה שֶּׁלָּמַד מִשֵּׁם וָעֵבֶר מָסַר לוֹ. דָּ\"אַ, שֶׁהָיָה זִיו אִיקוֹנִין שֶׁלוֹ דּוֹמֶה לוֹ:", "rashi_en": "רש״י מביא שלושה פירושים לביטוי 'בן זקונים': שנולד ליעקב בזקנותו; שהיה בן חכם שלמד ממנו את תורת שם ועבר; ושפניו של יוסף דמו לפני יעקב.", "note": "", "points": [{"q": "כֵּיצַד אוּנְקְלוֹס מְתַרְגֵּם 'בֶּן זְקֻונִים' לְפִי רַשִׁ״י?", "options": ["בַּר חֲכִים — בֶּן חָכָם שֶׁקִּיבֵּל תּוֹרַת שֵׁם וָעֵבֶר", "בַּר סֵיב — בֶּן שֶׁנּוֹלַד בְּזִקְנָה", "בַּר רְחִים — בֶּן אָהוּב וְחָבִיב"], "kasha": "מדוע התורה משתמשת בביטוי 'בן זקונים' ולא אומרת בפירוש מדוע אהבו?", "answer": "אונקלוס מתרגם 'בר חכים' — בן חכם, כי כל מה שיעקב למד משם ועבר מסר ליוסף.", "kp": ["בר חכים הוא לה", "כל מה שלמד משם ועבר מסר לו"]}, {"q": "מַהוּ הַפֵּירוּשׁ הַשְּׁלִישִׁי שֶׁרַשׁ״י מֵבִיא לְ'בֶן זְקֻונִים'?", "options": ["שֶׁפָּנָיו שֶׁל יוֹסֵף הָיוּ דּוֹמוֹת לִפְנֵי יַעֲקֹב", "שֶׁיּוֹסֵף טִיפֵּל בְּיַעֲקֹב בְּזִקְנָותוֹ", "שֶׁיּוֹסֵף נָהַג כְּזָקֵן חָכָם לְמַרּוֹת גִּילוֹ"], "kasha": "רש״י לא מסתפק בפירוש אחד ומביא שלושה — מהו הפירוש השלישי?", "answer": "רש״י אומר שזיו איקונין של יוסף היה דומה ליעקב, כלומר פניהם היו דומות.", "kp": ["שהיה זיו איקונין שלו דומה לו"]}]}, {"id": "37:3.2", "ch": 37, "v": 3, "n": 2, "dh": "פסים", "pasuk_html": "וְיִשְׂרָאֵ֗ל אָהַ֤ב אֶת־יוֹסֵף֙ מִכָּל־בָּנָ֔יו כִּֽי־בֶן־זְקֻנִ֥ים ה֖וּא ל֑וֹ וְעָ֥שָׂה ל֖וֹ כְּתֹ֥נֶת <mark>פַּסִּֽים׃</mark>", "pasuk_en": "וְיִשְׂרָאֵל אָהַב אֶת־יוֹסֵף מִכָּל־בָּנָיו כִּי־בֶן־זְקֻנִים הוּא לוֹ וְעָשָׂה לוֹ כְּתֹנֶת פַּסִּים׃", "rashi_he": "פסים. לְשׁוֹן כְּלִי מֵילָת, כְּמוֹ כַּרְפַּס וּתְכֵלֶת, וּכְמוֹ כְּתֹנֶת הַפַּסִּים דְּתָמָר וְאַמְנוֹן, וּמִ\"אַ עַ\"שֵׁ צָרוֹתָיו, שֶׁנִּמְכַּר לְפוֹטִיפַר וְלַסּוֹחֲרִים וְלַיִּשְׁמְעֵאלִים וְלַמִּדְיָנִים:", "rashi_en": "רש״י מביא שני פירושים למילה פסים: לפי הפשט, בגד מצמר משובח כמו כרפס ותכלת. לפי המדרש, פסים רומז לצרותיו של יוסף — שנמכר לפוטיפר, לסוחרים, לישמעאלים ולמדינים.", "note": "", "points": [{"q": "לְפִי הַפְּשָׁט בְּרַשׁ״י, מַהוּ כְּתֹונֶת פַּסִּים?", "options": ["בֶּגֶד מִצֶּמֶר מְשֻׁובָּח, כְּמוֹ כַּרְפַּס וּתְכֵלֶת", "בֶּגֶד מְפֻוסְפָּס בִּצְבָעִים שׁוֹנִים", "בֶּגֶד אָרוֹךְ הַמַּגִּיעַ עַד כַּפּוֹת הָרַגְלַיִים"], "kasha": "המילה פסים אינה מובנת מאליה וצריך לבאר את משמעותה.", "answer": "פסים פירושו כלי מילת, כלומר בגד מצמר משובח, כמו כרפס ותכלת שבמגילת אסתר, וכמו כתונת הפסים של תמר ואמנון.", "kp": ["לשון כלי מילת", "כמו כרפס ותכלת"]}, {"q": "לְפִי הַמִּדְרָשׁ שֶׁמֵּבִיא רַשׁ״י, לָמָּה נִקְרָא הַבֶּגֶד פַּסִּים?", "options": ["עַל שֵׁם צָרוֹתָיו — שֶׁנִּמְכַּר לְפוֹטִיפַר, לְסוֹחֲרִים, לְיִשְׁמְעֵאלִים וּלְמִדְיָנִים", "עַל שֵׁם אַרְבַּעַת הַצְּבָעִים שֶׁהָיוּ בוֹ", "עַל שֵׁם אַרְבַּעַת הָאָבוֹת שֶׁלָּבְשׁוּ בֶּגֶד דּוֹמֶה"], "kasha": "אם פסים פירושו בגד משובח, מדוע בחרה התורה דווקא במילה זו?", "answer": "לפי המדרש, פסים הוא רמז לצרותיו של יוסף: שנמכר לפוטיפר, לסוחרים, לישמעאלים ולמדינים.", "kp": ["ע\"ש צרותיו", "שנמכר לפוטיפר ולסוחרים ולישמעאלים ולמדינים"]}]}, {"id": "37:4.1", "ch": 37, "v": 4, "n": 1, "dh": "ולא יכלו דברו לשלום", "pasuk_html": "וַיִּרְא֣וּ אֶחָ֗יו כִּֽי־אֹת֞וֹ אָהַ֤ב אֲבִיהֶם֙ מִכָּל־אֶחָ֔יו וַֽיִּשְׂנְא֖וּ אֹת֑וֹ <mark>וְלֹ֥א יָכְל֖וּ דַּבְּר֥וֹ לְשָׁלֹֽם׃</mark>", "pasuk_en": "וַיִּרְאוּ אֶחָיו כִּי־אֹתוֹ אָהַב אֲבִיהֶם מִכָּל־אֶחָיו וַיִּשְׂנְאוּ אֹתוֹ וְלֹא יָכְלוּ דַּבְּרוֹ לְשָׁלֹם׃", "rashi_he": "ולא יכלו דברו לשלום. מִתּוֹךְ גְּנוּתָם לָמַדְנוּ שִׁבְחָם, שֶׁלֹּא דִבְּרוּ אַחַת בַּפֶּה וְאַחַת בַּלֵּב:", "rashi_en": "רש״י מלמד שדווקא מתוך הגנאי של האחים — ששנאו את יוסף ולא יכלו לדבר עמו לשלום — יש ללמוד את שבחם: שלא היו צבועים, ולא אמרו דבר אחד בפה וחשבו אחרת בלב.", "note": "", "points": [{"q": "מַהוּ הַשֶּׁבַח שֶׁרַשׁ״י מוֹצֵא בָּאַחִים דַּוְוקָא מִתּוֹךְ גְּנוּתָם?", "options": ["שֶׁלֹּא דִּיבְּרוּ אַחַת בַּפֶּה וְאַחַת בַּלֵּב", "שֶׁהִתְאַפְּקוּ וְלֹא פָּגְעוּ בְּיוֹסֵף בַּפֹּועַל", "שֶׁשָּׂנְאוּ אוֹתוֹ רַק בִּגְלַל כִּיבּוּד אֲבִיהֶם"], "kasha": "לכאורה הפסוק מגנה את האחים, ולא ברור מדוע רש״י מוצא כאן שבח.", "answer": "מתוך גנותם למדנו שבחם: מכך שלא יכלו לדבר עמו לשלום, רואים שלא היו צבועים — לא אמרו דבר אחד בפה וחשבו אחרת בלב.", "kp": ["מתוך גנותם למדנו שבחם", "שלא דברו אחת בפה ואחת בלב"]}]}, {"id": "37:4.2", "ch": 37, "v": 4, "n": 2, "dh": "דברו", "pasuk_html": "וַיִּרְא֣וּ אֶחָ֗יו כִּֽי־אֹת֞וֹ אָהַ֤ב אֲבִיהֶם֙ מִכָּל־אֶחָ֔יו וַֽיִּשְׂנְא֖וּ אֹת֑וֹ וְלֹ֥א יָכְל֖וּ <mark>דַּבְּר֥וֹ</mark> לְשָׁלֹֽם׃", "pasuk_en": "וַיִּרְאוּ אֶחָיו כִּי־אֹתוֹ אָהַב אֲבִיהֶם מִכָּל־אֶחָיו וַיִּשְׂנְאוּ אֹתוֹ וְלֹא יָכְלוּ דַּבְּרוֹ לְשָׁלֹם׃", "rashi_he": "דברו. לְדַבֵּר עִמּוֹ:", "rashi_en": "רש״י מסביר שהמילה דברו פירושה לדבר עמו, כלומר מדובר בשם פעולה ולא בציווי.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה דִּבְּרוּ?", "options": ["לְדַבֵּר עִמּוֹ — שֵׁם פְּעֻולָּה", "דִּיבְּרוּ אֵלָיו — לְשׁוֹן עָבָר", "דַּבְּרוּ אֵלָיו — לְשׁוֹן צִיּוּוי"], "kasha": "צורת המילה דברו עלולה להתפרש בכמה אופנים וצריך לברר את משמעותה.", "answer": "רש״י מבאר שדברו פירושו לדבר עמו, כלומר לא יכלו לדבר עמו בשלום.", "kp": ["לדבר עמו"]}]}, {"id": "37:7.1", "ch": 37, "v": 7, "n": 1, "dh": "מאלמים אלמים", "pasuk_html": "וְ֠הִנֵּה אֲנַ֜חְנוּ <mark>מְאַלְּמִ֤ים אֲלֻמִּים֙</mark> בְּת֣וֹךְ הַשָּׂדֶ֔ה וְהִנֵּ֛ה קָ֥מָה אֲלֻמָּתִ֖י וְגַם־נִצָּ֑בָה וְהִנֵּ֤ה תְסֻבֶּ֙ינָה֙ אֲלֻמֹּ֣תֵיכֶ֔ם וַתִּֽשְׁתַּחֲוֶ֖יןָ לַאֲלֻמָּתִֽי׃", "pasuk_en": "וְהִנֵּה אֲנַחְנוּ מְאַלְּמִים אֲלֻמִּים בְּתוֹךְ הַשָּׂדֶה וְהִנֵּה קָמָה אֲלֻמָּתִי וְגַם־נִצָּבָה וְהִנֵּה תְסֻבֶּינָה אֲלֻמֹּתֵיכֶם וַתִּשְׁתַּחֲוֶיןָ לַאֲלֻמָּתִי׃", "rashi_he": "מאלמים אלמים. כְּתַרְגּוּמוֹ מְאַסְּרִין אֱסָרִין – עֳמְרִין, וְכֵן נֹשֵׂא אֲלֻמֹּתָיו (תהלים קכ\"ו), וְכָמוֹהוּ בִּלְשׁוֹן מִשְׁנָה וְהָאֲלֻמּוֹת נוֹטֵל וּמַכְרִיז:", "rashi_en": "רש״י מפרש שמאלמים אלמים פירושו אוסרים עמרים (אלומות של תבואה), כתרגום אונקלוס, ומביא ראיות מתהלים ומלשון המשנה.", "note": "", "points": [{"q": "מַהוּ פֵּירוּשׁ מְאַלְּמִים אֲלֻמִּים לְפִי רַשׁ״י?", "options": ["אוֹסְרִים אֲלֻומּוֹת (עֳמָרִים) שֶׁל תְּבוּאָה", "מְרִימִים עֲרֵימוֹת שֶׁל חָצִיר מֵהַשָּׂדֶה", "זוֹרְעִים זְרָעִים בְּתוֹךְ הַשָּׂדֶה"], "kasha": "המילה אלמים אינה שכיחה במקרא וצריך לבאר את משמעותה.", "answer": "מאלמים אלמים פירושו אוסרים אלומות, כתרגום אונקלוס מאסרין אסרין עמרין, וכן נמצא בתהלים ובלשון המשנה.", "kp": ["מאסרין אסרין עמרין"]}]}, {"id": "37:7.2", "ch": 37, "v": 7, "n": 2, "dh": "קמה אלמתי", "pasuk_html": "וְ֠הִנֵּה אֲנַ֜חְנוּ מְאַלְּמִ֤ים אֲלֻמִּים֙ בְּת֣וֹךְ הַשָּׂדֶ֔ה וְהִנֵּ֛ה <mark>קָ֥מָה אֲלֻמָּתִ֖י</mark> וְגַם־נִצָּ֑בָה וְהִנֵּ֤ה תְסֻבֶּ֙ינָה֙ אֲלֻמֹּ֣תֵיכֶ֔ם וַתִּֽשְׁתַּחֲוֶ֖יןָ לַאֲלֻמָּתִֽי׃", "pasuk_en": "וְהִנֵּה אֲנַחְנוּ מְאַלְּמִים אֲלֻמִּים בְּתוֹךְ הַשָּׂדֶה וְהִנֵּה קָמָה אֲלֻמָּתִי וְגַם־נִצָּבָה וְהִנֵּה תְסֻבֶּינָה אֲלֻמֹּתֵיכֶם וַתִּשְׁתַּחֲוֶיןָ לַאֲלֻמָּתִי׃", "rashi_he": "קמה אלמתי. נִזְקְפָה:", "rashi_en": "רש\"י מפרש שהמילה \"קמה\" פירושה נזקפה, כלומר האלומה זקפה את עצמה ועמדה זקופה.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ\"י אֶת הַמִּילָּה \"קָמָה\" בְּהֶקְשֵׁר שֶׁל הָאֲלֻומָּה?", "options": ["נִזְקְפָה — עָמְדָה זְקוּפָה", "הִתְרוֹמְמָה בָּאֲווִּיר מֵעַל הַקַּרְקַע", "הֵחֵלָּה לָנוּעַ לְעֵבֶר הָאֲלֻומּוֹת הָאֲחֵרוֹת"], "kasha": "מה המשמעות המדויקת של \"קמה\" ביחס לאלומה, שהרי קימה יכולה להתפרש בכמה אופנים.", "answer": "רש\"י מפרש ש\"קמה\" פירושו נזקפה, כלומר האלומה עמדה בזקיפות.", "kp": ["נזקפה"]}]}, {"id": "37:7.3", "ch": 37, "v": 7, "n": 3, "dh": "וגם נצבה", "pasuk_html": "וְ֠הִנֵּה אֲנַ֜חְנוּ מְאַלְּמִ֤ים אֲלֻמִּים֙ בְּת֣וֹךְ הַשָּׂדֶ֔ה וְהִנֵּ֛ה קָ֥מָה אֲלֻמָּתִ֖י <mark>וְגַם־נִצָּ֑בָה</mark> וְהִנֵּ֤ה תְסֻבֶּ֙ינָה֙ אֲלֻמֹּ֣תֵיכֶ֔ם וַתִּֽשְׁתַּחֲוֶ֖יןָ לַאֲלֻמָּתִֽי׃", "pasuk_en": "וְהִנֵּה אֲנַחְנוּ מְאַלְּמִים אֲלֻמִּים בְּתוֹךְ הַשָּׂדֶה וְהִנֵּה קָמָה אֲלֻמָּתִי וְגַם־נִצָּבָה וְהִנֵּה תְסֻבֶּינָה אֲלֻמֹּתֵיכֶם וַתִּשְׁתַּחֲוֶיןָ לַאֲלֻמָּתִי׃", "rashi_he": "וגם נצבה. לַעֲמֹד עַל עָמְדָהּ בִּזְקִיפָה:", "rashi_en": "רש\"י מבאר שהמילה \"נצבה\" מוסיפה על \"קמה\" — לא רק שקמה, אלא עמדה על עומדה בזקיפה יציבה ומתמשכת.", "note": "", "points": [{"q": "מַה מוֹסִיפָה הַמִּילָּה \"נִצָּבָה\" מֵעֵבֶר לְ\"קָמָה\", לְפִי רַשִׁ\"י?", "options": ["שֶׁעָמְדָה עַל עֳמָדָה בִּזְקִיפָה יְצִיבָה", "שֶׁהֵחֵלָּה לָלֶכֶת לְעֵבֶר הָאֲלֻומּוֹת", "שֶׁגָּדְלָה וְהֶאֱרִיכָה מֵעַל כֻּולָּן"], "kasha": "לכאורה \"נצבה\" ו\"קמה\" הם מילים נרדפות, ומדוע הכפילות.", "answer": "רש\"י מפרש ש\"נצבה\" משמעו לעמוד על עמדה בזקיפה, כלומר עמידה יציבה וקבועה.", "kp": ["לעמד על עמדה בזקיפה"]}]}, {"id": "37:8.1", "ch": 37, "v": 8, "n": 1, "dh": "ועל דבריו", "pasuk_html": "וַיֹּ֤אמְרוּ לוֹ֙ אֶחָ֔יו הֲמָלֹ֤ךְ תִּמְלֹךְ֙ עָלֵ֔ינוּ אִם־מָשׁ֥וֹל תִּמְשֹׁ֖ל בָּ֑נוּ וַיּוֹסִ֤פוּ עוֹד֙ שְׂנֹ֣א אֹת֔וֹ עַל־חֲלֹמֹתָ֖יו <mark>וְעַל־דְּבָרָֽיו׃</mark>", "pasuk_en": "וַיֹּאמְרוּ לוֹ אֶחָיו הֲמָלֹךְ תִּמְלֹךְ עָלֵינוּ אִם־מָשׁוֹל תִּמְשֹׁל בָּנוּ וַיּוֹסִפוּ עוֹד שְׂנֹא אֹתוֹ עַל־חֲלֹמֹתָיו וְעַל־דְּבָרָיו׃", "rashi_he": "ועל דבריו. עַל דִּבָּתָם רָעָה שֶׁהָיָה מֵבִיא לַאֲבִיהֶם:", "rashi_en": "רש\"י מבאר ש\"דבריו\" אינו מתייחס לדברי החלומות, אלא לדיבה הרעה שהיה יוסף מביא על אחיו לאביהם.", "note": "", "points": [{"q": "לָמָּה מִתְייַחֵס \"וְעַל־דְּבָרָיו\" לְפִי רַשִׁ\"י?", "options": ["לְדִיבָּה הָרָעָה שֶׁהֵבִיא יוֹסֵף עַל אֶחָיו לַאֲבִיהֶם", "לְדִבְרֵי הֶחָלוֹם שֶׁסִּיפֵּר לְאֶחָיו", "לְדִבְרֵי הַגְּעָרָה שֶׁאָמַר לָהֶם אֲבִיהֶם"], "kasha": "הפסוק כבר הזכיר \"על חלומותיו\", ואם כן מה מוסיף \"ועל דבריו\" — הרי גם דברי החלום כבר נכללו.", "answer": "רש\"י מפרש ש\"דבריו\" הם הדיבה הרעה שהיה מביא על אחיו לאביהם, ולא דברי החלומות.", "kp": ["על דבתם רעה", "שהיה מביא לאביהם"]}]}, {"id": "37:10.1", "ch": 37, "v": 10, "n": 1, "dh": "ויספר אל אביו ואל אחיו", "pasuk_html": "<mark>וַיְסַפֵּ֣ר אֶל־אָבִיו֮ וְאֶל־אֶחָיו֒</mark> וַיִּגְעַר־בּ֣וֹ אָבִ֔יו וַיֹּ֣אמֶר ל֔וֹ מָ֛ה הַחֲל֥וֹם הַזֶּ֖ה אֲשֶׁ֣ר חָלָ֑מְתָּ הֲב֣וֹא נָב֗וֹא אֲנִי֙ וְאִמְּךָ֣ וְאַחֶ֔יךָ לְהִשְׁתַּחֲוֺ֥ת לְךָ֖ אָֽרְצָה׃", "pasuk_en": "וַיְסַפֵּר אֶל־אָבִיו וְאֶל־אֶחָיו וַיִּגְעַר־בּוֹ אָבִיו וַיֹּאמֶר לוֹ מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ הֲבוֹא נָבוֹא אֲנִי וְאִמְּךָ וְאַחֶיךָ לְהִשְׁתַּחֲוֺת לְךָ אָרְצָה׃", "rashi_he": "ויספר אל אביו ואל אחיו. לְאַחַר שֶׁסִּפֵּר אוֹתוֹ לְאֶחָיו חָזַר וְסִפְּרוֹ לְאָבִיו בִּפְנֵיהֶם:", "rashi_en": "רש\"י מבאר את סדר הסיפור: תחילה סיפר יוסף את החלום לאחיו, ואחר כך חזר וסיפרו לאביו בפני האחים.", "note": "", "points": [{"q": "כֵּיצַד מַסְבִּיר רַשִׁ\"י אֶת סֵדֶר סִיפּוּר הַחֲלוֹם לְאָבִיו וּלְאֶחָיו?", "options": ["סִיפֵּר קֹודֶם לְאֶחָיו, וְאַחַר כָּךְ חָזַר וְסִיפֵּר לְאָבִיו בִּפְנֵיהֶם", "סִיפֵּר לְאָבִיו וּלְאֶחָיו יַחַד בְּאוֹתוֹ מַעֲמָד", "סִיפֵּר קֹודֶם לְאָבִיו בְּנִפְרָד, וְאַחַר כָּךְ לְאֶחָיו"], "kasha": "הפסוק מקדים \"אל אביו\" ל\"אל אחיו\", אך בפסוק הקודם כבר סיפר לאחיו, אז מה סדר האירועים.", "answer": "לפי רש\"י, לאחר שסיפר את החלום לאחיו, חזר וסיפרו שוב לאביו בנוכחות האחים.", "kp": ["לאחר שספר אותו לאחיו", "חזר וספרו לאביו בפניהם"]}]}, {"id": "37:10.2", "ch": 37, "v": 10, "n": 2, "dh": "ויגער בו", "pasuk_html": "וַיְסַפֵּ֣ר אֶל־אָבִיו֮ וְאֶל־אֶחָיו֒ <mark>וַיִּגְעַר־בּ֣וֹ</mark> אָבִ֔יו וַיֹּ֣אמֶר ל֔וֹ מָ֛ה הַחֲל֥וֹם הַזֶּ֖ה אֲשֶׁ֣ר חָלָ֑מְתָּ הֲב֣וֹא נָב֗וֹא אֲנִי֙ וְאִמְּךָ֣ וְאַחֶ֔יךָ לְהִשְׁתַּחֲוֺ֥ת לְךָ֖ אָֽרְצָה׃", "pasuk_en": "וַיְסַפֵּר אֶל־אָבִיו וְאֶל־אֶחָיו וַיִּגְעַר־בּוֹ אָבִיו וַיֹּאמֶר לוֹ מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ הֲבוֹא נָבוֹא אֲנִי וְאִמְּךָ וְאַחֶיךָ לְהִשְׁתַּחֲוֺת לְךָ אָרְצָה׃", "rashi_he": "ויגער בו. לְפִי שֶׁהָיָה מֵטִיל שִׂנְאָה עָלָיו:", "rashi_en": "יעקב גער ביוסף על שסיפר את חלומו לאחיו, כי בכך הטיל שנאה על עצמו.", "note": "", "points": [{"q": "מַדּוּעַ גָּעַר יַעֲקֹב בְּיוֹסֵף לְפִי רַשִׁ״י?", "options": ["כִּי הָיָה מַטִּיל שִׂנְאָה עַל עַצְמוֹ בִּפְנֵי אֶחָיו", "כִּי הַחֲלוֹם עַצְמוֹ הָיָה שַׁקְרִי וְלֹא רָאוּי לְסַפְּרוֹ", "כִּי אָסוּר לְסַפֵּר חֲלוֹמוֹת לִפְנֵי בְּנֵי הַמִּשְׁפָּחָה"], "kasha": "מדוע גער יעקב ביוסף דווקא עכשיו, אחרי החלום השני?", "answer": "יעקב גער בו כי בסיפור החלום לאחיו הוא גורם לעצמו שנאה.", "kp": ["שהיה מטיל שנאה עליו"]}]}, {"id": "37:10.3", "ch": 37, "v": 10, "n": 3, "dh": "הבוא נבוא", "pasuk_html": "וַיְסַפֵּ֣ר אֶל־אָבִיו֮ וְאֶל־אֶחָיו֒ וַיִּגְעַר־בּ֣וֹ אָבִ֔יו וַיֹּ֣אמֶר ל֔וֹ מָ֛ה הַחֲל֥וֹם הַזֶּ֖ה אֲשֶׁ֣ר חָלָ֑מְתָּ <mark>הֲב֣וֹא נָב֗וֹא</mark> אֲנִי֙ וְאִמְּךָ֣ וְאַחֶ֔יךָ לְהִשְׁתַּחֲוֺ֥ת לְךָ֖ אָֽרְצָה׃", "pasuk_en": "וַיְסַפֵּר אֶל־אָבִיו וְאֶל־אֶחָיו וַיִּגְעַר־בּוֹ אָבִיו וַיֹּאמֶר לוֹ מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ הֲבוֹא נָבוֹא אֲנִי וְאִמְּךָ וְאַחֶיךָ לְהִשְׁתַּחֲוֺת לְךָ אָרְצָה׃", "rashi_he": "הבוא נבוא. וַהֲלֹא אִמְּךָ כְבָר מֵתָה, וְהוּא לֹא הָיָה יוֹדֵעַ שֶׁהַדְּבָרִים מַגִּיעִין לְבִלְהָה שֶׁגִּדְּלַתּוּ כְּאִמּוֹ. וְרַבּוֹתֵינוּ לָמְדוּ מִכָּאן שֶׁאֵין חֲלוֹם בְּלֹא דְּבָרִים בְּטֵלִים, וְיַעֲקֹב נִתְכַּוֵּן לְהוֹצִיא הַדָּבָר מִלֵּב בָּנָיו שֶׁלֹּא יַקְנִיאוּהוּ, לְכָךְ אָמַר לוֹ הֲבוֹא נָבוֹא וְגוֹ' – כְּשֵׁם שֶׁאִי אֶפְשָׁר בְּאִמְּךָ כָּךְ הַשְּׁאָר הוּא בָטֵל:", "rashi_en": "יעקב שאל 'הבוא נבוא אני ואמך' — והרי רחל כבר מתה. יעקב התכוון להוציא את הדבר מלב האחים כדי שלא יקנאו ביוסף, בטענה שכשם שחלק זה בלתי אפשרי כך כל החלום בטל. חז״ל למדו מכאן שאין חלום בלא דברים בטלים. ובאמת הדברים מגיעים לבלהה שגידלה את יוסף כאמו.", "note": "", "points": [{"q": "מַה הִקְשָׁה יַעֲקֹב עַל הַחֲלוֹם כְּשֶׁאָמַר 'הֲבוֹא נָבוֹא אֲנִי וְאִמְּךָ'?", "options": ["רָחֵל כְּבָר מֵתָה, וְאִי אֶפְשָׁר שֶׁתָּבוֹא לְהִשְׁתַּחֲווֹת", "בִּלְהָה אֵינָהּ נֶחְשֶׁבֶת אֵם וְאֵינָהּ כְּלוּלָה בַּחֲלוֹם", "יַעֲקֹב עַצְמוֹ הָיָה זָקֵן מִדַּי לָבוֹא לְהִשְׁתַּחֲווֹת"], "kasha": "כיצד ייתכן שאמו של יוסף תשתחווה לו, והרי רחל כבר מתה?", "answer": "יעקב הקשה שרחל כבר מתה, והתכוון להוציא הדבר מלב האחים שלא יקנאו, באומרו: כשם שאי אפשר באמך כך השאר בטל.", "kp": ["אמך כבר מתה", "להוציא הדבר מלב בניו שלא יקניאוהו"]}, {"q": "מַה לָמְדוּ חֲזַ״ל מִכָּךְ שֶׁהַחֲלוֹם כָּלַל פְּרָט בִּלְתִּי אֶפְשָׁרִי?", "options": ["שֶׁאֵין חֲלוֹם בְּלֹא דְּבָרִים בְּטֵלִים", "שֶׁחֲלוֹם שֶׁיֵּשׁ בּוֹ טָעוּת כֻּולּוֹ בָּטֵל וּמְבֻוטָּל", "שֶׁחֲלוֹמוֹת הֵם רַק מָשָׁל וְאֵין בָּהֶם מַמָּשׁ"], "kasha": "אם חלק מהחלום אינו יכול להתקיים, מה זה מלמד על טיב החלומות?", "answer": "חז״ל למדו מכאן שכל חלום כולל גם דברים בטלים, ואין חלום שכולו מתקיים.", "kp": ["אין חלום בלא דברים בטלים"]}]}, {"id": "37:11.1", "ch": 37, "v": 11, "n": 1, "dh": "שמר את הדבר", "pasuk_html": "וַיְקַנְאוּ־ב֖וֹ אֶחָ֑יו וְאָבִ֖יו <mark>שָׁמַ֥ר אֶת־הַדָּבָֽר׃</mark>", "pasuk_en": "וַיְקַנְאוּ־בוֹ אֶחָיו וְאָבִיו שָׁמַר אֶת־הַדָּבָר׃", "rashi_he": "שמר את הדבר. הָיָה מַמְתִּין וּמְצַפֶּה מָתַי יָבֹא, וְכֵן שֹׁמֵר אֱמֻנִים (ישעיהו כ\"ו), וְכֵן לֹא תִשְׁמֹר עַל חַטָּאתִי (איוב י\"ד) – לֹא תַמְתִּין:", "rashi_en": "רש״י מסביר ש'שמר את הדבר' פירושו שיעקב המתין וציפה מתי יתקיים החלום, כמו 'שומר אמונים' — מצפה לקיום.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ 'שָׁמַר אֶת הַדָּבָר' לְפִי רַשׁ״י?", "options": ["הָיָה מְמַתִּין וּמְצַפֶּה מָתַי יִתְקַיֵּים הַחֲלוֹם", "שָׁמַר אֶת סוֹד הַחֲלוֹם וְלֹא גִּילָּה אוֹתוֹ לְאִישׁ", "זָכַר אֶת הַחֲלוֹם וְרָשַׁם אוֹתוֹ לְזִיכָּרוֹן"], "kasha": "מה משמעות 'שמירה' כאן — האם שמר סוד או שמר עניין אחר?", "answer": "שמירה כאן פירושה המתנה וציפייה, כלומר יעקב ציפה מתי יבוא החלום לידי מימוש.", "kp": ["היה ממתין ומצפה מתי יבא"]}]}, {"id": "37:12.1", "ch": 37, "v": 12, "n": 1, "dh": "לרעות את צאן", "pasuk_html": "וַיֵּלְכ֖וּ אֶחָ֑יו <mark>לִרְע֛וֹת אֶׄתׄ־צֹ֥אן</mark> אֲבִיהֶ֖ם בִּשְׁכֶֽם׃", "pasuk_en": "וַיֵּלְכוּ אֶחָיו לִרְעוֹת אֶת־צֹאן אֲבִיהֶם בִּשְׁכֶם׃", "rashi_he": "לרעות את צאן. נָקוּד עַל אֶת, שֶׁלֹּא הָלְכוּ אֶלָּא לִרְעוֹת אֶת עַצְמָן:", "rashi_en": "רש״י מציין שיש נקודות על המילה 'את', ללמד שהאחים לא הלכו לרעות את הצאן אלא לרעות את עצמם — כלומר לאכול ולשתות ולהתבטל.", "note": "", "points": [{"q": "מַה מְלַמְּדוֹת הַנְּקֻודּוֹת שֶׁעַל הַמִּילָּה 'אֶת' לְפִי רַשִׁ״י?", "options": ["שֶׁהָאַחִים הָלְכוּ לִרְעוֹת אֶת עַצְמָם וְלֹא אֶת הַצֹּאן", "שֶׁהָאַחִים לָקְחוּ רַק חֵלֶק מִן הַצֹּאן עִמָּם", "שֶׁהַמִּילָּה 'אֶת' מְיֻותֶּרֶת וּבָאָה לְרַבּוֹת צֹאן נוֹסָף"], "kasha": "מדוע יש נקודות חריגות על המילה 'את' בפסוק?", "answer": "הנקודות מלמדות שהאחים לא הלכו באמת לרעות את הצאן, אלא הלכו לרעות את עצמם.", "kp": ["נקוד על את", "לרעות את עצמן"]}]}, {"id": "37:13.1", "ch": 37, "v": 13, "n": 1, "dh": "הנני", "pasuk_html": "וַיֹּ֨אמֶר יִשְׂרָאֵ֜ל אֶל־יוֹסֵ֗ף הֲל֤וֹא אַחֶ֙יךָ֙ רֹעִ֣ים בִּשְׁכֶ֔ם לְכָ֖ה וְאֶשְׁלָחֲךָ֣ אֲלֵיהֶ֑ם וַיֹּ֥אמֶר ל֖וֹ <mark>הִנֵּֽנִי׃</mark>", "pasuk_en": "וַיֹּאמֶר יִשְׂרָאֵל אֶל־יוֹסֵף הֲלוֹא אַחֶיךָ רֹעִים בִּשְׁכֶם לְכָה וְאֶשְׁלָחֲךָ אֲלֵיהֶם וַיֹּאמֶר לוֹ הִנֵּנִי׃", "rashi_he": "הנני. לְשׁוֹן עֲנָוָה וּזְרִיזוּת, נִזְדָּרֵז לְמִצְוַת אָבִיו, וְאַף עַל פִּי שֶׁהָיָה יוֹדֵעַ בְּאֶחָיו שֶׁשּׂוֹנְאִין אוֹתוֹ:", "rashi_en": "רש״י מסביר שיוסף ענה לאביו בלשון ענוה וזריזות, והיה מוכן לקיים את מצוות אביו למרות שידע שאחיו שונאים אותו.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַה מְלַמֶּדֶת תְּשׁוּבַת יוֹסֵף 'הִנֵּנִי' עַל מִידּוֹתָיו?", "options": ["שֶׁנָּהַג בַּעֲנָוָה וּזְרִיזוּת לְמִצְווֹת אָבִיו לַמְּרוֹת שֶׁיָּדַע שֶׁאֶחָיו שׂוֹנְאִים אוֹתוֹ", "שֶׁהִסְכִּים לָלֶכֶת כִּי לֹא יָדַע עַל שִׂנְאַת אֶחָיו כְּלַפָּיו", "שֶׁרָצָה לְהוֹכִיחַ לְאָבִיו שֶׁהוּא אַמִּיץ יוֹתֵר מֵאֶחָיו"], "kasha": "מדוע הדגיש הכתוב שיוסף ענה 'הנני' ולא פשוט 'כן' או 'אלך'?", "answer": "'הנני' היא לשון ענוה וזריזות — יוסף הזדרז לקיים מצוות אביו אף על פי שידע שאחיו שונאים אותו.", "kp": ["לשון ענוה וזריזות", "נזדרז למצות אביו", "יודע באחיו ששונאין אותו"]}]}, {"id": "37:14.1", "ch": 37, "v": 14, "n": 1, "dh": "מעמק חברון", "pasuk_html": "וַיֹּ֣אמֶר ל֗וֹ לֶךְ־נָ֨א רְאֵ֜ה אֶת־שְׁל֤וֹם אַחֶ֙יךָ֙ וְאֶת־שְׁל֣וֹם הַצֹּ֔אן וַהֲשִׁבֵ֖נִי דָּבָ֑ר וַיִּשְׁלָחֵ֙הוּ֙ <mark>מֵעֵ֣מֶק חֶבְר֔וֹן</mark> וַיָּבֹ֖א שְׁכֶֽמָה׃", "pasuk_en": "וַיֹּאמֶר לוֹ לֶךְ־נָא רְאֵה אֶת־שְׁלוֹם אַחֶיךָ וְאֶת־שְׁלוֹם הַצֹּאן וַהֲשִׁבֵנִי דָּבָר וַיִּשְׁלָחֵהוּ מֵעֵמֶק חֶבְרוֹן וַיָּבֹא שְׁכֶמָה׃", "rashi_he": "מעמק חברון. וַהֲלֹא חֶבְרוֹן בָּהָר, שֶׁנֶּאֱמַר וַיַּעֲלוּ בַנֶּגֶב וַיָּבֹא עַד חֶבְרוֹן (במדבר י\"ג), אֶלָּא מֵעֵצָה עֲמֻקָּה שֶׁל אוֹתוֹ צַדִּיק הַקָּבוּר בְּחֶבְרוֹן, לְקַיֵּם מַה שֶּׁנֶּאֱמַר לְאַבְרָהָם בֵּין הַבְּתָרִים כִּי גֵר יִהְיֶה זַרְעֲךָ (בראשית ט״ו:י״ג):", "rashi_en": "רש״י מקשה שחברון נמצאת בהר ולא בעמק, ומתרץ שהכוונה ל'עצה עמוקה' — תוכנית ה׳ שנאמרה לאברהם בברית בין הבתרים, שזרעו יהיה גר בארץ לא להם.", "note": "", "points": [{"q": "מַדּוּעַ לְפִי רַשִׁ״י לֹא נִיתָּן לְפָרֵשׁ 'מֵעֵמֶק חֶבְרוֹן' כִּפְשׁוּטוֹ?", "options": ["כִּי חֶבְרוֹן נִמְצֵאת בָּהָר, כְּפִי שֶׁנֶּאֱמַר 'וַיַּעֲלוּ בַנֶּגֶב וַיָּבֹא עַד חֶבְרוֹן'", "כִּי יַעֲקֹב לֹא גָּר בְּחֶבְרוֹן אֶלָּא בִּבְאֵר שֶׁבַע", "כִּי הָעֵמֶק הַסָּמוּךְ לְחֶבְרוֹן נִקְרָא בְּשֵׁם אַחֵר בַּמִּקְרָא"], "kasha": "כיצד ייתכן שיוסף נשלח 'מעמק חברון' אם חברון היא עיר הר?", "answer": "'עמק' אינו מקום גיאוגרפי אלא עצה עמוקה של אברהם הקבור בחברון — לקיים את הנאמר בברית בין הבתרים 'כי גר יהיה זרעך'.", "kp": ["והלא חברון בהר", "מעצה עמקה של אותו צדיק הקבור בחברון"]}]}, {"id": "37:14.2", "ch": 37, "v": 14, "n": 2, "dh": "ויבא שכמה", "pasuk_html": "וַיֹּ֣אמֶר ל֗וֹ לֶךְ־נָ֨א רְאֵ֜ה אֶת־שְׁל֤וֹם אַחֶ֙יךָ֙ וְאֶת־שְׁל֣וֹם הַצֹּ֔אן וַהֲשִׁבֵ֖נִי דָּבָ֑ר וַיִּשְׁלָחֵ֙הוּ֙ מֵעֵ֣מֶק חֶבְר֔וֹן <mark>וַיָּבֹ֖א שְׁכֶֽמָה׃</mark>", "pasuk_en": "וַיֹּאמֶר לוֹ לֶךְ־נָא רְאֵה אֶת־שְׁלוֹם אַחֶיךָ וְאֶת־שְׁלוֹם הַצֹּאן וַהֲשִׁבֵנִי דָּבָר וַיִּשְׁלָחֵהוּ מֵעֵמֶק חֶבְרוֹן וַיָּבֹא שְׁכֶמָה׃", "rashi_he": "ויבא שכמה. מָקוֹם מוּכָן לְפֻרְעָנוּת, שָׁם קִלְקְלוּ הַשְּׁבָטִים, שָׁם עִנּוּ אֶת דִּינָה, שָׁם נֶחְלְקָה מַלְכוּת בֵּית דָּוִד, שֶׁנֶּאֱמַר וַיֵּלֶךְ רְחַבְעָם שְׁכֶמָה (מלכים א י\"ב):", "rashi_en": "רש״י מסביר ששכם הוא מקום מוכן לפורענות: שם מכרו את יוסף, שם ענו את דינה, ושם נחלקה מלכות בית דוד.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ מַצְיִין הַכָּתוּב שֶׁיּוֹסֵף הִגִּיעַ דַּוְוקָא לִשְׁכֶם?", "options": ["כִּי שְׁכֶם הוּא מָקוֹם מוּכָן לְפֻורְעָנוּת שֶׁבּוֹ אֵירְעוּ כַּמָּה אֲסוֹנוֹת", "כִּי בִּשְׁכֶם הָיוּ הַמִּרְעֶה וְהַמַּיִם הַטּוֹבִים בְּיוֹתֵר לַצֹּאן", "כִּי אָבִיו צִיווָּה עָלָיו לָלֶכֶת בְּמִפֹּורָשׁ לִשְׁכֶם"], "kasha": "מדוע טורח הכתוב לציין את שם המקום 'שכמה' אם כבר ידענו שהאחים רועים בשכם?", "answer": "שכם הוא מקום מוכן לפורענות — שם קלקלו השבטים, שם ענו את דינה, ושם נחלקה מלכות בית דוד.", "kp": ["מקום מוכן לפרענות", "שם קלקלו השבטים", "שם נחלקה מלכות בית דוד"]}]}, {"id": "37:15.1", "ch": 37, "v": 15, "n": 1, "dh": "וימצאהו איש", "pasuk_html": "<mark>וַיִּמְצָאֵ֣הוּ אִ֔ישׁ</mark> וְהִנֵּ֥ה תֹעֶ֖ה בַּשָּׂדֶ֑ה וַיִּשְׁאָלֵ֧הוּ הָאִ֛ישׁ לֵאמֹ֖ר מַה־תְּבַקֵּֽשׁ׃", "pasuk_en": "וַיִּמְצָאֵהוּ אִישׁ וְהִנֵּה תֹעֶה בַּשָּׂדֶה וַיִּשְׁאָלֵהוּ הָאִישׁ לֵאמֹר מַה־תְּבַקֵּשׁ׃", "rashi_he": "וימצאהו איש. זֶה גַּבְרִיאֵל, שֶׁנֶּאֱמַר וְהָאִישׁ גַּבְרִיאֵל (דניאל ט כא):", "rashi_en": "רש״י מזהה את ה'איש' שמצא את יוסף תועה בשדה כמלאך גבריאל, על פי הפסוק 'והאיש גבריאל' בספר דניאל.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מִיהוּ הָ'אִישׁ' שֶׁמָּצָא אֶת יוֹסֵף תּוֹעֶה בַּשָּׂדֶה?", "options": ["הַמַּלְאָךְ גַּבְרִיאֵל, שֶׁנֶּאֱמַר 'וְהָאִישׁ גַּבְרִיאֵל'", "אֶחָד מֵרוֹעֵי הַצֹּאן שֶׁל יַעֲקֹב שֶׁהִכִּיר אֶת יוֹסֵף", "עוֹבֵר אוֹרַח כְּנַעֲנִי שֶׁהִכִּיר אֶת הָאַחִים"], "kasha": "מדוע מכנה הכתוב את מי שפגש את יוסף בתואר סתמי 'איש' ולא מזהה אותו בשמו?", "answer": "ה'איש' הוא המלאך גבריאל, כפי שמוכח מהפסוק בדניאל 'והאיש גבריאל'.", "kp": ["זה גבריאל", "והאיש גבריאל"]}]}, {"id": "37:17.1", "ch": 37, "v": 17, "n": 1, "dh": "נסעו מזה", "pasuk_html": "וַיֹּ֤אמֶר הָאִישׁ֙ <mark>נָסְע֣וּ מִזֶּ֔ה</mark> כִּ֤י שָׁמַ֙עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָה וַיֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔יו וַיִּמְצָאֵ֖ם בְּדֹתָֽן׃", "pasuk_en": "וַיֹּאמֶר הָאִישׁ נָסְעוּ מִזֶּה כִּי שָׁמַעְתִּי אֹמְרִים נֵלְכָה דֹּתָיְנָה וַיֵּלֶךְ יוֹסֵף אַחַר אֶחָיו וַיִּמְצָאֵם בְּדֹתָן׃", "rashi_he": "נסעו מזה. הִסִּיעוּ עַצְמָן מִן הָאַחְוָה:", "rashi_en": "רש״י דורש את הביטוי ״נסעו מזה״ לא כנסיעה פיזית בלבד, אלא כהתרחקות מרגש האחוה כלפי יוסף.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַה פֵּירוּשׁ ״נָסְעוּ מִזֶּה״?", "options": ["הִסִּיעוּ עַצְמָם מִן הָאַחְוָה", "נָסְעוּ מִן הַמָּקוֹם הַזֶּה לְכִיוּוּן דֹּותָן", "עָזְבוּ אֶת הַמִּרְעֶה כִּי נִגְמַר הַמַּסְפּוֹא"], "kasha": "מדוע רש״י אינו מפרש ״נסעו מזה״ כפשוטו, שנסעו מן המקום?", "answer": "רש״י דורש שהאחים הסיעו עצמם מן האחוה, כלומר ניתקו את הקשר האחוותי עם יוסף.", "kp": ["הסיעו עצמן מן האחוה"]}]}, {"id": "37:17.2", "ch": 37, "v": 17, "n": 2, "dh": "נלכה דתינה", "pasuk_html": "וַיֹּ֤אמֶר הָאִישׁ֙ נָסְע֣וּ מִזֶּ֔ה כִּ֤י שָׁמַ֙עְתִּי֙ אֹֽמְרִ֔ים <mark>נֵלְכָ֖ה דֹּתָ֑יְנָה</mark> וַיֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔יו וַיִּמְצָאֵ֖ם בְּדֹתָֽן׃", "pasuk_en": "וַיֹּאמֶר הָאִישׁ נָסְעוּ מִזֶּה כִּי שָׁמַעְתִּי אֹמְרִים נֵלְכָה דֹּתָיְנָה וַיֵּלֶךְ יוֹסֵף אַחַר אֶחָיו וַיִּמְצָאֵם בְּדֹתָן׃", "rashi_he": "נלכה דתינה. לְבַקֵּשׁ לְךָ נִכְלֵי דָתוֹת שֶׁיְּמִיתוּךָ בָהֶם. וּלְפִי פְשׁוּטוֹ שֵׁם מָקוֹם הוּא, וְאֵין מִקְרָא יוֹצֵא מִידֵי פְשׁוּטוֹ:", "rashi_en": "רש״י מביא שני פירושים: על דרך הדרש, ״דתינה״ פירושו לבקש נכלי דתות כדי להמית את יוסף. על דרך הפשט, דותן הוא שם של מקום, ואין מקרא יוצא מידי פשוטו.", "note": "", "points": [{"q": "מַה הַפֵּירוּשׁ הַדַּרְשָׁנִי שֶׁל ״נֵלְכָה דֹּתָיְנָה״ לְפִי רַשִׁ״י?", "options": ["לְבַקֵּשׁ נִכְלֵי דָּתוֹת שֶׁיְּמִיתוּהוּ בָּהֶם", "לָלֶכֶת לְמָקוֹם שֶׁנִּקְרָא דֹּותָן לִרְעוֹת צֹאן", "לָדוּן אוֹתוֹ בְּדִין תּוֹרָה עַל חֲלוֹמוֹתָיו"], "kasha": "מדוע רש״י אינו מסתפק בפירוש שדותן הוא שם מקום?", "answer": "רש״י דורש ש״דתינה״ רומז לבקשת נכלי דתות — תואנות חוקיות — כדי להמית את יוסף. יחד עם זאת הוא מוסיף שלפי הפשט זהו שם מקום.", "kp": ["לבקש לך נכלי דתות שימיתוך בהם", "ואין מקרא יוצא מידי פשוטו"]}]}, {"id": "37:18.1", "ch": 37, "v": 18, "n": 1, "dh": "ויתנכלו", "pasuk_html": "וַיִּרְא֥וּ אֹת֖וֹ מֵרָחֹ֑ק וּבְטֶ֙רֶם֙ יִקְרַ֣ב אֲלֵיהֶ֔ם <mark>וַיִּֽתְנַכְּל֥וּ</mark> אֹת֖וֹ לַהֲמִיתֽוֹ׃", "pasuk_en": "וַיִּרְאוּ אֹתוֹ מֵרָחֹק וּבְטֶרֶם יִקְרַב אֲלֵיהֶם וַיִּתְנַכְּלוּ אֹתוֹ לַהֲמִיתוֹ׃", "rashi_he": "ויתנכלו. נִתְמַלְּאוּ נְכָלִים וְעַרְמוּמִית:", "rashi_en": "רש״י מפרש את המילה ״ויתנכלו״ — נתמלאו נכלים וערמומיות, כלומר תכננו בתחבולות ובמרמה.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה ״וַיִּתְנַכְּלוּ״?", "options": ["נִתְמַלְּאוּ נְכָלִים וְעַרְמוּמִיּוּת", "חָשְׁבוּ מַחְשָׁבוֹת שֶׁל חֲרָטָה וְרַחֲמִים", "הִתְחִילוּ לְהִתְווַּכֵּחַ בֵּינֵיהֶם מַה לַּעֲשׂוֹת"], "kasha": "מה משמעות השורש ״נכל״ במילה ״ויתנכלו״?", "answer": "רש״י מפרש שהאחים נתמלאו נכלים וערמומיות, כלומר מלאו תחבולות ומרמה כלפי יוסף.", "kp": ["נתמלאו נכלים וערמומית"]}]}, {"id": "37:18.2", "ch": 37, "v": 18, "n": 2, "dh": "אתו", "pasuk_html": "וַיִּרְא֥וּ <mark>אֹת֖וֹ</mark> מֵרָחֹ֑ק וּבְטֶ֙רֶם֙ יִקְרַ֣ב אֲלֵיהֶ֔ם וַיִּֽתְנַכְּל֥וּ אֹת֖וֹ לַהֲמִיתֽוֹ׃", "pasuk_en": "וַיִּרְאוּ אֹתוֹ מֵרָחֹק וּבְטֶרֶם יִקְרַב אֲלֵיהֶם וַיִּתְנַכְּלוּ אֹתוֹ לַהֲמִיתוֹ׃", "rashi_he": "אתו. כְּמוֹ אִתּוֹ, עִמּוֹ, כְּלוֹמַר, אֵלָיו:", "rashi_en": "רש״י מסביר שהמילה ״אֹתוֹ״ כאן משמעותה ״אִתּוֹ״ — עמו, כלומר אליו, ולא במובן הרגיל של מושא ישיר.", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ״י מְפָרֵשׁ אֶת הַמִּילָּה ״אֹֹֹתוֹֹֹ״ בַּפָּסוּק זֶה?", "options": ["כְּמוֹ ״אִתּוֹ״ — עִמּוֹ, כְּלוֹמַר אֵלָיו", "כְּמוּשָׂא יָשִׁיר רָגִיל — אוֹתוֹ עַצְמוֹ", "כְּמוֹ ״אוֹתוֹ הַדָּבָר״ — אֶת הַדָּבָר הַזֶּה"], "kasha": "מדוע רש״י צריך לפרש את המילה ״אתו״ שלכאורה פשוטה?", "answer": "רש״י מסביר ש״אֹתוֹ״ אינו מושא ישיר אלא כמו ״אִתּוֹ״ במובן עמו, כלומר אליו — כלפיו התנכלו.", "kp": ["כמו אתו עמו כלומר אליו"]}]}, {"id": "37:20.1", "ch": 37, "v": 20, "n": 1, "dh": "ונראה מה יהיו חלמתיו", "pasuk_html": "וְעַתָּ֣ה ׀ לְכ֣וּ וְנַֽהַרְגֵ֗הוּ וְנַשְׁלִכֵ֙הוּ֙ בְּאַחַ֣ד הַבֹּר֔וֹת וְאָמַ֕רְנוּ חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְהוּ <mark>וְנִרְאֶ֕ה מַה־יִּהְי֖וּ חֲלֹמֹתָֽיו׃</mark>", "pasuk_en": "וְעַתָּה לְכוּ וְנַהַרְגֵהוּ וְנַשְׁלִכֵהוּ בְּאַחַד הַבֹּרוֹת וְאָמַרְנוּ חַיָּה רָעָה אֲכָלָתְהוּ וְנִרְאֶה מַה־יִּהְיוּ חֲלֹמֹתָיו׃", "rashi_he": "ונראה מה יהיו חלמתיו. אָמַר רַבִּי יִצְחָק מִקְרָא זֶה אוֹמֵר דָּרְשֵׁנִי, רוּחַ הַקֹּדֶשׁ אוֹמֶרֶת כֵּן, הֵם אוֹמְרִים נַהַרְגֵהוּ וְהַכָּתוּב מְסַיֵּם וְנִרְאֶה מַה יִּהְיוּ חֲלֹמֹתָיו – נִרְאֶה דְּבַר מִי יָקוּם אִם שֶׁלָּכֶם אוֹ שֶׁלִּי. וְאִ\"אֶ שֶׁיֹּאמְרוּ הֵם וְנִרְאֶה מַה יִּהְיוּ חֲלֹמֹתָיו, שֶׁמִּכֵּיוָן שֶׁיַּהַרְגוּהוּ בָּטְלוּ חֲלוֹמוֹתָיו:", "rashi_en": "רש״י מסביר שהמילים \"ונראה מה יהיו חלמתיו\" אינן דברי האחים אלא דברי רוח הקודש. האחים אמרו \"נהרגהו\", והכתוב מסיים \"ונראה\" — כלומר נראה דבר מי יקום, שלהם או של הקב״ה. שהרי אם יהרגוהו, ממילא בטלו חלומותיו ואין טעם לומר \"ונראה\".", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מִי אוֹמֵר \"וְנִרְאֶה מַה־יִּהְיוּ חֲלֹמֹתָיו\"?", "options": ["רוּחַ הַקֹּודֶשׁ, כִּי אִם יַהַרְגוּהוּ מִמֵּילָא בָּטְלוּ חֲלוֹמוֹתָיו", "הָאַחִים, כְּדֵי לִלְעוֹג עַל חֲלוֹמוֹתָיו שֶׁל יוֹסֵף", "יַעֲקֹב אֲבִיהֶם, שֶׁרָצָה לִבְחוֹן אִם הַחֲלוֹמוֹת יִתְקַיְּימוּ"], "kasha": "קשה לומר שהאחים אמרו \"ונראה מה יהיו חלמתיו\", שהרי אם יהרגוהו — חלומותיו בטלים מאליהם.", "answer": "רוח הקודש אומרת זאת, כלומר: נראה דבר מי יקום — אם שלכם או שלי. שאי אפשר שהאחים אמרו כן, כי משיהרגוהו בטלו חלומותיו.", "kp": ["רוח הקדש אומרת כן", "נראה דבר מי יקום", "שמכיון שיהרגוהו בטלו חלומותיו"]}]}, {"id": "37:21.1", "ch": 37, "v": 21, "n": 1, "dh": "לא נכנו נפש", "pasuk_html": "וַיִּשְׁמַ֣ע רְאוּבֵ֔ן וַיַּצִּלֵ֖הוּ מִיָּדָ֑ם וַיֹּ֕אמֶר <mark>לֹ֥א נַכֶּ֖נּוּ נָֽפֶשׁ׃</mark>", "pasuk_en": "וַיִּשְׁמַע רְאוּבֵן וַיַּצִּלֵהוּ מִיָּדָם וַיֹּאמֶר לֹא נַכֶּנּוּ נָפֶשׁ׃", "rashi_he": "לא נכנו נפש. מַכַּת נֶפֶשׁ, זוֹ הִיא מִיתָה:", "rashi_en": "רש״י מפרש שהמילה \"נפש\" בפסוק פירושה מכת נפש, כלומר מיתה.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה \"נָפֶשׁ\" בַּבִּיטּוּי \"לֹא נַכֶּנּוּ נָפֶשׁ\"?", "options": ["מַכַּת נֶפֶשׁ — מַכָּה שֶׁהִיא מִיתָה", "פְּגִיעָה בְּנַפְשׁוֹ הָרוּחָנִית שֶׁל יוֹסֵף", "חַבָּלָה גוּפָנִית שֶׁאֵינָהּ מִיתָה"], "kasha": "המילה \"נפש\" בביטוי \"לא נכנו נפש\" אינה ברורה — מה פירוש הכאה של נפש?", "answer": "\"נפש\" פירושו מכת נפש, היינו מכה שהיא מיתה.", "kp": ["מכת נפש זו היא מיתה"]}]}, {"id": "37:22.1", "ch": 37, "v": 22, "n": 1, "dh": "למען הציל אתו", "pasuk_html": "וַיֹּ֨אמֶר אֲלֵהֶ֣ם ׀ רְאוּבֵן֮ אַל־תִּשְׁפְּכוּ־דָם֒ הַשְׁלִ֣יכוּ אֹת֗וֹ אֶל־הַבּ֤וֹר הַזֶּה֙ אֲשֶׁ֣ר בַּמִּדְבָּ֔ר וְיָ֖ד אַל־תִּשְׁלְחוּ־ב֑וֹ <mark>לְמַ֗עַן הַצִּ֤יל אֹתוֹ֙</mark> מִיָּדָ֔ם לַהֲשִׁיב֖וֹ אֶל־אָבִֽיו׃", "pasuk_en": "וַיֹּאמֶר אֲלֵהֶם רְאוּבֵן אַל־תִּשְׁפְּכוּ־דָם הַשְׁלִיכוּ אֹתוֹ אֶל־הַבּוֹר הַזֶּה אֲשֶׁר בַּמִּדְבָּר וְיָד אַל־תִּשְׁלְחוּ־בוֹ לְמַעַן הַצִּיל אֹתוֹ מִיָּדָם לַהֲשִׁיבוֹ אֶל־אָבִיו׃", "rashi_he": "למען הציל אתו. רוּחַ הַקֹּדֶשׁ מְעִידָה עַל רְאוּבֵן שֶׁלֹּא אָמַר זֹאת אֶלָּא לְהַצִּיל אוֹתוֹ שֶׁיָּבֹא הוּא וְיַעֲלֶנּוּ מִשָּׁם, אָמַר אֲנִי בְכוֹר וְגָדוֹל שֶׁבְּכֻלָּן, לֹא יִתָּלֶה הַסֵּרָחוֹן אֶלָּא בִי:", "rashi_en": "רש״י מסביר שרוח הקודש מעידה שכוונת ראובן הייתה להציל את יוסף — שיבוא אחר כך ויעלנו מן הבור. ראובן חשש שהאשמה תיפול עליו כבכור.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ חָשַׁשׁ רְאוּבֵן בִּמְיֻוחָד לְגוֹרָלוֹ שֶׁל יוֹסֵף?", "options": ["כִּי הוּא הַבְּכוֹר וְהַגָּדוֹל, וְהַסַּרְחוֹן יִיתָּלֶה בּוֹ", "כִּי הוּא אָהַב אֶת יוֹסֵף יוֹתֵר מִשְּׁאָר הָאַחִים", "כִּי יַעֲקֹב צִיווָּה עָלָיו בְּמִפֹורָשׁ לִשְׁמֹור עַל יוֹסֵף"], "kasha": "מדוע הכתוב מדגיש \"למען הציל אותו\" — הרי ראובן הציע רק להשליכו לבור?", "answer": "רוח הקודש מעידה שכוונת ראובן הייתה לחזור אחר כך ולהעלותו מן הבור, כי כבכור וגדול שבאחים — הסרחון ייתלה בו.", "kp": ["רוח הקדש מעידה על ראובן", "אני בכור וגדול שבכלן", "לא יתלה הסרחון אלא בי"]}]}, {"id": "37:23.1", "ch": 37, "v": 23, "n": 1, "dh": "את כתנתו", "pasuk_html": "וַֽיְהִ֕י כַּֽאֲשֶׁר־בָּ֥א יוֹסֵ֖ף אֶל־אֶחָ֑יו וַיַּפְשִׁ֤יטוּ אֶת־יוֹסֵף֙ <mark>אֶת־כֻּתָּנְתּ֔וֹ</mark> אֶת־כְּתֹ֥נֶת הַפַּסִּ֖ים אֲשֶׁ֥ר עָלָֽיו׃", "pasuk_en": "וַיְהִי כַּאֲשֶׁר־בָּא יוֹסֵף אֶל־אֶחָיו וַיַּפְשִׁיטוּ אֶת־יוֹסֵף אֶת־כֻּתָּנְתּוֹ אֶת־כְּתֹנֶת הַפַּסִּים אֲשֶׁר עָלָיו׃", "rashi_he": "את כתנתו. זֶה חָלוּק:", "rashi_en": "רש״י מפרש ש\"כתונת\" היא חלוק, כלומר בגד פנימי.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה \"כְּתֹונֶת\"?", "options": ["חָלוּק — בֶּגֶד פְּנִימִי", "גְּלִימָה עֶלְיוֹנָה", "בֶּגֶד מְיֻוחָד לַבְּכוֹרִים"], "kasha": "המילה \"כתונת\" טעונה ביאור — מהו סוג הבגד?", "answer": "רש״י מפרש שכתונת היא חלוק.", "kp": ["זה חלוק"]}]}, {"id": "37:23.2", "ch": 37, "v": 23, "n": 2, "dh": "את כתנת הפסים", "pasuk_html": "וַֽיְהִ֕י כַּֽאֲשֶׁר־בָּ֥א יוֹסֵ֖ף אֶל־אֶחָ֑יו וַיַּפְשִׁ֤יטוּ אֶת־יוֹסֵף֙ אֶת־כֻּתָּנְתּ֔וֹ <mark>אֶת־כְּתֹ֥נֶת הַפַּסִּ֖ים</mark> אֲשֶׁ֥ר עָלָֽיו׃", "pasuk_en": "וַיְהִי כַּאֲשֶׁר־בָּא יוֹסֵף אֶל־אֶחָיו וַיַּפְשִׁיטוּ אֶת־יוֹסֵף אֶת־כֻּתָּנְתּוֹ אֶת־כְּתֹנֶת הַפַּסִּים אֲשֶׁר עָלָיו׃", "rashi_he": "את כתנת הפסים. הוּא שֶׁהוֹסִיף לוֹ אָבִיו יוֹתֵר עַל אֶחָיו:", "rashi_en": "רש״י מבהיר שכתונת הפסים היא הבגד הנוסף שיעקב נתן ליוסף יותר על אחיו, ולכן הפשיטוהו ממנה.", "note": "", "points": [{"q": "מַה מְצַייֵּן רַשִׁ״י לְגַבֵּי כְּתֹונֶת הַפַּסִּים?", "options": ["הִיא הַבֶּגֶד שֶׁאָבִיו הוֹסִיף לוֹ יוֹתֵר עַל אֶחָיו", "הִיא הַבֶּגֶד שֶׁיּוֹסֵף קָנָה לְעַצְמוֹ בַּשּׁוּק", "הִיא הַבֶּגֶד שֶׁאֶחָיו נָתְנוּ לוֹ בְּמַתָּנָה"], "kasha": "מדוע הכתוב מפרט דווקא את כתונת הפסים, ולא מסתפק ב״ויפשיטו את יוסף את כתנתו״?", "answer": "כתונת הפסים היא הבגד שאביו הוסיף לו יותר על אחיו, ולכן הקפידו להפשיטו דווקא ממנה.", "kp": ["שהוסיף לו אביו יותר על אחיו"]}]}, {"id": "37:24.1", "ch": 37, "v": 24, "n": 1, "dh": "והבור רק אין בו מים", "pasuk_html": "וַיִּ֨קָּחֻ֔הוּ וַיַּשְׁלִ֥כוּ אֹת֖וֹ הַבֹּ֑רָה <mark>וְהַבּ֣וֹר רֵ֔ק אֵ֥ין בּ֖וֹ מָֽיִם׃</mark>", "pasuk_en": "וַיִּקָּחֻהוּ וַיַּשְׁלִכוּ אֹתוֹ הַבֹּרָה וְהַבּוֹר רֵק אֵין בּוֹ מָיִם׃", "rashi_he": "והבור רק אין בו מים. מִמַּשְׁמַע שֶׁנֶּאֱמַר וְהַבּוֹר רֵק, אֵינִי יוֹדֵעַ שֶׁאֵין בּוֹ מַיִם, מַה תַּלְמוּד לוֹמַר אֵין בּוֹ מָיִם? מַיִם אֵין בּוֹ, אֲבָל נְחָשִׁים וְעַקְרַבִּים יֵשׁ בּוֹ (בראשית רבה, שבת כ\"ב):", "rashi_en": "רש״י מקשה שאם הבור רק, ברור שאין בו מים. מכאן דרשו חז״ל שמים אין בו, אבל נחשים ועקרבים יש בו.", "note": "", "points": [{"q": "מַה לָמַד רַשִׁ״י מֵהַמִּילִּים הַמְיֻותָּרוֹת ״אֵין בּוֹ מַיִם״?", "options": ["מַיִם אֵין בּוֹ, אֲבָל נְחָשִׁים וְעַקְרַבִּים יֵשׁ בּוֹ", "הַבּוֹר הָיָה יָבֵשׁ לְגַמְרֵי בְּלִי שׁוּם דָּבָר בְּתוֹכוֹ", "הַבּוֹר הָיָה מָלֵא מַיִם אֲבָל הֵם הִתְיַיְבְּשׁוּ לִפְנֵי כֵן"], "kasha": "אם כבר נאמר ״והבור רק״, מדוע הוצרך הכתוב להוסיף ״אין בו מים״?", "answer": "הביטוי ״אין בו מים״ מיותר, ובא ללמד שמים אין בו אבל נחשים ועקרבים יש בו.", "kp": ["מים אין בו אבל נחשים ועקרבים יש בו"]}]}, {"id": "37:25.1", "ch": 37, "v": 25, "n": 1, "dh": "ארחת", "pasuk_html": "וַיֵּשְׁבוּ֮ לֶֽאֱכָל־לֶחֶם֒ וַיִּשְׂא֤וּ עֵֽינֵיהֶם֙ וַיִּרְא֔וּ וְהִנֵּה֙ <mark>אֹרְחַ֣ת</mark> יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִגִּלְעָ֑ד וּגְמַלֵּיהֶ֣ם נֹֽשְׂאִ֗ים נְכֹאת֙ וּצְרִ֣י וָלֹ֔ט הוֹלְכִ֖ים לְהוֹרִ֥יד מִצְרָֽיְמָה׃", "pasuk_en": "וַיֵּשְׁבוּ לֶאֱכָל־לֶחֶם וַיִּשְׂאוּ עֵינֵיהֶם וַיִּרְאוּ וְהִנֵּה אֹרְחַת יִשְׁמְעֵאלִים בָּאָה מִגִּלְעָד וּגְמַלֵּיהֶם נֹשְׂאִים נְכֹאת וּצְרִי וָלֹט הוֹלְכִים לְהוֹרִיד מִצְרָיְמָה׃", "rashi_he": "ארחת. כְּתַרְגּוּמוֹ שְׁיָרַת, עַל שֵׁם הוֹלְכֵי אֹרַח:", "rashi_en": "רש״י מפרש שהמילה ״ארחת״ פירושה שיירה, כתרגום אונקלוס, על שם שהם הולכי אורח (דרך).", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה ״אֹרְחַת״?", "options": ["שַׁייָּרָה, עַל שֵׁם שֶׁהֵם הוֹלְכֵי אֹורַח", "קְבוּצַת סוֹחֲרִים הָעוֹסְקִים בַּאֲרִיחָה וּבַאֲרִיגָה", "מִשְׁפָּחָה גְּדוֹלָה הַנּוֹסַעַת יַחַד לְאֶרֶץ אַחֶרֶת"], "kasha": "מהו פירוש המילה ״ארחת״ ומה מקור השם?", "answer": "ארחת פירושה שיירה, כתרגום אונקלוס, והיא נקראת כך על שם הולכי אורח.", "kp": ["כתרגומו שירת", "על שם הולכי ארח"]}]}, {"id": "37:25.2", "ch": 37, "v": 25, "n": 2, "dh": "וגמליהם נשאים וגו'", "pasuk_html": "וַיֵּשְׁבוּ֮ לֶֽאֱכָל־לֶחֶם֒ וַיִּשְׂא֤וּ עֵֽינֵיהֶם֙ וַיִּרְא֔וּ וְהִנֵּה֙ אֹרְחַ֣ת יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִגִּלְעָ֑ד <mark>וּגְמַלֵּיהֶ֣ם נֹֽשְׂאִ֗ים</mark> נְכֹאת֙ וּצְרִ֣י וָלֹ֔ט הוֹלְכִ֖ים לְהוֹרִ֥יד מִצְרָֽיְמָה׃", "pasuk_en": "וַיֵּשְׁבוּ לֶאֱכָל־לֶחֶם וַיִּשְׂאוּ עֵינֵיהֶם וַיִּרְאוּ וְהִנֵּה אֹרְחַת יִשְׁמְעֵאלִים בָּאָה מִגִּלְעָד וּגְמַלֵּיהֶם נֹשְׂאִים נְכֹאת וּצְרִי וָלֹט הוֹלְכִים לְהוֹרִיד מִצְרָיְמָה׃", "rashi_he": "וגמליהם נשאים וגו'. לָמָּה פִרְסֵם הַכָּתוּב אֶת מַשָּׂאָם? לְהוֹדִיעַ מַתַּן שְׂכָרָן שֶׁל צַדִּיקִים, שֶׁאֵין דַּרְכָּן שֶׁל עַרְבִיִּים לָשֵׂאת אֶלָּא נֵפְטְ וְעִטְרָן, שֶׁרֵיחָן רַע, וְלָזֶה נִזְדַּמְּנוּ בְשָׂמִים, שֶׁלֹּא יִזּוֹק מֵרֵיחַ רַע:", "rashi_en": "רש״י שואל מדוע הכתוב מפרט את משא הגמלים. הוא מסביר שדרך הערביים לשאת נפט ועטרן שריחם רע, אך לכבוד יוסף הצדיק נזדמנו לו בשמים שריחם טוב.", "note": "", "points": [{"q": "מַדּוּעַ, לְפִי רַשִׁ״י, נָשְׂאוּ הַיִּשְׁמְעֵאלִים בְּשָׂמִים וְלֹא סְחוֹרָה רְגִילָה?", "options": ["כְּדֵי שֶׁיּוֹסֵף הַצַּדִּיק לֹא יִיפָּגַע מֵרֵיחַ רַע", "כִּי בְּשָׂמִים הָיוּ הַסְּחוֹרָה הַיְּקָרָה בְּיוֹתֵר בְּאוֹתָהּ תְּקוּפָה", "כִּי הֵם הָיוּ בְּדַרְכָּם לִסְחוֹר בִּשְׂמִים בְּשׁוּק מִצְרַיִם"], "kasha": "מדוע הכתוב מפרט דווקא את סוג המשא שנשאו הגמלים?", "answer": "הכתוב מפרט את המשא כדי להודיע מתן שכרם של צדיקים: דרך הערביים לשאת נפט ועטרן שריחם רע, אך ליוסף נזדמנו בשמים שלא יינזק מריח רע.", "kp": ["להודיע מתן שכרן של צדיקים", "ולזה נזדמנו בשמים שלא יזוק מריח רע"]}]}, {"id": "37:25.3", "ch": 37, "v": 25, "n": 3, "dh": "נכאת", "pasuk_html": "וַיֵּשְׁבוּ֮ לֶֽאֱכָל־לֶחֶם֒ וַיִּשְׂא֤וּ עֵֽינֵיהֶם֙ וַיִּרְא֔וּ וְהִנֵּה֙ אֹרְחַ֣ת יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִגִּלְעָ֑ד וּגְמַלֵּיהֶ֣ם נֹֽשְׂאִ֗ים <mark>נְכֹאת֙</mark> וּצְרִ֣י וָלֹ֔ט הוֹלְכִ֖ים לְהוֹרִ֥יד מִצְרָֽיְמָה׃", "pasuk_en": "וַיֵּשְׁבוּ לֶאֱכָל־לֶחֶם וַיִּשְׂאוּ עֵינֵיהֶם וַיִּרְאוּ וְהִנֵּה אֹרְחַת יִשְׁמְעֵאלִים בָּאָה מִגִּלְעָד וּגְמַלֵּיהֶם נֹשְׂאִים נְכֹאת וּצְרִי וָלֹט הוֹלְכִים לְהוֹרִיד מִצְרָיְמָה׃", "rashi_he": "נכאת. כָּל כִּנּוּסֵי בְשָׂמִים הַרְבֵּה קָרוּי נְכֹאת, וְכֵן וַיַּרְאֵם אֶת כָּל בֵּית נְכֹתֹה (מלכים ב כ') – מִרְקַחַת בְּשָׂמָיו. וְאֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן שַׁעֲוָה:", "rashi_en": "רש״י מסביר שנכאת הוא כינוי לאוסף של בשמים רבים, ומביא ראיה מהפסוק ״בית נכתה״ שפירושו מקום מרקחת הבשמים. אונקלוס תרגם שעוה.", "note": "", "points": [{"q": "מַהוּ ״נְכֹאת״ לְפִי רַשׁ״י?", "options": ["כִּינּוּס שֶׁל בְּשָׂמִים רַבִּים יַחַד", "סוּג מְסוּיָּם שֶׁל בֹּושֶׂם יָקָר", "שַׁעֲוָה שֶׁמַּפִּיקִים מִגְּמַלִּים"], "kasha": "המילה ״נכאת״ אינה מוכרת ויש לבאר את משמעותה.", "answer": "כל אוסף של בשמים רבים נקרא נכאת, כמו ״בית נכתה״ שהוא מקום מרקחת הבשמים.", "kp": ["כל כנוסי בשמים הרבה קרוי נכאת", "מרקחת בשמיו"]}]}, {"id": "37:25.4", "ch": 37, "v": 25, "n": 4, "dh": "צרי", "pasuk_html": "וַיֵּשְׁבוּ֮ לֶֽאֱכָל־לֶחֶם֒ וַיִּשְׂא֤וּ עֵֽינֵיהֶם֙ וַיִּרְא֔וּ וְהִנֵּה֙ אֹרְחַ֣ת יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִגִּלְעָ֑ד וּגְמַלֵּיהֶ֣ם נֹֽשְׂאִ֗ים נְכֹאת֙ <mark>וּצְרִ֣י</mark> וָלֹ֔ט הוֹלְכִ֖ים לְהוֹרִ֥יד מִצְרָֽיְמָה׃", "pasuk_en": "וַיֵּשְׁבוּ לֶאֱכָל־לֶחֶם וַיִּשְׂאוּ עֵינֵיהֶם וַיִּרְאוּ וְהִנֵּה אֹרְחַת יִשְׁמְעֵאלִים בָּאָה מִגִּלְעָד וּגְמַלֵּיהֶם נֹשְׂאִים נְכֹאת וּצְרִי וָלֹט הוֹלְכִים לְהוֹרִיד מִצְרָיְמָה׃", "rashi_he": "צרי. שָׂרָף הַנּוֹטֵף מֵעֲצֵי הַקְּטָף, וְהוּא נָטָף הַנִּמְנֶה עִם סַמָּנֵי הַקְּטֹרֶת:", "rashi_en": "רש״י מסביר שצרי הוא שרף הנוטף מעצי הקטף, והוא אותו ״נטף״ שנמנה בין סמני הקטורת במקדש.", "note": "", "points": [{"q": "מַהוּ הַצֳּרִי וְלָמָּה הוּא מוּכָּר לָנוּ לְפִי רַשׁ״י?", "options": ["שֶׁרֶף מֵעֲצֵי קְטָף, הוּא הַנָּטָף שֶׁבְּסַמְּנֵי הַקְּטֹורֶת", "שֶׁמֶן רֵיחָנִי שֶׁמְּשַׁמֵּשׁ לִרְפוּאָה בִּלְבַד", "שֶׁרֶף מֵעֲצֵי אַלּוֹן שֶׁמְּשַׁמֵּשׁ לְהַדְלָקַת נֵרוֹת"], "kasha": "המילה ״צרי״ טעונה זיהוי — מהו בדיוק החומר הזה.", "answer": "צרי הוא שרף הנוטף מעצי הקטף, והוא הנטף הנמנה עם סמני הקטורת.", "kp": ["שרף הנוטף מעצי הקטף", "נטף הנמנה עם סמני הקטרת"]}]}, {"id": "37:25.5", "ch": 37, "v": 25, "n": 5, "dh": "ולט", "pasuk_html": "וַיֵּשְׁבוּ֮ לֶֽאֱכָל־לֶחֶם֒ וַיִּשְׂא֤וּ עֵֽינֵיהֶם֙ וַיִּרְא֔וּ וְהִנֵּה֙ אֹרְחַ֣ת יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִגִּלְעָ֑ד וּגְמַלֵּיהֶ֣ם נֹֽשְׂאִ֗ים נְכֹאת֙ וּצְרִ֣י <mark>וָלֹ֔ט</mark> הוֹלְכִ֖ים לְהוֹרִ֥יד מִצְרָֽיְמָה׃", "pasuk_en": "וַיֵּשְׁבוּ לֶאֱכָל־לֶחֶם וַיִּשְׂאוּ עֵינֵיהֶם וַיִּרְאוּ וְהִנֵּה אֹרְחַת יִשְׁמְעֵאלִים בָּאָה מִגִּלְעָד וּגְמַלֵּיהֶם נֹשְׂאִים נְכֹאת וּצְרִי וָלֹט הוֹלְכִים לְהוֹרִיד מִצְרָיְמָה׃", "rashi_he": "ולט. לוֹטִיתָא שְׁמוֹ בִלְשׁוֹן מִשְׁנָה. וְרַבּוֹתֵינוּ פֵּרְשׁוּהוּ שֹׁרֶשׁ עֵשֶׂב, וּשְׁמוֹ אשטרולוזיאה בְּמַסֶּכֶת נִדָּה:", "rashi_en": "רש״י מסביר שלט נקרא בלשון המשנה לוטיתא, וחכמים פירשו שהוא שורש של עשב הנקרא אשטרולוזיאה.", "note": "", "points": [{"q": "כֵּיצַד פֵּירְשׁוּ חֲכָמִים אֶת ״לָט״ לְפִי רַשִׁ״י?", "options": ["שֹׁורֶשׁ עֵשֶׂב הַנִּקְרָא אַשְׁטְרוֹלוֹזִיאָה", "עָלֶה רֵיחָנִי שֶׁגָּדֵל עַל עֲצֵי הַקָּטָף", "סוּג שֶׁל שֶׂרֶף הַנּוֹטֵף מִן הַלּוֹטוּס"], "kasha": "המילה ״לט״ אינה מוכרת וצריך לזהות מהו חומר זה.", "answer": "חכמים פירשו שלט הוא שורש של עשב הנקרא אשטרולוזיאה, ובלשון המשנה שמו לוטיתא.", "kp": ["לוטיתא שמו בלשון משנה", "שרש עשב ושמו אשטרולוזיאה"]}]}, {"id": "37:26.1", "ch": 37, "v": 26, "n": 1, "dh": "מה בצע", "pasuk_html": "וַיֹּ֥אמֶר יְהוּדָ֖ה אֶל־אֶחָ֑יו <mark>מַה־בֶּ֗צַע</mark> כִּ֤י נַהֲרֹג֙ אֶת־אָחִ֔ינוּ וְכִסִּ֖ינוּ אֶת־דָּמֽוֹ׃", "pasuk_en": "וַיֹּאמֶר יְהוּדָה אֶל־אֶחָיו מַה־בֶּצַע כִּי נַהֲרֹג אֶת־אָחִינוּ וְכִסִּינוּ אֶת־דָּמוֹ׃", "rashi_he": "מה בצע. מַה מָּמוֹן, כְּתַרְגּוּמוֹ:", "rashi_en": "רש״י מפרש שהמילה ״בצע״ פירושה ממון, כתרגום אונקלוס.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילָּה ״בֶּצַע״ לְפִי רַשׁ״י?", "options": ["מָמוֹן וְרֶווַח, כְּתַרְגּוּם אוֹנְקְלוֹס", "תּוֹעֶלֶת מַעֲשִׂית אוֹ יִתְרוֹן", "חֲטִיאָה אוֹ פְּגִיעָה מוּסָרִית"], "kasha": "המילה ״בצע״ טעונה ביאור — האם הכוונה לרווח כספי או למשהו אחר.", "answer": "בצע פירושו ממון, כפי שתרגם אונקלוס.", "kp": ["מה ממון כתרגומו"]}]}, {"id": "37:26.2", "ch": 37, "v": 26, "n": 2, "dh": "וכסינו את דמו", "pasuk_html": "וַיֹּ֥אמֶר יְהוּדָ֖ה אֶל־אֶחָ֑יו מַה־בֶּ֗צַע כִּ֤י נַהֲרֹג֙ אֶת־אָחִ֔ינוּ <mark>וְכִסִּ֖ינוּ אֶת־דָּמֽוֹ׃</mark>", "pasuk_en": "וַיֹּאמֶר יְהוּדָה אֶל־אֶחָיו מַה־בֶּצַע כִּי נַהֲרֹג אֶת־אָחִינוּ וְכִסִּינוּ אֶת־דָּמוֹ׃", "rashi_he": "וכסינו את דמו. וְנַעֲלִים אֶת מִיתָתוֹ:", "rashi_en": "רש\"י מבאר שהביטוי \"וכסינו את דמו\" אינו במשמעו המילולי, אלא פירושו שנעלים ונסתיר את מיתתו של יוסף מאביו.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַה פֵּירוּשׁ \"וְכִסִּינוּ אֶת דָּמוֹ\"?", "options": ["נַסְתִּיר וְנַעְלִים אֶת מִיתָתוֹ", "נְכַסֶּה אֶת דָּמוֹ בְּעָפָר כְּדֵי שֶׁלֹּא יִימָּצֵא", "נִטָּהֵר אֶת עַצְמֵנוּ מֵאַשְׁמַת שְׁפִיכוּת דָּמִים"], "kasha": "הביטוי \"וכסינו את דמו\" אינו מובן כפשוטו, שהרי אין כאן דם ממש אם ימכרוהו.", "answer": "רש\"י מפרש ש\"וכסינו את דמו\" פירושו נעלים את מיתתו, כלומר נסתיר את הדבר.", "kp": ["ונעלים את מיתתו"]}]}, {"id": "37:27.1", "ch": 37, "v": 27, "n": 1, "dh": "וישמעו", "pasuk_html": "לְכ֞וּ וְנִמְכְּרֶ֣נּוּ לַיִּשְׁמְעֵאלִ֗ים וְיָדֵ֙נוּ֙ אַל־תְּהִי־ב֔וֹ כִּֽי־אָחִ֥ינוּ בְשָׂרֵ֖נוּ ה֑וּא <mark>וַֽיִּשְׁמְע֖וּ</mark> אֶחָֽיו׃", "pasuk_en": "לְכוּ וְנִמְכְּרֶנּוּ לַיִּשְׁמְעֵאלִים וְיָדֵנוּ אַל־תְּהִי־בוֹ כִּי־אָחִינוּ בְשָׂרֵנוּ הוּא וַיִּשְׁמְעוּ אֶחָיו׃", "rashi_he": "וישמעו. וְקַבִּילוּ מִנֵּהּ, וְכָל שְׁמִיעָה שֶׁהִיא קַבָּלַת דְּבָרִים כְּגוֹן זֶה, וּכְגוֹן וַיִּשְׁמַע יַעֲקֹב אֶל אָבִיו, נַעֲשֶׂה וְנִשְׁמָע – מְתֻרְגָּם נְקַבֵּל; וְכָל שֶׁהִיא שְׁמִיעַת הָאֹזֶן, כְּגוֹן וַיִּשְׁמְעוּ אֶת קוֹל ה' אֱלֹהִים מִתְהַלֵּךְ בַּגָּן, וְרִבְקָה שֹׁמַעַת, וַיִּשְׁמַע יִשְׂרָאֵל, שָׁמַעְתִּי אֶת תְּלוּנֹּת – כֻּלָּן מְתֻרְגָּם וּשְׁמָעוּ, וּשְׁמָעַת, וּשְׁמַע, שְׁמִיעַ קֳדָמַי:", "rashi_en": "רש\"י מבאר שהמילה \"וישמעו\" כאן פירושה הסכימו לדבריו, ולא שמיעת אוזן בלבד. הוא מביא ראיה מתרגום אונקלוס, שמתרגם שמיעה של הסכמה כ\"נקבל\", ואילו שמיעת אוזן מתורגמת כ\"שמעו\".", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַה פֵּירוּשׁ \"וַיִּשְׁמְעוּ אֶחָיו\" בַּפָּסוּק זֶה?", "options": ["הִסְכִּימוּ וְקִיבְּלוּ אֶת דְּבָרָיו", "שָׁמְעוּ אֶת דְּבָרָיו בְּאָוזְנֵיהֶם", "הֵבִינוּ אֶת כַּוָּונָתוֹ הַנִּסְתֶּרֶת"], "kasha": "המילה \"וישמעו\" יכולה להתפרש כשמיעת אוזן רגילה, ולא ברור מדוע נכתבה כאן.", "answer": "רש\"י מפרש ש\"וישמעו\" פירושו קיבלו והסכימו לדבריו, כפי שאונקלוס מתרגם \"וקבילו מנה\".", "kp": ["וקבילו מנה", "כל שמיעה שהיא קבלת דברים"]}]}, {"id": "37:28.1", "ch": 37, "v": 28, "n": 1, "dh": "ויעברו אנשים מדינים", "pasuk_html": "<mark>וַיַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים</mark> סֹֽחֲרִ֗ים וַֽיִּמְשְׁכוּ֙ וַיַּֽעֲל֤וּ אֶת־יוֹסֵף֙ מִן־הַבּ֔וֹר וַיִּמְכְּר֧וּ אֶת־יוֹסֵ֛ף לַיִּשְׁמְעֵאלִ֖ים בְּעֶשְׂרִ֣ים כָּ֑סֶף וַיָּבִ֥יאוּ אֶת־יוֹסֵ֖ף מִצְרָֽיְמָה׃", "pasuk_en": "וַיַּעַבְרוּ אֲנָשִׁים מִדְיָנִים סֹחֲרִים וַיִּמְשְׁכוּ וַיַּעֲלוּ אֶת־יוֹסֵף מִן־הַבּוֹר וַיִּמְכְּרוּ אֶת־יוֹסֵף לַיִּשְׁמְעֵאלִים בְּעֶשְׂרִים כָּסֶף וַיָּבִיאוּ אֶת־יוֹסֵף מִצְרָיְמָה׃", "rashi_he": "ויעברו אנשים מדינים. זוֹ הִיא שַׁיָּרָה אַחֶרֶת, וְהוֹדִיעֲךָ הַכָּתוּב שֶׁנִּמְכַּר פְּעָמִים הַרְבֵּה:", "rashi_en": "רש\"י מבאר שהמדינים הם שיירה נפרדת מהישמעאלים שהוזכרו קודם, והכתוב בא ללמד שיוסף נמכר פעמים הרבה.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַדּוּעַ הוּזְכְּרוּ הַמִּדְיָנִים בְּנִפְרָד מֵהַיִּשְׁמְעֵאלִים?", "options": ["כִּי הֵם שַׁייָּרָה אַחֶרֶת, וְיוֹסֵף נִמְכַּר פְּעָמִים הַרְבֵּה", "כִּי הַמִּדְיָנִים הֵם שֶׁשָּׁלְפוּ אֶת יוֹסֵף מֵהַבּוֹר בְּלִי יְדִיעַת הָאַחִים", "כִּי הַמִּדְיָנִים הָיוּ שֻׁותָּפִים עִם הַיִּשְׁמְעֵאלִים בְּאוֹתָהּ שַׁיָּירָה"], "kasha": "לא ברור מדוע הפסוק מזכיר גם ישמעאלים וגם מדינים, שהם לכאורה אותם סוחרים.", "answer": "רש\"י מפרש שהמדינים הם שיירה אחרת, והכתוב מלמד שיוסף נמכר פעמים הרבה.", "kp": ["זו היא שירה אחרת", "שנמכר פעמים הרבה"]}]}, {"id": "37:28.2", "ch": 37, "v": 28, "n": 2, "dh": "וימשכו", "pasuk_html": "וַיַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים <mark>וַֽיִּמְשְׁכוּ֙</mark> וַיַּֽעֲל֤וּ אֶת־יוֹסֵף֙ מִן־הַבּ֔וֹר וַיִּמְכְּר֧וּ אֶת־יוֹסֵ֛ף לַיִּשְׁמְעֵאלִ֖ים בְּעֶשְׂרִ֣ים כָּ֑סֶף וַיָּבִ֥יאוּ אֶת־יוֹסֵ֖ף מִצְרָֽיְמָה׃", "pasuk_en": "וַיַּעַבְרוּ אֲנָשִׁים מִדְיָנִים סֹחֲרִים וַיִּמְשְׁכוּ וַיַּעֲלוּ אֶת־יוֹסֵף מִן־הַבּוֹר וַיִּמְכְּרוּ אֶת־יוֹסֵף לַיִּשְׁמְעֵאלִים בְּעֶשְׂרִים כָּסֶף וַיָּבִיאוּ אֶת־יוֹסֵף מִצְרָיְמָה׃", "rashi_he": "וימשכו. בְנֵי יַעֲקֹב אֶת יוֹסֵף מִן הַבּוֹר וַיִּמְכְּרוּהוּ לַיִּשְׁמְעֵאלִים, וְיִשְׁמְעֵאלִים לַמִּדְיָנִים, וְהַמִּדְיָנִים לַמִּצְרִים:", "rashi_en": "רש\"י מבאר שבני יעקב הם שמשכו את יוסף מהבור ומכרוהו לישמעאלים, והישמעאלים מכרוהו למדינים, והמדינים מכרוהו למצרים.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַה הָיָה סֵדֶר הַמְּכִירוֹת שֶׁל יוֹסֵף?", "options": ["הָאַחִים לַיִּשְׁמְעֵאלִים, הַיִּשְׁמְעֵאלִים לַמִּדְיָנִים, וְהַמִּדְיָנִים לְמִצְרַיִם", "הַמִּדְיָנִים לַיִּשְׁמְעֵאלִים, וְהַיִּשְׁמְעֵאלִים לְמִצְרַיִם", "הָאַחִים לַמִּדְיָנִים, וְהַמִּדְיָנִים יְשִׁירוֹת לְמִצְרַיִם"], "kasha": "לא ברור מי משך את יוסף מהבור ומה היה סדר המכירות בין הסוחרים השונים.", "answer": "רש\"י מפרש שבני יעקב משכו את יוסף מהבור ומכרוהו לישמעאלים, הישמעאלים מכרוהו למדינים, והמדינים מכרוהו למצרים.", "kp": ["בני יעקב את יוסף מן הבור", "וישמעאלים למדינים והמדינים למצרים"]}]}, {"id": "37:29.1", "ch": 37, "v": 29, "n": 1, "dh": "וישב ראובן", "pasuk_html": "<mark>וַיָּ֤שָׁב רְאוּבֵן֙</mark> אֶל־הַבּ֔וֹר וְהִנֵּ֥ה אֵין־יוֹסֵ֖ף בַּבּ֑וֹר וַיִּקְרַ֖ע אֶת־בְּגָדָֽיו׃", "pasuk_en": "וַיָּשָׁב רְאוּבֵן אֶל־הַבּוֹר וְהִנֵּה אֵין־יוֹסֵף בַּבּוֹר וַיִּקְרַע אֶת־בְּגָדָיו׃", "rashi_he": "וישב ראובן. בִּמְכִירָתוֹ לֹא הָיָה שָׁם, שֶׁהִגִּיעַ יוֹמוֹ לֵילֵךְ וּלְשַׁמֵּשׁ אֶת אָבִיו. דָּ\"אַ עָסוּק הָיָה בְשַׂקּוֹ וּבְתַעֲנִיתוֹ עַל שֶׁבִּלְבֵּל יְצוּעֵי אָבִיו:", "rashi_en": "רש״י מסביר מדוע ראובן לא היה נוכח בשעת מכירת יוסף. לפי פירוש אחד, הגיע תורו לשמש את אביו. לפי פירוש אחר, היה עסוק בשקו ובתעניתו על שבלבל יצועי אביו.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן בְּרַשׁ״י, מַדּוּעַ רְאוּבֵן לֹא הָיָה נוֹכֵחַ בִּשְׁעַת הַמְּכִירָה?", "options": ["הִגִּיעַ יוֹמוֹ לֵילֵךְ וּלְשַׁמֵּשׁ אֶת אָבִיו", "הָיָה עָסוּק בְּתַעֲנִית עַל חֶטְאוֹ", "הָלַךְ לְחַפֵּשׂ מִרְעֶה לַצֹּאן"], "kasha": "הפסוק אומר \"וישב ראובן אל הבור\" — משמע שלא היה שם, וצריך להבין להיכן הלך.", "answer": "לפי הפירוש הראשון, הגיע תורו של ראובן לילך ולשמש את יעקב אביו, ולכן לא היה עם האחים בשעת המכירה.", "kp": ["שהגיע יומו לילך ולשמש את אביו", "במכירתו לא היה שם"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי בְּרַשׁ״י, בַּמֶּה הָיָה רְאוּבֵן עָסוּק?", "options": ["בְּשַׂקּוֹ וּבְתַעֲנִיתוֹ עַל שֶׁבִּלְבֵּל יְצוּעֵי אָבִיו", "בִּתְפִילָּה עַל חֲלוֹמוֹת יוֹסֵף", "בִּשְׁמִירַת הַצֹּאן בְּמָקוֹם רָחוֹק"], "kasha": "הפסוק מציין שראובן חזר אל הבור ולא היה שם — צריך להסביר היכן היה.", "answer": "לפי הפירוש השני, ראובן היה עסוק בשקו ובתעניתו על שבלבל יצועי אביו, כלומר עשה תשובה על חטאו.", "kp": ["עסוק היה בשקו ובתעניתו", "שבלבל יצועי אביו"]}]}, {"id": "37:30.1", "ch": 37, "v": 30, "n": 1, "dh": "אנה אני בא", "pasuk_html": "וַיָּ֥שָׁב אֶל־אֶחָ֖יו וַיֹּאמַ֑ר הַיֶּ֣לֶד אֵינֶ֔נּוּ וַאֲנִ֖י <mark>אָ֥נָה אֲנִי־בָֽא׃</mark>", "pasuk_en": "וַיָּשָׁב אֶל־אֶחָיו וַיֹּאמַר הַיֶּלֶד אֵינֶנּוּ וַאֲנִי אָנָה אֲנִי־בָא׃", "rashi_he": "אנה אני בא. אָנָה אֶבְרַח מִצַּעְרוֹ שֶׁל אַבָּא?", "rashi_en": "רש״י מפרש ש\"אנה אני בא\" אין פירושו לאן אלך פיזית, אלא אנה אברח מצערו של אבא — כלומר כיצד אוכל לעמוד בפני צערו של יעקב.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילִּים \"אָנָה אֲנִי־בָא\"?", "options": ["אָנָה אֶבְרַח מִצַּעֲרוֹ שֶׁל אַבָּא", "לְאֵיזֶה מָקוֹם אוּכַל לָלֶכֶת מִכָּאן", "כֵּיצַד אוּכַל לַחֲזוֹר אֶל אַחַיי"], "kasha": "המילים \"אנה אני בא\" נשמעות כשאלה על מקום גיאוגרפי, אך בהקשר אין משמעות למיקום.", "answer": "רש״י מפרש שראובן לא שאל לאן ילך, אלא איך יוכל לברוח מצערו של אביו על אובדן יוסף.", "kp": ["אנה אברח מצערו של אבא"]}]}, {"id": "37:31.1", "ch": 37, "v": 31, "n": 1, "dh": "שעיר עזים", "pasuk_html": "וַיִּקְח֖וּ אֶת־כְּתֹ֣נֶת יוֹסֵ֑ף וַֽיִּשְׁחֲטוּ֙ <mark>שְׂעִ֣יר עִזִּ֔ים</mark> וַיִּטְבְּל֥וּ אֶת־הַכֻּתֹּ֖נֶת בַּדָּֽם׃", "pasuk_en": "וַיִּקְחוּ אֶת־כְּתֹנֶת יוֹסֵף וַיִּשְׁחֲטוּ שְׂעִיר עִזִּים וַיִּטְבְּלוּ אֶת־הַכֻּתֹּנֶת בַּדָּם׃", "rashi_he": "שעיר עזים. דָּמוֹ דּוֹמֶה לְשֶׁל אָדָם:", "rashi_en": "רש״י מסביר שהאחים בחרו דווקא בשעיר עזים כי דמו דומה לדם אדם.", "note": "", "points": [{"q": "מַדּוּעַ בָּחֲרוּ הָאַחִים דַּווְקָא בִּשְׂעִיר עִזִּים לְפִי רַשִׁ״י?", "options": ["כִּי דָּמוֹ דּוֹמֶה לְדַם שֶׁל אָדָם", "כִּי הָיָה זָמִין לָהֶם בָּעֵדֶר", "כִּי רָצוּ לְהַקְרִיב קָרְבַּן חַטָּאת"], "kasha": "מדוע מציין הכתוב שהיה דווקא שעיר עזים — מה המיוחד בבחירה זו?", "answer": "האחים בחרו בשעיר עזים כי דמו דומה לשל אדם, וכך יעקב יחשוב שהדם על הכתונת הוא דם יוסף.", "kp": ["דמו דומה לשל אדם"]}]}, {"id": "37:31.2", "ch": 37, "v": 31, "n": 2, "dh": "הכתנת", "pasuk_html": "וַיִּקְח֖וּ אֶת־כְּתֹ֣נֶת יוֹסֵ֑ף וַֽיִּשְׁחֲטוּ֙ שְׂעִ֣יר עִזִּ֔ים וַיִּטְבְּל֥וּ אֶת־<mark>הַכֻּתֹּ֖נֶת</mark> בַּדָּֽם׃", "pasuk_en": "וַיִּקְחוּ אֶת־כְּתֹנֶת יוֹסֵף וַיִּשְׁחֲטוּ שְׂעִיר עִזִּים וַיִּטְבְּלוּ אֶת־הַכֻּתֹּנֶת בַּדָּם׃", "rashi_he": "הכתנת. זֶה שְׁמָהּ, וּכְשֶׁהִיא דְבוּקָה לְתֵבָה אַחֶרֶת, כְּגוֹן כְּתֹנֶת יוֹסֵף, כְּתֹנֶת פַּסִּים, כְּתֹנֶת בַּד, נָקוּד כְּתֹנֶת:", "rashi_en": "רש״י מסביר את צורת המילה \"כתנת\": כשהיא עומדת בפני עצמה נאמר \"הכתנת\", וכשהיא סמוכה למילה אחרת (כמו כתנת יוסף, כתנת פסים) היא בצורת סמיכות ומנוקדת אחרת.", "note": "", "points": [{"q": "מַה מְסַבֵּיר רַשִׁ״י לְגַבֵּי צוּרַת הַמִּילָּה \"הַכֻּתֹּנֶת\"?", "options": ["הַהֶבְדֵּל בַּנִּיקּוּד בֵּין צוּרַת הַנִּפְרָד לְצוּרַת הַסְּמִיכוּת", "שֶׁהַכֻּתֹּונֶת הָייְתָה עֲשׂוּיָה מִבַּד מְיֻוחָד", "שֶׁהַמִּילָּה מוֹפִיעָה רַק בְּסֵפֶר בְּרֵאשִׁית"], "kasha": "התורה כותבת \"הכתנת\" ולא \"הכתונת\" — צריך להבין את השינוי בצורת המילה.", "answer": "רש״י מבאר שכשהמילה עומדת בפני עצמה היא \"הכתנת\", וכשהיא נסמכת למילה אחרת (כתנת יוסף, כתנת פסים) היא מנוקדת בצורה אחרת.", "kp": ["זה שמה", "כשהיא דבוקה לתבה אחרת"]}]}, {"id": "37:33.1", "ch": 37, "v": 33, "n": 1, "dh": "ויאמר כתנת בני", "pasuk_html": "וַיַּכִּירָ֤הּ <mark>וַיֹּ֙אמֶר֙ כְּתֹ֣נֶת בְּנִ֔י</mark> חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְהוּ טָרֹ֥ף טֹרַ֖ף יוֹסֵֽף׃", "pasuk_en": "וַיַּכִּירָהּ וַיֹּאמֶר כְּתֹנֶת בְּנִי חַיָּה רָעָה אֲכָלָתְהוּ טָרֹף טֹרַף יוֹסֵף׃", "rashi_he": "ויאמר כתנת בני. הִיא זוֹ:", "rashi_en": "יעקב זיהה את הכתונת ואמר שזו כתונת בנו יוסף.", "note": "", "points": [{"q": "מַה מוֹסִיף רַשִׁ״י עַל דִּבְרֵי יַעֲקֹב \"כְּתֹנֶת בְּנִי\"?", "options": ["יַעֲקֹב קָבַע בְּווַדָּאוּת שֶׁזּוֹ הַכֻּתֹּונֶת שֶׁל בְּנוֹ", "יַעֲקֹב הִסְתַּפֵּק אִם זוֹ בֶּאֱמֶת הַכֻּתֹּונֶת", "יַעֲקֹב שָׁאַל אֶת בָּנָיו אִם זוֹ כֻּתֹּונֶת יוֹסֵף"], "kasha": "לשון הפסוק \"כתנת בני\" אינה ברורה — האם יעקב מזהה או שואל.", "answer": "רש״י מבהיר שיעקב זיהה את הכתונת ואמר בוודאות: היא זו, כלומר זו כתונת בנו.", "kp": ["היא זו"]}]}, {"id": "37:33.2", "ch": 37, "v": 33, "n": 2, "dh": "חיה רעה אכלתהו", "pasuk_html": "וַיַּכִּירָ֤הּ וַיֹּ֙אמֶר֙ כְּתֹ֣נֶת בְּנִ֔י <mark>חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְהוּ</mark> טָרֹ֥ף טֹרַ֖ף יוֹסֵֽף׃", "pasuk_en": "וַיַּכִּירָהּ וַיֹּאמֶר כְּתֹנֶת בְּנִי חַיָּה רָעָה אֲכָלָתְהוּ טָרֹף טֹרַף יוֹסֵף׃", "rashi_he": "חיה רעה אכלתהו. נִצְנְצָה בוֹ רוּחַ הַקֹּדֶשׁ, סוֹפוֹ שֶׁתִּתְגָּרֶה בוֹ אֵשֶׁת פּוֹטִיפַר. וְלָמָּה לֹא גִלָּה לוֹ הַקָּבָּ\"ה? לְפִי שֶׁהֶחֱרִימוּ וְקִלְּלוּ אֶת כָּל מִי שֶׁיְּגַלֶּה, וְשִׁתְּפוּ לְהַקָּבָּ\"ה עִמָּהֶם (תנחומא), אֲבָל יִצְחָק הָיָה יוֹדֵעַ שֶׁהוּא חַי, אָמַר הֵיאַךְ אֲגַלֶּה וְהַקָּבָּ\"ה אֵינוֹ רוֹצֶה לְגַלּוֹת לוֹ:", "rashi_en": "רש״י מסביר ש\"חיה רעה\" רומז לאשת פוטיפר שעתידה להתגרות ביוסף — רוח הקודש נצנצה ביעקב. הקב״ה לא גילה ליעקב שיוסף חי כי האחים החרימו וקללו כל מי שיגלה ושיתפו את הקב״ה. יצחק ידע שיוסף חי אך לא גילה כי הקב״ה לא רצה לגלות.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, לָמָּה רָמְזוּ הַמִּילִּים \"חַיָּה רָעָה\" בִּנְבוּאַת יַעֲקֹב?", "options": ["לְאֵשֶׁת פּוֹטִיפַר שֶׁעֲתִידָה לְהִתְגָּרוֹת בְּיוֹסֵף", "לְחַיָּה טוֹרֶפֶת שֶׁתָּקְפָה אֶת יוֹסֵף בַּמִּדְבָּר", "לְאַחֵי יוֹסֵף שֶׁהִתְנַכְּלוּ לוֹ וּמְכָרוּהוּ"], "kasha": "יעקב אמר \"חיה רעה אכלתהו\" — אם כן מה משמעות הלשון \"חיה רעה\"?", "answer": "נצנצה ביעקב רוח הקודש, ו\"חיה רעה\" רומז לאשת פוטיפר שסופה להתגרות ביוסף.", "kp": ["נצנצה בו רוח הקדש", "סופו שתתגרה בו אשת פוטיפר"]}, {"q": "לְפִי רַשִׁ״י, מַדּוּעַ הַקָּבּ״ה לֹא גִּילָּה לְיַעֲקֹב שֶׁיּוֹסֵף חַי?", "options": ["כִּי הָאַחִים הֶחֱרִימוּ כָּל מִי שֶׁיְגַלֶּה וְשִׁיתְּפוּ אֶת הַקב״ה", "כִּי הַקב״ה רָצָה לְנַסּוֹת אֶת יַעֲקֹב בֶּאֱמוּנָתוֹ", "כִּי יַעֲקֹב לֹא הָיָה רָאוּי בְּאוֹתָהּ שָׁעָה לְרוּחַ הַקֹּודֶשׁ"], "kasha": "קשה מדוע הקב״ה לא מנע את צערו של יעקב וגילה לו שיוסף חי.", "answer": "האחים החרימו וקללו כל מי שיגלה ושיתפו את הקב״ה עמהם, ולכן גם הקב״ה לא גילה.", "kp": ["שהחרימו וקללו את כל מי שיגלה", "ושתפו להקב\"ה עמהם"]}]}, {"id": "37:34.1", "ch": 37, "v": 34, "n": 1, "dh": "ימים רבים", "pasuk_html": "וַיִּקְרַ֤ע יַעֲקֹב֙ שִׂמְלֹתָ֔יו וַיָּ֥שֶׂם שַׂ֖ק בְּמָתְנָ֑יו וַיִּתְאַבֵּ֥ל עַל־בְּנ֖וֹ <mark>יָמִ֥ים רַבִּֽים׃</mark>", "pasuk_en": "וַיִּקְרַע יַעֲקֹב שִׂמְלֹתָיו וַיָּשֶׂם שַׂק בְּמָתְנָיו וַיִּתְאַבֵּל עַל־בְּנוֹ יָמִים רַבִּים׃", "rashi_he": "ימים רבים. כ\"ב שָׁנָה, מִשֶּׁפֵּרֵשׁ מִמֶּנּוּ עַד שֶׁיָּרַד יַעֲקֹב לְמִצְרַיִם, שֶׁנֶּאֱמַר יוֹסֵף בֶּן שְׁבַע עֶשְׂרֵה שָׁנָה וְגוֹ', וּבֶן שְׁלֹשִׁים שָׁנָה הָיָה בְּעָמְדוֹ לִפְנֵי פַרְעֹה, וְשֶׁבַע שְׁנֵי הַשָּׂבָע, וּשְׁנָתַיִם הָרָעָב כְּשֶׁבָּא יַעֲקֹב לְמִצְרַיִם, הֲרֵי כ\"ב שָׁנָה, כְּנֶגֶד כ\"ב שָׁנָה שֶׁלֹּא קִיֵּם יַעֲקֹב כִּבּוּד אָב וָאֵם (מגילה ט\"ז) – כ' שָׁנָה שֶׁהָיָה בְּבֵית לָבָן, וּב' שָׁנָה בַדֶּרֶךְ בְּשׁוּבוֹ מִבֵּית לָבָן, שָׁנָה וָחֵצִי בְסֻכּוֹת וְשִׁשָּׁה חֳדָשִׁים בְּבֵית אֵל – וְזֶהוּ שֶׁאָמַר לְלָבָן זֶה לִּי עֶשְׂרִים שָׁנָה בְּבֵיתֶךָ, לִי הֵן, עָלַי, וְסוֹפִי לִלְקוֹת כְּנֶגְדָּן:", "rashi_en": "רש״י מפרש ש\"ימים רבים\" הם 22 שנה — משנפרד יוסף מיעקב עד ירידת יעקב למצרים. זה כנגד 22 שנה שיעקב לא קיים כיבוד אב ואם: 20 שנה בבית לבן ושנתיים בדרך חזרתו.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, כְּנֶגֶד מַה נֶּעֱנַשׁ יַעֲקֹב בְּאֶבְלוֹ 22 שָׁנָה?", "options": ["כְּנֶגֶד 22 שָׁנָה שֶׁלֹּא קִיֵּים כִּיבּוּד אָב וָאֵם", "כְּנֶגֶד 22 שָׁנָה שֶׁיּוֹסֵף הָיָה עֶבֶד בְּמִצְרַיִם", "כְּנֶגֶד 22 שָׁנָה שֶׁהָאַחִים הִסְתִּירוּ אֶת מַעֲשֵׂיהֶם"], "kasha": "הלשון \"ימים רבים\" סתומה — כמה זמן התאבל יעקב ולמה דווקא תקופה זו?", "answer": "22 שנה, כנגד 22 שנה שלא קיים כיבוד אב ואם — 20 שנה בבית לבן ושנתיים בדרך חזרתו.", "kp": ["כנגד כ\"ב שנה שלא קים יעקב כבוד אב ואם", "כ' שנה שהיה בבית לבן וב' שנה בדרך"]}]}, {"id": "37:35.1", "ch": 37, "v": 35, "n": 1, "dh": "וכל בנתיו", "pasuk_html": "וַיָּקֻמוּ֩ כָל־בָּנָ֨יו <mark>וְכָל־בְּנֹתָ֜יו</mark> לְנַחֲמ֗וֹ וַיְמָאֵן֙ לְהִתְנַחֵ֔ם וַיֹּ֕אמֶר כִּֽי־אֵרֵ֧ד אֶל־בְּנִ֛י אָבֵ֖ל שְׁאֹ֑לָה וַיֵּ֥בְךְּ אֹת֖וֹ אָבִֽיו׃", "pasuk_en": "וַיָּקֻמוּ כָל־בָּנָיו וְכָל־בְּנֹתָיו לְנַחֲמוֹ וַיְמָאֵן לְהִתְנַחֵם וַיֹּאמֶר כִּי־אֵרֵד אֶל־בְּנִי אָבֵל שְׁאֹלָה וַיֵּבְךְּ אֹתוֹ אָבִיו׃", "rashi_he": "וכל בנתיו. רַבִּי יְהוּדָה אוֹמֵר אֲחָיוֹת תְּאוֹמוֹת נוֹלְדוּ עִם כָּל שֵׁבֶט וָשֵׁבֶט וּנְשָׂאוּם, רַבִּי נְחֶמְיָה אוֹמֵר כְּנַעֲנִיּוֹת הָיוּ, אֶלָּא מַהוּ וְכָל בְּנֹתָיו? – כַּלּוֹתָיו, שֶׁאֵין אָדָם נִמְנָע מִלִּקְרֹא לַחֲתָנוֹ בְּנוֹ וּלְכַלָּתוֹ בִתּוֹ:", "rashi_en": "רש״י מביא מחלוקת: ר׳ יהודה אומר שעם כל שבט נולדה אחות תאומה והאחים נשאו אותן. ר׳ נחמיה אומר שנשותיהם היו כנעניות, ו\"בנתיו\" הכוונה לכלותיו, כי מקובל לקרוא לכלה \"בת\".", "note": "", "points": [{"q": "לְפִי ר׳ נְחֶמְיָה בְּרַשִׁ״י, מִיהֵן \"כָּל בְּנֹתָיו\" שֶׁל יַעֲקֹב?", "options": ["כַּלּוֹתָיו, כִּי מְקֻובָּל לִקְרוֹא לַכַּלָּה בַּת", "בָּנוֹת תְּאוֹמוֹת שֶׁנּוֹלְדוּ עִם הַשְּׁבָטִים", "בְּנוֹת כְּנַעַן שֶׁגִּידֵּל יַעֲקֹב בְּבֵיתוֹ"], "kasha": "לא מצאנו שליעקב היו בנות רבות, אז מיהן \"כל בנתיו\" שבאו לנחמו?", "answer": "לפי ר׳ נחמיה הכוונה לכלותיו, כי אין אדם נמנע מלקרוא לכלתו בתו.", "kp": ["כלותיו", "שאין אדם נמנע מלקרא לחתנו בנו ולכלתו בתו"]}]}, {"id": "37:35.2", "ch": 37, "v": 35, "n": 2, "dh": "וימאן להתנחם", "pasuk_html": "וַיָּקֻמוּ֩ כָל־בָּנָ֨יו וְכָל־בְּנֹתָ֜יו לְנַחֲמ֗וֹ <mark>וַיְמָאֵן֙ לְהִתְנַחֵ֔ם</mark> וַיֹּ֕אמֶר כִּֽי־אֵרֵ֧ד אֶל־בְּנִ֛י אָבֵ֖ל שְׁאֹ֑לָה וַיֵּ֥בְךְּ אֹת֖וֹ אָבִֽיו׃", "pasuk_en": "וַיָּקֻמוּ כָל־בָּנָיו וְכָל־בְּנֹתָיו לְנַחֲמוֹ וַיְמָאֵן לְהִתְנַחֵם וַיֹּאמֶר כִּי־אֵרֵד אֶל־בְּנִי אָבֵל שְׁאֹלָה וַיֵּבְךְּ אֹתוֹ אָבִיו׃", "rashi_he": "וימאן להתנחם. אֵין אָדָם מְקַבֵּל תַּנְחוּמִין עַל הַחַי וְסָבוּר שֶׁמֵּת, שֶׁעַל הַמֵּת נִגְזְרָה גְזֵרָה שֶׁיִּשְׁתַּכַּח מִן הַלֵּב וְלֹא עַל הַחַי (בראשית רבה):", "rashi_en": "רש״י מסביר שיעקב סירב להתנחם כי אי אפשר לקבל תנחומין על אדם חי שסבורים שמת, שהרי הגזרה שישתכח מן הלב נאמרה רק על המת ולא על החי.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ לֹא הִצְלִיחַ יַעֲקֹב לְהִתְנַחֵם עַל יוֹסֵף?", "options": ["כִּי אֵין אָדָם מְקַבֵּל תַּנְחוּמִין עַל חַי שֶׁסָּבוּר שֶׁמֵּת", "כִּי אַהֲבָתוֹ לְיוֹסֵף הָיְתָה גְּדוֹלָה מִדַּי לְהִישָּׁכַח", "כִּי יָדַע בְּרוּחַ הַקֹּודֶשׁ שֶׁיּוֹסֵף סוֹבֵל בַּגָּלוּת"], "kasha": "קשה מדוע לא הועילו הניחומים ליעקב כלל, שהרי דרך העולם שמתנחמים לאחר זמן.", "answer": "אין אדם יכול לקבל תנחומין על מי שחי וסבור שמת, כי רק על המת נגזרה גזרה שישתכח מן הלב, ולא על החי.", "kp": ["אין אדם מקבל תנחומין על החי וסבור שמת", "על המת נגזרה גזרה שישתכח מן הלב"]}]}, {"id": "37:35.3", "ch": 37, "v": 35, "n": 3, "dh": "ארד אל בני", "pasuk_html": "וַיָּקֻמוּ֩ כָל־בָּנָ֨יו וְכָל־בְּנֹתָ֜יו לְנַחֲמ֗וֹ וַיְמָאֵן֙ לְהִתְנַחֵ֔ם וַיֹּ֕אמֶר כִּֽי־<mark>אֵרֵ֧ד אֶל־בְּנִ֛י</mark> אָבֵ֖ל שְׁאֹ֑לָה וַיֵּ֥בְךְּ אֹת֖וֹ אָבִֽיו׃", "pasuk_en": "וַיָּקֻמוּ כָל־בָּנָיו וְכָל־בְּנֹתָיו לְנַחֲמוֹ וַיְמָאֵן לְהִתְנַחֵם וַיֹּאמֶר כִּי־אֵרֵד אֶל־בְּנִי אָבֵל שְׁאֹלָה וַיֵּבְךְּ אֹתוֹ אָבִיו׃", "rashi_he": "ארד אל בני. כְּמוֹ עַל בְּנִי, וְהַרְבֵּה אֶל מְשַׁמְּשִׁין בִּלְשׁוֹן עַל, אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים (שמואל ב כ\"א), אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים וְאֶל מוֹת חָמִיהָ וְאִישָׁהּ (שמואל א ד'):", "rashi_en": "רש״י מסביר שהמילה \"אל\" כאן משמשת בלשון \"על\", כלומר בשביל בני או בגלל בני, ומביא ראיות מפסוקים נוספים שבהם \"אל\" משמשת במובן של \"על\".", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַהוּ פֵּירוּשׁ הַמִּילָּה \"אֶל־\" בְּ\"אֶל־בְּנִי\"?", "options": ["\"אֶל־\" מְשַׁמֶּשֶׁת כָּאן בִּלְשׁוֹן \"עַל\", כְּלוֹמַר בִּשְׁבִיל בְּנִי", "\"אֶל־\" פֵּירוּשָׁהּ לְעֵבֶר, כְּלוֹמַר אֵרֵד לַמָּקוֹם שֶׁבּוֹ בְּנִי נִמְצָא", "\"אֶל־\" פֵּירוּשָׁהּ עִם, כְּלוֹמַר אֵרֵד יַחַד עִם בְּנִי"], "kasha": "המילה \"אל\" פירושה הרגיל הוא \"לעבר\", וקשה מה כוונת יעקב באמרו \"ארד אל בני\".", "answer": "המילה \"אל\" משמשת כאן בלשון \"על\", והרבה פעמים \"אל\" משמשת במובן של \"על\", כמו \"אל שאול ואל בית הדמים\".", "kp": ["הרבה אל משמשין בלשון על"]}]}, {"id": "37:35.4", "ch": 37, "v": 35, "n": 4, "dh": "אבל שאלה", "pasuk_html": "וַיָּקֻמוּ֩ כָל־בָּנָ֨יו וְכָל־בְּנֹתָ֜יו לְנַחֲמ֗וֹ וַיְמָאֵן֙ לְהִתְנַחֵ֔ם וַיֹּ֕אמֶר כִּֽי־אֵרֵ֧ד אֶל־בְּנִ֛י <mark>אָבֵ֖ל שְׁאֹ֑לָה</mark> וַיֵּ֥בְךְּ אֹת֖וֹ אָבִֽיו׃", "pasuk_en": "וַיָּקֻמוּ כָל־בָּנָיו וְכָל־בְּנֹתָיו לְנַחֲמוֹ וַיְמָאֵן לְהִתְנַחֵם וַיֹּאמֶר כִּי־אֵרֵד אֶל־בְּנִי אָבֵל שְׁאֹלָה וַיֵּבְךְּ אֹתוֹ אָבִיו׃", "rashi_he": "אבל שאלה. כִּפְשׁוּטוֹ לְשׁוֹן קֶבֶר הוּא – בְּאֶבְלִי אֶקָּבֵר, וְלֹא אֶתְנַחֵם כָּל יָמַי. וּמִדְרָשׁוֹ, גֵּיהִנֹּם; סִימָן זֶה הָיָה מָסוּר בְּיָדִי מִפִּי הַגְּבוּרָה, אִם לֹא יָמוּת אֶחָד מִבָּנַי בְּחַיַּי, מֻבְטָח אֲנִי שֶׁאֵינִי רוֹאֶה גֵיהִנֹּם:", "rashi_en": "רש״י מביא שני פירושים: לפי הפשט, \"שאולה\" היא קבר — באבלי אקבר ולא אתנחם כל ימי. לפי המדרש, \"שאולה\" היא גיהנם — סימן היה בידו מהקב״ה שאם לא ימות אחד מבניו בחייו, מובטח לו שלא יראה גיהנם.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"שְׁאֹלָה\" לְפִי פְּשׁוּטוֹ שֶׁל רַשׁ״י?", "options": ["לָשׁוֹן קֶבֶר — בְּאֶבְלִי אֶקָּבֵר וְלֹא אֶתְנַחֵם כָּל יָמַי", "לָשׁוֹן שְׁאֵלָה — אֶשְׁאַל עַל בְּנִי עַד שֶׁאֶמְצָאֶנּוּ", "לְשׁוֹן גֵּיהִנֹּם — אֵרֵד לְגֵיהִנֹּם בִּגְלַל צַעֲרִי"], "kasha": "המילה \"שאלה\" טעונה ביאור — האם הכוונה לקבר, או שיש כאן משמעות אחרת.", "answer": "לפי הפשט, שאולה היא קבר, ויעקב אמר שירד לקבר באבלו ולא יתנחם כל ימיו. לפי המדרש, הכוונה לגיהנם — סימן היה בידו שאם לא ימות בנו בחייו, מובטח שלא יראה גיהנם.", "kp": ["כפשוטו לשון קבר הוא", "ומדרשו גיהנם"]}, {"q": "לְפִי מִדְרָשׁוֹ שֶׁל רַשִׁ״י, מַה הָיָה הַסִּימָן שֶׁנִּמְסַר לְיַעֲקֹב?", "options": ["אִם לֹא יָמוּת אֶחָד מִבָּנָיו בְּחַיָּיו, לֹא יִרְאֶה גֵּיהִנֹּם", "אִם יִזְכֶּה לִקְבֹּור אֶת כָּל בָּנָיו, יִזְכֶּה לְגַן עֵדֶן", "אִם לֹא יֶחֱטָא אַף בֵּן שֶׁלּוֹ, כֻּולָּם יִזְכּוּ לָעוֹלָם הַבָּא"], "kasha": "רש״י מביא מדרש שמפרש את \"שאולה\" כגיהנם, וצריך להבין מה הקשר בין מות הבן לגיהנם.", "answer": "סימן היה מסור בידו מפי הגבורה: אם לא ימות אחד מבניו בחייו, מובטח לו שלא יראה גיהנם.", "kp": ["סימן זה היה מסור בידי מפי הגבורה", "מבטח אני שאיני רואה גיהנם"]}]}, {"id": "37:35.5", "ch": 37, "v": 35, "n": 5, "dh": "ויבך אתו אביו", "pasuk_html": "וַיָּקֻמוּ֩ כָל־בָּנָ֨יו וְכָל־בְּנֹתָ֜יו לְנַחֲמ֗וֹ וַיְמָאֵן֙ לְהִתְנַחֵ֔ם וַיֹּ֕אמֶר כִּֽי־אֵרֵ֧ד אֶל־בְּנִ֛י אָבֵ֖ל שְׁאֹ֑לָה <mark>וַיֵּ֥בְךְּ אֹת֖וֹ אָבִֽיו׃</mark>", "pasuk_en": "וַיָּקֻמוּ כָל־בָּנָיו וְכָל־בְּנֹתָיו לְנַחֲמוֹ וַיְמָאֵן לְהִתְנַחֵם וַיֹּאמֶר כִּי־אֵרֵד אֶל־בְּנִי אָבֵל שְׁאֹלָה וַיֵּבְךְּ אֹתוֹ אָבִיו׃", "rashi_he": "ויבך אתו אביו. יִצְחָק, בּוֹכֶה הָיָה מִפְּנֵי צָרָתוֹ שֶׁל יַעֲקֹב אֲבָל לֹא הָיָה מִתְאַבֵּל, שֶׁהָיָה יוֹדֵעַ שֶׁהוּא חַי:", "rashi_en": "רש״י מפרש ש\"אביו\" הוא יצחק. יצחק בכה מפני צערו של יעקב, אך לא התאבל על יוסף כי ידע שיוסף חי.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ בָּכָה יִצְחָק אַךְ לֹא הִתְאַבֵּל?", "options": ["בָּכָה מִפְּנֵי צָרַת יַעֲקֹב, אַךְ יָדַע שֶׁיּוֹסֵף חַי", "בָּכָה כִּי הָיָה זָקֵן וְחַלָּשׁ, אַךְ לֹא הֶאֱמִין שֶׁיּוֹסֵף מֵת", "בָּכָה עִם יַעֲקֹב מִנִּימוּס, אַךְ לֹא הִכִּיר אֶת יוֹסֵף הֵיטֵב"], "kasha": "הפסוק אומר
