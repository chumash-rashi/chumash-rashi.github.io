.cite{direction:rtl;font-size:14px;margin-bottom:-4px;color:var(--muted);line-height:1.4}
.cite b{color:var(--ink);font-weight:600}
.cite a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.cite a:hover{text-decoration:underline}
.quote .dhw{font-weight:700}
.quote .qw{text-decoration:underline dotted;text-underline-offset:4px}
.quote .kp{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 2px}
.quote .src{display:block;direction:rtl;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-top:4px}
.quote .src a{color:var(--accent);font-weight:600;text-decoration:none}

.quote{direction:rtl;text-align:right;font-family:var(--f-rashi);font-size:max(19px,calc(var(--s,1)*16px));line-height:1.55;background:var(--bg);border-radius:10px;padding:8px 12px;flex:1 1 0;min-height:24vh;overflow:auto}
</style>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-soft:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100dvh;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:4px;height:100%}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.top{display:contents}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
h1 span{display:none}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.count b{color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:none}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-heb);font-size:22px;line-height:1.7;letter-spacing:.03em;word-spacing:.08em;direction:rtl;text-align:right}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{display:none}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:6px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:8px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:18px;line-height:1.45;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:center;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-body);font-size:17px;line-height:1.4;width:100%;direction:rtl}
.opt .k{flex:none;font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-soft)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.row{display:flex;flex-direction:column;gap:2px}
.row .t{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);direction:rtl}
.row p{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--accent);font-size:18px;font-weight:600;display:inline-block;padding:5px 16px;border:1.5px solid var(--accent);border-radius:9px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:14px;line-height:1.6;direction:rtl;text-align:right}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface);font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line);font-size:14px}
.hint{font-size:11px;color:var(--muted);text-align:center;flex-shrink:0}
.verdict{font-weight:600;font-size:16px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:20px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* taamim: Frank Ruhl lacks cantillation glyphs, so those letters fell back to another font */
.pasuk{font-family:var(--f-heb)}
/* pasuk panel: visually separate the verse from the question */
.pasuk{background:var(--accent-soft);border-inline-start:5px solid var(--accent);border-radius:10px;padding:calc(var(--s,1)*6px) calc(var(--s,1)*12px)}
.point{border-top:1px solid var(--line);padding-top:calc(var(--s,1)*8px)}
/* fit layout: only pasuk + question + options in the card; fine print lives in the footer */
.wrap{max-width:min(1500px,100%)}
header .top,.tools,.ref,.dh{display:none}
.card{gap:calc(var(--s,1)*8px)}
.pasuk{font-size:calc(var(--s,1)*22px)}
.q{font-size:calc(var(--s,1)*18px)}
.opt{font-size:calc(var(--s,1)*17px);padding:calc(var(--s,1)*7px) calc(var(--s,1)*10px)}
.opt .k{width:calc(var(--s,1)*20px);height:calc(var(--s,1)*20px);font-size:calc(var(--s,1)*11px)}
.row p{font-size:25px;line-height:1.35}
.verdict{font-size:26px;font-weight:700}
.row .t{font-size:16px}
.point{gap:calc(var(--s,1)*10px)}
.card{position:relative}
.reveal{position:absolute;inset-inline:12px;bottom:56px;z-index:3;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.nav .btn{padding:4px 12px;font-size:13px}
@media (max-width:460px){.pasuk{font-size:calc(var(--s,1)*22px)}}
.hint{font-size:11px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}

/* wide screens: split layout (pasuk | question+answers), fonts auto-fit each side */
@media (min-width:900px){
.wrap{max-width:min(1800px,100%)}
.card{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr) auto auto;column-gap:22px;row-gap:8px;overflow:hidden}
.card>.pasuk{grid-column:1;grid-row:1;overflow:hidden;align-self:stretch;font-size:calc(var(--sp,1)*22px);padding:calc(var(--sp,1)*10px) calc(var(--sp,1)*14px)}
.card>.point{position:relative;grid-column:2;grid-row:1;min-height:0;overflow:hidden;border-top:0;padding-top:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--s,1)*12px)}
.card>details{grid-column:1/-1;grid-row:2}
.card>.nav{grid-column:1/-1;grid-row:3}
.reveal{position:absolute;inset:auto 0 0 0;z-index:3;max-height:none;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.row p{font-size:calc(var(--s,1)*18px);line-height:1.4}
.verdict{font-size:30px;font-weight:700}
.row .t{font-size:20px}
.q{font-size:calc(var(--s,1)*21px)}
.opt{font-size:calc(var(--s,1)*21px)}
}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <h1>רש״י · וירא <span>רש״י על וירא</span></h1>
      <div class="count" id="count"></div>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="tools">
      <label for="jump" class="count">עבור אל</label>
      <select id="jump"></select>
      <button class="ghost" id="nextUnanswered" type="button">הבא ללא מענה</button>
      <span id="resetZone"><button class="ghost" id="reset" type="button">התחל מחדש</button></span>
    </div>
  </header>
  <main id="main"></main>
  <div class="hint">מקשים: 1-3 לתשובה · Enter להבא · ← / → לניווט</div>
</div>

<script>
const DATA = [{"id": "18:1.1", "ch": 18, "v": 1, "n": 1, "dh": "וירא אליו", "pasuk_html": "<mark>וַיֵּרָ֤א אֵלָיו֙</mark> יְהוָ֔ה בְּאֵלֹנֵ֖י מַמְרֵ֑א וְה֛וּא יֹשֵׁ֥ב פֶּֽתַח־הָאֹ֖הֶל כְּחֹ֥ם הַיּֽוֹם׃", "pasuk_en": "וַיֵּרָא אֵלָיו יְהוָה בְּאֵלֹנֵי מַמְרֵא וְהוּא יֹשֵׁב פֶּתַח־הָאֹהֶל כְּחֹם הַיּוֹם׃", "rashi_he": "וירא אליו. לְבַקֵּר אֶת הַחוֹלֶה. אָמַר רַבִּי חָמָא בַּר חֲנִינָא, יוֹם שְׁלִישִׁי לְמִילָתוֹ הָיָה, וּבָא הַקָּבָּ\"ה וְשָׁאַל בִּשְׁלוֹמוֹ (בבא מציעא פ\"ו):", "rashi_en": "ה' נגלה לאברהם כדי לבקר אותו בחוליו, כי היה זה היום השלישי אחרי המילה, ושאל בשלומו.", "note": "", "points": [{"q": "לְשֵׁם מָה נִגְלָה ה' לְאַבְרָהָם, כְּשֶׁבַּפָּסוּק לֹא נֶאֱמַר שׁוּם דָּבָר שֶׁה' אָמַר לוֹ?", "options": ["כְּדֵי לְבַקֵּר אוֹתוֹ בְּחָולְיוֹ לְאַחַר הַמִּילָה", "כְּדֵי לְבַשֵּׂר לוֹ עַל הוֹלֶדֶת יִצְחָק", "כְּדֵי לְגַלּוֹת לוֹ עַל הֲפִיכַת סְדוֹם"], "kasha": "הפסוק מספר שה' נגלה לאברהם, אך אינו אומר מה היתה מטרת ההתגלות.", "answer": "ה' בא לבקר את החולה, כי היה זה היום השלישי למילתו, ושאל בשלומו.", "kp": ["לבקר את החולה", "יום שלישי למילתו היה"]}]}, {"id": "18:1.2", "ch": 18, "v": 1, "n": 2, "dh": "באלוני ממרא", "pasuk_html": "וַיֵּרָ֤א אֵלָיו֙ יְהוָ֔ה <mark>בְּאֵלֹנֵ֖י מַמְרֵ֑א</mark> וְה֛וּא יֹשֵׁ֥ב פֶּֽתַח־הָאֹ֖הֶל כְּחֹ֥ם הַיּֽוֹם׃", "pasuk_en": "וַיֵּרָא אֵלָיו יְהוָה בְּאֵלֹנֵי מַמְרֵא וְהוּא יֹשֵׁב פֶּתַח־הָאֹהֶל כְּחֹם הַיּוֹם׃", "rashi_he": "באלוני ממרא. הוּא שֶׁנָּתַן לוֹ עֵצָה עַל הַמִּילָה, לְפִיכָךְ נִגְלָה עָלָיו בְּחֶלְקוֹ (בראשית רבה):", "rashi_en": "ממרא יעץ לאברהם לקיים את מצוות המילה, ולכן נגלה ה' לאברהם דווקא בשטח של ממרא.", "note": "", "points": [{"q": "מַדּוּעַ מְצַייֶּנֶת הַתּוֹרָה שֶׁה' נִגְלָה לְאַבְרָהָם דַּוְוקָא \"בְּאֵלֹנֵי מַמְרֵא\"?", "options": ["כִּי מַמְרֵא יָעַץ לְאַבְרָהָם לְקַיֵּים אֶת הַמִּילָה", "כִּי שָׁם הָיָה הַמִּזְבֵּחַ שֶׁבָּנָה אַבְרָהָם לַה'", "כִּי שָׁם יָשַׁב אַבְרָהָם לַחְפֹּשׂ אוֹרְחִים"], "kasha": "לכאורה אין צורך לציין את מקום ההתגלות, ולא ברור מדוע נבחר דווקא חלקו של ממרא.", "answer": "ממרא נתן לאברהם עצה על המ חוּ יַחַד לְבַשֵּׂר אֶת שָׂרָה"], "kasha": "לא ברור לשם מה נצרכו שלושה מלאכים, ומדוע לא די היה במלאך אחד.", "answer": "אחד בא לבשר את שרה, אחד להפוך את סדום ואחד לרפא את אברהם, שאין מלאך אחד עושה שתי שליחויות.", "kp": ["אחד לבשר את שרה", "אין מלאך אחד עושה שתי שליחיות"]}, {"q": "מֵהֵיכָן מוֹכִיחַ רַשִׁ\"י שֶׁכָּל מַלְאָךְ הָיָה מְמֻונֶּה עַל שְׁלִיחוּת אַחֶרֶת?", "options": ["בִּבְשׂוֹרָה וּבְהֲפִיכַת סְדוֹם נֶאֱמַר לְשׁוֹן יָחִיד", "בְּכָל הַפָּרָשָׁה הֵם נִזְכָּרִים בְּלָשׁוֹן רַבִּים", "רַק מַלְאָךְ אֶחָד אָכַל מִן הַסְּעוּדָה"], "kasha": "יש לברר מה ההוכחה שהיו שליחויות נפרדות, ולא ששלושתם עשו הכול יחד.", "answer": "בכל הפרשה הם נזכרים בלשון רבים, אך בבשורה נאמר \"ויאמר שוב אשוב\" ובהפיכת סדום \"לבלתי הפכי\" בלשון יחיד. וכן רפאל, שריפא את אברהם, הלך משם להציל את לוט.", "kp": ["ובבשורה נאמר ויאמר שוב אשוב אליך", "למדת שהאחד היה מציל"]}]}, {"id": "18:2.2", "ch": 18, "v": 2, "n": 2, "dh": "נצבים עליו", "pasuk_html": "וַיִּשָּׂ֤א עֵינָיו֙ וַיַּ֔רְא וְהִנֵּה֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים <mark>נִצָּבִ֖ים עָלָ֑יו</mark> וַיַּ֗רְא וַיָּ֤רָץ לִקְרָאתָם֙ מִפֶּ֣תַח הָאֹ֔הֶל וַיִּשְׁתַּ֖חוּ אָֽרְצָה׃", "pasuk_en": "וַיִּשָּׂא עֵינָיו וַיַּרְא וְהִנֵּה שְׁלֹשָׁה אֲנָשִׁים נִצָּבִים עָלָיו וַיַּרְא וַיָּרָץ לִקְרָאתָם מִפֶּתַח הָאֹהֶל וַיִּשְׁתַּחוּ אָרְצָה׃", "rashi_he": "נצבים עליו. לְפָנָיו, אֲבָל לָשׁוֹן נְקִיָּה הוּא כְּלַפֵּי הַמַּלְאָכִים:", "rashi_en": "\"נצבים עליו\" פירושו עומדים לפניו, והתורה נקטה לשון \"עליו\" כלשון נקייה ומכובדת כלפי המלאכים.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"נִצָּבִים עָלָיו\" לְפִי רַשִׁ\"י?", "options": ["עוֹמְדִים לְפָנָיו, בִּלְשׁוֹן שֶׁל כָּבוֹד כְּלַפֵּי הַמַּלְאָכִים", "עוֹמְדִים מַמָּשׁ מֵעַל רֹאשׁוֹ שֶׁל אַבְרָהָם", "עוֹמְדִים לְיָדוֹ כְּדֵי לְהַשְׁגִּיחַ וְלִשְׁמוֹר עָלָיו"], "kasha": "\"עליו\" משמע מעליו, ואין זה מתאים לאנשים שעומדים מול אברהם.", "answer": "פירושו לפניו, אלא שהתורה נקטה לשון נקייה זו כלפי המלאכים.", "kp": ["לשון נקיה הוא כלפי המלאכים"]}]}, {"id": "18:2.3", "ch": 18, "v": 2, "n": 3, "dh": "וירא", "pasuk_html": "וַיִּשָּׂ֤א עֵינָיו֙ <mark>וַיַּ֔רְא</mark> וְהִנֵּה֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים נִצָּבִ֖ים עָלָ֑יו וַיַּ֗רְא וַיָּ֤רָץ לִקְרָאתָם֙ מִפֶּ֣תַח הָאֹ֔הֶל וַיִּשְׁתַּ֖חוּ אָֽרְצָה׃", "pasuk_en": "וַיִּשָּׂא עֵינָיו וַיַּרְא וְהִנֵּה שְׁלֹשָׁה אֲנָשִׁים נִצָּבִים עָלָיו וַיַּרְא וַיָּרָץ לִקְרָאתָם מִפֶּתַח הָאֹהֶל וַיִּשְׁתַּחוּ אָרְצָה׃", "rashi_he": "וירא. מַהוּ וַיַּרְא וַיַּרְא שְׁתֵּי פְעָמִים? הָרִאשׁוֹן כְּמַשְׁמָעוֹ וְהַשֵּׁנִי לְשׁוֹן הֲבָנָה, נִסְתַּכֵּל שֶׁהָיוּ נִצָּבִים בְּמָקוֹם אֶחָד וְהֵבִין שֶׁלֹּא הָיוּ רוֹצִים לְהַטְרִיחוֹ, וְאַף עַל פִּי שֶׁיּוֹדְעִים הָיוּ שֶׁיֵּצֵא לִקְרָאתָם עָמְדוּ בִמְקוֹמָם לְכְבוֹדוֹ, לְהַרְאוֹתוֹ שֶׁלֹּא רָצוּ לְהַטְרִיחוֹ, וְקָדַם הוּא וְרָץ לִקְרָאתָם, בְּבָבָא מְצִיעָא, כְתִיב נִצָּבִים עָלָיו, וּכְתִיב וַיָּרָץ לִקְרָאתָם? כַּד חַזְיוּהוּ דַּהֲוָה שָׁרֵי וְאָסַר פֵּרְשׁוּ הֵימֶנּוּ, מִיָּד וַיָּרָץ לִקְרָאתָם:", "rashi_en": "\"וירא\" נכתב פעמיים: הראשון ראייה ממש, והשני הבנה, שאברהם הבין שהמלאכים עומדים במקומם כי אינם רוצים להטריחו, ולכן רץ לקראתם. לפי הגמרא, כשראו שהוא מתיר וקושר את תחבושת המילה התרחקו ממנו, ומיד רץ לקראתם.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן בְּרַשִׁ\"י, מַה פֵּירוּשׁ \"וַיַּרְא\" הַשֵּׁנִי בַּפָּסוּק?", "options": ["הֵבִין שֶׁהַמַּלְאָכִים לֹא רָצוּ לְהַטְרִיחוֹ", "רָאָה שׁוּב אֶת הַמַּלְאָכִים מִתְקָרְבִים אֵלָיו", "רָאָה שֶׁהַמַּלְאָכִים עֲיֵיפִים מִן הַדֶּרֶךְ"], "kasha": "המילה \"וירא\" כתובה פעמיים בפסוק, ולכאורה אחת מהן מיותרת.", "answer": "הראשון הוא ראייה כמשמעו, והשני לשון הבנה: אברהם ראה שהם עומדים במקום אחד והבין שאינם רוצים להטריחו, ולכן הקדים ורץ לקראתם.", "kp": ["והשני לשון הבנה", "והבין שלא היו רוצים להטריחו"]}, {"q": "כֵּיצַד מְייַשֶּׁבֶת הַגְּמָרָא אֶת הַסְּתִירָה בֵּין \"נִצָּבִים עָלָיו\" לְבֵין \"וַיָּרָץ לִקְרָאתָם\"?", "options": ["כְּשֶׁרָאוּ שֶׁהוּא מַתִּיר וְקוֹשֵׁר אֶת מַכָּתוֹ, הִתְרַחֲקוּ מִמֶּנּוּ", "בְּתַחִילָּה עָמְדוּ לְיָדוֹ וְאַחַר כָּךְ הִמְשִׁיכוּ בְּדַרְכָּם", "אַבְרָהָם רָץ אֲלֵיהֶם עוֹד לִפְנֵי שֶׁהִגִּיעוּ אֵלָיו"], "kasha": "אם המלאכים עמדו על ידו, מדוע היה צריך אברהם לרוץ לקראתם.", "answer": "כשראו המלאכים שאברהם מתיר וקושר את תחבושת המילה, התרחקו ממנו, ומיד רץ לקראתם.", "kp": ["כד חזיוהו דהוה שרי ואסר", "פרשו הימנו"]}]}, {"id": "18:3.1", "ch": 18, "v": 3, "n": 1, "dh": "ויאמר אדני אם נא וגו'", "pasuk_html": "<mark>וַיֹּאמַ֑ר אֲדֹנָ֗י אִם־נָ֨א</mark> מָצָ֤אתִי חֵן֙ בְּעֵינֶ֔יךָ אַל־נָ֥א תַעֲבֹ֖ר מֵעַ֥ל עַבְדֶּֽךָ׃", "pasuk_en": "וַיֹּאמַר אֲדֹנָי אִם־נָא מָצָאתִי חֵן בְּעֵינֶיךָ אַל־נָא תַעֲבֹר מֵעַל עַבְדֶּךָ׃", "rashi_he": "ויאמר אדני אם נא וגו'. לַגָּדוֹל שֶׁבָּהֶם אָמַר וּקְרָאָם כֻּלָּם אֲדוֹנִים וְלַגָּדוֹל אָמַר אַל נָא תַעֲבֹר, וְכֵיוָן שֶׁלֹּא יַעֲבֹר הוּא יַעַמְדוּ חֲבֵרָיו עִמּוֹ, וּבְלָשׁוֹן זֶה הוּא חֹל (שבועות ל\"ה). דָּ\"אַ קֹדֶשׁ הוּא, וְהָיָה אוֹמֵר לְהַקָּבָּ\"ה לְהַמְתִּין לוֹ עַד שֶׁיָּרוּץ וְיַכְנִיס אֶת הָאוֹרְחִים וְאַעַ\"פִּ שֶׁכָּתוּב אַחַר וַיָּרָץ לִקְרָאתָם, הָאֲמִירָה קֹדֶם לָכֵן הָיְתָה, וְדֶרֶךְ הַמִּקְרָאוֹת לְדַבֵּר כֵּן, כְּמוֹ שֶׁפֵּרַשְׁתִּי אֵצֶל לֹא יָדוֹן רוּחִי בָאָדָם, שֶׁנִּכְתַּב אַחַר וַיּוֹלֶד נֹחַ, וְאִי אֶפְשַׁר לוֹמַר אֶלָּא שֶׁהָיְתָה הַגְּזֵרָה קֹדֶם לַלֵּדָה כ' שָׁנָה, וּשְׁתֵּי הַלְּשׁוֹנוֹת בִּבְ\"רַ:", "rashi_en": "יש כאן שני פירושים. לפי הראשון אברהם פנה לגדול שבאורחים וביקש שלא יעבור, כי אז יישארו גם חבריו, ו\"אדני\" הוא לשון חול. לפי השני \"אדני\" הוא שם קודש, ואברהם ביקש מה' להמתין לו עד שיכניס את האורחים.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן, מַדּוּעַ מְדַבֵּר אַבְרָהָם בִּלְשׁוֹן יָחִיד אַף שֶׁהָיוּ שְׁלֹושָׁה אוֹרְחִים?", "options": ["דִּיבֵּר אֶל הַגָּדוֹל שֶׁבָּהֶם, וַחֲבֵרָיו יִישָּׁאֲרוּ עִמּוֹ", "דִּיבֵּר רַק אֶל הַמַּלְאָךְ שֶׁבָּא לְבַשֵּׂר אֶת שָׂרָה", "חָשַׁב שֶׁרַק אֶחָד מֵהֶם אוֹרֵחַ וְהַשְּׁאָר מְשָׁרְתָיו"], "kasha": "אברהם אומר \"בעיניך\" ו\"תעבר\" בלשון יחיד, אף שלפניו עמדו שלושה אנשים.", "answer": "הוא קרא לכולם אדונים, אך לגדול שבהם אמר \"אל נא תעבר\", כי כשהגדול לא יעבור יעמדו חבריו עמו; ולפי זה \"אדני\" הוא לשון חול.", "kp": ["לגדול שבהם אמר", "יעמדו חבריו עמו"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי, אֶל מִי פָּנָה אַבְרָהָם בְּאָומְרוֹ \"אֲדֹנָי\"?", "options": ["אֶל ה', שֶׁיַּמְתִּין לוֹ עַד שֶׁיַּכְנִיס אֶת הָאוֹרְחִים", "אֶל הַגָּדוֹל שֶׁבַּמַּלְאָכִים, שֶׁיְּעַכֵּב אֶת חֲבֵרָיו", "אֶל שְׁלוֹשֶׁת הָאוֹרְחִים יַחַד בִּלְשׁוֹן כָּבוֹד"], "kasha": "אם הדברים נאמרו לה', קשה מדוע הם כתובים אחרי שאברהם כבר רץ לקראת האורחים.", "answer": "\"אדני\" הוא שם קודש, ואברהם ביקש מה' להמתין לו עד שירוץ ויכניס את האורחים. האמירה קדמה לריצה, אף שנכתבה אחריה, שכך דרך המקראות.", "kp": ["ד\"א קדש הוא", "להמתין לו עד שירוץ", "האמירה קדם לכן היתה"]}]}, {"id": "18:4.1", "ch": 18, "v": 4, "n": 1, "dh": "יקח נא", "pasuk_html": "<mark>יֻקַּֽח־נָ֣א</mark> מְעַט־מַ֔יִם וְרַחֲצ֖וּ רַגְלֵיכֶ֑ם וְהִֽשָּׁעֲנ֖וּ תַּ֥חַת הָעֵֽץ׃", "pasuk_en": "יֻקַּח־נָא מְעַט־מַיִם וְרַחֲצוּ רַגְלֵיכֶם וְהִשָּׁעֲנוּ תַּחַת הָעֵץ׃", "rashi_he": "יקח נא. עַל יְדֵי שָׁלִיחַ, וְהַקָּבָּ\"ה שִׁלֵּם לְבָנָיו עַל יְדֵי שָׁלִיחַ, שֶׁנֶּאֱמַר וַיָּרֶם מֹשֶׁה אֶת יָדוֹ וַיַּךְ אֶת הַסֶּלַע (במדבר כ'):", "rashi_en": "אברהם הביא את המים על ידי שליח ולא בעצמו, ולכן גם ה' שילם לבניו את המים במדבר על ידי שליח, כשמשה היכה בסלע.", "note": "", "points": [{"q": "מַה לוֹמֵד רַשִׁ\"י מִכָּךְ שֶׁאַבְרָהָם אָמַר \"יֻקַּחנָא\" וְלֹא הֵבִיא אֶת הַמַּיִם בְּעַצְמוֹ?", "options": ["הַמַּיִם הוּבְאוּ עַל יְדֵי שָׁלִיחַ, וְלָכֵן ה' שִׁילֵּם לְבָנָיו עַל יְדֵי שָׁלִיחַ", "אַבְרָהָם הָיָה חַלָּשׁ מִן הַמִּילָה וְלֹא יָכוֹל לָשֵׂאת מַיִם", "אַבְרָהָם רָצָה לְחַנֵּךְ אֶת יִשְׁמָעֵאל בְּמִצְווֹת"], "kasha": "בשאר הכנות הסעודה אברהם טרח בעצמו, ואילו כאן הוא אומר \"יקחנא\", כלומר שאחר יביא.", "answer": "המים ניתנו על ידי שליח, ולכן גם ה' שילם לבניו על ידי שליח, כמו שנאמר \"וירם משה את ידו ויך את הסלע\".", "kp": ["על ידי שליח", "והקב\"ה שלם לבניו על ידי שליח"]}]}, {"id": "18:4.2", "ch": 18, "v": 4, "n": 2, "dh": "ורחצו רגליכם", "pasuk_html": "יֻקַּֽח־נָ֣א מְעַט־מַ֔יִם <mark>וְרַחֲצ֖וּ רַגְלֵיכֶ֑ם</mark> וְהִֽשָּׁעֲנ֖וּ תַּ֥חַת הָעֵֽץ׃", "pasuk_en": "יֻקַּח־נָא מְעַט־מַיִם וְרַחֲצוּ רַגְלֵיכֶם וְהִשָּׁעֲנוּ תַּחַת הָעֵץ׃", "rashi_he": "ורחצו רגליכם. כַּסָּבוּר שֶׁהֵם עַרְבִיִּים שֶׁמִּשְׁתַּחֲוִים לַאֲבַק רַגְלֵיהֶם וִהִקְפִּיד שֶׁלֹא לְהַכְנִיס עֲ\"זָ לְבֵיתוֹ; אֲבָל לוֹט שֶׁלֹּא הִקְפִּיד, הִקְדִּים לִינָה לִרְחִיצָה, שֶׁנֶּאֱמַר וְלִינוּ וְרַחֲצוּ רַגְלֵיכֶם:", "rashi_en": "אברהם חשב שהאורחים הם ערבים המשתחווים לאבק רגליהם, ולכן הקפיד שירחצו את רגליהם כדי שלא להכניס עבודה זרה לביתו. לוט לא הקפיד על כך, ולכן הקדים לינה לרחיצה.", "note": "", "points": [{"q": "מַדּוּעַ בִּיקֵּשׁ אַבְרָהָם מֵהָאוֹרְחִים לִרְחֹוץ אֶת רַגְלֵיהֶם מִיָּד?", "options": ["חָשַׁשׁ שֶׁהֵם עוֹבְדִים לַאֲבַק רַגְלֵיהֶם, וְלֹא רָצָה עֲבוֹדָה זָרָה בְּבֵיתוֹ", "כְּדֵי שֶׁיָּנוּחוּ מִן הַדֶּרֶךְ הָאֲרֻוכָּה בְּחֹום הַיּוֹם", "כְּדֵי שֶׁלֹּא יְלַכְלְכוּ אֶת הָאֹהֶל בַּאֲבַק הַדְּרָכִים"], "kasha": "הבקשה לרחוץ רגליים מיד בתחילה טעונה הסבר, בפרט שלוט ביקש זאת רק אחרי הלינה.", "answer": "אברהם חשב שהם ערבים המשתחווים לאבק רגליהם, והקפיד שלא להכניס עבודה זרה לביתו; אבל לוט, שלא הקפיד, הקדים לינה לרחיצה.", "kp": ["כסבור שהם ערביים שמשתחוים לאבק רגליהם", "שלא להכניס ע\"ז לביתו"]}]}, {"id": "18:4.3", "ch": 18, "v": 4, "n": 3, "dh": "תחת העץ", "pasuk_html": "יֻקַּֽח־נָ֣א מְעַט־מַ֔יִם וְרַחֲצ֖וּ רַגְלֵיכֶ֑ם וְהִֽשָּׁעֲנ֖וּ <mark>תַּ֥חַת הָעֵֽץ׃</mark>", "pasuk_en": "יֻקַּח־נָא מְעַט־מַיִם וְרַחֲצוּ רַגְלֵיכֶם וְהִשָּׁעֲנוּ תַּחַת הָעֵץ׃", "rashi_he": "תחת העץ. תַּחַת הָאִילָן:", "rashi_en": "\"העץ\" כאן פירושו האילן, כלומר עץ חי הנותן צל.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"הָעֵץ\" בַּפָּסוּק לְפִי רַשִׁ\"י?", "options": ["אִילָן, עֵץ חַי הַגָּדֵל בַּמָּקוֹם", "קוֹרַת עֵץ אוֹ מַקֵּל שֶׁנִשְׁעָנִים עָלָיו", "סֻוכָּה אוֹ סְכָכָה הָעֲשׂוּיָה מֵעֵצִים"], "kasha": "המילה \"עץ\" יכולה להתפרש גם כחומר עץ, ולא ברור לאיזה עץ הכוונה.", "answer": "\"תחת העץ\" פירושו תחת האילן.", "kp": ["תחת האילן"]}]}, {"id": "18:5.1", "ch": 18, "v": 5, "n": 1, "dh": "וסעדו לבכם", "pasuk_html": "וְאֶקְחָ֨ה פַת־לֶ֜חֶם <mark>וְסַעֲד֤וּ לִבְּכֶם֙</mark> אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי־עַל־כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל־עַבְדְּכֶ֑ם וַיֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּאֲשֶׁ֥ר דִּבַּֽרְתָּ׃", "pasuk_en": "וְאֶקְחָה פַת־לֶחֶם וְסַעֲדוּ לִבְּכֶם אַחַר תַּעֲבֹרוּ כִּי־עַל־כֵּן עֲבַרְתֶּם עַל־עַבְדְּכֶם וַיֹּאמְרוּ כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ׃", "rashi_he": "וסעדו לבכם. בַּתּוֹרָה, בַנְּבִיאִים וּבַכְּתוּבִים מָצִינוּ דְּפִתָּא סַעֲדָתָא דְלִבָּא. בַּתּוֹרָה וְסַעֲדוּ לִבְּכֶם, בַּנְּבִיאִים סְעָד לִבְּךָ פַּת לֶחֶם (שופטים י\"ט), בַּכְּתוּבִים וְלֶחֶם לְבַב אֱנוֹשׁ יִסְעָד (תהל' ק\"ד). אָמַר רַבִּי חָמָא, לְבַבְכֶם אֵין כְּתִיב כָּאן אֶלָּא לִבְּכֶם, מַגִּיד שֶׁאֵין יֵצֶר הָרַע שׁוֹלֵט בַּמַּלְאָכִים (בראשית רבה):", "rashi_en": "בתורה, בנביאים ובכתובים מצינו שהלחם סועד את הלב. ורבי חמא דרש שנכתב \"לבכם\" ולא \"לבבכם\", ללמד שאין יצר הרע שולט במלאכים.", "note": "", "points": [{"q": "מַדּוּעַ אָמַר אַבְרָהָם עַל הַלֶּחֶם \"וְסַעֲדוּ לִבְּכֶם\"?", "options": ["כִּי בְּכָל הַמִּקְרָא הַלֶּחֶם הוּא סְעַד הַלֵּב", "כִּי הַלֶּחֶם מְשַׂמֵּחַ אֶת הַלֵּב כְּמוֹ יַיִן", "כִּי הָאוֹרְחִים הָיוּ חַלָּשִׁים וּרְעֵבִים מְאֹוד"], "kasha": "לא ברור מדוע הלחם מתואר כמי שסועד דווקא את הלב.", "answer": "בתורה, בנביאים ובכתובים מצינו שהפת היא סעד הלב, כגון \"ולחם לבב אנוש יסעד\".", "kp": ["דפתא סעדתא דלבא"]}, {"q": "מַה לוֹמֵד רַבִּי חָמָא מִכָּךְ שֶׁכָּתוּב \"לִבְּכֶם\" וְלֹא \"לְבַבְכֶם\"?", "options": ["שֶׁאֵין יֵצֶר הָרַע שׁוֹלֵט בְּמַלְאָכִים", "שֶׁהַמַּלְאָכִים לֹא הָיוּ רְעֵבִים בֶּאֱמֶת", "שֶׁאַבְרָהָם הֵבִין שֶׁהֵם מַלְאָכִים"], "kasha": "במקומות רבים נכתב \"לבבכם\" בשתי בי\"תין, וכאן נכתב \"לבכם\" בבי\"ת אחת.", "answer": "הכתוב \"לבכם\" ולא \"לבבכם\" מגיד שאין יצר הרע שולט במלאכים.", "kp": ["לבבכם אין כתיב כאן אלא לבכם", "שאין יצר הרע שולט במלאכים"]}]}, {"id": "18:5.2", "ch": 18, "v": 5, "n": 2, "dh": "אחר תעבורו", "pasuk_html": "וְאֶקְחָ֨ה פַת־לֶ֜חֶם וְסַעֲד֤וּ לִבְּכֶם֙ <mark>אַחַ֣ר תַּעֲבֹ֔רוּ</mark> כִּֽי־עַל־כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל־עַבְדְּכֶ֑ם וַיֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּאֲשֶׁ֥ר דִּבַּֽרְתָּ׃", "pasuk_en": "וְאֶקְחָה פַת־לֶחֶם וְסַעֲדוּ לִבְּכֶם אַחַר תַּעֲבֹרוּ כִּי־עַל־כֵּן עֲבַרְתֶּם עַל־עַבְדְּכֶם וַיֹּאמְרוּ כֵּן תַּעֲשֶׂה כַּאֲשֶׁר ֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ׃", "rashi_he": "כי על כן. כְּמוֹ עַל אֲשֶׁר, וְכֵן כָּל כִּי עַל כֵּן שֶׁבַּמִּקְרָא, כִּי עַל כֵּן בָּאוּ בְּצֵל קֹרָתִי (בראשית י\"ט), כִּי עַל כֵּן רָאִיתִי פָנֶיךָ (בראשית ל״ג:י׳), כִּי עַל כֵּן לֹא נְתַתִּיהָ (שם ל\"ח), כִּי עַל כֵּן יָדַעְתָּ חֲנֹתֵנוּ (במדבר י'):", "rashi_en": "הצירוף \"כי על כן\" פירושו \"על אשר\", כלומר מאחר ש..., וכך פירושו בכל מקום במקרא.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַה מַּשְׁמָעוּת הַצֵּירוּף כִּי עַל כֵּן בַּפָּסוּק?", "options": ["עַל אֲשֶׁר, כְּלוֹמַר מֵאַחַר שֶׁ...", "לָכֵן, כְּתוֹצָאָה מִמַּה שֶׁנֶּאֱמַר קֹודֶם", "אַף עַל פִּי כֵן, לְמַרוֹת זֹאת"], "kasha": "\"על כן\" משמעו בדרך כלל לכן, ומשמעות זו אינה מתאימה כאן.", "answer": "\"כי על כן\" הוא כמו \"על אשר\", וכן פירושו בכל מקום במקרא, כגון \"כי על כן באו בצל קרתי\".", "kp": ["כמו על אשר", "וכן כל כי על כן שבמקרא"]}]}, {"id": "18:6.1", "ch": 18, "v": 6, "n": 1, "dh": "קמח סלת", "pasuk_html": "וַיְמַהֵ֧ר אַבְרָהָ֛ם הָאֹ֖הֱלָה אֶל־שָׂרָ֑ה וַיֹּ֗אמֶר מַהֲרִ֞י שְׁלֹ֤שׁ סְאִים֙ <mark>קֶ֣מַח סֹ֔לֶת</mark> ל֖וּשִׁי וַעֲשִׂ֥י עֻגֽוֹת׃", "pasuk_en": "וַיְמַהֵר אַבְרָהָם הָאֹהֱלָה אֶל־שָׂרָה וַיֹּאמֶר מַהֲרִי שְׁלֹשׁ סְאִים קֶמַח סֹלֶת לוּשִׁי וַעֲשִׂי עֻגוֹת׃", "rashi_he": "קמח סלת. סֹלֶת לְעֻגוֹת, קֶמַח לַעֲמִילָן שֶׁל טַבָּחִים, לְכַסּוֹת אֶת הַקְּדֵרָה לִשְׁאֹב אֶת הַזֻּהֲמָא:", "rashi_en": "הסלת נועדה לעוגות, והקמח שימש לכסות את הקדרה כדי לספוג את הזוהמה, כדרך הטבחים.", "note": "", "points": [{"q": "מַדּוּעַ הִזְכִּיר אַבְרָהָם גַּם \"קֶמַח\" וְגַם \"סֹלֶת\"?", "options": ["הַסֹּלֶת לְעֻוגּוֹת, וְהַקֶּמַח לְכִיסּוּי הַקְּדֵרָה וּסְפִיגַת הַזֻּוהֲמָה", "כְּדֵי לְהָכִין שְׁנֵי סוּגֵי לֶחֶם לָאוֹרְחִים", "כִּי לֹא הָיָה לוֹ דֵּי סֹלֶת לִשְׁלֹושׁ סְאִים"], "kasha": "\"קמח\" ו\"סלת\" הם שני סוגים, ולא ברור מדוע נזכרו שניהם יחד.", "answer": "הסלת היתה לעוגות, והקמח לעמילן של הטבחים, לכסות בו את הקדרה כדי לשאוב את הזוהמה.", "kp": ["סלת לעגות", "קמח לעמילן של טבחים", "לשאב את הזהמא"]}]}, {"id": "18:7.1", "ch": 18, "v": 7, "n": 1, "dh": "בן בקר רך וטוב", "pasuk_html": "וְאֶל־הַבָּקָ֖ר רָ֣ץ אַבְרָהָ֑ם וַיִּקַּ֨ח <mark>בֶּן־בָּקָ֜ר רַ֤ךְ וָטוֹב֙</mark> וַיִּתֵּ֣ן אֶל־הַנַּ֔עַר וַיְמַהֵ֖ר לַעֲשׂ֥וֹת אֹתֽוֹ׃", "pasuk_en": "וְאֶל־הַבָּקָר רָץ אַבְרָהָם וַיִּקַּח בֶּן־בָּקָר רַךְ וָטוֹב וַיִּתֵּן אֶל־הַנַּעַר וַיְמַהֵר לַעֲשׂוֹת אֹתוֹ׃", "rashi_he": "בן בקר רך וטוב. ג' פָּרִים הָיוּ, כְדֵי לְהַאֲכִילָן ג' לְשׁוֹנוֹת בְּחַרְדָּל (בבא מציעא פ\"ז):", "rashi_en": "אברהם לקח שלושה פרים, כדי להאכיל את האורחים שלוש לשונות בחרדל.", "note": "", "points": [{"q": "כַּמָּה בְּנֵי בָקָר לָקַח אַבְרָהָם, וּלְשֵׁם מָה?", "options": ["שְׁלֹושָׁה, כְּדֵי לְהַגִּישׁ לָהֶם שָׁלֹושׁ לְשׁוֹנוֹת בְּחַרְדָּל", "אֶחָד, כִּי דַּי הָיָה בוֹ לְכָל הָאוֹרְחִים", "שְׁלֹושָׁה, כְּדֵי לְהַקְרִיב אֶחָד מֵהֶם לַה'"], "kasha": "התיאור \"רך וטוב\" מפורט ויתר, ומרמז שהיה כאן יותר מבהמה אחת.", "answer": "שלושה פרים היו, כדי להאכיל את האורחים שלוש לשונות בחרדל.", "kp": ["ג' פרים היו", "ג' לשונות בחרדל"]}]}, {"id": "18:7.2", "ch": 18, "v": 7, "n": 2, "dh": "אל הנער", "pasuk_html": "וְאֶל־הַבָּקָ֖ר רָ֣ץ אַבְרָהָ֑ם וַיִּקַּ֨ח בֶּן־בָּקָ֜ר רַ֤ךְ וָטוֹב֙ וַיִּתֵּ֣ן <mark>אֶל־הַנַּ֔עַר</mark> וַיְמַהֵ֖ר לַעֲשׂ֥וֹת אֹתֽוֹ׃", "pasuk_en": "וְאֶל־הַבָּקָר רָץ אַבְרָהָם וַיִּקַּח בֶּן־בָּקָר רַךְ וָטוֹב וַיִּתֵּן אֶל־הַנַּעַר וַיְמַהֵר לַעֲשׂוֹת אֹתוֹ׃", "rashi_he": "אל הנער. זֶה יִשְׁמָעֵאל, לְחַנְּכוֹ בְּמִצְוֹת (בראשית רבה):", "rashi_en": "הנער שאברהם נתן לו את הבקר הוא ישמעאל, ואברהם עשה זאת כדי לחנך אותו במצוות.", "note": "", "points": [{"q": "מִי הוּא \"הַנַּעַר\", וּמַדּוּעַ מָסַר לוֹ אַבְרָהָם אֶת הַבָּקָר?", "options": ["יִשְׁמָעֵאל, כְּדֵי לְחַנְּכוֹ בְּמִצְווֹת", "אֱלִיעֶזֶר עַבְדּוֹ, כְּדֵי שֶׁיִּזְדָּרֵז בַּמְּלָאכָה", "אַחַד הַמְּשָׁרְתִים, כִּי אַבְרָהָם הָיָה חַלָּשׁ"], "kasha": "התורה מזכירה \"הנער\" בלי לפרש מי הוא, ומדוע אברהם לא הכין את הבשר בעצמו.", "answer": "הנער הוא ישמעאל, ואברהם מסר לו את הבקר כדי לחנכו במצוות.", "kp": ["זה ישמעאל", "לחנכו במצות"]}]}, {"id": "18:8.1", "ch": 18, "v": 8, "n": 1, "dh": "ויקח חמאה וגו'", "pasuk_html": "<mark>וַיִּקַּ֨ח חֶמְאָ֜ה</mark> וְחָלָ֗ב וּבֶן־הַבָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַיִּתֵּ֖ן לִפְנֵיהֶ֑ם וְהֽוּא־עֹמֵ֧ד עֲלֵיהֶ֛ם תַּ֥חַת הָעֵ֖ץ וַיֹּאכֵֽלוּ׃", "pasuk_en": "וַיִּקַּח חֶמְאָה וְחָלָב וּבֶן־הַבָּקָר אֲשֶׁר עָשָׂה וַיִּתֵּן לִפְנֵיהֶם וְהוּא־עֹמֵד עֲלֵיהֶם תַּחַת הָעֵץ וַיֹּאכֵלוּ׃", "rashi_he": "ויקח חמאה וגו'. וְלֶחֶם לֹא הֵבִיא, לְפִי שֶׁפֵּרְסָה שָׂרָה נִדָּה, שֶׁחָזַר לָהּ אֹרַח כַּנָּשִׁים אוֹתוֹ הַיּוֹם, וְנִטְמֵאת הָעִסָּה (בבא מציעא שם):", "rashi_en": "אברהם לא הגיש לאורחים לחם, כי באותו יום חזר לשרה אורח כנשים, ונטמאה העיסה.", "note": "", "points": [{"q": "מַדּוּעַ לֹא נִזְכַּר לֶחֶם בֵּין הַמַּאֲכָלִים שֶׁהִגִּישׁ אַבְרָהָם, אַף שֶׁהִבְטִיחַ פַּת לֶחֶם?", "options": ["שָׂרָה פֵּרְסָה נִדָּה בְּאוֹתוֹ יוֹם וְנִטְמְאָה הָעִיסָה", "הָאוֹרְחִים מִיהֲרוּ וְלֹא הָיָה זְמַן לֶאֱפוֹת", "הַמַּלְאָכִים אֵינָם אוֹכְלִים לֶחֶם כְּלָל"], "kasha": "אברהם אמר שיביא פת לחם וציווה לאפות עוגות, ואילו בפסוק זה לא נזכר לחם.", "answer": "לחם לא הביא, לפי שפרסה שרה נדה, שחזר לה אורח כנשים באותו יום, ונטמאה העיסה.", "kp": ["ולחם לא הביא", "לפי שפרסה שרה נדה", "ונטמאת העסה"]}]}, {"id": "18:8.2", "ch": 18, "v": 8, "n": 2, "dh": "חמאה", "pasuk_html": "וַיִּקַּ֨ח <mark>חֶמְאָ֜ה</mark> וְחָלָ֗ב וּבֶן־הַבָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַיִּתֵּ֖ן לִפְנֵיהֶ֑ם וְהֽוּא־עֹמֵ֧ד עֲלֵיהֶ֛ם תַּ֥חַת הָעֵ֖ץ וַיֹּאכֵֽלוּ׃", "pasuk_en": "וַיִּקַּח חֶמְאָה וְחָלָב וּבֶן־הַבָּקָר אֲשֶׁר עָשָׂה וַיִּתֵּן לִפְנֵיהֶם וְהוּא־עֹמֵד עֲלֵיהֶם תַּחַת הָעֵץ וַיֹּאכֵלוּ׃", "rashi_he": "חמאה. שֻׁמַּן הֶחָלָב שֶׁקּוֹלְטִין מֵעַל פָּנָיו:", "rashi_en": "חמאה היא שומן החלב שאוספים מעל פני החלב.", "note": "", "points": [{"q": "מַהִי \"חֶמְאָה\" לְפִי רַשִׁ\"י?", "options": ["שׁוּמָן הֶחָלָב שֶׁאוֹסְפִים מֵעַל פְּנֵי הֶחָלָב", "חָלָב שֶׁהֶחֱמִיץ וְנַעֲשָׂה גְּבִינָה רַכָּה", "שֶׁמֶן זַיִת שֶׁמַּגִּישִׁים יַחַד עִם הַלֶּחֶם"], "kasha": "המילה \"חמאה\" צריכה ביאור, כדי לדעת מהו המאכל שהגיש אברהם.", "answer": "חמאה היא שמן החלב שקולטים מעל פניו.", "kp": ["שמן החלב שקולטין מעל פניו"]}]}, {"id": "18:8.3", "ch": 18, "v": 8, "n": 3, "dh": "ובן הבקר אשר עשה", "pasuk_html": "וַיִּקַּ֨ח חֶמְאָ֜ה וְחָלָ֗ב <mark>וּבֶן־הַבָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה</mark> וַיִּתֵּ֖ן לִפְנֵיהֶ֑ם וְהֽוּא־עֹמֵ֧ד עֲלֵיהֶ֛ם תַּ֥חַת הָעֵ֖ץ וַיֹּאכֵֽלוּ׃", "pasuk_en": "וַיִּקַּח חֶמְאָה וְחָלָב וּבֶן־הַבָּקָר אֲשֶׁר עָשָׂה וַיִּתֵּן לִפְנֵיהֶם וְהוּא־עֹמֵד עֲלֵיהֶם תַּחַת הָעֵץ וַיֹּאכֵלוּ׃", "rashi_he": "ובן הבקר אשר עשה. אֲשֶׁר תִּקֵּן; קַמָּא קַמָּא שֶׁתִּקֵן אַמְטִי וְאַיְיתִי קָמַיְהוּ:", "rashi_en": "\"אשר עשה\" פירושו אשר הכין, וכל מנה שהוכנה הביא אברהם מיד לפני האורחים.", "note": "", "points": [{"q": "מַה מְלַמֵּד רַשִׁ\"י מֵהַמִּילִּים \"אֲשֶׁר עָשָׂה\"?", "options": ["כָּל מָנָה שֶׁהוּכְנָה, הֵבִיא מִיָּד לִפְנֵי הָאוֹרְחִים", "שֶׁאַבְרָהָם עַצְמוֹ בִּישֵּׁל אֶת כָּל הַבָּשָׂר", "שֶׁהַבָּשָׂר הוּכַן עוֹד לִפְנֵי בּוֹא הָאוֹרְחִים"], "kasha": "לשון \"עשה\" אינה מתאימה לכאורה לבשר, ויש לבאר מה פירושה כאן.", "answer": "\"אשר עשה\" פירושו אשר תיקן והכין, וכל מנה ומנה שהוכנה הביא מיד לפניהם.", "kp": ["אשר תקן", "קמא קמא שתקן אמטי ואייתי קמיהו"]}]}, {"id": "18:8.4", "ch": 18, "v": 8, "n": 4, "dh": "ויאכלו", "pasuk_html": "וַיִּקַּ֨ח חֶמְאָ֜ה וְחָלָ֗ב וּבֶן־הַבָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַיִּתֵּ֖ן לִפְנֵיהֶ֑ם וְהֽוּא־עֹמֵ֧ד עֲלֵיהֶ֛ם תַּ֥חַת הָעֵ֖ץ <mark>וַיֹּאכֵֽלוּ׃</mark>", "pasuk_en": "וַיִּקַּח חֶמְאָה וְחָלָב וּבֶן־הַבָּקָר אֲשֶׁר עָשָׂה וַיִּתֵּן לִפְנֵיהֶם וְהוּא־עֹמֵד עֲלֵיהֶם תַּחַת הָעֵץ וַיֹּאכֵלוּ׃", "rashi_he": "ויאכלו. נִרְאוּ כְמִי שֶׁאָכְלוּ, מִכָּאן שֶׁלֹּא יְשַׁנֶּה אָדָם מִן הַמִּנְהָג (בבא מציעא שם):", "rashi_en": "המלאכים לא אכלו באמת אלא נראו כאוכלים, ומכאן שאדם לא ישנה מן המנהג של המקום שהוא נמצא בו.", "note": "", "points": [{"q": "כֵּיצַד ייִתָּכֵן שֶׁנֶּאֱמַר עַל הַמַּלְאָכִים \"וַיֹּאכֵלוּ\"?", "options": ["הֵם רַק נִרְאוּ כְּאוֹכְלִים, כְּדֵי לֹא לְשַׁנּוֹת מֵהַמִּנְהָג", "הֵם אָכְלוּ בֶּאֱמֶת כְּשֶׁהִתְלַבְּשׁוּ בִּדְמוּת אֲנָשִׁים", "הֵם אָכְלוּ רַק מֵהַחֶמְאָה וְהֶחָלָב וְלֹא מֵהַבָּשָׂר"], "kasha": "מלאכים אינם אוכלים, והפסוק אומר שאכלו.", "answer": "הם נראו כמי שאכלו, ומכאן שלא ישנה אדם מן המנהג.", "kp": ["נראו כמי שאכלו", "שלא ישנה אדם מן המנהג"]}]}, {"id": "18:9.1", "ch": 18, "v": 9, "n": 1, "dh": "ויאמרו אליו", "pasuk_html": "<mark>וַיֹּאמְר֣וּ אֵׄלָׄ֔יׄוׄ</mark> אַיֵּ֖ה שָׂרָ֣ה אִשְׁתֶּ֑ךָ וַיֹּ֖אמֶר הִנֵּ֥ה בָאֹֽהֶל׃", "pasuk_en": "וַיֹּאמְרוּ אֵלָיו אַיֵּה שָׂרָה אִשְׁתֶּךָ וַיֹּאמֶר הִנֵּה בָאֹהֶל׃", "rashi_he": "ויאמרו אליו. נָקוּד עַל אי\"ו שֶׁבְּאֵלָיו, וְתַנְיָא רַ\"שִׁ בֶּן אֶלְעָזָר אוֹמֵר כָּל מָקוֹם שֶׁכְּתָב רַבֶּה עַל הַנְּקֻדָּה, אַתָּה דוֹרֵשׁ הַכְּתָב; וְכָאן הַנְּקֻדָּה רַבָּה עַל הַכְּתָב אַתָּה דּוֹרֵשׁ הַנְּקֻדָּה, שֶׁאַף לְשָׂרָה שָׁאֲלוּ אַיּוֹ אַבְרָהָם, לָמַדְנוּ שֶׁיִּשְׁאַל אָדָם בְּאַכְסַנְיָא שֶׁלּוֹ לָאִישׁ עַל הָאִשָּׁה וְלָאִשָּׁה עַל הָאִישׁ. בְּבָבָא מְצִיעָא אוֹמְרִים יוֹדְעִים הָיוּ מַלְאֲכֵי הַשָּׁרֵת שָׂרָה אִמֵּנוּ הֵיכָן הָיְתָה, אֶלָּא לְהוֹדִיעַ שֶׁצְּנוּעָה הָיְתָה, כְּדֵי לְחַבְּבָהּ עַל בַּעֲלָה. אָמַר רַבִּי יוֹסֵי בַּר חֲנִינָא, כְּדֵי לְשַׁגֵּר לָהּ כּוֹס שֶׁל בְּרָכָה:", "rashi_en": "על האותיות אי\"ו שבמילה \"אליו\" יש נקודות, וכיון שהמנוקד רב על הכתב דורשים את המנוקד: שאלו גם את שרה איו אברהם. מכאן שאדם שואל במקום שהוא מתארח בו את האיש על אשתו ואת האשה על בעלה. לפי הגמרא שאלו המלאכים כדי לפרסם את צניעותה של שרה ולחבבה על בעלה.", "note": "", "points": [{"q": "מַה דּוֹרֵשׁ רַשִׁ\"י מֵהַנְּקֻודּוֹת שֶׁעַל הָאוֹתִיּוֹת אי\"ו בַּמִּילָּה \"אֵלָיו\"?", "options": ["שֶׁהַמַּלְאָכִים שָׁאֲלוּ גַּם אֶת שָׂרָה הֵיכָן אַבְרָהָם", "שֶׁהַמַּלְאָכִים דִּיבְּרוּ עִם אַבְרָהָם בְּלַחַשׁ", "שֶׁאַבְרָהָם לֹא שָׁמַע אֶת שְׁאֵלָתָם בַּתְּחִילָּה"], "kasha": "על האותיות אי\"ו שבמילה \"אליו\" יש נקודות, ויש לבאר מה הן באות ללמד.", "answer": "כשהמנוקד רב על הכתב דורשים את המנוקד, כלומר שאף את שרה שאלו איו אברהם; ומכאן שישאל אדם באכסניה שלו את האיש על האשה ואת האשה על האיש.", "kp": ["אתה דורש הנקדה", "שאף לשרה שאלו איו אברהם"]}, {"q": "לְפִי הַגְּמָרָא, מַדּוּעַ שָׁאֲלוּ הַמַּלְאָכִים הֵיכָן שָׂרָה, וַהֲרֵי יָדְעוּ זֹאת?", "options": ["כְּדֵי לְהוֹדִיעַ שֶׁצְנוּעָה הָיְתָה וּלְחַבְּבָהּ עַל בַּעְלָהּ", "כְּדֵי לִבְדֹּוק אִם אַבְרָהָם יוֹדֵעַ הֵיכָן אִשְׁתּוֹ", "כִּי רָצוּ לְבַשֵּׂר לָהּ בְּעַצְמָם פָּנִים אֶל פָּנִים"], "kasha": "מלאכי השרת ידעו היכן שרה, ולכאורה אין טעם בשאלתם.", "answer": "הם שאלו כדי להודיע שצנועה היתה, כדי לחבבה על בעלה. ורבי יוסי בר חנינא אמר: כדי לשלוח לה כוס של ברכה.", "kp": ["להודיע שצנועה היתה", "כדי לחבבה על בעלה"]}]}, {"id": "18:9.2", "ch": 18, "v": 9, "n": 2, "dh": "הנה באהל", "pasuk_html": "וַיֹּאמְר֣וּ אֵׄלָׄ֔יׄוׄ אַיֵּ֖ה שָׂרָ֣ה אִשְׁתֶּ֑ךָ וַיֹּ֖אמֶר <mark>הִנֵּ֥ה בָאֹֽהֶל׃</mark>", "pasuk_en": "וַיֹּאמְרוּ אֵלָיו אַיֵּה שָׂרָה אִשְׁתֶּךָ וַיֹּאמֶר הִנֵּה בָאֹהֶל׃", "rashi_he": "הנה באהל. צְנוּעָה הִיא:", "rashi_en": "בתשובתו \"הנה באהל\" אמר אברהם ששרה צנועה ונמצאת בתוך האהל.", "note": "", "points": [{"q": "מַה בִּיקֵּשׁ אַבְרָהָם לוֹמַר בִּתְשׁוּבָתוֹ \"הִנֵּה בָאֹהֶל\"?", "options": ["שֶׁשָּׂרָה צְנוּעָה וְנִמְצֵאת בְּתוֹךְ הָאֹהֶל", "שֶׁשָּׂרָה עֲסוּקָה בַּהֲכָנַת הָעוּגוֹת לָאוֹרְחִים", "שֶׁשָּׂרָה אֵינָהּ רוֹצָה לִפְגֹּושׁ אֶת הָאוֹרְחִים"], "kasha": "התשובה \"הנה באהל\" נראית מובנת מאליה, ויש לבאר מה היא באה ללמד.", "answer": "\"הנה באהל\" פירושו: צנועה היא.", "kp": ["צנועה היא"]}]}, {"id": "18:10.1", "ch": 18, "v": 10, "n": 1, "dh": "שוב אשוב", "pasuk_html": "וַיֹּ֗אמֶר <mark>שׁ֣וֹב אָשׁ֤וּב</mark> אֵלֶ֙יךָ֙ כָּעֵ֣ת חַיָּ֔ה וְהִנֵּה־בֵ֖ן לְשָׂרָ֣ה אִשְׁתֶּ֑ךָ וְשָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָאֹ֖הֶל וְה֥וּא אַחֲרָֽיו׃", "pasuk_en": "וַיֹּאמֶר שׁוֹב אָשׁוּב אֵלֶיךָ כָּעֵת חַיָּה וְהִנֵּה־בֵן לְשָׂרָה אִשְׁתֶּךָ וְשָׂרָה שֹׁמַעַת פֶּתַח הָאֹהֶל וְהוּא אַחֲרָיו׃", "rashi_he": "שוב אשוב. לֹא בִשְּׂרוֹ הַמַּלְאָךְ שֶׁיָּשׁוּב אֵלָיו, אֶלָּא בִשְׁלִיחוּתוֹ שֶׁל מָקוֹם אָמַר לוֹ, כְּמוֹ וַיֹּאמֶר לָהּ מַלְאַךְ ה' הַרְבָּה אַרְבֶּה, וְהוּא אֵין בְּיָדוֹ לְהַרְבּוֹת, אֶלָּא בִּשְׁלִיחוּתוֹ שֶׁל מָקוֹם, אַף כָּאן בִּשְׁלִיחוּתוֹ שֶׁל מָקוֹם אָמַר לוֹ כֵּן (בְּ\"רַ). אֱלִישָׁע אָמַר לַשּׁוּנַמִּית לַמּוֹעֵד הַזֶּה כָּעֵת חַיָּה אַתְּ חֹבֶקֶת בֵּן וַתֹּאמֶר אַל אֲדֹנִי אִישׁ הָאֱלֹהִים אַל תְּכַזֵּב בְּשִׁפְחָתֶךָ, אוֹתָן הַמַּלְאָכִים שֶׁבִּשְּׂרוּ  וְהִנֵּה־בֵן לְשָׂרָה אִשְׁתֶּךָ וְשָׂרָה שֹׁמַעַת פֶּתַח הָאֹהֶל וְהוּא אַחֲרָיו׃", "rashi_he": "כעת חיה. כָּעֵת הַזֹּאת לַשָּׁנָה הַבָּאָה, וּפֶסַח הָיָה, וּלְפֶסַח הַבָּא נוֹלַד יִצְחָק, מִדְּלָא קָרֵינַן כְּעֵת אֶלָּא כָּעֵת:", "rashi_en": "\"כעת חיה\" פירושו בזמן הזה בשנה הבאה. הבשורה היתה בפסח, ובפסח שלאחריו נולד יצחק, כפי שנלמד מאופן קריאת המילה \"כעת\".", "note": "", "points": [{"q": "לְאֵיזֶה זְמַן מְכֻווֶּנֶת הַבְּשׂוֹרָה \"כָּעֵת חַיָּה\"?", "options": ["לַזְּמַן הַזֶּה בַּשָּׁנָה הַבָּאָה, בַּפֶּסַח הַבָּא", "לְעוֹד תִּשְׁעָה חֳודָשִׁים מִיּוֹם הַבְּשׂוֹרָה", "לִזְמַן קָרוֹב שֶׁאֵינוֹ יָדוּעַ מֵרֹאשׁ"], "kasha": "לא ברור מתי בדיוק הוא \"כעת חיה\", והאם הכוונה לזמן מסוים.", "answer": "כעת הזאת לשנה הבאה: הבשורה היתה בפסח, ולפסח הבא נולד יצחק, כפי שנלמד מכך שהמילה נקראת \"כעת\" במשמעות העת הזאת הידועה.", "kp": ["כעת הזאת לשנה הבאה", "ולפסח הבא נולד יצחק"]}]}, {"id": "18:10.3", "ch": 18, "v": 10, "n": 3, "dh": "כעת חיה", "pasuk_html": "וַיֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֙יךָ֙ <mark>כָּעֵ֣ת חַיָּ֔ה</mark> וְהִנֵּה־בֵ֖ן לְשָׂרָ֣ה אִשְׁתֶּ֑ךָ וְשָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָאֹ֖הֶל וְה֥וּא אַחֲרָֽיו׃", "pasuk_en": "וַיֹּאמֶר שׁוֹב אָשׁוּב אֵלֶיךָ כָּעֵת חַיָּה וְהִנֵּה־בֵן לְשָׂרָה אִשְׁתֶּךָ וְשָׂרָה שֹׁמַעַת פֶּתַח הָאֹהֶל וְהוּא אַחֲרָיו׃", "rashi_he": "כעת חיה. כָּעֵת הַזֹּאת שֶׁתְּהֵא חַיָּה לָכֶם, שֶׁתִּהְיוּ כֻּלְּכֶם שְׁלֵמִים וְקַיָּמִים:", "rashi_en": "לפי פירוש זה, \"כעת חיה\" פירושו: בזמן הזה, כשתהיו כולכם חיים, שלמים וקיימים.", "note": "", "points": [{"q": "לְפִי פֵּירוּשׁ זֶה, מַה מַּשְׁמָעוּת הַמִּילָּה \"חַיָּה\" בְּצֵירוּף \"כָּעֵת חַיָּה\"?", "options": ["עֵת שֶׁבָּהּ תִּהְיוּ כֻּולְּכֶם חַיִּים וּשְׁלֵמִים", "עֵת הַלֵּידָה, שֶׁבָּהּ הַיּוֹלֶדֶת נִקְרֵאת חַיָּה", "עֵת הָאָבִיב, שֶׁבָּהּ הַטֶּבַע מִתְחַדֵּשׁ וָחַי"], "kasha": "המילה \"חיה\" בצירוף \"כעת חיה\" אינה ברורה: מי או מה חי.", "answer": "כעת הזאת שתהא חיה לכם, כלומר שתהיו כולכם שלמים וקיימים.", "kp": ["שתהא חיה לכם", "שתהיו כלכם שלמים וקימים"]}]}, {"id": "18:10.4", "ch": 18, "v": 10, "n": 4, "dh": "והוא אחריו", "pasuk_html": "וַיֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֙יךָ֙ כָּעֵ֣ת חַיָּ֔ה וְהִנֵּה־בֵ֖ן לְשָׂרָ֣ה אִשְׁתֶּ֑ךָ וְשָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָאֹ֖הֶל <mark>וְה֥וּא אַחֲרָֽיו׃</mark>", "pasuk_en": "וַיֹּאמֶר שׁוֹב אָשׁוּב אֵלֶיךָ כָּעֵת חַיָּה וְהִנֵּה־בֵן לְשָׂרָה אִשְׁתֶּךָ וְשָׂרָה שֹׁמַעַת פֶּתַח הָאֹהֶל וְהוּא אַחֲרָיו׃", "rashi_he": "והוא אחריו. הַפֶּתַח הָיָה אַחַר הַמַּלְאָךְ:", "rashi_en": "\"והוא אחריו\" פירושו שפתח האהל היה מאחורי המלאך, ושם עמדה שרה ושמעה.", "note": "", "points": [{"q": "עַל מָה מוּסָב \"וְהוּא אַחֲרָיו\" בַּפָּסוּק?", "options": ["פֶּתַח הָאֹהֶל הָיָה מֵאֲחוֹרֵי הַמַּלְאָךְ", "שָׂרָה עָמְדָה מֵאַחֲורֵי אַבְרָהָם", "אַבְרָהָם עָמַד מֵאַחוֹרֵי הַמַּלְאָךְ"], "kasha": "לא ברור מי הוא \"והוא\" ואחרי מי הוא נמצא.", "answer": "הפתח היה מאחורי המלאך.", "kp": ["הפתח היה אחר המלאך"]}]}, {"id": "18:11.1", "ch": 18, "v": 11, "n": 1, "dh": "חדל להיות", "pasuk_html": "וְאַבְרָהָ֤ם וְשָׂרָה֙ זְקֵנִ֔ים בָּאִ֖ים בַּיָּמִ֑ים <mark>חָדַל֙ לִהְי֣וֹת</mark> לְשָׂרָ֔ה אֹ֖רַח כַּנָּשִֽׁים׃", "pasuk_en": "וְאַבְרָהָם וְשָׂרָה זְקֵנִים בָּאִים בַּיָּמִים חָדַל לִהְיוֹת לְשָׂרָה אֹרַח כַּנָּשִׁים׃", "rashi_he": "חדל להיות. פָּסַק מִמֶּנָה:", "rashi_en": "\"חדל להיות\" פירושו שפסק ממנה אורח כנשים.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"חָדַל לִהְיוֹת\" לְפִי רַשִׁ\"י?", "options": ["פָּסַק וְנֶעֱצַר מִמֶּנָּה", "מֵעוֹלָם לֹא הָיָה לָהּ", "נֶחְלַשׁ אַךְ לֹא פָּסַק לְגַמְרֵי"], "kasha": "לשון \"חדל\" צריכה ביאור: האם הכוונה שלא היה מעולם או שהיה ופסק.", "answer": "\"חדל\" פירושו פסק ממנה.", "kp": ["פסק ממנה"]}]}, {"id": "18:11.2", "ch": 18, "v": 11, "n": 2, "dh": "אורח כנשים", "pasuk_html": "וְאַבְרָהָ֤ם וְשָׂרָה֙ זְקֵנִ֔ים בָּאִ֖ים בַּיָּמִ֑ים חָדַל֙ לִהְי֣וֹת לְשָׂרָ֔ה <mark>אֹ֖רַח כַּנָּשִֽׁים׃</mark>", "pasuk_en": "וְאַבְרָהָם וְשָׂרָה זְקֵנִים בָּאִים בַּיָּמִים חָדַל לִהְיוֹת לְשָׂרָה אֹרַח כַּנָּשִׁים׃", "rashi_he": "אורח כנשים. אֹרַח נִדּוֹת:", "rashi_en": "\"ארח כנשים\" פירושו הווסת, דרכן הקבועה של הנשים. שרה כבר לא קיבלה וסת, ולכן לפי הטבע לא הייתה יכולה ללדת.", "note": "", "points": [{"q": "לָמָּה מִתְכַּווֵּן הַפָּסוּק בַּמִּילִּים \"אֹרַח כַּנָּשִׁים\"?", "options": ["לְווֶסֶת הַחוֹדְשִׁית שֶׁל הָאִישָּׁה", "לַדֶּרֶךְ שֶׁבָּהּ נָשִׁים מְכַבְּדוֹת אוֹרְחִים", "לְכֹוחַ שֶׁל אִישָּׁה לַעֲבוֹד בַּבַּיִת"], "kasha": "המילה \"ארח\" פירושה דרך, ולא ברור לאיזו דרך של נשים הכוונה.", "answer": "הכוונה לווסת, \"ארח נדות\", ושרה כבר הפסיקה לקבל אותו.", "kp": ["ארח נדות"]}]}, {"id": "18:12.1", "ch": 18, "v": 12, "n": 1, "dh": "בקרבה", "pasuk_html": "וַתִּצְחַ֥ק שָׂרָ֖ה <mark>בְּקִרְבָּ֣הּ</mark> לֵאמֹ֑ר אַחֲרֵ֤י בְלֹתִי֙ הָֽיְתָה־לִּ֣י עֶדְנָ֔ה וַֽאדֹנִ֖י זָקֵֽן׃", "pasuk_en": "וַתִּצְחַק שָׂרָה בְּקִרְבָּהּ לֵאמֹר אַחֲרֵי בְלֹתִי הָיְתָה־לִּי עֶדְנָה וַאדֹנִי זָקֵן׃", "rashi_he": "בקרבה. מִסְתַּכֶּלֶת בְּמֵעֶיהָ וְאָמְרָה אֶפְשַׁר הַקְּרָבַיִם הַלָּלוּ טְעוּנִין וָלָד? הַשָּׁדַיִם הַלָּלוּ שֶׁצָּמְקוּ מוֹשְׁכִין חָלָב? תַּנְחוּמָא:", "rashi_en": "שרה צחקה \"בקרבה\", כלומר הסתכלה על גופה ותמהה: האם בטן זקנה כזו יכולה לשאת ולד, והאם שדיים שהצטמקו יכולים להניק?", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"בְּקִרְבָּהּ\" לְפִי רַשִׁ\"י?", "options": ["הִסְתַּכְּלָה בְּבִטְנָהּ וְתָמְהָה אִם תּוּכַל לָשֵׂאת וָלָד", "צָחֲקָה בְּשֶׁקֶט כְּדֵי שֶׁהַמַּלְאָכִים לֹא יִשְׁמְעוּ", "צָחֲקָה בְּתוֹךְ הָאֹוהֶל כְּשֶׁהִיא קְרוֹבָה לַפֶּתַח"], "kasha": "היה אפשר לכתוב רק \"ותצחק שרה\", ולמה נוספה המילה \"בקרבה\"?", "answer": "שרה הסתכלה במעיה ואמרה: האם הקרבים האלה יכולים לשאת ולד, והשדיים שהצטמקו יכולים להניק?", "kp": ["מסתכלת במעיה", "הקרבים הללו טעונין ולד", "השדים הללו שצמקו"]}]}, {"id": "18:12.2", "ch": 18, "v": 12, "n": 2, "dh": "עדנה", "pasuk_html": "וַתִּצְחַ֥ק שָׂרָ֖ה בְּקִרְבָּ֣הּ לֵאמֹ֑ר אַחֲרֵ֤י בְלֹתִי֙ הָֽיְתָה־לִּ֣י <mark>עֶדְנָ֔ה</mark> וַֽאדֹנִ֖י זָקֵֽן׃", "pasuk_en": "וַתִּצְחַק שָׂרָה בְּקִרְבָּהּ לֵאמֹר אַחֲרֵי בְלֹתִי הָיְתָה־לִּי עֶדְנָה וַאדֹנִי זָקֵן׃", "rashi_he": "עדנה. צִחְצוּחַ בָּשָׂר, וּלְשׁוֹן מִשְׁנָה מַשִּׁיר אֶת הַשֵּׂעָר וּמְעַדֵּן אֶת הַבָּשָׂר. דָבָר אַחֵר לְשׁוֹן עִדָּן; זְמַן וֶסֶת נִדּוּת:", "rashi_en": "רש\"י מביא שני פירושים למילה \"עדנה\": עור חלק ורענן כמו של צעירה, או זמן קבוע, כלומר זמן הווסת.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן, מַה פֵּירוּשׁ \"עֶדְנָה\"?", "options": ["עוֹר חָלָק וְרַעֲנָן שֶׁל גּוּף צָעִיר", "שִׂמְחָה וְתַעֲנוּג מִבְּשׂוֹרַת הַמַּלְאָכִים", "כֹּוחַ לַעֲבוֹד וּלְטַפֵּל בַּיֶּלֶד"], "kasha": "המילה \"עדנה\" אינה מילה רגילה, וצריך להבין מה שרה התכוונה לומר.", "answer": "\"עדנה\" היא צחצוח בשר, כמו בלשון המשנה: \"משיר את השער ומעדן את הבשר\".", "kp": ["צחצוח בשר", "משיר את השער ומעדן את הבשר"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי, מֵאֵיזוֹ מִילָּה בָּא \"עֶדְנָה\" וּמַה פֵּירוּשׁוֹ?", "options": ["מֵהַמִּילָּה עִידָן, זְמַן, כְּלוֹמַר זְמַן הַוֶּוסֶת", "מֵהַמִּילָּה עֵדֶן, גַּן הָעֵדֶן", "מֵהַמִּילָּה עֵדָה, קְבוּצַת נָשִׁים"], "kasha": "צריך להסביר את המילה \"עדנה\" באופן שמתאים לעניין הלידה.", "answer": "\"עדנה\" מלשון עידן, זמן, והכוונה לזמן הווסת הקבוע.", "kp": ["לשון עדן", "זמן וסת נדות"]}]}, {"id": "18:13.1", "ch": 18, "v": 13, "n": 1, "dh": "האף אמנם", "pasuk_html": "וַיֹּ֥אמֶר יְהוָ֖ה אֶל־אַבְרָהָ֑ם לָ֣מָּה זֶּה֩ צָחֲקָ֨ה שָׂרָ֜ה לֵאמֹ֗ר <mark>הַאַ֥ף אֻמְנָ֛ם</mark> אֵלֵ֖ד וַאֲנִ֥י זָקַֽנְתִּי׃", "pasuk_en": "וַיֹּאמֶר יְהוָה אֶל־אַבְרָהָם לָמָּה זֶּה צָחֲקָה שָׂרָה לֵאמֹר הַאַף אֻמְנָם אֵלֵד וַאֲנִי זָקַנְתִּי׃", "rashi_he": "האף אמנם. הֲגַם אֱמֶת אֵלֵד?", "rashi_en": "\"האף אמנם\" פירושו: האם באמת אלד? זו שאלה של פליאה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילִּים \"הַאַף אֻמְנָם\" בַּפָּסוּק?", "options": ["הַאִם בֶּאֱמֶת אֵלֵד?", "בְּווַדַּאי אֵלֵד, אֵין סָפֵק בַּדָּבָר", "גַּם אִם אֵלֵד, הַיֶּלֶד לֹא יִחְיֶה"], "kasha": "צירוף המילים \"האף אמנם\" אינו ברור, ויש לבאר את משמעותו.", "answer": "פירושו \"הגם אמת אלד?\", כלומר האם ייתכן שבאמת אלד.", "kp": ["הגם אמת אלד"]}]}, {"id": "18:13.2", "ch": 18, "v": 13, "n": 2, "dh": "ואני זקנתי", "pasuk_html": "וַיֹּ֥אמֶר יְהוָ֖ה אֶל־אַבְרָהָ֑ם לָ֣מָּה זֶּה֩ צָחֲקָ֨ה שָׂרָ֜ה לֵאמֹ֗ר הַאַ֥ף אֻמְנָ֛ם אֵלֵ֖ד <mark>וַאֲנִ֥י זָקַֽנְתִּי׃</mark>", "pasuk_en": "וַיֹּאמֶר יְהוָה אֶל־אַבְרָהָם לָמָּה זֶּה צָחֲקָה שָׂרָה לֵאמֹר הַאַף אֻמְנָם אֵלֵד וַאֲנִי זָקַנְתִּי׃", "rashi_he": "ואני זקנתי שִׁנָּה הַכָּתוּב מִפְּנֵי הַשָּׁלוֹם, שֶׁהֲרֵי הִיא אָמְרָה וַאדֹנִי זָקֵן:", "rashi_en": "שרה אמרה \"ואדני זקן\", אבל ה' סיפר לאברהם שאמרה \"ואני זקנתי\". הכתוב שינה את דבריה כדי לשמור על השלום בין אברהם לשרה.", "note": "", "points": [{"q": "לָמָּה ה' אָמַר לְאַבְרָהָם שֶׁשָּׂרָה אָמְרָה \"וַאֲנִי זָקַנְתִּי\"?", "options": ["כְּדֵי לִשְׁמוֹר עַל הַשָּׁלוֹם בֵּין אַבְרָהָם וְשָׂרָה", "כִּי שָׂרָה בֶּאֱמֶת אָמְרָה כָּךְ עַל עַצְמָהּ", "כְּדֵי לְהַסְתִּיר מֵאַבְרָהָם שֶׁהִיא צָחֲקָה"], "kasha": "שרה אמרה \"ואדני זקן\", ולמה ה' מצטט אותה כאילו אמרה \"ואני זקנתי\"?", "answer": "הכתוב שינה את דבריה מפני השלום, שהרי היא אמרה \"ואדני זקן\".", "kp": ["שנה הכתוב מפני השלום", "היא אמרה ואדני זקן"]}]}, {"id": "18:14.1", "ch": 18, "v": 14, "n": 1, "dh": "היפלא", "pasuk_html": "<mark>הֲיִפָּלֵ֥א</mark> מֵיְהוָ֖ה דָּבָ֑ר לַמּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛יךָ כָּעֵ֥ת חַיָּ֖ה וּלְשָׂרָ֥ה בֵֽן׃", "pasuk_en": "הֲיִפָּלֵא מֵיְהוָה דָּבָר לַמּוֹעֵד אָשׁוּב אֵלֶיךָ כָּעֵת חַיָּה וּלְשָׂרָה בֵן׃", "rashi_he": "היפלא. כְּתַרְגּוּמוֹ הֲיִתְכַּסִּי? וְכִי שׁוּם דָּבָר מֻפְלָא וּמֻפְרָד וּמְכֻסֶּה מִמֶּנִּי מִלַּעֲשׂוֹת כִּרְצוֹנִי:", "rashi_en": "\"היפלא\" פירושו כתרגום אונקלוס: האם יש דבר נסתר ממני? כלומר, אין שום דבר רחוק ממני שימנע ממני לעשות את רצוני.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"הֲיִפָּלֵא\" לְפִי רַשִׁ\"י?", "options": ["הַאִם יֵשׁ דָּבָר נִסְתָּר וּמֻופְרָד מִמֶּנִּי?", "הַאִם יֵשׁ דָּבָר מֻופְלָא וְנִפְלָא בְּעֵינֶיךָ?", "הַאִם יֵשׁ דָּבָר שֶׁאֵינוֹ צוֹדֵק בְּעֵינַי?"], "kasha": "המילה \"היפלא\" יכולה להתפרש כמה דרכים, וצריך לדעת מה פירושה כאן.", "answer": "כתרגומו \"היתכסי\": וכי יש דבר מופלא, מופרד ומכוסה ממני מלעשות כרצוני?", "kp": ["היתכסי", "מפלא ומפרד ומכסה ממני"]}]}, {"id": "18:14.2", "ch": 18, "v": 14, "n": 2, "dh": "למועד", "pasuk_html": "הֲיִפָּלֵ֥א מֵיְהוָ֖ה דָּבָ֑ר <mark>לַמּוֹעֵ֞ד</mark> אָשׁ֥וּב אֵלֶ֛יךָ כָּעֵ֥ת חַיָּ֖ה וּלְשָׂרָ֥ה בֵֽן׃", "pasuk_en": "הֲיִפָּלֵא מֵיְהוָה דָּבָר לַמּוֹעֵד אָשׁוּב אֵלֶיךָ כָּעֵת חַיָּה וּלְשָׂרָה בֵן׃", "rashi_he": "למועד. לְאוֹתוֹ מוֹעֵד הַמְיֻחָד שֶׁקָּבַעְתִּי לְךָ אֶתְמוֹל, לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת:", "rashi_en": "\"למועד\" הוא הזמן המיוחד שה' כבר קבע אתמול, כשאמר שבשנה הבאה בזמן הזה יהיה לשרה בן.", "note": "", "points": [{"q": "לְאֵיזֶה מוֹעֵד מִתְכַּוֵּון ה' בְּאָומְרוֹ \"לַמּוֹעֵד אָשׁוּב אֵלֶיךָ\"?", "options": ["לַמּוֹעֵד שֶׁכְּבָר נִקְבַּע: הַזְּמַן הַזֶּה בַּשָּׁנָה הַבָּאָה", "לְחַג הַפֶּסַח שֶׁיָבוֹא בְּעוֹד כַּמָּה חֳודָשִׁים", "לִזְמַן שֶׁבּוֹ שָׂרָה תִּתְפַּלֵּל עַל בֵּן"], "kasha": "המילה \"למועד\" סתמית, ולא ברור לאיזה מועד הכוונה.", "answer": "הכוונה לאותו מועד מיוחד שקבעתי לך אתמול: למועד הזה בשנה האחרת.", "kp": ["לאותו מועד המיחד", "למועד הזה בשנה האחרת"]}]}, {"id": "18:15.1", "ch": 18, "v": 15, "n": 1, "dh": "כי יראה וגו' כי צחקת", "pasuk_html": "וַתְּכַחֵ֨שׁ שָׂרָ֧ה ׀ לֵאמֹ֛ר לֹ֥א צָחַ֖קְתִּי <mark>כִּ֣י ׀ יָרֵ֑אָה</mark> וַיֹּ֥אמֶר ׀ לֹ֖א <mark>כִּ֥י צָחָֽקְתְּ׃</mark>", "pasuk_en": "וַתְּכַחֵשׁ שָׂרָה לֵאמֹר לֹא צָחַקְתִּי כִּי יָרֵאָה וַיֹּאמֶר לֹא כִּי צָחָקְתְּ׃", "rashi_he": "כי יראה וגו' כי צחקת. הָרִאשׁוֹן מְשַׁמֵּשׁ לְשׁוֹן דְּהָא, שֶׁנּוֹתֵן טַעַם לַדָּבָר וַתְּכַחֵשׁ שָׂרָה – לְפִי שֶׁיָּרְאָה; וְהַשֵּׁנִי מְשַׁמֵּשׁ בִּלְשׁוֹן אֶלָּא, וַיֹּאמֶר לֹא כִדְבָרֵךְ הוּא אֶלָּא צָחַקְתְּ, שֶׁאָמְרוּ רַבּוֹתֵינוּ כִּי מְשַׁמֵּשׁ בְּאַרְבַּע לְשׁוֹנוֹת, אִי, דִּלְמָא, אֶלָּא, דְּהָא:", "rashi_en": "בפסוק יש פעמיים \"כי\" במשמעויות שונות: הראשון פירושו \"שהרי\", ומסביר למה שרה הכחישה, כי פחדה. השני פירושו \"אלא\": לא כדבריך, אלא צחקת.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"כִּי\" הָרִאשׁוֹן בַּמִּילִּים \"כִּי יָרֵאָה\"?", "options": ["שֶׁהֲרֵי, וְהוּא מַסְבִּיר לָמָּה שָׂרָה הִכְחִישָׁה", "אֶלָּא, וְהוּא דּוֹחֶה אֶת דִּבְרֵי שָׂרָה", "אוּלַי, וְהוּא מַבִּיעַ סָפֵק אִם פָּחֲדָה"], "kasha": "המילה \"כי\" מופיעה פעמיים בפסוק, וצריך להבין מה תפקידה בכל פעם.", "answer": "\"כי\" הראשון פירושו \"דהא\", שנותן טעם: שרה הכחישה משום שפחדה.", "kp": ["הראשון משמש לשון דהא", "לפי שיראה"]}, {"q": "מַה פֵּירוּשׁ \"כִּי\" הַשֵּׁנִי בַּמִּילִּים \"לֹא כִּי צָחָקְתְּ\"?", "options": ["אֶלָּא: לֹא כִּדְבָרַיִךְ, אֶלָּא צָחַקְתְּ", "שֶׁהֲרֵי: אֵינָךְ צוֹדֶקֶת כִּי צָחַקְתְּ", "אִם: אִם צָחַקְתְּ, תּוֹדִי בְּכָךְ"], "kasha": "אם \"כי\" כאן פירושו \"שהרי\", המשפט \"לא כי צחקת\" אינו מובן.", "answer": "\"כי\" השני פירושו \"אלא\": ה' אמר, לא כדבריך הוא, אלא צחקת.", "kp": ["השני משמש בלשון אלא", "לא כדברך הוא אלא צחקת"]}]}, {"id": "18:16.1", "ch": 18, "v": 16, "n": 1, "dh": "וישקיפו", "pasuk_html": "וַיָּקֻ֤מוּ מִשָּׁם֙ הָֽאֲנָשִׁ֔ים <mark>וַיַּשְׁקִ֖פוּ</mark> עַל־פְּנֵ֣י סְדֹ֑ם וְאַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖ם לְשַׁלְּחָֽם׃", "pasuk_en": "וַיָּקֻמוּ מִשָּׁם הָאֲנָשִׁים וַיַּשְׁקִפוּ עַל־פְּנֵי סְדֹם וְאַבְרָהָם הֹלֵךְ עִמָּם לְשַׁלְּחָם׃", "rashi_he": "וישקיפו. כָּל הַשְׁקָפָה שֶׁבַּמִּקְרָא לְרָעָה חוּץ מֵהַשְׁקִיפָה מִמְּעוֹן קָדְשְׁךָ (דברים כ\"ו), שֶׁגָּדוֹל כֹּחַ מַתְּנוֹת עֲנִיִּים שֶׁהוֹפֵך מִדַּת הָרֹגֶז לְרַחֲמִים:", "rashi_en": "בכל מקום במקרא \"השקפה\" היא לרעה, חוץ מ\"השקיפה ממעון קדשך\" שנאמר על מתנות עניים, כי כוחן גדול כל כך שהן הופכות כעס לרחמים.", "note": "", "points": [{"q": "מַה מְלַמֵּד רַשִׁ\"י מֵהַמִּילָּה \"וַיַּשְׁקִפוּ\"?", "options": ["הַשְׁקָפָה בַּמִּקְרָא הִיא תָּמִיד לְרָעָה, חוּץ מֵאֲשֶׁר בְּמַתָּנוֹת עֲנִיִּים", "הַמַּלְאָכִים הִסְתַּכְּלוּ עַל סְדוֹם כְּדֵי לִמְצֹוא בָּהּ צַדִּיקִים", "הַשְׁקָפָה הִיא הַבָּטָה מִקָּרוֹב, מִתּוֹךְ הָעִיר עַצְמָהּ"], "kasha": "למה הכתוב בחר במילה \"וישקפו\" ולא אמר פשוט שהסתכלו על סדום?", "answer": "כל השקפה שבמקרא היא לרעה, חוץ מ\"השקיפה ממעון קדשך\", שכוח מתנות עניים גדול והופך מידת הרוגז לרחמים.", "kp": ["כל השקפה שבמקרא לרעה", "גדול כח מתנות עניים", "שהופך מדת הרגז לרחמים"]}]}, {"id": "18:16.2", "ch": 18, "v": 16, "n": 2, "dh": "לשלחם", "pasuk_html": "וַיָּקֻ֤מוּ מִשָּׁם֙ הָֽאֲנָשִׁ֔ים וַיַּשְׁקִ֖פוּ עַל־פְּנֵ֣י סְדֹ֑ם וְאַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖ם <mark>לְשַׁלְּחָֽם׃</mark>", "pasuk_en": "וַיָּקֻמוּ מִשָּׁם הָאֲנָשִׁים וַיַּשְׁקִפוּ עַל־פְּנֵי סְדֹם וְאַבְרָהָם הֹלֵךְ עִמָּם לְשַׁלְּחָם׃", "rashi_he": "לשלחם. לְלַוּוֹתָם; כַּסָּבוּר אוֹרְחִים הֵם:", "rashi_en": "\"לשלחם\" פירושו ללוות אותם בדרכם. אברהם עדיין חשב שהם אורחים רגילים.", "note": "", "points": [{"q": "לָמָּה הָלַךְ אַבְרָהָם עִם הָאֲנָשִׁים \"לְשַׁלְּחָם\"?", "options": ["לְלַוּוֹת אוֹתָם, כִּי חָשַׁב שֶׁהֵם אוֹרְחִים רְגִילִים", "לְגָרֵשׁ אוֹתָם, כִּי הֵבִין שֶׁהֵם מַלְאָכִים", "לְהַרְאוֹת לָהֶם אֶת הַדֶּרֶךְ לִסְדוֹם כְּדֵי לְהַצִּיל אֶת לוֹט"], "kasha": "לא מובן למה אברהם צריך \"לשלח\" את אורחיו, הרי הם הולכים בעצמם.", "answer": "\"לשלחם\" פירושו ללוותם, כי אברהם סבר שהם אורחים.", "kp": ["ללוותם", "כסבור אורחים הם"]}]}, {"id": "18:17.1", "ch": 18, "v": 17, "n": 1, "dh": "המכסה אני", "pasuk_html": "וַֽיהֹוָ֖ה אָמָ֑ר <mark>הַֽמְכַסֶּ֤ה אֲנִי֙</mark> מֵֽאַבְרָהָ֔ם אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה׃", "pasuk_en": "וַיהֹוָה אָמָר הַמְכַסֶּה אֲנִי מֵאַבְרָהָם אֲשֶׁר אֲנִי עֹשֶׂה׃", "rashi_he": "המכסה אני. בִּתְמִיהָ:", "rashi_en": "המילים \"המכסה אני\" הן שאלה של תמיהה: וכי אסתיר מאברהם? כלומר, ודאי שלא אסתיר ממנו.", "note": "", "points": [{"q": "אֵיךְ צָרִיךְ לִקְרוֹא אֶת הַמִּילִּים \"הַמְכַסֶּה אֲנִי מֵאַבְרָהָם\"?", "options": ["כִּשְׁאֵלַת תְּמִיהָה: וְכִי אַסְתִּיר מִמֶּנּוּ? וַדַּאי שֶׁלֹּא", "כְּהַחְלָטָה: אֲנִי אַסְתִּיר מֵאַבְרָהָם אֶת מַה שֶּׁאֶעֱשֶׂה", "כִּשְׁאֵלָה אֲמִיתִּית שֶׁה' מִתְלַבֵּט בָּהּ"], "kasha": "לא ברור אם ה' שואל שאלה, מחליט להסתיר, או תמה על עצם האפשרות.", "answer": "הדברים נאמרו בתמיהה: וכי אכסה מאברהם?", "kp": ["בתמיה"]}]}, {"id": "18:17.2", "ch": 18, "v": 17, "n": 2, "dh": "אשר אני עושה", "pasuk_html": "וַֽיהֹוָ֖ה אָמָ֑ר הַֽמְכַסֶּ֤ה אֲנִי֙ מֵֽאַבְרָהָ֔ם <mark>אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה׃</mark>", "pasuk_en": "וַיהֹוָה אָמָר הַמְכַסֶּה אֲנִי מֵאַבְרָהָם אֲשֶׁר אֲנִי עֹשֶׂה׃", "rashi_he": "אשר אני עושה בִּסְדוֹם. לֹא יָפֶה לִי לַעֲשׂוֹת דָּבָר זֶה שֶׁלֹּא מִדַּעְתּוֹ. אֲנִי נָתַתִּי לוֹ אֶת הָאָרֶץ הַזֹּאת, וַחֲמִשָּׁה כְּרַכִּין הַלָּלוּ שֶׁלּוֹ הֵן, שֶׁנֶּאֱמַר: גְּבוּל הַכְּנַעֲנִי מִצִּידֹן בֹּאֲכָה סְדֹמָה וַעֲמֹרָה וְגוֹ' (בראשית י'). קָרָאתִי אוֹתוֹ אַבְרָהָם – אַב הֲמוֹן גּוֹיִם, וְאַשְׁמִיד אֶת הַבָּנִים וְלֹא אוֹדִיעַ לָאָב, שֶׁהוּא אוֹהֲבִי?", "rashi_en": "ה' אומר שלא יפה להשמיד את סדום בלי לספר לאברהם, כי הארץ ניתנה לו וערי סדום שלו, וגם קרא לו \"אב המון גוים\", ואיך ישמיד את הבנים בלי להודיע לאב האוהב אותו.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, לָמָּה סְדוֹם קְשׁוּרָה לְאַבְרָהָם, וְלָכֵן צָרִיךְ לְסַפֵּר לוֹ?", "options": ["כִּי ה' נָתַן לוֹ אֶת הָאָרֶץ, וַחֲמֵשֶׁת הַכְּרַכִּים שֶׁלּוֹ", "כִּי לוֹט, אַחְייָנוֹ שֶׁל אַבְרָהָם, גָּר שָׁם", "כִּי אַבְרָהָם כְּבָר הִתְפַּלֵּל עַל אַנְשֵׁי סְדוֹם"], "kasha": "למה ה' צריך להודיע לאברהם לפני שהוא מעניש את סדום?", "answer": "ה' נתן לאברהם את הארץ, וחמשת הכרכים האלה שלו, ולכן לא יפה לעשות זאת שלא מדעתו.", "kp": ["שלא מדעתו", "חמשה כרכין הללו שלו הן"]}, {"q": "אֵיךְ שְׁמוֹ שֶׁל אַבְרָהָם מְחַיֵּיב לְסַפֵּר לוֹ עַל סְדוֹם?", "options": ["הוּא \"אַב הֲמוֹן גּוֹיִם\", וְלֹא מַשְׁמִידִים בָּנִים בְּלִי לְהוֹדִיעַ לָאָב", "שְׁמוֹ מְלַמֵּד שֶׁהוּא נָבִיא, וְלַנָּבִיא מְגַלִּים כָּל סוֹד", "שְׁמוֹ מְלַמֵּד שֶׁהוּא אוֹהֵב חֶסֶד, וְלָכֵן יִתְפַּלֵּל עֲלֵיהֶם"], "kasha": "למה ה' מזכיר את הקשר המיוחד שלו עם אברהם בהקשר של סדום?", "answer": "ה' קרא לו אברהם, אב המון גוים, ואיך ישמיד את הבנים ולא יודיע לאב שהוא אוהבו?", "kp": ["אב המון גוים", "ואשמיד את הבנים ולא אודיע לאב"]}]}, {"id": "18:18.1", "ch": 18, "v": 18, "n": 1, "dh": "ואברהם היו יהיה", "pasuk_html": "<mark>וְאַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה</mark> לְג֥וֹי גָּד֖וֹל וְעָצ֑וּם וְנִ֨בְרְכוּ ב֔וֹ כֹּ֖ל גּוֹיֵ֥י הָאָֽרֶץ׃", "pasuk_en": "וְאַבְרָהָם הָיוֹ יִהְיֶה לְגוֹי גָּדוֹל וְעָצוּם וְנִבְרְכוּ בוֹ כֹּל גּוֹיֵי הָאָרֶץ׃", "rashi_he": "ואברהם היו יהיה. מִ\"אַ: זֵכֶר צַדִּיק לִבְרָכָה, הוֹאִיל וְהִזְכִּירוֹ – בֵּרְכוֹ. וּפְשׁוּטוֹ: וְכִי מִמֶּנּוּ אֲנִי מַעֲלִים, וַהֲרֵי הוּא חָבִיב לְפָנַי לִהְיוֹת לְגוֹי גָּדוֹל וּלְהִתְבָּרֵך בּוֹ כָּל גּוֹיֵי הָאָרֶץ.", "rashi_en": "לפי המדרש, ה' הזכיר את אברהם ומיד בירך אותו, כי \"זכר צדיק לברכה\". לפי הפשט, ה' אומר: וכי אסתיר ממנו, והרי הוא חביב לפני ועתיד להיות לגוי גדול?", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ, לָמָּה הַפָּסוּק מְבָרֵךְ אֶת אַבְרָהָם דַּוְוקָא כָּאן?", "options": ["כִּי \"זֵכֶר צַדִּיק לִבְרָכָה\", וּכְשֶׁהִזְכִּיר אוֹתוֹ בֵּירַךְ אוֹתוֹ", "כִּי אַבְרָהָם עָמַד לְהִתְפַּלֵּל עַל סְדוֹם", "כִּי זוֹ הַבְטָחָה חֲדָשָׁה שֶׁאַבְרָהָם לֹא שָׁמַע קֹודֶם"], "kasha": "הברכה לאברהם נראית לא שייכת לעניין סדום, ולמה היא נאמרת כאן?", "answer": "לפי המדרש, \"זכר צדיק לברכה\", ולכן כיוון שהזכיר את אברהם בירך אותו.", "kp": ["זכר צדיק לברכה"]}, {"q": "לְפִי הַפְּשָׁט, מַה הַקֶּשֶׁר בֵּין הַבְּרָכָה לְאַבְרָהָם לְבֵין \"הַמְכַסֶּה אֲנִי\"?", "options": ["אַבְרָהָם חָבִיב לִפְנֵי ה', וְלָכֵן לֹא יַסְתִּיר מִמֶּנּוּ", "ה' רוֹצֶה לִבְחוֹן אֶת אַבְרָהָם אִם יִתְפַּלֵּל", "ה' מְנַחֵם אֶת אַבְרָהָם מֵרֹאשׁ עַל חוּרְבַּן סְדוֹם"], "kasha": "צריך להבין איך הברכה מתחברת לפסוק הקודם על הסתרת הדבר מאברהם.", "answer": "לפי פשוטו ה' אומר: וכי ממנו אני מעלים, והרי הוא חביב לפני להיות לגוי גדול ולהתברך בו כל גויי הארץ.", "kp": ["וכי ממנו אני מעלים", "והרי הוא חביב לפני"]}]}, {"id": "18:19.1", "ch": 18, "v": 19, "n": 1, "dh": "כי ידעתיו", "pasuk_html": "<mark>כִּ֣י יְדַעְתִּ֗יו</mark> לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת־בָּנָ֤יו וְאֶת־בֵּיתוֹ֙ אַחֲרָ֔יו וְשָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַעֲשׂ֥וֹת צְדָקָ֖ה וּמִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל־אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר־דִּבֶּ֖ר עָלָֽיו׃", "pasuk_en": "כִּי יְדַעְתִּיו לְמַעַן אֲשֶׁר יְצַוֶּה אֶת־בָּנָיו וְאֶת־בֵּיתוֹ אַחֲרָיו וְשָׁמְרוּ דֶּרֶךְ יְהוָה לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט לְמַעַן הָבִיא יְהוָה עַל־אַבְרָהָם אֵת אֲשֶׁר־דִּבֶּר עָלָיו׃", "rashi_he": "כי ידעתיו. לְשׁוֹן חִבָּה, כְּמוֹ מוֹדָע לְאִישָׁהּ (רות ב'), הֲלֹא בֹעַז מֹדַעְתָּנוּ (שם ג'), וָאֵדָעֲךָ בְּשֵׁם (שמות ל\"ג). וְאָמְנָם עִקַּר לְשׁוֹן כֻּלָּם אֵינוֹ אֶלָּא לְשׁוֹן יְדִיעָה, שֶׁהַמְחַבֵּב אֶת הָאָדָם מְקָרְבוֹ אֶצְלוֹ וְיוֹדְעוֹ וּמַכִּירוֹ, וְלָמָּה יְדַעְתִּיו?", "rashi_en": "\"ידעתיו\" הוא לשון חיבה. ובכל זאת השורש הוא ידיעה, כי מי שאוהב אדם מקרב אותו אליו ו  שֶׁמְּתֻרְגָּם גָדְלָה כְּבָר כְּמוֹ שֶׁפֵּרַשְׁתִּי וַיְהִי הַשֶּׁמֶשׁ בָּאָה, הִנֵּה שָׁבָה יְבִמְתֵּךְ:", "rashi_en": "בדרך כלל המילה \"רבה\" מוטעמת בהברה האחרונה ופירושה \"גדולה\" או \"הולכת וגדלה\". כאן הטעם בהברה הראשונה, ולכן פירושה שהזעקה כבר גדלה.", "note": "", "points": [{"q": "מַה מְלַמֵּד מְקוֹם הַטַּעַם בַּמִּילָּה \"רָבָּה\" כָּאן?", "options": ["שֶׁהַזְּעָקָה כְּבָר גָּדְלָה, בִּלְשׁוֹן עָבָר", "שֶׁהַזְּעָקָה הוֹלֶכֶת וְגָדֵלָה כָּל הַזְּמַן", "שֶׁהַזְּעָקָה גְּדוֹלָה מִכָּל זְעָקָה אַחֶרֶת"], "kasha": "המילה \"רבה\" מוטעמת כאן בהברה הראשונה, שלא כרגיל במקרא.", "answer": "כאן הטעם למעלה ברי\"ש, ולכן הפירוש הוא שהזעקה כבר גדלה, כמו \"ויהי השמש באה\" ו\"הנה שבה יבמתך\".", "kp": ["זה טעמו למעלה", "שמתרגם גדלה כבר"]}]}, {"id": "18:21.1", "ch": 18, "v": 21, "n": 1, "dh": "ארדה נא", "pasuk_html": "<mark>אֵֽרֲדָה־נָּ֣א</mark> וְאֶרְאֶ֔ה הַכְּצַעֲקָתָ֛הּ הַבָּ֥אָה אֵלַ֖י עָשׂ֣וּ ׀ כָּלָ֑ה וְאִם־לֹ֖א אֵדָֽעָה׃", "pasuk_en": "אֵרֲדָה־נָּא וְאֶרְאֶה הַכְּצַעֲקָתָהּ הַבָּאָה אֵלַי עָשׂוּ כָּלָה וְאִם־לֹא אֵדָעָה׃", "rashi_he": "ארדה נא. לִמֵּד לַדַּיָּנִים שֶׁלֹא יִפְסְקוּ דִינֵי נְפָשׁוֹת אֶלָּא בִרְאִיָּה, הַכֹּל כְּמוֹ שֶׁפֵּרַשְׁתִּי בְפָרָשַׁת הַפַּלָּגָה. דָּבָר אַחֵר, אֵרְדָה נָא לְסוֹף מַעֲשֵׂיהֶם:", "rashi_en": "ה' יודע הכול, ובכל זאת אמר \"ארדה נא\" כדי ללמד את הדיינים לא לפסוק דיני נפשות בלי לראות בעצמם. פירוש אחר: ארד לסוף מעשיהם.", "note": "", "points": [{"q": "לָמָּה אָמַר ה' \"אֵרְדָהנָּא וְאֶרְאֶה\", הֲרֵי הוּא יוֹדֵעַ הַכּוֹל?", "options": ["לְלַמֵּד דַּייָּנִים לֹא לִפְסֹוק דִּינֵי נְפָשׁוֹת בְּלִי רְאִיָּיה", "כְּדֵי לָתֵת לְאַנְשֵׁי סְדוֹם זְמַן לַחֲזוֹר בִּתְשׁוּבָה", "כִּי ה' רָצָה שֶׁהַמַּלְאָכִים יִרְאוּ אֶת מַעֲשֵׂיהֶם"], "kasha": "ה' יודע הכול, ואין לו צורך לרדת ולראות.", "answer": "ה' בא ללמד את הדיינים שלא יפסקו דיני נפשות אלא בראייה.", "kp": ["למד לדינים", "לא יפסקו דיני נפשות אלא בראיה"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי, מַה פֵּירוּשׁ \"אֵרְדָהְנָּא\"?", "options": ["אֲבַחֵן לְעוֹמֶק אֶת סוֹף מַעֲשֵׂיהֶם", "אֵרֵד מִן הַשָּׁמַיִם אֶל סְדוֹם מַמָּשׁ", "אֶשְׁלַח מַלְאָכִים לִרְאוֹת בִּמְקוֹמִי"], "kasha": "\"ירידה\" אינה מתאימה לה' במשמעות פשוטה של מקום.", "answer": "ירידה כאן היא העמקה: ארד לסוף מעשיהם.", "kp": ["לסוף מעשיהם"]}]}, {"id": "18:21.2", "ch": 18, "v": 21, "n": 2, "dh": "הכצעקתה", "pasuk_html": "אֵֽרֲדָה־נָּ֣א וְאֶרְאֶ֔ה <mark>הַכְּצַעֲקָתָ֛הּ</mark> הַבָּ֥אָה אֵלַ֖י עָשׂ֣וּ ׀ כָּלָ֑ה וְאִם־לֹ֖א אֵדָֽעָה׃", "pasuk_en": "אֵרֲדָה־נָּא וְאֶרְאֶה הַכְּצַעֲקָתָהּ הַבָּאָה אֵלַי עָשׂוּ כָּלָה וְאִם־לֹא אֵדָעָה׃", "rashi_he": "הכצעקתה. שֶׁל מְדִינָה:", "rashi_en": "\"הכצעקתה\" מתייחס לצעקה של המדינה, כלומר של העיר סדום.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, צַעֲקָתָהּ שֶׁל מִי נֶאֶמְרָה בַּמִּילָּה \"הַכְּצַעֲקָתָהּ\"?", "options": ["שֶׁל הַמְּדִינָה, הָעִיר סְדוֹם", "שֶׁל שָׂרָה, שֶׁצָּחֲקָה קֹודֶם", "שֶׁל הָאָרֶץ כֻּולָּהּ"], "kasha": "המילה \"הכצעקתה\" כתובה בלשון נקבה יחידה, אף שהמדובר בשתי ערים ובאנשים רבים.", "answer": "הכוונה לצעקתה של המדינה.", "kp": ["של מדינה"]}]}, {"id": "18:21.3", "ch": 18, "v": 21, "n": 3, "dh": "הבאה אלי עשו", "pasuk_html": "אֵֽרֲדָה־נָּ֣א וְאֶרְאֶ֔ה הַכְּצַעֲקָתָ֛הּ <mark>הַבָּ֥אָה אֵלַ֖י עָשׂ֣וּ</mark> ׀ כָּלָ֑ה וְאִם־לֹ֖א אֵדָֽעָה׃", "pasuk_en": "אֵרֲדָה־נָּא וְאֶרְאֶה הַכְּצַעֲקָתָהּ הַבָּאָה אֵלַי עָשׂוּ כָּלָה וְאִם־לֹא אֵדָעָה׃", "rashi_he": "הבאה אלי עשו. וְכֵן עוֹמְדִים בְּמִרְדָּם, כָּלָה אֲנִי עוֹשֶׂה בָהֶם, וְאִם לֹא יַעַמְדוּ בְמִרְדָּן אֵדְעָה מָה אֶעֶשֶׂה לְהִפָּרַע מֵהֶן בְּיִסּוּרִין וְלֹא אֲכַלֶּה אוֹתָן. וְכַיּוֹצֵא בוֹ מָצִינוּ בְּמָקוֹם אַחֵר, וְעַתָּה הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ וְאֵדְעָה מָה אֶעֱשֶׂה לָּךְ (שמות ל\"ג); וּלְפִיכָךְ יֵשׁ הֶפְסֵק נְקֻדַּת פְּסִיק בֵּין עָשׂוּ לְכָלָה, כְּדֵי לְהַפְרִיד תֵּבָה מֵחֲבֶרְתָּהּ. וְרַבּוֹתֵינוּ דָרְשׁוּ הַכְּצַעֲקָתָהּ – צַעֲקַת רִיבָה אַחַת שֶׁהָרְגוּ מִיתָה מְשֻׁנָּה עַל שֶׁנָּתְנָה מָזוֹן לְעָנִי, כַּמְּפֹרָשׁ בְּחֵלֶק:", "rashi_en": "אם אנשי סדום ממשיכים במרדם, ה' יכלה אותם, ואם לא, ידע ה' איך להעניש אותם ביסורים בלי להשמידם. חז\"ל דרשו ש\"צעקתה\" היא צעקת נערה שהומתה במיתה קשה כי נתנה אוכל לעני.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"עָשׂוּ כָּלָה וְאִםלֹא אֵדָעָה\" לְפִי רַשִׁ\"י?", "options": ["אִם יַמְשִׁיכוּ בְּמִרְדָּם אֹכְלָה אוֹתָם, וְאִם לֹא, אַעֲנִישֵׁם בְּיִסּוּרִים", "אִם עָשׂוּ רַע אֹכְלָה אוֹתָם, וְאִם לֹא, אֶסְלַח לָהֶם לְגַמְרֵי", "אֹכְלָה אוֹתָם בְּכָל מִקְרֶה, וְאַחַר כָּךְ אֵדַע מַה עָשׂוּ"], "kasha": "המשפט \"עשו כלה ואם לא אדעה\" קטוע ואינו מובן כפשוטו.", "answer": "אם הם עומדים במרדם, כלה אני עושה בהם, ואם לא, אדע מה לעשות כדי להיפרע מהם ביסורים בלי לכלות אותם.", "kp": ["כלה אני עושה בהם", "אדעה מה אעשה להפרע מהן"]}, {"q": "לְפִי דְּרָשַׁת חַזַ\"ל, לָמָּה נֶאֱמַר \"הַכְּצַעֲקָתָהּ\" בִּלְשׁוֹן יְחִידָה?", "options": ["זוֹ צַעֲקַת נַעֲרָה שֶׁהוּמְתָה כִּי נָתְנָה מָזוֹן לֶעָנִי", "זוֹ צַעֲקַת הָעִיר כֻּולָּהּ שֶׁהִתְאַחֲדָה בִּתְפִילָּה", "זוֹ צַעֲקָתָהּ שֶׁל אֵשֶׁת לוֹט שֶׁנֶּעֶנְשָׁה"], "kasha": "\"הכצעקתה\" בלשון יחידה מרמז על צעקה מסוימת.", "answer": "חז\"ל דרשו שזו צעקת נערה אחת שהרגוה במיתה משונה על שנתנה מזון לעני.", "kp": ["צעקת ריבה אחת", "שנתנה מזון לעני"]}]}, {"id": "18:22.1", "ch": 18, "v": 22, "n": 1, "dh": "ויפנו משם", "pasuk_html": "<mark>וַיִּפְנ֤וּ מִשָּׁם֙</mark> הָֽאֲנָשִׁ֔ים וַיֵּלְכ֖וּ סְדֹ֑מָה וְאַ֨בְרָהָ֔ם עוֹדֶ֥נּוּ עֹמֵ֖ד לִפְנֵ֥י יְהוָֽה׃", "pasuk_en": "וַיִּפְנוּ מִשָּׁם הָאֲנָשִׁים וַיֵּלְכוּ סְדֹמָה וְאַבְרָהָם עוֹדֶנּוּ עֹמֵד לִפְנֵי יְהוָה׃", "rashi_he": "ויפנו משם. מִמָּקוֹם שֶׁאַבְרָהָם לִוָּם שָׁם:", "rashi_en": "\"ויפנו משם\" פירושו שהאנשים פנו מהמקום שאליו ליווה אותם אברהם.", "note": "", "points": [{"q": "מֵאֵיזֶה מָקוֹם פָּנוּ הָאֲנָשִׁים לְפִי רַשִׁ\"י?", "options": ["מֵהַמָּקוֹם שֶׁאַבְרָהָם לִיווָּה אוֹתָם אֵלָיו", "מֵהָאֹוהֶל שֶׁל אַבְרָהָם וְשָׂרָה", "מֵהַשַּׁעַר שֶׁל הָעִיר סְדֹום"], "kasha": "המילה \"משם\" סתמית, ולא ברור לאיזה מקום היא מתייחסת.", "answer": "הם פנו מהמקום שאברהם ליווה אותם לשם.", "kp": ["ממקום שאברהם לום שם"]}]}, {"id": "18:22.2", "ch": 18, "v": 22, "n": 2, "dh": "ואברהם עודנו עומד לפני ה'", "pasuk_html": "וַיִּפְנ֤וּ מִשָּׁם֙ הָֽאֲנָשִׁ֔ים וַיֵּלְכ֖וּ סְדֹ֑מָה <mark>וְאַ֨בְרָהָ֔ם עוֹדֶ֥נּוּ עֹמֵ֖ד לִפְנֵ֥י יְהוָֽה׃</mark>", "pasuk_en": "וַיִּפְנוּ מִשָּׁם הָאֲנָשִׁים וַיֵּלְכוּ סְדֹמָה וְאַבְרָהָם עוֹדֶנּוּ עֹמֵד לִפְנֵי יְהוָה׃", "rashi_he": "ואברהם עודנו עומד לפני ה'. וַהֲלֹא לֹא הָלַךְ לַעֲמֹד לְפָנָיו, אֶלָּא הַקָּבָּ\"ה בָּא אֶצְלוֹ וְאָמַר לוֹ, זַעֲקַת סְדֹם וַעֲמֹרָה כִּי רָבָּה, וְהָיָה לוֹ לִכְתֹּב \"וַה' עוֹדֶנּוּ עוֹמֵד עַל אַבְרָהָם\"? אֶלָּא תִּקּוּן סוֹפְרִים הוּא זֶה (אֲשֶׁר הֲפָכוּהוּ רַזִ\"לִ לִכְתֹּב כֵּן) (בראשית רבה):", "rashi_en": "אברהם לא הלך לעמוד לפני ה', אלא ה' בא אליו, ולכן היה ראוי לכתוב \"וה' עודנו עומד על אברהם\". הנוסח שבתורה הוא תיקון סופרים.", "note": "", "points": [{"q": "מַה קָּשֶׁה לְרַשִּׁ\"י בַּמִּילִּים \"וְאַבְרָהָם עוֹדֶנּוּ עֹמֵד לִפְנֵי יְהוָה\"?", "options": ["ה' בָּא אֶל אַבְרָהָם, וְלָכֵן הָיָה צָרִיךְ לִכְתֹּוב שֶׁה' עוֹמֵד", "אַבְרָהָם הָלַךְ עִם הַמַּלְאָכִים וְלֹא נִשְׁאַר בַּמָּקוֹם", "אַבְרָהָם לֹא הָיָה רָאוּי לַעֲמֹוד לִפְנֵי ה'"], "kasha": "אברהם לא הלך לעמוד לפני ה', אלא ה' בא אליו, ולמה כתוב שאברהם עומד לפני ה'?", "answer": "היה ראוי לכתוב \"וה' עודנו עומד על אברהם\", אלא שזה תיקון סופרים.", "kp": ["והלא לא הלך לעמד לפניו", "תקון סופרים הוא זה"]}]}, {"id": "18:23.1", "ch": 18, "v": 23, "n": 1, "dh": "ויגש אברהם", "pasuk_html": "<mark>וַיִּגַּ֥שׁ אַבְרָהָ֖ם</mark> וַיֹּאמַ֑ר הַאַ֣ף תִּסְפֶּ֔ה צַדִּ֖יק עִם־רָשָֽׁע׃", "pasuk_en": "וַיִּגַּשׁ אַבְרָהָם וַיֹּאמַר הַאַף תִּסְפֶּה צַדִּיק עִם־רָשָׁע׃", "rashi_he": "ויגש אברהם. מָצִינוּ הַגָּשָׁה לַמִּלְחָמָה, וַיִּגַּשׁ יוֹאָב וְגוֹ' (שמואל ב י'), וְהַגָּשָׁה לְפִיוּס וַיִּגַּשׁ אֵלָיו יְהוּדָה, וְהַגָּשָׁה לִתְפִלָּה, וַיִּגַּשׁ אֵלִיָּהוּ הַנָּבִיא (מלכים א י\"ח), וּלְכָל אֵלֶּה נִכְנַס אַבְרָהָם לְדַבֵּר קָשׁוֹת וּלְפִיּוּס וְלִתְפִלָּה:", "rashi_en": "המילה \"הגשה\" מופיעה במקרא במשמעות מלחמה, פיוס ותפילה. אברהם ניגש בכל הדרכים האלה: לדבר קשות, לפייס ולהתפלל.", "note": "", "points": [{"q": "לְאֵיזוֹ מַטָּרָה \"וַיִּגַּשׁ אַבְרָהָם\" לְפִי רַשִׁ\"י?", "options": ["לְדַבֵּר קָשׁוֹת, לְפַייֵּס וּלְהִתְפַּלֵּל, כָּל אֵלֶּה יַחַד", "רַק לְהִתְפַּלֵּל עַל אַנְשֵׁי סְדֹום", "רַק לְהִתְקָרֵב פִיזִית אֶל הַמָּקוֹם שֶׁבּוֹ עָמַד ה'"], "kasha": "המילה \"ויגש\" מופיעה במקרא בכמה משמעויות, ולא ברור באיזו מהן היא כאן.", "answer": "מצאנו הגשה למלחמה, לפיוס ולתפילה, ואברהם ניגש לכל אלה: לדבר קשות, לפיוס ולתפילה.", "kp": ["הגשה למלחמה", "לדבר קשות ולפיוס ולתפלה"]}]}, {"id": "18:23.2", "ch": 18, "v": 23, "n": 2, "dh": "האף תספה", "pasuk_html": "וַיִּגַּ֥שׁ אַבְרָהָ֖ם וַיֹּאמַ֑ר <mark>הַאַ֣ף תִּסְפֶּ֔ה</mark> צַדִּ֖יק עִם־רָשָֽׁע׃", "pasuk_en": "וַיִּגַּשׁ אַבְרָהָם וַיֹּאמַר הַאַף תִּסְפֶּה צַדִּיק עִם־רָשָׁע׃", "rashi_he": "האף תספה. הֲגַם תִּסְפֶּה. וּלְתַרְגּוּם שֶׁל אֻנְקְלוֹס, שֶׁתִּרְגְּמוֹ לְשׁוֹן רֹגֶז, כָּךְ פֵּרוּשׁוֹ, הַאַף יַשִּׂיאֲךָ שֶׁתִּסְפֶּה צַדִּיק עִם רָשָׁע:", "rashi_en": "\"האף תספה\" פירושו \"הגם תספה\", כלומר האם גם תשמיד צדיק עם רשע. לפי אונקלוס \"אף\" הוא כעס: האם הכעס יביא אותך להשמיד צדיק עם רשע?", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן, מַה פֵּירוּשׁ \"הַאַף תִּסְפֶּה\"?", "options": ["הַאִם גַּם תַּשְׁמִיד?", "הַאִם בְּכַעַס תַּשְׁמִיד?", "הַאִם כְּבָר הִשְׁמַדְתָּ?"], "kasha": "המילה \"האף\" יכולה להתפרש כמילת \"גם\" או כלשון כעס.", "answer": "פירושו \"הגם תספה\".", "kp": ["הגם תספה"]}, {"q": "לְפִי תַּרְגּוּם אוֹנְקְלוֹס, מַה פֵּירוּשׁ \"הַאַף\" כָּאן?", "options": ["כַּעַס: הַאִם הַכַּעַס יָבִיא אוֹתְךָ לְהַשְׁמִיד צַדִּיק?", "גַּם: הַאִם גַּם הַצַּדִּיק יוּשְׁמַד?", "בֶּאֱמֶת: הַאִם בֶּאֱמֶת תַּשְׁמִיד אֶת כֻּולָּם?"], "kasha": "אונקלוס תרגם את \"האף\" בלשון רוגז, וצריך להבין איך זה מתיישב בפסוק.", "answer": "לפי אונקלוס הפירוש הוא: האם הכעס ישיא אותך להשמיד צדיק עם רשע?", "kp": ["האף ישיאך שתספה"]}]}, {"id": "18:24.1", "ch": 18, "v": 24, "n": 1, "dh": "אולי יש חמשים צדיקים", "pasuk_html": "<mark>אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם</mark> בְּת֣וֹךְ הָעִ֑יר הַאַ֤ף תִּסְפֶּה֙ וְלֹא־תִשָּׂ֣א לַמָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַצַּדִּיקִ֖ם אֲשֶׁ֥ר בְּקִרְבָּֽהּ׃", "pasuk_en": "אוּלַי יֵשׁ חֲמִשִּׁים צַדִּיקִם בְּתוֹךְ הָעִיר הַאַף תִּסְפֶּה וְלֹא־תִשָּׂא לַמָּקוֹם לְמַעַן חֲמִשִּׁים הַצַּדִּיקִם אֲשֶׁר בְּקִרְבָּהּ׃", "rashi_he": "אולי יש חמשים צדיקים. עֲשָׂרָה צַדִּיקִים לְכָל כְּרַךְ וּכְרַךְ, כִּי ה' מְקוֹמוֹת יֵשׁ. וְאִם תֹּאמַר: לֹא יַצִּילוּ הַצַּדִּיקִים אֶת הָרְשָׁעִים, לָמָּה תָּמִית הַצַּדִּיקִים?", "rashi_en": "אברהם ביקש חמישים צדיקים, עשרה לכל אחת מחמש הערים. ואם ה' יאמר שהצדיקים לא יצילו את הרשעים, אברהם שואל: לפחות למה להמית את הצדיקים?", "note": "", "points": [{"q": "לָמָּה בִּיקֵּשׁ אַבְרָהָם דַּווְקָא \"חֲמִשִּׁים צַדִּיקִם\"?", "options": ["עֲשָׂרָה צַדִּיקִים לְכָל אַחַת מֵחָמֵשׁ הֶעָרִים", "כִּי זֶה מִסְפַּר הַצַּדִּיקִים שֶׁהָיוּ בִּסְדוֹם", "כִּי חֲמִישִּׁים צַדִּיקִים מַצִּילִים אֶת הָעוֹלָם כֻּולּוֹ"], "kasha": "המספר חמישים נראה שרירותי, ולא ברור למה אברהם בחר בו.", "answer": "עשרה צדיקים לכל כרך וכרך, כי היו חמישה מקומות.", "kp": ["עשרה צדיקים לכל כרך וכרך", "כי ה' מקומות יש"]}]}, {"id": "18:25.1", "ch": 18, "v": 25, "n": 1, "dh": "חלילה לך", "pasuk_html": "<mark>חָלִ֨לָה לְּךָ֜</mark> מֵעֲשֹׂ֣ת ׀ כַּדָּבָ֣ר הַזֶּ֗ה לְהָמִ֤ית צַדִּיק֙ עִם־רָשָׁ֔ע וְהָיָ֥ה כַצַּדִּ֖יק כָּרָשָׁ֑ע חָלִ֣לָה לָּ֔ךְ הֲשֹׁפֵט֙ כָּל־הָאָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׃", "pasuk_en": "חָלִלָה לְּךָ מֵעֲשֹׂת כַּדָּבָר הַזֶּה לְהָמִית צַדִּיק עִם־רָשָׁע וְהָיָה כַצַּדִּיק כָּרָשָׁע חָלִלָה לָּךְ הֲשֹׁפֵט כָּל־הָאָרֶץ לֹא יַעֲשֶׂה מִשְׁפָּט׃", "rashi_he": "חלילה לך. חֻלִּין הוּא לְךָ, יֹאמְרוּ כָךְ הוּא אֻמָּנוּתוֹ, שׁוֹטֵף הַכֹּל, צֵדִּיקִים וּרְשָׁעִים, כָּךְ עָשִׂיתָ לְדוֹר הַמַּבּוּל וּלְדוֹר הַפַּלָּגָה:", "rashi_en": "\"חלילה לך\" פירושו שזה חולין וגנאי לך, כי יאמרו שדרכו של ה' לשטוף את כולם, צדיקים ורשעים, כפי שעשה בדור המבול ובדור הפלגה.", "note": "", "points": [{"q": "מַה הַגְּנַאי שֶׁבַּדָּבָר לְפִי רַשִׁ\"י עַל \"חָלִלָה לְּךָ\"?", "options": ["יֹאמְרוּ שֶׁדַּרְכּוֹ שֶׁל ה' לִשְׁטֹוף צַדִּיקִים וּרְשָׁעִים יַחַד", "יֹאמְרוּ שֶׁה' אֵינוֹ יוֹדֵעַ מִי צַדִּיק וּמִי רָשָׁע", "יֹאמְרוּ שַׁה' אֵינוֹ מְקַייֵּם אֶת הַבְטָחוֹתָיו לְאַבְרָהָם"], "kasha": "המילה \"חללה\" קשה, וצריך להבין מה הגנאי שאברהם  "המילים \"חללה לך\" חוזרות פעמיים באותו פסוק, ונראה שזו כפילות.", "answer": "\"חלילה לך\" השני נאמר על העולם הבא.", "kp": ["לעולם הבא"]}]}, {"id": "18:25.4", "ch": 18, "v": 25, "n": 4, "dh": "השופט כל הארץ", "pasuk_html": "חָלִ֨לָה לְּךָ֜ מֵעֲשֹׂ֣ת ׀ כַּדָּבָ֣ר הַזֶּ֗ה לְהָמִ֤ית צַדִּיק֙ עִם־רָשָׁ֔ע וְהָיָ֥ה כַצַּדִּ֖יק כָּרָשָׁ֑ע חָלִ֣לָה לָּ֔ךְ <mark>הֲשֹׁפֵט֙ כָּל־הָאָ֔רֶץ</mark> לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׃", "pasuk_en": "חָלִלָה לְּךָ מֵעֲשֹׂת כַּדָּבָר הַזֶּה לְהָמִית צַדִּיק עִם־רָשָׁע וְהָיָה כַצַּדִּיק כָּרָשָׁע חָלִלָה לָּךְ הֲשֹׁפֵט כָּל־הָאָרֶץ לֹא יַעֲשֶׂה מִשְׁפָּט׃", "rashi_he": "השופט כל הארץ. נָקוּד בַּחֲטַף פַּתָּח ה\"א שֶׁל הֲשׁוֹפֵט, לְשׁוֹן תְּמִיהָ, וְכִי מִי שֶׁהוּא שׁוֹפֵט לֹא יַעֲשֶׂה מִשְׁפַּט אֱמֶת:", "rashi_en": "הה\"א של \"השופט\" מנוקדת בחטף פתח, ולכן זו שאלה של תמיהה: וכי מי שהוא שופט כל הארץ לא יעשה משפט אמת?", "note": "", "points": [{"q": "מַה מְלַמֵּד הַנִּיקּוּד שֶׁל הַהֵ\"א בַּמִּילָּה \"הֲשֹׁפֵט\"?", "options": ["שֶׁזּוֹ שְׁאֵלַת תְּמִיהָה: וְכִי הַשּׁוֹפֵט לֹא יַעֲשֶׂה מִשְׁפַּט אֱמֶת?", "שֶׁזּוֹ הֵ\"א הַיְּדִיעָה, הַמְּצַיֶּינֶת אֶת הַשּׁוֹפֵט הַיָּדוּעַ", "שֶׁזּוֹ פְּנִייָּה יְשִׁירָה לַה' בְּתוֹאַר \"הַשּׁוֹפֵט\""], "kasha": "בלי הבנת הניקוד אפשר לקרוא את המשפט כקביעה שהשופט לא יעשה משפט.", "answer": "הה\"א מנוקדת בחטף פתח ולכן היא ה\"א השאלה, לשון תמיהה: וכי מי שהוא שופט לא יעשה משפט אמת?", "kp": ["נקוד בחטף פתח", "לשון תמיה", "לא יעשה משפט אמת"]}]}, {"id": "18:26.1", "ch": 18, "v": 26, "n": 1, "dh": "אם אמצא בסדם וגו' לכל המקום", "pasuk_html": "וַיֹּ֣אמֶר יְהוָ֔ה <mark>אִם־אֶמְצָ֥א בִסְדֹ֛ם</mark> חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּת֣וֹךְ הָעִ֑יר וְנָשָׂ֥אתִי <mark>לְכָל־הַמָּק֖וֹם</mark> בַּעֲבוּרָֽם׃", "pasuk_en": "וַיֹּאמֶר יְהוָה אִם־אֶמְצָא בִסְדֹם חֲמִשִּׁים צַדִּיקִם בְּתוֹךְ הָעִיר וְנָשָׂאתִי לְכָל־הַמָּקוֹם בַּעֲבוּרָם׃", "rashi_he": "אם אמצא בסדם וגו' לכל המקום. לְכָל הַכְּרַכִּים; וּלְפִי שֶׁסְּדוֹם הָיְתָה מֶטְרוֹפּוֹלִין וַחֲשׁוּבָה מִכֻּלָּם, תָּלָה בָהּ הַכָּתוּב:", "rashi_en": "\"המקום\" כולל את כל הכרכים, והכתוב תלה את הדבר בסדום מפני שהיא הייתה העיר הראשית והחשובה מכולן.", "note": "", "points": [{"q": "מַדּוּעַ הַכָּתוּב מַזְכִּיר רַק אֶת \"בִסְדֹם\" אַף שֶׁהַכַּוָּונָה לְכָל הֶעָרִים?", "options": ["כִּי סְדוֹם הָייְתָה הָעִיר הָרָאשִׁית וְהַחֲשׁוּבָה מִכֻּולָּן", "כִּי רַק בִּסְדֹום הָיוּ אֲנָשִׁים רְשָׁעִים בֶּאֱמֶת", "כִּי שְׁאָר הֶעָרִים כְּבָר נִגְזַר דִּינָן קֹודֶם לָכֵן"], "kasha": "ה' אומר שימצא צדיקים בסדום וישא לכל המקום, ולא ברור מדוע מוזכרת רק סדום.", "answer": "הכוונה לכל הכרכים, אלא שסדום הייתה מטרופולין וחשובה מכולן, ולכן תלה בה הכתוב.", "kp": ["לכל הכרכים", "סדום היתה מטרופולין", "תלה בה הכתוב"]}]}, {"id": "18:27.1", "ch": 18, "v": 27, "n": 1, "dh": "הואלתי", "pasuk_html": "וַיַּ֥עַן אַבְרָהָ֖ם וַיֹּאמַ֑ר הִנֵּה־נָ֤א <mark>הוֹאַ֙לְתִּי֙</mark> לְדַבֵּ֣ר אֶל־אֲדֹנָ֔י וְאָנֹכִ֖י עָפָ֥ר וָאֵֽפֶר׃", "pasuk_en": "וַיַּעַן אַבְרָהָם וַיֹּאמַר הִנֵּה־נָא הוֹאַלְתִּי לְדַבֵּר אֶל־אֲדֹנָי וְאָנֹכִי עָפָר וָאֵפֶר׃", "rashi_he": "הואלתי. רָצִיתִי כְּמוֹ וַיּוֹאֶל מֹשֶׁה (שמות ב'):", "rashi_en": "\"הואלתי\" פירושו \"רציתי\", כמו \"ויואל משה\" שפירושו שמשה רצה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילָּה \"הוֹאַלְתִּי\" לְפִי רַשִׁ\"י?", "options": ["רָצִיתִי", "הִתְחַלְתִּי", "הִתְאַמַּצְתִּי"], "kasha": "המילה \"הואלתי\" אינה רגילה ויש צורך לבאר את משמעותה.", "answer": "הואלתי פירושו רציתי, כמו \"ויואל משה\".", "kp": ["רציתי", "כמו ויואל משה"]}]}, {"id": "18:27.2", "ch": 18, "v": 27, "n": 2, "dh": "ואנכי עפר ואפר", "pasuk_html": "וַיַּ֥עַן אַבְרָהָ֖ם וַיֹּאמַ֑ר הִנֵּה־נָ֤א הוֹאַ֙לְתִּי֙ לְדַבֵּ֣ר אֶל־אֲדֹנָ֔י <mark>וְאָנֹכִ֖י עָפָ֥ר וָאֵֽפֶר׃</mark>", "pasuk_en": "וַיַּעַן אַבְרָהָם וַיֹּאמַר הִנֵּה־נָא הוֹאַלְתִּי לְדַבֵּר אֶל־אֲדֹנָי וְאָנֹכִי עָפָר וָאֵפֶר׃", "rashi_he": "ואנכי עפר ואפר. וּכְבָר הָיִיתִי רָאוּי לִהְיוֹת עָפָר עַל יְדֵי הַמְּלָכִים, וְאֵפֶר עַל יְדֵי נִמְרוֹד, לוּלֵי רַחֲמֶיךָ אֲשֶׁר עָמְדוּ לִי:", "rashi_en": "אברהם אומר שכבר היה ראוי להיות עפר במלחמת המלכים ואפר בכבשן של נמרוד, לולא רחמי ה' שהצילו אותו.", "note": "", "points": [{"q": "לָמָּה מִתְכַּווֵּן אַבְרָהָם בְּאָומְרוֹ \"וְאָנֹכִי עָפָר וָאֵפֶר\"?", "options": ["שֶׁכְּבָר הָיָה רָאוּי לָמוּת בִּידֵי הַמְּלָכִים וּבִידֵי נִמְרוֹד", "שֶׁאָדָם נִבְרָא מֵעָפָר וְסוֹפוֹ לַחֲזֹור לְעָפָר", "שֶׁהוּא מִתְאַבֵּל עַל אַנְשֵׁי סְדוֹם שֶׁעֲתִידִים לְהִישָּׂרֵף"], "kasha": "מדוע אברהם מתאר את עצמו דווקא כעפר וכאפר?", "answer": "הוא היה ראוי להיות עפר על ידי המלכים ואפר על ידי נמרוד, לולא רחמי ה' שעמדו לו.", "kp": ["עפר על ידי המלכים", "ואפר על ידי נמרוד", "לולי רחמיך אשר עמדו לי"]}]}, {"id": "18:28.1", "ch": 18, "v": 28, "n": 1, "dh": "התשחית בחמשה", "pasuk_html": "א֠וּלַי יַחְסְר֞וּן חֲמִשִּׁ֤ים הַצַּדִּיקִם֙ חֲמִשָּׁ֔ה <mark>הֲתַשְׁחִ֥ית בַּחֲמִשָּׁ֖ה</mark> אֶת־כָּל־הָעִ֑יר וַיֹּ֙אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם־אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַחֲמִשָּֽׁה׃", "pasuk_en": "אוּלַי יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה הֲתַשְׁחִית בַּחֲמִשָּׁה אֶת־כָּל־הָעִיר וַיֹּאמֶר לֹא אַשְׁחִית אִם־אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה׃", "rashi_he": "התשחית בחמשה. וַהֲלֹא הֵן ט' לְכָל כְּרַךְ, וְאַתָּה צַדִּיקוֹ שֶׁל עוֹלָם תִּצְטָרֵף עִמָּהֶם:", "rashi_en": "אם חסרים חמישה מחמישים, נשארים תשעה צדיקים לכל אחת מחמש הערים, וה', צדיקו של עולם, יצטרף אליהם להשלים לעשרה.", "note": "", "points": [{"q": "מַה טָעַן אַבְרָהָם כְּשֶׁאָמַר \"הֲתַשְׁחִית בַּחֲמִשָּׁה\"?", "options": ["שֶׁיֵּשׁ תִּשְׁעָה לְכָל עִיר, וַה' יִצְטָרֵף אֲלֵיהֶם כַּעֲשִׂירִי", "שֶׁחֲמִישָּׁה צַדִּיקִים מַסְפִּיקִים לְהַצִּיל עִיר אַחַת", "שֶׁאֵין זֶה צוֹדֵק לְהַשְׁמִיד עִיר שֶׁיֵּשׁ בָּהּ צַדִּיק אֶחָד"], "kasha": "מה ההיגיון בבקשה להציל את הערים כשחסרים חמישה צדיקים מחמישים?", "answer": "ארבעים וחמישה הם תשעה לכל כרך, וה', צדיקו של עולם, יצטרף עמהם להשלים לעשרה.", "kp": ["והלא הן ט' לכל כרך", "צדיקו של עולם תצטרף עמהם"]}]}, {"id": "18:29.1", "ch": 18, "v": 29, "n": 1, "dh": "אולי ימצאון שם ארבעים", "pasuk_html": "וַיֹּ֨סֶף ע֜וֹד לְדַבֵּ֤ר אֵלָיו֙ וַיֹּאמַ֔ר <mark>אוּלַ֛י יִמָּצְא֥וּן שָׁ֖ם אַרְבָּעִ֑ים</mark> וַיֹּ֙אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה בַּעֲב֖וּר הָאַרְבָּעִֽים׃", "pasuk_en": "וַיֹּסֶף עוֹד לְדַבֵּר אֵ
