ּׁעַר"], "kasha": "למה נאמר \"ויסרו\" ולא פשוט שבאו אליו?", "answer": "הם עיקמו את הדרך לצד ביתו, כפי שביקש מהם לוט.", "kp": ["עקמו את הדרך לצד ביתו"]}]}, {"id": "19:3.2", "ch": 19, "v": 3, "n": 2, "dh": "ומצות אפה", "pasuk_html": "וַיִּפְצַר־בָּ֣ם מְאֹ֔ד וַיָּסֻ֣רוּ אֵלָ֔יו וַיָּבֹ֖אוּ אֶל־בֵּית֑וֹ וַיַּ֤עַשׂ לָהֶם֙ מִשְׁתֶּ֔ה <mark>וּמַצּ֥וֹת אָפָ֖ה</mark> וַיֹּאכֵֽלוּ׃", "pasuk_en": "וַיִּפְצַר־בָּם מְאֹד וַיָּסֻרוּ אֵלָיו וַיָּבֹאוּ אֶל־בֵּיתוֹ וַיַּעַשׂ לָהֶם מִשְׁתֶּה וּמַצּוֹת אָפָה וַיֹּאכֵלוּ׃", "rashi_he": "ומצות אפה. פֶּסַח הָיָה:", "rashi_en": "לוט אפה מצות מפני שהיה זה חג הפסח.", "note": "", "points": [{"q": "מַדּוּעַ אָפָה לוֹט דַּווְקָא \"וּמַצּוֹת אָפָה\"?", "options": ["כִּי הָיָה זֶה חַג הַפֶּסַח", "כִּי לֹא הָיָה לוֹ זְמַן לְהַחְמִיץ אֶת הַבָּצֵק", "כִּי הַמַּלְאָכִים אֵינָם אוֹכְלִים חָמֵץ"], "kasha": "מדוע מציין הכתוב שלוט אפה מצות דווקא?", "answer": "פסח היה.", "kp": ["פסח היה"]}]}, {"id": "19:4.1", "ch": 19, "v": 4, "n": 1, "dh": "טרם ישכבו ואנשי העיר אנשי סדום", "pasuk_html": "<mark>טֶרֶם֮ יִשְׁכָּבוּ֒ וְאַנְשֵׁ֨י הָעִ֜יר אַנְשֵׁ֤י סְדֹם֙</mark> נָסַ֣בּוּ עַל־הַבַּ֔יִת מִנַּ֖עַר וְעַד־זָקֵ֑ן כָּל־הָעָ֖ם מִקָּצֶֽה׃", "pasuk_en": "טֶרֶם יִשְׁכָּבוּ וְאַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם נָסַבּוּ עַל־הַבַּיִת מִנַּעַר וְעַד־זָקֵן כָּל־הָעָם מִקָּצֶה׃", "rashi_he": "טרם ישכבו ואנשי העיר אנשי סדום. כָּךְ נִדְרַשׁ בִּבְ\"רַ טֶרֶם יִשְׁכָּבוּ וְאַנְשֵׁי הָעִיר הָיוּ בְּפִיהֶם שֶׁל מַלְאָכִים, שֶׁהָיוּ שׁוֹאֲלִים לְלוֹט מַה טִּיבָם וּמַעֲשֵׂיהֶם וְהוּא אוֹמֵר לָהֶם רֻבָּם רְשָׁעִים; עוֹדָם מְדַבְּרִים בָּהֶם וְאַנְשֵׁי סְדוֹם וְגוֹ'. וּפְשׁוּטוֹ שֶׁל מִקְרָא וְאַנְשֵׁי הָעִיר אַנְשֵׁי רֶשַׁע, נָסַבּוּ עַל הַבַּיִת; עַל שֶׁהָיוּ רְשָׁעִים נִקְרָאִים אַנְשֵׁי \"סְדוֹם\", כְּמוֹ שֶׁאָמַר הַכָּתוּב וְאַנְשֵׁי סְדֹם רָעִים וְחַטָּאִים:", "rashi_en": "לפי המדרש, עוד לפני שהלכו לישון שאלו המלאכים את לוט על אנשי העיר, והוא אמר שרובם רשעים, ובעודם מדברים באו אנשי סדום. ולפי הפשט, אנשי העיר הרשעים סבבו את הבית, ונקראו \"אנשי סדום\" משום רשעותם.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ, מַה פֵּירוּשׁ \"טֶרֶם יִשְׁכָּבוּ וְאַנְשֵׁי הָעִיר\"?", "options": ["הַמַּלְאָכִים שָׁאֲלוּ אֶת לוֹט עַל אַנְשֵׁי הָעִיר, וְהוּא אָמַר שֶׁרֻובָּם רְשָׁעִים", "אַנְשֵׁי הָעִיר שָׁכְבוּ לִישֹׁון לִפְנֵי שֶׁהַמַּלְאָכִים הִגִּיעוּ", "לוֹט שָׁלַח אֶת אַנְשֵׁי הָעִיר לְבָתֵּיהֶם לִפְנֵי הַשֵּׁינָה"], "kasha": "הצירוף \"טרם ישכבו ואנשי העיר\" נראה כמשפט שאינו שלם.", "answer": "אנשי העיר היו בפיהם של המלאכים ששאלו את לוט על מעשיהם, והוא אמר רובם רשעים, ועודם מדברים באו אנשי סדום.", "kp": ["היו בפיהם של מלאכים", "רבם רשעים"]}, {"q": "לְפִי הַפְּשָׁט, מַדּוּעַ נֶאֱמַר \"אַנְשֵׁי סְדֹם\" אַחֲרֵי \"אַנְשֵׁי הָעִיר\"?", "options": ["כִּי מִשּׁוּם שֶׁהָיוּ רְשָׁעִים נִקְרְאוּ אַנְשֵׁי סְדוֹם", "כִּי בָּאוּ גַּם אֲנָשִׁים מֵעָרִים אֲחֵרוֹת", "כִּי רַק נִכְבְּדֵי הָעִיר נִקְרְאוּ אַנְשֵׁי סְדֹום"], "kasha": "אם כבר נאמר \"אנשי העיר\", מה מוסיף הכתוב באומרו \"אנשי סדם\"?", "answer": "אנשי העיר, אנשי רשע, סבבו את הבית; משום שהיו רשעים נקראו אנשי סדום, כמו \"ואנשי סדם רעים וחטאים\".", "kp": ["אנשי רשע", "על שהיו רשעים נקראים"]}]}, {"id": "19:4.2", "ch": 19, "v": 4, "n": 2, "dh": "כל העם מקצה", "pasuk_html": "טֶרֶם֮ יִשְׁכָּבוּ֒ וְאַנְשֵׁ֨י הָעִ֜יר אַנְשֵׁ֤י סְדֹם֙ נָסַ֣בּוּ עַל־הַבַּ֔יִת מִנַּ֖עַר וְעַד־זָקֵ֑ן <mark>כָּל־הָעָ֖ם מִקָּצֶֽה׃</mark>", "pasuk_en": "טֶרֶם יִשְׁכָּבוּ וְאַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם נָסַבּוּ עַל־הַבַּיִת מִנַּעַר וְעַד־זָקֵן כָּל־הָעָם מִקָּצֶה׃", "rashi_he": "כל העם מקצה. מִקְּצֵה הָעִיר עַד הַקָּצֶה, שֶׁאֵין אֶחָד מֵהֶם מוֹחֶה בְיָדָם, שֶׁאֲפִלּוּ צַדִּיק אֶחָד אֵין בָּהֶם:", "rashi_en": "כל העם מקצה העיר ועד קצה העיר באו, ואף אחד מהם לא מחה, כי אפילו צדיק אחד לא היה ביניהם.", "note": "", "points": [{"q": "מַה מְלַמֵּד רַשִׁ\"י מִן הַמִּילָּה \"מִקָּצֶה\"?", "options": ["שֶׁאִישׁ לֹא מָחָה בָּהֶם, כִּי לֹא הָיָה בֵּינֵיהֶם אַף צַדִּיק", "שֶׁבָּאוּ רַק אֲנָשִׁים מִשְּׁכוּנָה אַחַת בִּקְצֵה הָעִיר", "שֶׁהָאֲנָשִׁים הִגִּיעוּ מִקְצֵה הָאָרֶץ לִרְאוֹת אֶת הָאוֹרְחִים"], "kasha": "למה צריך הכתוב להדגיש שכל העם באו מקצה ועד קצה?", "answer": "מקצה העיר ועד הקצה, ואין אחד מהם מוחה בידם, שאפילו צדיק אחד אין בהם.", "kp": ["מקצה העיר עד הקצה", "שאין אחד מהם מוחה בידם", "אפלו צדיק אחד אין בהם"]}]}, {"id": "19:5.1", "ch": 19, "v": 5, "n": 1, "dh": "ונדעה אותם", "pasuk_html": "וַיִּקְרְא֤וּ אֶל־לוֹט֙ וַיֹּ֣אמְרוּ ל֔וֹ אַיֵּ֧ה הָאֲנָשִׁ֛ים אֲשֶׁר־בָּ֥אוּ אֵלֶ֖יךָ הַלָּ֑יְלָה הוֹצִיאֵ֣ם אֵלֵ֔ינוּ <mark>וְנֵדְעָ֖ה אֹתָֽם׃</mark>", "pasuk_en": "וַיִּקְרְאוּ אֶל־לוֹט וַיֹּאמְרוּ לוֹ אַיֵּה הָאֲנָשִׁים אֲשֶׁר־בָּאוּ אֵלֶיךָ הַלָּיְלָה הוֹצִיאֵם אֵלֵינוּ וְנֵדְעָה אֹתָם׃", "rashi_he": "ונדעה אותם. בְּמִשְׁכַּב זָכָר כְּמוֹ אֲשֶׁר לֹא יָדְעוּ אִישׁ (בראשית רבה):", "rashi_en": "\"ונדעה אותם\" פירושו למשכב זכר, כמו \"אשר לא ידעו איש\".", "note": "", "points": [{"q": "מַה רָצוּ אַנְשֵׁי סְדֹום בְּאוֹמְרָם \"וְנֵדְעָה אֹתָם\"?", "options": ["לְמִשְׁכַּב זָכָר", "לַחְקֹור אוֹתָם וְלָדַעַת מִי הֵם", "לְהַכִּיר אוֹתָם וּלְהִתְיַידֵּד עִמָּהֶם"], "kasha": "\"ונדעה\" יכול להתפרש כרצון לדעת מי הם, ויש לבאר את כוונתם האמיתית.", "answer": "הכוונה למשכב זכר, כמו \"אשר לא ידעו איש\".", "kp": ["במשכב זכר", "כמו אשר לא ידעו איש"]}]}, {"id": "19:8.1", "ch": 19, "v": 8, "n": 1, "dh": "האל", "pasuk_html": "הִנֵּה־נָ֨א לִ֜י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא־יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה־נָּ֤א אֶתְהֶן֙ אֲלֵיכֶ֔ם וַעֲשׂ֣וּ לָהֶ֔ן כַּטּ֖וֹב בְּעֵינֵיכֶ֑ם רַ֠ק לָֽאֲנָשִׁ֤ים <mark>הָאֵל֙</mark> אַל־תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי־עַל־כֵּ֥ן בָּ֖אוּ בְּצֵ֥ל קֹרָתִֽי׃", "pasuk_en": "הִנֵּה־נָא לִי שְׁתֵּי בָנוֹת אֲשֶׁר לֹא־יָדְעוּ אִישׁ אוֹצִיאָה־נָּא אֶתְהֶן אֲלֵיכֶם וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם רַק לָאֲנָשִׁים הָאֵל אַל־תַּעֲשׂוּ דָבָר כִּי־עַל־כֵּן בָּאוּ בְּצֵל קֹרָתִי׃", "rashi_he": "האל. כְּמוֹ הָאֵלֶּה:", "rashi_en": "המילה \"האל\" כאן פירושה \"האלה\".", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילָּה \"הָאֵל\" בַּפָּסוּק?", "options": ["הָאֵלָה", "הָאֱלֹוהִים", "הַחֲזָקִים"], "kasha": "המילה \"האל\" נראית כשם של ה', ואינה מתאימה כאן.", "answer": "האל כמו האלה.", "kp": ["כמו האלה"]}]}, {"id": "19:8.2", "ch": 19, "v": 8, "n": 2, "dh": "כי על כן באו", "pasuk_html": "הִנֵּה־נָ֨א לִ֜י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא־יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה־נָּ֤א אֶתְהֶן֙ אֲלֵיכֶ֔ם וַעֲשׂ֣וּ לָהֶ֔ן כַּטּ֖וֹב בְּעֵינֵיכֶ֑ם רַ֠ק לָֽאֲנָשִׁ֤ים הָאֵל֙ אַל־תַּעֲשׂ֣וּ דָבָ֔ר <mark>כִּֽי־עַל־כֵּ֥ן בָּ֖אוּ</mark> בְּצֵ֥ל קֹרָתִֽי׃", "pasuk_en": "הִנֵּה־נָא לִי שְׁתֵּי בָנוֹת אֲשֶׁר לֹא־יָדְעוּ אִישׁ אוֹצִיאָה־נָּא אֶתְהֶן אֲלֵיכֶם וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם רַק לָאֲנָשִׁים הָאֵל אַל־תַּעֲשׂוּ דָבָר כִּי־עַל־כֵּן בָּאוּ בְּצֵל קֹרָתִי׃", "rashi_he": "כי על כן באו. כִּי הַטּוֹבָה הַזֹּאת תַּעֲשׂוּ לִכְבוֹדִי עַל אֲשֶׁר בָּאוּ בְּצֵל קֹרָתִי; תַּרְגּוּם בִּטְלַל שָׁרוּתֵי, תַּרְגּוּם שֶׁל קוֹרָה – שָׁרוּתָא:", "rashi_en": "לוט ביקש מהם לעשות לו טובה זו לכבודו, מפני שהאורחים באו בצל קורת ביתו. ואונקלוס תרגם \"בטלל שרותי\", כי קורה בארמית היא \"שרותא\".", "note": "", "points": [{"q": "מַה מְבַקֵּשׁ לוֹט בְּאָומְרוֹ \"בָּאוּ בְּצֵל קֹרָתִי\"?", "options": ["שֶׁיַּעֲשׂוּ טוֹבָה זוֹ לִכְבוֹדוֹ, כִּי הָאוֹרְחִים בָּאוּ תַּחַת קוֹרַת בֵּיתוֹ", "שֶׁיַּנִּיחוּ לָהֶם כִּי הֵם תּוֹשְׁבֵי הָעִיר כְּמוֹתָם", "שֶׁיְחַכּוּ עַד הַבֹּוקֶר כְּשֶׁיֵּצְאוּ הָאוֹרְחִים מִבֵּיתוֹ"], "kasha": "מה הקשר בין כך שבאו בצל קורתו לבין הבקשה שלא יעשו להם דבר?", "answer": "הטובה הזאת תעשו לכבודי, על אשר באו בצל קורתי, ותרגומו בטלל שרותי, כי קורה בתרגום שרותא.", "kp": ["הטובה הזאת תעשו לכבודי", "על אשר באו בצל קרתי"]}]}, {"id": "19:9.1", "ch": 19, "v": 9, "n": 1, "dh": "ויאמרו גש הלאה", "pasuk_html": "<mark>וַיֹּאמְר֣וּ ׀ גֶּשׁ־הָ֗לְאָה</mark> וַיֹּֽאמְרוּ֙ הָאֶחָ֤ד בָּֽא־לָגוּר֙ וַיִּשְׁפֹּ֣ט שָׁפ֔וֹט עַתָּ֕ה נָרַ֥ע לְךָ֖ מֵהֶ֑ם וַיִּפְצְר֨וּ בָאִ֤ישׁ בְּלוֹט֙ מְאֹ֔ד וַֽיִּגְּשׁ֖וּ לִשְׁבֹּ֥ר הַדָּֽלֶת׃", "pasuk_en": "וַיֹּאמְרוּ גֶּשׁ־הָלְאָה וַיֹּאמְרוּ הָאֶחָד בָּא־לָגוּר וַיִּשְׁפֹּט שָׁפוֹט עַתָּה נָרַע לְךָ מֵהֶם וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת׃", "rashi_he": "ויאמרו גש הלאה. קְרַב לְהָלְאָה, כְּלוֹמַר, הִתְקָרֵב לַצְּדָדִין וְהִתְרַחֵק מִמֶּנּוּ, וְכֵן כָּל הָלְאָה שֶׁבַּמִּקְרָא לְשׁוֹן רִחוּק, כְּמוֹ זְרֵה הָלְאָה (במדבר י\"ז), הִנֵּה הַחֵצִי מִמְּךָ וָהָלְאָה (שמואל א' כ'), גֶּשׁ הָלְאָה, (ישעיהו מ\"ט) – הִמָּשֵׁךְ לְהַלָּן, בִּלְשׁוֹן לַעַז טריטי\"דנוש, וּדְבַר נְזִיפָה הוּא, לוֹמַר – אֵין אָנוּ חוֹשְׁשִׁין לְךָ. וְדוֹמֶה לוֹ קְרַב אֵלֶיךָ אַל תִּגַּשׁ בִּי (ישעיהו ס\"ה), וְכֵן גְּשָׁה לִּי וְאֵשֵׁבָה (שם מ\"ט) – הִמָּשֵׁךְ לַצְּדָדִין בַּעֲבוּרִי וְאֵשֵׁב אֶצְלְךָ; אַתָּה מֵלִיץ עַל הָאוֹרְחִין, אֵיךְ מְלָאֲךָ לִבְּךָ? עַל שֶׁאָמַר לָהֶם עַל הַבָּנוֹת, אָמְרוּ לוֹ גש הלאה, לְשׁוֹן נַחַת; וְעַל שֶׁהָיָה מֵלִיץ עַל הָאוֹרְחִים – האחד בא לגור, אָדָם נָכְרִי יְחִידִי אַתָּה בֵינֵינוּ, שֶׁבָּאתָ לָגוּר, וישפוט שפוט, וְנַעֲשֵׂיתָ מוֹכִיחַ אוֹתָנוּ?", "rashi_en": "\"גש הלאה\" פירושו התרחק לצדדים, וזו לשון נזיפה: אין אנו חוששים לך. על דבריו לגבי הבנות ענו בנחת \"גש הלאה\", ועל שלימד זכות על האורחים אמרו בחריפות: זר יחיד אתה בינינו ונעשית מוכיח אותנו?", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"גֶּשׁהָלְאָה\" לְפִי רַשִׁ\"י?", "options": ["הִתְרַחֵק לַצְּדָדִים, כְּלוֹמַר אֵין אָנוּ חוֹשְׁשִׁים לָךְ", "הִתְקָרֵב אֵלֵינוּ כְּדֵי שֶׁנְּדַבֵּר עִמְּךָ", "לֵךְ מִכָּאן לְעִיר אַחֶרֶת וְאַל תַּחְזֹור"], "kasha": "\"גש\" פירושו קרב, ו\"הלאה\" פירושו רחוק, ויש להבין את הצירוף.", "answer": "התקרב לצדדים והתרחק ממנו, וזו לשון נזיפה, לומר: אין אנו חוששין לך.", "kp": ["התקרב לצדדין והתרחק ממנו", "ודבר נזיפה הוא", "אין אנו חוששין לך"]}, {"q": "מַדּוּעַ נֶאֱמַר \"וַיֹּאמְרוּ\" פְּעָמַיִים בַּפָּסוּק?", "options": ["פַּעַם בְּנַחַת עַל הַבָּנוֹת, וּפַעַם בְּכַעַס עַל שֶׁהֵגֵן עַל הָאוֹרְחִים", "כִּי שְׁתֵּי קְבוּצוֹת שׁוֹנוֹת שֶׁל אֲנָשִׁים דִּיבְּרוּ", "כִּי לוֹט לֹא שָׁמַע אוֹתָם בַּפַּעַם הָרִאשׁוֹנָה"], "kasha": "הכתוב חוזר על \"ויאמרו\" פעמיים, ולא ברור מה ההבדל בין שתי האמירות.", "answer": "על הבנות אמרו לו \"גש הלאה\" בנחת, ועל שהיה מליץ על האורחים אמרו: זר יחיד אתה בינינו ונעשית מוכיח אותנו?", "kp": ["לשון נחת", "שהיה מליץ על האורחים", "ונעשית מוכיח אותנו"]}]}, {"id": "19:9.2", "ch": 19, "v": 9, "n": 2, "dh": "הדלת", "pasuk_html": "וַיֹּאמְר֣וּ ׀ גֶּשׁ־הָ֗לְאָה וַיֹּֽאמְרוּ֙ הָאֶחָ֤ד בָּֽא־לָגוּר֙ וַיִּשְׁפֹּ֣ט שָׁפ֔וֹט עַתָּ֕ה נָרַ֥ע לְךָ֖ מֵהֶ֑ם וַיִּפְצְר֨וּ בָאִ֤ישׁ בְּלוֹט֙ מְאֹ֔ד וַֽיִּגְּשׁ֖וּ לִשְׁבֹּ֥ר <mark>הַדָּֽלֶת׃</mark>", "pasuk_en": "וַיֹּאמְרוּ גֶּשׁ־הָלְאָה וַיֹּאמְרוּ הָאֶחָד בָּא־לָגוּר וַיִּשְׁפֹּט שָׁפוֹט עַתָּה נָרַע לְךָ מֵהֶם וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת׃", "rashi_he": "הדלת. הִיא הַסּוֹבֶבֶת לִנְעֹל וְלִפְתֹּחַ:", "rashi_en": "\"הדלת\" היא הכנף שמסתובבת כדי לסגור ולפתוח את הפתח.", "note": "", "points": [{"q": "מַהִי \"הַדָּלֶת\" לְפִי רַשִׁ\"י?", "options": ["הַכָּנָף הַסּוֹבֶבֶת לִסְגּוֹר וּלְפָתוֹחַ", "הֶחָלָל שֶׁבּוֹ נִכְנָסִים וְיוֹצְאִים", "הַמַּשְׁקוֹף שֶׁמֵּעַל הַפֶּתַח"], "kasha": "בהמשך מוזכר \"הפתח\", ויש להבחין בינו לבין הדלת.", "answer": "הדלת היא הסובבת לנעול ולפתוח.", "kp": ["הסובבת לנעל ולפתח"]}]}, {"id": "19:11.1", "ch": 19, "v": 11, "n": 1, "dh": "פתח", "pasuk_html": "וְֽאֶת־הָאֲנָשִׁ֞ים אֲשֶׁר־<mark>פֶּ֣תַח</mark> הַבַּ֗יִת הִכּוּ֙ בַּסַּנְוֵרִ֔ים מִקָּטֹ֖ן וְעַד־גָּד֑וֹל וַיִּלְא֖וּ לִמְצֹ֥א הַפָּֽתַח׃", "pasuk_en": "וְאֶת־הָאֲנָשִׁים אֲשֶׁר־פֶּתַח הַבַּיִת הִכּוּ בַּסַּנְוֵרִים מִקָּטֹן וְעַד־גָּדוֹל וַיִּלְאוּ לִמְצֹא הַפָּתַח׃", "rashi_he": "פתח. הוּא הֶחָלָל שֶׁבּוֹ נִכְנָסִין וְיוֹצְאִין:", "rashi_en": "\"פתח\" הוא החלל שדרכו נכנסים ויוצאים, להבדיל מן הדלת.", "note": "", "points": [{"q": "מַהוּ \"הַפָּתַח\" לְפִי רַשִּׁ\"י?", "options": ["הֶחָלָל שֶׁדַּרְכּוֹ נִכְנָסִים וְיוֹצְאִים", "הַכָּנָף הַסּוֹבֶבֶת לִסְגּוֹר וּלְפָתוֹחַ", "הַשַּׁעַר הַגָּדוֹל שֶׁל הָעִיר"], "kasha": "קודם נאמר \"הדלת\" וכאן \"פתח\", ויש להבחין ביניהם.", "answer": "הפתח הוא החלל שבו נכנסים ויוצאים.", "kp": ["החלל שבו נכנסין ויוצאין"]}]}, {"id": "19:11.2", "ch": 19, "v": 11, "n": 2, "dh": "בסנורים", "pasuk_html": "וְֽאֶת־הָאֲנָשִׁ֞ים אֲשֶׁר־פֶּ֣תַח הַבַּ֗יִת הִכּוּ֙ <mark>בַּסַּנְוֵרִ֔ים</mark> מִקָּטֹ֖ן וְעַד־גָּד֑וֹל וַיִּלְא֖וּ לִמְצֹ֥א הַפָּֽתַח׃", "pasuk_en": "וְאֶת־הָאֲנָשִׁים אֲשֶׁר־פֶּתַח הַבַּיִת הִכּוּ בַּסַּנְוֵרִים מִקָּטֹן וְעַד־גָּדוֹל וַיִּלְאוּ לִמְצֹא הַפָּתַח׃", "rashi_he": "בסנורים. מַכַּת עִוָּרוֹן:", "rashi_en": "המלאכים היכו את אנשי סדום שעמדו בפתח הבית במכת עיוורון.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"בַּסַּנְוֵרִים\" לְפִי רַשִׁ\"י?", "options": ["מַכַּת עִיווָּרוֹן", "סַנְווֵּר זְמַנִּי מֵאוֹר חָזָק", "בִּלְבּוּל דַּעַת בְּלִי פְּגִיעָה בִּרְאִיָּיה"], "kasha": "המילה \"סנורים\" אינה מילה רגילה וצריך לבאר את משמעותה.", "answer": "סנורים הם מכת עיוורון שהמלאכים הכו בה את אנשי סדום.", "kp": ["מכת עורון"]}]}, {"id": "19:11.3", "ch": 19, "v": 11, "n": 3, "dh": "מקטן ועד גדול", "pasuk_html": "וְֽאֶת־הָאֲנָשִׁ֞ים אֲשֶׁר־פֶּ֣תַח הַבַּ֗יִת הִכּוּ֙ בַּסַּנְוֵרִ֔ים <mark>מִקָּטֹ֖ן וְעַד־גָּד֑וֹל</mark> וַיִּלְא֖וּ לִמְצֹ֥א הַפָּֽתַח׃", "pasuk_en": "וְאֶת־הָאֲנָשִׁים אֲשֶׁר־פֶּתַח הַבַּיִת הִכּוּ בַּסַּנְוֵרִים מִקָּטֹן וְעַד־גָּדוֹל וַיִּלְאוּ לִמְצֹא הַפָּתַח׃", "rashi_he": "מקטן ועד גדול. הַקְּטָנִּים הִתְחִילוּ בָּעֲבֵרָה תְּחִלָּה, שֶׁנֶּאֱמַר מִנַּעַר וְעַד זָקֵן, לְפֵיכָךְ הִתְחִילָה הַפֻּרְעָנוּת מֵהֶם (בראשית רבה):", "rashi_en": "הקטנים התחילו ראשונים בחטא, ולכן גם העונש התחיל בהם, ועל כן הפסוק מקדים \"מקטן\" לפני \"גדול\".", "note": "", "points": [{"q": "מַדּוּעַ הַפָּסוּק מַקְדִּים \"מִקָּטֹן\" לִפְנֵי \"גָּדוֹל\" בְּמַכַּת הַסַּנְוֵרִים?", "options": ["כִּי הַקְּטַנִּים הִתְחִילוּ בַּעֲבֵירָה, וְלָכֵן הָעֹונֶשׁ הִתְחִיל בָּהֶם", "כִּי הַקְּטַנִּים עָמְדוּ קָרוֹב יוֹתֵר לְפֶתַח הַבַּיִת", "כִּי הַקְּטַנִּים חַלָּשִׁים יוֹתֵר וְלָכֵן נִפְגְּעוּ רִאשׁוֹנִים"], "kasha": "בדרך כלל מקדימים את הגדולים, ומדוע כאן נזכרו הקטנים קודם?", "answer": "הקטנים התחילו בחטא תחילה, כמו שנאמר \"מנער ועד זקן\", ולכן הפורענות התחילה מהם.", "kp": ["הקטנים התחילו בעברה תחלה", "התחילה הפרענות מהם"]}]}, {"id": "19:12.1", "ch": 19, "v": 12, "n": 1, "dh": "עוד מי לך פה", "pasuk_html": "וַיֹּאמְר֨וּ הָאֲנָשִׁ֜ים אֶל־ל֗וֹט <mark>עֹ֚ד מִֽי־לְךָ֣ פֹ֔ה</mark> חָתָן֙ וּבָנֶ֣יךָ וּבְנֹתֶ֔יךָ וְכֹ֥ל אֲשֶׁר־לְךָ֖ בָּעִ֑יר הוֹצֵ֖א מִן־הַמָּקֽוֹם׃", "pasuk_en": "וַיֹּאמְרוּ הָאֲנָשִׁים אֶל־לוֹט עֹד מִי־לְךָ פֹה חָתָן וּבָנֶיךָ וּבְנֹתֶיךָ וְכֹל אֲשֶׁר־לְךָ בָּעִיר הוֹצֵא מִן־הַמָּקוֹם׃", "rashi_he": "עוד מי לך פה. פְּשׁוּטוֹ שֶׁל מִקְרָא מִי יֵשׁ לְךָ עוֹד בָּעִיר הַזֹּאת חוּץ מֵאִשְׁתְּךָ וּבְנוֹתֶיךָ שֶׁבַּבַּיִת:", "rashi_en": "לפי הפשט, המלאכים שאלו את לוט מי עוד יש לו בעיר מלבד אשתו ובנותיו שנמצאות אתו בבית.", "note": "", "points": [{"q": "לְפִי הַפְּשָׁט, מַה שָׁאֲלוּ הַמַּלְאָכִים אֶת לוֹט בַּמִּילִּים \"עֹד מִילְךָ פֹה\"?", "options": ["מִי עוֹד יֶשׁ לְךָ בָּעִיר מִלְּבַד אִשְׁתְּךָ וּבְנוֹתֶיךָ שֶׁבַּבַּיִת", "הַאִם אַתָּה בָּטוּחַ שֶׁאַתָּה רוֹצֶה לְהִישָּׁאֵר בָּעִיר", "כַּמָּה אֲנָשִׁים צַדִּיקִים נִמְצָאִים עוֹד בָּעִיר"], "kasha": "המילים \"עד מי לך פה\" סתומות, ולא ברור על מה המלאכים שואלים.", "answer": "פשוטו של מקרא: מי יש לך עוד בעיר הזאת חוץ מאשתך ובנותיך שבבית.", "kp": ["מי יש לך עוד בעיר הזאת", "חוץ מאשתך ובנותיך שבבית"]}]}, {"id": "19:12.2", "ch": 19, "v": 12, "n": 2, "dh": "חתן ובניך ובנתיך", "pasuk_html": "וַיֹּאמְר֨וּ הָאֲנָשִׁ֜ים אֶל־ל֗וֹט עֹ֚ד מִֽי־לְךָ֣ פֹ֔ה <mark>חָתָן֙ וּבָנֶ֣יךָ וּבְנֹתֶ֔יךָ</mark> וְכֹ֥ל אֲשֶׁר־לְךָ֖ בָּעִ֑יר הוֹצֵ֖א מִן־הַמָּקֽוֹם׃", "pasuk_en": "וַיֹּאמְרוּ הָאֲנָשִׁים אֶל־לוֹט עֹד מִי־לְךָ פֹה חָתָן וּבָנֶיךָ וּבְנֹתֶיךָ וְכֹל אֲשֶׁר־לְךָ בָּעִיר הוֹצֵא מִן־הַמָּקוֹם׃", "rashi_he": "חתן ובניך ובנתיך. וְאִם יֵשׁ לְךָ חָתָן אוֹ בָנִים וּבָנוֹת הוֹצֵא מִן הַמָּקוֹם:", "rashi_en": "המלאכים אומרים ללוט: אם יש לך חתן או בנים ובנות בעיר, הוצא אותם מן המקום.", "note": "", "points": [{"q": "כֵּיצַד יֵשׁ לְהָבִין אֶת הָרְשִׁימָה \"חָתָן וּבָנֶיךָ וּבְנֹתֶיךָ\"?", "options": ["אִם יֶשׁ לְךָ חָתָן אוֹ בָּנִים וּבָנוֹת, הוֹצֵא אוֹתָם מִן הַמָּקוֹם", "אֵלֶּה הָאֲנָשִׁים שֶׁעֲלֵיהֶם לוֹט הִתְפַּלֵּל כָּל הַלַּיְלָה", "אֵלֶּה בְּנֵי בֵּיתוֹ שֶׁכְּבָר נִמְצָאִים עִמּוֹ בַּבַּיִת"], "kasha": "המלאכים מונים קרובים בלי לומר מה לעשות בהם, ולא ברור אם הם שואלים או מצווים.", "answer": "הכוונה היא: אם יש לך חתן או בנים ובנות, הוצא אותם מן המקום.", "kp": ["ואם יש לך חתן", "הוצא מן המקום"]}]}, {"id": "19:12.3", "ch": 19, "v": 12, "n": 3, "dh": "ובניך", "pasuk_html": "וַיֹּאמְר֨וּ הָאֲנָשִׁ֜ים אֶל־ל֗וֹט עֹ֚ד מִֽי־לְךָ֣ פֹ֔ה חָתָן֙ <mark>וּבָנֶ֣יךָ</mark> וּבְנֹתֶ֔יךָ וְכֹ֥ל אֲשֶׁר־לְךָ֖ בָּעִ֑יר הוֹצֵ֖א מִן־הַמָּקֽוֹם׃", "pasuk_en": "וַיֹּאמְרוּ הָאֲנָשִׁים אֶל־לוֹט עֹד מִי־לְךָ פֹה חָתָן וּבָנֶיךָ וּבְנֹתֶיךָ וְכֹל אֲשֶׁר־לְךָ בָּעִיר הוֹצֵא מִן־הַמָּקוֹם׃", "rashi_he": "ובניך. בְּנֵי בְּנוֹתֶיךָ הַנְּשׂוּאוֹת. וּמִ\"אַ עד – מֵאַחַר שֶׁעוֹשִׂין נְבָלָה כָּזֹאת, מי לך פִּתְחוֹן פֶּה לְלַמֵּד סַנֵּגוֹרְיָא עֲלֵיהֶם? שֶׁכָּל הַלַּיְלָה הָיָה מֵלִיץ עֲלֵיהֶם טוֹבוֹת, קְרִי בֵיהּ מִי לְךָ פֶה:", "rashi_en": "\"ובניך\" הם בני בנותיו הנשואות. ולפי המדרש, המלאכים אמרו ללוט: אחרי שהם עושים נבלה כזאת, איזו טענה עוד יש לך ללמד עליהם זכות, שהרי כל הלילה היה מליץ עליהם.", "note": "", "points": [{"q": "מִי הֵם \"וּבָנֶיךָ\" לְפִי רַשִׁ\"י?", "options": ["בְּנֵי בְּנוֹתָיו הַנְּשׂוּאוֹת שֶׁל לוֹט", "בָּנָיו שֶׁל לוֹט שֶׁנּוֹלְדוּ לוֹ בִּסְדוֹם", "מְשָׁרְתֵי בֵּיתוֹ שֶׁגָּדְלוּ אֶצְלוֹ כְּבָנִים"], "kasha": "לא מצאנו בשום מקום שהיו ללוט בנים, ומי הם \"בניך\"?", "answer": "\"בניך\" הם בני בנותיו הנשואות, כלומר נכדיו.", "kp": ["בני בנותיך הנשואות"]}, {"q": "לְפִי הַמִּדְרָשׁ, מַה פֵּירוּשׁ \"עֹד מִילֵּךְ פֹה\"?", "options": ["אֵיזוֹ טַעֲנָה עוֹד יֵשׁ לְךָ לְלַמֵּד עֲלֵיהֶם זְכוּת", "מִי עוֹד מִבְּנֵי מִשְׁפַּחְתְּךָ נִמְצָא כָּאן בָּעִיר", "כַּמָּה זְמַן עוֹד תּוּכַל לְהִישָּׁאֵר בַּמָּקוֹם הַזֶּה"], "kasha": "המילה \"עד\" נראית מיותרת, ומשמעות \"פה\" אינה ברורה.", "answer": "אחרי שהם עושים נבלה כזאת, איזה פתחון פה יש לך ללמד עליהם סנגוריה? שכן כל הלילה היה לוט מליץ עליהם טובות.", "kp": ["מי לך פתחון פה", "היה מליץ עליהם טובות"]}]}, {"id": "19:14.1", "ch": 19, "v": 14, "n": 1, "dh": "חתניו", "pasuk_html": "וַיֵּצֵ֨א ל֜וֹט וַיְדַבֵּ֣ר ׀ אֶל־<mark>חֲתָנָ֣יו</mark> ׀ לֹקְחֵ֣י בְנֹתָ֗יו וַיֹּ֙אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן־הַמָּק֣וֹם הַזֶּ֔ה כִּֽי־מַשְׁחִ֥ית יְהוָ֖ה אֶת־הָעִ֑יר וַיְהִ֥י כִמְצַחֵ֖ק בְּעֵינֵ֥י חֲתָנָֽיו׃", "pasuk_en": "וַיֵּצֵא לוֹט וַיְדַבֵּר אֶל־חֲתָנָיו לֹקְחֵי בְנֹתָיו וַיֹּאמֶר קוּמוּ צְּאוּ מִן־הַמָּקוֹם הַזֶּה כִּי־מַשְׁחִית יְהוָה אֶת־הָעִיר וַיְהִי כִמְצַחֵק בְּעֵינֵי חֲתָנָיו׃", "rashi_he": "חתניו. שְׁתֵּי בָנוֹת נְשׂוּאוֹת הָיוּ לוֹ בָּעִיר:", "rashi_en": "ללוט היו שתי בנות נשואות בעיר, ואל בעליהן הלך לדבר.", "note": "", "points": [{"q": "מַה לוֹמֵד רַשִׁ\"י מִן הַמִּילָּה \"חֲתָנָיו\"?", "options": ["שֶׁהָיוּ לְלוֹט שְׁתֵּי בָנוֹת נְשׂוּאוֹת בָּעִיר", "שֶׁהַבָּנוֹת שֶׁבַּבַּיִת כְּבָר הָיוּ נְשׂוּאוֹת", "שֶׁחֲתָנָיו גָּרוּ יַחַד עִם לוֹט בְּאוֹתוֹ בַּיִת"], "kasha": "בנותיו שבבית \"לא ידעו איש\", ואם כן מי הם החתנים שלוט הלך אליהם?", "answer": "היו ללוט שתי בנות נשואות בעיר, מלבד שתי הבנות שבבית, ואלה בעליהן.", "kp": ["שתי בנות נשואות היו לו"]}]}, {"id": "19:14.2", "ch": 19, "v": 14, "n": 2, "dh": "לוקחי בנותיו", "pasuk_html": "וַיֵּצֵ֨א ל֜וֹט וַיְדַבֵּ֣ר ׀ אֶל־חֲתָנָ֣יו ׀ <mark>לֹקְחֵ֣י בְנֹתָ֗יו</mark> וַיֹּ֙אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן־הַמָּק֣וֹם הַזֶּ֔ה כִּֽי־מַשְׁחִ֥ית יְהוָ֖ה אֶת־הָעִ֑יר וַיְהִ֥י כִמְצַחֵ֖ק בְּעֵינֵ֥י חֲתָנָֽיו׃", "pasuk_en": "וַיֵּצֵא לוֹט וַיְדַבֵּר אֶל־חֲתָנָיו לֹקְחֵי בְנֹתָיו וַיֹּאמֶר קוּמוּ צְּאוּ מִן־הַמָּקוֹם הַזֶּה כִּי־מַשְׁחִית יְהוָה אֶת־הָעִיר וַיְהִי כִמְצַחֵק בְּעֵינֵי חֲתָנָיו׃", "rashi_he": "לוקחי בנותיו. שֶׁאוֹתָן שֶׁבַּבַּיִת אֲרוּסוֹת לָהֶם:", "rashi_en": "\"לקחי בנתיו\" הם אלה שהבנות שבבית היו מאורסות להם.", "note": "", "points": [{"q": "מִי הֵם \"לֹקְחֵי בְנֹתָיו\" לְפִי רַשִׁ\"י?", "options": ["אֵלֶּה שֶׁהַבָּנוֹת שֶׁבַּבַּיִת הָיוּ מְאוֹרָסוֹת לָהֶם", "אֵלֶּה שֶׁכְּבָר נָשְׂאוּ אֶת בְּנוֹתָיו הַנְּשׂוּאוֹת", "אֵלֶּה שֶׁרָצוּ לָקַחַת אֶת בְּנוֹתָיו בְּכֹוחַ"], "kasha": "הפסוק כבר אמר \"חתניו\", ומה מוסיף \"לקחי בנתיו\"?", "answer": "אלה הם הארוסים של הבנות שבבית, שעדיין לא נישאו להם.", "kp": ["שאותן שבבית ארוסות להם"]}]}, {"id": "19:15.1", "ch": 19, "v": 15, "n": 1, "dh": "ויאיצו", "pasuk_html": "וּכְמוֹ֙ הַשַּׁ֣חַר עָלָ֔ה <mark>וַיָּאִ֥יצוּ</mark> הַמַּלְאָכִ֖ים בְּל֣וֹט לֵאמֹ֑ר קוּם֩ קַ֨ח אֶֽת־אִשְׁתְּךָ֜ וְאֶת־שְׁתֵּ֤י בְנֹתֶ֙יךָ֙ הַנִּמְצָאֹ֔ת פֶּן־תִּסָּפֶ֖ה בַּעֲוֺ֥ן הָעִֽיר׃", "pasuk_en": "וּכְמוֹ הַשַּׁחַר עָלָה וַיָּאִיצוּ הַמַּלְאָכִים בְּלוֹט לֵאמֹר קוּם קַח אֶת־אִשְׁתְּךָ וְאֶת־שְׁתֵּי בְנֹתֶיךָ הַנִּמְצָאֹת פֶּן־תִּסָּפֶה בַּעֲוֺן הָעִיר׃", "rashi_he": "ויאיצו. כְּתַרְגּוּמוֹ וּדְחִיקוּ – מִהֲרוּהוּ:", "rashi_en": "\"ויאיצו\" פירושו כתרגום אונקלוס \"ודחיקו\", כלומר המלאכים זירזו את לוט ומיהרו אותו.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"וַיָּאִיצוּ\" לְפִי רַשִׁ\"י?", "options": ["דָּחֲקוּ בוֹ וּמִיהֲרוּ אוֹתוֹ", "כָּעֲסוּ עָלָיו וְגָעֲרוּ בוֹ", "הִבְטִיחוּ לוֹ שֶׁיִּינָּצֵל"], "kasha": "המילה \"ויאיצו\" אינה שכיחה ויש לבאר את משמעותה.", "answer": "כתרגומו \"ודחיקו\", כלומר המלאכים זירזו ומיהרו את לוט.", "kp": ["ודחיקו", "מהרוהו"]}]}, {"id": "19:15.2", "ch": 19, "v": 15, "n": 2, "dh": "הנמצאות", "pasuk_html": "וּכְמוֹ֙ הַשַּׁ֣חַר עָלָ֔ה וַיָּאִ֥יצוּ הַמַּלְאָכִ֖ים בְּל֣וֹט לֵאמֹ֑ר קוּם֩ קַ֨ח אֶֽת־אִשְׁתְּךָ֜ וְאֶת־שְׁתֵּ֤י בְנֹתֶ֙יךָ֙ <mark>הַנִּמְצָאֹ֔ת</mark> פֶּן־תִּסָּפֶ֖ה בַּעֲוֺ֥ן הָעִֽיר׃", "pasuk_en": "וּכְמוֹ הַשַּׁחַר עָלָה וַיָּאִיצוּ הַמַּלְאָכִים בְּלוֹט לֵאמֹר קוּם קַח אֶת־אִשְׁתְּךָ וְאֶת־שְׁתֵּי בְנֹתֶיךָ הַנִּמְצָאֹת פֶּן־תִּסָּפֶה בַּעֲוֺן הָעִיר׃", "rashi_he": "הנמצאות. הַמְזֻמָּנוֹת לְךָ בַּבַּיִת לְהַצִּילָם. וּמִ\"אַ יֵשׁ וְזֶה יִשּׁוּבוֹ שֶׁל מִקְרָא:", "rashi_en": "\"הנמצאת\" פירושו הבנות שנמצאות אתך בבית ואפשר להצילן. יש לכך מדרשים, אך זה הפשט.", "note": "", "points": [{"q": "מַה מְלַמֶּדֶת הַמִּילָּה \"הַנִּמְצָאֹת\" עַל שְׁתֵּי הַבָּנוֹת?", "options": ["שֶׁהֵן נִמְצָאוֹת אִתְּךָ בַּבַּיִת וְאֶפְשָׁר לְהַצִּילָן", "שֶׁהֵן נִמְצְאוּ צַדִּיקוֹת יוֹתֵר מִשְּׁאָר אַנְשֵׁי הָעִיר", "שֶׁהֵן הִסְתַּתְּרוּ וְנִמְצְאוּ רַק בְּקֹושִׁי"], "kasha": "מדוע צריך לתאר את הבנות כ\"נמצאת\", הרי ברור שהן בנותיו?", "answer": "\"הנמצאות\" הן הבנות המזומנות לך בבית, שאפשר להצילן, בניגוד לבנות הנשואות שבעיר.", "kp": ["המזמנות לך בבית להצילם"]}]}, {"id": "19:15.3", "ch": 19, "v": 15, "n": 3, "dh": "תספה", "pasuk_html": "וּכְמוֹ֙ הַשַּׁ֣חַר עָלָ֔ה וַיָּאִ֥יצוּ הַמַּלְאָכִ֖ים בְּל֣וֹט לֵאמֹ֑ר קוּם֩ קַ֨ח אֶֽת־אִשְׁתְּךָ֜ וְאֶת־שְׁתֵּ֤י בְנֹתֶ֙יךָ֙ הַנִּמְצָאֹ֔ת פֶּן־<mark>תִּסָּפֶ֖ה</mark> בַּעֲוֺ֥ן הָעִֽיר׃", "pasuk_en": "וּכְמוֹ הַשַּׁחַר עָלָה וַיָּאִיצוּ הַמַּלְאָכִים בְּלוֹט לֵאמֹר קוּם קַח אֶת־אִשְׁתְּךָ וְאֶת־שְׁתֵּי בְנֹתֶיךָ הַנִּמְצָאֹת פֶּן־תִּסָּפֶה בַּעֲוֺן הָעִיר׃", "rashi_he": "תספה. תִּהְיֶה כָּלֶה, עַד תֹּם כָּל הַדּוֹר (דברים ב') מְתֻרְגָּם עַד דְּסַף כָּל דָּרָא:", "rashi_en": "\"תספה\" פירושו תיכלה ותאבד, כמו שאונקלוס מתרגם \"עד תם כל הדור\" - \"עד דסף כל דרא\".", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"תִּסָּפֶה\" לְפִי רַשִׁ\"י?", "options": ["תִּיכָּלֶה וְתֹאבַד", "תִּיתָּפֵס וְתֵּיעָנֵשׁ", "תִּילָּקַח לַשְּׁבִי"], "kasha": "המילה \"תספה\" אינה רגילה וצריך לבאר את משמעותה.", "answer": "\"תספה\" פירושו תהיה כלה, כמו שאונקלוס תרגם \"עד תם כל הדור\" - \"עד דסף כל דרא\".", "kp": ["תהיה כלה", "עד דסף כל דרא"]}]}, {"id": "19:16.1", "ch": 19, "v": 16, "n": 1, "dh": "ויתמהמה", "pasuk_html": "<mark>וַֽיִּתְמַהְמָ֓הּ</mark> ׀ וַיַּחֲזִ֨קוּ הָאֲנָשִׁ֜ים בְּיָד֣וֹ וּבְיַד־אִשְׁתּ֗וֹ וּבְיַד֙ שְׁתֵּ֣י בְנֹתָ֔יו בְּחֶמְלַ֥ת יְהוָ֖ה עָלָ֑יו וַיֹּצִאֻ֥הוּ וַיַּנִּחֻ֖הוּ מִח֥וּץ לָעִֽיר׃", "pasuk_en": "וַיִּתְמַהְמָהּ וַיַּחֲזִקוּ הָאֲנָשִׁים בְּיָדוֹ וּבְיַד־אִשְׁתּוֹ וּבְיַד שְׁתֵּי בְנֹתָיו בְּחֶמְלַת יְהוָה עָלָיו וַיֹּצִאֻהוּ וַיַּנִּחֻהוּ מִחוּץ לָעִיר׃", "rashi_he": "ויתמהמה. כְּדֵי לְהַצִּיל אֶת מָמוֹנוֹ:", "rashi_en": "לוט התמהמה כדי להציל את רכושו.", "note": "", "points": [{"q": "מַדּוּעַ \"וַיִּתְמַהְמָהּ\" לוֹט כְּשֶׁהַמַּלְאָכִים זֵירְזוּ אוֹתוֹ?", "options": ["כְּדֵי לְהַצִּיל אֶת מָמוֹנוֹ", "כִּי לֹא הֶאֱמִין שֶׁהָעִיר תֵּיהָפֵךְ", "כִּי חִיכָּה שֶׁחֲתָנָיו יִצְטָרְפוּ אֵלָיו"], "kasha": "המלאכים זירזו את לוט לברוח, ומדוע התעכב?", "answer": "לוט התמהמה כדי להציל את ממונו.", "kp": ["כדי להציל את ממונו"]}]}, {"id": "19:16.2", "ch": 19, "v": 16, "n": 2, "dh": "ויחזיקו", "pasuk_html": "וַֽיִּתְמַהְמָ֓הּ ׀ <mark>וַיַּחֲזִ֨קוּ</mark> הָאֲנָשִׁ֜ים בְּיָד֣וֹ וּבְיַד־אִשְׁתּ֗וֹ וּבְיַד֙ שְׁתֵּ֣י בְנֹתָ֔יו בְּחֶמְלַ֥ת יְהוָ֖ה עָלָ֑יו וַיֹּצִאֻ֥הוּ וַיַּנִּחֻ֖הוּ מִח֥וּץ לָעִֽיר׃", "pasuk_en": "וַיִּתְמַהְמָהּ וַיַּחֲזִקוּ הָאֲנָשִׁים בְּיָדוֹ וּבְיַד־אִשְׁתּוֹ וּבְיַד שְׁתֵּי בְנֹתָיו בְּחֶמְלַת יְהוָה עָלָיו וַיֹּצִאֻהוּ וַיַּנִּחֻהוּ מִחוּץ לָעִיר׃", "rashi_he": "ויחזיקו. אֶחָד מֵהֶם הָיָה שָׁלִיחַ לְהַצִּילוֹ וַחֲבֵרוֹ לַהֲפֹךְ סְדוֹם, לְכָךְ נֶאֱמַר \"וַיֹּאמֶר\" הִמָּלֵט, וְלֹא נֶאֱמַר וַיֹּאמְרוּ (בראשית רבה):", "rashi_en": "אחד המלאכים נשלח להציל את לוט וחברו נשלח להפוך את סדום, ולכן בהמשך כתוב \"ויאמר\" בלשון יחיד.", "note": "", "points": [{"q": "מַדּוּעַ אַחֲרֵי שֶׁהַמַּלְאָכִים הֶחֱזִיקוּ בְּלוֹט כָּתוּב \"וַיֹּאמֶר הִמָּלֵט\" וְלֹא \"וַיֹּאמְרוּ\"?", "options": ["כִּי רַק אֶחָד הָיָה שָׁלִיחַ לְהַצִּיל, וְהַשֵּׁנִי לְהָפֹוךְ אֶת סְדֹום", "כִּי רַק אֶחָד מֵהֶם יָדַע לְדַבֵּר בִּלְשׁוֹנוֹ שֶׁל לוֹט", "כִּי הַשֵּׁנִי כְּבָר הִקְדִּים וְהָלַךְ לְצוֹעַר"], "kasha": "שני מלאכים הוציאו את לוט, ומדוע מיד אחר כך רק אחד מדבר אתו?", "answer": "אחד מהם היה שליח להציל את לוט וחברו להפוך את סדום, לכן נאמר \"ויאמר\" ולא \"ויאמרו\".", "kp": ["אחד מהם היה שליח להצילו", "ולא נאמר ויאמרו"]}]}, {"id": "19:17.1", "ch": 19, "v": 17, "n": 1, "dh": "המלט על נפשך", "pasuk_html": "וַיְהִי֩ כְהוֹצִיאָ֨ם אֹתָ֜ם הַח֗וּצָה וַיֹּ֙אמֶר֙ <mark>הִמָּלֵ֣ט עַל־נַפְשֶׁ֔ךָ</mark> אַל־תַּבִּ֣יט אַחֲרֶ֔יךָ וְאַֽל־תַּעֲמֹ֖ד בְּכָל־הַכִּכָּ֑ר הָהָ֥רָה הִמָּלֵ֖ט פֶּן־תִּסָּפֶֽה׃", "pasuk_en": "וַיְהִי כְהוֹצִיאָם אֹתָם הַחוּצָה וַיֹּאמֶר הִמָּלֵט עַל־נַפְשֶׁךָ אַל־תַּבִּיט אַחֲרֶיךָ וְאַל־תַּעֲמֹד בְּכָל־הַכִּכָּר הָהָרָה הִמָּלֵט פֶּן־תִּסָּפֶה׃", "rashi_he": "המלט על נפשך. דַּיְּךָ לְהַצִּיל נְפָשׁוֹת, אַל תָּחוּס עַל הַמָּמוֹן:", "rashi_en": "המלאך אומר ללוט: די לך להציל את הנפשות, ואל תחוס על הרכוש.", "note": "", "points": [{"q": "מַה בָּא הַמַּלְאָךְ לוֹמַר לְלוֹט בַּמִּילִּים \"הִמָּלֵט עַלְנַפְשְׁךָ\"?", "options": ["הִסְתַּפֵּק בְּהַצָּלַת הַנְּפָשׁוֹת וְאַל תָּחוּס עַל הַמָּמוֹן", "בְּרַח מַהֵר כִּי חַיֶּיךָ בְּסַכָּנָה מִיָּידִית", "הִשְׁתַּדֵּל לְהַצִּיל גַּם אֶת נַפְשׁוֹת אַנְשֵׁי הָעִיר"], "kasha": "מדוע הדגיש המלאך \"על נפשך\", ולא אמר רק \"המלט\"?", "answer": "די לך להציל נפשות, ואל תחוס על הממון שרצית להציל.", "kp": ["דיך להציל נפשות", "אל תחוס על הממון"]}]}, {"id": "19:17.2", "ch": 19, "v": 17, "n": 2, "dh": "אל תביט אחריך", "pasuk_html": "וַיְהִי֩ כְהוֹצִיאָ֨ם אֹתָ֜ם הַח֗וּצָה וַיֹּ֙אמֶר֙ הִמָּלֵ֣ט עַל־נַפְשֶׁ֔ךָ <mark>אַל־תַּבִּ֣יט אַחֲרֶ֔יךָ</mark> וְאַֽל־תַּעֲמֹ֖ד בְּכָל־הַכִּכָּ֑ר הָהָ֥רָה הִמָּלֵ֖ט פֶּן־תִּסָּפֶֽה׃", "pasuk_en": "וַיְהִי כְהוֹצִיאָם אֹתָם הַחוּצָה וַיֹּאמֶר הִמָּלֵט עַל־נַפְשֶׁךָ אַל־תַּבִּיט אַחֲרֶיךָ וְאַל־תַּעֲמֹד בְּכָל־הַכִּכָּר הָהָרָה הִמָּלֵט פֶּן־תִּסָּפֶה׃", "rashi_he": "אל תביט אחריך. אַתָּה הִרְשַׁעְתָּ עִמָּהֶם וּבִזְכוּת אַבְרָהָם אַתָּה נִצָּל; אֵינְךָ כְּדַאי לִרְאוֹת בְּפֻרְעָנוּתָם וְאַתָּה נִצָּל:", "rashi_en": "לוט חטא יחד עם אנשי סדום וניצל רק בזכות אברהם, ולכן אינו ראוי לראות בעונשם בשעה שהוא עצמו ניצל.", "note": "", "points": [{"q": "מַדּוּעַ נֶאֱסַר עַל לוֹט \"אַלְתַּבִּיט אַחֲרֶיךָ\"?", "options": ["כִּי גַּם הוּא חָטָא עִמָּהֶם, וְאֵינוֹ רָאוּי לִרְאוֹת בְּעוֹנְשָׁם", "כִּי הַמַּרְאֶה הַנּוֹרָא יִגְרֹום לוֹ לְהִתְעַלֵּף", "כִּי הַהַבָּטָה לְאָחוֹר תְּעַכֵּב אוֹתוֹ מִלִּבְרֹוחַ"], "kasha": "מה רע בכך שלוט יביט לאחור על העיר שנהפכת?", "answer": "לוט הרשיע עמהם וניצל רק בזכות אברהם, ולכן אינו כדאי לראות בפורענותם בשעה שהוא ניצל.", "kp": ["ובזכות אברהם אתה נצל", "אינך כדאי לראות בפרענותם"]}]}, {"id": "19:17.3", "ch": 19, "v": 17, "n": 3, "dh": "בכל הככר", "pasuk_html": "וַיְהִי֩ כְהוֹצִיאָ֨ם אֹתָ֜ם הַח֗וּצָה וַיֹּ֙אמֶר֙ הִמָּלֵ֣ט עַל־נַפְשֶׁ֔ךָ אַל־תַּבִּ֣יט אַחֲרֶ֔יךָ וְאַֽל־תַּעֲמֹ֖ד <mark>בְּכָל־הַכִּכָּ֑ר</mark> הָהָ֥רָה הִמָּלֵ֖ט פֶּן־תִּסָּפֶֽה׃", "pasuk_en": "וַיְהִי כְהוֹצִיאָם אֹתָם הַחוּצָה וַיֹּאמֶר הִמָּלֵט עַל־נַפְשֶׁךָ אַל־תַּבִּיט אַחֲרֶיךָ וְאַל־תַּעֲמֹד בְּכָל־הַכִּכָּר הָהָרָה הִמָּלֵט פֶּן־תִּסָּפֶה׃", "rashi_he": "בכל הככר. כִּכַּר הַיַּרְדֵּן:", "rashi_en": "\"הככר\" הוא ככר הירדן.", "note": "", "points": [{"q": "לְאֵיזוֹ \"כִכָּר\" הַכַּוָּונָה בַּפָּסוּק?", "options": ["כִּכַּר הַיַּרְדֵּן", "הַכִּכָּר שֶׁלְּיַד חֶבְרוֹן", "כִּכַּר אֶרֶץ מִצְרַיִם"], "kasha": "הפסוק אומר \"הככר\" בלי לפרש איזו ככר.", "answer": "הכוונה לככר הירדן שבה ישבו סדום וחברותיה.", "kp": ["ככר הירדן"]}]}, {"id": "19:17.4", "ch": 19, "v": 17, "n": 4, "dh": "ההרה המלט", "pasuk_html": "וַיְהִי֩ כְהוֹצִיאָ֨ם אֹתָ֜ם הַח֗וּצָה וַיֹּ֙אמֶר֙ הִמָּלֵ֣ט עַל־נַפְשֶׁ֔ךָ אַל־תַּבִּ֣יט אַחֲרֶ֔יךָ וְאַֽל־תַּעֲמֹ֖ד בְּכָל־הַכִּכָּ֑ר <mark>הָהָ֥רָה הִמָּלֵ֖ט</mark> פֶּן־תִּסָּפֶֽה׃", "pasuk_en": "וַיְהִי כְהוֹצִיאָם אֹתָם הַחוּצָה וַיֹּאמֶר הִמָּלֵט עַל־נַפְשֶׁךָ אַל־תַּבִּיט אַחֲרֶיךָ וְאַל־תַּעֲמֹד בְּכָל־הַכִּכָּר הָהָרָה הִמָּלֵט פֶּן־תִּסָּפֶה׃", "rashi_he": "ההרה המלט. אֵצֶל אַבְרָהָם בְּרַח, שֶׁהוּא יוֹשֵׁב בָּהָר, שֶׁנֶּאֱמַר וַיַּעְתֵּק מִשָּׁם הָהָרָה (בראשית י\"ב), וְאַף עַכְשָׁו הָיָה יוֹשֵׁב שָׁם, שֶׁנֶּאֱמַר אֶל הַמָּקוֹם אֲשֶׁר הָיָה שָׁם אָהֳלוֹ בַּתְּחִלָּה, וְאַעַ\"פִּ שֶׁכָּתוּב וַיֶּאֱהַל אַבְרָהָם וְגוֹ' (שם י\"ג), אֹהָלִים הַרְבֵּה הָיוּ לוֹ וְנִמְשְׁכוּ עַד חֶבְרוֹן:", "rashi_en": "המלאך אמר ללוט לברוח אל אברהם שיושב בהר. ואף שכתוב שאברהם ישב בחברון, היו לו אוהלים רבים שנמשכו מן ההר עד חברון.", "note": "", "points": [{"q": "לְאֵיזֶה הַר אָמַר הַמַּלְאָךְ לְלוֹט \"הָהָרָה הִמָּלֵט\"?", "options": ["לָהָר שֶׁבּוֹ יָשַׁב אַבְרָהָם", "לָהָר הַגָּבוֹהַּ בְּיוֹתֵר בָּאֵזוֹר", "לְהַר שֶׁבּוֹ יָשַׁב לוֹט לִפְנֵי שֶׁבָּא לִסְדוֹם"], "kasha": "הפסוק אומר \"ההרה\" בה\"א הידיעה, ולאיזה הר מוכר הכוונה?", "answer": "ברח אצל אברהם שיושב בהר, כמו שנאמר \"ויעתק משם ההרה\", וגם עכשיו הוא יושב שם.", "kp": ["אצל אברהם ברח", "שהוא יושב בהר"]}, {"q": "כֵּיצַד מְייַשֵּׁב רַשִׁ\"י אֶת מַה שֶּׁכָּתוּב שֶׁאַבְרָהָם יָשַׁב בְּחֶבְרוֹן?", "options": ["אֹוהָלָיו הָרַבִּים שֶׁל אַבְרָהָם נִמְשְׁכוּ מִן הָהָר עַד חֶבְרוֹן", "אַבְרָהָם חָזַר מֵחֶבְרוֹן אֶל הָהָר לִפְנֵי הַמַּעֲשֶׂה", "חֶבְרוֹן עַצְמָהּ נִקְרֵאת בַּכָּתוּב בְּשֵׁם \"הָהָר\""], "kasha": "כתוב \"ויאהל אברם ויבא וישב באלני ממרא אשר בחברון\", ואיך אומר רש\"י שאברהם ישב בהר?", "answer": "אף שכתוב \"ויאהל אברם\", היו לו אוהלים רבים ונמשכו עד חברון.", "kp": ["אהלים הרבה היו לו", "ונמשכו עד חברון"]}]}, {"id": "19:17.5", "ch": 19, "v": 17, "n": 5, "dh": "המלט", "pasuk_html": "וַיְהִי֩ כְהוֹצִיאָ֨ם אֹתָ֜ם הַח֗וּצָה וַיֹּ֙אמֶר֙ <mark>הִמָּלֵ֣ט</mark> עַל־נַפְשֶׁ֔ךָ אַל־תַּבִּ֣יט אַחֲרֶ֔יךָ וְאַֽל־תַּעֲמֹ֖ד בְּכָל־הַכִּכָּ֑ר הָהָ֥רָה הִמָּלֵ֖ט פֶּן־תִּסָּפֶֽה׃", "pasuk_en": "וַיְהִי כְהוֹצִיאָם אֹתָם הַחוּצָה וַיֹּאמֶר הִמָּלֵט עַל־נַפְשֶׁךָ אַל־תַּבִּיט אַחֲרֶיךָ וְאַל־תַּעֲמֹד בְּכָל־הַכִּכָּר הָהָרָה הִמָּלֵט פֶּן־תִּסָּפֶה׃", "rashi_he": "המלט. לְשׁוֹן הַשְׁמָטָה, וְכֵן כָּל הַמְלָטָה שֶׁבַּמִּקְרָא אשמוצי\"ר בלע\"ז וְכֵן וְהִמְלִיטָה זָכָר (ישעיהו ס\"ו), שֶׁנִּשְׁמַט הָעֻבָּר מִן הָרֶחֶם, כְּצִפּוֹר נִמְלְטָה (תהילים קכ\"ד), לֹא יָכְלוּ מַלֵּט מַשָּׂא (ישעיהו מ\"ו), לְהַשְׁמִיט מַשָּׂא הָרְעִי שֶׁבְּנִקְבֵיהֶם:", "rashi_en": "\"המלט\" הוא לשון השמטה, כלומר חמיקה ויציאה ממקום, וכן הוא בכל לשון המלטה שבמקרא, כמו לידה שבה נשמט העובר מן הרחם.", "note": "", "points": [{"q": "מַה הַמַּשְׁמָעוּת הַיְּסוֹדִית שֶׁל לְשׁוֹן \"הִמָּלֵט\" לְפִי רַשִׁ\"י?", "options": ["הַשְּׁמָטָה, יְצִיאָה בַּחֲמִיקָה מִמָּקוֹם", "רִיצָה מְהִירָה לְמָקוֹם רָחוֹק", "הִסְתַּתְּרוּת בְּמָקוֹם מוּגָן"], "kasha": "לשון \"המלט\" מופיע במקרא בהקשרים שונים, כמו לידה ופריקת משא, וצריך למצוא את המשמעות המשותפת.", "answer": "\"המלט\" הוא לשון השמטה, וכן כל המלטה שבמקרא, כמו \"והמליטה זכר\" שנשמט העובר מן הרחם.", "kp": ["לשון השמטה", "שנשמט העבר מן הרחם"]}]}, {"id": "19:18.1", "ch": 19, "v": 18, "n": 1, "dh": "אל נא אדני", "pasuk_html": "וַיֹּ֥אמֶר ל֖וֹט אֲלֵהֶ֑ם <mark>אַל־נָ֖א אֲדֹנָֽי׃</mark>", "pasuk_en": "וַיֹּאמֶר לוֹט אֲלֵהֶם אַל־נָא אֲדֹנָי׃", "rashi_he": "אל נא אדני. רַבּוֹתֵינוּ אָמְרוּ (שבועות ל\"ב) שֶׁשֵּׁם זֶה קֹדֶשׁ, שֶׁנֶּאֱמַר בּוֹ לְהַחֲיוֹת אֶת נַפְשִׁי – מִי שֶׁיֵשׁ בְּיָדוֹ לְהָמִית וּלְהַחֲיוֹת; וְתַרְגּוּמוֹ בְּבָעוּ כְעַן ה':", "rashi_en": "לפי רבותינו, \"אדני\" כאן הוא שם קודש, כי לוט אומר \"להחיות את נפשי\", ורק הקב\"ה בידו להמית ולהחיות. וכך תרגם אונקלוס.", "note": "", "points": [{"q": "אֶל מִי פּוֹנֶה לוֹט בַּמִּילָּה \"אֲדֹנָי\" לְפִי רַבּוֹתֵינוּ?", "options": ["אֶל הַקָּב\"ה, וְשֵׁם זֶה הוּא קֹודֶשׁ", "אֶל הַמַּלְאָךְ שֶׁדִּיבֵּר אִתּוֹ", "אֶל שְׁנֵי הַמַּלְאָכִים יַחַד בִּלְשׁוֹן כָּבוֹד"], "kasha": "לוט דיבר עם המלאכים, ולא ברור אם \"אדני\" הוא כינוי כבוד להם או שם קודש.", "answer": "רבותינו אמרו ששם זה קודש, שהרי נאמר בו \"להחיות את נפשי\", ורק מי שבידו להמית ולהחיות; וכן תרגם אונקלוס.", "kp": ["ששם זה קדש", "מי שיש בידו להמית ולהחיות"]}]}, {"id": "19:18.2", "ch": 19, "v": 18, "n": 2, "dh": "אל נא", "pasuk_html": "וַיֹּ֥אמֶר ל֖וֹט אֲלֵהֶ֑ם <mark>אַל־נָ֖א</mark> אֲדֹנָֽי׃", "pasuk_en": "וַיֹּאמֶר לוֹט אֲלֵהֶם אַל־נָא אֲדֹנָי׃", "rashi_he": "אל נא. אַל תֹּאמְרוּ אֵלַי לְהִמָּלֵט הָהָרָה:", "rashi_en": "\"אל נא\" פירושו: אל תאמרו לי לברוח אל ההר.", "note": "", "points": [{"q": "עַל מָה אוֹמֵר לוֹט \"אַלְנָּא\"?", "options": ["שֶׁלֹּא יֹאמְרוּ לוֹ לִבְרֹוחַ אֶל הָהָר", "שֶׁלֹּא יַהַפְכוּ אֶת הָעִיר סְדֹום", "שֶׁלֹּא יַכְרִיחוּ אוֹתוֹ לַעֲזוֹב אֶת מָמוֹנוֹ"], "kasha": "לוט אומר \"אל נא\" בלי לפרש ממה הוא מבקש להימנע.", "answer": "לוט מבקש: אל תאמרו אלי להמלט ההרה.", "kp": ["אל תאמרו אלי להמלט ההרה"]}]}, {"id": "19:18.3", "ch": 19, "v": 18, "n": 3, "dh": "נא", "pasuk_html": "וַיֹּ֥אמֶר ל֖וֹט אֲלֵהֶ֑ם אַל־<mark>נָ֖א</mark> אֲדֹנָֽי׃", "pasuk_en": "וַיֹּאמֶר לוֹט אֲלֵהֶם אַל־נָא אֲדֹנָי׃", "rashi_he": "נא. לְשׁוֹן בַּקָּשָׁה:", "rashi_en": "המילה \"נא\" כאן היא לשון בקשה.", "note": "", "points": [{"q": "מָה מַשְׁמָעוּת הַמִּילָּה \"נָא\" בַּפָּסוּק זֶה?", "options": ["לְשׁוֹן בַּקָּשָׁה", "לָשׁוֹן עַכְשָׁיו וּמִיָּד", "לְשׁוֹן אַזְהָרָה"], "kasha": "למילה \"נא\" יש כמה משמעויות, ויש לברר מה היא כאן.", "answer": "\"נא\" כאן הוא לשון בקשה.", "kp": ["לשון בקשה"]}]}, {"id": "19:19.1", "ch": 19, "v": 19, "n": 1, "dh": "פן תדבקני הרעה", "pasuk_html": "הִנֵּה־נָ֠א מָצָ֨א עַבְדְּךָ֣ חֵן֮ בְּעֵינֶיךָ֒ וַתַּגְדֵּ֣ל חַסְדְּךָ֗ אֲשֶׁ֤ר עָשִׂ֙יתָ֙ עִמָּדִ֔י לְהַחֲי֖וֹת אֶת־נַפְשִׁ֑י וְאָנֹכִ֗י לֹ֤א אוּכַל֙ לְהִמָּלֵ֣ט הָהָ֔רָה <mark>פֶּן־תִּדְבָּקַ֥נִי הָרָעָ֖ה</mark> וָמַֽתִּי׃", "pasuk_en": "הִנֵּה־נָא מָצָא עַבְדְּךָ חֵן בְּעֵינֶיךָ וַתַּגְדֵּל חַסְדְּךָ אֲשֶׁר עָשִׂיתָ עִמָּדִי לְהַחֲיוֹת אֶת־נַפְשִׁי וְאָנֹכִי לֹא אוּכַל לְהִמָּלֵט הָהָרָה פֶּן־תִּדְבָּקַנִי הָרָעָה וָמַתִּי׃", "rashi_he": "פן תדבקני הרעה. כְּשֶׁהָיִיתִי אֵצֶל אַנְשֵׁי סְדוֹם הָיָה הַקָּבָּ\"ה רוֹאֶה מַעֲשַׂי וּמַעֲשֵׂה בְנֵי הָעִיר, וְהָיִיתִי נִרְאֶה צַדִּיק וּכְדַאי לְהִנָּצֵל, וּכְשֶׁאָבֹא אֵצֶל צַדִּיק אֲנִי כְרָשָׁע, וְכֵן אָמְרָה הַצָּרְפִית לְאֵלִיָּהוּ בָּאתָ אֵלַי לְהַזְכִּיר אֶת עֲוֹנִי (מלכים א י\"ז), עַד שֶׁלֹא בָאתָ אֶצְלִי הָיָה הַקָּבָּ\"ה רוֹאֶה מַעֲשַׂי וּמַעֲשֵׂה עַמִּי, וַאֲנִי צַדֶּקֶת בֵּינֵיהֶם, וּמִשֶּׁבָּאתָ אֶצְלִי, לְפִי מַעֲשֶׂיךָ אֲנִי רְשָׁעָה:", "rashi_en": "לוט חשש שבסדום נראה צדיק לעומת אנשי העיר, אבל ליד אברהם הצדיק ייראה רשע ויענש. כך אמרה גם האשה הצרפתית לאליהו.", "note": "", "points": [{"q": "מִמַּה חָשַׁשׁ לוֹט כְּשֶׁאָמַר \"פֶּןתִּדְבָּקַנִּי הָרָעָה\" אִם יִבְרַח אֶל הָהָר?", "options": ["שֶׁלְיַד אַבְרָהָם הַצַּדִּיק יֵירָאֶה רָשָׁע וְיֵעָנֵשׁ", "שֶׁבָּהָר לֹא יִמָּצֵא מַיִם וּמָזוֹן לוֹ וְלִבְנוֹתָיו", "שֶׁהַגָּפְרִית וְהָאֵשׁ יַגִּיעוּ גַּם אֶל הָהָר"], "kasha": "המלאכים אמרו ללוט שיינצל בהר, ומדוע חשש שהרעה תדבק בו דווקא שם?", "answer": "בסדום ראה הקב\"ה את מעשיו לעומת מעשי אנשי העיר, ונראה צדיק וראוי להינצל; אבל כשיבוא אצל צדיק, ייראה כרשע.", "kp": ["והייתי נראה צדיק", "וכשאבא אצל צדיק אני כרשע"]}]}, {"id": "19:20.1", "ch": 19, "v": 20, "n": 1, "dh": "העיר הזאת קרובה", "pasuk_html": "הִנֵּה־נָ֠א <mark>הָעִ֨יר הַזֹּ֧את קְרֹבָ֛ה</mark> לָנ֥וּס שָׁ֖מָּה וְהִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּה הֲלֹ֥א מִצְעָ֛ר הִ֖וא וּתְחִ֥י נַפְשִֽׁי׃", "pasuk_en": "הִנֵּה־נָא הָעִיר הַזֹּאת קְרֹבָה לָנוּס שָׁמָּה וְהִיא מִצְעָר אִמָּלְטָה נָּא שָׁמָּה הֲלֹא מִצְעָר הִוא וּתְחִי נַפְשִׁי׃", "rashi_he": "העיר הזאת קרובה. קְרוֹבָה יְשִׁיבָתָהּ, נִתְיַשְּׁבָה מִקָּרוֹב, לְפִיכָךְ לֹא נִתְמַלְּאָה סְאָתָהּ עֲדַיִן (שבת י'). וּמַה הִיא קְרִיבָתָהּ? מִדּוֹר הַפַּלָּגָה שֶׁנִּתְפַּלְּגוּ הָאֲנָשִׁים וְהִתְחִילוּ לְהִתְיַשֵּׁב אִישׁ אִישׁ בִּמְקוֹמוֹ, וְהִיא הָיְתָה בִּשְׁנַת מוֹת פֶּלֶג, וּמִשָּׁם וְעַד כָּאן נ\"ב שָׁנָה, שֶׁפֶּלֶג מֵת בִּשְׁנַת מ\"ח לְאַבְרָהָם. כֵּיצַד? פֶּלֶג חַי אַחֲרֵי הוֹלִידוֹ אֶת רְעוּ ר\"ט שָׁנָה, צֵא מֵהֶם ל\"ב כְּשֶׁנּוֹלַד שְׂרוּג, וּמִשְּׂרוּג עַד שֶׁנּוֹלַד נָחוֹר ל', הֲרֵי ס\"ב, וּמִנָּחוֹר עַד שֶׁנּוֹלַד תֶּרַח כ\"ט, הֲרֵי צ\"א, וּמִשָּׁם עַד שֶׁנּוֹלַד אַבְרָהָם ע', הֲרֵי קס\"א, תֵּן לָהֶם מ\"ח הֲרֵי ר\"ט, וְאוֹתָה שָׁנָה הָיְתָה שְׁנַת הַפַּלָּגָה, וּכְשֶׁנֶּחְרְבָה סְדוֹם הָיָה אַבְרָהָם בֶּן צ\"ט שָׁנָה, הֲרֵי מִדּוֹר הַפַּלָּגָה עַד כָּאן נ\"ב שָׁנָה; וְצֹעַר אִחֲרָה יְשִׁיבָתָהּ אַחֲרֵי יְשִׁיבַת סְדוֹם וְחַבְרוֹתֶיהָ שָׁנָה אַחַת, הוּא שֶׁנֶּאֱמַר אִמָּלְטָה נָּא, נָא בְּגִימַטְרִיָּא נ\"א:", "rashi_en": "\"קרבה\" פירושו שהעיר נתיישבה לא מכבר, ולכן עדיין לא נתמלאה סאת עוונותיה. סדום נתיישבה בדור הפלגה, 52 שנה לפני הפיכתה, וצוער נתיישבה שנה אחת אחריה, כרמוז ב\"נא\" שבגימטריא 51.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"הָעִיר הַזֹּאת קְרֹבָה\" לְפִי רַשִׁ\"י?", "options": ["שֶׁנִּתְייַשְּׁבָה לָאַחֲרוֹנָה וַעֲדַיִין לֹא נִתְמַלְּאָה סְאָתָהּ", "שֶׁהִיא קְרוֹבָה לַמָּקוֹם שֶׁבּוֹ עָמְדוּ", "שֶׁהִיא קְרוֹבָה לִמְקוֹם מוֹשָׁבוֹ שֶׁל אַבְרָהָם"], "kasha": "מה טעם יש בטענה שהעיר קרובה, וכי בגלל קרבתה ראוי שתינצל?", "answer": "קרובה ישיבתה, כלומר נתיישבה מקרוב, ולכן לא נתמלאה סאתה עדיין.", "kp": ["נתישבה מקרוב", "לא נתמלאה סאתה עדין"]}, {"q": "מַה רָמוּז בַּמִּילָּה \"נָא\" שֶׁבַּמִּילִּים \"אִמָּלְטָה נָא שָׁמָּה\"?", "options": ["שֶׁצוֹעַר נִתְייַשְּׁבָה 51 שָׁנָה, שָׁנָה אַחַת אַחֲרֵי סְדוֹם", "שֶׁלוֹט בִּיקֵּשׁ בְּתַחִינָה וּבְלָשׁוֹן רַכָּה לְהִינָּצֵל", "שֶׁבִּצְוֹעַר הָיוּ חֲמִישִּׁים וְאֶחָד אֲנָשִׁים צַדִּיקִים"], "kasha": "המילה \"נא\" נראית מיותרת, ומה היא מוסיפה?", "answer": "צוער נתיישבה שנה אחת אחרי סדום וחברותיה, שנתיישבו 52 שנה קודם, ולכן אמר \"נא\" שבגימטריא 51.", "kp": ["אחרה ישיבתה", "נא בגימטריא נ\"א"]}]}, {"id": "19:20.2", "ch": 19, "v": 20, "n": 2, "dh": "הלא מצער היא", "pasuk_html": "הִנֵּה־נָ֠א הָעִ֨יר הַזֹּ֧את קְרֹבָ֛ה לָנ֥וּס שָׁ֖מָּה וְהִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּה <mark>הֲלֹ֥א מִצְעָ֛ר הִ֖וא</mark> וּתְחִ֥י נַפְשִֽׁי׃", "pasuk_en": "הִנֵּה־נָא הָעִיר הַזֹּאת קְרֹבָה לָנוּס שָׁמָּה וְהִיא מִצְעָר אִמָּלְטָה נָּא שָׁמָּה הֲלֹא מִצְעָר הִוא וּתְחִי נַפְשִׁי׃", "rashi_he": "הלא מצער היא. וַהֲלֹא עֲוֹנוֹתֶיהָ מוּעָטִין וְיָכוֹל אַתָּה לְהַנִּיחָהּ:", "rashi_en": "לפי המדרש, \"הלא מצער היא\" פירושו שעוונותיה של העיר מועטים, ולכן אפשר להשאיר אותה.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ, מַה פֵּירוּשׁ \"הֲלֹא מִצְעָר הִוא\"?", "options": ["עֲווֹנוֹתֶיהָ מוּעָטִים וְלָכֵן אֶפְשָׁר לְהַנִּיחָהּ", "הָעִיר רְחוֹקָה מִסְּדוֹם וְלֹא תִּיפָּגַע", "לוֹט מִצְטַעֵר מְאֹוד עַל חֻורְבַּן הָעִיר"], "kasha": "מה הטענה שבכך שהעיר \"מצער\", ומדוע זה סיבה להצילה?", "answer": "הלא עוונותיה מועטים, ויכול אתה להניחה.", "kp": ["והלא עונותיה מועטין", "ויכול אתה להניחה"]}]}, {"id": "19:20.3", "ch": 19, "v": 20, "n": 3, "dh": "ותחי נפשי", "pasuk_html": "הִנֵּה־נָ֠א הָעִ֨יר הַזֹּ֧את קְרֹבָ֛ה לָנ֥וּס שָׁ֖מָּה וְהִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּה הֲלֹ֥א מִצְעָ֛ר הִ֖וא <mark>וּתְחִ֥י נַפְשִֽׁי׃</mark>", "pasuk_en": "הִנֵּה־נָא הָעִיר הַזֹּאת קְרֹבָה לָנוּס שָׁמָּה וְהִיא מִצְעָר אִמָּלְטָה נָּא שָׁמָּה הֲלֹא מִצְעָר הִוא וּתְחִי נַפְשִׁי׃", "rashi_he": "ותחי נפשי בָּהּ, זֶהוּ מִדְרָשׁוֹ. וּפְשׁוּטוֹ שֶׁל מִקְרָא הֲלֹא עִיר קְטַנָּה הִיא וַאֲנָשִׁים בָּהּ מְעַט, אֵין לָךְ לְהַקְפִּיד אִם תַּנִּיחֶנָּה, וּתְחִי נַפְשִׁי בָהּ:", "rashi_en": "הפירוש הקודם הוא מדרש. לפי הפשט, לוט טען שצוער היא עיר קטנה ומעטים אנשיה, ולכן אין להקפיד אם תושאר, ושם יוכל לחיות.", "note": "", "points": [{"q": "לְפִי הַפְּשָׁט, מַה טָעַן לוֹט בַּמִּילִּים \"הֲלֹא מִצְעָר הִוא וּתְחִי נַפְשִׁי\"?", "options": ["הָעִיר קְטַנָּה וַאֲנָשֶׁיהָ מְעַטִּים, וְאֵין לְהַקְפִּיד אִם תּוּשָׁאֵר", "הָעִיר קְרוֹבָה וְיוּכַל לְהַגִּיעַ אֵלֶיהָ בִּמְהִירוּת", "אַנְשֵׁי הָעִיר צַדִּיקִים וְלָכֵן רָאוּי לְהַצִּילָם"], "kasha": "צריך להבין מה הקשר בין קוטנה של העיר לבין הבקשה שתינצל.", "answer": "פשוטו של מקרא: הלא עיר קטנה היא ואנשים בה מעט, אין לך להקפיד אם תניחנה, ותחי נפשי בה.", "kp": ["הלא עיר קטנה היא", "ואנשים בה מעט"]}]}, {"id": "19:21.1", "ch": 19, "v": 21, "n": 1, "dh": "גם לדבר הזה", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֔יו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔יךָ <mark>גַּ֖ם לַדָּבָ֣ר הַזֶּ֑ה</mark> לְבִלְתִּ֛י הָפְכִּ֥י אֶת־הָעִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ׃", "pasuk_en": "וַיֹּאמֶר אֵלָיו הִנֵּה נָשָׂאתִי פָנֶיךָ גַּם לַדָּבָר הַזֶּה לְבִלְתִּי הָפְכִּי אֶת־הָעִיר אֲשֶׁר דִּבַּרְתָּ׃", "rashi_he": "גם לדבר הזה. לֹא דַּיְּךָ שֶׁאַתָּה נִצָּל, אֶלָּא אַף כָּל הָעִיר אַצִּיל בִּגְלָלְךָ:", "rashi_en": "המלאך אומר ללוט: לא די שאתה ניצל, אלא גם את כל העיר אציל בגללך.", "note": "", "points": [{"q": "מַה מוֹסִיפָה הַמִּילָּה \"גַּם\" בַּמִּילִּים \"גַּם לַדָּבָר הַזֶּה\"?", "options": ["לֹא רַק לוֹט נִיצַּל, אֶלָּא גַּם הָעִיר כֻּולָּהּ בִּגְלָלוֹ", "גַּם צוֹעַר תֵּיהָפֵךְ, אַךְ בְּמוֹעֵד מְאוּחָר יוֹתֵר", "גַּם בְּנוֹתָיו הַנְּשׂוּאוֹת יִינָּצְלוּ בִּזְכוּתוֹ"], "kasha": "המילה \"גם\" מרמזת על תוספת, ויש לברר על מה היא מוסיפה.", "answer": "לא די שאתה ניצל, אלא אף כל העיר אציל בגללך.", "kp": ["לא דיך שאתה נצל", "אף כל העיר אציל בגללך"]}]}, {"id": "19:21.2", "ch": 19, "v": 21, "n": 2, "dh": "הפכי", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֔יו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔יךָ גַּ֖ם לַדָּבָ֣ר הַזֶּ֑ה לְבִלְתִּ֛י <mark>הָפְכִּ֥י</mark> אֶת־הָעִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ׃", "pasuk_en": "וַיֹּאמֶר אֵלָיו הִנֵּה נָשָׂאתִי פָנֶיךָ גַּם לַדָּבָר הַזֶּה לְבִלְתִּי הָפְכִּי אֶת־הָעִיר אֲשֶׁר דִּבַּרְתָּ׃", "rashi_he": "הפכי. הוֹפֵךְ אֲנִי, כְּמוֹ עַד בֹּאִי (בראשית מ\"ח), אַחֲרֵי רֹאִי (בראשית ט״ז:י״ג), מִדֵּי דַבְּרִי בּוֹ (ירמיהו ל\"א):", "rashi_en": "\"הפכי\" פירושו \"הופך אני\", כמו \"עד באי\", \"אחרי ראי\" ו\"מדי דברי בו\".", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילָּה \"הָפְכִּי\" לְפִי רַשִׁ\"י?", "options": ["הוֹפֵךְ אֲנִי", "הָפוּךְ אַתָּה, בִּלְשׁוֹן צִיּוּוי", "הֵם יַהַפְכוּ, בִּלְשׁוֹן רַבִּים"], "kasha": "צורת המילה \"הפכי\" אינה רגילה, ולא ברור מי הוא ההופך.", "answer": "\"הפכי\" פירושו \"הופך אני\", כמו \"עד באי\" ו\"אחרי ראי\".", "kp": ["הופך אני"]}]}, {"id": "19:22.1", "ch": 19, "v": 22, "n": 1, "dh": "כי לא אוכל לעשות", "pasuk_html": "מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּה <mark>כִּ֣י לֹ֤א אוּכַל֙ לַעֲשׂ֣וֹת</mark> דָּבָ֔ר עַד־בֹּאֲךָ֖ שָׁ֑מָּה עַל־כֵּ֛ן קָרָ֥א שֵׁם־הָעִ֖יר צֽוֹעַר׃", "pasuk_en": "מַהֵר הִמָּלֵט שָׁמָּה כִּי לֹא אוּכַל לַעֲשׂוֹת דָּבָר עַד־בֹּאֲךָ שָׁמָּה עַל־כֵּן קָרָא שֵׁם־הָעִיר צוֹעַר׃", "rashi_he": "כי לא אוכל לעשות. זֶה עָנְשָׁן שֶׁל מַלְאָכִים עַל שֶׁאָמְרוּ כִּי מַשְׁחִתִים אֲנַחְנוּ, וְתָלוּ הַדָּבָר בְּעַצְמָן, לְפִיכָך לֹא זָזוּ מִשָּׁם עַד שֶׁהֻזְקְקוּ לוֹמַר שֶׁאֵין הַדָּבָר בִּרְשׁוּתָן:", "rashi_en": "המלאכים נענשו על שאמרו \"כי משחיתים אנחנו\" ותלו את הדבר בעצמם, ולכן לא זזו משם עד שהוכרחו לומר שהדבר אינו ברשותם.", "note": "", "points": [{"q": "מַדּוּעַ אָמַר הַמַּלְאָךְ \"כִּי לֹא אוּכַל לַעֲשׂוֹת דָּבָר\"?", "options": ["זֶה עָונְשָׁם עַל שֶׁתָּלוּ אֶת הַהַשְׁחָתָה בְּעַצְמָם", "כִּי הַשֶּׁמֶשׁ עֲדַייִן לֹא זָרְחָה עַל הָאָרֶץ", "כִּי לוֹט הִתְפַּלֵּל שֶׁהָעִיר לֹא תֵּיהָפֵךְ"], "kasha": "מדוע מלאך שליח ה' אומר שאינו יכול לעשות דבר?", "answer": "זה עונשם של המלאכים על שאמרו \"כי משחתים אנחנו\" ותלו את הדבר בעצמם, ולכן הוכרחו לומר שאין הדבר ברשותם.", "kp": ["זה ענשן של מלאכים", "ותלו הדבר בעצמן"]}]}, {"id": "19:22.2", "ch": 19, "v": 22, "n": 2, "dh": "כי לא אוכל", "pasuk_html": "מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּה <mark>כִּ֣י לֹ֤א אוּכַל֙</mark> לַעֲשׂ֣וֹת דָּבָ֔ר עַד־בֹּאֲךָ֖ שָׁ֑מָּה עַל־כֵּ֛ן קָרָ֥א שֵׁם־הָעִ֖יר צֽוֹעַר׃", "pasuk_en": "מַהֵר הִמָּלֵט שָׁמָּה כִּי לֹא אוּכַל לַעֲשׂוֹת דָּבָר עַד־בֹּאֲךָ שָׁמָּה עַל־כֵּן קָרָא שֵׁם־הָעִיר צוֹעַר׃", "rashi_he": "כי לא אוכל. לְשׁוֹן יָחִיד; מִכָּאן אַתָּה לָמֵד שֶׁהָאֶחָד הוֹפֵךְ וְהָאֶחָד מַצִּיל, שֶׁאֵין ב' מַלְאָכִים נִשְׁלָחִים לְדָבָר א':", "rashi_en": "\"לא אוכל\" נאמר בלשון יחיד, ומכאן לומדים שאחד המלאכים הופך ואחד מציל, כי אין שני מלאכים נשלחים לשליחות אחת.", "note": "", "points": [{"q": "מַה לוֹמְדִים מִכָּךְ שֶׁ\"לֹא אוּכַל\" נֶאֱמַר בִּלְשׁוֹן יָחִיד?", "options": ["שֶׁאֶחָד הוֹפֵךְ וְאֶחָד מַצִּיל, כִּי אֵין שְׁנֵי מַלְאָכִים לִשְׁלִיחוּת אַחַת", "שֶׁרַק מַלְאָךְ אֶחָד יָרַד בְּפֹועַל לִסְדוֹם", "שֶׁהַמַּלְאָךְ דִּיבֵּר בִּשְׁמוֹ שֶׁל הַקב\"ה"], "kasha": "שני מלאכים באו לסדום, ומדוע המלאך מדבר בלשון יחיד?", "answer": "מכאן שאחד הופך ואחד מציל, שאין שני מלאכים נשלחים לדבר אחד.", "kp": ["לשון יחיד", "שהאחד הופך והאחד מציל"]}]}, {"id": "19:22.3", "ch": 19, "v": 22, "n": 3, "dh": "על כן קרא שם העיר צוער", "pasuk_html": "מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּה כִּ֣י לֹ֤א אוּכַל֙ לַעֲשׂ֣וֹת דָּבָ֔ר עַד־בֹּאֲךָ֖ שָׁ֑מָּה <mark>עַל־כֵּ֛ן קָרָ֥א שֵׁם־הָעִ֖יר צֽוֹעַר׃</mark>", "pasuk_en": "מַהֵר הִמָּלֵט שָׁמָּה כִּי לֹא אוּכַל לַעֲשׂוֹת דָּבָר עַד־בֹּאֲךָ שָׁמָּה עַל־כֵּן קָרָא שֵׁם־הָעִיר צוֹעַר׃", "rashi_he": "על כן קרא שם העיר צוער. עַל שֵׁם וְהִוא מִצְעָר:", "rashi_en": "העיר נקראה \"צוער\" על שם דברי לוט \"והוא מצער\", כלומר עיר קטנה.", "note": "", "points": [{"q": "עַל שֵׁם מַה נִקְרְאָה הָעִיר \"צוֹעַר\"?", "options": ["עַל שֵׁם דִּבְרֵי לוֹט שֶׁהִיא \"מִצְעָר\", כְּלוֹמַר קְטַנָּה", "עַל שֵׁם הַצַּעַר שֶׁהָיָה לְלוֹט בִּבְרִיחָתוֹ", "עַל שֵׁם הַמֶּלֶךְ הָרִאשׁוֹן שֶׁבָּנָה אוֹתָהּ"], "kasha": "הפסוק אומר \"על כן\" ויש לברר על איזה דבר הוא מוסב.", "answer": "העיר נקראה צוער על שם דברי לוט \"והוא מצער\".", "kp": ["על שם והוא מצער"]}]}, {"id": "19:24.1", "ch": 19, "v": 24, "n": 1, "dh": "וה' המטיר", "pasuk_html": "<mark>וַֽיהוָ֗ה הִמְטִ֧יר</mark> עַל־סְדֹ֛ם וְעַל־עֲמֹרָ֖ה גָּפְרִ֣ית וָאֵ֑שׁ מֵאֵ֥ת יְהוָ֖ה מִן־הַשָּׁמָֽיִם׃", "pasuk_en": "וַיהוָה הִמְטִיר עַל־סְדֹם וְעַל־עֲמֹרָה גָּפְרִית וָאֵשׁ מֵאֵת יְהוָה מִן־הַשָּׁמָיִם׃", "rashi_he": "וה' המטיר. כָּל מָקוֹם שֶׁנֶּאֱמַר וַה' – הוּא וּבֵית דִּינוֹ:", "rashi_en": "בכל מקום שנאמר \"וה'\" בוי\"ו, הכוונה להקב\"ה ובית דינו.", "note": "", "points": [{"q": "מַה מְלַמֶּדֶת הַוָּי\"ו שֶׁבַּמִּילִּים \"וַיהוָה הִמְטִיר\"?", "options": ["שֶׁהַקָּב\"ה וּבֵית דִּינוֹ הִמְטִירוּ", "שֶׁהַקָּב\"ה לְבַדּוֹ עָשָׂה בְּלִי שׁוּם שָׁלִיחַ", "שֶׁהַמַּלְאָכִים הִמְטִירוּ בִּשְׁמוֹ שֶׁל הַקב\"ה"], "kasha": "הפסוק פותח בוי\"ו מיותרת \"וה'\", ומה היא מוסיפה?", "answer": "כל מקום שנאמר \"וה'\" - הוא ובית דינו.", "kp": ["הוא ובית דינו"]}]}, {"id": "19:24.2", "ch": 19, "v": 24, "n": 2, "dh": "המטיר על סדום", "pasuk_html": "וַֽיהוָ֗ה <mark>הִמְטִ֧יר עַל־סְדֹ֛ם</mark> וְעַל־עֲמֹרָ֖ה גָּפְרִ֣ית וָאֵ֑שׁ מֵאֵ֥ת יְהוָ֖ה מִן־הַשָּׁמָֽיִם׃", "pasuk_en": "וַיהוָה הִמְטִיר עַל־סְדֹם וְעַל־עֲמֹרָה גָּפְרִית וָאֵשׁ מֵאֵת יְהוָה מִן־הַשָּׁמָיִם׃", "rashi_he": "המטיר על סדום. בַּעֲלוֹת הַשַּׁחַר, כְּמוֹ שֶׁנֶּאֱמַר וּכְמוֹ הַשַּׁחַר עָלָה, שָׁעָה שֶׁהַלְּבָנָה עוֹמֶדֶת בָּרָקִיעַ עִם הַחַמָּה, לְפִי שֶׁהָיוּ מֵהֶם עוֹבְדִין לַחַמָּה וּמֵהֶם לַלְּבָנָה, אָמַר הַקָּבָּ\"ה אִם אֶפָּרַע מֵהֶם בַּיּוֹם, יִהְיוּ עוֹבְדֵי לְבָנָה אוֹמְרִים אִלּוּ הָיָה בַלַּיְלָה, כְּשֶׁהַלְּבָנָה מוֹשֶׁלֶת, לֹא הָיִינוּ חֲרֵבִין, וְאִם אֶפָּרַע מֵהֶם בַּלַּיְלָה, יִהְיוּ עוֹבְדֵי הַחַמָּה אוֹמְרִים אִלּוּ הָיָה בַּיּוֹם, כְּשֶׁהַחַמָּה מוֹשֶׁלֶת, לֹא הָיִינוּ חֲרֵבִין; לְכָךְ כְּתִיב וּכְמוֹ הַשַּׁחַר עָלָה, וְנִפְרַע מֵהֶם בְּשָׁעָה שֶׁהַחַמָּה וְהַלְּבָנָה מוֹשְׁלוֹת:", "rashi_en": "העונש על סדום בא בעלות השחר, כשהשמש והירח נראים יחד ברקיע. כך לא יוכלו עובדי השמש ועובדי הירח לטעון שאלוהיהם היה מציל אותם אילו נענשו בשעת שלטונו.", "note": "", "points": [{"q": "מַדּוּעַ לְפִי רַשִׁ\"י נֶעֶנְשָׁה סְדוֹם דַּוְוקָא בַּעֲלוֹת הַשַּׁחַר?", "options": ["כְּדֵי שֶׁלֹּא יִטְעֲנוּ עוֹבְדֵי הַשֶּׁמֶשׁ אוֹ הַיָּרֵחַ שֶׁאֱלוֹהֵיהֶם הָיָה מַצִּילָם", "כְּדֵי שֶׁכָּל הָעוֹלָם יִרְאֶה אֶת הָעֹונֶשׁ לְאוֹר הַיּוֹם", "כְּדֵי שֶׁלּוֹט יַסְפִּיק לְהַגִּיעַ לְצוֹעַר לִפְנֵי הַהֲפִיכָה"], "kasha": "מדוע הדגיש הכתוב שהעונש התרחש בשעה מסוימת, \"וכמו השחר עלה\"?", "answer": "בעלות השחר השמש והירח מושלים יחד, ולכן אף אחת מקבוצות עובדי העבודה זרה לא תוכל לומר שאילו נענשו בשעת שלטון אלוהיה לא היו חרבים.", "kp": ["בעלות השחר", "שעה שהלבנה עומדת ברקיע עם החמה", "בשעה שהחמה והלבנה מושלות"]}]}, {"id": "19:24.3", "ch": 19, "v": 24, "n": 3, "dh": "המטיר גפרית ואש", "pasuk_html": "וַֽיהוָ֗ה הִמְטִ֧יר עַל־סְדֹ֛ם וְעַל־<mark>עֲמֹרָ֖ה גָּפְרִ֣ית וָאֵ֑שׁ</mark> מֵאֵ֥ת יְהוָ֖ה מִן־הַשָּׁמָֽיִם׃", "pasuk_en": "וַיהוָה הִמְטִיר עַל־סְדֹם וְעַל־עֲמֹרָה גָּפְרִית וָאֵשׁ מֵאֵת יְהוָה מִן־הַשָּׁמָיִם׃", "rashi_he": "המטיר גפרית ואש. בַּתְּחִלָּה מָטָר, וְנַעֲשָׂה גָּפְרִית וָאֵשׁ:", "rashi_en": "בתחילה ירד גשם רגיל, ורק אחר כך הפך לגפרית ואש.", "note": "", "points": [{"q": "מַה מְלַמֵּד רַשִׁ\"י מֵהַמִּילָּה \"הִמְטִיר\" בְּיַחַס לְגָפְרִית וָאֵשׁ?", "options": ["בְּתַחִילָּה יָרַד מָטָר, וְאַחַר כָּךְ נֶהְפַּךְ לְגָפְרִית וָאֵשׁ", "הַגָּפְרִית וְהָאֵשׁ יָרְדוּ בְּכַמּוּת גְּדוֹלָה כְּמוֹ מָטָר", "הַגָּפְרִית יָרְדָה תְּחִילָּה וְאַחֲרֶיהָ יָרַד מָטָר שֶׁל אֵשׁ"], "kasha": "מדוע נאמר לשון \"המטיר\", שמתאים לגשם, על גפרית ואש?", "answer": "בתחילה היה זה מטר, ובהמשך נעשה גפרית ואש.", "kp": ["בתחלה מטר", "ונעשה גפרית ואש"]}]}, {"id": "19:24.4", "ch": 19, "v": 24, "n": 4, "dh": "מאת ה'", "pasuk_html": "וַֽיהוָ֗ה הִמְטִ֧יר עַל־סְדֹ֛ם וְעַל־עֲמֹרָ֖ה גָּפְרִ֣ית וָאֵ֑שׁ <mark>מֵאֵ֥ת יְהוָ֖ה</mark> מִן־הַשָּׁמָֽיִם׃", "pasuk_en": "וַיהוָה הִמְטִיר עַל־סְדֹם וְעַל־עֲמֹרָה גָּפְרִית וָאֵשׁ מֵאֵת יְהוָה מִן־הַשָּׁמָיִם׃", "rashi_he": "מאת ה'. דֶּרֶךְ הַמִּקְרָאוֹת לְדַבֵּר כֵּן, כְּמוֹ נְשֵׁי לֶמֶךְ, וְלֹא אָמַר נָשַׁי; וְכֵן אָמַר דָּוִד קְחוּ עִמָּכֶם אֶת עַבְדֵי אֲדֹנֵיכֶם (מלכים א א'), וְלֹא אָמַר מֵעֲבָדַי; וְכֵן אֲחַשְׁוֵרוֹשׁ אָמַר בְּשֵׁם הַמֶּלֶךְ, וְלֹא אָמַר בִּשְׁמִי; אַף כָּאן אָמַר, מֵאֵת ה' וְלֹא אָמַר מֵאִתִּי:", "rashi_en": "הכתוב אומר \"מאת ה'\" במקום \"מאתי\", כי כך דרך המקרא: המדבר מזכיר את עצמו בשמו, כמו למך שאמר \"נשי למך\" ואחשורוש שאמר \"בשם המלך\".", "note": "", "points": [{"q": "מַדּוּעַ נֶאֱמַר \"מֵאֵת יְהוָה\" וְלֹא \"מֵאִתּוֹ\", אִם ה' הוּא עַצְמוֹ הַמַּמְטִיר?", "options": ["כָּךְ דֶּרֶךְ הַמִּקְרָא, שֶׁהַמְּדַבֵּר מַזְכִּיר אֶת עַצְמוֹ בִּשְׁמוֹ", "כִּי הַמַּלְאָךְ הוּא שֶׁהִמְטִיר בִּשְׁלִיחוּת ה'", "כְּדֵי לְלַמֵּד שֶׁבֵּית דִּין שֶׁל מַעְלָה הִסְכִּים לָעֹונֶשׁ"], "kasha": "הפסוק פותח ב\"ויהוה המטיר\" ומסיים \"מאת יהוה\", ולכאורה היה צריך לומר \"מאתו\".", "answer": "כך דרך המקראות לדבר, כמו \"נשי למך\" ולא \"נשי\", \"עבדי אדניכם\" ולא \"עבדי\", ו\"בשם המלך\" ולא \"בשמי\".", "kp": ["דרך המקראות לדבר כן", "ולא אמר מאתי"]}]}, {"id": "19:24.5", "ch": 19, "v": 24, "n": 5, "dh": "מן השמים", "pasuk_html": "וַֽיהוָ֗ה הִמְטִ֧יר עַל־סְדֹ֛ם וְעַל־עֲמֹרָ֖ה גָּפְרִ֣ית וָאֵ֑שׁ מֵאֵ֥ת יְהוָ֖ה <mark>מִן־הַשָּׁמָֽיִם׃</mark>", "pasuk_en": "וַיהוָה הִמְטִיר עַל־סְדֹם וְעַל־עֲמֹרָה גָּפְרִית וָאֵשׁ מֵאֵת יְהוָה מִן־הַשָּׁמָיִם׃", "rashi_he": "מן השמים. הוּא שֶׁאָמַר הַכָּתוּב כִּי בָם יָדִין עַמִּים וְגוֹ' (איוב ל\"ו), כְּשֶׁבָּא לְיַסֵּר הֵבְּרִיוֹת מֵבִיא עֲלֵיהֶם אֵשׁ מִן הַשָּׁמַיִם, כְּמוֹ שֶׁעָשָׂה לִסְדוֹם, וּכְשֶׁבָּא לְהוֹרִיד הַמָּן מִן הַשָּׁמַיִם הִנְנִי מַמְטִיר לָכֶם לֶחֶם מִן הַשָּׁמָיִם (שמות ט\"ז):", "rashi_en": "מן השמים ה' מביא גם עונש וגם טובה: כשהוא מעניש, הוא מוריד אש מן השמים כמו בסדום, וכשהוא מיטיב, הוא מוריד מן מן השמים.", "note": "", "points": [{"q": "מַה מְלַמֵּד רַשִׁ\"י מֵהַמִּילִּים \"מִן הַשָּׁמַיִם\"?", "options": ["מִן הַשָּׁמַיִם ה' מֵבִיא גַּם פֻּורְעָנוּת וְגַם טוֹבָה, כְּמוֹ הַמָּן", "הָאֵשׁ לֹא בָּאָה מֵהָאֲדָמָה אֶלָּא יָרְדָה מִלְמַעְלָה", "שֶׁהָעֹונֶשׁ נִגְזַר עַל סְדוֹם בְּבֵית דִּין שֶׁל מַעְלָה"], "kasha": "מדוע הוסיף הכתוב \"מן השמים\", והרי ברור שמטר יורד מן השמים?", "answer": "כפי שנאמר \"כי בם ידין עמים\": כשה' בא לייסר את הבריות הוא מביא עליהם אש מן השמים, כמו בסדום, וכשהוא בא להוריד את המן, גם הוא מן השמים.", "kp": ["מביא עליהם אש מן השמים", "הנני ממטיר לכם לחם מן השמים"]}]}, {"id": "19:25.1", "ch": 19, "v": 25, "n": 1, "dh": "ויהפך את הערים וגו'", "pasuk_html": "<mark>וַֽיַּהֲפֹךְ֙ אֶת־הֶעָרִ֣ים</mark> הָאֵ֔ל וְאֵ֖ת כָּל־הַכִּכָּ֑ר וְאֵת֙ כָּל־יֹשְׁבֵ֣י הֶעָרִ֔ים וְצֶ֖מַח הָאֲדָמָֽה׃", "pasuk_en": "וַיַּהֲפֹךְ אֶת־הֶעָרִים הָאֵל וְאֵת כָּל־הַכִּכָּר וְאֵת כָּל־יֹשְׁבֵי הֶעָרִים וְצֶמַח הָאֲדָמָה׃", "rashi_he": "ויהפך את הערים וגו'. אַרְבַּעְתָּם יוֹשְׁבוֹת בְּסֶלַע אֶחָד וַהֲפָכָן מִלְמַעְלָה לְמַטָּה, שֶׁנֶּאֱמַר בַּחַלָּמִישׁ שָׁלַח יָדוֹ וְגוֹ' (איוב כ'):", "rashi_en": "ארבע הערים היו בנויות על סלע אחד, וה' הפך את כולן יחד מלמעלה למטה.", "note": "", "points": [{"q": "כֵּיצַד מְתָאֵר רַשִׁ\"י אֶת הֲפִיכַת הֶעָרִים?", "options": ["אַרְבַּעְתָּן יָשְׁבוּ עַל סֶלַע אֶחָד, וַה' הָפַךְ אוֹתוֹ מִלְּמַעְלָה לְמַטָּה", "כָּל עִיר נִשְׂרְפָה בְּנִפְרָד וְאַחַר כָּךְ נִבְלְעָה בָּאֲדָמָה", "הֶעָרִים נֶהֶרְסוּ בִּרְעִידַת אֲדָמָה שֶׁפָּגְעָה בְּכָל הַכִּכָּר"], "kasha": "מה פירוש \"ויהפך\", וכיצד נהפכו כמה ערים יחד בבת אחת?", "answer": "ארבע הערים היו יושבות על סלע אחד, וה' הפך אותן מלמעלה למטה, כמו שנאמר \"בחלמיש שלח ידו\".", "kp": ["ארבעתם יושבות בסלע אחד", "והפכן מלמעלה למטה"]}]}, {"id": "19:26.1", "ch": 19, "v": 26, "n": 1, "dh": "ותבט אשתו מאחריו", "pasuk_html": "<mark>וַתַּבֵּ֥ט אִשְׁתּ֖וֹ מֵאַחֲרָ֑יו</mark> וַתְּהִ֖י נְצִ֥יב מֶֽלַח׃", "pasuk_en": "וַתַּבֵּט אִשְׁתּוֹ מֵאַחֲרָיו וַתְּהִי נְצִיב מֶלַח׃", "rashi_he": "ותבט אשתו מאחריו. שֶׁל לוֹט:", "rashi_en": "אשתו הביטה אל מאחורי לוט, כלומר לעבר העיר שנחרבה מאחוריו.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, \"מֵאַחֲרָיו\" שֶׁל מִי?", "options": ["מֵאַחֲרֵי לוֹט", "מֵאַחֲרֵי הַמַּלְאָךְ שֶׁהוֹצִיא אוֹתָם", "מֵאַחֲרֵי הָעִיר סְדֹום"], "kasha": "המילה \"מאחריו\" אינה מפרשת על מי מדובר.", "answer": "מאחריו של לוט.", "kp": ["של לוט"]}]}, {"id": "19:26.2", "ch": 19, "v": 26, "n": 2, "dh": "ותהי נציב מלח", "pasuk_html": "וַתַּבֵּ֥ט אִשְׁתּ֖וֹ מֵאַחֲרָ֑יו <mark>וַתְּהִ֖י נְצִ֥יב מֶֽלַח׃</mark>", "pasuk_en": "וַתַּבֵּט אִשְׁתּוֹ מֵאַחֲרָיו וַתְּהִי נְצִיב מֶלַח׃", "rashi_he": "ותהי נציב מלח. בְּמֶלַח חָטְאָה וּבְמֶלַח לָקְתָה; אָמַר לָהּ תְּנִי מְעַט מֶלַח לָאוֹרְחִים הַלָּלוּ, אָמְרָה לוֹ אַף הַמִּנְהָג הָרַע הַזֶּה אַתָּה בָא לְהַנְהִיג בַּמָּקוֹם הַזֶּה (בראשית רבה):", "rashi_en": "אשת לוט חטאה במלח ונענשה במלח: כשלוט ביקש ממנה לתת מלח לאורחים, היא סירבה ואמרה שאין להנהיג מנהג רע זה של הכנסת אורחים.", "note": "", "points": [{"q": "מַדּוּעַ נֶעֶנְשָׁה אֵשֶׁת לוֹט דַּווְקָא בְּכָךְ שֶׁנֶּהְפְּכָה לְנְצִיב מֶלַח?", "options": ["כִּי חָטְאָה בַּמֶּלַח, כְּשֶׁסֵּירְבָה לָתֵת מֶלַח לָאוֹרְחִים", "כִּי הַמֶּלַח שֶׁיָּרַד עַל סְדֹום כִּיסָּה אוֹתָהּ כְּשֶׁהִבִּיטָה", "כִּי הִבִּיטָה לְאָחוֹר אֶל יַם הַמֶּלַח שֶׁנּוֹצַר שָׁם"], "kasha": "מדוע נבחר עבורה דווקא עונש של מלח?", "answer": "במלח חטאה ובמלח לקתה: לוט אמר לה לתת מעט מלח לאורחים, והיא אמרה לו שגם את המנהג הרע הזה הוא בא להנהיג במקום.", "kp": ["במלח חטאה ובמלח לקתה", "תני מעט מלח לאורחים הללו"]}]}, {"id": "19:28.1", "ch": 19, "v": 28, "n": 1, "dh": "קיטור", "pasuk_html": "וַיַּשְׁקֵ֗ף עַל־פְּנֵ֤י סְדֹם֙ וַעֲמֹרָ֔ה וְעַֽל־כָּל־פְּנֵ֖י אֶ֣רֶץ הַכִּכָּ֑ר וַיַּ֗רְא וְהִנֵּ֤ה עָלָה֙ <mark>קִיטֹ֣ר</mark> הָאָ֔רֶץ כְּקִיטֹ֖ר הַכִּבְשָֽׁן׃", "pasuk_en": "וַיַּשְׁקֵף עַל־פְּנֵי סְדֹם וַעֲמֹרָה וְעַל־כָּל־פְּנֵי אֶרֶץ הַכִּכָּר וַיַּרְא וְהִנֵּה עָלָה קִיטֹר הָאָרֶץ כְּקִיטֹר הַכִּבְשָׁן׃", "rashi_he": "קיטור. תִּמּוּר שֶׁל עָשָׁן, טורק\"א בלע\"ז:", "rashi_en": "קיטור פירושו עמוד של עשן המתמר ועולה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"קִיטֹר\" לְפִי רַשִׁ\"י?", "options": ["עַמּוּד שֶׁל עָשָׁן הָעוֹלֶה לְמַעְלָה", "אֵדִים שֶׁל מַיִם רוֹתְחִים", "רֵיחַ שֶׁל קְטֹורֶת שְׂרוּפָה"], "kasha": "המילה \"קיטר\" אינה מילה רגילה וצריך לפרשה.", "answer": "קיטור הוא תמרה של עשן, כלומר עמוד עשן.", "kp": ["תמור של עשן"]}]}, {"id": "19:28.2", "ch": 19, "v": 28, "n": 2, "dh": "הכבשן", "pasuk_html": "וַיַּשְׁקֵ֗ף עַל־פְּנֵ֤י סְדֹם֙ וַעֲמֹרָ֔ה וְעַֽל־כָּל־פְּנֵ֖י אֶ֣רֶץ הַכִּכָּ֑ר וַיַּ֗רְא וְהִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָאָ֔רֶץ כְּקִיטֹ֖ר <mark>הַכִּבְשָֽׁן׃</mark>", "pasuk_en": "וַיַּשְׁקֵף עַל־פְּנֵי סְדֹם וַעֲמֹרָה וְעַל־כָּל־פְּנֵי אֶרֶץ הַכִּכָּר וַיַּרְא וְהִנֵּה עָלָה קִיטֹר הָאָרֶץ כְּקִיטֹר הַכִּבְשָׁן׃", "rashi_he": "הכבשן. חֲפִירָה שֶׁשּׂוֹרְפִין בָּה אֶת הָאֲבָנִים לְסִיד, וְכֵן כָּל כִּבְשָׁן שֶׁבַּתּוֹרָה:", "rashi_en": "כבשן הוא בור חפור ששורפים בו אבנים כדי להפיק סיד, וכך פירושו בכל מקום בתורה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"הַכִּבְשָׁן\" לְפִי רַשִׁ\"י?", "options": ["חֲפִירָה שֶׁשּׂוֹרְפִים בָּהּ אֲבָנִים כְּדֵי לַעֲשׂוֹת סִיד", "תַּנּוּר גָּדוֹל שֶׁאוֹפִים בּוֹ לֶחֶם לָרַבִּים", "כּוּר שֶׁמַּתִּיכִים בּוֹ מַתָּכוֹת כֶּסֶף וְזָהָב"], "kasha": "צריך לבאר מהו כבשן, כדי להבין את הדימוי של העשן.", "answer": "כבשן הוא חפירה ששורפים בה את האבנים לסיד, וכך פירושו בכל התורה.", "kp": ["חפירה ששורפין בה את האבנים לסיד", "וכן כל כבשן שבתורה"]}]}, {"id": "19:29.1", "ch": 19, "v": 29, "n": 1, "dh": "ויזכור אלהים את אברהם", "pasuk_html": "וַיְהִ֗י בְּשַׁחֵ֤ת אֱלֹהִים֙ אֶת־עָרֵ֣י הַכִּכָּ֔ר <mark>וַיִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת־אַבְרָהָ֑ם</mark> וַיְשַׁלַּ֤ח אֶת־לוֹט֙ מִתּ֣וֹךְ הַהֲפֵכָ֔ה בַּהֲפֹךְ֙ אֶת־הֶ֣עָרִ֔ים אֲשֶׁר־יָשַׁ֥ב בָּהֵ֖ן לֽוֹט׃", "pasuk_en": "וַיְהִי בְּשַׁחֵת אֱלֹהִים אֶת־עָרֵי הַכִּכָּר וַיִּזְכֹּר אֱלֹהִים אֶת־אַבְרָהָם וַיְשַׁלַּח אֶת־לוֹט מִתּוֹךְ הַהֲפֵכָה בַּהֲפֹךְ אֶת־הֶעָרִים אֲשֶׁר־יָשַׁב בָּהֵן לוֹט׃", "rashi_he": "ויזכור אלהים את אברהם. מַהוּ זְכִירָתוֹ שֶׁל אַבְרָהָם עַל לוֹט? נִזְכַּר שֶׁהָיָה לוֹט יוֹדֵעַ שֶׁשָּׂרָה אִשְׁתּוֹ שֶׁל אַבְרָהָם וְשָׁמַע שֶׁאָמַר אַבְרָהָם בְּמִצְרַיִם עַל שָׂרָה אֲחוֹתִי הִיא, וְלֹא גִלָּה הַדָּבָר, שֶׁהָיָה חָס עָלָיו, לְפִיכָךְ חָס הַקָּבָּ\"ה עָלָיו (בראשית רבה):", "rashi_en": "ה' הציל את לוט בזכות מה שעשה לאברהם: לוט ידע ששרה אשת אברהם, ובמצרים לא גילה זאת כשאברהם אמר שהיא אחותו, ולכן ה' חס עליו.", "note": "", "points": [{"q": "מַה הַקֶּשֶׁר בֵּין \"וַיִּזְכֹּר אֱלֹהִים אֶתאַבְרָהָם\" לְהַצָּלַת לוֹט?", "options": ["לוֹט לֹא גִּילָּה בְּמִצְרַיִם שֶׁשָׂרָה אֵשֶׁת אַבְרָהָם, וְלָכֵן ה' חָס עָלָיו", "אַבְרָהָם הִתְפַּלֵּל עַל לוֹט, וַה' זָכַר אֶת תְּפִילָּתוֹ", "ה' זָכַר אֶת הַבְטָחָתוֹ לְאַבְרָהָם לִשְׁמֹור עַל כָּל מִשְׁפַּחְתּוֹ"], "kasha": "מדוע נאמר שה' זכר את אברהם, כשההצלה הייתה של לוט?", "answer": "ה' זכר שלוט ידע ששרה אשת אברהם, ושמע את אברהם אומר במצרים \"אחתי היא\", ולא גילה את הדבר כי חס עליו; לכן חס ה' על לוט.", "kp": ["מהו זכירתו של אברהם על לוט", "ולא גלה הדבר", "שהיה חס עליו"]}]}, {"id": "19:30.1", "ch": 19, "v": 30, "n": 1, "dh": "כי ירא לשבת בצוער", "pasuk_html": "וַיַּעַל֩ ל֨וֹט מִצּ֜וֹעַר וַיֵּ֣שֶׁב בָּהָ֗ר וּשְׁתֵּ֤י בְנֹתָיו֙ עִמּ֔וֹ <mark>כִּ֥י יָרֵ֖א לָשֶׁ֣בֶת בְּצ֑וֹעַר</mark> וַיֵּ֙שֶׁב֙ בַּמְּעָרָ֔ה ה֖וּא וּשְׁתֵּ֥י בְנֹתָֽיו׃", "pasuk_en": "וַיַּעַל לוֹט מִצּוֹעַר וַיֵּשֶׁב בָּהָר וּשְׁתֵּי בְנֹתָיו עִמּוֹ כִּי יָרֵא לָשֶׁבֶת בְּצוֹעַר וַיֵּשֶׁב בַּמְּעָרָה הוּא וּשְׁתֵּי בְנֹתָיו׃", "rashi_he": "כי ירא לשבת בצוער. לְפִי שֶׁהָיְתָה קְרוֹבָה לִסְדוֹם:", "rashi_en": "לוט פחד לשבת בצוער מפני שהיא הייתה קרובה לסדום.", "note": "", "points": [{"q": "מַדּוּעַ פָּחַד לוֹט לָשֶׁבֶת בְּצוֹעַר, אַף שֶׁהִיא נִיצְּלָה מִן הַהֲפִיכָה?", "options": ["כִּי צוֹעַר הָייְתָה קְרוֹבָה לִסְדוֹם", "כִּי אַנְשֵׁי צוֹעַר הָיוּ רְשָׁעִים כְּאַנְשֵׁי סְדוֹם", "כִּי חָשַׁש שֶׁבְּנוֹתָיו יִינָּשְׂאוּ לְאַנְשֵׁי צוֹעַר"], "kasha": "לוט עצמו ביקש להינצל לצוער, ומדוע עכשיו הוא ירא לשבת בה?", "answer": "מפני שהיא הייתה קרובה לסדום.", "kp": ["לפי שהיתה קרובה לסדום"]}]}, {"id": "19:31.1", "ch": 19, "v": 31, "n": 1, "dh": "אבינו זקן", "pasuk_html": "וַתֹּ֧אמֶר הַבְּכִירָ֛ה אֶל־הַצְּעִירָ֖ה <mark>אָבִ֣ינוּ זָקֵ֑ן</mark> וְאִ֨ישׁ אֵ֤ין בָּאָ֙רֶץ֙ לָב֣וֹא עָלֵ֔ינוּ כְּדֶ֖רֶךְ כָּל־הָאָֽרֶץ׃", "pasuk_en": "וַתֹּאמֶר הַבְּכִירָה אֶל־הַצְּעִירָה אָבִינוּ זָקֵן וְאִישׁ אֵין בָּאָרֶץ לָבוֹא עָלֵינוּ כְּדֶרֶךְ כָּל־הָאָרֶץ׃", "rashi_he": "אבינו זקן. וְאִם לֹא עַכְשָׁו אֵימָתַי? שֶׁמָּא יָמוּת אוֹ יִפְסֹק מֵהוֹלִיד:", "rashi_en": "הבכירה אמרה שאביהן זקן, ואם לא יעשו זאת עכשיו, ייתכן שימות או יפסיק להוליד.", "note": "", "points": [{"q": "מַדּוּעַ הִזְכִּירָה הַבְּכִירָה דַּוְוקָא שֶׁ\"אָבִינוּ זָקֵן\"?", "options": ["אִם לֹא עַכְשָׁיו, אוּלַי יָמוּת אוֹ יַפְסִיק לְהוֹלִיד", "כִּי זָקֵן אֵינוֹ מַבְחִין בְּמַה שֶּׁקּוֹרֶה סְבִיבוֹ", "כִּי זָקֵן צָרִיךְ שֶׁבְּנוֹתָיו יִדְאֲגוּ לְכָל צְרָכָיו"], "kasha": "מה הקשר בין זקנת אביהן לבין התוכנית שלהן?", "answer": "אם לא עכשיו, אימתי? שמא ימות או יפסיק מלהוליד.", "kp": ["ואם לא עכשו אימתי", "שמא ימות או יפסק מהוליד"]}]}, {"id": "19:31.2", "ch": 19, "v": 31, "n": 2, "dh": "ואיש אין בארץ", "pasuk_html": "וַתֹּ֧אמֶר הַבְּכִירָ֛ה אֶל־הַצְּעִירָ֖ה אָבִ֣ינוּ זָקֵ֑ן <mark>וְאִ֨ישׁ אֵ֤ין בָּאָ֙רֶץ֙</mark> לָב֣וֹא עָלֵ֔ינוּ כְּדֶ֖רֶךְ כָּל־הָאָֽרֶץ׃", "pasuk_en": "וַתֹּאמֶר הַבְּכִירָה אֶל־הַצְּעִירָה אָבִינוּ זָקֵן וְאִישׁ אֵין בָּאָרֶץ לָבוֹא עָלֵינוּ כְּדֶרֶךְ כָּל־הָאָרֶץ׃", "rashi_he": "ואיש אין בארץ. סְבוּרוֹת הָיוּ שֶׁכָּל הָעוֹלָם נֶחֱרַב כְּמוֹ בְּדוֹר הַמַּבּוּל: (בראשית רבה):", "rashi_en": "הבנות חשבו שכל העולם נחרב, כמו בדור המבול, ולכן אמרו שאין איש בארץ.", "note": "", "points": [{"q": "מַדּוּעַ אָמְרוּ הַבָּנוֹת \"וְאִישׁ אֵין בָּאָרֶץ\", וַהֲרֵי בְּצוֹעַר הָיוּ אֲנָשִׁים?", "options": ["הֵן חָשְׁבוּ שֶׁכָּל הָעוֹלָם נֶחֱרַב כְּמוֹ בְּדוֹר הַמַּבּוּל", "הֵן הִתְכַּוְּונוּ שֶׁאֵין אִישׁ רָאוּי לָהֶן בַּסְּבִיבָה", "הֵן יָדְעוּ שֶׁאַנְשֵׁי צוֹעַר בָּרְחוּ מִן הָעִיר"], "kasha": "הלוא העולם היה מלא אנשים, ואף הן עצמן היו בצוער.", "answer": "הן היו סבורות שכל העולם נחרב, כמו שקרה בדור המבול.", "kp": ["שכל העולם נחרב כמו בדור המבול"]}]}, {"id": "19:33.1", "ch": 19, "v": 33, "n": 1, "dh": "ותשקין וגו'", "pasuk_html": "<mark>וַתַּשְׁקֶ֧יןָ</mark> אֶת־אֲבִיהֶ֛ן יַ֖יִן בַּלַּ֣יְלָה ה֑וּא וַתָּבֹ֤א הַבְּכִירָה֙ וַתִּשְׁכַּ֣ב אֶת־אָבִ֔יהָ וְלֹֽא־יָדַ֥ע בְּשִׁכְבָ֖הּ וּבְקׄוּמָֽהּ׃", "pasuk_en": "וַתַּשְׁקֶיןָ אֶת־אֲבִיהֶן יַיִן בַּלַּיְלָה הוּא וַתָּבֹא הַבְּכִירָה וַתִּשְׁכַּב אֶת־אָבִיהָ וְלֹא־יָדַע בְּשִׁכְבָהּ וּבְקוּמָהּ׃", "rashi_he": "ותשקין וגו'. יַיִן נִזְדַּמֵּן לָהֶן בַּמְּעָרָה לְהוֹצִיא מֵהֶן שְׁנֵי אֻמּוֹת:", "rashi_en": "היין נזדמן להן במערה בדרך נס, כדי שייצאו מהן שתי אומות.", "note": "", "points": [{"q": "מֵאַיִן הָיָה לִבְנוֹת לוֹט יַיִן בַּמְּעָרָה?", "options": ["הַיַּיִן נִזְדַּמֵּן לָהֶן שָׁם כְּדֵי שֶׁיֵּיצְאוּ מֵהֶן שְׁתֵּי אֻומּוֹת", "הֵן הֵבִיאוּ יַיִן מִסְּדוֹם כְּשֶׁבָּרְחוּ מִשָּׁם", "הֵן קָנוּ יַיִן בְּצוֹעַר לִפְנֵי שֶׁעָלוּ לָהָר"], "kasha": "מנין היה להן יין במערה, אחרי שנמלטו מן העיר בחופזה?", "answer": "יין נזדמן להן במערה, כדי שייצאו מהן שתי אומות.", "kp": ["יין נזדמן להן במערה", "להוציא מהן שני אמות"]}]}, {"id": "19:33.2", "ch": 19, "v": 33, "n": 2, "dh": "ותשכב את אביה", "pasuk_html": "וַתַּשְׁקֶ֧יןָ אֶת־אֲבִיהֶ֛ן יַ֖יִן בַּלַּ֣יְלָה ה֑וּא וַתָּבֹ֤א הַבְּכִירָה֙ <mark>וַתִּשְׁכַּ֣ב אֶת־אָבִ֔יהָ</mark> וְלֹֽא־יָדַ֥ע בְּשִׁכְבָ֖הּ וּבְקׄוּמָֽהּ׃", "pasuk_en": "וַתַּשְׁקֶיןָ אֶת־אֲבִיהֶן יַיִן בַּלַּיְלָה הוּא וַתָּבֹא הַבְּכִירָה וַתִּשְׁכַּב אֶת־אָבִיהָ וְלֹא־יָדַע בְּשִׁכְבָהּ וּבְקוּמָהּ׃", "rashi_he": "ותשכב את אביה. וּבַצְּעִירָה כְתִיב וַתִּשְׁכַּב עִמּוֹ? צְעִירָה, לְפִי שֶׁלֹּא פָּתְחָה בִזְנוּת אֶלָּא אֲחוֹתָהּ לִמְּדַתָּה חָסַךְ עָלֶיהָ הַכָּתוּב וְלֹא פֵּרֵשׁ גְּנוּתָהּ; אֲבָל בְּכִירָה שֶׁפָּתְחָה בִזְנוּת פִּרְסְמָהּ הַכָּתוּב בִּמְפֹרָשׁ.", "rashi_en": "אצל הבכירה כתוב במפורש \"ותשכב את אביה\", ואצל הצעירה רק \"ותשכב עמו\". הצעירה לא התחילה בדבר אלא למדה מאחותה, ולכן הכתוב חס עליה ולא פרסם את גנותה.", "note": "", "points": [{"q": "מַדּוּעַ אֵצֶל הַבְּכִירָה נֶאֱמַר \"וַתִּשְׁכַּב אֶתאָבִיהָ\" וְאֵצֶל הַצְּעִירָה רַק \"עִמּוֹ\"?", "options": ["הַבְּכִירָה פָּתְחָה בַּדָּבָר, וְהַצְּעִירָה רַק לָמְדָה מִמֶּנָּה", "הַבְּכִירָה הָייְתָה גְּדוֹלָה וְלָכֵן אַשְׁמָתָהּ חֲמוּרָה יוֹתֵר", "הַצְּעִירָה לֹא יָדְעָה שֶׁמְדֻובָּר בְּאָבִיהָ"], "kasha": "מדוע הכתוב משנה בלשונו בין שתי הבנות?", "answer": "הצעירה לא פתחה בזנות אלא אחותה לימדה אותה, ולכן חסך עליה הכתוב ולא פירש את גנותה; אבל את הבכירה, שפתחה בזנות, פרסם הכתוב במפורש.", "kp": ["חסך עליה הכתוב ולא פרש גנותה", "פרסמה הכתוב במפרש"]}]}, {"id": "19:33.3", "ch": 19, "v": 33, "n": 3, "dh": "ובקומה", "pasuk_html": "וַתַּשְׁקֶ֧יןָ אֶת־אֲבִיהֶ֛ן יַ֖יִן בַּלַּ֣יְלָה ה֑וּא וַתָּבֹ֤א הַבְּכִירָה֙ וַתִּשְׁכַּ֣ב אֶת־אָבִ֔יהָ וְלֹֽא־יָדַ֥ע בְּשִׁכְבָ֖הּ <mark>וּבְקׄוּמָֽהּ׃</mark>", "pasuk_en": "וַתַּשְׁקֶיןָ אֶת־אֲבִיהֶן יַיִן בַּלַּיְלָה הוּא וַתָּבֹא הַבְּכִירָה וַתִּשְׁכַּב אֶת־אָבִיהָ וְלֹא־יָדַע בְּשִׁכְבָהּ וּבְקוּמָהּ׃", "rashi_he": "ובקומה. שֶׁל בְּכִירָה נָקוּד, לוֹמַר, שֶׁבְּקוּמָהּ יָדַע, וְאַעַפּ\"כֵ לֹא נִשְׁמַר לַיִל שֵׁנִי מִלִּשְׁתּוֹת. אָמַר רַבִּי לֵוִי כָּל מִי שֶׁהוּא לָהוּט אַחַר בּוּלְמוּס שֶׁל עֲרָיוֹת לַסּוֹף מַאֲכִילִים אוֹתוֹ מִבְּשָׂרוֹ:", "rashi_en": "על המילה \"ובקומה\" של הבכירה יש נקודה, ללמד שכשקמה לוט ידע מה קרה, ובכל זאת לא נזהר מלשתות בלילה השני.", "note": "", "points": [{"q": "מָה מְלַמֶּדֶת הַנְּקֻודָּה עַל \"וּבְקוּמָהּ\" אֵצֶל הַבְּכִירָה?", "options": ["שֶׁבְּקוּמָהּ לוֹט יָדַע, וּבְכָל זֹאת שָׁתָה שׁוּב בַּלַּיְלָה הַשֵּׁנִי", "שֶׁהַבְּכִירָה קָמָה מִיָּד וְלֹא נִשְׁאֲרָה עַד הַבֹּוקֶר", "שֶׁלוֹט לֹא יָדַע כְּלָל, לֹא בְּשִׁכְבָהּ וְלֹא בְּקוּמָהּ"], "kasha": "הכתוב אומר שלוט לא ידע, אך המילה \"ובקומה\" מנוקדת, כאילו לומר שיש לדרוש בה משהו.", "answer": "הנקודה באה ללמד שבקומה ידע, ואף על פי כן לא נשמר בליל שני מלשתות. ורבי לוי אמר שמי שלהוט אחר תאוות עריות, לסוף מאכילים אותו מבשרו.", "kp": ["של בכירה נקוד", "שבקומה ידע", "לא נשמר ליל שני מלשתות"]}]}, {"id": "19:36.1", "ch": 19, "v": 36, "n": 1, "dh": "ותהרין וגו'", "pasuk_html": "<mark>וַֽתַּהֲרֶ֛יןָ</mark> שְׁתֵּ֥י בְנֽוֹת־ל֖וֹט מֵאֲבִיהֶֽן׃", "pasuk_en": "וַתַּהֲרֶיןָ שְׁתֵּי בְנוֹת־לוֹט מֵאֲבִיהֶן׃", "rashi_he": "ותהרין וגו'. אַעַ\"פִּ שֶׁאֵין הָאִשָּׁה מִתְעַבֶּרֶת מִבִּיאָה רִאשׁוֹנָה, אֵלּוּ שָׁלְטוּ בְעַצְמָן וְהוֹצִיאוּ עֶרְוָתָן לַחוּץ וְנִתְעַבְּרוּ מִבִּיאָה רִאשׁוֹנָה:", "rashi_en": "אף שבדרך כלל אישה אינה מתעברת מביאה ראשונה, בנות לוט עשו מעשה בעצמן והתעברו כבר מהביאה הראשונה.", "note": "", "points": [{"q": "מַה הַחִידּוּשׁ לְפִי רַשִׁ\"י בְּכָךְ שֶׁשְּׁתֵּי הַבָּנוֹת הָרוּ כְּבָר בְּלַיְלָה אֶחָד?", "options": ["אִישָּׁה אֵינָהּ מִתְעַבֶּרֶת מִבִּיאָה רִאשׁוֹנָה, וְהֵן עָשׂוּ מַעֲשֶׂה כְּדֵי שֶׁיִּתְעַבְּרוּ", "הַבָּנוֹת הָיוּ גְּדוֹלוֹת בַּשָּׁנִים וְלָכֵן הִתְעַבְּרוּ מַהֵר", "ה' עָשָׂה לָהֶן נֵס כְּדֵי שֶׁלוֹט לֹא יֵדַע מַה קָרָה"], "kasha": "כיצד התעברו מביאה ראשונה, והרי אין האישה מתעברת מביאה ראשונה?", "answer": "אף על פי שאין האישה מתעברת מביאה ראשונה, הן שלטו בעצמן והוציאו ערוותן לחוץ, ולכן נתעברו מביאה ראשונה.", "kp": ["אין האשה מתעברת מביאה ראשונה", "ונתעברו מביאה ראשונה"]}]}, {"id": "19:37.1", "ch": 19, "v": 37, "n": 1, "dh": "מואב", "pasuk_html": "וַתֵּ֤לֶד הַבְּכִירָה֙ בֵּ֔ן וַתִּקְרָ֥א שְׁמ֖וֹ <mark>מוֹאָ֑ב</mark> ה֥וּא אֲבִֽי־מוֹאָ֖ב עַד־הַיּֽוֹם׃", "pasuk_en": "וַתֵּלֶד הַבְּכִירָה בֵּן וַתִּקְרָא שְׁמוֹ מוֹאָב הוּא אֲבִי־מוֹאָב עַד־הַיּוֹם׃", "rashi_he": "מואב. זוֹ שֶׁלֹּא הָיְתָה צְנוּעָה פֵּרְשָׁה שֶׁמֵּאָבִיהָ הוּא, אֲבָל צְעִירָה קְרָאַתּוּ בְלָשׁוֹן נְקִיָּה, וְקִבְּלָה שָׂכָר בִּימֵי מֹשֶׁה, שֶׁנֶּאֱמַר בִּבְנֵי עַמּוֹן אַל תִּתְגָּר בָּם (דברים ב') – כְּלָל, וּבְמוֹאָב לֹא הִזְהִיר אֶלָּא שֶׁלֹּא יִלָּחֵם בָּם, אֲבָל לְצַעֲרָן הִתִּיר לוֹ:", "rashi_en": "הבכירה, שלא הייתה צנועה, קראה לבנה \"מואב\" ופרסמה שהוא מאביה. הצעירה קראה לבנה בלשון נקייה, וקיבלה על כך שכר בימי משה: על עמון נאסר כל התגרות, ועל מואב נאסרה רק מלחמה.", "note": "", "points": [{"q": "מַה לָמַד רַשִׁ\"י מֵהַשֵּׁם \"מוֹאָב\" שֶׁנָּתְנָה הַבְּכִירָה לִבְנָהּ?", "options": ["שֶׁלֹּא הָייְתָה צְנוּעָה וּפִרְסְמָה שֶׁהַבֵּן מֵאָבִיהָ", "שֶׁהִתְבַּייְּשָׁה בַּמַּעֲשֶׂה וְנִיסְּתָה לְהַסְתִּירוֹ", "שֶׁקָּרְאָה לוֹ עַל שֵׁם הַמָּקוֹם שֶׁנּוֹלַד בּוֹ"], "kasha": "מדוע הכתוב מפרט את שם הבן ואת משמעותו?", "answer": "הבכירה, שלא הייתה צנועה, פירשה בשם שהבן מאביה הוא, ואילו הצעירה קראה לבנה בלשון נקייה.", "kp": ["זו שלא היתה צנועה", "פרשה שמאביה הוא", "קראתו בלשון נקיה"]}, {"q": "אֵיזֶה שָׂכָר קִיבְּלָה הַצְּעִירָה עַל שֶׁקָּרְאָה לִבְנָהּ בִּלְשׁוֹן נְקִיָּיה?", "options": ["בִּימֵי מֹשֶׁה נֶאֱסַר לְהִתְגָּרוֹת בְּעַמּוֹן בְּכָל דֶּרֶךְ", "בָּנֶיהָ נִבְחֲרוּ לִהְיוֹת מְלָכִים בְּיִשְׂרָאֵל", "אַרְצָהּ שֶׁל עַמּוֹן נִיתְּנָה לְיִשְׂרָאֵל בִּירוּשָׁה"], "kasha": "מה ההבדל בין יחס התורה לעמון לבין יחסה למואב?", "answer": "על בני עמון נאמר \"אל תתגר בם\" באופן כללי, ואילו על מואב הזהירה התורה רק שלא ילחמו בהם, אבל לצער אותם הותר.", "kp": ["וקבלה שכר בימי משה", "ובמואב לא הזהיר אלא שלא ילחם בם"]}]}, {"id": "20:1.1", "ch": 20, "v": 1, "n": 1, "dh": "ויסע משם אברהם", "pasuk_html": "<mark>וַיִּסַּ֨ע מִשָּׁ֤ם אַבְרָהָם֙</mark> אַ֣רְצָה הַנֶּ֔גֶב וַיֵּ֥שֶׁב בֵּין־קָדֵ֖שׁ וּבֵ֣ין שׁ֑וּר וַיָּ֖גָר בִּגְרָֽר׃", "pasuk_en": "וַיִּסַּע מִשָּׁם אַבְרָהָם אַרְצָה הַנֶּגֶב וַיֵּשֶׁב בֵּין־קָדֵשׁ וּבֵין שׁוּר וַיָּגָר בִּגְרָר׃", "rashi_he": "ויסע משם אברהם. כְּשֶׁרָאָה שֶׁחָרְבוּ הַכְּרַכִּים וּפָסְקוּ הָעוֹבְרִים וְהַשָּׁבִים, נָסַע לוֹ מִשָּׁם. דָּ\"אַ לְהִתְרַחֵק מִלּוֹט, שֶׁיָּצָא עָלָיו שֵׁם רָע, שֶׁבָּא עַל בְּנוֹתָיו:", "rashi_en": "אברהם נסע משם כשראה שהערים חרבו ופסקו העוברים והשבים, ולא היה לו למי להכניס אורחים. ולפי פירוש אחר, נסע כדי להתרחק מלוט, שיצא עליו שם רע שבא על בנותיו.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן בְּרַשִׁ\"י, מַדּוּעַ נָסַע אַבְרָהָם מִשָּׁם?", "options": ["הֶעָרִים חָרְבוּ וּפָסְקוּ הָעוֹבְרִים וְהַשָּׁבִים", "פַּחַד שֶׁהָאֵשׁ מִסְּדוֹם תַּגִּיעַ גַּם אֵלָיו", "רָצָה לַחְפֹּשׂ מָקוֹם מִרְעֶה טוֹב לְצֹאנוֹ"], "kasha": "מדוע עזב אברהם את מקומו דווקא עכשיו?", "answer": "כשראה שחרבו הכרכים ופסקו העוברים והשבים, נסע לו משם.", "kp": ["כשראה שחרבו הכרכים", "ופסקו העוברים והשבים"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי בְּרַשִׁ\"י, מַדּוּעַ נָסַע אַבְרָהָם?", "options": ["כְּדֵי לְהִתְרַחֵק מִלּוֹט, שֶׁיָּצָא עָלָיו שֵׁם רָע", "כְּדֵי לְהִתְקָרֵב לְלוֹט וְלַעְזוֹר לוֹ בַּמְּעָרָה", "כְּדֵי לְהִתְרַחֵק מֵאֲבִימֶלֶךְ מֶלֶךְ גְּרָר"], "kasha": "מדוע עזב אברהם את מקומו דווקא עכשיו?", "answer": "כדי להתרחק מלוט, שיצא עליו שם רע שבא על בנותיו.", "kp": ["להתרחק מלוט", "שיצא עליו שם רע"]}]}, {"id": "20:2.1", "ch": 20, "v": 2, "n": 1, "dh": "ויאמר אברהם", "pasuk_html": "<mark>וַיֹּ֧אמֶר אַבְרָהָ֛ם</mark> אֶל־שָׂרָ֥ה אִשְׁתּ֖וֹ אֲחֹ֣תִי הִ֑וא וַיִּשְׁלַ֗ח אֲבִימֶ֙לֶךְ֙ מֶ֣לֶךְ גְּרָ֔ר וַיִּקַּ֖ח אֶת־שָׂרָֽה׃", "pasuk_en": "וַיֹּאמֶר אַבְרָהָם אֶל־שָׂרָה אִשְׁתּוֹ אֲחֹתִי הִוא וַיִּשְׁלַח אֲבִימֶלֶךְ מֶלֶךְ גְּרָר וַיִּקַּח אֶת־שָׂרָה׃", "rashi_he": "ויאמר אברהם. כָּאן לֹא נָטַל רְשׁוּת אֶלָּא עַל כָּרְחָהּ שֶׁלֹּא בְטוֹבָתָהּ, לְפִי שֶׁכְּבָר לֻקְּחָה לְבֵית פַּרְעֹה עַל יְדֵי כֵן:", "rashi_en": "בגרר אברהם לא ביקש את רשותה של שרה לומר שהיא אחותו, אלא אמר זאת בעל כורחה, כי כבר נלקחה לבית פרעה בגלל זה.", "note": "", "points": [{"q": "מַה הַהֶבְדֵּל בֵּין אֲמִירַת אַבְרָהָם כָּאן לְבֵין אֲמִירָתוֹ בְּמִצְרָיִם?", "options": ["כָּאן לֹא בִּיקֵּשׁ אֶת רְשׁוּתָהּ, כִּי כְּבָר נִלְקְחָה לְפַרְעֹה בִּגְלַל זֶה", "כָּאן בִּיקֵּשׁ אֶת רְשׁוּתָהּ, כִּי כְּבָר לָמַד מֵהַמִּקְרֶה בְּמִצְרַיִם", "כָּאן אָמַר זֹאת רַק לַאֲבִימֶלֶךְ וְלֹא לְכָל הָעָם"], "kasha": "במצרים נאמר \"אמרי נא אחתי את\", וכאן נאמר רק \"ויאמר אברהם\" בלי בקשה.", "answer": "כאן לא נטל רשות, אלא עשה זאת בעל כורחה שלא ברצונה, לפי שכבר נלקחה לבית פרעה בגלל דבר זה.", "kp": ["כאן לא נטל רשות", "שכבר לקחה לבית פרעה"]}]}, {"id": "20:2.2", "ch": 20, "v": 2, "n": 2, "dh": "אל שרה אשתו", "pasuk_html": "וַיֹּ֧אמֶר אַבְרָהָ֛ם <mark>אֶל־שָׂרָ֥ה אִשְׁתּ֖וֹ</mark> אֲחֹ֣תִי הִ֑וא וַיִּשְׁלַ֗ח אֲבִימֶ֙לֶךְ֙ מֶ֣לֶךְ גְּרָ֔ר וַיִּקַּ֖ח אֶת־שָׂרָֽה׃", "pasuk_en": "וַיֹּאמֶר אַבְרָהָם אֶל־שָׂרָה אִשְׁתּוֹ אֲחֹתִי הִוא וַיִּשְׁלַח אֲבִימֶלֶךְ מֶלֶךְ גְּרָר וַיִּקַּח אֶת־שָׂרָה׃", "rashi_he": "אל שרה אשתו. עַל שָׂרָה אִשְׁתּוֹ, כַּיוֹצֵא בוֹ אֶל הִלָּקַח אֲרוֹן וְגוֹ' וְאֶל מוֹת חָמִיהָ (שמואל א ד'), שְׁנֵיהֶם בִּלְשׁוֹן עַל:", "rashi_en": "\"אל שרה אשתו\" פירושו \"על שרה אשתו\", כלומר אברהם אמר על שרה שהיא אחותו. לשון \"אל\" במשמעות \"על\" מצויה גם במקומות אחרים.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"אֶלשָׂרָה אִשְׁתּוֹ\" לְפִי רַשִׁ\"י?", "options": ["עַל שָׂרָה, כְּלוֹמַר אָמַר עָלֶיהָ לַאֲחֵרִים", "שֶׁאַבְרָהָם פָּנָה לְשָׂרָה וְדִיבֵּר אֵלֶיהָ", "שֶׁאַבְרָהָם אָמַר לְשָׂרָה לוֹמַר שֶׁהִיא אֲחוֹתוֹ"], "kasha": "אם אברהם דיבר \"אל\" שרה, היה צריך לומר לה \"אחותי את\", ולא \"אחתי הוא\".", "answer": "\"אל\" כאן פירושו \"על\", כמו \"אל הלקח ארון\" ו\"אל מות חמיה\", ששניהם בלשון \"על\".", "kp": ["על שרה אשתו", "שניהם בלשון על"]}]}, {"id": "20:4.1", "ch": 20, "v": 4, "n": 1, "dh": "לא קרב אליה", "pasuk_html": "וַאֲבִימֶ֕לֶךְ <mark>לֹ֥א קָרַ֖ב אֵלֶ֑יהָ</mark> וַיֹּאמַ֕ר אֲדֹנָ֕י הֲג֥וֹי גַּם־צַדִּ֖יק תַּהֲרֹֽג׃", "pasuk_en": "וַאֲבִימֶלֶךְ לֹא קָרַב אֵלֶיהָ וַיֹּאמַר אֲדֹנָי הֲגוֹי גַּם־צַדִּיק תַּהֲרֹג׃", "rashi_he": "לא קרב אליה. הַמַּלְאָךְ מְנָעוֹ, כְּמוֹ שֶׁנֶּאֱמַר לֹא נְתַתִּיךָ לִנְגֹּעַ אֵלֶיהָ:", "rashi_en": "אבימלך לא קרב אל שרה כי המלאך מנע ממנו.", "note": "", "points": [{"q": "מַדּוּעַ לֹא קָרַב אֲבִימֶלֶךְ אֶל שָׂרָה לְפִי רַשִׁ\"י?", "options": ["הַמַּלְאָךְ מָנַע מִמֶּנּוּ", "הוּא חָשַׁשׁ מֵאַבְרָהָם וּמִתְּפִילָּתוֹ", "הוּא הֵבִין לְבַדּוֹ שֶׁהִיא אֵשֶׁת אִישׁ"], "kasha": "הכתוב מציין שלא קרב אליה, ויש לבאר מה עיכב אותו.", "answer": "המלאך מנע אותו, כמו שנאמר \"לא נתתיך לנגע אליה\".", "kp": ["המלאך מנעו"]}]}, {"id": "20:4.2", "ch": 20, "v": 4, "n": 2, "dh": "הגוי גם צדיק תהרג", "pasuk_html": "וַאֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑יהָ וַיֹּאמַ֕ר אֲדֹנָ֕י <mark>הֲג֥וֹי גַּם־צַדִּ֖יק תַּהֲרֹֽג׃</mark>", "pasuk_en": "וַאֲבִימֶלֶךְ לֹא קָרַב אֵלֶיהָ וַיֹּאמַר אֲדֹנָי הֲגוֹי גַּם־צַדִּיק תַּהֲרֹג׃", "rashi_he": "הגוי גם צדיק תהרג. אַף אִם הוּא צַדִּיק תַּהַרְגֶנּוּ, שֶׁמָּא כָךְ דַּרְכְּךָ לְאַבֵּד הָאֻמּוֹת חִנָּם? כָּךְ עָשִׂיתָ לְדוֹר הַמַּבּוּל וּלְדוֹר הַפַּלָּגָה, אַף אֲנִי אוֹמֵר שֶׁהֲרַגְתָּם עַל לֹא דָבָר, כְּמוֹ שֶׁאַתָּה אוֹמֵר לְהָרְגֵנִי:", "rashi_en": "אבימלך טען: האם גם אם האומה צדיקה תהרוג אותה? האם זו דרכך לאבד אומות חינם, כמו שעשית לדור המבול ולדור הפלגה? אם כך, גם הם נהרגו על לא דבר, כמו שאתה רוצה להרוג אותי.", "note": "", "points": [{"q": "מַה טָעַן אֲבִימֶלֶךְ בַּמִּילִּים \"הֲגוֹי גַּםצַדִּיק תַּהֲרֹג\"?", "options": ["הַאִם זוֹ דַּרְכְּךָ לַהֲרֹוג אֻומּוֹת חִינָּם, כְּמוֹ בְּדוֹר הַמַּבּוּל וְהַפַּלָּגָה", "שֶׁאֻומָּתוֹ צַדִּיקָה יוֹתֵר מֵאַנְשֵׁי סְדֹום וַעֲמֹורָה", "שֶׁרָאוּי שֶׁרַק הוּא יֵיעָנֵשׁ וְלֹא כָּל עַמּוֹ"], "kasha": "מה פירוש \"גם\" בדברי אבימלך, ומה טענתו כלפי ה'?", "answer": "אף אם הוא צדיק תהרגנו? שמא כך דרכך לאבד אומות חינם, כמו שעשית לדור המבול ולדור הפלגה; אף אני אומר שהרגתם על לא דבר, כמו שאתה אומר להרוג אותי.", "kp": ["אף אם הוא צדיק תהרגנו", "כך עשית לדור המבול ולדור הפלגה", "שהרגתם על לא דבר"]}]}, {"id": "20:5.1", "ch": 20, "v": 5, "n": 1, "dh": "גם הוא", "pasuk_html": "הֲלֹ֨א ה֤וּא אָֽמַר־לִי֙ אֲחֹ֣תִי הִ֔וא וְהִֽיא־<mark>גַם־הִ֥וא</mark> אָֽמְרָ֖ה אָחִ֣י ה֑וּא בְּתָם־לְבָבִ֛י וּבְנִקְיֹ֥ן כַּפַּ֖י עָשִׂ֥יתִי זֹֽאת׃", "pasuk_en": "הֲלֹא הוּא אָמַר־לִי אֲחֹתִי הִוא וְהִיא־גַם־הִוא אָמְרָה אָחִי הוּא בְּתָם־לְבָבִי וּבְנִקְיֹן כַּפַּי עָשִׂיתִי זֹאת׃", "rashi_he": "גם הוא. לְרַבּוֹת עֲבַדִים וְגַמָּלִים וְחַמָּרִים שֶׁלָּהּ, אֶת כֻּלָּם שָׁאַלְתִּי וְאָמְרוּ לִי אָחִיהָ הוּא:", "rashi_en": "המילה \"גם\" מרבה את עבדיה ואת הגמלים והחמרים שלה: אבימלך שאל את כולם, וכולם אמרו שאברהם אחיה.", "note": "", "points": [{"q": "מָה מַרְבֶּה הַמִּילָּה \"גַ
