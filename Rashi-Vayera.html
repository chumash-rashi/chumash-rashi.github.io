ld be unthinkable for You to punish the righteous there as well.","pe":"It would be sacrilege [to attribute] to You such an act, to kill the righteous with the wicked, treating the righteous and the wicked alike. It would be sacrilege to attribute this to You : Shall the Judge of all the earth not do justice?","re":"It would be sacrilege to attribute this to You. In the World-to-Come.","p":[{"q":"Why does it say \"חללה לך\" a second time in the verse?","o":["The second time refers to the World to Come","To emphasize Avraham's anger","The second time refers to the generation of the Flood"]}]},"18:25.4":{"e":"The letter \"ה\" of \"השופט\" is vocalized with a chataf patach, so it is a question of astonishment: would one who judges the whole earth not do true justice?","pe":"It would be sacrilege [to attribute] to You such an act, to kill the righteous with the wicked, treating the righteous and the wicked alike. It would be sacrilege to attribute this to You : Shall the Judge of all the earth not do justice?","re":"Shall the Judge of all the earth. The ה of הֲשוֹפֵט is vocalized with a חֲטָף פַּתַּח as an expression of incredulity. I.e., can it be that He who is Judge should fail to do true justice?","p":[{"q":"What does the vowel of the letter \"ה\" in the word \"השפט\" teach?","o":["That it is a question of astonishment: would the Judge not do true justice?","That it is the definite article, referring to the known judge","That it is a direct address to Hashem by the title \"the Judge\""]}]},"18:26.1":{"e":"\"המקום\" includes all the cities, and the verse attributed it to Sodom because it was the capital city and the most important of them all.","pe":"Adonoy said; If, in Sedom, I find fifty righteous within the city, I will bear with the entire place for their sake.","re":"If, in Sedom, I find … the entire place. [בִסְדֹם refers] to all the cities. Since Sedom was a metropolis and the most important of them all, Scripture refers to her.","p":[{"q":"Why does the verse mention only \"בסדם\" even though all the cities are meant?","o":["Because Sodom was the capital and most important city","Because only in Sodom were the people truly wicked","Because the other cities had already been sentenced earlier"]}]},"18:27.1":{"e":"\"הואלתי\" means \"I wanted,\" like \"ויואל משה,\" which means that Moshe wanted.","pe":"Avraham responded and said, Here I have begun to speak to my Master, and I am but dust and ashes.","re":"I have begun. [Meaning] “I was willing,” as in “And Moshe was willing.”","p":[{"q":"What does the word \"הואלתי\" mean according to Rashi?","o":["I wanted","I began","I exerted myself"]}]},"18:27.2":{"e":"Avraham says that he would already have deserved to become dust in the war of the kings and ashes in Nimrod's furnace, were it not for Hashem's mercy that saved him.","pe":"Avraham responded and said, Here I have begun to speak to my Master, and I am but dust and ashes.","re":"And I am but dust and ashes. [I.e.,] I would already have been reduced to dust by the kings, and to ashes by Nimrod, were it not for Your mercy that stood by me.","p":[{"q":"What does Avraham mean when he says \"ואנכי עפר ואפר\"?","o":["That he would already have deserved to die at the hands of the kings and at the hands of Nimrod","That man is created from dust and ends by returning to dust","That he mourns for the people of Sodom who are about to be burned"]}]},"18:28.1":{"e":"If five are missing from fifty, there remain nine righteous people for each of the five cities, and Hashem, the Righteous One of the world, will join them to complete ten.","pe":"But suppose they lack five of the fifty righteous? Will You destroy all the city because of five? He said, I will not destroy if I find forty-five there.","re":"Will You destroy because of five? Would there, not be nine for each city? and You, the Righteous One of the universe, can be counted with them.","p":[{"q":"What was Avraham arguing when he said \"התשחית בחמשה\"?","o":["That there are nine in each city, and Hashem will join them as the tenth","That five righteous people suffice to save one city","That it is not just to destroy a city in which there is a single righteous person"]}]},"18:29.1":{"e":"Avraham asked that forty righteous people save four cities, likewise thirty would save three, twenty would save two, and ten would save one city.","pe":"He [Avraham] continued to speak to Him and said, Suppose there are forty found there? He said, I will not do it for the sake of the forty.","re":"Suppose there are forty found there? And, thereby, four cities will be saved. Similarly thirty will save three of them, or twenty will save two of them, or ten will save one of them.","p":[{"q":"What did Avraham ask when he said \"אולי ימצאון שם ארבעים\"?","o":["That forty righteous people save four of the cities","That forty righteous people save all five cities","That forty righteous people save only the city of Sodom"]}]},"18:31.1":{"e":"\"הואלתי\" means \"I wanted,\" like \"ויואל משה.\"","pe":"He said, Here I wished to speak to my Master. Suppose twenty are found there? He said, I will not destroy for the sake of the twenty.","re":"I wished. [Meaning] “I was willing,” as in: “And Moshe was willing.”","p":[{"q":"What does \"הואלתי\" mean in this verse?","o":["I wanted","I dared","I added"]}]},"18:32.1":{"e":"Avraham did not ask for fewer than ten, because in the generation of the Flood there were eight righteous people and they did not save their generation. And for nine, with Hashem joining them, he had already asked and they were not found.","pe":"He said, Let not my Master show anger, and I will speak just once more. Suppose ten are found there? He said, I will not destroy for the sake of the ten.","re":"Suppose ten are found there? For anything less he made no request [because] he thought: The flood generation had eight. Noach, his children and their wives, and they did not save their generation, and for nine, including counting [God] he had already asked but could not find.","p":[{"q":"Why did Avraham not ask for fewer than \"עשרה\" righteous people?","o":["Because eight righteous people in the generation of the Flood did not save their generation","Because Hashem told him in advance that He would not accept fewer than ten","Because he knew there was not even one righteous person in Sodom"]},{"q":"Why did Avraham not ask for nine righteous people?","o":["Because he had already asked for nine, with Hashem joining them, and they were not found","Because nine is fewer than the eight of the generation of the Flood","Because Hashem refused to hear another request"]}]},"18:33.1":{"e":"Once Avraham, who was arguing in their favor, fell silent, the Judge went away.","pe":"Adonoy departed when He finished speaking to Avraham, and Avraham returned to his place.","re":"Adonoy departed. Once the defender is silenced the Judge leaves.","p":[{"q":"Why did Hashem leave specifically when Avraham finished speaking?","o":["Because when the advocate fell silent, the Judge left","Because Hashem was angry at Avraham's many requests","Because Hashem was hurrying to send the angels to Sodom"]}]},"18:33.2":{"e":"When the Judge departed, the advocate departed too, and the accuser remained to accuse, and therefore the two angels came immediately to Sodom to destroy.","pe":"Adonoy departed when He finished speaking to Avraham, and Avraham returned to his place.","re":"And Avraham returned to his place. Once the Judge leaves, the defender leaves and the prosecutor accuses and as a result: “The two angels came to Sedom,” to destroy.","p":[{"q":"What is the significance of \"ואברהם שב למקמו\" according to Rashi?","o":["The advocate departed, and the accuser remained to accuse","Avraham returned home to receive more guests","Avraham despaired and was angry at the decree"]}]},"19:1.1":{"e":"Only two came: one to destroy Sodom and one to save Lot, and he is the same one who came to heal Avraham. The third, who came to give the good news to Sarah, departed after completing his mission.","pe":"The two angels came to Sedom in the evening, while Lot was sitting at the gate of Sedom. Lot saw them, and he got up to greet them, and he bowed with his face to the ground.","re":"Two. One to destroy Sedom and one to save Lot. The third one who came to foretell to Sarah [of her giving birth]— once he fulfilled his mission—departed.","p":[{"q":"Why did only \"שני המלאכים\" and not three come to Sodom?","o":["Because the third completed his mission of giving Sarah the good news and departed","Because the third stayed with Avraham to continue healing him","Because the third was sent to destroy the other cities"]},{"q":"Which of the angels is the one who came to save Lot?","o":["The angel who came to heal Avraham","The angel who came to give Sarah the good news","The angel who came to destroy Sodom"]}]},"19:1.2":{"e":"Earlier they were called men and here angels: when the Shechinah was with them they were called men. Another explanation: with Avraham, whose power was great and to whom the angels were accustomed like men, they were called men, and with Lot they were called angels.","pe":"The two angels came to Sedom in the evening, while Lot was sitting at the gate of Sedom. Lot saw them, and he got up to greet them, and he bowed with his face to the ground.","re":"Angels. Elsewhere they are called men. When the Divine Presence was with them they are called men. Another explanation: In relation to Avraham whose power was great and angels were as common to him as men, they are referred to as men. But, relative to Lot, they are called angels.","p":[{"q":"According to the first explanation, why were they called \"אנשים\" with Avraham and \"המלאכים\" here?","o":["When the Shechinah was with them they were called men","Because with Avraham they had not yet received a mission","Because with Lot they appeared in the form of fire"]},{"q":"According to the second explanation, what is the difference between Avraham and Lot regarding the name?","o":["To Avraham, whose power was great, the angels were accustomed like men","Lot was more righteous and therefore merited to see angels","Avraham did not recognize at all that they were angels"]}]},"19:1.3":{"e":"The angels did not need so long to travel from Chevron to Sodom, but they were angels of mercy and waited, in case Avraham would succeed in arguing in favor of the people of Sodom.","pe":"The two angels came to Sedom in the evening, while Lot was sitting at the gate of Sedom. Lot saw them, and he got up to greet them, and he bowed with his face to the ground.","re":"In the evening. Did it take that long for the angels [to travel] from Chevron to Sedom? But, they were angels of mercy, and they procrastinated— perhaps Avraham will succeed [in his attempt] to defend them.","p":[{"q":"Why did the angels arrive in Sodom only \"בערב\"?","o":["Because they were angels of mercy and waited for Avraham's advocacy","Because the road from Chevron to Sodom is long and took all day","Because they wanted to arrive in darkness so as not to be recognized"]}]},"19:1.4":{"e":"\"ישב\" is written without a vav, like the past tense, to teach that on that very day they appointed him judge over them.","pe":"The two angels came to Sedom in the evening, while Lot was sitting at the gate of Sedom. Lot saw them, and he got up to greet them, and he bowed with his face to the ground.","re":"While Lot was sitting at the gate of Sedom. It is written יָשַׁב [without a ו because] on that day they appointed him to be their judge.","p":[{"q":"What does Rashi learn from the spelling of the word \"ישב\"?","o":["That on that very day Lot was appointed judge over them","That Lot sat there to look for guests","That Lot sat at the gate because he was afraid to enter the city"]}]},"19:1.5":{"e":"Lot hurried to rise toward the guests, because he had learned from Avraham's house to seek out guests.","pe":"The two angels came to Sedom in the evening, while Lot was sitting at the gate of Sedom. Lot saw them, and he got up to greet them, and he bowed with his face to the ground.","re":"Lot saw. He had learned from the house of Avraham to seek out travelers.","p":[{"q":"Why did Lot notice the guests and hurry to rise toward them?","o":["Because he learned from Avraham's house to seek out guests","Because he suspected they were spies who had come to the city","Because as a judge he had to check everyone who entered"]}]},"19:2.1":{"e":"Lot says: behold, you are my masters since you have passed by me. Another explanation: you must be careful of these wicked people so that they do not recognize you, and this is sound advice.","pe":"He said, Behold now my lords, please turn in to your servant’s house. Stay over night, bathe your feet, and get up early and continue on your way. They said, No, we will spend the night in the street.","re":"Behold now my lords. [Meaning:] “Behold, you are now my masters since you have passed by me.” Another explanation: “Behold, now, you must be careful in regard to these cruel people that they not become aware of you.” And, therefore, this is the proper advice.","p":[{"q":"According to the first explanation, why does Lot call them \"אדני\"?","o":["Because they are his masters since they passed by him","Because he immediately recognized that they were angels","Because he thought they were judges from another city"]},{"q":"According to the second explanation, why does Lot warn the guests?","o":["That they should take care that the wicked do not recognize them","That they should not eat in the city because the food is forbidden","That they should hurry to leave before the city is destroyed"]}]},"19:2.2":{"e":"Lot asked them to go to his house by a roundabout way, so that no one would recognize that they were entering his home, and therefore it says \"סורו.\"","pe":"He said, Behold now my lords, please turn in to your servant’s house. Stay over night, bathe your feet, and get up early and continue on your way. They said, No, we will spend the night in the street.","re":"Please turn. Turn off the main road to my home [by means] of a roundabout way so that they not become aware that you are entering there. It therefore says “turn.”","p":[{"q":"Why does Lot say \"סורו נא\" and not simply \"באו\"?","o":["So that they would turn aside from the direct road and not be seen entering his house","So that they would turn from their evil way and repent","So that they would turn to an inn outside the city"]}]},"19:2.3":{"e":"Lot put lodging before washing because he feared that if the people of Sodom saw that they had already washed their feet, they would accuse him of having had them with him for days without informing them. So he preferred that they remain with the dust of their feet and look as if they had just arrived.","pe":"He said, Behold now my lords, please turn in to your servant’s house. Stay over night, bathe your feet, and get up early and continue on your way. They said, No, we will spend the night in the street.","re":"Stay over night, bathe your feet. But, is it the manner of people to first lodge overnight and then to wash afterward? And, furthermore: Avraham told them to first wash their feet! But, this is what Lot thought: If, when the Sedomites come, they will see that they already washed their feet they will make accusations against me and will say, “Two or three days have already passed since they have come into you home and you did not notify us.” He, therefore, thought: Better that they remain here with the dust on their feet so that they appear to have just arrived. He, therefore, said, “Lodge overnight,” first, and “wash” afterwards.”","p":[{"q":"Why did Lot say \"ולינו\" before \"ורחצו רגליכם\"?","o":["So that they would look as if they had just arrived and no one would accuse him","Because in Sodom they were accustomed to wash only in the morning","Because there was no water for washing in his house in the evening"]}]},"19:2.4":{"e":"The angels refused Lot, whereas to Avraham they said \"כן תעשה.\" From here we learn that one may refuse a lesser person but may not refuse a greater one.","pe":"He said, Behold now my lords, please turn in to your servant’s house. Stay over night, bathe your feet, and get up early and continue on your way. They said, No, we will spend the night in the street.","re":"They said, “No.” Whereas to Avraham they said, “Do [as you said].” From this [we may derive] that one may decline the offer of an inferior but should not decline the offer of a superior.","p":[{"q":"What does Rashi learn from the angels saying \"ויאמרו לא\" to Lot?","o":["That one may refuse a lesser person but not a greater one","That it is forbidden to accept an invitation from a wicked person","That angels do not need to lodge in a house"]}]},"19:2.5":{"e":"Here \"כי\" means \"אלא\" (rather): we will not turn aside to your house, but rather we will lodge in the city square.","pe":"He said, Behold now my lords, please turn in to your servant’s house. Stay over night, bathe your feet, and get up early and continue on your way. They said, No, we will spend the night in the street.","re":"We will spend the night in the street. Here, כִּי is used to mean “but,” for, in effect, they said, “We will not veer off to your home, but will lodge in the city street all night.”","p":[{"q":"What does the word \"כי\" mean in \"כי ברחוב נלין\"?","o":["Rather","Because","If"]}]},"19:3.1":{"e":"They turned the road aside and went toward his house by a roundabout path.","pe":"He urged them greatly, and they turned in to him and came to his house. He made a feast for them, and baked matzos, and they ate.","re":"They turned in to him. They took a roundabout way to his home.","p":[{"q":"What does \"ויסרו אליו\" mean according to Rashi?","o":["That they turned the road aside toward his house","That they turned away from their earlier opinion and agreed","That they turned from the street to the gate"]}]},"19:3.2":{"e":"Lot baked matzot because it was the festival of Pesach.","pe":"He urged them greatly, and they turned in to him and came to his house. He made a feast for them, and baked matzos, and they ate.","re":"And baked matzos. It was Pesach.","p":[{"q":"Why did Lot specifically bake \"ומצות אפה\"?","o":["Because it was the festival of Pesach","Because he did not have time to let the dough rise","Because angels do not eat chametz"]}]},"19:4.1":{"e":"According to the Midrash, even before they went to sleep the angels asked Lot about the people of the city, and he said that most of them were wicked, and while they were speaking the people of Sodom came. According to the plain meaning, the wicked people of the city surrounded the house, and they were called \"אנשי סדום\" because of their wickedness.","pe":"They had not yet lain down when the men of the city, the men of Sedom, surrounded the house—young and old alike—all the people from one end [of the city] to the other end.","re":"They had not yet lain down when the men of the city, the men of Sedom. It is thus expounded in Bereishis Rabbah. Before they lay down and [already] the people of the city were being discussed by the angels; they were asking Lot about their character and their deeds and he answered them that the majority are evil. As they were discussing them “And the men of Sedom,” etc. However, the plain explanation of the verse is: The people of the city who were evil people surrounded the house. Because they were evil people, they are referred to as Sedomites as Scripture states: “The people of Sedom were wicked and sinful.”","p":[{"q":"According to the Midrash, what is the meaning of \"טרם ישכבו ואנשי העיר\"?","o":["The angels asked Lot about the people of the city, and he said that most of them were wicked","The people of the city lay down to sleep before the angels arrived","Lot sent the people of the city to their homes before bedtime"]},{"q":"According to the plain meaning, why does it say \"אנשי סדם\" after \"אנשי העיר\"?","o":["Because they were wicked, they were called people of Sodom","Because people from other cities came as well","Because only the notables of the city were called people of Sodom"]}]},"19:4.2":{"e":"All the people came, from one end of the city to the other, and not one of them protested, because there was not even a single righteous person among them.","pe":"They had not yet lain down when the men of the city, the men of Sedom, surrounded the house—young and old alike—all the people from one end [of the city] to the other end.","re":"All the people from one end to the other. [Meaning:] from one end of the city to the other. There was not one who protested because not even one righteous person was among them.","p":[{"q":"What does Rashi teach from the word \"מקצה\"?","o":["That no one protested against them, because there was not even one righteous person among them","That only people from one neighborhood at the edge of the city came","That the people came from the ends of the earth to see the guests"]}]},"19:5.1":{"e":"\"ונדעה אותם\" means for homosexual relations, like \"אשר לא ידעו איש.\"","pe":"They called to Lot and said to him, Where are the men who came to you tonight? Bring them out to us that we may know them.","re":"That we may know them. For the purpose of homosexuality as in: Who have never known a man.","p":[{"q":"What did the people of Sodom want when they said \"ונדעה אתם\"?","o":["Homosexual relations","To interrogate them and find out who they were","To get to know them and befriend them"]}]},"19:8.1":{"e":"The word \"האל\" here means \"האלה\" (these).","pe":"Behold! I have two daughters who have never known a man, I will bring them out to you, and do with them as you please; only do nothing to these men, since after all, they came under the shelter of my roof.","re":"These. [הָאֵל] is the same as הָאֵלֶּה [these].","p":[{"q":"What does the word \"האל\" mean in the verse?","o":["These","God","The mighty ones"]}]},"19:8.2":{"e":"Lot asked them to do this favor in his honor, since the guests had come under the shelter of his roof. Onkelos translated \"בטלל שרותי,\" because the Aramaic for beam is \"שרותא.\"","pe":"Behold! I have two daughters who have never known a man, I will bring them out to you, and do with them as you please; only do nothing to these men, since after all, they came under the shelter of my roof.","re":"Since, after all, they came. Do this favor out of respect for me since [כִּי] they have come under the shelter of my roof [lit. beam]. Onkelos translates it: In the shade of my beam. The Targum of קוֹרָה is שֵׁרוּתָא — beam.","p":[{"q":"What is Lot asking when he says \"באו בצל קרתי\"?","o":["That they do this favor in his honor, because the guests came under the roof of his house","That they leave them alone because they are residents of the city like them","That they wait until morning when the guests will leave his house"]}]},"19:9.1":{"e":"\"גש הלאה\" means move away to the sides, and it is language of rebuke: we do not care about you. In response to his words about the daughters they answered gently \"גש הלאה,\" and for his advocating for the guests they said sharply: you are a lone stranger among us and you have become our rebuker?","pe":"They said, Step back out of the way! They said, This one came as an immigrant, and now he wants to be a judge. We will now deal worse with you than with them. They pushed hard against Lot, and came near to break the door.","re":"They said, “Step back out of the way!” Back away! As if to say: “Step aside and distance yourself from us.” So, too, wherever הָלְאָה appears in Scripture it has the meaning of distance, as in, “Scatter הָלְאָה —afar” or: “Behold the arrows are some distance from you.” Thus, גֶשׁ הָלְאָה [means] “Draw yourself aside,” in Old French: Retire-toi de nous. It is a contemptuous way of saying, “We are not considering you at all.” Similar to this: “Step aside, do not come near me.” Similarly: “Step aside and I will dwell there,” [meaning] draw aside for my sake so that I may dwell where you are. [The Sedomites were, in effect saying:] You are interceding for the travelers; how dare you do that! In response to what he said of his daughters they said to him, “Step aside,” gently, in a calm manner, [but] for his interceding on behalf of the travelers they said [harshly], “This one came as an immigrant,” [in effect saying:] “You are the only stranger among us who has come [only] to sojourn.” “And now he wants to be a judge.” [Meaning:] and you have become our chastiser.","p":[{"q":"What does \"גשהלאה\" mean according to Rashi?","o":["Move away to the sides, meaning we do not care about you","Come close to us so that we can speak with you","Go from here to another city and do not return"]},{"q":"Why does it say \"ויאמרו\" twice in the verse?","o":["Once gently about the daughters, and once angrily because he defended the guests","Because two different groups of people spoke","Because Lot did not hear them the first time"]}]},"19:9.2":{"e":"\"הדלת\" is the panel that turns to close and open the doorway.","pe":"They said, Step back out of the way! They said, This one came as an immigrant, and now he wants to be a judge. We will now deal worse with you than with them. They pushed hard against Lot, and came near to break the door.","re":"The door. This is [the door] that swings [on hinges] to close and open [the entrance].","p":[{"q":"What is the \"הדלת\" according to Rashi?","o":["The panel that turns to close and open","The space through which one enters and exits","The lintel above the doorway"]}]},"19:11.1":{"e":"\"פתח\" is the space through which one enters and exits, as distinct from the door.","pe":"The men who were at the entrance of the house, they struck with blindness—young and old alike—so that they wearied themselves trying to find the entrance.","re":"The entrance. That is the opening though which [people] enter and exit.","p":[{"q":"What is the \"הפתח\" according to Rashi?","o":["The space through which one enters and exits","The panel that turns to close and open","The great gate of the city"]}]},"19:11.2":{"e":"The angels struck the people of Sodom who stood at the door of the house with a plague of blindness.","pe":"The men who were at the entrance of the house, they struck with blindness—young and old alike—so that they wearied themselves trying to find the entrance.","re":"With blindness. [This is] an affliction of blindness.","p":[{"q":"What does \"בסנורים\" mean according to Rashi?","o":["A plague of blindness","Temporary dazzling from a bright light","Confusion of mind without harm to sight"]}]},"19:11.3":{"e":"The young were the first to begin the sin, so the punishment began with them, and therefore the verse mentions \"מקטן\" before \"גדול.\"","pe":"The men who were at the entrance of the house, they struck with blindness—young and old alike—so that they wearied themselves trying to find the entrance.","re":"Young and old alike. The young ones were the first in this wrongdoing as is written “Young and old alike,” therefore, the punishment began with them.","p":[{"q":"Why does the verse put \"מקטן\" before \"גדול\" in the plague of blindness?","o":["Because the young began the transgression, so the punishment began with them","Because the young stood closer to the door of the house","Because the young are weaker and so were struck first"]}]},"19:12.1":{"e":"According to the plain meaning, the angels asked Lot who else he had in the city besides his wife and daughters who were with him in the house.","pe":"The men said to Lot, Who else do you have here—a son-in-law, your sons, your daughters? Whoever you have in the city, bring them out of his place.","re":"Who else do you have here? The plain meaning of this verse is: “Whom else do you have in this city besides your wife and daughters in this house?”","p":[{"q":"According to the plain meaning, what did the angels ask Lot with the words \"עד מילך פה\"?","o":["Who else do you have in the city besides your wife and daughters in the house","Are you sure you want to remain in the city","How many righteous people are still in the city"]}]},"19:12.2":{"e":"The angels tell Lot: if you have a son-in-law or sons and daughters in the city, take them out of the place.","pe":"The men said to Lot, Who else do you have here—a son-in-law, your sons, your daughters? Whoever you have in the city, bring them out of his place.","re":"A son-in-law, your sons, your daughters. [Meaning:] “If you have a son-in-law or sons and daughters get them away from this place.","p":[{"q":"How should the list \"חתן ובניך ובנתיך\" be understood?","o":["If you have a son-in-law or sons and daughters, take them out of the place","These are the people for whom Lot prayed all night","These are members of his household who were already with him in the house"]}]},"19:12.3":{"e":"\"ובניך\" refers to the sons of his married daughters. According to the Midrash, the angels said to Lot: after they commit such an abomination, what grounds do you still have to argue in their favor, when all night you were pleading for them.","pe":"The men said to Lot, Who else do you have here—a son-in-law, your sons, your daughters? Whoever you have in the city, bring them out of his place.","re":"Your sons. [Meaning:] your married daughter’s sons. The Aggadaic explanation for the word עֹד [is]: “Since they are doing such an abhorrent thing can you still have any basis for defending them?” For, all night he [Lot] was justifying them. It should be read מִי לְךָ פֶּה.","p":[{"q":"Who are \"ובניך\" according to Rashi?","o":["The sons of Lot's married daughters","Lot's sons who were born to him in Sodom","Servants of his household who grew up with him like sons"]},{"q":"According to the Midrash, what does \"עד מילך פה\" mean?","o":["What grounds do you still have to argue in their favor","Who else of your family is here in the city","How much longer can you remain in this place"]}]},"19:14.1":{"e":"Lot had two married daughters in the city, and it was to their husbands that he went to speak.","pe":"Lot went out and spoke to his sons-in-law who had married his daughters. He said [to them], Get up! Get out of this place, for Adonoy is going to destroy the city! He appeared as a comedian in the eyes of his sons-in-law.","re":"Sons-in-law. He had two married daughters in the city.","p":[{"q":"What does Rashi learn from the word \"חתניו\"?","o":["That Lot had two married daughters in the city","That the daughters in the house were already married","That his sons-in-law lived together with Lot in the same house"]}]},"19:14.2":{"e":"\"לקחי בנתיו\" are those to whom the daughters in the house were betrothed.","pe":"Lot went out and spoke to his sons-in-law who had married his daughters. He said [to them], Get up! Get out of this place, for Adonoy is going to destroy the city! He appeared as a comedian in the eyes of his sons-in-law.","re":"Who had married his daughters. Those to whom the ones at home were betrothed.","p":[{"q":"Who are \"לקחי בנתיו\" according to Rashi?","o":["Those to whom the daughters in the house were betrothed","Those who had already married his married daughters","Those who wanted to take his daughters by force"]}]},"19:15.1":{"e":"\"ויאיצו\" means, as Onkelos translates, \"ודחיקו,\" that is, the angels urged Lot and hurried him.","pe":"At the break of dawn, the angels urged Lot on, saying, Get up! Take your wife and your two daughters who are here, lest you be swept away in the iniquity of the city.","re":"They urged. As Onkelos translates it: “They pressed,” [meaning] they hurried him.","p":[{"q":"What does \"ויאיצו\" mean according to Rashi?","o":["They pressed him and hurried him","They got angry at him and rebuked him","They promised him that he would be saved"]}]},"19:15.2":{"e":"\"הנמצאת\" means the daughters who are with you in the house and can be saved. There are Midrashim on this, but this is the plain meaning.","pe":"At the break of dawn, the angels urged Lot on, saying, Get up! Take your wife and your two daughters who are here, lest you be swept away in the iniquity of the city.","re":"Who are here. those who are already in the house whom you have the ability to save. There are Midrashic explanations, but, this is the plain explanation of the verse.","p":[{"q":"What does the word \"הנמצאת\" teach about the two daughters?","o":["That they are with you in the house and can be saved","That they were found more righteous than the rest of the people of the city","That they hid and were found only with difficulty"]}]},"19:15.3":{"e":"\"תספה\" means you will be destroyed and perish, as Onkelos translates \"עד תם כל הדור\" as \"עד דסף כל דרא.\"","pe":"At the break of dawn, the angels urged Lot on, saying, Get up! Take your wife and your two daughters who are here, lest you be swept away in the iniquity of the city.","re":"Swept away. [Meaning:] “You will be the end of.” [The verse] עַד־תּוֹם כָּל־ הַדּוֹר” is translated [by Onkelos]: Until the entire generation will be [סַף] finished.","p":[{"q":"What does \"תספה\" mean according to Rashi?","o":["You will be destroyed and perish","You will be seized and punished","You will be taken captive"]}]},"19:16.1":{"e":"Lot lingered in order to save his property.","pe":"He hesitated, and the men grabbed his hand and the hand of his wife and two daughters, for Adonoy had pity on him. They brought him out and placed him outside the city.","re":"He hesitated. In order to salvage his possessions.","p":[{"q":"Why did Lot \"ויתמהמה\" when the angels urged him?","o":["In order to save his property","Because he did not believe the city would be overturned","Because he was waiting for his sons-in-law to join him"]}]},"19:16.2":{"e":"One of the angels was sent to save Lot and his fellow to overturn Sodom, and therefore later it says \"ויאמר\" in the singular.","pe":"He hesitated, and the men grabbed his hand and the hand of his wife and two daughters, for Adonoy had pity on him. They brought him out and placed him outside the city.","re":"[They] grabbed. One of them [the angels] had the mission of saving him while his fellow [angel had the mission] to overturn Sedom. It is, therefore, written: He said, “Escape!” and it does not say, They said.","p":[{"q":"Why, after the angels seized Lot, does it say \"ויאמר המלט\" and not \"ויאמרו\"?","o":["Because only one was the messenger to save, and the other to overturn Sodom","Because only one of them knew how to speak Lot's language","Because the other had already gone ahead to Tzoar"]}]},"19:17.1":{"e":"The angel says to Lot: it is enough for you to save lives, and do not take pity on property.","pe":"When they were brought out [of the city], he [the angel] said, Escape for your life! Do not look back! Do not remain anywhere in the valley. Escape to the mountain, lest you be swept away.","re":"Escape for your life. Let it suffice for you to save lives. Pay no heed to possessions.","p":[{"q":"What was the angel telling Lot with the words \"המלט עלנפשך\"?","o":["Be content with saving lives and do not spare your property","Flee quickly because your life is in immediate danger","Try to save the lives of the people of the city as well"]}]},"19:17.2":{"e":"Lot sinned together with the people of Sodom and was saved only in the merit of Avraham, so he is not worthy of seeing their punishment while he himself is saved.","pe":"When they were brought out [of the city], he [the angel] said, Escape for your life! Do not look back! Do not remain anywhere in the valley. Escape to the mountain, lest you be swept away.","re":"Do not look back! You participated in their evil ways and only for the sake of Avraham are you saved. You are not worthy to see their punishment while you [yourself] are being rescued.","p":[{"q":"Why was Lot forbidden \"אלתביט אחריך\"?","o":["Because he too sinned with them, and is not worthy of seeing their punishment","Because the terrible sight would make him faint","Because looking back would delay him from escaping"]}]},"19:17.3":{"e":"\"הככר\" is the plain of the Jordan.","pe":"When they were brought out [of the city], he [the angel] said, Escape for your life! Do not look back! Do not remain anywhere in the valley. Escape to the mountain, lest you be swept away.","re":"Anywhere in the valley. [This refers to] the plain of Jordan.","p":[{"q":"Which \"ככר\" is meant in the verse?","o":["The plain of the Jordan","The plain near Chevron","The plain of the land of Egypt"]}]},"19:17.4":{"e":"The angel told Lot to flee to Avraham, who lives in the mountain. Although it is written that Avraham lived in Chevron, he had many tents that stretched from the mountain to Chevron.","pe":"When they were brought out [of the city], he [the angel] said, Escape for your life! Do not look back! Do not remain anywhere in the valley. Escape to the mountain, lest you be swept away.","re":"Escape to the mountain. Flee to Avraham who dwells in the mountain as it is said: “From there he moved to the mountain.” Now, too, he dwells there, as it is said: “Until the place where he originally had his tent.” And though it is written: “Avram set up his tents, etc.,” he had many tents which extended to Chevron.","p":[{"q":"To which mountain did the angel say \"ההרה המלט\" to Lot?","o":["To the mountain where Avraham lived","To the highest mountain in the region","To the mountain where Lot lived before coming to Sodom"]},{"q":"How does Rashi resolve the fact that it is written that Avraham lived in Chevron?","o":["Avraham's many tents stretched from the mountain to Chevron","Avraham returned from Chevron to the mountain before the event","Chevron itself is called \"the mountain\" in the verse"]}]},"19:17.5":{"e":"\"המלט\" is language of slipping away, that is, slipping out and leaving a place, and so it is in every use of \"המלטה\" in Tanach, such as birth, in which the fetus slips out of the womb.","pe":"When they were brought out [of the city], he [the angel] said, Escape for your life! Do not look back! Do not remain anywhere in the valley. Escape to the mountain, lest you be swept away.","re":"The word הִמָּלֵט means to evade. So, too, every form of הַמְלָטָה in Scripture has the meaning émisser in Old French. Similarly: “She delivered a male baby,” meaning that the fetus slipped through the womb. [or] “Escaped like a bird” [or:] “They are unable to push the load through,” [i.e.,] to push the load of excrement in their bowels.","p":[{"q":"What is the basic meaning of the term \"המלט\" according to Rashi?","o":["Slipping away, leaving a place stealthily","Running fast to a distant place","Hiding in a protected place"]}]},"19:18.1":{"e":"According to our Sages, \"אדני\" here is a holy name, because Lot says \"להחיות את נפשי,\" and only Hashem has the power to put to death and to give life. So Onkelos translated it as well.","pe":"Lot said to them, Please, not so my Master.","re":"Please, not so my Master. Our Sages said that this Name is holy for about it [this name] it is said, “To keep me alive,” [referring to] the One who has it in His power to kill or to keep alive. The Targum [also] translates it: “Please, God,”","p":[{"q":"To whom does Lot turn with the word \"אדני\" according to our Sages?","o":["To Hashem, and this is a holy name","To the angel who spoke with him","To both angels together in a respectful manner"]}]},"19:18.2":{"e":"\"אל נא\" means: do not tell me to flee to the mountain.","pe":"Lot said to them, Please, not so my Master.","re":"Please, not so. [Meaning:] please do not tell me to flee to the mountain.","p":[{"q":"What is Lot saying \"אלנא\" about?","o":["That they should not tell him to flee to the mountain","That they should not overturn the city of Sodom","That they should not force him to leave his property"]}]},"19:18.3":{"e":"The word \"נא\" here is language of request.","pe":"Lot said to them, Please, not so my Master.","re":"Please. It has the meaning of making a request.","p":[{"q":"What does the word \"נא\" mean in this verse?","o":["Language of request","Language of now and immediately","Language of warning"]}]},"19:19.1":{"e":"Lot feared that in Sodom he appeared righteous compared to the people of the city, but next to the righteous Avraham he would appear wicked and be punished. So too the Tzarfat woman said to Eliyahu.","pe":"Behold your servant has found favor in Your eyes. Great is your kindness that you have done with me, to keep me alive. I cannot escape to the mountain, lest the evil attach itself to me and I die.","re":"Lest the evil attach itself to me. [Lot thought:] When I was with the Sedomites, God saw my deeds and the deeds of the people of the city, and I appeared to be a righteous person and worthy of being rescued. But, when I will come to the righteous person I will be [seen] as an evil person. This, too, is what the woman of Zorfas said to Eliyahu: “Have you come to me to call attention to my sins?” [Meaning:] before you came to me, God saw my deeds and the deeds of my nation and I would be righteous compared to them. But, once you have come to me [then], compared to your deeds, I am an evil person.","p":[{"q":"What was Lot afraid of when he said \"פןתדבקני הרעה\" if he fled to the mountain?","o":["That next to the righteous Avraham he would appear wicked and be punished","That in the mountain he would find no water or food for himself and his daughters","That the sulfur and fire would reach the mountain as well"]}]},"19:20.1":{"e":"\"קרבה\" means that the city was settled only recently, and so its measure of sins was not yet full. Sodom was settled in the generation of the Dispersion, 52 years before its overturning, and Tzoar was settled one year after it, as hinted in the word \"נא,\" whose numerical value is 51.","pe":"Behold, please, this city is near [enough] to flee there. It is insignificant. Let me escape there! It is insignificant, and my life will be saved.","re":"This city is near [enough]. Settled “near” [in point of time], [meaning] recently settled. Therefore its measure has not yet been filled. How recent is it[s settlement]? From the generation of the Dispersion when humanity dispersed and began to settle, each in his place, which was in the year that Peleg died. From then till now there were 52 years, for Peleg died when Avraham was 48. How is this [calculated]? After Re’u was born, Peleg lived 209 years. Deduct from them 32 when Serug was born and the 30 years from Serug’s birth to Nachor’s birth giving you 62 years. And 29 years from Nachor’s birth to Terach’s birth giving you 91 years. 70 years from then to Avraham’s birth, giving you 161 years Add another 48 years, giving you 209 years. That was the year of the Dispersion. When Sedom was destroyed Avraham was 99 years old. Thus, from the generation of the Dispersion till this point, there are 52 years. The settling of Zoar took place later than the settling of Sedom and its sister cities by one year. This, then, is what is said, “Please [נָא] let me escape.” נָא having the numerical value of 51.","p":[{"q":"What does \"העיר הזאת קרבה\" mean according to Rashi?","o":["That it was settled recently and its measure was not yet full","That it is close to the place where they stood","That it is close to where Avraham lived"]},{"q":"What is hinted in the word \"נא\" in \"אמלטה נא שמה\"?","o":["That Tzoar was settled 51 years, one year after Sodom","That Lot begged and asked softly to be saved","That in Tzoar there were fifty-one righteous people"]}]},"19:20.2":{"e":"According to the Midrash, \"הלא מצער היא\" means that the city's sins are few, so it can be left alone.","pe":"Behold, please, this city is near [enough] to flee there. It is insignificant. Let me escape there! It is insignificant, and my life will be saved.","re":"It is insignificant. [Meaning:] its sins are few, and You may, therefore, spare it …","p":[{"q":"According to the Midrash, what does \"הלא מצער הוא\" mean?","o":["Its sins are few, so it can be left alone","The city is far from Sodom and will not be harmed","Lot is very sorry about the destruction of the city"]}]},"19:20.3":{"e":"The previous explanation is Midrash. According to the plain meaning, Lot argued that Tzoar is a small city with few people, so there is no need to be strict about leaving it, and there he could live.","pe":"Behold, please, this city is near [enough] to flee there. It is insignificant. Let me escape there! It is insignificant, and my life will be saved.","re":"And my life will be saved in it [the city]. This is the Midrashic explanation. However, the plain explanation of the verse is: It is a small city with few people; You should not mind sparing it so that I might live in it.","p":[{"q":"According to the plain meaning, what did Lot argue with the words \"הלא מצער הוא ותחי נפשי\"?","o":["The city is small and its people few, so there is no need to be strict about leaving it","The city is close and he could reach it quickly","The people of the city are righteous and so deserve to be saved"]}]},"19:21.1":{"e":"The angel says to Lot: it is not enough that you are saved, but I will save the entire city because of you.","pe":"He said to him, See I have also given you consideration regarding this. I will not overturn the city that you mentioned.","re":"Also … regarding this. Not only will you be saved, but, I will spare the entire city for your sake.","p":[{"q":"What does the word \"גם\" add in \"גם לדבר הזה\"?","o":["Not only Lot is saved, but the whole city because of him","Tzoar too will be overturned, but at a later time","His married daughters too will be saved in his merit"]}]},"19:21.2":{"e":"\"הפכי\" means \"I am overturning,\" like \"עד באי,\" \"אחרי ראי,\" and \"מדי דברי בו.\"","pe":"He said to him, See I have also given you consideration regarding this. I will not overturn the city that you mentioned.","re":"Overturn. [Meaning:] “I overturn” as in עַד בּוֹאִי — “Until I come” [or as in] אַחֲרֵי רוֹאִי —“After I have seen.” [or] מִדֵּי דַבְּרִי בּוֹ —“When I speak of him.”","p":[{"q":"What does the word \"הפכי\" mean according to Rashi?","o":["I am overturning","You overturn, as a command","They will overturn, in the plural"]}]},"19:22.1":{"e":"The angels were punished for saying \"כי משחיתים אנחנו\" and attributing the matter to themselves, so they did not move from there until they were compelled to say that the matter was not in their power.","pe":"Hurry, escape there, for I can do nothing until you get there. The city was therefore called Zoar.","re":"For I can do [nothing]. This was a punishment for the angels. Since they had said, “We are going to destroy this place, thereby, attributing themselves, they, therefore, could not leave from there until they were obliged to state that the thing was not in their control.","p":[{"q":"Why did the angel say \"כי לא אוכל לעשות דבר\"?","o":["This was their punishment for attributing the destruction to themselves","Because the sun had not yet risen on the earth","Because Lot prayed that the city not be overturned"]}]},"19:22.2":{"e":"\"לא אוכל\" is said in the singular, and from this we learn that one angel overturns and one saves, since two angels are not sent for one mission.","pe":"Hurry, escape there, for I can do nothing until you get there. The city was therefore called Zoar.","re":"For I cannot. [לֹא אוּכַל] is in the singular form. From this you can learn that one destroys and the other rescues because two angels are not sent for one thing [mission].","p":[{"q":"What do we learn from \"לא אוכל\" being said in the singular?","o":["That one overturns and one saves, since two angels are not sent for one mission","That only one angel actually descended to Sodom","That the angel spoke in the name of Hashem"]}]},"19:22.3":{"e":"The city was called \"צוער\" after Lot's words \"והוא מצער,\" that is, a small city.","pe":"Hurry, escape there, for I can do nothing until you get there. The city was therefore called Zoar.","re":"The city was therefore called Zoar. Based on [Lot’s words:] “It is insignificant.”","p":[{"q":"After what was the city named \"צוער\"?","o":["After Lot's words that it is \"מצער,\" meaning small","After the distress Lot felt in his flight","After the first king who built it"]}]},"19:24.1":{"e":"Wherever it says \"וה'\" with a vav, it means Hashem and His court.","pe":"Adonoy caused to rain upon Sedom and Amorah—sulfur and fire—from Adonoy, from heaven.","re":"Adonoy caused to rain. Where וה' [with a ו] appears in Scripture, [it represents] Him and His Heavenly Court.","p":[{"q":"What does the vav in the words \"ויהוה המטיר\" teach?","o":["That Hashem and His court caused it to rain","That Hashem did it alone without any messenger","That the angels caused it to rain in Hashem's name"]}]},"19:24.2":{"e":"The punishment of Sodom came at dawn, when the sun and moon are both visible in the sky. This way sun worshippers and moon worshippers could not claim that their god would have saved them had they been punished during its reign.","pe":"Adonoy caused to rain upon Sedom and Amorah—sulfur and fire—from Adonoy, from heaven.","re":"To rain upon Sedom. At the advent of the morning, as it is said: “At the break of dawn.” It is the time when the moon is in the sky together with the sun. Since some of them worshiped the sun and some of them, the moon. God said: If I punish them by day, the moon-worshipers will say, were it at night when the moon rules, we would not have been destroyed. And if I punish them by night the sun-worshipers will say were it by day, when the sun rules, we would not have been destroyed. It, therefore states: “At the break of dawn”— he punished them at a time when both the sun and the moon rule.","p":[{"q":"Why, according to Rashi, was Sodom punished specifically at dawn?","o":["So that sun or moon worshippers could not claim that their god would have saved them","So that the whole world would see the punishment in daylight","So that Lot would manage to reach Tzoar before the overturning"]}]},"19:24.3":{"e":"At first ordinary rain fell, and only afterward did it turn into sulfur and fire.","pe":"Adonoy caused to rain upon Sedom and Amorah—sulfur and fire—from Adonoy, from heaven.","re":"Caused to rain … sulfur and fire. It began as rain and turned into sulfur and fire.","p":[{"q":"What does Rashi teach from the word \"המטיר\" regarding sulfur and fire?","o":["At first rain fell, and afterward it turned into sulfur and fire","The sulfur and fire fell in great quantity like rain","Sulfur fell first and after it a rain of fire"]}]},"19:24.4":{"e":"The verse says \"מאת ה'\" instead of \"מאתי\" because that is the way of Scripture: the speaker mentions himself by name, as Lemech said \"נשי למך\" and Achashverosh said \"בשם המלך.\"","pe":"Adonoy caused to rain upon Sedom and Amorah—sulfur and fire—from Adonoy, from heaven.","re":"From Adonoy. It is usual for Scripture to express it so, as in “The wives of Lemech” and he did not say, my wives. Likewise, Dovid said, “Take your master’s servants with you” and he did not say, my servants. Likewise Achashverosh said, “In the name of the king” and he did not say, in my name. Here, too, it states, “from God” and it does not state, from Him.","p":[{"q":"Why does it say \"מאת יהוה\" and not \"מאתו,\" if Hashem Himself is the one raining?","o":["That is the way of Scripture, that the speaker mentions himself by name","Because the angel was the one who rained, on Hashem's mission","To teach that the heavenly court agreed to the punishment"]}]},"19:24.5":{"e":"From heaven Hashem brings both punishment and good: when He punishes, He brings down fire from heaven as in Sodom, and when He benefits, He brings down manna from heaven.","pe":"Adonoy caused to rain upon Sedom and Amorah—sulfur and fire—from Adonoy, from heaven.","re":"From heaven. This is what Scripture means when saying: “For by them [the heavens] He punishes nations,” etc. When He comes to punish mankind He brings fire upon them from the heavens as He did to Sedom. And when He comes to cause Manna to fall [it was also] from the heavens. [As the verse states:] “Behold, I will cause bread to rain from heaven for you.”","p":[{"q":"What does Rashi teach from the words \"מן השמים\"?","o":["From heaven Hashem brings both punishment and good, like the manna","The fire did not come from the earth but descended from above","That the punishment was decreed on Sodom in the heavenly court"]}]},"19:25.1":{"e":"The four cities were built on one rock, and Hashem overturned them all together from top to bottom.","pe":"He overturned these cities, and the entire plain, and all those who lived in the cities and all that grew upon the ground.","re":"He overturned these cities. The four of them were located on one rock [formation] and he turned them upside down, as it is said: “He reached for the rock,” etc.","p":[{"q":"How does Rashi describe the overturning of the cities?","o":["All four sat on one rock, and Hashem overturned it from top to bottom","Each city was burned separately and afterward swallowed into the earth","The cities were destroyed by an earthquake that struck the whole plain"]}]},"19:26.1":{"e":"His wife looked behind Lot, that is, toward the destroyed city behind him.","pe":"His [Lot’s] wife looked behind him; and she became a pillar of salt.","re":"His [Lot’s] wife looked behind him. [Meaning: in back] of Lot.","p":[{"q":"According to Rashi, \"מאחריו\" of whom?","o":["Behind Lot","Behind the angel who took them out","Behind the city of Sodom"]}]},"19:26.2":{"e":"Lot's wife sinned with salt and was punished with salt: when Lot asked her to give salt to the guests, she refused and said that she would not establish this bad custom of hospitality.","pe":"His [Lot’s] wife looked behind him; and she became a pillar of salt.","re":"And she became a pillar of salt. She sinned with salt and she was punished with salt. He [Lot] said to her, “Serve some salt to the guests.” She said to him, “Even this evil custom, do you mean to introduce in this place?”","p":[{"q":"Why was Lot's wife punished specifically by becoming a pillar of salt?","o":["Because she sinned with salt, when she refused to give salt to the guests","Because the salt that fell on Sodom covered her as she looked","Because she looked back at the Dead Sea that formed there"]}]},"19:28.1":{"e":"\"קיטור\" means a column of smoke rising up.","pe":"He [Avraham] stared at Sedom and Amorah, and the whole land of the plain, and he saw the heavy smoke rising from the earth like the smoke of a furnace.","re":"Heavy smoke. [Meaning] a column of smoke, torche in Old French.","p":[{"q":"What does \"קיטר\" mean according to Rashi?","o":["A column of smoke rising upward","Steam from boiling water","The smell of burning incense"]}]},"19:28.2":{"e":"A kivshan is a dug pit in which stones are burned to produce lime, and this is its meaning everywhere in the Torah.","pe":"He [Avraham] stared at Sedom and Amorah, and the whole land of the plain, and he saw the heavy smoke rising from the earth like the smoke of a furnace.","re":"Furnace. It is an excavation in which stones are burned for lime. This is the meaning every time. כִּבְשָׁן appears in the Torah.","p":[{"q":"What does \"הכבשן\" mean according to Rashi?","o":["A pit in which stones are burned to make lime","A large oven in which bread is baked for many","A crucible in which metals such as silver and gold are melted"]}]},"19:29.1":{"e":"Hashem saved Lot in the merit of what he did for Avraham: Lot knew that Sarah was Avraham's wife, and in Egypt he did not reveal this when Avraham said she was his sister, so Hashem took pity on him.","pe":"When Elohim destroyed the cities of the plain; Elohim remembered Avraham, and He sent Lot out of the upheaval when He overturned the cities in which Lot had lived.","re":"Elohim remembered Avraham. How does the remembering of Avraham affect Lot? He remembered that Lot had known that Sarah was Avraham’s wife, and heard Avraham say in Egypt, about Sarah, “She is my sister,” and he [Lot] did not betray him because he was sympathetic towards him. Therefore, God took pity on him [Lot].","p":[{"q":"What is the connection between \"ויזכר אלהים אתאברהם\" and the saving of Lot?","o":["Lot did not reveal in Egypt that Sarah was Avraham's wife, so Hashem took pity on him","Avraham prayed for Lot, and Hashem remembered his prayer","Hashem remembered His promise to Avraham to protect his whole family"]}]},"19:30.1":{"e":"Lot was afraid to live in Tzoar because it was near Sodom.","pe":"Lot went up from Zoar and lived in the mountain; and his two daughters went with him, for he was afraid to live in Zoar. He lived in a cave, he and his two daughters.","re":"For he was afraid to live in Zoar. Since it was near Sedom.","p":[{"q":"Why was Lot afraid to live in Tzoar, even though it was spared from the overturning?","o":["Because Tzoar was near Sodom","Because the people of Tzoar were as wicked as the people of Sodom","Because he feared his daughters would marry people of Tzoar"]}]},"19:31.1":{"e":"The older daughter said that their father was old, and that if they did not do it now, he might die or cease to be able to father children.","pe":"The older girl said to the younger, Our father is old, and there is no man [left] on earth who will come into us in the normal manner.","re":"Our father is old. If not now, when? He may die or cease having children.","p":[{"q":"Why did the older daughter specifically mention that \"אבינו זקן\"?","o":["If not now, perhaps he will die or stop fathering children","Because an old man does not notice what is happening around him","Because an old man needs his daughters to take care of all his needs"]}]},"19:31.2":{"e":"The daughters thought that the whole world had been destroyed, as in the generation of the Flood, and therefore they said that there is no man on the earth.","pe":"The older girl said to the younger, Our father is old, and there is no man [left] on earth who will come into us in the normal manner.","re":"And there is no man [left] on earth. They thought that the entire world was destroyed as it was in the generation of the Flood. (From Bereishis Rabbah.)","p":[{"q":"Why did the daughters say \"ואיש אין בארץ,\" when there were people in Tzoar?","o":["They thought that the whole world had been destroyed as in the generation of the Flood","They meant that there was no suitable man for them in the area","They knew that the people of Tzoar had fled the city"]}]},"19:33.1":{"e":"Wine came their way miraculously in the cave, so that two nations would come out of them.","pe":"They urged wine upon their father that night; and the older girl went in and slept with her father. He was not aware that she lay down or got up.","re":"They urged wine, etc. Wine presented itself to them in the cave so that two nations might descend from them.","p":[{"q":"Where did Lot's daughters get wine in the cave?","o":["The wine came their way there so that two nations would come from them","They brought wine from Sodom when they fled from there","They bought wine in Tzoar before going up to the mountain"]}]},"19:33.2":{"e":"With the older daughter it is written explicitly \"ותשכב את אביה,\" and with the younger only \"ותשכב עמו.\" The younger did not initiate the act but learned from her sister, so the verse spared her and did not publicize her disgrace.","pe":"They urged wine upon their father that night; and the older girl went in and slept with her father. He was not aware that she lay down or got up.","re":"And slept with her father. Concerning the younger daughter it states: “And she slept with him.” In the case of the younger one, since she did not initiate the illicit relations, but, rather, learned it from her sister Scripture covers up for her and does not explicitly state her shame. Whereas, concerning the older daughter, who initiated the illicit relations Scripture explicitly publicizes it.","p":[{"q":"Why is it said of the older daughter \"ותשכב אתאביה\" and of the younger only \"עמו\"?","o":["The older initiated it, and the younger only learned from her","The older was greater and therefore her guilt was more severe","The younger did not know that it was her father"]}]},"19:33.3":{"e":"The word \"ובקומה\" of the older daughter has a dot over it, to teach that when she rose Lot knew what had happened, and nevertheless he did not take care not to drink on the second night.","pe":"They urged wine upon their father that night; and the older girl went in and slept with her father. He was not aware that she lay down or got up.","re":"[Or that she] got up. The word וּבְקוּמָהּ of the older daughter is written with dots above it, to tell us that once she arose he [Lot] was aware [of what had happened] and, nevertheless, he was not careful not to drink on the following night. [R. Levi said: whoever is inflamed by illicit desires in the end will be made to eat his own flesh.","p":[{"q":"What does the dot on \"ובקומה\" of the older daughter teach?","o":["That when she rose Lot knew, and yet he drank again on the second night","That the older daughter got up immediately and did not stay until morning","That Lot did not know at all, neither when she lay down nor when she rose"]}]},"19:36.1":{"e":"Although a woman does not usually conceive from a first relation, Lot's daughters took action themselves and conceived from the first relation.","pe":"Lot’s two daughters became pregnant from their father.","re":"[They] became pregnant. Although a woman does not conceive from her first marital relations, [nevertheless,] these did it with themselves and deflowered themselves and conceived from the first relations.","p":[{"q":"What is the novelty, according to Rashi, in both daughters conceiving in a single night?","o":["A woman does not conceive from a first relation, and they took action so that they would conceive","The daughters were mature in years and so conceived quickly","Hashem performed a miracle for them so that Lot would not know what happened"]}]},"19:37.1":{"e":"The older daughter, who was not modest, named her son \"מואב\" and publicized that he was from her father. The younger named her son in clean language, and received a reward for this in the days of Moshe: regarding Ammon all provocation was forbidden, and regarding Moav only war was forbidden.","pe":"The older girl gave birth to a son and she named him Moav. He is the ancestor of the Moabite nation even to this day.","re":"Moav. This [daughter] who was not modest openly stated that he is of her father, but, the younger one named him euphemistically and was rewarded for this in the days of Moshe, as it is said concerning the Amonites, “Do not incite them”—in any manner. Whereas, concerning Moav it [the Torah] forbids only to wage war against them, but irritating them was permitted.","p":[{"q":"What did Rashi learn from the name \"מואב\" that the older daughter gave her son?","o":["That she was not modest and publicized that the son was from her father","That she was ashamed of the act and tried to hide it","That she named him after the place where he was born"]},{"q":"What reward did the younger daughter receive for naming her son in clean language?","o":["In the days of Moshe it was forbidden to provoke Ammon in any way","Her descendants were chosen to be kings in Israel","The land of Ammon was given to Israel as an inheritance"]}]},"20:1.1":{"e":"Avraham traveled from there when he saw that the cities had been destroyed and travelers had ceased to pass through, leaving him no one to host. According to another explanation, he traveled to distance himself from Lot, about whom a bad reputation had arisen, that he had relations with his daughters.","pe":"Avraham journeyed from there to the land of the Negev, and he lived between Kadeish and Shur. He lived for a while in Gerar.","re":"Avraham journeyed from there. When he saw that the cities were destroyed and the travelers ceased passing by he departed from there. An alternate explanation: In order to distance himself from Lot who had acquired a bad reputation that he was incestuous with his daughters.","p":[{"q":"According to the first explanation in Rashi, why did Avraham travel from there?","o":["The cities were destroyed and travelers ceased to pass through","He feared that the fire from Sodom would reach him too","He wanted to look for a good pasture for his flock"]},{"q":"According to the second explanation in Rashi, why did Avraham travel?","o":["To distance himself from Lot, about whom a bad reputation had arisen","To get closer to Lot and help him in the cave","To distance himself from Avimelech, king of Gerar"]}]},"20:2.1":{"e":"In Gerar Avraham did not ask Sarah's permission to say that she was his sister, but said it against her will, since she had already been taken to Pharaoh's house because of this.","pe":"Avraham said regarding Sarah, his wife, She is my sister. Avimelech, king of Gerar sent [messengers] and took Sarah.","re":"Avraham said. Here, he did not ask her consent but, [did it] against her will, since she had already been taken to Pharoah’s house because of this.","p":[{"q":"What is the difference between Avraham's statement here and his statement in Egypt?","o":["Here he did not ask her permission, since she had already been taken to Pharaoh because of this","Here he asked her permission, since he had already learned from the incident in Egypt","Here he said it only to Avimelech and not to all the people"]}]},"20:2.2":{"e":"\"אל שרה אשתו\" means \"על שרה אשתו,\" that is, Avraham said about Sarah that she was his sister. The word \"אל\" meaning \"על\" is found in other places as well.","pe":"Avraham said regarding Sarah, his wife, She is my sister. Avimelech, king of Gerar sent [messengers] and took Sarah.","re":"Regarding Sarah, his wife. [Here meaning] concerning Sarah, his wife. Similarly, “Concerning the ark being taken, etc., and concerning the death of her father-in-law,” both [words אֶל] meaning עַל —concerning.","p":[{"q":"What does \"אלשרה אשתו\" mean according to Rashi?","o":["About Sarah, that is, he said about her to others","That Avraham turned to Sarah and spoke to her","That Avraham told Sarah to say that she was his sister"]}]},"20:4.1":{"e":"Avimelech did not approach Sarah because the angel prevented him.","pe":"Avimelech had not come near to her. He said, My Master, will You also kill an innocent nation?","re":"Had not come near her. [This was so because] the angel prevented him as it is said: “I did not give you the chance to touch her.”","p":[{"q":"Why did Avimelech not approach Sarah according to Rashi?","o":["The angel prevented him","He feared Avraham and his prayer","He understood on his own that she was a married woman"]}]},"20:4.2":{"e":"Avimelech argued: would You kill a nation even if it is righteous? Is it Your way to destroy nations for nothing, as You did to the generation of the Flood and the generation of the Dispersion? If so, they too were killed for no reason, as You now want to kill me.","pe":"Avimelech had not come near to her. He said, My Master, will You also kill an innocent nation?","re":"Will You also kill an innocent nation? [Meaning] would you kill a nation even if it is righteous? Is this perhaps Your way to destroy nations without cause? You did likewise to the Flood generation and to the Dispersal generation. I also say that You killed them for no reason just as You intend to kill me.","p":[{"q":"What did Avimelech argue with the words \"הגוי גםצדיק תהרג\"?","o":["Is it Your way to kill nations for nothing, as in the generation of the Flood and the Dispersion","That his nation was more righteous than the people of Sodom and Amorah","That only he should be punished and not his entire people"]}]},"20:5.1":{"e":"The word \"גם\" includes her servants and her camel drivers and donkey drivers: Avimelech asked all of them, and they all said that Avraham was her brother.","pe":"Did he not say to me, She is my sister? And she also said, He is my brother. With an innocent heart and clean hands I did this.","re":"She also. [This was said] to include her servants, cameldrivers, and muledrivers. “I asked them all and they responded that he was her brother.”","p":[{"q":"What does the word \"גםהוא\" include in Avimelech's words?","o":["Her servants, camels, and donkey drivers, who also said that he was her brother","Sarah herself, who also thought he was her brother","The people of Gerar, who also thought so"]}]},"20:5.2":{"e":"\"בתם לבבי\" means that I did not imagine that I was committing a sin.","pe":"Did he not say to me, She is my sister? And she also said, He is my brother. With an innocent heart and clean hands I did this.","re":"With an innocent heart. [Meaning] “I had no intention of sinning.”","p":[{"q":"What does \"בתםלבבי\" mean according to Rashi?","o":["I did not think that I was committing a sin","I did not touch her at all","I took her in order to do her a favor"]}]},"20:5.3":{"e":"\"בנקיון כפי\" means that I am clean of sin, because I did not touch her.","pe":"Did he not say to me, She is my sister? And she also said, He is my brother. With an innocent heart and clean hands I did this.","re":"And clean hands. [Meaning] “I am innocent of sin for I have not touched her.”","p":[{"q":"What does \"ובנקין כפי\" mean according to Rashi?","o":["I am clean of sin, because I did not touch her","I did not know that she was a married woman","I did not take any money from her"]}]},"20:6.1":{"e":"Hashem acknowledged that Avimelech did not intend to sin from the outset, but did not acknowledge clean hands, because it was not thanks to him that he did not touch her.","pe":"Elohim said to him in a dream, I also know that you did this with an innocent heart. I also prevented you from sinning against Me. That is why I did not give you the chance to touch her.","re":"I know that with an innocent heart, etc. “It is true that at first you had no intention of sinning, but, do not claim clean hands [because…].","p":[{"q":"Why does Hashem answer only \"בתם לבבך\" (the integrity of your heart) and not mention \"נקיון כפים\" (clean hands)?","o":["Because his heart was sincere, but there were not clean hands here","Because his clean hands were already obvious to everyone","Because Hashem did not believe that he really had not touched her"]}]},"20:6.2":{"e":"It was not to Avimelech's credit that he did not touch Sarah; rather, Hashem held him back from sinning and did not give him the power. \"Nasan\" in the sense of \"allowed\" or \"permitted\" appears in other places as well.","pe":"Elohim said to him in a dream, I also know that you did this with an innocent heart. I also prevented you from sinning against Me. That is why I did not give you the chance to touch her.","re":"I did not give you the chance. It was not due to you that you did not touch her, but, it was I who prevented you from sinning by not giving you the strength. Similarly: “And Elohim did not let him” Similarly: “Her father did not permit him to come.”","p":[{"q":"What do the words \"לא נתתיך לנגע אליה\" teach?","o":["It was not to Avimelech's credit that he did not touch her; rather, Hashem did not give him the power","Hashem did not give Sarah to Avimelech as a gift","Avimelech himself refrained from touching her out of fear of Heaven"]}]},"20:7.1":{"e":"Hashem told Avimelech to return Sarah, and not to worry that Avraham would not accept her because she had become repulsive to him, or that he would hate him and not pray for him.","pe":"Now return the man’s wife, for he is a prophet. He will pray for you and you will live. If you do not return her, you should know that you will surely die—you and all that is yours.","re":"Return the man’s wife. And do not think: perhaps she has become repugnant in his eyes and he will not accept her [back] or that he will hate you and not pray for you…","p":[{"q":"What is Hashem reassuring Avimelech about when He says \"השב אשת האיש\"?","o":["That Avraham might not accept her, or might hate him and not pray for him","That the people of Gerar would be angry with him for returning her","That Sarah herself might not want to return to Avraham"]}]},"20:7.2":{"e":"Avraham is a prophet and therefore knows that Avimelech did not touch Sarah, and for that reason he will pray on his behalf.","pe":"Now return the man’s wife, for he is a prophet. He will pray for you and you will live. If you do not return her, you should know that you will surely die—you and all that is yours.","re":"For he is a prophet. And he knows that you have not touched her and will, therefore, pray for you.","p":[{"q":"Why is the reason \"כי נביא הוא\" (for he is a prophet) important for returning Sarah?","o":["As a prophet he knows you did not touch her, and therefore he will pray for you","Because a prophet is forbidden to marry a woman who was taken","Because a prophet can punish anyone who does not obey"]}]},"20:9.1":{"e":"Avimelech complains that because of Avraham an unusual plague, one that does not normally come upon any creature, struck him and his household: all the openings of the body were blocked.","pe":"Avimelech called Avraham and said to him, What have you done to us? What wrong did I do to you that you brought on me and upon my kingdom such a great sin? Deeds that ought not to be done, you have done to me.","re":"Deeds that ought not to be done. A plague that is unusual to befall any beings has befallen us because of you: the stopping up of all body orifices— [those] of semen, urine, and excrement, the ears and the nose.","p":[{"q":"According to Rashi, what unusual deeds is Avimelech complaining about?","o":["An unusual plague that blocked all the openings of the body","Taking Sarah to the king's house by force","The lie Avraham told that she was his sister"]}]},"20:11.1":{"e":"Avraham saw that in Gerar a guest who comes to town is asked about his wife and not about his needs for food and drink, and from this he understood that there is no fear of God in the place.","pe":"Avraham said, Because I said [thought] there is no fear of Elohim in this place, and they will kill me [in order] to take my wife.","re":"There is no fear of Elohim. When a guest arrives in a city, is he questioned about food and drink? or is he asked about his wife? [namely:] “Is she you wife or your sister?”","p":[{"q":"From what did Avraham conclude that there is no fear of God in this place?","o":["The guest was asked about his wife and not about food and drink","He saw the local people openly worshiping idols","He heard that Avimelech had already taken the wives of guests"]}]},"20:12.1":{"e":"Avraham said she is his sister through his father so that his words would be true, and a paternal half-sister is permitted to a descendant of Noach. And although she was his brother's daughter, grandchildren are like children, so she is considered Terach's daughter.","pe":"In any case, she is my sister, the daughter of my father, but not the daughter of my mother, and she became my wife.","re":"She is my sister, the daughter of my father. And a daughter of the same father is permitted [to be married] to a Noachide because there is no paternal relationship for a gentile. In order to make his words truthful, he responded in this fashion. [However,] should you ask: Was she not actually his brother’s daughter? [I would answer:] One’s children’s children are like one’s own children. It is in this vein that he addresses Lot: “For we are brothers [kinsmen].”","p":[{"q":"Why was it permitted for Avraham to marry his sister on his father's side?","o":["Because a non-Jew has no paternal lineage, and a paternal half-sister is permitted to a descendant of Noach","Because before the giving of the Torah all forbidden relations were permitted","Because Sarah was only a distant relative of Avraham"]},{"q":"How can Avraham say she is his father's daughter, if in fact she was his brother's daughter?","o":["Grandchildren are like children, so she is like Terach's daughter","Haran and Avraham were brothers only on their mother's side","Terach adopted Sarah as a daughter after Haran's death"]}]},"20:12.2":{"e":"Haran, Sarah's father, was born to Terach from another woman, so Sarah is related to Avraham through his father and not through his mother.","pe":"In any case, she is my sister, the daughter of my father, but not the daughter of my mother, and she became my wife.","re":"But not the daughter of my mother. Haran was of a different mother [than Avraham].","p":[{"q":"Why is Sarah not the daughter of Avraham's mother?","o":["Haran, Sarah's father, was born to Terach from a different mother","Sarah herself was born to Terach from another woman","Avraham's mother died before Sarah was born"]}]},"20:13.1":{"e":"Rashi explains the verse in its proper sense: when Hashem took Avraham out of his father's house to wander from place to place, he knew he would pass through places of wicked people, and so he asked Sarah to say that he is her brother.","pe":"When Elohim caused me to wander from my father’s house, I said to her, this is the kindness you shall do for me. At every place we come to, say of me, He is my brother.","re":"When [Elohim] caused me to wander, etc. Onkelos translated it as he chose. [However,] it can also be interpreted in a manner more fitting to the structure of the verse: When God took me out of my father’s house to be a wanderer, roaming from place to place, and I knew that I would pass through places where there are wicked people. then I said to her: “This is the kindness.”","p":[{"q":"According to Rashi's explanation, why did Avraham ask Sarah to say that he is her brother?","o":["He knew that in his wanderings he would pass through places of wicked people","Hashem commanded him so when he left his father's house","He feared they would pursue him because of his belief in Hashem"]}]},"20:13.2":{"e":"The word \"התעו\" is written in the plural, because language of divinity and authority is often written in the plural. It means wandering: one who is exiled from his place and has no settled home is called \"to'eh\" (wandering).","pe":"When Elohim caused me to wander from my father’s house, I said to her, this is the kindness you shall do for me. At every place we come to, say of me, He is my brother.","re":"When [Elohim] caused. [The verb הִתְעוּ is] in the plural form. But, do not wonder about this, because in many places that which deals with Godliness and that which deals with authority are referred to in the plural form. [E.g.,] “Whom God went [to redeem],” “the Living God,” “He is a Holy God.” All references to Godliness [or authority] are plural as in “And the master of Yoseif took him,” [or] “The Master of masters,” [or] “The master of the land.” Similarly, “If its owner was with it,” [or] “Its owner was warned.” If you ask, why the term הִתְעוּ is used here, [I would answer,] anyone exiled from his place and is not settled is referred to as תּ וֹעֶה, as in, “And she went and lost her way,” [or:] “I have strayed like a lost sheep,” [or:] “They wander without food,” [meaning:] they go out and wander seeking food.","p":[{"q":"Why is \"התעו\" written in the plural, although it refers to God?","o":["Language of divinity and authority is often expressed in the plural","It refers to many angels who took Avraham out","It refers to the idols of his father's house that led him astray"]},{"q":"What does the word \"התעו\" mean according to Rashi?","o":["Wandering, like one exiled from his place with no settled home","Error and straying from the correct path in faith","Hiding and concealment from the eyes of the local people"]}]},"20:13.3":{"e":"\"לי\" means \"עלי\" (about me): Avraham asked Sarah to say about him that he is her brother. Similarly, we find elsewhere that the letter lamed is used in the sense of \"al\" (about).","pe":"When Elohim caused me to wander from my father’s house, I said to her, this is the kindness you shall do for me. At every place we come to, say of me, He is my brother.","re":"Say of me. [לִי meaning] about me. Similarly
