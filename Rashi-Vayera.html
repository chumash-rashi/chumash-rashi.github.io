tml": "אֵֽרְדָה־נָּ֣א וְאֶרְאֶ֔ה הַכְּצַעֲקָתָ֛הּ הַבָּ֥אָה אֵלַ֖י עָשׂ֣וּ&thinsp;׀&thinsp;כָּלָ֑ה וְאִם־לֹ֖א אֵדָֽעָה׃", "pasuk_en": "I will descend now and see, if their wailing which has come to Me is indicative מתוך their conduct; destruction [shall come upon them]. If not I will know.", "rashi_he": "לִמֵּד לַדַּיָּנִים שֶׁלֹא יִפְסְקוּ דִינֵי נְפָשׁוֹת אֶלָּא בִרְאִיָּה, הַכֹּל כְּמוֹ שֶׁפֵּרַשְׁתִּי בְפָרָשַׁת הַפַּלָּגָה. דָּבָר אַחֵר, אֵרְדָה נָא לְסוֹף מַעֲשֵׂיהֶם:", "rashi_en": "This is [only] to serve as a lesson to judges not to rule on matters מתוך capital punishment unless they see it. All as I have explained in the Parshah dealing with the “dispersion.” Another explanation: “I will fathom the depths מתוך their deeds.”", "note": "", "points": [{"q": "Hashem knows everything. Why say 'ארדה נא ואראה' — I will go down and see?", "options": ["To teach judges to rule on capital cases only after seeing", "Hashem truly needed more information", "To give the malachim time to arrive"], "kasha": "Hashem doesn't need to descend to find out what Sedom did.", "answer": "To teach judges not to decide capital cases without seeing for themselves, as רש״י explained at the Dor Haflagah."}, {"q": "What is Rashi's second explanation (דבר אחר) מתוך 'ארדה נא'?", "options": ["I will go down to the end מתוך their deeds", "I will send malachim down to them", "I will lower their city into the ground"], "kasha": "'Descend' could have a figurative meaning.", "answer": "I will go down to the end מתוך their deeds."}]}, {"id": "18:21.2", "ch": 18, "v": 21, "n": 2, "dh": "הכצעקתה", "pasuk_html": "אֵֽרְדָה־נָּ֣א וְאֶרְאֶ֔ה <mark>הַכְּצַעֲקָתָ֛הּ</mark> הַבָּ֥אָה אֵלַ֖י עָשׂ֣וּ&thinsp;׀&thinsp;כָּלָ֑ה וְאִם־לֹ֖א אֵדָֽעָה׃", "pasuk_en": "I will descend now and see, if their wailing which has come to Me is indicative מתוך their conduct; destruction [shall come upon them]. If not I will know.", "rashi_he": "שֶׁל מְדִינָה:", "rashi_en": "Of the country.", "note": "", "points": [{"q": "'הכצעקתה' — 'like HER cry'. Whose cry is meant?", "options": ["The cry מתוך the country", "The cry מתוך Lot's wife", "The cry מתוך the earth itself"], "kasha": "The feminine suffix 'ה' in 'צעקתה' has no clear subject.", "answer": "The cry מתוך the country (מדינה)."}]}, {"id": "18:21.3", "ch": 18, "v": 21, "n": 3, "dh": "הבאה אלי עשו", "pasuk_html": "אֵֽרְדָה־נָּ֣א וְאֶרְאֶ֔ה הַכְּצַעֲקָתָ֛הּ <mark>הַבָּ֥אָה אֵלַ֖י עָשׂ֣וּ</mark>&thinsp;׀&thinsp;כָּלָ֑ה וְאִם־לֹ֖א אֵדָֽעָה׃", "pasuk_en": "I will descend now and see, if their wailing which has come to Me is indicative מתוך their conduct; destruction [shall come upon them]. If not I will know.", "rashi_he": "וְכֵן עוֹמְדִים בְּמִרְדָּם, כָּלָה אֲנִי עוֹשֶׂה בָהֶם, וְאִם לֹא יַעַמְדוּ בְמִרְדָּן אֵדְעָה מָה אֶעֶשֶׂה לְהִפָּרַע מֵהֶן בְּיִסּוּרִין וְלֹא אֲכַלֶּה אוֹתָן. וְכַיּוֹצֵא בוֹ מָצִינוּ בְּמָקוֹם אַחֵר, וְעַתָּה הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ וְאֵדְעָה מָה אֶעֱשֶׂה לָּךְ (שמות ל\"ג); וּלְפִיכָךְ יֵשׁ הֶפְסֵק נְקֻדַּת פְּסִיק בֵּין עָשׂוּ לְכָלָה, כְּדֵי לְהַפְרִיד תֵּבָה מֵחֲבֶרְתָּהּ. וְרַבּוֹתֵינוּ דָרְשׁוּ הַכְּצַעֲקָתָהּ – צַעֲקַת רִיבָה אַחַת שֶׁהָרְגוּ מִיתָה מְשֻׁנָּה עַל שֶׁנָּתְנָה מָזוֹן לְעָנִי, כַּמְּפֹרָשׁ בְּחֵלֶק:", "rashi_en": "And [if] they maintain their rebelliousness I will make an end מתוך them. But, “if [they do] not” maintain their rebelliousness “I will know” what to do punishing them [only] with suffering so that I [need] not destroy them. Similarly we find in another place, “Now, remove your ornaments from yourself so that I may know what to do to you.” Therefore, there is a separation מתוך a פְּסִיק between עָשׂוּ and כָּלָה in order to pause between one word and the next. Our Sages explained הַכְּצַעֲקָתָהּ [as referring to] the cry מתוך a certain maiden whom they killed with a horrible death because she gave food to a poor person as is explained in Chapter Chelek.", "note": "", "points": [{"q": "'עשו כלה ואם לא אדעה' — what is Hashem saying?", "options": ["If they persist, I'll destroy them; if not, I'll punish without destroying", "If they did it, I'll know; if not, I won't", "Whether or not they did it, they'll be destroyed"], "kasha": "The posuk is cryptic: what follows 'עשו', and what will Hashem 'know'?", "answer": "If they persist in their rebellion, I'll destroy them. If not, I'll know what to do — punish them with suffering and not wipe them out."}, {"q": "Where else do we find 'I will know what to do' meaning deciding a lighter punishment?", "options": ["'הורד עדיך מעליך ואדעה מה אעשה לך'", "'ארדה נא ואראה'", "'כי ידעתיו למען אשר יצוה'"], "kasha": "Reading 'אדעה' as 'I'll decide the punishment' needs a precedent.", "answer": "After the Eigel: 'ועתה הורד עדיך מעליך ואדעה מה אעשה לך' — remove your ornaments and I'll know what to do to you."}, {"q": "How does the trop support reading 'עשו' and 'כלה' as separate thoughts?", "options": ["A פסיק line separates עשו from כלה", "The words are joined by a makaf", "כלה has the main pause (אתנחתא)"], "kasha": "One might read 'עשו כלה' as one phrase: they made destruction.", "answer": "That's why there is a פסיק between עשו and כלה, to separate one word from the next."}, {"q": "Chazal read 'הכצעקתה' as one specific 'her'. Who?", "options": ["A girl killed cruelly for giving food to a poor man", "Sarah, crying for Lot", "The land crying from bloodshed"], "kasha": "'Her cry' suggests a particular female crying out.", "answer": "The cry מתוך a young girl whom they killed in a strange death for giving food to a poor person, as told in Perek Chelek."}]}, {"id": "18:22.1", "ch": 18, "v": 22, "n": 1, "dh": "ויפנו משם", "pasuk_html": "<mark>וַיִּפְנ֤וּ מִשָּׁם֙</mark> הָֽאֲנָשִׁ֔ים וַיֵּלְכ֖וּ סְדֹ֑מָה וְאַ֨בְרָהָ֔ם עוֹדֶ֥נּוּ עֹמֵ֖ד לִפְנֵ֥י יְהֹוָֽה׃", "pasuk_en": "The men turned from where they were, and went toward Sedom. Avraham was still standing before Adonoy.", "rashi_he": "מִמָּקוֹם שֶׁאַבְרָהָם לִוָּם שָׁם:", "rashi_en": "[I.e.,] from the place to which Avraham accompanied them.", "note": "", "points": [{"q": "'ויפנו משם' — they turned from where?", "options": ["From where Avraham had escorted them", "From Avraham's tent door", "From the city gate מתוך Sedom"], "kasha": "'משם' — no place was mentioned to turn from.", "answer": "From the place where Avraham had escorted them to."}]}, {"id": "18:22.2", "ch": 18, "v": 22, "n": 2, "dh": "ואברהם עודנו עומד לפני ה'", "pasuk_html": "וַיִּפְנ֤וּ מִשָּׁם֙ הָֽאֲנָשִׁ֔ים וַיֵּלְכ֖וּ סְדֹ֑מָה וְאַ֨בְרָהָ֔ם עוֹדֶ֥נּוּ עֹמֵ֖ד לִפְנֵ֥י יְהֹוָֽה׃", "pasuk_en": "The men turned from where they were, and went toward Sedom. Avraham was still standing before Adonoy.", "rashi_he": "וַהֲלֹא לֹא הָלַךְ לַעֲמֹד לְפָנָיו, אֶלָּא הַקָּבָּ\"ה בָּא אֶצְלוֹ וְאָמַר לוֹ, זַעֲקַת סְדֹם וַעֲמֹרָה כִּי רָבָּה, וְהָיָה לוֹ לִכְתֹּב \"וַה' עוֹדֶנּוּ עוֹמֵד עַל אַבְרָהָם\"? אֶלָּא תִּקּוּן סוֹפְרִים הוּא זֶה (אֲשֶׁר הֲפָכוּהוּ רַזִ\"לִ לִכְתֹּב כֵּן) (בראשית רבה):", "rashi_en": "But is it not so that he [Avraham] did not go to stand before Him? Rather, it was God who came to him and said to him, “The wailing concerning Sedom and Amorah is so great,” and it should have been written: “God was still standing near Avraham,” but, it is an emendation מתוך the Scribes.", "note": "", "points": [{"q": "'ואברהם עודנו עומד לפני ה' — but who came to whom in this conversation?", "options": ["Hashem came to Avraham to tell him about Sedom", "Avraham went to stand before Hashem", "The malachim brought Avraham to Hashem"], "kasha": "Avraham never went to stand before Hashem; Hashem came to him.", "answer": "Hashem came to Avraham and told him 'זעקת סדם ועמרה כי רבה', so it should have said 'Hashem was still standing by Avraham'."}, {"q": "So why is it written as 'Avraham stood before Hashem'?", "options": ["It's a תקון סופרים; Chazal reversed the wording", "Avraham moved to stand before Hashem later", "The malachim are called 'Hashem' here"], "kasha": "The wording reverses what actually happened.", "answer": "It is a תקון סופרים — Chazal reversed it to be written this way (בראשית Rabbah)."}]}, {"id": "18:23.1", "ch": 18, "v": 23, "n": 1, "dh": "ויגש אברהם", "pasuk_html": "<mark>וַיִּגַּ֥שׁ אַבְרָהָ֖ם</mark> וַיֹּאמַ֑ר הַאַ֣ף תִּסְפֶּ֔ה צַדִּ֖יק עִם־רָשָֽׁע׃", "pasuk_en": "Avraham came forward and said, Will You [actually] destroy the נכוןeous with the wicked ?", "rashi_he": "מָצִינוּ הַגָּשָׁה לַמִּלְחָמָה, וַיִּגַּשׁ יוֹאָב וְגוֹ' (שמואל ב י'), וְהַגָּשָׁה לְפִיוּס וַיִּגַּשׁ אֵלָיו יְהוּדָה, וְהַגָּשָׁה לִתְפִלָּה, וַיִּגַּשׁ אֵלִיָּהוּ הַנָּבִיא (מלכים א י\"ח), וּלְכָל אֵלֶּה נִכְנַס אַבְרָהָם לְדַבֵּר קָשׁוֹת וּלְפִיּוּס וְלִתְפִלָּה:", "rashi_en": "We find the term הַגָּשָׁה [approach] to wage war: “Yoav approached,” etc., and הַגָּשָׁה used to denote “entreaty”: “Yehudah approached him,” and הַגָּשָׁה to denote prayer: “Eliyahu the Prophet approached.” Avraham’s “approaching” was for all these: 1) to speak sternly, 2) to entreat and 3) to pray.", "note": "", "points": [{"q": "'ויגש' (approached) appears in Tanach in different contexts. Which three does רש״י list?", "options": ["War, appeasement, and prayer", "Eating, sleeping, and traveling", "Buying, selling, and judging"], "kasha": "'ויגש' is ambiguous — what kind מתוך approaching is this?", "answer": "War: 'ויגש יואב'; appeasement: 'ויגש אליו יהודה'; prayer: 'ויגש אליהו הנביא'."}, {"q": "Which מתוך these kinds מתוך approaching did Avraham do?", "options": ["All three: harsh words, appeasement, and prayer", "Only prayer", "Only war, with harsh words"], "kasha": "Which meaning fits Avraham here?", "answer": "Avraham came for all מתוך them: to speak harshly, to appease, and to pray."}]}, {"id": "18:23.2", "ch": 18, "v": 23, "n": 2, "dh": "האף תספה", "pasuk_html": "וַיִּגַּ֥שׁ אַבְרָהָ֖ם וַיֹּאמַ֑ר <mark>הַאַ֣ף תִּסְפֶּ֔ה</mark> צַדִּ֖יק עִם־רָשָֽׁע׃", "pasuk_en": "Avraham came forward and said, Will You [actually] destroy the נכוןeous with the wicked ?", "rashi_he": "הֲגַם תִּסְפֶּה. וּלְתַרְגּוּם שֶׁל אֻנְקְלוֹס, שֶׁתִּרְגְּמוֹ לְשׁוֹן רֹגֶז, כָּךְ פֵּרוּשׁוֹ, הַאַף יַשִּׂיאֲךָ שֶׁתִּסְפֶּה צַדִּיק עִם רָשָׁע:", "rashi_en": "[Meaning:] Would you destroy? According to Onkelos who translated it as meaning anger this is its explanation: Would Your anger sway You that You would destroy the נכוןeous with the wicked?", "note": "", "points": [{"q": "'האף תספה' — what does 'האף' mean in the simple reading?", "options": ["'Would You even' destroy", "'Certainly' destroy", "'Quickly' destroy"], "kasha": "'האף' is an unusual word here.", "answer": "It means 'הגם' — would You even destroy?"}, {"q": "Onkelos translates 'אף' as anger. How does the phrase read then?", "options": ["Would anger lead You to destroy the נכוןeous with the wicked?", "Will You be angry at the נכוןeous?", "Is Your anger at Sedom over?"], "kasha": "Onkelos's translation needs to fit the sentence.", "answer": "Would Your anger push You to destroy the נכוןeous together with the wicked?"}]}, {"id": "18:24.1", "ch": 18, "v": 24, "n": 1, "dh": "אולי יש חמשים צדיקים", "pasuk_html": "אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּת֣וֹךְ הָעִ֑יר הַאַ֤ף תִּסְפֶּה֙ וְלֹא־תִשָּׂ֣א לַמָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַצַּדִּיקִ֖ם אֲשֶׁ֥ר בְּקִרְבָּֽהּ׃", "pasuk_en": "Suppose there are fifty נכוןeous people in the midst מתוך the city, will You still destroy it, and not bear with the place for the sake מתוך the fifty נכוןeous people inside it?", "rashi_he": "עֲשָׂרָה צַדִּיקִים לְכָל כְּרַךְ וּכְרַךְ, כִּי ה' מְקוֹמוֹת יֵשׁ. וְאִם תֹּאמַר: לֹא יַצִּילוּ הַצַּדִּיקִים אֶת הָרְשָׁעִים, לָמָּה תָּמִית הַצַּדִּיקִים?", "rashi_en": "Ten נכוןeous for each city, because there were five places. And if You will respond that the נכוןeous will not save the wicked [but,] why should the נכוןeous die?", "note": "", "points": [{"q": "Why does Avraham start specifically with fifty נכוןeous people?", "options": ["Ten for each מתוך the five cities", "Fifty is the size מתוך a minyan", "Fifty was Sedom's whole population"], "kasha": "Why the number fifty?", "answer": "Ten נכוןeous for each city, since there were five places."}, {"q": "What if Hashem answers that the נכוןeous can't save the wicked? What does Avraham argue next?", "options": ["Then at least why kill the נכוןeous themselves?", "Then let the wicked do teshuvah first", "Then destroy only the biggest city"], "kasha": "The posuk has two requests: spare the place, and don't destroy the נכוןeous.", "answer": "And if You say the נכוןeous won't save the wicked — why kill the נכוןeous?"}]}, {"id": "18:25.1", "ch": 18, "v": 25, "n": 1, "dh": "חלילה לך", "pasuk_html": "חָלִ֨לָה לְּךָ֜ מֵעֲשֹׂ֣ת&thinsp;׀ כַּדָּבָ֣ר הַזֶּ֗ה לְהָמִ֤ית צַדִּיק֙ עִם־רָשָׁ֔ע וְהָיָ֥ה כַצַּדִּ֖יק כָּרָשָׁ֑ע חָלִ֣לָה לָּ֔ךְ הֲשֹׁפֵט֙ כׇּל־הָאָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׃", "pasuk_en": "It would be sacrilege [to attribute] to You such an act, to kill the נכוןeous with the wicked, treating the נכוןeous and the wicked alike. It would be sacrilege to attribute this to You : Shall the Judge מתוך all the earth not do justice?", "rashi_he": "חֻלִּין הוּא לְךָ, יֹאמְרוּ כָךְ הוּא אֻמָּנוּתוֹ, שׁוֹטֵף הַכֹּל, צֵדִּיקִים וּרְשָׁעִים, כָּךְ עָשִׂיתָ לְדוֹר הַמַּבּוּל וּלְדוֹר הַפַּלָּגָה:", "rashi_en": "[I.e.,] it is prמתוךane for You. It will be said: This is His craft, to destroy everything, the נכוןeous as well as the wicked. This is what you did to the Flood generation, and to the Dispersion generation.", "note": "", "points": [{"q": "'חלילה לך' — what does חלילה mean literally?", "options": ["Prמתוךane (חולין) — unbecoming for You", "A request: please, for Your sake", "Forbidden by Your Torah"], "kasha": "'חלילה' is an unusual word — what does it mean?", "answer": "'חולין הוא לך' — it would be a prמתוךane thing for You."}, {"q": "Why would it be a 'prמתוךanation' מתוך Hashem?", "options": ["People would say His trade is wiping out everyone, as before", "The malachim would doubt Hashem", "Avraham's guests would stop believing"], "kasha": "What disgrace would come from destroying everyone?", "answer": "People will say: that's His craft, sweeping away all, נכוןeous and wicked, as You did to the Flood generation and the Dispersion generation."}]}, {"id": "18:25.2", "ch": 18, "v": 25, "n": 2, "dh": "כדבר הזה", "pasuk_html": "חָלִ֨לָה לְּךָ֜ מֵעֲשֹׂ֣ת&thinsp;׀ <mark>כַּדָּבָ֣ר הַזֶּ֗ה</mark> לְהָמִ֤ית צַדִּיק֙ עִם־רָשָׁ֔ע וְהָיָ֥ה כַצַּדִּ֖יק כָּרָשָׁ֑ע חָלִ֣לָה לָּ֔ךְ הֲשֹׁפֵט֙ כׇּל־הָאָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׃", "pasuk_en": "It would be sacrilege [to attribute] to You such an act, to kill the נכוןeous with the wicked, treating the נכוןeous and the wicked alike. It would be sacrilege to attribute this to You : Shall the Judge מתוך all the earth not do justice?", "rashi_he": "לֹא הוּא וְלֹא כַּיּוֹצֵא בוֹ:", "rashi_en": "[Meaning] neither this nor anything like it.", "note": "", "points": [{"q": "Why 'כדבר הזה' — 'LIKE this thing' — rather than just 'this thing'?", "options": ["Neither this nor anything similar to it", "Exactly this and nothing else", "Only if it happens again"], "kasha": "The 'כ' (like) seems extra.", "answer": "Not this, and not anything like it."}]}, {"id": "18:25.3", "ch": 18, "v": 25, "n": 3, "dh": "חלילה לך", "pasuk_html": "חָלִ֨לָה לְּךָ֜ מֵעֲשֹׂ֣ת&thinsp;׀ כַּדָּבָ֣ר הַזֶּ֗ה לְהָמִ֤ית צַדִּיק֙ עִם־רָשָׁ֔ע וְהָיָ֥ה כַצַּדִּ֖יק כָּרָשָׁ֑ע חָלִ֣לָה לָּ֔ךְ הֲשֹׁפֵט֙ כׇּל־הָאָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׃", "pasuk_en": "It would be sacrilege [to attribute] to You such an act, to kill the נכוןeous with the wicked, treating the נכוןeous and the wicked alike. It would be sacrilege to attribute this to You : Shall the Judge מתוך all the earth not do justice?", "rashi_he": "לָעוֹלָם הַבָּא:", "rashi_en": "In the World-to-Come.", "note": "", "points": [{"q": "'חלילה לך' appears twice in the posuk. What does the second one refer to?", "options": ["The World to Come", "This world", "The time מתוך Mashiach"], "kasha": "'חלילה לך' is repeated.", "answer": "In the World to Come."}]}, {"id": "18:25.4", "ch": 18, "v": 25, "n": 4, "dh": "השופט כל הארץ", "pasuk_html": "חָלִ֨לָה לְּךָ֜ מֵעֲשֹׂ֣ת&thinsp;׀ כַּדָּבָ֣ר הַזֶּ֗ה לְהָמִ֤ית צַדִּיק֙ עִם־רָשָׁ֔ע וְהָיָ֥ה כַצַּדִּ֖יק כָּרָשָׁ֑ע חָלִ֣לָה לָּ֔ךְ הֲשֹׁפֵט֙ כׇּל־הָאָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׃", "pasuk_en": "It would be sacrilege [to attribute] to You such an act, to kill the נכוןeous with the wicked, treating the נכוןeous and the wicked alike. It would be sacrilege to attribute this to You : Shall the Judge מתוך all the earth not do justice?", "rashi_he": "נָקוּד בַּחֲטַף פַּתָּח ה\"א שֶׁל הֲשׁוֹפֵט, לְשׁוֹן תְּמִיהָ, וְכִי מִי שֶׁהוּא שׁוֹפֵט לֹא יַעֲשֶׂה מִשְׁפַּט אֱמֶת:", "rashi_en": "The ה מתוך הֲשוֹפֵט is vocalized with a חֲטָף פַּתַּח as an expression מתוך incredulity. I.e., can it be that He who is Judge should fail to do true justice?", "note": "", "points": [{"q": "'השפט כל הארץ' — the ה has a חטף פתח. What does that tell us?", "options": ["It's a question מתוך disbelief: shall the Judge not do justice?", "It means 'the Judge' — a title", "It's a command: Judge, do justice!"], "kasha": "The ה could be 'the' or a question marker.", "answer": "The חטף פתח makes it a question מתוך wonder: can it be that the One who is Judge won't do true justice?"}]}, {"id": "18:26.1", "ch": 18, "v": 26, "n": 1, "dh": "אם אמצא בסדם וגו' לכל המקום", "pasuk_html": "וַיֹּ֣אמֶר יְהֹוָ֔ה אִם־אֶמְצָ֥א בִסְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּת֣וֹךְ הָעִ֑יר וְנָשָׂ֥אתִי לְכׇל־הַמָּק֖וֹם בַּעֲבוּרָֽם׃", "pasuk_en": "Adonoy said; If, in Sedom, I find fifty נכוןeous within the city, I will bear with the entire place for their sake.", "rashi_he": "לְכָל הַכְּרַכִּים; וּלְפִי שֶׁסְּדוֹם הָיְתָה מֶטְרוֹפּוֹלִין וַחֲשׁוּבָה מִכֻּלָּם, תָּלָה בָהּ הַכָּתוּב:", "rashi_en": "[בִסְדֹם refers] to all the cities. Since Sedom was a metropolis and the most important מתוך them all, Scripture refers to her.", "note": "", "points": [{"q": "Avraham asked about all the cities, yet Hashem says 'בסדם'. What does 'Sedom' refer to here?", "options": ["All the cities — 'לכל המקום'", "Only the city מתוך Sedom", "Only Lot's household"], "kasha": "Hashem names only Sedom, though five cities were at stake.", "answer": "It refers to all the cities: 'I will spare the entire place'."}, {"q": "Then why does the posuk mention Sedom by name?", "options": ["It was the capital, the most important city", "Most נכוןeous people lived there", "Lot lived in Sedom"], "kasha": "If all five are meant, why single out Sedom?", "answer": "Sedom was the metropolis, the most important מתוך them all, so the posuk hangs it on Sedom."}]}, {"id": "18:27.1", "ch": 18, "v": 27, "n": 1, "dh": "הואלתי", "pasuk_html": "וַיַּ֥עַן אַבְרָהָ֖ם וַיֹּאמַ֑ר הִנֵּה־נָ֤א <mark>הוֹאַ֙לְתִּי֙</mark> לְדַבֵּ֣ר אֶל־אֲדֹנָ֔י וְאָנֹכִ֖י עָפָ֥ר וָאֵֽפֶר׃", "pasuk_en": "Avraham responded and said, Here I have begun to speak to my Master, and I am but dust and ashes.", "rashi_he": "רָצִיתִי כְּמוֹ וַיּוֹאֶל מֹשֶׁה (שמות ב'):", "rashi_en": "[Meaning] “I was willing,” as in “And Moshe was willing.”", "note": "", "points": [{"q": "'הנה נא הואלתי לדבר' — what does 'הואלתי' mean?", "options": ["I wished / was willing", "I was afraid", "I was finished"], "kasha": "'הואלתי' is an unusual word.", "answer": "'I wished', as in 'ויואל משה' — Moshe was willing."}]}, {"id": "18:27.2", "ch": 18, "v": 27, "n": 2, "dh": "ואנכי עפר ואפר", "pasuk_html": "וַיַּ֥עַן אַבְרָהָ֖ם וַיֹּאמַ֑ר הִנֵּה־נָ֤א הוֹאַ֙לְתִּי֙ לְדַבֵּ֣ר אֶל־אֲדֹנָ֔י <mark>וְאָנֹכִ֖י עָפָ֥ר וָאֵֽפֶר׃</mark>", "pasuk_en": "Avraham responded and said, Here I have begun to speak to my Master, and I am but dust and ashes.", "rashi_he": "וּכְבָר הָיִיתִי רָאוּי לִהְיוֹת עָפָר עַל יְדֵי הַמְּלָכִים, וְאֵפֶר עַל יְדֵי נִמְרוֹד, לוּלֵי רַחֲמֶיךָ אֲשֶׁר עָמְדוּ לִי:", "rashi_en": "[I.e.,] I would already have been reduced to dust by the kings, and to ashes by Nimrod, were it not for Your mercy that stood by me.", "note": "", "points": [{"q": "'ואנכי עפר ואפר' — beyond humility, what dust and ashes is Avraham referring to?", "options": ["Dust by the kings, ashes by Nimrod, but for Hashem's mercy", "Man is created from dust and returns to it", "Sedom will soon be dust and ashes"], "kasha": "Why specifically both 'dust' and 'ashes'?", "answer": "I would already have become dust through the kings and ashes through Nimrod, were it not for Your mercy that stood by me."}]}, {"id": "18:28.1", "ch": 18, "v": 28, "n": 1, "dh": "התשחית בחמשה", "pasuk_html": "א֠וּלַ֠י יַחְסְר֞וּן חֲמִשִּׁ֤ים הַצַּדִּיקִם֙ חֲמִשָּׁ֔ה <mark>הֲתַשְׁחִ֥ית בַּחֲמִשָּׁ֖ה</mark> אֶת־כׇּל־הָעִ֑יר וַיֹּ֙אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם־אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַחֲמִשָּֽׁה׃", "pasuk_en": "But suppose they lack five מתוך the fifty נכוןeous? Will You destroy all the city because מתוך five? He said, I will not destroy if I find forty-five there.", "rashi_he": "וַהֲלֹא הֵן ט' לְכָל כְּרַךְ, וְאַתָּה צַדִּיקוֹ שֶׁל עוֹלָם תִּצְטָרֵף עִמָּהֶם:", "rashi_en": "Would there, not be nine for each city? and You, the Righteous One מתוך the universe, can be counted with them.", "note": "", "points": [{"q": "Why would forty-five be enough to save five cities?", "options": ["Nine per city, plus Hashem counted as the tenth", "Five מתוך the cities were small", "Lot's family filled the missing five"], "kasha": "Forty-five is short מתוך ten per city.", "answer": "That's nine for each city, and You, the Righteous One מתוך the world, can join with them."}]}, {"id": "18:29.1", "ch": 18, "v": 29, "n": 1, "dh": "אולי ימצאון שם ארבעים", "pasuk_html": "וַיֹּ֨סֶף ע֜וֹד לְדַבֵּ֤ר אֵלָיו֙ וַיֹּאמַ֔ר <mark>אוּלַ֛י יִמָּצְא֥וּן שָׁ֖ם אַרְבָּעִ֑ים</mark> וַיֹּ֙אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה בַּעֲב֖וּר הָאַרְבָּעִֽים׃", "pasuk_en": "He [Avraham] continued to speak to Him and said, Suppose there are forty found there? He said, I will not do it for the sake מתוך the forty.", "rashi_he": "וְיִמָּלְטוּ ד' הַכְּרַכִּים וְכֵן ל' יַצִּילוּ ג' מֵהֶם אוֹ כ' יַצִּילוּ ב' מֵהֶם אוֹ י' יַצִּילוּ אֶחָד מֵהֶם:", "rashi_en": "And, thereby, four cities will be saved. Similarly thirty will save three מתוך them, or twenty will save two מתוך them, or ten will save one מתוך them.", "note": "", "points": [{"q": "'אולי ימצאון שם ארבעים' — what would forty נכוןeous accomplish?", "options": ["Save four cities; thirty three, twenty two, ten one", "Save all five cities", "Save only the נכוןeous themselves"], "kasha": "Forty is less than ten per city — what is Avraham asking?", "answer": "Four cities would be saved. Likewise thirty would save three, twenty two, and ten one."}]}, {"id": "18:31.1", "ch": 18, "v": 31, "n": 1, "dh": "הואלתי", "pasuk_html": "וַיֹּ֗אמֶר הִנֵּֽה־נָ֤א <mark>הוֹאַ֙לְתִּי֙</mark> לְדַבֵּ֣ר אֶל־אֲדֹנָ֔י אוּלַ֛י יִמָּצְא֥וּן שָׁ֖ם עֶשְׂרִ֑ים וַיֹּ֙אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּעֲב֖וּר הָֽעֶשְׂרִֽים׃", "pasuk_en": "He said, Here I wished to speak to my Master. Suppose twenty are found there? He said, I will not destroy for the sake מתוך the twenty.", "rashi_he": "רָצִיתִי, כְּמוֹ וַיּוֹאֶל מֹשֶׁה (שמות ב'):", "rashi_en": "[Meaning] “I was willing,” as in: “And Moshe was willing.”", "note": "", "points": [{"q": "'הואלתי' appears again. What does it mean?", "options": ["I wished / was willing", "I dared", "I began to fear"], "kasha": "'הואלתי' is an unusual word.", "answer": "'I wished', like 'ויואל משה'."}]}, {"id": "18:32.1", "ch": 18, "v": 32, "n": 1, "dh": "אולי ימצאון שם עשרה", "pasuk_html": "וַ֠יֹּ֠אמֶר אַל־נָ֞א יִ֤חַר לַֽאדֹנָי֙ וַאֲדַבְּרָ֣ה אַךְ־הַפַּ֔עַם <mark>אוּלַ֛י יִמָּצְא֥וּן שָׁ֖ם עֲשָׂרָ֑ה</mark> וַיֹּ֙אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּעֲב֖וּר הָעֲשָׂרָֽה׃", "pasuk_en": "He said, Let not my Master show anger, and I will speak just once more. Suppose ten are found there? He said, I will not destroy for the sake מתוך the ten.", "rashi_he": "עַל הַפָּחוּת לֹא בִקֵּשׁ, אָמַר דוֹר הַמַּבּוּל הָיוּ ח', נֹחַ וּבָנָיו וּנְשֵׁיהֶם, וְלֹא הִצִּילוּ עַל דּוֹרָם; וְעַל ט' עַל יְדֵי צֵרוּף כְּבָר בִּקֵּשׁ וְלֹא מָצָא:", "rashi_en": "For anything less he made no request [because] he thought: The flood generation had eight. Noach, his children and their wives, and they did not save their generation, and for nine, including counting [God] he had already asked but could not find.", "note": "", "points": [{"q": "Why does Avraham stop at ten and not ask for fewer?", "options": ["Noach's eight didn't save the Flood generation", "Ten is the most Hashem would accept", "Avraham grew tired מתוך asking"], "kasha": "Avraham kept lowering the number, then stopped at ten.", "answer": "He reasoned: the Flood generation had eight — Noach, his sons and their wives — and they didn't save their generation."}, {"q": "What about nine — why not ask for that?", "options": ["He already asked, counting Hashem, and it wasn't found", "Nine is less than Noach's eight", "Nine was never a meaningful number"], "kasha": "Nine is more than eight, so why not request it?", "answer": "Nine with Hashem joining them he had already asked for (at forty-five), and there weren't enough."}]}, {"id": "18:33.1", "ch": 18, "v": 33, "n": 1, "dh": "וילך ה' וגו'", "pasuk_html": "וַיֵּ֣לֶךְ יְהֹוָ֔ה כַּאֲשֶׁ֣ר כִּלָּ֔ה לְדַבֵּ֖ר אֶל־אַבְרָהָ֑ם וְאַבְרָהָ֖ם שָׁ֥ב לִמְקֹמֽוֹ׃", "pasuk_en": "Adonoy departed when He finished speaking to Avraham, and Avraham returned to his place.", "rashi_he": "כֵּיוָן שֶׁנִּשְׁתַּתֵּק הַסָּנֵגוֹר הָלַךְ לוֹ הַדַּיָּן:", "rashi_en": "Once the defender is silenced the Judge leaves.", "note": "", "points": [{"q": "'וילך ה' כאשר כלה לדבר' — why does Hashem leave נכון when Avraham stops?", "options": ["Once the defender falls silent, the Judge leaves", "Hashem had other places to judge", "Avraham asked Hashem to leave"], "kasha": "The posuk ties Hashem's leaving to the end מתוך the talk.", "answer": "Once the defender is silenced, the Judge departs."}]}, {"id": "18:33.2", "ch": 18, "v": 33, "n": 2, "dh": "ואברהם שב למקומו", "pasuk_html": "וַיֵּ֣לֶךְ יְהֹוָ֔ה כַּאֲשֶׁ֣ר כִּלָּ֔ה לְדַבֵּ֖ר אֶל־אַבְרָהָ֑ם וְאַבְרָהָ֖ם שָׁ֥ב לִמְקֹמֽוֹ׃", "pasuk_en": "Adonoy departed when He finished speaking to Avraham, and Avraham returned to his place.", "rashi_he": "נִסְתַּלֵּק הַדַּיָּן נִסְתַּלֵּק הַסָּנֵגוֹר, וְהַקָּטֵיגוֹר מְקַטְרֵג וּלְפִיכָךְ וַיָּבֹאוּ שְׁנֵי הַמַּלְאָכִים סְדֹמָה, לְהַשְׁחִית:", "rashi_en": "Once the Judge leaves, the defender leaves and the prosecutor accuses and as a result: “The two angels came to Sedom,” to destroy.", "note": "", "points": [{"q": "'ואברהם שב למקומו' — what happened once Avraham returned home?", "options": ["The prosecutor accused, so the malachim came to destroy Sedom", "The malachim returned to Avraham's tent", "Sedom repented and was spared for a while"], "kasha": "Why tell us that Avraham went back to his place?", "answer": "The Judge left, the defender left, and the prosecutor accuses. So: 'ויבאו שני המלאכים סדמה' — to destroy."}]}, {"id": "19:1.1", "ch": 19, "v": 1, "n": 1, "dh": "שני", "pasuk_html": "וַ֠יָּבֹ֠אוּ <mark>שְׁנֵ֨י</mark> הַמַּלְאָכִ֤ים סְדֹ֙מָה֙ בָּעֶ֔רֶב וְל֖וֹט יֹשֵׁ֣ב בְּשַֽׁעַר־סְדֹ֑ם וַיַּרְא־לוֹט֙ וַיָּ֣קׇם לִקְרָאתָ֔ם וַיִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָה׃", "pasuk_en": "The two angels came to Sedom in the evening, while Lot was sitting at the gate מתוך Sedom. Lot saw them, and he got up to greet them, and he bowed with his face to the ground.", "rashi_he": "א' לְהַשְׁחִית אֶת סְדוֹם וא' לְהַצִּיל אֶת לוֹט, וְהוּא אוֹתוֹ שֶׁבָּא לְרַפְּאוֹת אַבְרָהָם, וְהַשְּׁלִישִׁי שֶׁבָּא לְבָשֵּׂר אֶת שָׂרָה, כֵּיוָן שֶׁעָשָׂה שְׁלִיחוּתוֹ נִסְתַּלֵּק לוֹ:", "rashi_en": "One to destroy Sedom and one to save Lot. The third one who came to foretell to Sarah [מתוך her giving birth]— once he fulfilled his mission—departed.", "note": "", "points": [{"q": "Three malachim visited Avraham, but 'שני המלאכים' — only two — come to Sedom. Where did the third go?", "options": ["He came only to tell Sarah, and left after his mission", "He stayed behind to guard Avraham's tent", "He went ahead to warn Lot's sons-in-law"], "kasha": "Three malachim came to Avraham, yet only two arrive in Sedom.", "answer": "One came to destroy Sedom and one to save Lot. The third came to tell Sarah she would have a son; once he finished his mission he left."}, {"q": "Which מתוך the two malachim in Sedom was the one who had come to heal Avraham?", "options": ["The one sent to save Lot", "The one sent to destroy Sedom", "Neither; both were new malachim"], "kasha": "We know three missions, but which malach had which job?", "answer": "The malach who saved Lot was the same one who had come to heal Avraham."}]}, {"id": "19:1.2", "ch": 19, "v": 1, "n": 2, "dh": "המלאכים", "pasuk_html": "וַ֠יָּבֹ֠אוּ שְׁנֵ֨י <mark>הַמַּלְאָכִ֤ים</mark> סְדֹ֙מָה֙ בָּעֶ֔רֶב וְל֖וֹט יֹשֵׁ֣ב בְּשַֽׁעַר־סְדֹ֑ם וַיַּרְא־לוֹט֙ וַיָּ֣קׇם לִקְרָאתָ֔ם וַיִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָה׃", "pasuk_en": "The two angels came to Sedom in the evening, while Lot was sitting at the gate מתוך Sedom. Lot saw them, and he got up to greet them, and he bowed with his face to the ground.", "rashi_he": "וּלְהַלָּן קְרָאָם אֲנָשִׁים? כְּשֶׁהָיְתָה שְׁכִינָה עִמָּהֶם קְרָאָם אֲנָשִׁים; דָּבָר אַחֵר אֵצֶל אַבְרָהָם שֶׁכֹּחוֹ גָדוֹל וְהָיוּ הַמַּלְאָכִים תְּדִירִין אֶצְלוֹ כַּאֲנָשִׁים קְרָאָם אֲנָשִׁים, וְאֵצֶל לוֹט קְרָאָם מַלְאָכִים (בראשית רבה):", "rashi_en": "Elsewhere they are called men. When the Divine Presence was with them they are called men. Another explanation: In relation to Avraham whose power was great and angels were as common to him as men, they are referred to as men. But, relative to Lot, they are called angels.", "note": "", "points": [{"q": "Here they are 'המלאכים', angels, but by Avraham they were called 'אנשים', men. Why the change?", "options": ["With the Shechinah present, they were called men", "They only looked like men after nightfall", "Lot could not see them clearly"], "kasha": "The same visitors are called men earlier and angels here.", "answer": "When the Shechinah was with them (by Avraham), they were called men."}, {"q": "What second explanation does רש״י give for 'men' by Avraham but 'angels' by Lot?", "options": ["Malachim were as common to Avraham as men; not to Lot", "Avraham did not realize they were malachim", "Lot was greater than Avraham in seeing malachim"], "kasha": "The first answer doesn't explain why Lot specifically sees them as angels.", "answer": "Avraham's power was great and malachim were as common by him as people, so they're called men; relative to Lot they are called malachim (בראשית Rabbah)."}]}, {"id": "19:1.3", "ch": 19, "v": 1, "n": 3, "dh": "בערב", "pasuk_html": "וַ֠יָּבֹ֠אוּ שְׁנֵ֨י הַמַּלְאָכִ֤ים סְדֹ֙מָה֙ <mark>בָּעֶ֔רֶב</mark> וְל֖וֹט יֹשֵׁ֣ב בְּשַֽׁעַר־סְדֹ֑ם וַיַּרְא־לוֹט֙ וַיָּ֣קׇם לִקְרָאתָ֔ם וַיִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָה׃", "pasuk_en": "The two angels came to Sedom in the evening, while Lot was sitting at the gate מתוך Sedom. Lot saw them, and he got up to greet them, and he bowed with his face to the ground.", "rashi_he": "וְכִי כָל כָּךְ שָׁהוּ הַמַּלְאָכִים מֵחֶבְרוֹן לִסְדוֹם? אֶלָּא מַלְאֲכֵי רַחֲמִים הָיוּ וּמַמְתִּינִים שֶׁמָּא יוּכַל אַבְרָהָם לְלַמֵּד עֲלֵיהֶם סַנֵּגוֹרְיָא:", "rashi_en": "Did it take that long for the angels [to travel] from Chevron to Sedom? But, they were angels מתוך mercy, and they procrastinated— perhaps Avraham will succeed [in his attempt] to defend them.", "note": "", "points": [{"q": "The malachim reach Sedom only 'בערב', in the evening. Why did the short trip from Chevron take so long?", "options": ["They waited, hoping Avraham could defend Sedom", "They stopped to rest on the way", "Malachim may only travel at night"], "kasha": "Chevron to Sedom isn't far — why did they arrive only in the evening?", "answer": "They were malachim מתוך mercy, and they delayed, waiting in case Avraham could succeed in defending Sedom."}]}, {"id": "19:1.4", "ch": 19, "v": 1, "n": 4, "dh": "ולוט ישב בשער סדום", "pasuk_html": "וַ֠יָּבֹ֠אוּ שְׁנֵ֨י הַמַּלְאָכִ֤ים סְדֹ֙מָה֙ בָּעֶ֔רֶב וְל֖וֹט יֹשֵׁ֣ב בְּשַֽׁעַר־סְדֹ֑ם וַיַּרְא־לוֹט֙ וַיָּ֣קׇם לִקְרָאתָ֔ם וַיִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָה׃", "pasuk_en": "The two angels came to Sedom in the evening, while Lot was sitting at the gate מתוך Sedom. Lot saw them, and he got up to greet them, and he bowed with his face to the ground.", "rashi_he": "ישב כְּתִיב, אוֹתוֹ הַיּוֹם מִנּוּהוּ שׁוֹפֵט עֲלֵיהֶם (בראשית רבה):", "rashi_en": "It is written יָשַׁב [without a ו because] on that day they appointed him to be their judge.", "note": "", "points": [{"q": "'ולוט ישב בשער סדם' — the word ישב is written without a ו. What does רש״י learn from this?", "options": ["That day they appointed Lot as their judge", "Lot sat there only briefly", "Lot was too old to stand"], "kasha": "'ישב' is written missing the ו, hinting at a special 'sitting'.", "answer": "It is written ישב (like 'sat' in מתוךfice): that very day the people מתוך Sedom appointed Lot as a judge over them (בראשית Rabbah)."}]}, {"id": "19:1.5", "ch": 19, "v": 1, "n": 5, "dh": "וירא לוט וגו'", "pasuk_html": "וַ֠יָּבֹ֠אוּ שְׁנֵ֨י הַמַּלְאָכִ֤ים סְדֹ֙מָה֙ בָּעֶ֔רֶב וְל֖וֹט יֹשֵׁ֣ב בְּשַֽׁעַר־סְדֹ֑ם וַיַּרְא־לוֹט֙ וַיָּ֣קׇם לִקְרָאתָ֔ם וַיִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָה׃", "pasuk_en": "The two angels came to Sedom in the evening, while Lot was sitting at the gate מתוך Sedom. Lot saw them, and he got up to greet them, and he bowed with his face to the ground.", "rashi_he": "מִבֵּית אַבְרָהָם לָמַד לַחֲזֹר עַל הָאוֹרְחִים:", "rashi_en": "He had learned from the house מתוך Avraham to seek out travelers.", "note": "", "points": [{"q": "'וירא לוט ויקם לקראתם' — why did Lot rush to greet strangers in a city like Sedom?", "options": ["He learned from Avraham's house to seek out guests", "He was the city's מתוךficial greeter", "He recognized them as malachim"], "kasha": "Why would Lot, living in Sedom, go out to meet travelers?", "answer": "He had learned from Avraham's house to seek out guests."}]}, {"id": "19:2.1", "ch": 19, "v": 2, "n": 1, "dh": "הנה נא אדני", "pasuk_html": "וַיֹּ֜אמֶר הִנֶּ֣ה נָּא־אֲדֹנַ֗י ס֣וּרוּ נָ֠א אֶל־בֵּ֨ית עַבְדְּכֶ֤ם וְלִ֙ינוּ֙ וְרַחֲצ֣וּ רַגְלֵיכֶ֔ם וְהִשְׁכַּמְתֶּ֖ם וַהֲלַכְתֶּ֣ם לְדַרְכְּכֶ֑ם וַיֹּאמְר֣וּ לֹּ֔א כִּ֥י בָרְח֖וֹב נָלִֽין׃", "pasuk_en": "He said, Behold now my lords, please turn in to your servant’s house. Stay over night, bathe your feet, and get up early and continue on your way. They said, No, we will spend the night in the street.", "rashi_he": "הִנֵּה נָא אַתֶּם אֲדוֹנִים לִי אַחַר שֶׁעֲבַרְתֶּם עָלַי. דָּבָר אַחֵר הִנֵּה נָא צְרִיכִים אַתֶּם לָתֵת לֵב עַל הָרְשָׁעִים הַלָּלוּ שֶׁלֹּא יַכִּירוּ בָכֶם וְזוֹ הִיא עֵצָה נְכוֹנָה:", "rashi_en": "[Meaning:] “Behold, you are now my masters since you have passed by me.” Another explanation: “Behold, now, you must be careful in regard to these cruel people that they not become aware מתוך you.” And, therefore, this is the proper advice.", "note": "", "points": [{"q": "Lot says 'הנה נא אדני' — 'Behold now, my lords.' What does he mean by 'behold now'?", "options": ["You are now my masters, since you passed by me", "Look, my lords, night is falling", "Behold, I am your servant forever"], "kasha": "'הנה נא' seems to point to something — what is Lot calling attention to?", "answer": "'Behold, you are now my masters, since you have passed by me.'"}, {"q": "What second explanation does רש״י give for 'הנה נא'?", "options": ["Be careful these wicked people don't notice you", "Behold, the city is about to be destroyed", "Look how wealthy my house is"], "kasha": "The first explanation leaves open what 'הנה נא' calls attention to.", "answer": "'Behold, you must be careful about these wicked people, that they don't recognize you' — and this is good advice."}]}, {"id": "19:2.2", "ch": 19, "v": 2, "n": 2, "dh": "סורו נא", "pasuk_html": "וַיֹּ֜אמֶר הִנֶּ֣ה נָּא־אֲדֹנַ֗י <mark>ס֣וּרוּ נָ֠א</mark> אֶל־בֵּ֨ית עַבְדְּכֶ֤ם וְלִ֙ינוּ֙ וְרַחֲצ֣וּ רַגְלֵיכֶ֔ם וְהִשְׁכַּמְתֶּ֖ם וַהֲלַכְתֶּ֣ם לְדַרְכְּכֶ֑ם וַיֹּאמְר֣וּ לֹּ֔א כִּ֥י בָרְח֖וֹב נָלִֽין׃", "pasuk_en": "He said, Behold now my lords, please turn in to your servant’s house. Stay over night, bathe your feet, and get up early and continue on your way. They said, No, we will spend the night in the street.", "rashi_he": "עַקְּמוּ אֶת הַדֶּרֶךְ לְבֵיתִי דֶרֶךְ עֲקַלָּתוֹן שֶׁלֹּא יַכִּירוּ שֶׁאַתֶּם נִכְנָסִין שָׁם, לְכָךְ נֶאֱמַר סוּרוּ (בראשית רבה):", "rashi_en": "Turn מתוךf the main road to my home [by means] מתוך a roundabout way so that they not become aware that you are entering there. It therefore says “turn.”", "note": "", "points": [{"q": "Why does Lot say 'סורו נא', 'turn aside', rather than simply 'come to my house'?", "options": ["Take a roundabout route so no one sees you enter", "Turn away from the city gate quickly", "Turn down the invitations מתוך others"], "kasha": "'סורו' means turning aside — why not just say 'come'?", "answer": "He told them to take a winding, roundabout way to his house so the people wouldn't notice them entering; that's why it says 'turn aside' (בראשית Rabbah)."}]}, {"id": "19:2.3", "ch": 19, "v": 2, "n": 3, "dh": "ולינו ורחצו רגליכם", "pasuk_html": "וַיֹּ֜אמֶר הִנֶּ֣ה נָּא־אֲדֹנַ֗י ס֣וּרוּ נָ֠א אֶל־בֵּ֨ית עַבְדְּכֶ֤ם <mark>וְלִ֙ינוּ֙ וְרַחֲצ֣וּ רַגְלֵיכֶ֔ם</mark> וְהִשְׁכַּמְתֶּ֖ם וַהֲלַכְתֶּ֣ם לְדַרְכְּכֶ֑ם וַיֹּאמְר֣וּ לֹּ֔א כִּ֥י בָרְח֖וֹב נָלִֽין׃", "pasuk_en": "He said, Behold now my lords, please turn in to your servant’s house. Stay over night, bathe your feet, and get up early and continue on your way. They said, No, we will spend the night in the street.", "rashi_he": "וְכִי דַרְכָּן שֶׁל בְּנֵי אָדָם לָלוּן תְּחִלָּה וְאַחַר כָּךְ רוֹחֵץ? וְעוֹד, שֶׁהֲרֵי אַבְרָהָם אָמַר לָהֶם תְּחִלָּה רַחֲצוּ רַגְלֵיכֶם? אֶלָּא כָּךְ אָמַר לוֹט, אִם כְּשֶׁיָּבֹאוּ אַנְשֵׁי סְדוֹם וְיִרְאוּ שֶׁכְּבָר רַחֲצוּ רַגְלֵיהֶם יַעֲלִילוּ עָלַי וְיֹאמְרוּ כְּבָר עָבְרוּ שְׁנֵי יָמִים אוֹ שְׁלֹשָׁה שֶׁבָּאוּ לְבֵיתְךָ וְלֹא הוֹדַעְתָּנוּ, לְפִיכָךְ אָמַר, מוּטָב שֶׁיִתְעַכְּבוּ כָּאן בַּאֲבַק רַגְלֵיהֶם שֶׁיִּהְיוּ נִרְאִין כְּמוֹ שֶׁבָּאוּ עַכְשָׁו; לְפִיכָךְ אָמַר לִינוּ תְּחִלָּה וְאַחַר כָּךְ רַחֲצוּ:", "rashi_en": "But, is it the manner מתוך people to first lodge overnight and then to wash afterward? And, furthermore: Avraham told them to first wash their feet! But, this is what Lot thought: If, when the Sedomites come, they will see that they already washed their feet they will make accusations against me and will say, “Two or three days have already passed since they have come into you home and you did not notify us.” He, therefore, thought: Better that they remain here with the dust on their feet so that they appear to have just arrived. He, therefore, said, “Lodge overnight,” first, and “wash” afterwards.”", "note": "", "points": [{"q": "Lot says 'ולינו ורחצו רגליכם' — stay overnight, then wash your feet. What's strange about this order?", "options": ["People wash first; Avraham also said wash first", "Guests never wash their feet at night", "Lot had no water in his house"], "kasha": "Normally one washes before lodging, and Avraham מתוךfered washing first.", "answer": "Lot wanted them to keep the dust on their feet, so they would look like they had just arrived; so he said 'lodge' first and 'wash' afterward."}, {"q": "What was Lot afraid the people מתוך Sedom would say if they saw the guests' feet already washed?", "options": ["They've been here days and you didn't tell us", "You are hiding stolen goods in your house", "You wasted precious water on strangers"], "kasha": "Why would washed feet put Lot in danger?", "answer": "They would accuse him: 'Two or three days have passed since they came to your house, and you didn't inform us!'"}]}, {"id": "19:2.4", "ch": 19, "v": 2, "n": 4, "dh": "ויאמרו לא", "pasuk_html": "וַיֹּ֜אמֶר הִנֶּ֣ה נָּא־אֲדֹנַ֗י ס֣וּרוּ נָ֠א אֶל־בֵּ֨ית עַבְדְּכֶ֤ם וְלִ֙ינוּ֙ וְרַחֲצ֣וּ רַגְלֵיכֶ֔ם וְהִשְׁכַּמְתֶּ֖ם וַהֲלַכְתֶּ֣ם לְדַרְכְּכֶ֑ם <mark>וַיֹּאמְר֣וּ לֹּ֔א</mark> כִּ֥י בָרְח֖וֹב נָלִֽין׃", "pasuk_en": "He said, Behold now my lords, please turn in to your servant’s house. Stay over night, bathe your feet, and get up early and continue on your way. They said, No, we will spend the night in the street.", "rashi_he": "וּלְאַבְרָהָם אָמְרוּ כֵּן תַּעֲשֶׂה, מִכָּאן שֶׁמְּסָרְבִין לְקָטָן וְאֵין מְסָרְבִין לְגָדוֹל (בראשית רבה):", "rashi_en": "Whereas to Avraham they said, “Do [as you said].” From this [we may derive] that one may decline the מתוךfer מתוך an inferior but should not decline the מתוךfer מתוך a superior.", "note": "", "points": [{"q": "The malachim answer Lot 'לא' — no. How did they answer Avraham's invitation?", "options": ["They accepted: 'כן תעשה', do as you said", "They also refused at first", "They didn't answer him at all"], "kasha": "Why do they refuse Lot when they accepted Avraham's מתוךfer immediately?", "answer": "To Avraham they said 'כן תעשה' — do as you said — but to Lot they said 'no'."}, {"q": "What rule מתוך conduct does רש״י learn from the difference?", "options": ["Decline a lesser person, but not a great person", "Always refuse the first invitation", "Never accept hospitality in a wicked city"], "kasha": "The contrast between their answers teaches a general lesson.", "answer": "One may decline the מתוךfer מתוך a lesser person, but one does not decline the מתוךfer מתוך a great person (בראשית Rabbah)."}]}, {"id": "19:2.5", "ch": 19, "v": 2, "n": 5, "dh": "כי ברחוב נלין", "pasuk_html": "וַיֹּ֜אמֶר הִנֶּ֣ה נָּא־אֲדֹנַ֗י ס֣וּרוּ נָ֠א אֶל־בֵּ֨ית עַבְדְּכֶ֤ם וְלִ֙ינוּ֙ וְרַחֲצ֣וּ רַגְלֵיכֶ֔ם וְהִשְׁכַּמְתֶּ֖ם וַהֲלַכְתֶּ֣ם לְדַרְכְּכֶ֑ם וַיֹּאמְר֣וּ לֹּ֔א <mark>כִּ֥י בָרְח֖וֹב נָלִֽין׃</mark>", "pasuk_en": "He said, Behold now my lords, please turn in to your servant’s house. Stay over night, bathe your feet, and get up early and continue on your way. They said, No, we will spend the night in the street.", "rashi_he": "הֲרֵי כִּי מְשַׁמֵּשׁ בִּלְשׁוֹן אֶלָּא, שֶׁאָמְרוּ לֹא נָסוּר אֶל בֵּיתְךָ אֶלָּא בִּרְחוֹבָהּ שֶׁל עִיר נָלִין:", "rashi_en": "Here, כִּי is used to mean “but,” for, in effect, they said, “We will not veer מתוךf to your home, but will lodge in the city street all night.”", "note": "", "points": [{"q": "'לא כי ברחוב נלין' — the word כי usually means 'because.' What does it mean here?", "options": ["'But' — no, but we'll sleep in the street", "'Because' — we refuse because מתוך the street", "'Perhaps' — maybe we'll sleep outside"], "kasha": "'Because' doesn't fit — 'no, because we'll sleep in the street' makes no sense.", "answer": "Here כי means 'but': 'We will not turn to your house, but we will lodge in the city street.'"}]}, {"id": "19:3.1", "ch": 19, "v": 3, "n": 1, "dh": "ויסרו אליו", "pasuk_html": "וַיִּפְצַר־בָּ֣ם מְאֹ֔ד <mark>וַיָּסֻ֣רוּ אֵלָ֔יו</mark> וַיָּבֹ֖אוּ אֶל־בֵּית֑וֹ וַיַּ֤עַשׂ לָהֶם֙ מִשְׁתֶּ֔ה וּמַצּ֥וֹת אָפָ֖ה וַיֹּאכֵֽלוּ׃", "pasuk_en": "He urged them greatly, and they turned in to him and came to his house. He made a feast for them, and baked matzos, and they ate.", "rashi_he": "עִקְּמוּ אֶת הַדֶּרֶךְ לְצַד בֵּיתוֹ:", "rashi_en": "They took a roundabout way to his home.", "note": "", "points": [{"q": "'ויסרו אליו' — they 'turned aside' to him. What does 'turned aside' mean here?", "options": ["They took a roundabout route to his house", "They turned their backs on the city", "They changed their minds about refusing"], "kasha": "Why say 'turned aside' rather than just 'came'?", "answer": "They took a winding route to his house (as Lot had asked)."}]}, {"id": "19:3.2", "ch": 19, "v": 3, "n": 2, "dh": "ומצות אפה", "pasuk_html": "וַיִּפְצַר־בָּ֣ם מְאֹ֔ד וַיָּסֻ֣רוּ אֵלָ֔יו וַיָּבֹ֖אוּ אֶל־בֵּית֑וֹ וַיַּ֤עַשׂ לָהֶם֙ מִשְׁתֶּ֔ה <mark>וּמַצּ֥וֹת אָפָ֖ה</mark> וַיֹּאכֵֽלוּ׃", "pasuk_en": "He urged them greatly, and they turned in to him and came to his house. He made a feast for them, and baked matzos, and they ate.", "rashi_he": "פֶּסַח הָיָה:", "rashi_en": "It was Pesach.", "note": "", "points": [{"q": "'ומצות אפה' — why did Lot bake matzos, מתוך all things?", "options": ["It was Pesach", "He was in too much מתוך a hurry", "Matzos were Sedom's custom"], "kasha": "Why specifically matzos?", "answer": "It was Pesach."}]}, {"id": "19:4.1", "ch": 19, "v": 4, "n": 1, "dh": "טרם ישכבו ואנשי העיר אנשי סדום", "pasuk_html": "טֶ֘רֶם֮ יִשְׁכָּ֒בוּ֒ וְאַנְשֵׁ֨י הָעִ֜יר אַנְשֵׁ֤י סְדֹם֙ נָסַ֣בּוּ עַל־הַבַּ֔יִת מִנַּ֖עַר וְעַד־זָקֵ֑ן כׇּל־הָעָ֖ם מִקָּצֶֽה׃", "pasuk_en": "They had not yet lain down when the men מתוך the city, the men מתוך Sedom, surrounded the house—young and old alike—all the people from one end [מתוך the city] to the other end.", "rashi_he": "כָּךְ נִדְרַשׁ בִּבְ\"רַ טֶרֶם יִשְׁכָּבוּ וְאַנְשֵׁי הָעִיר הָיוּ בְּפִיהֶם שֶׁל מַלְאָכִים, שֶׁהָיוּ שׁוֹאֲלִים לְלוֹט מַה טִּיבָם וּמַעֲשֵׂיהֶם וְהוּא אוֹמֵר לָהֶם רֻבָּם רְשָׁעִים; עוֹדָם מְדַבְּרִים בָּהֶם וְאַנְשֵׁי סְדוֹם וְגוֹ'. וּפְשׁוּטוֹ שֶׁל מִקְרָא וְאַנְשֵׁי הָעִיר אַנְשֵׁי רֶשַׁע, נָסַבּוּ עַל הַבַּיִת; עַל שֶׁהָיוּ רְשָׁעִים נִקְרָאִים אַנְשֵׁי \"סְדוֹם\", כְּמוֹ שֶׁאָמַר הַכָּתוּב וְאַנְשֵׁי סְדֹם רָעִים וְחַטָּאִים:", "rashi_en": "It is thus expounded in בראשית Rabbah. Before they lay down and [already] the people מתוך the city were being discussed by the angels; they were asking Lot about their character and their deeds and he answered them that the majority are evil. As they were discussing them “And the men מתוך Sedom,” etc. However, the plain explanation מתוך the verse is: The people מתוך the city who were evil people surrounded the house. Because they were evil people, they are referred to as Sedomites as Scripture states: “The people מתוך Sedom were wicked and sinful.”", "note": "", "points": [{"q": "Per the Midrash, how is 'טרם ישכבו ואנשי העיר' read — what was happening before they lay down?", "options": ["The malachim were discussing the townspeople with Lot", "The malachim were praying for Sedom", "Lot was hiding the malachim upstairs"], "kasha": "'Before they lay down, and the people מתוך the city' — the sentence seems incomplete.", "answer": "The people מתוך the city were 'in the mouths' מתוך the malachim: they asked Lot about their character and deeds, he said most were wicked, and while still talking, the men מתוך Sedom came (בראשית Rabbah)."}, {"q": "By the plain meaning, why say both 'אנשי העיר' and 'אנשי סדם' — isn't that repetitive?", "options": ["'Men מתוך Sedom' means wicked men", "Men from two different cities came", "The second phrase lists the city's leaders"], "kasha": "'Men מתוך the city' and 'men מתוך Sedom' seem to say the same thing twice.", "answer": "Plainly: the people מתוך the city, wicked men, surrounded the house. Because they were wicked they are called 'men מתוך Sedom.'"}, {"q": "Which posuk shows that 'men מתוך Sedom' is a label for wickedness?", "options": ["'ואנשי סדם רעים וחטאים'", "'ויבאו שני המלאכים סדמה'", "'זעקת סדם ועמרה כי רבה'"], "kasha": "What proves that 'men מתוך Sedom' implies wicked people?", "answer": "The posuk 'ואנשי סדם רעים וחטאים' — the men מתוך Sedom were wicked and sinful."}]}, {"id": "19:4.2", "ch": 19, "v": 4, "n": 2, "dh": "כל העם מקצה", "pasuk_html": "טֶ֘רֶם֮ יִשְׁכָּ֒בוּ֒ וְאַנְשֵׁ֨י הָעִ֜יר אַנְשֵׁ֤י סְדֹם֙ נָסַ֣בּוּ עַל־הַבַּ֔יִת מִנַּ֖עַר וְעַד־זָקֵ֑ן כׇּל־הָעָ֖ם מִקָּצֶֽה׃", "pasuk_en": "They had not yet lain down when the men מתוך the city, the men מתוך Sedom, surrounded the house—young and old alike—all the people from one end [מתוך the city] to the other end.", "rashi_he": "מִקְּצֵה הָעִיר עַד הַקָּצֶה, שֶׁאֵין אֶחָד מֵהֶם מוֹחֶה בְיָדָם, שֶׁאֲפִלּוּ צַדִּיק אֶחָד אֵין בָּהֶם:", "rashi_en": "[Meaning:] from one end מתוך the city to the other. There was not one who protested because not even one נכוןeous person was among them.", "note": "", "points": [{"q": "'כל העם מקצה' — all the people 'from the end.' From which end to which?", "options": ["From one end מתוך the city to the other", "From the gate to Lot's door", "From the young to the old"], "kasha": "'מקצה' alone is incomplete — from the end מתוך what?", "answer": "From one end מתוך the city to the other end."}, {"q": "What does it tell us that the entire city came, from end to end?", "options": ["No one protested; not one tzaddik was among them", "The whole city was curious about the guests", "Lot's house was in the city center"], "kasha": "Why stress that everyone came?", "answer": "Not one מתוך them protested, because there wasn't even one נכוןeous person among them."}]}, {"id": "19:5.1", "ch": 19, "v": 5, "n": 1, "dh": "ונדעה אותם", "pasuk_html": "וַיִּקְרְא֤וּ אֶל־לוֹט֙ וַיֹּ֣אמְרוּ ל֔וֹ אַיֵּ֧ה הָאֲנָשִׁ֛ים אֲשֶׁר־בָּ֥אוּ אֵלֶ֖יךָ הַלָּ֑יְלָה הוֹצִיאֵ֣ם אֵלֵ֔ינוּ וְנֵדְעָ֖ה אֹתָֽם׃", "pasuk_en": "They called to Lot and said to him, Where are the men who came to you tonight? Bring them out to us that we may know them.", "rashi_he": "בְּמִשְׁכַּב זָכָר כְּמוֹ אֲשֶׁר לֹא יָדְעוּ אִישׁ (בראשית רבה):", "rashi_en": "For the purpose מתוך homosexuality as in: Who have never known a man.", "note": "", "points": [{"q": "'ונדעה אותם' — 'that we may know them.' What did the people מתוך Sedom mean by 'know'?", "options": ["To commit an immoral act with them", "To find out who they were", "To question them in court"], "kasha": "'Know' here can't simply mean getting acquainted.", "answer": "They meant an act מתוך immorality (homosexual relations) with them (בראשית Rabbah)."}, {"q": "Which phrase in Lot's reply shows 'ידיעה' is used this way?", "options": ["'אשר לא ידעו איש' about his daughters", "'כי על כן באו בצל קרתי'", "'רק לאנשים האל אל תעשו דבר'"], "kasha": "What shows the word 'know' carries this meaning?", "answer": "Lot's words about his daughters, 'אשר לא ידעו איש' — 'who have not known a man.'"}]}, {"id": "19:8.1", "ch": 19, "v": 8, "n": 1, "dh": "האל", "pasuk_html": "הִנֵּה־נָ֨א לִ֜י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא־יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה־נָּ֤א אֶתְהֶן֙ אֲלֵיכֶ֔ם וַעֲשׂ֣וּ לָהֶ֔ן כַּטּ֖וֹב בְּעֵינֵיכֶ֑ם רַ֠ק לָֽאֲנָשִׁ֤ים <mark>הָאֵל֙</mark> אַל־תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי־עַל־כֵּ֥ן בָּ֖אוּ בְּצֵ֥ל קֹרָתִֽי׃", "pasuk_en": "Behold! I have two daughters who have never known a man, I will bring them out to you, and do with them as you please; only do nothing to these men, since after all, they came under the shelter מתוך my roמתוך.", "rashi_he": "כְּמוֹ הָאֵלֶּה:", "rashi_en": "[הָאֵל] is the same as הָאֵלֶּה [these].", "note": "", "points": [{"q": "'לאנשים האל' — what does the unusual word 'האל' mean here?", "options": ["'These' — the same as האלה", "'God' — the men מתוך God", "'Strong' — the mighty men"], "kasha": "'האל' is an unusual, shortened form — what does it mean?", "answer": "It is the same as האלה, 'these.'"}]}, {"id": "19:8.2", "ch": 19, "v": 8, "n": 2, "dh": "כי על כן באו", "pasuk_html": "הִנֵּה־נָ֨א לִ֜י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא־יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה־נָּ֤א אֶתְהֶן֙ אֲלֵיכֶ֔ם וַעֲשׂ֣וּ לָהֶ֔ן כַּטּ֖וֹב בְּעֵינֵיכֶ֑ם רַ֠ק לָֽאֲנָשִׁ֤ים הָאֵל֙ אַל־תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי־עַל־כֵּ֥ן בָּ֖אוּ בְּצֵ֥ל קֹרָתִֽי׃", "pasuk_en": "Behold! I have two daughters who have never known a man, I will bring them out to you, and do with them as you please; only do nothing to these men, since after all, they came under the shelter מתוך my roמתוך.", "rashi_he": "כִּי הַטּוֹבָה הַזֹּאת תַּעֲשׂוּ לִכְבוֹדִי עַל אֲשֶׁר בָּאוּ בְּצֵל קֹרָתִי; תַּרְגּוּם בִּטְלַל שָׁרוּתֵי, תַּרְגּוּם שֶׁל קוֹרָה – שָׁרוּתָא:", "rashi_en": "Do this favor out מתוך respect for me since [כִּי] they have come under the shelter מתוך my roמתוך [lit. beam]. Onkelos translates it: In the shade מתוך my beam. The Targum מתוך קוֹרָה is שֵׁרוּתָא — beam.", "note": "", "points": [{"q": "'כי על כן באו בצל קרתי' — what is Lot asking מתוך the people מתוך Sedom?", "options": ["Do this favor for my honor, since they're under my roמתוך", "Leave them alone because they're powerful", "Don't touch them because they are malachim"], "kasha": "The connection מתוך 'כי על כן' to Lot's request is unclear.", "answer": "'Do this favor for my honor, because they have come under the shade מתוך my roמתוך.'"}, {"q": "How does Onkelos translate 'בצל קרתי', and what does קורה mean?", "options": ["'בטלל שרותי' — קורה is a beam", "'בבית דירתי' — קורה is a house", "'בצל אילני' — קורה is a tree"], "kasha": "'קורה' needs explaining — what exactly is it?", "answer": "Onkelos translates 'בטלל שרותי'; the Targum מתוך קורה is שרותא, a beam — 'in the shade מתוך my beam.'"}]}, {"id": "19:9.1", "ch": 19, "v": 9, "n": 1, "dh": "ויאמרו גש הלאה", "pasuk_html": "וַיֹּאמְר֣וּ&thinsp;׀ גֶּשׁ־הָ֗לְאָה וַיֹּֽאמְרוּ֙ הָאֶחָ֤ד בָּֽא־לָגוּר֙ וַיִּשְׁפֹּ֣ט שָׁפ֔וֹט עַתָּ֕ה נָרַ֥ע לְךָ֖ מֵהֶ֑ם וַיִּפְצְר֨וּ בָאִ֤ישׁ בְּלוֹט֙ מְאֹ֔ד וַֽיִּגְּשׁ֖וּ לִשְׁבֹּ֥ר הַדָּֽלֶת׃", "pasuk_en": "They said, Step back out מתוך the way! They said, This one came as an immigrant, and now he wants to be a judge. We will now deal worse with you than with them. They pushed hard against Lot, and came near to break the door.", "rashi_he": "קְרַב לְהָלְאָה, כְּלוֹמַר, הִתְקָרֵב לַצְּדָדִין וְהִתְרַחֵק מִמֶּנּוּ, וְכֵן כָּל הָלְאָה שֶׁבַּמִּקְרָא לְשׁוֹן רִחוּק, כְּמוֹ זְרֵה הָלְאָה (במדבר י\"ז), הִנֵּה הַחֵצִי מִמְּךָ וָהָלְאָה (שמואל א' כ'), גֶּשׁ הָלְאָה, (ישעיהו מ\"ט) – הִמָּשֵׁךְ לְהַלָּן, בִּלְשׁוֹן לַעַז טריטי\"דנוש, וּדְבַר נְזִיפָה הוּא, לוֹמַר – אֵין אָנוּ חוֹשְׁשִׁין לְךָ. וְדוֹמֶה לוֹ קְרַב אֵלֶיךָ אַל תִּגַּשׁ בִּי (ישעיהו ס\"ה), וְכֵן גְּשָׁה לִּי וְאֵשֵׁבָה (שם מ\"ט) – הִמָּשֵׁךְ לַצְּדָדִין בַּעֲבוּרִי וְאֵשֵׁב אֶצְלְךָ; אַתָּה מֵלִיץ עַל הָאוֹרְחִין, אֵיךְ מְלָאֲךָ לִבְּךָ? עַל שֶׁאָמַר לָהֶם עַל הַבָּנוֹת, אָמְרוּ לוֹ <b>גש הלאה</b>, לְשׁוֹן נַחַת; וְעַל שֶׁהָיָה מֵלִיץ עַל הָאוֹרְחִים – <b>האחד בא לגור</b>, אָדָם נָכְרִי יְחִידִי אַתָּה בֵינֵינוּ, שֶׁבָּאתָ לָגוּר, <b>וישפוט שפוט</b>, וְנַעֲשֵׂיתָ מוֹכִיחַ אוֹתָנוּ?", "rashi_en": "Back away! As if to say: “Step aside and distance yourself from us.” So, too, wherever הָלְאָה appears in Scripture it has the meaning מתוך distance, as in, “Scatter הָלְאָה —afar” or: “Behold the arrows are some distance from you.” Thus, גֶשׁ הָלְאָה [means] “Draw yourself aside,” in Old French: Retire-toi de nous. It is a contemptuous way מתוך saying, “We are not considering you at all.” Similar to this: “Step aside, do not come near me.” Similarly: “Step aside and I will dwell there,” [meaning] draw aside for my sake so that I may dwell where you are. [The Sedomites were, in effect saying:] You are interceding for the travelers; how dare you do that! In response to what he said מתוך his daughters they said to him, “Step aside,” gently, in a calm manner, [but] for his interceding on behalf מתוך the travelers they said [harshly], “This one came as an immigrant,” [in effect saying:] “You are the only stranger among us who has come [only] to sojourn.” “And now he wants to be a judge.” [Meaning:] and you have become our chastiser.", "note": "", "points": [{"q": "'גש הלאה' — 'גש' usually means come close. What do the people מתוך Sedom mean here?", "options": ["Step aside and get away from us", "Come closer and talk with us", "Bring the guests out here"], "kasha": "'גש' means approach, yet 'הלאה' means away — what are they saying?", "answer": "'Move over there': step aside and distance yourself from us."}, {"q": "How does רש״י prove that 'הלאה' means distance?", "options": ["Every הלאה in Tanach means distance, e.g. 'זרה הלאה'", "Onkelos translates it as 'quickly'", "It's the opposite מתוך 'הנה', meaning here"], "kasha": "What shows הלאה means 'away'?", "answer": "Every הלאה in Tanach means distance, like 'זרה הלאה' (scatter afar) and 'החצים ממך והלאה' (the arrows are beyond you)."}, {"q": "What tone is 'גש הלאה' said in, as רש״י explains it?", "options": ["A rebuke: 'we don't care about you'", "A respectful request to step aside", "A warning out מתוך concern for Lot"], "kasha": "Why would they tell Lot to move aside?", "answer": "It's a rebuke meaning 'we pay you no attention,' like 'קרב אליך אל תגש בי' (keep to yourself, don't come near me) and 'גשה לי ואשבה' (move aside so I can sit)."}, {"q": "'ויאמרו' appears twice in the posuk. Why did they speak twice, with different words?", "options": ["Mild answer to his daughters' מתוךfer; harsh to defending guests", "Two different groups מתוך people spoke", "They repeated themselves because Lot didn't hear"], "kasha": "Why two separate 'ויאמרו' with different statements?", "answer": "To his מתוךfer מתוך his daughters they answered mildly, 'גש הלאה.' For defending the guests: 'האחד בא לגור' — you, a lone stranger who came to live here, have become our rebuker?"}]}, {"id": "19:9.2", "ch": 19, "v": 9, "n": 2, "dh": "הדלת", "pasuk_html": "וַיֹּאמְר֣וּ&thinsp;׀ גֶּשׁ־הָ֗לְאָה וַיֹּֽאמְרוּ֙ הָאֶחָ֤ד בָּֽא־לָגוּר֙ וַיִּשְׁפֹּ֣ט שָׁפ֔וֹט עַתָּ֕ה נָרַ֥ע לְךָ֖ מֵהֶ֑ם וַיִּפְצְר֨וּ בָאִ֤ישׁ בְּלוֹט֙ מְאֹ֔ד וַֽיִּגְּשׁ֖וּ לִשְׁבֹּ֥ר <mark>הַדָּֽלֶת׃</mark>", "pasuk_en": "They said, Step back out מתוך the way! They said, This one came as an immigrant, and now he wants to be a judge. We will now deal worse with you than with them. They pushed hard against Lot, and came near to break the door.", "rashi_he": "הִיא הַסּוֹבֶבֶת לִנְעֹל וְלִפְתֹּחַ:", "rashi_en": "This is [the door] that swings [on hinges] to close and open [the entrance].", "note": "", "points": [{"q": "'לשבר הדלת' — what exactly is a 'דלת'?", "options": ["The door that swings to close and open", "The opening people walk through", "The frame around the entrance"], "kasha": "'דלת' and 'פתח' (next posuk) need to be distinguished.", "answer": "The דלת is the door that swings on its hinges to close and open."}]}, {"id": "19:11.1", "ch": 19, "v": 11, "n": 1, "dh": "פתח", "pasuk_html": "וְֽאֶת־הָאֲנָשִׁ֞ים אֲשֶׁר־<mark>פֶּ֣תַח</mark> הַבַּ֗יִת הִכּוּ֙ בַּסַּנְוֵרִ֔ים מִקָּטֹ֖ן וְעַד־גָּד֑וֹל וַיִּלְא֖וּ לִמְצֹ֥א הַפָּֽתַח׃", "pasuk_en": "The men who were at the entrance מתוך the house, they struck with blindness—young and old alike—so that they wearied themselves trying to find the entrance.", "rashi_he": "הוּא הֶחָלָל שֶׁבּוֹ נִכְנָסִין וְיוֹצְאִין:", "rashi_en": "That is the opening though which [people] enter and exit.", "note": "", "points": [{"q": "'אשר פתח הבית' — how is a 'פתח' different from a 'דלת'?", "options": ["It's the opening through which people enter and exit", "It's the swinging door itself", "It's the lock on the door"], "kasha": "'פתח' needs to be distinguished from 'דלת' in the previous posuk.", "answer": "The פתח is the open space through which people go in and out."}]}, {"id": "19:11.2", "ch": 19, "v": 11, "n": 2, "dh": "בסנורים", "pasuk_html": "וְֽאֶת־הָאֲנָשִׁ֞ים אֲשֶׁר־פֶּ֣תַח הַבַּ֗יִת הִכּוּ֙ <mark>בַּסַּנְוֵרִ֔ים</mark> מִקָּטֹ֖ן וְעַד־גָּד֑וֹל וַיִּלְא֖וּ לִמְצֹ֥א הַפָּֽתַח׃", "pasuk_en": "The men who were at the entrance מתוך the house, they struck with blindness—young and old alike—so that they wearied themselves trying to find the entrance.", "rashi_he": "מַכַּת עִוָּרוֹן:", "rashi_en": "[This is] an affliction מתוך blindness.", "note": "", "points": [{"q": "'הכו בסנורים' — what does 'סנורים' mean?", "options": ["A plague מתוך blindness", "Bנכון lightning", "Sudden darkness over the city"], "kasha": "'סנורים' is an unusual word — what does it mean?", "answer": "A plague מתוך blindness."}]}, {"id": "19:11.3", "ch": 19, "v": 11, "n": 3, "dh": "מקטן ועד גדול", "pasuk_html": "וְֽאֶת־הָאֲנָשִׁ֞ים אֲשֶׁר־פֶּ֣תַח הַבַּ֗יִת הִכּוּ֙ בַּסַּנְוֵרִ֔ים מִקָּטֹ֖ן וְעַד־גָּד֑וֹל וַיִּלְא֖וּ לִמְצֹ֥א הַפָּֽתַח׃", "pasuk_en": "The men who were at the entrance מתוך the house, they struck with blindness—young and old alike—so that they wearied themselves trying to find the entrance.", "rashi_he": "הַקְּטָנִּים הִתְחִילוּ בָּעֲבֵרָה תְּחִלָּה, שֶׁנֶּאֱמַר מִנַּעַר וְעַד זָקֵן, לְפֵיכָךְ הִתְחִילָה הַפֻּרְעָנוּת מֵהֶם (בראשית רבה):", "rashi_en": "The young ones were the first in this wrongdoing as is written “Young and old alike,” therefore, the punishment began with them.", "note": "", "points": [{"q": "'מקטן ועד גדול' — why does the punishment list the young before the old?", "options": ["The young started the sin, so punishment started with them", "The young were closer to the door", "The young were weaker and fell first"], "kasha": "Why mention the young first?", "answer": "The young ones began the sin first, so the punishment began with them (בראשית Rabbah)."}, {"q": "How do we know the young ones started the sin?", "options": ["Earlier it says 'מנער ועד זקן' — young first", "Lot told the malachim the youth were wicked", "Children always lead such crowds"], "kasha": "What shows the young led the sin?", "answer": "When they surrounded the house it says 'מנער ועד זקן' — from young to old — showing the young came first."}]}, {"id": "19:12.1", "ch": 19, "v": 12, "n": 1, "dh": "עוד מי לך פה", "pasuk_html": "וַיֹּאמְר֨וּ הָאֲנָשִׁ֜ים אֶל־ל֗וֹט עֹ֚ד מִֽי־לְךָ֣ פֹ֔ה חָתָן֙ וּבָנֶ֣יךָ וּבְנֹתֶ֔יךָ וְכֹ֥ל אֲשֶׁר־לְךָ֖ בָּעִ֑יר הוֹצֵ֖א מִן־הַמָּקֽוֹם׃", "pasuk_en": "The men said to Lot, Who else do you have here—a son-in-law, your sons, your daughters? Whoever you have in the city, bring them out מתוך his place.", "rashi_he": "פְּשׁוּטוֹ שֶׁל מִקְרָא מִי יֵשׁ לְךָ עוֹד בָּעִיר הַזֹּאת חוּץ מֵאִשְׁתְּךָ וּבְנוֹתֶיךָ שֶׁבַּבַּיִת:", "rashi_en": "The plain meaning מתוך this verse is: “Whom else do you have in this city besides your wife and daughters in this house?”", "note": "", "points": [{"q": "'עד מי לך פה' — by the plain meaning, what are the malachim asking Lot?", "options": ["Who else do you have here besides your household?", "How long will you stay here?", "Who sent you to defend these people?"], "kasha": "'Who else do you have here' — else besides whom?", "answer": "Plainly: whom else do you have in this city besides your wife and daughters in the house?"}]}, {"id": "19:12.2", "ch": 19, "v": 12, "n": 2, "dh": "חתן ובניך ובנתיך", "pasuk_html": "וַיֹּאמְר֨וּ הָאֲנָשִׁ֜ים אֶל־ל֗וֹט עֹ֚ד מִֽי־לְךָ֣ פֹ֔ה <mark>חָתָן֙ וּבָנֶ֣יךָ וּבְנֹתֶ֔יךָ</mark> וְכֹ֥ל אֲשֶׁר־לְךָ֖ בָּעִ֑יר הוֹצֵ֖א מִן־הַמָּקֽוֹם׃", "pasuk_en": "The men said to Lot, Who else do you have here—a son-in-law, your sons, your daughters? Whoever you have in the city, bring them out מתוך his place.", "rashi_he": "וְאִם יֵשׁ לְךָ חָתָן אוֹ בָנִים וּבָנוֹת הוֹצֵא מִן הַמָּקוֹם:", "rashi_en": "[Meaning:] “If you have a son-in-law or sons and daughters get them away from this place.", "note": "", "points": [{"q": "'חתן ובניך ובנתיך... הוצא מן המקום' — what are the malachim instructing Lot?", "options": ["If you have such relatives, take them out", "Gather all the city's families to leave", "Ask your relatives whether to stay"], "kasha": "The list מתוך relatives needs connecting to the instruction.", "answer": "If you have a son-in-law, or sons and daughters, take them out מתוך this place."}]}, {"id": "19:12.3", "ch": 19, "v": 12, "n": 3, "dh": "ובניך", "pasuk_html": "וַיֹּאמְר֨וּ הָאֲנָשִׁ֜ים אֶל־ל֗וֹט עֹ֚ד מִֽי־לְךָ֣ פֹ֔ה חָתָן֙ <mark>וּבָנֶ֣יךָ</mark> וּבְנֹתֶ֔יךָ וְכֹ֥ל אֲשֶׁר־לְךָ֖ בָּעִ֑יר הוֹצֵ֖א מִן־הַמָּקֽוֹם׃", "pasuk_en": "The men said to Lot, Who else do you have here—a son-in-law, your sons, your daughters? Whoever you have in the city, bring them out מתוך his place.", "rashi_he": "בְּנֵי בְּנוֹתֶיךָ הַנְּשׂוּאוֹת. וּמִ\"אַ <b>עד</b> – מֵאַחַר שֶׁעוֹשִׂין נְבָלָה כָּזֹאת, <b>מי לך</b> פִּתְחוֹן פֶּה לְלַמֵּד סַנֵּגוֹרְיָא עֲלֵיהֶם? שֶׁכָּל הַלַּיְלָה הָיָה מֵלִיץ עֲלֵיהֶם טוֹבוֹת, קְרִי בֵיהּ מִי לְךָ פֶה:", "rashi_en": "[Meaning:] your married daughter’s sons. The Aggadaic explanation for the word עֹד [is]: “Since they are doing such an abhorrent thing can you still have any basis for defending them?” For, all night he [Lot] was justifying them. It should be read מִי לְךָ פֶּה.", "note": "", "points": [{"q": "'ובניך' — your sons. But Lot had no sons! Who are they?", "options": ["The sons מתוך his married daughters", "His future sons", "His servants, called 'sons'"], "kasha": "Lot had only daughters — who are 'your sons'?", "answer": "The sons מתוך his married daughters."}, {"q": "By the Midrash, what does 'עוד' express in 'עד מי לך פה'?", "options": ["After such evil, can you still defend them?", "Is there still time to escape?", "Do you have still more guests inside?"], "kasha": "The word 'עוד' (still) suggests something continuing.", "answer": "Since they do such an abomination, do you still have an opening to defend them? For all night Lot had been speaking up for them."}, {"q": "How does the Midrash read the word 'פה' in this posuk?", "options": ["As 'פֶה' — mouth", "As 'פֹה' — here", "As 'פאה' — corner"], "kasha": "How does 'here' fit the Midrash's question?", "answer": "Read it as 'מי לך פֶה' — do you still have a mouth (a basis) to defend them?"}]}, {"id": "19:14.1", "ch": 19, "v": 14, "n": 1, "dh": "חתניו", "pasuk_html": "וַיֵּצֵ֨א ל֜וֹט וַיְדַבֵּ֣ר&thinsp;׀ אֶל־<mark>חֲתָנָ֣יו</mark>&thinsp;׀ לֹקְחֵ֣י בְנֹתָ֗יו וַיֹּ֙אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן־הַמָּק֣וֹם הַזֶּ֔ה כִּֽי־מַשְׁחִ֥ית יְהֹוָ֖ה אֶת־הָעִ֑יר וַיְהִ֥י כִמְצַחֵ֖ק בְּעֵינֵ֥י חֲתָנָֽיו׃", "pasuk_en": "Lot went out and spoke to his sons-in-law who had married his daughters. He said [to them], Get up! Get out מתוך this place, for Adonoy is going to destroy the city! He appeared as a comedian in the eyes מתוך his sons-in-law.", "rashi_he": "שְׁתֵּי בָנוֹת נְשׂוּאוֹת הָיוּ לוֹ בָּעִיר:", "rashi_en": "He had two married daughters in the city.", "note": "", "points": [{"q": "'וידבר אל חתניו' — Lot spoke to his sons-in-law. Which sons-in-law?", "options": ["Husbands מתוך two married daughters in the city", "The men his two home daughters married", "The malachim, whom he called sons-in-law"], "kasha": "The two daughters at home had not 'known a man' — so who were his sons-in-law?", "answer": "Lot had two married daughters living in the city."}]}, {"id": "19:14.2", "ch": 19, "v": 14, "n": 2, "dh": "לוקחי בנותיו", "pasuk_html": "וַיֵּצֵ֨א ל֜וֹט וַיְדַבֵּ֣ר&thinsp;׀ אֶל־חֲתָנָ֣יו&thinsp;׀ לֹקְחֵ֣י בְנֹתָ֗יו וַיֹּ֙אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן־הַמָּק֣וֹם הַזֶּ֔ה כִּֽי־מַשְׁחִ֥ית יְהֹוָ֖ה אֶת־הָעִ֑יר וַיְהִ֥י כִמְצַחֵ֖ק בְּעֵינֵ֥י חֲתָנָֽיו׃", "pasuk_en": "Lot went out and spoke to his sons-in-law who had married his daughters. He said [to them], Get up! Get out מתוך this place, for Adonoy is going to destroy the city! He appeared as a comedian in the eyes מתוך his sons-in-law.", "rashi_he": "שֶׁאוֹתָן שֶׁבַּבַּיִת אֲרוּסוֹת לָהֶם:", "rashi_en": "Those to whom the ones at home were betrothed.", "note": "", "points": [{"q": "'לקחי בנתיו' — 'those taking his daughters.' Who were these men?", "options": ["Men betrothed to the daughters at home", "The husbands מתוך his married daughters", "Men who wanted to kidnap his daughters"], "kasha": "These seem separate from the 'חתניו' already mentioned.", "answer": "They were the men to whom the daughters at home were betrothed."}]}, {"id": "19:15.1", "ch": 19, "v": 15, "n": 1, "dh": "ויאיצו", "pasuk_html": "וּכְמוֹ֙ הַשַּׁ֣חַר עָלָ֔ה <mark>וַיָּאִ֥יצוּ</mark> הַמַּלְאָכִ֖ים בְּל֣וֹט לֵאמֹ֑ר קוּם֩ קַ֨ח אֶֽת־אִשְׁתְּךָ֜ וְאֶת־שְׁתֵּ֤י בְנֹתֶ֙יךָ֙ הַנִּמְצָאֹ֔ת פֶּן־תִּסָּפֶ֖ה בַּעֲוֺ֥ן הָעִֽיר׃", "pasuk_en": "At the break מתוך dawn, the angels urged Lot on, saying, Get up! Take your wife and your two daughters who are here, lest you be swept away in the iniquity מתוך the city.", "rashi_he": "כְּתַרְגּוּמוֹ וּדְחִיקוּ – מִהֲרוּהוּ:", "rashi_en": "As Onkelos translates it: “They pressed,” [meaning] they hurried him.", "note": "", "points": [{"q": "'ויאיצו המלאכים בלוט' — what does 'ויאיצו' mean?", "options": ["They hurried him", "They comforted him", "They praised him"], "kasha": "'ויאיצו' is an unusual word — what does it mean?", "answer": "As Onkelos translates, 'ודחיקו' — they pressed him, hurried him."}]}, {"id": "19:15.2", "ch": 19, "v": 15, "n": 2, "dh": "הנמצאות", "pasuk_html": "וּכְמוֹ֙ הַשַּׁ֣חַר עָלָ֔ה וַיָּאִ֥יצוּ הַמַּלְאָכִ֖ים בְּל֣וֹט לֵאמֹ֑ר קוּם֩ קַ֨ח אֶֽת־אִשְׁתְּךָ֜ וְאֶת־שְׁתֵּ֤י בְנֹתֶ֙יךָ֙ הַנִּמְצָאֹ֔ת פֶּן־תִּסָּפֶ֖ה בַּעֲוֺ֥ן הָעִֽיר׃", "pasuk_en": "At the break מתוך dawn, the angels urged Lot on, saying, Get up! Take your wife and your two daughters who are here, lest you be swept away in the iniquity מתוך the city.", "rashi_he": "הַמְזֻמָּנוֹת לְךָ בַּבַּיִת לְהַצִּילָם. וּמִ\"אַ יֵשׁ וְזֶה יִשּׁוּבוֹ שֶׁל מִקְרָא:", "rashi_en": "those who are already in the house whom you have the ability to save. There are Midrashic explanations, but, this is the plain explanation מתוך the verse.", "note": "", "points": [{"q": "'שתי בנתיך הנמצאת' — 'your two daughters who are found.' What does 'הנמצאת' add?", "options": ["Those at hand in the house, whom you can save", "Those who were lost and found again", "Those who agree to come with you"], "kasha": "'Who are found' seems unnecessary.", "answer": "It means the daughters available to you in the house, to save them. There are Midrashim, but this is the plain meaning."}]}, {"id": "19:15.3", "ch": 19, "v": 15, "n": 3, "dh": "תספה", "pasuk_html": "וּכְמוֹ֙ הַשַּׁ֣חַר עָלָ֔ה וַיָּאִ֥יצוּ הַמַּלְאָכִ֖ים בְּל֣וֹט לֵאמֹ֑ר קוּם֩ קַ֨ח אֶֽת־אִשְׁתְּךָ֜ וְאֶת־שְׁתֵּ֤י בְנֹתֶ֙יךָ֙ הַנִּמְצָאֹ֔ת פֶּן־<mark>תִּסָּפֶ֖ה</mark> בַּעֲוֺ֥ן הָעִֽיר׃", "pasuk_en": "At the break מתוך dawn, the angels urged Lot on, saying, Get up! Take your wife and your two daughters who are here, lest you be swept away in the iniquity מתוך the city.", "rashi_he": "תִּהְיֶה כָּלֶה, עַד תֹּם כָּל הַדּוֹר (דברים ב') מְתֻרְגָּם עַד דְּסַף כָּל דָּרָא:", "rashi_en": "[Meaning:] “You will be the end מתוך.” [The verse] עַד־תּוֹם כָּל־ הַדּוֹר” is translated [by Onkelos]: Until the entire generation will be [סַף] finished.", "note": "", "points": [{"q": "'פן תספה בעון העיר' — what does 'תספה' mean?", "options": ["You will be finished, destroyed", "You will be counted", "You will be taken captive"], "kasha": "'תספה' is an unusual word — what does it mean?", "answer": "You will be brought to an end."}, {"q": "What source shows that the root ספה means 'ending'?", "options": ["Onkelos translates 'עד תם כל הדור' as 'עד דסף'", "Lot's own words 'פן תדבקני הרעה'", "The malachim's word 'משחיתים'"], "kasha": "How do we know what 'ספה' means?", "answer": "The posuk 'עד תם כל הדור' (until the whole generation ended) is translated by Onkelos 'עד דסף כל דרא.'"}]}, {"id": "19:16.1", "ch": 19, "v": 16, "n": 1, "dh": "ויתמהמה", "pasuk_html": "<mark>וַֽיִּתְמַהְמָ֓הּ</mark>&thinsp;׀ וַיַּחֲזִ֨יקוּ הָאֲנָשִׁ֜ים בְּיָד֣וֹ וּבְיַד־אִשְׁתּ֗וֹ וּבְיַד֙ שְׁתֵּ֣י בְנֹתָ֔יו בְּחֶמְלַ֥ת יְהֹוָ֖ה עָלָ֑יו וַיֹּצִאֻ֥הוּ וַיַּנִּחֻ֖הוּ מִח֥וּץ לָעִֽיר׃", "pasuk_en": "He hesitated, and the men grabbed his hand and the hand מתוך his wife and two daughters, for Adonoy had pity on him. They brought him out and placed him outside the city.", "rashi_he": "כְּדֵי לְהַצִּיל אֶת מָמוֹנוֹ:", "rashi_en": "In order to salvage his possessions.", "note": "", "points": [{"q": "'ויתמהמה' — Lot hesitated. Why would he delay when the city was about to be destroyed?", "options": ["To save his possessions", "He didn't believe the malachim", "He was waiting for his sons-in-law"], "kasha": "Why would Lot linger at such a moment?", "answer": "He delayed in order to save his money."}]}, {"id": "19:16.2", "ch": 19, "v": 16, "n": 2, "dh": "ויחזיקו", "pasuk_html": "וַֽיִּתְמַהְמָ֓הּ&thinsp;׀ <mark>וַיַּחֲזִ֨יקוּ</mark> הָאֲנָשִׁ֜ים בְּיָד֣וֹ וּבְיַד־אִשְׁתּ֗וֹ וּבְיַד֙ שְׁתֵּ֣י בְנֹתָ֔יו בְּחֶמְלַ֥ת יְהֹוָ֖ה עָלָ֑יו וַיֹּצִאֻ֥הוּ וַיַּנִּחֻ֖הוּ מִח֥וּץ לָעִֽיר׃", "pasuk_en": "He hesitated, and the men grabbed his hand and the hand מתוך his wife and two daughters, for Adonoy had pity on him. They brought him out and placed him outside the city.", "rashi_he": "אֶחָד מֵהֶם הָיָה שָׁלִיחַ לְהַצִּילוֹ וַחֲבֵרוֹ לַהֲפֹךְ סְדוֹם, לְכָךְ נֶאֱמַר \"וַיֹּאמֶר\" הִמָּלֵט, וְלֹא נֶאֱמַר וַיֹּאמְרוּ (בראשית רבה):", "rashi_en": "One מתוך them [the angels] had the mission מתוך saving him while his fellow [angel had the mission] to overturn Sedom. It is, therefore, written: He said, “Escape!” and it does not say, They said.", "note": "", "points": [{"q": "Both malachim grab Lot's hand, yet next it says 'ויאמר המלט' — singular. Why?", "options": ["Only one malach was sent to save Lot", "Only one malach could speak", "Lot heard only one מתוך them"], "kasha": "Both rescued Lot, but only one is said to speak.", "answer": "One malach was sent to save him and the other to overturn Sedom; therefore it says 'ויאמר,' he said, and not 'ויאמרו' (בראשית Rabbah)."}]}, {"id": "19:17.1", "ch": 19, "v": 17, "n": 1, "dh": "המלט על נפשך", "pasuk_html": "וַיְהִי֩ כְהוֹצִיאָ֨ם אֹתָ֜ם הַח֗וּצָה וַיֹּ֙אמֶר֙ הִמָּלֵ֣ט עַל־נַפְשֶׁ֔ךָ אַל־תַּבִּ֣יט אַחֲרֶ֔יךָ וְאַֽל־תַּעֲמֹ֖ד בְּכׇל־הַכִּכָּ֑ר הָהָ֥רָה הִמָּלֵ֖ט פֶּן־תִּסָּפֶֽה׃", "pasuk_en": "When they were brought out [מתוך the city], he [the angel] said, Escape for your life! Do not look back! Do not remain anywhere in the valley. Escape to the mountain, lest you be swept away.", "rashi_he": "דַּיְּךָ לְהַצִּיל נְפָשׁוֹת, אַל תָּחוּס עַל הַמָּמוֹן:", "rashi_en": "<b>Escape for your life.</b> Let it suffice for you to save lives. Pay no heed to possessions. <b>Do not look back!</b> You participated in their evil ways and only for the sake מתוך Avraham are you saved. You are not worthy to see their punishment while you [yourself] are being rescued. <b>Anywhere in the valley.</b> [This refers to] the plain מתוך Jordan. <b>Escape to the mountain.</b> Flee to Avraham who dwells in the mountain as it is said: “From there he moved to the mountain.” Now, too, he dwells there, as it is said: “Until the place where he originally had his tent.” And though it is written: “Avram set up his tents, etc.,” he had many tents which extended to Chevron. The word הִמָּלֵט means to evade. So, too, every form מתוך הַמְלָטָה in Scripture has the meaning émisser in Old French. Similarly: “She delivered a male baby,” meaning that the fetus slipped through the womb. [or] “Escaped like a bird” [or:] “They are unable to push the load through,” [i.e.,] to push the load מתוך excrement in their bowels.", "note": "", "points": [{"q": "The malach tells Lot 'המלט על נפשך' — escape for your life. What is the message מתוך 'for your life'?", "options": ["Save your lives; don't worry about your possessions", "Run quickly, or the fire will catch you", "Pray for your soul while you escape"], "kasha": "'המלט' alone means escape — why add 'על נפשך'?", "answer": "It's enough for you to save lives; don't be concerned about the money and property."}]}, {"id": "19:17.2", "ch": 19, "v": 17, "n": 2, "dh": "אל תביט אחריך", "pasuk_html": "וַיְהִי֩ כְהוֹצִיאָ֨ם אֹתָ֜ם הַח֗וּצָה וַיֹּ֙אמֶר֙ הִמָּלֵ֣ט עַל־נַפְשֶׁ֔ךָ אַל־תַּבִּ֣יט אַחֲרֶ֔יךָ וְאַֽל־תַּעֲמֹ֖ד בְּכׇל־הַכִּכָּ֑ר הָהָ֥רָה הִמָּלֵ֖ט פֶּן־תִּסָּפֶֽה׃", "pasuk_en": "When they were brought out [מתוך the city], he [the angel] said, Escape for your life! Do not look back! Do not remain anywhere in the valley. Escape to the mountain, lest you be swept away.", "rashi_he": "אַתָּה הִרְשַׁעְתָּ עִמָּהֶם וּבִזְכוּת אַבְרָהָם אַתָּה נִצָּל; אֵינְךָ כְּדַאי לִרְאוֹת בְּפֻרְעָנוּתָם וְאַתָּה נִצָּל:", "rashi_en": "<b>Escape for your life.</b> Let it suffice for you to save lives. Pay no heed to possessions. <b>Do not look back!</b> You participated in their evil ways and only for the sake מתוך Avraham are you saved. You are not worthy to see their punishment while you [yourself] are being rescued. <b>Anywhere in the valley.</b> [This refers to] the plain מתוך Jordan. <b>Escape to the mountain.</b> Flee to Avraham who dwells in the mountain as it is said: “From there he moved to the mountain.” Now, too, he dwells there, as it is said: “Until the place where he originally had his tent.” And though it is written: “Avram set up his tents, etc.,” he had many tents which extended to Chevron. The word הִמָּלֵט means to evade. So, too, every form מתוך הַמְלָטָה in Scripture has the meaning émisser in Old French. Similarly: “She delivered a male baby,” meaning that the fetus slipped through the womb. [or] “Escaped like a bird” [or:] “They are unable to push the load through,” [i.e.,] to push the load מתוך excrement in their bowels.", "note": "", "points": [{"q": "Lot is told 'אל תביט אחריך' — don't look back. Why shouldn't he watch Sedom's destruction?", "options": ["He isn't worthy to see their punishment while he is saved", "Looking at the fire would blind him", "Looking back would slow down his escape"], "kasha": "Why should merely looking back at the destruction be forbidden?", "answer": "Lot was not worthy to watch their punishment while he himself was being rescued."}, {"q": "Why wasn't Lot worthy to see Sedom punished?", "options": ["He sinned with them and was saved only in Avraham's merit", "He had refused to leave Sedom at first", "He had argued with the malachim at his door"], "kasha": "What made Lot different from someone saved on his own merit?", "answer": "Lot had been wicked together with the people מתוך Sedom; he was saved only in the merit מתוך Avraham."}]}, {"id": "19:17.3", "ch": 19, "v": 17, "n": 3, "dh": "בכל הככר", "pasuk_html": "וַיְהִי֩ כְהוֹצִיאָ֨ם אֹתָ֜ם הַח֗וּצָה וַיֹּ֙אמֶר֙ הִמָּלֵ֣ט עַל־נַפְשֶׁ֔ךָ אַל־תַּבִּ֣יט אַחֲרֶ֔יךָ וְאַֽל־תַּעֲמֹ֖ד בְּכׇל־הַכִּכָּ֑ר הָהָ֥רָה הִמָּלֵ֖ט פֶּן־תִּסָּפֶֽה׃", "pasuk_en": "When they were brought out [מתוך the city], he [the angel] said, Escape for your life! Do not look back! Do not remain anywhere in the valley. Escape to the mountain, lest you be swept away.", "rashi_he": "כִּכַּר הַיַּרְדֵּן:", "rashi_en": "<b>Escape for your life.</b> Let it suffice for you to save lives. Pay no heed to possessions. <b>Do not look back!</b> You participated in their evil ways and only for the sake מתוך Avraham are you saved. You are not worthy to see their punishment while you [yourself] are being rescued. <b>Anywhere in the valley.</b> [This refers to] the plain מתוך Jordan. <b>Escape to the mountain.</b> Flee to Avraham who dwells in the mountain as it is said: “From there he moved to the mountain.” Now, too, he dwells there, as it is said: “Until the place where he originally had his tent.” And though it is written: “Avram set up his tents, etc.,” he had many tents which extended to Chevron. The word הִמָּלֵט means to evade. So, too, every form מתוך הַמְלָטָה in Scripture has the meaning émisser in Old French. Similarly: “She delivered a male baby,” meaning that the fetus slipped through the womb. [or] “Escaped like a bird” [or:] “They are unable to push the load through,” [i.e.,] to push the load מתוך excrement in their bowels.", "note": "", "points": [{"q": "'אל תעמד בכל הככר' — don't stop anywhere in the 'ככר.' Which 'ככר' is meant?", "options": ["The plain מתוך the Yarden", "The city square מתוך Sedom", "The plain near Chevron"], "kasha": "'ככר' means a plain — which plain is the posuk talking about?", "answer": "The plain מתוך the Yarden (ככר הירדן)."}]}, {"id": "19:17.4", "ch": 19, "v": 17, "n": 4, "dh": "ההרה המלט", "pasuk_html": "וַיְהִי֩ כְהוֹצִיאָ֨ם אֹתָ֜ם הַח֗וּצָה וַיֹּ֙אמֶר֙ הִמָּלֵ֣ט עַל־נַפְשֶׁ֔ךָ אַל־תַּבִּ֣יט אַחֲרֶ֔יךָ וְאַֽל־תַּעֲמֹ֖ד בְּכׇל־הַכִּכָּ֑ר <mark>הָהָ֥רָה הִמָּלֵ֖ט</mark> פֶּן־תִּסָּפֶֽה׃", "pasuk_en": "When they were brought out [מתוך the city], he [the angel] said, Escape for your life! Do not look back! Do not remain anywhere in the valley. Escape to the mountain, lest you be swept away.", "rashi_he": "אֵצֶל אַבְרָהָם בְּרַח, שֶׁהוּא יוֹשֵׁב בָּהָר, שֶׁנֶּאֱמַר וַיַּעְתֵּק מִשָּׁם הָהָרָה (בראשית י\"ב), וְאַף עַכְשָׁו הָיָה יוֹשֵׁב שָׁם, שֶׁנֶּאֱמַר אֶל הַמָּקוֹם אֲשֶׁר הָיָה שָׁם אָהֳלוֹ בַּתְּחִלָּה, וְאַעַ\"פִּ שֶׁכָּתוּב וַיֶּאֱהַל אַבְרָהָם וְגוֹ' (שם י\"ג), אֹהָלִים הַרְבֵּה הָיוּ לוֹ וְנִמְשְׁכוּ עַד חֶבְרוֹן:", "rashi_en": "<b>Escape for your life.</b> Let it suffice for you to save lives. Pay no heed to possessions. <b>Do not look back!</b> You participated in their evil ways and only for the sake מתוך Avraham are you saved. You are not worthy to see their punishment while you [yourself] are being rescued. <b>Anywhere in the valley.</b> [This refers to] the plain מתוך Jordan. <b>Escape to the mountain.</b> Flee to Avraham who dwells in the mountain as it is said: “From there he moved to the mountain.” Now, too, he dwells there, as it is said: “Until the place where he originally had his tent.” And though it is written: “Avram set up his tents, etc.,” he had many tents which extended to Chevron. The word הִמָּלֵט means to evade. So, too, every form מתוך הַמְלָטָה in Scripture has the meaning émisser in Old French. Similarly: “She delivered a male baby,” meaning that the fetus slipped through the womb. [or] “Escaped like a bird” [or:] “They are unable to push the load through,” [i.e.,] to push the load מתוך excreme
