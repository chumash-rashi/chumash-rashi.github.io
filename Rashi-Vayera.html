אַךְ־הַפַּעַם אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה וַיֹּאמֶר לֹא אַשְׁחִית בַּעֲבוּר הָעֲשָׂרָה׃", "rashi_he": "אולי ימצאון שם עשרה. עַל הַפָּחוּת לֹא בִקֵּשׁ, אָמַר דוֹר הַמַּבּוּל הָיוּ ח', נֹחַ וּבָנָיו וּנְשֵׁיהֶם, וְלֹא הִצִּילוּ עַל דּוֹרָם; וְעַל ט' עַל יְדֵי צֵרוּף כְּבָר בִּקֵּשׁ וְלֹא מָצָא:", "rashi_en": "אברהם לא ביקש על פחות מעשרה, כי בדור המבול היו שמונה צדיקים ולא הצילו את דורם. ועל תשעה בצירוף ה' כבר ביקש ולא נמצאו.", "note": "", "points": [{"q": "מַדּוּעַ לֹא בִּיקֵּשׁ אַבְרָהָם עַל פָּחוֹת מֵ\"עֲשָׂרָה\" צַדִּיקִים?", "options": ["כִּי שְׁמוֹנָה צַדִּיקִים בְּדוֹר הַמַּבּוּל לֹא הִצִּילוּ אֶת דּוֹרָם", "כִּי ה' אָמַר לוֹ מֵרֹאשׁ שֶׁלֹּא יְקַבֵּל פָּחוֹת מֵעֲשָׂרָה", "כִּי יָדַע שֶׁאֵין בִּסְדוֹם אֲפִילּוּ צַדִּיק אֶחָד"], "kasha": "מדוע אברהם הפסיק לבקש דווקא בעשרה ולא המשיך למספר קטן יותר?", "answer": "הוא אמר: בדור המבול היו שמונה, נח ובניו ונשותיהם, ולא הצילו את דורם.", "kp": ["דור המבול היו ח'", "ולא הצילו על דורם"]}, {"q": "מַדּוּעַ לֹא בִּיקֵּשׁ אַבְרָהָם עַל תִּשְׁעָה צַדִּיקִים?", "options": ["כִּי כְּבָר בִּיקֵּשׁ עַל תִּשְׁעָה בְּצֵירוּף ה' וְלֹא נִמְצְאוּ", "כִּי תִּשְׁעָה הֵם פָּחוֹת מִשְּׁמוֹנָה שֶׁל דּוֹר הַמַּבּוּל", "כִּי ה' סֵירֵב לִשְׁמֹועַ בַּקָּשָׁה נוֹסֶפֶת"], "kasha": "בין עשרה לשמונה יש עוד מספר, ולמה לא ביקש על תשעה?", "answer": "על תשעה בצירוף ה' כבר ביקש קודם לכן, ולא מצא.", "kp": ["ועל ט' על ידי צרוף", "כבר בקש ולא מצא"]}]}, {"id": "18:33.1", "ch": 18, "v": 33, "n": 1, "dh": "וילך ה' וגו'", "pasuk_html": "<mark>וַיֵּ֣לֶךְ יְהוָ֔ה</mark> כַּאֲשֶׁ֣ר כִּלָּ֔ה לְדַבֵּ֖ר אֶל־אַבְרָהָ֑ם וְאַבְרָהָ֖ם שָׁ֥ב לִמְקֹמֽוֹ׃", "pasuk_en": "וַיֵּלֶךְ יְהוָה כַּאֲשֶׁר כִּלָּה לְדַבֵּר אֶל־אַבְרָהָם וְאַבְרָהָם שָׁב לִמְקֹמוֹ׃", "rashi_he": "וילך ה' וגו'. כֵּיוָן שֶׁנִּשְׁתַּתֵּק הַסָּנֵגוֹר הָלַךְ לוֹ הַדַּיָּן:", "rashi_en": "כיוון שאברהם, שלימד זכות, השתתק, הלך לו הדיין.", "note": "", "points": [{"q": "מַדּוּעַ הָלַךְ ה' דַּוְוקָא כְּשֶׁאַבְרָהָם סִיֵּים לְדַבֵּר?", "options": ["כִּי כְּשֶׁהַסַּנֵּגוֹר הִשְׁתַּתֵּק, הַדַּיָּין הָלַךְ לוֹ", "כִּי ה' כָּעַס עַל רִיבּוּי בַּקָּשׁוֹתָיו שֶׁל אַבְרָהָם", "כִּי ה' מִיהֵר לִשְׁלֹוחַ אֶת הַמַּלְאָכִים לִסְדוֹם"], "kasha": "הפסוק קושר את הליכת ה' לכך שכלה לדבר אל אברהם, ויש להבין את הקשר.", "answer": "כיוון שנשתתק הסנגור, הלך לו הדיין.", "kp": ["שנשתתק הסנגור", "הלך לו הדין"]}]}, {"id": "18:33.2", "ch": 18, "v": 33, "n": 2, "dh": "ואברהם שב למקומו", "pasuk_html": "וַיֵּ֣לֶךְ יְהוָ֔ה כַּאֲשֶׁ֣ר כִּלָּ֔ה לְדַבֵּ֖ר אֶל־אַבְרָהָ֑ם <mark>וְאַבְרָהָ֖ם שָׁ֥ב לִמְקֹמֽוֹ׃</mark>", "pasuk_en": "וַיֵּלֶךְ יְהוָה כַּאֲשֶׁר כִּלָּה לְדַבֵּר אֶל־אַבְרָהָם וְאַבְרָהָם שָׁב לִמְקֹמוֹ׃", "rashi_he": "ואברהם שב למקומו. נִסְתַּלֵּק הַדַּיָּן נִסְתַּלֵּק הַסָּנֵגוֹר, וְהַקָּטֵיגוֹר מְקַטְרֵג וּלְפִיכָךְ וַיָּבֹאוּ שְׁנֵי הַמַּלְאָכִים סְדֹמָה, לְהַשְׁחִית:", "rashi_en": "כשהדיין הסתלק, הסתלק גם הסנגור, והמקטרג נשאר לקטרג, ולכן באו מיד שני המלאכים לסדום להשחית.", "note": "", "points": [{"q": "מַה הַמַּשְׁמָעוּת שֶׁל \"וְאַבְרָהָם שָׁב לִמְקֹמוֹ\" לְפִי רַשִׁ\"י?", "options": ["הַסַּנֵּגוֹר הִסְתַּלֵּק, וְהַקַּטֵּגוֹר נִשְׁאַר לְקַטְרֵג", "אַבְרָהָם חָזַר לְבֵיתוֹ לְקַבֵּל אוֹרְחִים נוֹסָפִים", "אַבְרָהָם הִתְייָאֵשׁ וְכָעַס עַל גְּזַר הַדִּין"], "kasha": "מה החשיבות לציין שאברהם חזר למקומו?", "answer": "נסתלק הדיין ונסתלק הסנגור, והקטגור מקטרג, ולכן באו שני המלאכים לסדום להשחית.", "kp": ["נסתלק הדין נסתלק הסנגור", "והקטיגור מקטרג"]}]}, {"id": "19:1.1", "ch": 19, "v": 1, "n": 1, "dh": "שני", "pasuk_html": "וַ֠יָּבֹאוּ <mark>שְׁנֵ֨י</mark> הַמַּלְאָכִ֤ים סְדֹ֙מָה֙ בָּעֶ֔רֶב וְל֖וֹט יֹשֵׁ֣ב בְּשַֽׁעַר־סְדֹ֑ם וַיַּרְא־לוֹט֙ וַיָּ֣קָם לִקְרָאתָ֔ם וַיִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָה׃", "pasuk_en": "וַיָּבֹאוּ שְׁנֵי הַמַּלְאָכִים סְדֹמָה בָּעֶרֶב וְלוֹט יֹשֵׁב בְּשַׁעַר־סְדֹם וַיַּרְא־לוֹט וַיָּקָם לִקְרָאתָם וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה׃", "rashi_he": "שני. א' לְהַשְׁחִית אֶת סְדוֹם וא' לְהַצִּיל אֶת לוֹט, וְהוּא אוֹתוֹ שֶׁבָּא לְרַפְּאוֹת אַבְרָהָם, וְהַשְּׁלִישִׁי שֶׁבָּא לְבָשֵּׂר אֶת שָׂרָה, כֵּיוָן שֶׁעָשָׂה שְׁלִיחוּתוֹ נִסְתַּלֵּק לוֹ:", "rashi_en": "באו רק שניים: אחד להשחית את סדום ואחד להציל את לוט, והוא אותו מלאך שריפא את אברהם. השלישי, שבא לבשר את שרה, הסתלק אחרי שסיים את שליחותו.", "note": "", "points": [{"q": "מַדּוּעַ הִגִּיעוּ לִסְדֹום רַק \"שְׁנֵי הַמַּלְאָכִים\" וְלֹא שְׁלֹושָׁה?", "options": ["כִּי הַשְּׁלִישִׁי סִיֵּים אֶת שְׁלִיחוּתוֹ לְבַשֵּׂר אֶת שָׂרָה וְהִסְתַּלֵּק", "כִּי הַשְּׁלִישִׁי נִשְׁאַר עִם אַבְרָהָם לְהַמְשִׁיךְ לְרַפֵּא אוֹתוֹ", "כִּי הַשְּׁלִישִׁי נִשְׁלַח לְהַשְׁחִית אֶת שְׁאָר הֶעָרִים"], "kasha": "לאברהם באו שלושה, ומדוע לסדום באו רק שניים?", "answer": "אחד בא להשחית את סדום ואחד להציל את לוט, והשלישי שבא לבשר את שרה הסתלק כיוון שעשה שליחותו.", "kp": ["א' להשחית את סדום", "וא' להציל את לוט", "כיון שעשה שליחותו נסתלק לו"]}, {"q": "מִי מִן הַמַּלְאָכִים הוּא זֶה שֶׁבָּא לְהַצִּיל אֶת לוֹט?", "options": ["הַמַּלְאָךְ שֶׁבָּא לְרַפֵּא אֶת אַבְרָהָם", "הַמַּלְאָךְ שֶׁבָּא לְבַשֵּׂר אֶת שָׂרָה", "הַמַּלְאָךְ שֶׁבָּא לְהַשְׁחִית אֶת סְדוֹם"], "kasha": "רש\"י מבקש לזהות את המלאך המציל עם אחד מן השלושה שבאו לאברהם.", "answer": "המלאך שבא להציל את לוט הוא אותו שבא לרפא את אברהם.", "kp": ["והוא אותו שבא לרפאות אברהם"]}]}, {"id": "19:1.2", "ch": 19, "v": 1, "n": 2, "dh": "המלאכים", "pasuk_html": "וַ֠יָּבֹאוּ שְׁנֵ֨י <mark>הַמַּלְאָכִ֤ים</mark> סְדֹ֙מָה֙ בָּעֶ֔רֶב וְל֖וֹט יֹשֵׁ֣ב בְּשַֽׁעַר־סְדֹ֑ם וַיַּרְא־לוֹט֙ וַיָּ֣קָם לִקְרָאתָ֔ם וַיִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָה׃", "pasuk_en": "וַיָּבֹאוּ שְׁנֵי הַמַּלְאָכִים סְדֹמָה בָּעֶרֶב וְלוֹט יֹשֵׁב בְּשַׁעַר־סְדֹם וַיַּרְא־לוֹט וַיָּקָם לִקְרָאתָם וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה׃", "rashi_he": "המלאכים. וּלְהַלָּן קְרָאָם אֲנָשִׁים? כְּשֶׁהָיְתָה שְׁכִינָה עִמָּהֶם קְרָאָם אֲנָשִׁים; דָּבָר אַחֵר אֵצֶל אַבְרָהָם שֶׁכֹּחוֹ גָדוֹל וְהָיוּ הַמַּלְאָכִים תְּדִירִין אֶצְלוֹ כַּאֲנָשִׁים קְרָאָם אֲנָשִׁים, וְאֵצֶל לוֹט קְרָאָם מַלְאָכִים (בראשית רבה):", "rashi_en": "קודם הם נקראו אנשים וכאן מלאכים: כשהשכינה הייתה עמהם נקראו אנשים. ועוד, אצל אברהם, שכוחו גדול והמלאכים היו רגילים אצלו כאנשים, נקראו אנשים, ואצל לוט נקראו מלאכים.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן, מַדּוּעַ אֵצֶל אַבְרָהָם נִקְרְאוּ \"אֲנָשִׁים\" וְכָאן \"הַמַּלְאָכִים\"?", "options": ["כְּשֶׁהַשְּׁכִינָה הָייְתָה עִמָּהֶם נִקְרְאוּ אֲנָשִׁים", "כִּי אֵצֶל אַבְרָהָם הֵם עֲדַיִין לֹא קִיבְּלוּ שְׁלִיחוּת", "כִּי אֵצֶל לוֹט הֵם הִתְגַּלּוּ בִּדְמוּת אֵשׁ"], "kasha": "קודם לכן הכתוב קרא להם אנשים, ומדוע כאן הם נקראים מלאכים?", "answer": "כשהשכינה הייתה עמהם קראם אנשים, ועכשיו שנפרדו ממנה הם נקראים מלאכים.", "kp": ["כשהיתה שכינה עמהם קראם אנשים"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי, מַה הַהֶבְדֵּל בֵּין אַבְרָהָם לְלוֹט בְּעִנְיַין הַשֵּׁם?", "options": ["לְאַבְרָהָם, שֶׁכֹּוחוֹ גָּדוֹל, הָיוּ הַמַּלְאָכִים רְגִילִים כַּאֲנָשִׁים", "לוֹט הָיָה צַדִּיק יוֹתֵר וְלָכֵן זָכָה לִרְאוֹת מַלְאָכִים", "אַבְרָהָם לֹא הִכִּיר בְּכָךְ שֶׁהֵם מַלְאָכִים כְּלָל"], "kasha": "מדוע אותם שליחים נקראים בשמות שונים אצל אברהם ואצל לוט?", "answer": "אצל אברהם, שכוחו גדול והמלאכים תדירים אצלו כאנשים, קראם אנשים, ואצל לוט קראם מלאכים.", "kp": ["אצל אברהם שכחו גדול", "ואצל לוט קראם מלאכים"]}]}, {"id": "19:1.3", "ch": 19, "v": 1, "n": 3, "dh": "בערב", "pasuk_html": "וַ֠יָּבֹאוּ שְׁנֵ֨י הַמַּלְאָכִ֤ים סְדֹ֙מָה֙ <mark>בָּעֶ֔רֶב</mark> וְל֖וֹט יֹשֵׁ֣ב בְּשַֽׁעַר־סְדֹ֑ם וַיַּרְא־לוֹט֙ וַיָּ֣קָם לִקְרָאתָ֔ם וַיִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָה׃", "pasuk_en": "וַיָּבֹאוּ שְׁנֵי הַמַּלְאָכִים סְדֹמָה בָּעֶרֶב וְלוֹט יֹשֵׁב בְּשַׁעַר־סְדֹם וַיַּרְא־לוֹט וַיָּקָם לִקְרָאתָם וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה׃", "rashi_he": "בערב. וְכִי כָל כָּךְ שָׁהוּ הַמַּלְאָכִים מֵחֶבְרוֹן לִסְדוֹם? אֶלָּא מַלְאֲכֵי רַחֲמִים הָיוּ וּמַמְתִּינִים שֶׁמָּא יוּכַל אַבְרָהָם לְלַמֵּד עֲלֵיהֶם סַנֵּגוֹרְיָא:", "rashi_en": "המלאכים לא היו צריכים זמן רב כל כך מחברון לסדום, אלא שהיו מלאכי רחמים והמתינו, אולי יצליח אברהם ללמד זכות על אנשי סדום.", "note": "", "points": [{"q": "מַדּוּעַ הִגִּיעוּ הַמַּלְאָכִים לִסְדֹום רַק \"בָּעֶרֶב\"?", "options": ["כִּי הָיוּ מַלְאֲכֵי רַחֲמִים וְהִמְתִּינוּ לְסַנֵּגוֹרְיָה שֶׁל אַבְרָהָם", "כִּי הַדֶּרֶךְ מֵחֶבְרוֹן לִסְדוֹם אֲרֻוכָּה וְנִמְשְׁכָה כָּל הַיּוֹם", "כִּי רָצוּ לְה options": ["כִּי לָמַד מִבֵּית אַבְרָהָם לְחַזֵּר אַחַר אוֹרְחִים", "כִּי חָשַׁד שֶׁהֵם מְרַגְּלִים שֶׁבָּאוּ לָעִיר", "כִּי כְּשׁוֹפֵט הָיָה עָלָיו לִבְדֹּוק כָּל נִכְנָס"], "kasha": "באנשי סדום לא הייתה הכנסת אורחים, ומניין ללוט ההנהגה הזאת?", "answer": "מבית אברהם למד לחזר על האורחים.", "kp": ["מבית אברהם למד", "לחזר על האורחים"]}]}, {"id": "19:2.1", "ch": 19, "v": 2, "n": 1, "dh": "הנה נא אדני", "pasuk_html": "וַיֹּ֜אמֶר <mark>הִנֶּ֣ה נָּא־אֲדֹנַ֗י</mark> ס֣וּרוּ נָ֠א אֶל־בֵּ֨ית עַבְדְּכֶ֤ם וְלִ֙ינוּ֙ וְרַחֲצ֣וּ רַגְלֵיכֶ֔ם וְהִשְׁכַּמְתֶּ֖ם וַהֲלַכְתֶּ֣ם לְדַרְכְּכֶ֑ם וַיֹּאמְר֣וּ לֹּ֔א כִּ֥י בָרְח֖וֹב נָלִֽין׃", "pasuk_en": "וַיֹּאמֶר הִנֶּה נָּא־אֲדֹנַי סוּרוּ נָא אֶל־בֵּית עַבְדְּכֶם וְלִינוּ וְרַחֲצוּ רַגְלֵיכֶם וְהִשְׁכַּמְתֶּם וַהֲלַכְתֶּם לְדַרְכְּכֶם וַיֹּאמְרוּ לֹּא כִּי בָרְחוֹב נָלִין׃", "rashi_he": "הנה נא אדני. הִנֵּה נָא אַתֶּם אֲדוֹנִים לִי אַחַר שֶׁעֲבַרְתֶּם עָלַי. דָּבָר אַחֵר הִנֵּה נָא צְרִיכִים אַתֶּם לָתֵת לֵב עַל הָרְשָׁעִים הַלָּלוּ שֶׁלֹּא יַכִּירוּ בָכֶם וְזוֹ הִיא עֵצָה נְכוֹנָה:", "rashi_en": "לוט אומר: הנה אתם אדונים לי כיוון שעברתם לידי. ועוד פירוש: עליכם להיזהר מן הרשעים האלה שלא יכירו בכם, וזו עצה נכונה.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן, מַדּוּעַ לוֹט קוֹרֵא לָהֶם \"אֲדֹנַי\"?", "options": ["כִּי הֵם אֲדוֹנִים לוֹ מֵאַחַר שֶׁעָבְרוּ לְיָדוֹ", "כִּי זִיהָה מִיָּד שֶׁהֵם מַלְאָכִים", "כִּי חָשַׁב שֶׁהֵם שׁוֹפְטִים מֵעִיר אַחֶרֶת"], "kasha": "לוט אינו מכיר אותם, ומדוע הוא פונה אליהם בלשון אדנות?", "answer": "הנה נא אתם אדונים לי, אחר שעברתם עלי.", "kp": ["אתם אדונים לי אחר שעברתם עלי"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי, לָמָּה לוֹט מַזְהִיר אֶת הָאוֹרְחִים?", "options": ["שֶׁייִּזָּהֲרוּ שֶׁהָרְשָׁעִים לֹא יַכִּירוּ בָּהֶם", "שֶׁלֹּא יֹאכְלוּ בָּעִיר מִפְּנֵי שֶׁהַמַּאֲכָל אָסוּר", "שֶׁיְּמַהֲרוּ לָצֵאת לִפְנֵי שֶׁתּוּשְׁמַד הָעִיר"], "kasha": "מה פירוש \"הנה נא\" כאן, ומה בא לוט לומר להם?", "answer": "עליכם לתת לב על הרשעים הללו שלא יכירו בכם, וזו היא עצה נכונה.", "kp": ["לתת לב על הרשעים הללו", "שלא
