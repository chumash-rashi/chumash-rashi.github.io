<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-soft:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1a212b; --ink:#e6eaf0; --muted:#97a3b3; --line:#2c3644;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1a212b; --ink:#e6eaf0; --muted:#97a3b3; --line:#2c3644;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:22px;letter-spacing:.01em}
h1 span{font-family:var(--f-ui);font-weight:500;font-size:13px;color:var(--muted);margin-inline-start:8px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.count b{color:var(--ink)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-heb);font-size:24px;line-height:1.75;direction:rtl;text-align:right}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{font-family:var(--f-body);font-size:14px;color:var(--muted);line-height:1.55;margin-top:-6px}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:14px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:16px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.4;width:100%}
.opt .k{flex:none;font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;margin-top:1px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-soft)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.row{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.row .t{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap;min-width:92px}
.row p{margin:0;font-family:var(--f-body);font-size:15.5px;line-height:1.55;min-width:0}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:18px;line-height:1.8;direction:rtl;text-align:right}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted);text-align:center}
.verdict{font-weight:600;font-size:14px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:26px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</div>

n Mamrei's area?", "options": ["Mamrei had advised Avraham about the milah", "Mamrei's groves were the holiest place", "Avraham had bought it from Mamrei"], "kasha": "Why name whose territory this happened in?", "answer": "Mamrei gave Avraham advice about the milah, so Hashem appeared to him in Mamrei's portion (בראשית Rabbah)."}]}, {"id": "18:1.3", "ch": 18, "v": 1, "n": 3, "dh": "יושב", "pasuk_html": "וַיֵּרָ֤א אֵלָיו֙ יְהֹוָ֔ה בְּאֵלֹנֵ֖י מַמְרֵ֑א וְה֛וּא יֹשֵׁ֥ב פֶּֽתַח־הָאֹ֖הֶל כְּחֹ֥ם הַיּֽוֹם׃", "pasuk_en": "Adonoy appeared to him in the groves מתוך Mamrei and he was sitting at the door מתוך the tent in the heat מתוך the day.", "rashi_he": "ישב כְּתִיב, בִּקֵּשׁ לַעֲמֹד, אָמַר לוֹ הַקָּבָּ\"ה שֵׁב וַאֲנִי אֶעֱמֹד, וְאַתָּה סִימָן לְבָנֶיךָ שֶׁעָתִיד אֲנִי לְהִתְיַצֵּב בַּעֲדַת הַדַּיָּנִים וְהֵן יוֹשְׁבִין, שֶׁנֶּאֱמַר אֱלֹהִים נִצָּב בַּעֲדַת אֵל (תהילים פ\"ב) (בראשית רבה):", "rashi_en": "It is written יָשַׁב [without a וא\"ו]. [This indicates that] he wanted to rise [when] God said to him, “Sit, and I will stand, and you will symbolize to your descendants that I am destined to stand in the assembly מתוך judges while they remain seated,” as it is said: “Elohim stands in the assembly מתוך judges.”", "note": "", "points": [{"q": "'יושב' is spelled without a ו, so it can read 'ישב' — he sat. What happened?", "options": ["He tried to stand; Hashem told him to sit", "He sat down out מתוך weakness", "He sat waiting for Hashem to leave"], "kasha": "The missing ו makes it read as a past action — he sat down, implying he'd started to rise.", "answer": "Avraham wanted to stand up, and Hashem told him: 'Sit, and I will stand.'"}, {"q": "What lesson for Avraham's descendants did Hashem attach to 'sit, and I will stand'?", "options": ["Hashem stands among judges while they sit", "Talmidim must sit before their rebbe", "One may sit while davening when sick"], "kasha": "Why would Hashem stand while Avraham sits?", "answer": "'You are a sign for your children': Hashem will stand in the assembly מתוך judges while they sit."}, {"q": "Which posuk shows Hashem standing in the assembly מתוך judges?", "options": ["'אלהים נצב בעדת אל' (Tehillim)", "'ויעמדו העם מן הבקר' (Shemos)", "'עמדו רגלינו' (Tehillim)"], "kasha": "The idea that Hashem stands among judges needs a source.", "answer": "'אלהים נצב בעדת אל' — Elokim stands in the assembly מתוך judges (Tehillim 82; בראשית Rabbah)."}]}, {"id": "18:1.4", "ch": 18, "v": 1, "n": 4, "dh": "פתח האהל", "pasuk_html": "וַיֵּרָ֤א אֵלָיו֙ יְהֹוָ֔ה בְּאֵלֹנֵ֖י מַמְרֵ֑א וְה֛וּא יֹשֵׁ֥ב פֶּֽתַח־הָאֹ֖הֶל כְּחֹ֥ם הַיּֽוֹם׃", "pasuk_en": "Adonoy appeared to him in the groves מתוך Mamrei and he was sitting at the door מתוך the tent in the heat מתוך the day.", "rashi_he": "לִרְאוֹת אִם יֵשׁ עוֹבֵר וָשָׁב וְיַכְנִיסֵם בְּבֵיתוֹ:", "rashi_en": "To see if there are any passers by that he might invite into his home.", "note": "", "points": [{"q": "Why was Avraham sitting 'פתח האהל' — at the entrance מתוך the tent?", "options": ["To look for passersby to bring inside", "To get fresh air in the heat", "To guard his tent from robbers"], "kasha": "Why tell us where exactly he was sitting?", "answer": "To see if anyone was passing by, so he could bring them into his home."}]}, {"id": "18:1.5", "ch": 18, "v": 1, "n": 5, "dh": "כחום היום", "pasuk_html": "וַיֵּרָ֤א אֵלָיו֙ יְהֹוָ֔ה בְּאֵלֹנֵ֖י מַמְרֵ֑א וְה֛וּא יֹשֵׁ֥ב פֶּֽתַח־הָאֹ֖הֶל כְּחֹ֥ם הַיּֽוֹם׃", "pasuk_en": "Adonoy appeared to him in the groves מתוך Mamrei and he was sitting at the door מתוך the tent in the heat מתוך the day.", "rashi_he": "הוֹצִיא הַקָבָּ\"ה חַמָּה מִנַּרְתִּיקָהּ, שֶׁלֹּא לְהַטְרִיחוֹ בְּאוֹרְחִים, וּלְפִי שֶׁרָאָהוּ מִצְטַעֵר שֶׁלֹּא הָיוּ אוֹרְחִים בָּאִים, הֵבִיא הַמַּלְאָכִים עָלָיו בִּדְמוּת אֲנָשִׁים (בבא מציעא שם):", "rashi_en": "God brought the sun out מתוך its sheath so that he would not be burdened by travelers. But, when He saw that he [Avraham] was grieved that no travelers were coming, He brought the angels to him in the guise מתוך men.", "note": "", "points": [{"q": "Why was it 'כחם היום' — so hot that day?", "options": ["So Avraham wouldn't be bothered by guests", "To punish the people מתוך Sedom", "To heal Avraham's milah faster"], "kasha": "Why does the posuk mention the heat?", "answer": "Hashem took the sun out מתוך its sheath so that Avraham would not be troubled with guests."}, {"q": "If Hashem kept guests away, where did the three 'men' come from?", "options": ["Hashem sent malachim looking like men", "Travelers who ignored the heat", "Mamrei's servants came to help"], "kasha": "Guests arrive נכון after Hashem made sure none would come.", "answer": "Hashem saw Avraham was pained that no guests came, so He brought the malachim to him in the form מתוך men (Bava Metzia)."}]}, {"id": "18:2.1", "ch": 18, "v": 2, "n": 1, "dh": "והנה שלשה אנשים", "pasuk_html": "וַיִּשָּׂ֤א עֵינָיו֙ וַיַּ֔רְא <mark>וְהִנֵּה֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים</mark> נִצָּבִ֖ים עָלָ֑יו וַיַּ֗רְא וַיָּ֤רׇץ לִקְרָאתָם֙ מִפֶּ֣תַח הָאֹ֔הֶל וַיִּשְׁתַּ֖חוּ אָֽרְצָה׃", "pasuk_en": "He lifted his eyes and saw, and behold three men were standing over him. He saw [them], and ran from the door מתוך the tent to greet them, and he bowed down to the earth.", "rashi_he": "אֶחָד לְבַשֵּׂר אֶת שָׂרָה וְאֶחָד לַהֲפֹךְ אֶת סְדוֹם וְאֶחָד לְרַפְּאוֹת אֶת אַבְרָהָם, שֶׁאֵין מַלְאָךְ אֶחָד עוֹשֶׂה שְׁתֵּי שְׁלִיחֻיּוֹת (בראשית רבה). תֵּדַע לְךָ, שֶׁכֵּן כָּל הַפָּרָשָׁה הוּא מַזְכִּירָן בִּלְשׁוֹן רַבִּים וַיֹּאכֵלוּ, וַיֹּאמְרוּ אֵלָיו, וּבַבְּשׂוֹרָה נֶאֱמַר וַיֹּאמֶר שׁוֹב אָשׁוּב אֵלֶיךָ, וּבַהֲפִיכַת סְדוֹם הוּא אוֹמֵר כִּי לֹא אוּכַל לַעֲשׂוֹת דָּבָר לְבִלְתִּי הָפְכִּי, וּרְפָאֵל שֶׁרִפֵּא אֶת אַבְרָהָם הָלַךְ מִשָּׁם לְהַצִּיל אֶת לוֹט; הוּא שֶׁנֶּאֱמַר וַיְהִי כְהוֹצִיאָם אֹתָם הַחוּצָה וַיֹּאמֶר הִמָּלֵט עַל נַפְשֶׁךָ, לָמַדְתָּ שֶׁהָאֶחָד הָיָה מַצִּיל (בראשית רבה):", "rashi_en": "One to foretell to Sarah, and one to overturn Sedom, and one to heal Avraham, because one angel cannot accomplish two missions. You may be convinced מתוך this because in the entire parshah they are mentioned in the plural form, [e.g.] “And they ate.” “They said to him.” Whereas at the tidings [מתוך Sarah’s child] it states: “He said, ‘I will return to you.’” And at the overturning מתוך Sedom it states: “For I can do nothing,” “I will not overturn.” Rephael, who healed Avraham, went from there to rescue Lot. This is what is said: “When they were brought out [מתוך the city], he [the angel] said, ‘Escape for your life,’” which teaches you that [only] one was involved in rescuing [Lot].", "note": "", "points": [{"q": "Why did 'שלשה אנשים' come — why three malachim?", "options": ["Each had a different mission", "Three is the number for a beis din", "One for Avraham, Sarah and Yishmael"], "kasha": "Why were three needed?", "answer": "One to tell Sarah, one to overturn Sedom, one to heal Avraham — because one malach does not do two missions (בראשית Rabbah)."}, {"q": "How does the wording מתוך the parsha show each malach had his own mission?", "options": ["Plural normally, but singular for each mission", "The malachim are listed by name", "Each one ate separately"], "kasha": "The claim מתוך separate missions needs proמתוך from the text.", "answer": "They're usually plural ('ויאכלו', 'ויאמרו'), but the news is singular ('ויאמר שוב אשוב'), and so is overturning Sedom ('לא אוכל', 'הפכי')."}, {"q": "Two malachim went on to Sedom. What did Rephael do after healing Avraham?", "options": ["He went to rescue Lot", "He went back to heaven", "He stayed to guard Sarah"], "kasha": "The malach who healed Avraham reappears in Sedom — with what job?", "answer": "Rephael, who healed Avraham, went from there to save Lot."}, {"q": "Which posuk shows only one malach was doing the rescuing?", "options": ["'ויאמר המלט על נפשך' — singular", "'ויצא לוט וידבר אל חתניו'", "'ויחזיקו האנשים בידו'"], "kasha": "How do we know the rescue was one malach's job?", "answer": "'When they brought them out... he said, escape for your life' — singular, teaching that one was the rescuer (בראשית Rabbah)."}]}, {"id": "18:2.2", "ch": 18, "v": 2, "n": 2, "dh": "נצבים עליו", "pasuk_html": "וַיִּשָּׂ֤א עֵינָיו֙ וַיַּ֔רְא וְהִנֵּה֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים <mark>נִצָּבִ֖ים עָלָ֑יו</mark> וַיַּ֗רְא וַיָּ֤רׇץ לִקְרָאתָם֙ מִפֶּ֣תַח הָאֹ֔הֶל וַיִּשְׁתַּ֖חוּ אָֽרְצָה׃", "pasuk_en": "He lifted his eyes and saw, and behold three men were standing over him. He saw [them], and ran from the door מתוך the tent to greet them, and he bowed down to the earth.", "rashi_he": "לְפָנָיו, אֲבָל לָשׁוֹן נְקִיָּה הוּא כְּלַפֵּי הַמַּלְאָכִים:", "rashi_en": "[Meaning:] “next to him,” as in [וְעָלָיו] “Next to him was the Tribe מתוך Menasheh.” It [וְעָלָיו] is just a respectful term used when referring to angels.", "note": "", "points": [{"q": "'נצבים עליו' — literally 'standing over him.' What does it mean here?", "options": ["Standing before him", "Hovering in the air above him", "Standing guard to protect him"], "kasha": "'Over him' sounds like they stood above him.", "answer": "It means 'before him'; 'עליו' is a respectful way מתוך speaking about malachim."}]}, {"id": "18:2.3", "ch": 18, "v": 2, "n": 3, "dh": "וירא", "pasuk_html": "וַיִּשָּׂ֤א עֵינָיו֙ <mark>וַיַּ֔רְא</mark> וְהִנֵּה֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים נִצָּבִ֖ים עָלָ֑יו וַיַּ֗רְא וַיָּ֤רׇץ לִקְרָאתָם֙ מִפֶּ֣תַח הָאֹ֔הֶל וַיִּשְׁתַּ֖חוּ אָֽרְצָה׃", "pasuk_en": "He lifted his eyes and saw, and behold three men were standing over him. He saw [them], and ran from the door מתוך the tent to greet them, and he bowed down to the earth.", "rashi_he": "מַהוּ וַיַּרְא וַיַּרְא שְׁתֵּי פְעָמִים? הָרִאשׁוֹן כְּמַשְׁמָעוֹ וְהַשֵּׁנִי לְשׁוֹן הֲבָנָה, נִסְתַּכֵּל שֶׁהָיוּ נִצָּבִים בְּמָקוֹם אֶחָד וְהֵבִין שֶׁלֹּא הָיוּ רוֹצִים לְהַטְרִיחוֹ, וְאַף עַל פִּי שֶׁיּוֹדְעִים הָיוּ שֶׁיֵּצֵא לִקְרָאתָם עָמְדוּ בִמְקוֹמָם לְכְבוֹדוֹ, לְהַרְאוֹתוֹ שֶׁלֹּא רָצוּ לְהַטְרִיחוֹ, וְקָדַם הוּא וְרָץ לִקְרָאתָם, בְּבָבָא מְצִיעָא, כְתִיב נִצָּבִים עָלָיו, וּכְתִיב וַיָּרָץ לִקְרָאתָם? כַּד חַזְיוּהוּ דַּהֲוָה שָׁרֵי וְאָסַר פֵּרְשׁוּ הֵימֶנּוּ, מִיָּד וַיָּרָץ לִקְרָאתָם:", "rashi_en": "Why is וַיַּרְא written twice [in this verse]? The first is as it seems [i.e., and saw], whereas, the second means “understanding:” he saw them remain standing in one place and he understood that they did not wish to trouble him. He then quickly ran towards them. In Bava Metzia [there is another explanation]: First it says: “Standing over him” and then it says: “He ran to greet them.” [The answer is:] when they saw him as he was untying and tying [his bandages] they distanced themselves from him. Immediately, “He ran to greet them.”", "note": "", "points": [{"q": "The posuk says 'וירא' twice. If the first means 'he saw,' what does the second mean?", "options": ["He understood", "He saw them again", "He saw Hashem"], "kasha": "Why repeat 'וירא' in the same posuk?", "answer": "The first is literal; the second means understanding."}, {"q": "What did Avraham understand from seeing them stand still in one place?", "options": ["They didn't want to trouble him", "They didn't want to come in", "They were waiting for Hashem to leave"], "kasha": "Why did the guests stay put instead מתוך approaching?", "answer": "They knew he'd come out, yet stayed in place out מתוך respect, to show they didn't want to trouble him; so he ran to them first."}, {"q": "'נצבים עליו' — next to him — yet 'וירץ לקראתם' — he ran to them. How does Bava Metzia settle this?", "options": ["Seeing him tend his bandage, they moved away", "They stood on a distant hill", "He ran to bring water first"], "kasha": "If they stood נכון by him, why did he need to run toward them?", "answer": "When they saw him untying and tying his bandage, they moved away from him; at once he ran toward them."}]}, {"id": "18:3.1", "ch": 18, "v": 3, "n": 1, "dh": "ויאמר אדני אם נא וגו'", "pasuk_html": "וַיֹּאמַ֑ר אֲדֹנָ֗י אִם־נָ֨א מָצָ֤אתִי חֵן֙ בְּעֵינֶ֔יךָ אַל־נָ֥א תַעֲבֹ֖ר מֵעַ֥ל עַבְדֶּֽךָ׃", "pasuk_en": "He said, My Master, if I have found favor in Your eyes, please do not bypass your servant.", "rashi_he": "לַגָּדוֹל שֶׁבָּהֶם אָמַר וּקְרָאָם כֻּלָּם אֲדוֹנִים וְלַגָּדוֹל אָמַר אַל נָא תַעֲבֹר, וְכֵיוָן שֶׁלֹּא יַעֲבֹר הוּא יַעַמְדוּ חֲבֵרָיו עִמּוֹ, וּבְלָשׁוֹן זֶה הוּא חֹל (שבועות ל\"ה). דָּ\"אַ קֹדֶשׁ הוּא, וְהָיָה אוֹמֵר לְהַקָּבָּ\"ה לְהַמְתִּין לוֹ עַד שֶׁיָּרוּץ וְיַכְנִיס אֶת הָאוֹרְחִים וְאַעַ\"פִּ שֶׁכָּתוּב אַחַר וַיָּרָץ לִקְרָאתָם, הָאֲמִירָה קֹדֶם לָכֵן הָיְתָה, וְדֶרֶךְ הַמִּקְרָאוֹת לְדַבֵּר כֵּן, כְּמוֹ שֶׁפֵּרַשְׁתִּי אֵצֶל לֹא יָדוֹן רוּחִי בָאָדָם, שֶׁנִּכְתַּב אַחַר וַיּוֹלֶד נֹחַ, וְאִי אֶפְשַׁר לוֹמַר אֶלָּא שֶׁהָיְתָה הַגְּזֵרָה קֹדֶם לַלֵּדָה כ' שָׁנָה, וּשְׁתֵּי הַלְּשׁוֹנוֹת בִּבְ\"רַ:", "rashi_en": "He was speaking to their leader and referred to them all as “masters.” And to the leader he said, “Please do not bypass,” because if he will not pass by his associates will remain with him. In this explanation it [אֲדֹנָי] is prמתוךane. An alternate explanation: It [אֲדֹנָי] is holy [referring to God] and he [Avraham] was telling God to wait for him until he will run and invite the travelers to come in. Though this is written after וַיָּרָץ לִקְרָאתָם, [nevertheless,] the conversation [with God] preceded it. It is the way מתוך Scripture to speak thus as I explained concerning [the verse] “My spirit will not continue to judge man forever,” which is written after, “Noach produced …” And it is impossible to say otherwise but that the decree preceded [the birth מתוך Yefes] by twenty years. Both explanations are in בראשית Rabbah.", "note": "", "points": [{"q": "In the first explanation, whom is Avraham calling 'אדני' here?", "options": ["The greatest מתוך the three guests", "Hashem", "Mamrei"], "kasha": "'אדני' could be Hashem's name or 'my master' — which is it?", "answer": "He spoke to the greatest מתוך them, calling them all 'masters.' In this explanation the word is chol (not Hashem's name) (Shevuos)."}, {"q": "Why ask only the leader 'אל נא תעבר' — please don't pass by — and not all three?", "options": ["If he stays, the others will stay too", "Only the leader was hungry", "The others had already agreed"], "kasha": "There were three guests; why address one?", "answer": "If the leader doesn't pass on, his companions will stay with him."}, {"q": "In the second explanation 'אדני' is kodesh. What is Avraham asking Hashem?", "options": ["To wait while he brings in the guests", "To heal him quickly", "To send the guests away"], "kasha": "Avraham was in the middle מתוך speaking with Hashem when the guests came.", "answer": "He asked Hashem to wait for him until he ran and brought the guests in."}, {"q": "This request is written after 'וירץ לקראתם.' When was it actually said?", "options": ["Before he ran to them", "While he was serving the food", "After the guests left"], "kasha": "The posuk order seems to put the request after he already ran.", "answer": "The words were said earlier; it is the way מתוך the pesukim to write things out מתוך order."}, {"q": "What earlier case shows the Torah writing an event after something that came later?", "options": ["'לא ידון רוחי' written after Noach's children", "Kayin's sacrifice written after Hevel's", "The flood written before Noach's birth"], "kasha": "Is there proמתוך the Torah writes things out מתוך order?", "answer": "'לא ידון רוחי' is written after 'Noach fathered,' but the decree came twenty years before the birth. Both explanations are in בראשית Rabbah."}]}, {"id": "18:4.1", "ch": 18, "v": 4, "n": 1, "dh": "יקח נא", "pasuk_html": "יֻקַּֽח־נָ֣א מְעַט־מַ֔יִם וְרַחֲצ֖וּ רַגְלֵיכֶ֑ם וְהִֽשָּׁעֲנ֖וּ תַּ֥חַת הָעֵֽץ׃", "pasuk_en": "Let a bit מתוך water be brought and wash your feet. Rest yourselves under the tree.", "rashi_he": "עַל יְדֵי שָׁלִיחַ, וְהַקָּבָּ\"ה שִׁלֵּם לְבָנָיו עַל יְדֵי שָׁלִיחַ, שֶׁנֶּאֱמַר וַיָּרֶם מֹשֶׁה אֶת יָדוֹ וַיַּךְ אֶת הַסֶּלַע (במדבר כ'):", "rashi_en": "through an intermediary, and God rewarded his descendants through a messenger, as it is said: “And Moshe raised his hand and hit the stone.”", "note": "", "points": [{"q": "'יקח נא מעט מים' — how was the water brought, and how did Hashem repay it?", "options": ["Through a messenger; Hashem repaid through a messenger", "He was too weak; Hashem healed him", "He forgot; his children lacked water"], "kasha": "Avraham did everything himself, yet the water came through someone else.", "answer": "The water was brought by a messenger, so Hashem repaid his children through a messenger."}, {"q": "Which event shows Avraham's children getting water through a messenger?", "options": ["Moshe raising his hand and hitting the rock", "The well that Miriam sang about", "Eliezer meeting Rivka at the well"], "kasha": "Where do we see this repayment 'through a messenger'?", "answer": "'Moshe raised his hand and hit the rock' (Bamidbar 20) — the water came through Moshe."}]}, {"id": "18:4.2", "ch": 18, "v": 4, "n": 2, "dh": "ורחצו רגליכם", "pasuk_html": "יֻקַּֽח־נָ֣א מְעַט־מַ֔יִם <mark>וְרַחֲצ֖וּ רַגְלֵיכֶ֑ם</mark> וְהִֽשָּׁעֲנ֖וּ תַּ֥חַת הָעֵֽץ׃", "pasuk_en": "Let a bit מתוך water be brought and wash your feet. Rest yourselves under the tree.", "rashi_he": "כַּסָּבוּר שֶׁהֵם עַרְבִיִּים שֶׁמִּשְׁתַּחֲוִים לַאֲבַק רַגְלֵיהֶם וִהִקְפִּיד שֶׁלֹא לְהַכְנִיס עֲ\"זָ לְבֵיתוֹ; אֲבָל לוֹט שֶׁלֹּא הִקְפִּיד, הִקְדִּים לִינָה לִרְחִיצָה, שֶׁנֶּאֱמַר וְלִינוּ וְרַחֲצוּ רַגְלֵיכֶם:", "rashi_en": "He thought that they were Arabs who worship the dust מתוך their feet, and he was particular not to allow any object מתוך idolatry into his house. However, Lot, who was not particular, invited them to lodge before [asking them to] wash, as is said: “Stay overnight, bathe your feet.”", "note": "", "points": [{"q": "Why did Avraham ask the guests to wash their feet ('ורחצו רגליכם') before entering?", "options": ["He thought they worshipped the dust on their feet", "Their feet were muddy from travel", "Washing feet was a sign מתוך honor"], "kasha": "Why make foot-washing the first step מתוך the welcome?", "answer": "He thought they were Arabs who bow to the dust מתוך their feet, and he was careful not to bring avodah zarah into his home."}, {"q": "How did Lot's invitation differ, and what does it show?", "options": ["Lot said 'sleep' before 'wash' — he wasn't careful", "Lot never מתוךfered water", "Lot washed their feet himself"], "kasha": "Lot also מתוךfered washing — but in a different order.", "answer": "Lot, who wasn't careful about this, put lodging before washing: 'ולינו ורחצו רגליכם.'"}]}, {"id": "18:4.3", "ch": 18, "v": 4, "n": 3, "dh": "תחת העץ", "pasuk_html": "יֻקַּֽח־נָ֣א מְעַט־מַ֔יִם וְרַחֲצ֖וּ רַגְלֵיכֶ֑ם וְהִֽשָּׁעֲנ֖וּ <mark>תַּ֥חַת הָעֵֽץ׃</mark>", "pasuk_en": "Let a bit מתוך water be brought and wash your feet. Rest yourselves under the tree.", "rashi_he": "תַּחַת הָאִילָן:", "rashi_en": "[Meaning:] under the tree.", "note": "", "points": [{"q": "'תחת העץ' — 'עץ' can mean wood. What does it mean here?", "options": ["A tree", "A wooden roמתוך", "A wooden bench"], "kasha": "'עץ' can mean wood or tree.", "answer": "Under the tree (אילן)."}]}, {"id": "18:5.1", "ch": 18, "v": 5, "n": 1, "dh": "וסעדו לבכם", "pasuk_html": "וְאֶקְחָ֨ה פַת־לֶ֜חֶם <mark>וְסַעֲד֤וּ לִבְּכֶם֙</mark> אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי־עַל־כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל־עַבְדְּכֶ֑ם וַיֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּאֲשֶׁ֥ר דִּבַּֽרְתָּ׃", "pasuk_en": "I will get bread and you will sustain your heart. Afterwards you will continue on your way, since you have passed by your servant. They said, Fine, do as you have said.", "rashi_he": "בַּתּוֹרָה, בַנְּבִיאִים וּבַכְּתוּבִים מָצִינוּ דְּפִתָּא סַעֲדָתָא דְלִבָּא. בַּתּוֹרָה וְסַעֲדוּ לִבְּכֶם, בַּנְּבִיאִים סְעָד לִבְּךָ פַּת לֶחֶם (שופטים י\"ט), בַּכְּתוּבִים וְלֶחֶם לְבַב אֱנוֹשׁ יִסְעָד (תהל' ק\"ד). אָמַר רַבִּי חָמָא, לְבַבְכֶם אֵין כְּתִיב כָּאן אֶלָּא לִבְּכֶם, מַגִּיד שֶׁאֵין יֵצֶר הָרַע שׁוֹלֵט בַּמַּלְאָכִים (בראשית רבה):", "rashi_en": "In the Torah, Neviim, and Kesuvim we find that bread is the sustenance מתוך the heart. In the Torah: “You will sustain you hearts;” in Neviim: “Sustain the heart with a loaf מתוך bread;” in Kesuvim: “Bread sustains the human heart.” R. Chama said: Here it is not spelled לְבַבְכֶם but, לִבְּכֶם, which tells us that the evil inclination has no influence over the angels.", "note": "", "points": [{"q": "'וסעדו לבכם' — 'sustain your heart.' What sustains the heart?", "options": ["Bread", "Wine", "Rest"], "kasha": "What does 'sustain your heart' mean?", "answer": "Bread is the sustenance מתוך the heart."}, {"q": "Where else do we find bread called the sustenance מתוך the heart?", "options": ["In Torah, Neviim and Kesuvim", "Only in Mishlei", "Only in the Gemara"], "kasha": "What shows this is the meaning מתוך 'סעד לב'?", "answer": "Torah: 'וסעדו לבכם'; Neviim: 'סעד לבך פת לחם' (Shמתוךtim); Kesuvim: 'ולחם לבב אנוש יסעד' (Tehillim)."}, {"q": "It says 'לבכם' with one ב, not 'לבבכם' with two. What does R' Chama learn?", "options": ["Malachim have no yetzer hara", "Malachim have no real hearts", "They were not very hungry"], "kasha": "Why the short spelling מתוך 'heart'?", "answer": "It doesn't say 'לבבכם' (two ב's) but 'לבכם', showing that the yetzer hara has no rule over malachim (בראשית Rabbah)."}]}, {"id": "18:5.2", "ch": 18, "v": 5, "n": 2, "dh": "אחר תעבורו", "pasuk_html": "וְאֶקְחָ֨ה פַת־לֶ֜חֶם וְסַעֲד֤וּ לִבְּכֶם֙ אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי־עַל־כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל־עַבְדְּכֶ֑ם וַיֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּאֲשֶׁ֥ר דִּבַּֽרְתָּ׃", "pasuk_en": "I will get bread and you will sustain your heart. Afterwards you will continue on your way, since you have passed by your servant. They said, Fine, do as you have said.", "rashi_he": "אַחַר כֵּן תֵּלְכוּ:", "rashi_en": "[Meaning:] after that you may leave.", "note": "", "points": [{"q": "What does 'אחר תעברו' mean?", "options": ["After that you may go on", "After you pass, come back", "Before you go on"], "kasha": "'תעברו' is ambiguous — pass by, or continue on?", "answer": "After that, you may go."}]}, {"id": "18:5.3", "ch": 18, "v": 5, "n": 3, "dh": "כי על כן עברתם", "pasuk_html": "וְאֶקְחָ֨ה פַת־לֶ֜חֶם וְסַעֲד֤וּ לִבְּכֶם֙ אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי־עַל־כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל־עַבְדְּכֶ֑ם וַיֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּאֲשֶׁ֥ר דִּבַּֽרְתָּ׃", "pasuk_en": "I will get bread and you will sustain your heart. Afterwards you will continue on your way, since you have passed by your servant. They said, Fine, do as you have said.", "rashi_he": "כִּי הַדָּבָר הַזֶּה אֲנִי מְבַקֵּשׁ מִכֶּם מֵאַחַר שֶׁעֲבַרְתֶּם עָלַי לִכְבוֹדִי:", "rashi_en": "For this thing I ask מתוך you since you have passed in my proximity to honor me.", "note": "", "points": [{"q": "'כי על כן עברתם על עבדכם' — what is Avraham saying?", "options": ["I ask this since you came by to honor me", "You came this way by mistake", "You passed by without stopping"], "kasha": "How does their passing by connect to his request?", "answer": "I ask this מתוך you since you passed by me, to my honor."}]}, {"id": "18:5.4", "ch": 18, "v": 5, "n": 4, "dh": "כי על כן", "pasuk_html": "וְאֶקְחָ֨ה פַת־לֶ֜חֶם וְסַעֲד֤וּ לִבְּכֶם֙ אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי־עַל־כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל־עַבְדְּכֶ֑ם וַיֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּאֲשֶׁ֥ר דִּבַּֽרְתָּ׃", "pasuk_en": "I will get bread and you will sustain your heart. Afterwards you will continue on your way, since you have passed by your servant. They said, Fine, do as you have said.", "rashi_he": "כְּמוֹ עַל אֲשֶׁר, וְכֵן כָּל כִּי עַל כֵּן שֶׁבַּמִּקְרָא, כִּי עַל כֵּן בָּאוּ בְּצֵל קֹרָתִי (בראשית י\"ט), כִּי עַל כֵּן רָאִיתִי פָנֶיךָ (בראשית ל״ג:י׳), כִּי עַל כֵּן לֹא נְתַתִּיהָ (שם ל\"ח), כִּי עַל כֵּן יָדַעְתָּ חֲנֹתֵנוּ (במדבר י'):", "rashi_en": "This has the same meaning as עַל אֲשֶׁר — [since/because]. This is the meaning מתוך every כִּי עַל כֵּן in Scripture. [E.g.,] “Because … they came under the shelter מתוך my roמתוך;” “Because I have seen your face;” “Since I did not give her; “Since you know how we encamp.”", "note": "", "points": [{"q": "What does 'כי על כן' mean here?", "options": ["Since / because", "Therefore", "Even so"], "kasha": "'על כן' usually means 'therefore,' which doesn't fit.", "answer": "It is like 'על אשר' — since, because."}, {"q": "Is this meaning special to this posuk?", "options": ["No — every 'כי על כן' in Tanach means this", "Yes — only here", "Only when angels speak"], "kasha": "Is this a one-time reading or a rule?", "answer": "Every 'כי על כן' in Tanach means 'since,' e.g. 'כי על כן באו בצל קרתי' and 'כי על כן ראיתי פניך.'"}]}, {"id": "18:6.1", "ch": 18, "v": 6, "n": 1, "dh": "קמח סלת", "pasuk_html": "וַיְמַהֵ֧ר אַבְרָהָ֛ם הָאֹ֖הֱלָה אֶל־שָׂרָ֑ה וַיֹּ֗אמֶר מַהֲרִ֞י שְׁלֹ֤שׁ סְאִים֙ <mark>קֶ֣מַח סֹ֔לֶת</mark> ל֖וּשִׁי וַעֲשִׂ֥י עֻגֽוֹת׃", "pasuk_en": "Avraham hurried to Sarah’s tent and said, Hurry! [take] three measures מתוך the finest flour; knead it and make cake-rolls.", "rashi_he": "סֹלֶת לְעֻגוֹת, קֶמַח לַעֲמִילָן שֶׁל טַבָּחִים, לְכַסּוֹת אֶת הַקְּדֵרָה לִשְׁאֹב אֶת הַזֻּהֲמָא:", "rashi_en": "The fine flour is used for cakes, [and] the meal is for the starch used by cooks for the purpose מתוך covering the pot to absorb the grime.", "note": "", "points": [{"q": "'קמח סלת' — two kinds מתוך flour. Why both?", "options": ["Fine flour for cakes, coarse to cover pots", "Both mixed for better bread", "One for the guests, one for the servants"], "kasha": "'קמח' and 'סלת' are different flours — why name both?", "answer": "The סלת was for the cakes; the קמח was the cooks' paste, used to cover the pot and absorb the scum."}]}, {"id": "18:7.1", "ch": 18, "v": 7, "n": 1, "dh": "בן בקר רך וטוב", "pasuk_html": "וְאֶל־הַבָּקָ֖ר רָ֣ץ אַבְרָהָ֑ם וַיִּקַּ֨ח בֶּן־בָּקָ֜ר רַ֤ךְ וָטוֹב֙ וַיִּתֵּ֣ן אֶל־הַנַּ֔עַר וַיְמַהֵ֖ר לַעֲשׂ֥וֹת אֹתֽוֹ׃", "pasuk_en": "Avraham ran to the cattle, and took a tender, choice calf. He gave it to the lad. and hurried to prepare it.", "rashi_he": "ג' פָּרִים הָיוּ, כְדֵי לְהַאֲכִילָן ג' לְשׁוֹנוֹת בְּחַרְדָּל (בבא מציעא פ\"ז):", "rashi_en": "There were three calves so that he might feed them three tongues together with mustard.", "note": "", "points": [{"q": "'בן בקר רך וטוב' — how many animals did Avraham prepare, and why?", "options": ["Three, to serve three tongues with mustard", "One, as it says 'a calf'", "Two, one for meat, one for soup"], "kasha": "Three guests, and the posuk describes the 'בן בקר' at length — was there only one?", "answer": "There were three oxen (פרים), so he could serve them three tongues with mustard (Bava Metzia)."}]}, {"id": "18:7.2", "ch": 18, "v": 7, "n": 2, "dh": "אל הנער", "pasuk_html": "וְאֶל־הַבָּקָ֖ר רָ֣ץ אַבְרָהָ֑ם וַיִּקַּ֨ח בֶּן־בָּקָ֜ר רַ֤ךְ וָטוֹב֙ וַיִּתֵּ֣ן אֶל־הַנַּ֔עַר וַיְמַהֵ֖ר לַעֲשׂ֥וֹת אֹתֽוֹ׃", "pasuk_en": "Avraham ran to the cattle, and took a tender, choice calf. He gave it to the lad. and hurried to prepare it.", "rashi_he": "זֶה יִשְׁמָעֵאל, לְחַנְּכוֹ בְּמִצְוֹת (בראשית רבה):", "rashi_en": "This refers to Yishmael, to train him in performing mitzvos.", "note": "", "points": [{"q": "Who is 'הנער' — the lad — and why did Avraham give him the calf?", "options": ["Yishmael, to train him in mitzvos", "Eliezer, his chief servant", "A servant, since Avraham was weak"], "kasha": "The posuk doesn't name the lad or say why he was involved.", "answer": "It was Yishmael; Avraham gave it to him to train him in mitzvos (בראשית Rabbah)."}]}, {"id": "18:8.1", "ch": 18, "v": 8, "n": 1, "dh": "ויקח חמאה וגו'", "pasuk_html": "וַיִּקַּ֨ח חֶמְאָ֜ה וְחָלָ֗ב וּבֶן־הַבָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַיִּתֵּ֖ן לִפְנֵיהֶ֑ם וְהֽוּא־עֹמֵ֧ד עֲלֵיהֶ֛ם תַּ֥חַת הָעֵ֖ץ וַיֹּאכֵֽלוּ׃", "pasuk_en": "He took butter, milk, and the calf he had prepared, and set it before them. He stood over them under the tree, and they ate.", "rashi_he": "וְלֶחֶם לֹא הֵבִיא, לְפִי שֶׁפֵּרְסָה שָׂרָה נִדָּה, שֶׁחָזַר לָהּ אֹרַח כַּנָּשִׁים אוֹתוֹ הַיּוֹם, וְנִטְמֵאת הָעִסָּה (בבא מציעא שם):", "rashi_en": "But, the bread he did not bring because Sarah began to menstruate for on that day the menstrual cycle returned to Sarah and the dough became ritually unclean.", "note": "", "points": [{"q": "Sarah was told to bake cakes, but the posuk lists only butter, milk and meat. Why no bread?", "options": ["Sarah became a niddah; the dough became tamei", "The bread wasn't ready in time", "Malachim don't eat bread"], "kasha": "The cakes Avraham ordered are missing from the meal.", "answer": "Sarah's cycle returned that day; she became a niddah and the dough became tamei (Bava Metzia)."}]}, {"id": "18:8.2", "ch": 18, "v": 8, "n": 2, "dh": "חמאה", "pasuk_html": "וַיִּקַּ֨ח <mark>חֶמְאָ֜ה</mark> וְחָלָ֗ב וּבֶן־הַבָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַיִּתֵּ֖ן לִפְנֵיהֶ֑ם וְהֽוּא־עֹמֵ֧ד עֲלֵיהֶ֛ם תַּ֥חַת הָעֵ֖ץ וַיֹּאכֵֽלוּ׃", "pasuk_en": "He took butter, milk, and the calf he had prepared, and set it before them. He stood over them under the tree, and they ate.", "rashi_he": "שֻׁמַּן הֶחָלָב שֶׁקּוֹלְטִין מֵעַל פָּנָיו:", "rashi_en": "The fat מתוך the milk that is skimmed מתוךf the top.", "note": "", "points": [{"q": "What is 'חמאה' here?", "options": ["The fat skimmed מתוךf the top מתוך milk", "Cheese made from milk", "Honey mixed with milk"], "kasha": "'חמאה' is an unusual word — what is it?", "answer": "The fat מתוך the milk, skimmed מתוךf its surface."}]}, {"id": "18:8.3", "ch": 18, "v": 8, "n": 3, "dh": "ובן הבקר אשר עשה", "pasuk_html": "וַיִּקַּ֨ח חֶמְאָ֜ה וְחָלָ֗ב וּבֶן־הַבָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַיִּתֵּ֖ן לִפְנֵיהֶ֑ם וְהֽוּא־עֹמֵ֧ד עֲלֵיהֶ֛ם תַּ֥חַת הָעֵ֖ץ וַיֹּאכֵֽלוּ׃", "pasuk_en": "He took butter, milk, and the calf he had prepared, and set it before them. He stood over them under the tree, and they ate.", "rashi_he": "אֲשֶׁר תִּקֵּן; קַמָּא קַמָּא שֶׁתִּקֵן אַמְטִי וְאַיְיתִי קָמַיְהוּ:", "rashi_en": "[Meaning:] that he prepared. As each one was prepared he immediately brought it to them.", "note": "", "points": [{"q": "'אשר עשה' — what does 'עשה' mean regarding the calf?", "options": ["Prepared", "Raised", "Bought"], "kasha": "'Made' a calf is odd wording.", "answer": "It means 'that he prepared.'"}, {"q": "Butter and milk come before the meat in the posuk. How did Avraham serve the food?", "options": ["Each dish as soon as it was ready", "Everything together at once", "Meat first, dairy afterward"], "kasha": "Why list the dishes in this order?", "answer": "As each item was prepared, he brought it נכון away to them."}]}, {"id": "18:8.4", "ch": 18, "v": 8, "n": 4, "dh": "ויאכלו", "pasuk_html": "וַיִּקַּ֨ח חֶמְאָ֜ה וְחָלָ֗ב וּבֶן־הַבָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַיִּתֵּ֖ן לִפְנֵיהֶ֑ם וְהֽוּא־עֹמֵ֧ד עֲלֵיהֶ֛ם תַּ֥חַת הָעֵ֖ץ <mark>וַיֹּאכֵֽלוּ׃</mark>", "pasuk_en": "He took butter, milk, and the calf he had prepared, and set it before them. He stood over them under the tree, and they ate.", "rashi_he": "נִרְאוּ כְמִי שֶׁאָכְלוּ, מִכָּאן שֶׁלֹּא יְשַׁנֶּה אָדָם מִן הַמִּנְהָג (בבא מציעא שם):", "rashi_en": "It appeared as if they were eating. [We learn] from this that a person should not act differently from the prevalent custom.", "note": "", "points": [{"q": "'ויאכלו' — they ate. Malachim don't eat; what happened?", "options": ["They only seemed to eat", "They ate in human form", "The food went to Avraham"], "kasha": "How can malachim eat?", "answer": "They appeared as if they were eating."}, {"q": "What lesson comes from the malachim pretending to eat?", "options": ["Don't act differently from the local custom", "Never refuse food from a host", "Eat only with others"], "kasha": "Why should the Torah tell us they made a show מתוך eating?", "answer": "A person should not deviate from the accepted custom (Bava Metzia)."}]}, {"id": "18:9.1", "ch": 18, "v": 9, "n": 1, "dh": "ויאמרו אליו", "pasuk_html": "<mark>וַיֹּאמְר֣וּ אֵׄלָ֔יׄוׄ</mark> אַיֵּ֖ה שָׂרָ֣ה אִשְׁתֶּ֑ךָ וַיֹּ֖אמֶר הִנֵּ֥ה בָאֹֽהֶל׃", "pasuk_en": "They said to him, Where is Sarah, your wife? He said Here, in the tent.", "rashi_he": "נָקוּד עַל אי\"ו שֶׁבְּאֵלָיו, וְתַנְיָא רַ\"שִׁ בֶּן אֶלְעָזָר אוֹמֵר כָּל מָקוֹם שֶׁכְּתָב רַבֶּה עַל הַנְּקֻדָּה, אַתָּה דוֹרֵשׁ הַכְּתָב; וְכָאן הַנְּקֻדָּה רַבָּה עַל הַכְּתָב אַתָּה דּוֹרֵשׁ הַנְּקֻדָּה, שֶׁאַף לְשָׂרָה שָׁאֲלוּ אַיּוֹ אַבְרָהָם, לָמַדְנוּ שֶׁיִּשְׁאַל אָדָם בְּאַכְסַנְיָא שֶׁלּוֹ לָאִישׁ עַל הָאִשָּׁה וְלָאִשָּׁה עַל הָאִישׁ. בְּבָבָא מְצִיעָא אוֹמְרִים יוֹדְעִים הָיוּ מַלְאֲכֵי הַשָּׁרֵת שָׂרָה אִמֵּנוּ הֵיכָן הָיְתָה, אֶלָּא לְהוֹדִיעַ שֶׁצְּנוּעָה הָיְתָה, כְּדֵי לְחַבְּבָהּ עַל בַּעֲלָה. אָמַר רַבִּי יוֹסֵי בַּר חֲנִינָא, כְּדֵי לְשַׁגֵּר לָהּ כּוֹס שֶׁל בְּרָכָה:", "rashi_en": "There are dots over [the letters] א,י,ו מתוך [the word] אֵלָיו. And it was taught in a B’rayso: R. Shimon ben Elazar says: wherever the [undotted] letters are more than the dotted [letters] you must explain the [undotted] letters. But, here, the dotted letters are more than the [undotted] letters [and] you must explain the dotted [letters]. [The explanation is:] that they also asked Sarah, “Where is Avraham?” From this we learn that a person should inquire מתוך his host, [asking] the man about his wife, and the woman about her husband. In Bava Metzia it is said: the serving angels knew where our Mother Sarah was. But, [they inquired] to make known her modesty in order to endear her to her husband. R. Yosi bar Chanina said: in order to send to her the [wine-]cup מתוך blessing.", "note": "", "points": [{"q": "There are dots over איו in 'אליו.' When most letters are dotted, which do we expound?", "options": ["The dotted letters", "The undotted letters", "The whole word normally"], "kasha": "The dots over letters in 'אליו' need explaining.", "answer": "R' Shimon ben Elazar: if undotted letters are more, expound them; here dotted are more, so expound the dotted letters."}, {"q": "The dotted letters spell 'איו' — 'where is he?' What does that teach?", "options": ["They also asked Sarah where Avraham was", "Avraham had left the tent", "They were looking for Yishmael"], "kasha": "What do the dotted letters add to the story?", "answer": "They asked Sarah too, 'Where is Avraham?'"}, {"q": "What lesson in manners comes from asking each about the other?", "options": ["Ask the host about his wife and vice versa", "Guests should talk only to the man", "Don't ask about the host's family"], "kasha": "Why should the Torah record this question?", "answer": "A guest should ask the man about his wife and the woman about her husband."}, {"q": "Bava Metzia: the malachim knew where Sarah was. Why ask 'איה שרה'?", "options": ["To show her modesty and endear her to Avraham", "To check that Avraham was honest", "To call her out to them"], "kasha": "Malachim knew where she was — why ask?", "answer": "To make known that she was modest, to make her more beloved to her husband."}, {"q": "R' Yosi bar Chanina gives another reason for asking about Sarah. What is it?", "options": ["To send her the cup מתוך berachah", "To give her the news directly", "To invite her to eat with them"], "kasha": "Another reason they wanted to know where she was.", "answer": "To send her the kos shel berachah."}]}, {"id": "18:9.2", "ch": 18, "v": 9, "n": 2, "dh": "הנה באהל", "pasuk_html": "וַיֹּאמְר֣וּ אֵׄלָ֔יׄוׄ אַיֵּ֖ה שָׂרָ֣ה אִשְׁתֶּ֑ךָ וַיֹּ֖אמֶר <mark>הִנֵּ֥ה בָאֹֽהֶל׃</mark>", "pasuk_en": "They said to him, Where is Sarah, your wife? He said Here, in the tent.", "rashi_he": "צְנוּעָה הִיא:", "rashi_en": "[Implying:] “she is modest.”", "note": "", "points": [{"q": "Why did Avraham answer 'הנה באהל' — she's in the tent?", "options": ["To say she is modest", "Because she was sick", "Because she was baking"], "kasha": "The guests didn't need her exact location.", "answer": "He was saying: she is modest."}]}, {"id": "18:10.1", "ch": 18, "v": 10, "n": 1, "dh": "שוב אשוב", "pasuk_html": "וַיֹּ֗אמֶר <mark>שׁ֣וֹב אָשׁ֤וּב</mark> אֵלֶ֙יךָ֙ כָּעֵ֣ת חַיָּ֔ה וְהִנֵּה־בֵ֖ן לְשָׂרָ֣ה אִשְׁתֶּ֑ךָ וְשָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָאֹ֖הֶל וְה֥וּא אַחֲרָֽיו׃", "pasuk_en": "He said I will return to you next year, and Sarah, your wife will have a son. Sarah was listening at the door מתוך the tent, that was behind him.", "rashi_he": "לֹא בִשְּׂרוֹ הַמַּלְאָךְ שֶׁיָּשׁוּב אֵלָיו, אֶלָּא בִשְׁלִיחוּתוֹ שֶׁל מָקוֹם אָמַר לוֹ, כְּמוֹ וַיֹּאמֶר לָהּ מַלְאַךְ ה' הַרְבָּה אַרְבֶּה, וְהוּא אֵין בְּיָדוֹ לְהַרְבּוֹת, אֶלָּא בִּשְׁלִיחוּתוֹ שֶׁל מָקוֹם, אַף כָּאן בִּשְׁלִיחוּתוֹ שֶׁל מָקוֹם אָמַר לוֹ כֵּן (בְּ\"רַ). אֱלִישָׁע אָמַר לַשּׁוּנַמִּית לַמּוֹעֵד הַזֶּה כָּעֵת חַיָּה אַתְּ חֹבֶקֶת בֵּן וַתֹּאמֶר אַל אֲדֹנִי אִישׁ הָאֱלֹהִים אַל תְּכַזֵּב בְּשִׁפְחָתֶךָ, אוֹתָן הַמַּלְאָכִים שֶׁבִּשְּׂרוּ אֶת שָׂרָה אָמְרוּ לַמּוֹעֵד אָשׁוּב, אָמַר לָהּ אֱלִישָׁע אוֹתָם הַמַּלְאָכִים שֶׁהֵם חַיִּים וְקַיָּמִים לְעוֹלָם אָמְרוּ לַמּוֹעֵד אָשׁוּב, אֲבָל אֲנִי בָשָׂר וָדָם שֶׁהַיּוֹם חַי וּמָחָר מֵת – בֵּין חַי וּבֵין מֵת לַמּוֹעֵד הַזֶּה וגו':", "rashi_en": "<b>Next year.</b> [Meaning:] at this time next year. This was on Pesach and on the following Pesach Yitzchak was born. [This is indicated by:] since it is not read כְּעֵת but, rather, כָּעֵת [at this time]. כָּעֵת חַיָּה [means] at this time when there will be life to you, [i.e.,] when you will all be well and alive. <b>I will return.</b> The angel did not foretell that he himself would return to him, but, he was speaking to him as God’s agent, as in: “The angel מתוך God said to her, ‘I will greatly multiply [your descendants]’” and he [the angel] does not have it in his power to multiply [her children], but [he said this] as the agent מתוך God. Here, too, it was as an agent מתוך God that he told this to him. Elisha said to the Shunamite woman: “At this season, at this time, when you will be alive you will be embracing a son.” And she said, “No, my master, [you] man מתוך God, do not be false with your maidservant. Those angels who foretold for Sarah, said, at this season I will return.” Elisha responded to her, “Those angels who live and endure forever said, ‘At this season I will return,’ but I, who am but flesh and blood, who is alive today and dead tomorrow, whether I will be alive or dead, at this season, etc., [you will embrace a son]. <b>That was behind him.</b> [Meaning:] the entrance was behind the angel.", "note": "", "points": [{"q": "The malach says 'שוב אשוב' — I will return. Did he mean he himself would come back?", "options": ["No — he spoke as Hashem's messenger", "Yes — he returned the next year", "Yes — at Yitzchak's bris"], "kasha": "A malach can't decide to give Sarah a child, nor do we see him return.", "answer": "The malach didn't announce his own return; he spoke on Hashem's behalf, as His messenger (בראשית Rabbah)."}, {"q": "Where else does a malach speak in first person while acting for Hashem?", "options": ["Hagar's malach: 'הרבה ארבה'", "Yaakov's ladder malachim", "The malach at the Akeidah"], "kasha": "Is there a precedent for a malach saying 'I' for Hashem's action?", "answer": "The malach told Hagar 'הרבה ארבה' — I will greatly multiply — though he can't; he spoke as Hashem's messenger."}, {"q": "Why did Elisha tell the Shunamite 'למועד הזה' without saying 'I will return'?", "options": ["Malachim live forever; he might die", "He didn't plan to visit her", "She had asked him not to"], "kasha": "The Shunamite compared Elisha to the malachim.", "answer": "The malachim, who live forever, said 'I will return'; Elisha, flesh and blood who may die, said 'at this time' — alive or dead."}]}, {"id": "18:10.2", "ch": 18, "v": 10, "n": 2, "dh": "כעת חיה", "pasuk_html": "וַיֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֙יךָ֙ <mark>כָּעֵ֣ת חַיָּ֔ה</mark> וְהִנֵּה־בֵ֖ן לְשָׂרָ֣ה אִשְׁתֶּ֑ךָ וְשָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָאֹ֖הֶל וְה֥וּא אַחֲרָֽיו׃", "pasuk_en": "He said I will return to you next year, and Sarah, your wife will have a son. Sarah was listening at the door מתוך the tent, that was behind him.", "rashi_he": "כָּעֵת הַזֹּאת לַשָּׁנָה הַבָּאָה, וּפֶסַח הָיָה, וּלְפֶסַח הַבָּא נוֹלַד יִצְחָק, מִדְּלָא קָרֵינַן כְּעֵת אֶלָּא כָּעֵת:", "rashi_en": "<b>Next year.</b> [Meaning:] at this time next year. This was on Pesach and on the following Pesach Yitzchak was born. [This is indicated by:] since it is not read כְּעֵת but, rather, כָּעֵת [at this time]. כָּעֵת חַיָּה [means] at this time when there will be life to you, [i.e.,] when you will all be well and alive. <b>I will return.</b> The angel did not foretell that he himself would return to him, but, he was speaking to him as God’s agent, as in: “The angel מתוך God said to her, ‘I will greatly multiply [your descendants]’” and he [the angel] does not have it in his power to multiply [her children], but [he said this] as the agent מתוך God. Here, too, it was as an agent מתוך God that he told this to him. Elisha said to the Shunamite woman: “At this season, at this time, when you will be alive you will be embracing a son.” And she said, “No, my master, [you] man מתוך God, do not be false with your maidservant. Those angels who foretold for Sarah, said, at this season I will return.” Elisha responded to her, “Those angels who live and endure forever said, ‘At this season I will return,’ but I, who am but flesh and blood, who is alive today and dead tomorrow, whether I will be alive or dead, at this season, etc., [you will embrace a son]. <b>That was behind him.</b> [Meaning:] the entrance was behind the angel.", "note": "", "points": [{"q": "What does 'כָּעֵת חיה' mean as a time?", "options": ["This very time next year", "Sometime in the future", "In nine months"], "kasha": "'כעת חיה' is an unclear time phrase.", "answer": "At this time next year — since it is read כָּעֵת ('this time'), not כְּעֵת ('like a time')."}, {"q": "What time מתוך year was this, and when was Yitzchak born?", "options": ["Pesach; Yitzchak born the next Pesach", "Rosh Hashanah; born the next Rosh Hashanah", "Sukkos; born that Pesach"], "kasha": "'This time next year' — which time?", "answer": "It was Pesach, and Yitzchak was born the following Pesach."}]}, {"id": "18:10.3", "ch": 18, "v": 10, "n": 3, "dh": "כעת חיה", "pasuk_html": "וַיֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֙יךָ֙ <mark>כָּעֵ֣ת חַיָּ֔ה</mark> וְהִנֵּה־בֵ֖ן לְשָׂרָ֣ה אִשְׁתֶּ֑ךָ וְשָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָאֹ֖הֶל וְה֥וּא אַחֲרָֽיו׃", "pasuk_en": "He said I will return to you next year, and Sarah, your wife will have a son. Sarah was listening at the door מתוך the tent, that was behind him.", "rashi_he": "כָּעֵת הַזֹּאת שֶׁתְּהֵא חַיָּה לָכֶם, שֶׁתִּהְיוּ כֻּלְּכֶם שְׁלֵמִים וְקַיָּמִים:", "rashi_en": "<b>Next year.</b> [Meaning:] at this time next year. This was on Pesach and on the following Pesach Yitzchak was born. [This is indicated by:] since it is not read כְּעֵת but, rather, כָּעֵת [at this time]. כָּעֵת חַיָּה [means] at this time when there will be life to you, [i.e.,] when you will all be well and alive. <b>I will return.</b> The angel did not foretell that he himself would return to him, but, he was speaking to him as God’s agent, as in: “The angel מתוך God said to her, ‘I will greatly multiply [your descendants]’” and he [the angel] does not have it in his power to multiply [her children], but [he said this] as the agent מתוך God. Here, too, it was as an agent מתוך God that he told this to him. Elisha said to the Shunamite woman: “At this season, at this time, when you will be alive you will be embracing a son.” And she said, “No, my master, [you] man מתוך God, do not be false with your maidservant. Those angels who foretold for Sarah, said, at this season I will return.” Elisha responded to her, “Those angels who live and endure forever said, ‘At this season I will return,’ but I, who am but flesh and blood, who is alive today and dead tomorrow, whether I will be alive or dead, at this season, etc., [you will embrace a son]. <b>That was behind him.</b> [Meaning:] the entrance was behind the angel.", "note": "", "points": [{"q": "Why is the time called 'חיה' — living?", "options": ["You will all be alive and well", "The son will be born alive", "It's springtime, when things grow"], "kasha": "Why describe a time as 'living'?", "answer": "At this time, when there will be life for you — you will all be whole and well."}]}, {"id": "18:10.4", "ch": 18, "v": 10, "n": 4, "dh": "והוא אחריו", "pasuk_html": "וַיֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֙יךָ֙ כָּעֵ֣ת חַיָּ֔ה וְהִנֵּה־בֵ֖ן לְשָׂרָ֣ה אִשְׁתֶּ֑ךָ וְשָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָאֹ֖הֶל <mark>וְה֥וּא אַחֲרָֽיו׃</mark>", "pasuk_en": "He said I will return to you next year, and Sarah, your wife will have a son. Sarah was listening at the door מתוך the tent, that was behind him.", "rashi_he": "הַפֶּתַח הָיָה אַחַר הַמַּלְאָךְ:", "rashi_en": "<b>Next year.</b> [Meaning:] at this time next year. This was on Pesach and on the following Pesach Yitzchak was born. [This is indicated by:] since it is not read כְּעֵת but, rather, כָּעֵת [at this time]. כָּעֵת חַיָּה [means] at this time when there will be life to you, [i.e.,] when you will all be well and alive. <b>I will return.</b> The angel did not foretell that he himself would return to him, but, he was speaking to him as God’s agent, as in: “The angel מתוך God said to her, ‘I will greatly multiply [your descendants]’” and he [the angel] does not have it in his power to multiply [her children], but [he said this] as the agent מתוך God. Here, too, it was as an agent מתוך God that he told this to him. Elisha said to the Shunamite woman: “At this season, at this time, when you will be alive you will be embracing a son.” And she said, “No, my master, [you] man מתוך God, do not be false with your maidservant. Those angels who foretold for Sarah, said, at this season I will return.” Elisha responded to her, “Those angels who live and endure forever said, ‘At this season I will return,’ but I, who am but flesh and blood, who is alive today and dead tomorrow, whether I will be alive or dead, at this season, etc., [you will embrace a son]. <b>That was behind him.</b> [Meaning:] the entrance was behind the angel.", "note": "", "points": [{"q": "'והוא אחריו' — what was behind whom?", "options": ["The tent entrance was behind the malach", "Avraham was behind the malach", "Sarah was behind Avraham"], "kasha": "'He was behind him' is unclear.", "answer": "The entrance was behind the malach."}]}, {"id": "18:11.1", "ch": 18, "v": 11, "n": 1, "dh": "חדל להיות", "pasuk_html": "וְאַבְרָהָ֤ם וְשָׂרָה֙ זְקֵנִ֔ים בָּאִ֖ים בַּיָּמִ֑ים <mark>חָדַל֙ לִהְי֣וֹת</mark> לְשָׂרָ֔ה אֹ֖רַח כַּנָּשִֽׁים׃", "pasuk_en": "Avraham and Sarah were old, well on in years. Sarah no longer had the way מתוך women.", "rashi_he": "פָּסַק מִמֶּנָה:", "rashi_en": "[Meaning:] there had ceased from her… .", "note": "", "points": [{"q": "What does 'חדל להיות' mean?", "options": ["It had stopped from her", "It never happened to her", "It was delayed for her"], "kasha": "Translation מתוך 'חדל.'", "answer": "It had ceased from her."}]}, {"id": "18:11.2", "ch": 18, "v": 11, "n": 2, "dh": "אורח כנשים", "pasuk_html": "וְאַבְרָהָ֤ם וְשָׂרָה֙ זְקֵנִ֔ים בָּאִ֖ים בַּיָּמִ֑ים חָדַל֙ לִהְי֣וֹת לְשָׂרָ֔ה אֹ֖רַח כַּנָּשִֽׁים׃", "pasuk_en": "Avraham and Sarah were old, well on in years. Sarah no longer had the way מתוך women.", "rashi_he": "אֹרַח נִדּוֹת:", "rashi_en": "[I.e.,] the menstrual cycle.", "note": "", "points": [{"q": "What is 'אורח כנשים' — 'the way מתוך women'?", "options": ["The monthly cycle", "Women's household work", "Women's way מתוך dressing"], "kasha": "A delicate phrase that needs explaining.", "answer": "The menstrual cycle."}]}, {"id": "18:12.1", "ch": 18, "v": 12, "n": 1, "dh": "בקרבה", "pasuk_html": "וַתִּצְחַ֥ק שָׂרָ֖ה <mark>בְּקִרְבָּ֣הּ</mark> לֵאמֹ֑ר אַחֲרֵ֤י בְלֹתִי֙ הָֽיְתָה־לִּ֣י עֶדְנָ֔ה וַֽאדֹנִ֖י זָקֵֽן׃", "pasuk_en": "Sarah laughed to herself saying, Now that I am worn out, shall I have the pleasure [מתוך a son], my master being [also] an old man.", "rashi_he": "מִסְתַּכֶּלֶת בְּמֵעֶיהָ וְאָמְרָה אֶפְשַׁר הַקְּרָבַיִם הַלָּלוּ טְעוּנִין וָלָד? הַשָּׁדַיִם הַלָּלוּ שֶׁצָּמְקוּ מוֹשְׁכִין חָלָב? תַּנְחוּמָא:", "rashi_en": "[Meaning:] she looked at her insides and said, “Is it possible that these insides can carry a child, that these shriveled breasts can draw milk? [This explanation is derived from] Tanchuma.", "note": "", "points": [{"q": "'ותצחק שרה בקרבה' — what does 'בקרבה' (in her insides) add?", "options": ["She looked at her body and doubted", "She laughed silently", "She laughed with joy inside"], "kasha": "Why 'in her insides' rather than just 'to herself'?", "answer": "She looked at her insides: 'Can these insides carry a child? Can these shriveled breasts give milk?' (Tanchuma)."}]}, {"id": "18:12.2", "ch": 18, "v": 12, "n": 2, "dh": "עדנה", "pasuk_html": "וַתִּצְחַ֥ק שָׂרָ֖ה בְּקִרְבָּ֣הּ לֵאמֹ֑ר אַחֲרֵ֤י בְלֹתִי֙ הָֽיְתָה־לִּ֣י <mark>עֶדְנָ֔ה</mark> וַֽאדֹנִ֖י זָקֵֽן׃", "pasuk_en": "Sarah laughed to herself saying, Now that I am worn out, shall I have the pleasure [מתוך a son], my master being [also] an old man.", "rashi_he": "צִחְצוּחַ בָּשָׂר, וּלְשׁוֹן מִשְׁנָה מַשִּׁיר אֶת הַשֵּׂעָר וּמְעַדֵּן אֶת הַבָּשָׂר. דָבָר אַחֵר לְשׁוֹן עִדָּן; זְמַן וֶסֶת נִדּוּת:", "rashi_en": "[Meaning:] smooth flesh. It is a term used in the Mishnah: “It removes the hair and makes the flesh smooth.” An alternative explanation [for עֶדְנָה] from the word עִידָן [meaning] time, [referring to the] regular menstrual cycle.", "note": "", "points": [{"q": "What does 'עדנה' mean?", "options": ["Smooth, youthful skin", "A happy celebration", "A son"], "kasha": "'עדנה' is an unusual word.", "answer": "Smooth skin, as the Mishnah says: 'removes hair and makes the flesh smooth (מעדן).'"}, {"q": "What is the second explanation מתוך 'עדנה'?", "options": ["From 'עידן' — her monthly time", "From 'עדן' — Gan Eden", "From 'עד' — testimony"], "kasha": "Another root could fit 'עדנה.'", "answer": "From 'עידן' — time: the time מתוך her monthly cycle."}]}, {"id": "18:13.1", "ch": 18, "v": 13, "n": 1, "dh": "האף אמנם", "pasuk_html": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־אַבְרָהָ֑ם לָ֣מָּה זֶּה֩ צָחֲקָ֨ה שָׂרָ֜ה לֵאמֹ֗ר <mark>הַאַ֥ף אֻמְנָ֛ם</mark> אֵלֵ֖ד וַאֲנִ֥י זָקַֽנְתִּי׃", "pasuk_en": "Adonoy said to Avraham, Why did Sarah laugh saying, Can I really give birth when I am old?", "rashi_he": "הֲגַם אֱמֶת אֵלֵד?", "rashi_en": "[Meaning:] “Can it be true that I will give birth?”", "note": "", "points": [{"q": "What does 'האף אמנם' mean?", "options": ["Is it really true?", "Even if it's true", "Certainly it's true"], "kasha": "An unusual phrase.", "answer": "'Can it really be true that I will give birth?'"}]}, {"id": "18:13.2", "ch": 18, "v": 13, "n": 2, "dh": "ואני זקנתי", "pasuk_html": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־אַבְרָהָ֑ם לָ֣מָּה זֶּה֩ צָחֲקָ֨ה שָׂרָ֜ה לֵאמֹ֗ר הַאַ֥ף אֻמְנָ֛ם אֵלֵ֖ד <mark>וַאֲנִ֥י זָקַֽנְתִּי׃</mark>", "pasuk_en": "Adonoy said to Avraham, Why did Sarah laugh saying, Can I really give birth when I am old?", "rashi_he": "שִׁנָּה הַכָּתוּב מִפְּנֵי הַשָּׁלוֹם, שֶׁהֲרֵי הִיא אָמְרָה וַאדֹנִי זָקֵן:", "rashi_en": "Scripture altered [her statement] for the sake מתוך peace, for she had actually said, “And my master is old.”", "note": "", "points": [{"q": "Sarah said 'ואדני זקן' — my husband is old. Why does Hashem quote her as 'ואני זקנתי'?", "options": ["To keep peace between them", "She actually said both", "Hashem was correcting her"], "kasha": "Hashem's quote doesn't match what Sarah said.", "answer": "The posuk changed her words for the sake מתוך peace; she had really said 'my master is old.'"}]}, {"id": "18:14.1", "ch": 18, "v": 14, "n": 1, "dh": "היפלא", "pasuk_html": "<mark>הֲיִפָּלֵ֥א</mark> מֵיְהֹוָ֖ה דָּבָ֑ר לַמּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛יךָ כָּעֵ֥ת חַיָּ֖ה וּלְשָׂרָ֥ה בֵֽן׃", "pasuk_en": "Is anything too far removed from Adonoy? At the appointed time I will return to you, at this time מתוך life, and Sarah will have a son.", "rashi_he": "כְּתַרְגּוּמוֹ הֲיִתְכַּסִּי? וְכִי שׁוּם דָּבָר מֻפְלָא וּמֻפְרָד וּמְכֻסֶּה מִמֶּנִּי מִלַּעֲשׂוֹת כִּרְצוֹנִי:", "rashi_en": "[Means:] as translated by Onkelos: Is it hidden? [I.e.,] is there anything beyond and separated and hidden from Me [which might prevent Me] from doing My will?", "note": "", "points": [{"q": "What does 'היפלא' mean here?", "options": ["Is anything hidden from Hashem?", "Is anything too costly?", "Is anything too heavy?"], "kasha": "'היפלא' is an unclear word.", "answer": "As Onkelos: 'is it hidden?' Is anything beyond, separated or hidden from Me, preventing Me from doing My will?"}]}, {"id": "18:14.2", "ch": 18, "v": 14, "n": 2, "dh": "למועד", "pasuk_html": "הֲיִפָּלֵ֥א מֵיְהֹוָ֖ה דָּבָ֑ר <mark>לַמּוֹעֵ֞ד</mark> אָשׁ֥וּב אֵלֶ֛יךָ כָּעֵ֥ת חַיָּ֖ה וּלְשָׂרָ֥ה בֵֽן׃", "pasuk_en": "Is anything too far removed from Adonoy? At the appointed time I will return to you, at this time מתוך life, and Sarah will have a son.", "rashi_he": "לְאוֹתוֹ מוֹעֵד הַמְיֻחָד שֶׁקָּבַעְתִּי לְךָ אֶתְמוֹל, לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת:", "rashi_en": "[Meaning:] on that appointed time that I previously set aside for you [when I said:] “At this time next year.”", "note": "", "points": [{"q": "'למועד' — which appointed time?", "options": ["The time set yesterday: this time next year", "Any time Hashem chooses", "Rosh Hashanah"], "kasha": "No time was specified in this posuk.", "answer": "The special time I set for you yesterday: this time next year."}]}, {"id": "18:15.1", "ch": 18, "v": 15, "n": 1, "dh": "כי יראה וגו' כי צחקת", "pasuk_html": "וַתְּכַחֵ֨שׁ שָׂרָ֧ה&thinsp;׀&thinsp;לֵאמֹ֛ר לֹ֥א צָחַ֖קְתִּי כִּ֣י&thinsp;׀&thinsp;יָרֵ֑אָה וַיֹּ֥אמֶֽר&thinsp;׀&thinsp;לֹ֖א כִּ֥י צָחָֽקְתְּ׃", "pasuk_en": "Sarah denied it saying, I did not laugh, for she was afraid. He said, Not so, for you did laugh.", "rashi_he": "הָרִאשׁוֹן מְשַׁמֵּשׁ לְשׁוֹן דְּהָא, שֶׁנּוֹתֵן טַעַם לַדָּבָר וַתְּכַחֵשׁ שָׂרָה – לְפִי שֶׁיָּרְאָה; וְהַשֵּׁנִי מְשַׁמֵּשׁ בִּלְשׁוֹן אֶלָּא, וַיֹּאמֶר לֹא כִדְבָרֵךְ הוּא אֶלָּא צָחַקְתְּ, שֶׁאָמְרוּ רַבּוֹתֵינוּ כִּי מְשַׁמֵּשׁ בְּאַרְבַּע לְשׁוֹנוֹת, אִי, דִּלְמָא, אֶלָּא, דְּהָא:", "rashi_en": "The first \"כִּי\" is used in the sense מתוך “because,” giving a reason for the fact. [I.e.,] Sarah denied … because she was afraid. The second [כִּי is used in the sense מתוך “but.” [I.e.,] And He said, it is not as you say, but you did laugh. For our Rabbis have said: כִּי has four [different] meanings: 1) if, 2) perhaps, 3) but, 4) because.", "note": "", "points": [{"q": "'ותכחש שרה... כי יראה' — what does this first 'כי' mean?", "options": ["Because", "But", "If"], "kasha": "There are two 'כי's in the posuk.", "answer": "'Because' — it gives the reason Sarah denied: she was afraid."}, {"q": "'ויאמר לא כי צחקת' — what does this second 'כי' mean?", "options": ["But", "Because", "Perhaps"], "kasha": "'Because' doesn't fit 'no, for you laughed.'", "answer": "'But': it is not as you say — rather, you did laugh."}, {"q": "How many meanings does 'כי' have, according to Chazal?", "options": ["Four: if, perhaps, but, because", "Two: because and but", "One: because"], "kasha": "How can one word mean both 'because' and 'but'?", "answer": "Chazal say 'כי' has four meanings: if (אי), perhaps (דלמא), but (אלא), because (דהא)."}]}, {"id": "18:16.1", "ch": 18, "v": 16, "n": 1, "dh": "וישקיפו", "pasuk_html": "וַיָּקֻ֤מוּ מִשָּׁם֙ הָֽאֲנָשִׁ֔ים וַיַּשְׁקִ֖פוּ עַל־פְּנֵ֣י סְדֹ֑ם וְאַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖ם לְשַׁלְּחָֽם׃", "pasuk_en": "The men stood up from where they were, and they gazed upon Sedom. Avraham went with them to send them [on their way].", "rashi_he": "כָּל הַשְׁקָפָה שֶׁבַּמִּקְרָא לְרָעָה חוּץ מֵהַשְׁקִיפָה מִמְּעוֹן קָדְשְׁךָ (דברים כ\"ו), שֶׁגָּדוֹל כֹּחַ מַתְּנוֹת עֲנִיִּים שֶׁהוֹפֵך מִדַּת הָרֹגֶז לְרַחֲמִים:", "rashi_en": "Wherever the term הַשְׁקָפָה is used in Scripture it is [meant to convey gazing for the purpose מתוך bringing] evil, except: “Gaze down from Your holy abode,” [to teach] that giving to the poor is so great that it can change God’s attribute מתוך anger to mercy.", "note": "", "points": [{"q": "'וישקיפו על פני סדם' — what does 'השקפה' (gazing) usually signal in Tanach?", "options": ["Looking in order to bring harm", "Looking with longing", "Looking from far away"], "kasha": "Why the word 'וישקיפו' rather than 'ויראו'?", "answer": "Every השקפה in Tanach is for bad — except 'השקיפה ממעון קדשך.'"}, {"q": "Why is 'השקיפה ממעון קדשך' the one exception?", "options": ["Gifts to the poor turn anger to mercy", "It refers to the Beis HaMikdash", "It is a tefillah, not a story"], "kasha": "Why should that one השקפה be for good?", "answer": "Gifts to the poor are so powerful they change Hashem's attribute מתוך anger into mercy."}]}, {"id": "18:16.2", "ch": 18, "v": 16, "n": 2, "dh": "לשלחם", "pasuk_html": "וַיָּקֻ֤מוּ מִשָּׁם֙ הָֽאֲנָשִׁ֔ים וַיַּשְׁקִ֖פוּ עַל־פְּנֵ֣י סְדֹ֑ם וְאַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖ם <mark>לְשַׁלְּחָֽם׃</mark>", "pasuk_en": "The men stood up from where they were, and they gazed upon Sedom. Avraham went with them to send them [on their way].", "rashi_he": "לְלַוּוֹתָם; כַּסָּבוּר אוֹרְחִים הֵם:", "rashi_en": "[Meaning:] to escort them; he thought that they were travelers.", "note": "", "points": [{"q": "Avraham went 'לשלחם' — to send them מתוךf. What does that mean, and why?", "options": ["To escort them, thinking they were travelers", "To send them on their mission", "To make sure they left"], "kasha": "'To send them' sounds like dismissing guests.", "answer": "To escort them; he thought they were ordinary travelers."}]}, {"id": "18:17.1", "ch": 18, "v": 17, "n": 1, "dh": "המכסה אני", "pasuk_html": "וַֽיהֹוָ֖ה אָמָ֑ר <mark>הַֽמְכַסֶּ֤ה אֲנִי֙</mark> מֵֽאַבְרָהָ֔ם אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה׃", "pasuk_en": "Adonoy said, Shall I conceal from Avraham what I am about to do?", "rashi_he": "בִּתְמִיהָ:", "rashi_en": "[An expression] מתוך incredulity… .", "note": "", "points": [{"q": "Hashem says 'המכסה אני מאברהם'. Is this a statement or a question?", "options": ["A wondering question: shall I hide it? Surely not", "A statement that Hashem will hide it", "A command to Avraham to hide something"], "kasha": "Read flatly, 'המכסה אני' could sound as if Hashem plans to conceal from Avraham.", "answer": "It is said in wonder, as a rhetorical question: shall I conceal from Avraham? Of course not."}]}, {"id": "18:17.2", "ch": 18, "v": 17, "n": 2, "dh": "אשר אני עושה", "pasuk_html": "וַֽיהֹוָ֖ה אָמָ֑ר הַֽמְכַסֶּ֤ה אֲנִי֙ מֵֽאַבְרָהָ֔ם אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה׃", "pasuk_en": "Adonoy said, Shall I conceal from Avraham what I am about to do?", "rashi_he": "בִּסְדוֹם. לֹא יָפֶה לִי לַעֲשׂוֹת דָּבָר זֶה שֶׁלֹּא מִדַּעְתּוֹ. אֲנִי נָתַתִּי לוֹ אֶת הָאָרֶץ הַזֹּאת, וַחֲמִשָּׁה כְּרַכִּין הַלָּלוּ שֶׁלּוֹ הֵן, שֶׁנֶּאֱמַר: גְּבוּל הַכְּנַעֲנִי מִצִּידֹן בֹּאֲכָה סְדֹמָה וַעֲמֹרָה וְגוֹ' (בראשית י'). קָרָאתִי אוֹתוֹ אַבְרָהָם – אַב הֲמוֹן גּוֹיִם, וְאַשְׁמִיד אֶת הַבָּנִים וְלֹא אוֹדִיעַ לָאָב, שֶׁהוּא אוֹהֲבִי?", "rashi_en": "In Sedom! It would not be נכון for Me to do this thing without letting him know. I gave him this land and, [therefore,] these five cities are his. As it is said: “The borders מתוך the Canaanites were from Sidon, etc. toward Sedom and Amorah,” etc. I renamed him Avraham, [which denotes] a father מתוך a multitude מתוך nations. Can I, then, destroy the children without informing the father who loves Me?", "note": "", "points": [{"q": "'אשר אני עושה': what is Hashem about to do, and why shouldn't He hide it from Avraham?", "options": ["Destroy Sedom; not proper to do it without Avraham knowing", "Give Avraham a son; it's a surprise", "Test Avraham; tests must be hidden"], "kasha": "The posuk doesn't say what Hashem is about to do, or why Avraham must be told.", "answer": "In Sedom. It isn't proper for Me to do this without his knowledge."}, {"q": "Why is Sedom's fate any מתוך Avraham's business?", "options": ["Hashem gave him the land, so these five cities are his", "Lot lived there and was his nephew", "Avraham had been born in Sedom"], "kasha": "Sedom wasn't Avraham's city; why must he be consulted?", "answer": "I gave him this land, so these five cities are his. The posuk 'גבול הכנעני מצידן... סדמה ועמרה' shows Sedom lies within Canaan's borders."}, {"q": "What does the name 'Avraham' add to why Hashem must tell him?", "options": ["He's father מתוך the nations; don't destroy children without telling the father", "His name means he's a judge over cities", "His name shows he'll pray for every city"], "kasha": "Why does Hashem use the name Avraham here?", "answer": "I called him Avraham, father מתוך a multitude מתוך nations. Shall I destroy the children and not tell the father, who loves Me?"}]}, {"id": "18:18.1", "ch": 18, "v": 18, "n": 1, "dh": "ואברהם היו יהיה", "pasuk_html": "<mark>וְאַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה</mark> לְג֥וֹי גָּד֖וֹל וְעָצ֑וּם וְנִ֨בְרְכוּ־ב֔וֹ כֹּ֖ל גּוֹיֵ֥י הָאָֽרֶץ׃", "pasuk_en": "Avraham is indeed to become a great and mighty nation, and through him shall be blessed all the nations מתוך the world.", "rashi_he": "מִ\"אַ: זֵכֶר צַדִּיק לִבְרָכָה, הוֹאִיל וְהִזְכִּירוֹ – בֵּרְכוֹ. וּפְשׁוּטוֹ: וְכִי מִמֶּנּוּ אֲנִי מַעֲלִים, וַהֲרֵי הוּא חָבִיב לְפָנַי לִהְיוֹת לְגוֹי גָּדוֹל וּלְהִתְבָּרֵך בּוֹ כָּל גּוֹיֵי הָאָרֶץ.", "rashi_en": "The Midrashic explanation is: “The mention מתוך a נכוןeous person is a blessing.” [Therefore] since He mentioned him [Avraham], He blessed him. But, the simple explanation is: [God, in effect, said:] “Would I conceal from him, when he is so beloved to Me as to become a great nation and through him will be blessed all the nations מתוך the earth?", "note": "", "points": [{"q": "Hashem mentions Avraham and immediately blesses him: 'היו יהיה לגוי גדול'. Why add a blessing here, mid-discussion מתוך Sedom?", "options": ["The mention מתוך a tzaddik is followed by a blessing", "Avraham had asked for a blessing", "Sedom's land would go to his children"], "kasha": "A blessing for Avraham seems out מתוך place in a passage about destroying Sedom.", "answer": "Midrash: 'זכר צדיק לברכה' — since Hashem mentioned him, He blessed him."}, {"q": "By the simple meaning (פשוטו), how does this posuk fit with 'shall I hide from Avraham'?", "options": ["He's so beloved and destined for greatness — how can I hide?", "It explains why Sedom deserves to be destroyed", "It promises Avraham that Sedom will be his"], "kasha": "By plain reading, the posuk should continue Hashem's thought about not concealing.", "answer": "It's part מתוך the reasoning: would I hide from him, when he is so dear to Me that he will become a great nation and a blessing to all nations?"}]}, {"id": "18:19.1", "ch": 18, "v": 19, "n": 1, "dh": "כי ידעתיו", "pasuk_html": "<mark>כִּ֣י יְדַעְתִּ֗יו</mark> לְמַ֩עַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת־בָּנָ֤יו וְאֶת־בֵּיתוֹ֙ אַחֲרָ֔יו וְשָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהֹוָ֔ה לַעֲשׂ֥וֹת צְדָקָ֖ה וּמִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהֹוָה֙ עַל־אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר־דִּבֶּ֖ר עָלָֽיו׃", "pasuk_en": "For I have given him special attention because he commands his children, and his household after him, and they will preserve the way מתוך Adonoy, doing charity and justice, so that Adonoy will bring upon Avraham all that which He has spoken מתוך him.", "rashi_he": "לְשׁוֹן חִבָּה, כְּמוֹ מוֹדָע לְאִישָׁהּ (רות ב'), הֲלֹא בֹעַז מֹדַעְתָּנוּ (שם ג'), וָאֵדָעֲךָ בְּשֵׁם (שמות ל\"ג). וְאָמְנָם עִקַּר לְשׁוֹן כֻּלָּם אֵינוֹ אֶלָּא לְשׁוֹן יְדִיעָה, שֶׁהַמְחַבֵּב אֶת הָאָדָם מְקָרְבוֹ אֶצְלוֹ וְיוֹדְעוֹ וּמַכִּירוֹ, וְלָמָּה יְדַעְתִּיו?", "rashi_en": "[יְדַעְתִיו is] an expression denoting affection as in: “A kinsman, on her husband’s side.” [and as in:] “Now Boaz, our kinsman,” [and as in:] “I will know you by name.” However, they all stem mainly from none other than יְדִיעָה [knowing] because one who has affection for another relates to him more closely and knows him. “And why do I have affection for him?", "note": "", "points": [{"q": "'כי ידעתיו' — Hashem knows everyone. What does 'I know him' mean here?", "options": ["An expression מתוך affection: I hold him dear", "I know his thoughts and secrets", "I know he'll fail a future test"], "kasha": "Hashem knows everything; saying 'I know him' seems to add nothing.", "answer": "It means affection, as in 'מודע לאישה', 'הלא בעז מדעתנו' and 'ואדעך בשם'."}, {"q": "If ידע means affection, how does it relate to the plain meaning 'know'?", "options": ["One who loves someone draws him close and knows him", "It has no relation; it's a separate root", "Knowing someone always leads to loving him"], "kasha": "Why would a word for knowing be used for love?", "answer": "The root מתוך all these is still 'knowing': one who cherishes a person brings him close and knows him well. And why do I cherish him? (next Rashi)."}]}, {"id": "18:19.2", "ch": 18, "v": 19, "n": 2, "dh": "למען אשר יצוה", "pasuk_html": "כִּ֣י יְדַעְתִּ֗יו <mark>לְמַ֩עַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה</mark> אֶת־בָּנָ֤יו וְאֶת־בֵּיתוֹ֙ אַחֲרָ֔יו וְשָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהֹוָ֔ה לַעֲשׂ֥וֹת צְדָקָ֖ה וּמִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהֹוָה֙ עַל־אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר־דִּבֶּ֖ר עָלָֽיו׃", "pasuk_en": "For I have given him special attention because he commands his children, and his household after him, and they will preserve the way מתוך Adonoy, doing charity and justice, so that Adonoy will bring upon Avraham all that which He has spoken מתוך him.", "rashi_he": "לְפִי שֶׁהוּא מְצַוֶּה אֶת בָּנָיו עָלַי לִשְׁמֹר דְּרָכַי. וְאִם תְּפָרְשֵׁהוּ כְתַרְגּוּמוֹ, יוֹדֵעַ אֲנִי בוֹ שֶׁיְּצַוֶּה אֶת בָּנָיו וְגוֹ', אֵין לְמַעַן נוֹפֵל עַל הַלָּשׁוֹן:", "rashi_en": "[I.e.,] because he commands his children about Me to keep My ways.” But, if you explain it as does Onkelos, the word לְמַעַן, then does not fit in that sense.", "note": "", "points": [{"q": "'למען אשר יצוה' — why does Hashem cherish Avraham?", "options": ["Because he commands his children to keep Hashem's ways", "So that he will later command his children", "Because his children already keep the mitzvos"], "kasha": "'למען' usually means 'in order that'; here it must give the reason for the affection.", "answer": "Because he commands his children about Me, to keep My ways."}, {"q": "Why doesn't רש״י follow the reading 'I know מתוך him that he will command his children'?", "options": ["Then the word 'למען' doesn't fit the wording", "That reading contradicts Onkelos", "Avraham had no children yet"], "kasha": "Onkelos reads ידעתיו as plain knowing; why not explain that way?", "answer": "If you explain it like Onkelos, 'I know about him that he will command his children', the word 'למען' does not fit the language."}]}, {"id": "18:19.3", "ch": 18, "v": 19, "n": 3, "dh": "יצוה", "pasuk_html": "כִּ֣י יְדַעְתִּ֗יו לְמַ֩עַן֩ אֲשֶׁ֨ר <mark>יְצַוֶּ֜ה</mark> אֶת־בָּנָ֤יו וְאֶת־בֵּיתוֹ֙ אַחֲרָ֔יו וְשָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהֹוָ֔ה לַעֲשׂ֥וֹת צְדָקָ֖ה וּמִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהֹוָה֙ עַל־אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר־דִּבֶּ֖ר עָלָֽיו׃", "pasuk_en": "For I have given him special attention because he commands his children, and his household after him, and they will preserve the way מתוך Adonoy, doing charity and justice, so that Adonoy will bring upon Avraham all that which He has spoken מתוך him.", "rashi_he": "לְשׁוֹן הוֹוֶה, כְמוֹ כָּכָה יַעֲשֶׂה אִיּוֹב (איוב א'):", "rashi_en": "It is used here in the present tense as in: “This is what Iyov continually did,” [or] “According to God do they encamp.”", "note": "", "points": [{"q": "'יצוה' looks like future tense. What tense does רש״י say it is?", "options": ["Present: an ongoing habit — he commands", "Future: he will command one day", "Past: he once commanded"], "kasha": "The future form 'יצוה' seems odd for Avraham's ongoing conduct.", "answer": "It's present tense, describing what he regularly does, like 'ככה יעשה איוב' (Iyov did so all the time)."}]}, {"id": "18:19.4", "ch": 18, "v": 19, "n": 4, "dh": "למען הביא", "pasuk_html": "כִּ֣י יְדַעְתִּ֗יו לְמַ֩עַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת־בָּנָ֤יו וְאֶת־בֵּיתוֹ֙ אַחֲרָ֔יו וְשָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהֹוָ֔ה לַעֲשׂ֥וֹת צְדָקָ֖ה וּמִשְׁפָּ֑ט <mark>לְמַ֗עַן הָבִ֤יא</mark> יְהֹוָה֙ עַל־אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר־דִּבֶּ֖ר עָלָֽיו׃", "pasuk_en": "For I have given him special attention because he commands his children, and his household after him, and they will preserve the way מתוך Adonoy, doing charity and justice, so that Adonoy will bring upon Avraham all that which He has spoken מתוך him.", "rashi_he": "כָּךְ הוּא מְצַוֶּה לְבָנָיו, שִׁמְרוּ דֶּרֶך ה' כְּדֵי שֶׁיָּבִיא ה' עַל אַבְרָהָם וְגוֹ'; עַל בֵּית אַבְרָהָם לֹא נֶאֱמַר אֶלָּא עַל אַבְרָהָם, לָמַדְנוּ, כָּל הַמַּעֲמִיד בֵּן צַדִּיק כְּאִלוּ אֵינוֹ מֵת:", "rashi_en": "Thus he commands his children: “Keep the way מתוך God so that God will bring upon Avraham,” etc. It does not say “upon the house מתוך Avraham” but, rather, “upon Avraham.” We learn from this that he who produces a נכוןeous son is considered as not having died.", "note": "", "points": [{"q": "'למען הביא ה' על אברהם' — whose words are these, and what do they express?", "options": ["Avraham's command: keep Hashem's way so He brings the promised good", "Hashem's reason for destroying Sedom", "A promise to Avraham's servants"], "kasha": "It's unclear how 'so that Hashem will bring upon Avraham' connects to the commanding.", "answer": "This is what he commands his children: keep the way מתוך Hashem so that Hashem will bring upon Avraham all He promised."}, {"q": "The good is promised to Avraham's descendants, yet the posuk says 'על אברהם'. What do we learn?", "options": ["One who raises a נכוןeous son is as if he never dies", "Avraham himself will live forever", "The blessings belong only to Avraham, not his children"], "kasha": "It should say 'upon the house מתוך Avraham', since the promise comes after him.", "answer": "It doesn't say 'upon Avraham's house' but 'upon Avraham': whoever raises a נכוןeous son is as if he does not die."}]}, {"id": "18:20.1", "ch": 18, "v": 20, "n": 1, "dh": "ויאמר ה'", "pasuk_html": "וַיֹּ֣אמֶר יְהֹוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַעֲמֹרָ֖ה כִּי־רָ֑בָּה וְחַ֨טָּאתָ֔ם כִּ֥י כָבְדָ֖ה מְאֹֽד׃", "pasuk_en": "[Thus] Adonoy said, The wailing concerning Sedom and Amorah is so great, and their sin is so very grave.", "rashi_he": "אֶל אַבְרָהָם שֶׁעָשָׂה כַּאֲשֶׁר אָמַר, שֶׁלֹּא יְכַסֶּה מִמֶּנּוּ:", "rashi_en": "To Avraham. That He [God] did as He said, [i.e.,] that He will not conceal from him.", "note": "", "points": [{"q": "'ויאמר ה' — to whom does Hashem now speak, and why?", "options": ["To Avraham, keeping His word not to hide it", "To the malachim, sending them to Sedom", "To the people מתוך Sedom, warning them"], "kasha": "The posuk doesn't say whom Hashem addressed.", "answer": "To Avraham. Hashem did as He had said: He would not conceal it from him."}]}, {"id": "18:20.2", "ch": 18, "v": 20, "n": 2, "dh": "כי רבה", "pasuk_html": "וַיֹּ֣אמֶר יְהֹוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַעֲמֹרָ֖ה כִּי־רָ֑בָּה וְחַ֨טָּאתָ֔ם כִּ֥י כָבְדָ֖ה מְאֹֽד׃", "pasuk_en": "[Thus] Adonoy said, The wailing concerning Sedom and Amorah is so great, and their sin is so very grave.", "rashi_he": "כָּל רַבָּה שֶׁבַּמִּקְרָא הַטַּעַם לְמַטָּה בַּבֵּי\"ת, לְפִי שֶׁהֵן מְתֻרְגָּמִין גְּדוֹלָה, אוֹ גְּדֵלָה וְהוֹלֶכֶת, אֲבָל זֶה טַעֲמוֹ לְמַעְלָה בָּרֵי\"ש, לְפִי שֶׁמְּתֻרְגָּם גָדְלָה כְּבָר כְּמוֹ שֶׁפֵּרַשְׁתִּי וַיְהִי הַשֶּׁמֶשׁ בָּאָה, הִנֵּה שָׁבָה יְבִמְתֵּךְ:", "rashi_en": "Wherever רָבָּה appears in Scripture the accent is on the latter syllable—the letter ב because they are translated as “great” or “becoming great.” Whereas, [regarding] this one, the former syllable is accented on the letter ר because it is translated that it had already become great as I have previously explained: “The sun set,” and, similarly: “Behold your sister has returned.”", "note": "", "points": [{"q": "In 'כי רבה' the accent is on the ר, not the ב. What difference does that make?", "options": ["It means already grew great, past tense", "It means growing greater now", "It turns the word into a question"], "kasha": "Everywhere else 'רבה' is accented on the last syllable; why is this one different?", "answer": "Elsewhere the accent is on the ב, meaning 'great' or 'growing great'. Here it's on the ר, meaning it has already become great."}, {"q": "What examples does רש״י give where an early accent signals past tense?", "options": ["'ויהי השמש באה' and 'הנה שבה יבמתך'", "'ויואל משה' and 'ככה יעשה איוב'", "'מודע לאישה' and 'ואדעך בשם'"], "kasha": "The rule that accent placement changes the tense needs a parallel.", "answer": "As רש״י explained earlier: 'ויהי השמש באה' (the sun had set) and 'הנה שבה יבמתך' (your sister-in-law has returned)."}]}, {"id": "18:21.1", "ch": 18, "v": 21, "n": 1, "dh": "ארדה נא", "pasuk_h
