: "To Sarah, he said, Behold I have given to your brother a thousand pieces מתוך silver. It will be for you a [compensational] eye covering for all who are with you, that you may face every one.", "rashi_he": "וְעִם כָּל בָּאֵי עוֹלָם:", "rashi_en": "[Meaning] “And with all the people מתוך the world…", "note": "", "points": [{"q": "'ואת כל' — 'and with all' — whom does this refer to?", "options": ["All people מתוך the world", "All מתוך Sarah's servants", "All מתוך Avimelech's household"], "kasha": "'ואת כל' is incomplete — all whom?", "answer": "And with all people מתוך the world."}]}, {"id": "20:16.4", "ch": 20, "v": 16, "n": 4, "dh": "ונכחת", "pasuk_html": "וּלְשָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֙סֶף֙ לְאָחִ֔יךְ הִנֵּ֤ה הוּא־לָךְ֙ כְּס֣וּת עֵינַ֔יִם לְכֹ֖ל אֲשֶׁ֣ר אִתָּ֑ךְ וְאֵ֥ת כֹּ֖ל <mark>וְנֹכָֽחַת׃</mark>", "pasuk_en": "To Sarah, he said, Behold I have given to your brother a thousand pieces מתוך silver. It will be for you a [compensational] eye covering for all who are with you, that you may face every one.", "rashi_he": "יְהִי לָךְ פִּתְחוֹן פֶּה לְהִתְוַכֵּחַ וּלְהַרְאוֹת דְבָרִים נִכָּרִים הַלָּלוּ; וּלְשׁוֹן הוֹכָחָה בְּכָל מָקוֹם בֵּרוּר דְּבָרִים ובלע\"ז אשפרו\"ביר, וְאֻנְקְלוֹס תִּרְגֵּם בְּפָנִים אֲחֵרִים, וּלְשׁוֹן הַמִּקְרָא כָּךְ הוּא נוֹפֵל עַל הַתַּרְגּוּם, הִנֵּה לָךְ כְּסוּת שֶׁל כָּבוֹד עַל הָעֵינַיִם שֶׁלִּי שֶׁשָּׁלְטוּ בָּךְ וּבְכֹל אֲשֶׁר אִתָּךְ, וְעַל כֵּן תִּרְגְּמוֹ וַחֲזֵית יָתִיךְ וְיַת כָּל דְּעִמָּךְ. וְיֵשׁ מִ\"אַ אֲבָל יִשּׁוּב לְשׁוֹן הַמִּקְרָא פֵּרַשְׁתִּי:", "rashi_en": "You will have the opportunity to refute and to show these obvious facts. Wherever the term הוֹכָחָה appears it refers to clarifying things. In Old French éprouver [to prove]. However, Onkelos translates it otherwise, and the words מתוך the text according to the Targum would fit as follows: “Behold, this will be for you a garment מתוך honor as a consequence מתוך my eyes that gazed upon you and upon everyone who is with you.” He, therefore, translated it: “I saw you and all who are with you.” There is [also] a Midrashic interpretation, but I have explained it for the best textual fit.", "note": "", "points": [{"q": "'ונכחת' — what does it mean that Sarah 'נכחת'?", "options": ["She can argue and show the obvious facts", "She will be punished", "She is now married again"], "kasha": "'ונכחת' is an unclear word here.", "answer": "She'll have an opening to argue and show these clear facts. רש״י אומר this fits the posuk's words, though a Midrash also exists."}, {"q": "What does the root 'הוכחה' mean throughout Tanach, says Rashi?", "options": ["Clarifying matters", "Punishing a sinner", "Scolding harshly"], "kasha": "We need the general meaning מתוך the root.", "answer": "Everywhere it means clarifying matters — in Old French 'éprouver' (to prove)."}, {"q": "How does Onkelos read 'כסות עינים'?", "options": ["Honor-covering for 'my eyes' that gazed on her", "Covering for Sarah's eyes so she won't see", "Payment for the plague in their eyes"], "kasha": "Onkelos translates differently; how do the words fit his reading?", "answer": "Onkelos: this is a garment מתוך honor for my eyes that looked at you and all with you — so he translates 'וחזית יתיך וית כל דעמך'."}]}, {"id": "20:17.1", "ch": 20, "v": 17, "n": 1, "dh": "וילדו", "pasuk_html": "וַיִּתְפַּלֵּ֥ל אַבְרָהָ֖ם אֶל־הָאֱלֹהִ֑ים וַיִּרְפָּ֨א אֱלֹהִ֜ים אֶת־אֲבִימֶ֧לֶךְ וְאֶת־אִשְׁתּ֛וֹ וְאַמְהֹתָ֖יו <mark>וַיֵּלֵֽדוּ׃</mark>", "pasuk_en": "Avraham prayed to Elohim, and Elohim healed Avimelech, his wife, and his female slaves, and they gave birth.", "rashi_he": "כְּתַרְגּוּמוֹ וְאִתְרְוָחוּ, נִפְתְּחוּ נִקְבֵיהֶם וְהוֹצִיאוּ, וְהִיא לֵדָה שֶׁלָּהֶם:", "rashi_en": "As the Targum translates it: “And they were relieved.” [I.e.,] their orifices were reopened and they expelled that which needed expelling. And this is considered their “birth.”", "note": "", "points": [{"q": "'וילדו' — they gave birth. Avimelech and his men too? What does it mean?", "options": ["Their blocked openings reopened and they were relieved", "Their wives gave birth נכון away", "They had children later on"], "kasha": "'וילדו' is said מתוך Avimelech too, who can't give birth.", "answer": "As Targum translates 'ואתרווחו' — they were relieved: their openings opened and they expelled what they needed to; that is their 'birth'."}]}, {"id": "20:18.1", "ch": 20, "v": 18, "n": 1, "dh": "בעד כל רחם", "pasuk_html": "כִּֽי־עָצֹ֤ר עָצַר֙ יְהֹוָ֔ה בְּעַ֥ד כׇּל־רֶ֖חֶם לְבֵ֣ית אֲבִימֶ֑לֶךְ עַל־דְּבַ֥ר שָׂרָ֖ה אֵ֥שֶׁת אַבְרָהָֽם׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "For Adonoy had restrained every womb in the house מתוך Avimelech according to the word מתוך Sarah, Avraham’s wife.", "rashi_he": "כְּנֶגֶד כָּל פֶּתַח:", "rashi_en": "[Meaning] every opening [מתוך the body].", "note": "", "points": [{"q": "'עצר... בעד כל רחם' — 'every womb', yet men were also struck. What does 'רחם' mean here?", "options": ["Every bodily opening", "Only women's wombs", "Only the queen's womb"], "kasha": "'Womb' doesn't fit, since the plague closed all openings מתוך men too.", "answer": "It means against every opening."}]}, {"id": "20:18.2", "ch": 20, "v": 18, "n": 2, "dh": "על דבר שרה", "pasuk_html": "כִּֽי־עָצֹ֤ר עָצַר֙ יְהֹוָ֔ה בְּעַ֥ד כׇּל־רֶ֖חֶם לְבֵ֣ית אֲבִימֶ֑לֶךְ עַל־דְּבַ֥ר שָׂרָ֖ה אֵ֥שֶׁת אַבְרָהָֽם׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "For Adonoy had restrained every womb in the house מתוך Avimelech according to the word מתוך Sarah, Avraham’s wife.", "rashi_he": "עַל פִּי דִּבּוּרָהּ שֶׁל שָׂרָה:", "rashi_en": "[Meaning] according to Sarah’s words.", "note": "", "points": [{"q": "'על דבר שרה' — 'על דבר' can mean 'because מתוך'. How does רש״י read it here?", "options": ["By Sarah's word — at her command", "Because Sarah was taken", "On Sarah's behalf, unasked"], "kasha": "'על דבר' is ambiguous — 'because מתוך' or 'by the word מתוך'.", "answer": "According to Sarah's speech — by her word."}]}, {"id": "21:1.1", "ch": 21, "v": 1, "n": 1, "dh": "וה' פקד את שרה וגו'", "pasuk_html": "וַֽיהֹוָ֛ה פָּקַ֥ד אֶת־שָׂרָ֖ה כַּאֲשֶׁ֣ר אָמָ֑ר וַיַּ֧עַשׂ יְהֹוָ֛ה לְשָׂרָ֖ה כַּאֲשֶׁ֥ר דִּבֵּֽר׃", "pasuk_en": "Adonoy remembered Sarah as He had said, and Adonoy did for Sarah as He had spoken.", "rashi_he": "סָמַך פָּרָשָׁה זוֹ לְלַמֶּדְךָ, שֶׁכָּל הַמְבַקֵּשׁ רַחֲמִים עַל חֲבֵרוֹ וְהוּא צָרִיךְ לְאוֹתוֹ דָבָר, הוּא נַעֲנֶה תְחִלָּה (בבא קמא צ\"ב), שֶׁנֶּאֱמַר וַיִּתְפַּלֵּל וְגוֹ', וּסְמִיךְ לֵיהּ וה' פָּקַד אֶת שָׂרָה, שֶׁפְּקָדָהּ כְּבָר קֹדֶם שֶׁרִפֵּא אֶת אֲבִימֶלֶךְ:", "rashi_en": "This section was placed here to teach you that whoever prays for mercy for another and he [the one who prays] needs the same thing, he will be answered first. For it states: “he [Avraham] prayed,” etc., and immediately: “Adonoy remembered Sarah,” i.e., He had already remembered [even] before He had cured Avimelech.", "note": "", "points": [{"q": "'וה' פקד את שרה' comes נכון after Avraham davens for Avimelech. What does this placement teach?", "options": ["One who davens for another, needing the same, is answered first", "Hashem rewards those who forgive people who hurt them", "Sarah was remembered in Avimelech's land, not Canaan"], "kasha": "Why is Sarah's remembrance placed נכון after Avraham's tefillah for Avimelech?", "answer": "Whoever asks for mercy for his friend while needing that same thing himself is answered first (Bava Kamma)."}, {"q": "How do the pesukim show that Avraham was answered 'first'?", "options": ["Sarah was remembered before Avimelech was healed", "Avimelech was healed before Avraham finished davening", "Sarah conceived on the very day Avraham davened"], "kasha": "The posuk about Avimelech's healing comes first — so where do we see Avraham answered first?", "answer": "'ויתפלל' is followed immediately by 'וה' פקד את שרה' — meaning He had already remembered her before He healed Avimelech."}]}, {"id": "21:1.2", "ch": 21, "v": 1, "n": 2, "dh": "פקד את שרה כאשר אמר", "pasuk_html": "וַֽיהֹוָ֛ה פָּקַ֥ד אֶת־שָׂרָ֖ה כַּאֲשֶׁ֣ר אָמָ֑ר וַיַּ֧עַשׂ יְהֹוָ֛ה לְשָׂרָ֖ה כַּאֲשֶׁ֥ר דִּבֵּֽר׃", "pasuk_en": "Adonoy remembered Sarah as He had said, and Adonoy did for Sarah as He had spoken.", "rashi_he": "בְּהֵרָיוֹן:", "rashi_en": "[This refers to the promise] מתוך conceiving.", "note": "", "points": [{"q": "'פקד את שרה כאשר אמר' — and then 'ויעש... כאשר דבר.' Which promise does the first half refer to?", "options": ["Conceiving", "Giving birth", "Nursing the child"], "kasha": "The posuk mentions two fulfillments — what does each half refer to?", "answer": "The first half, 'פקד... כאשר אמר', refers to the pregnancy."}]}, {"id": "21:1.3", "ch": 21, "v": 1, "n": 3, "dh": "כאשר דבר", "pasuk_html": "וַֽיהֹוָ֛ה פָּקַ֥ד אֶת־שָׂרָ֖ה כַּאֲשֶׁ֣ר אָמָ֑ר וַיַּ֧עַשׂ יְהֹוָ֛ה לְשָׂרָ֖ה <mark>כַּאֲשֶׁ֥ר דִּבֵּֽר׃</mark>", "pasuk_en": "Adonoy remembered Sarah as He had said, and Adonoy did for Sarah as He had spoken.", "rashi_he": "בְּלֵדָה. וְהֵיכָן הִיא אֲמִירָה, וְהֵיכָן הוּא דִּבּוּר? אֲמִירָה וַיֹּאמֶר אֱלֹהִים אֲבָל שָׂרָה אִשְׁתְּךָ וְגוֹ '(בראשית י\"ז), דִּבּוּר הָיָה דְבַר ה' אֶל אַבְרָם בִּבְרִית בֵּין הַבְּתָרִים, וְשָׁם נֶאֱמַר לֹא יִירָשְׁךָ זֶה וְגוֹ' (שם ט\"ו), וְהֵבִיא הַיּוֹרֵשׁ מִשָּׂרָה:", "rashi_en": "[Referring to the promise] מתוך giving birth. Where is [the reference to God’s] saying? and where is [the reference to God’s] speaking? Saying: “Elohim said: Indeed your wife Sarah,” etc. Speaking: “The word מתוך Hashem came to Avram at the Covenant Between the Pieces,” where it is stated: “That one [Eliezer] will not be your heir” and He brought forth the heir from Sarah.", "note": "", "points": [{"q": "If 'פקד... כאשר אמר' is the pregnancy, what does 'ויעש... כאשר דבר' refer to?", "options": ["The birth", "The pregnancy again, for emphasis", "Naming the child Yitzchak"], "kasha": "The posuk seems to say the same thing twice.", "answer": "'כאשר דבר' refers to the birth itself."}, {"q": "'כאשר אמר' points to an earlier אמירה. Where did Hashem 'say' Sarah would have a son?", "options": ["'ויאמר אלהים אבל שרה אשתך' in perek 17", "At the Bris Bein HaBesarim", "When the malachim visited Avraham"], "kasha": "The posuk refers back to a promise — where was it said?", "answer": "The אמירה is 'ויאמר אלהים, אבל שרה אשתך...' (perek 17)."}, {"q": "Where was the 'דבור' — Hashem 'speaking' — about an heir?", "options": ["At the Bris Bein HaBesarim: 'לא יירשך זה'", "When Hashem first told Avram 'לך לך'", "When Hashem changed Avram's name to Avraham"], "kasha": "'כאשר דבר' points to a different promise — where is a דבור about this?", "answer": "'היה דבר ה' אל אברם' at the Bris Bein HaBesarim, where it says 'לא יירשך זה' — and He brought the heir from Sarah."}]}, {"id": "21:1.4", "ch": 21, "v": 1, "n": 4, "dh": "ויעש ה' לשרה כאשר דבר", "pasuk_html": "וַֽיהֹוָ֛ה פָּקַ֥ד אֶת־שָׂרָ֖ה כַּאֲשֶׁ֣ר אָמָ֑ר וַיַּ֧עַשׂ יְהֹוָ֛ה לְשָׂרָ֖ה כַּאֲשֶׁ֥ר דִּבֵּֽר׃", "pasuk_en": "Adonoy remembered Sarah as He had said, and Adonoy did for Sarah as He had spoken.", "rashi_he": "לְאַבְרָהָם:", "rashi_en": "[Meaning] as He spoke] to Avraham.", "note": "", "points": [{"q": "'ויעש ה' לשרה כאשר דבר' — to whom had Hashem spoken this promise?", "options": ["To Avraham", "To Sarah directly", "To the malachim"], "kasha": "It says 'for Sarah as He had spoken' — but Hashem never spoke to Sarah about it.", "answer": "'As He had spoken' — to Avraham."}]}, {"id": "21:2.1", "ch": 21, "v": 2, "n": 1, "dh": "למועד אשר דבר אתו", "pasuk_html": "וַתַּ֩הַר֩ וַתֵּ֨לֶד שָׂרָ֧ה לְאַבְרָהָ֛ם בֵּ֖ן לִזְקֻנָ֑יו לַמּוֹעֵ֕ד אֲשֶׁר־דִּבֶּ֥ר אֹת֖וֹ אֱלֹהִֽים׃", "pasuk_en": "She conceived and Sarah gave birth to Avraham’s son in his old age, at the designated time that Elohim had declared.", "rashi_he": "ר' יודן ורבי חמא, רבי יודן אומר מלמד שנולד לט' חדשים, שלא יאמרו מביתו של אבימלך הוא, ור' חמא אומר לשבעה חדשים:", "rashi_en": "[There is a dispute between] R. Yudan and R. Chama: R. Yudan says: This teaches that he [Yitzchok] was born after nine months so that it not be said that he was [conceived] from Avimelech’s household. whereas, R. Chama says after seven months.", "note": "This passage appears only in some editions מתוך Rashi.", "points": [{"q": "(In some editions) 'למועד אשר דבר' — according to R' Yudan, after how many months was Yitzchak born?", "options": ["Nine months", "Seven months", "Twelve months"], "kasha": "Why does the posuk stress that the birth came at the set time?", "answer": "R' Yudan says this teaches he was born after nine full months."}, {"q": "Why was it important that Yitzchak was born after nine months, per R' Yudan?", "options": ["So no one would say he was from Avimelech's house", "To prove Sarah was truly healthy", "To match the time מתוך Avraham's milah"], "kasha": "Why should the length מתוך the pregnancy matter?", "answer": "So that people would not say he was from Avimelech's household. R' Chama, however, says he was born after seven months."}]}, {"id": "21:2.2", "ch": 21, "v": 2, "n": 2, "dh": "למועד אשר דבר אתו", "pasuk_html": "וַתַּ֩הַר֩ וַתֵּ֨לֶד שָׂרָ֧ה לְאַבְרָהָ֛ם בֵּ֖ן לִזְקֻנָ֑יו לַמּוֹעֵ֕ד אֲשֶׁר־דִּבֶּ֥ר אֹת֖וֹ אֱלֹהִֽים׃", "pasuk_en": "She conceived and Sarah gave birth to Avraham’s son in his old age, at the designated time that Elohim had declared.", "rashi_he": "דִּי מַלִּיל יָתֵהּ, אֶת הַמּוֹעֵד דִּבֵּר וְקָבַע כְּשֶׁאָמַר לוֹ לַמּוֹעֵד אָשׁוּב אֵלֶיךָ (שם י\"ח), שָׂרַט לוֹ שְׂרִיטָה בַּכֹּתֶל, אָמַר לוֹ כְּשֶׁתַּגִּיעַ חַמָּה לִשְׂרִיטָה זוֹ בַּשָּׁנָה הָאַחֶרֶת, תֵּלֵד:", "rashi_en": "[Onkelos translates it] “Of which He spoke.” [I.e.,] the designated time that He spoke and set when he, told him “At the designated time I will return to you.” He scratched out a mark in the wall and told him, “When the sun will [again] reach this mark next year, she [Sarah] will give birth.”", "note": "", "points": [{"q": "'למועד אשר דבר אתו' — what does 'אתו' refer to here?", "options": ["The set time Hashem had spoken מתוך", "Avraham, whom Hashem spoke with", "The child who was born"], "kasha": "'דבר אתו' could mean 'spoke with him' — who or what is 'אתו'?", "answer": "As Onkelos: 'די מליל יתיה' — the time which He spoke and fixed when He said 'למועד אשוב אליך.'"}, {"q": "When Hashem said 'למועד אשוב אליך', how did He set the exact time?", "options": ["He scratched a mark on the wall for the sun", "He told them the date מתוך the birth", "He promised it would come on Pesach"], "kasha": "How was the 'מועד' fixed precisely?", "answer": "He scratched a mark on the wall and said: when the sun reaches this mark next year, she will give birth."}]}, {"id": "21:2.3", "ch": 21, "v": 2, "n": 3, "dh": "לזקניו", "pasuk_html": "וַתַּ֩הַר֩ וַתֵּ֨לֶד שָׂרָ֧ה לְאַבְרָהָ֛ם בֵּ֖ן <mark>לִזְקֻנָ֑יו</mark> לַמּוֹעֵ֕ד אֲשֶׁר־דִּבֶּ֥ר אֹת֖וֹ אֱלֹהִֽים׃", "pasuk_en": "She conceived and Sarah gave birth to Avraham’s son in his old age, at the designated time that Elohim had declared.", "rashi_he": "היה זיו איקונין שלו דומה לו:", "rashi_en": "That his [Yitzchok’s] facial features were similar to his [Avraham’s].", "note": "", "points": [{"q": "'בן לזקניו' — 'a son to his old age.' What does 'לזקניו' tell us about Yitzchak?", "options": ["His face looked just like Avraham's", "He would be wise like an elder", "He would live to a great old age"], "kasha": "'לזקניו' is an unusual way to say 'in his old age.'", "answer": "Yitzchak's facial features (זיו איקונין) resembled Avraham's."}]}, {"id": "21:6.1", "ch": 21, "v": 6, "n": 1, "dh": "יצחק לי", "pasuk_html": "וַתֹּ֣אמֶר שָׂרָ֔ה צְחֹ֕ק עָ֥שָׂה לִ֖י אֱלֹהִ֑ים כׇּל־הַשֹּׁמֵ֖עַ יִֽצְחַק־לִֽי׃", "pasuk_en": "Sarah said, Elohim has given me laughter. All who hear will laugh with me.", "rashi_he": "יִשְׂמַח עָלַי. וּמִ\"אַ הַרְבֵּה עֲקָרוֹת נִפְקְדוּ עִמָּהּ, הַרְבֵּה חוֹלִים נִתְרַפְּאוּ בוֹ בַיּוֹם, הַרְבֵּה תְפִלּוֹת נַעֲנוּ עִמָּהּ, וְרֹב שְׂחוֹק הָיָה בָעוֹלָם:", "rashi_en": "[Meaning:] will rejoice for me. The Midrashic explanation [is that] many childless women conceived when she did; many sick were healed that day; many prayers were answered with hers; and there was much joy in the world.", "note": "", "points": [{"q": "Sarah says 'כל השומע יצחק לי.' Would people laugh at her? What does 'יצחק לי' mean?", "options": ["Will rejoice for me", "Will mock me", "Will be amazed at me"], "kasha": "'יצחק לי' could sound like people laughing at her.", "answer": "It means 'will rejoice for me.'"}, {"q": "Why would everyone hearing מתוך it rejoice, according to the Midrash?", "options": ["Many barren women, sick people and prayers were answered with her", "Avraham made a great feast for everyone", "Everyone had been praying for Sarah"], "kasha": "Why should the whole world share Sarah's joy?", "answer": "Many barren women conceived with her, many sick were healed that day, many prayers were answered with hers, and there was great joy in the world."}]}, {"id": "21:7.1", "ch": 21, "v": 7, "n": 1, "dh": "מי מלל לאברהם", "pasuk_html": "וַתֹּ֗אמֶר <mark>מִ֤י מִלֵּל֙ לְאַבְרָהָ֔ם</mark> הֵינִ֥יקָה בָנִ֖ים שָׂרָ֑ה כִּֽי־יָלַ֥דְתִּי בֵ֖ן לִזְקֻנָֽיו׃", "pasuk_en": "She said, Who said to Avraham, that Sarah would nurse children? For I have given birth to a son in his old age.", "rashi_he": "לְשׁוֹן שֶׁבַח וַחֲשִׁיבוּת, רְאוּ, מִי הוּא וְכַמָּה הוּא שׁוֹמֵר הַבְטָחָתוֹ הַקָּבָּ\"ה מַבְטִיחַ וְעוֹשֶׂה.", "rashi_en": "An expression מתוך praise and esteem as in “Who is it that did and accomplished?” [or] “Who has created all these?” [Here meaning:] “See Who He is, and to what extent He keeps His promise! God promises and does it!”", "note": "", "points": [{"q": "Sarah asks 'מי מלל לאברהם' — 'who said to Avraham?' Is she really asking who said it?", "options": ["No — it's praise: see Who He is, He keeps His promise", "Yes — she didn't know who told Avraham", "No — she is doubting the promise"], "kasha": "Sarah knew Hashem had promised — why ask 'who said'?", "answer": "It is an expression מתוך praise and esteem: see Who He is and how He keeps His promise — Hashem promises and does."}]}, {"id": "21:7.2", "ch": 21, "v": 7, "n": 2, "dh": "מלל", "pasuk_html": "וַתֹּ֗אמֶר מִ֤י <mark>מִלֵּל֙</mark> לְאַבְרָהָ֔ם הֵינִ֥יקָה בָנִ֖ים שָׂרָ֑ה כִּֽי־יָלַ֥דְתִּי בֵ֖ן לִזְקֻנָֽיו׃", "pasuk_en": "She said, Who said to Avraham, that Sarah would nurse children? For I have given birth to a son in his old age.", "rashi_he": "שִׁנָּה הַכָּתוּב וְלֹא אָמַר דִּבֵּר – גִּימַטְרִיָּא שֶׁלּוֹ ק', כְּלוֹמַר לְסוֹף מֵאָה לְאַבְרָהָם:", "rashi_en": "Scripture uses an alternate word and does not say דִבֶּר because its [מִלֵּל] numerical value is 100 thereby alluding to Avraham’s being 100 years old.", "note": "", "points": [{"q": "Why does the posuk use the rare word 'מלל' instead מתוך 'דבר'?", "options": ["Its gematria is 100, Avraham's age", "It's softer, fitting Sarah's speech", "It hints to the malachim who spoke"], "kasha": "'מלל' is an unusual word; 'דבר' would be normal.", "answer": "The gematria מתוך 'מלל' is 100 — hinting that at the end מתוך 100 years Avraham would have a son."}]}, {"id": "21:7.3", "ch": 21, "v": 7, "n": 3, "dh": "היניקה בנים שרה", "pasuk_html": "וַתֹּ֗אמֶר מִ֤י מִלֵּל֙ לְאַבְרָהָ֔ם <mark>הֵינִ֥יקָה בָנִ֖ים שָׂרָ֑ה</mark> כִּֽי־יָלַ֥דְתִּי בֵ֖ן לִזְקֻנָֽיו׃", "pasuk_en": "She said, Who said to Avraham, that Sarah would nurse children? For I have given birth to a son in his old age.", "rashi_he": "וּמַהוּ בָנִים לְשׁוֹן רַבִּים? בְּיוֹם הַמִּשְׁתֶּה הֵבִיאוּ הַשָּׂרוֹת בְּנֵיהֶן עִמָּהֶן וְהֵנִיקָה אוֹתָם, שֶׁהָיוּ אוֹמְרוֹת לֹא יָלְדָה שָׂרָה, אֶלָֹּא אֲסוּפִי הֵבִיאָה מִן הַשּׁוּק:", "rashi_en": "Why is בָנִים [children] in the plural form? [Because] on the day מתוך the feast the princesses brought their children with them and she [Sarah] nursed them. For they were saying that [actually] Sarah had not given birth but brought in a foundling from the street.", "note": "", "points": [{"q": "'היניקה בנים שרה' — Sarah had only one son. Why the plural 'בנים'?", "options": ["At the feast she nursed the princesses' children too", "She later had more children", "It hints to Yitzchak's future children"], "kasha": "'בנים' is plural, yet Sarah had only Yitzchak.", "answer": "On the day מתוך the feast the princesses brought their children, and Sarah nursed them."}, {"q": "Why did the princesses bring their babies for Sarah to nurse?", "options": ["They claimed Sarah hadn't given birth but took a foundling", "They had no milk for their babies", "It was a custom מתוך honoring the hostess"], "kasha": "Why would they test Sarah this way?", "answer": "They were saying Sarah didn't really give birth, but brought in a foundling from the street."}]}, {"id": "21:8.1", "ch": 21, "v": 8, "n": 1, "dh": "ויגמל", "pasuk_html": "וַיִּגְדַּ֥ל הַיֶּ֖לֶד <mark>וַיִּגָּמַ֑ל</mark> וַיַּ֤עַשׂ אַבְרָהָם֙ מִשְׁתֶּ֣ה גָד֔וֹל בְּי֖וֹם הִגָּמֵ֥ל אֶת־יִצְחָֽק׃", "pasuk_en": "The child grew and was weaned. Avraham made a great feast on the day Yitzchok was weaned.", "rashi_he": "לְסוֹף כ\"ד חֹדֶשׁ (גיטין ע\"ה):", "rashi_en": "After he was 24 months old.", "note": "", "points": [{"q": "'ויגמל' — at what age was Yitzchak weaned?", "options": ["24 months", "12 months", "Three years"], "kasha": "The posuk doesn't say when the weaning was.", "answer": "At the end מתוך 24 months (Gemara Gittin)."}]}, {"id": "21:8.2", "ch": 21, "v": 8, "n": 2, "dh": "משתה גדול", "pasuk_html": "וַיִּגְדַּ֥ל הַיֶּ֖לֶד וַיִּגָּמַ֑ל וַיַּ֤עַשׂ אַבְרָהָם֙ <mark>מִשְׁתֶּ֣ה גָד֔וֹל</mark> בְּי֖וֹם הִגָּמֵ֥ל אֶת־יִצְחָֽק׃", "pasuk_en": "The child grew and was weaned. Avraham made a great feast on the day Yitzchok was weaned.", "rashi_he": "שֶׁהָיוּ שָׁם גְּדוֹלֵי הַדּוֹר שֵׁם וָעֵבֶר וַאֲבִימֶלֶךְ (בראשית רבה):", "rashi_en": "Because the great people מתוך the time were there [namely:] Sheim, Eiver, and Avimelech.", "note": "", "points": [{"q": "What made Avraham's weaning feast a 'משתה גדול'?", "options": ["The great people מתוך the generation were there", "It lasted for seven full days", "Avraham slaughtered many animals for it"], "kasha": "Why call this feast 'great'?", "answer": "The great men מתוך the generation were there — Shem, Ever and Avimelech (בראשית Rabbah)."}]}, {"id": "21:9.1", "ch": 21, "v": 9, "n": 1, "dh": "מצחק", "pasuk_html": "וַתֵּ֨רֶא שָׂרָ֜ה אֶֽת־בֶּן־הָגָ֧ר הַמִּצְרִ֛ית אֲשֶׁר־יָלְדָ֥ה לְאַבְרָהָ֖ם <mark>מְצַחֵֽק׃</mark>", "pasuk_en": "Sarah saw that the son מתוך Hagar, the Egyptian, that she had born to Avraham, was mocking.", "rashi_he": "לְשׁוֹן עֲ\"זָ, כְּמוֹ שֶׁנֶּאֱמַר וַיָּקֻמוּ לְצַחֵק (שמות ל\"ב), דָּ\"אַ לְשׁוֹן גִּלּוּי עֲרָיוֹת, כְּמָה דְּתֵימָא לְצַחֶק בִּי (בראשית ל\"ט), דָּ\"אַ לְשׁוֹן רְצִיחָה, כְּמוֹ יָקוּמוּ נָא הַנְּעָרִים וִישַׂחֲקוּ לְפָנֵינוּ וְגוֹ' (שמואל ב ב'), שֶׁהָיָה מֵרִיב עִם יִצְחָק עַל הַיְרֻשָּׁה וְאוֹמֵר אֲנִי בְּכוֹר וְנוֹטֵל פִּי שְׁנַיִם, וְיוֹצְאִים בַּשָּׂדֶה וְנוֹטֵל קַשְׁתּוֹ וְיוֹרֶה בוֹ חִצִּים, כְּמָה דְּתֵימָא כְּמִתְלַהְלֵהַּ הַיֹּרֶה זִקִּים וְגוֹ' וְאָמַר הֲלֹא מְשַׂחֵק אָנִי (משלי כ\"ו):", "rashi_en": "This is a reference to idolatry as it is said: “They arose to revel.” An alternate explanation: A reference to illicit relations as is said “To mock me.” An alternate explanation: A reference to murder as is said: “Let the lads arise and make sport before us,” etc. For he [Yishmael] was quarreling with Yitzchok concerning their inheritance [whereupon] he [Yishmael] said: “I, being the first-born, deserve a double-share.” They went out to the field [where] he [Yishmael] took his bow and was shooting arrows at him as is said: “As a madman shooting arrows, etc., and then says, ‘I am only playing’” [It is from Sarah’s response that you can derive this when she said, “For the son מתוך this slave-woman will not inherit.”]", "note": "", "points": [{"q": "Sarah saw Yishmael 'מצחק'. Rashi's first explanation links it to 'ויקומו לצחק' by the Eigel. What sin is meant?", "options": ["Avodah zarah", "Theft", "Lashon hara"], "kasha": "Mere laughing wouldn't justify sending him away — what did 'מצחק' mean?", "answer": "It refers to avodah zarah, as in 'ויקומו לצחק' (Shemos 32)."}, {"q": "A second explanation compares 'מצחק' to 'לצחק בי' (Potiphar's wife about Yosef). What does it mean then?", "options": ["Illicit relations", "Mocking Yitzchak's birth", "Stealing Avraham's flocks"], "kasha": "What other meaning does 'צחוק' have in the Torah?", "answer": "It refers to גילוי עריות, as in 'לצחק בי' (בראשית 39)."}, {"q": "A third explanation cites 'יקומו נא הנערים וישחקו לפנינו' (Shmuel II). Which sin is that?", "options": ["Murder", "Avodah zarah", "Lying"], "kasha": "'שחוק' in that posuk led to bloodshed — could that apply here?", "answer": "It refers to murder, as in 'יקומו נא הנערים וישחקו לפנינו' (Shmuel II 2)."}, {"q": "According to the third explanation, what did Yishmael actually do to Yitzchak?", "options": ["Shot arrows at him over the inheritance, claiming it was play", "Pushed him into a pit in the field", "Stole his share מתוך Avraham's flocks"], "kasha": "How does murder fit the word 'playing'?", "answer": "He quarreled over the inheritance ('I'm the bechor, I get double'), then in the field shot arrows at him — like 'כמתלהלה היורה זקים... ואמר הלא משחק אני' (Mishlei 26)."}]}, {"id": "21:10.1", "ch": 21, "v": 10, "n": 1, "dh": "עם בני עם יצחק", "pasuk_html": "וַתֹּ֙אמֶר֙ לְאַבְרָהָ֔ם גָּרֵ֛שׁ הָאָמָ֥ה הַזֹּ֖את וְאֶת־בְּנָ֑הּ כִּ֣י לֹ֤א יִירַשׁ֙ בֶּן־הָאָמָ֣ה הַזֹּ֔את עִם־בְּנִ֖י עִם־יִצְחָֽק׃", "pasuk_en": "She said to Avraham, Drive out this slave-woman and her son, for the son מתוך this slave-woman will not inherit with my son, with Yitzchok.", "rashi_he": "מִכֵּיוָן שֶׁהוּא בְנִי אֲפִלּוּ אִם אֵינוֹ הָגוּן כְּיִצְחָק, אוֹ הָגוּן כְּיִצְחָק אֲפִלּוּ אֵינוֹ בְנִי, אֵין זֶה כְדַאי לִירַשׁ עִמּוֹ, קַ\"וָ עִם בְּנִי עִם יִצְחָק, שֶׁשְּׁתֵיהֶן בּוֹ (בראשית רבה):", "rashi_en": "Just for the fact that he is my son even if he were not as deserving as Yitzchok; or [if he would be] as deserving as Yitzchok even if he were not my son, this one [Yishmael] does not deserve to share the inheritance with him [Yitzchok]. How much more is this so [that it is] “With my son, with Yitzchok” that he has both [מתוך these qualities].", "note": "", "points": [{"q": "Sarah says 'עם בני עם יצחק' — why name him twice, as 'my son' and as 'Yitzchak'?", "options": ["Each alone makes Yishmael unworthy; surely both together", "Avraham had another son also named Yitzchak", "To stress Yitzchak was born to her, not Hagar"], "kasha": "'עם בני' and 'עם יצחק' seem repetitive.", "answer": "Being my son, even if not as worthy as Yitzchak — or as worthy as Yitzchak, even if not my son — Yishmael shouldn't inherit with him. All the more so with both qualities."}]}, {"id": "21:11.1", "ch": 21, "v": 11, "n": 1, "dh": "על אודות בנו", "pasuk_html": "וַיֵּ֧רַע הַדָּבָ֛ר מְאֹ֖ד בְּעֵינֵ֣י אַבְרָהָ֑ם עַ֖ל אוֹדֹ֥ת בְּנֽוֹ׃", "pasuk_en": "This thing was very wrong in the eyes מתוך Avraham, on account מתוך his son.", "rashi_he": "שֶׁשָּׁמַע שֶׁיָּצָא לְתַרְבּוּת רָעָה (בראשית רבה), וּפְשׁוּטוֹ עַל שֶׁאָמְרָה לוֹ לְשַׁלְּחוֹ:", "rashi_en": "For he heard that he fell into bad ways. The plain explanation is because she told him to send him away.", "note": "", "points": [{"q": "'וירע הדבר... על אודות בנו' — according to the Midrash, what about his son upset Avraham?", "options": ["He heard Yishmael had gone מתוךf to bad ways", "Yishmael was sick with a fever", "Yishmael refused to leave the house"], "kasha": "What exactly 'about his son' troubled Avraham?", "answer": "He heard that Yishmael had gone מתוךf to bad ways (בראשית Rabbah)."}, {"q": "What is the plain meaning (פשוטו) מתוך what upset Avraham?", "options": ["That Sarah told him to send Yishmael away", "That Yishmael would not inherit him", "That Hagar would return to Mitzrayim"], "kasha": "The Midrash adds a new fact — what does the posuk simply mean?", "answer": "Simply, it was bad in his eyes that Sarah told him to send his son away."}]}, {"id": "21:12.1", "ch": 21, "v": 12, "n": 1, "dh": "שמע בקולה", "pasuk_html": "וַיֹּ֨אמֶר אֱלֹהִ֜ים אֶל־אַבְרָהָ֗ם אַל־יֵרַ֤ע בְּעֵינֶ֙יךָ֙ עַל־הַנַּ֣עַר וְעַל־אֲמָתֶ֔ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛יךָ שָׂרָ֖ה שְׁמַ֣ע בְּקֹלָ֑הּ כִּ֣י בְיִצְחָ֔ק יִקָּרֵ֥א לְךָ֖ זָֽרַע׃", "pasuk_en": "Elohim said to Avraham, Do not consider this wrong in your eyes on account מתוך the boy and your slave-woman. Regarding all that Sarah tells you, listen to her voice, for [only] through Yitzchok will seed be considered yours.", "rashi_he": "לָמַדְנוּ שֶׁהָיָה אַבְרָהָם טָפֵל לְשָׂרָה בִּנְבִיאוּת:", "rashi_en": "We learn from this that Avraham was inferior to Sarah with regard to prophecy.", "note": "", "points": [{"q": "Hashem tells Avraham 'שמע בקולה' — listen to Sarah. What do we learn from this?", "options": ["Avraham was secondary to Sarah in prophecy", "A husband must always obey his wife", "Sarah was older and wiser than Avraham"], "kasha": "Why must Avraham defer to Sarah's view?", "answer": "We learn that Avraham was secondary to Sarah in prophecy."}]}, {"id": "21:14.1", "ch": 21, "v": 14, "n": 1, "dh": "לחם וחמת מים", "pasuk_html": "וַיַּשְׁכֵּ֣ם אַבְרָהָ֣ם&thinsp;׀&thinsp;בַּבֹּ֡קֶר וַיִּֽקַּֽח־<mark>לֶ֩חֶם֩ וְחֵ֨מַת מַ֜יִם</mark> וַיִּתֵּ֣ן אֶל־הָ֠גָ֠ר שָׂ֧ם עַל־שִׁכְמָ֛הּ וְאֶת־הַיֶּ֖לֶד וַֽיְשַׁלְּחֶ֑הָ וַתֵּ֣לֶךְ וַתֵּ֔תַע בְּמִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׃", "pasuk_en": "Avraham got up early in the morning. He took bread and a skin [pouch] מתוך water, and gave it to Hagar. He placed it on her shoulder with the lad, and sent her away. She went and lost her way in the desert מתוך Beer Sheva.", "rashi_he": "וְלֹא כֶסֶף וְזָהָב, לְפִי שֶׁהָיָה שׂוֹנְאוֹ עַל שֶׁיָּצָא לְתַרְבּוּת רָעָה:", "rashi_en": "But no silver and gold because he despised him for falling into bad ways.", "note": "", "points": [{"q": "Avraham sent Hagar מתוךf with 'לחם וחמת מים' only. Why not silver and gold?", "options": ["He despised Yishmael for going to bad ways", "He had no money to spare then", "Sarah forbade giving them anything else"], "kasha": "Avraham was wealthy — why only bread and water?", "answer": "Not silver and gold, because he despised Yishmael for going מתוךf to bad ways."}]}, {"id": "21:14.2", "ch": 21, "v": 14, "n": 2, "dh": "ואת הילד", "pasuk_html": "וַיַּשְׁכֵּ֣ם אַבְרָהָ֣ם&thinsp;׀&thinsp;בַּבֹּ֡קֶר וַיִּֽקַּֽח־לֶ֩חֶם֩ וְחֵ֨מַת מַ֜יִם וַיִּתֵּ֣ן אֶל־הָ֠גָ֠ר שָׂ֧ם עַל־שִׁכְמָ֛הּ וְאֶת־הַיֶּ֖לֶד וַֽיְשַׁלְּחֶ֑הָ וַתֵּ֣לֶךְ וַתֵּ֔תַע בְּמִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׃", "pasuk_en": "Avraham got up early in the morning. He took bread and a skin [pouch] מתוך water, and gave it to Hagar. He placed it on her shoulder with the lad, and sent her away. She went and lost her way in the desert מתוך Beer Sheva.", "rashi_he": "אַף הַיֶּלֶד שָׂם עַל שִׁכְמָהּ, שֶׁהִכְנִיסָה בוֹ שָׂרָה עַיִן רָעָה וַאֲחָזַתּוּ חַמָּה וְלֹא יָכוֹל לֵילֵךְ בְּרַגְלָיו (בראשית רבה):", "rashi_en": "He also placed the child on her shoulder because Sarah had cast an evil eye on him and he was seized by a fever and could not walk on his own feet.", "note": "", "points": [{"q": "'שם על שכמה ואת הילד' — what did Avraham place on Hagar's shoulder besides the bread and water?", "options": ["The child himself", "A bow and arrows", "Silver and gold"], "kasha": "'ואת הילד' seems attached to 'שם על שכמה.'", "answer": "He put the child too on her shoulder."}, {"q": "Why did Yishmael need to be carried on Hagar's shoulder?", "options": ["Sarah's evil eye gave him a fever and he couldn't walk", "He refused to leave Avraham's house", "He was still a nursing baby"], "kasha": "Why would the boy not walk on his own?", "answer": "Sarah cast an עין רעה on him, a fever seized him, and he couldn't walk on his own feet (בראשית Rabbah)."}]}, {"id": "21:14.3", "ch": 21, "v": 14, "n": 3, "dh": "ותלך ותתע", "pasuk_html": "וַיַּשְׁכֵּ֣ם אַבְרָהָ֣ם&thinsp;׀&thinsp;בַּבֹּ֡קֶר וַיִּֽקַּֽח־לֶ֩חֶם֩ וְחֵ֨מַת מַ֜יִם וַיִּתֵּ֣ן אֶל־הָ֠גָ֠ר שָׂ֧ם עַל־שִׁכְמָ֛הּ וְאֶת־הַיֶּ֖לֶד וַֽיְשַׁלְּחֶ֑הָ <mark>וַתֵּ֣לֶךְ וַתֵּ֔תַע</mark> בְּמִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׃", "pasuk_en": "Avraham got up early in the morning. He took bread and a skin [pouch] מתוך water, and gave it to Hagar. He placed it on her shoulder with the lad, and sent her away. She went and lost her way in the desert מתוך Beer Sheva.", "rashi_he": "חָזְרָה לְגִלּוּלֵי בֵית אָבִיהָ (פרקי דרבי אליעזר פ' ל'):", "rashi_en": "[Meaning] she returned to her family’s idolatry.", "note": "", "points": [{"q": "'ותלך ותתע' — Hagar 'went astray.' What does רש״י say this means?", "options": ["She returned to her father's house's idols", "She lost the road in the desert", "She ran from the malach"], "kasha": "'ותתע' — straying — what kind מתוך straying is meant?", "answer": "She went back to the idols מתוך her father's house (Pirkei D'Rabbi Eliezer)."}]}, {"id": "21:15.1", "ch": 21, "v": 15, "n": 1, "dh": "ויכלו המים", "pasuk_html": "<mark>וַיִּכְל֥וּ הַמַּ֖יִם</mark> מִן־הַחֵ֑מֶת וַתַּשְׁלֵ֣ךְ אֶת־הַיֶּ֔לֶד תַּ֖חַת אַחַ֥ד הַשִּׂיחִֽם׃", "pasuk_en": "The water in the skin was used up, and she threw the lad under one מתוך the bushes.", "rashi_he": "לְפִי שֶׁדֶּרֶךְ חוֹלִים לִשְׁתּוֹת הַרְבֵּה:", "rashi_en": "Because the sick [need to] drink a great deal.", "note": "", "points": [{"q": "'ויכלו המים' — why did the water run out so fast?", "options": ["Sick people drink a great deal", "The skin had a hole in it", "Hagar poured some out in anger"], "kasha": "Avraham gave them water — why was it used up so soon?", "answer": "Because it is the way מתוך the sick to drink a lot."}]}, {"id": "21:16.1", "ch": 21, "v": 16, "n": 1, "dh": "מנגד", "pasuk_html": "וַתֵּ֩לֶךְ֩ וַתֵּ֨שֶׁב לָ֜הּ <mark>מִנֶּ֗גֶד</mark> הַרְחֵק֙ כִּמְטַחֲוֵ֣י קֶ֔שֶׁת כִּ֣י אָֽמְרָ֔ה אַל־אֶרְאֶ֖ה בְּמ֣וֹת הַיָּ֑לֶד וַתֵּ֣שֶׁב מִנֶּ֔גֶד וַתִּשָּׂ֥א אֶת־קֹלָ֖הּ וַתֵּֽבְךְּ׃", "pasuk_en": "She went and sat facing him, about [the distance] מתוך bow-shots away. She said, Let me not see the lad die. She sat facing him and wept in a loud voice.", "rashi_he": "מֵרָחוֹק:", "rashi_en": "From afar.", "note": "", "points": [{"q": "'ותשב לה מנגד' — what does 'מנגד' mean here?", "options": ["From afar", "Facing him closely", "Opposite the bushes"], "kasha": "'מנגד' usually means 'opposite' — what is it here?", "answer": "From a distance."}]}, {"id": "21:16.2", "ch": 21, "v": 16, "n": 2, "dh": "כמטחוי קשת", "pasuk_html": "וַתֵּ֩לֶךְ֩ וַתֵּ֨שֶׁב לָ֜הּ מִנֶּ֗גֶד הַרְחֵק֙ <mark>כִּמְטַחֲוֵ֣י קֶ֔שֶׁת</mark> כִּ֣י אָֽמְרָ֔ה אַל־אֶרְאֶ֖ה בְּמ֣וֹת הַיָּ֑לֶד וַתֵּ֣שֶׁב מִנֶּ֔גֶד וַתִּשָּׂ֥א אֶת־קֹלָ֖הּ וַתֵּֽבְךְּ׃", "pasuk_en": "She went and sat facing him, about [the distance] מתוך bow-shots away. She said, Let me not see the lad die. She sat facing him and wept in a loud voice.", "rashi_he": "כִּשְׁתֵּי טִיחוֹת (בראשית רבה), וְהוּא לְשׁוֹן יְרִיַּת חֵץ, בִּלְשׁוֹן מִשְׁנָה שֶׁהֵטִיחַ בְאִשְׁתּוֹ, עַל שֵׁם שֶׁהַזֶּרַע יוֹרֶה כַּחֵץ; וְאִם תֹּאמַר הָיָה לוֹ לִכְתֹּב כִּמְטַחֵי קֶשֶׁת, מִשְׁפַּט הַוָּי\"ו לִכָּנֵס לְכָאן, כְּמוֹ בְּחַגְוֵי הַסֶּלַע (שיר השירים ב'), מִגִּזְרַת וְהָיְתָה אַדְמַת יְהוּדָה לְמִצְרַיִם לְחָגָּא (ישעיהו י\"ט), וּמִגִּזְרַת יָחוֹגּוּ וְיָנוּעוּ כַּשִּׁכּוֹר (תהילים ק\"ז), וְכֵן קַצְוֵי אֶרֶץ (תהילים ס\"ה), מִגִּזְרַת קָצֶה:", "rashi_en": "[Meaning, the distance] מתוך two shots. It [כִּמְטַחֲוֵי] has the meaning מתוך shooting an arrow. It is used in the Mishnah “[שֶׁהֵטִיחַ] one who had relations with his wife.” [This term is used] because the seed shoots as does an arrow. If you ask: It should have been written כִּמְטַחֵי קֶשֶׁת? [The answer is:] it is grammatically correct to insert a vav here as in בְּחַגְוֵי הַסֶּלַע [in the clefts מתוך the rock] [where בְּחַגְוֵי] has the same derivation as “The Land מתוך Yehudah became לְחָגָּא [rupture] for those in Egypt”; and from the same derivation as: “[יָחוֹגּוּ] They reeled and staggered like a drunk.” Similarly: “קַצְוֵי אֶרֶץ —the ends מתוך the earth” [קַצְוֵי] being derived from קָצֶה.", "note": "", "points": [{"q": "'כמטחוי קשת' is plural. How far away did Hagar sit?", "options": ["The distance מתוך two bow-shots", "The length מתוך one bow", "A full day's walk"], "kasha": "'מטחוי' is an unusual plural word — what distance is meant?", "answer": "About the distance מתוך two shots (בראשית Rabbah)."}, {"q": "What does the root מתוך 'מטחוי' mean, and where else is it used?", "options": ["Shooting an arrow; the Mishnah's 'הטיח' is similar", "Stretching a bow; used in Tehillim", "Measuring land; used in Melachim"], "kasha": "What is the source מתוך this rare word?", "answer": "It means shooting an arrow, as in the Mishnah's 'שהטיח באשתו' — since the seed shoots like an arrow."}, {"q": "From 'טחה', you'd expect 'כמטחי'. Why is there a ו in 'כמטחוי'?", "options": ["Grammatically a ו enters such forms, like 'קצוי' from 'קצה'", "The ו hints to the six bow-shots", "It's a spelling mistake kept by tradition"], "kasha": "The extra ו doesn't fit the root.", "answer": "A ו normally enters here, as in 'בחגוי הסלע' (from 'לחגא', 'יחוגו') and 'קצוי ארץ' from 'קצה'."}]}, {"id": "21:16.3", "ch": 21, "v": 16, "n": 3, "dh": "ותשב מנגד", "pasuk_html": "וַתֵּ֩לֶךְ֩ וַתֵּ֨שֶׁב לָ֜הּ מִנֶּ֗גֶד הַרְחֵק֙ כִּמְטַחֲוֵ֣י קֶ֔שֶׁת כִּ֣י אָֽמְרָ֔ה אַל־אֶרְאֶ֖ה בְּמ֣וֹת הַיָּ֑לֶד <mark>וַתֵּ֣שֶׁב מִנֶּ֔גֶד</mark> וַתִּשָּׂ֥א אֶת־קֹלָ֖הּ וַתֵּֽבְךְּ׃", "pasuk_en": "She went and sat facing him, about [the distance] מתוך bow-shots away. She said, Let me not see the lad die. She sat facing him and wept in a loud voice.", "rashi_he": "כֵּיוָן שֶׁקָּרַב לָמוּת הוֹסִיפָה לְהִתְרַחֵק:", "rashi_en": "As he came closer to dying she continued to move farther away.", "note": "", "points": [{"q": "'ותשב מנגד' appears a second time in the posuk. Why repeat it?", "options": ["As he neared death she moved further away", "She came back to sit beside him", "To show she sat there all night"], "kasha": "The posuk already said she sat opposite him.", "answer": "As he got closer to dying, she moved even further away."}]}, {"id": "21:17.1", "ch": 21, "v": 17, "n": 1, "dh": "את קול הנער", "pasuk_html": "וַיִּשְׁמַ֣ע אֱלֹהִים֮ אֶת־ק֣וֹל הַנַּ֒עַר֒ וַיִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים&thinsp;׀&thinsp;אֶל־הָגָר֙ מִן־הַשָּׁמַ֔יִם וַיֹּ֥אמֶר לָ֖הּ מַה־לָּ֣ךְ הָגָ֑ר אַל־תִּ֣ירְאִ֔י כִּֽי־שָׁמַ֧ע אֱלֹהִ֛ים אֶל־ק֥וֹל הַנַּ֖עַר בַּאֲשֶׁ֥ר הוּא־שָֽׁם׃", "pasuk_en": "Elohim heard the voice מתוך the lad. An angel מתוך God called to Hagar from heaven and said to her, What is the matter, Hagar? Do not fear. Elohim has heard the voice מתוך the lad in the place where he is.", "rashi_he": "מִכָּאן שֶׁיָּפָה תְּפִלַּת הַחוֹלֶה מִתְּפִלַּת אֲחֵרִים עָלָיו וְהִיא קוֹדֶמֶת לְהִתְקַבֵּל (בראשית רבה):", "rashi_en": "[We derive] from this, that the prayer מתוך the sick person is more effective than the prayers מתוך others [who pray] for him and is sooner accepted.", "note": "", "points": [{"q": "Hagar cried out, yet 'וישמע אלהים את קול הנער.' What do we learn from this?", "options": ["A sick person's own tefillah is better and accepted first", "Hashem listens only to children's tefillos", "Hagar's crying was not sincere"], "kasha": "Hagar was the one crying — why is the lad's voice heard?", "answer": "The tefillah מתוך the sick person is better than others' tefillos for him, and is accepted first (בראשית Rabbah)."}]}, {"id": "21:17.2", "ch": 21, "v": 17, "n": 2, "dh": "באשר הוא שם", "pasuk_html": "וַיִּשְׁמַ֣ע אֱלֹהִים֮ אֶת־ק֣וֹל הַנַּ֒עַר֒ וַיִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים&thinsp;׀&thinsp;אֶל־הָגָר֙ מִן־הַשָּׁמַ֔יִם וַיֹּ֥אמֶר לָ֖הּ מַה־לָּ֣ךְ הָגָ֑ר אַל־תִּ֣ירְאִ֔י כִּֽי־שָׁמַ֧ע אֱלֹהִ֛ים אֶל־ק֥וֹל הַנַּ֖עַר בַּאֲשֶׁ֥ר הוּא־שָֽׁם׃", "pasuk_en": "Elohim heard the voice מתוך the lad. An angel מתוך God called to Hagar from heaven and said to her, What is the matter, Hagar? Do not fear. Elohim has heard the voice מתוך the lad in the place where he is.", "rashi_he": "לְפִי מַעֲשִׂים שֶׁהוּא עוֹשֶׂה עַכְשָׁו הוּא נִדּוֹן, וְלֹא לְפִי מַה שֶּׁהוּא עָתִיד לַעֲשׂוֹת (ראש השנה ט\"ז), לְפִי שֶׁהָיוּ מַלְאֲכֵי הַשָּׁרֵת מְקַטְרְגִים וְאוֹמְרִים רִבּוֹנו שֶׁל עוֹלָם, מִי שֶׁעָתִיד זַרְעוֹ לְהָמִית בָּנֶיךָ בַּצָּמָא אַתָּה מַעֲלֶה לוֹ בְּאֵר, וְהוּא מְשִׁיבָם עַכְשָׁו מַה הוּא, צַדִּיק אוֹ רָשָׁע? אָמְרוּ לוֹ צַדִּיק, אָמַר לָהֶם לְפִי מַעֲשָׂיו שֶׁל עַכְשָׁו אֲנִי דָנוֹ, וְזֶהוּ בַּאֲשֶׁר הוּא שָׁם. וְהֵיכָן הֵמִית אֶת יִשְׂרָאֵל בַּצָּמָא? כְּשֶׁהֶגְלָם נְבוּכַדְנֶצַּר, שֶׁנֶּאֱמַר מַשָּׂא בַּעְרָב וְגוֹ' לִקְרַאת צָמֵא הֵתָיוּ מָיִם וְגוֹ' (ישעיהו כ\"א), כְּשֶׁהָיוּ מוֹלִיכִין אוֹתָם אֵצֶל עַרְבִיִּים, הָיוּ יִשְׂרָאֵל אוֹמְרִים לְשׁוֹבֵיהֶם בְּבַקָּשָׁה מִכֶּם הוֹלִיכוּנוּ אֵצֶל בְּנֵי דוֹדֵנוּ יִשְׁמָעֵאל וִירַחֲמוּ עָלֵינוּ, שֶׁנֶּאֱמַר אֹרְחוֹת דְּדָנִים (שם) – אַל תִּקְרֵי דְּדָנִים אֶלָּא דּוֹדִים – וְאֵלּוּ יוֹצְאִים לִקְרָאתָם וּמְבִיאִין לָהֶם בָּשָׂר וְדָג מָלוּחַ וְנוֹדוֹת נְפוּחִים, כִּסְבוּרִים יִשְׂרָאֵל שֶׁהֵם מְלֵאִים מַיִם, וּכְשֶׁמַּכְנִיסוֹ לְתוֹךְ פִּיו וּפוֹתְחוֹ, הָרוּחַ נִכְנֶסֶת בְּגוּפוֹ וּמֵת:", "rashi_en": "[I.e.,] he is judged according to his present deeds and not according to what he will do in the future. For the angels were declaiming against [him] and saying, “Master מתוך the universe, for one whose descendants will eventually kill Your children with thirst You will provide for him a well?” And He responds to them, “But, what is he now, נכוןeous or wicked?” They respond to Him: “He is נכוןeous.” [Whereupon] He responds to them: “It is according to his present deeds that I judge him.” That is the meaning מתוך “Where he is.” Where did they kill Israel with thirst? It was when Nebuchadnezzer exiled them, as it is said: “The burden מתוך Arabia, etc., bring water to the one who is thirsty.” When they marched them near Arabian [lands], the Israelites said to their captors, “We beg מתוך you, bring us to the descendants מתוך our uncle Yishmael and they will take pity on us, as it is said, “you caravans מתוך [דְּדָנִים] Dedanites”; do not read דְּדָנִים [Dedanites] but דוֹדִים [family kin]. [Whereupon] they [the Yishmaelites] came towards them bringing them salted meat and fish and [air-]inflated water-skins. The Israelites thought that they were full מתוך water and when one would insert it into his mouth and then open it, the air would enter his body and he would die.", "note": "", "points": [{"q": "'באשר הוא שם' — 'where he is.' Why add this?", "options": ["He's judged by his present deeds, not future ones", "To tell Hagar exactly where he lay", "He was in a holy place"], "kasha": "Hagar knew where he was — what does 'באשר הוא שם' add?", "answer": "He is judged by what he does now, not by what he will do in the future (Rosh Hashanah)."}, {"q": "Who objected to saving Yishmael, and how did Hashem answer?", "options": ["Malachim; Hashem: 'Is he now נכוןeous? I judge him now'", "Sarah; Hashem: 'Listen to the lad's voice'", "Avraham; Hashem: 'He too is your seed'"], "kasha": "Why would anyone object to saving a dying child?", "answer": "The malachim prosecuted: his descendants will kill Your children with thirst! Hashem asked: what is he now? 'Righteous.' I judge him by his present deeds."}, {"q": "When did Yishmael's descendants kill Yisroel with thirst?", "options": ["When Nevuchadnetzar exiled them, per 'משא בערב'", "When Yisroel left Mitzrayim through the desert", "During the days מתוך the Shמתוךtim"], "kasha": "Where do we find this future sin?", "answer": "When Nevuchadnetzar exiled them, as it says 'משא בערב... לקראת צמא התיו מים' (Yeshayahu 21)."}, {"q": "Why did the exiles ask to be led to the Arabians? Which word hints to this?", "options": ["They were cousins; read 'דדנים' as 'דודים'", "They were rich; read 'דדנים' as 'דגנים'", "They were near; 'ארחות' means roads"], "kasha": "Why would Yisroel turn specifically to Yishmael's descendants?", "answer": "They begged to be taken to their 'uncle' Yishmael's children, hoping for mercy — 'ארחות דדנים': don't read 'דדנים' but 'דודים.'"}, {"q": "How did Yishmael's descendants kill the thirsty exiles?", "options": ["Salty food, then air-filled water skins", "They poisoned the wells along the way", "They refused to give any water at all"], "kasha": "How did Yishmael's 'kindness' become killing?", "answer": "They brought salted meat and fish and inflated skins. Thinking they held water, a Jew put one to his mouth and opened it — air entered his body and he died."}]}, {"id": "21:20.1", "ch": 21, "v": 20, "n": 1, "dh": "רבה קשת", "pasuk_html": "וַיְהִ֧י אֱלֹהִ֛ים אֶת־הַנַּ֖עַר וַיִּגְדָּ֑ל וַיֵּ֙שֶׁב֙ בַּמִּדְבָּ֔ר וַיְהִ֖י <mark>רֹבֶ֥ה קַשָּֽׁת׃</mark>", "pasuk_en": "Elohim was with the lad and he grew up. He settled in the wilderness, [where] he became an expert archer.", "rashi_he": "יוֹרֶה חִצִּים בְּקֶשֶׁת:", "rashi_en": "[רוֹבֶה is] one who shoots arrows with a bow.", "note": "", "points": [{"q": "'רבה קשת' — what does 'רבה' mean here?", "options": ["Shooting arrows with a bow", "Growing big", "Having many bows"], "kasha": "'רבה' usually means 'grow' or 'many' — what is it here?", "answer": "One who shoots arrows with a bow."}]}, {"id": "21:20.2", "ch": 21, "v": 20, "n": 2, "dh": "קשת", "pasuk_html": "וַיְהִ֧י אֱלֹהִ֛ים אֶת־הַנַּ֖עַר וַיִּגְדָּ֑ל וַיֵּ֙שֶׁב֙ בַּמִּדְבָּ֔ר וַיְהִ֖י רֹבֶ֥ה <mark>קַשָּֽׁת׃</mark>", "pasuk_en": "Elohim was with the lad and he grew up. He settled in the wilderness, [where] he became an expert archer.", "rashi_he": "עַל שֵׁם הָאֻמָּנוּת, כְּמוֹ חַמָּר, גַּמָּל, צַיָּד, לְפִיכָך הַשִּׁי\"ן מֻדְגֶּשֶׁת. הָיָה יוֹשֵׁב בַּמִּדְבָּר וּמְלַסְטֵם אֶת הָעוֹבְרִים, הוּא שֶׁנֶּאֱמַר יָדוֹ בַכֹּל וְגוֹמֵר:", "rashi_en": "He is so called because מתוך his occupation as חַמָּר [a mule driver], גַמָּל [a cameldriver],. צַיָּד [a hunter]. Consequently, the letter שִׂין has a dagesh. He would dwell in the wilderness and rob the passers-by. That is what is referred to when it states “His hand [will be] against everyone, etc.”", "note": "", "points": [{"q": "Why is 'קשת' vowelled 'קַשָּׁת' with a dagesh, not 'קֶשֶׁת'?", "options": ["It names an occupation, like 'חמר', 'גמל', 'ציד'", "It shows the bow was very large", "It means many bows together"], "kasha": "'קשת' here has a dagesh and a different form from 'bow.'", "answer": "It's a name מתוך a trade, like חמר, גמל, ציד — therefore the ש has a dagesh: an archer."}, {"q": "What did Yishmael do with his archery in the desert?", "options": ["Robbed passers-by, fulfilling 'ידו בכל'", "Hunted food for his mother", "Guarded the caravans מתוך traders"], "kasha": "Why does the posuk tell us he became an archer?", "answer": "He sat in the desert robbing passers-by — as it says 'ידו בכל.'"}]}, {"id": "21:21.1", "ch": 21, "v": 21, "n": 1, "dh": "מארץ מצרים", "pasuk_html": "וַיֵּ֖שֶׁב בְּמִדְבַּ֣ר פָּארָ֑ן וַתִּֽקַּֽח־ל֥וֹ אִמּ֛וֹ אִשָּׁ֖ה <mark>מֵאֶ֥רֶץ מִצְרָֽיִם׃</mark>&nbsp;{פ}", "pasuk_en": "He lived in the desert מתוך Paran, and his mother took a wife for him from the land מתוך Egypt.", "rashi_he": "מִמְּקוֹם גִּדּוּלֶיהָ, שֶׁנֶּאֱמַר וְלָהּ שִׁפְחָה מִצְרִית וְגוֹ' (בראשית ט״ז:א׳), הַיְנוּ דְּאָמְרִי אִינָשֵׁי זְרֹק חוּטְרָא לַאֲוִירָא, אֲעִיקְּרֵיהּ קָאֵי:", "rashi_en": "From the place where she was raised as it is said “She had an Egyptian handmaid.” This is what people mean by the adage: “Throw a stick in the air and it will return to its source.”", "note": "", "points": [{"q": "Hagar took a wife for Yishmael 'מארץ מצרים.' Why from there?", "options": ["It was where she grew up", "Egypt had the finest wives", "Avraham had commanded it"], "kasha": "Why does the posuk note where the wife came from?", "answer": "From the place she was raised, as it says 'ולה שפחה מצרית' (בראשית 16)."}, {"q": "Which saying does רש״י bring about Hagar's choice?", "options": ["Throw a stick in the air — it lands on its root", "Like mother, like daughter", "A tree is known by its fruit"], "kasha": "What does her returning to Egypt show?", "answer": "As people say: 'Throw a stick into the air, it returns to its root.'"}]}, {"id": "21:22.1", "ch": 21, "v": 22, "n": 1, "dh": "אלהים עמך", "pasuk_html": "וַֽיְהִי֙ בָּעֵ֣ת הַהִ֔וא וַיֹּ֣אמֶר אֲבִימֶ֗לֶךְ וּפִיכֹל֙ שַׂר־צְבָא֔וֹ אֶל־אַבְרָהָ֖ם לֵאמֹ֑ר <mark>אֱלֹהִ֣ים עִמְּךָ֔</mark> בְּכֹ֥ל אֲשֶׁר־אַתָּ֖ה עֹשֶֽׂה׃", "pasuk_en": "It was at this time, Avimelech and Pichol, his general spoke to Avraham, saying, Elohim is with you in all that you do.", "rashi_he": "לְפִי שֶׁרָאוּ שֶׁיָּצָא מִשְּׁכוּנַת סְדוֹם לְשָׁלוֹם, וְעִם הַמְּלָכִים נִלְחַם וְנָפְלוּ בְיָדוֹ, וְנִפְקְדָה אִשְׁתּוֹ לִזְקוּנָיו:", "rashi_en": "Because they saw that he left the Sedom area safely, and that he battled the kings and defeated, them and that his wife conceived in his old age.", "note": "", "points": [{"q": "Avimelech tells Avraham 'אלהים עמך.' What made him see this?", "options": ["Avraham escaped Sedom, beat the kings, and Sarah conceived", "Avraham's wealth kept growing in Gerar", "Avraham found water wherever he dug"], "kasha": "Why would Avimelech say this now?", "answer": "They saw he left the area מתוך Sedom safely, fought the kings and they fell into his hands, and his wife conceived in his old age."}]}, {"id": "21:23.1", "ch": 21, "v": 23, "n": 1, "dh": "ולניני ולנכדי", "pasuk_html": "וְעַתָּ֗ה הִשָּׁ֨בְעָה לִּ֤י בֵֽאלֹהִים֙ הֵ֔נָּה אִם־תִּשְׁקֹ֣ר לִ֔י <mark>וּלְנִינִ֖י וּלְנֶכְדִּ֑י</mark> כַּחֶ֜סֶד אֲשֶׁר־עָשִׂ֤יתִי עִמְּךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔י וְעִם־הָאָ֖רֶץ אֲשֶׁר־גַּ֥רְתָּה בָּֽהּ׃", "pasuk_en": "Now, swear to me here, by Elohim, that you will not deal falsely with me, with my son, or my grandson. The kindness that I have done to you, do to me and to the land in which you lived for a while.", "rashi_he": "עַד כָּאן רַחֲמֵי הָאָב עַל הַבֵּן:", "rashi_en": "That is the limit מתוך a father’s love for a son.", "note": "", "points": [{"q": "Avimelech asks loyalty 'לי ולניני ולנכדי' — to son and grandson. Why stop there?", "options": ["A father's mercy on his children reaches that far", "Avimelech had no great-grandchildren", "A treaty may last only three generations"], "kasha": "Why limit the oath to grandchildren?", "answer": "Up to there extends a father's mercy for his child."}]}, {"id": "21:23.2", "ch": 21, "v": 23, "n": 2, "dh": "כחסד אשר עשיתי עמך תעשה עמדי", "pasuk_html": "וְעַתָּ֗ה הִשָּׁ֨בְעָה לִּ֤י בֵֽאלֹהִים֙ הֵ֔נָּה אִם־תִּשְׁקֹ֣ר לִ֔י וּלְנִינִ֖י וּלְנֶכְדִּ֑י כַּחֶ֜סֶד אֲשֶׁר־עָשִׂ֤יתִי עִמְּךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔י וְעִם־הָאָ֖רֶץ אֲשֶׁר־גַּ֥רְתָּה בָּֽהּ׃", "pasuk_en": "Now, swear to me here, by Elohim, that you will not deal falsely with me, with my son, or my grandson. The kindness that I have done to you, do to me and to the land in which you lived for a while.", "rashi_he": "שֶׁאָמַרְתִּי לְךָ הִנֵּה אַרְצִי לְפָנֶיךָ (בראשית רבה):", "rashi_en": "“When I said to you, ‘Behold, my land is before you.’”", "note": "", "points": [{"q": "'כחסד אשר עשיתי עמך' — what kindness had Avimelech done for Avraham?", "options": ["He said 'הנה ארצי לפניך'", "He gave him a well מתוך water", "He fought the kings alongside him"], "kasha": "Which kindness is Avimelech referring to?", "answer": "That he told him, 'Behold, my land is before you' (בראשית Rabbah)."}]}, {"id": "21:25.1", "ch": 21, "v": 25, "n": 1, "dh": "והוכח", "pasuk_html": "<mark>וְהוֹכִ֥חַ</mark> אַבְרָהָ֖ם אֶת־אֲבִימֶ֑לֶךְ עַל־אֹדוֹת֙ בְּאֵ֣ר הַמַּ֔יִם אֲשֶׁ֥ר גָּזְל֖וּ עַבְדֵ֥י אֲבִימֶֽלֶךְ׃", "pasuk_en": "Avraham then reprimanded Avimelech regarding the well מתוך water that Avimelech’s servants had taken by force.", "rashi_he": "נִתְוַכֵּחַ עִמּוֹ עַל כָּךְ:", "rashi_en": "[Meaning:] he had a dispute with him over it.", "note": "", "points": [{"q": "'והוכח אברהם' — what does 'והוכח' mean here?", "options": ["He argued with him about it", "He punished him", "He cursed him"], "kasha": "'והוכח' is an unusual form — what did Avraham do?", "answer": "He disputed with him about the well."}]}, {"id": "21:30.1", "ch": 21, "v": 30, "n": 1, "dh": "בעבור תהיה לי", "pasuk_html": "וַיֹּ֕אמֶר כִּ֚י אֶת־שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִיָּדִ֑י בַּעֲבוּר֙ תִּֽהְיֶה־לִּ֣י לְעֵדָ֔ה כִּ֥י חָפַ֖רְתִּי אֶת־הַבְּאֵ֥ר הַזֹּֽאת׃", "pasuk_en": "He [Avraham] said, Take these seven ewes from my hand so that it will be proמתוך for me, that I dug this well.", "rashi_he": "זאת:", "rashi_en": "<b>So that it will be proמתוך for me.</b> [לְעֵדָה is] the feminine form for “witness” as in “And the monument is [עֵדָה] witness.” <b>That I dug this well.</b> Avimelech’s shepherds argued about it [the well] and they said, “We dug it.” They agreed among themselves that whoever appears at the well and the waters will rise towards him then it [the well] is his. And they [the waters] rose towards Avraham.", "note": "", "points": [{"q": "'בעבור תהיה לי לעדה' — 'תהיה' is feminine. What is the subject: what 'will be' a witness?", "options": ["'This' — the taking מתוך the ewes", "The well itself", "Avimelech"], "kasha": "'תהיה' has no stated subject.", "answer": "The word 'זאת' — 'this' — is understood: so that this will be a witness for me."}]}, {"id": "21:30.2", "ch": 21, "v": 30, "n": 2, "dh": "לעדה", "pasuk_html": "וַיֹּ֕אמֶר כִּ֚י אֶת־שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִיָּדִ֑י בַּעֲבוּר֙ תִּֽהְיֶה־לִּ֣י <mark>לְעֵדָ֔ה</mark> כִּ֥י חָפַ֖רְתִּי אֶת־הַבְּאֵ֥ר הַזֹּֽאת׃", "pasuk_en": "He [Avraham] said, Take these seven ewes from my hand so that it will be proמתוך for me, that I dug this well.", "rashi_he": "לְשׁוֹן עֵדוּת שֶׁל נְקֵבָה, כְּמוֹ וְעֵדָה הַמַּצֵּבָה (בראשית ל\"א):", "rashi_en": "<b>So that it will be proמתוך for me.</b> [לְעֵדָה is] the feminine form for “witness” as in “And the monument is [עֵדָה] witness.” <b>That I dug this well.</b> Avimelech’s shepherds argued about it [the well] and they said, “We dug it.” They agreed among themselves that whoever appears at the well and the waters will rise towards him then it [the well] is his. And they [the waters] rose towards Avraham.", "note": "", "points": [{"q": "What kind מתוך word is 'לעדה'?", "options": ["The feminine form מתוך 'witness'", "A word for a congregation", "A word for an oath"], "kasha": "'עדה' is an unusual form — usually it means a congregation.", "answer": "It is the feminine form מתוך 'עדות' — witness — as in 'ועדה המצבה' (בראשית 31)."}]}, {"id": "21:30.3", "ch": 21, "v": 30, "n": 3, "dh": "כי חפרתי את הבאר", "pasuk_html": "וַיֹּ֕אמֶר כִּ֚י אֶת־שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִיָּדִ֑י בַּעֲבוּר֙ תִּֽהְיֶה־לִּ֣י לְעֵדָ֔ה כִּ֥י חָפַ֖רְתִּי אֶת־הַבְּאֵ֥ר הַזֹּֽאת׃", "pasuk_en": "He [Avraham] said, Take these seven ewes from my hand so that it will be proמתוך for me, that I dug this well.", "rashi_he": "מְרִיבִים הָיוּ עָלֶיהָ רוֹעֵי אֲבִימֶלֶךְ וְאוֹמְרִים אֲנַחְנוּ חֲפַרְנוּהָ, אָמְרוּ בֵּינֵיהֶם כָּל מִי שֶׁיִּתְרָאֶה עַל הַבְּאֵר וְיַעֲלוּ הַמַּיִם לִקְרָאתוֹ, שֶׁלּוֹ הִיא, וְעָלוּ לִקְרָאת אַבְרָהָם:", "rashi_en": "<b>So that it will be proמתוך for me.</b> [לְעֵדָה is] the feminine form for “witness” as in “And the monument is [עֵדָה] witness.” <b>That I dug this well.</b> Avimelech’s shepherds argued about it [the well] and they said, “We dug it.” They agreed among themselves that whoever appears at the well and the waters will rise towards him then it [the well] is his. And they [the waters] rose towards Avraham.", "note": "", "points": [{"q": "Why did Avraham need proמתוך 'כי חפרתי את הבאר'?", "options": ["Avimelech's shepherds claimed they had dug it", "Avimelech wanted to buy the well", "The well had dried up"], "kasha": "Why does Avraham need a witness that he dug the well?", "answer": "Avimelech's shepherds were quarreling over it, saying 'We dug it.'"}, {"q": "How was the dispute over the well decided?", "options": ["The water rose toward whoever was its owner — Avraham", "Avimelech judged between them", "They drew lots at the well"], "kasha": "How could the true owner be shown?", "answer": "They agreed: whoever appears at the well and the water rises toward him — it's his. The water rose toward Avraham."}]}, {"id": "21:33.1", "ch": 21, "v": 33, "n": 1, "dh": "אשל", "pasuk_html": "וַיִּטַּ֥ע <mark>אֶ֖שֶׁל</mark> בִּבְאֵ֣ר שָׁ֑בַע וַיִּ֨קְרָא־שָׁ֔ם בְּשֵׁ֥ם יְהֹוָ֖ה אֵ֥ל עוֹלָֽם׃", "pasuk_en": "Avraham planted an eishel [tree] in Beer Sheva, and there he proclaimed the Name Adonoy, Almighty מתוך the universe.", "rashi_he": "רַב וּשְׁמוּאֵל, חַד אֲמַר פַּרְדֵּס לְהָבִיא מִמֶּנוּ פֵּרוֹת לָאוֹרְחִים בַּסְּעוּדָה, וְחַד אֲמַר פֻּנְדָּק לְאַכְסַנְיָא וּבוֹ כָּל מִינֵי פֵּרוֹת. וּמָצִינוּ לְשׁוֹן נְטִיעָה בְּאֹהָלִים, שֶׁנֶּאֱמַר וְיִטַּע אָהֳלֵי אַפַּדְנוֹ (דניאל י\"א):", "rashi_en": "Rav and Shmuel [מתוךfer varying opinions]. One says that it was an orchard from which fruit was brought for the guests’ meals and the other one says a guest-house. which contained various kinds מתוך fruit. We find the term נְטִיעָה applied to tents, as it is said, “He will plant the tents מתוך his palace.”", "note": "", "points": [{"q": "'ויטע אשל' — what was the 'אשל' Avraham planted?", "options": ["An orchard or an inn — Rav and Shmuel argue", "A single shade tree for travelers", "A grove for avodah zarah"], "kasha": "'אשל' is an unclear word — what was it?", "answer": "Rav and Shmuel: one says an orchard to bring fruit for guests' meals; the other says an inn for lodging, with all kinds מתוך fruit."}, {"q": "How can 'ויטע' — planting — fit the opinion that the אשל was an inn?", "options": ["'Planting' is used for tents too: 'ויטע אהלי אפדנו'", "An inn always had trees planted around it", "'ויטע' here means 'built'"], "kasha": "You plant trees, not buildings.", "answer": "We find 'planting' used for tents: 'ויטע אהלי אפדנו' (Daniel 11)."}]}, {"id": "21:33.2", "ch": 21, "v": 33, "n": 2, "dh": "ויקרא שם וגו'", "pasuk_html": "וַיִּטַּ֥ע אֶ֖שֶׁל בִּבְאֵ֣ר שָׁ֑בַע וַיִּ֨קְרָא־שָׁ֔ם בְּשֵׁ֥ם יְהֹוָ֖ה אֵ֥ל עוֹלָֽם׃", "pasuk_en": "Avraham planted an eishel [tree] in Beer Sheva, and there he proclaimed the Name Adonoy, Almighty מתוך the universe.", "rashi_he": "עַל יְדֵי אוֹתוֹ אֵשֶׁל נִקְרָא שְׁמוֹ שֶׁל הַקָּבָּ\"ה אֱלוֹהַּ לְכָל הָעוֹלָם, לְאַחַר שֶׁאוֹכְלִים וְשׁוֹתִים אוֹמֵר לָהֶם בָּרְכוּ לְמִי שֶׁאֲכַלְתֶּם מִשֶּׁלּוֹ, סְבוּרִים אַתֶּם שֶׁמִּשֶּׁלִּי אֲכַלְתֶּם? מִשֶּׁל מִי שֶׁאָמָר וְהָיָה הָעוֹלָם אֲכַלְתֶּם (סוטה י'):", "rashi_en": "[I.e.,] by means מתוך that eishel the Name מתוך the Holy One was called “God” to the entire world; [for] after they [the guests] would eat and drink he [Avraham] would tell them, “Bless the One from Whose food you have eaten. You may think that you have eaten my food, [but, actually] from the One Who by His word brought the world into being, have you eaten.”", "note": "", "points": [{"q": "'ויקרא שם בשם ה' אל עולם' — how did the אשל make Hashem known?", "options": ["Through it Hashem was called God מתוך the whole world", "Avraham davened beneath it every day", "Hashem's Name was carved on it"], "kasha": "What does calling Hashem's Name have to do with the אשל?", "answer": "Through that אשל, Hashem's Name was called God for the whole world."}, {"q": "What did Avraham tell his guests after they ate and drank?", "options": ["Bless the One Whose food you ate — not mine", "Thank me for my generous hospitality", "Pay what you are able for the meal"], "kasha": "How exactly did feeding guests spread Hashem's Name?", "answer": "'Bless the One Whose food you ate. You think you ate mine? You ate from the One Who spoke and the world came into being' (Sotah)."}]}, {"id": "21:34.1", "ch": 21, "v": 34, "n": 1, "dh": "ימים רבים", "pasuk_html": "וַיָּ֧גׇר אַבְרָהָ֛ם בְּאֶ֥רֶץ פְּלִשְׁתִּ֖ים <mark>יָמִ֥ים רַבִּֽים׃</mark>&nbsp;{פ}", "pasuk_en": "Avraham lived in the land מתוך the Philistines for many days.", "rashi_he": "מְרֻבִּים עַל שֶׁל חֶבְרוֹן. בְּחֶבְרוֹן עָשָׂה כ\"ה שָׁנָה וְכָאן כ\"ו, שֶׁהֲרֵי בֶּן ע\"ה שָׁנָה הָיָה בְּצֵאתוֹ מֵחָרָן, אוֹתָהּ שָׁנָה וַיָבֹא וַיֵּשֶׁב בְּאֵלֹנֵי מַמְרֵא, שֶׁלֹּא מָצִינוּ קֹדֶם לָכֵן שֶׁנִּתְיַשֵּׁב אֶלָּא שָׁם, שֶׁבְּכָל מְקוֹמוֹתָיו הָיָה כְּאוֹרֵחַ חוֹנֶה וְנוֹסֵעַ וְהוֹלֵך, שֶׁנֶּאֱמַר וַיַּעֲבֹר אַבְרָם, וַיַּעְתֵּק מִשָּׁם, וַיְהִי רָעָב בָּאָרֶץ וַיֵּרֶד אַבְרָם מִצְרַיְמָה (בראשית י\"ב), וּבְמִצְרַיִם לֹא עָשָׂה אֶלָּא שְׁלֹשָׁה חֳדָשִׁים שֶׁהֲרֵי שְׁלָחוֹ פַרְעֹה מִיָּד, וַיֵּלֶךְ לְמַסָּעָיו עַד וַיָּבֹא וַיֵּשֶׁב בְּאֵלֹנֵי מַמְרֵא אֲשֶׁר בְּחֶבְרוֹן (שם י\"ג), שָׁם יָשַׁב עַד שֶׁנֶּהֱפְכָה סְדוֹם, מִיָּד וַיִּסַּע מִשָּׁם אַבְרָהָם מִפְּנֵי בוּשָׁה שֶׁל לוֹט וּבָא לְאֶרֶץ פְּלִשְׁתִּים, וּבֶן צ\"ט שָׁנָה הָיָה, שֶׁהֲרֵי בַשְּׁלִישִׁי לְמִילָתוֹ בָּאוּ אֶצְלוֹ הַמַּלְאָכִים, הֲרֵי כ\"ה שָׁנָה, וְכָאן כְּתִיב יָמִים רַבִּים, מְרֻבִּים עַל הָרִאשׁוֹנִים, וְלֹא בָא הַכָּתוּב לִסְתֹּם אֶלָּא לְפָרֵשׁ, וְאִם הָיוּ מְרֻבִּים עֲלֵיהֶם שְׁתֵּי שָׁנִים אוֹ יוֹתֵר הָיָה מְפָרְשָׁם, וְעַל כָּרְחֲךָ אֵינָם יְתֵרִים יוֹתֵר מִשָּׁנָה, הֲרֵי כ\"ו שָׁנָה; מִיָּד יָצָא מִשָּׁם וְחָזַר לְחֶבְרוֹן, וְאוֹתָהּ שָׁנָה קָדְמָה לִפְנֵי עֲקֵדָתוֹ שֶׁל יִצְחָק י\"ב שָׁנִים, בְּסֵדֶר עוֹלָם:", "rashi_en": "[His stay here lasted] longer than in Chevron. He spent 25 years in Chevron. and here [in Beer Sheva] 26 [years]. For he was seventy-five years old when he left Charan. That same year: “He came and settled in the Plains מתוך Mamrei.” For before this we do not find that he resided anywhere but there. Because in all his other places he was only a guest, stopping to rest, traveling, and moving on. As it is said: “Avram passed through,” “From there he moved,” “There was a famine in the land, [whereupon,] Avram went down to Egypt.” He spent only three months in Egypt for Pharaoh had sent him away. Immediately: “He continued on his travels” until: “He came and settled in the Plain מתוך Mamrei” where he stayed until Sedom was overturned. Immediately: “Avraham journeyed from there” because he was ashamed מתוך Lot, and arrived at the Land מתוך Plishtim [Philistines] when he was ninety-nine years old for on the third day the angels came to him. making it 25 years [since he left Charan]. And since it states here “many days,” [it means] more than the preceding days [in Chevron]. Scripture does not intend to be indefinite but, to be clear; and if [the “many days”] would be two or more years [rather than one] it would clearly have stated so. [Therefore,] you must admit that they did not exceed by more than one year, making it a total מתוך 26 years. He immediately left there and returned to Chevron. That year preceded the binding מתוך Yitzchok by twelve years. (From Seder Olam).", "note": "", "points": [{"q": "'ימים רבים' in Plishtim — many compared to what?", "options": ["Longer than his stay in Chevron: 26 years versus 25", "Longer than his stay in Charan", "Longer than all his years in Canaan"], "kasha": "'ימים רבים' is vague — how long, and many compared to what?", "answer": "More than in Chevron: in Chevron he spent 25 years, and here 26."}, {"q": "Why count Chevron from when Avraham was 75, not from other places he stayed?", "options": ["Elsewhere he was only a traveler passing through", "He bought land only in Chevron", "Hashem commanded him to settle there first"], "kasha": "Avraham was in other places first — why is Chevron his first settled home?", "answer": "He left Charan at 75 and that year settled in Elonei Mamre. Elsewhere he only camped and moved on ('ויעבר', 'ויעתק', 'וירד מצרימה'); Egypt was just three months."}, {"q": "When and why did Avraham leave Chevron for Plishtim?", "options": ["At 99, after Sedom's overturning, ashamed מתוך Lot", "At 100, after Yitzchak's birth", "At 86, after Yishmael's birth"], "kasha": "How do we know he spent 25 years in Chevron?", "answer": "He stayed until Sedom was overturned, then left at once out מתוך shame over Lot. He was 99 — the malachim came on the third day after his milah — making 25 years."}, {"q": "How do we know Avraham stayed in Plishtim exactly 26 years, not more?", "options": ["Had it been 2+ years more, the Torah would say so", "Seder Olam lists each year he lived there", "It was until Yitzchak's bar mitzvah"], "kasha": "'ימים רבים' only says 'more' — how much more?", "answer": "The posuk comes to clarify, not to be vague; if it were two or more years longer it would say so. So it is only one more year — 26."}, {"q": "Where did Avraham go next, and when was that relative to the Akeidah?", "options": ["Back to Chevron, twelve years before the Akeidah", "To Har HaMoriah, one year before the Akeidah", "To Charan, twelve years before the Akeidah"], "kasha": "Where does this place Avraham afterward?", "answer": "He then returned to Chevron, and that year was twelve years before the Akeidah (Seder Olam)."}]}, {"id": "22:1.1", "ch": 22, "v": 1, "n": 1, "dh": "אחר הדברים האלה", "pasuk_html": "וַיְהִ֗י <mark>אַחַר֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה</mark> וְהָ֣אֱלֹהִ֔ים נִסָּ֖ה אֶת־אַבְרָהָ֑ם וַיֹּ֣אמֶר אֵלָ֔יו אַבְרָהָ֖ם וַיֹּ֥אמֶר הִנֵּֽנִי׃", "pasuk_en": "After these events, Elohim tested Avraham and said to him, Avraham! and he [Avraham] said, Here I am.", "rashi_he": "יֵשׁ מֵרַבּוֹתֵינוּ אוֹמְרִים (סנהדרין פ\"ט) אַחַר דְּבָרָיו שֶׁל שָׂטָן, שֶׁהָיָה מְקַטְרֵג וְאוֹמֵר מִכָּל סְעוּדָה שֶׁעָשָׂה אַבְרָהָם לֹא הִקְרִיב לְפָנֶיךָ פַּר אֶחָד אוֹ אַיִל אֶחָד; אָמַר לוֹ כְּלוּם עָשָׂה אֶלָּא בִּשְׁבִיל בְּנוֹ, אִלּוּ הָיִיתִי אוֹמֵר לוֹ זְבַח אוֹתוֹ לְפָנַי לֹא הָיָה מְעַכֵּב; וְיֵ\"אֹ אַחַר דְּבָרָיו שֶׁל יִשְׁמָעֵאל, שֶׁהָיָה מִתְפָּאֵר עַל יִצְחָק שֶׁמָּל בֶּן י\"ג שָׁנָה וְלֹא מִחָה, אָמַר לוֹ יִצְחָק בְּאֵבֶר א' אַתָּה מְיָרְאֵנִי? אִלּוּ אָמַר לִי הַקָּבָּ\"ה זְבַח עַצְמְךָ לְפָנַי, לֹא הָיִיתִי מְעַכֵּב.", "rashi_en": "There are some Sages who say [that this event occurred:] “After the words מתוך Satan” who said accusingly, [to God], “From all the feasts that Avraham prepared, he did not מתוךfer to sacrifice to You a single bull or ram.” He [God] responded to him, “Does he do anything but for the sake מתוך his son? Yet, if I were to say to him, ‘Sacrifice him to Me,’ he would not refuse.” Other [Sages] say [that this refers to] “After the words מתוך Yishmael” who would boast to Yitzchok that he was circumcised when he was thirteen and מתוךfered no resistance. Yitzchok responded to him: “Do you intimidate me [with the loss] מתוך one limb? If God would tell me, ‘Sacrifice yourself to Me,’ I would not refuse.”", "note": "", "points": [{"q": "The Akeidah comes 'אחר הדברים האלה' — after these 'words.' According to the first opinion, whose words?", "options": ["The Satan's accusation against Avraham", "Avimelech's words at the covenant", "Sarah's words about Yishmael"], "kasha": "'אחר הדברים האלה' should point to something specific — what 'words' led to this test?", "answer": "After the Satan's words: he accused that from all Avraham's feasts he never מתוךfered Hashem a bull or ram. Hashem answered: he did it all for his son, yet if I told him to sacrifice him to Me, he wouldn't refuse."}, {"q": "Others say 'הדברים' were Yishmael's words to Yitzchak. What did Yishmael boast about?", "options": ["He had his milah at thirteen without protesting", "He was the firstborn son מתוך Avraham", "He was a better archer than Yitzchak"], "kasha": "A second view on whose 'words' prompted the test.", "answer": "Yishmael boasted he had his milah at thirteen and didn't protest. Yitzchak answered: you scare me with one limb? If Hashem told me to sacrifice myself to Him, I wouldn't refuse."}]}, {"id": "22:1.2", "ch": 22, "v": 1, "n": 2, "dh": "הנני", "pasuk_html": "וַיְהִ֗י אַחַר֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה וְהָ֣אֱלֹהִ֔ים נִסָּ֖ה אֶת־אַבְרָהָ֑ם וַיֹּ֣אמֶר אֵלָ֔יו אַבְרָהָ֖ם וַיֹּ֥אמֶר <mark>הִנֵּֽנִי׃</mark>", "pasuk_en": "After these events, Elohim tested Avraham and said to him, Avraham! and he [Avraham] said, Here I am.", "rashi_he": "כָּךְ הִיא עֲנִיָּתָם שֶׁל חֲסִידִים, לְשׁוֹן עֲנָוָה הוּא וּלְשׁוֹן זִמּוּן:", "rashi_en": "This is the response מתוך the pious— an expression מתוך humility and readiness.", "note": "", "points": [{"q": "Avraham answers Hashem 'הנני' — 'here I am.' What does this reply express?", "options": ["Humility and readiness — the way chassidim answer", "Surprise at being called suddenly", "That Avraham was hiding nearby"], "kasha": "Hashem knows where Avraham is — what does 'here I am' add?", "answer": "This is how chassidim answer: it is an expression מתוך humility and מתוך readiness."}]}, {"id": "22:2.1", "ch": 22, "v": 2, "n": 1, "dh": "קח נא", "pasuk_html": "וַיֹּ֡אמֶר קַח־נָ֠א אֶת־בִּנְךָ֨ אֶת־יְחִֽידְךָ֤ אֲשֶׁר־אָהַ֙בְתָּ֙ אֶת־יִצְחָ֔ק וְלֶ֨ךְ־לְךָ֔ אֶל־אֶ֖רֶץ הַמֹּרִיָּ֑ה וְהַעֲלֵ֤הוּ שָׁם֙ לְעֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽהָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "He said, Please take your son, your only one, who you love—Yitzchok—and go to the land מתוך Moriah. Sacrifice him as a burnt-מתוךfering on one מתוך the mountains which I will designate to you.", "rashi_he": "אֵין נָא אֶלָּא לְשׁוֹן בַּקָשָׁה, אָמַר לוֹ בְּבַקָּשָׁה מִמְּךָ, עֲמֹד לִי בְּזֶה הַנִּסָּיוֹן, שֶׁלֹּא יֹאמְרוּ הָרִאשׁוֹנוֹת לֹא הָיָה בָהֶן מָמָּשׁ:", "rashi_en": "נָא is an expression מתוך a request. He [God] said to him, “I plead with you, withstand this test so that it not be said that the first ones were not real [tests].”", "note": "", "points": [{"q": "Hashem says 'קח נא את בנך.' What does the word 'נא' add?", "options": ["It's a request — 'please'", "It means 'now,' immediately", "It means 'raw,' unprepared"], "kasha": "Hashem gives commands — why 'נא'?", "answer": "'נא' always means a request: Hashem said, 'I ask מתוך you, stand up for Me in this test.'"}, {"q": "Why would Hashem ask Avraham, 'please' withstand this test?", "options": ["So no one says the earlier tests meant nothing", "So Avraham wouldn't feel forced", "So Yitzchak would agree to go"], "kasha": "Why does it matter to Hashem that Avraham pass this particular test?", "answer": "So that people shouldn't say the earlier tests had no substance."}]}, {"id": "22:2.2", "ch": 22, "v": 2, "n": 2, "dh": "את בנך", "pasuk_html": "וַיֹּ֡אמֶר קַח־נָ֠א אֶת־בִּנְךָ֨ אֶת־יְחִֽידְךָ֤ אֲשֶׁר־אָהַ֙בְתָּ֙ אֶת־יִצְחָ֔ק וְלֶ֨ךְ־לְךָ֔ אֶל־אֶ֖רֶץ הַמֹּרִיָּ֑ה וְהַעֲלֵ֤הוּ שָׁם֙ לְעֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽהָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "He said, Please take your son, your only one, who you love—Yitzchok—and go to the land מתוך Moriah. Sacrifice him as a burnt-מתוךfering on one מתוך the mountains which I will designate to you.", "rashi_he": "אָמַר לוֹ שְׁנֵי בָנִים יֵשׁ לִי, אָמַר לוֹ אֶת יְחִידְךָ; אָמַר לוֹ זֶה יָחִיד לְאִמּוֹ וְזֶה יָחִיד לְאִמּוֹ, אָמַר לוֹ אֲשֶׁר אָהַבְתָּ; אָמַר לוֹ שְׁנֵיהֶם אֲנִי אוֹהֵב, אָמַר לוֹ אֶת יִצְחָק (סנהדרין פ\"ט). וְלָמָּה לֹא גִּלָּה לוֹ מִתְּחִלָּה? שֶׁלֹּא לְעַרְבְּבוֹ פִּתְאוֹם וְתָזוּחַ דַּעְתּוֹ עָלָיו וְתִטָּרֵף, וּכְדֵי לְחַבֵּב עָלָיו אֶת הַמִּצְוָה וְלִתֵּן לוֹ שָׂכָר עַל כָּל דִּבּוּר וְדִבּוּר:", "rashi_en": "He [Avraham] responded, “I have two sons.” He [God] said to him, “Your only one.” He responded, “This one is an only son to his mother and the other is an only son to his mother.” He said to him, “Who you love.” “I love them both,” he answered. Then, He said, “Yitzchok!” Why did He not immediately reveal [this] to him? So that He not confuse him suddenly, and become bewildered and deranged. And, also, to endear the mitzvah to him so that he may be rewarded for each and every expression.", "note": "", "points": [{"q": "Why does Hashem say 'את בנך את יחידך אשר אהבת את יצחק' instead מתוך simply 'Yitzchak'?", "options": ["It's a dialogue: Avraham kept asking which son", "To praise Yitzchak with many titles", "To remind Avraham מתוך Yishmael's sin"], "kasha": "So many descriptions — just say 'Yitzchak'!", "answer": "Avraham said 'I have two sons'; 'your only one.' 'Each is the only one מתוך his mother'; 'whom you love.' 'I love both'; 'Yitzchak.' (Sanhedrin)"}, {"q": "Why didn't Hashem name Yitzchak נכון away? First reason:", "options": ["Not to shock him suddenly and unsettle his mind", "Hashem hadn't decided yet which son", "To give Yishmael a chance to volunteer"], "kasha": "Hashem could have said 'Yitzchak' from the start.", "answer": "So as not to confuse him suddenly, which could make his mind reel and become unsettled."}, {"q": "רש״י gives a second reason for the step-by-step revealing. What is it?", "options": ["To endear the mitzvah and reward each phrase", "To test whether Avraham would argue", "To teach Avraham to love both sons"], "kasha": "Is there any benefit in the delay beyond protecting Avraham's mind?", "answer": "To make the mitzvah more beloved to him, and to give him reward for each and every phrase."}]}, {"id": "22:2.3", "ch": 22, "v": 2, "n": 3, "dh": "ארץ המוריה", "pasuk_html": "וַיֹּ֡אמֶר קַח־נָ֠א אֶת־בִּנְךָ֨ אֶת־יְחִֽידְךָ֤ אֲשֶׁר־אָהַ֙בְתָּ֙ אֶת־יִצְחָ֔ק וְלֶ֨ךְ־לְךָ֔ אֶל־אֶ֖רֶץ הַמֹּרִיָּ֑ה וְהַעֲלֵ֤הוּ שָׁם֙ לְעֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽהָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "He said, Please take your son, your only one, who you love—Yitzchok—and go to the land מתוך Moriah. Sacrifice him as a burnt-מתוךfering on one מתוך the mountains which I will designate to you.", "rashi_he": "יְרוּשָׁלַיִם, וְכֵן בְּדִבְרֵי הַיָּמִים לִבְנוֹת אֶת בֵּית ה' בִּירוּשָׁלִַם בְּהַר הַמּוֹרִיָּה (דברי הימים ב ג'). וְרַבּוֹתֵינוּ פֵּרְשׁוּ עַל שֵׁם שֶׁמִּשָּׁם הוֹרָאָה יוֹצְאָה לְיִשְׂרָאֵל. וְאֻנְקְלוֹס תִּרְגְּמוֹ עַל שֵׁם עֲבוֹדַת הַקְּטֹרֶת שֶׁיֵּשׁ בּוֹ מוֹר נֵרְדְּ וּשְׁאָר בְּשָׂמִים:", "rashi_en": "[Referring to] Yerushalayim. Similarly, in Divrei Hayamim [II, 3, 1] “To build the House מתוך God in Yerushalayim on Mount Moriah.” Our Rabbis explained [that it is so called] because it is from there [Torah] instruction goes forth to Israel. Onkelos’ translationis based on the incense service which contains myrrh, nard and other spices.", "note": "", "points": [{"q": "Where is 'ארץ המוריה'?", "options": ["Yerushalayim", "Near Beer Sheva", "In the land מתוך the Philistines"], "kasha": "'ארץ המוריה' — which place is this?", "answer": "Yerushalayim, as Divrei Hayamim says: 'to build Hashem's House in Yerushalayim on Har HaMoriah.'"}, {"q": "According to Chazal, why is the place called 'מוריה'?", "options": ["From there הוראה — instruction — goes out to Yisroel", "Because it is a very high mountain", "Because Avraham feared there"], "kasha": "What does the name 'מוריה' mean?", "answer": "Our Rabbis explained: it is named for the הוראה — teaching — that goes out from there to Yisroel."}, {"q": "How does Onkelos explain the name 'מוריה'?", "options": ["From the incense, which contains מור — myrrh", "From the many trees growing there", "From the word for 'fear'"], "kasha": "A second way to explain the name.", "answer": "Onkelos translates it after the ketores service there, which contains myrrh (מור), nard and other spices."}]}, {"id": "22:2.4", "ch": 22, "v": 2, "n": 4, "dh": "והעלהו", "pasuk_html": "וַיֹּ֡אמֶר קַח־נָ֠א אֶת־בִּנְךָ֨ אֶת־יְחִֽידְךָ֤ אֲשֶׁר־אָהַ֙בְתָּ֙ אֶת־יִצְחָ֔ק וְלֶ֨ךְ־לְךָ֔ אֶל־אֶ֖רֶץ הַמֹּרִיָּ֑ה <mark>וְהַעֲלֵ֤הוּ</mark> שָׁם֙ לְעֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽהָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "He said, Please take your son, your only one, who you love—Yitzchok—and go to the land מתוך Moriah. Sacrifice him as a burnt-מתוךfering on one מתוך the mountains which I will designate to you.", "rashi_he": "לֹא אָמַר לוֹ שְׁחָטֵהוּ, לְפִי שֶׁלֹּא הָיָה חָפֵץ הַקָּבָּ\"ה לְשָׁחֳטוֹ אֶלָּא לְהַעֲלֵהוּ לָהָר לַעֲשׂוֹתוֹ עוֹלָה, וּמִשֶּׁהֶעֱלָהוּ אָמַר לוֹ הוֹרִידֵהוּ:", "rashi_en": "He [God] did say to him, “Slaughter him!” because God did not wish him killed, but, only to be brought up the mountain to be made into an Olah-sacrifice. Once he brought him up He [God] said to him, “Bring him down.”.", "note": "", "points": [{"q": "Hashem says 'והעלהו' — 'bring him up' — rather than 'slaughter him.' Why?", "options": ["Hashem wanted him only brought up, not slaughtered", "Slaughter was understood without saying it", "Avraham wasn't allowed to do the shechitah"], "kasha": "If Yitzchak was to be an מתוךfering, why not say 'slaughter him'?", "answer": "Hashem didn't want him slaughtered, only brought up the mountain to make him an olah. Once Avraham brought him up, Hashem said, 'Take him down.'"}]}, {"id": "22:2.5", "ch": 22, "v": 2, "n": 5, "dh": "אחד ההרים", "pasuk_html": "וַיֹּ֡אמֶר קַח־נָ֠א אֶת־בִּנְךָ֨ אֶת־יְחִֽידְךָ֤ אֲשֶׁר־אָהַ֙בְתָּ֙ אֶת־יִצְחָ֔ק וְלֶ֨ךְ־לְךָ֔ אֶל־אֶ֖רֶץ הַמֹּרִיָּ֑ה וְהַעֲלֵ֤הוּ שָׁם֙ לְעֹלָ֔ה עַ֚ל <mark>אַחַ֣ד הֶֽהָרִ֔ים</mark> אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "He said, Please take your son, your only one, who you love—Yitzchok—and go to the land מתוך Moriah. Sacrifice him as a burnt-מתוךfering on one מתוך the mountains which I will designate to you.", "rashi_he": "הַקָּבָּ\"ה מַתְהֵא הַצַּדִּיקִים וְאַחַר כָּךְ מְגַלֶּה לָהֶם; וְכָל זֶה כְּדֵי לְהַרְבּוֹת שְׂכָרָן, וְכֵן אֶל הָאָרֶץ אֲשֶׁר אַרְאֶךָּ (בראשית י\"ב), וְכֵן בְּיוֹנָה וּקְרָא עָלֶיהָ אֶת הַקְּרִיאָה (יונה ג ב):", "rashi_en": "God perplexes the נכוןeous [at first]— and [only] afterwards reveals [his intention]. All this [is done] for the purpose מתוך increasing their reward. Similarly, “The land that I will show you” and, similarly, concerning Yonah: “Proclaim about it the proclamation.”", "note": "", "points": [{"q": "Hashem says 'on one מתוך the mountains I will tell you,' without naming it. Why keep it vague?", "options": ["To keep the tzaddik waiting, increasing his reward", "Hashem hadn't chosen the mountain yet", "So the servants wouldn't know"], "kasha": "Why not name the mountain נכון away?", "answer": "Hashem keeps tzaddikim in suspense and only afterwards reveals to them — all to increase their reward."}, {"q": "Where else does Hashem first leave something unrevealed, to be shown later?", "options": ["'The land I will show you' and Yonah's proclamation", "Noach's ark and the Mabul", "The tower מתוך Bavel"], "kasha": "Is this a pattern elsewhere in Tanach?", "answer": "'To the land that I will show you' (Lech Lecha), and with Yonah: 'proclaim upon it the proclamation' (Yonah 3)."}]}, {"id": "22:3.1", "ch": 22, "v": 3, "n": 1, "dh": "וישכם", "pasuk_html": "<mark>וַיַּשְׁכֵּ֨ם</mark> אַבְרָהָ֜ם בַּבֹּ֗קֶר וַֽיַּחֲבֹשׁ֙ אֶת־חֲמֹר֔וֹ וַיִּקַּ֞ח אֶת־שְׁנֵ֤י נְעָרָיו֙ אִתּ֔וֹ וְאֵ֖ת יִצְחָ֣ק בְּנ֑וֹ וַיְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַיָּ֣קׇם וַיֵּ֔לֶךְ אֶל־הַמָּק֖וֹם אֲשֶׁר־אָֽמַר־ל֥וֹ הָאֱלֹהִֽים׃", "pasuk_en": "Avraham awoke early in the morning, saddled his donkey, and took his two assistants with him, and also his son, Yitzchok. He split the wood מתוך the burnt-מתוךfering, rose, and went to the place that Elohim had designated to him.", "rashi_he": "נִזְדָּרֵז לַמִּצְוָה (פסחים ד'):", "rashi_en": "He was quick to fulfill the command.", "note": "", "points": [{"q": "'וישכם אברהם בבקר' — Avraham got up early. What does this show?", "options": ["He was eager to do the mitzvah", "He wanted to leave before Sarah awoke", "The journey had to start at dawn"], "kasha": "Why does the posuk tell us he got up early?", "answer": "He hurried to do the mitzvah (Pesachim)."}]}, {"id": "22:3.2", "ch": 22, "v": 3, "n": 2, "dh": "ויחבש", "pasuk_html": "וַיַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּבֹּ֗קֶר <mark>וַֽיַּחֲבֹשׁ֙</mark> אֶת־חֲמֹר֔וֹ וַיִּקַּ֞ח אֶת־שְׁנֵ֤י נְעָרָיו֙ אִתּ֔וֹ וְאֵ֖ת יִצְחָ֣ק בְּנ֑וֹ וַיְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַיָּ֣קׇם וַיֵּ֔לֶךְ אֶל־הַמָּק֖וֹם אֲשֶׁר־אָֽמַר־ל֥וֹ הָאֱלֹהִֽים׃", "pasuk_en": "Avraham awoke early in the morning, saddled his donkey, and took his two assistants with him, and also his son, Yitzchok. He split the wood מתוך the burnt-מתוךfering, rose, and went to the place that Elohim had designated to him.", "rashi_he": "הוּא בְעַצְמוֹ, וְלֹא צִוָּה לְאֶחָד מֵעֲבָדָיו, שֶׁהָאַהֲבָה מְקַלְקֶלֶת הַשּׁוּרָה:", "rashi_en": "He [did this] himself without commanding one מתוך his servants [to do so] because, “Love causes a disregard for propriety.”", "note": "", "points": [{"q": "'ויחבש את חמרו' — Avraham saddled his donkey. What is notable here?", "options": ["He did it himself — love overrides normal conduct", "His servants refused to help him", "The donkey was too wild for others"], "kasha": "A great man like Avraham had servants — why saddle the donkey himself?", "answer": "He did it himself and didn't order a servant, because love disregards normal conduct (אהבה מקלקלת השורה)."}]}, {"id": "22:3.3", "ch": 22, "v": 3, "n": 3, "dh": "את שני נעריו", "pasuk_html": "וַיַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּבֹּ֗קֶר וַֽיַּחֲבֹשׁ֙ אֶת־חֲמֹר֔וֹ וַיִּקַּ֞ח אֶת־שְׁנֵ֤י נְעָרָיו֙ אִתּ֔וֹ וְאֵ֖ת יִצְחָ֣ק בְּנ֑וֹ וַיְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַיָּ֣קׇם וַיֵּ֔לֶךְ אֶל־הַמָּק֖וֹם אֲשֶׁר־אָֽמַר־ל֥וֹ הָאֱלֹהִֽים׃", "pasuk_en": "Avraham awoke early in the morning, saddled his donkey, and took his two assistants with him, and also his son, Yitzchok. He split the wood מתוך the burnt-מתוךfering, rose, and went to the place that Elohim had designated to him.", "rashi_he": "יִשְׁמָעֵאל וֶאֱלִיעֶזֶר, שֶׁאֵין אָדָם חָשׁוּ
