רְזֶל חַד בְּמְיֻוחָד"], "kasha": "מה פירוש \"המאכלת\" ומה הקשר בין השם הזה לסכין?", "answer": "זו סכין, ונקראת כך כי היא אוכלת את הבשר, כמו \"וחרבי תאכל בשר\", וגם כי היא מכשירה בשר לאכילה.", "kp": ["על שם שאוכלת את הבשר", "ושמכשרת בשר לאכילה"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי, מַה מְיֻוחָד בְּשֵׁם \"מַאֲכֶלֶת\" שֶׁל סַכִּין הָעֲקֵידָה?", "options": ["יִשְׂרָאֵל אוֹכְלִים אֶת שְׂכַר מַעֲשֵׂה הָעֲקֵידָה", "בָּהּ נִשְׁחַט הָאַיִל וְנֶאֱכַל בְּשָׂרוֹ", "בָּהּ חָתַךְ אַבְרָהָם לֶחֶם אַחֲרֵי הָעֲקֵידָה"], "kasha": "מדוע נקראת הסכין הזו דווקא בשם \"המאכלת\"?", "answer": "היא נקראת מאכלת כי ישראל אוכלים את מתן שכרה של העקידה.", "kp": ["שישראל אוכלים מתן שכרה"]}]}, {"id": "22:6.2", "ch": 22, "v": 6, "n": 2, "dh": "וילכו שניהם יחדו", "pasuk_html": "וַיִּקַּ֨ח אַבְרָהָ֜ם אֶת־עֲצֵ֣י הָעֹלָ֗ה וַיָּ֙שֶׂם֙ עַל־יִצְחָ֣ק בְּנ֔וֹ וַיִּקַּ֣ח בְּיָד֔וֹ אֶת־הָאֵ֖שׁ וְאֶת־הַֽמַּאֲכֶ֑לֶת <mark>וַיֵּלְכ֥וּ שְׁנֵיהֶ֖ם יַחְדָּֽו׃</mark>", "pasuk_en": "וַיִּקַּח אַבְרָהָם אֶת־עֲצֵי הָעֹלָה וַיָּשֶׂם עַל־יִצְחָק בְּנוֹ וַיִּקַּח בְּיָדוֹ אֶת־הָאֵשׁ וְאֶת־הַמַּאֲכֶלֶת וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו׃", "rashi_he": "וילכו שניהם יחדו. אַבְרָהָם שֶׁהָיָה יוֹדֵעַ שֶׁהוֹלֵךְ לִשְׁחֹט אֶת בְּנוֹ הָיָה הוֹלֵךְ בְּרָצוֹן וְשִׂמְחָה כְּיִצְחָק, שֶׁלֹּא הָיָה מַרְגִּישׁ בַּדָּבָר:", "rashi_en": "אף שאברהם ידע שהוא הולך לשחוט את בנו, הוא הלך ברצון ובשמחה בדיוק כמו יצחק, שלא ידע דבר.", "note": "", "points": [{"q": "מַה הַחִידּוּשׁ בְּ\"וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו\" כָּאן?", "options": ["אַבְרָהָם הָלַךְ בְּשִׂמְחָה כְּיִצְחָק, אַף שֶׁיָּדַע הַכֹּל", "שְׁנֵיהֶם הָלְכוּ צְמוּדִים כְּדֵי לֹא לָלֶכֶת לְאִיבּוּד", "יִצְחָק כְּבָר יָדַע שֶׁהוּא הוֹלֵךְ לְהִישָּׁחֵט"], "kasha": "ברור שהלכו יחד, ולמה הפסוק צריך לומר זאת?", "answer": "אברהם, שידע שהוא הולך לשחוט את בנו, הלך ברצון ובשמחה כמו יצחק, שלא הרגיש בדבר.", "kp": ["היה הולך ברצון ושמחה כיצחק", "שלא היה מרגיש בדבר"]}]}, {"id": "22:8.1", "ch": 22, "v": 8, "n": 1, "dh": "יראה לו השה", "pasuk_html": "וַיֹּ֙אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים <mark>יִרְאֶה־לּ֥וֹ הַשֶּׂ֛ה</mark> לְעֹלָ֖ה בְּנִ֑י וַיֵּלְכ֥וּ שְׁנֵיהֶ֖ם יַחְדָּֽו׃", "pasuk_en": "וַיֹּאמֶר אַבְרָהָם אֱלֹהִים יִרְאֶה־לּוֹ הַשֶּׂה לְעֹלָה בְּנִי וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו׃", "rashi_he": "יראה לו השה. כְּלוֹמַר יִרְאֶה וְיִבְחַר לוֹ הַשֶּׂה, וְאִם אֵין שֶׂה, לעולה בני. וְאַף עַל פִּי שֶׁהֵבִין יִצְחָק שֶׁהוּא הוֹלֵךְ לְהִשָּׁחֵט,", "rashi_en": "אברהם ענה ליצחק: ה' יבחר לו שה, ואם לא יהיה שה, אתה בני תהיה העולה. מכאן הבין יצחק שהוא הולך להישחט.", "note": "", "points": [{"q": "מַה כַּווָּנַת אַבְרָהָם בִּתְשׁוּבָתוֹ \"יִרְאֶהלּוֹ הַשֶּׂה לְעֹלָה בְּנִי\"?", "options": ["ה' יִבְחַר שֶׂה, וְאִם אֵין שֶׂה, בְּנִי הוּא הָעֹולָה", "ה' כְּבָר הֵכִין שֶׂה שֶׁמְּחַכֶּה בְּרֹאשׁ הָהָר", "בְּנִי, אַתָּה תִּבְחַר אֶת הַשֶּׂה לָעֹולָה"], "kasha": "תשובת אברהם נשמעת סתומה, ולא ברור מה פירוש \"לעלה בני\".", "answer": "כלומר ה' יראה ויבחר לו את השה, ואם אין שה, בני הוא העולה.", "kp": ["יראה ויבחר לו השה", "ואם אין שה, לעולה בני"]}]}, {"id": "22:8.2", "ch": 22, "v": 8, "n": 2, "dh": "וילכו שניהם יחדו", "pasuk_html": "וַיֹּ֙אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים יִרְאֶה־לּ֥וֹ הַשֶּׂ֛ה לְעֹלָ֖ה בְּנִ֑י <mark>וַיֵּלְכ֥וּ שְׁנֵיהֶ֖ם יַחְדָּֽו׃</mark>", "pasuk_en": "וַיֹּאמֶר אַבְרָהָם אֱלֹהִים יִרְאֶה־לּוֹ הַשֶּׂה לְעֹלָה בְּנִי וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו׃", "rashi_he": "וילכו שניהם יחדו. בְּלֵב שָׁוֶה:", "rashi_en": "אף שיצחק הבין עכשיו שהוא הולך להישחט, הם המשיכו ללכת יחד בלב שווה.", "note": "", "points": [{"q": "מַה מְלַמֵּד \"וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו\" בַּפַּעַם הַשְּׁנִיָּיה?", "options": ["אַף שֶׁיִּצְחָק הֵבִין שֶׁייִּשָּׁחֵט, הָלְכוּ בְּלֵב שָׁוֶוה", "שֶׁהִמְשִׁיכוּ לָלֶכֶת בְּלִי לְדַבֵּר זֶה עִם זֶה", "שֶׁיִּצְחָק הִתְחִיל לָלֶכֶת לִפְנֵי אָבִיו"], "kasha": "הפסוק כבר אמר קודם \"וילכו שניהם יחדו\", ומדוע הוא חוזר על כך?", "answer": "אף על פי שיצחק הבין שהוא הולך להישחט, הלכו שניהם יחד בלב שווה.", "kp": ["בלב שוה"]}]}, {"id": "22:9.1", "ch": 22, "v": 9, "n": 1, "dh": "ויעקד", "pasuk_html": "וַיָּבֹ֗אוּ אֶֽל־הַמָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר־ל֣וֹ הָאֱלֹהִים֒ וַיִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת־הַמִּזְבֵּ֔חַ וַֽיַּעֲרֹ֖ךְ אֶת־הָעֵצִ֑ים <mark>וַֽיַּעֲקֹד֙</mark> אֶת־יִצְחָ֣ק בְּנ֔וֹ וַיָּ֤שֶׂם אֹתוֹ֙ עַל־הַמִּזְבֵּ֔חַ מִמַּ֖עַל לָעֵצִֽים׃", "pasuk_en": "וַיָּבֹאוּ אֶל־הַמָּקוֹם אֲשֶׁר אָמַר־לוֹ הָאֱלֹהִים וַיִּבֶן שָׁם אַבְרָהָם אֶת־הַמִּזְבֵּחַ וַיַּעֲרֹךְ אֶת־הָעֵצִים וַיַּעֲקֹד אֶת־יִצְחָק בְּנוֹ וַיָּשֶׂם אֹתוֹ עַל־הַמִּזְבֵּחַ מִמַּעַל לָעֵצִים׃", "rashi_he": "ויעקד. יָדָיו וְרַגְלָיו מֵאֲחוֹרָיו; הַיָּדַיִם וְרַגְלַיִם בְּיַחַד הִיא עֲקִידָה (שבת נ\"ד), וְהוּא לְשׁוֹן עֲקֻדִּים, שֶׁהָיוּ קַרְסוּלֵיהֶם לְבָנִים, מָקוֹם שֶׁעוֹקְדִין אוֹתָן בּוֹ הָיָה נִכָּר:", "rashi_en": "\"ויעקד\" פירושו שקשר את ידיו ורגליו של יצחק יחד מאחוריו. זו העקידה, ומכאן גם \"עקדים\", שהיה ניכר בהם מקום הקשירה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"וַיַּעֲקֹד\" בַּפָּסוּק?", "options": ["קָשַׁר אֶת יָדָיו וְרַגְלָיו יַחַד מֵאַחֲורָיו", "קָשַׁר אֶת יָדָיו בִּלְבַד לִפְנֵי גוּפוֹ", "הִשְׁכִּיב אוֹתוֹ עַל הַמִּזְבֵּחַ בְּלִי לִקְשׁוֹר"], "kasha": "מה פירוש המילה \"ויעקד\", ובמה היא שונה מקשירה רגילה?", "answer": "קשר את ידיו ורגליו מאחוריו, כי קשירת ידיים ורגליים יחד היא עקידה.", "kp": ["ידיו ורגליו מאחוריו", "הידים ורגלים ביחד היא עקידה"]}]}, {"id": "22:11.1", "ch": 22, "v": 11, "n": 1, "dh": "אברהם אברהם", "pasuk_html": "וַיִּקְרָ֨א אֵלָ֜יו מַלְאַ֤ךְ יְהוָה֙ מִן־הַשָּׁמַ֔יִם וַיֹּ֖אמֶר <mark>אַבְרָהָ֣ם ׀ אַבְרָהָ֑ם</mark> וַיֹּ֖אמֶר הִנֵּֽנִי׃", "pasuk_en": "וַיִּקְרָא אֵלָיו מַלְאַךְ יְהוָה מִן־הַשָּׁמַיִם וַיֹּאמֶר אַבְרָהָם אַבְרָהָם וַיֹּאמֶר הִנֵּנִי׃", "rashi_he": "אברהם אברהם. לְשׁוֹן חִבָּה הוּא, שֶׁכּוֹפֵל אֶת שְׁמוֹ:", "rashi_en": "המלאך קרא לאברהם פעמיים בשמו, וכפילות השם היא לשון של חיבה.", "note": "", "points": [{"q": "מַדּוּעַ קָרָא הַמַּלְאָךְ \"אַבְרָהָם\" פַּעֲמַיִים?", "options": ["כֶּפֶל הַשֵּׁם הוּא בִּיטּוּי שֶׁל חִיבָּה", "כִּי אַבְרָהָם לֹא שָׁמַע בַּפַּעַם הָרִאשׁוֹנָה", "כְּדֵי לְהַזְהִיר אוֹתוֹ בְּקוֹל חָזָק וּבְכַעַס"], "kasha": "למה חזר המלאך על שמו של אברהם פעמיים?", "answer": "זו לשון חיבה, שכופל את שמו.", "kp": ["לשון חבה הוא", "שכופל את שמו"]}]}, {"id": "22:12.1", "ch": 22, "v": 12, "n": 1, "dh": "אל תשלח", "pasuk_html": "וַיֹּ֗אמֶר <mark>אַל־תִּשְׁלַ֤ח</mark> יָֽדְךָ֙ אֶל־הַנַּ֔עַר וְאַל־תַּ֥עַשׂ ל֖וֹ מְא֑וּמָּה כִּ֣י ׀ עַתָּ֣ה יָדַ֗עְתִּי כִּֽי־יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְלֹ֥א חָשַׂ֛כְתָּ אֶת־בִּנְךָ֥ אֶת־יְחִידְךָ֖ מִמֶּֽנִּי׃", "pasuk_en": "וַיֹּאמֶר אַל־תִּשְׁלַח יָדְךָ אֶל־הַנַּעַר וְאַל־תַּעַשׂ לוֹ מְאוּמָּה כִּי עַתָּה יָדַעְתִּי כִּי־יְרֵא אֱלֹהִים אַתָּה וְלֹא חָשַׂכְתָּ אֶת־בִּנְךָ אֶת־יְחִידְךָ מִמֶּנִּי׃", "rashi_he": "אל תשלח. לִשְׁחֹט; אָמַר לוֹ אִם כֵּן לְחִנָּם בָּאתִי לְכָאן, אֶעֱשֶׂה בּוֹ חַבָּלָה וְאוֹצִיא מִמֶּנוּ מְעַט דָּם, אָמַר לוֹ אל תעש לו מאומה – אַל תַּעַשׂ בּוֹ מוּם:", "rashi_en": "\"אל תשלח\" הכוונה לשחוט. אברהם אמר: אם כן באתי לחינם, אעשה בו פצע ואוציא ממנו מעט דם. ענה לו: אל תעשה לו שום דבר, אפילו לא מום.", "note": "", "points": [{"q": "מַה בָּא לְהוֹסִיף \"מְאוּמָּה\" אַחֲרֵי הָאִיסּוּר לִשְׁחֹוט אֶת יִצְחָק?", "options": ["שֶׁלֹּא יַעֲשֶׂה בְּיִצְחָק אֲפִילוּ פֶּצַע אוֹ מוּם", "שֶׁלֹּא יִשְׁחַט גַּם אֶת הָאַיִל בִּמְקוֹמוֹ", "שֶׁלֹּא יְסַפֵּר לְאִישׁ עַל הָעֲקֵידָה"], "kasha": "אם כבר נאמר לו לא לשלוח יד, למה צריך להוסיף שלא יעשה לו מאומה?", "answer": "אברהם רצה לפחות לפצוע את יצחק ולהוציא ממנו מעט דם כדי שלא יבוא לחינם, וה' אמר לו לא לעשות בו שום מום.", "kp": ["ואוציא ממנו מעט דם", "אל תעש בו מום"]}]}, {"id": "22:12.2", "ch": 22, "v": 12, "n": 2, "dh": "כי עתה ידעתי", "pasuk_html": "וַיֹּ֗אמֶר אַל־תִּשְׁלַ֤ח יָֽדְךָ֙ אֶל־הַנַּ֔עַר וְאַל־תַּ֥עַשׂ ל֖וֹ מְא֑וּמָּה <mark>כִּ֣י ׀ עַתָּ֣ה יָדַ֗עְתִּי</mark> כִּֽי־יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְלֹ֥א חָשַׂ֛כְתָּ אֶת־בִּנְךָ֥ אֶת־יְחִידְךָ֖ מִמֶּֽנִּי׃", "pasuk_en": "וַיֹּאמֶר אַל־תִּשְׁלַח יָדְךָ אֶל־הַנַּעַר וְאַל־תַּעַשׂ לוֹ מְאוּמָּה כִּי עַתָּה יָדַעְתִּי כִּי־יְרֵא אֱלֹהִים אַתָּה וְלֹא חָשַׂכְתָּ אֶת־בִּנְךָ אֶת־יְחִידְךָ מִמֶּנִּי׃", "rashi_he": "כי עתה ידעתי. אָמַר רַבִּי אַבָּא, אָמַר לוֹ אַבְרָהָם אֲפָרֵשׁ לְפָנֶיךָ אֶת שִׂיחָתִי, אֶתְמוֹל אָמַרְתָּ לִי כִּי בְיִצְחָק יִקָּרֵא לְךָ זָרַע, וְחָזַרְתָּ וְאָמַרְתָּ קַח נָא אֶת בִּנְךָ, עַכְשָׁו אַתָּה אוֹמֵר אַל תִּשְׁלַח יָדְךָ אֶל הַנַּעַר? אָמַר לוֹ הַקָּבָּ\"ה, לֹא אֲחַלֵּל בְּרִיתִי וּמוֹצָא שְׂפָתַי לֹא אֲשַׁנֶּה (תהילים פ\"ט); כְּשֶׁאָמַרְתִּי לְךָ \"קַח\", מוֹצָא שְׂפָתַי לֹא אֲשַׁנֶּה – לֹא אָמַרְתִּי לְךָ שְׁחָטֵהוּ אֶלָּא הַעֲלֵהוּ, אַסַּקְתֵּיהּ, אַחְתֵּיהּ.", "rashi_en": "אברהם שאל את ה': אמרת לי שביצחק יהיה לי זרע, אחר כך ציווית להקריב אותו, ועכשיו אתה אומר לא לגעת בו? ענה לו ה': אני לא משנה את דברי, לא אמרתי לך לשחוט אותו אלא רק להעלות אותו, ועכשיו שהעלית אותו, הורד אותו.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ, אֵיךְ עָנָה ה' לִטְעֲנַת אַבְרָהָם שֶׁדְּבָרָיו סוֹתְרִים זֶה אֶת זֶה?", "options": ["לֹא צִיוָּה לִשְׁחוֹט אֶלָּא רַק לְהַעֲלוֹת וּלְהוֹרִיד", "ה' שִׁינָּה אֶת דַּעְתּוֹ בִּגְלַל תְּפִילַּת אַבְרָהָם", "הַשְּׁחִיטָה נִדְחֲתָה לִזְמַן אַחֵר בֶּעָתִיד"], "kasha": "נראה שה' חזר בו מציוויו, והרי הוא אינו משנה את דבריו.", "answer": "ה' אמר שאינו משנה את מוצא שפתיו: הוא לא אמר לאברהם לשחוט את יצחק אלא להעלות אותו, ועכשיו שהעלה אותו, יוריד אותו.", "kp": ["לא אמרתי לך שחטהו אלא העלהו", "אסקתיה, אחתיה"]}]}, {"id": "22:12.3", "ch": 22, "v": 12, "n": 3, "dh": "כי עתה ידעתי", "pasuk_html": "וַיֹּ֗אמֶר אַל־תִּשְׁלַ֤ח יָֽדְךָ֙ אֶל־הַנַּ֔עַר וְאַל־תַּ֥עַשׂ ל֖וֹ מְא֑וּמָּה <mark>כִּ֣י ׀ עַתָּ֣ה יָדַ֗עְתִּי</mark> כִּֽי־יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְלֹ֥א חָשַׂ֛כְתָּ אֶת־בִּנְךָ֥ אֶת־יְחִידְךָ֖ מִמֶּֽנִּי׃", "pasuk_en": "וַיֹּאמֶר אַל־תִּשְׁלַח יָדְךָ אֶל־הַנַּעַר וְאַל־תַּעַשׂ לוֹ מְאוּמָּה כִּי עַתָּה יָדַעְתִּי כִּי־יְרֵא אֱלֹהִים אַתָּה וְלֹא חָשַׂכְתָּ אֶת־בִּנְךָ אֶת־יְחִידְךָ מִמֶּנִּי׃", "rashi_he": "כי עתה ידעתי. מֵעַתָּה יֵשׁ לִי מַה לְּהָשִׁיב לַשָּׂטָן וְלָאֻמּוֹת הַתְּמֵהִים מַה הִיא חִבָּתִי אֶצְלְךָ; יֵשׁ לִי פִּתְחוֹן פֶּה עַכְשָׁו, שֶׁרוֹאִים כִּי יְרֵא אֱלֹהִים אַתָּה:", "rashi_en": "\"עתה ידעתי\" פירושו שמעכשיו יש לה' תשובה לשטן ולאומות שתמהים על חיבתו לאברהם, כי הכל רואים שאברהם ירא אלהים.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"יָדַעְתִּי\" כָּאן, וַהֲרֵי ה' יוֹדֵעַ הַכֹּל מֵרֹאשׁ?", "options": ["עַכְשָׁיו יֵשׁ לַה' תְּשׁוּבָה לַשָּׂטָן וְלָאֻומּוֹת", "עַכְשָׁיו נוֹדַע לַה' לָרִאשׁוֹנָה שֶׁאַבְרָהָם יָרֵא", "עַכְשָׁיו יָדַע יִצְחָק שֶׁאָבִיו יְרֵא אֱלֹהִים"], "kasha": "איך אומר ה' \"עתה ידעתי\", כאילו לא ידע קודם?", "answer": "מעתה יש לה' מה להשיב לשטן ולאומות שתמהים על חיבתו לאברהם, כי הם רואים שהוא ירא אלהים.", "kp": ["יש לי מה להשיב לשטן ולאמות", "שרואים כי ירא אלהים אתה"]}]}, {"id": "22:13.1", "ch": 22, "v": 13, "n": 1, "dh": "והנה איל", "pasuk_html": "וַיִּשָּׂ֨א אַבְרָהָ֜ם אֶת־עֵינָ֗יו וַיַּרְא֙ <mark>וְהִנֵּה־אַ֔יִל</mark> אַחַ֕ר נֶאֱחַ֥ז בַּסְּבַ֖ךְ בְּקַרְנָ֑יו וַיֵּ֤לֶךְ אַבְרָהָם֙ וַיִּקַּ֣ח אֶת־הָאַ֔יִל וַיַּעֲלֵ֥הוּ לְעֹלָ֖ה תַּ֥חַת בְּנֽוֹ׃", "pasuk_en": "וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַיִל אַחַר נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו וַיֵּלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַיִל וַיַּעֲלֵהוּ לְעֹלָה תַּחַת בְּנוֹ׃", "rashi_he": "והנה איל. מוּכָן הָיָה לְכָךְ מִשֵּׁשֶׁת יְמֵי בְרֵאשִׁית:", "rashi_en": "האיל שמצא אברהם היה מוכן לתפקיד הזה כבר מששת ימי בראשית.", "note": "", "points": [{"q": "מֵאַיִן הִגִּיעַ הָאַיִל שֶׁמָּצָא אַבְרָהָם, לְפִי רַשִׁ\"י?", "options": ["הוּא הוּכַן לְכָךְ מִשֵּׁשֶׁת יְמֵי בְּרֵאשִׁית", "הוּא בָּרַח מֵעֵדֶר שֶׁל רוֹעִים סְמוּכִים", "הַמַּלְאָךְ הֵבִיא אוֹתוֹ בְּאוֹתוֹ רֶגַע"], "kasha": "המילה \"והנה\" מראה שהאיל הופיע באופן מפתיע, ומאין בא?", "answer": "האיל היה מוכן לכך מששת ימי בראשית.", "kp": ["מוכן היה לכך מששת ימי בראשית"]}]}, {"id": "22:13.2", "ch": 22, "v": 13, "n": 2, "dh": "אחר", "pasuk_html": "וַיִּשָּׂ֨א אַבְרָהָ֜ם אֶת־עֵינָ֗יו וַיַּרְא֙ וְהִנֵּה־אַ֔יִל <mark>אַחַ֕ר</mark> נֶאֱחַ֥ז בַּסְּבַ֖ךְ בְּקַרְנָ֑יו וַיֵּ֤לֶךְ אַבְרָהָם֙ וַיִּקַּ֣ח אֶת־הָאַ֔יִל וַיַּעֲלֵ֥הוּ לְעֹלָ֖ה תַּ֥חַת בְּנֽוֹ׃", "pasuk_en": "וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַיִל אַחַר נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו וַיֵּלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַיִל וַיַּעֲלֵהוּ לְעֹלָה תַּחַת בְּנוֹ׃", "rashi_he": "אחר. אַחֲרֵי שֶׁאָמַר לוֹ הַמַּלְאָךְ אַל תִּשְׁלַח יָדְךָ, רָאָהוּ כְּשֶׁהוּא נֶאֱחָז, וְהוּא שֶׁמְּתַרְגְּמִינָן וּזְקַף אַבְרָהָם יַת עֵינוֹהִי בָּתַר אִלֵּין:", "rashi_en": "\"אחר\" פירושו אחרי שהמלאך אמר לו \"אל תשלח ידך\", אז ראה אברהם את האיל נאחז. כך תרגם אונקלוס \"בתר אלין\".", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"אַחַר\" בַּפָּסוּק?", "options": ["אַחֲרֵי דִּבְרֵי הַמַּלְאָךְ רָאָה אֶת הָאַיִל נֶאֱחַז", "אַיִל אַחֵר, שׁוֹנֶה מֵאַיִל רָגִיל", "הָאַיִל עָמַד מֵאַחֲורֵי אַבְרָהָם"], "kasha": "המילה \"אחר\" לא מובנת: אחרי מה, או איל אחר ממה?", "answer": "אחרי שהמלאך אמר לו \"אל תשלח ידך\" ראה אברהם את האיל נאחז, וכך תרגם אונקלוס \"בתר אלין\".", "kp": ["אחרי שאמר לו המלאך", "בתר אלין"]}]}, {"id": "22:13.3", "ch": 22, "v": 13, "n": 3, "dh": "בסבך", "pasuk_html": "וַיִּשָּׂ֨א אַבְרָהָ֜ם אֶת־עֵינָ֗יו וַיַּרְא֙ וְהִנֵּה־אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז <mark>בַּסְּבַ֖ךְ</mark> בְּקַרְנָ֑יו וַיֵּ֤לֶךְ אַבְרָהָם֙ וַיִּקַּ֣ח אֶת־הָאַ֔יִל וַיַּעֲלֵ֥הוּ לְעֹלָ֖ה תַּ֥חַת בְּנֽוֹ׃", "pasuk_en": "וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַיִל אַחַר נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו וַיֵּלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַיִל וַיַּעֲלֵהוּ לְעֹלָה תַּחַת בְּנוֹ׃", "rashi_he": "בסבך. אִילָן:", "rashi_en": "\"סבך\" הוא אילן, עץ.", "note": "", "points": [{"q": "מַהוּ הַ\"סְבַךְ\" שֶׁבּוֹ נֶאֱחַז הָאַיִל?", "options": ["עֵץ שֶׁהָאַיִל נִתְפַּס בַּעֲנָפָיו", "בּוֹר מַיִם עָמֹוק לְיַד הָהָר", "גָּדֵר אֲבָנִים שֶׁל רוֹעִים"], "kasha": "מה פירוש המילה \"סבך\"?", "answer": "סבך הוא אילן.", "kp": ["בסבך. אילן"]}]}, {"id": "22:13.4", "ch": 22, "v": 13, "n": 4, "dh": "בקרניו", "pasuk_html": "וַיִּשָּׂ֨א אַבְרָהָ֜ם אֶת־עֵינָ֗יו וַיַּרְא֙ וְהִנֵּה־אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּסְּבַ֖ךְ <mark>בְּקַרְנָ֑יו</mark> וַיֵּ֤לֶךְ אַבְרָהָם֙ וַיִּקַּ֣ח אֶת־הָאַ֔יִל וַיַּעֲלֵ֥הוּ לְעֹלָ֖ה תַּ֥חַת בְּנֽוֹ׃", "pasuk_en": "וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַיִל אַחַר נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו וַיֵּלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַיִל וַיַּעֲלֵהוּ לְעֹלָה תַּחַת בְּנוֹ׃", "rashi_he": "בקרניו. שֶׁהָיָה רָץ אֵצֶל אַבְרָהָם, וְהַשָּׂטָן סוֹבְכוֹ וּמְעַרְבְּבוֹ בָאִילָנוֹת:", "rashi_en": "האיל רץ לכיוון אברהם, והשטן סיבך אותו בין העצים כדי לעכב אותו, ולכן נאחז בקרניו.", "note": "", "points": [{"q": "מַדּוּעַ נֶאֱחַז הָאַיִל בְּקַרְנָיו בַּסְּבַךְ?", "options": ["הַשָּׂטָן סִיבֵּךְ אוֹתוֹ כְּשֶׁרָץ אֶל אַבְרָהָם", "הָאַיִל רָעָה בֵּין הָעֵצִים וְנִתְפַּס בְּמִקְרֶה", "אַבְרָהָם קָשַׁר אוֹתוֹ שָׁם בְּעַצְמוֹ"], "kasha": "למה מציין הפסוק שהאיל נאחז דווקא בקרניו?", "answer": "האיל רץ אל אברהם, והשטן סיבך ובלבל אותו בין העצים.", "kp": ["שהיה רץ אצל אברהם", "והשטן סובכו ומערבבו באילנות"]}]}, {"id": "22:13.5", "ch": 22, "v": 13, "n": 5, "dh": "תחת בנו", "pasuk_html": "וַיִּשָּׂ֨א אַבְרָהָ֜ם אֶת־עֵינָ֗יו וַיַּרְא֙ וְהִנֵּה־אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּסְּבַ֖ךְ בְּקַרְנָ֑יו וַיֵּ֤לֶךְ אַבְרָהָם֙ וַיִּקַּ֣ח אֶת־הָאַ֔יִל וַיַּעֲלֵ֥הוּ לְעֹלָ֖ה <mark>תַּ֥חַת בְּנֽוֹ׃</mark>", "pasuk_en": "וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַיִל אַחַר נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו וַיֵּלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַיִל וַיַּעֲלֵהוּ לְעֹלָה תַּחַת בְּנוֹ׃", "rashi_he": "תחת בנו. מֵאַחַר שֶׁכָּתוּב וַיַּעֲלֵהוּ לְעֹלָה, לֹא חָסֵר הַמִּקְרָא כְּלוּם, מַהוּ תַּחַת בְּנוֹ? עַל כָּל עֲבוֹדָה שֶׁעָשָׂה מִמֶּנּוּ הָיָה מִתְפַּלֵּל וְאוֹמֵר יְהִי רָצוֹן שֶׁתְּהֵא זוֹ כְּאִלּוּ הִיא עֲשׂוּיָה בִּבְנִי, כְּאִלּוּ בְּנִי שָׁחוּט, כְּאִלּוּ דָּמוֹ זָרוּק, כְּאִלּוּ הוּא מֻפְשָׁט, כְּאִלּוּ הוּא נִקְטָר וְנַעֲשֶׂה דֶּשֶׁן:", "rashi_en": "אחרי שנאמר \"ויעלהו לעלה\" אין צורך לומר \"תחת בנו\". אלא בכל עבודה שעשה באיל התפלל אברהם שתיחשב כאילו נעשתה בבנו: כאילו נשחט, נזרק דמו, הופשט ונשרף לאפר.", "note": "", "points": [{"q": "מַה בָּא לְלַמֵּד \"תַּחַת בְּנוֹ\", וַהֲרֵי כְּבָר נֶאֱמַר \"וַיַּעֲלֵהוּ לְעֹלָה\"?", "options": ["אַבְרָהָם הִתְפַּלֵּל שֶׁכָּל עֲבוֹדָה תֵּיחָשֵׁב כְּאִילּוּ נַעֲשֵׂתָה בִּבְנוֹ", "שֶׁהָאַיִל הוּקְרַב בְּדִיּוּק בַּמָּקוֹם שֶׁבּוֹ הָיָה יִצְחָק עָקוּד", "שֶׁיִּצְחָק עַצְמוֹ עָזַר לְאָבִיו לְהַקְרִיב אֶת הָאַיִל"], "kasha": "הפסוק שלם גם בלי \"תחת בנו\", ולמה נכתבו המילים האלה?", "answer": "על כל עבודה שעשה באיל התפלל אברהם שתהיה כאילו נעשתה בבנו, כאילו בנו שחוט, דמו זרוק, מופשט ונקטר לאפר.", "kp": ["מהו תחת בנו", "כאלו היא עשויה בבני"]}]}, {"id": "22:14.1", "ch": 22, "v": 14, "n": 1, "dh": "ה' יראה", "pasuk_html": "וַיִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם־הַמָּק֥וֹם הַה֖וּא <mark>יְהוָ֣ה ׀ יִרְאֶ֑ה</mark> אֲשֶׁר֙ יֵאָמֵ֣ר הַיּ֔וֹם בְּהַ֥ר יְהוָ֖ה יֵרָאֶֽה׃", "pasuk_en": "וַיִּקְרָא אַבְרָהָם שֵׁם־הַמָּקוֹם הַהוּא יְהוָה יִרְאֶה אֲשֶׁר יֵאָמֵר הַיּוֹם בְּהַר יְהוָה יֵרָאֶה׃", "rashi_he": "ה' יראה. פְּשׁוּטוֹ כְּתַרְגּוּמוֹ, ה' יִבְחַר וְיִרְאֶה לוֹ אֶת הַמָּקוֹם הַזֶּה לְהַשְׁרוֹת בּוֹ שְׁכִינָתוֹ וּלְהַקְרִיב כָּאן קָרְבָּנוֹת:", "rashi_en": "לפי הפשט, כתרגום אונקלוס, אברהם קרא למקום \"ה' יראה\", כלומר ה' יבחר במקום הזה להשרות בו את שכינתו ולהקריב בו קרבנות.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַשֵּׁם שֶׁנָּתַן אַבְרָהָם לַמָּקוֹם, לְפִי הַפְּשָׁט?", "options": ["ה' יִבְחַר בַּמָּקוֹם לְהַשְׁרוֹת בּוֹ שְׁכִינָה וּלְהַקְרִיב קָרְבָּנוֹת", "ה' רָאָה אֶת צַעֲרוֹ שֶׁל אַבְרָהָם בַּמָּקוֹם הַזֶּה", "כָּאן רָאָה אַבְרָהָם אֶת הַמַּלְאָךְ שֶׁדִּיבֵּר אֵלָיו"], "kasha": "מה פירוש השם \"יראה\" שנתן אברהם למקום?", "answer": "כתרגומו: ה' יבחר ויראה לו את המקום הזה להשרות בו שכינתו ולהקריב בו קרבנות.", "kp": ["יבחר ויראה לו את המקום", "להשרות בו שכינתו"]}]}, {"id": "22:14.2", "ch": 22, "v": 14, "n": 2, "dh": "אשר יאמר היום", "pasuk_html": "וַיִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם־הַמָּק֥וֹם הַה֖וּא יְהוָ֣ה ׀ יִרְאֶ֑ה <mark>אֲשֶׁר֙ יֵאָמֵ֣ר הַיּ֔וֹם</mark> בְּהַ֥ר יְהוָ֖ה יֵרָאֶֽה׃", "pasuk_en": "וַיִּקְרָא אַבְרָהָם שֵׁם־הַמָּקוֹם הַהוּא יְהוָה יִרְאֶה אֲשֶׁר יֵאָמֵר הַיּוֹם בְּהַר יְהוָה יֵרָאֶה׃", "rashi_he": "אשר יאמר היום. שֶׁיֹּאמְרוּ לִימֵי הַדּוֹרוֹת עָלָיו בְּהַר זֶה יֵרָאֶה הַקָּבָּ\"ה לְעַמּוֹ:", "rashi_en": "בדורות הבאים יאמרו על המקום הזה: בהר הזה ה' נראה לעמו.", "note": "", "points": [{"q": "מִי יֹאמַר \"בְּהַר יְהוָה יִרְאֶה\"?", "options": ["הַדּוֹרוֹת הַבָּאִים יֹאמְרוּ זֹאת עַל הָהָר", "אַבְרָהָם אָמַר זֹאת לִנְעָרָיו בְּאוֹתוֹ יוֹם", "יִצְחָק אָמַר זֹאת כְּשֶׁשָּׁב מִן הָהָר"], "kasha": "מי הוא האומר שעליו נאמר \"אשר יאמר היום\"?", "answer": "בדורות הבאים יאמרו על המקום: בהר הזה ה' נראה לעמו.", "kp": ["שיאמרו לימי הדורות עליו"]}]}, {"id": "22:14.3", "ch": 22, "v": 14, "n": 3, "dh": "היום", "pasuk_html": "וַיִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם־הַמָּק֥וֹם הַה֖וּא יְהוָ֣ה ׀ יִרְאֶ֑ה אֲשֶׁר֙ יֵאָמֵ֣ר <mark>הַיּ֔וֹם</mark> בְּהַ֥ר יְהוָ֖ה יֵרָאֶֽה׃", "pasuk_en": "וַיִּקְרָא אַבְרָהָם שֵׁם־הַמָּקוֹם הַהוּא יְהוָה יִרְאֶה אֲשֶׁר יֵאָמֵר הַיּוֹם בְּהַר יְהוָה יֵרָאֶה׃", "rashi_he": "היום. הַיָּמִים הָעֲתִידִין, כְּמוֹ עַד הַיּוֹם הַזֶּה שֶׁבְּכָל הַמִּקְרָא, שֶׁכָּל הַדּוֹרוֹת הַבָּאִים הַקּוֹרְאִים אֶת הַמִּקְרָא הַזֶּה אוֹמְרִים עַד הַיּוֹם הַזֶּה עַל הַיוֹם שֶׁעוֹמְדִים בּוֹ. וּמִ\"אַ ה' יִרְאֶה עֲקֵדָה זוֹ לִסְלֹחַ לְיִשְׂרָאֵל בְּכָל שָׁנָה וּלְהַצִּילָם מִן הַפֻּרְעָנוּת, כְּדֵי שֶׁיֵּאָמֵר הַיּוֹם הַזֶּה – בְּכָל הַדּוֹרוֹת הַבָּאִים – בְּהַר ה' יֵרָאֶה אֶפְרוֹ שֶׁל יִצְחָק צָבוּר וְעוֹמֵד לְכַפָּרָה:", "rashi_en": "\"היום\" פירושו הימים העתידים, כמו \"עד היום הזה\" בכל המקרא, שכל דור שקורא את הפסוק מתכוון ליום שלו. לפי המדרש, ה' יזכור את העקידה כדי לסלוח לישראל בכל שנה, ובהר ה' ייראה אפרו של יצחק צבור לכפרה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"הַיּוֹם\" בַּפָּסוּק?", "options": ["הַיָּמִים הָעֲתִידִים, יְמֵי הַדּוֹרוֹת שֶׁיִּקְרְאוּ אֶת הַפָּסוּק", "הַיּוֹם שֶׁבּוֹ נֶעֱקַד יִצְחָק בִּלְבַד", "יוֹם הַכִּיפּוּרִים שֶׁחָל בְּכָל שָׁנָה"], "kasha": "איך נאמר \"היום\" על מה שיאמרו בדורות הבאים?", "answer": "הכוונה לימים העתידים, כמו \"עד היום הזה\" בכל המקרא, שכל דור שקורא את הפסוק מתכוון ליום שבו הוא עומד.", "kp": ["הימים העתידין", "על היום שעומדים בו"]}, {"q": "לְפִי הַמִּדְרָשׁ, מַה יֵּרָאֶה ה' בָּהָר בְּכָל הַדּוֹרוֹת?", "options": ["אֶת אֶפְרוֹ שֶׁל יִצְחָק צָבוּר לְכַפָּרָה לְיִשְׂרָאֵל", "אֶת הַמִּזְבֵּחַ שֶׁבָּנָה אַבְרָהָם בְּרֹאשׁ הָהָר", "אֶת הָאַיִל שֶׁהוּקְרַב בִּמְקוֹם יִצְחָק"], "kasha": "מה יראה ה' בהר, ולמה זה חשוב לדורות?", "answer": "ה' יראה את העקידה כדי לסלוח לישראל בכל שנה ולהצילם מפורענות, ויראה את אפרו של יצחק צבור ועומד לכפרה.", "kp": ["לסלח לישראל בכל שנה", "אפרו של יצחק צבור ועומד לכפרה"]}]}, {"id": "22:17.1", "ch": 22, "v": 17, "n": 1, "dh": "ברך אברכך", "pasuk_html": "כִּֽי־<mark>בָרֵ֣ךְ אֲבָרֶכְךָ֗</mark> וְהַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת־זַרְעֲךָ֙ כְּכוֹכְבֵ֣י הַשָּׁמַ֔יִם וְכַח֕וֹל אֲשֶׁ֖ר עַל־שְׂפַ֣ת הַיָּ֑ם וְיִרַ֣שׁ זַרְעֲךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽיו׃", "pasuk_en": "כִּי־בָרֵךְ אֲבָרֶכְךָ וְהַרְבָּה אַרְבֶּה אֶת־זַרְעֲךָ כְּכוֹכְבֵי הַשָּׁמַיִם וְכַחוֹל אֲשֶׁר עַל־שְׂפַת הַיָּם וְיִרַשׁ זַרְעֲךָ אֵת שַׁעַר אֹיְבָיו׃", "rashi_he": "ברך אברכך. אַחַת לָאָב וְאַחַת לַבֵּן:", "rashi_en": "הכפילות \"ברך אברכך\" מלמדת על שתי ברכות: אחת לאב ואחת לבן.", "note": "", "points": [{"q": "מַדּוּעַ כָּפַל ה' אֶת הַלָּשׁוֹן \"בָרֵךְ אֲבָרֶכְךָ\"?", "options": ["בְּרָכָה אַחַת לָאָב וְאַחַת לַבֵּן", "כְּדֵי לְחַזֵּק אֶת הַבְטָחַת הַבְּרָכָה", "בְּרָכָה לָעוֹלָם הַזֶּה וּבְרָכָה לָעוֹלָם הַבָּא"], "kasha": "למה נאמרה הברכה בלשון כפולה?", "answer": "ברכה אחת לאברהם האב וברכה אחת ליצחק הבן.", "kp": ["אחת לאב ואחת לבן"]}]}, {"id": "22:17.2", "ch": 22, "v": 17, "n": 2, "dh": "והרבה ארבה", "pasuk_html": "כִּֽי־בָרֵ֣ךְ אֲבָרֶכְךָ֗ <mark>וְהַרְבָּ֨ה אַרְבֶּ֤ה</mark> אֶֽת־זַרְעֲךָ֙ כְּכוֹכְבֵ֣י הַשָּׁמַ֔יִם וְכַח֕וֹל אֲשֶׁ֖ר עַל־שְׂפַ֣ת הַיָּ֑ם וְיִרַ֣שׁ זַרְעֲךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽיו׃", "pasuk_en": "כִּי־בָרֵךְ אֲבָרֶכְךָ וְהַרְבָּה אַרְבֶּה אֶת־זַרְעֲךָ כְּכוֹכְבֵי הַשָּׁמַיִם וְכַחוֹל אֲשֶׁר עַל־שְׂפַת הַיָּם וְיִרַשׁ זַרְעֲךָ אֵת שַׁעַר אֹיְבָיו׃", "rashi_he": "והרבה ארבה. אַחַת לָאָב וְאַחַת לַבֵּן:", "rashi_en": "גם הכפילות \"והרבה ארבה\" מלמדת על שני ריבויים: אחד לאב ואחד לבן.", "note": "", "points": [{"q": "מַדּוּעַ נֶאֱמַר בִּלְשׁוֹן כְּפוּלָה \"וְהַרְבָּה אַרְבֶּה\"?", "options": ["רִיבּוּי אֶחָד לָאָב וְרִיבּוּי אֶחָד לַבֵּן", "רִיבּוּי לְזֶרַע יִשְׂרָאֵל וּלְזֶרַע יִשְׁמָעֵאל", "רִיבּוּי בְּעֹושֶׁר וְרִיבּוּי בְּבָנִים"], "kasha": "למה נאמרה הבטחת הריבוי בלשון כפולה?", "answer": "ריבוי אחד לאב וריבוי אחד לבן.", "kp": ["אחת לאב ואחת לבן"]}]}, {"id": "22:19.1", "ch": 22, "v": 19, "n": 1, "dh": "וישב אברהם בבאר שבע", "pasuk_html": "וַיָּ֤שָׁב אַבְרָהָם֙ אֶל־נְעָרָ֔יו וַיָּקֻ֛מוּ וַיֵּלְכ֥וּ יַחְדָּ֖ו אֶל־בְּאֵ֣ר שָׁ֑בַע <mark>וַיֵּ֥שֶׁב אַבְרָהָ֖ם בִּבְאֵ֥ר שָֽׁבַע׃</mark> (פ)", "pasuk_en": "וַיָּשָׁב אַבְרָהָם אֶל־נְעָרָיו וַיָּקֻמוּ וַיֵּלְכוּ יַחְדָּו אֶל־בְּאֵר שָׁבַע וַיֵּשֶׁב אַבְרָהָם בִּבְאֵר שָׁבַע׃", "rashi_he": "וישב אברהם בבאר שבע. לֹא יְשִׁיבָה מַמָּשׁ, שֶׁהֲרֵי בְּחֶבְרוֹן הָיָה יוֹשֵׁב, י\"ב שָׁנִים לִפְנֵי עֲקֵדָתוֹ שֶׁל יִצְחָק יָצָא מִבְּאֵר שֶׁבַע וְהָלַךְ לוֹ לְחֶבְרוֹן, כְּמוֹ שֶׁנֶּאֱמַר וַיָּגָר אַבְרָהָם בְּאֶרֶץ פְּלִשְׁתִּים יָמִים רַבִּים, מְרֻבִּים מִשֶּׁל חֶבְרוֹן הָרִאשׁוֹנִים, וְהֵם כ\"ו שָׁנָה, כְּמוֹ שֶׁפֵּרַשְׁנוּ לְמַעְלָה:", "rashi_en": "אברהם לא ישב בבאר שבע ישיבה קבועה, כי באותה תקופה גר בחברון. שתים עשרה שנה לפני העקידה עזב את באר שבע ועבר לחברון.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"וַיָּשָׁב אַבְרָהָם בִּבְאֵר שָׁבַע\" כָּאן?", "options": ["לֹא יָשַׁב שָׁם בְּקָבִיעוּת, כִּי מְקוֹם מְגוּרָיו הָיָה בְּחֶבְרוֹן", "חָזַר לָגוּר בִּבְאֵר שֶׁבַע לִצְמִיתוּת אַחֲרֵי הָעֲקֵידָה", "גָּר שָׁם כָּל יָמָיו עַד מוֹתָהּ שֶׁל שָׂרָה"], "kasha": "איך נאמר שאברהם ישב בבאר שבע, והרי באותה תקופה גר בחברון?", "answer": "אין זו ישיבה ממש, שהרי בחברון היה יושב, כי שתים עשרה שנה לפני העקידה יצא מבאר שבע והלך לחברון.", "kp": ["לא ישיבה ממש", "שהרי בחברון היה יושב"]}]}, {"id": "22:20.1", "ch": 22, "v": 20, "n": 1, "dh": "אחרי הדברים האלה ויגד וגו'", "pasuk_html": "וַיְהִ֗י <mark>אַחֲרֵי֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה וַיֻּגַּ֥ד</mark> לְאַבְרָהָ֖ם לֵאמֹ֑ר הִ֠נֵּה יָלְדָ֨ה מִלְכָּ֥ה גַם־הִ֛וא בָּנִ֖ים לְנָח֥וֹר אָחִֽיךָ׃", "pasuk_en": "וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה וַיֻּגַּד לְאַבְרָהָם לֵאמֹר הִנֵּה יָלְדָה מִלְכָּה גַם־הִוא בָּנִים לְנָחוֹר אָחִיךָ׃", "rashi_he": "אחרי הדברים האלה ויגד וגו'. בְּשׁוּבוֹ מֵהַר הַמּוֹרִיָה הָיָה אַבְרָהָם מְהַרְהֵר וְאוֹמֵר אִלּוּ הָיָה בְנִי שָׁחוּט כְּבָר, הָיָה הוֹלֵךְ בְּלֹא בָנִים, הָיָה לִי לְהַשִּׂיאוֹ אִשָּׁה מִבְּנוֹת עָנֵר אֶשְׁכּוֹל וּמַמְרֵא, בִּשְּׂרוֹ הַקָּבָּ\"ה שֶׁנּוֹלְדָה רִבְקָה בַת זוּגוֹ, וְזֶהוּ הדברים האלה, הִרְהוּרֵי דְּבָרִים שֶׁהָיוּ עַל יְדֵי עֲקֵדָה:", "rashi_en": "בשובו מהר המוריה חשב אברהם: אילו נשחט בני, היה מת בלי בנים, והייתי צריך להשיא לו אשה. לכן בישר לו ה' שנולדה רבקה, המיועדת ליצחק. \"הדברים האלה\" הם המחשבות שעלו בעקבות העקידה.", "note": "", "points": [{"q": "אַחֲרֵי אֵילּוּ \"דְבָרִים\" בִּישְּׂרוּ לְאַבְרָהָם עַל לֵידַת רִבְקָה?", "options": ["אַחֲרֵי הִרְהוּרָיו שֶׁיִּצְחָק הָיָה מֵת בְּלִי בָּנִים", "אַחֲרֵי שֶׁחָזַר לָגוּר בִּבְאֵר שָׁבַע", "אַחֲרֵי שֶׁנּוֹדַע לוֹ עַל מוֹתָהּ שֶׁל שָׂרָה"], "kasha": "מה הקשר בין העקידה לבשורה על משפחת נחור, ולאילו \"דברים\" הכוונה?", "answer": "אברהם הרהר שאילו נשחט יצחק היה מת בלי בנים, ולכן בישר לו ה' שנולדה רבקה בת זוגו; \"הדברים האלה\" הם ההרהורים שבאו בעקבות העקידה.", "kp": ["היה הולך בלא בנים", "שנולדה רבקה בת זוגו", "הרהורי דברים שהיו על ידי עקדה"]}]}, {"id": "22:20.2", "ch": 22, "v": 20, "n": 2, "dh": "גם היא", "pasuk_html": "וַיְהִ֗י אַחֲרֵי֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה וַיֻּגַּ֥ד לְאַבְרָהָ֖ם לֵאמֹ֑ר הִ֠נֵּה יָלְדָ֨ה מִלְכָּ֥ה <mark>גַם־הִ֛וא</mark> בָּנִ֖ים לְנָח֥וֹר אָחִֽיךָ׃", "pasuk_en": "וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה וַיֻּגַּד לְאַבְרָהָם לֵאמֹר הִנֵּה יָלְדָה מִלְכָּה גַם־הִוא בָּנִים לְנָחוֹר אָחִיךָ׃", "rashi_he": "גם היא. אַף הִיא הִשְׁוָת מִשְׁפְּחוֹתֶיהָ לְמִשְׁפְּחוֹת אַבְרָהָם י\"ב, מָה אַבְרָהָם י\"ב שְׁבָטִים שֶׁיָּצְאוּ מִיַּעֲקֹב, ח' בְּנֵי הַגְּבִירוֹת וד' בְּנֵי שְׁפָחוֹת, אַף אֵלּוּ ח' בְּנֵי גְּבִירוֹת וְד' בְּנֵי פִּילֶגֶשׁ:", "rashi_en": "רש\"י מסביר שהמילה \"גם\" באה להשוות את מלכה לאברהם: כמו שלאברהם יצאו שנים עשר שבטים, שמונה מנשים עיקריות וארבעה משפחות, כך גם לנחור נולדו שנים עשר בנים, שמונה ממלכה וארבעה מהפילגש.", "note": "", "points": [{"q": "מַה בָּא רַשִׁ\"י לְלַמֵּד מֵהַמִּילָּה \"גַּם\" שֶׁנֶּאֶמְרָה עַל מִלְכָּה?", "options": ["שֶׁמִּשְׁפַּחְתָּהּ שָׁווָה לְמִשְׁפַּחַת אַבְרָהָם בְּמִסְפַּר שְׁנֵים עָשָׂר", "שֶׁגַּם מִלְכָּה הָייְתָה עֲקָרָה וְנִפְקְדָה כְּמוֹ שָׂרָה", "שֶׁגַּם הִיא יָלְדָה בָּנִים בְּזִקְנָתָהּ כְּמוֹ אַבְרָהָם"], "kasha": "מה פירוש \"גם\", וכלפי מי משווים כאן את מלכה?", "answer": "מלכה השוותה את משפחותיה למשפחות אברהם: כמו שמאברהם יצאו שנים עשר שבטים, שמונה מבני הגבירות וארבעה מבני השפחות, כך לנחור שמונה מבני מלכה וארבעה מבני הפילגש.", "kp": ["אף היא השות משפחותיה", "מה אברהם י\"ב שבטים", "ח' בני גבירות וד' בני פילגש"]}]}, {"id": "22:23.1", "ch": 22, "v": 23, "n": 1, "dh": "ובתואל ילד את רבקה", "pasuk_html": "<mark>וּבְתוּאֵ֖ל יָלַ֣ד אֶת־רִבְקָ֑ה</mark> שְׁמֹנָ֥ה אֵ֙לֶּה֙ יָלְדָ֣ה מִלְכָּ֔ה לְנָח֖וֹר אֲחִ֥י אַבְרָהָֽם׃", "pasuk_en": "וּבְתוּאֵל יָלַד אֶת־רִבְקָה שְׁמֹנָה אֵלֶּה יָלְדָה מִלְכָּה לְנָחוֹר אֲחִי אַבְרָהָם׃", "rashi_he": "ובתואל ילד את רבקה. כָּל הַיִּחוּסִין הַלָּלוּ לֹא נִכְתְּבוּ אֶלָּא בִּשְׁבִיל פָּסוּק זֶה:", "rashi_en": "רש\"י מסביר שכל רשימת צאצאי נחור נכתבה בתורה רק כדי להגיע לפסוק הזה, שמספר על הולדת רבקה.", "note": "", "points": [{"q": "לְשֵׁם מָה כָּתְבָה הַתּוֹרָה אֶת כָּל רְשִׁימַת בְּנֵי נָחוֹר, לְפִי רַשִׁ\"י?", "options": ["כְּדֵי לְסַפֵּר עַל הוֹלֶדֶת רִבְקָה שֶׁתִּינָּשֵׂא לְיִצְחָק", "כְּדֵי לְלַמֵּד שֶׁנָּחוֹר הִתְקָרֵב לֶאֱמוּנַת אַבְרָהָם", "כְּדֵי לְפָרֵט אֶת כָּל אֻומּוֹת אֲרָם שֶׁיָּצְאוּ מִנָּחוֹר"], "kasha": "מדוע התורה מאריכה ברשימת צאצאי נחור, שאין להם תפקיד בהמשך הסיפור?", "answer": "כל היחוסים האלה לא נכתבו אלא בשביל הפסוק הזה, שבו נאמר שבתואל הוליד את רבקה.", "kp": ["כל היחוסין הללו", "לא נכתבו אלא בשביל פסוק זה"]}]}];
const EN = {"18:1.1":{"e":"Hashem appeared to Avraham to visit him in his illness, since it was the third day after the circumcision, and He inquired after his welfare.","pe":"Adonoy appeared to him in the groves of Mamrei and he was sitting at the door of the tent in the heat of the day.","re":"[He] appeared to him. To visit the sick person. R. Chama bar Chanina said: It was the third day since his circumcision and God came to inquire about his welfare.","p":[{"q":"For what purpose did Hashem appear to Avraham, when the verse does not say that Hashem said anything to him?","o":["To visit him in his illness after the circumcision","To announce to him the birth of Yitzchak","To reveal to him the overturning of Sedom"]}]},"18:1.2":{"e":"Mamre advised Avraham to fulfill the mitzvah of circumcision, and therefore Hashem appeared to Avraham specifically in Mamre's territory.","pe":"Adonoy appeared to him in the groves of Mamrei and he was sitting at the door of the tent in the heat of the day.","re":"In the groves of Mamrei. He [Mamrei] advised him regarding the circumcision. Therefore, He appeared to him [Avraham] in his [Mamrei’s] territory.","p":[{"q":"Why does the Torah note that Hashem appeared to Avraham specifically \"באלני ממרא\"?","o":["Because Mamre advised Avraham to perform the circumcision","Because the altar that Avraham built for Hashem was there","Because Avraham sat there looking for guests"]}]},"18:1.3":{"e":"The word \"ישב\" is written without a vav, to teach that Avraham wanted to rise before Hashem, and Hashem told him to sit and He would stand. This was a sign for his children that Hashem stands in the assembly of judges while they sit.","pe":"Adonoy appeared to him in the groves of Mamrei and he was sitting at the door of the tent in the heat of the day.","re":"Was sitting. It is written יָשַׁב [without a וא\"ו]. [This indicates that] he wanted to rise [when] God said to him, “Sit, and I will stand, and you will symbolize to your descendants that I am destined to stand in the assembly of judges while they remain seated,” as it is said: “Elohim stands in the assembly of judges.”","p":[{"q":"What does Rashi learn from the fact that the word \"ישב\" is written without a vav?","o":["That Avraham wanted to rise, and Hashem told him to sit","That Avraham sat only a short time at the tent opening","That Avraham was too weak to stand because of the circumcision"]},{"q":"What sign for Avraham's descendants is there in the fact that Hashem stood and Avraham remained sitting?","o":["That Hashem stands in the assembly of judges while they sit","That judges must stand at the time of judgment","That it is permitted to sit while praying to Hashem"]}]},"18:1.4":{"e":"Avraham sat at the tent opening to see whether there were any passersby, and to bring them into his home.","pe":"Adonoy appeared to him in the groves of Mamrei and he was sitting at the door of the tent in the heat of the day.","re":"At the door of the tent. To see if there are any passers by that he might invite into his home.","p":[{"q":"For what purpose did Avraham sit specifically at the tent opening?","o":["To see passersby and bring them into his home","To rest in the shade from the heat of the day","To wait for Hashem to appear to him"]}]},"18:1.5":{"e":"Hashem brought out a strong sun so that guests would not come and trouble the ill Avraham. But when He saw that Avraham was pained that no guests came, He sent angels to him in the form of men.","pe":"Adonoy appeared to him in the groves of Mamrei and he was sitting at the door of the tent in the heat of the day.","re":"In the heat of the day. God brought the sun out of its sheath so that he would not be burdened by travelers. But, when He saw that he [Avraham] was grieved that no travelers were coming, He brought the angels to him in the guise of men.","p":[{"q":"Why does the Torah note that the event took place \"כחם היום\"?","o":["Hashem brought heat so that guests would not trouble Avraham","To explain why Avraham sat in the shade of the tent","Because in the heat people customarily rest and do not work"]},{"q":"If Hashem did not want guests to come, why did people come to Avraham anyway?","o":["Hashem saw that Avraham was pained that there were no guests, and sent angels","The people did not notice the intense heat and set out on the road","The heat had already subsided when the people reached the tent"]}]},"18:2.1":{"e":"Three angels came, each for a different mission: to announce to Sarah, to overturn Sedom, and to heal Avraham, since one angel does not perform two missions. Proof for this is that regarding the announcement and the overturning of Sedom, the verse speaks in the singular.","pe":"He lifted his eyes and saw, and behold three men were standing over him. He saw [them], and ran from the door of the tent to greet them, and he bowed down to the earth.","re":"And behold three men. One to foretell to Sarah, and one to overturn Sedom, and one to heal Avraham, because one angel cannot accomplish two missions. You may be convinced of this because in the entire parshah they are mentioned in the plural form, [e.g.] “And they ate.” “They said to him.” Whereas at the tidings [of Sarah’s child] it states: “He said, ‘I will return to you.’” And at the overturning of Sedom it states: “For I can do nothing,” “I will not overturn.” Rephael, who healed Avraham, went from there to rescue Lot. This is what is said: “When they were brought out [of the city], he [the angel] said, ‘Escape for your life,’” which teaches you that [only] one was involved in rescuing [Lot].","p":[{"q":"Why did specifically three angels come to Avraham?","o":["Because each angel had one mission of his own","Because three is the proper number of guests for honor","Because all three were sent together to announce to Sarah"]},{"q":"From where does Rashi prove that each angel was in charge of a different mission?","o":["Regarding the announcement and the overturning of Sedom, the singular is used","Throughout the passage they are mentioned in the plural","Only one angel ate from the meal"]}]},"18:2.2":{"e":"\"נצבים עליו\" means standing before him, and the Torah used the word \"עליו\" as a clean and respectful expression regarding the angels.","pe":"He lifted his eyes and saw, and behold three men were standing over him. He saw [them], and ran from the door of the tent to greet them, and he bowed down to the earth.","re":"Standing over him. [Meaning:] “next to him,” as in [וְעָלָיו] “Next to him was the Tribe of Menasheh.” It [וְעָלָיו] is just a respectful term used when referring to angels.","p":[{"q":"What does \"נצבים עליו\" mean according to Rashi?","o":["Standing before him, in an honorific expression regarding the angels","Standing literally above Avraham's head","Standing beside him to watch over and guard him"]}]},"18:2.3":{"e":"\"וירא\" is written twice: the first is actual seeing, and the second is understanding, that Avraham understood that the angels stood in place because they did not want to trouble him, so he ran toward them. According to the Gemara, when they saw him loosening and tying his bandage they moved away from him, and immediately he ran toward them.","pe":"He lifted his eyes and saw, and behold three men were standing over him. He saw [them], and ran from the door of the tent to greet them, and he bowed down to the earth.","re":"He saw [them]. Why is וַיַּרְא written twice [in this verse]? The first is as it seems [i.e., and saw], whereas, the second means “understanding:” he saw them remain standing in one place and he understood that they did not wish to trouble him. He then quickly ran towards them. In Bava Metzia [there is another explanation]: First it says: “Standing over him” and then it says: “He ran to greet them.” [The answer is:] when they saw him as he was untying and tying [his bandages] they distanced themselves from him. Immediately, “He ran to greet them.”","p":[{"q":"According to the first explanation in Rashi, what does the second \"וירא\" in the verse mean?","o":["He understood that the angels did not want to trouble him","He saw again the angels approaching him","He saw that the angels were tired from the road"]},{"q":"How does the Gemara resolve the contradiction between \"נצבים עליו\" and \"וירץ לקראתם\"?","o":["When they saw him loosening and tying his wound, they moved away from him","At first they stood beside him and afterward continued on their way","Avraham ran to them even before they reached him"]}]},"18:3.1":{"e":"There are two explanations here. According to the first, Avraham addressed the greatest of the guests and asked that he not pass by, since then his companions would stay too, and \"אדני\" is a secular term. According to the second, \"אדני\" is a holy name, and Avraham asked Hashem to wait for him until he brought in the guests.","pe":"He said, My Master, if I have found favor in Your eyes, please do not bypass your servant.","re":"He said, “My master, if … He was speaking to their leader and referred to them all as “masters.” And to the leader he said, “Please do not bypass,” because if he will not pass by his associates will remain with him. In this explanation it [אֲדֹנָי] is profane. An alternate explanation: It [אֲדֹנָי] is holy [referring to God] and he [Avraham] was telling God to wait for him until he will run and invite the travelers to come in. Though this is written after וַיָּרָץ לִקְרָאתָם, [nevertheless,] the conversation [with God] preceded it. It is the way of Scripture to speak thus as I explained concerning [the verse] “My spirit will not continue to judge man forever,” which is written after, “Noach produced …” And it is impossible to say otherwise but that the decree preceded [the birth of Yefes] by twenty years. Both explanations are in Bereishis Rabbah.","p":[{"q":"According to the first explanation, why does Avraham speak in the singular though there were three guests?","o":["He spoke to the greatest of them, and his companions would stay with him","He spoke only to the angel who came to announce to Sarah","He thought only one of them was a guest and the rest were his attendants"]},{"q":"According to the second explanation, to whom did Avraham turn when saying \"אדני\"?","o":["To Hashem, to wait for him until he brought in the guests","To the greatest of the angels, to hold back his companions","To the three guests together, in an honorific form"]}]},"18:4.1":{"e":"Avraham brought the water through a messenger and not himself, so Hashem also paid back his children for the water in the desert through a messenger, when Moshe struck the rock.","pe":"Let a bit of water be brought and wash your feet. Rest yourselves under the tree.","re":"Let be brought. through an intermediary, and God rewarded his descendants through a messenger, as it is said: “And Moshe raised his hand and hit the stone.”","p":[{"q":"What does Rashi learn from the fact that Avraham said \"יקחנא\" and did not bring the water himself?","o":["The water was brought through a messenger, so Hashem repaid his children through a messenger","Avraham was weak from the circumcision and could not carry water","Avraham wanted to educate Yishmael in mitzvos"]}]},"18:4.2":{"e":"Avraham thought the guests were Arabs who bow down to the dust of their feet, so he was careful that they wash their feet in order not to bring idol worship into his house. Lot was not careful about this, so he put lodging before washing.","pe":"Let a bit of water be brought and wash your feet. Rest yourselves under the tree.","re":"And wash your feet. He thought that they were Arabs who worship the dust of their feet, and he was particular not to allow any object of idolatry into his house. However, Lot, who was not particular, invited them to lodge before [asking them to] wash, as is said: “Stay overnight, bathe your feet.”","p":[{"q":"Why did Avraham ask the guests to wash their feet right away?","o":["He feared they worship the dust of their feet, and did not want idolatry in his house","So that they would rest from the long road in the heat of the day","So that they would not dirty the tent with road dust"]}]},"18:4.3":{"e":"\"העץ\" here means the tree, that is, a living tree that provides shade.","pe":"Let a bit of water be brought and wash your feet. Rest yourselves under the tree.","re":"Under the tree. [Meaning:] under the tree.","p":[{"q":"What does \"העץ\" mean in the verse according to Rashi?","o":["A tree, a living tree growing in the place","A wooden beam or staff to lean on","A sukkah or booth made of wood"]}]},"18:5.1":{"e":"In the Torah, the Prophets, and the Writings we find that bread sustains the heart. And Rabbi Chama taught that \"לבכם\" is written and not \"לבבכם\", teaching that the evil inclination does not rule over angels.","pe":"I will get bread and you will sustain your heart. Afterwards you will continue on your way, since you have passed by your servant. They said, Fine, do as you have said.","re":"You will sustain your heart. In the Torah, Neviim, and Kesuvim we find that bread is the sustenance of the heart. In the Torah: “You will sustain you hearts;” in Neviim: “Sustain the heart with a loaf of bread;” in Kesuvim: “Bread sustains the human heart.” R. Chama said: Here it is not spelled לְבַבְכֶם but, לִבְּכֶם, which tells us that the evil inclination has no influence over the angels.","p":[{"q":"Why did Avraham say about the bread \"וסעדו לבכם\"?","o":["Because throughout Scripture bread is what sustains the heart","Because bread gladdens the heart like wine","Because the guests were weak and very hungry"]},{"q":"What does Rabbi Chama learn from the fact that \"לבכם\" is written and not \"לבבכם\"?","o":["That the evil inclination does not rule over angels","That the angels were not truly hungry","That Avraham understood they were angels"]}]},"18:5.2":{"e":"\"אחר תעברו\" means: after you eat, continue on your way.","pe":"I will get bread and you will sustain your heart. Afterwards you will continue on your way, since you have passed by your servant. They said, Fine, do as you have said.","re":"Afterwards you will continue on your way. [Meaning:] after that you may leave.","p":[{"q":"What does \"אחר תעברו\" mean?","o":["Afterward, continue on your way","Pass by a different road than the one you came on","Pass after me into the tent"]}]},"18:5.3":{"e":"Avraham told the guests: I ask this of you, since you have passed by me for my honor.","pe":"I will get bread and you will sustain your heart. Afterwards you will continue on your way, since you have passed by your servant. They said, Fine, do as you have said.","re":"Since you have passed by. For this thing I ask of you since you have passed in my proximity to honor me.","p":[{"q":"What reason does Avraham give the guests for his request that they eat with him?","o":["Since you passed by me for my honor, I ask this","Since you are tired and hungry from the road","Since a large meal is already prepared at my place"]}]},"18:5.4":{"e":"The phrase \"כי על כן\" means \"על אשר\", that is, since..., and this is its meaning everywhere in Scripture.","pe":"I will get bread and you will sustain your heart. Afterwards you will continue on your way, since you have passed by your servant. They said, Fine, do as you have said.","re":"Since. This has the same meaning as עַל אֲשֶׁר — [since/because]. This is the meaning of every כִּי עַל כֵּן in Scripture. [E.g.,] “Because … they came under the shelter of my roof;” “Because I have seen your face;” “Since I did not give her; “Since you know how we encamp.”","p":[{"q":"According to Rashi, what does the phrase \"כי על כן\" mean in the verse?","o":["\"על אשר\", that is, since...","Therefore, as a result of what was said before","Nevertheless, despite this"]}]},"18:6.1":{"e":"The fine flour (solet) was for cakes, and the flour (kemach) served to cover the pot to absorb the scum, as cooks do.","pe":"Avraham hurried to Sarah’s tent and said, Hurry! [take] three measures of the finest flour; knead it and make cake-rolls.","re":"The finest flour. The fine flour is used for cakes, [and] the meal is for the starch used by cooks for the purpose of covering the pot to absorb the grime.","p":[{"q":"Why did Avraham mention both \"קמח\" and \"סלת\"?","o":["The solet was for cakes, and the kemach to cover the pot and absorb the scum","To prepare two kinds of bread for the guests","Because he did not have enough fine flour for three se'ah"]}]},"18:7.1":{"e":"Avraham took three calves, in order to feed the guests three tongues with mustard.","pe":"Avraham ran to the cattle, and took a tender, choice calf. He gave it to the lad. and hurried to prepare it.","re":"A tender, choice calf. There were three calves so that he might feed them three tongues together with mustard.","p":[{"q":"How many calves did Avraham take, and for what purpose?","o":["Three, to serve them three tongues with mustard","One, since it was enough for all the guests","Three, in order to offer one of them to Hashem"]}]},"18:7.2":{"e":"The youth to whom Avraham gave the calf is Yishmael, and Avraham did this in order to educate him in mitzvos.","pe":"Avraham ran to the cattle, and took a tender, choice calf. He gave it to the lad. and hurried to prepare it.","re":"To the lad. This refers to Yishmael, to train him in performing mitzvos.","p":[{"q":"Who is \"הנער\", and why did Avraham give him the calf?","o":["Yishmael, in order to educate him in mitzvos","Eliezer his servant, so that he would hurry with the work","One of the attendants, since Avraham was weak"]}]},"18:8.1":{"e":"Avraham did not serve the guests bread, because that day Sarah's menstrual cycle returned and the dough became impure.","pe":"He took butter, milk, and the calf he had prepared, and set it before them. He stood over them under the tree, and they ate.","re":"He took butter, etc. But, the bread he did not bring because Sarah began to menstruate for on that day the menstrual cycle returned to Sarah and the dough became ritually unclean.","p":[{"q":"Why is bread not mentioned among the foods Avraham served, although he promised a morsel of bread?","o":["Sarah became a niddah that day and the dough became impure","The guests were in a hurry and there was no time to bake","Angels do not eat bread at all"]}]},"18:8.2":{"e":"Butter (chem'ah) is the fat of milk that is skimmed off its surface.","pe":"He took butter, milk, and the calf he had prepared, and set it before them. He stood over them under the tree, and they ate.","re":"Butter. The fat of the milk that is skimmed off the top.","p":[{"q":"What is \"חמאה\" according to Rashi?","o":["The fat of milk that is skimmed off the surface of the milk","Milk that soured and became soft cheese","Olive oil served together with the bread"]}]},"18:8.3":{"e":"\"אשר עשה\" means that which he prepared, and each portion as it was prepared, Avraham brought immediately before the guests.","pe":"He took butter, milk, and the calf he had prepared, and set it before them. He stood over them under the tree, and they ate.","re":"And the calf he had prepared. [Meaning:] that he prepared. As each one was prepared he immediately brought it to them.","p":[{"q":"What does Rashi teach from the words \"אשר עשה\"?","o":["Each portion as it was prepared, he brought immediately before the guests","That Avraham himself cooked all the meat","That the meat was prepared even before the guests arrived"]}]},"18:8.4":{"e":"The angels did not truly eat but appeared to be eating, and from here we learn that a person should not deviate from the custom of the place where he is.","pe":"He took butter, milk, and the calf he had prepared, and set it before them. He stood over them under the tree, and they ate.","re":"And they ate. It appeared as if they were eating. [We learn] from this that a person should not act differently from the prevalent custom.","p":[{"q":"How can it say of the angels \"ויאכלו\"?","o":["They only appeared to be eating, so as not to deviate from the custom","They truly ate when they took on the form of men","They ate only from the butter and milk and not from the meat"]}]},"18:9.1":{"e":"There are dots over the letters איו in the word \"אליו\", and since the dotted text takes precedence over the written text, we expound the dotted: they also asked Sarah \"איו Avraham\". From this we learn that a person who is a guest asks the man about his wife and the woman about her husband. According to the Gemara, the angels asked in order to publicize Sarah's modesty and endear her to her husband.","pe":"They said to him, Where is Sarah, your wife? He said Here, in the tent.","re":"They said to him. There are dots over [the letters] א,י,ו of [the word] אֵלָיו. And it was taught in a B’rayso: R. Shimon ben Elazar says: wherever the [undotted] letters are more than the dotted [letters] you must explain the [undotted] letters. But, here, the dotted letters are more than the [undotted] letters [and] you must explain the dotted [letters]. [The explanation is:] that they also asked Sarah, “Where is Avraham?” From this we learn that a person should inquire of his host, [asking] the man about his wife, and the woman about her husband. In Bava Metzia it is said: the serving angels knew where our Mother Sarah was. But, [they inquired] to make known her modesty in order to endear her to her husband. R. Yosi bar Chanina said: in order to send to her the [wine-]cup of blessing.","p":[{"q":"What does Rashi expound from the dots over the letters איו in the word \"אליו\"?","o":["That the angels also asked Sarah where Avraham was","That the angels spoke with Avraham in a whisper","That Avraham did not hear their question at first"]},{"q":"According to the Gemara, why did the angels ask where Sarah was, when they knew?","o":["To make known that she was modest and endear her to her husband","To test whether Avraham knew where his wife was","Because they wanted to announce to her themselves face to face"]}]},"18:9.2":{"e":"In his answer \"הנה באהל\", Avraham said that Sarah is modest and is inside the tent.","pe":"They said to him, Where is Sarah, your wife? He said Here, in the tent.","re":"Here, in the tent. [Implying:] “she is modest.”","p":[{"q":"What did Avraham mean to say in his answer \"הנה באהל\"?","o":["That Sarah is modest and is inside the tent","That Sarah is busy preparing cakes for the guests","That Sarah does not want to meet the guests"]}]},"18:10.1":{"e":"The angel did not say that he himself would return, but spoke on Hashem's mission, like the angel who said to Hagar \"הרבה ארבה\". And Elisha told the Shunammite woman that the angels, who live forever, could say \"אשוב\", but he, who is flesh and blood, cannot promise this.","pe":"He said I will return to you next year, and Sarah, your wife will have a son. Sarah was listening at the door of the tent, that was behind him.","re":"Next year. [Meaning:] at this time next year. This was on Pesach and on the following Pesach Yitzchak was born. [This is indicated by:] since it is not read כְּעֵת but, rather, כָּעֵת [at this time].","p":[{"q":"How could the angel say \"שוב אשוב\", as if he himself would return and remember Sarah?","o":["He spoke on Hashem's mission, like the angel who said to Hagar \"הרבה ארבה\"","The angel did indeed return to Avraham the next year","The angel meant that he would return to announce to Sarah again"]},{"q":"According to Elisha, what is the difference between his words to the Shunammite woman and the words of the angels to Sarah?","o":["The angels live forever and said \"אשוב\", while he is flesh and blood","The angels announced a son, and he only blessed","The angels spoke in Hashem's name, and he spoke in his own name"]}]},"18:10.2":{"e":"\"כעת חיה\" means at this time next year. The announcement was at Pesach, and at the following Pesach Yitzchak was born, as learned from the way the word \"כעת\" is read.","pe":"He said I will return to you next year, and Sarah, your wife will have a son. Sarah was listening at the door of the tent, that was behind him.","re":"כָּעֵת חַיָּה [means] at this time when there will be life to you, [i.e.,] when you will all be well and alive.","p":[{"q":"To what time does the announcement \"כעת חיה\" refer?","o":["To this time next year, the coming Pesach","To nine months from the day of the announcement","To a near time that is not known in advance"]}]},"18:10.3":{"e":"According to this explanation, \"כעת חיה\" means: at this time, when all of you will be alive, whole, and well.","pe":"He said I will return to you next year, and Sarah, your wife will have a son. Sarah was listening at the door of the tent, that was behind him.","re":"I will return. The angel did not foretell that he himself would return to him, but, he was speaking to him as God’s agent, as in: “The angel of God said to her, ‘I will greatly multiply [your descendants]’” and he [the angel] does not have it in his power to multiply [her children], but [he said this] as the agent of God. Here, too, it was as an agent of God that he told this to him. Elisha said to the Shunamite woman: “At this season, at this time, when you will be alive you will be embracing a son.” And she said, “No, my master, [you] man of God, do not be false with your maidservant. Those angels who foretold for Sarah, said, at this season I will return.” Elisha responded to her, “Those angels who live and endure forever said, ‘At this season I will return,’ but I, who am but flesh and blood, who is alive today and dead tomorrow, whether I will be alive or dead, at this season, etc., [you will embrace a son].","p":[{"q":"According to this explanation, what is the meaning of the word \"חיה\" in the phrase \"כעת חיה\"?","o":["A time when all of you will be alive and whole","The time of birth, when a woman in labor is called chayah","The springtime, when nature is renewed and alive"]}]},"18:10.4":{"e":"\"והוא אחריו\" means that the tent opening was behind the angel, and there Sarah stood and listened.","pe":"He said I will return to you next year, and Sarah, your wife will have a son. Sarah was listening at the door of the tent, that was behind him.","re":"That was behind him. [Meaning:] the entrance was behind the angel.","p":[{"q":"What does \"והוא אחריו\" in the verse refer to?","o":["The tent opening was behind the angel","Sarah stood behind Avraham","Avraham stood behind the angel"]}]},"18:11.1":{"e":"\"חדל להיות\" means that her menstrual cycle ceased.","pe":"Avraham and Sarah were old, well on in years. Sarah no longer had the way of women.","re":"No longer had. [Meaning:] there had ceased from her… .","p":[{"q":"What does \"חדל להיות\" mean according to Rashi?","o":["It ceased and stopped for her","She never had it","It weakened but did not cease entirely"]}]},"18:11.2":{"e":"\"ארח כנשים\" means the menstrual cycle, the regular way of women. Sarah no longer had a cycle, so naturally she could not give birth.","pe":"Avraham and Sarah were old, well on in years. Sarah no longer had the way of women.","re":"The way of women. [I.e.,] the menstrual cycle.","p":[{"q":"What does the verse mean by the words \"ארח כנשים\"?","o":["A woman's monthly cycle","The way women honor guests","A woman's strength to work at home"]}]},"18:12.1":{"e":"Sarah laughed \"בקרבה\", meaning she looked at her body and wondered: can such an old womb bear a child, and can shriveled breasts nurse?","pe":"Sarah laughed to herself saying, Now that I am worn out, shall I have the pleasure [of a son], my master being [also] an old man.","re":"To herself. [Meaning:] she looked at her insides and said, “Is it possible that these insides can carry a child, that these shriveled breasts can draw milk? [This explanation is derived from] Tanchuma.","p":[{"q":"What does \"בקרבה\" mean according to Rashi?","o":["She looked at her belly and wondered whether she could bear a child","She laughed quietly so the angels would not hear","She laughed inside the tent while close to the entrance"]}]},"18:12.2":{"e":"Rashi brings two explanations for the word \"עדנה\": smooth, fresh skin like that of a young woman, or a fixed time, meaning the time of the menstrual cycle.","pe":"Sarah laughed to herself saying, Now that I am worn out, shall I have the pleasure [of a son], my master being [also] an old man.","re":"Pleasure. [Meaning:] smooth flesh. It is a term used in the Mishnah: “It removes the hair and makes the flesh smooth.” An alternative explanation [for עֶדְנָה] from the word עִידָן [meaning] time, [referring to the] regular menstrual cycle.","p":[{"q":"According to the first explanation, what does \"עדנה\" mean?","o":["Smooth, fresh skin of a young body","Joy and delight from the angels' announcement","Strength to work and care for a child"]},{"q":"According to the second explanation, from which word does \"עדנה\" come and what does it mean?","o":["From the word \"עידן\", time, meaning the time of the menstrual cycle","From the word \"עדן\", the Garden of Eden","From the word \"עדה\", a group of women"]}]},"18:13.1":{"e":"\"האף אמנם\" means: will I truly give birth? It is a question of wonder.","pe":"Adonoy said to Avraham, Why did Sarah laugh saying, Can I really give birth when I am old?","re":"Really. [Meaning:] “Can it be true that I will give birth?” When I am old. Scripture altered [her statement] for the sake of peace, for she had actually said, “And my master is old.”","p":[{"q":"What do the words \"האף אמנם\" mean in the verse?","o":["Will I truly give birth?","I will certainly give birth, there is no doubt","Even if I give birth, the child will not live"]}]},"18:13.2":{"e":"Sarah said \"ואדני זקן\", but Hashem told Avraham that she said \"ואני זקנתי\". The verse changed her words for the sake of peace between Avraham and Sarah.","pe":"Adonoy said to Avraham, Why did Sarah laugh saying, Can I really give birth when I am old?","re":"","p":[{"q":"Why did Hashem tell Avraham that Sarah said \"ואני זקנתי\"?","o":["To preserve peace between Avraham and Sarah","Because Sarah truly said this about herself","To hide from Avraham that she laughed"]}]},"18:14.1":{"e":"\"היפלא\" means, as in Targum Onkelos: is anything hidden from Me? That is, nothing is so far from Me that it prevents Me from doing My will.","pe":"Is anything too far removed from Adonoy? At the appointed time I will return to you, at this time of life, and Sarah will have a son.","re":"Far removed. [Means:] as translated by Onkelos: Is it hidden? [I.e.,] is there anything beyond and separated and hidden from Me [which might prevent Me] from doing My will?","p":[{"q":"What does \"היפלא\" mean according to Rashi?","o":["Is anything hidden and separated from Me?","Is anything wondrous and marvelous in your eyes?","Is anything not right in my eyes?"]}]},"18:14.2":{"e":"\"למועד\" is the special time that Hashem already set yesterday, when He said that next year at this time Sarah would have a son.","pe":"Is anything too far removed from Adonoy? At the appointed time I will return to you, at this time of life, and Sarah will have a son.","re":"At the appointed time. [Meaning:] on that appointed time that I previously set aside for you [when I said:] “At this time next year.”","p":[{"q":"To which appointed time does Hashem refer when saying \"למועד אשוב אליך\"?","o":["To the time already set: this time next year","To the festival of Pesach coming in a few months","To the time when Sarah would pray for a son"]}]},"18:15.1":{"e":"The verse has two \"כי\" with different meanings: the first means \"since\", and explains why Sarah denied, because she was afraid. The second means \"but\": not as you say, but you laughed.","pe":"Sarah denied it saying, I did not laugh, for she was afraid. He said, Not so, for you did laugh.","re":"For she was afraid … for you did laugh. The first \"כִּי\" is used in the sense of “because,” giving a reason for the fact. [I.e.,] Sarah denied … because she was afraid. The second [כִּי is used in the sense of “but.” [I.e.,] And He said, it is not as you say, but you did laugh. For our Rabbis have said: כִּי has four [different] meanings: 1) if, 2) perhaps, 3) but, 4) because.","p":[{"q":"What does the first \"כי\" mean in the words \"כי יראה\"?","o":["Since, and it explains why Sarah denied","But, and it rejects Sarah's words","Perhaps, and it expresses doubt whether she was afraid"]},{"q":"What does the second \"כי\" mean in the words \"לא כי צחקת\"?","o":["But: not as you say, but you laughed","Since: you are not right because you laughed","If: if you laughed, admit it"]}]},"18:16.1":{"e":"Everywhere in Scripture \"hashkafah\" (looking down) is for bad, except \"השקיפה ממעון קדשך\", said about gifts to the poor, because their power is so great that they turn anger into mercy.","pe":"The men stood up from where they were, and they gazed upon Sedom. Avraham went with them to send them [on their way].","re":"And they gazed. Wherever the term הַשְׁקָפָה is used in Scripture it is [meant to convey gazing for the purpose of bringing] evil, except: “Gaze down from Your holy abode,” [to teach] that giving to the poor is so great that it can change God’s attribute of anger to mercy.","p":[{"q":"What does Rashi teach from the word \"וישקפו\"?","o":["Looking down in Scripture is always for bad, except regarding gifts to the poor","The angels looked at Sedom to find righteous people in it","Hashkafah is looking from close up, from inside the city itself"]}]},"18:16.2":{"e":"\"לשלחם\" means to accompany them on their way. Avraham still thought they were ordinary guests.","pe":"The men stood up from where they were, and they gazed upon Sedom. Avraham went with them to send them [on their way].","re":"To send them [on their way]. [Meaning:] to escort them; he thought that they were travelers.","p":[{"q":"Why did Avraham go with the men \"לשלחם\"?","o":["To accompany them, since he thought they were ordinary guests","To drive them away, since he understood they were angels","To show them the way to Sedom in order to save Lot"]}]},"18:17.1":{"e":"The words \"המכסה אני\" are a question of wonder: shall I conceal from Avraham? That is, surely I will not conceal it from him.","pe":"Adonoy said, Shall I conceal from Avraham what I am about to do?","re":"Shall I conceal. [An expression] of incredulity… .","p":[{"q":"How should the words \"המכסה אני מאברהם\" be read?","o":["As a question of wonder: shall I conceal from him? Surely not","As a decision: I will conceal from Avraham what I am going to do","As a real question that Hashem is deliberating"]}]},"18:17.2":{"e":"Hashem says it is not proper to destroy Sedom without telling Avraham, since the land was given to him and the cities of Sedom are his, and He also called him \"אב המון גוים\", so how can He destroy the children without informing the father who loves Him.","pe":"Adonoy said, Shall I conceal from Avraham what I am about to do?","re":"What I am about to do? In Sedom! It would not be right for Me to do this thing without letting him know. I gave him this land and, [therefore,] these five cities are his. As it is said: “The borders of the Canaanites were from Sidon, etc. toward Sedom and Amorah,” etc. I renamed him Avraham, [which denotes] a father of a multitude of nations. Can I, then, destroy the children without informing the father who loves Me?","p":[{"q":"According to Rashi, why is Sedom connected to Avraham, so that he must be told?","o":["Because Hashem gave him the land, and the five cities are his","Because Lot, Avraham's nephew, lived there","Because Avraham had already prayed for the people of Sedom"]},{"q":"How does Avraham's name require that he be told about Sedom?","o":["He is \"אב המון גוים\", and one does not destroy children without informing the father","His name teaches that he is a prophet, and secrets are revealed to a prophet","His name teaches that he loves kindness, so he will pray for them"]}]},"18:18.1":{"e":"According to the Midrash, Hashem mentioned Avraham and immediately blessed him, since \"the memory of the righteous is for a blessing\". According to the plain sense, Hashem says: shall I conceal from him, when he is dear to Me and destined to become a great nation?","pe":"Avraham is indeed to become a great and mighty nation, and through him shall be blessed all the nations of the world.","re":"Avraham is indeed to become. The Midrashic explanation is: “The mention of a righteous person is a blessing.” [Therefore] since He mentioned him [Avraham], He blessed him. But, the simple explanation is: [God, in effect, said:] “Would I conceal from him, when he is so beloved to Me as to become a great nation and through him will be blessed all the nations of the earth?","p":[{"q":"According to the Midrash, why does the verse bless Avraham specifically here?","o":["Because \"זכר צדיק לברכה\", and when He mentioned him He blessed him","Because Avraham was about to pray for Sedom","Because this is a new promise that Avraham had not heard before"]},{"q":"According to the plain sense, what is the connection between the blessing of Avraham and \"המכסה אני\"?","o":["Avraham is dear to Hashem, so He will not conceal from him","Hashem wants to test Avraham to see whether he will pray","Hashem is comforting Avraham in advance about Sedom's destruction"]}]},"18:19.1":{"e":"\"ידעתיו\" is an expression of affection. Still, the root means knowing, since one who loves a person draws him close and knows him well.","pe":"For I have given him special attention because he commands his children, and his household after him, and they will preserve the way of Adonoy, doing charity and justice, so that Adonoy will bring upon Avraham all that which He has spoken of him.","re":"For I have given him special attention. [יְדַעְתִיו is] an expression denoting affection as in: “A kinsman, on her husband’s side.” [and as in:] “Now Boaz, our kinsman,” [and as in:] “I will know you by name.” However, they all stem mainly from none other than יְדִיעָה [knowing] because one who has affection for another relates to him more closely and knows him. “And why do I have affection for him?","p":[{"q":"What does \"ידעתיו\" mean in the verse \"כי ידעתיו\"?","o":["Affection and closeness, since one who loves draws his beloved close and knows him","Hashem knows in advance what Avraham will do in the future","Hashem knows all of Avraham's thoughts"]}]},"18:19.2":{"e":"\"למען אשר יצוה\" explains why Hashem loves Avraham: because he commands his children to keep Hashem's ways. The explanation of Onkelos, that Hashem knows Avraham will command, does not fit the word \"למען\".","pe":"For I have given him special attention because he commands his children, and his household after him, and they will preserve the way of Adonoy, doing charity and justice, so that Adonoy will bring upon Avraham all that which He has spoken of him.","re":"because he commands. [I.e.,] because he commands his children about Me to keep My ways.” But, if you explain it as does Onkelos, the word לְמַעַן, then does not fit in that sense.","p":[{"q":"According to Rashi, what is the role of the words \"למען אשר יצוה\"?","o":["They explain why Hashem is fond of Avraham","They describe what Hashem knows Avraham will do in the future","They describe the purpose of Sedom's destruction"]}]},"18:19.3":{"e":"\"יצוה\" is in the present tense, meaning Avraham commands his children continually, like \"ככה יעשה איוב\".","pe":"For I have given him special attention because he commands his children, and his household after him, and they will preserve the way of Adonoy, doing charity and justice, so that Adonoy will bring upon Avraham all that which He has spoken of him.","re":"He commands. It is used here in the present tense as in: “This is what Iyov continually did,” [or] “According to God do they encamp.”","p":[{"q":"In which tense is the word \"יצוה\" said according to Rashi?","o":["Present: Avraham always commands his children","Future: Avraham will command only at the end of his days","Past: Avraham already commanded once"]}]},"18:19.4":{"e":"Avraham commands his children to keep Hashem's way so that Hashem will bring the blessing upon him. The verse says \"על אברהם\" and not \"על בית אברהם\", from which we learn that one who leaves behind a righteous son is considered as if he did not die.","pe":"For I have given him special attention because he commands his children, and his household after him, and they will preserve the way of Adonoy, doing charity and justice, so that Adonoy will bring upon Avraham all that which He has spoken of him.","re":"So that [He] will bring. Thus he commands his children: “Keep the way of God so that God will bring upon Avraham,” etc. It does not say “upon the house of Avraham” but, rather, “upon Avraham.” We learn from this that he who produces a righteous son is considered as not having died.","p":[{"q":"What does Rashi learn from the fact that it says \"על אברהם\" and not \"על בית אברהם\"?","o":["One who leaves behind a righteous son is as if he did not die","The blessing will be given only to Avraham and not to his children","Avraham's children will not merit the blessing without deeds"]}]},"18:20.1":{"e":"\"ויאמר ה'\" to Avraham: Hashem did as He had said, and did not hide from him what He was about to do in Sodom.","pe":"[Thus] Adonoy said, The wailing concerning Sedom and Amorah is so great, and their sin is so very grave.","re":"Adonoy said. To Avraham. That He [God] did as He said, [i.e.,] that He will not conceal from him.","p":[{"q":"To whom did Hashem speak about the outcry of Sodom, and why?","o":["To Avraham, as He had said He would not hide it from him","To the angels, in order to send them to Sodom","To Lot, so that he would have time to flee the city"]}]},"18:20.2":{"e":"Usually the word \"רבה\" is accented on the last syllable and means \"great\" or \"growing greater.\" Here the accent is on the first syllable, so it means that the outcry has already grown great.","pe":"[Thus] Adonoy said, The wailing concerning Sedom and Amorah is so great, and their sin is so very grave.","re":"Is so great. Wherever רָבָּה appears in Scripture the accent is on the latter syllable—the letter ב because they are translated as “great” or “becoming great.” Whereas, [regarding] this one, the former syllable is accented on the letter ר because it is translated that it had already become great as I have previously explained: “The sun set,” and, similarly: “Behold your sister has returned.”","p":[{"q":"What does the placement of the accent in the word \"רבה\" teach here?","o":["That the outcry has already grown great, in the past tense","That the outcry keeps growing all the time","That the outcry is greater than any other outcry"]}]},"18:21.1":{"e":"Hashem knows everything, yet He said \"ארדה נא\" in order to teach judges not to rule in capital cases without seeing for themselves. Another explanation: I will go down to see the end of their deeds.","pe":"I will descend now and see, if their wailing which has come to Me is indicative of their conduct; destruction [shall come upon them]. If not I will know.","re":"I will descend now. This is [only] to serve as a lesson to judges not to rule on matters of capital punishment unless they see it. All as I have explained in the Parshah dealing with the “dispersion.” Another explanation: “I will fathom the depths of their deeds.”","p":[{"q":"Why did Hashem say \"ארדהנא ואראה\" when He knows everything?","o":["To teach judges not to rule in capital cases without evidence","To give the people of Sodom time to repent","Because Hashem wanted the angels to see their deeds"]},{"q":"According to the second explanation, what does \"ארדהנא\" mean?","o":["I will examine the end of their deeds in depth","I will actually descend from heaven to Sodom","I will send angels to see in My place"]}]},"18:21.2":{"e":"\"הכצעקתה\" refers to the outcry of the city, that is, of Sodom.","pe":"I will descend now and see, if their wailing which has come to Me is indicative of their conduct; destruction [shall come upon them]. If not I will know.","re":"If their wailing. Of the country.","p":[{"q":"According to Rashi, whose outcry is meant by the word \"הכצעקתה\"?","o":["That of the city, Sodom","That of Sarah, who laughed earlier","That of the whole land"]}]},"18:21.3":{"e":"If the people of Sodom continue in their rebellion, Hashem will destroy them, and if not, Hashem will know how to punish them with suffering without wiping them out. Our Sages taught that \"צעקתה\" is the outcry of a girl who was put to a harsh death because she gave food to a poor person.","pe":"I will descend now and see, if their wailing which has come to Me is indicative of their conduct; destruction [shall come upon them]. If not I will know.","re":"Which has come to Me is indicative of their conduct. And [if] they maintain their rebelliousness I will make an end of them. But, “if [they do] not” maintain their rebelliousness “I will know” what to do punishing them [only] with suffering so that I [need] not destroy them. Similarly we find in another place, “Now, remove your ornaments from yourself so that I may know what to do to you.” Therefore, there is a separation of a פְּסִיק between עָשׂוּ and כָּלָה in order to pause between one word and the next. Our Sages explained הַכְּצַעֲקָתָהּ [as referring to] the cry of a certain maiden whom they killed with a horrible death because she gave food to a poor person as is explained in Chapter Chelek.","p":[{"q":"What does \"עשו כלה ואםלא אדעה\" mean according to Rashi?","o":["If they continue in their rebellion I will destroy them, and if not, I will punish them with suffering","If they have done evil I will destroy them, and if not, I will forgive them completely","I will destroy them in any case, and afterwards I will know what they did"]},{"q":"According to the Sages' teaching, why is \"הכצעקתה\" in the singular?","o":["It is the outcry of a girl who was put to death because she gave food to a poor person","It is the outcry of the whole city united in prayer","It is the outcry of Lot's wife, who was punished"]}]},"18:22.1":{"e":"\"ויפנו משם\" means that the men turned away from the place to which Avraham had accompanied them.","pe":"The men turned from where they were, and went toward Sedom. Avraham was still standing before Adonoy.","re":"They [the men] turned from where they were. [I.e.,] from the place to which Avraham accompanied them.","p":[{"q":"From which place did the men turn, according to Rashi?","o":["From the place to which Avraham had accompanied them","From the tent of Avraham and Sarah","From the gate of the city of Sodom"]}]},"18:22.2":{"e":"Avraham did not go to stand before Hashem; rather, Hashem came to him, so it should have been written \"וה' עודנו עומד על אברהם.\" The wording in the Torah is a correction of the scribes.","pe":"The men turned from where they were, and went toward Sedom. Avraham was still standing before Adonoy.","re":"Avraham was still standing before Adonoy. But is it not so that he [Avraham] did not go to stand before Him? Rather, it was God who came to him and said to him, “The wailing concerning Sedom and Amorah is so great,” and it should have been written: “God was still standing near Avraham,” but, it is an emendation of the Scribes.","p":[{"q":"What bothers Rashi about the words \"ואברהם עודנו עמד לפני יהוה\"?","o":["Hashem came to Avraham, so it should have said that Hashem was standing","Avraham went with the angels and did not stay in place","Avraham was not worthy of standing before Hashem"]}]},"18:23.1":{"e":"The word \"הגשה\" (approach) appears in Tanach in the sense of war, appeasement, and prayer. Avraham approached in all these ways: to speak harshly, to appease, and to pray.","pe":"Avraham came forward and said, Will You [actually] destroy the righteous with the wicked ?","re":"Avraham came forward. We find the term הַגָּשָׁה [approach] to wage war: “Yoav approached,” etc., and הַגָּשָׁה used to denote “entreaty”: “Yehudah approached him,” and הַגָּשָׁה to denote prayer: “Eliyahu the Prophet approached.” Avraham’s “approaching” was for all these: 1) to speak sternly, 2) to entreat and 3) to pray.","p":[{"q":"For what purpose did Avraham \"ויגש\" according to Rashi?","o":["To speak harshly, to appease, and to pray, all together","Only to pray for the people of Sodom","Only to come physically close to where Hashem stood"]}]},"18:23.2":{"e":"\"האף תספה\" means \"הגם תספה,\" that is, will You also destroy the righteous with the wicked? According to Onkelos, \"אף\" is anger: will anger lead You to destroy the righteous with the wicked?","pe":"Avraham came forward and said, Will You [actually] destroy the righteous with the wicked ?","re":"Will You destroy? [Meaning:] Would you destroy? According to Onkelos who translated it as meaning anger this is its explanation: Would Your anger sway You that You would destroy the righteous with the wicked?","p":[{"q":"According to the first explanation, what does \"האף תספה\" mean?","o":["Will You also destroy?","Will You destroy in anger?","Have You already destroyed?"]},{"q":"According to the translation of Onkelos, what does \"האף\" mean here?","o":["Anger: will anger lead You to destroy the righteous?","Also: will the righteous also be destroyed?","Truly: will You truly destroy everyone?"]}]},"18:24.1":{"e":"Avraham asked for fifty righteous people, ten for each of the five cities. And if Hashem were to say that the righteous will not save the wicked, Avraham asks: at least why put the righteous to death?","pe":"Suppose there are fifty righteous people in the midst of the city, will You still destroy it, and not bear with the place for the sake of the fifty righteous people inside it?","re":"Suppose there are fifty righteous people. Ten righteous for each city, because there were five places. And if You will respond that the righteous will not save the wicked [but,] why should the righteous die?","p":[{"q":"Why did Avraham specifically ask about \"חמשים צדיקם\"?","o":["Ten righteous people for each of the five cities","Because that was the number of righteous people in Sodom","Because fifty righteous people save the whole world"]}]},"18:25.1":{"e":"\"חלילה לך\" means that this would be profane and disgraceful for You, since people would say that Hashem's way is to wash away everyone, righteous and wicked, as He did to the generation of the Flood and the generation of the Dispersion.","pe":"It would be sacrilege [to attribute] to You such an act, to kill the righteous with the wicked, treating the righteous and the wicked alike. It would be sacrilege to attribute this to You : Shall the Judge of all the earth not do justice?","re":"It would be sacrilege [to attribute] to You. [I.e.,] it is profane for You. It will be said: This is His craft, to destroy everything, the righteous as well as the wicked. This is what you did to the Flood generation, and to the Dispersion generation.","p":[{"q":"What is the disgrace in this matter according to Rashi on \"חללה לך\"?","o":["People would say that Hashem's way is to wash away the righteous and the wicked together","People would say that Hashem does not know who is righteous and who is wicked","People would say that Hashem does not keep His promises to Avraham"]}]},"18:25.2":{"e":"\"כדבר הזה\" means: not this very thing, and not anything similar to it.","pe":"It would be sacrilege [to attribute] to You such an act, to kill the righteous with the wicked, treating the righteous and the wicked alike. It would be sacrilege to attribute this to You : Shall the Judge of all the earth not do justice?","re":"Such an act. [Meaning] neither this nor anything like it.","p":[{"q":"Why does it say \"כדבר הזה\" and not simply \"הדבר הזה\"?","o":["To say: not this thing and not anything like it","To say that this is something that already happened in the past","To say that the punishment would be similar to the Flood"]}]},"18:25.3":{"e":"The second \"חלילה לך\" refers to the World to Come: it wou
