רוג ממנהגו הרגיל.", "kp": ["הוא בעצמו", "שהאהבה מקלקלת השורה"]}]}, {"id": "22:3.3", "ch": 22, "v": 3, "n": 3, "dh": "את שני נעריו", "pasuk_html": "וַיַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּבֹּ֗קֶר וַֽיַּחֲבֹשׁ֙ אֶת־חֲמֹר֔וֹ וַיִּקַּ֞ח <mark>אֶת־שְׁנֵ֤י נְעָרָיו֙</mark> אִתּ֔וֹ וְאֵ֖ת יִצְחָ֣ק בְּנ֑וֹ וַיְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַיָּ֣קָם וַיֵּ֔לֶךְ אֶל־הַמָּק֖וֹם אֲשֶׁר־אָֽמַר־ל֥וֹ הָאֱלֹהִֽים׃", "pasuk_en": "וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ וַיִּקַּח אֶת־שְׁנֵי נְעָרָיו אִתּוֹ וְאֵת יִצְחָק בְּנוֹ וַיְבַקַּע עֲצֵי עֹלָה וַיָּקָם וַיֵּלֶךְ אֶל־הַמָּקוֹם אֲשֶׁר־אָמַר־לוֹ הָאֱלֹהִים׃", "rashi_he": "את שני נעריו. יִשְׁמָעֵאל וֶאֱלִיעֶזֶר, שֶׁאֵין אָדָם חָשׁוּב רַשַּׁאי לָצֵאת לַדֶּרֶךְ בְּלֹא ב' אֲנָשִׁים (בראשית רבה), שֶׁאִם יִצְטָרֵךְ הָאֶחָד לִנְקָבָיו וְיִתְרַחֵק, יִהְיֶה הַשֵּׁנִי עִמּוֹ:", "rashi_en": "שני הנערים היו ישמעאל ואליעזר. אדם חשוב לא יוצא לדרך בלי שני אנשים, כדי שאם אחד יתרחק לצרכיו, השני יישאר איתו.", "note": "", "points": [{"q": "מַדּוּעַ לָקַח אַבְרָהָם אִיתוֹ דַּוְוקָא שְׁנֵי נְעָרִים?", "options": ["אָדָם חָשׁוּב לֹא יוֹצֵא לַדֶּרֶךְ בְּלִי שְׁנֵי מְלַוִּוים", "כִּי הָיָה צָרִיךְ שְׁנַיִים כְּדֵי לִסְחֹוב אֶת הָעֵצִים", "כְּדֵי שֶׁשְּׁנַייִם יָעִידוּ אַחַר כָּךְ עַל הָעֲקֵידָה"], "kasha": "מדוע מציין הפסוק שלקח \"שני\" נערים, ומי הם?", "answer": "הם ישמעאל ואליעזר, ואדם חשוב לא יוצא לדרך בלי שני אנשים, כדי שאם אחד יתרחק לצרכיו השני יישאר עמו.", "kp": ["ישמעאל ואליעזר", "בלא ב' אנשים"]}]}, {"id": "22:3.4", "ch": 22, "v": 3, "n": 4, "dh": "ויבקע", "pasuk_html": "וַיַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּבֹּ֗קֶר וַֽיַּחֲבֹשׁ֙ אֶת־חֲמֹר֔וֹ וַיִּקַּ֞ח אֶת־שְׁנֵ֤י נְעָרָיו֙ אִתּ֔וֹ וְאֵ֖ת יִצְחָ֣ק בְּנ֑וֹ <mark>וַיְבַקַּע֙</mark> עֲצֵ֣י עֹלָ֔ה וַיָּ֣קָם וַיֵּ֔לֶךְ אֶל־הַמָּק֖וֹם אֲשֶׁר־אָֽמַר־ל֥וֹ הָאֱלֹהִֽים׃", "pasuk_en": "וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ וַיִּקַּח אֶת־שְׁנֵי נְעָרָיו אִתּוֹ וְאֵת יִצְחָק בְּנוֹ וַיְבַקַּע עֲצֵי עֹלָה וַיָּקָם וַיֵּלֶךְ אֶל־הַמָּקוֹם אֲשֶׁר־אָמַר־לוֹ הָאֱלֹהִים׃", "rashi_he": "ויבקע. תַּרְגּוּם וְצַלַּח, כְּמוֹ וְצָלְחוּ הַיַּרְדֵּן (שמואל ב' י\"ט), לְשׁוֹן בִּקּוּעַ, פינדר\"א בלע\"ז:", "rashi_en": "\"ויבקע\" פירושו חתך ופילח את העצים, כפי שתרגם אונקלוס \"וצלח\", מלשון בקיעה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"וַיְבַקַּע\" בַּפָּסוּק?", "options": ["חָתַךְ וּפִילַּח אֶת הָעֵצִים לַחֲתִיכוֹת", "אָסַף עֵצִים יְבֵשִׁים מִן הַשָּׂדֶה", "קָשַׁר אֶת הָעֵצִים לַחֲבִילָה אַחַת"], "kasha": "מה פירוש המילה \"ויבקע\" לגבי העצים?", "answer": "אונקלוס תרגם \"וצלח\", כמו \"וצלחו הירדן\", והוא לשון בקיעה וחיתוך.", "kp": ["תרגום וצלח", "לשון בקוע"]}]}, {"id": "22:4.1", "ch": 22, "v": 4, "n": 1, "dh": "ביום השלישי", "pasuk_html": "<mark>בַּיּ֣וֹם הַשְּׁלִישִׁ֗י</mark> וַיִּשָּׂ֨א אַבְרָהָ֧ם אֶת־עֵינָ֛יו וַיַּ֥רְא אֶת־הַמָּק֖וֹם מֵרָחֹֽק׃", "pasuk_en": "בַּיּוֹם הַשְּׁלִישִׁי וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא אֶת־הַמָּקוֹם מֵרָחֹק׃", "rashi_he": "ביום השלישי. לָמָה אֵחַר מִלְּהַרְאוֹתוֹ מִיָּד? כְּדֵי שֶׁלֹּא יֹאמְרוּ הֲמָמוֹ וְעִרְבְּבוֹ פִּתְאוֹם וְטָרַף דַּעְתּוֹ, וְאִלוּ הָיָה לוֹ שָׁהוּת לְהִמָּלֵךְ אֶל לִבּוֹ לֹא הָיָה עוֹשֶׂה:", "rashi_en": "ה' השהה את הגילוי עד היום השלישי, כדי שלא יאמרו שאברהם עשה את המעשה בבלבול פתאומי, ושאילו היה לו זמן לחשוב לא היה עושה זאת.", "note": "", "points": [{"q": "לָמָּה הֶרְאָה ה' אֶת הַמָּקוֹם לְאַבְרָהָם רַק בַּיּוֹם הַשְּׁלִישִׁי?", "options": ["שֶׁלֹּא יֹאמְרוּ שֶׁעָשָׂה זֹאת בְּבִלְבּוּל, בְּלִי זְמַן לַחְשֹׁוב", "כִּי הַמָּקוֹם הָיָה רָחוֹק וְנִדְרְשׁוּ שְׁלוֹשָׁה יְמֵי הֲלִיכָה", "כְּדֵי שֶׁיִּצְחָק יַסְפִּיק לְהִתְכּוֹנֵן לַקָּרְבָּן"], "kasha": "למה עיכב ה' את הראיית המקום ולא הראה אותו לאברהם מיד?", "answer": "כדי שלא יאמרו שה' הבהיל ובלבל אותו פתאום ושיבש את דעתו, ושאילו היה לו זמן לשקול לא היה עושה זאת.", "kp": ["למה אחר מלהראותו מיד", "שלא יאמרו הממו וערבבו פתאום", "להמלך אל לבו"]}]}, {"id": "22:4.2", "ch": 22, "v": 4, "n": 2, "dh": "וירא את המקום", "pasuk_html": "בַּיּ֣וֹם הַשְּׁלִישִׁ֗י וַיִּשָּׂ֨א אַבְרָהָ֧ם אֶת־עֵינָ֛יו <mark>וַיַּ֥רְא אֶת־הַמָּק֖וֹם</mark> מֵרָחֹֽק׃", "pasuk_en": "בַּיּוֹם הַשְּׁלִישִׁי וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא אֶת־הַמָּקוֹם מֵרָחֹק׃", "rashi_he": "וירא את המקום. רָאָה עָנָן קָשׁוּר עַל הָהָר:", "rashi_en": "אברהם זיהה את המקום כי ראה ענן קשור על ההר.", "note": "", "points": [{"q": "אֵיךְ זִיהָה אַבְרָהָם אֶת הַמָּקוֹם מֵרָחוֹק?", "options": ["רָאָה עָנָן קָשׁוּר עַל הָהָר", "רָאָה מִזְבֵּחַ עַתִּיק בְּרֹאשׁ הָהָר", "מַלְאָךְ הִצְבִּיעַ לוֹ עַל הָהָר"], "kasha": "איך ידע אברהם שזה המקום, והרי ה' לא אמר לו את שמו?", "answer": "הוא ראה ענן קשור על ההר.", "kp": ["ראה ענן קשור על ההר"]}]}, {"id": "22:5.1", "ch": 22, "v": 5, "n": 1, "dh": "עד כה", "pasuk_html": "וַיֹּ֨אמֶר אַבְרָהָ֜ם אֶל־נְעָרָ֗יו שְׁבוּ־לָכֶ֥ם פֹּה֙ עִֽם־הַחֲמ֔וֹר וַאֲנִ֣י וְהַנַּ֔עַר נֵלְכָ֖ה <mark>עַד־כֹּ֑ה</mark> וְנִֽשְׁתַּחֲוֶ֖ה וְנָשׁ֥וּבָה אֲלֵיכֶֽם׃", "pasuk_en": "וַיֹּאמֶר אַבְרָהָם אֶל־נְעָרָיו שְׁבוּ־לָכֶם פֹּה עִם־הַחֲמוֹר וַאֲנִי וְהַנַּעַר נֵלְכָה עַד־כֹּה וְנִשְׁתַּחֲוֶה וְנָשׁוּבָה אֲלֵיכֶם׃", "rashi_he": "עד כה. כְּלוֹמַר דֶּרֶךְ מֻעָט לַמָּקוֹם אֲשֶׁר לְפָנֵינוּ. וּמִ\"אַ אֶרְאֶה הֵיכָן הוּא מַה שֶּׁאָמַר לִי הַמָּקוֹם כֹּה יִהְיֶה זַרְעֶךָ:", "rashi_en": "לפי הפשט \"עד כה\" פירושו מרחק קצר, עד המקום שלפנינו. לפי המדרש אמר אברהם: אלך לראות היכן מתקיימת הבטחת ה' \"כה יהיה זרעך\".", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"עַדְכָּה\" לְפִי הַפְּשָׁט?", "options": ["מֶרְחָק קָצָר, עַד הַמָּקוֹם שֶׁלְּפָנֵינוּ", "עַד שֶׁתִּשְׁקַע הַשֶּׁמֶשׁ וְיָבוֹא הַלַּיְלָה", "עַד סוֹף הַדֶּרֶךְ הָאֲרֻוכָּה שֶׁנּוֹתְרָה"], "kasha": "המילה \"כה\" סתמית, ולא ברור עד היכן התכוון אברהם ללכת.", "answer": "כלומר דרך מעט, עד המקום שנמצא לפנינו.", "kp": ["דרך מעט למקום אשר לפנינו"]}, {"q": "לְפִי הַמִּדְרָשׁ, לָמָּה רָמַז אַבְרָהָם בַּמִּילָּה \"כֹּה\"?", "options": ["לְהַבְטָחַת ה' \"כֹּה יִהְיֶה זַרְעֶךָ\"", "לְצִיוּוּי ה' \"קַח נָא אֶת בִּנְךָ\"", "לְמִסְפַּר הַיָּמִים שֶׁהָלְכוּ בַּדֶּרֶךְ"], "kasha": "מדוע בחר אברהם דווקא במילה \"כה\"?", "answer": "אברהם אמר: אראה היכן היא ההבטחה שאמר לי ה' \"כה יהיה זרעך\".", "kp": ["כה יהיה זרעך"]}]}, {"id": "22:5.2", "ch": 22, "v": 5, "n": 2, "dh": "ונשובה", "pasuk_html": "וַיֹּ֨אמֶר אַבְרָהָ֜ם אֶל־נְעָרָ֗יו שְׁבוּ־לָכֶ֥ם פֹּה֙ עִֽם־הַחֲמ֔וֹר וַאֲנִ֣י וְהַנַּ֔עַר נֵלְכָ֖ה עַד־כֹּ֑ה וְנִֽשְׁתַּחֲוֶ֖ה <mark>וְנָשׁ֥וּבָה</mark> אֲלֵיכֶֽם׃", "pasuk_en": "וַיֹּאמֶר אַבְרָהָם אֶל־נְעָרָיו שְׁבוּ־לָכֶם פֹּה עִם־הַחֲמוֹר וַאֲנִי וְהַנַּעַר נֵלְכָה עַד־כֹּה וְנִשְׁתַּחֲוֶה וְנָשׁוּבָה אֲלֵיכֶם׃", "rashi_he": "ונשובה. נִתְנַבֵּא שֶׁיָּשׁוּבוּ שְׁנֵיהֶם:", "rashi_en": "אברהם אמר \"ונשובה\" בלשון רבים, כי ניבא בלי משים ששניהם, הוא ויצחק, יחזרו.", "note": "", "points": [{"q": "מַדּוּעַ אָמַר אַבְרָהָם \"וְנָשׁוּבָה\" בִּלְשׁוֹן רַבִּים, וַהֲרֵי הָלַךְ לִשְׁחוֹט אֶת יִצְחָק?", "options": ["נִתְנַבֵּא שֶׁשְּׁנֵיהֶם יַחְזְרוּ בְּשָׁלוֹם", "כְּדֵי לְהַרְגִּיעַ אֶת הַנְּעָרִים שֶׁלֹּא יִדְאֲגוּ", "כִּי הִתְכַּווֵּן לַחֲזוֹר עִם הַנְּעָרִים בִּלְבַד"], "kasha": "אברהם הלך להקריב את יצחק, ואיך אמר שישובו שניהם?", "answer": "אברהם נתנבא ששניהם ישובו.", "kp": ["נתנבא שישובו שניהם"]}]}, {"id": "22:6.1", "ch": 22, "v": 6, "n": 1, "dh": "המאכלת", "pasuk_html": "וַיִּקַּ֨ח אַבְרָהָ֜ם אֶת־עֲצֵ֣י הָעֹלָ֗ה וַיָּ֙שֶׂם֙ עַל־יִצְחָ֣ק בְּנ֔וֹ וַיִּקַּ֣ח בְּיָד֔וֹ אֶת־הָאֵ֖שׁ וְאֶת־<mark>הַֽמַּאֲכֶ֑לֶת</mark> וַיֵּלְכ֥וּ שְׁנֵיהֶ֖ם יַחְדָּֽו׃", "pasuk_en": "וַיִּקַּח אַבְרָהָם אֶת־עֲצֵי הָעֹלָה וַיָּשֶׂם עַל־יִצְחָק בְּנוֹ וַיִּקַּח בְּיָדוֹ אֶת־הָאֵשׁ וְאֶת־הַמַּאֲכֶלֶת וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו׃", "rashi_he": "המאכלת. סַכִּין, עַל שֵׁם שֶׁאוֹכֶלֶת אֶת הַבָּשָׂר, כְּמָה דְתֵימָא וְחַרְבִּי תֹּאכַל בָּשָׂר (דברים ל\"ב), וְשֶׁמַּכְשֶׁרֶת בָּשָׂר לַאֲכִילָה. דָּ\"אַ זֹאת נִקְרֵאת מַאֲכֶלֶת עַל שֵׁם שֶׁיִּשְׂרָאֵל אוֹכְלִים מַתַּן שְׂכָרָהּ:", "rashi_en": "הסכין נקראת \"מאכלת\" כי היא אוכלת את הבשר ומכשירה אותו לאכילה. פירוש נוסף: סכין העקידה נקראת כך כי ישראל אוכלים את שכר המעשה הזה.", "note": "", "points": [{"q": "מַדּוּעַ נִקְרֵאת הַסַּכִּין \"מַאֲכֶלֶת\"?", "options": ["כִּי הִיא אוֹכֶלֶת אֶת הַבָּשָׂר וּמַכְשִׁירָה אוֹתוֹ לַאֲכִילָה", "כִּי מִשְׁתַּמְּשִׁים בָּהּ רַק בִּשְׁעַת הַסְּעוּדָה", "כִּי הִיא עֲשׂוּיָה מִבַּרְזֶל חַד בְּמְיֻוחָד"], "kasha": "מה פירוש \"המאכלת\" ומה הקשר בין השם הזה לסכין?", "answer": "זו סכין, ונקראת כך כי היא אוכלת את הבשר, כמו \"וחרבי תאכל בשר\", וגם כי היא מכשירה בשר לאכילה.", "kp": ["על שם שאוכלת את הבשר", "ושמכשרת בשר לאכילה"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי, מַה מְיֻוחָד בְּשֵׁם \"מַאֲכֶלֶת\" שֶׁל סַכִּין הָעֲקֵידָה?", "options": ["יִשְׂרָאֵל אוֹכְלִים אֶת שְׂכַר מַעֲשֵׂה הָעֲקֵידָה", "בָּהּ נִשְׁחַט הָאַיִל וְנֶאֱכַל בְּשָׂרוֹ", "בָּהּ חָתַךְ אַבְרָהָם לֶחֶם אַחֲרֵי הָעֲקֵידָה"], "kasha": "מדוע נקראת הסכין הזו דווקא בשם \"המאכלת\"?", "answer": "היא נקראת מאכלת כי ישראל אוכלים את מתן שכרה של העקידה.", "kp": ["שישראל אוכלים מתן שכרה"]}]}, {"id": "22:6.2", "ch": 22, "v": 6, "n": 2, "dh": "וילכו שניהם יחדו", "pasuk_html": "וַיִּקַּ֨ח אַבְרָהָ֜ם אֶת־עֲצֵ֣י הָעֹלָ֗ה וַיָּ֙שֶׂם֙ עַל־יִצְחָ֣ק בְּנ֔וֹ וַיִּקַּ֣ח בְּיָד֔וֹ אֶת־הָאֵ֖שׁ וְאֶת־הַֽמַּאֲכֶ֑לֶת <mark>וַיֵּלְכ֥וּ שְׁנֵיהֶ֖ם יַחְדָּֽו׃</mark>", "pasuk_en": "וַיִּקַּח אַבְרָהָם אֶת־עֲצֵי הָעֹלָה וַיָּשֶׂם עַל־יִצְחָק בְּנוֹ וַיִּקַּח בְּיָדוֹ אֶת־הָאֵשׁ וְאֶת־הַמַּאֲכֶלֶת וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו׃", "rashi_he": "וילכו שניהם יחדו. אַבְרָהָם שֶׁהָיָה יוֹדֵעַ שֶׁהוֹלֵךְ לִשְׁחֹט אֶת בְּנוֹ הָיָה הוֹלֵךְ בְּרָצוֹן וְשִׂמְחָה כְּיִצְחָק, שֶׁלֹּא הָיָה מַרְגִּישׁ בַּדָּבָר:", "rashi_en": "אף שאברהם ידע שהוא הולך לשחוט את בנו, הוא הלך ברצון ובשמחה בדיוק כמו יצחק, שלא ידע דבר.", "note": "", "points": [{"q": "מַה הַחִידּוּשׁ בְּ\"וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו\" כָּאן?", "options": ["אַבְרָהָם הָלַךְ בְּשִׂמְחָה כְּיִצְחָק, אַף שֶׁיָּדַע הַכֹּל", "שְׁנֵיהֶם הָלְכוּ צְמוּדִים כְּדֵי לֹא לָלֶכֶת לְאִיבּוּד", "יִצְחָק כְּבָר יָדַע שֶׁהוּא הוֹלֵךְ לְהִישָּׁחֵט"], "kasha": "ברור שהלכו יחד, ולמה הפסוק צריך לומר זאת?", "answer": "אברהם, שידע שהוא הולך לשחוט את בנו, הלך ברצון ובשמחה כמו יצחק, שלא הרגיש בדבר.", "kp": ["היה הולך ברצון ושמחה כיצחק", "שלא היה מרגיש בדבר"]}]}, {"id": "22:8.1", "ch": 22, "v": 8, "n": 1, "dh": "יראה לו השה", "pasuk_html": "וַיֹּ֙אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים <mark>יִרְאֶה־לּ֥וֹ הַשֶּׂ֛ה</mark> לְעֹלָ֖ה בְּנִ֑י וַיֵּלְכ֥וּ שְׁנֵיהֶ֖ם יַחְדָּֽו׃", "pasuk_en": "וַיֹּאמֶר אַבְרָהָם אֱלֹהִים יִרְאֶה־לּוֹ הַשֶּׂה לְעֹלָה בְּנִי וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו׃", "rashi_he": "יראה לו השה. כְּלוֹמַר יִרְאֶה וְיִבְחַר לוֹ הַשֶּׂה, וְאִם אֵין שֶׂה, לעולה בני. וְאַף עַל פִּי שֶׁהֵבִין יִצְחָק שֶׁהוּא הוֹלֵךְ לְהִשָּׁחֵט,", "rashi_en": "אברהם ענה ליצחק: ה' יבחר לו שה, ואם לא יהיה שה, אתה בני תהיה העולה. מכאן הבין יצחק שהוא הולך להישחט.", "note": "", "points": [{"q": "מַה כַּווָּנַת אַבְרָהָם בִּתְשׁוּבָתוֹ \"יִרְאֶהלּוֹ הַשֶּׂה לְעֹלָה בְּנִי\"?", "options": ["ה' יִבְחַר שֶׂה, וְאִם אֵין שֶׂה, בְּנִי הוּא הָעֹולָה", "ה' כְּבָר הֵכִין שֶׂה שֶׁמְּחַכֶּה בְּרֹאשׁ הָהָר", "בְּנִי, אַתָּה תִּבְחַר אֶת הַשֶּׂה לָעֹולָה"], "kasha": "תשובת אברהם נשמעת סתומה, ולא ברור מה פירוש \"לעלה בני\".", "answer": "כלומר ה' יראה ויבחר לו את השה, ואם אין שה, בני הוא העולה.", "kp": ["יראה ויבחר לו השה", "ואם אין שה, לעולה בני"]}]}, {"id": "22:8.2", "ch": 22, "v": 8, "n": 2, "dh": "וילכו שניהם יחדו", "pasuk_html": "וַיֹּ֙אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים יִרְאֶה־לּ֥וֹ הַשֶּׂ֛ה לְעֹלָ֖ה בְּנִ֑י <mark>וַיֵּלְכ֥וּ שְׁנֵיהֶ֖ם יַחְדָּֽו׃</mark>", "pasuk_en": "וַיֹּאמֶר אַבְרָהָם אֱלֹהִים יִרְאֶה־לּוֹ הַשֶּׂה לְעֹלָה בְּנִי וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו׃", "rashi_he": "וילכו שניהם יחדו. בְּלֵב שָׁוֶה:", "rashi_en": "אף שיצחק הבין עכשיו שהוא הולך להישחט, הם המשיכו ללכת יחד בלב שווה.", "note": "", "points": [{"q": "מַה מְלַמֵּד \"וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו\" בַּפַּעַם הַשְּׁנִיָּיה?", "options": ["אַף שֶׁיִּצְחָק הֵבִין שֶׁייִּשָּׁחֵט, הָלְכוּ בְּלֵב שָׁוֶוה", "שֶׁהִמְשִׁיכוּ לָלֶכֶת בְּלִי לְדַבֵּר זֶה עִם זֶה", "שֶׁיִּצְחָק הִתְחִיל לָלֶכֶת לִפְנֵי אָבִיו"], "kasha": "הפסוק כבר אמר קודם \"וילכו שניהם יחדו\", ומדוע הוא חוזר על כך?", "answer": "אף על פי שיצחק הבין שהוא הולך להישחט, הלכו שניהם יחד בלב שווה.", "kp": ["בלב שוה"]}]}, {"id": "22:9.1", "ch": 22, "v": 9, "n": 1, "dh": "ויעקד", "pasuk_html": "וַיָּבֹ֗אוּ אֶֽל־הַמָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר־ל֣וֹ הָאֱלֹהִים֒ וַיִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת־הַמִּזְבֵּ֔חַ וַֽיַּעֲרֹ֖ךְ אֶת־הָעֵצִ֑ים <mark>וַֽיַּעֲקֹד֙</mark> אֶת־יִצְחָ֣ק בְּנ֔וֹ וַיָּ֤שֶׂם אֹתוֹ֙ עַל־הַמִּזְבֵּ֔חַ מִמַּ֖עַל לָעֵצִֽים׃", "pasuk_en": "וַיָּבֹאוּ אֶל־הַמָּקוֹם אֲשֶׁר אָמַר־לוֹ הָאֱלֹהִים וַיִּבֶן שָׁם אַבְרָהָם אֶת־הַמִּזְבֵּחַ וַיַּעֲרֹךְ אֶת־הָעֵצִים וַיַּעֲקֹד אֶת־יִצְחָק בְּנוֹ וַיָּשֶׂם אֹתוֹ עַל־הַמִּזְבֵּחַ מִמַּעַל לָעֵצִים׃", "rashi_he": "ויעקד. יָדָיו וְרַגְלָיו מֵאֲחוֹרָיו; הַיָּדַיִם וְרַגְלַיִם בְּיַחַד הִיא עֲקִידָה (שבת נ\"ד), וְהוּא לְשׁוֹן עֲקֻדִּים, שֶׁהָיוּ קַרְסוּלֵיהֶם לְבָנִים, מָקוֹם שֶׁעוֹקְדִין אוֹתָן בּוֹ הָיָה נִכָּר:", "rashi_en": "\"ויעקד\" פירושו שקשר את ידיו ורגליו של יצחק יחד מאחוריו. זו העקידה, ומכאן גם \"עקדים\", שהיה ניכר בהם מקום הקשירה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"וַיַּעֲקֹד\" בַּפָּסוּק?", "options": ["קָשַׁר אֶת יָדָיו וְרַגְלָיו יַחַד מֵאַחֲורָיו", "קָשַׁר אֶת יָדָיו בִּלְבַד לִפְנֵי גוּפוֹ", "הִשְׁכִּיב אוֹתוֹ עַל הַמִּזְבֵּחַ בְּלִי לִקְשׁוֹר"], "kasha": "מה פירוש המילה \"ויעקד\", ובמה היא שונה מקשירה רגילה?", "answer": "קשר את ידיו ורגליו מאחוריו, כי קשירת ידיים ורגליים יחד היא עקידה.", "kp": ["ידיו ורגליו מאחוריו", "הידים ורגלים ביחד היא עקידה"]}]}, {"id": "22:11.1", "ch": 22, "v": 11, "n": 1, "dh": "אברהם אברהם", "pasuk_html": "וַיִּקְרָ֨א אֵלָ֜יו מַלְאַ֤ךְ יְהוָה֙ מִן־הַשָּׁמַ֔יִם וַיֹּ֖אמֶר <mark>אַבְרָהָ֣ם ׀ אַבְרָהָ֑ם</mark> וַיֹּ֖אמֶר הִנֵּֽנִי׃", "pasuk_en": "וַיִּקְרָא אֵלָיו מַלְאַךְ יְהוָה מִן־הַשָּׁמַיִם וַיֹּאמֶר אַבְרָהָם אַבְרָהָם וַיֹּאמֶר הִנֵּנִי׃", "rashi_he": "אברהם אברהם. לְשׁוֹן חִבָּה הוּא, שֶׁכּוֹפֵל אֶת שְׁמוֹ:", "rashi_en": "המלאך קרא לאברהם פעמיים בשמו, וכפילות השם היא לשון של חיבה.", "note": "", "points": [{"q": "מַדּוּעַ קָרָא הַמַּלְאָךְ \"אַבְרָהָם\" פַּעֲמַיִים?", "options": ["כֶּפֶל הַשֵּׁם הוּא בִּיטּוּי שֶׁל חִיבָּה", "כִּי אַבְרָהָם לֹא שָׁמַע בַּפַּעַם הָרִאשׁוֹנָה", "כְּדֵי לְהַזְהִיר אוֹתוֹ בְּקוֹל חָזָק וּבְכַעַס"], "kasha": "למה חזר המלאך על שמו של אברהם פעמיים?", "answer": "זו לשון חיבה, שכופל את שמו.", "kp": ["לשון חבה הוא", "שכופל את שמו"]}]}, {"id": "22:12.1", "ch": 22, "v": 12, "n": 1, "dh": "אל תשלח", "pasuk_html": "וַיֹּ֗אמֶר <mark>אַל־תִּשְׁלַ֤ח</mark> יָֽדְךָ֙ אֶל־הַנַּ֔עַר וְאַל־תַּ֥עַשׂ ל֖וֹ מְא֑וּמָּה כִּ֣י ׀ עַתָּ֣ה יָדַ֗עְתִּי כִּֽי־יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְלֹ֥א חָשַׂ֛כְתָּ אֶת־בִּנְךָ֥ אֶת־יְחִידְךָ֖ מִמֶּֽנִּי׃", "pasuk_en": "וַיֹּאמֶר אַל־תִּשְׁלַח יָדְךָ אֶל־הַנַּעַר וְאַל־תַּעַשׂ לוֹ מְאוּמָּה כִּי עַתָּה יָדַעְתִּי כִּי־יְרֵא אֱלֹהִים אַתָּה וְלֹא חָשַׂכְתָּ אֶת־בִּנְךָ אֶת־יְחִידְךָ מִמֶּנִּי׃", "rashi_he": "אל תשלח. לִשְׁחֹט; אָמַר לוֹ אִם כֵּן לְחִנָּם בָּאתִי לְכָאן, אֶעֱשֶׂה בּוֹ חַבָּלָה וְאוֹצִיא מִמֶּנוּ מְעַט דָּם, אָמַר לוֹ אל תעש לו מאומה – אַל תַּעַשׂ בּוֹ מוּם:", "rashi_en": "\"אל תשלח\" הכוונה לשחוט. אברהם אמר: אם כן באתי לחינם, אעשה בו פצע ואוציא ממנו מעט דם. ענה לו: אל תעשה לו שום דבר, אפילו לא מום.", "note": "", "points": [{"q": "מַה בָּא לְהוֹסִיף \"מְאוּמָּה\" אַחֲרֵי הָאִיסּוּר לִשְׁחֹוט אֶת יִצְחָק?", "options": ["שֶׁלֹּא יַעֲשֶׂה בְּיִצְחָק אֲפִילוּ פֶּצַע אוֹ מוּם", "שֶׁלֹּא יִשְׁחַט גַּם אֶת הָאַיִל בִּמְקוֹמוֹ", "שֶׁלֹּא יְסַפֵּר לְאִישׁ עַל הָעֲקֵידָה"], "kasha": "אם כבר נאמר לו לא לשלוח יד, למה צריך להוסיף שלא יעשה לו מאומה?", "answer": "אברהם רצה לפחות לפצוע את יצחק ולהוציא ממנו מעט דם כדי שלא יבוא לחינם, וה' אמר לו לא לעשות בו שום מום.", "kp": ["ואוציא ממנו מעט דם", "אל תעש בו מום"]}]}, {"id": "22:12.2", "ch": 22, "v": 12, "n": 2, "dh": "כי עתה ידעתי", "pasuk_html": "וַיֹּ֗אמֶר אַל־תִּשְׁלַ֤ח יָֽדְךָ֙ אֶל־הַנַּ֔עַר וְאַל־תַּ֥עַשׂ ל֖וֹ מְא֑וּמָּה <mark>כִּ֣י ׀ עַתָּ֣ה יָדַ֗עְתִּי</mark> כִּֽי־יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְלֹ֥א חָשַׂ֛כְתָּ אֶת־בִּנְךָ֥ אֶת־יְחִידְךָ֖ מִמֶּֽנִּי׃", "pasuk_en": "וַיֹּאמֶר אַל־תִּשְׁלַח יָדְךָ אֶל־הַנַּעַר וְאַל־תַּעַשׂ לוֹ מְאוּמָּה כִּי עַתָּה יָדַעְתִּי כִּי־יְרֵא אֱלֹהִים אַתָּה וְלֹא חָשַׂכְתָּ אֶת־בִּנְךָ אֶת־יְחִידְךָ מִמֶּנִּי׃", "rashi_he": "כי עתה ידעתי. אָמַר רַבִּי אַבָּא, אָמַר לוֹ אַבְרָהָם אֲפָרֵשׁ לְפָנֶיךָ אֶת שִׂיחָתִי, אֶתְמוֹל אָמַרְתָּ לִי כִּי בְיִצְחָק יִקָּרֵא לְךָ זָרַע, וְחָזַרְתָּ וְאָמַרְתָּ קַח נָא אֶת בִּנְךָ, עַכְשָׁו אַתָּה אוֹמֵר אַל תִּשְׁלַח יָדְךָ אֶל הַנַּעַר? אָמַר לוֹ הַקָּבָּ\"ה, לֹא אֲחַלֵּל בְּרִיתִי וּמוֹצָא שְׂפָתַי לֹא אֲשַׁנֶּה (תהילים פ\"ט); כְּשֶׁאָמַרְתִּי לְךָ \"קַח\", מוֹצָא שְׂפָתַי לֹא אֲשַׁנֶּה – לֹא אָמַרְתִּי לְךָ שְׁחָטֵהוּ אֶלָּא הַעֲלֵהוּ, אַסַּקְתֵּיהּ, אַחְתֵּיהּ.", "rashi_en": "אברהם שאל את ה': אמרת לי שביצחק יהיה לי זרע, אחר כך ציווית להקריב אותו, ועכשיו אתה אומר לא לגעת בו? ענה לו ה': אני לא משנה את דברי, לא אמרתי לך לשחוט אותו אלא רק להעלות אותו, ועכשיו שהעלית אותו, הורד אותו.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ, אֵיךְ עָנָה ה' לִטְעֲנַת אַבְרָהָם שֶׁדְּבָרָיו סוֹתְרִים זֶה אֶת זֶה?", "options": ["לֹא צִיוָּה לִשְׁחוֹט אֶלָּא רַק לְהַעֲלוֹת וּלְהוֹרִיד", "ה' שִׁינָּה אֶת דַּעְתּוֹ בִּגְלַל תְּפִילַּת אַבְרָהָם", "הַשְּׁחִיטָה נִדְחֲתָה לִזְמַן אַחֵר בֶּעָתִיד"], "kasha": "נראה שה' חזר בו מציוויו, והרי הוא אינו משנה את דבריו.", "answer": "ה' אמר שאינו משנה את מוצא שפתיו: הוא לא אמר לאברהם לשחוט את יצחק אלא להעלות אותו, ועכשיו שהעלה אותו, יוריד אותו.", "kp": ["לא אמרתי לך שחטהו אלא העלהו", "אסקתיה, אחתיה"]}]}, {"id": "22:12.3", "ch": 22, "v": 12, "n": 3, "dh": "כי עתה ידעתי", "pasuk_html": "וַיֹּ֗אמֶר אַל־תִּשְׁלַ֤ח יָֽדְךָ֙ אֶל־הַנַּ֔עַר וְאַל־תַּ֥עַשׂ ל֖וֹ מְא֑וּמָּה <mark>כִּ֣י ׀ עַתָּ֣ה יָדַ֗עְתִּי</mark> כִּֽי־יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְלֹ֥א חָשַׂ֛כְתָּ אֶת־בִּנְךָ֥ אֶת־יְחִידְךָ֖ מִמֶּֽנִּי׃", "pasuk_en": "וַיֹּאמֶר אַל־תִּשְׁלַח יָדְךָ אֶל־הַנַּעַר וְאַל־תַּעַשׂ לוֹ מְאוּמָּה כִּי עַתָּה יָדַעְתִּי כִּי־יְרֵא אֱלֹהִים אַתָּה וְלֹא חָשַׂכְתָּ אֶת־בִּנְךָ אֶת־יְחִידְךָ מִמֶּנִּי׃", "rashi_he": "כי עתה ידעתי. מֵעַתָּה יֵשׁ לִי מַה לְּהָשִׁיב לַשָּׂטָן וְלָאֻמּוֹת הַתְּמֵהִים מַה הִיא חִבָּתִי אֶצְלְךָ; יֵשׁ לִי פִּתְחוֹן פֶּה עַכְשָׁו, שֶׁרוֹאִים כִּי יְרֵא אֱלֹהִים אַתָּה:", "rashi_en": "\"עתה ידעתי\" פירושו שמעכשיו יש לה' תשובה לשטן ולאומות שתמהים על חיבתו לאברהם, כי הכל רואים שאברהם ירא אלהים.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"יָדַעְתִּי\" כָּאן, וַהֲרֵי ה' יוֹדֵעַ הַכֹּל מֵרֹאשׁ?", "options": ["עַכְשָׁיו יֵשׁ לַה' תְּשׁוּבָה לַשָּׂטָן וְלָאֻומּוֹת", "עַכְשָׁיו נוֹדַע לַה' לָרִאשׁוֹנָה שֶׁאַבְרָהָם יָרֵא", "עַכְשָׁיו יָדַע יִצְחָק שֶׁאָבִיו יְרֵא אֱלֹהִים"], "kasha": "איך אומר ה' \"עתה ידעתי\", כאילו לא ידע קודם?", "answer": "מעתה יש לה' מה להשיב לשטן ולאומות שתמהים על חיבתו לאברהם, כי הם רואים שהוא ירא אלהים.", "kp": ["יש לי מה להשיב לשטן ולאמות", "שרואים כי ירא אלהים אתה"]}]}, {"id": "22:13.1", "ch": 22, "v": 13, "n": 1, "dh": "והנה איל", "pasuk_html": "וַיִּשָּׂ֨א אַבְרָהָ֜ם אֶת־עֵינָ֗יו וַיַּרְא֙ <mark>וְהִנֵּה־אַ֔יִל</mark> אַחַ֕ר נֶאֱחַ֥ז בַּסְּבַ֖ךְ בְּקַרְנָ֑יו וַיֵּ֤לֶךְ אַבְרָהָם֙ וַיִּקַּ֣ח אֶת־הָאַ֔יִל וַיַּעֲלֵ֥הוּ לְעֹלָ֖ה תַּ֥חַת בְּנֽוֹ׃", "pasuk_en": "וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַיִל אַחַר נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו וַיֵּלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַיִל וַיַּעֲלֵהוּ לְעֹלָה תַּחַת בְּנוֹ׃", "rashi_he": "והנה איל. מוּכָן הָיָה לְכָךְ מִשֵּׁשֶׁת יְמֵי בְרֵאשִׁית:", "rashi_en": "האיל שמצא אברהם היה מוכן לתפקיד הזה כבר מששת ימי בראשית.", "note": "", "points": [{"q": "מֵאַיִן הִגִּיעַ הָאַיִל שֶׁמָּצָא אַבְרָהָם, לְפִי רַשִׁ\"י?", "options": ["הוּא הוּכַן לְכָךְ מִשֵּׁשֶׁת יְמֵי בְּרֵאשִׁית", "הוּא בָּרַח מֵעֵדֶר שֶׁל רוֹעִים סְמוּכִים", "הַמַּלְאָךְ הֵבִיא אוֹתוֹ בְּאוֹתוֹ רֶגַע"], "kasha": "המילה \"והנה\" מראה שהאיל הופיע באופן מפתיע, ומאין בא?", "answer": "האיל היה מוכן לכך מששת ימי בראשית.", "kp": ["מוכן היה לכך מששת ימי בראשית"]}]}, {"id": "22:13.2", "ch": 22, "v": 13, "n": 2, "dh": "אחר", "pasuk_html": "וַיִּשָּׂ֨א אַבְרָהָ֜ם אֶת־עֵינָ֗יו וַיַּרְא֙ וְהִנֵּה־אַ֔יִל <mark>אַחַ֕ר</mark> נֶאֱחַ֥ז בַּסְּבַ֖ךְ בְּקַרְנָ֑יו וַיֵּ֤לֶךְ אַבְרָהָם֙ וַיִּקַּ֣ח אֶת־הָאַ֔יִל וַיַּעֲלֵ֥הוּ לְעֹלָ֖ה תַּ֥חַת בְּנֽוֹ׃", "pasuk_en": "וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַיִל אַחַר נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו וַיֵּלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַיִל וַיַּעֲלֵהוּ לְעֹלָה תַּחַת בְּנוֹ׃", "rashi_he": "אחר. אַחֲרֵי שֶׁאָמַר לוֹ הַמַּלְאָךְ אַל תִּשְׁלַח יָדְךָ, רָאָהוּ כְּשֶׁהוּא נֶאֱחָז, וְהוּא שֶׁמְּתַרְגְּמִינָן וּזְקַף אַבְרָהָם יַת עֵינוֹהִי בָּתַר אִלֵּין:", "rashi_en": "\"אחר\" פירושו אחרי שהמלאך אמר לו \"אל תשלח ידך\", אז ראה אברהם את האיל נאחז. כך תרגם אונקלוס \"בתר אלין\".", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"אַחַר\" בַּפָּסוּק?", "options": ["אַחֲרֵי דִּבְרֵי הַמַּלְאָךְ רָאָה אֶת הָאַיִל נֶאֱחַז", "אַיִל אַחֵר, שׁוֹנֶה מֵאַיִל רָגִיל", "הָאַיִל עָמַד מֵאַחֲורֵי אַבְרָהָם"], "kasha": "המילה \"אחר\" לא מובנת: אחרי מה, או איל אחר ממה?", "answer": "אחרי שהמלאך אמר לו \"אל תשלח ידך\" ראה אברהם את האיל נאחז, וכך תרגם אונקלוס \"בתר אלין\".", "kp": ["אחרי שאמר לו המלאך", "בתר אלין"]}]}, {"id": "22:13.3", "ch": 22, "v": 13, "n": 3, "dh": "בסבך", "pasuk_html": "וַיִּשָּׂ֨א אַבְרָהָ֜ם אֶת־עֵינָ֗יו וַיַּרְא֙ וְהִנֵּה־אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז <mark>בַּסְּבַ֖ךְ</mark> בְּקַרְנָ֑יו וַיֵּ֤לֶךְ אַבְרָהָם֙ וַיִּקַּ֣ח אֶת־הָאַ֔יִל וַיַּעֲלֵ֥הוּ לְעֹלָ֖ה תַּ֥חַת בְּנֽוֹ׃", "pasuk_en": "וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַיִל אַחַר נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו וַיֵּלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַיִל וַיַּעֲלֵהוּ לְעֹלָה תַּחַת בְּנוֹ׃", "rashi_he": "בסבך. אִילָן:", "rashi_en": "\"סבך\" הוא אילן, עץ.", "note": "", "points": [{"q": "מַהוּ הַ\"סְבַךְ\" שֶׁבּוֹ נֶאֱחַז הָאַיִל?", "options": ["עֵץ שֶׁהָאַיִל נִתְפַּס בַּעֲנָפָיו", "בּוֹר מַיִם עָמֹוק לְיַד הָהָר", "גָּדֵר אֲבָנִים שֶׁל רוֹעִים"], "kasha": "מה פירוש המילה \"סבך\"?", "answer": "סבך הוא אילן.", "kp": ["בסבך. אילן"]}]}, {"id": "22:13.4", "ch": 22, "v": 13, "n": 4, "dh": "בקרניו", "pasuk_html": "וַיִּשָּׂ֨א אַבְרָהָ֜ם אֶת־עֵינָ֗יו וַיַּרְא֙ וְהִנֵּה־אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּסְּבַ֖ךְ <mark>בְּקַרְנָ֑יו</mark> וַיֵּ֤לֶךְ אַבְרָהָם֙ וַיִּקַּ֣ח אֶת־הָאַ֔יִל וַיַּעֲלֵ֥הוּ לְעֹלָ֖ה תַּ֥חַת בְּנֽוֹ׃", "pasuk_en": "וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַיִל אַחַר נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו וַיֵּלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַיִל וַיַּעֲלֵהוּ לְעֹלָה תַּחַת בְּנוֹ׃", "rashi_he": "בקרניו. שֶׁהָיָה רָץ אֵצֶל אַבְרָהָם, וְהַשָּׂטָן סוֹבְכוֹ וּמְעַרְבְּבוֹ בָאִילָנוֹת:", "rashi_en": "האיל רץ לכיוון אברהם, והשטן סיבך אותו בין העצים כדי לעכב אותו, ולכן נאחז בקרניו.", "note": "", "points": [{"q": "מַדּוּעַ נֶאֱחַז הָאַיִל בְּקַרְנָיו בַּסְּבַךְ?", "options": ["הַשָּׂטָן סִיבֵּךְ אוֹתוֹ כְּשֶׁרָץ אֶל אַבְרָהָם", "הָאַיִל רָעָה בֵּין הָעֵצִים וְנִתְפַּס בְּמִקְרֶה", "אַבְרָהָם קָשַׁר אוֹתוֹ שָׁם בְּעַצְמוֹ"], "kasha": "למה מציין הפסוק שהאיל נאחז דווקא בקרניו?", "answer": "האיל רץ אל אברהם, והשטן סיבך ובלבל אותו בין העצים.", "kp": ["שהיה רץ אצל אברהם", "והשטן סובכו ומערבבו באילנות"]}]}, {"id": "22:13.5", "ch": 22, "v": 13, "n": 5, "dh": "תחת בנו", "pasuk_html": "וַיִּשָּׂ֨א אַבְרָהָ֜ם אֶת־עֵינָ֗יו וַיַּרְא֙ וְהִנֵּה־אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּסְּבַ֖ךְ בְּקַרְנָ֑יו וַיֵּ֤לֶךְ אַבְרָהָם֙ וַיִּקַּ֣ח אֶת־הָאַ֔יִל וַיַּעֲלֵ֥הוּ לְעֹלָ֖ה <mark>תַּ֥חַת בְּנֽוֹ׃</mark>", "pasuk_en": "וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַיִל אַחַר נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו וַיֵּלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַיִל וַיַּעֲלֵהוּ לְעֹלָה תַּחַת בְּנוֹ׃", "rashi_he": "תחת בנו. מֵאַחַר שֶׁכָּתוּב וַיַּעֲלֵהוּ לְעֹלָה, לֹא חָסֵר הַמִּקְרָא כְּלוּם, מַהוּ תַּחַת בְּנוֹ? עַל כָּל עֲבוֹדָה שֶׁעָשָׂה מִמֶּנּוּ הָיָה מִתְפַּלֵּל וְאוֹמֵר יְהִי רָצוֹן שֶׁתְּהֵא זוֹ כְּאִלּוּ הִיא עֲשׂוּיָה בִּבְנִי, כְּאִלּוּ בְּנִי שָׁחוּט, כְּאִלּוּ דָּמוֹ זָרוּק, כְּאִלּוּ הוּא מֻפְשָׁט, כְּאִלּוּ הוּא נִקְטָר וְנַעֲשֶׂה דֶּשֶׁן:", "rashi_en": "אחרי שנאמר \"ויעלהו לעלה\" אין צורך לומר \"תחת בנו\". אלא בכל עבודה שעשה באיל התפלל אברהם שתיחשב כאילו נעשתה בבנו: כאילו נשחט, נזרק דמו, הופשט ונשרף לאפר.", "note": "", "points": [{"q": "מַה בָּא לְלַמֵּד \"תַּחַת בְּנוֹ\", וַהֲרֵי כְּבָר נֶאֱמַר \"וַיַּעֲלֵהוּ לְעֹלָה\"?", "options": ["אַבְרָהָם הִתְפַּלֵּל שֶׁכָּל עֲבוֹדָה תֵּיחָשֵׁב כְּאִילּוּ נַעֲשֵׂתָה בִּבְנוֹ", "שֶׁהָאַיִל הוּקְרַב בְּדִיּוּק בַּמָּקוֹם שֶׁבּוֹ הָיָה יִצְחָק עָקוּד", "שֶׁיִּצְחָק עַצְמוֹ עָזַר לְאָבִיו לְהַקְרִיב אֶת הָאַיִל"], "kasha": "הפסוק שלם גם בלי \"תחת בנו\", ולמה נכתבו המילים האלה?", "answer": "על כל עבודה שעשה באיל התפלל אברהם שתהיה כאילו נעשתה בבנו, כאילו בנו שחוט, דמו זרוק, מופשט ונקטר לאפר.", "kp": ["מהו תחת בנו", "כאלו היא עשויה בבני"]}]}, {"id": "22:14.1", "ch": 22, "v": 14, "n": 1, "dh": "ה' יראה", "pasuk_html": "וַיִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם־הַמָּק֥וֹם הַה֖וּא <mark>יְהוָ֣ה ׀ יִרְאֶ֑ה</mark> אֲשֶׁר֙ יֵאָמֵ֣ר הַיּ֔וֹם בְּהַ֥ר יְהוָ֖ה יֵרָאֶֽה׃", "pasuk_en": "וַיִּקְרָא אַבְרָהָם שֵׁם־הַמָּקוֹם הַהוּא יְהוָה יִרְאֶה אֲשֶׁר יֵאָמֵר הַיּוֹם בְּהַר יְהוָה יֵרָאֶה׃", "rashi_he": "ה' יראה. פְּשׁוּטוֹ כְּתַרְגּוּמוֹ, ה' יִבְחַר וְיִרְאֶה לוֹ אֶת הַמָּקוֹם הַזֶּה לְהַשְׁרוֹת בּוֹ שְׁכִינָתוֹ וּלְהַקְרִיב כָּאן קָרְבָּנוֹת:", "rashi_en": "לפי הפשט, כתרגום אונקלוס, אברהם קרא למקום \"ה' יראה\", כלומר ה' יבחר במקום הזה להשרות בו את שכינתו ולהקריב בו קרבנות.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַשֵּׁם שֶׁנָּתַן אַבְרָהָם לַמָּקוֹם, לְפִי הַפְּשָׁט?", "options": ["ה' יִבְחַר בַּמָּקוֹם לְהַשְׁרוֹת בּוֹ שְׁכִינָה וּלְהַקְרִיב קָרְבָּנוֹת", "ה' רָאָה אֶת צַעֲרוֹ שֶׁל אַבְרָהָם בַּמָּקוֹם הַזֶּה", "כָּאן רָאָה אַבְרָהָם אֶת הַמַּלְאָךְ שֶׁדִּיבֵּר אֵלָיו"], "kasha": "מה פירוש השם \"יראה\" שנתן אברהם למקום?", "answer": "כתרגומו: ה' יבחר ויראה לו את המקום הזה להשרות בו שכינתו ולהקריב בו קרבנות.", "kp": ["יבחר ויראה לו את המקום", "להשרות בו שכינתו"]}]}, {"id": "22:14.2", "ch": 22, "v": 14, "n": 2, "dh": "אשר יאמר היום", "pasuk_html": "וַיִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם־הַמָּק֥וֹם הַה֖וּא יְהוָ֣ה ׀ יִרְאֶ֑ה <mark>אֲשֶׁר֙ יֵאָמֵ֣ר הַיּ֔וֹם</mark> בְּהַ֥ר יְהוָ֖ה יֵרָאֶֽה׃", "pasuk_en": "וַיִּקְרָא אַבְרָהָם שֵׁם־הַמָּקוֹם הַהוּא יְהוָה יִרְאֶה אֲשֶׁר יֵאָמֵר הַיּוֹם בְּהַר יְהוָה יֵרָאֶה׃", "rashi_he": "אשר יאמר היום. שֶׁיֹּאמְרוּ לִימֵי הַדּוֹרוֹת עָלָיו בְּהַר זֶה יֵרָאֶה הַקָּבָּ\"ה לְעַמּוֹ:", "rashi_en": "בדורות הבאים יאמרו על המקום הזה: בהר הזה ה' נראה לעמו.", "note": "", "points": [{"q": "מִי יֹאמַר \"בְּהַר יְהוָה יִרְאֶה\"?", "options": ["הַדּוֹרוֹת הַבָּאִים יֹאמְרוּ זֹאת עַל הָהָר", "אַבְרָהָם אָמַר זֹאת לִנְעָרָיו בְּאוֹתוֹ יוֹם", "יִצְחָק אָמַר זֹאת כְּשֶׁשָּׁב מִן הָהָר"], "kasha": "מי הוא האומר שעליו נאמר \"אשר יאמר היום\"?", "answer": "בדורות הבאים יאמרו על המקום: בהר הזה ה' נראה לעמו.", "kp": ["שיאמרו לימי הדורות עליו"]}]}, {"id": "22:14.3", "ch": 22, "v": 14, "n": 3, "dh": "היום", "pasuk_html": "וַיִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם־הַמָּק֥וֹם הַה֖וּא יְהוָ֣ה ׀ יִרְאֶ֑ה אֲשֶׁר֙ יֵאָמֵ֣ר <mark>הַיּ֔וֹם</mark> בְּהַ֥ר יְהוָ֖ה יֵרָאֶֽה׃", "pasuk_en": "וַיִּקְרָא אַבְרָהָם שֵׁם־הַמָּקוֹם הַהוּא יְהוָה יִרְאֶה אֲשֶׁר יֵאָמֵר הַיּוֹם בְּהַר יְהוָה יֵרָאֶה׃", "rashi_he": "היום. הַיָּמִים הָעֲתִידִין, כְּמוֹ עַד הַיּוֹם הַזֶּה שֶׁבְּכָל הַמִּקְרָא, שֶׁכָּל הַדּוֹרוֹת הַבָּאִים הַקּוֹרְאִים אֶת הַמִּקְרָא הַזֶּה אוֹמְרִים עַד הַיּוֹם הַזֶּה עַל הַיוֹם שֶׁעוֹמְדִים בּוֹ. וּמִ\"אַ ה' יִרְאֶה עֲקֵדָה זוֹ לִסְלֹחַ לְיִשְׂרָאֵל בְּכָל שָׁנָה וּלְהַצִּילָם מִן הַפֻּרְעָנוּת, כְּדֵי שֶׁיֵּאָמֵר הַיּוֹם הַזֶּה – בְּכָל הַדּוֹרוֹת הַבָּאִים – בְּהַר ה' יֵרָאֶה אֶפְרוֹ שֶׁל יִצְחָק צָבוּר וְעוֹמֵד לְכַפָּרָה:", "rashi_en": "\"היום\" פירושו הימים העתידים, כמו \"עד היום הזה\" בכל המקרא, שכל דור שקורא את הפסוק מתכוון ליום שלו. לפי המדרש, ה' יזכור את העקידה כדי לסלוח לישראל בכל שנה, ובהר ה' ייראה אפרו של יצחק צבור לכפרה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"הַיּוֹם\" בַּפָּסוּק?", "options": ["הַיָּמִים הָעֲתִידִים, יְמֵי הַדּוֹרוֹת שֶׁיִּקְרְאוּ אֶת הַפָּסוּק", "הַיּוֹם שֶׁבּוֹ נֶעֱקַד יִצְחָק בִּלְבַד", "יוֹם הַכִּיפּוּרִים שֶׁחָל בְּכָל שָׁנָה"], "kasha": "איך נאמר \"היום\" על מה שיאמרו בדורות הבאים?", "answer": "הכוונה לימים העתידים, כמו \"עד היום הזה\" בכל המקרא, שכל דור שקורא את הפסוק מתכוון ליום שבו הוא עומד.", "kp": ["הימים העתידין", "על היום שעומדים בו"]}, {"q": "לְפִי הַמִּדְרָשׁ, מַה יֵּרָאֶה ה' בָּהָר בְּכָל הַדּוֹרוֹת?", "options": ["אֶת אֶפְרוֹ שֶׁל יִצְחָק צָבוּר לְכַפָּרָה לְיִשְׂרָאֵל", "אֶת הַמִּזְבֵּחַ שֶׁבָּנָה אַבְרָהָם בְּרֹאשׁ הָהָר", "אֶת הָאַיִל שֶׁהוּקְרַב בִּמְקוֹם יִצְחָק"], "kasha": "מה יראה ה' בהר, ולמה זה חשוב לדורות?", "answer": "ה' יראה את העקידה כדי לסלוח לישראל בכל שנה ולהצילם מפורענות, ויראה את אפרו של יצחק צבור ועומד לכפרה.", "kp": ["לסלח לישראל בכל שנה", "אפרו של יצחק צבור ועומד לכפרה"]}]}, {"id": "22:17.1", "ch": 22, "v": 17, "n": 1, "dh": "ברך אברכך", "pasuk_html": "כִּֽי־<mark>בָרֵ֣ךְ אֲבָרֶכְךָ֗</mark> וְהַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת־זַרְעֲךָ֙ כְּכוֹכְבֵ֣י הַשָּׁמַ֔יִם וְכַח֕וֹל אֲשֶׁ֖ר עַל־שְׂפַ֣ת הַיָּ֑ם וְיִרַ֣שׁ זַרְעֲךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽיו׃", "pasuk_en": "כִּי־בָרֵךְ אֲבָרֶכְךָ וְהַרְבָּה אַרְבֶּה אֶת־זַרְעֲךָ כְּכוֹכְבֵי הַשָּׁמַיִם וְכַחוֹל אֲשֶׁר עַל־שְׂפַת הַיָּם וְיִרַשׁ זַרְעֲךָ אֵת שַׁעַר אֹיְבָיו׃", "rashi_he": "ברך אברכך. אַחַת לָאָב וְאַחַת לַבֵּן:", "rashi_en": "הכפילות \"ברך אברכך\" מלמדת על שתי ברכות: אחת לאב ואחת לבן.", "note": "", "points": [{"q": "מַדּוּעַ כָּפַל ה' אֶת הַלָּשׁוֹן \"בָרֵךְ אֲבָרֶכְךָ\"?", "options": ["בְּרָכָה אַחַת לָאָב וְאַחַת לַבֵּן", "כְּדֵי לְחַזֵּק אֶת הַבְטָחַת הַבְּרָכָה", "בְּרָכָה לָעוֹלָם הַזֶּה וּבְרָכָה לָעוֹלָם הַבָּא"], "kasha": "למה נאמרה הברכה בלשון כפולה?", "answer": "ברכה אחת לאברהם האב וברכה אחת ליצחק הבן.", "kp": ["אחת לאב ואחת לבן"]}]}, {"id": "22:17.2", "ch": 22, "v": 17, "n": 2, "dh": "והרבה ארבה", "pasuk_html": "כִּֽי־בָרֵ֣ךְ אֲבָרֶכְךָ֗ <mark>וְהַרְבָּ֨ה אַרְבֶּ֤ה</mark> אֶֽת־זַרְעֲךָ֙ כְּכוֹכְבֵ֣י הַשָּׁמַ֔יִם וְכַח֕וֹל אֲשֶׁ֖ר עַל־שְׂפַ֣ת הַיָּ֑ם וְיִרַ֣שׁ זַרְעֲךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽיו׃", "pasuk_en": "כִּי־בָרֵךְ אֲבָרֶכְךָ וְהַרְבָּה אַרְבֶּה אֶת־זַרְעֲךָ כְּכוֹכְבֵי הַשָּׁמַיִם וְכַחוֹל אֲשֶׁר עַל־שְׂפַת הַיָּם וְיִרַשׁ זַרְעֲךָ אֵת שַׁעַר אֹיְבָיו׃", "rashi_he": "והרבה ארבה. אַחַת לָאָב וְאַחַת לַבֵּן:", "rashi_en": "גם הכפילות \"והרבה ארבה\" מלמדת על שני ריבויים: אחד לאב ואחד לבן.", "note": "", "points": [{"q": "מַדּוּעַ נֶאֱמַר בִּלְשׁוֹן כְּפוּלָה \"וְהַרְבָּה אַרְבֶּה\"?", "options": ["רִיבּוּי אֶחָד לָאָב וְרִיבּוּי אֶחָד לַבֵּן", "רִיבּוּי לְזֶרַע יִשְׂרָאֵל וּלְזֶרַע יִשְׁמָעֵאל", "רִיבּוּי בְּעֹושֶׁר וְרִיבּוּי בְּבָנִים"], "kasha": "למה נאמרה הבטחת הריבוי בלשון כפולה?", "answer": "ריבוי אחד לאב וריבוי אחד לבן.", "kp": ["אחת לאב ואחת לבן"]}]}, {"id": "22:19.1", "ch": 22, "v": 19, "n": 1, "dh": "וישב אברהם בבאר שבע", "pasuk_html": "וַיָּ֤שָׁב אַבְרָהָם֙ אֶל־נְעָרָ֔יו וַיָּקֻ֛מוּ וַיֵּלְכ֥וּ יַחְדָּ֖ו אֶל־בְּאֵ֣ר שָׁ֑בַע <mark>וַיֵּ֥שֶׁב אַבְרָהָ֖ם בִּבְאֵ֥ר שָֽׁבַע׃</mark> (פ)", "pasuk_en": "וַיָּשָׁב אַבְרָהָם אֶל־נְעָרָיו וַיָּקֻמוּ וַיֵּלְכוּ יַחְדָּו אֶל־בְּאֵר שָׁבַע וַיֵּשֶׁב אַבְרָהָם בִּבְאֵר שָׁבַע׃", "rashi_he": "וישב אברהם בבאר שבע. לֹא יְשִׁיבָה מַמָּשׁ, שֶׁהֲרֵי בְּחֶבְרוֹן הָיָה יוֹשֵׁב, י\"ב שָׁנִים לִפְנֵי עֲקֵדָתוֹ שֶׁל יִצְחָק יָצָא מִבְּאֵר שֶׁבַע וְהָלַךְ לוֹ לְחֶבְרוֹן, כְּמוֹ שֶׁנֶּאֱמַר וַיָּגָר אַבְרָהָם בְּאֶרֶץ פְּלִשְׁתִּים יָמִים רַבִּים, מְרֻבִּים מִשֶּׁל חֶבְרוֹן הָרִאשׁוֹנִים, וְהֵם כ\"ו שָׁנָה, כְּמוֹ שֶׁפֵּרַשְׁנוּ לְמַעְלָה:", "rashi_en": "אברהם לא ישב בבאר שבע ישיבה קבועה, כי באותה תקופה גר בחברון. שתים עשרה שנה לפני העקידה עזב את באר שבע ועבר לחברון.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"וַיָּשָׁב אַבְרָהָם בִּבְאֵר שָׁבַע\" כָּאן?", "options": ["לֹא יָשַׁב שָׁם בְּקָבִיעוּת, כִּי מְקוֹם מְגוּרָיו הָיָה בְּחֶבְרוֹן", "חָזַר לָגוּר בִּבְאֵר שֶׁבַע לִצְמִיתוּת אַחֲרֵי הָעֲקֵידָה", "גָּר שָׁם כָּל יָמָיו עַד מוֹתָהּ שֶׁל שָׂרָה"], "kasha": "איך נאמר שאברהם ישב בבאר שבע, והרי באותה תקופה גר בחברון?", "answer": "אין זו ישיבה ממש, שהרי בחברון היה יושב, כי שתים עשרה שנה לפני העקידה יצא מבאר שבע והלך לחברון.", "kp": ["לא ישיבה ממש", "שהרי בחברון היה יושב"]}]}, {"id": "22:20.1", "ch": 22, "v": 20, "n": 1, "dh": "אחרי הדברים האלה ויגד וגו'", "pasuk_html": "וַיְהִ֗י <mark>אַחֲרֵי֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה וַיֻּגַּ֥ד</mark> לְאַבְרָהָ֖ם לֵאמֹ֑ר הִ֠נֵּה יָלְדָ֨ה מִלְכָּ֥ה גַם־הִ֛וא בָּנִ֖ים לְנָח֥וֹר אָחִֽיךָ׃", "pasuk_en": "וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה וַיֻּגַּד לְאַבְרָהָם לֵאמֹר הִנֵּה יָלְדָה מִלְכָּה גַם־הִוא בָּנִים לְנָחוֹר אָחִיךָ׃", "rashi_he": "אחרי הדברים האלה ויגד וגו'. בְּשׁוּבוֹ מֵהַר הַמּוֹרִיָה הָיָה אַבְרָהָם מְהַרְהֵר וְאוֹמֵר אִלּוּ הָיָה בְנִי שָׁחוּט כְּבָר, הָיָה הוֹלֵךְ בְּלֹא בָנִים, הָיָה לִי לְהַשִּׂיאוֹ אִשָּׁה מִבְּנוֹת עָנֵר אֶשְׁכּוֹל וּמַמְרֵא, בִּשְּׂרוֹ הַקָּבָּ\"ה שֶׁנּוֹלְדָה רִבְקָה בַת זוּגוֹ, וְזֶהוּ הדברים האלה, הִרְהוּרֵי דְּבָרִים שֶׁהָיוּ עַל יְדֵי עֲקֵדָה:", "rashi_en": "בשובו מהר המוריה חשב אברהם: אילו נשחט בני, היה מת בלי בנים, והייתי צריך להשיא לו אשה. לכן בישר לו ה' שנולדה רבקה, המיועדת ליצחק. \"הדברים האלה\" הם המחשבות שעלו בעקבות העקידה.", "note": "", "points": [{"q": "אַחֲרֵי אֵילּוּ \"דְבָרִים\" בִּישְּׂרוּ לְאַבְרָהָם עַל לֵידַת רִבְקָה?", "options": ["אַחֲרֵי הִרְהוּרָיו שֶׁיִּצְחָק הָיָה מֵת בְּלִי בָּנִים", "אַחֲרֵי שֶׁחָזַר לָגוּר בִּבְאֵר שָׁבַע", "אַחֲרֵי שֶׁנּוֹדַע לוֹ עַל מוֹתָהּ שֶׁל שָׂרָה"], "kasha": "מה הקשר בין העקידה לבשורה על משפחת נחור, ולאילו \"דברים\" הכוונה?", "answer": "אברהם הרהר שאילו נשחט יצחק היה מת בלי בנים, ולכן בישר לו ה' שנולדה רבקה בת זוגו; \"הדברים האלה\" הם ההרהורים שבאו בעקבות העקידה.", "kp": ["היה הולך בלא בנים", "שנולדה רבקה בת זוגו", "הרהורי דברים שהיו על ידי עקדה"]}]}, {"id": "22:20.2", "ch": 22, "v": 20, "n": 2, "dh": "גם היא", "pasuk_html": "וַיְהִ֗י אַחֲרֵי֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה וַיֻּגַּ֥ד לְאַבְרָהָ֖ם לֵאמֹ֑ר הִ֠נֵּה יָלְדָ֨ה מִלְכָּ֥ה <mark>גַם־הִ֛וא</mark> בָּנִ֖ים לְנָח֥וֹר אָחִֽיךָ׃", "pasuk_en": "וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה וַיֻּגַּד לְאַבְרָהָם לֵאמֹר הִנֵּה יָלְדָה מִלְכָּה גַם־הִוא בָּנִים לְנָחוֹר אָחִיךָ׃", "rashi_he": "גם היא. אַף הִיא הִשְׁוָת מִשְׁפְּחוֹתֶיהָ לְמִשְׁפְּחוֹת אַבְרָהָם י\"ב, מָה אַבְרָהָם י\"ב שְׁבָטִים שֶׁיָּצְאוּ מִיַּעֲקֹב, ח' בְּנֵי הַגְּבִירוֹת וד' בְּנֵי שְׁפָחוֹת, אַף אֵלּוּ ח' בְּנֵי גְּבִירוֹת וְד' בְּנֵי פִּילֶגֶשׁ:", "rashi_en": "רש\"י מסביר שהמילה \"גם\" באה להשוות את מלכה לאברהם: כמו שלאברהם יצאו שנים עשר שבטים, שמונה מנשים עיקריות וארבעה משפחות, כך גם לנחור נולדו שנים עשר בנים, שמונה ממלכה וארבעה מהפילגש.", "note": "", "points": [{"q": "מַה בָּא רַשִׁ\"י לְלַמֵּד מֵהַמִּילָּה \"גַּם\" שֶׁנֶּאֶמְרָה עַל מִלְכָּה?", "options": ["שֶׁמִּשְׁפַּחְתָּהּ שָׁווָה לְמִשְׁפַּחַת אַבְרָהָם בְּמִסְפַּר שְׁנֵים עָשָׂר", "שֶׁגַּם מִלְכָּה הָייְתָה עֲקָרָה וְנִפְקְדָה כְּמוֹ שָׂרָה", "שֶׁגַּם הִיא יָלְדָה בָּנִים בְּזִקְנָתָהּ כְּמוֹ אַבְרָהָם"], "kasha": "מה פירוש \"גם\", וכלפי מי משווים כאן את מלכה?", "answer": "מלכה השוותה את משפחותיה למשפחות אברהם: כמו שמאברהם יצאו שנים עשר שבטים, שמונה מבני הגבירות וארבעה מבני השפחות, כך לנחור שמונה מבני מלכה וארבעה מבני הפילגש.", "kp": ["אף היא השות משפחותיה", "מה אברהם י\"ב שבטים", "ח' בני גבירות וד' בני פילגש"]}]}, {"id": "22:23.1", "ch": 22, "v": 23, "n": 1, "dh": "ובתואל ילד את רבקה", "pasuk_html": "<mark>וּבְתוּאֵ֖ל יָלַ֣ד אֶת־רִבְקָ֑ה</mark> שְׁמֹנָ֥ה אֵ֙לֶּה֙ יָלְדָ֣ה מִלְכָּ֔ה לְנָח֖וֹר אֲחִ֥י אַבְרָהָֽם׃", "pasuk_en": "וּבְתוּאֵל יָלַד אֶת־רִבְקָה שְׁמֹנָה אֵלֶּה יָלְדָה מִלְכָּה לְנָחוֹר אֲחִי אַבְרָהָם׃", "rashi_he": "ובתואל ילד את רבקה. כָּל הַיִּחוּסִין הַלָּלוּ לֹא נִכְתְּבוּ אֶלָּא בִּשְׁבִיל פָּסוּק זֶה:", "rashi_en": "רש\"י מסביר שכל רשימת צאצאי נחור נכתבה בתורה רק כדי להגיע לפסוק הזה, שמספר על הולדת רבקה.", "note": "", "points": [{"q": "לְשֵׁם מָה כָּתְבָה הַתּוֹרָה אֶת כָּל רְשִׁימַת בְּנֵי נָחוֹר, לְפִי רַשִׁ\"י?", "options": ["כְּדֵי לְסַפֵּר עַל הוֹלֶדֶת רִבְקָה שֶׁתִּינָּשֵׂא לְיִצְחָק", "כְּדֵי לְלַמֵּד שֶׁנָּחוֹר הִתְקָרֵב לֶאֱמוּנַת אַבְרָהָם", "כְּדֵי לְפָרֵט אֶת כָּל אֻומּוֹת אֲרָם שֶׁיָּצְאוּ מִנָּחוֹר"], "kasha": "מדוע התורה מאריכה ברשימת צאצאי נחור, שאין להם תפקיד בהמשך הסיפור?", "answer": "כל היחוסים האלה לא נכתבו אלא בשביל הפסוק הזה, שבו נאמר שבתואל הוליד את רבקה.", "kp": ["כל היחוסין הללו", "לא נכתבו אלא בשביל פסוק זה"]}]}];

function order(id){const a=[0,1,2];let h=hash(id);for(let k=2;k>0;k--){const j=h%(k+1);h=Math.floor(h/7)+13;[a[k],a[j]]=[a[j],a[k]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function heWrap(s){s=String(s).replace(/[“”„]/g,'"').replace(/(^|[\s(])״/g,'$1"').replace(/״(?=$|[\s.,;:?!)])/g,'"').replace(/(^|[\s(])((?:[א-ת][֑-ׇ]*){1,2})״(?=(?:[֑-ׇ]*[א-ת]){3})/g,'$1$2"').replace(/(^|[^א-ת])(ה|וגו|ית|וכו|וגומ)'/g,'$1$2׳');return esc(s).replace(/([֐-׿](?:[֐-׿״׳\- ]*[֐-׿״׳])?)/g,'<span lang="he" dir="rtl">$1</span>')}
const $=id=>document.getElementById(id);

// jump menu: one option per posuk that has Rashi
(function(){const sel=$('jump');let lastCh=0,grp;
  DATA.forEach((x,k)=>{ if(x.n!==1) return;
    if(x.ch!==lastCh){grp=document.createElement('optgroup');grp.label='Perek '+x.ch+' ('+gem(x.ch)+')';sel.appendChild(grp);lastCh=x.ch}
    const o=document.createElement('option');o.value=k;o.textContent=x.ch+':'+x.v+'  —  '+x.dh;grp.appendChild(o)});
  sel.addEventListener('change',()=>{go(+sel.value)});
})();

const P=(x,j)=>x.id+'#'+j;
function picked(x,j){return st.p[P(x,j)]}
function nDone(x){let n=0;while(n<x.points.length&&picked(x,n)!==undefined)n++;return n}
function rashiDone(x){return nDone(x)===x.points.length}
function stats(){let done=0,pts=0,נכון=0,totalPts=0;DATA.forEach(x=>{totalPts+=x.points.length;if(rashiDone(x))done++;x.points.forEach((_,j)=>{const v=picked(x,j);if(v!==undefined){pts++;if(v===0)נכון++}})});return{done,pts,נכון,totalPts}}
function rashiRight(x){return x.points.every((_,j)=>picked(x,j)===0)}
function header(){const s=stats();$('count').innerHTML='<b>'+s.done+'</b> / '+DATA.length+' רש״יות · '+s.נכון+' / '+s.pts+' נכון';
  $('barfill').style.width=(s.pts/s.totalPts*100)+'%';
  let best=0;DATA.forEach((x,k)=>{if(x.n===1&&k<=st.i)best=k});$('jump').value=best}

let curPt=null;
function go(i){clearTimeout(window._aa);curPt=null;st.i=Math.max(0,Math.min(DATA.length,i));save();render();$('main').scrollTo({top:0})}

function rashiHTML(x,pt){
  const nz=w=>w.replace(/[֑-ׇ]/g,'').replace(/[^א-ת]/g,'');
  const toks=String(x.rashi_he).replace(/<\/?b>/g,'').split(/\s+/).filter(Boolean),n=toks.map(nz);
  const cls=toks.map(()=>'');
  const dh=x.dh.split(/\s+/).map(nz).filter(Boolean);
  let dl=0;if(dh.length&&dh.every((w,i)=>n[i]===w))dl=dh.length;else{let k=0;while(k<dh.length&&k<n.length&&n[k]===dh[k])k++;dl=k}
  for(let i=0;i<dl;i++)cls[i]+=' dhw';
  const pw=x.pasuk_html.replace(/<[^>]+>/g,'').replace(/־/g,' ').split(/\s+/).map(nz).filter(Boolean);
  for(let i=dl;i<n.length;i++){let best=0;for(let p=0;p<pw.length;p++){let k=0;while(i+k<n.length&&p+k<pw.length&&n[i+k]&&n[i+k]===pw[p+k])k++;if(k>best)best=k}
    if(best>=2){for(let k=0;k<best;k++)cls[i+k]+=' qw';i+=best-1}}
  if(pt&&pt.kp)[].concat(pt.kp).forEach(ph=>{const kw=String(ph).split(/\s+/).map(nz).filter(Boolean);
    if(kw.length)for(let i=0;i+kw.length<=n.length;i++){if(kw.every((w,k)=>n[i+k]===w)){for(let k=0;k<kw.length;k++)cls[i+k]+=' kp';break}}});
  const out=[];for(let i=0;i<toks.length;){const c=cls[i].trim();if(!c){out.push(esc(toks[i]));i++;continue}let j=i;while(j<toks.length&&cls[j].trim()===c)j++;out.push(`<span class="${c}">${toks.slice(i,j).map(esc).join(' ')}</span>`);i=j}
  return out.join(' ')}
function pointHTML(x,j){const v=picked(x,j);const ord=order(x.id+'#'+j);const multi=x.points.length>1;const pt=x.points[j];
  return `<div class="point" id="pt${j}">
    ${multi?`<div class="pnum">נקודה ${j+1} מתוך ${x.points.length}</div>`:''}
    <p class="q">${heWrap(pt.q)}</p>
    <div class="opts">${ord.map((o,k)=>{let c='';if(v!==undefined){c=o===0?'נכון':(o===v?'wrong':'dim')}
      return `<button class="opt ${c}" type="button" data-j="${j}" data-o="${o}" ${v!==undefined?'disabled':''}><span class="k">${k+1}</span><span>${heWrap(pt.options[o])}</span></button>`}).join('')}</div>
    ${v!==undefined?`<div class="quote" lang="he">${rashiHTML(x,pt)}<span class="src">בראשית ${gem(x.ch)}:${gem(x.v)} · <a target="_blank" rel="noopener" href="https://www.sefaria.org/Rashi_on_Genesis.${x.ch}.${x.v}.${x.n}?lang=he">ספריא ↗</a></span></div>`:''}
  </div>`}

function render(){
  header();
  const m=$('main');
  if(st.i>=DATA.length){
    const s=stats();const missed=DATA.map((x,k)=>[x,k]).filter(([x])=>rashiDone(x)&&!rashiRight(x));
    const skipped=DATA.map((x,k)=>[x,k]).filter(([x])=>!rashiDone(x));
    m.innerHTML='<section class="card done"><h2>סליק פרשת וירא</h2><p>סיימת '+s.done+' מתוך '+DATA.length+' רש״יות · '+s.נכון+' מתוך '+s.pts+' נכון.</p>'+
      (skipped.length?'<p>'+skipped.length+' רש״יות not finished. <button class="ghost" id="gs" type="button">עבור אל first one</button></p>':'')+
      (missed.length?'<p>'+missed.length+' רש״יות לחזרה: '+missed.map(([x,k])=>'<button class="ghost" data-k="'+k+'" type="button">'+x.ch+':'+x.v+(x.n>1?' ('+x.n+')':'')+'</button>').join(' ')+'</p>':'')+
      '<div class="nav"><button class="btn sec" id="back" type="button">חזור →</button></div></section>';
    m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>go(+b.dataset.k));
    if($('gs'))$('gs').onclick=()=>go(skipped[0][1]);
    $('back').onclick=()=>go(DATA.length-1);return}
  const x=DATA[st.i];const on=DATA.filter(y=>y.ch===x.ch&&y.v===x.v).length;
  const nd=nDone(x);const cur=curPt!==null?curPt:Math.min(nd,x.points.length-1);
  const pts=pointHTML(x,cur);const ans=picked(x,cur)!==undefined;
  const all=rashiDone(x);
  m.innerHTML=`<section class="card" aria-live="polite">
    <div class="ref"><span>בראשית ${x.ch}:${x.v} · ${gem(x.ch)}:${gem(x.v)}</span><span>${on>1?'רש״י '+x.n+' מתוך '+on+' על פסוק זה':'רש״י 1 על פסוק זה'} · #${st.i+1}</span></div>
    ${x.note?'<div class="count">'+esc(x.note)+'</div>':''}
    <div class="pasuk" lang="he">${x.pasuk_html}</div>
    <div class="pasuk-en">${esc(x.pasuk_en)}</div>
    <div class="dh"><span class="w" lang="he">${esc(x.dh)}</span><span class="lbl">רש״י על</span>${x.points.length>1?`<span class="lbl pts">${x.points.length} נקודות</span>`:''}</div>
    ${pts}
    <div class="nav"><button class="btn sec" id="back" type="button" ${st.i===0?'disabled':''}>חזור →</button><button class="btn" id="next" type="button" ${ans?'':'disabled'}>${all?'רש״י הבא ←':(ans?'נקודה הבאה ←':'ענה כדי להמשיך')}</button></div>
  </section>`;
  m.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>pick(+b.dataset.j,+b.dataset.o));
  $('back').onclick=()=>go(st.i-1);$('next').onclick=()=>{if(!ans)return;clearTimeout(window._aa);if(rashiDone(x))go(st.i+1);else{curPt=null;render()}};
}
function pick(j,o){const x=DATA[st.i];if(picked(x,j)!==undefined)return;st.p[P(x,j)]=o;save();curPt=j;render();
  clearTimeout(window._aa);
}
$('nextUnanswered').onclick=()=>{let k=DATA.findIndex((x,k)=>k>st.i&&!rashiDone(x));if(k<0)k=DATA.findIndex(x=>!rashiDone(x));go(k<0?DATA.length:k)};
function askReset(){const z=$('resetZone');z.innerHTML='<span class="confirm">למחוק התקדמות? <button class="ghost" id="yes" type="button">כן, התחל מחדש</button><button class="ghost" id="no" type="button">ביטול</button></span>';
  $('yes').onclick=()=>{st={i:0,p:{}};save();z.innerHTML='<button class="ghost" id="reset" type="button">התחל מחדש</button>';$('reset').onclick=askReset;render()};
  $('no').onclick=()=>{z.innerHTML='<button class="ghost" id="reset" type="button">התחל מחדש</button>';$('reset').onclick=askReset}}
$('reset').onclick=askReset;
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(['1','2','3'].includes(e.key)){const b=document.querySelectorAll('.opt:not([disabled])')[+e.key-1];if(b)b.click()}
  else if(e.key==='Enter'||e.key==='ArrowRight'){const n=$('next');if(n&&!n.disabled&&document.activeElement.tagName!=='SUMMARY'){e.preventDefault();n.click()}}
  else if(e.key==='ArrowLeft'){const b=$('back');if(b&&!b.disabled)b.click()}});

function foot0(){const h=document.querySelector('.hint');const x=DATA[st.i];
  const c=$('count').textContent;
  if(!x){h.textContent=c;return}
  const on=DATA.filter(y=>y.ch===x.ch&&y.v===x.v).length;
  h.innerHTML='<span>בראשית '+x.ch+':'+x.v+' · '+gem(x.ch)+':'+gem(x.v)+'</span><span>רש״י '+x.n+' מתוך '+on+' על פסוק זה · #'+(st.i+1)+'</span><span>'+esc(c)+'</span><span>מקשים: 1-3 לתשובה · Enter להבא · ← / → לניווט</span>'}
const APP_VERSION='1.5.0';
function foot(){foot0();const h=document.querySelector('.hint');if(!h)return;const x=DATA[st.i];
  const body='Version: v'+APP_VERSION+'\nPage: '+location.pathname.split('/').pop()+(x?'\nRashi: '+x.id+' (#'+(st.i+1)+')':'')+'\n\nWhat happened / what would you like changed?\n';
  h.insertAdjacentHTML('beforeend','<span>v'+APP_VERSION+' · <a class="fb" target="_blank" rel="noopener" href="https://github.com/yishairasowsky/chumash_rashi/issues/new?title=Feedback&body='+encodeURIComponent(body)+'">משוב / Feedback</a></span>')}
function fit(){const c=document.querySelector('.card');if(!c)return;const r=document.documentElement;
  const rv=c.querySelector('.reveal');const shown=rv&&!rv.hasAttribute('aria-hidden');if(rv){if(shown)rv.style.position='static';else rv.style.display='none'}
  const bs=(set,over,lo,hi)=>{for(let i=0;i<10;i++){const m=(lo+hi)/2;set(m);if(over())hi=m;else lo=m}set(lo)};
  if(matchMedia('(min-width:900px)').matches){const p=c.querySelector('.pasuk'),pt=c.querySelector('.point');
    bs(v=>r.style.setProperty('--sp',v),()=>p.scrollHeight>p.clientHeight+1,.5,3.2);
    const kids=[...pt.children].filter(e=>e!==rv||shown),gap=parseFloat(getComputedStyle(pt).rowGap)||0;
    const need=()=>kids.reduce((t,e)=>t+(e.classList.contains('quote')?innerHeight*.24:Math.max(e.offsetHeight,e.scrollHeight)),0)+gap*(kids.length-1)+(shown?14:0);
    bs(v=>r.style.setProperty('--s',v),()=>need()>pt.clientHeight*1+1,.5,2.4)}
  else bs(v=>r.style.setProperty('--s',v),()=>c.scrollHeight>c.clientHeight+1,.6,6);
  if(rv){rv.style.display='';rv.style.position=''}}
function placeReveal(){const c=document.querySelector('.card'),r=c&&c.querySelector('.reveal'),n=c&&c.querySelector('.nav'),o=c&&c.querySelector('.opts');if(!r)return;
  if(matchMedia('(min-width:900px)').matches){const pp=c.querySelector('.point');if(pp&&!r.hasAttribute('aria-hidden'))pp.style.justifyContent='flex-start';r.style.bottom='auto';r.style.top=(o?o.offsetTop+Math.max(o.offsetHeight,o.scrollHeight)+8:0)+'px';r.style.overflow='auto'}
  else{r.style.top=(o?o.offsetTop+o.offsetHeight+8:'')+'px';r.style.overflow='auto';if(n)r.style.bottom=(c.clientHeight-n.offsetTop+6)+'px'}}
const _render=render;render=function(){_render();foot();fit();placeReveal()};
const refit=()=>{fit();placeReveal()};
addEventListener('resize',refit);if(document.fonts)document.fonts.ready.then(refit);
render();
</script>

</body>
</html>
