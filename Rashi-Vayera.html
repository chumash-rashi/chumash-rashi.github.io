nt in their bowels.", "note": "", "points": [{"q": "'ההרה המלט' — escape to the mountain. Which mountain, and why there?", "options": ["To Avraham, who lives on the mountain", "To a cave where Lot could hide", "To the highest peak, above the fire"], "kasha": "The posuk says 'the mountain' as if we know which one — which is it?", "answer": "Flee to Avraham, who lives on the mountain."}, {"q": "How does רש״י show that Avraham lived on a mountain, and still lived there now?", "options": ["'ויעתק משם ההרה' and 'אל המקום אשר היה שם אהלו בתחלה'", "'ויאהל אברם ויבא וישב באלני ממרא'", "'לך לך מארצך' and 'וילך אברם'"], "kasha": "We need a source that Avraham was living on a mountain at this time.", "answer": "It says 'ויעתק משם ההרה' — he moved to the mountain. And he was still there, as it says he returned 'to the place where his tent had been at first.'"}, {"q": "But it says Avraham pitched his tent and settled in Chevron. How can he still be on the mountain?", "options": ["He had many tents stretching all the way to Chevron", "He moved back to the mountain after the war", "Chevron itself is the mountain mentioned"], "kasha": "'ויאהל אברם' says Avraham moved to Chevron, contradicting that he stayed at the mountain.", "answer": "Avraham had many tents, and they stretched all the way to Chevron."}]}, {"id": "19:17.5", "ch": 19, "v": 17, "n": 5, "dh": "המלט", "pasuk_html": "וַיְהִי֩ כְהוֹצִיאָ֨ם אֹתָ֜ם הַח֗וּצָה וַיֹּ֙אמֶר֙ <mark>הִמָּלֵ֣ט</mark> עַל־נַפְשֶׁ֔ךָ אַל־תַּבִּ֣יט אַחֲרֶ֔יךָ וְאַֽל־תַּעֲמֹ֖ד בְּכׇל־הַכִּכָּ֑ר הָהָ֥רָה הִמָּלֵ֖ט פֶּן־תִּסָּפֶֽה׃", "pasuk_en": "When they were brought out [מתוך the city], he [the angel] said, Escape for your life! Do not look back! Do not remain anywhere in the valley. Escape to the mountain, lest you be swept away.", "rashi_he": "לְשׁוֹן הַשְׁמָטָה, וְכֵן כָּל הַמְלָטָה שֶׁבַּמִּקְרָא אשמוצי\"ר בלע\"ז וְכֵן וְהִמְלִיטָה זָכָר (ישעיהו ס\"ו), שֶׁנִּשְׁמַט הָעֻבָּר מִן הָרֶחֶם, כְּצִפּוֹר נִמְלְטָה (תהילים קכ\"ד), לֹא יָכְלוּ מַלֵּט מַשָּׂא (ישעיהו מ\"ו), לְהַשְׁמִיט מַשָּׂא הָרְעִי שֶׁבְּנִקְבֵיהֶם:", "rashi_en": "<b>Escape for your life.</b> Let it suffice for you to save lives. Pay no heed to possessions. <b>Do not look back!</b> You participated in their evil ways and only for the sake מתוך Avraham are you saved. You are not worthy to see their punishment while you [yourself] are being rescued. <b>Anywhere in the valley.</b> [This refers to] the plain מתוך Jordan. <b>Escape to the mountain.</b> Flee to Avraham who dwells in the mountain as it is said: “From there he moved to the mountain.” Now, too, he dwells there, as it is said: “Until the place where he originally had his tent.” And though it is written: “Avram set up his tents, etc.,” he had many tents which extended to Chevron. The word הִמָּלֵט means to evade. So, too, every form מתוך הַמְלָטָה in Scripture has the meaning émisser in Old French. Similarly: “She delivered a male baby,” meaning that the fetus slipped through the womb. [or] “Escaped like a bird” [or:] “They are unable to push the load through,” [i.e.,] to push the load מתוך excrement in their bowels.", "note": "", "points": [{"q": "What is the basic meaning מתוך 'המלט' and every form מתוך 'המלטה' in Tanach?", "options": ["Slipping away or out from something", "Hiding in a safe place", "Running at great speed"], "kasha": "'המלט' is a distinct word — what exactly does it mean?", "answer": "It is לשון השמטה — slipping away (émisser in Old French), and so every המלטה in Tanach."}, {"q": "Which pesukim show that 'המלטה' means slipping out?", "options": ["'והמליטה זכר', 'כצפור נמלטה', 'לא יכלו מלט משא'", "'ויצא יעקב', 'ויברח משה', 'ויצא נח'", "'המלט על נפשך' and 'המלט שמה' only"], "kasha": "רש״י needs proמתוך that this is the meaning wherever the word appears.", "answer": "'והמליטה זכר' — the baby slips from the womb; 'כצפור נמלטה' — like a bird escaped; 'לא יכלו מלט משא' — they couldn't push out the load מתוך waste in their bowels."}]}, {"id": "19:18.1", "ch": 19, "v": 18, "n": 1, "dh": "אל נא אדני", "pasuk_html": "וַיֹּ֥אמֶר ל֖וֹט אֲלֵהֶ֑ם אַל־נָ֖א אֲדֹנָֽי׃", "pasuk_en": "Lot said to them, Please, not so my Master.", "rashi_he": "רַבּוֹתֵינוּ אָמְרוּ (שבועות ל\"ב) שֶׁשֵּׁם זֶה קֹדֶשׁ, שֶׁנֶּאֱמַר בּוֹ לְהַחֲיוֹת אֶת נַפְשִׁי – מִי שֶׁיֵשׁ בְּיָדוֹ לְהָמִית וּלְהַחֲיוֹת; וְתַרְגּוּמוֹ בְּבָעוּ כְעַן ה':", "rashi_en": "Our Sages said that this Name is holy for about it [this name] it is said, “To keep me alive,” [referring to] the One who has it in His power to kill or to keep alive. The Targum [also] translates it: “Please, God,”", "note": "", "points": [{"q": "Lot says 'אל נא אדני.' Is 'אדני' here a holy Name מתוך Hashem or a title for the malach?", "options": ["Holy — it refers to Hashem", "Not holy — it means 'my master,' the malach", "Not holy — Lot was addressing Avraham"], "kasha": "Lot is speaking to the malachim ('אליהם'), so is 'אדני' a holy Name or not?", "answer": "Chazal (Shevuos) say it is holy, since Lot then says 'להחיות את נפשי' — speaking to the One Who has the power to kill and to give life."}, {"q": "How does Targum Onkelos translate 'אל נא אדני'?", "options": ["'בבעו כען ה'' — please, Hashem", "'בבעו רבוני' — please, my master", "'לא כן מלאכא' — not so, malach"], "kasha": "Does the Targum also read this as a holy Name?", "answer": "The Targum translates 'בבעו כען ה'' — 'Please now, Hashem,' treating it as a holy Name."}]}, {"id": "19:18.2", "ch": 19, "v": 18, "n": 2, "dh": "אל נא", "pasuk_html": "וַיֹּ֥אמֶר ל֖וֹט אֲלֵהֶ֑ם אַל־נָ֖א אֲדֹנָֽי׃", "pasuk_en": "Lot said to them, Please, not so my Master.", "rashi_he": "אַל תֹּאמְרוּ אֵלַי לְהִמָּלֵט הָהָרָה:", "rashi_en": "[Meaning:] please do not tell me to flee to the mountain.", "note": "", "points": [{"q": "Lot says 'אל נא' — 'please, not.' Please not what?", "options": ["Don't tell me to flee to the mountain", "Don't destroy Sedom", "Don't leave me alone here"], "kasha": "'אל' (don't) has no object — what is Lot objecting to?", "answer": "Please don't tell me to flee to the mountain."}]}, {"id": "19:18.3", "ch": 19, "v": 18, "n": 3, "dh": "נא", "pasuk_html": "וַיֹּ֥אמֶר ל֖וֹט אֲלֵהֶ֑ם אַל־<mark>נָ֖א</mark> אֲדֹנָֽי׃", "pasuk_en": "Lot said to them, Please, not so my Master.", "rashi_he": "לְשׁוֹן בַּקָּשָׁה:", "rashi_en": "It has the meaning מתוך making a request.", "note": "", "points": [{"q": "What does the word 'נא' mean here?", "options": ["It is a word מתוך request — please", "It means 'now,' נכון away", "It means 'raw' or 'unfinished'"], "kasha": "'נא' has more than one meaning — which is it here?", "answer": "It is לשון בקשה — an expression מתוך request, 'please.'"}]}, {"id": "19:19.1", "ch": 19, "v": 19, "n": 1, "dh": "פן תדבקני הרעה", "pasuk_html": "הִנֵּה־נָ֠א מָצָ֨א עַבְדְּךָ֣ חֵן֮ בְּעֵינֶ֒יךָ֒ וַתַּגְדֵּ֣ל חַסְדְּךָ֗ אֲשֶׁ֤ר עָשִׂ֙יתָ֙ עִמָּדִ֔י לְהַחֲי֖וֹת אֶת־נַפְשִׁ֑י וְאָנֹכִ֗י לֹ֤א אוּכַל֙ לְהִמָּלֵ֣ט הָהָ֔רָה פֶּן־תִּדְבָּקַ֥נִי הָרָעָ֖ה וָמַֽתִּי׃", "pasuk_en": "Behold your servant has found favor in Your eyes. Great is your kindness that you have done with me, to keep me alive. I cannot escape to the mountain, lest the evil attach itself to me and I die.", "rashi_he": "כְּשֶׁהָיִיתִי אֵצֶל אַנְשֵׁי סְדוֹם הָיָה הַקָּבָּ\"ה רוֹאֶה מַעֲשַׂי וּמַעֲשֵׂה בְנֵי הָעִיר, וְהָיִיתִי נִרְאֶה צַדִּיק וּכְדַאי לְהִנָּצֵל, וּכְשֶׁאָבֹא אֵצֶל צַדִּיק אֲנִי כְרָשָׁע, וְכֵן אָמְרָה הַצָּרְפִית לְאֵלִיָּהוּ בָּאתָ אֵלַי לְהַזְכִּיר אֶת עֲוֹנִי (מלכים א י\"ז), עַד שֶׁלֹא בָאתָ אֶצְלִי הָיָה הַקָּבָּ\"ה רוֹאֶה מַעֲשַׂי וּמַעֲשֵׂה עַמִּי, וַאֲנִי צַדֶּקֶת בֵּינֵיהֶם, וּמִשֶּׁבָּאתָ אֶצְלִי, לְפִי מַעֲשֶׂיךָ אֲנִי רְשָׁעָה:", "rashi_en": "[Lot thought:] When I was with the Sedomites, God saw my deeds and the deeds מתוך the people מתוך the city, and I appeared to be a נכוןeous person and worthy מתוך being rescued. But, when I will come to the נכוןeous person I will be [seen] as an evil person. This, too, is what the woman מתוך Zorfas said to Eliyahu: “Have you come to me to call attention to my sins?” [Meaning:] before you came to me, God saw my deeds and the deeds מתוך my nation and I would be נכוןeous compared to them. But, once you have come to me [then], compared to your deeds, I am an evil person.", "note": "", "points": [{"q": "Lot fears going to the mountain: 'פן תדבקני הרעה' — lest the evil cling to me. Why would being near Avraham endanger him?", "options": ["Next to a tzaddik he would look wicked", "Avraham would refuse to take him in", "The mountain was too far to reach in time"], "kasha": "Going to Avraham should be safer — why does Lot think the evil will catch him there?", "answer": "In Sedom, Hashem compared Lot to the townspeople, so he seemed נכוןeous and worthy מתוך rescue. Next to a tzaddik he would seem wicked."}, {"q": "Who else in Tanach expressed the same fear about being near a tzaddik?", "options": ["The woman מתוך Tzorfas, speaking to Eliyahu", "Lot's wife, speaking to Lot", "Hagar, speaking to Sarah"], "kasha": "רש״י brings a source for this idea.", "answer": "The woman מתוך Tzorfas told Eliyahu, 'You came to recall my sin': before, compared to my people I was נכוןeous; now, compared to your deeds, I am wicked."}]}, {"id": "19:20.1", "ch": 19, "v": 20, "n": 1, "dh": "העיר הזאת קרובה", "pasuk_html": "הִנֵּה־נָ֠א הָעִ֨יר הַזֹּ֧את קְרֹבָ֛ה לָנ֥וּס שָׁ֖מָּה וְהִ֣וא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּה הֲלֹ֥א מִצְעָ֛ר הִ֖וא וּתְחִ֥י נַפְשִֽׁי׃", "pasuk_en": "Behold, please, this city is near [enough] to flee there. It is insignificant. Let me escape there! It is insignificant, and my life will be saved.", "rashi_he": "קְרוֹבָה יְשִׁיבָתָהּ, נִתְיַשְּׁבָה מִקָּרוֹב, לְפִיכָךְ לֹא נִתְמַלְּאָה סְאָתָהּ עֲדַיִן (שבת י'). וּמַה הִיא קְרִיבָתָהּ? מִדּוֹר הַפַּלָּגָה שֶׁנִּתְפַּלְּגוּ הָאֲנָשִׁים וְהִתְחִילוּ לְהִתְיַשֵּׁב אִישׁ אִישׁ בִּמְקוֹמוֹ, וְהִיא הָיְתָה בִּשְׁנַת מוֹת פֶּלֶג, וּמִשָּׁם וְעַד כָּאן נ\"ב שָׁנָה, שֶׁפֶּלֶג מֵת בִּשְׁנַת מ\"ח לְאַבְרָהָם. כֵּיצַד? פֶּלֶג חַי אַחֲרֵי הוֹלִידוֹ אֶת רְעוּ ר\"ט שָׁנָה, צֵא מֵהֶם ל\"ב כְּשֶׁנּוֹלַד שְׂרוּג, וּמִשְּׂרוּג עַד שֶׁנּוֹלַד נָחוֹר ל', הֲרֵי ס\"ב, וּמִנָּחוֹר עַד שֶׁנּוֹלַד תֶּרַח כ\"ט, הֲרֵי צ\"א, וּמִשָּׁם עַד שֶׁנּוֹלַד אַבְרָהָם ע', הֲרֵי קס\"א, תֵּן לָהֶם מ\"ח הֲרֵי ר\"ט, וְאוֹתָה שָׁנָה הָיְתָה שְׁנַת הַפַּלָּגָה, וּכְשֶׁנֶּחְרְבָה סְדוֹם הָיָה אַבְרָהָם בֶּן צ\"ט שָׁנָה, הֲרֵי מִדּוֹר הַפַּלָּגָה עַד כָּאן נ\"ב שָׁנָה; וְצֹעַר אִחֲרָה יְשִׁיבָתָהּ אַחֲרֵי יְשִׁיבַת סְדוֹם וְחַבְרוֹתֶיהָ שָׁנָה אַחַת, הוּא שֶׁנֶּאֱמַר אִמָּלְטָה נָּא, נָא בְּגִימַטְרִיָּא נ\"א:", "rashi_en": "Settled “near” [in point מתוך time], [meaning] recently settled. Therefore its measure has not yet been filled. How recent is it[s settlement]? From the generation מתוך the Dispersion when humanity dispersed and began to settle, each in his place, which was in the year that Peleg died. From then till now there were 52 years, for Peleg died when Avraham was 48. How is this [calculated]? After Re’u was born, Peleg lived 209 years. Deduct from them 32 when Serug was born and the 30 years from Serug’s birth to Nachor’s birth giving you 62 years. And 29 years from Nachor’s birth to Terach’s birth giving you 91 years. 70 years from then to Avraham’s birth, giving you 161 years Add another 48 years, giving you 209 years. That was the year מתוך the Dispersion. When Sedom was destroyed Avraham was 99 years old. Thus, from the generation מתוך the Dispersion till this point, there are 52 years. The settling מתוך Zoar took place later than the settling מתוך Sedom and its sister cities by one year. This, then, is what is said, “Please [נָא] let me escape.” נָא having the numerical value מתוך 51.", "note": "", "points": [{"q": "Lot says Tzoar is 'קרובה' — near. Why would that be a reason to spare it?", "options": ["Settled recently, so its measure מתוך sin isn't full", "Close enough that Lot can run there quickly", "Its people were close relatives מתוך Lot"], "kasha": "Why would being 'near' be a reason to spare the city?", "answer": "It was settled recently, so its measure מתוך sin was not yet full (Gemara Shabbos)."}, {"q": "Since when were the cities settled, and how long ago was that?", "options": ["Since the Dor Haflagah, the year Peleg died — 52 years", "Since the Mabul ended — about 300 years", "Since Avraham came to Canaan — 24 years"], "kasha": "How recent is 'recently settled'?", "answer": "People began settling each in his place after the Dor Haflagah, in the year Peleg died — when Avraham was 48. Sedom was destroyed when Avraham was 99, so 52 years."}, {"q": "How does רש״י calculate that Peleg died when Avraham was 48?", "options": ["Peleg lived 209 years after Reu; 161 passed before Avraham", "Peleg died the year Avraham left Charan", "Peleg lived exactly as long as Terach did"], "kasha": "The Torah never says when Peleg died relative to Avraham.", "answer": "Peleg lived 209 years after Reu's birth. Reu to Serug 32, to Nachor 30, to Terach 29, to Avraham 70 — 161. Add 48 to reach 209."}, {"q": "Lot says 'אמלטה נא.' What hint about Tzoar does רש״י find in the word 'נא'?", "options": ["נא equals 51 — Tzoar was settled a year after Sedom", "נא means 'please' — Lot begged twice", "נא means 'raw' — Tzoar was undeveloped"], "kasha": "Why should Tzoar be spared while its sister cities, settled at the same time, are not?", "answer": "Tzoar was settled one year after Sedom and its sister cities. That is why it says 'נא' — gematria 51."}]}, {"id": "19:20.2", "ch": 19, "v": 20, "n": 2, "dh": "הלא מצער היא", "pasuk_html": "הִנֵּה־נָ֠א הָעִ֨יר הַזֹּ֧את קְרֹבָ֛ה לָנ֥וּס שָׁ֖מָּה וְהִ֣וא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּה הֲלֹ֥א מִצְעָ֛ר הִ֖וא וּתְחִ֥י נַפְשִֽׁי׃", "pasuk_en": "Behold, please, this city is near [enough] to flee there. It is insignificant. Let me escape there! It is insignificant, and my life will be saved.", "rashi_he": "וַהֲלֹא עֲוֹנוֹתֶיהָ מוּעָטִין וְיָכוֹל אַתָּה לְהַנִּיחָהּ:", "rashi_en": "[Meaning:] its sins are few, and You may, therefore, spare it …", "note": "", "points": [{"q": "Lot argues 'הלא מצער היא' — isn't it small? Why would its smallness matter?", "options": ["Its sins are few, so You can spare it", "It's too small to hold Lot's family", "It's too small for anyone to notice"], "kasha": "What does the city's being small have to do with sparing it?", "answer": "Its sins are few, so You can let it stand."}]}, {"id": "19:20.3", "ch": 19, "v": 20, "n": 3, "dh": "ותחי נפשי", "pasuk_html": "הִנֵּה־נָ֠א הָעִ֨יר הַזֹּ֧את קְרֹבָ֛ה לָנ֥וּס שָׁ֖מָּה וְהִ֣וא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּה הֲלֹ֥א מִצְעָ֛ר הִ֖וא <mark>וּתְחִ֥י נַפְשִֽׁי׃</mark>", "pasuk_en": "Behold, please, this city is near [enough] to flee there. It is insignificant. Let me escape there! It is insignificant, and my life will be saved.", "rashi_he": "בָּהּ, זֶהוּ מִדְרָשׁוֹ. וּפְשׁוּטוֹ שֶׁל מִקְרָא הֲלֹא עִיר קְטַנָּה הִיא וַאֲנָשִׁים בָּהּ מְעַט, אֵין לָךְ לְהַקְפִּיד אִם תַּנִּיחֶנָּה, וּתְחִי נַפְשִׁי בָהּ:", "rashi_en": "in it [the city]. This is the Midrashic explanation. However, the plain explanation מתוך the verse is: It is a small city with few people; You should not mind sparing it so that I might live in it.", "note": "", "points": [{"q": "'ותחי נפשי' — and my life will be saved. Saved where, according to the Midrash?", "options": ["In that city, which will be spared", "On the mountain with Avraham", "Anywhere outside the plain"], "kasha": "Lot wants Tzoar spared — how does that connect to his life being saved?", "answer": "My life will be saved in it — that city. This is the Midrashic reading (its sins are few)."}, {"q": "What is the simple meaning (פשוטו) מתוך 'הלא מצער היא ותחי נפשי'?", "options": ["It's a small town with few people — don't mind sparing it", "Its people are few, so their sins are few", "Tzoar is tiny, so Lot's family can hide there unseen"], "kasha": "The Midrash reads 'מצער' as few sins — what do the words mean plainly?", "answer": "It is a small city with few people; You need not be strict about letting it stand, and I can live there."}]}, {"id": "19:21.1", "ch": 19, "v": 21, "n": 1, "dh": "גם לדבר הזה", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֔יו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔יךָ <mark>גַּ֖ם לַדָּבָ֣ר הַזֶּ֑ה</mark> לְבִלְתִּ֛י הׇפְכִּ֥י אֶת־הָעִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ׃", "pasuk_en": "He said to him, See I have also given you consideration regarding this. I will not overturn the city that you mentioned.", "rashi_he": "לֹא דַּיְּךָ שֶׁאַתָּה נִצָּל, אֶלָּא אַף כָּל הָעִיר אַצִּיל בִּגְלָלְךָ:", "rashi_en": "Not only will you be saved, but, I will spare the entire city for your sake.", "note": "", "points": [{"q": "The malach says 'גם לדבר הזה' — also regarding this. What does 'also' add?", "options": ["Not only you are saved; the whole city too", "Also your wife will be saved", "Also Avraham's prayer is accepted"], "kasha": "'גם' implies something in addition — in addition to what?", "answer": "Not only are you saved, but I will save the whole city for your sake."}]}, {"id": "19:21.2", "ch": 19, "v": 21, "n": 2, "dh": "הפכי", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֔יו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔יךָ גַּ֖ם לַדָּבָ֣ר הַזֶּ֑ה לְבִלְתִּ֛י <mark>הׇפְכִּ֥י</mark> אֶת־הָעִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ׃", "pasuk_en": "He said to him, See I have also given you consideration regarding this. I will not overturn the city that you mentioned.", "rashi_he": "הוֹפֵךְ אֲנִי, כְּמוֹ עַד בֹּאִי (בראשית מ\"ח), אַחֲרֵי רֹאִי (בראשית ט״ז:י״ג), מִדֵּי דַבְּרִי בּוֹ (ירמיהו ל\"א):", "rashi_en": "[Meaning:] “I overturn” as in עַד בּוֹאִי — “Until I come” [or as in] אַחֲרֵי רוֹאִי —“After I have seen.” [or] מִדֵּי דַבְּרִי בּוֹ —“When I speak מתוך him.”", "note": "", "points": [{"q": "'לבלתי הפכי' — what does the form 'הפכי' mean?", "options": ["'My overturning' — that I overturn", "'Overturn it!' — a command to Lot", "'Its overturning' — the city's own collapse"], "kasha": "'הפכי' is an unusual form — who is doing the overturning?", "answer": "It means 'I overturn' — the malach speaking מתוך himself."}, {"q": "Which similar words show that the ending '-י' can mean 'my ___ing'?", "options": ["'עד בואי', 'אחרי ראי', 'מדי דברי בו'", "'לך לך', 'קום לך', 'שוב אלי'", "'הנני', 'עמדי', 'אחרי'"], "kasha": "Where else is this grammatical form found?", "answer": "Like 'עד בואי' — until I come; 'אחרי ראי' — after I saw; 'מדי דברי בו' — whenever I speak מתוך him."}]}, {"id": "19:22.1", "ch": 19, "v": 22, "n": 1, "dh": "כי לא אוכל לעשות", "pasuk_html": "מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּה <mark>כִּ֣י לֹ֤א אוּכַל֙ לַעֲשׂ֣וֹת</mark> דָּבָ֔ר עַד־בֹּאֲךָ֖ שָׁ֑מָּה עַל־כֵּ֛ן קָרָ֥א שֵׁם־הָעִ֖יר צֽוֹעַר׃", "pasuk_en": "Hurry, escape there, for I can do nothing until you get there. The city was therefore called Zoar.", "rashi_he": "זֶה עָנְשָׁן שֶׁל מַלְאָכִים עַל שֶׁאָמְרוּ כִּי מַשְׁחִתִים אֲנַחְנוּ, וְתָלוּ הַדָּבָר בְּעַצְמָן, לְפִיכָך לֹא זָזוּ מִשָּׁם עַד שֶׁהֻזְקְקוּ לוֹמַר שֶׁאֵין הַדָּבָר בִּרְשׁוּתָן:", "rashi_en": "This was a punishment for the angels. Since they had said, “We are going to destroy this place, thereby, attributing themselves, they, therefore, could not leave from there until they were obliged to state that the thing was not in their control.", "note": "", "points": [{"q": "The malach says 'כי לא אוכל לעשות דבר' — I cannot do anything. Why must he admit he lacks power?", "options": ["As a punishment for an earlier statement", "To make Lot hurry more", "Because the fire wasn't ready yet"], "kasha": "Why does the malach need to announce his helplessness?", "answer": "It was a punishment: the malachim could not leave until they were forced to say the matter was not in their control."}, {"q": "What had the malachim said that deserved this punishment?", "options": ["'כי משחיתים אנחנו' — taking credit for destroying", "'קום צא מן המקום' — rushing Lot", "'אל תביט אחריך' — warning Lot"], "kasha": "What did the malachim do wrong?", "answer": "They had said 'we are destroying this place,' attributing the destruction to themselves."}]}, {"id": "19:22.2", "ch": 19, "v": 22, "n": 2, "dh": "כי לא אוכל", "pasuk_html": "מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּה <mark>כִּ֣י לֹ֤א אוּכַל֙</mark> לַעֲשׂ֣וֹת דָּבָ֔ר עַד־בֹּאֲךָ֖ שָׁ֑מָּה עַל־כֵּ֛ן קָרָ֥א שֵׁם־הָעִ֖יר צֽוֹעַר׃", "pasuk_en": "Hurry, escape there, for I can do nothing until you get there. The city was therefore called Zoar.", "rashi_he": "לְשׁוֹן יָחִיד; מִכָּאן אַתָּה לָמֵד שֶׁהָאֶחָד הוֹפֵךְ וְהָאֶחָד מַצִּיל, שֶׁאֵין ב' מַלְאָכִים נִשְׁלָחִים לְדָבָר א':", "rashi_en": "[לֹא אוּכַל] is in the singular form. From this you can learn that one destroys and the other rescues because two angels are not sent for one thing [mission].", "note": "", "points": [{"q": "'לא אוכל' is singular, though two malachim were there. What do we learn from it?", "options": ["One malach destroys and the other one rescues", "Only one malach was actually present", "Both malachim spoke the same words together"], "kasha": "There were two malachim — why the singular 'I cannot'?", "answer": "From here we learn that one malach overturns Sedom and the other rescues Lot."}, {"q": "Why couldn't both malachim share the same job?", "options": ["Two malachim are never sent for one mission", "Only one malach was strong enough", "Lot only let one malach into his house"], "kasha": "Why must the tasks be divided?", "answer": "Two malachim are not sent for a single mission."}]}, {"id": "19:22.3", "ch": 19, "v": 22, "n": 3, "dh": "על כן קרא שם העיר צוער", "pasuk_html": "מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּה כִּ֣י לֹ֤א אוּכַל֙ לַעֲשׂ֣וֹת דָּבָ֔ר עַד־בֹּאֲךָ֖ שָׁ֑מָּה עַל־כֵּ֛ן קָרָ֥א שֵׁם־הָעִ֖יר צֽוֹעַר׃", "pasuk_en": "Hurry, escape there, for I can do nothing until you get there. The city was therefore called Zoar.", "rashi_he": "עַל שֵׁם וְהִוא מִצְעָר:", "rashi_en": "Based on [Lot’s words:] “It is insignificant.”", "note": "", "points": [{"q": "'על כן קרא שם העיר צוער' — why was the city named Tzoar?", "options": ["After Lot's words 'והיא מצער' — it is small", "After its distress (צער) during the destruction", "After a king named Tzoar who ruled it"], "kasha": "'על כן' — because מתוך what was it called Tzoar?", "answer": "Because Lot said 'והיא מצער' — it is small."}]}, {"id": "19:24.1", "ch": 19, "v": 24, "n": 1, "dh": "וה' המטיר", "pasuk_html": "וַֽיהֹוָ֗ה הִמְטִ֧יר עַל־סְדֹ֛ם וְעַל־עֲמֹרָ֖ה גׇּפְרִ֣ית וָאֵ֑שׁ מֵאֵ֥ת יְהֹוָ֖ה מִן־הַשָּׁמָֽיִם׃", "pasuk_en": "Adonoy caused to rain upon Sedom and Amorah—sulfur and fire—from Adonoy, from heaven.", "rashi_he": "כָּל מָקוֹם שֶׁנֶּאֱמַר וַה' – הוּא וּבֵית דִּינוֹ:", "rashi_en": "Where וה' [with a ו] appears in Scripture, [it represents] Him and His Heavenly Court.", "note": "", "points": [{"q": "'וה' המטיר' — the posuk says 'וה'' with a vav. What does that vav indicate?", "options": ["Hashem together with His Heavenly Court", "Hashem acting entirely alone", "A malach acting in Hashem's name"], "kasha": "Why the extra ו in 'וה''?", "answer": "Wherever it says 'וה'', it means Hashem and His Beis Din."}]}, {"id": "19:24.2", "ch": 19, "v": 24, "n": 2, "dh": "המטיר על סדום", "pasuk_html": "וַֽיהֹוָ֗ה הִמְטִ֧יר עַל־סְדֹ֛ם וְעַל־עֲמֹרָ֖ה גׇּפְרִ֣ית וָאֵ֑שׁ מֵאֵ֥ת יְהֹוָ֖ה מִן־הַשָּׁמָֽיִם׃", "pasuk_en": "Adonoy caused to rain upon Sedom and Amorah—sulfur and fire—from Adonoy, from heaven.", "rashi_he": "בַּעֲלוֹת הַשַּׁחַר, כְּמוֹ שֶׁנֶּאֱמַר וּכְמוֹ הַשַּׁחַר עָלָה, שָׁעָה שֶׁהַלְּבָנָה עוֹמֶדֶת בָּרָקִיעַ עִם הַחַמָּה, לְפִי שֶׁהָיוּ מֵהֶם עוֹבְדִין לַחַמָּה וּמֵהֶם לַלְּבָנָה, אָמַר הַקָּבָּ\"ה אִם אֶפָּרַע מֵהֶם בַּיּוֹם, יִהְיוּ עוֹבְדֵי לְבָנָה אוֹמְרִים אִלּוּ הָיָה בַלַּיְלָה, כְּשֶׁהַלְּבָנָה מוֹשֶׁלֶת, לֹא הָיִינוּ חֲרֵבִין, וְאִם אֶפָּרַע מֵהֶם בַּלַּיְלָה, יִהְיוּ עוֹבְדֵי הַחַמָּה אוֹמְרִים אִלּוּ הָיָה בַּיּוֹם, כְּשֶׁהַחַמָּה מוֹשֶׁלֶת, לֹא הָיִינוּ חֲרֵבִין; לְכָךְ כְּתִיב וּכְמוֹ הַשַּׁחַר עָלָה, וְנִפְרַע מֵהֶם בְּשָׁעָה שֶׁהַחַמָּה וְהַלְּבָנָה מוֹשְׁלוֹת:", "rashi_en": "At the advent מתוך the morning, as it is said: “At the break מתוך dawn.” It is the time when the moon is in the sky together with the sun. Since some מתוך them worshiped the sun and some מתוך them, the moon. God said: If I punish them by day, the moon-worshipers will say, were it at night when the moon rules, we would not have been destroyed. And if I punish them by night the sun-worshipers will say were it by day, when the sun rules, we would not have been destroyed. It, therefore states: “At the break מתוך dawn”— he punished them at a time when both the sun and the moon rule.", "note": "", "points": [{"q": "At what time did the rain מתוך fire fall on Sedom?", "options": ["At dawn, when sun and moon are both in the sky", "At midnight, when everyone was asleep", "At midday, in the heat מתוך the sun"], "kasha": "The posuk doesn't say when — but earlier it says 'וכמו השחר עלה.'", "answer": "At dawn, as it says 'וכמו השחר עלה' — when the moon stands in the sky together with the sun."}, {"q": "Why did Hashem choose that moment to punish Sedom?", "options": ["Some worshipped the sun and some the moon", "Lot needed the daylight to see his way", "The people were still asleep at that hour"], "kasha": "Why does the timing matter at all?", "answer": "Some worshipped the sun and some the moon. By day, moon-worshippers would say 'at night we'd be safe,' and vice versa — so Hashem punished them when both rule."}]}, {"id": "19:24.3", "ch": 19, "v": 24, "n": 3, "dh": "המטיר גפרית ואש", "pasuk_html": "וַֽיהֹוָ֗ה הִמְטִ֧יר עַל־סְדֹ֛ם וְעַל־עֲמֹרָ֖ה גׇּפְרִ֣ית וָאֵ֑שׁ מֵאֵ֥ת יְהֹוָ֖ה מִן־הַשָּׁמָֽיִם׃", "pasuk_en": "Adonoy caused to rain upon Sedom and Amorah—sulfur and fire—from Adonoy, from heaven.", "rashi_he": "בַּתְּחִלָּה מָטָר, וְנַעֲשָׂה גָּפְרִית וָאֵשׁ:", "rashi_en": "It began as rain and turned into sulfur and fire.", "note": "", "points": [{"q": "'המטיר... גפרית ואש' — how can fire and sulfur 'rain'?", "options": ["It began as rain and became sulfur and fire", "The fire fell as gently as rain", "Sparks fell gently, like drops מתוך rain"], "kasha": "'המטיר' (rained) is an odd verb for fire and sulfur.", "answer": "At first it came down as rain, and then it turned into sulfur and fire."}]}, {"id": "19:24.4", "ch": 19, "v": 24, "n": 4, "dh": "מאת ה'", "pasuk_html": "וַֽיהֹוָ֗ה הִמְטִ֧יר עַל־סְדֹ֛ם וְעַל־עֲמֹרָ֖ה גׇּפְרִ֣ית וָאֵ֑שׁ מֵאֵ֥ת יְהֹוָ֖ה מִן־הַשָּׁמָֽיִם׃", "pasuk_en": "Adonoy caused to rain upon Sedom and Amorah—sulfur and fire—from Adonoy, from heaven.", "rashi_he": "דֶּרֶךְ הַמִּקְרָאוֹת לְדַבֵּר כֵּן, כְּמוֹ נְשֵׁי לֶמֶךְ, וְלֹא אָמַר נָשַׁי; וְכֵן אָמַר דָּוִד קְחוּ עִמָּכֶם אֶת עַבְדֵי אֲדֹנֵיכֶם (מלכים א א'), וְלֹא אָמַר מֵעֲבָדַי; וְכֵן אֲחַשְׁוֵרוֹשׁ אָמַר בְּשֵׁם הַמֶּלֶךְ, וְלֹא אָמַר בִּשְׁמִי; אַף כָּאן אָמַר, מֵאֵת ה' וְלֹא אָמַר מֵאִתִּי:", "rashi_en": "It is usual for Scripture to express it so, as in “The wives מתוך Lemech” and he did not say, my wives. Likewise, Dovid said, “Take your master’s servants with you” and he did not say, my servants. Likewise Achashverosh said, “In the name מתוך the king” and he did not say, in my name. Here, too, it states, “from God” and it does not state, from Him.", "note": "", "points": [{"q": "'וה' המטיר... מאת ה'' — Hashem rained from Hashem. Why not say 'from Himself'?", "options": ["Tanach מתוךten uses a speaker's name instead מתוך 'me'", "Two different Powers did this together", "The second 'ה'' refers to a malach"], "kasha": "The posuk names Hashem twice, as if speaking מתוך someone else.", "answer": "That is the way מתוך pesukim: speakers refer to themselves by name instead מתוך 'me.' Here too it says 'from Hashem' rather than 'from Me.'"}, {"q": "Which examples show a speaker using his own name or title instead מתוך 'me'?", "options": ["Lemech, Dovid, and Achashverosh", "Avraham, Yitzchak, and Yaakov", "Moshe, Aharon, and Miriam"], "kasha": "רש״י needs proמתוך that this is a normal style.", "answer": "Lemech said 'נשי למך,' not 'my wives'; Dovid said 'עבדי אדניכם,' not 'my servants'; Achashverosh said 'בשם המלך,' not 'in my name.'"}]}, {"id": "19:24.5", "ch": 19, "v": 24, "n": 5, "dh": "מן השמים", "pasuk_html": "וַֽיהֹוָ֗ה הִמְטִ֧יר עַל־סְדֹ֛ם וְעַל־עֲמֹרָ֖ה גׇּפְרִ֣ית וָאֵ֑שׁ מֵאֵ֥ת יְהֹוָ֖ה מִן־הַשָּׁמָֽיִם׃", "pasuk_en": "Adonoy caused to rain upon Sedom and Amorah—sulfur and fire—from Adonoy, from heaven.", "rashi_he": "הוּא שֶׁאָמַר הַכָּתוּב כִּי בָם יָדִין עַמִּים וְגוֹ' (איוב ל\"ו), כְּשֶׁבָּא לְיַסֵּר הֵבְּרִיוֹת מֵבִיא עֲלֵיהֶם אֵשׁ מִן הַשָּׁמַיִם, כְּמוֹ שֶׁעָשָׂה לִסְדוֹם, וּכְשֶׁבָּא לְהוֹרִיד הַמָּן מִן הַשָּׁמַיִם הִנְנִי מַמְטִיר לָכֶם לֶחֶם מִן הַשָּׁמָיִם (שמות ט\"ז):", "rashi_en": "This is what Scripture means when saying: “For by them [the heavens] He punishes nations,” etc. When He comes to punish mankind He brings fire upon them from the heavens as He did to Sedom. And when He comes to cause Manna to fall [it was also] from the heavens. [As the verse states:] “Behold, I will cause bread to rain from heaven for you.”", "note": "", "points": [{"q": "Why does the posuk add 'מן השמים' — from heaven?", "options": ["Hashem uses the heavens to punish nations", "Fire normally rises from the ground", "To show the malachim lived in heaven"], "kasha": "We know rain comes from the sky — why add 'from heaven'?", "answer": "As Iyov says, 'כי בם ידין עמים' — through the heavens He judges nations. When He punishes people He brings fire from heaven, as He did to Sedom."}, {"q": "Do the heavens bring only punishment, according to Rashi?", "options": ["No — the mann also came down from heaven", "Yes — heaven is only a source מתוך punishment", "No — the Mabul came from heaven too"], "kasha": "רש״י shows the same heavens serve another purpose too.", "answer": "When Hashem brought down the mann, it also came from heaven: 'הנני ממטיר לכם לחם מן השמים.'"}]}, {"id": "19:25.1", "ch": 19, "v": 25, "n": 1, "dh": "ויהפך את הערים וגו'", "pasuk_html": "וַֽיַּהֲפֹךְ֙ אֶת־הֶעָרִ֣ים הָאֵ֔ל וְאֵ֖ת כׇּל־הַכִּכָּ֑ר וְאֵת֙ כׇּל־יֹשְׁבֵ֣י הֶעָרִ֔ים וְצֶ֖מַח הָאֲדָמָֽה׃", "pasuk_en": "He overturned these cities, and the entire plain, and all those who lived in the cities and all that grew upon the ground.", "rashi_he": "אַרְבַּעְתָּם יוֹשְׁבוֹת בְּסֶלַע אֶחָד וַהֲפָכָן מִלְמַעְלָה לְמַטָּה, שֶׁנֶּאֱמַר בַּחַלָּמִישׁ שָׁלַח יָדוֹ וְגוֹ' (איוב כ'):", "rashi_en": "The four מתוך them were located on one rock [formation] and he turned them upside down, as it is said: “He reached for the rock,” etc.", "note": "", "points": [{"q": "'ויהפך את הערים' — how exactly were the cities 'overturned'?", "options": ["All four sat on one rock, flipped upside down", "Each city was burned separately", "An earthquake swallowed each city"], "kasha": "'ויהפך' — overturned — implies more than just burning.", "answer": "All four cities sat on one rock, and Hashem turned it upside down."}, {"q": "Which posuk does רש״י bring for this?", "options": ["'בחלמיש שלח ידו' — He reached into the rock", "'כי בם ידין עמים' — through them He judges", "'וכמו השחר עלה' — as dawn rose"], "kasha": "Where do we see that the cities were on a rock?", "answer": "Iyov: 'בחלמיש שלח ידו' — He sent His hand against the flint rock."}]}, {"id": "19:26.1", "ch": 19, "v": 26, "n": 1, "dh": "ותבט אשתו מאחריו", "pasuk_html": "<mark>וַתַּבֵּ֥ט אִשְׁתּ֖וֹ מֵאַחֲרָ֑יו</mark> וַתְּהִ֖י נְצִ֥יב מֶֽלַח׃", "pasuk_en": "His [Lot’s] wife looked behind him; and she became a pillar מתוך salt.", "rashi_he": "שֶׁל לוֹט:", "rashi_en": "[Meaning: in back] מתוך Lot.", "note": "", "points": [{"q": "'ותבט אשתו מאחריו' — his wife looked behind him. Behind whom?", "options": ["Behind Lot", "Behind the malach", "Behind her daughters"], "kasha": "'מאחריו' — whose back is meant?", "answer": "Behind Lot: 'him' (מאחריו) refers to Lot."}]}, {"id": "19:26.2", "ch": 19, "v": 26, "n": 2, "dh": "ותהי נציב מלח", "pasuk_html": "וַתַּבֵּ֥ט אִשְׁתּ֖וֹ מֵאַחֲרָ֑יו <mark>וַתְּהִ֖י נְצִ֥יב מֶֽלַח׃</mark>", "pasuk_en": "His [Lot’s] wife looked behind him; and she became a pillar מתוך salt.", "rashi_he": "בְּמֶלַח חָטְאָה וּבְמֶלַח לָקְתָה; אָמַר לָהּ תְּנִי מְעַט מֶלַח לָאוֹרְחִים הַלָּלוּ, אָמְרָה לוֹ אַף הַמִּנְהָג הָרַע הַזֶּה אַתָּה בָא לְהַנְהִיג בַּמָּקוֹם הַזֶּה (בראשית רבה):", "rashi_en": "She sinned with salt and she was punished with salt. He [Lot] said to her, “Serve some salt to the guests.” She said to him, “Even this evil custom, do you mean to introduce in this place?”", "note": "", "points": [{"q": "Why was Lot's wife turned specifically into a pillar מתוך salt?", "options": ["She sinned with salt, so was punished with salt", "Sedom was near the Salt Sea", "Salt preserves, so she'd be a lasting sign"], "kasha": "Why salt, מתוך all things?", "answer": "She sinned with salt and was punished with salt."}, {"q": "How did Lot's wife sin with salt?", "options": ["She refused to give the guests salt", "She salted the guests' food too heavily", "She stole salt from her neighbors"], "kasha": "What was her sin involving salt?", "answer": "Lot told her to give the guests some salt. She said, 'You want to bring this bad custom here too?' (בראשית Rabbah)."}]}, {"id": "19:28.1", "ch": 19, "v": 28, "n": 1, "dh": "קיטור", "pasuk_html": "וַיַּשְׁקֵ֗ף עַל־פְּנֵ֤י סְדֹם֙ וַעֲמֹרָ֔ה וְעַֽל־כׇּל־פְּנֵ֖י אֶ֣רֶץ הַכִּכָּ֑ר וַיַּ֗רְא וְהִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָאָ֔רֶץ כְּקִיטֹ֖ר הַכִּבְשָֽׁן׃", "pasuk_en": "He [Avraham] stared at Sedom and Amorah, and the whole land מתוך the plain, and he saw the heavy smoke rising from the earth like the smoke מתוך a furnace.", "rashi_he": "תִּמּוּר שֶׁל עָשָׁן, טורק\"א בלע\"ז:", "rashi_en": "[Meaning] a column מתוך smoke, torche in Old French.", "note": "", "points": [{"q": "What is 'קיטר' in 'קיטר הארץ'?", "options": ["A column מתוך smoke", "A pile מתוך ash", "A flash מתוך lightning"], "kasha": "'קיטר' is an unusual word — what does it mean?", "answer": "A pillar מתוך smoke (torche in Old French)."}]}, {"id": "19:28.2", "ch": 19, "v": 28, "n": 2, "dh": "הכבשן", "pasuk_html": "וַיַּשְׁקֵ֗ף עַל־פְּנֵ֤י סְדֹם֙ וַעֲמֹרָ֔ה וְעַֽל־כׇּל־פְּנֵ֖י אֶ֣רֶץ הַכִּכָּ֑ר וַיַּ֗רְא וְהִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָאָ֔רֶץ כְּקִיטֹ֖ר <mark>הַכִּבְשָֽׁן׃</mark>", "pasuk_en": "He [Avraham] stared at Sedom and Amorah, and the whole land מתוך the plain, and he saw the heavy smoke rising from the earth like the smoke מתוך a furnace.", "rashi_he": "חֲפִירָה שֶׁשּׂוֹרְפִין בָּה אֶת הָאֲבָנִים לְסִיד, וְכֵן כָּל כִּבְשָׁן שֶׁבַּתּוֹרָה:", "rashi_en": "It is an excavation in which stones are burned for lime. This is the meaning every time. כִּבְשָׁן appears in the Torah.", "note": "", "points": [{"q": "'כקיטר הכבשן' — what is a 'כבשן'?", "options": ["A pit where stones are burned to make lime", "A baker's oven for bread", "A furnace for melting gold"], "kasha": "'כבשן' is an unusual word — what does it mean?", "answer": "A pit in which stones are burned to make lime; that is its meaning everywhere in the Torah."}]}, {"id": "19:29.1", "ch": 19, "v": 29, "n": 1, "dh": "ויזכור אלהים את אברהם", "pasuk_html": "וַיְהִ֗י בְּשַׁחֵ֤ת אֱלֹהִים֙ אֶת־עָרֵ֣י הַכִּכָּ֔ר וַיִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת־אַבְרָהָ֑ם וַיְשַׁלַּ֤ח אֶת־לוֹט֙ מִתּ֣וֹךְ הַהֲפֵכָ֔ה בַּהֲפֹךְ֙ אֶת־הֶ֣עָרִ֔ים אֲשֶׁר־יָשַׁ֥ב בָּהֵ֖ן לֽוֹט׃", "pasuk_en": "When Elohim destroyed the cities מתוך the plain; Elohim remembered Avraham, and He sent Lot out מתוך the upheaval when He overturned the cities in which Lot had lived.", "rashi_he": "מַהוּ זְכִירָתוֹ שֶׁל אַבְרָהָם עַל לוֹט? נִזְכַּר שֶׁהָיָה לוֹט יוֹדֵעַ שֶׁשָּׂרָה אִשְׁתּוֹ שֶׁל אַבְרָהָם וְשָׁמַע שֶׁאָמַר אַבְרָהָם בְּמִצְרַיִם עַל שָׂרָה אֲחוֹתִי הִיא, וְלֹא גִלָּה הַדָּבָר, שֶׁהָיָה חָס עָלָיו, לְפִיכָךְ חָס הַקָּבָּ\"ה עָלָיו (בראשית רבה):", "rashi_en": "How does the remembering מתוך Avraham affect Lot? He remembered that Lot had known that Sarah was Avraham’s wife, and heard Avraham say in Egypt, about Sarah, “She is my sister,” and he [Lot] did not betray him because he was sympathetic towards him. Therefore, God took pity on him [Lot].", "note": "", "points": [{"q": "'ויזכר אלהים את אברהם וישלח את לוט' — what about Avraham did Hashem remember that led Him to save Lot?", "options": ["Lot kept Avraham's secret about Sarah in Mitzrayim", "Avraham had prayed for Lot by name", "Avraham had rescued Lot in the war"], "kasha": "The posuk says Hashem remembered Avraham — but it was Lot who was saved.", "answer": "Lot knew Sarah was Avraham's wife and heard him say 'she is my sister' in Mitzrayim, yet didn't reveal it out מתוך pity for him. So Hashem had pity on Lot."}]}, {"id": "19:30.1", "ch": 19, "v": 30, "n": 1, "dh": "כי ירא לשבת בצוער", "pasuk_html": "וַיַּ֩עַל֩ ל֨וֹט מִצּ֜וֹעַר וַיֵּ֣שֶׁב בָּהָ֗ר וּשְׁתֵּ֤י בְנֹתָיו֙ עִמּ֔וֹ <mark>כִּ֥י יָרֵ֖א לָשֶׁ֣בֶת בְּצ֑וֹעַר</mark> וַיֵּ֙שֶׁב֙ בַּמְּעָרָ֔ה ה֖וּא וּשְׁתֵּ֥י בְנֹתָֽיו׃", "pasuk_en": "Lot went up from Zoar and lived in the mountain; and his two daughters went with him, for he was afraid to live in Zoar. He lived in a cave, he and his two daughters.", "rashi_he": "לְפִי שֶׁהָיְתָה קְרוֹבָה לִסְדוֹם:", "rashi_en": "Since it was near Sedom.", "note": "", "points": [{"q": "Lot asked to go to Tzoar — why was he now 'afraid to live in Tzoar'?", "options": ["It was close to Sedom", "Its people knew he had sinned", "It had already been partly burned"], "kasha": "Tzoar was spared for Lot — why fear living there?", "answer": "Because it was near Sedom."}]}, {"id": "19:31.1", "ch": 19, "v": 31, "n": 1, "dh": "אבינו זקן", "pasuk_html": "וַתֹּ֧אמֶר הַבְּכִירָ֛ה אֶל־הַצְּעִירָ֖ה <mark>אָבִ֣ינוּ זָקֵ֑ן</mark> וְאִ֨ישׁ אֵ֤ין בָּאָ֙רֶץ֙ לָב֣וֹא עָלֵ֔ינוּ כְּדֶ֖רֶךְ כׇּל־הָאָֽרֶץ׃", "pasuk_en": "The older girl said to the younger, Our father is old, and there is no man [left] on earth who will come into us in the normal manner.", "rashi_he": "וְאִם לֹא עַכְשָׁו אֵימָתַי? שֶׁמָּא יָמוּת אוֹ יִפְסֹק מֵהוֹלִיד:", "rashi_en": "If not now, when? He may die or cease having children.", "note": "", "points": [{"q": "The older daughter says 'אבינו זקן' — our father is old. Why mention his age?", "options": ["If not now, when? He may die or stop having children", "He is too old to find a new wife", "He is too old to protect us alone"], "kasha": "What does Lot's age have to do with her plan?", "answer": "If not now, when? He may die or stop being able to have children."}]}, {"id": "19:31.2", "ch": 19, "v": 31, "n": 2, "dh": "ואיש אין בארץ", "pasuk_html": "וַתֹּ֧אמֶר הַבְּכִירָ֛ה אֶל־הַצְּעִירָ֖ה אָבִ֣ינוּ זָקֵ֑ן <mark>וְאִ֨ישׁ אֵ֤ין בָּאָ֙רֶץ֙</mark> לָב֣וֹא עָלֵ֔ינוּ כְּדֶ֖רֶךְ כׇּל־הָאָֽרֶץ׃", "pasuk_en": "The older girl said to the younger, Our father is old, and there is no man [left] on earth who will come into us in the normal manner.", "rashi_he": "סְבוּרוֹת הָיוּ שֶׁכָּל הָעוֹלָם נֶחֱרַב כְּמוֹ בְּדוֹר הַמַּבּוּל: (בראשית רבה):", "rashi_en": "They thought that the entire world was destroyed as it was in the generation מתוך the Flood. (From בראשית Rabbah.)", "note": "", "points": [{"q": "'ואיש אין בארץ' — there's no man on earth. Didn't they know people lived in Tzoar?", "options": ["They thought the whole world was destroyed, like the Mabul", "They meant no man would marry them", "They meant no man in the mountain area"], "kasha": "They had just been in Tzoar, which was spared — how can they say no man is left?", "answer": "They thought the entire world had been destroyed, as in the generation מתוך the Mabul (בראשית Rabbah)."}]}, {"id": "19:33.1", "ch": 19, "v": 33, "n": 1, "dh": "ותשקין וגו'", "pasuk_html": "וַתַּשְׁקֶ֧יןָ אֶת־אֲבִיהֶ֛ן יַ֖יִן בַּלַּ֣יְלָה ה֑וּא וַתָּבֹ֤א הַבְּכִירָה֙ וַתִּשְׁכַּ֣ב אֶת־אָבִ֔יהָ וְלֹֽא־יָדַ֥ע בְּשִׁכְבָ֖הּ וּבְקוּׄמָֽהּ׃", "pasuk_en": "They urged wine upon their father that night; and the older girl went in and slept with her father. He was not aware that she lay down or got up.", "rashi_he": "יַיִן נִזְדַּמֵּן לָהֶן בַּמְּעָרָה לְהוֹצִיא מֵהֶן שְׁנֵי אֻמּוֹת:", "rashi_en": "Wine presented itself to them in the cave so that two nations might descend from them.", "note": "", "points": [{"q": "'ותשקין... יין' — where did they get wine in a cave?", "options": ["Hashem arranged it, so two nations would come from them", "They had carried it out מתוך Sedom", "They found grapes on the mountain and made it"], "kasha": "Wine in a cave after fleeing a destroyed city is surprising.", "answer": "Wine was made available to them in the cave so that two nations would come from them."}]}, {"id": "19:33.2", "ch": 19, "v": 33, "n": 2, "dh": "ותשכב את אביה", "pasuk_html": "וַתַּשְׁקֶ֧יןָ אֶת־אֲבִיהֶ֛ן יַ֖יִן בַּלַּ֣יְלָה ה֑וּא וַתָּבֹ֤א הַבְּכִירָה֙ וַתִּשְׁכַּ֣ב אֶת־אָבִ֔יהָ וְלֹֽא־יָדַ֥ע בְּשִׁכְבָ֖הּ וּבְקוּׄמָֽהּ׃", "pasuk_en": "They urged wine upon their father that night; and the older girl went in and slept with her father. He was not aware that she lay down or got up.", "rashi_he": "וּבַצְּעִירָה כְתִיב וַתִּשְׁכַּב עִמּוֹ? צְעִירָה, לְפִי שֶׁלֹּא פָּתְחָה בִזְנוּת אֶלָּא אֲחוֹתָהּ לִמְּדַתָּה חָסַךְ עָלֶיהָ הַכָּתוּב וְלֹא פֵּרֵשׁ גְּנוּתָהּ; אֲבָל בְּכִירָה שֶׁפָּתְחָה בִזְנוּת פִּרְסְמָהּ הַכָּתוּב בִּמְפֹרָשׁ.", "rashi_en": "Concerning the younger daughter it states: “And she slept with him.” In the case מתוך the younger one, since she did not initiate the illicit relations, but, rather, learned it from her sister Scripture covers up for her and does not explicitly state her shame. Whereas, concerning the older daughter, who initiated the illicit relations Scripture explicitly publicizes it.", "note": "", "points": [{"q": "The older 'ותשכב את אביה' — with her father; the younger only 'ותשכב עמו.' Why the difference?", "options": ["The older started it, so the Torah publicizes her shame", "The younger was not really involved", "The older one was married already"], "kasha": "Why does the posuk name 'her father' only by the older daughter?", "answer": "The younger didn't initiate it but learned from her sister, so the Torah spares her and doesn't spell out her shame. The older began it, so the Torah states it openly."}]}, {"id": "19:33.3", "ch": 19, "v": 33, "n": 3, "dh": "ובקומה", "pasuk_html": "וַתַּשְׁקֶ֧יןָ אֶת־אֲבִיהֶ֛ן יַ֖יִן בַּלַּ֣יְלָה ה֑וּא וַתָּבֹ֤א הַבְּכִירָה֙ וַתִּשְׁכַּ֣ב אֶת־אָבִ֔יהָ וְלֹֽא־יָדַ֥ע בְּשִׁכְבָ֖הּ <mark>וּבְקוּׄמָֽהּ׃</mark>", "pasuk_en": "They urged wine upon their father that night; and the older girl went in and slept with her father. He was not aware that she lay down or got up.", "rashi_he": "שֶׁל בְּכִירָה נָקוּד, לוֹמַר, שֶׁבְּקוּמָהּ יָדַע, וְאַעַפּ\"כֵ לֹא נִשְׁמַר לַיִל שֵׁנִי מִלִּשְׁתּוֹת. אָמַר רַבִּי לֵוִי כָּל מִי שֶׁהוּא לָהוּט אַחַר בּוּלְמוּס שֶׁל עֲרָיוֹת לַסּוֹף מַאֲכִילִים אוֹתוֹ מִבְּשָׂרוֹ:", "rashi_en": "The word וּבְקוּמָהּ מתוך the older daughter is written with dots above it, to tell us that once she arose he [Lot] was aware [מתוך what had happened] and, nevertheless, he was not careful not to drink on the following night. [R. Levi said: whoever is inflamed by illicit desires in the end will be made to eat his own flesh.", "note": "", "points": [{"q": "'ובקומה' מתוך the older daughter has dots on it. What do they teach?", "options": ["When she got up, Lot did know what happened", "Lot never knew anything had happened", "The older daughter regretted what she did"], "kasha": "The posuk says Lot didn't know — why the dots on 'ובקומה'?", "answer": "When she got up he did know, and still he did not guard himself from drinking the second night."}, {"q": "What lesson does R' Levi draw from Lot's failure?", "options": ["One who chases illicit desire ends up with his own flesh", "Wine should never be drunk at night", "A father must watch his daughters closely"], "kasha": "Why did Lot let it happen again?", "answer": "R' Levi: whoever is greedy for illicit desire will in the end be fed from his own flesh."}]}, {"id": "19:36.1", "ch": 19, "v": 36, "n": 1, "dh": "ותהרין וגו'", "pasuk_html": "וַֽתַּהֲרֶ֛יןָ שְׁתֵּ֥י בְנֽוֹת־ל֖וֹט מֵאֲבִיהֶֽן׃", "pasuk_en": "Lot’s two daughters became pregnant from their father.", "rashi_he": "אַעַ\"פִּ שֶׁאֵין הָאִשָּׁה מִתְעַבֶּרֶת מִבִּיאָה רִאשׁוֹנָה, אֵלּוּ שָׁלְטוּ בְעַצְמָן וְהוֹצִיאוּ עֶרְוָתָן לַחוּץ וְנִתְעַבְּרוּ מִבִּיאָה רִאשׁוֹנָה:", "rashi_en": "Although a woman does not conceive from her first marital relations, [nevertheless,] these did it with themselves and deflowered themselves and conceived from the first relations.", "note": "", "points": [{"q": "'ותהרין' — both became pregnant at once. What was unusual about that?", "options": ["Women don't usually conceive from the first time", "Sisters can't be pregnant at the same time", "Lot was too old to have children"], "kasha": "Pregnancy from a single time seems unlikely.", "answer": "A woman doesn't normally conceive from the first relations, but these took control מתוך themselves and deflowered themselves, and conceived from the first time."}]}, {"id": "19:37.1", "ch": 19, "v": 37, "n": 1, "dh": "מואב", "pasuk_html": "וַתֵּ֤לֶד הַבְּכִירָה֙ בֵּ֔ן וַתִּקְרָ֥א שְׁמ֖וֹ <mark>מוֹאָ֑ב</mark> ה֥וּא אֲבִֽי־מוֹאָ֖ב עַד־הַיּֽוֹם׃", "pasuk_en": "The older girl gave birth to a son and she named him Moav. He is the ancestor מתוך the Moabite nation even to this day.", "rashi_he": "זוֹ שֶׁלֹּא הָיְתָה צְנוּעָה פֵּרְשָׁה שֶׁמֵּאָבִיהָ הוּא, אֲבָל צְעִירָה קְרָאַתּוּ בְלָשׁוֹן נְקִיָּה, וְקִבְּלָה שָׂכָר בִּימֵי מֹשֶׁה, שֶׁנֶּאֱמַר בִּבְנֵי עַמּוֹן אַל תִּתְגָּר בָּם (דברים ב') – כְּלָל, וּבְמוֹאָב לֹא הִזְהִיר אֶלָּא שֶׁלֹּא יִלָּחֵם בָּם, אֲבָל לְצַעֲרָן הִתִּיר לוֹ:", "rashi_en": "This [daughter] who was not modest openly stated that he is מתוך her father, but, the younger one named him euphemistically and was rewarded for this in the days מתוך Moshe, as it is said concerning the Amonites, “Do not incite them”—in any manner. Whereas, concerning Moav it [the Torah] forbids only to wage war against them, but irritating them was permitted.", "note": "", "points": [{"q": "The older named her son 'מואב.' What does the name reveal about her?", "options": ["She openly said he was from her father", "She hoped he would become a king", "She named him after the land מתוך Moav"], "kasha": "Why would she choose a name like 'מואב' — 'from father'?", "answer": "She was not modest and openly declared he came from her father. The younger named hers with a clean expression."}, {"q": "How was the younger daughter rewarded for her modesty?", "options": ["Israel may not provoke Amon at all, but may harass Moav", "Amon was allowed to marry into Israel", "Her descendants became kings over Moav"], "kasha": "What came מתוך the difference between the two names?", "answer": "In Moshe's days, Israel was told not to provoke Amon in any way, but about Moav only not to wage war — harassing them was allowed."}]}, {"id": "20:1.1", "ch": 20, "v": 1, "n": 1, "dh": "ויסע משם אברהם", "pasuk_html": "<mark>וַיִּסַּ֨ע מִשָּׁ֤ם אַבְרָהָם֙</mark> אַ֣רְצָה הַנֶּ֔גֶב וַיֵּ֥שֶׁב בֵּין־קָדֵ֖שׁ וּבֵ֣ין שׁ֑וּר וַיָּ֖גׇר בִּגְרָֽר׃", "pasuk_en": "Avraham journeyed from there to the land מתוך the Negev, and he lived between Kadeish and Shur. He lived for a while in Gerar.", "rashi_he": "כְּשֶׁרָאָה שֶׁחָרְבוּ הַכְּרַכִּים וּפָסְקוּ הָעוֹבְרִים וְהַשָּׁבִים, נָסַע לוֹ מִשָּׁם. דָּ\"אַ לְהִתְרַחֵק מִלּוֹט, שֶׁיָּצָא עָלָיו שֵׁם רָע, שֶׁבָּא עַל בְּנוֹתָיו:", "rashi_en": "When he saw that the cities were destroyed and the travelers ceased passing by he departed from there. An alternate explanation: In order to distance himself from Lot who had acquired a bad reputation that he was incestuous with his daughters.", "note": "", "points": [{"q": "'ויסע משם אברהם' — Avraham had lived in Chevron for years. Why does he pick up and move now?", "options": ["The cities were destroyed and travelers stopped coming", "Avimelech invited him to come live in Gerar", "There was a famine in Chevron"], "kasha": "The Torah doesn't say why Avraham suddenly left the place he'd settled.", "answer": "Once he saw that the cities (Sedom etc.) were destroyed and wayfarers stopped passing by, he left — there was no one left to host."}, {"q": "רש״י gives a second reason Avraham moved away נכון after the story מתוך Lot and his daughters. What was it?", "options": ["To distance himself from Lot's bad reputation", "To find better pasture for his flocks", "To get away from the smoke מתוך Sedom"], "kasha": "The move comes נכון after the episode מתוך Lot and his daughters — is there a connection?", "answer": "Another explanation: to distance himself from Lot, who got a bad name because he lived with his daughters."}]}, {"id": "20:2.1", "ch": 20, "v": 2, "n": 1, "dh": "ויאמר אברהם", "pasuk_html": "<mark>וַיֹּ֧אמֶר אַבְרָהָ֛ם</mark> אֶל־שָׂרָ֥ה אִשְׁתּ֖וֹ אֲחֹ֣תִי הִ֑וא וַיִּשְׁלַ֗ח אֲבִימֶ֙לֶךְ֙ מֶ֣לֶךְ גְּרָ֔ר וַיִּקַּ֖ח אֶת־שָׂרָֽה׃", "pasuk_en": "Avraham said regarding Sarah, his wife, She is my sister. Avimelech, king מתוך Gerar sent [messengers] and took Sarah.", "rashi_he": "כָּאן לֹא נָטַל רְשׁוּת אֶלָּא עַל כָּרְחָהּ שֶׁלֹּא בְטוֹבָתָהּ, לְפִי שֶׁכְּבָר לֻקְּחָה לְבֵית פַּרְעֹה עַל יְדֵי כֵן:", "rashi_en": "Here, he did not ask her consent but, [did it] against her will, since she had already been taken to Pharoah’s house because מתוך this.", "note": "", "points": [{"q": "In Mitzrayim Avraham asked Sarah 'אמרי נא' — please say. Here 'ויאמר אברהם' — he just says it. Why no asking?", "options": ["He didn't ask — she was unwilling after Pharaoh", "Sarah herself suggested the plan this time", "Avimelech was a known tzaddik, so no danger"], "kasha": "Here Avraham simply declares 'she is my sister', without asking Sarah as he did in Mitzrayim.", "answer": "Here he didn't take her permission; it was against her will, not with her consent, since she had already been taken to Pharaoh's house through this."}]}, {"id": "20:2.2", "ch": 20, "v": 2, "n": 2, "dh": "אל שרה אשתו", "pasuk_html": "וַיֹּ֧אמֶר אַבְרָהָ֛ם אֶל־שָׂרָ֥ה אִשְׁתּ֖וֹ אֲחֹ֣תִי הִ֑וא וַיִּשְׁלַ֗ח אֲבִימֶ֙לֶךְ֙ מֶ֣לֶךְ גְּרָ֔ר וַיִּקַּ֖ח אֶת־שָׂרָֽה׃", "pasuk_en": "Avraham said regarding Sarah, his wife, She is my sister. Avimelech, king מתוך Gerar sent [messengers] and took Sarah.", "rashi_he": "עַל שָׂרָה אִשְׁתּוֹ, כַּיוֹצֵא בוֹ אֶל הִלָּקַח אֲרוֹן וְגוֹ' וְאֶל מוֹת חָמִיהָ (שמואל א ד'), שְׁנֵיהֶם בִּלְשׁוֹן עַל:", "rashi_en": "[Here meaning] concerning Sarah, his wife. Similarly, “Concerning the ark being taken, etc., and concerning the death מתוך her father-in-law,” both [words אֶל] meaning עַל —concerning.", "note": "", "points": [{"q": "'ויאמר אברהם אל שרה' — did Avraham say 'she is my sister' to Sarah?", "options": ["No — 'אל' here means 'about' Sarah", "Yes — he was telling Sarah to say it", "Yes — he was reminding her מתוך their plan"], "kasha": "'אל שרה' sounds like he spoke to Sarah, but 'she is my sister' was said to others.", "answer": "'אל' here means 'על' — concerning: Avraham said about Sarah his wife, 'she is my sister.'"}, {"q": "רש״י cites a posuk from Shmuel to show 'אל' can mean 'about'. Which?", "options": ["'אל הלקח ארון... ואל מות חמיה'", "'ויאמר משה אל העם'", "'וידבר ה' אל משה'"], "kasha": "We need proמתוך that 'אל' can mean 'concerning'.", "answer": "Shmuel I 4: 'אל הלקח ארון... ואל מות חמיה' — concerning the Aron being taken and concerning her father-in-law's death; both mean 'על'."}]}, {"id": "20:4.1", "ch": 20, "v": 4, "n": 1, "dh": "לא קרב אליה", "pasuk_html": "וַאֲבִימֶ֕לֶךְ <mark>לֹ֥א קָרַ֖ב אֵלֶ֑יהָ</mark> וַיֹּאמַ֕ר אֲדֹנָ֕י הֲג֥וֹי גַּם־צַדִּ֖יק תַּהֲרֹֽג׃", "pasuk_en": "Avimelech had not come near to her. He said, My Master, will You also kill an innocent nation?", "rashi_he": "הַמַּלְאָךְ מְנָעוֹ, כְּמוֹ שֶׁנֶּאֱמַר לֹא נְתַתִּיךָ לִנְגֹּעַ אֵלֶיהָ:", "rashi_en": "[This was so because] the angel prevented him as it is said: “I did not give you the chance to touch her.”", "note": "", "points": [{"q": "'ואבימלך לא קרב אליה' — why hadn't Avimelech come near Sarah?", "options": ["The malach prevented him", "He respected her as a married woman", "He was too busy with affairs מתוך state"], "kasha": "Avimelech took Sarah into his house — why didn't he touch her?", "answer": "The malach stopped him."}, {"q": "How does רש״י show that Avimelech was held back, not restraining himself?", "options": ["Hashem says 'לא נתתיך לנגוע אליה'", "Avimelech says 'בתם לבבי'", "The posuk says 'בחלום הלילה'"], "kasha": "The posuk alone doesn't say whether it was his choice.", "answer": "As Hashem later tells him: 'לא נתתיך לנגוע אליה' — I did not let you touch her."}]}, {"id": "20:4.2", "ch": 20, "v": 4, "n": 2, "dh": "הגוי גם צדיק תהרג", "pasuk_html": "וַאֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑יהָ וַיֹּאמַ֕ר אֲדֹנָ֕י הֲג֥וֹי גַּם־צַדִּ֖יק תַּהֲרֹֽג׃", "pasuk_en": "Avimelech had not come near to her. He said, My Master, will You also kill an innocent nation?", "rashi_he": "אַף אִם הוּא צַדִּיק תַּהַרְגֶנּוּ, שֶׁמָּא כָךְ דַּרְכְּךָ לְאַבֵּד הָאֻמּוֹת חִנָּם? כָּךְ עָשִׂיתָ לְדוֹר הַמַּבּוּל וּלְדוֹר הַפַּלָּגָה, אַף אֲנִי אוֹמֵר שֶׁהֲרַגְתָּם עַל לֹא דָבָר, כְּמוֹ שֶׁאַתָּה אוֹמֵר לְהָרְגֵנִי:", "rashi_en": "[Meaning] would you kill a nation even if it is נכוןeous? Is this perhaps Your way to destroy nations without cause? You did likewise to the Flood generation and to the Dispersal generation. I also say that You killed them for no reason just as You intend to kill me.", "note": "", "points": [{"q": "'הגוי גם צדיק תהרג' — what is Avimelech asking?", "options": ["Would You kill a nation even if it's נכוןeous?", "Will You kill the nation מתוך Avraham?", "Will You kill only the guilty ones?"], "kasha": "The words 'a nation, also נכוןeous, You will kill' are compressed and unclear.", "answer": "Even if the nation is נכוןeous, will You kill it?"}, {"q": "Avimelech goes further. What accusation about earlier generations does רש״י put in his mouth?", "options": ["You destroyed the Mabul and Palagah generations for nothing", "You saved Noach's generation only for Noach's sake", "You punished Sedom although Avraham davened for it"], "kasha": "Why would Avimelech suspect Hashem מתוך killing an innocent nation?", "answer": "Is it Your way to destroy nations for nothing? So You did to the Dor HaMabul and Dor HaPalagah; I now say You killed them for no reason, just as You want to kill me."}]}, {"id": "20:5.1", "ch": 20, "v": 5, "n": 1, "dh": "גם הוא", "pasuk_html": "הֲלֹ֨א ה֤וּא אָֽמַר־לִי֙ אֲחֹ֣תִי הִ֔וא וְהִֽיא־גַם־הִ֥וא אָֽמְרָ֖ה אָחִ֣י ה֑וּא בְּתׇם־לְבָבִ֛י וּבְנִקְיֹ֥ן כַּפַּ֖י עָשִׂ֥יתִי זֹֽאת׃", "pasuk_en": "Did he not say to me, She is my sister? And she also said, He is my brother. With an innocent heart and clean hands I did this.", "rashi_he": "לְרַבּוֹת עֲבַדִים וְגַמָּלִים וְחַמָּרִים שֶׁלָּהּ, אֶת כֻּלָּם שָׁאַלְתִּי וְאָמְרוּ לִי אָחִיהָ הוּא:", "rashi_en": "[This was said] to include her servants, cameldrivers, and muledrivers. “I asked them all and they responded that he was her brother.”", "note": "", "points": [{"q": "'והיא גם הוא אמרה' — 'she, also she, said.' What does the extra 'גם הוא' include?", "options": ["Her servants, camel drivers and donkey drivers", "Avraham's servants who came along", "Avimelech's own advisors"], "kasha": "'גם הוא' is extra — 'והיא אמרה' would have been enough.", "answer": "It includes her servants, camel drivers and donkey drivers: 'I asked them all, and they all said he is her brother.'"}]}, {"id": "20:5.2", "ch": 20, "v": 5, "n": 2, "dh": "בתם לבבי", "pasuk_html": "הֲלֹ֨א ה֤וּא אָֽמַר־לִי֙ אֲחֹ֣תִי הִ֔וא וְהִֽיא־גַם־הִ֥וא אָֽמְרָ֖ה אָחִ֣י ה֑וּא בְּתׇם־לְבָבִ֛י וּבְנִקְיֹ֥ן כַּפַּ֖י עָשִׂ֥יתִי זֹֽאת׃", "pasuk_en": "Did he not say to me, She is my sister? And she also said, He is my brother. With an innocent heart and clean hands I did this.", "rashi_he": "שֶׁלֹּא דִמִּיתִי לַחֲטֹא:", "rashi_en": "[Meaning] “I had no intention מתוך sinning.”", "note": "", "points": [{"q": "Avimelech says he acted 'בתם לבבי' — with innocence מתוך heart. What is he claiming?", "options": ["He had no thought מתוך sinning", "He never touched her", "He was ready to return her"], "kasha": "He also says 'clean hands' — what does 'innocent heart' add?", "answer": "'I didn't intend to sin' — innocent heart refers to his intentions."}]}, {"id": "20:5.3", "ch": 20, "v": 5, "n": 3, "dh": "ובנקיון כפי", "pasuk_html": "הֲלֹ֨א ה֤וּא אָֽמַר־לִי֙ אֲחֹ֣תִי הִ֔וא וְהִֽיא־גַם־הִ֥וא אָֽמְרָ֖ה אָחִ֣י ה֑וּא בְּתׇם־לְבָבִ֛י וּבְנִקְיֹ֥ן כַּפַּ֖י עָשִׂ֥יתִי זֹֽאת׃", "pasuk_en": "Did he not say to me, She is my sister? And she also said, He is my brother. With an innocent heart and clean hands I did this.", "rashi_he": "נָקִי אֲנִי מִן הַחֵטְא, שֶׁלֹּא נָגַעְתִּי בָהּ:", "rashi_en": "[Meaning] “I am innocent מתוך sin for I have not touched her.”", "note": "", "points": [{"q": "'ובנקיון כפי' — clean hands. What is Avimelech claiming with this?", "options": ["He is clean מתוך sin since he didn't touch her", "He returned all מתוך Avraham's property", "He had no bad intentions"], "kasha": "After 'innocent heart', what does 'clean hands' add?", "answer": "'I am clean מתוך sin, for I didn't touch her' — clean hands refers to his actions."}]}, {"id": "20:6.1", "ch": 20, "v": 6, "n": 1, "dh": "ידעתי כי בתם לבבך וגו'", "pasuk_html": "וַיֹּ֩אמֶר֩ אֵלָ֨יו הָֽאֱלֹהִ֜ים בַּחֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֙עְתִּי֙ כִּ֤י בְתׇם־לְבָבְךָ֙ עָשִׂ֣יתָ זֹּ֔את וָאֶחְשֹׂ֧ךְ גַּם־אָנֹכִ֛י אֽוֹתְךָ֖ מֵחֲטוֹ־לִ֑י עַל־כֵּ֥ן לֹא־נְתַתִּ֖יךָ לִנְגֹּ֥עַ אֵלֶֽיהָ׃", "pasuk_en": "Elohim said to him in a dream, I also know that you did this with an innocent heart. I also prevented you from sinning against Me. That is why I did not give you the chance to touch her.", "rashi_he": "אֱמֶת שֶׁלֹּא דִמִּיתָ מִתְּחִלָּה לַחֲטֹא אֲבָל נִקְיוֹן כַּפַּיִם אֵין כָּאן:", "rashi_en": "“It is true that at first you had no intention מתוך sinning, but, do not claim clean hands [because…].", "note": "", "points": [{"q": "Avimelech claimed innocent heart AND clean hands. Hashem answers only 'בתם לבבך'. Why leave out clean hands?", "options": ["His claim מתוך clean hands wasn't true", "Clean hands was already obvious", "Hashem only judges intentions"], "kasha": "Hashem repeats only half מתוך Avimelech's claim.", "answer": "It's true you didn't intend to sin at first, but there are no clean hands here."}]}, {"id": "20:6.2", "ch": 20, "v": 6, "n": 2, "dh": "לא נתתיך", "pasuk_html": "וַיֹּ֩אמֶר֩ אֵלָ֨יו הָֽאֱלֹהִ֜ים בַּחֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֙עְתִּי֙ כִּ֤י בְתׇם־לְבָבְךָ֙ עָשִׂ֣יתָ זֹּ֔את וָאֶחְשֹׂ֧ךְ גַּם־אָנֹכִ֛י אֽוֹתְךָ֖ מֵחֲטוֹ־לִ֑י עַל־כֵּ֥ן לֹא־נְתַתִּ֖יךָ לִנְגֹּ֥עַ אֵלֶֽיהָ׃", "pasuk_en": "Elohim said to him in a dream, I also know that you did this with an innocent heart. I also prevented you from sinning against Me. That is why I did not give you the chance to touch her.", "rashi_he": "לֹא מִמְּךָ הָיָה שֶׁלֹּא נָגַעְתָּ בָהּ, אֶלָּא חָשַׂכְתִּי אֲנִי אוֹתְךָ מֵחֲטֹא וְלֹא נָתַתִּי לְךָ כֹּחַ, וְכֵן וְלֹא נְתָנוֹ אֱלֹהִים (בראשית ל״א:ז׳), וְכֵן וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא (שופטים ט\"ו):", "rashi_en": "It was not due to you that you did not touch her, but, it was I who prevented you from sinning by not giving you the strength. Similarly: “And Elohim did not let him” Similarly: “Her father did not permit him to come.”", "note": "", "points": [{"q": "'לא נתתיך לנגוע אליה' — what does Hashem tell Avimelech about why he didn't touch her?", "options": ["It wasn't him — Hashem withheld the strength", "He was too ill from the plague", "He showed great self-control"], "kasha": "Avimelech claimed credit for not touching her; Hashem says 'I did not let you.'", "answer": "It wasn't your doing that you didn't touch her; I held you back from sin and didn't give you the strength."}, {"q": "רש״י brings other places where 'לא נתן' means 'didn't let'. Which?", "options": ["'ולא נתנו אלהים' and 'ולא נתנו אביה לבוא'", "'ויתן לאברהם' and 'נתתי אלף כסף'", "'ונתתי לך ולזרעך' and 'נתן לך את הארץ'"], "kasha": "'נתתיך' literally means 'gave you'; we need proמתוך it means 'allowed'.", "answer": "Similarly 'ולא נתנו אלהים' (Lavan — Hashem didn't let him harm Yaakov) and 'ולא נתנו אביה לבוא' (Shמתוךtim — her father didn't let him come in)."}]}, {"id": "20:7.1", "ch": 20, "v": 7, "n": 1, "dh": "השב אשת האיש", "pasuk_html": "וְעַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת־הָאִישׁ֙ כִּֽי־נָבִ֣יא ה֔וּא וְיִתְפַּלֵּ֥ל בַּֽעַדְךָ֖ וֶֽחְיֵ֑ה וְאִם־אֵֽינְךָ֣ מֵשִׁ֔יב דַּ֚ע כִּי־מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְכׇל־אֲשֶׁר־לָֽךְ׃", "pasuk_en": "Now return the man’s wife, for he is a prophet. He will pray for you and you will live. If you do not return her, you should know that you will surely die—you and all that is yours.", "rashi_he": "וְאַל תְּהֵא סָבוּר שֶׁמָּא תִּתְגַּנֶּה בְעֵינָיו וְלֹא יְקַבְּלֶנָּה אוֹ יִשְׂנָאֲךָ וְלֹא יִתְפַּלֵּל עָלֶיךָ:", "rashi_en": "And do not think: perhaps she has become repugnant in his eyes and he will not accept her [back] or that he will hate you and not pray for you…", "note": "", "points": [{"q": "'השב אשת האיש' — why must Hashem urge Avimelech to return her? What might he have worried about?", "options": ["Avraham wouldn't take her back, or wouldn't pray for him", "Avraham would demand a large payment", "His people would think him weak"], "kasha": "Why does Hashem need to address returning her and Avraham praying, as if Avimelech had doubts?", "answer": "Don't think she's become repulsive to him and he won't accept her, or that he'll hate you and not pray for you."}]}, {"id": "20:7.2", "ch": 20, "v": 7, "n": 2, "dh": "כי נביא הוא", "pasuk_html": "וְעַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת־הָאִישׁ֙ כִּֽי־נָבִ֣יא ה֔וּא וְיִתְפַּלֵּ֥ל בַּֽעַדְךָ֖ וֶֽחְיֵ֑ה וְאִם־אֵֽינְךָ֣ מֵשִׁ֔יב דַּ֚ע כִּי־מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְכׇל־אֲשֶׁר־לָֽךְ׃", "pasuk_en": "Now return the man’s wife, for he is a prophet. He will pray for you and you will live. If you do not return her, you should know that you will surely die—you and all that is yours.", "rashi_he": "וְיוֹדֵעַ שֶׁלֹּא נָגַעְתָּ בָהּ, לְפִיכָךְ <b>ויתפלל בעדך</b> (בבא קמא צ\"ב):", "rashi_en": "And he knows that you have not touched her and will, therefore, pray for you.", "note": "", "points": [{"q": "'כי נביא הוא ויתפלל בעדך' — why does being a navi matter for Avraham praying for Avimelech?", "options": ["As a navi he knows she wasn't touched", "A navi's prayers are always answered", "A navi must pray for everyone"], "kasha": "The connection between his being a navi and praying is unclear.", "answer": "He's a navi and knows you didn't touch her; therefore he will pray for you."}]}, {"id": "20:9.1", "ch": 20, "v": 9, "n": 1, "dh": "מעשים אשר לא יעשו", "pasuk_html": "וַיִּקְרָ֨א אֲבִימֶ֜לֶךְ לְאַבְרָהָ֗ם וַיֹּ֨אמֶר ל֜וֹ מֶֽה־עָשִׂ֤יתָ לָּ֙נוּ֙ וּמֶֽה־חָטָ֣אתִי לָ֔ךְ כִּֽי־הֵבֵ֧אתָ עָלַ֛י וְעַל־מַמְלַכְתִּ֖י חֲטָאָ֣ה גְדֹלָ֑ה מַעֲשִׂים֙ אֲשֶׁ֣ר לֹא־יֵֽעָשׂ֔וּ עָשִׂ֖יתָ עִמָּדִֽי׃", "pasuk_en": "Avimelech called Avraham and said to him, What have you done to us? What wrong did I do to you that you brought on me and upon my kingdom such a great sin? Deeds that ought not to be done, you have done to me.", "rashi_he": "מַכָּה אֲשֶׁר לֹא הֻרְגְּלָה לָבֹא עַל בְּרִיָה בָּאָה לָנוּ עַל יָדְךָ, עֲצִירַת כָּל נְקָבִים שֶׁל זֶרַע וְשֶׁל קְטַנִּים וּרְעִי וְאָזְנַיִם וְחֹטֶם:", "rashi_en": "A plague that is unusual to befall any beings has befallen us because מתוך you: the stopping up מתוך all body orifices— [those] מתוך semen, urine, and excrement, the ears and the nose.", "note": "", "points": [{"q": "Avimelech says 'מעשים אשר לא יעשו עשית עמדי' — deeds not normally done. What 'deed' happened to him?", "options": ["An unusual plague: all body openings were closed up", "His kingdom was attacked by enemies", "His wife ran away with Avraham"], "kasha": "What 'unheard-מתוך deeds' did Avraham bring on Avimelech?", "answer": "A plague that never strikes creatures came on us because מתוך you: all body openings were stopped up — מתוך seed, urine, excrement, ears and nose."}]}, {"id": "20:11.1", "ch": 20, "v": 11, "n": 1, "dh": "רק אין יראת אלהים", "pasuk_html": "וַיֹּ֙אמֶר֙ אַבְרָהָ֔ם כִּ֣י אָמַ֗רְתִּי רַ֚ק אֵין־יִרְאַ֣ת אֱלֹהִ֔ים בַּמָּק֖וֹם הַזֶּ֑ה וַהֲרָג֖וּנִי עַל־דְּבַ֥ר אִשְׁתִּֽי׃", "pasuk_en": "Avraham said, Because I said [thought] there is no fear מתוך Elohim in this place, and they will kill me [in order] to take my wife.", "rashi_he": "אַכְסְנַאי שֶׁבָּא לָעִיר, עַל עִסְקֵי אֲכִילָה וּשְׁתִיָּה שׁוֹאֲלִין אוֹתוֹ אוֹ עַל עִסְקֵי אִשְׁתּוֹ שׁוֹאֲלִין אוֹתוֹ? אִשְׁתְּךָ הִיא אוֹ אֲחוֹתְךָ הִיא? (בבא קמא שם):", "rashi_en": "When a guest arrives in a city, is he questioned about food and drink? or is he asked about his wife? [namely:] “Is she you wife or your sister?”", "note": "", "points": [{"q": "Avraham says 'רק אין יראת אלהים במקום הזה'. What did he see that showed this?", "options": ["They asked guests about their wives, not food", "They worshipped idols openly", "They robbed travelers on the roads"], "kasha": "How did Avraham know there was no fear מתוך Hashem in Gerar?", "answer": "When a guest comes to a city, do they ask him about food and drink, or about his wife — 'is she your wife or sister?' (Bava Kamma)."}]}, {"id": "20:12.1", "ch": 20, "v": 12, "n": 1, "dh": "אחתי בת אבי הוא", "pasuk_html": "וְגַם־אׇמְנָ֗ה אֲחֹתִ֤י בַת־אָבִי֙ הִ֔וא אַ֖ךְ לֹ֣א בַת־אִמִּ֑י וַתְּהִי־לִ֖י לְאִשָּֽׁה׃", "pasuk_en": "In any case, she is my sister, the daughter מתוך my father, but not the daughter מתוך my mother, and she became my wife.", "rashi_he": "וּבַת אָב מֻתֶּרֶת לְבֶן נֹחַ, שֶׁאֵין אַבְהוּת לְגוֹי, וּכְדֵי לְאַמֵּת דְּבָרָיו הֱשִׁיבָם כֵּן. וְאִם תֹּאמַר וַהֲלֹא בַּת אָחִיו הָיְתָה? בְּנֵי בָנִים הֲרֵי הֵן כְּבָנִים, וַהֲרֵי הִיא בִתּוֹ שֶׁל תֶּרַח וְכָךְ הוּא אוֹמֵר לְלוֹט כִּי אֲנָשִׁים אַחִים אֲנָחְנוּ (בראשית י״ג:ח׳):", "rashi_en": "And a daughter מתוך the same father is permitted [to be married] to a Noachide because there is no paternal relationship for a gentile. In order to make his words truthful, he responded in this fashion. [However,] should you ask: Was she not actually his brother’s daughter? [I would answer:] One’s children’s children are like one’s own children. It is in this vein that he addresses Lot: “For we are brothers [kinsmen].”", "note": "", "points": [{"q": "Avraham says Sarah is 'בת אבי' — his father's daughter — but his wife. How could that be permitted?", "options": ["A father's daughter is permitted to a Ben Noach", "Avraham had special permission from Hashem", "Avraham married her before knowing"], "kasha": "Marrying a paternal sister seems forbidden.", "answer": "A paternal sister is permitted to a Ben Noach, since for a goy there is no legal paternity."}, {"q": "Why does Avraham explain this to Avimelech?", "options": ["To show his words had been true", "To boast מתוך his noble family", "To convince Avimelech to give gifts"], "kasha": "Why justify the 'sister' claim at all?", "answer": "He answered this way to make his words true."}, {"q": "But Sarah was Haran's daughter — Avraham's niece. How is she 'בת אבי'?", "options": ["Grandchildren are like children; she's Terach's 'daughter'", "Terach adopted her after Haran died", "She was Terach's daughter from another wife"], "kasha": "Sarah was really Avraham's brother's daughter, not his sister.", "answer": "Grandchildren are like children, so she is Terach's 'daughter'."}, {"q": "Where else does Avraham call a nephew a brother?", "options": ["To Lot: 'כי אנשים אחים אנחנו'", "To Eliezer: 'הוא דמשק אליעזר'", "To Avimelech: 'אחי הוא'"], "kasha": "We need proמתוך that a relative one generation down can be called a brother/sister.", "answer": "He tells his nephew Lot 'כי אנשים אחים אנחנו' — we are brothers."}]}, {"id": "20:12.2", "ch": 20, "v": 12, "n": 2, "dh": "אך לא בת אמי", "pasuk_html": "וְגַם־אׇמְנָ֗ה אֲחֹתִ֤י בַת־אָבִי֙ הִ֔וא אַ֖ךְ לֹ֣א בַת־אִמִּ֑י וַתְּהִי־לִ֖י לְאִשָּֽׁה׃", "pasuk_en": "In any case, she is my sister, the daughter מתוך my father, but not the daughter מתוך my mother, and she became my wife.", "rashi_he": "הָרָן מֵאֵם אֲחֶרֶת הָיָה:", "rashi_en": "Haran was מתוך a different mother [than Avraham].", "note": "", "points": [{"q": "'אך לא בת אמי' — how is Sarah (Haran's daughter) not from Avraham's mother?", "options": ["Haran had a different mother than Avraham", "Sarah's mother was not Haran's wife", "Avraham was adopted by Terach"], "kasha": "If Sarah counts as Terach's daughter, why not his mother's too?", "answer": "Haran was from a different mother."}]}, {"id": "20:13.1", "ch": 20, "v": 13, "n": 1, "dh": "ויהי כאשר התעו וגו'", "pasuk_html": "וַיְהִ֞י כַּאֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗י אֱלֹהִים֮ מִבֵּ֣ית אָבִי֒ וָאֹמַ֣ר לָ֔הּ זֶ֣ה חַסְדֵּ֔ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑י אֶ֤ל כׇּל־הַמָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּה אִמְרִי־לִ֖י אָחִ֥י הֽוּא׃", "pasuk_en": "When Elohim caused me to wander from my father’s house, I said to her, this is the kindness you shall do for me. At every place we come to, say מתוך me, He is my brother.", "rashi_he": "אֻנְקְלוֹס תִּרְגֵּם מַה שֶּׁתִּרְגֵּם; וְיֵשׁ לְיַשְּׁבוֹ עוֹד דָּבָר דָּבוּר עַל אָפְנָיו, כְּשֶׁהוֹצִיאַנִי הַקָּבָּ\"ה מִבֵּית אָבִי לִהְיוֹת מְשׁוֹטֵט וְנָד מִמָּקוֹם לְמָקוֹם, יָדַעְתִּי שֶׁאֶעֱבֹר בִּמְקוֹם רְשָׁעִים <b>ואמר לה זה חסדך</b>:", "rashi_en": "Onkelos translated it as he chose. [However,] it can also be interpreted in a manner more fitting to the structure מתוך the verse: When God took me out מתוך my father’s house to be a wanderer, roaming from place to place, and I knew that I would pass through places where there are wicked people. then I said to her: “This is the kindness.”", "note": "", "points": [{"q": "'ויהי כאשר התעו אתי אלהים מבית אבי ואמר לה...' — רש״י מתוךfers a plain reading. What is Avraham saying?", "options": ["Wandering among the wicked, I told her to say 'brother'", "Hashem misled me away from my father's house", "I strayed from Hashem when leaving home"], "kasha": "Onkelos translates it his own way; how do the words read plainly?", "answer": "Onkelos translated as he did; plainly: when Hashem took me from my father's house to wander, I knew I'd pass places מתוך wicked people, so I told her 'this is your kindness'."}]}, {"id": "20:13.2", "ch": 20, "v": 13, "n": 2, "dh": "כאשר התעו", "pasuk_html": "וַיְהִ֞י <mark>כַּאֲשֶׁ֧ר הִתְע֣וּ</mark> אֹתִ֗י אֱלֹהִים֮ מִבֵּ֣ית אָבִי֒ וָאֹמַ֣ר לָ֔הּ זֶ֣ה חַסְדֵּ֔ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑י אֶ֤ל כׇּל־הַמָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּה אִמְרִי־לִ֖י אָחִ֥י הֽוּא׃", "pasuk_en": "When Elohim caused me to wander from my father’s house, I said to her, this is the kindness you shall do for me. At every place we come to, say מתוך me, He is my brother.", "rashi_he": "לְשׁוֹן רַבִּים. וְאַל תִּתְמַהּ, כִּי הַרְבֵּה מְקוֹמוֹת לְשׁוֹן אֱלֹהוּת וּלְשׁוֹן מָרוּת קָרוּי בִּלְשׁוֹן רַבִּים, אֲשֶׁר הָלְכוּ אֱלֹהִים (שמואל ב ז'), אֱלֹהִים חַיִּים (דברים ה'), אֱלֹהִים קְדֹשִׁים (יהושע כ\"ד), וְכָל לְשׁוֹן אַדְנוּת לְשׁוֹן רַבִּים; וְכֵן וַיִּקַּח אֲדֹנֵי יוֹסֵף (בראשית ל\"ט), וַאֲדֹנֵי הָאֲדֹנִים (דברים י'), אֲדֹנֵי הָאָרֶץ (בראשית מ\"ב), וְכֵן בְּעָלָיו עִמּוֹ (שמות כ\"ב), וְהוּעַד בִּבְעָלָיו (שם כ\"א). וְאִם תֹּאמַר מַהוּ לְשׁוֹן הִתְעוּ? כָּל הַגּוֹלֶה מִמְּקוֹמוֹ וְאֵינוֹ מְיֻשָּׁב קָרוּי תּוֹעֶה, כְּמוֹ וַתֵּלֶךְ וַתֵּתַע (בראשית כ\"א), תָּעִיתִי כְּשֶׂה אֹבֵד (תהילים קי\"ט), יִתְעוּ לִבְלִי אֹכֶל (איוב ל\"ח) – יֵצְאוּ וְיִתְעוּ לְבַקֵּשׁ אָכְלָם:", "rashi_en": "[The verb הִתְעוּ is] in the plural form. But, do not wonder about this, because in many places that which deals with Godliness and that which deals with authority are referred to in the plural form. [E.g.,] “Whom God went [to redeem],” “the Living God,” “He is a Holy God.” All references to Godliness [or authority] are plural as in “And the master מתוך Yoseif took him,” [or] “The Master מתוך masters,” [or] “The master מתוך the land.” Similarly, “If its owner was with it,” [or] “Its owner was warned.” If you ask, why the term הִתְעוּ is used here, [I would answer,] anyone exiled from his place and is not settled is referred to as תּ וֹעֶה, as in, “And she went and lost her way,” [or:] “I have strayed like a lost sheep,” [or:] “They wander without food,” [meaning:] they go out and wander seeking food.", "note": "", "points": [{"q": "'התעו אתי אלהים' — the verb 'התעו' is plural. Why use plural for Hashem?", "options": ["Words מתוך Divinity and authority are מתוךten in plural", "Avraham meant several malachim", "It refers to Hashem and the beis din above"], "kasha": "'התעו' is plural, though Hashem is One.", "answer": "Don't wonder: in many places words for Divinity and authority are in plural — 'אשר הלכו אלהים', 'אלהים חיים', 'אלהים קדושים'."}, {"q": "Is the plural only used for Hashem?", "options": ["No — for any master or owner too", "Yes — only for Hashem", "Only for kings"], "kasha": "Is this plural-מתוך-authority special to Hashem?", "answer": "All terms מתוך mastery are plural: 'אדני יוסף', 'אדני האדנים', 'אדני הארץ'; also 'בעליו עמו' and 'והועד בבעליו' for a single owner."}, {"q": "What does 'התעו' mean here?", "options": ["Made to wander — exiled, unsettled", "Led astray into sin", "Made to forget"], "kasha": "'התעו' usually suggests going astray — strange to say מתוך Hashem leading Avraham.", "answer": "Anyone exiled from his place and unsettled is called 'תועה' — a wanderer."}, {"q": "Which pesukim does רש״י bring for 'תועה' meaning wandering?", "options": ["'ותלך ותתע', 'תעיתי כשה אבד', 'יתעו לבלי אכל'", "'ויסע משם', 'לך לך', 'ויעבר אברם'", "'ויתעצב אל לבו', 'ויתעו בעיניו'"], "kasha": "We need proמתוך that the root means wandering.", "answer": "Hagar 'ותלך ותתע', 'תעיתי כשה אבד' (Tehillim), and 'יתעו לבלי אכל' (Iyov) — they go out and wander seeking food."}]}, {"id": "20:13.3", "ch": 20, "v": 13, "n": 3, "dh": "אמרי לי", "pasuk_html": "וַיְהִ֞י כַּאֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗י אֱלֹהִים֮ מִבֵּ֣ית אָבִי֒ וָאֹמַ֣ר לָ֔הּ זֶ֣ה חַסְדֵּ֔ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑י אֶ֤ל כׇּל־הַמָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּה אִמְרִי־לִ֖י אָחִ֥י הֽוּא׃", "pasuk_en": "When Elohim caused me to wander from my father’s house, I said to her, this is the kindness you shall do for me. At every place we come to, say מתוך me, He is my brother.", "rashi_he": "עָלַי, וְכֵן וַיִּשְׁאֲלוּ אַנְשֵׁי הַמָּקוֹם לְאִשְׁתּוֹ (בראשית כ\"ו), עַל אִשְׁתּוֹ, וְכֵן וְאָמַר פַּרְעֹה לִבְנֵי יִשְׂרָאֵל (שמות י\"ד), כְּמוֹ עַל בְּנֵי יִשְׂרָאֵל; פֶּן יֹאמְרוּ לִי אִשָּׁה הֲרָגָתְהוּ (שופטים ט'):", "rashi_en": "[לִי meaning] about me. Similarly “The local men asked לְאִשְׁתּוֹ [meaning:] about his wife. Similarly, “And Pharaoh said לִבְנֵי יִשְׂרָאֵל the same as [עַל] about the Bnei Yisrael. “Lest they say [לִי] about me: a woman slew him.”", "note": "", "points": [{"q": "'אמרי לי אחי הוא' — literally 'say to me, he is my brother.' What does 'לי' mean here?", "options": ["About me", "To me", "For my sake"], "kasha": "She wasn't to say it to Avraham, but to others.", "answer": "'לי' means 'עלי' — about me."}, {"q": "Where else does 'ל' mean 'about'?", "options": ["'וישאלו... לאשתו', 'ואמר פרעה לבני ישראל'", "'ויאמר לו', 'ויקרא לאברהם'", "'לך לך', 'לך כסות עינים'"], "kasha": "We need proמתוך that 'ל' can mean 'about'.", "answer": "'וישאלו אנשי המקום לאשתו' — about his wife; 'ואמר פרעה לבני ישראל' — about Bnei Yisroel; 'פן יאמרו לי אשה הרגתהו' — about me."}]}, {"id": "20:14.1", "ch": 20, "v": 14, "n": 1, "dh": "ויתן לאברהם", "pasuk_html": "וַיִּקַּ֨ח אֲבִימֶ֜לֶךְ צֹ֣אן וּבָקָ֗ר וַעֲבָדִים֙ וּשְׁפָחֹ֔ת <mark>וַיִּתֵּ֖ן לְאַבְרָהָ֑ם</mark> וַיָּ֣שֶׁב ל֔וֹ אֵ֖ת שָׂרָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "Avimelech took sheep, cattle, male and female slaves, and he gave them to Avraham. He [also] returned his wife Sarah to him.", "rashi_he": "כְּדֵי שֶׁיִּתְפַּיֵּס וְיִתְפַּלֵּל עָלָיו:", "rashi_en": "So that he [Avraham] be mollified and pray for him [Avimelech’s wellbeing].", "note": "", "points": [{"q": "Hashem only told Avimelech to return Sarah. Why does he also give Avraham sheep, cattle and servants?", "options": ["To appease him so he'd pray for him", "To pay a fine set by Hashem", "To buy land from Avraham"], "kasha": "Hashem didn't demand gifts — why give them?", "answer": "So Avraham would be appeased and pray for him."}]}, {"id": "20:15.1", "ch": 20, "v": 15, "n": 1, "dh": "הנה ארצי לפניך", "pasuk_html": "וַיֹּ֣אמֶר אֲבִימֶ֔לֶךְ <mark>הִנֵּ֥ה אַרְצִ֖י לְפָנֶ֑יךָ</mark> בַּטּ֥וֹב בְּעֵינֶ֖יךָ שֵֽׁב׃", "pasuk_en": "Avimelech said, Behold, my land is before you. Live wherever you see fit.", "rashi_he": "אֲבָל פַּרְעֹה אָמַר לוֹ הִנֵּה אִשְׁתְּךָ קַח וָלֵךְ, לְפִי שֶׁנִּתְיָרֵא, שֶׁהַמִּצְרִיִּים שְׁטוּפֵי זִמָּה:", "rashi_en": "Whereas Pharaoh told him, “Here is your wife, take [her] and go,” because he was afraid that the Egyptians were immersed in lewdness.", "note": "", "points": [{"q": "Avimelech says 'הנה ארצי לפניך' — stay where you like. How did Pharaoh act differently?", "options": ["He said 'take your wife and go'", "He gave Avraham land in Goshen", "He let him stay but sent guards"], "kasha": "Why stress Avimelech's invitation to stay?", "answer": "Unlike Pharaoh, who told him: 'here is your wife, take her and go.'"}, {"q": "Why did Pharaoh send Avraham away?", "options": ["He feared the Egyptians were steeped in immorality", "He feared Avraham's prophecy", "He was angry about the plagues"], "kasha": "Why the difference between the two kings?", "answer": "Pharaoh was afraid, because the Egyptians were steeped in immorality."}]}, {"id": "20:16.1", "ch": 20, "v": 16, "n": 1, "dh": "ולשרה אמר", "pasuk_html": "<mark>וּלְשָׂרָ֣ה אָמַ֗ר</mark> הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֙סֶף֙ לְאָחִ֔יךְ הִנֵּ֤ה הוּא־לָךְ֙ כְּס֣וּת עֵינַ֔יִם לְכֹ֖ל אֲשֶׁ֣ר אִתָּ֑ךְ וְאֵ֥ת כֹּ֖ל וְנֹכָֽחַת׃", "pasuk_en": "To Sarah, he said, Behold I have given to your brother a thousand pieces מתוך silver. It will be for you a [compensational] eye covering for all who are with you, that you may face every one.", "rashi_he": "אֲבִימֶלֶךְ לִכְבוֹדָהּ כְּדֵי לְפַיְּסָהּ, הִנֵּה עָשִׂיתִי לָךְ כָּבוֹד זֶה, נָתַתִּי מָמוֹן לְאָחִיךְ שֶׁאָמַרְתְּ עָלָיו אָחִי הוּא, הִנֵּה הַמָּמוֹן וְהַכָּבוֹד הַזֶּה <b>לך כסות עינים</b>:", "rashi_en": "Avimelech [said it was] out מתוך respect for her, in order to mollify her; “Behold, I have bestowed this honor upon you. I have given money to your brother—the one about whom you said, ‘He is my brother’—this money and respect are for you a covering מתוך the eyes …", "note": "", "points": [{"q": "'ולשרה אמר הנה נתתי אלף כסף לאחיך' — why tell Sarah about money given to Avraham?", "options": ["To honor and appease her", "To boast מתוך his generosity", "To ask her to repay it"], "kasha": "The money went to Avraham — why announce it to Sarah?", "answer": "For her honor, to appease her: 'I gave money to your 'brother' you spoke מתוך; this money and honor are a covering מתוך eyes for you.'"}]}, {"id": "20:16.2", "ch": 20, "v": 16, "n": 2, "dh": "לכל אשר אתך", "pasuk_html": "וּלְשָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֙סֶף֙ לְאָחִ֔יךְ הִנֵּ֤ה הוּא־לָךְ֙ כְּס֣וּת עֵינַ֔יִם <mark>לְכֹ֖ל אֲשֶׁ֣ר אִתָּ֑ךְ</mark> וְאֵ֥ת כֹּ֖ל וְנֹכָֽחַת׃", "pasuk_en": "To Sarah, he said, Behold I have given to your brother a thousand pieces מתוך silver. It will be for you a [compensational] eye covering for all who are with you, that you may face every one.", "rashi_he": "יְכַסּוּ עֵינֵיהֶם שֶׁלֹּא יְקִלּוּךְ, שֶׁאִלּוּ הֲשִׁיבוֹתִיךְ רֵיקָנִית, יֵשׁ לָהֶם לוֹמַר לְאַחַר שֶׁנִּתְעַלַּל בָּהּ הֶחֱזִירָהּ; עַכְשָׁו שֶׁהֻצְרַכְתִּי לְבַזְבֵּז מָמוֹן וּלְפַיְּסֵךְ, יוֹדְעִים יִהְיוּ שֶׁעַל כָּרְחִי הֲשִׁיבוֹתִיךְ וְעַל יְדֵי נֵס:", "rashi_en": "I.e., “They shall cover their eyes so that they not denigrate you. For if I would return you empty-handed they would say: ‘After violating her, he returned her.’ But, now that it has been necessary for me to expend a great deal מתוך money and to mollify you, they will know that I had to return you against my will and as the result מתוך a miracle.”", "note": "", "points": [{"q": "'כסות עינים לכל אשר אתך' — whose eyes are 'covered', and from what?", "options": ["Others' — so they won't belittle her", "Sarah's — so she won't see Avimelech", "Avimelech's — so he won't look at her"], "kasha": "'Covering מתוך eyes' is an unclear phrase.", "answer": "They will cover their eyes so they won't scorn you."}, {"q": "How does the money protect Sarah's honor?", "options": ["It shows he returned her unwillingly, by a miracle", "It pays for her lost dignity", "It bribes witnesses to keep silent"], "kasha": "Why would money stop people from slandering her?", "answer": "Returned empty-handed, they'd say he abused her and sent her back. Now that I spent money to appease you, they'll know I returned you against my will, through a miracle."}]}, {"id": "20:16.3", "ch": 20, "v": 16, "n": 3, "dh": "ואת כל", "pasuk_html": "וּלְשָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֙סֶף֙ לְאָחִ֔יךְ הִנֵּ֤ה הוּא־לָךְ֙ כְּס֣וּת עֵינַ֔יִם לְכֹ֖ל אֲשֶׁ֣ר אִתָּ֑ךְ <mark>וְאֵ֥ת כֹּ֖ל</mark> וְנֹכָֽחַת׃", "pasuk_en"
