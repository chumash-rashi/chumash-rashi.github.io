שרה, והרי ברור שעליו להשיבה?", "answer": "אל תהא סבור שמא נתגנתה בעיני אברהם ולא יקבלנה, או שישנא אותך ולא יתפלל עליך.", "kp": ["שמא תתגנה בעיניו", "או ישנאך ולא יתפלל עליך"]}]}, {"id": "20:7.2", "ch": 20, "v": 7, "n": 2, "dh": "כי נביא הוא", "pasuk_html": "וְעַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת־הָאִישׁ֙ <mark>כִּֽי־נָבִ֣יא ה֔וּא</mark> וְיִתְפַּלֵּ֥ל בַּֽעַדְךָ֖ וֶֽחְיֵ֑ה וְאִם־אֵֽינְךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי־מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְכָל־אֲשֶׁר־לָֽךְ׃", "pasuk_en": "וְעַתָּה הָשֵׁב אֵשֶׁת־הָאִישׁ כִּי־נָבִיא הוּא וְיִתְפַּלֵּל בַּעַדְךָ וֶחְיֵה וְאִם־אֵינְךָ מֵשִׁיב דַּע כִּי־מוֹת תָּמוּת אַתָּה וְכָל־אֲשֶׁר־לָךְ׃", "rashi_he": "כי נביא הוא. וְיוֹדֵעַ שֶׁלֹּא נָגַעְתָּ בָהּ, לְפִיכָךְ ויתפלל בעדך (בבא קמא צ\"ב):", "rashi_en": "אברהם הוא נביא ולכן יודע שאבימלך לא נגע בשרה, ומשום כך יתפלל בעדו.", "note": "", "points": [{"q": "מַדּוּעַ הַנִּימוּק \"כִּינָבִיא הוּא\" חָשׁוּב לְהַשָׁבַת שָׂרָה?", "options": ["כְּנָבִיא הוּא יוֹדֵעַ שֶׁלֹּא נָגַעְתָּ בָּהּ, וְלָכֵן יִתְפַּלֵּל בַּעַדְךָ", "כִּי נָבִיא אָסוּר לוֹ לִשָּׂאת אִישָּׁה שֶׁנִּלְקְחָה", "כִּי נָבִיא יָכוֹל לְהַעֲנִישׁ אֶת מִי שֶׁאֵינוֹ מַצִּיית"], "kasha": "מה הקשר בין היותו של אברהם נביא לבין ההוראה להשיב את אשתו?", "answer": "הוא נביא ויודע שלא נגעת בה, ולכן יתפלל בעדך.", "kp": ["ויודע שלא נגעת בה", "לפיכך ויתפלל בעדך"]}]}, {"id": "20:9.1", "ch": 20, "v": 9, "n": 1, "dh": "מעשים אשר לא יעשו", "pasuk_html": "וַיִּקְרָ֨א אֲבִימֶ֜לֶךְ לְאַבְרָהָ֗ם וַיֹּ֨אמֶר ל֜וֹ מֶֽה־עָשִׂ֤יתָ לָּ֙נוּ֙ וּמֶֽה־חָטָ֣אתִי לָ֔ךְ כִּֽי־הֵבֵ֧אתָ עָלַ֛י וְעַל־מַמְלַכְתִּ֖י חֲטָאָ֣ה גְדֹלָ֑ה <mark>מַעֲשִׂים֙ אֲשֶׁ֣ר לֹא־יֵֽעָשׂ֔וּ</mark> עָשִׂ֖יתָ עִמָּדִֽי׃", "pasuk_en": "וַיִּקְרָא אֲבִימֶלֶךְ לְאַבְרָהָם וַיֹּאמֶר לוֹ מֶה־עָשִׂיתָ לָּנוּ וּמֶה־חָטָאתִי לָךְ כִּי־הֵבֵאתָ עָלַי וְעַל־מַמְלַכְתִּי חֲטָאָה גְדֹלָה מַעֲשִׂים אֲשֶׁר לֹא־יֵעָשׂוּ עָשִׂיתָ עִמָּדִי׃", "rashi_he": "מעשים אשר לא יעשו. מַכָּה אֲשֶׁר לֹא הֻרְגְּלָה לָבֹא עַל בְּרִיָה בָּאָה לָנוּ עַל יָדְךָ, עֲצִירַת כָּל נְקָבִים שֶׁל זֶרַע וְשֶׁל קְטַנִּים וּרְעִי וְאָזְנַיִם וְחֹטֶם:", "rashi_en": "אבימלך מתלונן שבגלל אברהם באה עליו ועל ביתו מכה חריגה שאינה רגילה לבוא על שום בריה: נסתמו כל נקבי הגוף.", "note": "", "points": [{"q": "עַל אֵילּוּ מַעֲשִׂים חֲרִיגִים מִתְלוֹנֵן אֲבִימֶלֶךְ לְפִי רַשִׁ\"י?", "options": ["מַכָּה חֲרִיגָה שֶׁל סְתִימַת כָּל נְקָבֵי הַגּוּף", "לְקִיחַת שָׂרָה לְבֵית הַמֶּלֶךְ בְּכֹוחַ", "הַשֶּׁקֶר שֶׁאָמַר אַבְרָהָם שֶׁהִיא אֲחוֹתוֹ"], "kasha": "הביטוי \"מעשים אשר לא\" נעשו סתום, ולא ברור לאילו מעשים חריגים מתכוון אבימלך.", "answer": "מכה שאינה רגילה לבוא על שום בריה באה עליהם בגלל אברהם: נעצרו כל הנקבים, של זרע, של קטנים ושל רעי, וגם האוזניים והחוטם.", "kp": ["מכה אשר לא הרגלה לבא על בריה", "עצירת כל נקבים"]}]}, {"id": "20:11.1", "ch": 20, "v": 11, "n": 1, "dh": "רק אין יראת אלהים", "pasuk_html": "וַיֹּ֙אמֶר֙ אַבְרָהָ֔ם כִּ֣י אָמַ֗רְתִּי <mark>רַ֚ק אֵין־יִרְאַ֣ת אֱלֹהִ֔ים</mark> בַּמָּק֖וֹם הַזֶּ֑ה וַהֲרָג֖וּנִי עַל־דְּבַ֥ר אִשְׁתִּֽי׃", "pasuk_en": "וַיֹּאמֶר אַבְרָהָם כִּי אָמַרְתִּי רַק אֵין־יִרְאַת אֱלֹהִים בַּמָּקוֹם הַזֶּה וַהֲרָגוּנִי עַל־דְּבַר אִשְׁתִּי׃", "rashi_he": "רק אין יראת אלהים. אַכְסְנַאי שֶׁבָּא לָעִיר, עַל עִסְקֵי אֲכִילָה וּשְׁתִיָּה שׁוֹאֲלִין אוֹתוֹ אוֹ עַל עִסְקֵי אִשְׁתּוֹ שׁוֹאֲלִין אוֹתוֹ? אִשְׁתְּךָ הִיא אוֹ אֲחוֹתְךָ הִיא? (בבא קמא שם):", "rashi_en": "אברהם ראה שבגרר שואלים אורח שבא לעיר על אשתו ולא על צרכי אכילה ושתייה, ומכאן הבין שאין במקום יראת אלהים.", "note": "", "points": [{"q": "מִמַּה הֵסִיק אַבְרָהָם שֶׁאֵין יִרְאַת אֱלֹהִים בַּמָּקוֹם הַזֶּה?", "options": ["שָּׁאֲלוּ אֶת הָאוֹרֵחַ עַל אִשְׁתּוֹ וְלֹא עַל אֹוכֶל וּשְׁתִיָּיה", "רָאָה שֶׁאַנְשֵׁי הַמָּקוֹם עוֹבְדִים עֲבוֹדָה זָרָה בְּגָלוּי", "שָׁמַע שֶׁאֲבִימֶלֶךְ כְּבָר לָקַח נָשִׁים שֶׁל אוֹרְחִים"], "kasha": "לא ברור מה ראה אברהם בגרר שגרם לו לחשוב שאין שם יראת אלהים.", "answer": "אורח שבא לעיר שואלים אותו אם הוא צריך לאכול ולשתות, ואילו בגרר שאלו אותו מיד על אשתו: \"אשתך היא או אחותך היא?\"", "kp": ["על עסקי אכילה ושתיה שואלין אותו", "על עסקי אשתו שואלין אותו"]}]}, {"id": "20:12.1", "ch": 20, "v": 12, "n": 1, "dh": "אחתי בת אבי הוא", "pasuk_html": "וְגַם־אָמְנָ֗ה <mark>אֲחֹתִ֤י בַת־אָבִי֙ הִ֔וא</mark> אַ֖ךְ לֹ֣א בַת־אִמִּ֑י וַתְּהִי־לִ֖י לְאִשָּֽׁה׃", "pasuk_en": "וְגַם־אָמְנָה אֲחֹתִי בַת־אָבִי הִוא אַךְ לֹא בַת־אִמִּי וַתְּהִי־לִי לְאִשָּׁה׃", "rashi_he": "אחתי בת אבי הוא. וּבַת אָב מֻתֶּרֶת לְבֶן נֹחַ, שֶׁאֵין אַבְהוּת לְגוֹי, וּכְדֵי לְאַמֵּת דְּבָרָיו הֱשִׁיבָם כֵּן. וְאִם תֹּאמַר וַהֲלֹא בַּת אָחִיו הָיְתָה? בְּנֵי בָנִים הֲרֵי הֵן כְּבָנִים, וַהֲרֵי הִיא בִתּוֹ שֶׁל תֶּרַח וְכָךְ הוּא אוֹמֵר לְלוֹט כִּי אֲנָשִׁים אַחִים אֲנָחְנוּ (בראשית י״ג:ח׳):", "rashi_en": "אברהם אמר שהיא אחותו מאביו כדי שדבריו יהיו אמת, ובת אב מותרת לבן נח. ואף שהייתה בת אחיו, בני בנים הם כבנים, ולכן נחשבת בתו של תרח.", "note": "", "points": [{"q": "מַדּוּעַ הָיָה מֻותָּר לְאַבְרָהָם לָשֵׂאת אֶת אֲחוֹתוֹ מִצַּד אָבִיו?", "options": ["כִּי לְגוֹי אֵין אַבְהוּת, וּבַת אָב מֻותֶּרֶת לְבֶן נֹחַ", "כִּי לִפְנֵי מַתַּן תּוֹרָה הֻותְּרוּ כָּל הָעֲרָיוֹת", "כִּי שָׂרָה הָייְתָה רַק קְרוֹבָה רְחוֹקָה שֶׁל אַבְרָהָם"], "kasha": "אברהם מודה שהיא אחותו מאביו, ויש לשאול איך היה מותר לו לשאת אותה.", "answer": "בת אב מותרת לבן נח, כי אין אבהות לגוי. ואברהם השיב כך כדי שדבריו יהיו אמת.", "kp": ["ובת אב מתרת לבן נח", "שאין אבהות לגוי"]}, {"q": "אֵיךְ יָכוֹל אַבְרָהָם לוֹמַר שֶׁהִיא בַּת אָבִיו, אִם בְּעֶצֶם הָיְיתָה בַּת אָחִיו?", "options": ["בְּנֵי בָנִים הֵם כְּבָנִים, וְלָכֵן הִיא כְּבִתּוֹ שֶׁל תֶּרַח", "הָרָן וְאַבְרָהָם הָיוּ אַחִים רַק מִצַּד הָאֵם", "תֶּרַח אִימֵּץ אֶת שָׂרָה לְבַת לְאַחַר מוֹת הָרָן"], "kasha": "שרה הייתה בת הרן, אחיו של אברהם, ולא בתו של תרח.", "answer": "בני בנים הרי הם כבנים, ולכן שרה נחשבת בתו של תרח. וכך גם אמר אברהם ללוט \"כי אנשים אחים אנחנו\".", "kp": ["בני בנים הרי הן כבנים", "והרי היא בתו של תרח"]}]}, {"id": "20:12.2", "ch": 20, "v": 12, "n": 2, "dh": "אך לא בת אמי", "pasuk_html": "וְגַם־אָמְנָ֗ה אֲחֹתִ֤י בַת־אָבִי֙ הִ֔וא <mark>אַ֖ךְ לֹ֣א בַת־אִמִּ֑י</mark> וַתְּהִי־לִ֖י לְאִשָּֽׁה׃", "pasuk_en": "וְגַם־אָמְנָה אֲחֹתִי בַת־אָבִי הִוא אַךְ לֹא בַת־אִמִּי וַתְּהִי־לִי לְאִשָּׁה׃", "rashi_he": "אך לא בת אמי. הָרָן מֵאֵם אֲחֶרֶת הָיָה:", "rashi_en": "הרן, אביה של שרה, נולד לתרח מאישה אחרת, ולכן שרה קרובה לאברהם מצד אביו ולא מצד אמו.", "note": "", "points": [{"q": "מַדּוּעַ שָׂרָה אֵינָהּ בַּת אִמּוֹ שֶׁל אַבְרָהָם?", "options": ["הָרָן, אֲבִיהָ שֶׁל שָׂרָה, נוֹלַד לְתֶרַח מֵאֵם אַחֶרֶת", "שָׂרָה עַצְמָהּ נוֹלְדָה לְתֶרַח מֵאִישָּׁה אַחֶרֶת", "אִמּוֹ שֶׁל אַבְרָהָם מֵתָה לִפְנֵי שֶׁנּוֹלְדָה שָׂרָה"], "kasha": "שרה היא בת הרן, ולא ברור מה הקשר בינה לבין אמו של אברהם.", "answer": "הרן היה מאם אחרת מזו של אברהם, ולכן בתו שרה קרובה לאברהם רק מצד האב.", "kp": ["הרן מאם אחרת היה"]}]}, {"id": "20:13.1", "ch": 20, "v": 13, "n": 1, "dh": "ויהי כאשר התעו וגו'", "pasuk_html": "<mark>וַיְהִ֞י כַּאֲשֶׁ֧ר הִתְע֣וּ</mark> אֹתִ֗י אֱלֹהִים֮ מִבֵּ֣ית אָבִי֒ וָאֹמַ֣ר לָ֔הּ זֶ֣ה חַסְדֵּ֔ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑י אֶ֤ל כָּל־הַמָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּה אִמְרִי־לִ֖י אָחִ֥י הֽוּא׃", "pasuk_en": "וַיְהִי כַּאֲשֶׁר הִתְעוּ אֹתִי אֱלֹהִים מִבֵּית אָבִי וָאֹמַר לָהּ זֶה חַסְדֵּךְ אֲשֶׁר תַּעֲשִׂי עִמָּדִי אֶל כָּל־הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה אִמְרִי־לִי אָחִי הוּא׃", "rashi_he": "ויהי כאשר התעו וגו'. אֻנְקְלוֹס תִּרְגֵּם מַה שֶּׁתִּרְגֵּם; וְיֵשׁ לְיַשְּׁבוֹ עוֹד דָּבָר דָּבוּר עַל אָפְנָיו, כְּשֶׁהוֹצִיאַנִי הַקָּבָּ\"ה מִבֵּית אָבִי לִהְיוֹת מְשׁוֹטֵט וְנָד מִמָּקוֹם לְמָקוֹם, יָדַעְתִּי שֶׁאֶעֱבֹר בִּמְקוֹם רְשָׁעִים ואמר לה זה חסדך:", "rashi_en": "רש\"י מפרש את הפסוק כסדרו: כשהוציא הקב\"ה את אברהם מבית אביו לנדוד ממקום למקום, ידע שיעבור במקומות של רשעים, ולכן ביקש משרה לומר שהוא אחיה.", "note": "", "points": [{"q": "לְפִי פֵּירוּשׁ רַשִׁ\"י, מַדּוּעַ בִּיקֵּשׁ אַבְרָהָם מִשָּׂרָה לוֹמַר שֶׁהוּא אָחִיהָ?", "options": ["יֵדַע שֶׁבִּנְדוּדָיו יַעֲבֹור בִּמְקוֹמוֹת שֶׁל רְשָׁעִים", "כָּךְ צִיווָּה אוֹתוֹ הקב\"ה כְּשֶׁיָּצָא מִבֵּית אָבִיו", "פַּחַד שֶׁיִרְדְּפוּ אוֹתוֹ בִּגְלַל אֱמוּנָתוֹ בַּה'"], "kasha": "אונקלוס תרגם את הפסוק שלא כפשוטו, וצריך לפרש אותו כסדר מילותיו.", "answer": "כשהוציאו הקב\"ה מבית אביו להיות נודד ממקום למקום, ידע שיעבור במקומות של רשעים, ולכן אמר לשרה \"זה חסדך\".", "kp": ["להיות משוטט ונד ממקום למקום", "ידעתי שאעבר במקום רשעים"]}]}, {"id": "20:13.2", "ch": 20, "v": 13, "n": 2, "dh": "כאשר התעו", "pasuk_html": "וַיְהִ֞י <mark>כַּאֲשֶׁ֧ר הִתְע֣וּ</mark> אֹתִ֗י אֱלֹהִים֮ מִבֵּ֣ית אָבִי֒ וָאֹמַ֣ר לָ֔הּ זֶ֣ה חַסְדֵּ֔ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑י אֶ֤ל כָּל־הַמָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּה אִמְרִי־לִ֖י אָחִ֥י הֽוּא׃", "pasuk_en": "וַיְהִי כַּאֲשֶׁר הִתְעוּ אֹתִי אֱלֹהִים מִבֵּית אָבִי וָאֹמַר לָהּ זֶה חַסְדֵּךְ אֲשֶׁר תַּעֲשִׂי עִמָּדִי אֶל כָּל־הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה אִמְרִי־לִי אָחִי הוּא׃", "rashi_he": "כאשר התעו. לְשׁוֹן רַבִּים. וְאַל תִּתְמַהּ, כִּי הַרְבֵּה מְקוֹמוֹת לְשׁוֹן אֱלֹהוּת וּלְשׁוֹן מָרוּת קָרוּי בִּלְשׁוֹן רַבִּים, אֲשֶׁר הָלְכוּ אֱלֹהִים (שמואל ב ז'), אֱלֹהִים חַיִּים (דברים ה'), אֱלֹהִים קְדֹשִׁים (יהושע כ\"ד), וְכָל לְשׁוֹן אַדְנוּת לְשׁוֹן רַבִּים; וְכֵן וַיִּקַּח אֲדֹנֵי יוֹסֵף (בראשית ל\"ט), וַאֲדֹנֵי הָאֲדֹנִים (דברים י'), אֲדֹנֵי הָאָרֶץ (בראשית מ\"ב), וְכֵן בְּעָלָיו עִמּוֹ (שמות כ\"ב), וְהוּעַד בִּבְעָלָיו (שם כ\"א). וְאִם תֹּאמַר מַהוּ לְשׁוֹן הִתְעוּ? כָּל הַגּוֹלֶה מִמְּקוֹמוֹ וְאֵינוֹ מְיֻשָּׁב קָרוּי תּוֹעֶה, כְּמוֹ וַתֵּלֶךְ וַתֵּתַע (בראשית כ\"א), תָּעִיתִי כְּשֶׂה אֹבֵד (תהילים קי\"ט), יִתְעוּ לִבְלִי אֹכֶל (איוב ל\"ח) – יֵצְאוּ וְיִתְעוּ לְבַקֵּשׁ אָכְלָם:", "rashi_en": "המילה \"התעו\" כתובה בלשון רבים, כי לשון אלהות ושררה נכתבת הרבה פעמים בלשון רבים. ומשמעה נדודים: מי שגלה ממקומו ואינו מיושב נקרא תועה.", "note": "", "points": [{"q": "מַדּוּעַ \"הִתְעוּ\" כָּתוּב בִּלְשׁוֹן רַבִּים, אַף שֶׁמְּדֻובָּר בֵּאלֹהִים?", "options": ["לְשׁוֹן אֱלֹהוּת וּשְׂרָרָה נֶאֱמֶרֶת פְּעָמִים רַבּוֹת בִּלְשׁוֹן רַבִּים", "הַכַּווָּנָה לְמַלְאָכִים רַבִּים שֶׁהוֹצִיאוּ אֶת אַבְרָהָם", "הַכַּווָּנָה לֶאֱלִילִים שֶׁל בֵּית אָבִיו שֶׁהִטְעוּ אוֹתוֹ"], "kasha": "הפועל \"התעו\" בלשון רבים, ואילו הקב\"ה אחד.", "answer": "במקומות רבים לשון אלהות ולשון שררה נקראת בלשון רבים, כמו \"אלהים חיים\" ו\"אדני יוסף\".", "kp": ["לשון אלהות ולשון מרות קרוי בלשון רבים", "וכל לשון אדנות לשון רבים"]}, {"q": "מָה מַשְׁמָעוּת הַמִּילָּה \"הִתְעוּ\" לְפִי רַשִׁ\"י?", "options": ["נְדוּדִים, כְּמִי שֶׁגָּלָה מִמְּקוֹמוֹ וְאֵינוֹ מְיֻושָּׁב", "טָעוּת וְהִתְרַחֲקוּת מִן הַדֶּרֶךְ הַנְּכוֹנָה בָּאֱמוּנָה", "הַסְתָּרָה וְהַעְלָמָה מֵעֵינֵי אַנְשֵׁי הַמָּקוֹם"], "kasha": "לשון \"התעו\" נשמעת כטעות, ולא מובן מה עניינה כאן.", "answer": "כל מי שגולה ממקומו ואינו מיושב נקרא תועה, כמו \"ותלך ותתע\" ו\"תעיתי כשה אבד\".", "kp": ["כל הגולה ממקומו ואינו מישב קרוי תועה"]}]}, {"id": "20:13.3", "ch": 20, "v": 13, "n": 3, "dh": "אמרי לי", "pasuk_html": "וַיְהִ֞י כַּאֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗י אֱלֹהִים֮ מִבֵּ֣ית אָבִי֒ וָאֹמַ֣ר לָ֔הּ זֶ֣ה חַסְדֵּ֔ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑י אֶ֤ל כָּל־הַמָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּה <mark>אִמְרִי־לִ֖י</mark> אָחִ֥י הֽוּא׃", "pasuk_en": "וַיְהִי כַּאֲשֶׁר הִתְעוּ אֹתִי אֱלֹהִים מִבֵּית אָבִי וָאֹמַר לָהּ זֶה חַסְדֵּךְ אֲשֶׁר תַּעֲשִׂי עִמָּדִי אֶל כָּל־הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה אִמְרִי־לִי אָחִי הוּא׃", "rashi_he": "אמרי לי. עָלַי, וְכֵן וַיִּשְׁאֲלוּ אַנְשֵׁי הַמָּקוֹם לְאִשְׁתּוֹ (בראשית כ\"ו), עַל אִשְׁתּוֹ, וְכֵן וְאָמַר פַּרְעֹה לִבְנֵי יִשְׂרָאֵל (שמות י\"ד), כְּמוֹ עַל בְּנֵי יִשְׂרָאֵל; פֶּן יֹאמְרוּ לִי אִשָּׁה הֲרָגָתְהוּ (שופטים ט'):", "rashi_en": "\"לי\" פירושו \"עלי\": אברהם ביקש משרה שתאמר עליו שהוא אחיה. וכך מצינו במקומות נוספים שהאות למ\"ד משמשת במובן \"על\".", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ\"י אֶת בַּקָּשַׁת אַבְרָהָם מִשָּׂרָה לוֹמַר \"אָחִי הוּא\"?", "options": ["שֶׁתֹּאמַר עָלָיו לַאֲחֵרִים שֶׁהוּא אָחִיהָ", "שֶׁתֹּאמַר לוֹ עַצְמוֹ בַּסֵּתֶר שֶׁהוּא אָחִיהָ", "שֶׁתֹּאמַר זֹאת בִּשְׁבִילוֹ כְּדֵי לְהַצִּיל אֶת חַיָּיו"], "kasha": "המילה \"לי\" משמעה בדרך כלל \"אליי\", ואין הגיון שתאמר לאברהם עצמו שהוא אחיה.", "answer": "\"לי\" פירושו \"עלי\", כמו \"וישאלו אנשי המקום לאשתו\" שפירושו על אשתו.", "kp": ["אמרי לי. עלי", "כמו על בני ישראל"]}]}, {"id": "20:14.1", "ch": 20, "v": 14, "n": 1, "dh": "ויתן לאברהם", "pasuk_html": "וַיִּקַּ֨ח אֲבִימֶ֜לֶךְ צֹ֣אן וּבָקָ֗ר וַעֲבָדִים֙ וּשְׁפָחֹ֔ת <mark>וַיִּתֵּ֖ן לְאַבְרָהָ֑ם</mark> וַיָּ֣שֶׁב ל֔וֹ אֵ֖ת שָׂרָ֥ה אִשְׁתּֽוֹ׃", "pasuk_en": "וַיִּקַּח אֲבִימֶלֶךְ צֹאן וּבָקָר וַעֲבָדִים וּשְׁפָחֹת וַיִּתֵּן לְאַבְרָהָם וַיָּשֶׁב לוֹ אֵת שָׂרָה אִשְׁתּוֹ׃", "rashi_he": "ויתן לאברהם. כְּדֵי שֶׁיִּתְפַּיֵּס וְיִתְפַּלֵּל עָלָיו:", "rashi_en": "אבימלך נתן לאברהם מתנות כדי לפייס אותו, כדי שיתפלל עליו.", "note": "", "points": [{"q": "מַדּוּעַ נָתַן אֲבִימֶלֶךְ מַתָּנוֹת לְאַבְרָהָם?", "options": ["כְּדֵי לְפַייֵּס אוֹתוֹ שֶׁיִּתְפַּלֵּל עָלָיו", "כְּפִיצּוּי עַל שֶׁלָּקַח אֶת שָׂרָה לְבֵיתוֹ", "כְּדֵי שֶׁאַבְרָהָם יַעֲזוֹב אֶת אַרְצוֹ בְּשָׁלוֹם"], "kasha": "לא ברור מדוע אבימלך, שנפגע מאברהם, נותן לו מתנות.", "answer": "אבימלך נתן לו מתנות כדי שיתפייס ויתפלל עליו.", "kp": ["כדי שיתפיס ויתפלל עליו"]}]}, {"id": "20:15.1", "ch": 20, "v": 15, "n": 1, "dh": "הנה ארצי לפניך", "pasuk_html": "וַיֹּ֣אמֶר אֲבִימֶ֔לֶךְ <mark>הִנֵּ֥ה אַרְצִ֖י לְפָנֶ֑יךָ</mark> בַּטּ֥וֹב בְּעֵינֶ֖יךָ שֵֽׁב׃", "pasuk_en": "וַיֹּאמֶר אֲבִימֶלֶךְ הִנֵּה אַרְצִי לְפָנֶיךָ בַּטּוֹב בְּעֵינֶיךָ שֵׁב׃", "rashi_he": "הנה ארצי לפניך. אֲבָל פַּרְעֹה אָמַר לוֹ הִנֵּה אִשְׁתְּךָ קַח וָלֵךְ, לְפִי שֶׁנִּתְיָרֵא, שֶׁהַמִּצְרִיִּים שְׁטוּפֵי זִמָּה:", "rashi_en": "אבימלך הציע לאברהם לגור בארצו, ואילו פרעה אמר לו לקחת את אשתו וללכת, כי פחד מפני המצרים שהיו שטופי זימה.", "note": "", "points": [{"q": "מַדּוּעַ פַּרְעֹה, בְּנִיגּוּד לַאֲבִימֶלֶךְ, לֹא הִצִּיעַ לְאַבְרָהָם לָגוּר בְּאַרְצוֹ?", "options": ["פַּחַד, כִּי הַמִּצְרִים הָיוּ שְׁטוּפֵי זִימָּה", "כָּעַס עַל אַבְרָהָם שֶׁשִּׁיקֵּר לוֹ", "בְּאֶרֶץ מִצְרַיִם הָיָה אָז רָעָב כָּבֵד"], "kasha": "רש\"י מעיר על הצעת אבימלך \"הנה ארצי לפניך\", שאינה דומה לתגובת פרעה במקרה דומה.", "answer": "פרעה אמר לאברהם \"הנה אשתך קח ולך\", כי פחד שהמצרים שטופי זימה, ואילו אבימלך הזמין אותו לשבת בארצו.", "kp": ["הנה אשתך קח ולך", "שהמצריים שטופי זמה"]}]}, {"id": "20:16.1", "ch": 20, "v": 16, "n": 1, "dh": "ולשרה אמר", "pasuk_html": "<mark>וּלְשָׂרָ֣ה אָמַ֗ר</mark> הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֙סֶף֙ לְאָחִ֔יךְ הִנֵּ֤ה הוּא־לָךְ֙ כְּס֣וּת עֵינַ֔יִם לְכֹ֖ל אֲשֶׁ֣ר אִתָּ֑ךְ וְאֵ֥ת כֹּ֖ל וְנֹכָֽחַת׃", "pasuk_en": "וּלְשָׂרָה אָמַר הִנֵּה נָתַתִּי אֶלֶף כֶּסֶף לְאָחִיךְ הִנֵּה הוּא־לָךְ כְּסוּת עֵינַיִם לְכֹל אֲשֶׁר אִתָּךְ וְאֵת כֹּל וְנֹכָחַת׃", "rashi_he": "ולשרה אמר. אֲבִימֶלֶךְ לִכְבוֹדָהּ כְּדֵי לְפַיְּסָהּ, הִנֵּה עָשִׂיתִי לָךְ כָּבוֹד זֶה, נָתַתִּי מָמוֹן לְאָחִיךְ שֶׁאָמַרְתְּ עָלָיו אָחִי הוּא, הִנֵּה הַמָּמוֹן וְהַכָּבוֹד הַזֶּה לך כסות עינים:", "rashi_en": "אבימלך דיבר אל שרה לכבודה, כדי לפייס אותה: הוא נתן ממון לאחיה, והממון והכבוד הזה יהיו לה \"כסות עינים\".", "note": "", "points": [{"q": "מַה הָייְתָה מַטָּרַת דִּבְרֵי אֲבִימֶלֶךְ אֶל שָׂרָה?", "options": ["לְכַבֵּד וּלְפַייֵּס אוֹתָהּ עַל מַה שֶּׁעָבַר עָלֶיהָ", "לִנְזֹוף בָּהּ עַל שֶׁאָמְרָה שֶׁאַבְרָהָם אָחִיהָ", "לְהוֹדִיעַ לָהּ שֶׁאַבְרָהָם קִיבֵּל תַּשְׁלוּם עֲבוּרָהּ"], "kasha": "לא ברור מדוע אבימלך פונה לשרה ומספר לה על הכסף שנתן לאחיה.", "answer": "אבימלך אמר זאת לכבודה כדי לפייס אותה: הוא עשה לה כבוד ונתן ממון לאחיה, והממון והכבוד הם לה \"כסות עינים\".", "kp": ["לכבודה כדי לפיסה", "הנה עשיתי לך כבוד זה"]}]}, {"id": "20:16.2", "ch": 20, "v": 16, "n": 2, "dh": "לכל אשר אתך", "pasuk_html": "וּלְשָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֙סֶף֙ לְאָחִ֔יךְ הִנֵּ֤ה הוּא־לָךְ֙ כְּס֣וּת עֵינַ֔יִם <mark>לְכֹ֖ל אֲשֶׁ֣ר אִתָּ֑ךְ</mark> וְאֵ֥ת כֹּ֖ל וְנֹכָֽחַת׃", "pasuk_en": "וּלְשָׂרָה אָמַר הִנֵּה נָתַתִּי אֶלֶף כֶּסֶף לְאָחִיךְ הִנֵּה הוּא־לָךְ כְּסוּת עֵינַיִם לְכֹל אֲשֶׁר אִתָּךְ וְאֵת כֹּל וְנֹכָחַת׃", "rashi_he": "לכל אשר אתך. יְכַסּוּ עֵינֵיהֶם שֶׁלֹּא יְקִלּוּךְ, שֶׁאִלּוּ הֲשִׁיבוֹתִיךְ רֵיקָנִית, יֵשׁ לָהֶם לוֹמַר לְאַחַר שֶׁנִּתְעַלַּל בָּהּ הֶחֱזִירָהּ; עַכְשָׁו שֶׁהֻצְרַכְתִּי לְבַזְבֵּז מָמוֹן וּלְפַיְּסֵךְ, יוֹדְעִים יִהְיוּ שֶׁעַל כָּרְחִי הֲשִׁיבוֹתִיךְ וְעַל יְדֵי נֵס:", "rashi_en": "הממון שנתן אבימלך יכסה את עיני הסובבים את שרה כדי שלא יזלזלו בה: הם יבינו שהחזיר אותה בעל כורחו ובדרך נס, ולא אחרי שנתעלל בה.", "note": "", "points": [{"q": "כֵּיצַד הַמָּמוֹן יִהְיֶה \"כְּסוּת עֵינַיִם לְכֹל אֲשֶׁר אִתָּךְ\"?", "options": ["יָבִינוּ שֶׁהוּחְזְרָה בְּעַל כָּורְחוֹ, וְלֹא יְזַלְזְלוּ בָּהּ", "הַמָּמוֹן יִשְׁמַשׁ לִקְנִיַּית בְּגָדִים מְכֻובָּדִים לְשָׂרָה", "אַנְשֶׁיהָ לֹא יִצְטָרְכוּ עוֹד לִרְאוֹת אֶת אֲבִימֶלֶךְ"], "kasha": "לא ברור כיצד ממון יכול לכסות את עיני האנשים שעם שרה.", "answer": "אילו החזיר אותה ריקנית, היו אומרים שהחזירה אחרי שנתעלל בה. עכשיו שהוציא ממון רב לפייס אותה, ידעו שהחזירה בעל כורחו ועל ידי נס.", "kp": ["יכסו עיניהם שלא יקלוך", "שעל כרחי השיבותיך ועל ידי נס"]}]}, {"id": "20:16.3", "ch": 20, "v": 16, "n": 3, "dh": "ואת כל", "pasuk_html": "וּלְשָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֙סֶף֙ לְאָחִ֔יךְ הִנֵּ֤ה הוּא־לָךְ֙ כְּס֣וּת עֵינַ֔יִם לְכֹ֖ל אֲשֶׁ֣ר אִתָּ֑ךְ <mark>וְאֵ֥ת כֹּ֖ל</mark> וְנֹכָֽחַת׃", "pasuk_en": "וּלְשָׂרָה אָמַר הִנֵּה נָתַתִּי אֶלֶף כֶּסֶף לְאָחִיךְ הִנֵּה הוּא־לָךְ כְּסוּת עֵינַיִם לְכֹל אֲשֶׁר אִתָּךְ וְאֵת כֹּל וְנֹכָחַת׃", "rashi_he": "ואת כל. וְעִם כָּל בָּאֵי עוֹלָם:", "rashi_en": "\"ואת כל\" פירושו: ועם כל באי העולם.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"וְאֵת כֹּל\" בַּפָּסוּק?", "options": ["וְעִם כָּל בָּאֵי הָעוֹלָם", "וְעִם כָּל הָרְכוּשׁ שֶׁיֵּשׁ לָךְ", "וְעִם כָּל בְּנֵי בֵיתְךָ וַעֲבָדֶיךָ"], "kasha": "המילים \"ואת כל\" אינן מפרטות למי הכוונה.", "answer": "הכוונה לכל באי העולם.", "kp": ["ועם כל באי עולם"]}]}, {"id": "20:16.4", "ch": 20, "v": 16, "n": 4, "dh": "ונכחת", "pasuk_html": "וּלְשָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֙סֶף֙ לְאָחִ֔יךְ הִנֵּ֤ה הוּא־לָךְ֙ כְּס֣וּת עֵינַ֔יִם לְכֹ֖ל אֲשֶׁ֣ר אִתָּ֑ךְ וְאֵ֥ת כֹּ֖ל <mark>וְנֹכָֽחַת׃</mark>", "pasuk_en": "וּלְשָׂרָה אָמַר הִנֵּה נָתַתִּי אֶלֶף כֶּסֶף לְאָחִיךְ הִנֵּה הוּא־לָךְ כְּסוּת עֵינַיִם לְכֹל אֲשֶׁר אִתָּךְ וְאֵת כֹּל וְנֹכָחַת׃", "rashi_he": "ונכחת. יְהִי לָךְ פִּתְחוֹן פֶּה לְהִתְוַכֵּחַ וּלְהַרְאוֹת דְבָרִים נִכָּרִים הַלָּלוּ; וּלְשׁוֹן הוֹכָחָה בְּכָל מָקוֹם בֵּרוּר דְּבָרִים ובלע\"ז אשפרו\"ביר, וְאֻנְקְלוֹס תִּרְגֵּם בְּפָנִים אֲחֵרִים, וּלְשׁוֹן הַמִּקְרָא כָּךְ הוּא נוֹפֵל עַל הַתַּרְגּוּם, הִנֵּה לָךְ כְּסוּת שֶׁל כָּבוֹד עַל הָעֵינַיִם שֶׁלִּי שֶׁשָּׁלְטוּ בָּךְ וּבְכֹל אֲשֶׁר אִתָּךְ, וְעַל כֵּן תִּרְגְּמוֹ וַחֲזֵית יָתִיךְ וְיַת כָּל דְּעִמָּךְ. וְיֵשׁ מִ\"אַ אֲבָל יִשּׁוּב לְשׁוֹן הַמִּקְרָא פֵּרַשְׁתִּי:", "rashi_en": "\"ונכחת\" פירושו שיהיה לשרה פתחון פה להתווכח ולהראות את הדברים הברורים, כי לשון הוכחה פירושה בירור דברים. אונקלוס תרגם באופן אחר.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"וְנֹכָחַת\" לְפִי רַשִׁ\"י?", "options": ["יִהְיֶה לְךָ פִּתְחוֹן פֶּה לְבָרֵר וּלְהוֹכִיחַ אֶת הָאֱמֶת", "תְּקַבְּלִי תּוֹכֵחָה וּנְזִיפָה עַל מַעֲשַׂיִיךְ", "תַּעַמְדִי מוּל אֲבִימֶלֶךְ וְתִתְפַּיְּיסִי עִמּוֹ"], "kasha": "המילה \"ונכחת\" אינה ברורה, ואפשר לפרשה כתוכחה ונזיפה.", "answer": "יהיה לשרה פתחון פה להתווכח ולהראות את הדברים הברורים, כי לשון הוכחה בכל מקום היא בירור דברים.", "kp": ["יהי לך פתחון פה להתוכח", "ברור דברים"]}]}, {"id": "20:17.1", "ch": 20, "v": 17, "n": 1, "dh": "וילדו", "pasuk_html": "וַיִּתְפַּלֵּ֥ל אַבְרָהָ֖ם אֶל־הָאֱלֹהִ֑ים וַיִּרְפָּ֨א אֱלֹהִ֜ים אֶת־אֲבִימֶ֧לֶךְ וְאֶת־אִשְׁתּ֛וֹ וְאַמְהֹתָ֖יו <mark>וַיֵּלֵֽדוּ׃</mark>", "pasuk_en": "וַיִּתְפַּלֵּל אַבְרָהָם אֶל־הָאֱלֹהִים וַיִּרְפָּא אֱלֹהִים אֶת־אֲבִימֶלֶךְ וְאֶת־אִשְׁתּוֹ וְאַמְהֹתָיו וַיֵּלֵדוּ׃", "rashi_he": "וילדו. כְּתַרְגּוּמוֹ וְאִתְרְוָחוּ, נִפְתְּחוּ נִקְבֵיהֶם וְהוֹצִיאוּ, וְהִיא לֵדָה שֶׁלָּהֶם:", "rashi_en": "\"וילדו\" אין פירושו לידת ילדים, אלא כתרגום אונקלוס \"ואתרוחו\": נפתחו נקביהם והוציאו את מה שנעצר, וזו הלידה שלהם.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"וַיֵּלֵדוּ\" כָּאן?", "options": ["נִפְתְּחוּ נְקָבֵיהֶם וְהוֹצִיאוּ אֶת מַה שֶּׁנֶּעְצַר", "הַנָּשִׁים יָלְדוּ אֶת הַווְּלָדוֹת שֶׁנֶּעֶצְרוּ בְּרַחְמָן", "נוֹלְדוּ לָהֶם יְלָדִים בִּזְכוּת תְּפִילַּת אַבְרָהָם"], "kasha": "\"וילדו\" נאמר גם על אבימלך עצמו, וזכר אינו יולד.", "answer": "כתרגומו \"ואתרוחו\": נפתחו נקביהם והוציאו את מה שהיה סתום, וזו הלידה שלהם.", "kp": ["נפתחו נקביהם והוציאו", "והיא לדה שלהם"]}]}, {"id": "20:18.1", "ch": 20, "v": 18, "n": 1, "dh": "בעד כל רחם", "pasuk_html": "כִּֽי־עָצֹ֤ר עָצַר֙ יְהוָ֔ה <mark>בְּעַ֥ד כָּל־רֶ֖חֶם</mark> לְבֵ֣ית אֲבִימֶ֑לֶךְ עַל־דְּבַ֥ר שָׂרָ֖ה אֵ֥שֶׁת אַבְרָהָֽם׃ (ס)", "pasuk_en": "כִּי־עָצֹר עָצַר יְהוָה בְּעַד כָּל־רֶחֶם לְבֵית אֲבִימֶלֶךְ עַל־דְּבַר שָׂרָה אֵשֶׁת אַבְרָהָם׃", "rashi_he": "בעד כל רחם. כְּנֶגֶד כָּל פֶּתַח:", "rashi_en": "\"רחם\" כאן פירושו כל פתח בגוף, ולא רק רחם האישה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"רֶחֶם\" בַּעֲצִירָה שֶׁעָצַר ה' בְּבֵית אֲבִימֶלֶךְ?", "options": ["כָּל פֶּתַח שֶׁבַּגּוּף", "רַחֲמֵי הַנָּשִׁים בִּלְבַד", "כָּל הַבָּתִּים שֶׁבַּמַּמְלָכָה"], "kasha": "המכה פגעה גם באבימלך עצמו, ורחם קיים רק אצל נשים.", "answer": "\"רחם\" כאן פירושו כנגד כל פתח בגוף.", "kp": ["כנגד כל פתח"]}]}, {"id": "20:18.2", "ch": 20, "v": 18, "n": 2, "dh": "על דבר שרה", "pasuk_html": "כִּֽי־עָצֹ֤ר עָצַר֙ יְהוָ֔ה בְּעַ֥ד כָּל־רֶ֖חֶם לְבֵ֣ית אֲבִימֶ֑לֶךְ <mark>עַל־דְּבַ֥ר שָׂרָ֖ה</mark> אֵ֥שֶׁת אַבְרָהָֽם׃ (ס)", "pasuk_en": "כִּי־עָצֹר עָצַר יְהוָה בְּעַד כָּל־רֶחֶם לְבֵית אֲבִימֶלֶךְ עַל־דְּבַר שָׂרָה אֵשֶׁת אַבְרָהָם׃", "rashi_he": "על דבר שרה. עַל פִּי דִּבּוּרָהּ שֶׁל שָׂרָה:", "rashi_en": "המכה באה על בית אבימלך על פי דבורה של שרה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמַּכָּה שֶׁבָּאָה \"עַל דְּבַר\" שָׂרָה?", "options": ["הַמַּכָּה בָּאָה עַל פִּי דִּבּוּרָהּ שֶׁל שָׂרָה", "הַמַּכָּה בָּאָה בִּגְלַל שֶׁלָּקְחוּ אֶת שָׂרָה לְבֵית הַמֶּלֶךְ", "הַמַּכָּה בָּאָה בְּעִנְייַן הַשֶּׁקֶר שֶׁאָמְרָה שָׂרָה"], "kasha": "היה אפשר לכתוב \"בעבור שרה\", ולא ברור מה מוסיפה הלשון \"על דבר\".", "answer": "\"על דבר\" פירושו על פי הדיבור של שרה.", "kp": ["על פי דבורה של שרה"]}]}, {"id": "21:1.1", "ch": 21, "v": 1, "n": 1, "dh": "וה' פקד את שרה וגו'", "pasuk_html": "<mark>וַֽיהוָ֛ה פָּקַ֥ד אֶת־שָׂרָ֖ה</mark> כַּאֲשֶׁ֣ר אָמָ֑ר וַיַּ֧עַשׂ יְהוָ֛ה לְשָׂרָ֖ה כַּאֲשֶׁ֥ר דִּבֵּֽר׃", "pasuk_en": "וַיהוָה פָּקַד אֶת־שָׂרָה כַּאֲשֶׁר אָמָר וַיַּעַשׂ יְהוָה לְשָׂרָה כַּאֲשֶׁר דִּבֵּר׃", "rashi_he": "וה' פקד את שרה וגו'. סָמַך פָּרָשָׁה זוֹ לְלַמֶּדְךָ, שֶׁכָּל הַמְבַקֵּשׁ רַחֲמִים עַל חֲבֵרוֹ וְהוּא צָרִיךְ לְאוֹתוֹ דָבָר, הוּא נַעֲנֶה תְחִלָּה (בבא קמא צ\"ב), שֶׁנֶּאֱמַר וַיִּתְפַּלֵּל וְגוֹ', וּסְמִיךְ לֵיהּ וה' פָּקַד אֶת שָׂרָה, שֶׁפְּקָדָהּ כְּבָר קֹדֶם שֶׁרִפֵּא אֶת אֲבִימֶלֶךְ:", "rashi_en": "פקידת שרה נסמכה לתפילת אברהם על אבימלך כדי ללמד שהמבקש רחמים על חברו, והוא עצמו צריך לאותו דבר, נענה תחילה. לכן שרה נפקדה עוד לפני שנרפא אבימלך.", "note": "", "points": [{"q": "מַה לוֹמְדִים מִסְּמִיכוּת פְּקִידַת שָׂרָה לִתְפִילַּת אַבְרָהָם עַל אֲבִימֶלֶךְ?", "options": ["הַמְּבַקֵּשׁ רַחֲמִים עַל חֲבֵרוֹ נַעֲנֶה תְּחִילָּה", "תְּפִילָּה עַל אֲחֵרִים מְבַטֶּלֶת עֹונֶשׁ מֵהַמִּתְפַּלֵּל", "הַקָּב\"ה מְקַיֵּים הַבְּטָחוֹת רַק אַחֲרֵי תְּפִילָּה"], "kasha": "לא ברור מדוע פרשת פקידת שרה נסמכה דווקא לסיפור תפילת אברהם על אבימלך.", "answer": "מי שמבקש רחמים על חברו והוא צריך לאותו דבר, נענה תחילה. לכן שרה נפקדה כבר לפני שה' ריפא את אבימלך.", "kp": ["כל המבקש רחמים על חברו", "הוא נענה תחלה"]}]}, {"id": "21:1.2", "ch": 21, "v": 1, "n": 2, "dh": "פקד את שרה כאשר אמר", "pasuk_html": "וַֽיהוָ֛ה <mark>פָּקַ֥ד אֶת־שָׂרָ֖ה כַּאֲשֶׁ֣ר אָמָ֑ר</mark> וַיַּ֧עַשׂ יְהוָ֛ה לְשָׂרָ֖ה כַּאֲשֶׁ֥ר דִּבֵּֽר׃", "pasuk_en": "וַיהוָה פָּקַד אֶת־שָׂרָה כַּאֲשֶׁר אָמָר וַיַּעַשׂ יְהוָה לְשָׂרָה כַּאֲשֶׁר דִּבֵּר׃", "rashi_he": "פקד את שרה כאשר אמר. בְּהֵרָיוֹן:", "rashi_en": "\"פקד את שרה כאשר אמר\" מתייחס להריון.", "note": "", "points": [{"q": "עַל מַה נֶאֱמַר \"פָּקַד אֶת שָׂרָה כַּאֲשֶׁר אָמָר\"?", "options": ["עַל הַהֵרָיוֹן", "עַל הַלֵּידָה", "עַל שִׁינּוּי שְׁמָהּ לְשָׂרָה"], "kasha": "הפסוק כופל \"כאשר אמר\" ו\"כאשר דבר\", ולכן יש לברר במה עוסק כל חלק.", "answer": "החלק הראשון מדבר על ההריון: ה' פקד את שרה בהריון כפי שאמר.", "kp": ["פקד את שרה כאשר אמר. בהריון"]}]}, {"id": "21:1.3", "ch": 21, "v": 1, "n": 3, "dh": "כאשר דבר", "pasuk_html": "וַֽיהוָ֛ה פָּקַ֥ד אֶת־שָׂרָ֖ה כַּאֲשֶׁ֣ר אָמָ֑ר וַיַּ֧עַשׂ יְהוָ֛ה לְשָׂרָ֖ה <mark>כַּאֲשֶׁ֥ר דִּבֵּֽר׃</mark>", "pasuk_en": "וַיהוָה פָּקַד אֶת־שָׂרָה כַּאֲשֶׁר אָמָר וַיַּעַשׂ יְהוָה לְשָׂרָה כַּאֲשֶׁר דִּבֵּר׃", "rashi_he": "כאשר דבר. בְּלֵדָה. וְהֵיכָן הִיא אֲמִירָה, וְהֵיכָן הוּא דִּבּוּר? אֲמִירָה וַיֹּאמֶר אֱלֹהִים אֲבָל שָׂרָה אִשְׁתְּךָ וְגוֹ '(בראשית י\"ז), דִּבּוּר הָיָה דְבַר ה' אֶל אַבְרָם בִּבְרִית בֵּין הַבְּתָרִים, וְשָׁם נֶאֱמַר לֹא יִירָשְׁךָ זֶה וְגוֹ' (שם ט\"ו), וְהֵבִיא הַיּוֹרֵשׁ מִשָּׂרָה:", "rashi_en": "\"כאשר דבר\" מתייחס ללידה. האמירה היא \"אבל שרה אשתך\", והדיבור היה בברית בין הבתרים, שם נאמר \"לא יירשך זה\", וה' הביא את היורש משרה.", "note": "", "points": [{"q": "עַל מַה נֶאֱמַר \"כַּאֲשֶׁר דִּבֵּר\" בְּסוֹף הַפָּסוּק?", "options": ["עַל הַלֵּידָה", "עַל הַהֵרָיוֹן", "עַל נְתִינַת הַשֵּׁם יִצְחָק"], "kasha": "הפסוק כופל \"כאשר אמר\" ו\"כאשר דבר\", ונראה שמדובר בשני עניינים.", "answer": "\"כאשר דבר\" מתייחס ללידה, ואילו \"כאשר אמר\" מתייחס להריון.", "kp": ["כאשר דבר. בלדה"]}, {"q": "הֵיכָן נֶאֱמַר הַדִּיבּוּר שֶׁעָלָיו כָּתוּב \"כַּאֲשֶׁר דִּבֵּר\"?", "options": ["בִּבְרִית בֵּין הַבְּתָרִים, כְּשֶׁנֶּאֱמַר שֶׁאֱלִיעֶזֶר לֹא יִירַשׁ", "בִּבְשׂוֹרַת הַמַּלְאָכִים שֶׁבָּאוּ לְאֹוהֶל אַבְרָהָם", "בִּבְרִית הַמִּילָה, כְּשֶׁנֶּאֱמַר \"אֲבָל שָׂרָה אִשְׁתְּךָ\""], "kasha": "יש לברר היכן בתורה מצויים האמירה והדיבור שהפסוק מתייחס אליהם.", "answer": "האמירה היא \"ויאמר אלהים אבל שרה אשתך\", והדיבור היה בברית בין הבתרים, שם נאמר \"לא יירשך זה\", וה' הביא את היורש משרה.", "kp": ["בברית בין הבתרים", "והביא היורש משרה"]}]}, {"id": "21:1.4", "ch": 21, "v": 1, "n": 4, "dh": "ויעש ה' לשרה כאשר דבר", "pasuk_html": "וַֽיהוָ֛ה פָּקַ֥ד אֶת־שָׂרָ֖ה כַּאֲשֶׁ֣ר אָמָ֑ר <mark>וַיַּ֧עַשׂ יְהוָ֛ה לְשָׂרָ֖ה כַּאֲשֶׁ֥ר דִּבֵּֽר׃</mark>", "pasuk_en": "וַיהוָה פָּקַד אֶת־שָׂרָה כַּאֲשֶׁר אָמָר וַיַּעַשׂ יְהוָה לְשָׂרָה כַּאֲשֶׁר דִּבֵּר׃", "rashi_he": "ויעש ה' לשרה כאשר דבר. לְאַבְרָהָם:", "rashi_en": "ה' עשה לשרה כפי שדיבר אל אברהם.", "note": "", "points": [{"q": "אֶל מִי דִּיבֵּר ה' בַּדְּבָרִים שֶׁמּוּזְכָּרִים בְּ\"וַיַּעַשׂ יְהוָה לְשָׂרָה כַּאֲשֶׁר דִּבֵּר\"?", "options": ["אֶל אַבְרָהָם", "אֶל שָׂרָה", "אֶל הַמַּלְאָכִים שֶׁבָּאוּ לְבַשֵּׂר"], "kasha": "מלשון הפסוק אפשר להבין שה' דיבר אל שרה, אך הדיבור היה לאברהם.", "answer": "ה' עשה לשרה כפי שדיבר אל אברהם.", "kp": ["ויעש ה' לשרה כאשר דבר. לאברהם"]}]}, {"id": "21:2.1", "ch": 21, "v": 2, "n": 1, "dh": "למועד אשר דבר אתו", "pasuk_html": "וַתַּהַר֩ וַתֵּ֨לֶד שָׂרָ֧ה לְאַבְרָהָ֛ם בֵּ֖ן לִזְקֻנָ֑יו <mark>לַמּוֹעֵ֕ד אֲשֶׁר־דִּבֶּ֥ר אֹת֖וֹ</mark> אֱלֹהִֽים׃", "pasuk_en": "וַתַּהַר וַתֵּלֶד שָׂרָה לְאַבְרָהָם בֵּן לִזְקֻנָיו לַמּוֹעֵד אֲשֶׁר־דִּבֶּר אֹתוֹ אֱלֹהִים׃", "rashi_he": "למועד אשר דבר אתו. דִּי מַלִּיל יָתֵהּ, אֶת הַמּוֹעֵד דִּבֵּר וְקָבַע כְּשֶׁאָמַר לוֹ לַמּוֹעֵד אָשׁוּב אֵלֶיךָ (שם י\"ח), שָׂרַט לוֹ שְׂרִיטָה בַּכֹּתֶל, אָמַר לוֹ כְּשֶׁתַּגִּיעַ חַמָּה לִשְׂרִיטָה זוֹ בַּשָּׁנָה הָאַחֶרֶת, תֵּלֵד:", "rashi_en": "ה' קבע את מועד הלידה כשאמר \"למועד אשוב אליך\": הוא שרט שריטה בכותל ואמר שכשתגיע השמש לשריטה זו בשנה הבאה, תלד שרה.", "note": "", "points": [{"q": "מַהוּ הַמּוֹעֵד שֶׁה' דִּיבֵּר עָלָיו עִם אַבְרָהָם, לְפִי רַשִׁ\"י?", "options": ["הַזְּמַן שֶׁסִּימֵּן בִּשְׂרִיטָה בַּכֹּותֶל לַשָּׁנָה הַבָּאָה", "זְמַן חַג הַפֶּסַח שֶׁבּוֹ בָּאוּ הַמַּלְאָכִים", "תִּשְׁעָה חֳודָשִׁים מִיּוֹם בְּרִית הַמִּילָה"], "kasha": "הפסוק אומר שהלידה הייתה \"למועד\" שדיבר ה', ולא ברור מתי ואיך נקבע המועד.", "answer": "ה' קבע את המועד כשאמר \"למועד אשוב אליך\": שרט שריטה בכותל ואמר שכשתגיע החמה לשריטה זו בשנה הבאה, תלד שרה.", "kp": ["שרט לו שריטה בכתל", "כשתגיע חמה לשריטה זו"]}]}, {"id": "21:2.2", "ch": 21, "v": 2, "n": 2, "dh": "לזקניו", "pasuk_html": "וַתַּהַר֩ וַתֵּ֨לֶד שָׂרָ֧ה לְאַבְרָהָ֛ם בֵּ֖ן <mark>לִזְקֻנָ֑יו</mark> לַמּוֹעֵ֕ד אֲשֶׁר־דִּבֶּ֥ר אֹת֖וֹ אֱלֹהִֽים׃", "pasuk_en": "וַתַּהַר וַתֵּלֶד שָׂרָה לְאַבְרָהָם בֵּן לִזְקֻנָיו לַמּוֹעֵד אֲשֶׁר־דִּבֶּר אֹתוֹ אֱלֹהִים׃", "rashi_he": "לזקניו. היה זיו איקונין שלו דומה לו:", "rashi_en": "\"לזקניו\" מלמד שתואר פניו של יצחק היה דומה לתואר פניו של אברהם.", "note": "", "points": [{"q": "מָה מְלַמֶּדֶת הַמִּילָּה \"לִזְקֻנָיו\" לְפִי רַשִׁ\"י?", "options": ["תֹּואַר פָּנָיו שֶׁל יִצְחָק הָיָה דּוֹמֶה לְאַבְרָהָם", "יִצְחָק נוֹלַד כְּשֶׁאַבְרָהָם הָיָה זָקֵן מְאֹוד", "יִצְחָק הָיָה חָכָם כְּזָקֵן כְּבָר מִיַּלְדוּתוֹ"], "kasha": "כבר ידוע שאברהם זקן, ולא ברור מה מוסיפה המילה \"לזקניו\".", "answer": "קלסתר פניו של יצחק היה דומה לזה של אברהם.", "kp": ["היה זיו איקונין שלו דומה לו"]}]}, {"id": "21:6.1", "ch": 21, "v": 6, "n": 1, "dh": "יצחק לי", "pasuk_html": "וַתֹּ֣אמֶר שָׂרָ֔ה צְחֹ֕ק עָ֥שָׂה לִ֖י אֱלֹהִ֑ים כָּל־הַשֹּׁמֵ֖עַ <mark>יִֽצְחַק־לִֽי׃</mark>", "pasuk_en": "וַתֹּאמֶר שָׂרָה צְחֹק עָשָׂה לִי אֱלֹהִים כָּל־הַשֹּׁמֵעַ יִצְחַק־לִי׃", "rashi_he": "יצחק לי. יִשְׂמַח עָלַי. וּמִ\"אַ הַרְבֵּה עֲקָרוֹת נִפְקְדוּ עִמָּהּ, הַרְבֵּה חוֹלִים נִתְרַפְּאוּ בוֹ בַיּוֹם, הַרְבֵּה תְפִלּוֹת נַעֲנוּ עִמָּהּ, וְרֹב שְׂחוֹק הָיָה בָעוֹלָם:", "rashi_en": "לפי הפשט, כל השומע ישמח בשביל שרה. ולפי המדרש, עמה נפקדו עקרות רבות, נרפאו חולים רבים ונענו תפילות רבות, והייתה שמחה גדולה בעולם.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַצְּחוֹק שֶׁל כָּל הַשּׁוֹמֵעַ, לְפִי הַפְּשָׁט?", "options": ["יִשְׂמַח בִּשְׁבִילִי וְיַחַד אִיתִי", "יִלְעַג לִי עַל שֶׁיָּלַדְתִּי בְּזִקְנָתִי", "יִקְרָא לִבְנִי בְּשֵׁם יִצְחָק"], "kasha": "צחוק יכול להיות לעג, ולא ברור באיזה צחוק מדובר.", "answer": "הכוונה לשמחה: כל השומע ישמח על שרה.", "kp": ["ישמח עלי"]}, {"q": "לְפִי הַמִּדְרָשׁ, מַדּוּעַ שָׂמְחוּ רַבִּים בָּעוֹלָם עִם לֵידַת יִצְחָק?", "options": ["עֲקָרוֹת רַבּוֹת נִפְקְדוּ וַחוֹלִים רַבִּים נִרְפְּאוּ עִמָּהּ", "נוֹלַד בֵּן שֶׁיַּמְשִׁיךְ אֶת דַּרְכּוֹ שֶׁל אַבְרָהָם", "אֲבִימֶלֶךְ וְעַמּוֹ נִרְפְּאוּ מִן הַמַּכָּה בְּאוֹתוֹ יוֹם"], "kasha": "לא מובן מדוע לידת בן לשרה תשמח את כל השומעים.", "answer": "עקרות רבות נפקדו עמה, חולים רבים נרפאו באותו יום, תפילות רבות נענו עמה, והייתה שמחה גדולה בעולם.", "kp": ["הרבה עקרות נפקדו עמה", "הרבה חולים נתרפאו בו ביום"]}]}, {"id": "21:7.1", "ch": 21, "v": 7, "n": 1, "dh": "מי מלל לאברהם", "pasuk_html": "וַתֹּ֗אמֶר <mark>מִ֤י מִלֵּל֙ לְאַבְרָהָ֔ם</mark> הֵינִ֥יקָה בָנִ֖ים שָׂרָ֑ה כִּֽי־יָלַ֥דְתִּי בֵ֖ן לִזְקֻנָֽיו׃", "pasuk_en": "וַתֹּאמֶר מִי מִלֵּל לְאַבְרָהָם הֵינִיקָה בָנִים שָׂרָה כִּי־יָלַדְתִּי בֵן לִזְקֻנָיו׃", "rashi_he": "מי מלל לאברהם. לְשׁוֹן שֶׁבַח וַחֲשִׁיבוּת, רְאוּ, מִי הוּא וְכַמָּה הוּא שׁוֹמֵר הַבְטָחָתוֹ הַקָּבָּ\"ה מַבְטִיחַ וְעוֹשֶׂה.", "rashi_en": "\"מי מלל לאברהם\" הוא לשון שבח: ראו מי הוא הקב\"ה, ועד כמה הוא שומר את הבטחתו, מבטיח ומקיים.", "note": "", "points": [{"q": "מַה כַּווָּנַת שָׂרָה בְּאוֹמְרָהּ \"מִי מִלֵּל לְאַבְרָהָם\"?", "options": ["שֶׁבַח לַקב\"ה שֶׁמַּבְטִיחַ וּמְקַיֵּים", "תְּמִיהָה מִי סִיפֵּר לְאַבְרָהָם עַל הַהֵרָיוֹן", "תְּלוּנָה שֶׁאִישׁ לֹא הֶאֱמִין לְדִבְרֵי אַבְרָהָם"], "kasha": "השאלה \"מי מלל\" נשמעת כשאלה רגילה, ולא ברור מה שרה שואלת.", "answer": "זו לשון שבח וחשיבות: ראו מי הוא וכמה הוא שומר את הבטחתו, הקב\"ה מבטיח ועושה.", "kp": ["לשון שבח וחשיבות", "הקב\"ה מבטיח ועושה"]}]}, {"id": "21:7.2", "ch": 21, "v": 7, "n": 2, "dh": "מלל", "pasuk_html": "וַתֹּ֗אמֶר מִ֤י <mark>מִלֵּל֙</mark> לְאַבְרָהָ֔ם הֵינִ֥יקָה בָנִ֖ים שָׂרָ֑ה כִּֽי־יָלַ֥דְתִּי בֵ֖ן לִזְקֻנָֽיו׃", "pasuk_en": "וַתֹּאמֶר מִי מִלֵּל לְאַבְרָהָם הֵינִיקָה בָנִים שָׂרָה כִּי־יָלַדְתִּי בֵן לִזְקֻנָיו׃", "rashi_he": "מלל. שִׁנָּה הַכָּתוּב וְלֹא אָמַר דִּבֵּר – גִּימַטְרִיָּא שֶׁלּוֹ ק', כְּלוֹמַר לְסוֹף מֵאָה לְאַבְרָהָם:", "rashi_en": "התורה כתבה \"מלל\" ולא \"דבר\", כי הגימטריה של \"מלל\" היא מאה, ורומזת שאברהם היה בן מאה.", "note": "", "points": [{"q": "מַדּוּעַ נֶאֱמַר \"מִלֵּל\" וְלֹא \"דִּבֵּר\"?", "options": ["הַגִּימַטְרִיָּה שֶׁל \"מִלֵּל\" הִיא מֵאָה, כְּגִיל אַבְרָהָם", "\"מִלֵּל\" הִיא לָשׁוֹן רַכָּה שֶׁל בְּשׂוֹרָה טוֹבָה", "\"מִלֵּל\" מְצַייֵּן דִּיבּוּר בְּסֵתֶר וּבְחָשַׁאי"], "kasha": "המילה הרגילה בתורה היא \"דבר\", ולא ברור מדוע שינה הכתוב ל\"מלל\".", "answer": "הגימטריה של \"מלל\" היא מאה, כלומר בסוף מאה שנה לאברהם נולד לו בן.", "kp": ["שנה הכתוב ולא אמר דבר", "לסוף מאה לאברהם"]}]}, {"id": "21:7.3", "ch": 21, "v": 7, "n": 3, "dh": "היניקה בנים שרה", "pasuk_html": "וַתֹּ֗אמֶר מִ֤י מִלֵּל֙ לְאַבְרָהָ֔ם <mark>הֵינִ֥יקָה בָנִ֖ים שָׂרָ֑ה</mark> כִּֽי־יָלַ֥דְתִּי בֵ֖ן לִזְקֻנָֽיו׃", "pasuk_en": "וַתֹּאמֶר מִי מִלֵּל לְאַבְרָהָם הֵינִיקָה בָנִים שָׂרָה כִּי־יָלַדְתִּי בֵן לִזְקֻנָיו׃", "rashi_he": "היניקה בנים שרה. וּמַהוּ בָנִים לְשׁוֹן רַבִּים? בְּיוֹם הַמִּשְׁתֶּה הֵבִיאוּ הַשָּׂרוֹת בְּנֵיהֶן עִמָּהֶן וְהֵנִיקָה אוֹתָם, שֶׁהָיוּ אוֹמְרוֹת לֹא יָלְדָה שָׂרָה, אֶלָֹּא אֲסוּפִי הֵבִיאָה מִן הַשּׁוּק:", "rashi_en": "\"בנים\" בלשון רבים, כי ביום המשתה הביאו השרות את בניהן ושרה הניקה אותם, כדי להפריך את דבריהן שלא ילדה אלא הביאה אסופי מן השוק.", "note": "", "points": [{"q": "מַדּוּעַ כָּתוּב \"בָנִים\" בִּלְשׁוֹן רַבִּים?", "options": ["שָׂרָה הֵנִיקָה גַּם אֶת יַלְדֵי הַשָּׂרוֹת בְּיוֹם הַמִּשְׁתֶּה", "שָׂרָה עֲתִידָה לָלֶדֶת עוֹד בָּנִים אַחֲרֵי יִצְחָק", "הַכַּווָּנָה לְצֶאֱצָאָיו שֶׁל יִצְחָק בַּדּוֹרוֹת הַבָּאִים"], "kasha": "לשרה נולד רק בן אחד, ובכל זאת כתוב \"בנים\" בלשון רבים.", "answer": "ביום המשתה הביאו השרות את בניהן ושרה הניקה אותם, כי הן אמרו שלא ילדה אלא הביאה אסופי מן השוק.", "kp": ["והניקה אותם", "אסופי הביאה מן השוק"]}]}, {"id": "21:8.1", "ch": 21, "v": 8, "n": 1, "dh": "ויגמל", "pasuk_html": "וַיִּגְדַּ֥ל הַיֶּ֖לֶד <mark>וַיִּגָּמַ֑ל</mark> וַיַּ֤עַשׂ אַבְרָהָם֙ מִשְׁתֶּ֣ה גָד֔וֹל בְּי֖וֹם הִגָּמֵ֥ל אֶת־יִצְחָֽק׃", "pasuk_en": "וַיִּגְדַּל הַיֶּלֶד וַיִּגָּמַל וַיַּעַשׂ אַבְרָהָם מִשְׁתֶּה גָדוֹל בְּיוֹם הִגָּמֵל אֶת־יִצְחָק׃", "rashi_he": "ויגמל. לְסוֹף כ\"ד חֹדֶשׁ (גיטין ע\"ה):", "rashi_en": "יצחק נגמל בסוף עשרים וארבעה חודשים.", "note": "", "points": [{"q": "מָתַי נִגְמַל יִצְחָק לְפִי רַשִׁ\"י?", "options": ["בְּסוֹף עֶשְׂרִים וְאַרְבָּעָה חֳודָשִׁים", "בְּסוֹף שְׁנֵים עָשָׂר חֳודָשִׁים", "בְּסוֹף שָׁלוֹשׁ שָׁנִים"], "kasha": "הפסוק אינו מפרט באיזה גיל נגמל יצחק.", "answer": "יצחק נגמל בסוף עשרים וארבעה חודשים.", "kp": ["לסוף כ\"ד חדש"]}]}, {"id": "21:8.2", "ch": 21, "v": 8, "n": 2, "dh": "משתה גדול", "pasuk_html": "וַיִּגְדַּ֥ל הַיֶּ֖לֶד וַיִּגָּמַ֑ל וַיַּ֤עַשׂ אַבְרָהָם֙ <mark>מִשְׁתֶּ֣ה גָד֔וֹל</mark> בְּי֖וֹם הִגָּמֵ֥ל אֶת־יִצְחָֽק׃", "pasuk_en": "וַיִּגְדַּל הַיֶּלֶד וַיִּגָּמַל וַיַּעַשׂ אַבְרָהָם מִשְׁתֶּה גָדוֹל בְּיוֹם הִגָּמֵל אֶת־יִצְחָק׃", "rashi_he": "משתה גדול. שֶׁהָיוּ שָׁם גְּדוֹלֵי הַדּוֹר שֵׁם וָעֵבֶר וַאֲבִימֶלֶךְ (בראשית רבה):", "rashi_en": "המשתה נקרא \"גדול\" כי השתתפו בו גדולי הדור: שם, עבר ואבימלך.", "note": "", "points": [{"q": "מַדּוּעַ נִקְרָא הַמִּשְׁתֶּה \"מִשְׁתֶּה גָדוֹל\"?", "options": ["הִשְׁתַּתְּפוּ בוֹ גְּדוֹלֵי הַדּוֹר: שֵׁם, עֵבֶר וַאֲבִימֶלֶךְ", "הָיוּ בוֹ מַאֲכָלִים רַבִּים וִיקָרִים בִּמְיֻוחָד", "הוּזְמְנוּ אֵלָיו כָּל יוֹשְׁבֵי אֶרֶץ כְּנַעַן"], "kasha": "לא ברור במה היה המשתה גדול יותר ממשתה רגיל.", "answer": "גדולי הדור היו שם: שם, עבר ואבימלך.", "kp": ["שהיו שם גדולי הדור", "שם ועבר ואבימלך"]}]}, {"id": "21:9.1", "ch": 21, "v": 9, "n": 1, "dh": "מצחק", "pasuk_html": "וַתֵּ֨רֶא שָׂרָ֜ה אֶֽת־בֶּן־הָגָ֧ר הַמִּצְרִ֛ית אֲשֶׁר־יָלְדָ֥ה לְאַבְרָהָ֖ם <mark>מְצַחֵֽק׃</mark>", "pasuk_en": "וַתֵּרֶא שָׂרָה אֶת־בֶּן־הָגָר הַמִּצְרִית אֲשֶׁר־יָלְדָה לְאַבְרָהָם מְצַחֵק׃", "rashi_he": "מצחק. לְשׁוֹן עֲ\"זָ, כְּמוֹ שֶׁנֶּאֱמַר וַיָּקֻמוּ לְצַחֵק (שמות ל\"ב), דָּ\"אַ לְשׁוֹן גִּלּוּי עֲרָיוֹת, כְּמָה דְּתֵימָא לְצַחֶק בִּי (בראשית ל\"ט), דָּ\"אַ לְשׁוֹן רְצִיחָה, כְּמוֹ יָקוּמוּ נָא הַנְּעָרִים וִישַׂחֲקוּ לְפָנֵינוּ וְגוֹ' (שמואל ב ב'), שֶׁהָיָה מֵרִיב עִם יִצְחָק עַל הַיְרֻשָּׁה וְאוֹמֵר אֲנִי בְּכוֹר וְנוֹטֵל פִּי שְׁנַיִם, וְיוֹצְאִים בַּשָּׂדֶה וְנוֹטֵל קַשְׁתּוֹ וְיוֹרֶה בוֹ חִצִּים, כְּמָה דְּתֵימָא כְּמִתְלַהְלֵהַּ הַיֹּרֶה זִקִּים וְגוֹ' וְאָמַר הֲלֹא מְשַׂחֵק אָנִי (משלי כ\"ו):", "rashi_en": "\"מצחק\" מתפרש כעבודה זרה, כגילוי עריות או כרציחה. לפי הפירוש האחרון, ישמעאל רב עם יצחק על הירושה וטען שהוא הבכור, ובשדה ירה בו חצים.", "note": "", "points": [{"q": "בְּאֵילוּ מַעֲשִׂים חֲמוּרִים מִתְפָּרֶשֶׁת הַמִּילָּה \"מְצַחֵק\" לְפִי רַשִׁ\"י?", "options": ["עֲבוֹדָה זָרָה, גִּילּוּי עֲרָיוֹת וּרְצִיחָה", "לֵיצָנוּת וְלַעַג עַל שָׂרָה וְעַל יִצְחָק", "מִשְׂחַק יְלָדִים תָּמִים בַּשָּׂדֶה"], "kasha": "אין זה סביר ששרה תדרוש לגרש את ישמעאל רק משום שצחק.", "answer": "\"מצחק\" הוא לשון עבודה זרה, כמו \"ויקמו לצחק\", או לשון גילוי עריות, כמו \"לצחק בי\", או לשון רציחה.", "kp": ["לשון ע\"ז", "לשון גלוי עריות", "לשון רציחה"]}, {"q": "לְפִי הַפֵּירוּשׁ שֶׁל רְצִיחָה, מַה עָשָׂה יִשְׁמָעֵאל לְיִצְחָק?", "options": ["רָב עִמּוֹ עַל הַיְרוּשָׁה ֽם׃", "pasuk_en": "וַיִּכְלוּ הַמַּיִם מִן־הַחֵמֶת וַתַּשְׁלֵךְ אֶת־הַיֶּלֶד תַּחַת אַחַד הַשִּׂיחִם׃", "rashi_he": "ויכלו המים. לְפִי שֶׁדֶּרֶךְ חוֹלִים לִשְׁתּוֹת הַרְבֵּה:", "rashi_en": "המים נגמרו מהר כי ישמעאל היה חולה, וחולים נוהגים לשתות הרבה.", "note": "", "points": [{"q": "מַדּוּעַ לְפִי רַשִׁ\"י נֶאֱמַר \"וַיִּכְלוּ הַמַּיִם\" בִּמְהִירוּת כָּזֹאת?", "options": ["כִּי דַּרְכָּם שֶׁל חוֹלִים לִשְׁתּוֹת הַרְבֵּה", "כִּי הַחֵמֶת הָייְתָה קְטַנָּה מְאֹוד מִלְּכַתְּחִילָּה", "כִּי הַמַּיִם נִשְׁפְּכוּ כְּשֶׁהָגָר תָּעֲתָה בַּדֶּרֶךְ"], "kasha": "אברהם נתן להם מים לדרך, ומדוע נגמרו המים כה מהר?", "answer": "ישמעאל היה חולה, ודרכם של חולים לשתות הרבה, ולכן המים נגמרו.", "kp": ["שדרך חולים לשתות הרבה"]}]}, {"id": "21:16.1", "ch": 21, "v": 16, "n": 1, "dh": "מנגד", "pasuk_html": "וַתֵּלֶךְ֩ וַתֵּ֨שֶׁב לָ֜הּ <mark>מִנֶּ֗גֶד</mark> הַרְחֵק֙ כִּמְטַחֲוֵ֣י קֶ֔שֶׁת כִּ֣י אָֽמְרָ֔ה אַל־אֶרְאֶ֖ה בְּמ֣וֹת הַיָּ֑לֶד וַתֵּ֣שֶׁב מִנֶּ֔גֶד וַתִּשָּׂ֥א אֶת־קֹלָ֖הּ וַתֵּֽבְךְּ׃", "pasuk_en": "וַתֵּלֶךְ וַתֵּשֶׁב לָהּ מִנֶּגֶד הַרְחֵק כִּמְטַחֲוֵי קֶשֶׁת כִּי אָמְרָה אַל־אֶרְאֶה בְּמוֹת הַיָּלֶד וַתֵּשֶׁב מִנֶּגֶד וַתִּשָּׂא אֶת־קֹלָהּ וַתֵּבְךְּ׃", "rashi_he": "מנגד. מֵרָחוֹק:", "rashi_en": "\"מנגד\" פירושו מרחוק.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילָּה \"מִנֶּגֶד\" בַּפָּסוּק?", "options": ["מֵרָחוֹק", "מַמָּשׁ מוּל פָּנָיו שֶׁל הַיֶּלֶד", "בְּצַד הַשֵּׁנִי שֶׁל הַשִּׂיחַ"], "kasha": "המילה \"מנגד\" יכולה להתפרש כ\"מול\", וצריך לדעת מה משמעותה כאן.", "answer": "\"מנגד\" כאן פירושו מרחוק.", "kp": ["מנגד. מרחוק"]}]}, {"id": "21:16.2", "ch": 21, "v": 16, "n": 2, "dh": "כמטחוי קשת", "pasuk_html": "וַתֵּלֶךְ֩ וַתֵּ֨שֶׁב לָ֜הּ מִנֶּ֗גֶד הַרְחֵק֙ <mark>כִּמְטַחֲוֵ֣י קֶ֔שֶׁת</mark> כִּ֣י אָֽמְרָ֔ה אַל־אֶרְאֶ֖ה בְּמ֣וֹת הַיָּ֑לֶד וַתֵּ֣שֶׁב מִנֶּ֔גֶד וַתִּשָּׂ֥א אֶת־קֹלָ֖הּ וַתֵּֽבְךְּ׃", "pasuk_en": "וַתֵּלֶךְ וַתֵּשֶׁב לָהּ מִנֶּגֶד הַרְחֵק כִּמְטַחֲוֵי קֶשֶׁת כִּי אָמְרָה אַל־אֶרְאֶה בְּמוֹת הַיָּלֶד וַתֵּשֶׁב מִנֶּגֶד וַתִּשָּׂא אֶת־קֹלָהּ וַתֵּבְךְּ׃", "rashi_he": "כמטחוי קשת. כִּשְׁתֵּי טִיחוֹת (בראשית רבה), וְהוּא לְשׁוֹן יְרִיַּת חֵץ, בִּלְשׁוֹן מִשְׁנָה שֶׁהֵטִיחַ בְאִשְׁתּוֹ, עַל שֵׁם שֶׁהַזֶּרַע יוֹרֶה כַּחֵץ; וְאִם תֹּאמַר הָיָה לוֹ לִכְתֹּב כִּמְטַחֵי קֶשֶׁת, מִשְׁפַּט הַוָּי\"ו לִכָּנֵס לְכָאן, כְּמוֹ בְּחַגְוֵי הַסֶּלַע (שיר השירים ב'), מִגִּזְרַת וְהָיְתָה אַדְמַת יְהוּדָה לְמִצְרַיִם לְחָגָּא (ישעיהו י\"ט), וּמִגִּזְרַת יָחוֹגּוּ וְיָנוּעוּ כַּשִּׁכּוֹר (תהילים ק\"ז), וְכֵן קַצְוֵי אֶרֶץ (תהילים ס\"ה), מִגִּזְרַת קָצֶה:", "rashi_en": "\"כמטחוי קשת\" הוא מרחק של שני מטחווי חץ, והמילה באה מלשון ירייה. רש\"י מסביר גם שהוי\"ו שבמילה נכונה לפי הדקדוק, כמו במילים \"חגוי\" ו\"קצוי\".", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"כִּמְטַחֲוֵי קֶשֶׁת\" לְפִי רַשִׁ\"י?", "options": ["מֶרְחָק שֶׁל שְׁתֵּי יְרִיּוֹת חֵץ מִקֶּשֶׁת", "מֶרְחָק שֶׁאֶפְשָׁר לִשְׁמֹועַ בּוֹ בְּכִי", "מֶרְחָק שֶׁל כַּמָּה פַּרְסָאוֹת מִן הַיֶּלֶד"], "kasha": "המילה \"כמטחוי\" אינה מוכרת, וצריך להבין את משמעותה ואת המרחק שהיא מתארת.", "answer": "זהו מרחק של שני מטחווי חץ, והמילה היא מלשון ירי חץ, כמו \"שהטיח\" בלשון המשנה.", "kp": ["כשתי טיחות", "לשון ירית חץ"]}, {"q": "מַדּוּעַ כָּתוּב \"כִּמְטַחֲוֵי\" עִם וָי\"ו וְלֹא \"כִּמְטַחֵי\"?", "options": ["כָּךְ דֶּרֶךְ הַלָּשׁוֹן לְהַכְנִיס וָי\"וֹ, כְּמוֹ \"בְּחַגְוֵי הַסֶּלַע\"", "הַוָּי\"ו מוֹסִיפָה וּמְרַמֶּזֶת עַל מֶרְחָק כָּפוּל", "זוֹ טָעוּת סוֹפֵר שֶׁנִּשְׁתַּמְּרָה בַּתּוֹרָה"], "kasha": "לכאורה היה צריך לכתוב \"כמטחי\" בלי וי\"ו.", "answer": "כך הוא משפט הלשון להכניס כאן וי\"ו, כמו \"בחגוי הסלע\" מן \"חגא\" ו\"קצוי ארץ\" מן \"קצה\".", "kp": ["משפט הוי\"ו לכנס לכאן", "כמו בחגוי הסלע"]}]}, {"id": "21:16.3", "ch": 21, "v": 16, "n": 3, "dh": "ותשב מנגד", "pasuk_html": "וַתֵּלֶךְ֩ וַתֵּ֨שֶׁב לָ֜הּ מִנֶּ֗גֶד הַרְחֵק֙ כִּמְטַחֲוֵ֣י קֶ֔שֶׁת כִּ֣י אָֽמְרָ֔ה אַל־אֶרְאֶ֖ה בְּמ֣וֹת הַיָּ֑לֶד <mark>וַתֵּ֣שֶׁב מִנֶּ֔גֶד</mark> וַתִּשָּׂ֥א אֶת־קֹלָ֖הּ וַתֵּֽבְךְּ׃", "pasuk_en": "וַתֵּלֶךְ וַתֵּשֶׁב לָהּ מִנֶּגֶד הַרְחֵק כִּמְטַחֲוֵי קֶשֶׁת כִּי אָמְרָה אַל־אֶרְאֶה בְּמוֹת הַיָּלֶד וַתֵּשֶׁב מִנֶּגֶד וַתִּשָּׂא אֶת־קֹלָהּ וַתֵּבְךְּ׃", "rashi_he": "ותשב מנגד. כֵּיוָן שֶׁקָּרַב לָמוּת הוֹסִיפָה לְהִתְרַחֵק:", "rashi_en": "הפסוק חוזר ואומר שהגר ישבה מנגד, כי כשהילד התקרב למות היא הוסיפה להתרחק ממנו.", "note": "", "points": [{"q": "מַדּוּעַ חוֹזֵר הַפָּסוּק וְאוֹמֵר \"וַתֵּשֶׁב מִנֶּגֶד\" פַּעַם שְׁנִיָּיה?", "options": ["כִּי כְּשֶׁקָּרַב הַיֶּלֶד לָמוּת הִיא הִתְרַחֲקָה עוֹד יוֹתֵר", "כִּי הִיא חָזְרָה וְהִתְקָרְבָה לַיֶּלֶד מֵחָדָשׁ", "כְּדֵי לְהַדְגִּישׁ שֶׁיָּשְׁבָה בְּמָקוֹם אֶחָד וְלֹא זָזָה"], "kasha": "כבר נאמר בתחילת הפסוק \"ותשב לה מנגד\", ולמה נכתב הדבר שוב?", "answer": "כיוון שהילד התקרב למות, היא הוסיפה להתרחק ממנו.", "kp": ["כיון שקרב למות הוסיפה להתרחק"]}]}, {"id": "21:17.1", "ch": 21, "v": 17, "n": 1, "dh": "את קול הנער", "pasuk_html": "וַיִּשְׁמַ֣ע אֱלֹהִים֮ <mark>אֶת־ק֣וֹל הַנַּעַר֒</mark> וַיִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים ׀ אֶל־הָגָר֙ מִן־הַשָּׁמַ֔יִם וַיֹּ֥אמֶר לָ֖הּ מַה־לָּ֣ךְ הָגָ֑ר אַל־תִּ֣ירְאִ֔י כִּֽי־שָׁמַ֧ע אֱלֹהִ֛ים אֶל־ק֥וֹל הַנַּ֖עַר בַּאֲשֶׁ֥ר הוּא־שָֽׁם׃", "pasuk_en": "וַיִּשְׁמַע אֱלֹהִים אֶת־קוֹל הַנַּעַר וַיִּקְרָא מַלְאַךְ אֱלֹהִים אֶל־הָגָר מִן־הַשָּׁמַיִם וַיֹּאמֶר לָהּ מַה־לָּךְ הָגָר אַל־תִּירְאִי כִּי־שָׁמַע אֱלֹהִים אֶל־קוֹל הַנַּעַר בַּאֲשֶׁר הוּא־שָׁם׃", "rashi_he": "את קול הנער. מִכָּאן שֶׁיָּפָה תְּפִלַּת הַחוֹלֶה מִתְּפִלַּת אֲחֵרִים עָלָיו וְהִיא קוֹדֶמֶת לְהִתְקַבֵּל (בראשית רבה):", "rashi_en": "הגר היא שבכתה, ובכל זאת ה' שמע את קול הנער. מכאן שתפילת החולה עצמו יפה יותר מתפילת אחרים עליו ומתקבלת קודם.", "note": "", "points": [{"q": "מַה לוֹמֵד רַשִׁ\"י מִכָּךְ שֶׁה' שָׁמַע \"אֶתְקוֹל הַנַּעַר\" וְלֹא אֶת קוֹל הָגָר?", "options": ["שֶׁתְּפִילַּת הַחוֹלֶה יָפָה מִתְּפִילַּת אֲחֵרִים עָלָיו", "שֶׁה' אֵינוֹ שׁוֹמֵעַ תְּפִילַּת אִישָּׁה מִצְרִיָּיה", "שֶׁהַנַּעַר בָּכָה בְּקוֹל רָם יוֹתֵר מֵאִמּוֹ"], "kasha": "בפסוק הקודם נאמר שהגר בכתה, ומדוע כאן נאמר שה' שמע דווקא את קול הנער?", "answer": "מכאן שתפילת החולה יפה מתפילת אחרים עליו, והיא מתקבלת קודם.", "kp": ["שיפה תפלת החולה מתפלת אחרים עליו", "והיא קודמת להתקבל"]}]}, {"id": "21:17.2", "ch": 21, "v": 17, "n": 2, "dh": "באשר הוא שם", "pasuk_html": "וַיִּשְׁמַ֣ע אֱלֹהִים֮ אֶת־ק֣וֹל הַנַּעַר֒ וַיִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים ׀ אֶל־הָגָר֙ מִן־הַשָּׁמַ֔יִם וַיֹּ֥אמֶר לָ֖הּ מַה־לָּ֣ךְ הָגָ֑ר אַל־תִּ֣ירְאִ֔י כִּֽי־שָׁמַ֧ע אֱלֹהִ֛ים אֶל־ק֥וֹל הַנַּ֖עַר <mark>בַּאֲשֶׁ֥ר הוּא־שָֽׁם׃</mark>", "pasuk_en": "וַיִּשְׁמַע אֱלֹהִים אֶת־קוֹל הַנַּעַר וַיִּקְרָא מַלְאַךְ אֱלֹהִים אֶל־הָגָר מִן־הַשָּׁמַיִם וַיֹּאמֶר לָהּ מַה־לָּךְ הָגָר אַל־תִּירְאִי כִּי־שָׁמַע אֱלֹהִים אֶל־קוֹל הַנַּעַר בַּאֲשֶׁר הוּא־שָׁם׃", "rashi_he": "באשר הוא שם. לְפִי מַעֲשִׂים שֶׁהוּא עוֹשֶׂה עַכְשָׁו הוּא נִדּוֹן, וְלֹא לְפִי מַה שֶּׁהוּא עָתִיד לַעֲשׂוֹת (ראש השנה ט\"ז), לְפִי שֶׁהָיוּ מַלְאֲכֵי הַשָּׁרֵת מְקַטְרְגִים וְאוֹמְרִים רִבּוֹנו שֶׁל עוֹלָם, מִי שֶׁעָתִיד זַרְעוֹ לְהָמִית בָּנֶיךָ בַּצָּמָא אַתָּה מַעֲלֶה לוֹ בְּאֵר, וְהוּא מְשִׁיבָם עַכְשָׁו מַה הוּא, צַדִּיק אוֹ רָשָׁע? אָמְרוּ לוֹ צַדִּיק, אָמַר לָהֶם לְפִי מַעֲשָׂיו שֶׁל עַכְשָׁו אֲנִי דָנוֹ, וְזֶהוּ בַּאֲשֶׁר הוּא שָׁם. וְהֵיכָן הֵמִית אֶת יִשְׂרָאֵל בַּצָּמָא? כְּשֶׁהֶגְלָם נְבוּכַדְנֶצַּר, שֶׁנֶּאֱמַר מַשָּׂא בַּעְרָב וְגוֹ' לִקְרַאת צָמֵא הֵתָיוּ מָיִם וְגוֹ' (ישעיהו כ\"א), כְּשֶׁהָיוּ מוֹלִיכִין אוֹתָם אֵצֶל עַרְבִיִּים, הָיוּ יִשְׂרָאֵל אוֹמְרִים לְשׁוֹבֵיהֶם בְּבַקָּשָׁה מִכֶּם הוֹלִיכוּנוּ אֵצֶל בְּנֵי דוֹדֵנוּ יִשְׁמָעֵאל וִירַחֲמוּ עָלֵינוּ, שֶׁנֶּאֱמַר אֹרְחוֹת דְּדָנִים (שם) – אַל תִּקְרֵי דְּדָנִים אֶלָּא דּוֹדִים – וְאֵלּוּ יוֹצְאִים לִקְרָאתָם וּמְבִיאִין לָהֶם בָּשָׂר וְדָג מָלוּחַ וְנוֹדוֹת נְפוּחִים, כִּסְבוּרִים יִשְׂרָאֵל שֶׁהֵם מְלֵאִים מַיִם, וּכְשֶׁמַּכְנִיסוֹ לְתוֹךְ פִּיו וּפוֹתְחוֹ, הָרוּחַ נִכְנֶסֶת בְּגוּפוֹ וּמֵת:", "rashi_en": "ישמעאל נשפט לפי מעשיו באותה שעה ולא לפי מה שזרעו יעשה בעתיד, אף שהמלאכים קטרגו שצאצאיו ימיתו את ישראל בצמא. רש\"י מספר שבגלות נבוכדנצר נתנו הישמעאלים לישראל אוכל מלוח ונודות מלאים אוויר, והם מתו.", "note": "", "points": [{"q": "מָה מַשְׁמָעוּת הַמִּילִּים \"בַּאֲשֶׁר הוּא\" שָׁם לְפִי רַשִׁ\"י?", "options": ["שֶׁהוּא נִדּוֹן לְפִי מַעֲשָׂיו עַכְשָׁיו וְלֹא לְפִי הֶעָתִיד", "שֶׁהַתְּפִילָּה הִתְקַבְּלָה בִּזְכוּת הַמָּקוֹם הַקָּדוֹשׁ", "שֶׁה' שָׁמַע אוֹתוֹ אַף שֶׁהָיָה רָחוֹק מֵאִמּוֹ"], "kasha": "המילים \"באשר הואשם\" נראות מיותרות, שהרי ידוע היכן היה הנער.", "answer": "הוא נדון לפי מעשיו של עכשיו ולא לפי מה שזרעו עתיד לעשות, ובאותה שעה היה צדיק.", "kp": ["לפי מעשים שהוא עושה עכשו הוא נדון", "ולא לפי מה שהוא עתיד לעשות"]}, {"q": "כֵּיצַד הֵמִיתוּ בְּנֵי יִשְׁמָעֵאל אֶת יִשְׂרָאֵל בַּצָּמָא, לְפִי רַשִׁ\"י?", "options": ["נָתְנוּ לָהֶם מַאֲכָל מָלוּחַ וְנוֹדוֹת מְלֵאִים אֲוִויר", "סָתְמוּ אֶת הַבְּאֵרוֹת שֶׁבַּדֶּרֶךְ לְבָבֶל", "מָכְרוּ לָהֶם מַיִם מוּרְעָלִים בִּמְחִיר רַב"], "kasha": "המלאכים טענו שזרעו של ישמעאל ימית את ישראל בצמא, וצריך להבין מתי ואיך קרה הדבר.", "answer": "כשנבוכדנצר הגלה את ישראל, הביאו להם בני ישמעאל בשר ודג מלוח ונודות נפוחים, וכשפתחו אותם נכנס הרוח בגופם ומתו.", "kp": ["כשהגלם נבוכדנצר", "בשר ודג מלוח ונודות נפוחים"]}]}, {"id": "21:20.1", "ch": 21, "v": 20, "n": 1, "dh": "רבה קשת", "pasuk_html": "וַיְהִ֧י אֱלֹהִ֛ים אֶת־הַנַּ֖עַר וַיִּגְדָּ֑ל וַיֵּ֙שֶׁב֙ בַּמִּדְבָּ֔ר וַיְהִ֖י <mark>רֹבֶ֥ה קַשָּֽׁת׃</mark>", "pasuk_en": "וַיְהִי אֱלֹהִים אֶת־הַנַּעַר וַיִּגְדָּל וַיֵּשֶׁב בַּמִּדְבָּר וַיְהִי רֹבֶה קַשָּׁת׃", "rashi_he": "רבה קשת. יוֹרֶה חִצִּים בְּקֶשֶׁת:", "rashi_en": "\"רבה קשת\" פירושו אדם שיורה חצים בקשת.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"רֹבֶה קַשָּׁת\" לְפִי רַשִׁ\"י?", "options": ["אָדָם שֶׁיּוֹרֶה חִצִּים בַּקֶּשֶׁת", "אָדָם שֶׁיֵּשׁ לוֹ קְשָׁתוֹת רַבּוֹת", "אָדָם שֶׁגָּדַל וְהִתְרַבָּה בַּמִּדְבָּר"], "kasha": "המילה \"רבה\" יכולה להתפרש מלשון ריבוי או גדילה, וצריך להבין את משמעותה כאן.", "answer": "\"רבה\" הוא מלשון ירייה, כלומר יורה חצים בקשת.", "kp": ["יורה חצים בקשת"]}]}, {"id": "21:20.2", "ch": 21, "v": 20, "n": 2, "dh": "קשת", "pasuk_html": "וַיְהִ֧י אֱלֹהִ֛ים אֶת־הַנַּ֖עַר וַיִּגְדָּ֑ל וַיֵּ֙שֶׁב֙ בַּמִּדְבָּ֔ר וַיְהִ֖י רֹבֶ֥ה <mark>קַשָּֽׁת׃</mark>", "pasuk_en": "וַיְהִי אֱלֹהִים אֶת־הַנַּעַר וַיִּגְדָּל וַיֵּשֶׁב בַּמִּדְבָּר וַיְהִי רֹבֶה קַשָּׁת׃", "rashi_he": "קשת. עַל שֵׁם הָאֻמָּנוּת, כְּמוֹ חַמָּר, גַּמָּל, צַיָּד, לְפִיכָך הַשִּׁי\"ן מֻדְגֶּשֶׁת. הָיָה יוֹשֵׁב בַּמִּדְבָּר וּמְלַסְטֵם אֶת הָעוֹבְרִים, הוּא שֶׁנֶּאֱמַר יָדוֹ בַכֹּל וְגוֹמֵר:", "rashi_en": "\"קשת\" הוא שם של בעל מקצוע, כמו חמר וגמל, ולכן השי\"ן דגושה. ישמעאל ישב במדבר ושדד את העוברים בדרך, כמו שנאמר \"ידו בכל\".", "note": "", "points": [{"q": "מַדּוּעַ הַשִּׁי\"ן בַּמִּילָּה \"קֶשֶׁת\" דְּגוּשָׁה?", "options": ["כִּי זֶה שֵׁם שֶׁל בַּעַל מִקְצוֹעַ, כְּמוֹ חַמָּר וְגַמָּל", "כִּי הַמִּילָּה מְתָאֶרֶת אֶת כְּלֵי הַנֶּשֶׁק עַצְמוֹ", "כְּדֵי לְהַבְדִּיל בֵּינָהּ לְבֵין הַמִּילָּה קֶשֶׁת בֶּעָנָן"], "kasha": "המילה \"קשת\" כאן מתארת אדם ולא כלי, וצריך להבין את צורתה.", "answer": "זהו שם על שם המקצוע, כמו חמר, גמל וצייד, ולכן השי\"ן דגושה.", "kp": ["על שם האמנות", "לפיכך השי\"ן מדגשת"]}, {"q": "בַּמֶּה עָסַק יִשְׁמָעֵאל בַּמִּדְבָּר כְּ\"קַשָּׁת\"?", "options": ["שָׁדַד אֶת הָעוֹבְרִים בַּדֶּרֶךְ", "צָד חַיּוֹת לְפַרְנָסַת מִשְׁפַּחְתּוֹ", "שָׁמַר עַל הַשַּׁייָּרוֹת מִפְּנֵי לִיסְטִים"], "kasha": "מדוע מספרת התורה שישמעאל היה קשת במדבר?", "answer": "הוא ישב במדבר ושדד את העוברים, וזהו שנאמר \"ידו בכל\".", "kp": ["ומלסטם את העוברים", "ידו בכל"]}]}, {"id": "21:21.1", "ch": 21, "v": 21, "n": 1, "dh": "מארץ מצרים", "pasuk_html": "וַיֵּ֖שֶׁב בְּמִדְבַּ֣ר פָּארָ֑ן וַתִּֽקַּֽח־ל֥וֹ אִמּ֛וֹ אִשָּׁ֖ה <mark>מֵאֶ֥רֶץ מִצְרָֽיִם׃</mark> (פ)", "pasuk_en": "וַיֵּשֶׁב בְּמִדְבַּר פָּארָן וַתִּקַּח־לוֹ אִמּוֹ אִשָּׁה מֵאֶרֶץ מִצְרָיִם׃", "rashi_he": "מארץ מצרים. מִמְּקוֹם גִּדּוּלֶיהָ, שֶׁנֶּאֱמַר וְלָהּ שִׁפְחָה מִצְרִית וְגוֹ' (בראשית ט״ז:א׳), הַיְנוּ דְּאָמְרִי אִינָשֵׁי זְרֹק חוּטְרָא לַאֲוִירָא, אֲעִיקְּרֵיהּ קָאֵי:", "rashi_en": "הגר לקחה לבנה אישה ממצרים, המקום שבו גדלה, כמו שאומר הפתגם: זרוק מקל לאוויר והוא יחזור לשורשו.", "note": "", "points": [{"q": "מַדּוּעַ לָקְחָה הָגָר לִבְנָהּ אִישָּׁה דַּווְקָא \"מֵאֶרֶץ מִצְרָיִם\"?", "options": ["כִּי מִשָּׁם בָּאָה, וְהָאָדָם חוֹזֵר לְשׁוֹרְשׁוֹ", "כִּי בְּאֶרֶץ כְּנַעַן לֹא רָצוּ לְהִשְׁתַּדֵּךְ עִמּוֹ", "כִּי פַרְעֹה הִבְטִיחַ לָהּ מַתָּנוֹת רַבּוֹת"], "kasha": "מדוע מציינת התורה שהאישה נלקחה דווקא ממצרים?", "answer": "מצרים הייתה מקום גידולה של הגר, כמו שנאמר \"שפחה מצרית\", וכפתגם שמקל שנזרק לאוויר חוזר לשורשו.", "kp": ["ממקום גדוליה", "אעיקריה קאי"]}]}, {"id": "21:22.1", "ch": 21, "v": 22, "n": 1, "dh": "אלהים עמך", "pasuk_html": "וַֽיְהִי֙ בָּעֵ֣ת הַהִ֔וא וַיֹּ֣אמֶר אֲבִימֶ֗לֶךְ וּפִיכֹל֙ שַׂר־צְבָא֔וֹ אֶל־אַבְרָהָ֖ם לֵאמֹ֑ר <mark>אֱלֹהִ֣ים עִמְּךָ֔</mark> בְּכֹ֥ל אֲשֶׁר־אַתָּ֖ה עֹשֶֽׂה׃", "pasuk_en": "וַיְהִי בָּעֵת הַהִוא וַיֹּאמֶר אֲבִימֶלֶךְ וּפִיכֹל שַׂר־צְבָאוֹ אֶל־אַבְרָהָם לֵאמֹר אֱלֹהִים עִמְּךָ בְּכֹל אֲשֶׁר־אַתָּה עֹשֶׂה׃", "rashi_he": "אלהים עמך. לְפִי שֶׁרָאוּ שֶׁיָּצָא מִשְּׁכוּנַת סְדוֹם לְשָׁלוֹם, וְעִם הַמְּלָכִים נִלְחַם וְנָפְלוּ בְיָדוֹ, וְנִפְקְדָה אִשְׁתּוֹ לִזְקוּנָיו:", "rashi_en": "אבימלך ופיכל אמרו לאברהם שאלוהים עמו, כי ראו שיצא בשלום מסדום, ניצח את המלכים, ואשתו ילדה לעת זקנתו.", "note": "", "points": [{"q": "מַה רָאוּ אֲבִימֶלֶךְ וּפִיכֹל שֶׁגָּרַם לָהֶם לוֹמַר \"אֱלֹהִים עִמְּךָ\"?", "options": ["שֶׁיָּצָא בְּשָׁלוֹם מִסְּדוֹם, נִיצַּח מְלָכִים וְנוֹלַד לוֹ בֵּן", "שֶׁאַבְרָהָם הִתְפַּלֵּל עֲלֵיהֶם וְהֵם נִרְפְּאוּ", "שֶׁאַבְרָהָם הָיָה עָשִׁיר מִכָּל אַנְשֵׁי גְּרָר"], "kasha": "על סמך מה הסיקו אבימלך ופיכל שאלוהים עם אברהם בכל מעשיו?", "answer": "הם ראו שיצא בשלום משכונת סדום, נלחם במלכים וניצח, ואשתו נפקדה לעת זקנתו.", "kp": ["שיצא משכונת סדום לשלום", "ונפקדה אשתו לזקוניו"]}]}, {"id": "21:23.1", "ch": 21, "v": 23, "n": 1, "dh": "ולניני ולנכדי", "pasuk_html": "וְעַתָּ֗ה הִשָּׁ֨בְעָה לִּ֤י בֵֽאלֹהִים֙ הֵ֔נָּה אִם־תִּשְׁקֹ֣ר לִ֔י <mark>וּלְנִינִ֖י וּלְנֶכְדִּ֑י</mark> כַּחֶ֜סֶד אֲשֶׁר־עָשִׂ֤יתִי עִמְּךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔י וְעִם־הָאָ֖רֶץ אֲשֶׁר־גַּ֥רְתָּה בָּֽהּ׃", "pasuk_en": "וְעַתָּה הִשָּׁבְעָה לִּי בֵאלֹהִים הֵנָּה אִם־תִּשְׁקֹר לִי וּלְנִינִי וּלְנֶכְדִּי כַּחֶסֶד אֲשֶׁר־עָשִׂיתִי עִמְּךָ תַּעֲשֶׂה עִמָּדִי וְעִם־הָאָרֶץ אֲשֶׁר־גַּרְתָּה בָּהּ׃", "rashi_he": "ולניני ולנכדי. עַד כָּאן רַחֲמֵי הָאָב עַל הַבֵּן:", "rashi_en": "אבימלך ביקש שבועה רק עד נכדו, כי עד כאן מגיעים רחמי האב על בנו.", "note": "", "points": [{"q": "מַדּוּעַ בִּיקֵּשׁ אֲבִימֶלֶךְ שְׁבוּעָה רַק \"וּלְנִינִי וּלְנֶכְדִּי\" וְלֹא לְכָל הַדּוֹרוֹת?", "options": ["כִּי עַד כָּאן מַגִּיעִים רַחֲמֵי הָאָב עַל בְּנוֹ", "כִּי חָשַׁב שֶׁאַבְרָהָם לֹא יִחְיֶה יוֹתֵר מִזֶּה", "כִּי כָּךְ הָיָה הַמִּנְהָג בִּבְרִיתוֹת שֶׁל מְלָכִים"], "kasha": "מדוע הגביל אבימלך את השבועה דווקא עד הנכד?", "answer": "עד כאן מגיעים רחמי האב על הבן, ולכן ביקש רק עד דור הנכדים.", "kp": ["עד כאן רחמי האב על הבן"]}]}, {"id": "21:23.2", "ch": 21, "v": 23, "n": 2, "dh": "כחסד אשר עשיתי עמך תעשה עמדי", "pasuk_html": "וְעַתָּ֗ה הִשָּׁ֨בְעָה לִּ֤י בֵֽאלֹהִים֙ הֵ֔נָּה אִם־תִּשְׁקֹ֣ר לִ֔י וּלְנִינִ֖י וּלְנֶכְדִּ֑י <mark>כַּחֶ֜סֶד אֲשֶׁר־עָשִׂ֤יתִי עִמְּךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔י</mark> וְעִם־הָאָ֖רֶץ אֲשֶׁר־גַּ֥רְתָּה בָּֽהּ׃", "pasuk_en": "וְעַתָּה הִשָּׁבְעָה לִּי בֵאלֹהִים הֵנָּה אִם־תִּשְׁקֹר לִי וּלְנִינִי וּלְנֶכְדִּי כַּחֶסֶד אֲשֶׁר־עָשִׂיתִי עִמְּךָ תַּעֲשֶׂה עִמָּדִי וְעִם־הָאָרֶץ אֲשֶׁר־גַּרְתָּה בָּהּ׃", "rashi_he": "כחסד אשר עשיתי עמך תעשה עמדי. שֶׁאָמַרְתִּי לְךָ הִנֵּה אַרְצִי לְפָנֶיךָ (בראשית רבה):", "rashi_en": "החסד שאבימלך עשה עם אברהם הוא שאמר לו \"הנה ארצי לפניך\".", "note": "", "points": [{"q": "לְאֵיזֶה חֶסֶד מִתְכַּווֵּן אֲבִימֶלֶךְ כְּשֶׁהוּא אוֹמֵר \"כַּחֶסֶד אֲשֶׁרעָשִׂיתִי עִמְּךָ\"?", "options": ["שֶׁאָמַר לְאַבְרָהָם \"הֵנָּה אַרְצִי לְפָנֶיךָ\"", "שֶׁהֶחֱזִיר לְאַבְרָהָם אֶת שָׂרָה אִשְׁתּוֹ", "שֶׁנָּתַן לְאַבְרָהָם צֹאן וּבָקָר רַבִּים"], "kasha": "צריך להבין איזה חסד בדיוק עשה אבימלך עם אברהם.", "answer": "החסד הוא שאמר לאברהם \"הנה ארצי לפניך\", כלומר הרשה לו לשבת בארצו.", "kp": ["הנה ארצי לפניך"]}]}, {"id": "21:25.1", "ch": 21, "v": 25, "n": 1, "dh": "והוכח", "pasuk_html": "<mark>וְהוֹכִ֥חַ</mark> אַבְרָהָ֖ם אֶת־אֲבִימֶ֑לֶךְ עַל־אֹדוֹת֙ בְּאֵ֣ר הַמַּ֔יִם אֲשֶׁ֥ר גָּזְל֖וּ עַבְדֵ֥י אֲבִימֶֽלֶךְ׃", "pasuk_en": "וְהוֹכִחַ אַבְרָהָם אֶת־אֲבִימֶלֶךְ עַל־אֹדוֹת בְּאֵר הַמַּיִם אֲשֶׁר גָּזְלוּ עַבְדֵי אֲבִימֶלֶךְ׃", "rashi_he": "והוכח. נִתְוַכֵּחַ עִמּוֹ עַל כָּךְ:", "rashi_en": "\"והוכח\" כאן פירושו שאברהם התווכח עם אבימלך על הבאר.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"וְהוֹכִחַ\" לְפִי רַשִׁ\"י?", "options": ["אַבְרָהָם הִתְווַכֵּחַ עִם אֲבִימֶלֶךְ עַל הַבְּאֵר", "אַבְרָהָם הוֹכִיחַ אֶת אֲבִימֶלֶךְ בְּעֵדִים", "אַבְרָהָם הֶעֱנִישׁ אֶת עַבְדֵי אֲבִימֶלֶךְ"], "kasha": "המילה \"והוכח\" יכולה להתפרש כתוכחה, וצריך להבין מה עשה אברהם.", "answer": "פירושו שאברהם התווכח עם אבימלך על עניין הבאר.", "kp": ["נתוכח עמו על כך"]}]}, {"id": "21:30.1", "ch": 21, "v": 30, "n": 1, "dh": "בעבור תהיה לי", "pasuk_html": "וַיֹּ֕אמֶר כִּ֚י אֶת־שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִיָּדִ֑י <mark>בַּעֲבוּר֙ תִּֽהְיֶה־לִּ֣י</mark> לְעֵדָ֔ה כִּ֥י חָפַ֖רְתִּי אֶת־הַבְּאֵ֥ר הַזֹּֽאת׃", "pasuk_en": "וַיֹּאמֶר כִּי אֶת־שֶׁבַע כְּבָשֹׂת תִּקַּח מִיָּדִי בַּעֲבוּר תִּהְיֶה־לִּי לְעֵדָה כִּי חָפַרְתִּי אֶת־הַבְּאֵר הַזֹּאת׃", "rashi_he": "בעבור תהיה לי. זאת:", "rashi_en": "רש\"י משלים את חסרון הפסוק: \"בעבור תהיה לי\" פירושו שזאת, כלומר לקיחת הכבשות, תהיה לי לעדות.", "note": "", "points": [{"q": "מַה חָסֵר בַּמִּילִּים \"בַּעֲבוּר תִּהְיֶהלִּי\" לְפִי רַשִׁ\"י?", "options": ["הַמִּילָּה \"זֹאת\", כְּלוֹמַר שֶׁלְּקִיחַת הַכְּבָשׂוֹת תִּהְיֶה לְעֵדוּת", "שֵׁם הַבְּאֵר שֶׁעָלֶיהָ מְדֻובָּר", "הַמִּילָּה \"שְׁבוּעָה\", כְּלוֹמַר שֶׁהַשְּׁבוּעָה תִּהְיֶה לְעֵדוּת"], "kasha": "בפסוק לא נאמר מה הדבר שיהיה לעדה.", "answer": "רש\"י מוסיף \"זאת\": לקיחת הכבשות היא שתהיה לי לעדה.", "kp": ["בעבור תהיה לי. זאת"]}]}, {"id": "21:30.2", "ch": 21, "v": 30, "n": 2, "dh": "לעדה", "pasuk_html": "וַיֹּ֕אמֶר כִּ֚י אֶת־שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִיָּדִ֑י בַּעֲבוּר֙ תִּֽהְיֶה־לִּ֣י <mark>לְעֵדָ֔ה</mark> כִּ֥י חָפַ֖רְתִּי אֶת־הַבְּאֵ֥ר הַזֹּֽאת׃", "pasuk_en": "וַיֹּאמֶר כִּי אֶת־שֶׁבַע כְּבָשֹׂת תִּקַּח מִיָּדִי בַּעֲבוּר תִּהְיֶה־לִּי לְעֵדָה כִּי חָפַרְתִּי אֶת־הַבְּאֵר הַזֹּאת׃", "rashi_he": "לעדה. לְשׁוֹן עֵדוּת שֶׁל נְקֵבָה, כְּמוֹ וְעֵדָה הַמַּצֵּבָה (בראשית ל\"א):", "rashi_en": "\"לעדה\" היא לשון עדות בלשון נקבה, כמו \"ועדה המצבה\".", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילָּה \"לְעֵדָה\" כָּאן?", "options": ["עֵדוּת, בִּלְשׁוֹן נְקֵבָה", "קָהָל וְעֵדָה שֶׁל אֲנָשִׁים", "קִישׁוּט וְתַכְשִׁיט לְזִיכָּרוֹן"], "kasha": "המילה \"עדה\" משמשת בדרך כלל לקהל אנשים, ואינה מתאימה כאן.", "answer": "זו לשון עדות בצורת נקבה, כמו \"ועדה המצבה\".", "kp": ["לשון עדות של נקבה", "ועדה המצבה"]}]}, {"id": "21:30.3", "ch": 21, "v": 30, "n": 3, "dh": "כי חפרתי את הבאר", "pasuk_html": "וַיֹּ֕אמֶר כִּ֚י אֶת־שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִיָּדִ֑י בַּעֲבוּר֙ תִּֽהְיֶה־לִּ֣י לְעֵדָ֔ה <mark>כִּ֥י חָפַ֖רְתִּי אֶת־הַבְּאֵ֥ר</mark> הַזֹּֽאת׃", "pasuk_en": "וַיֹּאמֶר כִּי אֶת־שֶׁבַע כְּבָשֹׂת תִּקַּח מִיָּדִי בַּעֲבוּר תִּהְיֶה־לִּי לְעֵדָה כִּי חָפַרְתִּי אֶת־הַבְּאֵר הַזֹּאת׃", "rashi_he": "כי חפרתי את הבאר. מְרִיבִים הָיוּ עָלֶיהָ רוֹעֵי אֲבִימֶלֶךְ וְאוֹמְרִים אֲנַחְנוּ חֲפַרְנוּהָ, אָמְרוּ בֵּינֵיהֶם כָּל מִי שֶׁיִּתְרָאֶה עַל הַבְּאֵר וְיַעֲלוּ הַמַּיִם לִקְרָאתוֹ, שֶׁלּוֹ הִיא, וְעָלוּ לִקְרָאת אַבְרָהָם:", "rashi_en": "רועי אבימלך טענו שהם חפרו את הבאר, והסכימו שהבאר תהיה של מי שהמים יעלו לקראתו, והמים עלו לקראת אברהם.", "note": "", "points": [{"q": "כֵּיצַד הוּכַח שֶׁאַבְרָהָם הוּא שֶׁחָפַר אֶת הַבְּאֵר?", "options": ["הַמַּיִם עָלוּ לִקְרַאת אַבְרָהָם כְּשֶׁבָּא אֶל הַבְּאֵר", "עֵדִים מִגְּרָר הֵעִידוּ שֶׁרָאוּ אוֹתוֹ חוֹפֵר", "אֲבִימֶלֶךְ עַצְמוֹ הוֹדָה שֶׁאַבְרָהָם חָפַר אוֹתָהּ"], "kasha": "מדוע היה אברהם צריך להוכיח \"כי חפרתי\" את הבאר, ומה הייתה המחלוקת?", "answer": "רועי אבימלך טענו \"אנחנו חפרנוה\", וסיכמו שמי שהמים יעלו לקראתו הבאר שלו, והמים עלו לקראת אברהם.", "kp": ["אנחנו חפרנוה", "ועלו לקראת אברהם"]}]}, {"id": "21:33.1", "ch": 21, "v": 33, "n": 1, "dh": "אשל", "pasuk_html": "וַיִּטַּ֥ע <mark>אֶ֖שֶׁל</mark> בִּבְאֵ֣ר שָׁ֑בַע וַיִּ֨קְרָא־שָׁ֔ם בְּשֵׁ֥ם יְהוָ֖ה אֵ֥ל עוֹלָֽם׃", "pasuk_en": "וַיִּטַּע אֶשֶׁל בִּבְאֵר שָׁבַע וַיִּקְרָא־שָׁם בְּשֵׁם יְהוָה אֵל עוֹלָם׃", "rashi_he": "אשל. רַב וּשְׁמוּאֵל, חַד אֲמַר פַּרְדֵּס לְהָבִיא מִמֶּנוּ פֵּרוֹת לָאוֹרְחִים בַּסְּעוּדָה, וְחַד אֲמַר פֻּנְדָּק לְאַכְסַנְיָא וּבוֹ כָּל מִינֵי פֵּרוֹת. וּמָצִינוּ לְשׁוֹן נְטִיעָה בְּאֹהָלִים, שֶׁנֶּאֱמַר וְיִטַּע אָהֳלֵי אַפַּדְנוֹ (דניאל י\"א):", "rashi_en": "רב ושמואל נחלקו מהו האשל: לדעה אחת פרדס שממנו הביא פירות לאורחים, ולדעה אחרת פונדק לאירוח שיש בו כל מיני פירות. לשון \"נטיעה\" מתאימה גם לאוהלים.", "note": "", "points": [{"q": "מַהוּ הָ\"אֶשֶׁל\" שֶׁנָּטַע אַבְרָהָם לְפִי רַשִּׁ\"י?", "options": ["פַּרְדֵּס לְפֵירוֹת לָאוֹרְחִים אוֹ פוּנְדָּק לְאֵירוּחַ", "עֵץ גָּדוֹל שֶׁתַּחְתָּיו הִתְפַּלֵּל אַבְרָהָם", "מִזְבֵּחַ שֶׁבָּנָה אַבְרָהָם לַעֲבוֹדַת ה'"], "kasha": "לא ברור מהו ה\"אשל\" ולשם מה נטע אותו אברהם.", "answer": "לדעה אחת פרדס להביא ממנו פירות לאורחים בסעודה, ולדעה אחרת פונדק לאכסניה שיש בו כל מיני פירות.", "kp": ["פרדס להביא ממנו פרות לאורחים", "פנדק לאכסניא"]}, {"q": "אֵיךְ מַתְאִימָה הַמִּילָּה \"וַיִּטַּע\" לְפֵירוּשׁ שֶׁהָאֵשֶׁל הוּא פּוּנְדָּק?", "options": ["מָצִינוּ לְשׁוֹן נְטִיעָה גַּם בְּאֹוהָלִים", "בְּפוּנְדָּק הָיוּ גַּם עֵצִים נְטוּעִים", "הַמִּילָּה וַיִּטַּע כָּאן פֵּירוּשָׁהּ וַיִּקְנֶה"], "kasha": "לפי הדעה שהאשל הוא פונדק, קשה כיצד אפשר \"לנטוע\" מבנה.", "answer": "מצינו לשון נטיעה באוהלים, כמו שנאמר \"ויטע אהלי אפדנו\".", "kp": ["ומצינו לשון נטיעה באהלים", "ויטע אהלי אפדנו"]}]}, {"id": "21:33.2", "ch": 21, "v": 33, "n": 2, "dh": "ויקרא שם וגו'", "pasuk_html": "וַיִּטַּ֥ע אֶ֖שֶׁל בִּבְאֵ֣ר שָׁ֑בַע <mark>וַיִּ֨קְרָא־שָׁ֔ם</mark> בְּשֵׁ֥ם יְהוָ֖ה אֵ֥ל עוֹלָֽם׃", "pasuk_en": "וַיִּטַּע אֶשֶׁל בִּבְאֵר שָׁבַע וַיִּקְרָא־שָׁם בְּשֵׁם יְהוָה אֵל עוֹלָם׃", "rashi_he": "ויקרא שם וגו'. עַל יְדֵי אוֹתוֹ אֵשֶׁל נִקְרָא שְׁמוֹ שֶׁל הַקָּבָּ\"ה אֱלוֹהַּ לְכָל הָעוֹלָם, לְאַחַר שֶׁאוֹכְלִים וְשׁוֹתִים אוֹמֵר לָהֶם בָּרְכוּ לְמִי שֶׁאֲכַלְתֶּם מִשֶּׁלּוֹ, סְבוּרִים אַתֶּם שֶׁמִּשֶּׁלִּי אֲכַלְתֶּם? מִשֶּׁל מִי שֶׁאָמָר וְהָיָה הָעוֹלָם אֲכַלְתֶּם (סוטה י'):", "rashi_en": "בזכות האשל נקרא שם ה' בכל העולם: אחרי שהאורחים אכלו ושתו, אברהם אמר להם לברך את מי שמשלו אכלו, כי לא משלו אכלו אלא משל בורא העולם.", "note": "", "points": [{"q": "כֵּיצַד קָרָא אַבְרָהָם בְּשֵׁם ה' בְּעֶזְרַת הָאֵשֶׁל?", "options": ["אָמַר לָאוֹרְחִים לְבָרֵךְ אֶת ה' שֶׁמִּשֶּׁלּוֹ אָכְלוּ", "הִקְרִיב קׇורְבָּנוֹת בַּפַּרְדֵּס שֶׁנָּטַע", "לִימֵּד אֶת הָאוֹרְחִים תּוֹרָה לִפְנֵי הַסְּעוּדָה"], "kasha": "מה הקשר בין נטיעת האשל לבין \"ויקראשם בשם יהוה\"?", "answer": "אחרי שהאורחים אכלו ושתו, אמר להם לברך את מי שמשלו אכלו, שהרי משל בורא העולם אכלו, וכך נקרא שם ה' אלוה לכל העולם.", "kp": ["על ידי אותו אשל", "ברכו למי שאכלתם משלו"]}]}, {"id": "21:34.1", "ch": 21, "v": 34, "n": 1, "dh": "ימים רבים", "pasuk_html": "וַיָּ֧גָר אַבְרָהָ֛ם בְּאֶ֥רֶץ פְּלִשְׁתִּ֖ים <mark>יָמִ֥ים רַבִּֽים׃</mark> (פ)", "pasuk_en": "וַיָּגָר אַבְרָהָם בְּאֶרֶץ פְּלִשְׁתִּים יָמִים רַבִּים׃", "rashi_he": "ימים רבים. מְרֻבִּים עַל שֶׁל חֶבְרוֹן. בְּחֶבְרוֹן עָשָׂה כ\"ה שָׁנָה וְכָאן כ\"ו, שֶׁהֲרֵי בֶּן ע\"ה שָׁנָה הָיָה בְּצֵאתוֹ מֵחָרָן, אוֹתָהּ שָׁנָה וַיָבֹא וַיֵּשֶׁב בְּאֵלֹנֵי מַמְרֵא, שֶׁלֹּא מָצִינוּ קֹדֶם לָכֵן שֶׁנִּתְיַשֵּׁב אֶלָּא שָׁם, שֶׁבְּכָל מְקוֹמוֹתָיו הָיָה כְּאוֹרֵחַ חוֹנֶה וְנוֹסֵעַ וְהוֹלֵך, שֶׁנֶּאֱמַר וַיַּעֲבֹר אַבְרָם, וַיַּעְתֵּק מִשָּׁם, וַיְהִי רָעָב בָּאָרֶץ וַיֵּרֶד אַבְרָם מִצְרַיְמָה (בראשית י\"ב), וּבְמִצְרַיִם לֹא עָשָׂה אֶלָּא שְׁלֹשָׁה חֳדָשִׁים שֶׁהֲרֵי שְׁלָחוֹ פַרְעֹה מִיָּד, וַיֵּלֶךְ לְמַסָּעָיו עַד וַיָּבֹא וַיֵּשֶׁב בְּאֵלֹנֵי מַמְרֵא אֲשֶׁר בְּחֶבְרוֹן (שם י\"ג), שָׁם יָשַׁב עַד שֶׁנֶּהֱפְכָה סְדוֹם, מִיָּד וַיִּסַּע מִשָּׁם אַבְרָהָם מִפְּנֵי בוּשָׁה שֶׁל לוֹט וּבָא לְאֶרֶץ פְּלִשְׁתִּים, וּבֶן צ\"ט שָׁנָה הָיָה, שֶׁהֲרֵי בַשְּׁלִישִׁי לְמִילָתוֹ בָּאוּ אֶצְלוֹ הַמַּלְאָכִים, הֲרֵי כ\"ה שָׁנָה, וְכָאן כְּתִיב יָמִים רַבִּים, מְרֻבִּים עַל הָרִאשׁוֹנִים, וְלֹא בָא הַכָּתוּב לִסְתֹּם אֶלָּא לְפָרֵשׁ, וְאִם הָיוּ מְרֻבִּים עֲלֵיהֶם שְׁתֵּי שָׁנִים אוֹ יוֹתֵר הָיָה מְפָרְשָׁם, וְעַל כָּרְחֲךָ אֵינָם יְתֵרִים יוֹתֵר מִשָּׁנָה, הֲרֵי כ\"ו שָׁנָה; מִיָּד יָצָא מִשָּׁם וְחָזַר לְחֶבְרוֹן, וְאוֹתָהּ שָׁנָה קָדְמָה לִפְנֵי עֲקֵדָתוֹ שֶׁל יִצְחָק י\"ב שָׁנִים, בְּסֵדֶר עוֹלָם:", "rashi_en": "\"ימים רבים\" פירושו יותר מהשנים שגר אברהם בחברון: בחברון גר עשרים וחמש שנה, ובארץ פלשתים עשרים ושש. אילו היה ההפרש גדול יותר, הכתוב היה מפרש זאת.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַה פֵּירוּשׁ \"יָמִים רַבִּים\" בַּפָּסוּק?", "options": ["יוֹתֵר מֵהַשָּׁנִים שֶׁגָּר בְּחֶבְרוֹן, עֶשְׂרִים וָשֵׁשׁ שָׁנָה", "יָמִים רַבִּים מְאֹוד, יוֹתֵר מִמֵּאָה שָׁנָה", "מְעַט יָמִים, עַד שֶׁחָזַר לְחֶבְרוֹן"], "kasha": "הביטוי \"ימים רבים\" סתום, ואין ממנו ידיעה כמה זמן ישב אברהם בארץ פלשתים.", "answer": "הימים מרובים על אלה של חברון: בחברון ישב עשרים וחמש שנה, וכאן עשרים ושש.", "kp": ["מרבים על של חברון", "בחברון עשה כ\"ה שנה וכאן כ\"ו"]}, {"q": "מַדּוּעַ מַסִּיק רַשִׁ\"י שֶׁהַהֶפְרֵשׁ בֵּין חֶבְרוֹן לְאֶרֶץ פְּלִשְׁתִּים הוּא שָׁנָה אַחַת בִּלְבַד?", "options": ["כִּי אִילּוּ הָיָה יוֹתֵר, הַכָּתוּב הָיָה מְפָרֵשׁ זֹאת", "כִּי כָּךְ מְפֹורָשׁ בְּפָסוּק אַחֵר בַּתּוֹרָה", "כִּי אַבְרָהָם נִצְטַווָּה לַחֲזוֹר לְחֶבְרוֹן אַחֲרֵי שָׁנָה"], "kasha": "המילים \"ימים רבים\" אינן מגדירות בכמה הימים מרובים.", "answer": "הכתוב בא לפרש ולא לסתום, ואם היה ההפרש שנתיים או יותר היה מפרש זאת, ולכן בהכרח אינו יותר משנה.", "kp": ["ולא בא הכתוב לסתם אלא לפרש", "ועל כרחך אינם יתרים יותר משנה"]}]}, {"id": "22:1.1", "ch": 22, "v": 1, "n": 1, "dh": "אחר הדברים האלה", "pasuk_html": "וַיְהִ֗י <mark>אַחַר֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה</mark> וְהָ֣אֱלֹהִ֔ים נִסָּ֖ה אֶת־אַבְרָהָ֑ם וַיֹּ֣אמֶר אֵלָ֔יו אַבְרָהָ֖ם וַיֹּ֥אמֶר הִנֵּֽנִי׃", "pasuk_en": "וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה וְהָאֱלֹהִים נִסָּה אֶת־אַבְרָהָם וַיֹּאמֶר אֵלָיו אַבְרָהָם וַיֹּאמֶר הִנֵּנִי׃", "rashi_he": "אחר הדברים האלה. יֵשׁ מֵרַבּוֹתֵינוּ אוֹמְרִים (סנהדרין פ\"ט) אַחַר דְּבָרָיו שֶׁל שָׂטָן, שֶׁהָיָה מְקַטְרֵג וְאוֹמֵר מִכָּל סְעוּדָה שֶׁעָשָׂה אַבְרָהָם לֹא הִקְרִיב לְפָנֶיךָ פַּר אֶחָד אוֹ אַיִל אֶחָד; אָמַר לוֹ כְּלוּם עָשָׂה אֶלָּא בִּשְׁבִיל בְּנוֹ, אִלּוּ הָיִיתִי אוֹמֵר לוֹ זְבַח אוֹתוֹ לְפָנַי לֹא הָיָה מְעַכֵּב; וְיֵ\"אֹ אַחַר דְּבָרָיו שֶׁל יִשְׁמָעֵאל, שֶׁהָיָה מִתְפָּאֵר עַל יִצְחָק שֶׁמָּל בֶּן י\"ג שָׁנָה וְלֹא מִחָה, אָמַר לוֹ יִצְחָק בְּאֵבֶר א' אַתָּה מְיָרְאֵנִי? אִלּוּ אָמַר לִי הַקָּבָּ\"ה זְבַח עַצְמְךָ לְפָנַי, לֹא הָיִיתִי מְעַכֵּב.", "rashi_en": "רש\"י מביא שתי דעות מה הם \"הדברים\" שאחריהם בא הניסיון: יש אומרים דברי השטן שקטרג על אברהם שלא הקריב קורבן לה', ויש אומרים דברי ישמעאל שהתפאר על יצחק שנימול בגיל שלוש עשרה.", "note": "", "points": [{"q": "לְפִי הַדֵּעָה הָרִאשׁוֹנָה, אַחֲרֵי אֵילּוּ דְּבָרִים בָּא נִיסָּיוֹן הָעֲקֵידָה?", "options": ["אַחֲרֵי דִּבְרֵי הַשָּׂטָן שֶׁקִּטְרֵג עַל אַבְרָהָם", "אַחֲרֵי הַבְּרִית שֶׁכָּרַת אַבְרָהָם עִם אֲבִימֶלֶךְ", "אַחֲרֵי גֵּירוּשׁ הָגָר וְיִשְׁמָעֵאל מִן הַבַּיִת"], "kasha": "מהם \"הדברים האלה\" שאחריהם ניסה ה' את אברהם?", "answer": "אחרי דבריו של השטן שקטרג שמכל סעודותיו לא הקריב אברהם לה' אף פר או איל, וה' השיב שאילו יאמר לו לזבוח את בנו, לא יעכב.", "kp": ["אחר דבריו של שטן", "לא הקריב לפניך פר אחד או איל אחד"]}, {"q": "לְפִי הַדֵּעָה הַשְּׁנִייָּה, מַה אָמַר יִצְחָק לְיִשְׁמָעֵאל שֶׁהִתְפָּאֵר עָלָיו?", "options": ["אִילּוּ ה' יֹאמַר לִי לִזְבֹּוחַ אֶת עַצְמִי, לֹא אֲעַכֵּב", "אֲנִי נִימּוֹלְתִּי בְּגִיל שְׁמוֹנָה יָמִים כְּמִצְוַות ה'", "אָבִינוּ אוֹהֵב אוֹתִי יוֹתֵר מֵאֲשֶׁר אוֹתְךָ"], "kasha": "מהם \"הדברים האלה\" שאחריהם ניסה ה' את אברהם?", "answer": "ישמעאל התפאר שנימול בגיל שלוש עשרה ולא מחה, ויצחק השיב שאילו אמר לו ה' לזבוח את עצמו, לא היה מעכב.", "kp": ["אחר דבריו של ישמעאל", "זבח עצמך לפני, לא הייתי מעכב"]}]}, {"id": "22:1.2", "ch": 22, "v": 1, "n": 2, "dh": "הנני", "pasuk_html": "וַיְהִ֗י אַחַר֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה וְהָ֣אֱלֹהִ֔ים נִסָּ֖ה אֶת־אַבְרָהָ֑ם וַיֹּ֣אמֶר אֵלָ֔יו אַבְרָהָ֖ם וַיֹּ֥אמֶר <mark>הִנֵּֽנִי׃</mark>", "pasuk_en": "וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה וְהָאֱלֹהִים נִסָּה אֶת־אַבְרָהָם וַיֹּאמֶר אֵלָיו אַבְרָהָם וַיֹּאמֶר הִנֵּנִי׃", "rashi_he": "הנני. כָּךְ הִיא עֲנִיָּתָם שֶׁל חֲסִידִים, לְשׁוֹן עֲנָוָה הוּא וּלְשׁוֹן זִמּוּן:", "rashi_en": "\"הנני\" היא תשובתם של חסידים, והיא מבטאת ענווה ומוכנות.", "note": "", "points": [{"q": "מַה מְבַטֵּאת הַתְּשׁוּבָה \"הִנֵּנִי\" לְפִי רַשִׁ\"י?", "options": ["עֲנָווָּה וּמוּכָנוּת", "פַּחַד וְיִרְאָה מִפְּנֵי ה'", "סָפֵק וּבַקָּשָׁה לִשְׁמֹועַ עוֹד"], "kasha": "מדוע ענה אברהם דווקא \"הנני\" ולא תשובה אחרת?", "answer": "כך היא תשובתם של חסידים, והיא לשון ענווה ולשון הזמנה ומוכנות.", "kp": ["כך היא עניתם של חסידים", "לשון ענוה הוא ולשון זמון"]}]}, {"id": "22:2.1", "ch": 22, "v": 2, "n": 1, "dh": "קח נא", "pasuk_html": "וַיֹּ֡אמֶר <mark>קַח־נָ֠א</mark> אֶת־בִּנְךָ֨ אֶת־יְחִֽידְךָ֤ אֲשֶׁר־אָהַ֙בְתָּ֙ אֶת־יִצְחָ֔ק וְלֶךְ־לְךָ֔ אֶל־אֶ֖רֶץ הַמֹּרִיָּ֑ה וְהַעֲלֵ֤הוּ שָׁם֙ לְעֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽהָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "וַיֹּאמֶר קַח־נָא אֶת־בִּנְךָ אֶת־יְחִידְךָ אֲשֶׁר־אָהַבְתָּ אֶת־יִצְחָק וְלֶךְ־לְךָ אֶל־אֶרֶץ הַמֹּרִיָּה וְהַעֲלֵהוּ שָׁם לְעֹלָה עַל אַחַד הֶהָרִים אֲשֶׁר אֹמַר אֵלֶיךָ׃", "rashi_he": "קח נא. אֵין נָא אֶלָּא לְשׁוֹן בַּקָשָׁה, אָמַר לוֹ בְּבַקָּשָׁה מִמְּךָ, עֲמֹד לִי בְּזֶה הַנִּסָּיוֹן, שֶׁלֹּא יֹאמְרוּ הָרִאשׁוֹנוֹת לֹא הָיָה בָהֶן מָמָּשׁ:", "rashi_en": "המילה \"נא\" היא לשון בקשה: ה' ביקש מאברהם לעמוד בניסיון הזה, כדי שלא יאמרו שהניסיונות הקודמים לא היו ממשיים.", "note": "", "points": [{"q": "מַדּוּעַ ה' אוֹמֵר לְאַבְרָהָם \"נָא\", בִּלְשׁוֹן בַּקָּשָׁה?", "options": ["כְּדֵי שֶׁלֹּא יֹאמְרוּ שֶׁהַנִּיסְיוֹנוֹת הַקּוֹדְמִים לֹא הָיוּ מַמָּשִׁיִּים", "כִּי ה' לֹא רָצָה שֶׁאַבְרָהָם יַעֲקֹוד אֶת יִצְחָק", "כִּי אַבְרָהָם הָיָה כְּבָר זָקֵן וְחַלָּשׁ"], "kasha": "מדוע ה' מבקש מאברהם בלשון \"נא\" ולא מצווה עליו בפשטות?", "answer": "\"נא\" הוא לשון בקשה: ה' ביקש מאברהם לעמוד בניסיון הזה, כדי שלא יאמרו שבניסיונות הראשונים לא היה ממש.", "kp": ["אין נא אלא לשון בקשה", "שלא יאמרו הראשונות לא היה בהן ממש"]}]}, {"id": "22:2.2", "ch": 22, "v": 2, "n": 2, "dh": "את בנך", "pasuk_html": "וַיֹּ֡אמֶר קַח־נָ֠א <mark>אֶת־בִּנְךָ֨</mark> אֶת־יְחִֽידְךָ֤ אֲשֶׁר־אָהַ֙בְתָּ֙ אֶת־יִצְחָ֔ק וְלֶךְ־לְךָ֔ אֶל־אֶ֖רֶץ הַמֹּרִיָּ֑ה וְהַעֲלֵ֤הוּ שָׁם֙ לְעֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽהָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "וַיֹּאמֶר קַח־נָא אֶת־בִּנְךָ אֶת־יְחִידְךָ אֲשֶׁר־אָהַבְתָּ אֶת־יִצְחָק וְלֶךְ־לְךָ אֶל־אֶרֶץ הַמֹּרִיָּה וְהַעֲלֵהוּ שָׁם לְעֹלָה עַל אַחַד הֶהָרִים אֲשֶׁר אֹמַר אֵלֶיךָ׃", "rashi_he": "את בנך. אָמַר לוֹ שְׁנֵי בָנִים יֵשׁ לִי, אָמַר לוֹ אֶת יְחִידְךָ; אָמַר לוֹ זֶה יָחִיד לְאִמּוֹ וְזֶה יָחִיד לְאִמּוֹ, אָמַר לוֹ אֲשֶׁר אָהַבְתָּ; אָמַר לוֹ שְׁנֵיהֶם אֲנִי אוֹהֵב, אָמַר לוֹ אֶת יִצְחָק (סנהדרין פ\"ט). וְלָמָּה לֹא גִּלָּה לוֹ מִתְּחִלָּה? שֶׁלֹּא לְעַרְבְּבוֹ פִּתְאוֹם וְתָזוּחַ דַּעְתּוֹ עָלָיו וְתִטָּרֵף, וּכְדֵי לְחַבֵּב עָלָיו אֶת הַמִּצְוָה וְלִתֵּן לוֹ שָׂכָר עַל כָּל דִּבּוּר וְדִבּוּר:", "rashi_en": "רש\"י מתאר דו-שיח: אברהם אמר שיש לו שני בנים, וה' הוסיף פרט אחר פרט עד שאמר \"את יצחק\". ה' לא גילה מיד, כדי שלא לבלבל את אברהם פתאום, וכדי לחבב עליו את המצווה ולתת לו שכר על כל דיבור.", "note": "", "points": [{"q": "מַדּוּעַ ה' אוֹמֵר \"אֶת בִּנְךָ אֶת יְחִידְךָ אֲשֶׁר אָהַבְתָּ\" לִפְנֵי שֶׁהוּא אוֹמֵר \"אֶת יִצְחָק\"?", "options": ["כָּל תֵּיאוּר עָנָה עַל טַעֲנָה שֶׁל אַבְרָהָם", "כְּדֵי לְשַׁבֵּחַ אֶת יִצְחָק לִפְנֵי אָבִיו", "כִּי אַבְרָהָם לֹא הֵבִין אֶת הַדִּיבּוּר הָרִאשׁוֹן"], "kasha": "הפסוק מאריך בתיאורים רבים במקום לומר מיד \"את יצחק\".", "answer": "זה היה דו-שיח: אברהם אמר שיש לו שני בנים, ששניהם יחידים לאמם ושאת שניהם הוא אוהב, עד שה' אמר \"את יצחק\".", "kp": ["שני בנים יש לי", "שניהם אני אוהב"]}, {"q": "מַדּוּעַ ה' לֹא גִּילָּה לְאַבְרָהָם מִיָּד שֶׁמְּדֻובָּר בְּיִצְחָק?", "options": ["כְּדֵי לֹא לְבַלְבְּלוֹ פִּתְאוֹם וְלָתֵת לוֹ שָׂכָר עַל כָּל דִּיבּוּר", "כְּדֵי לִבְדֹּוק אִם אַבְרָהָם יִבְחַר בְּיִשְׁמָעֵאל", "כִּי ה' עֲדַייִן לֹא הֶחְלִיט בְּאֵיזֶה בֵּן לִבְחֹור"], "kasha": "מדוע לא אמר ה' מיד \"את יצחק\"?", "answer": "כדי שלא לבלבל אותו פתאום ושדעתו לא תיטרף, וכדי לחבב עליו את המצווה ולתת לו שכר על כל דיבור ודיבור.", "kp": ["שלא לערבבו פתאום", "ולתן לו שכר על כל דבור ודבור"]}]}, {"id": "22:2.3", "ch": 22, "v": 2, "n": 3, "dh": "ארץ המוריה", "pasuk_html": "וַיֹּ֡אמֶר קַח־נָ֠א אֶת־בִּנְךָ֨ אֶת־יְחִֽידְךָ֤ אֲשֶׁר־אָהַ֙בְתָּ֙ אֶת־יִצְחָ֔ק וְלֶךְ־לְךָ֔ אֶל־<mark>אֶ֖רֶץ הַמֹּרִיָּ֑ה</mark> וְהַעֲלֵ֤הוּ שָׁם֙ לְעֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽהָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "וַיֹּאמֶר קַח־נָא אֶת־בִּנְךָ אֶת־יְחִידְךָ אֲשֶׁר־אָהַבְתָּ אֶת־יִצְחָק וְלֶךְ־לְךָ אֶל־אֶרֶץ הַמֹּרִיָּה וְהַעֲלֵהוּ שָׁם לְעֹלָה עַל אַחַד הֶהָרִים אֲשֶׁר אֹמַר אֵלֶיךָ׃", "rashi_he": "ארץ המוריה. יְרוּשָׁלַיִם, וְכֵן בְּדִבְרֵי הַיָּמִים לִבְנוֹת אֶת בֵּית ה' בִּירוּשָׁלִַם בְּהַר הַמּוֹרִיָּה (דברי הימים ב ג'). וְרַבּוֹתֵינוּ פֵּרְשׁוּ עַל שֵׁם שֶׁמִּשָּׁם הוֹרָאָה יוֹצְאָה לְיִשְׂרָאֵל. וְאֻנְקְלוֹס תִּרְגְּמוֹ עַל שֵׁם עֲבוֹדַת הַקְּטֹרֶת שֶׁיֵּשׁ בּוֹ מוֹר נֵרְדְּ וּשְׁאָר בְּשָׂמִים:", "rashi_en": "ארץ המוריה היא ירושלים, כמו שנאמר \"בירושלם בהר המוריה\". חז\"ל פירשו שמשם יוצאת הוראה לישראל, ואונקלוס פירש על שם הקטורת שיש בה מור ובשמים.", "note": "", "points": [{"q": "מַהִי \"אֶרֶץ הַמֹּרִיָּה\" לְפִי רַשִׁ\"י?", "options": ["יְרוּשָׁלַיִם, מְקוֹם בֵּית הַמִּקְדָּשׁ", "אֶרֶץ רְחוֹקָה בַּמִּזְרָח שֶׁאֵינָהּ יְדוּעָה", "הַר סִינַי, שֶׁבּוֹ נִיתְּנָה הַתּוֹרָה"], "kasha": "\"ארץ המריה\" אינה מוכרת מן הפסוקים הקודמים.", "answer": "זוהי ירושלים, כמו שנאמר בדברי הימים \"לבנות את בית ה' בירושלם בהר המוריה\".", "kp": ["ארץ המוריה. ירושלים", "בירושלם בהר המוריה"]}]}, {"id": "22:2.4", "ch": 22, "v": 2, "n": 4, "dh": "והעלהו", "pasuk_html": "וַיֹּ֡אמֶר קַח־נָ֠א אֶת־בִּנְךָ֨ אֶת־יְחִֽידְךָ֤ אֲשֶׁר־אָהַ֙בְתָּ֙ אֶת־יִצְחָ֔ק וְלֶךְ־לְךָ֔ אֶל־אֶ֖רֶץ הַמֹּרִיָּ֑ה <mark>וְהַעֲלֵ֤הוּ</mark> שָׁם֙ לְעֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽהָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "וַיֹּאמֶר קַח־נָא אֶת־בִּנְךָ אֶת־יְחִידְךָ אֲשֶׁר־אָהַבְתָּ אֶת־יִצְחָק וְלֶךְ־לְךָ אֶל־אֶרֶץ הַמֹּרִיָּה וְהַעֲלֵהוּ שָׁם לְעֹלָה עַל אַחַד הֶהָרִים אֲשֶׁר אֹמַר אֵלֶיךָ׃", "rashi_he": "והעלהו. לֹא אָמַר לוֹ שְׁחָטֵהוּ, לְפִי שֶׁלֹּא הָיָה חָפֵץ הַקָּבָּ\"ה לְשָׁחֳטוֹ אֶלָּא לְהַעֲלֵהוּ לָהָר לַעֲשׂוֹתוֹ עוֹלָה, וּמִשֶּׁהֶעֱלָהוּ אָמַר לוֹ הוֹרִידֵהוּ:", "rashi_en": "ה' לא אמר לאברהם לשחוט את יצחק אלא להעלות אותו להר כדי לעשותו עולה, וכשהעלה אותו אמר לו להוריד אותו.", "note": "", "points": [{"q": "מַה מְלַמֶּדֶת הַמִּילָּה \"וְהַעֲלֵהוּ\" לְפִי רַשִׁ\"י?", "options": ["ה' צִיווָּה רַק לְהַעֲלוֹתוֹ לָהָר וְלֹא לִשְׁחוֹט אוֹתוֹ", "ה' צִיווָּה לִשְׁחוֹט אֶת יִצְחָק וְלִשְׂרוֹף אוֹתוֹ", "אַבְרָהָם נִצְטַווָּה לְהַעֲלוֹת אֶת יִצְחָק עַל הַמִּזְבֵּחַ בְּכֹוחַ"], "kasha": "אם ה' לא רצה שיצחק יישחט, כיצד ציווה \"והעלהו... לעלה\"?", "answer": "ה' לא אמר לו לשחוט אותו, כי לא רצה שיישחט, אלא רק להעלות אותו להר, ומשהעלה אותו אמר לו להוריד אותו.", "kp": ["לא אמר לו שחטהו", "ומשהעלהו אמר לו הורידהו"]}]}, {"id": "22:2.5", "ch": 22, "v": 2, "n": 5, "dh": "אחד ההרים", "pasuk_html": "וַיֹּ֡אמֶר קַח־נָ֠א אֶת־בִּנְךָ֨ אֶת־יְחִֽידְךָ֤ אֲשֶׁר־אָהַ֙בְתָּ֙ אֶת־יִצְחָ֔ק וְלֶךְ־לְךָ֔ אֶל־אֶ֖רֶץ הַמֹּרִיָּ֑ה וְהַעֲלֵ֤הוּ שָׁם֙ לְעֹלָ֔ה עַ֚ל <mark>אַחַ֣ד הֶֽהָרִ֔ים</mark> אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "pasuk_en": "וַיֹּאמֶר קַח־נָא אֶת־בִּנְךָ אֶת־יְחִידְךָ אֲשֶׁר־אָהַבְתָּ אֶת־יִצְחָק וְלֶךְ־לְךָ אֶל־אֶרֶץ הַמֹּרִיָּה וְהַעֲלֵהוּ שָׁם לְעֹלָה עַל אַחַד הֶהָרִים אֲשֶׁר אֹמַר אֵלֶיךָ׃", "rashi_he": "אחד ההרים. הַקָּבָּ\"ה מַתְהֵא הַצַּדִּיקִים וְאַחַר כָּךְ מְגַלֶּה לָהֶם; וְכָל זֶה כְּדֵי לְהַרְבּוֹת שְׂכָרָן, וְכֵן אֶל הָאָרֶץ אֲשֶׁר אַרְאֶךָּ (בראשית י\"ב), וְכֵן בְּיוֹנָה וּקְרָא עָלֶיהָ אֶת הַקְּרִיאָה (יונה ג ב):", "rashi_en": "ה' לא אמר לאברהם מיד על איזה הר מדובר, אלא השאיר אותו במתח ורק אחר כך גילה לו. כך נוהג ה' עם הצדיקים, כדי להגדיל את שכרם.", "note": "", "points": [{"q": "לָמָּה לֹא אָמַר ה' לְאַבְרָהָם מִיָּד עַל אֵיזֶה הַר לְהַעֲלוֹת אֶת יִצְחָק?", "options": ["כְּדֵי לְהַרְבּוֹת אֶת שְׂכָרוֹ, כְּדַרְכּוֹ שֶׁל ה' עִם הַצַּדִּיקִים", "כִּי עֲדַייִן לֹא נִבְחַר הָהָר שֶׁעָלָיו יִיבָּנֶה הַמִּזְבֵּחַ", "כְּדֵי לִבְדֹּוק אִם אַבְרָהָם יִמְצָא אֶת הָהָר בְּעַצְמוֹ"], "kasha": "מדוע נאמר \"אחד ההרים\" בסתם, בלי לפרט על איזה הר מדובר?", "answer": "ה' משאיר את הצדיקים בתחילה בספק ורק אחר כך מגלה להם, כדי להרבות את שכרם, וכך גם \"אל הארץ אשר אראך\" וגם אצל יונה.", "kp": ["מתהא הצדיקים ואחר כך מגלה להם", "כדי להרבות שכרן"]}]}, {"id": "22:3.1", "ch": 22, "v": 3, "n": 1, "dh": "וישכם", "pasuk_html": "<mark>וַיַּשְׁכֵּ֨ם</mark> אַבְרָהָ֜ם בַּבֹּ֗קֶר וַֽיַּחֲבֹשׁ֙ אֶת־חֲמֹר֔וֹ וַיִּקַּ֞ח אֶת־שְׁנֵ֤י נְעָרָיו֙ אִתּ֔וֹ וְאֵ֖ת יִצְחָ֣ק רוג ממנהגו הרגיל.", "kp": ["הוא בעצמו", "שהאהבה מקלקלת השורה"]}]}, {"id": "22:3.3", "ch": 22, "v": 3, "n": 3, "dh": "את שני נעריו", "pasuk_html": "וַיַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּבֹּ֗קֶר וַֽיַּחֲבֹשׁ֙ אֶת־חֲמֹר֔וֹ וַיִּקַּ֞ח <mark>אֶת־שְׁנֵ֤י נְעָרָיו֙</mark> אִתּ֔וֹ וְאֵ֖ת יִצְחָ֣ק בְּנ֑וֹ וַיְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַיָּ֣קָם וַיֵּ֔לֶךְ אֶל־הַמָּק֖וֹם אֲשֶׁר־אָֽמַר־ל֥וֹ הָאֱלֹהִֽים׃", "pasuk_en": "וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ וַיִּקַּח אֶת־שְׁנֵי נְעָרָיו אִתּוֹ וְאֵת יִצְחָק בְּנוֹ וַיְבַקַּע עֲצֵי עֹלָה וַיָּקָם וַיֵּלֶךְ אֶל־הַמָּקוֹם אֲשֶׁר־אָמַר־לוֹ הָאֱלֹהִים׃", "rashi_he": "את שני נעריו. יִשְׁמָעֵאל וֶאֱלִיעֶזֶר, שֶׁאֵין אָדָם חָשׁוּב רַשַּׁאי לָצֵאת לַדֶּרֶךְ בְּלֹא ב' אֲנָשִׁים (בראשית רבה), שֶׁאִם יִצְטָרֵךְ הָאֶחָד לִנְקָבָיו וְיִתְרַחֵק, יִהְיֶה הַשֵּׁנִי עִמּוֹ:", "rashi_en": "שני הנערים היו ישמעאל ואליעזר. אדם חשוב לא יוצא לדרך בלי שני אנשים, כדי שאם אחד יתרחק לצרכיו, השני יישאר איתו.", "note": "", "points": [{"q": "מַדּוּעַ לָקַח אַבְרָהָם אִיתוֹ דַּוְוקָא שְׁנֵי נְעָרִים?", "options": ["אָדָם חָשׁוּב לֹא יוֹצֵא לַדֶּרֶךְ בְּלִי שְׁנֵי מְלַוִּוים", "כִּי הָיָה צָרִיךְ שְׁנַיִים כְּדֵי לִסְחֹוב אֶת הָעֵצִים", "כְּדֵי שֶׁשְּׁנַייִם יָעִידוּ אַחַר כָּךְ עַל הָעֲקֵידָה"], "kasha": "מדוע מציין הפסוק שלקח \"שני\" נערים, ומי הם?", "answer": "הם ישמעאל ואליעזר, ואדם חשוב לא יוצא לדרך בלי שני אנשים, כדי שאם אחד יתרחק לצרכיו השני יישאר עמו.", "kp": ["ישמעאל ואליעזר", "בלא ב' אנשים"]}]}, {"id": "22:3.4", "ch": 22, "v": 3, "n": 4, "dh": "ויבקע", "pasuk_html": "וַיַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּבֹּ֗קֶר וַֽיַּחֲבֹשׁ֙ אֶת־חֲמֹר֔וֹ וַיִּקַּ֞ח אֶת־שְׁנֵ֤י נְעָרָיו֙ אִתּ֔וֹ וְאֵ֖ת יִצְחָ֣ק בְּנ֑וֹ <mark>וַיְבַקַּע֙</mark> עֲצֵ֣י עֹלָ֔ה וַיָּ֣קָם וַיֵּ֔לֶךְ אֶל־הַמָּק֖וֹם אֲשֶׁר־אָֽמַר־ל֥וֹ הָאֱלֹהִֽים׃", "pasuk_en": "וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ וַיִּקַּח אֶת־שְׁנֵי נְעָרָיו אִתּוֹ וְאֵת יִצְחָק בְּנוֹ וַיְבַקַּע עֲצֵי עֹלָה וַיָּקָם וַיֵּלֶךְ אֶל־הַמָּקוֹם אֲשֶׁר־אָמַר־לוֹ הָאֱלֹהִים׃", "rashi_he": "ויבקע. תַּרְגּוּם וְצַלַּח, כְּמוֹ וְצָלְחוּ הַיַּרְדֵּן (שמואל ב' י\"ט), לְשׁוֹן בִּקּוּעַ, פינדר\"א בלע\"ז:", "rashi_en": "\"ויבקע\" פירושו חתך ופילח את העצים, כפי שתרגם אונקלוס \"וצלח\", מלשון בקיעה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"וַיְבַקַּע\" בַּפָּסוּק?", "options": ["חָתַךְ וּפִילַּח אֶת הָעֵצִים לַחֲתִיכוֹת", "אָסַף עֵצִים יְבֵשִׁים מִן הַשָּׂדֶה", "קָשַׁר אֶת הָעֵצִים לַחֲבִילָה אַחַת"], "kasha": "מה פירוש המילה \"ויבקע\" לגבי העצים?", "answer": "אונקלוס תרגם \"וצלח\", כמו \"וצלחו הירדן\", והוא לשון בקיעה וחיתוך.", "kp": ["תרגום וצלח", "לשון בקוע"]}]}, {"id": "22:4.1", "ch": 22, "v": 4, "n": 1, "dh": "ביום השלישי", "pasuk_html": "<mark>בַּיּ֣וֹם הַשְּׁלִישִׁ֗י</mark> וַיִּשָּׂ֨א אַבְרָהָ֧ם אֶת־עֵינָ֛יו וַיַּ֥רְא אֶת־הַמָּק֖וֹם מֵרָחֹֽק׃", "pasuk_en": "בַּיּוֹם הַשְּׁלִישִׁי וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא אֶת־הַמָּקוֹם מֵרָחֹק׃", "rashi_he": "ביום השלישי. לָמָה אֵחַר מִלְּהַרְאוֹתוֹ מִיָּד? כְּדֵי שֶׁלֹּא יֹאמְרוּ הֲמָמוֹ וְעִרְבְּבוֹ פִּתְאוֹם וְטָרַף דַּעְתּוֹ, וְאִלוּ הָיָה לוֹ שָׁהוּת לְהִמָּלֵךְ אֶל לִבּוֹ לֹא הָיָה עוֹשֶׂה:", "rashi_en": "ה' השהה את הגילוי עד היום השלישי, כדי שלא יאמרו שאברהם עשה את המעשה בבלבול פתאומי, ושאילו היה לו זמן לחשוב לא היה עושה זאת.", "note": "", "points": [{"q": "לָמָּה הֶרְאָה ה' אֶת הַמָּקוֹם לְאַבְרָהָם רַק בַּיּוֹם הַשְּׁלִישִׁי?", "options": ["שֶׁלֹּא יֹאמְרוּ שֶׁעָשָׂה זֹאת בְּבִלְבּוּל, בְּלִי זְמַן לַחְשֹׁוב", "כִּי הַמָּקוֹם הָיָה רָחוֹק וְנִדְרְשׁוּ שְׁלוֹשָׁה יְמֵי הֲלִיכָה", "כְּדֵי שֶׁיִּצְחָק יַסְפִּיק לְהִתְכּוֹנֵן לַקָּרְבָּן"], "kasha": "למה עיכב ה' את הראיית המקום ולא הראה אותו לאברהם מיד?", "answer": "כדי שלא יאמרו שה' הבהיל ובלבל אותו פתאום ושיבש את דעתו, ושאילו היה לו זמן לשקול לא היה עושה זאת.", "kp": ["למה אחר מלהראותו מיד", "שלא יאמרו הממו וערבבו פתאום", "להמלך אל לבו"]}]}, {"id": "22:4.2", "ch": 22, "v": 4, "n": 2, "dh": "וירא את המקום", "pasuk_html": "בַּיּ֣וֹם הַשְּׁלִישִׁ֗י וַיִּשָּׂ֨א אַבְרָהָ֧ם אֶת־עֵינָ֛יו <mark>וַיַּ֥רְא אֶת־הַמָּק֖וֹם</mark> מֵרָחֹֽק׃", "pasuk_en": "בַּיּוֹם הַשְּׁלִישִׁי וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא אֶת־הַמָּקוֹם מֵרָחֹק׃", "rashi_he": "וירא את המקום. רָאָה עָנָן קָשׁוּר עַל הָהָר:", "rashi_en": "אברהם זיהה את המקום כי ראה ענן קשור על ההר.", "note": "", "points": [{"q": "אֵיךְ זִיהָה אַבְרָהָם אֶת הַמָּקוֹם מֵרָחוֹק?", "options": ["רָאָה עָנָן קָשׁוּר עַל הָהָר", "רָאָה מִזְבֵּחַ עַתִּיק בְּרֹאשׁ הָהָר", "מַלְאָךְ הִצְבִּיעַ לוֹ עַל הָהָר"], "kasha": "איך ידע אברהם שזה המקום, והרי ה' לא אמר לו את שמו?", "answer": "הוא ראה ענן קשור על ההר.", "kp": ["ראה ענן קשור על ההר"]}]}, {"id": "22:5.1", "ch": 22, "v": 5, "n": 1, "dh": "עד כה", "pasuk_html": "וַיֹּ֨אמֶר אַבְרָהָ֜ם אֶל־נְעָרָ֗יו שְׁבוּ־לָכֶ֥ם פֹּה֙ עִֽם־הַחֲמ֔וֹר וַאֲנִ֣י וְהַנַּ֔עַר נֵלְכָ֖ה <mark>עַד־כֹּ֑ה</mark> וְנִֽשְׁתַּחֲוֶ֖ה וְנָשׁ֥וּבָה אֲלֵיכֶֽם׃", "pasuk_en": "וַיֹּאמֶר אַבְרָהָם אֶל־נְעָרָיו שְׁבוּ־לָכֶם פֹּה עִם־הַחֲמוֹר וַאֲנִי וְהַנַּעַר נֵלְכָה עַד־כֹּה וְנִשְׁתַּחֲוֶה וְנָשׁוּבָה אֲלֵיכֶם׃", "rashi_he": "עד כה. כְּלוֹמַר דֶּרֶךְ מֻעָט לַמָּקוֹם אֲשֶׁר לְפָנֵינוּ. וּמִ\"אַ אֶרְאֶה הֵיכָן הוּא מַה שֶּׁאָמַר לִי הַמָּקוֹם כֹּה יִהְיֶה זַרְעֶךָ:", "rashi_en": "לפי הפשט \"עד כה\" פירושו מרחק קצר, עד המקום שלפנינו. לפי המדרש אמר אברהם: אלך לראות היכן מתקיימת הבטחת ה' \"כה יהיה זרעך\".", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"עַדְכָּה\" לְפִי הַפְּשָׁט?", "options": ["מֶרְחָק קָצָר, עַד הַמָּקוֹם שֶׁלְּפָנֵינוּ", "עַד שֶׁתִּשְׁקַע הַשֶּׁמֶשׁ וְיָבוֹא הַלַּיְלָה", "עַד סוֹף הַדֶּרֶךְ הָאֲרֻוכָּה שֶׁנּוֹתְרָה"], "kasha": "המילה \"כה\" סתמית, ולא ברור עד היכן התכוון אברהם ללכת.", "answer": "כלומר דרך מעט, עד המקום שנמצא לפנינו.", "kp": ["דרך מעט למקום אשר לפנינו"]}, {"q": "לְפִי הַמִּדְרָשׁ, לָמָּה רָמַז אַבְרָהָם בַּמִּילָּה \"כֹּה\"?", "options": ["לְהַבְטָחַת ה' \"כֹּה יִהְיֶה זַרְעֶךָ\"", "לְצִיוּוּי ה' \"קַח נָא אֶת בִּנְךָ\"", "לְמִסְפַּר הַיָּמִים שֶׁהָלְכוּ בַּדֶּרֶךְ"], "kasha": "מדוע בחר אברהם דווקא במילה \"כה\"?", "answer": "אברהם אמר: אראה היכן היא ההבטחה שאמר לי ה' \"כה יהיה זרעך\".", "kp": ["כה יהיה זרעך"]}]}, {"id": "22:5.2", "ch": 22, "v": 5, "n": 2, "dh": "ונשובה", "pasuk_html": "וַיֹּ֨אמֶר אַבְרָהָ֜ם אֶל־נְעָרָ֗יו שְׁבוּ־לָכֶ֥ם פֹּה֙ עִֽם־הַחֲמ֔וֹר וַאֲנִ֣י וְהַנַּ֔עַר נֵלְכָ֖ה עַד־כֹּ֑ה וְנִֽשְׁתַּחֲוֶ֖ה <mark>וְנָשׁ֥וּבָה</mark> אֲלֵיכֶֽם׃", "pasuk_en": "וַיֹּאמֶר אַבְרָהָם אֶל־נְעָרָיו שְׁבוּ־לָכֶם פֹּה עִם־הַחֲמוֹר וַאֲנִי וְהַנַּעַר נֵלְכָה עַד־כֹּה וְנִשְׁתַּחֲוֶה וְנָשׁוּבָה אֲלֵיכֶם׃", "rashi_he": "ונשובה. נִתְנַבֵּא שֶׁיָּשׁוּבוּ שְׁנֵיהֶם:", "rashi_en": "אברהם אמר \"ונשובה\" בלשון רבים, כי ניבא בלי משים ששניהם, הוא ויצחק, יחזרו.", "note": "", "points": [{"q": "מַדּוּעַ אָמַר אַבְרָהָם \"וְנָשׁוּבָה\" בִּלְשׁוֹן רַבִּים, וַהֲרֵי הָלַךְ לִשְׁחוֹט אֶת יִצְחָק?", "options": ["נִתְנַבֵּא שֶׁשְּׁנֵיהֶם יַחְזְרוּ בְּשָׁלוֹם", "כְּדֵי לְהַרְגִּיעַ אֶת הַנְּעָרִים שֶׁלֹּא יִדְאֲגוּ", "כִּי הִתְכַּווֵּן לַחֲזוֹר עִם הַנְּעָרִים בִּלְבַד"], "kasha": "אברהם הלך להקריב את יצחק, ואיך אמר שישובו שניהם?", "answer": "אברהם נתנבא ששניהם ישובו.", "kp": ["נתנבא שישובו שניהם"]}]}, {"id": "22:6.1", "ch": 22, "v": 6, "n": 1, "dh": "המאכלת", "pasuk_html": "וַיִּקַּ֨ח אַבְרָהָ֜ם אֶת־עֲצֵ֣י הָעֹלָ֗ה וַיָּ֙שֶׂם֙ עַל־יִצְחָ֣ק בְּנ֔וֹ וַיִּקַּ֣ח בְּיָד֔וֹ אֶת־הָאֵ֖שׁ וְאֶת־<mark>הַֽמַּאֲכֶ֑לֶת</mark> וַיֵּלְכ֥וּ שְׁנֵיהֶ֖ם יַחְדָּֽו׃", "pasuk_en": "וַיִּקַּח אַבְרָהָם אֶת־עֲצֵי הָעֹלָה וַיָּשֶׂם עַל־יִצְחָק בְּנוֹ וַיִּקַּח בְּיָדוֹ אֶת־הָאֵשׁ וְאֶת־הַמַּאֲכֶלֶת וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו׃", "rashi_he": "המאכלת. סַכִּין, עַל שֵׁם שֶׁאוֹכֶלֶת אֶת הַבָּשָׂר, כְּמָה דְתֵימָא וְחַרְבִּי תֹּאכַל בָּשָׂר (דברים ל\"ב), וְשֶׁמַּכְשֶׁרֶת בָּשָׂר לַאֲכִילָה. דָּ\"אַ זֹאת נִקְרֵאת מַאֲכֶלֶת עַל שֵׁם שֶׁיִּשְׂרָאֵל אוֹכְלִים מַתַּן שְׂכָרָהּ:", "rashi_en": "הסכין נקראת \"מאכלת\" כי היא אוכלת את הבשר ומכשירה אותו לאכילה. פירוש נוסף: סכין העקידה נקראת כך כי ישראל אוכלים את שכר המעשה הזה.", "note": "", "points": [{"q": "מַדּוּעַ נִקְרֵאת הַסַּכִּין \"מַאֲכֶלֶת\"?", "options": ["כִּי הִיא אוֹכֶלֶת אֶת הַבָּשָׂר וּמַכְשִׁירָה אוֹתוֹ לַאֲכִילָה", "כִּי מִשְׁתַּמְּשִׁים בָּהּ רַק בִּשְׁעַת הַסְּעוּדָה", "כִּי הִיא עֲשׂוּיָה מִבַּ
