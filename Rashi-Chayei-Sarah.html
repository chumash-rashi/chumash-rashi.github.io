דָּר", "הִיא הִזְכִּירָה אֶת אָבִיהָ לִפְנֵי סָבָהּ כְּדֵי לְהַרְאוֹת כָּבוֹד", "הִיא הִמְנְעָה בְּכַוָּנָה מִלְּהַזְכִּיר אֶת לָבָן כְּדֵי לְהַרְחִיקוֹ מֵהַמַּשָּׂא וּמַתָּן"], "kasha": "מָה מְיֻחָד בְּאֹפֶן שֶׁרִבְקָה סִדְּרָה אֶת תְּשׁוּבָתָהּ?", "answer": "הִיא עָנְתָה בְּסֵדֶר מְסֻדָּר — עוֹנָה עַל שְׁאֵלָתוֹ הָרִאשׁוֹנָה רִאשׁוֹנָה וְעַל הָאַחֲרוֹנָה אַחֲרוֹנָה.", "kp": ["השיבתו על ראשון ראשון", "ועל אחרון אחרון"]}]}, {"id": "24:25.1", "ch": 24, "v": 25, "n": 1, "dh": "מספוא", "pasuk_html": "וַתֹּ֣אמֶר אֵלָ֔יו גַּם־תֶּ֥בֶן גַּם־<mark>מִסְפּ֖וֹא</mark> רַ֣ב עִמָּ֑נוּ גַּם־מָק֖וֹם לָלֽוּן׃", "pasuk_en": "And she went on, “There is plenty of strawdstraw Heb. teben, shredded straw, which normally was mixed with feed; cf. v. 32. and feed at home, and also room to spend the night.” ", "rashi_he": "מספוא. כָּל מַאֲכַל הַגְּמַלִים קָרוּי מִסְפּוֹא, כְּגוֹן תֶּבֶן וּשְׂעוֹרִים:", "rashi_en": "מספוא הוא שם כללי לכל סוגי האוכל של הגמלים, כמו תבן ושעורים.", "note": "", "points": [{"q": "מָה כּוֹלֵל מִסְפּוֹא?", "options": ["כָּל מִינֵי מַאֲכָל גְּמַלִּים — תֶּבֶן וּשְׂעוֹרִים", "רַק עֵשֶׂב יָבֵשׁ וְחָצִיר", "תְּבוּאָה שֶׁהֻפְרְשָׁה בְּמֻיָּחָד לִבְהֵמוֹת נוֹסְעוֹת"], "kasha": "מַה בְּדִיּוּק הוּא מִסְפּוֹא?", "answer": "מִסְפּוֹא מִתְכַּוֵּן לְכָל מִינֵי מַאֲכָל גְּמַלִּים, כּוֹלֵל תֶּבֶן וּשְׂעוֹרִים.", "kp": ["כל מאכל הגמלים קרוי מספוא", "כגון תבן ושעורים"]}]}, {"id": "24:27.1", "ch": 24, "v": 27, "n": 1, "dh": "בדרך", "pasuk_html": "וַיֹּ֗אמֶר בָּר֤וּךְ יְהֹוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣י אַבְרָהָ֔ם אֲ֠שֶׁ֠ר לֹֽא־עָזַ֥ב חַסְדּ֛וֹ וַאֲמִתּ֖וֹ מֵעִ֣ם אֲדֹנִ֑י אָנֹכִ֗י <mark>בַּדֶּ֙רֶךְ֙</mark> נָחַ֣נִי יְהֹוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽי׃", "pasuk_en": "and said, “Blessed be the ETERNAL, the God of my master Abraham,emy master Abraham I.e., Abraham and his household. who has not withheld steadfast faithfulness from my master. For I have been guided on my errand by GOD, to the house of my master’s kin.”", "rashi_he": "בדרך. דֶּרֶךְ הַמְזֻמָּן, דֶּרֶך הַיָּשָׁר, בְּאוֹתוֹ דֶּרֶךְ שֶׁהָיִיתִי צָרִיךְ, וְכֵן כָּל בֵּי\"ת וְלָמֶ\"ד וְהֵ\"א הַמְשַׁמְּשִׁים בְּרֹאש הַתֵּבָה וּנְקוּדִים בְּפַתָּח, מְדַבְּרִים בְּדָבָר הַפָּשׁוּט שֶׁנִּזְכַּר כְּבָר בְּמָקוֹם אַחֵר, אוֹ שֶׁהוּא מְבֹרָר וְנִכָּר בְּאֵיזוֹ הוּא מְדַבֵּר:", "rashi_en": "המילה בדרך מנוקדת בפתח, ולכן פירושה הדרך המיוחדת והישרה שהייתי צריך ללכת בה. וכן כל אות ב, ל או ה בתחילת מילה שמנוקדת בפתח מדברת על דבר מסוים וידוע, שכבר הוזכר במקום אחר או שברור על מה מדובר.", "note": "", "points": [{"q": "מָה מְצַיֵּן הָאוֹת בֵּי\"ת עִם פַּתָּח בְּ'בַּדֶּרֶךְ'?", "options": ["הוּא מְצַיֵּן אֶת הַדֶּרֶךְ הַמְּסֻיֶּמֶת, הַנְּכוֹנָה — הַנָּתִיב שֶׁצָּרִיךְ לִהְיוֹת בּוֹ", "הוּא מְצַיֵּן כִּוּוּן כְּלָלִי — כָּל נָתִיב הַמּוֹבִיל לַאֲרָם", "הוּא מְצַיֵּן תְּנוּעָה — הוּא הָלַךְ לְאֹרֶךְ דֶּרֶךְ"], "kasha": "מַדּוּעַ רַשִׁ\"י מַדְגִּישׁ אֶת הַנִּקּוּד שֶׁתַּחַת הַבֵּי\"ת?", "answer": "כְּשֶׁאוֹתִיּוֹת בכ\"ל מְנֻקָּדוֹת בְּפַתָּח, הֵן מְצַיְּנוֹת דָּבָר מְסֻיָּם. כָּאן הַכַּוָּנָה לַדֶּרֶךְ הַמְּסֻיֶּמֶת, הַנְּכוֹנָה — הַנָּתִיב שֶׁה' יָעַד.", "kp": ["דרך המזמן, דרך הישר", "באותו דרך שהייתי צריך"]}]}, {"id": "24:28.1", "ch": 24, "v": 28, "n": 1, "dh": "לבית אמה", "pasuk_html": "וַתָּ֙רׇץ֙ הַֽנַּעֲרָ֔ וַתַּגֵּ֖ד <mark>לְבֵ֣ית אִמָּ֑הּ</mark> כַּדְּבָרִ֖ים הָאֵֽלֶּה׃", "pasuk_en": "The maiden ran and told all this to her mother’s household.", "rashi_he": "לבית אמה. דֶּרֶךְ הַנָּשִׁים הָיְתָה לִהְיוֹת לָהֶן בַּיִת לֵישֵׁב בּוֹ לִמְלַאכְתָּן, וְאֵין הַבַּת מַגֶּדֶת אֶלָּא לְאִמָּהּ:", "rashi_en": "רבקה סיפרה לבית אמה, כי היה מנהג שלנשים יש בית מיוחד שבו הן יושבות ועושות את מלאכתן, ובת מספרת דברים כאלה רק לאמה.", "note": "", "points": [{"q": "מַדּוּעַ רָצְתָה רִבְקָה דַּוְקָא לְבֵית אִמָּהּ?", "options": ["לַנָּשִׁים הָיוּ חֲדָרִים מְיֻחָדִים, וּבַת מְסַפֶּרֶת רַק לְאִמָּהּ", "אָבִיהָ בְּתוּאֵל כְּבָר נִפְטַר", "אִמָּהּ הָיְתָה רֹאשׁ הַמִּשְׁפָּחָה"], "kasha": "מַדּוּעַ 'בֵּית אִמָּהּ' וְלֹא 'בֵּית אָבִיהָ'?", "answer": "לַנָּשִׁים הָיוּ חֲדָרִים נִפְרָדִים מְיֻחָדִים, וְטִבְעִי לַבַּת לְסַפֵּר לְאִמָּהּ עַל דְּבָרִים כָּאֵלֶּה.", "kp": ["דרך הנשים היתה להיות להן בית", "ואין הבת מגדת אלא לאמה"]}]}, {"id": "24:29.1", "ch": 24, "v": 29, "n": 1, "dh": "וירץ", "pasuk_html": "וּלְרִבְקָ֥ה אָ֖ח וּשְׁמ֣וֹ לָבָ֑ן <mark>וַיָּ֨רׇץ</mark> לָבָ֧ן אֶל־הָאִ֛ישׁ הַח֖וּצָה אֶל־הָעָֽיִן׃", "pasuk_en": "Now Rebekah had a brother whose name was Laban. Laban ran out to the man at the spring—", "rashi_he": "וירץ. לְמָה רָץ וְעַל מָה רָץ? ויהי כראות את הנזם, אָמַר עָשִׁיר הוּא זֶה, וְנָתָן עֵינָיו בַּמָּמוֹן:", "rashi_en": "רש\"י שואל למה ועל מה רץ לבן, ומשיב מהפסוק הבא: כשראה את הנזם אמר בלבו שזה אדם עשיר, ורץ אליו כי חמד את ממונו.", "note": "", "points": [{"q": "מַדּוּעַ רָץ לָבָן לִקְרַאת הָעֶבֶד?", "options": ["הוּא רָאָה אֶת הַנֶּזֶם וְהַצְּמִידִים הַיְקָרִים וְנָתַן עֵינָיו בַּמָּמוֹן", "הוּא רָצָה לְהַרְאוֹת הַכְנָסַת אוֹרְחִים כְּמוֹ סָבוֹ אַבְרָהָם", "רִבְקָה סִפְּרָה לוֹ שֶׁלָּאִישׁ יֵשׁ מֶסֶר מֵאֵת ה'"], "kasha": "מָה הֵנִיעַ אֶת לָבָן לָרוּץ?", "answer": "לָבָן רָאָה אֶת טַבַּעַת הַזָּהָב וְהַצְּמִידִים וְחָשַׁב 'זֶה בְּוַדַּאי אִישׁ עָשִׁיר' — הוּא רָץ מִפְּנֵי שֶׁנָּתַן עֵינָיו בַּמָּמוֹן.", "kp": ["ויהי כראות את הנזם", "ונתן עיניו בממון"]}]}, {"id": "24:30.1", "ch": 24, "v": 30, "n": 1, "dh": "על הגמלים", "pasuk_html": "וַיְהִ֣י&thinsp;׀ כִּרְאֹ֣ת אֶת־הַנֶּ֗זֶם וְֽאֶת־הַצְּמִדִים֮ עַל־יְדֵ֣י אֲחֹתוֹ֒ וּכְשׇׁמְע֗וֹ אֶת־דִּבְרֵ֞י רִבְקָ֤ה אֲחֹתוֹ֙ לֵאמֹ֔ר כֹּֽה־דִבֶּ֥ר אֵלַ֖י הָאִ֑ישׁ וַיָּבֹא֙ אֶל־הָאִ֔ישׁ וְהִנֵּ֛ה עֹמֵ֥ד <mark>עַל־הַגְּמַלִּ֖ים</mark> עַל־הָעָֽיִן׃", "pasuk_en": "when he saw the nose-ring and the bands on his sister’s arms, and when he heard his sister Rebekah say, “Thus the man spoke to me.” He went up to the man, who was still standing beside the camels at the spring. ", "rashi_he": "על הגמלים. לְשָׁמְרָן, כְּמוֹ וְהוּא עוֹמֵד עֲלֵיהֶם (בראשית י״ח:ח׳), לְשַׁמְּשָׁם:", "rashi_en": "עומד על הגמלים פירושו עומד לידם כדי לשמור עליהם, כמו שנאמר על אברהם והוא עומד עליהם, שפירושו עומד לשרת אותם.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ עַל הַגְּמַלִּים לְגַבֵּי מִקּוּם הָעֶבֶד?", "options": ["הוּא עָמַד אֵצֶל הַגְּמַלִּים כְּדֵי לִשְׁמֹר עֲלֵיהֶם", "הוּא יָשַׁב עַל הַגְּמַלִּים מוּכָן לִנְסֹעַ", "הוּא הֵעֲמִיס מַתָּנוֹת עַל הַגְּמַלִּים"], "kasha": "מָה עָשָׂה הָעֶבֶד 'עִם הַגְּמַלִּים'?", "answer": "הוּא עָמַד אֵצֶל הַגְּמַלִּים כְּדֵי לִשְׁמֹר עֲלֵיהֶם — עַל כָּאן פֵּרוּשָׁהּ 'לְיַד' אוֹ 'אֵצֶל'.", "kp": ["לשמרן", "לשמשם"]}]}, {"id": "24:31.1", "ch": 24, "v": 31, "n": 1, "dh": "פניתי הבית", "pasuk_html": "וַיֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהֹוָ֑ה לָ֤מָּה תַעֲמֹד֙ בַּח֔וּץ וְאָנֹכִי֙ <mark>פִּנִּ֣יתִי הַבַּ֔יִת</mark> וּמָק֖וֹם לַגְּמַלִּֽים׃", "pasuk_en": "“Come in, O blessed of GOD,” he said, “why do you remain outside, when I have made ready the house and a place for the camels?” ", "rashi_he": "פניתי הבית. מֵעֲבוֹדַת אֱלִילִים (בראשית רבה):", "rashi_en": "לבן אמר לאליעזר שפינה את הבית מעבודה זרה, כלומר הוציא ממנו את האלילים.", "note": "", "points": [{"q": "לְמָה הִתְכַּוֵּן לָבָן בְּ'פִּנִּיתִי הַבַּיִת'?", "options": ["הוּא פִּנָּה אֶת הַבַּיִת מֵעֲבוֹדָה זָרָה כְּדֵי שֶׁהָעֶבֶד לֹא יִפָּגַע", "הוּא נִקָּה וְסִדֵּר אֶת הַחֲדָרִים לְכָבוֹד הָאוֹרֵחַ", "הוּא שָׁלַח אֶת שְׁאָר בְּנֵי הַמִּשְׁפָּחָה כְּדֵי לָתֵת לָעֶבֶד פְּרָטִיּוּת"], "kasha": "מָה צָרִיךְ הָיָה 'לְפַנּוֹת' מִן הַבָּיִת?", "answer": "לָבָן פִּנָּה אֶת הַבַּיִת מֵעֲבוֹדָה זָרָה — הוּא הוֹצִיא אֶת חֶפְצֵי הָעֲבוֹדָה הַזָּרָה כְּדֵי שֶׁעֶבֶד אַבְרָהָם יִרְגִּישׁ נוֹחַ לְהִכָּנֵס.", "kp": ["מעבודת אלילים"]}]}, {"id": "24:32.1", "ch": 24, "v": 32, "n": 1, "dh": "ויפתח", "pasuk_html": "וַיָּבֹ֤א הָאִישׁ֙ הַבַּ֔יְתָה <mark>וַיְפַתַּ֖ח</mark> הַגְּמַלִּ֑ים וַיִּתֵּ֨ן תֶּ֤בֶן וּמִסְפּוֹא֙ לַגְּמַלִּ֔ים וּמַ֙יִם֙ לִרְחֹ֣ץ רַגְלָ֔יו וְרַגְלֵ֥י הָאֲנָשִׁ֖ים אֲשֶׁ֥ר אִתּֽוֹ׃", "pasuk_en": "So the man entered the house, and the camels were unloaded. The camels were given straw and feed, and water was brought to bathe his feet and those of his entourage. ", "rashi_he": "ויפתח. הִתִּיר זְמָם שֶׁלָּהֶם, שֶׁהָיָה סוֹתֵם אֶת פִּיהֶם שֶׁלֹא יִרְעוּ בַדֶּרֶךְ בִּשְׂדוֹת אַחֵרִים:", "rashi_en": "ויפתח פירושו שהתיר את הזמם, החסום שהיה על פי הגמלים, שנועד לסגור את פיהם כדי שלא יאכלו בדרך בשדות של אנשים אחרים.", "note": "", "points": [{"q": "לְמָה מִתְיַחֵס וַיְפַתַּח ('הוּא פָּתַח/הִתִּיר')?", "options": ["הוּא הוֹרִיד אֶת הַזְּמָמִים מֵהַגְּמַלִּים, שֶׁהָיוּ עֲלֵיהֶם כְּדֵי לִמְנֹעַ רְעִיָּה בִּשְׂדוֹת אֲחֵרִים", "הוּא פָּתַח אֶת אַמְתְּחוֹת הַמַּשָּׂא לִפְרֹק אֶת הַמַּתָּנוֹת", "הוּא הִתִּיר אֶת הַחֲבָלִים שֶׁקָּשְׁרוּ אֶת הַמַּשָּׂאוֹת לַגְּמַלִּים"], "kasha": "מַה בְּדִיּוּק 'נִפְתַּח' אוֹ 'הוּתַּר'?", "answer": "הוּא הוֹרִיד אֶת הַזְּמָמִים מֵהַגְּמַלִּים. גְּמַלֵּי אַבְרָהָם חָבְשׁוּ זְמָמִים כְּדֵי לִמְנֹעַ אוֹתָם מִלִּרְעוֹת בִּשְׂדוֹת אֲחֵרִים, וְעַכְשָׁו הוּרְדוּ.", "kp": ["התיר זמם שלהם", "שהיה סותם את פיהם"]}]}, {"id": "24:33.1", "ch": 24, "v": 33, "n": 1, "dh": "עד אם דברתי", "pasuk_html": "(ויישם) [וַיּוּשַׂ֤ם] לְפָנָיו֙ לֶאֱכֹ֔ל וַיֹּ֙אמֶר֙ לֹ֣א אֹכַ֔ל <mark>עַ֥ד אִם־דִּבַּ֖רְתִּי</mark> דְּבָרָ֑י וַיֹּ֖אמֶר דַּבֵּֽר׃", "pasuk_en": "But when food was set before him, he said, “I will not eat until I have told my tale.” He said, “Speak, then.”", "rashi_he": "עד אם דברתי. הֲרֵי אִם מְשַׁמֵּשׁ בִּלְשׁוֹן אֲשֶׁר וּבִלְשׁוֹן כִּי, כְּמוֹ: עַד כִּי יָבֹא שִׁילֹה (בראשית מ\"ט) וְזֶהוּ שֶׁאָמְרוּ חֲזַ\"ל: כִּי מְשַׁמֵּשׁ בְּד' לְשׁוֹנוֹת, וְהָאֶחָד אִי, וְהוּא אִם:", "rashi_en": "עד אם דברתי פירושו עד אשר אדבר, וזה מראה שהמילה אם משמשת גם במשמעות אשר וגם במשמעות כי, כמו עד כי יבא שילה. וזה מה שאמרו חז\"ל שכי משמש בארבע משמעויות, ואחת מהן היא אי, שפירושה אם.", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ\"י מַסְבִּיר אֶת הַמִּלָּה אִם בְּ'עד אם־דברתי'?", "options": ["אִם כָּאן פֵּרוּשָׁהּ אֲשֶׁר ('שֶׁ') — כְּמוֹ עַד אֲשֶׁר, כְּשֶׁאִם מְשַׁמֶּשֶׁת כְּמוֹ אֲשֶׁר אוֹ כִּי", "אִם פֵּרוּשָׁהּ 'אִם־' — הוּא יֹאכַל רַק אִם יְנִיחוּ לוֹ לְדַבֵּר קֹדֶם", "אִם הִיא מִלַּת נִמּוּס — 'אִם נָא בְּעֵינֶיךָ, תֵּן לִי לְדַבֵּר'"], "kasha": "הַמִּלָּה אִם בְּדֶרֶךְ כְּלָל פֵּרוּשָׁהּ 'אִם' — מַה פֵּרוּשָׁהּ כָּאן?", "answer": "כָּאן אִם מְשַׁמֶּשֶׁת כְּמוֹ עַד אֲשֶׁר — הַמִּלָּה אִם בְּמוּבַן שֶׁל אֲשֶׁר אוֹ כִּי, כְּלוֹמַר 'עַד שֶׁאֲדַבֵּר'.", "kp": ["הרי אם משמש בלשון אשר", "ובלשון כי"]}]}, {"id": "24:36.1", "ch": 24, "v": 36, "n": 1, "dh": "ויתן לו את כל אשר לו", "pasuk_html": "וַתֵּ֡לֶד שָׂרָה֩ אֵ֨שֶׁת אֲדֹנִ֥י בֵן֙ לַֽאדֹנִ֔י אַחֲרֵ֖י זִקְנָתָ֑הּ <mark>וַיִּתֶּן־ל֖וֹ אֶת־כׇּל־אֲשֶׁר־לֽוֹ׃</mark>", "pasuk_en": "וַיִּתֵּן לוֹ אֶת כָּל אֲשֶׁר לוֹ", "rashi_he": "ויתן לו את כל אשר לו. שְׁטָר הַמַּתָּנָה הֶרְאָה לָהֶם:", "rashi_en": "אליעזר אמר שאברהם נתן ליצחק את כל אשר לו, והראה להם את שטר המתנה שבו כתב אברהם את כל רכושו ליצחק.", "note": "", "points": [{"q": "מָה הֶרְאָה אֱלִיעֶזֶר לְלָבָן וְלִבְתוּאֵל כְּשֶׁאָמַר שֶׁאַבְרָהָם נָתַן לְיִצְחָק אֶת הַכֹּל?", "options": ["שְׁטַר מַתָּנָה הַמּוֹכִיחַ אֶת הַהַעֲבָרָה", "תֵּבָה מְלֵאָה מַטְבְּעוֹת זָהָב", "רְשִׁימַת מִקְנֵה אַבְרָהָם"], "kasha": "מַדּוּעַ מַזְכִּירִים שֶׁאַבְרָהָם נָתַן הַכֹּל לְיִצְחָק בְּהֶקְשֵׁר שֶׁל חִפּוּשׂ אִשָּׁה?", "answer": "אֱלִיעֶזֶר הֶרְאָה לָהֶם שְׁטַר מַתָּנָה כְּדֵי לְהוֹכִיחַ שֶׁיִּצְחָק עָשִׁיר וְרָאוּי לְשִׁדּוּךְ.", "kp": ["שטר המתנה הראה להם"]}]}, {"id": "24:37.1", "ch": 24, "v": 37, "n": 1, "dh": "לא תקח אשה לבני מבנות הכנעני", "pasuk_html": "וַיַּשְׁבִּעֵ֥נִי אֲדֹנִ֖י לֵאמֹ֑ר <mark>לֹא־תִקַּ֤ח אִשָּׁה֙ לִבְנִ֔י מִבְּנוֹת֙ הַֽכְּנַעֲנִ֔י</mark> אֲשֶׁ֥ר אָנֹכִ֖י יֹשֵׁ֥ב בְּאַרְצֽוֹ׃", "pasuk_en": "לֹא תִקַּח אִשָּׁה לִבְנִי מִבְּנוֹת הַכְּנַעֲנִי", "rashi_he": "לא תקח אשה לבני מבנות הכנעני. אִם לֹא תֵּלֵךְ תְּחִלָּה אֶל בֵּית אָבִי וְלֹא תֹאבֶה לָלֶכֶת אַחֲרֶיךָ:", "rashi_en": "אברהם השביע את אליעזר שלא יקח ליצחק אשה מבנות הכנעני, אלא אם כן ילך קודם אל בית אביו ואל משפחתו, והאשה משם לא תרצה ללכת אחריו.", "note": "", "points": [{"q": "מָה הָיוּ שְׁתֵּי הוֹרָאוֹתָיו שֶׁל אַבְרָהָם בְּעִנְיַן מְצִיאַת אִשָּׁה לְיִצְחָק?", "options": ["לֹא תִקַּח אִשָּׁה כְּנַעֲנִית, וְלֵךְ אֶל בֵּית אָבִי", "לֹא תִקַּח אִשָּׁה כְּנַעֲנִית, וְהִשָּׁאֵר בָּאָרֶץ", "לֵךְ לְמִצְרַיִם וּמְצָא שָׁם אִשָּׁה"], "kasha": "מַדּוּעַ מְפָרֵט הַפָּסוּק גַּם צִוּוּי שְׁלִילִי וְגַם חִיּוּבִי?", "answer": "אַבְרָהָם תְּחִלָּה פָּסַל אֶת הַכְּנַעֲנִים, וְאַחַר כָּךְ כִּוֵּן אֶת אֱלִיעֶזֶר בְּפֵרוּשׁ אֶל מִשְׁפַּחְתּוֹ שֶׁלּוֹ.", "kp": ["לא תקח אשה לבני", "תחלה אל בית אבי"]}]}, {"id": "24:39.1", "ch": 24, "v": 39, "n": 1, "dh": "אלי", "pasuk_html": "וָאֹמַ֖ר אֶל־אֲדֹנִ֑י <mark>אֻלַ֛י</mark> לֹא־תֵלֵ֥ךְ הָאִשָּׁ֖ה אַחֲרָֽי׃", "pasuk_en": "אֵלַי", "rashi_he": "אלי לא תלך האשה. אלי כְּתִיב, בַּת הָיְתָה לוֹ לֶאֱלִיעֶזֶר, וְהָיָה מְחַזֵּר לִמְצֹא עִלָּה שֶׁיֹּאמַר לוֹ אַבְרָהָם לִפְנוֹת אֵלָיו לְהַשִּׂיאוֹ בִּתּוֹ, אָמַר לוֹ אַבְרָהָם בְּנִי בָרוּךְ וְאַתָּה אָרוּר וְאֵין אָרוּר מִדַּבֵּק בְּבָרוּךְ:", "rashi_en": "המילה אולי כתובה בלי ו, כך שאפשר לקרוא אותה אלי. לאליעזר היתה בת, והוא חיפש סיבה שאברהם יאמר לו לפנות אליו כדי להשיא את בתו ליצחק, אבל אברהם אמר לו: בני ברוך ואתה ארור, וארור אינו מתחבר עם ברוך.", "note": "", "points": [{"q": "מַה הַמַּשְׁמָעוּת הַנִּסְתֶּרֶת שֶׁמּוֹצֵא רַשִׁ\"י בַּמִּלָּה אֵלַי?", "options": ["הַמִּלָּה נִכְתְּבָה חָסֵר בְּלִי וָא\"ו, כָּךְ שֶׁאֶפְשָׁר לִקְרֹא 'אֻלַי' — רֶמֶז שֶׁאֱלִיעֶזֶר רָצָה אֶת בִּתּוֹ שֶׁלּוֹ לְיִצְחָק", "זֶה מְרַמֵּז שֶׁאֱלִיעֶזֶר פָּקַק בְּתָכְנִית ה'", "מַשְׁמָעוּתוֹ שֶׁאֱלִיעֶזֶר נִסָּה אֶת אֱמוּנָתוֹ שֶׁל אַבְרָהָם"], "kasha": "מַדּוּעַ נִכְתְּבָה 'אוּלַי' חָסֵר בְּלִי הַוָּא\"ו?", "answer": "הַכְּתִיב מְאַפְשֵׁר לִקְרֹא 'אֵלַי', וּמְגַלֶּה אֶת תִּקְוָתוֹ הַנִּסְתֶּרֶת שֶׁל אֱלִיעֶזֶר שֶׁאַבְרָהָם יִשְׁקֹל אֶת בִּתּוֹ שֶׁלּוֹ לְיִצְחָק.", "kp": ["אלי כתיב, בת היתה לו לאליעזר", "והיה מחזר למצא עלה"]}]}, {"id": "24:42.1", "ch": 24, "v": 42, "n": 1, "dh": "ואבא היום", "pasuk_html": "<mark>וָאָבֹ֥א הַיּ֖וֹם</mark> אֶל־הָעָ֑יִן וָאֹמַ֗ר יְהֹוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣י אַבְרָהָ֔ם אִם־יֶשְׁךָ־נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽיהָ׃", "pasuk_en": "וָאָבֹא הַיּוֹם", "rashi_he": "ואבא היום. הַיּוֹם יָצָאתִי וְהַיּוֹם בָּאתִי, מִכָּאן שֶׁקָּפְצָה לוֹ הָאָרֶץ. אָמַר רַבִּי אֲחָא יָפָה שִׂיחָתָן שֶׁל עַבְדֵי אָבוֹת לִפְנֵי הַמָּקוֹם מִתּוֹרָתָן שֶׁל בָּנִים, שֶׁהֲרֵי פָּרָשָׁה שֶׁל אֱלִיעֶזֶר כְּפוּלָה בַּתּוֹרָה וְהַרְבֵּה גּוּפֵי תוֹרָה לֹא נִתְּנוּ אֶלָּא בִּרְמִיזָה (בראשית רבה):", "rashi_en": "אליעזר אמר שהיום יצא לדרך והיום הגיע, ומכאן שהדרך התקצרה לו בנס (קפצה לו הארץ). ורבי אחא אמר שהשיחה של עבדי האבות חביבה לפני הקב\"ה יותר מהתורה של הבנים, שהרי סיפור אליעזר נכתב בתורה פעמיים, ואילו הרבה דינים חשובים בתורה נלמדו רק מרמז קטן.", "note": "", "points": [{"q": "אֵיזֶה נֵס לוֹמֵד רַשִׁ\"י מִמַּה שֶּׁאָמַר אֱלִיעֶזֶר 'וָאָבֹא הַיּוֹם'?", "options": ["קָפְצָה לוֹ הָאָרֶץ וְהִגִּיעַ בְּאוֹתוֹ יוֹם שֶׁיָּצָא", "מַלְאָךְ נְשָׂאוֹ בָּאֲוִיר", "גְּמַלָּיו רָצוּ בִּמְהִירוּת עֶלְיוֹנָה"], "kasha": "מַדּוּעַ מַדְגִּישׁ אֱלִיעֶזֶר 'הַיּוֹם'?", "answer": "הוּא יָצָא וְהִגִּיעַ בְּאוֹתוֹ יוֹם — הַדֶּרֶךְ הִתְקַצְּרָה לוֹ בְּנֵס (קְפִיצַת הַדֶּרֶךְ).", "kp": ["היום יצאתי והיום באתי", "מכאן שקפצה לו הארץ"]}, {"q": "מָה אָמַר רַבִּי אַחָא עַל שִׂיחָתָם שֶׁל עַבְדֵי הָאָבוֹת?", "options": ["שִׂיחָתָם הָרְגִילָה חֲשׁוּבָה יוֹתֵר מִתּוֹרַת בְּנֵיהֶם", "דִּבְרֵיהֶם צְרִיכִים לְהִלָּמֵד כַּהֲלָכָה", "דִּבּוּרָם הָיָה נְבוּאָה בְּהַשְׁרָאָה אֱלֹהִית"], "kasha": "מַדּוּעַ חוֹזֶרֶת הַתּוֹרָה עַל סִפּוּרוֹ שֶׁל אֱלִיעֶזֶר בִּפְרוֹטְרוֹט כָּל כָּךְ?", "answer": "רַבִּי אַחָא לִמֵּד שֶׁשִּׂיחָתָם הָרְגִילָה שֶׁל עַבְדֵי אָבוֹת חֲבִיבָה לִפְנֵי הַמָּקוֹם יוֹתֵר מִתּוֹרָתָם שֶׁל בָּנִים, וְלָכֵן נִכְתְּבָה בַּאֲרִיכוּת.", "kp": ["יפה שיחתן של עבדי אבות", "מתורתן של בנים"]}]}, {"id": "24:44.1", "ch": 24, "v": 44, "n": 1, "dh": "גם אתה", "pasuk_html": "וְאָמְרָ֤ה אֵלַי֙ <mark>גַּם־אַתָּ֣ה</mark> שְׁתֵ֔ה וְגַ֥ם לִגְמַלֶּ֖יךָ אֶשְׁאָ֑ב הִ֣וא הָֽאִשָּׁ֔ה אֲשֶׁר־הֹכִ֥יחַ יְהֹוָ֖ה לְבֶן־אֲדֹנִֽי׃", "pasuk_en": "גַּם אַתָּה", "rashi_he": "גם אתה. גַּם לְרַבּוֹת אֲנָשִׁים שֶׁעִמּוֹ:", "rashi_en": "המילה גם בא לרבות, כלומר רבקה התכוונה להשקות גם את האנשים שהיו עם אליעזר.", "note": "", "points": [{"q": "מָה מְלַמֵּד הַשִּׁמּוּשׁ שֶׁל רִבְקָה בַּמִּלָּה 'גַּם־'?", "options": ["הִיא כָּלְלָה בַּהַצָּעָתָהּ גַּם אֶת הָאֲנָשִׁים שֶׁלָּוּוּ אֶת אֱלִיעֶזֶר", "הִיא הֶצִּיעָה לְהַשְׁקוֹת גַּם אֶת גְּמַלֵּי אֱלִיעֶזֶר", "הִיא בִּקְּשָׁה מֵאֱלִיעֶזֶר גַּם לִשְׁתּוֹת מִן הַבְּאֵר"], "kasha": "מַדּוּעַ אָמְרָה 'גַּם אַתָּה' בִּמְקוֹם פָּשׁוּט לְהַצִּיעַ מַיִם?", "answer": "הַמִּלָּה 'גַּם' מְלַמֶּדֶת שֶׁהִרְחִיבָה אֶת הַצָּעָתָהּ מֵעֵבֶר לַגְּמַלִּים, לִכְלֹל גַּם אֶת הָאֲנָשִׁים שֶׁנָּסְעוּ עִם אֱלִיעֶזֶר.", "kp": ["גם לרבות אנשים שעמו"]}]}, {"id": "24:44.2", "ch": 24, "v": 44, "n": 2, "dh": "הכיח", "pasuk_html": "וְאָמְרָ֤ה אֵלַי֙ גַּם־אַתָּ֣ה שְׁתֵ֔ה וְגַ֥ם לִגְמַלֶּ֖יךָ אֶשְׁאָ֑ב הִ֣וא הָֽאִשָּׁ֔ה אֲשֶׁר־<mark>הֹכִ֥יחַ</mark> יְהֹוָ֖ה לְבֶן־אֲדֹנִֽי׃", "pasuk_en": "הֹכִיחַ", "rashi_he": "הוכיח. בֵּרֵר וְהוֹדִיעַ, וְכֵן כָּל הוֹכָחָה שֶׁבַּמִּקְרָא בֵּרוּר דָּבָר:", "rashi_en": "הוכיח פירושו בירר והודיע, וכן כל לשון הוכחה במקרא פירושו בירור של דבר.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ הַמִּלָּה 'הֹכִיחַ' לְפִי רַשִׁ\"י?", "options": ["בֵּרֵר וְיִעֵד — צוּרַת הִפְעִיל שֶׁל יכ\"ח, בְּמַשְׁמָעוּת לְהַבְהִיר", "הוֹכִיחַ — מִשֹּׁרֶשׁ שֶׁמַּשְׁמָעוּתוֹ תּוֹכָחָה", "הֵבִיא רְאָיָה — מִשֹּׁרֶשׁ שֶׁמַּשְׁמָעוּתוֹ הוֹכָחָה"], "kasha": "מַהִי הַצּוּרָה הַדִּקְדּוּקִית וְהַמַּשְׁמָעוּת שֶׁל מִלָּה יוֹצֵאת דֹּפֶן זוֹ?", "answer": "זוֹהִי צוּרַת הִפְעִיל שֶׁל יכ\"ח, בְּמַשְׁמָעוּת לְבָרֵר וּלְיַעֵד, כְּלוֹמַר לְהַבְהִיר וּלְוַדֵּא.", "kp": ["ברר והודיע"]}]}, {"id": "24:45.1", "ch": 24, "v": 45, "n": 1, "dh": "טרם אכלה", "pasuk_html": "אֲנִי֩ <mark>טֶ֨רֶם אֲכַלֶּ֜ה</mark> לְדַבֵּ֣ר אֶל־לִבִּ֗י וְהִנֵּ֨ה רִבְקָ֤ה יֹצֵאת֙ וְכַדָּ֣הּ עַל־שִׁכְמָ֔הּ וַתֵּ֥רֶד הָעַ֖יְנָה וַתִּשְׁאָ֑ב וָאֹמַ֥ר אֵלֶ֖יהָ הַשְׁקִ֥ינִי נָֽא׃", "pasuk_en": "טֶרֶם אֲכַלֶּה", "rashi_he": "טרם אכלה. טֶרֶם שֶׁאֲנִי מְכַלֶּה, וְכֵן כָּל לְשׁוֹן הוֹוֶה, פְּעָמִים שֶׁהוּא מְדַבֵּר בִּלְשׁוֹן עָבָר וְיָכוֹל לִכְתֹּב טֶרֶם כִּלִּיתִי, וּפְעָמִים שֶׁמְּדַבֵּר בִּלְשׁוֹן עָתִיד, כְּמוֹ כִּי אָמַר אִיּוֹב, הֲרֵי לְשׁוֹן עָבָר, כָּכָה יַעֲשֶׂה אִיּוֹב (איוב א'), הֲרֵי לְשׁוֹן עָתִיד, וּפֵרוּשׁ שְׁנֵיהֶם לְשׁוֹן הוֹוֶה, כִּי אוֹמֵר הָיָה אִיּוֹב אוּלַי חָטְאוּ בָנַי וגו', וְהָיָה עוֹשֶׁה כָּךְ:", "rashi_en": "טרם אכלה פירושו לפני שאני מסיים, בזמן הווה. הכתוב מתאר דבר שקורה עכשיו לפעמים בלשון עבר ולפעמים בלשון עתיד, כמו אצל איוב: כי אמר איוב בלשון עבר, וככה יעשה איוב בלשון עתיד, ופירוש שניהם הוא הווה: איוב היה אומר אולי חטאו בני, והיה עושה כך.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ\"י אֶת הַזְּמַן שֶׁל 'טֶרֶם אֲכַלֶּה' (בְּטֶרֶם סִיַּמְתִּי)?", "options": ["מַשְׁמָעוּתוֹ 'עֲדַיִן לֹא סִיַּמְתִּי' — הַכָּתוּב מִשְׁתַּמֵּשׁ לִפְעָמִים בְּעָבָר וּלְפְעָמִים בְּעָתִיד לְאֵרוּעִים שֶׁקָּרוּ בּוֹ זְמַנִּית", "מַשְׁמָעוּתוֹ שֶׁסִּיֵּם אֶת תְּפִלָּתוֹ הַרְבֵּה לִפְנֵי שֶׁהִגִּיעָה רִבְקָה", "זֶהוּ לְשׁוֹן עָתִיד הַמּוֹרֶה שֶׁמֵּעוֹלָם לֹא סִיֵּם אֶת תְּפִלָּתוֹ"], "kasha": "מַדּוּעַ נִרְאֶה שֶׁהַפָּסוּק מְעָרֵב זְמַנִּים?", "answer": "רַשִׁ\"י מְפָרֵשׁ שֶׁהַכָּתוּב מִשְׁתַּמֵּשׁ לִפְעָמִים בִּלְשׁוֹן עָבָר וּלִפְעָמִים בִּלְשׁוֹן עָתִיד לְמַעֲשִׂים שֶׁקָּרוּ בְּאוֹתוֹ זְמַן.", "kp": ["טרם שאני מכלה", "פעמים שהוא מדבר בלשון עבר", "ופרוש שניהם לשון הווה"]}]}, {"id": "24:47.1", "ch": 24, "v": 47, "n": 1, "dh": "ואשאל...ואשם", "pasuk_html": "<mark>וָאֶשְׁאַ֣ל</mark> אֹתָ֗הּ וָאֹמַר֮ בַּת־מִ֣י אַתְּ֒ וַתֹּ֗אמֶר בַּת־בְּתוּאֵל֙ בֶּן־נָח֔וֹר אֲשֶׁ֥ר יָֽלְדָה־לּ֖וֹ מִלְכָּ֑ה <mark>וָאָשִׂ֤ם</mark> הַנֶּ֙זֶם֙ עַל־אַפָּ֔הּ וְהַצְּמִידִ֖ים עַל־יָדֶֽיהָ׃", "pasuk_en": "וָאֶשְׁאַל... וָאָשִׂם", "rashi_he": "ואשאל. ואשם. שִׁנָּה הַסֵּדֶר, שֶׁהֲרֵי הוּא תְּחִלָּה נָתַן וְאַחַר כָּךְ שָׁאַל, אֶלָּא שֶׁלֹּא יִתְפְּשׂוּהוּ בִּדְבָרָיו וְיֹאמְרוּ הַאֵיךְ נָתַתָּ לָהּ וַעֲדַיִן אֵינְךָ יוֹדֵעַ מִי הִיא:", "rashi_en": "אליעזר שינה את סדר הדברים כשסיפר, כי באמת הוא קודם נתן את התכשיטים ואחר כך שאל מי היא. הוא שינה כדי שלא יתפסו אותו בדבריו ויאמרו: איך נתת לה מתנות כשעדיין לא ידעת מי היא.", "note": "", "points": [{"q": "מַדּוּעַ שִׁנָּה אֱלִיעֶזֶר אֶת סֵדֶר הָאֵרוּעוֹת כְּשֶׁסִּפֵּר מֵחָדָשׁ אֶת הַסִּפּוּר לְלָבָן?", "options": ["אָמַר שֶׁשָּׁאַל תְּחִלָּה מִי הִיא וְאַחַר כָּךְ נָתַן מַתָּנוֹת — כְּדֵי שֶׁלֹּא יִתְפְּסוּ אוֹתוֹ שֶׁנָּתַן מַתָּנוֹת לִפְנֵי שֶׁיָּדַע מִי הִיא", "שָׁכַח אֶת הַסֵּדֶר הָאֲמִתִּי שֶׁל הָאֵרוּעוֹת", "רָצָה לְהַדְגִּישׁ תְּחִלָּה אֶת נְדִיבוּתָהּ שֶׁל רִבְקָה"], "kasha": "בַּסִּפּוּר הַמְּקוֹרִי, אֱלִיעֶזֶר נָתַן אֶת הַתַּכְשִׁיטִים לִפְנֵי שֶׁשָּׁאַל מִי הִיא. מַדּוּעַ הָפַךְ אֶת הַסֵּדֶר?", "answer": "שִׁנָּה אֶת הַסֵּדֶר כְּדֵי שֶׁלָּבָן וּבְתוּאֵל לֹא יִתְפְּסוּהוּ בְּסְתִירָה — נְתִינַת מַתָּנוֹת לִפְנֵי שֶׁיָּדַע מִי הִיא הָיְתָה נִרְאֵית פְּזִיזוּת.", "kp": ["שנה הסדר", "הוא תחלה נתן ואחר כך שאל", "ויאמרו האיך נתת לה"]}]}, {"id": "24:49.1", "ch": 24, "v": 49, "n": 1, "dh": "על ימין", "pasuk_html": "וְ֠עַתָּ֠ה אִם־יֶשְׁכֶ֨ם עֹשִׂ֜ים חֶ֧סֶד וֶֽאֱמֶ֛ת אֶת־אֲדֹנִ֖י הַגִּ֣ידוּ לִ֑י וְאִם־לֹ֕א הַגִּ֣ידוּ לִ֔י וְאֶפְנֶ֥ה <mark>עַל־יָמִ֖ין</mark> א֥וֹ עַל־שְׂמֹֽאל׃", "pasuk_en": "עַל יָמִין", "rashi_he": "על ימין. מִבְּנוֹת יִשְׁמָעֵאל:", "rashi_en": "אפנה על ימין פירושו שאקח אשה ליצחק מבנות ישמעאל.", "note": "", "points": [{"q": "אִם לָבָן מְסָרֵב, לְמִי מִתְיַחֵס 'פְּנִיָּה לַיָּמִין'?", "options": ["בְּנוֹת יִשְׁמָעֵאל", "בְּנוֹת לוֹט", "בְּנוֹת פַּרְעֹה"], "kasha": "מָה מַשְׁמָעוּת 'יָמִין' וּ'שְׂמֹאל' בְּהֶקְשֵׁר שֶׁל מְצִיאַת אִשָּׁה?", "answer": "פְּנִיָּה לַיָּמִין מַשְׁמָעָהּ חִפּוּשׂ אִשָּׁה מִבְּנוֹת יִשְׁמָעֵאל.", "kp": ["מבנות ישמעאל"]}]}, {"id": "24:49.2", "ch": 24, "v": 49, "n": 2, "dh": "על שמאל", "pasuk_html": "וְ֠עַתָּ֠ה אִם־יֶשְׁכֶ֨ם עֹשִׂ֜ים חֶ֧סֶד וֶֽאֱמֶ֛ת אֶת־אֲדֹנִ֖י הַגִּ֣ידוּ לִ֑י וְאִם־לֹ֕א הַגִּ֣ידוּ לִ֔י וְאֶפְנֶ֥ה עַל־יָמִ֖ין א֥וֹ <mark>עַל־שְׂמֹֽאל׃</mark>", "pasuk_en": "עַל שְׂמֹאל", "rashi_he": "על שמאל. מִבְּנוֹת לוֹט, שֶׁהָיָה יוֹשֵׁב לִשְׂמֹאלוֹ שֶׁל אַבְרָהָם:", "rashi_en": "אפנה על שמאל פירושו שאקח אשה מבנות לוט, שהיה יושב בצד שמאל של אברהם.", "note": "", "points": [{"q": "לְמִי מִתְיַחֶסֶת 'פְּנִיָּה לַשְּׂמֹאל'?", "options": ["בְּנוֹת לוֹט, שֶׁיָּשַׁב מִשְּׂמֹאלוֹ שֶׁל אַבְרָהָם", "בְּנוֹת יִשְׁמָעֵאל", "נָשִׁים מֵחָרָן"], "kasha": "מַדּוּעַ לוֹט מְזֹהֶה עִם הַשְּׂמֹאל?", "answer": "לוֹט הִתְיַשֵּׁב מִשְּׂמֹאלוֹ שֶׁל אַבְרָהָם כְּשֶׁנִּפְרְדוּ, וְלָכֵן צֶאֱצָאָיו נִקְרָאִים 'הַשְּׂמֹאל'.", "kp": ["מבנות לוט", "שהיה יושב לשמאלו של אברהם"]}]}, {"id": "24:50.1", "ch": 24, "v": 50, "n": 1, "dh": "ויען לבן ובתואל", "pasuk_html": "<mark>וַיַּ֨עַן לָבָ֤ן וּבְתוּאֵל֙</mark> וַיֹּ֣אמְר֔וּ מֵיְהֹוָ֖ה יָצָ֣א הַדָּבָ֑ר לֹ֥א נוּכַ֛ל דַּבֵּ֥ר אֵלֶ֖יךָ רַ֥ע אוֹ־טֽוֹב׃", "pasuk_en": "וַיַּעַן לָבָן וּבְתוּאֵל", "rashi_he": "ויען לבן ובתואל. רָשָׁע הָיָה, וְקָפַץ לְהָשִׁיב לִפְנֵי אָבִיו:", "rashi_en": "לבן נזכר לפני אביו בתואל, כי לבן היה רשע ומיהר לענות לפני אביו.", "note": "", "points": [{"q": "מַדּוּעַ נִזְכָּר לָבָן לִפְנֵי אָבִיו בְּתוּאֵל בַּפָּסוּק?", "options": ["לָבָן הָיָה רָשָׁע וּמִהֵר לַעֲנוֹת לִפְנֵי אָבִיו", "לָבָן הָיָה הָאָח הַבְּכוֹר וְהָיְתָה לוֹ סַמְכוּת", "בְּתוּאֵל כְּבָר נָתַן אֶת הַסְכָּמָתוֹ בִּפְרָטִיּוּת"], "kasha": "זוֹ חֻצְפָּה שֶׁבֵּן יְדַבֵּר לִפְנֵי אָבִיו. מַדּוּעַ לָבָן מוּזְכָּר רִאשׁוֹן?", "answer": "רַשִׁ\"י אוֹמֵר שֶׁלָּבָן הָיָה רָשָׁע — הוּא קָפַץ לַעֲנוֹת לִפְנֵי שֶׁאָבִיו הִסְפִּיק לְדַבֵּר.", "kp": ["רשע היה", "וקפץ להשיב לפני אביו"]}]}, {"id": "24:50.2", "ch": 24, "v": 50, "n": 2, "dh": "לא נוכל דבר אליך", "pasuk_html": "וַיַּ֨עַן לָבָ֤ן וּבְתוּאֵל֙ וַיֹּ֣אמְר֔וּ מֵיְהֹוָ֖ה יָצָ֣א הַדָּבָ֑ר <mark>לֹ֥א נוּכַ֛ל דַּבֵּ֥ר אֵלֶ֖יךָ</mark> רַ֥ע אוֹ־טֽוֹב׃", "pasuk_en": "לֹא נוּכַל דַּבֵּר אֵלֶיךָ", "rashi_he": "לא נוכל דבר אליך. לְמָאֵן בַּדָּבָר הַזְֶּה לֹא עַל יְדֵי תְשׁוּבַת דָּבָר רַע וְלֹא עַל יְדֵי תְשׁוּבַת דָּבָר הָגוּן, וְנִכָּר שֶׁמֵּה' יָצָא הַדָּבָר, לְפִי דְּבָרֶיךָ שֶׁזִּמְּנָהּ לְךָ (בראשית רבה):", "rashi_en": "לא נוכל דבר אליך פירושו שאין ביכולתנו לסרב לדבר הזה, לא בתשובה רעה ולא בתשובה הגונה ומנומקת, כי ברור שהדבר יצא מה', לפי מה שסיפרת שה' זימן אותה לך.", "note": "", "points": [{"q": "מָה הִתְכַּוְּנוּ לָבָן וּבְתוּאֵל בְּ'לֹא נוּכַל דַּבֵּר אֵלֶיךָ'?", "options": ["אֵין בְּיָדֵנוּ לְסָרֵב, שֶׁהַדָּבָר בָּרוּר שֶׁבָּא מֵה'", "אָנוּ צְרִיכִים עוֹד זְמַן לְהִתְיַעֵץ", "אָנוּ הֲמוּמִים מִדַּי כְּדֵי לְהָגִיב"], "kasha": "מַדּוּעַ אָמְרוּ 'לֹא נוּכַל דַּבֵּר' בִּמְקוֹם פָּשׁוּט לְהַסְכִּים?", "answer": "הוֹדוּ שֶׁאִי אֶפְשָׁר לְסָרֵב כִּי ה' בְּבֵרוּר סִדֵּר אֶת הַשִּׁדּוּךְ.", "kp": ["לא נוכל דבר אליך", "ונכר שמה' יצא הדבר"]}]}, {"id": "24:52.1", "ch": 24, "v": 52, "n": 1, "dh": "וישתחו ארצה", "pasuk_html": "וַיְהִ֕י כַּאֲשֶׁ֥ר שָׁמַ֛ע עֶ֥בֶד אַבְרָהָ֖ם אֶת־דִּבְרֵיהֶ֑ם <mark>וַיִּשְׁתַּ֥חוּ אַ֖רְצָה</mark> לַֽיהֹוָֽה׃", "pasuk_en": "וַיִּשְׁתַּחוּ אַרְצָה", "rashi_he": "וישתחו ארצה. מִכָּאן שֶׁמּוֹדִים עַל בְּשׂוֹרָה טוֹבָה:", "rashi_en": "אליעזר השתחווה לה' כששמע שהסכימו, ומכאן לומדים שמודים לה' על בשורה טובה.", "note": "", "points": [{"q": "מָה לוֹמְדִים מִכָּךְ שֶׁאֱלִיעֶזֶר הִשְׁתַּחֲוָה אַרְצָה?", "options": ["צָרִיךְ אָדָם לְהוֹדוֹת לַה' כְּשֶׁשּׁוֹמֵעַ בְּשׂוֹרָה טוֹבָה", "עֶבֶד חַיָּב תָּמִיד לְהִשְׁתַּחֲווֹת לִפְנֵי קְרוֹבֵי אֲדוֹנָיו", "הַשְׁתַּחֲוָיָה נִדְרֶשֶׁת לִפְנֵי הַשְׁלָמַת עִסְקָה"], "kasha": "מַדּוּעַ מַזְכִּירָה הַתּוֹרָה הִשְׁתַּחֲוָיָה זוֹ?", "answer": "לוֹמְדִים מִכָּאן שֶׁצָּרִיךְ אָדָם לְהוֹדוֹת לַה' כְּשֶׁמְּקַבֵּל בְּשׂוֹרוֹת טוֹבוֹת.", "kp": ["מכאן שמודים על בשורה טובה"]}]}, {"id": "24:53.1", "ch": 24, "v": 53, "n": 1, "dh": "ומגדנות", "pasuk_html": "וַיּוֹצֵ֨א הָעֶ֜בֶד כְּלֵי־כֶ֨סֶף וּכְלֵ֤י זָהָב֙ וּבְגָדִ֔ים וַיִּתֵּ֖ן לְרִבְקָ֑ה <mark>וּמִ֨גְדָּנֹ֔ת</mark> נָתַ֥ן לְאָחִ֖יהָ וּלְאִמָּֽהּ׃", "pasuk_en": "וּמִגְדָּנוֹת", "rashi_he": "ומגדנות. לְשׁוֹן מְגָדִים, שֶׁהֵבִיא עִמּוֹ מִינֵי פֵּרוֹת שֶׁל אֶרֶץ יִשְׂרָאֵל:", "rashi_en": "מגדנות הוא לשון מגדים, כלומר פירות משובחים, כי אליעזר הביא איתו מיני פירות של ארץ ישראל.", "note": "", "points": [{"q": "מָה הֵן הַ'מִגְדָּנוֹת' שֶׁנָּתַן אֱלִיעֶזֶר?", "options": ["פֵּרוֹת יְקָרִים מֵאֶרֶץ יִשְׂרָאֵל — מִלָּשׁוֹן 'מְגָדִים' (פֵּרוֹת מְשֻׁבָּחִים)", "תַּכְשִׁיטֵי זָהָב וְכֶסֶף", "בְּשָׂמִים וּרְקָחִים מִן הַמִּזְרָח"], "kasha": "מַה מַּשְׁמָעוּת מִלָּה יוֹצֵאת דֹּפֶן זוֹ?", "answer": "רַשִׁ\"י מְקַשֵּׁר 'מִגְדָּנוֹת' לְ'מְגָדִים' (פֵּרוֹת יְקָרִים), וְאוֹמֵר שֶׁאֱלִיעֶזֶר הֵבִיא מִינֵי פֵּרוֹת מֵאֶרֶץ יִשְׂרָאֵל.", "kp": ["לשון מגדים", "מיני פרות של ארץ ישראל"]}]}, {"id": "24:54.1", "ch": 24, "v": 54, "n": 1, "dh": "וילינו", "pasuk_html": "וַיֹּאכְל֣וּ וַיִּשְׁתּ֗וּ ה֛וּא וְהָאֲנָשִׁ֥ים אֲשֶׁר־עִמּ֖וֹ <mark>וַיָּלִ֑ינוּ</mark> וַיָּק֣וּמוּ בַבֹּ֔קֶר וַיֹּ֖אמֶר שַׁלְּחֻ֥נִי לַֽאדֹנִֽי׃", "pasuk_en": "וַיָּלִינוּ", "rashi_he": "וילינו. כָּל לִינָה שֶׁבַּמִּקְרָא לִינַת לַיְלָה אֶחָד:", "rashi_en": "כל לשון לינה במקרא פירושו שהייה של לילה אחד.", "note": "", "points": [{"q": "מָה מְרַמֵּז הַשֹּׁרֶשׁ לי\"ן עַל שְׁהִיָּתָם?", "options": ["שָׁהוּ לַיְלָה אֶחָד בִּלְבַד", "שָׁהוּ כַּמָּה יָמִים", "שָׁהוּ עַד תְּפִלַּת שַׁחֲרִית"], "kasha": "מַדּוּעַ מִשְׁתַּמֵּשׁ בְּמִלָּה מְסֻיֶּמֶת זוֹ לְלִינַת לַיְלָה?", "answer": "הַשֹּׁרֶשׁ לי\"ן מַשְׁמָעוּתוֹ לִינָה שֶׁל לַיְלָה אֶחָד בִּלְבַד.", "kp": ["כל לינה שבמקרא לינת לילה אחד"]}]}, {"id": "24:55.1", "ch": 24, "v": 55, "n": 1, "dh": "ויאמר אחיה ואמה", "pasuk_html": "<mark>וַיֹּ֤אמֶר אָחִ֙יהָ֙ וְאִמָּ֔הּ</mark> תֵּשֵׁ֨ב הַנַּעֲרָ֥ אִתָּ֛נוּ יָמִ֖ים א֣וֹ עָשׂ֑וֹר אַחַ֖ר תֵּלֵֽךְ׃", "pasuk_en": "וַיֹּאמֶר אָחִיהָ וְאִמָּהּ", "rashi_he": "ויאמר אחיה ואמה. וּבְתוּאֵל הֵיכָן הָיָה? הָיָה רוֹצֶה לְעַכֵּב וּבָא מַלְאָךְ וֶהֱמִיתוֹ:", "rashi_en": "רש\"י שואל: למה רק אחיה ואמה דיברו, איפה היה בתואל? ומשיב שבתואל רצה לעכב את הנישואין, ובא מלאך והמית אותו.", "note": "", "points": [{"q": "מַדּוּעַ מַזְכִּיר הַפָּסוּק רַק אֶת אָחִיהָ וְאִמָּהּ, וְלֹא אֶת אָבִיהָ בְּתוּאֵל?", "options": ["בְּתוּאֵל נִסָּה לִמְנֹעַ אֶת הַנִּשּׂוּאִין וּמַלְאָךְ הֲרָגוֹ", "בְּתוּאֵל כְּבָר נָתַן הַסְכָּמָתוֹ וְעָזַב", "בְּתוּאֵל הָיָה זָקֵן מִדַּי לְהִשְׁתַּתֵּף בַּדִּיּוּן"], "kasha": "אֵיפֹה הָיָה בְּתוּאֵל? הוּא הָיָה נוֹכֵחַ קֹדֶם לָכֵן בַּסִּפּוּר.", "answer": "רַשִׁ\"י אוֹמֵר שֶׁבְּתוּאֵל בִּקֵּשׁ לְעַכֵּב אֶת הַנִּשּׂוּאִין, וּבָא מַלְאָךְ וַהֲרָגוֹ בַּלַּיְלָה.", "kp": ["היה רוצה לעכב", "ובא מלאך והמיתו"]}]}, {"id": "24:55.2", "ch": 24, "v": 55, "n": 2, "dh": "ימים", "pasuk_html": "וַיֹּ֤אמֶר אָחִ֙יהָ֙ וְאִמָּ֔הּ תֵּשֵׁ֨ב הַנַּעֲרָ֥ אִתָּ֛נוּ <mark>יָמִ֖ים</mark> א֣וֹ עָשׂ֑וֹר אַחַ֖ר תֵּלֵֽךְ׃", "pasuk_en": "יָמִים", "rashi_he": "ימים. שָׁנָה, כְּמוֹ יָמִים תִּהְיֶה גְאֻלָּתוֹ (ויקרא כ\"ה), שֶׁכָּךְ נוֹתְנִין לִבְתוּלָה זְמַן י\"ב חֹדֶש לְפַרְנֵס עַצְמָהּ בְּתַכְשִׁיטִים (כתובות נ\"ז):", "rashi_en": "ימים כאן פירושו שנה, כמו ימים תהיה גאלתו שפירושו שנה שלמה, כי המנהג היה לתת לבתולה שנים עשר חודש להכין לעצמה תכשיטים לפני החתונה.", "note": "", "points": [{"q": "כַּמָּה זְמַן מַשְׁמָעוּת 'יָמִים' כָּאן?", "options": ["שָׁנָה שְׁלֵמָה, כְּמוֹ בְּוַיִּקְרָא כה:כט — הַמִּנְהָג הָיָה שְׁנֵים עָשָׂר חֹדֶשׁ לְהַכָנַת נְדוּנְיַת בְּתוּלָה", "שִׁבְעָה יְמֵי חֲגִיגָה", "שְׁלֹשִׁים יוֹם שֶׁל הֲכָנָה"], "kasha": "מַדּוּעַ הָיוּ מְבַקְּשִׁים 'יָמִים' בִּלְבַד שֶׁל דְּחִיָּה?", "answer": "הַמִּלָּה 'יָמִים' כָּאן מַשְׁמָעָהּ שָׁנָה, כְּמוֹ בְּוַיִּקְרָא. הַמִּנְהָג הָיָה לָתֵת לַבְּתוּלָה שְׁנֵים עָשָׂר חֹדֶשׁ לְהָכִין אֶת נְדוּנְיָתָהּ.", "kp": ["שנה, כמו ימים תהיה גאלתו", "זמן י\"ב חדש לפרנס עצמה"]}]}, {"id": "24:55.3", "ch": 24, "v": 55, "n": 3, "dh": "או עשור", "pasuk_html": "וַיֹּ֤אמֶר אָחִ֙יהָ֙ וְאִמָּ֔הּ תֵּשֵׁ֨ב הַנַּעֲרָ֥ אִתָּ֛נוּ יָמִ֖ים <mark>א֣וֹ עָשׂ֑וֹר</mark> אַחַ֖ר תֵּלֵֽךְ׃", "pasuk_en": "אוֹ עָשׂוֹר", "rashi_he": "או עשור. י' חֳדָשִׁים; וְאִם תֹּאמַר יָמִים מַמָּשׁ, אֵין דֶּרֶך הַמְבַקְשִׁים לְבַקֵּש דָּבָר מֻעָט, וְאִם לֹא תִּרְצֶה תֵּן לָנוּ מְרֻבֶּה מִזֶּה:", "rashi_en": "או עשור פירושו עשרה חודשים. ואי אפשר לפרש ימים כפשוטו, כמה ימים, כי אין דרך המבקשים לבקש מעט ולומר: ואם לא תרצה, תן לנו יותר מזה.", "note": "", "points": [{"q": "מָה מַשְׁמָעוּת 'אוֹ עָשׂוֹר', וּמַדּוּעַ זֶה תָּמוּהַּ?", "options": ["עֲשָׂרָה חֳדָשִׁים — נִרְאֶה מוּזָר לְבַקֵּשׁ פָּחוֹת תְּחִלָּה וְאַחַר כָּךְ לְהַצִּיעַ יוֹתֵר כְּחֲלוּפָה", "עֲשָׂרָה יְמֵי מִשְׁתֶּה", "עֶשֶׂר מַתָּנוֹת לַכַּלָּה"], "kasha": "מַדּוּעַ מְבַקְּשִׁים שָׁנָה תְּחִלָּה וְאָז אוֹמְרִים 'אוֹ עָשׂוֹר'? בְּדֶרֶךְ כְּלָל מוֹרִידִים אֶת הַבַּקָּשָׁה, לֹא מַעֲלִים.", "answer": "רַשִׁ\"י מְפָרֵשׁ שֶׁ'אוֹ עָשׂוֹר' מַשְׁמָעוּתוֹ עֲשָׂרָה חֳדָשִׁים. אִי אֶפְשָׁר לְבַקֵּשׁ פָּחוֹת תְּחִלָּה וְאָז לוֹמַר 'אִם לֹא, תְּנוּ לָנוּ יוֹתֵר' — הַנִּסּוּחַ מַשְׁמָעוּתוֹ שֶׁמִּשָּׂאוּ וּמָתְנוּ כְּלַפֵּי מַטָּה.", "kp": ["י' חדשים", "אין דרך המבקשים לבקש דבר מעט", "ואם לא תרצה תן לנו"]}]}, {"id": "24:57.1", "ch": 24, "v": 57, "n": 1, "dh": "ונשאלה את פיה", "pasuk_html": "וַיֹּאמְר֖וּ נִקְרָ֣א לַֽנַּעֲרָ֑ <mark>וְנִשְׁאֲלָ֖ה אֶת־פִּֽיהָ׃</mark>", "pasuk_en": "וְנִשְׁאֲלָה אֶת פִּיהָ", "rashi_he": "ונשאלה את פיה. מִכָּאן שֶׁאֵין מַשִּׂיאִין אֶת הָאִשָּׁה אֶלָּא מִדַּעְתָּהּ (בראשית רבה):", "rashi_en": "מכאן שאין משיאים אשה אלא בהסכמתה, ולכן שאלו את רבקה אם היא רוצה ללכת.", "note": "", "points": [{"q": "אֵיזֶה עִקָּרוֹן הֲלָכָתִי לוֹמֵד רַשִׁ\"י מִשְּׁאֵלַת דַּעְתָּהּ שֶׁל רִבְקָה?", "options": ["אֵין מַשִּׂיאִין אֶת הָאִשָּׁה אֶלָּא מִדַּעְתָּהּ", "אִשָּׁה חַיֶּבֶת תָּמִיד לְהִתְיַעֵץ עִם אִמָּהּ לִפְנֵי נִשּׂוּאֶיהָ", "לְאִשָּׁה יֵשׁ זְכוּת לִבְחֹר אֶת מִקְצוֹעַ בַּעְלָהּ"], "kasha": "מַדּוּעַ הָיוּ צְרִיכִים לִשְׁאֹל אוֹתָהּ אִם הָאָב וְהָאָח כְּבָר הִסְכִּימוּ?", "answer": "מִכָּאן לוֹמְדִים שֶׁאֵין מַשִּׂיאִין אֶת הָאִשָּׁה אֶלָּא מִדַּעְתָּהּ.", "kp": "מכאן שאין משיאין את האשה אלא מדעתה"}]}, {"id": "24:58.1", "ch": 24, "v": 58, "n": 1, "dh": "ותאמר אלך", "pasuk_html": "וַיִּקְרְא֤וּ לְרִבְקָה֙ וַיֹּאמְר֣וּ אֵלֶ֔יהָ הֲתֵלְכִ֖י עִם־הָאִ֣ישׁ הַזֶּ֑ה <mark>וַתֹּ֖אמֶר אֵלֵֽךְ׃</mark>", "pasuk_en": "וַתֹּאמֶר אֵלֵךְ", "rashi_he": "ותאמר אלך. מֵעַצְמִי, וְאַף אִם אֵינְכֶם רוֹצִים:", "rashi_en": "רבקה אמרה שהיא תלך מרצונה, גם אם בני משפחתה אינם מסכימים.", "note": "", "points": [{"q": "מָה הַמְּיֻחָד בִּתְשׁוּבַת רִבְקָה 'אֵלֵךְ'?", "options": ["הִצְהִירָה שֶׁתֵּלֵךְ מֵרְצוֹנָהּ גַּם בְּלִי הַסְכָּמַת מִשְׁפַּחְתָּהּ", "אָמְרָה שֶׁתֵּלֵךְ רַק אִם תְּלַוֶּה אוֹתָהּ מֵינַקְתָּהּ", "הִסְכִּימָה בִּתְנַאי שֶׁאֱלִיעֶזֶר יִתֵּן עוֹד מַתָּנוֹת"], "kasha": "מַדּוּעַ עוֹנָה רִבְקָה בְּצוּרָה כָּל כָּךְ נֶחְרֶצֶת?", "answer": "רִבְקָה הִצְהִירָה שֶׁתֵּלֵךְ מֵרְצוֹנָהּ הַחָפְשִׁי, גַּם אִם מִשְׁפַּחְתָּהּ לֹא תַסְכִּים.", "kp": ["מעצמי", "ואף אם אינכם רוצים"]}]}, {"id": "24:60.1", "ch": 24, "v": 60, "n": 1, "dh": "את היי לאלפי רבבה", "pasuk_html": "וַיְבָרְכ֤וּ אֶת־רִבְקָה֙ וַיֹּ֣אמְרוּ לָ֔הּ אֲחֹתֵ֕נוּ <mark>אַ֥תְּ הֲיִ֖י לְאַלְפֵ֣י רְבָבָ֑ה</mark> וְיִירַ֣שׁ זַרְעֵ֔ךְ אֵ֖ת שַׁ֥עַר שֹׂנְאָֽיו׃", "pasuk_en": "אַתְּ הֲיִי לְאַלְפֵי רְבָבָה", "rashi_he": "את היי לאלפי רבבה. אַתְּ וְזַרְעֵךְ תְּקַבְּלוּ אוֹתָהּ בְּרָכָה שֶׁנֶּאֱמַר לְאַבְרָהָם בְּהַר הַמּוֹרִיָּה וְהַרְבָּה אַרְבֶּה אֶת זַרְעֲךָ וגו', יְהִי רָצוֹן שֶׁיְּהֵא אוֹתוֹ הַזֶּרַע מִמֵּךְ וְלֹא מֵאִשָּׁה אַחֶרֶת:", "rashi_en": "ברכו את רבקה שהיא וזרעה יקבלו את הברכה שנאמרה לאברהם בהר המוריה, \"הרבה ארבה את זרעך\". ויהי רצון שהזרע הזה ייצא ממנה ולא מאשה אחרת.", "note": "", "points": [{"q": "אֵיזוֹ בְּרָכָה הָיוּ חוֹזְרִים עָלֶיהָ כְּשֶׁאָמְרוּ 'אֶת הֲיִי לְאַלְפֵי רְבָבָה'?", "options": ["הַבְּרָכָה שֶׁנָּתַן ה' לְאַבְרָהָם בַּעֲקֵדָה — 'הַרְבָּה אַרְבֶּה אֶת זַרְעֵךְ'", "הַבְּרָכָה שֶׁנָּתַן יַעֲקֹב לְאֶפְרַיִם וּמְנַשֶּׁה בְּהֶמְשֵׁךְ", "הַבְּרָכָה שֶׁנָּתַן מֹשֶׁה לְשִׁבְטֵי יִשְׂרָאֵל"], "kasha": "מַדּוּעַ דַּוְקָא נֻסָּח בְּרָכָה זֶה?", "answer": "בֵּרְכוּ אוֹתָהּ שֶׁתְּקַבֵּל אֶת הַהַבְטָחָה שֶׁנָּתַן ה' לְאַבְרָהָם בָּעֲקֵדָה: שֶׁזַּרְעוֹ יִרְבֶּה מְאֹד.", "kp": ["שנאמר לאברהם בהר המוריה", "והרבה ארבה את זרעך"]}]}, {"id": "24:62.1", "ch": 24, "v": 62, "n": 1, "dh": "מבוא באר לחי ראי", "pasuk_html": "וְיִצְחָק֙ בָּ֣א <mark>מִבּ֔וֹא בְּאֵ֥ר לַחַ֖י רֹאִ֑י</mark> וְה֥וּא יוֹשֵׁ֖ב בְּאֶ֥רֶץ הַנֶּֽגֶב׃", "pasuk_en": "מִבּוֹא בְּאֵר לַחַי רֹאִי", "rashi_he": "מבוא באר לחי רואי. שֶׁהָלַךְ לְהָבִיא הָגָר לְאַבְרָהָם אָבִיו שֶׁיִּשָּׂאֶנָּה (בראשית רבה):", "rashi_en": "יצחק בא מבאר לחי רואי, כי הלך לשם כדי להביא את הגר אל אברהם אביו, שישא אותה לאשה.", "note": "", "points": [{"q": "מַדּוּעַ הָלַךְ יִצְחָק לִבְאֵר לַחַי רֹאִי?", "options": ["לְהָבִיא אֶת הָגָר כְּדֵי שֶׁאַבְרָהָם יִנְשָׂאֶנָּה שׁוּב", "לְהִתְפַּלֵּל לְיַד הַבְּאֵר שֶׁשָּׁם נִגְלָה מַלְאָךְ", "לִרְעוֹת אֶת צֹאנוֹ בְּמִרְעֶה סָמוּךְ"], "kasha": "מַה הָיָה לְיִצְחָק לַעֲשׂוֹת בְּמָקוֹם מְסֻיָּם זֶה?", "answer": "יִצְחָק הָלַךְ לִבְאֵר לַחַי רֹאִי לְהָבִיא אֶת הָגָר וּלְהַחֲזִירָהּ לְאַבְרָהָם כְּדֵי שֶׁיִּנְשָׂאֶנָּה שׁוּב.", "kp": ["שהלך להביא הגר לאברהם אביו"]}]}, {"id": "24:62.2", "ch": 24, "v": 62, "n": 2, "dh": "יושב בארץ הנגב", "pasuk_html": "וְיִצְחָק֙ בָּ֣א מִבּ֔וֹא בְּאֵ֥ר לַחַ֖י רֹאִ֑י וְה֥וּא <mark>יוֹשֵׁ֖ב בְּאֶ֥רֶץ הַנֶּֽגֶב׃</mark>", "pasuk_en": "יוֹשֵׁב בְּאֶרֶץ הַנֶּגֶב", "rashi_he": "יושב בארץ הנגב. קָרוֹב לְאוֹתוֹ בְּאֵר, שֶׁנֶּאֱמַר וַיִּסַּע מִשָּׁם אַבְרָהָם אַרְצָה הַנֶּגֶב וַיֵּשֶׁב בֵּין קָדֵשׁ וּבֵין שׁוּר (בראשית כ') וְשָׁם הָיָה הַבְּאֵר, שֶׁנֶּאֱמַר הִנֵּה בֵין קָדֵשׁ וּבֵין בָּרֶד (שם ט\"ז):", "rashi_en": "יצחק ישב בארץ הנגב, קרוב לאותה באר. כי אברהם ישב בנגב בין קדש ובין שור, ושם הייתה הבאר, שנאמר עליה \"הנה בין קדש ובין ברד\".", "note": "", "points": [{"q": "מַדּוּעַ יָשַׁב יִצְחָק בַּנֶּגֶב?", "options": ["גָּר בַּדָּרוֹם, סָמוּךְ לִבְאֵר לַחַי רֹאִי, שֶׁשָּׁם נָסַע אַבְרָהָם קֹדֶם לָכֵן", "רָעָה אֶת צֹאנוֹ בַּמִּדְבָּר", "הִסְתַּתֵּר מִן הַפְּלִשְׁתִּים"], "kasha": "מַדּוּעַ מְפָרֵט הַפָּסוּק אֶת הַנֶּגֶב?", "answer": "יִצְחָק גָּר בַּדָּרוֹם סָמוּךְ לִבְאֵר לַחַי רֹאִי, אוֹתוֹ אֵזוֹר שֶׁאַבְרָהָם נָסַע אֵלָיו (בְּרֵאשִׁית כ:א).", "kp": ["קרוב לאותו באר", "ויסע משם אברהם ארצה הנגב"]}]}, {"id": "24:63.1", "ch": 24, "v": 63, "n": 1, "dh": "לשוח", "pasuk_html": "וַיֵּצֵ֥א יִצְחָ֛ק <mark>לָשׂ֥וּחַ</mark> בַּשָּׂדֶ֖ה לִפְנ֣וֹת עָ֑רֶב וַיִּשָּׂ֤א עֵינָיו֙ וַיַּ֔רְא וְהִנֵּ֥ה גְמַלִּ֖ים בָּאִֽים׃", "pasuk_en": "לָשׂוּחַ", "rashi_he": "לשוח. לְשׁוֹן תְּפִלָּה (בראשית רבה), כְּמוֹ יִשְׁפֹּךְ שִׂיחוֹ (תהילים ק\"ב):", "rashi_en": "\"לשוח\" פירושו להתפלל, כמו \"ישפך שיחו\" בתהילים.", "note": "", "points": [{"q": "מָה אוֹמֵר רַשִׁ\"י שֶׁמַּשְׁמָעוּת 'לָשׂוּחַ'?", "options": ["לְהִתְפַּלֵּל — יִצְחָק תִּקֵּן אֶת תְּפִלַּת הַמִּנְחָה", "לִנְטֹעַ עֵצִים בַּשָּׂדֶה", "לְהִתְבּוֹנֵן בְּפִילוֹסוֹפְיָה"], "kasha": "הַמִּלָּה 'לָשׂוּחַ' אֵינָהּ רְגִילָה. בְּאֵיזוֹ פְּעֻלָּה עָסַק יִצְחָק?", "answer": "רַשִׁ\"י מְפָרֵשׁ שֶׁמַּשְׁמָעוּתָהּ תְּפִלָּה, בְּהִסְתַּמְּכוֹ עַל תְּהִלִּים קב:א. יִצְחָק בְּכָךְ תִּקֵּן אֶת תְּפִלַּת הַמִּנְחָה.", "kp": ["לשון תפלה", "כמו ישפך שיחו"]}]}, {"id": "24:64.1", "ch": 24, "v": 64, "n": 1, "dh": "ותרא את יצחק", "pasuk_html": "וַתִּשָּׂ֤א רִבְקָה֙ אֶת־עֵינֶ֔יהָ <mark>וַתֵּ֖רֶא אֶת־יִצְחָ֑ק</mark> וַתִּפֹּ֖ל מֵעַ֥ל הַגָּמָֽל׃", "pasuk_en": "וַתֵּרֶא אֶת יִצְחָק", "rashi_he": "ותרא את יצחק. רָאֲתָה אוֹתוֹ הָדוּר וְתוֹהָא מִפָּנָיו (בראשית רבה):", "rashi_en": "רבקה ראתה את הדרת פניו של יצחק ונבהלה ממנו.", "note": "", "points": [{"q": "מַדּוּעַ הֵגִיבָה רִבְקָה בְּחָזְקָה כְּשֶׁרָאֲתָה אֶת יִצְחָק?", "options": ["רָאֲתָה אֶת מַרְאֵהוּ הַמְּהֻדָּר וְהַנִּשְׂגָּב וְנִדְהֲמָה", "הִכִּירָה אוֹתוֹ מֵחֲלוֹם נְבוּאִי", "נִבְהֲלָה מִלְּבוּשׁוֹ הַיּוֹצֵא דֹפֶן"], "kasha": "מַה בְּמַרְאֵהוּ שֶׁל יִצְחָק גָּרַם לִתְגוּבָתָהּ?", "answer": "רָאֲתָה אֶת מַרְאֵהוּ הַנִּשְׂגָּב וְהַמְּהֻדָּר וְנִסְתַּכְּלָה בּוֹ בְּתִמָּהוֹן.", "kp": ["ראתה אותו הדור ותוהא מפניו"]}]}, {"id": "24:64.2", "ch": 24, "v": 64, "n": 2, "dh": "ותפל", "pasuk_html": "וַתִּשָּׂ֤א רִבְקָה֙ אֶת־עֵינֶ֔יהָ וַתֵּ֖רֶא אֶת־יִצְחָ֑ק <mark>וַתִּפֹּ֖ל</mark> מֵעַ֥ל הַגָּמָֽל׃", "pasuk_en": "וַתִּפֹּל", "rashi_he": "ותפל. הִשְׁמִיטָה עַצְמָהּ לָאָרֶץ, כְּתַרְגּוּמוֹ וְאִתְרְכִינַת, הִטְּתָה עַצְמָהּ לָאָרֶץ וְלֹא הִגִּיעָה עַד הַקַּרְקַע, כְּמוֹ הַטִּי נָא כַדֵּךְ, אַרְכִינִי, וַיֵּט שָׁמַיִם (תהילים י\"ח), וְאַרְכִּין, לְשׁוֹן מֻטֶּה לָאָרֶץ, וְדוֹמֶה לוֹ כִּי יִפֹּל לֹא יוּטָל (תהילים ל\"ז), כְּלוֹמַר אִם יִטֶּה לָאָרֶץ לֹא יַגִּיעַ עַד הַקַּרְקַע:", "rashi_en": "\"ותפל\" אין פירושו שנפלה ממש, אלא שהטתה את עצמה כלפי הארץ ולא הגיעה עד הקרקע, כמו שתרגם אונקלוס \"ואתרכינת\". וכן \"כי יפל לא יוטל\" פירושו שאם יטה לארץ, לא יגיע עד הקרקע.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ\"י אֶת 'וַתִּפֹּל' מֵעַל הַגָּמָל?", "options": ["נָטְתָה וְהִשְׁפִּילָה עַצְמָהּ כְּלַפֵּי הָאָרֶץ אַךְ לֹא הִגִּיעָה אֵלֶיהָ מַמָּשׁ — יָרְדָה בְּחֵן", "נָפְלָה מַמָּשׁ מִן הַגָּמָל וְנִפְגְּעָה", "קָפְצָה מַהֵר וְרָצָה לִקְרַאת יִצְחָק"], "kasha": "הַאִם נָפְלָה מַמָּשׁ לָאָרֶץ?", "answer": "רַשִׁ\"י אוֹמֵר שֶׁנָּטְתָה וְהִשְׁפִּילָה עַצְמָהּ כְּלַפֵּי הָאָרֶץ אַךְ לֹא הִגִּיעָה אֵלֶיהָ מַמָּשׁ — הַמִּלָּה מַשְׁמָעָהּ שֶׁיָּרְדָה, וְלֹא שֶׁנָּפְלָה.", "kp": ["הטתה עצמה לארץ", "ולא הגיעה עד הקרקע"]}]}, {"id": "24:65.1", "ch": 24, "v": 65, "n": 1, "dh": "ותתכס", "pasuk_html": "וַתֹּ֣אמֶר אֶל־הָעֶ֗בֶד מִֽי־הָאִ֤ישׁ הַלָּזֶה֙ הַהֹלֵ֤ךְ בַּשָּׂדֶה֙ לִקְרָאתֵ֔נוּ וַיֹּ֥אמֶר הָעֶ֖בֶד ה֣וּא אֲדֹנִ֑י וַתִּקַּ֥ח הַצָּעִ֖יף <mark>וַתִּתְכָּֽס׃</mark>", "pasuk_en": "וַתִּתְכָּס", "rashi_he": "ותתכס. לְשׁוֹן וַתִּתְפַּעֵל, כְּמוֹ וַתִּקָּבֵר וַתִּשָּׁבֵר:", "rashi_en": "המילה \"ותתכס\" היא לשון ותתפעל, כלומר היא נתכסתה, כמו המילים \"ותקבר\" ו\"ותשבר\".", "note": "", "points": [{"q": "מָה חָרִיג בַּצּוּרָה הַדִּקְדּוּקִית שֶׁל 'וַתִּתְכָּס' (הִתְכַּסְּתָה)?", "options": ["יֵשׁ לָהּ מַשְׁמָעוּת סָבִילָה — 'נִתְכַּסְּתָה' — בְּדוֹמֶה לְ'וַתִּקָּבֵר' (נִקְבְּרָה)", "זוֹהִי צוּרָה פָּעִילָה חוֹזֶרֶת הַמַּדְגִּישָׁה אֶת צְנִיעוּתָהּ", "זוֹהִי צוּרַת רַבִּים נְדִירָה הַמּוֹרָה שֶׁגַּם שִׁפְחוֹתֶיהָ הִתְכַּסּוּ"], "kasha": "מַדּוּעַ רַשִׁ\"י מְעִיר עַל הַדִּקְדּוּק שֶׁל מִלָּה זוֹ?", "answer": "הַצּוּרָה נוֹשֵׂאת מַשְׁמָעוּת סָבִילָה — 'נִתְכַּסְּתָה' — בִּדְמוּת 'וַתִּקָּבֵר' (נִקְבְּרָה).", "kp": ["לשון ותתפעל, כמו ותקבר ותשבר"]}]}, {"id": "24:66.1", "ch": 24, "v": 66, "n": 1, "dh": "ויספר העבד", "pasuk_html": "<mark>וַיְסַפֵּ֥ר הָעֶ֖בֶד</mark> לְיִצְחָ֑ק אֵ֥ת כׇּל־הַדְּבָרִ֖ים אֲשֶׁ֥ר עָשָֽׂה׃", "pasuk_en": "וַיְסַפֵּר הָעֶבֶד", "rashi_he": "ויספר העבד. גִּלָּה לוֹ נִסִּים שֶׁנַּעֲשׂוּ לוֹ, שֶׁקָּפְצָה לוֹ הָאָרֶץ וְשֶׁנִּזְדַּמְּנָה לוֹ רִבְקָה בִּתְּפִלָּתוֹ (בראשית רבה):", "rashi_en": "העבד גילה ליצחק את הניסים שנעשו לו: שקפצה לו הדרך, ושרבקה נזדמנה לו בזכות תפילתו.", "note": "", "points": [{"q": "מָה בְּדִיּוּק סִפֵּר הָעֶבֶד לְיִצְחָק?", "options": ["אֶת הַנִּסִּים שֶׁאֵרְעוּ — קְפִיצַת הָאָרֶץ וְהוֹפָעַת רִבְקָה בִּזְכוּת תְּפִלָּתוֹ", "רַק אֶת יִחוּסָהּ שֶׁל מִשְׁפַּחַת רִבְקָה", "אֶת הַמַּתָּנוֹת שֶׁחִלֵּק לְמִשְׁפַּחַת רִבְקָה"], "kasha": "הַפָּסוּק אוֹמֵר שֶׁסִּפֵּר 'אֶת כָּל הַדְּבָרִים אֲשֶׁר עָשָׂה.' מָה מְפָרֵט רַשִׁ\"י?", "answer": "אֱלִיעֶזֶר סִפֵּר אֶת הַנִּסִּים: הָאָרֶץ קָפְצָה לוֹ, וְרִבְקָה הוֹפִיעָה כְּמַעֲנֶה יָשִׁיר לִתְפִלָּתוֹ.", "kp": ["גלה לו נסים שנעשו לו"]}]}, {"id": "24:67.1", "ch": 24, "v": 67, "n": 1, "dh": "האהלה שרה אמו", "pasuk_html": "וַיְבִאֶ֣הָ יִצְחָ֗ק <mark>הָאֹ֙הֱלָה֙ שָׂרָ֣ה אִמּ֔וֹ</mark> וַיִּקַּ֧ח אֶת־רִבְקָ֛ה וַתְּהִי־ל֥וֹ לְאִשָּׁ֖ה וַיֶּאֱהָבֶ֑הָ וַיִּנָּחֵ֥ם יִצְחָ֖ק אַחֲרֵ֥י אִמּֽוֹ׃&nbsp;{פ}", "pasuk_en": "הָאֹהֱלָה שָׂרָה אִמּוֹ", "rashi_he": "האהלה שרה אמו. וַיְבִיאֶהָ הָאֹהֱלָה וְנַעֲשֵׂית דֻּגְמַת שָׂרָה אִמּוֹ, כְּלוֹמַר וַהֲרֵי הִיא שָׂרָה אִמּוֹ, שֶׁכָּל זְמַן שֶׁשָּׂרָה קַיֶּמֶת הָיָה נֵר דָּלוּק מֵעֶרֶב שַׁבָּת לְעֶרֶב שַׁבָּת וּבְרָכָה מְצוּיָה בָּעִסָּה וְעָנָן קָשׁוּר עַל הָאֹהֶל, וּמִשֶּׁמֵּתָה פָּסְקוּ, וּכְשֶׁבָּאת רִבְקָה חָזְרוּ (בראשית רבה):", "rashi_en": "יצחק הביא את רבקה לאוהל והיא נעשתה כמו שרה אמו. כל זמן ששרה הייתה בחיים היה נר דולק מערב שבת לערב שבת, ברכה מצויה בעיסה וענן קשור על האוהל; כשמתה הם פסקו, וכשבאה רבקה הם חזרו.", "note": "", "points": [{"q": "אֵלּוּ שְׁלוֹשָׁה נִסִּים חָזְרוּ כְּשֶׁנִּכְנְסָה רִבְקָה לְאֹהֶל שָׂרָה?", "options": ["נֵר דָּלוּק מִשַּׁבָּת לְשַׁבָּת, בְּרָכָה בָּעִסָּה, וְעָנָן עַל הָאֹהֶל", "גֶּשֶׁם יוֹרֵד עַל הָאֹהֶל, עַמּוּד אֵשׁ, וּמָן מוֹפִיעַ", "הָאֹהֶל מִתְרַחֵב, קְטֹרֶת רֵיחָנִית, וּמַעְיַן מָיִם"], "kasha": "מַדּוּעַ אוֹמֵר הַפָּסוּק 'הָאֹהֱלָה שָׂרָה אִמּוֹ' בִּמְקוֹם פָּשׁוּט 'הָאֹהֱלָה'?", "answer": "רִבְקָה נַעֲשְׂתָה בְּדִיּוּק כְּשָׂרָה. בְּחַיֵּי שָׂרָה הָיוּ שְׁלוֹשָׁה נִסִּים: נֵר דָּלוּק מִשַּׁבָּת לְשַׁבָּת, בְּרָכָה בָּעִסָּה, וְעָנָן עַל הָאֹהֶל. אֵלּוּ פָּסְקוּ בְּמוֹתָהּ וְחָזְרוּ כְּשֶׁבָּאָה רִבְקָה.", "kp": ["נר דלוק מערב שבת לערב שבת", "וברכה מצויה בעסה", "וענן קשור על האהל"]}]}, {"id": "24:67.2", "ch": 24, "v": 67, "n": 2, "dh": "אחרי אמו", "pasuk_html": "וַיְבִאֶ֣הָ יִצְחָ֗ק הָאֹ֙הֱלָה֙ שָׂרָ֣ה אִמּ֔וֹ וַיִּקַּ֧ח אֶת־רִבְקָ֛ה וַתְּהִי־ל֥וֹ לְאִשָּׁ֖ה וַיֶּאֱהָבֶ֑הָ וַיִּנָּחֵ֥ם יִצְחָ֖ק <mark>אַחֲרֵ֥י אִמּֽוֹ׃</mark>&nbsp;{פ}", "pasuk_en": "אַחֲרֵי אִמּוֹ", "rashi_he": "אחרי אמו. דֶּרֶךְ אֶרֶץ כָּל זְמַן שֶׁאִמּוֹ שֶׁל אָדָם קַיֶּמֶת, כָּרוּךְ הוּא אֶצְלָהּ; וּמִשֶּׁמֵּתָה, הוּא מִתְנַחֵם בְּאִשְׁתּוֹ:", "rashi_en": "דרך העולם היא שכל זמן שאמו של אדם בחיים הוא קשור אליה, וכשהיא מתה הוא מתנחם באשתו. כך יצחק התנחם ברבקה אחרי מות אמו.", "note": "", "points": [{"q": "מָה אוֹמֵר רַשִׁ\"י עַל הַבִּטּוּי 'אַחֲרֵי אִמּוֹ'?", "options": ["כָּל זְמַן שֶׁאִמּוֹ שֶׁל אָדָם חַיָּה הוּא כָּרוּךְ אַחֲרֶיהָ; אַחֲרֵי שֶׁנִּפְטְרָה מוֹצֵא נֶחָמָה בְּאִשְׁתּוֹ", "יִצְחָק הִתְאַבֵּל שָׁלוֹשׁ שָׁנִים בְּדִיּוּק אַחֲרֵי מוֹת שָׂרָה", "בֵּן צָרִיךְ תָּמִיד לָשֵׂאת מִי שֶׁדּוֹמָה לְאִמּוֹ"], "kasha": "מַדּוּעַ מַזְכִּיר הַפָּסוּק 'אַחֲרֵי אִמּוֹ' בְּהֶקְשֵׁר שֶׁל נִשּׂוּאִין?", "answer": "רַשִׁ\"י מְלַמֵּד שֶׁכָּל זְמַן שֶׁאִמּוֹ שֶׁל אָדָם חַיָּה, הוּא כָּרוּךְ בִּטְפוּלָהּ; כְּשֶׁנִּפְטְרָה, מוֹצֵא נֶחָמָה בְּאִשְׁתּוֹ.", "kp": ["כל זמן שאמו של אדם קימת", "ומשמתה, הוא מתנחם באשתו"]}]}, {"id": "25:1.1", "ch": 25, "v": 1, "n": 1, "dh": "קטורה", "pasuk_html": "וַיֹּ֧סֶף אַבְרָהָ֛ם וַיִּקַּ֥ח אִשָּׁ֖ה וּשְׁמָ֥הּ <mark>קְטוּרָֽה׃</mark>", "pasuk_en": "קְטוּרָה", "rashi_he": "קטורה. זוֹ הָגָר, וְנִקְרֵאת קְטוּרָה עַל שֶׁנָּאִים מַעֲשֶׁיהָ כִּקְטֹרֶת (בראשית רבה), וְשֶׁקָּשְׁרָה פִּתְחָהּ, שֶֶׁלֹא נִזְדַּוְּגָה לְאָדָם מִיּוֹם שֶׁפֵּרְשָׁה מֵאַבְרָהָם:", "rashi_en": "קטורה היא הגר. היא נקראה קטורה כי מעשיה היו נאים כקטורת, וגם כי קשרה וסגרה את עצמה ולא הייתה עם שום אדם מיום שנפרדה מאברהם.", "note": "", "points": [{"q": "מִי הָיְתָה קְטוּרָה לְפִי רַשִׁ\"י?", "options": ["הָגָר — נִקְרֵאת קְטוּרָה כִּי מַעֲשֶׂיהָ נָאִים כַּקְּטֹרֶת", "אִשָּׁה חֲדָשָׁה שֶׁמָּצָא אַבְרָהָם בִּבְאֵר שָׁבַע", "אִשָּׁה כְּנַעֲנִית מִמִּשְׁפָּחָה אֲצִילָה"], "kasha": "מַדּוּעַ הַתּוֹרָה נוֹתֶנֶת לָהּ שֵׁם אַחֵר?", "answer": "קְטוּרָה הִיא הָגָר. נִקְרֵאת כָּךְ כִּי מַעֲשֶׂיהָ נָאִים כַּקְּטֹרֶת, וּמִשֶּׁנִּפְרְדָה מֵאַבְרָהָם לֹא הָיְתָה עִם אִישׁ אַחֵר.", "kp": ["זו הגר", "על שנאים מעשיה כקטרת"]}]}, {"id": "25:3.1", "ch": 25, "v": 3, "n": 1, "dh": "אשורם ולטושם", "pasuk_html": "וְיׇקְשָׁ֣ן יָלַ֔ד אֶת־שְׁבָ֖א וְאֶת־דְּדָ֑ן וּבְנֵ֣י דְדָ֔ן הָי֛וּ <mark>אַשּׁוּרִ֥ם וּלְטוּשִׁ֖ם</mark> וּלְאֻמִּֽים׃", "pasuk_en": "אַשּׁוּרִם וּלְטוּשִׁם וּלְאֻמִּים", "rashi_he": "אשורים ולטושים. שֵׁם רָאשֵׁי אֻמּוֹת (בראשית רבה), וְתַרְגּוּם שֶׁל אֻנְקְלוֹס אֵין לִי לְיַשְּׁבוֹ עַל לְשׁוֹן הַמִּקְרָא שֶׁפֵּרֵשׁ לְמַשִּׁירְיָן, לְשׁוֹן מַחֲנֶה, וְאִם תֹּאמַר שֶׁאֵינוֹ כֵן מִפְּנֵי הָאָלֶ\"ף שֶׁאֵינָהּ יְסוֹדִית, הֲרֵי לָנוּ תֵּבוֹת שֶׁאֵין בְּרֹאשָׁם אָלֶ\"ף וְנִתּוֹסְפָה אָלֶ\"ף בְּרֹאשָׁם, כְּמוֹ חוֹמַת אֲנָךְ (עמוס ז) שֶׁהוּא מִן נְכֵה רַגְלַיִם, וּכְמוֹ אָסוּךְ שָׁמֶן (מ\"ב ד), שֶׁהוּא מִן וְרָחַצְתְּ וָסַכְתְּ:", "rashi_en": "אשורים ולטושים הם שמות של ראשי אומות. אונקלוס תרגם \"אשורים\" למשירין, שפירושו מחנות, ורש\"י אומר שאינו יכול ליישב זאת היטב עם לשון הפסוק. ואם תקשה שהאל\"ף אינה מן השורש, יש מילים שנוספה אל\"ף בראשן, כמו \"אנך\" מלשון נכה, ו\"אסוך\" מלשון וסכת.", "note": "", "points": [{"q": "מָה הֵם אַשּׁוּרִם, לְטוּשִׁם וּלְאֻמִּים?", "options": ["שְׁמוֹת נְשִׂיאִים אוֹ שְׁבָטִים מִצֶּאֱצָאֵי דְּדָן", "שְׁמוֹת עָרִים שֶׁבָּנוּ צֶאֱצָאֵי דְּדָן", "שְׁמוֹת מְלָאכוֹת שֶׁעָסְקוּ בָּהֶן צֶאֱצָאֵי דְּדָן"], "kasha": "הַאִם אֵלּוּ שֵׁמוֹת פְּרָטִיִּים אוֹ כִּנּוּיֵי קְבוּצוֹת?", "answer": "רַשִׁ\"י אוֹמֵר שֶׁאֵלּוּ שְׁמוֹת נְשִׂיאִים אוֹ שְׁבָטִים.", "kp": ["שם ראשי אמות"]}]}, {"id": "25:3.2", "ch": 25, "v": 3, "n": 2, "dh": "לטושים", "pasuk_html": "וְיׇקְשָׁ֣ן יָלַ֔ד אֶת־שְׁבָ֖א וְאֶת־דְּדָ֑ן וּבְנֵ֣י דְדָ֔ן הָי֛וּ אַשּׁוּרִ֥ם <mark>וּלְטוּשִׁ֖ם</mark> וּלְאֻמִּֽים׃", "pasuk_en": "לְטוּשִׁים", "rashi_he": "ולטושם. הֵם בַּעֲלֵי אֹהָלִים הַמִּתְפַּזְרִים אָנֶה וָאָנָה וְנוֹסְעִים אִיש בְּאָהֳלֵי אַפַּדְנוֹ, וְכֵן הוּא אוֹמֵר וְהִנָּם נְטֻשִׁים עַל פְּנֵי כָל הָאָרֶץ (שמואל א ל') שֶׁכֵּן לָמֶ\"ד וְנוּ\"ן מִתְחַלְּפוֹת זוֹ בְּזוֹ):", "rashi_en": "לטושים הם בעלי אוהלים שמתפזרים לכאן ולכאן, וכל אחד נוסע באוהלו. וכן נאמר \"והנם נטשים על פני כל הארץ\", כי האותיות ל' ונ' מתחלפות זו בזו.", "note": "", "points": [{"q": "מָה מְאַפְיֵן אֶת הַלְּטוּשִׁים?", "options": ["הֵם יוֹשְׁבֵי אֹהָלִים הַמִּתְפַּזְּרִים וְנוֹסְעִים מִמָּקוֹם לְמָקוֹם", "הֵם צוֹרְפֵי מַתָּכוֹת מֻמְחִים", "הֵם חַקְלָאִים הַמְּעַבְּדִים אֶת הָאֲדָמָה"], "kasha": "מָה מְרַמֵּז הַשֵּׁם 'לְטוּשִׁים' עַל אֹרַח חַיֵּיהֶם?", "answer": "רַשִׁ\"י אוֹמֵר שֶׁהַלְּטוּשִׁים הֵם בַּעֲלֵי אֹהָלִים הַמִּתְפַּזְּרִים וְנוֹסְעִים מִמָּקוֹם לְמָקוֹם.", "kp": ["הם בעלי אהלים המתפזרים אנה ואנה", "ונוסעים איש באהלי אפדנו"]}]}, {"id": "25:5.1", "ch": 25, "v": 5, "n": 1, "dh": "ויתן אברהם", "pasuk_html": "<mark>וַיִּתֵּ֧ן אַבְרָהָ֛ם</mark> אֶת־כׇּל־אֲשֶׁר־ל֖וֹ לְיִצְחָֽק׃", "pasuk_en": "וַיִּתֵּן אַבְרָהָם", "rashi_he": "ויתן אברהם וגו'. אָמַר רַ' נְחֶמְיָה בְּרָכָה דִּיאַתִּיקֵי, שֶׁאָמַר לוֹ הַקָּבָּ\"ה לְאַבְרָהָם וֶהְיֵה בְּרָכָה, הַבְּרָכוֹת מְסוּרוֹת בְּיָדְךָ לְבָרֵךְ אֶת מִי שֶׁתִּרְצֶה, וְאַבְרָהָם מְסָרָן לְיִצְחָק (בראשית רבה):", "rashi_en": "רבי נחמיה אמר שאברהם נתן ליצחק את הברכה כירושה. הקב\"ה אמר לאברהם \"והיה ברכה\", כלומר הברכות מסורות בידך לברך את מי שתרצה, ואברהם מסר אותן ליצחק.", "note": "", "points": [{"q": "לְפִי רַבִּי נְחֶמְיָה, מָה נָתַן אַבְרָהָם לְיִצְחָק?", "options": ["אֶת כֹּחַ הַבְּרָכָה — ה' אָמַר לְאַבְרָהָם 'הֱיֵה בְּרָכָה', מָסַר לוֹ אֶת הַבְּרָכוֹת, וְהוּא הֶעֱבִירָן לְיִצְחָק", "אֶת כָּל זְהָבוֹ, כַּסְפּוֹ וּמִקְנֵהוּ", "אֶת שְׁטַר הַבַּעֲלוּת עַל מְעָרַת הַמַּכְפֵּלָה"], "kasha": "הַפָּסוּק אוֹמֵר שֶׁאַבְרָהָם נָתַן 'אֶת כָּל אֲשֶׁר לוֹ' לְיִצְחָק. מַה בְּדִיּוּק?", "answer": "רַבִּי נְחֶמְיָה אוֹמֵר שֶׁאַבְרָהָם נָתַן לְיִצְחָק אֶת הַבְּרָכָה כִּירֻשָּׁה. ה' אָמַר לְאַבְרָהָם 'הֱיֵה בְּרָכָה', מָסַר בְּיָדוֹ אֶת כֹּחַ הַבְּרָכָה, וְאַבְרָהָם הֶעֱבִירוֹ לְיִצְחָק.", "kp": ["והיה ברכה", "ואברהם מסרן ליצחק"]}]}, {"id": "25:6.1", "ch": 25, "v": 6, "n": 1, "dh": "הפילגשים", "pasuk_html": "וְלִבְנֵ֤י <mark>הַפִּֽילַגְשִׁים֙</mark> אֲשֶׁ֣ר לְאַבְרָהָ֔ם נָתַ֥ן אַבְרָהָ֖ם מַתָּנֹ֑ת וַֽיְשַׁלְּחֵ֞ם מֵעַ֨ל יִצְחָ֤ק בְּנוֹ֙ בְּעוֹדֶ֣נּוּ חַ֔י קֵ֖דְמָה אֶל־אֶ֥רֶץ קֶֽדֶם׃", "pasuk_en": "הַפִּילַגְשִׁם", "rashi_he": "הפילגשים. חָסֵר כְּתִיב, שֶׁלֹּא הָיְתָה אֶלָּא פִּלֶגֶשׁ אַחַת, הִיא הָגָר, הִיא קְטוּרָה (בראשית רבה). נָשִׁים בִּכְתֻבָּה, פִּילַגְשִׁים בְּלֹא כְּתֻבָּה, כִּדְאָמְרִינַן בְּסַנְהֶדְרִין, בְּנָשִׁים וּפִילַגְשִׁים דְּדָוִד:", "rashi_en": "המילה \"פילגשים\" כתובה חסר, ללמד שהייתה רק פילגש אחת, הגר, שהיא קטורה. נשים הן בכתובה ופילגשים הן בלי כתובה, כמו שלמדו במסכת סנהדרין לגבי נשי דוד ופילגשיו.", "note": "", "points": [{"q": "מַדּוּעַ 'פִילַגְשִׁים' נִכְתָּב חָסֵר בַּכָּתוּב?", "options": ["הָיְתָה רַק פִּילֶגֶשׁ אַחַת: הָגָר, שֶׁהִיא קְטוּרָה", "הַסּוֹפֵר עָשָׂה טָעוּת הַעְתָּקָה", "זֶה מוֹרֶה שֶׁמַּעֲמָדָן הָיָה נָמוּךְ מִנָּשִׁים"], "kasha": "צוּרַת הָרַבִּים נִכְתְּבָה בְּחֶסְרוֹן. מַה מוֹרֶה הַדָּבָר?", "answer": "הַכְּתִיב הַחָסֵר מוֹרֶה שֶׁהָיְתָה פִּילֶגֶשׁ אַחַת בִּלְבַד — הָגָר, שֶׁהִיא קְטוּרָה. רַשִׁ\"י מוֹסִיף שֶׁפִּילַגְשִׁים אֵין לָהֶן כְּתֻבָּה.", "kp": ["שלא היתה אלא פלגש אחת", "היא הגר, היא קטורה"]}]}, {"id": "25:6.2", "ch": 25, "v": 6, "n": 2, "dh": "נתן אברהם מתנות", "pasuk_html": "וְלִבְנֵ֤י הַפִּֽילַגְשִׁים֙ אֲשֶׁ֣ר לְאַבְרָהָ֔ם <mark>נָתַ֥ן אַבְרָהָ֖ם מַתָּנֹ֑ת</mark> וַֽיְשַׁלְּחֵ֞ם מֵעַ֨ל יִצְחָ֤ק בְּנוֹ֙ בְּעוֹדֶ֣נּוּ חַ֔י קֵ֖דְמָה אֶל־אֶ֥רֶץ קֶֽדֶם׃", "pasuk_en": "נָתַן אַבְרָהָם מַתָּנוֹת", "rashi_he": "נתן אברהם מתנות. פֵּרְשׁוּ רַבּוֹתֵינוּ שֵׁם טֻמְאָה מָסַר לָהֶם (סנהדרין צ\"א). דָּ\"אַ מַה שֶּׁנִּתַּן לוֹ עַל אוֹדוֹת שָׂרָה וּשְׁאָר מַתָּנוֹת שֶׁנִתְּנוּ לוֹ, הַכֹּל נָתַן לָהֶם, שֶׁלֹּא רָצָה לֵהָנוֹת מֵהֶם:", "rashi_en": "רבותינו פירשו שאברהם מסר לבני הפילגשים שם טומאה. פירוש אחר: את כל המתנות שקיבל בגלל שרה ושאר המתנות שנתנו לו, נתן להם, כי לא רצה ליהנות מהן.", "note": "", "points": [{"q": "אֵיזוֹ 'מַתָּנוֹת' נָתַן אַבְרָהָם לִבְנֵי הַפִּילַגְשִׁים?", "options": ["שֵׁמוֹת כֹּחוֹת טֻמְאָה; אוֹ לְחִלּוּפִין, הַמַּתָּנוֹת שֶׁקִּבֵּל בִּזְכוּת שָׂרָה — לֹא רָצָה לֵהָנוֹת מֵהֶן", "עֶדְרֵי בָּקָר וְצֹאן", "חֶלְקוֹת מֵאֶרֶץ כְּנַעַן"], "kasha": "אֵיזֶה סוּג מַתָּנוֹת יִתֵּן אַבְרָהָם לְמִי שֶׁמְּשַׁלֵּחַ?", "answer": "חֲכָמִים אוֹמְרִים שֶׁמָּסַר לָהֶם שֵׁמוֹת כֹּחוֹת טֻמְאָה. דֵּעָה אַחֶרֶת: נָתַן לָהֶם אֶת כָּל הַמַּתָּנוֹת שֶׁקִּבֵּל בִּגְלַל שָׂרָה, כִּי לֹא רָצָה לֵהָנוֹת מֵהֶן.", "kp": ["שם טמאה מסר להם", "מה שנתן לו על אודות שרה", "שלא רצה להנות מהם"]}]}, {"id": "25:7.1", "ch": 25, "v": 7, "n": 1, "dh": "מאה שנה ושבעים שנה וחמש שנים", "pasuk_html": "וְאֵ֗לֶּה יְמֵ֛י שְׁנֵֽי־חַיֵּ֥י אַבְרָהָ֖ם אֲשֶׁר־חָ֑י <mark>מְאַ֥ת שָׁנָ֛ה וְשִׁבְעִ֥ים שָׁנָ֖ה וְחָמֵ֥שׁ שָׁנִֽים׃</mark>", "pasuk_en": "מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים", "rashi_he": "מאת שנה ושבעים שנה וחמש שנים. בֶּן ק' כְּבֶן ע' וּבֶן ע' כְּבֶן ה' בְּלֹא חֵטְא:", "rashi_en": "המילה \"שנה\" נכתבה בכל חלק כדי ללמד שבגיל מאה היה אברהם כמו בן שבעים, ובגיל שבעים היה כמו בן חמש, בלי חטא.", "note": "", "points": [{"q": "מַדּוּעַ הַתּוֹרָה מְפָרֶטֶת אֶת 175 שְׁנוֹת אַבְרָהָם לְיְחִידוֹת נִפְרָדוֹת (מֵאָה, שִׁבְעִים, חָמֵשׁ)?", "options": ["בֶּן מֵאָה הָיָה חָזָק כְּבֶן שִׁבְעִים, וּבֶן שִׁבְעִים הָיָה בְּלִי חֵטְא כְּבֶן חָמֵשׁ", "כָּל תְּקוּפָה מְסַמֶּנֶת שָׁלָב שׁוֹנֶה בְּמַסָּעוֹ הָרוּחָנִי", "זֶה מַתְאִים לִשְׁלוֹשׁ הַבְּרִיתוֹת שֶׁכָּרַת ה' עִמּוֹ"], "kasha": "מַדּוּעַ לֹא לוֹמַר פָּשׁוּט 'מֵאָה שִׁבְעִים וְחָמֵשׁ שָׁנָה'?", "answer": "רַשִׁ\"י מְפָרֵשׁ אֶת הַפֵּרוּט: בֶּן מֵאָה הָיָה חָזָק כְּבֶן שִׁבְעִים, וּבֶן שִׁבְעִים הָיָה נָקִי מֵחֵטְא כְּבֶן חָמֵשׁ.", "kp": ["בן ק' כבן ע'", "ובן ע' כבן ה' בלא חטא"]}]}, {"id": "25:9.1", "ch": 25, "v": 9, "n": 1, "dh": "יצחק וישמעאל", "pasuk_html": "וַיִּקְבְּר֨וּ אֹת֜וֹ <mark>יִצְחָ֤ק וְיִשְׁמָעֵאל֙</mark> בָּנָ֔יו אֶל־מְעָרַ֖ת הַמַּכְפֵּלָ֑ה אֶל־שְׂדֵ֞ה עֶפְרֹ֤ן בֶּן־צֹ֙חַר֙ הַֽחִתִּ֔י אֲשֶׁ֖ר עַל־פְּנֵ֥י מַמְרֵֽא׃", "pasuk_en": "יִצְחָק וְיִשְׁמָעֵאל", "rashi_he": "יצחק וישמעאל. מִכָּאן שֶׁעָשָׂה יִשְׁמָעֵאל תְּשׁוּבָה וְהוֹלִיךְ אֶת יִצְחָק לְפָנָיו, וְהִיא שֵׂיבָה טוֹבָה שֶׁנֶּאֱמַר בְּאַבְרָהָם (בראשית רבה):", "rashi_en": "מכאן למדנו שישמעאל עשה תשובה והוליך את יצחק לפניו, ולכן יצחק נזכר ראשון. וזו \"השיבה הטובה\" שנאמרה באברהם.", "note": "", "points": [{"q": "מָה לוֹמְדִים מִכָּךְ שֶׁיִּצְחָק נִזְכָּר לִפְנֵי יִשְׁמָעֵאל בִּקְבוּרַת אַבְרָהָם?", "options": ["יִשְׁמָעֵאל עָשָׂה תְּשׁוּבָה וְנָתַן קָדִימָה לְיִצְחָק — זוֹהִי 'שֵׂיבָה טוֹבָה' שֶׁהֻבְטְחָה לְאַבְרָהָם", "יִצְחָק הִגִּיעַ לַקְּבוּרָה רִאשׁוֹן", "הַתּוֹרָה תָּמִיד מַזְכִּירָה אֶת הַבֵּן הַצָּעִיר רִאשׁוֹן"], "kasha": "יִשְׁמָעֵאל הָיָה הַבְּכוֹר. מַדּוּעַ יִצְחָק נִזְכָּר רִאשׁוֹן?", "answer": "יִשְׁמָעֵאל עָשָׂה תְּשׁוּבָה וְוִתֵּר לְיִצְחָק, נָתַן לוֹ קָדִימָה. רַשִׁ\"י אוֹמֵר שֶׁזֶּהוּ פֵּרוּשׁ 'שֵׂיבָה טוֹבָה' שֶׁנֶּאֶמְרָה לְאַבְרָהָם.", "kp": ["מכאן שעשה ישמעאל תשובה", "והוליך את יצחק לפניו", "והיא שיבה טובה שנאמר באברהם"]}]}, {"id": "25:11.1", "ch": 25, "v": 11, "n": 1, "dh": "ויהי אחרי מות אברהם ויברך", "pasuk_html": "<mark>וַיְהִ֗י אַחֲרֵי֙ מ֣וֹת אַבְרָהָ֔ם וַיְבָ֥רֶךְ</mark> אֱלֹהִ֖ים אֶת־יִצְחָ֣ק בְּנ֑וֹ וַיֵּ֣שֶׁב יִצְחָ֔ק עִם־בְּאֵ֥ר לַחַ֖י רֹאִֽי׃&nbsp;{פ}", "pasuk_en": "וַיְהִי אַחֲרֵי מוֹת אַבְרָהָם וַיְבָרֶךְ", "rashi_he": "ויהי אחרי מות אברהם ויברך וגו'. נִחֲמוֹ תַּנְחוּמֵי אֲבֵלִים. דָּ\"אַ אַעַ\"פִּ שֶׁמָּסַר הַקָּבָּ\"ה אֶת הַבְּרָכוֹת לְאַבְרָהָם, נִתְיָרֵא לְבָרֵךְ אֶת יִצְחָק מִפְּנֵי שֶׁצָּפָה אֶת עֵשָׂו יוֹצֵא מִמֶּנוּ, אָמַר יָבֹא בַּעַל הַבְּרָכוֹת וִיבָרֵךְ אֵת אֲשֶׁר יִיטַב בְּעֵינָיו, וּבָא הַקָּבָּ\"ה וּבֵרְכוֹ (סוטה י\"ד):", "rashi_en": "אחרי מות אברהם, ה' ניחם את יצחק בתנחומי אבלים. פירוש אחר: אף שה' מסר את הברכות לאברהם, אברהם פחד לברך את יצחק כי ראה שעשו ייצא ממנו, ולכן אמר שבעל הברכות יבוא ויברך את מי שירצה, ובא הקב\"ה וברך את יצחק.", "note": "", "points": [{"q": "מַדּוּעַ ה' בְּעַצְמוֹ בֵּרַךְ אֶת יִצְחָק אַחֲרֵי מוֹת אַבְרָהָם?", "options": ["אַבְרָהָם יָרֵא לְבָרֵךְ אֶת יִצְחָק כִּי יָדַע שֶׁעֵשָׂו יֵצֵא מִמֶּנּוּ, וְלָכֵן ה' בֵּרְכוֹ בְּעַצְמוֹ", "אַבְרָהָם שָׁכַח לְבָרֵךְ אֶת יִצְחָק לִפְנֵי מוֹתוֹ", "יִצְחָק סֵרֵב לְקַבֵּל בְּרָכָה מִבֶּן אָדָם"], "kasha": "מַדּוּעַ לֹא בֵּרַךְ אַבְרָהָם אֶת יִצְחָק בְּעַצְמוֹ?", "answer": "אַף שֶׁה' מָסַר לְאַבְרָהָם אֶת כֹּחַ הַבְּרָכָה, אַבְרָהָם יָרֵא לְבָרֵךְ אֶת יִצְחָק בְּיָדְעוֹ שֶׁעֵשָׂו יֵצֵא מִמֶּנּוּ. לָכֵן ה' בְּעַצְמוֹ בֵּרַךְ אֶת יִצְחָק. דֵּעָה אַחֶרֶת: ה' נִחֲמוֹ בְּתַנְחוּמֵי אֲבֵלִים.", "kp": ["נתירא לברך את יצחק", "מפני שצפה את עשו יוצא ממנו", "ובא הקב\"ה וברכו"]}]}, {"id": "25:13.1", "ch": 25, "v": 13, "n": 1, "dh": "בשמתם לתולדתם", "pasuk_html": "וְאֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׁמָעֵ֔אל <mark>בִּשְׁמֹתָ֖ם לְתוֹלְדֹתָ֑ם</mark> בְּכֹ֤ר יִשְׁמָעֵאל֙ נְבָיֹ֔ת וְקֵדָ֥ר וְאַדְבְּאֵ֖ל וּמִבְשָֽׂם׃", "pasuk_en": "בִּשְׁמוֹתָם לְתוֹלְדוֹתָם", "rashi_he": "בשמותם לתולדותם. סֵדֶר לֵידָתָן זֶה אַחַר זֶה:", "rashi_en": "בני ישמעאל מנויים לפי סדר לידתם, זה אחר זה.", "note": "", "points": [{"q": "בְּאֵיזֶה סֵדֶר רְשׁוּמִים בְּנֵי יִשְׁמָעֵאל?", "options": ["לְפִי סֵדֶר לֵדָתָם", "לְפִי חֲשִׁיבוּתָם וְכֹחָם", "לְפִי סֵדֶר הָאָלֶף-בֵּית שֶׁל שְׁמוֹתָם"], "kasha": "מַה קוֹבֵעַ אֶת רְצִיפוּת הַשֵּׁמוֹת?", "answer": "רַשִׁ\"י אוֹמֵר שֶׁהֵם רְשׁוּמִים לְפִי סֵדֶר לֵדָתָם.", "kp": ["סדר לידתן זה אחר זה"]}]}, {"id": "25:16.1", "ch": 25, "v": 16, "n": 1, "dh": "בחצריהם", "pasuk_html": "אֵ֣לֶּה הֵ֞ם בְּנֵ֤י יִשְׁמָעֵאל֙ וְאֵ֣לֶּה שְׁמֹתָ֔ם <mark>בְּחַצְרֵיהֶ֖ם</mark> וּבְטִֽירֹתָ֑ם שְׁנֵים־עָשָׂ֥ר נְשִׂיאִ֖ם לְאֻמֹּתָֽם׃", "pasuk_en": "בְּחַצְרֵיהֶם", "rashi_he": "בחצריהם. כְּרַכִּים שֶׁאֵין לָהֶם חוֹמָה, וְתַּרְגּוּמוֹ בְּפַצְחֵיהוֹן שֶׁהֵם מְפֻצָּחִים, לְשׁוֹן פְּתִיחָה, כְּמוֹ פִּצְחוּ וְרַנְּנוּ (תהילים צ\"ח):", "rashi_en": "חצרים הם ערים שאין להן חומה. אונקלוס תרגם \"בפצחיהון\", כי הן פתוחות, מלשון פתיחה, כמו \"פצחו ורננו\".", "note": "", "points": [{"q": "מָה הֵן 'חֲצֵרִים'?", "options": ["עֲיָרוֹת פְּתוּחוֹת בְּלִי חוֹמָה", "עָרִים מְבֻצָּרוֹת עִם חוֹמוֹת גְּבוֹהוֹת", "מַחֲנוֹת מִדְבָּר זְמַנִּיִּים"], "kasha": "אֵיזֶה סוּג יִשּׁוּב מְתָאֶרֶת מִלָּה זוֹ?", "answer": "רַשִׁ\"י אוֹמֵר שֶׁחֲצֵרִים הֵם עֲיָרוֹת פְּתוּחוֹת — יִשּׁוּבִים בְּלִי חוֹמוֹת וּמִבְצָרִים.", "kp": ["כרכים שאין להם חומה"]}]}, {"id": "25:17.1", "ch": 25, "v": 17, "n": 1, "dh": "ואלה שני חיי ישמעאל", "pasuk_html": "<mark>וְאֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל</mark> מְאַ֥ת שָׁנָ֛ה וּשְׁלֹשִׁ֥ים שָׁנָ֖ה וְשֶׁ֣בַע שָׁנִ֑ים וַיִּגְוַ֣ע וַיָּ֔מׇת וַיֵּאָ֖סֶף אֶל־עַמָּֽיו׃", "pasuk_en": "וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל", "rashi_he": "ואלה שני חיי ישמעאל וגו'. אָמַר רַבִּי חִיָּא בַּר אַבָּא לָמָּה נִמְנוּ שְׁנוֹתָיו שֶׁל יִשְׁמָעֵאל, כְּדֵי לְיַחֵס בָהֶם שְׁנוֹתָיו שֶׁל יַעֲקֹב מִשְּׁנוֹתָיו שֶׁל יִשְׁמָעֵאל, לָמַדְנוּ שֶׁשִּׁמֵּשׁ יַעֲקֹב בְּבֵית עֵבֶר י\"ד שָׁנָה כְּשֶׁפֵּרֵשׁ מֵאָבִיו קֹדֶם שֶׁבָּא אֵצֶל לָבָן, שֶׁהֲרֵי כְּשֶׁפֵּרֵשׁ יַעֲקֹב מֵאָבִיו מֵת יִשְׁמָעֵאל, שֶׁנֶּאֱמַר וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל וגו' (בראשית רבה כ\"ה), כְּמוֹ שֶׁמְּפֹרָשׁ בְּסוֹף מְגִלָּה נִקְרֵאת:", "rashi_en": "רבי חייא בר אבא שאל למה נמנו שנות ישמעאל, ותירץ שהן עוזרות לחשב את שנות יעקב. מכאן למדנו שיעקב למד בבית עבר ארבע עשרה שנה אחרי שעזב את אביו ולפני שהגיע ללבן, כי כשעזב יעקב את אביו מת ישמעאל, כמו שנאמר \"וילך עשו אל ישמעאל\", וכמו שמבואר במסכת מגילה.", "note": "", "points": [{"q": "מַדּוּעַ הַתּוֹרָה מְצַיֶּנֶת אֶת שְׁנוֹת חַיֵּי יִשְׁמָעֵאל — מֵאָה שְׁלוֹשִׁים וְשֶׁבַע שָׁנָה?", "options": ["כְּדֵי לְאַפְשֵׁר חִשּׁוּב שְׁנוֹת חַיֵּי יַעֲקֹב דֶּרֶךְ לוּחַ הַזְּמַנִּים שֶׁל יִשְׁמָעֵאל", "לְהַרְאוֹת שֶׁיִּשְׁמָעֵאל זָכָה לְאֹרֶךְ יָמִים", "לְהַשְׁווֹת אֶת תּוֹחֶלֶת חַיָּיו לְזוֹ שֶׁל אַבְרָהָם"], "kasha": "מַדּוּעַ גִּיל יִשְׁמָעֵאל רֶלֵוַנְטִי לַסִּפּוּר?", "answer": "רַשִׁ\"י אוֹמֵר שֶׁשְּׁנוֹת יִשְׁמָעֵאל נְתוּנוֹת כְּדֵי שֶׁנּוּכַל לְעַקֵּב וּלְחַשֵּׁב אֶת כְּרוֹנוֹלוֹגְיַת חַיֵּי יַעֲקֹב דַּרְכָּם.", "kp": ["כדי ליחס בהם שנותיו של יעקב", "משנותיו של ישמעאל"]}]}, {"id": "25:17.2", "ch": 25, "v": 17, "n": 2, "dh": "ויגוע", "pasuk_html": "וְאֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּשְׁלֹשִׁ֥ים שָׁנָ֖ה וְשֶׁ֣בַע שָׁנִ֑ים <mark>וַיִּגְוַ֣ע</mark> וַיָּ֔מׇת וַיֵּאָ֖סֶף אֶל־עַמָּֽיו׃", "pasuk_en": "וַיִּגְוַע", "rashi_he": "ויגוע. לֹא נֶאֶמְרָה גְוִיעָה אֶלָּא בְּצַדִּיקִים:", "rashi_en": "לשון \"גויעה\" נאמרה בתורה רק בצדיקים, ומכאן שישמעאל היה צדיק בסוף ימיו.", "note": "", "points": [{"q": "מָה מְלַמֵּד הַשִּׁמּוּשׁ בַּמִּלָּה 'וַיִּגְוַע' (גָּוַע) עַל יִשְׁמָעֵאל?", "options": ["זֶה מוֹרֶה שֶׁהָיָה צַדִּיק — מֻנָּח זֶה שָׁמוּר לַצַּדִּיקִים, וּמְאַשֵּׁר שֶׁעָשָׂה תְּשׁוּבָה", "מַשְׁמָעוּתוֹ שֶׁמֵּת פִּתְאוֹם בַּקְּרָב", "מוֹרֶה שֶׁמֵּת בְּשַׁלְוָה מִזִּקְנָה בִּשְׁנָתוֹ"], "kasha": "מַדּוּעַ מִשְׁתַּמְּשִׁים בְּמִלָּה מְסֻיֶּמֶת זוֹ לַמָּוֶת?", "answer": "הַמֻּנָּח 'גְּוִיעָה' מְשַׁמֵּשׁ רַק לַצַּדִּיקִים. שִׁמּוּשׁוֹ כָּאן מוֹרֶה שֶׁיִּשְׁמָעֵאל עָשָׂה תְּשׁוּבָה לִפְנֵי מוֹתוֹ.", "kp": ["לא נאמרה גויעה אלא בצדיקים"]}]}, {"id": "25:18.1", "ch": 25, "v": 18, "n": 1, "dh": "נפל", "pasuk_html": "וַיִּשְׁכְּנ֨וּ מֵֽחֲוִילָ֜ה עַד־שׁ֗וּר אֲשֶׁר֙ עַל־פְּנֵ֣י מִצְרַ֔יִם בֹּאֲכָ֖ה אַשּׁ֑וּרָה עַל־פְּנֵ֥י כׇל־אֶחָ֖יו <mark>נָפָֽל׃</mark>&nbsp;{פ}", "pasuk_en": "נָפָל", "rashi_he": "נפל. שָׁכַן, כְּמוֹ וּמִדְיָן וַעֲמָלֵק וּבְנֵי קֶדֶם נֹפְלִים בָּעֵמֶק (שופטים ז'). כָּאן הוּא אוֹמֵר לְשׁוֹן נְפִילָה, וּלְהַלָּן אוֹמֵר עַל פְּנֵי כָל אֶחָיו יִשְׁכֹּן (בראשית ט״ז:י״ב)? עַד שֶׁלֹּא מֵת אַבְרָהָם יִשְׁכֹּן, מִשֶּׁמֵּת אַבְרָהָם נָפַל:", "rashi_en": "\"נפל\" פירושו שכן, כמו \"נפלים בעמק\". כאן נאמר \"נפל\" ולמעלה נאמר \"ישכן\", כי כל זמן שאברהם היה חי ישמעאל \"ישכן\", ומשמת אברהם \"נפל\".", "note": "", "points": [{"q": "מָה מַשְׁמָעוּת 'נָפָל' בְּפָסוּק זֶה עַל צֶאֱצָאֵי יִשְׁמָעֵאל?", "options": ["'יָשַׁב' — כְּמוֹ בְּשׁוֹפְטִים ז:יב, בְּקֶשֶׁר לַנְּבוּאָה 'עַל פְּנֵי כׇל אֶחָיו יִשְׁכֹּן'", "נָפְלוּ בַּקְּרָב נֶגֶד עַמִּים שְׁכֵנִים", "קָרְסוּ כְּצִיוִילִיזַצְיָה"], "kasha": "מַדּוּעַ מִשְׁתַּמֵּשׁ הַפָּסוּק בְּ'נָפָל' בִּמְקוֹם 'יָשַׁב'?", "answer": "רַשִׁ\"י מְפָרֵשׁ שֶׁ'נָפָל' כָּאן מַשְׁמָעוּתוֹ 'יָשַׁב', כְּמוֹ בְּשׁוֹפְטִים ז:יב, וּמְקַיֵּם אֶת נְבוּאַת בְּרֵאשִׁית טז:יב שֶׁיִּשְׁמָעֵאל יִשְׁכֹּן עַל פְּנֵי כָּל אֶחָיו.", "kp": ["שכן, כמו ומדין ועמלק", "על פני כל אחיו ישכן"]}]}];
const EN = {"23:1.1":{"e":"The Torah writes the word 'year' after each number to teach that each part is expounded on its own. At a hundred Sarah was free of sin like a twenty-year-old, who is not yet liable to punishment, and at twenty she was as beautiful as a seven-year-old.","pe":"The lifetime of Sarah consisted of one hundred years, twenty years and seven years. [These were] the years of Sarah’s life.","re":"The lifetime of Sarah consisted of one hundred years, twenty years and seven years. The reason the word שָׁנָה [year] is written with every set is to tell you that every set is to be explained by itself. [When she was] 100 years old she was like a 20 year old, regarding sin. Just as when she was 20 she was not considered as having sinned since she was not yet subject to punishment, so, too, at 100 she had not sinned. And when she was 20 she was like a seven-year-old, regarding [her] beauty.","p":[{"q":"Why does the Torah write 'years' after each group of numbers (a hundred, twenty, seven)?","o":["To teach that each is expounded on its own: at a hundred like at twenty (without sin), at twenty like at seven (in beauty)","To emphasize that Sarah lived a very long life","To match the style of describing other ages in the Torah"]}]},"23:1.2":{"e":"The Torah repeats 'שני חיי שרה' to teach that all her years were equal in goodness.","pe":"The lifetime of Sarah consisted of one hundred years, twenty years and seven years. [These were] the years of Sarah’s life.","re":"The years of Sarah’s life. [This tells us] that they were all equally good.","p":[{"q":"What does the phrase 'שני חיי שרה' (repeated without a number) teach?","o":["All of them were equal in goodness","She lived without any suffering at all","She never physically aged"]}]},"23:2.1":{"e":"The city was called Kiryat Arba after four giants who lived there: Achiman, Sheshai, Talmai, and their father. Another explanation: after four couples who were buried there, Adam and Chava, Avraham and Sarah, Yitzchak and Rivka, Yaakov and Leah.","pe":"Sarah died in Kiryas Arba, which is Chevron, in the land of Canaan. Avraham came to eulogize Sarah and to weep for her.","re":"In Kiryas Arba. So called because of the four giants that were there, Achiman, Sheishai, Talmai, and their father. Another explanation: So called because of the four couples that were buried there—man and wife, Adam and Chavah, Avraham and Sarah, Yitzchok and Rivkah, Yaakov and Leah.","p":[{"q":"Why is Chevron called Kiryat Arba ('city of four')?","o":["Because of four giants who lived there, or four couples buried there","Because it had four gates","Because it was divided into four quarters"]}]},"23:2.2":{"e":"Avraham came to Chevron from Be'er Sheva, where he was when Sarah died.","pe":"Sarah died in Kiryas Arba, which is Chevron, in the land of Canaan. Avraham came to eulogize Sarah and to weep for her.","re":"Avraham came. From Beer Sheva.","p":[{"q":"From where did Avraham come when he arrived to eulogize Sarah?","o":["From Be'er Sheva","From Mount Moriah","From Charan"]}]},"23:2.3":{"e":"Sarah's death was written immediately after the Akeidah of Yitzchak, because when she heard that her son had been prepared for slaughter and was almost slaughtered, her soul flew out of her and she died.","pe":"Sarah died in Kiryas Arba, which is Chevron, in the land of Canaan. Avraham came to eulogize Sarah and to weep for her.","re":"To eulogize Sarah and to weep for her. The narrative of Sarah’s death immediately follows the Akeidah [binding] of Yitzchok because as a result of the news of the Akeidah, that her son had been prepared for slaughter and almost not been slaughtered, her soul departed from her and she died.","p":[{"q":"Why is Sarah's death presented immediately after the Akeidah of Yitzchak?","o":["The news that her son was almost slaughtered stunned her and her soul departed","To show that Avraham mourned immediately after the Akeidah","Because both events happened in the same year"]}]},"23:4.1":{"e":"Avraham says: I am a stranger who came from another land and settled among you. In the Midrash: if you wish, I will be a stranger and buy the land with money; if not, I will be a resident and take it by right, for Hashem told me, 'To your descendants I will give this land.'","pe":"I am a foreigner and a resident among you. Grant me the possession of a grave site with you, so that I may bury my dead from my presence.","re":"I am a foreigner and a resident among you. “A stranger from another land and I have become a resident among you.” The Midrashic explanation is: “If you will agree then I am a stranger. If not, I will be as a resident and will rightfully take it. For God has told me, “To your descendants I will give this land.”","p":[{"q":"What is the double meaning of Avraham calling himself 'גר ותושב'?","o":["If you sell willingly, I am a stranger who will pay; if not, I will claim it as a resident by divine right","He was both new and a long-standing resident of the area","He felt like a stranger spiritually but at home physically"]}]},"23:4.2":{"e":"'אחוזת קבר' means a plot of land that will be mine for a cemetery.","pe":"I am a foreigner and a resident among you. Grant me the possession of a grave site with you, so that I may bury my dead from my presence.","re":"The possession of a grave. [Meaning:] the possession of land to serve as a burial place.","p":[{"q":"What does 'אחוזת קבר' mean?","o":["A holding of land to serve as a burial place","A temporary resting place for the dead","A family inheritance"]}]},"23:6.1":{"e":"'לא יכלה' means will not withhold, like 'לא תכלא רחמיך' in Tehillim and like 'ויכלא הגשם' in Bereishis.","pe":"Hear us my master, you are a prince of God in our midst. Bury your dead in the choicest of our grave sites. No man among us will deny his grave site from you to bury your dead.","re":"Will not deny. [Meaning:] will not withhold as in, “You will not withhold Your pity” and as in “The downpour was withheld.”","p":[{"q":"What does 'לא יכלה' mean in this context?","o":["He will not withhold, as in Tehillim 40","He will not be able, an expression of lack of ability","He will not end or complete"]}]},"23:8.1":{"e":"'נפשכם' here means your will: if you are willing for me to bury my dead.","pe":"Avraham spoke to them, saying, If it is really your will that I bury my dead from my presence, listen to me and intercede for me with Ephron, son of Tzochar.","re":"Your will. [Meaning:] your will.","p":[{"q":"What does 'נפשכם' mean here?","o":["Your will or desire","Your soul","Your life"]}]},"23:8.2":{"e":"'ופגעו לי' is an expression of request, meaning plead on my behalf with Efron, like 'אל תפגעי בי' in Megillas Rus.","pe":"Avraham spoke to them, saying, If it is really your will that I bury my dead from my presence, listen to me and intercede for me with Ephron, son of Tzochar.","re":"And intercede for me. A term denoting a request as in “Do not entreat me.”","p":[{"q":"What does the word 'ופגעו' signify?","o":["A request, as in Rus 1, 'אל תפגעי בי'","Hostile attack","A chance meeting"]}]},"23:9.1":{"e":"The cave is called 'המכפלה' because it had two levels, a house with an upper room above it. Another explanation: because it is doubled with couples buried in it.","pe":"Let him give me the Machpeilah [double] cave, which belongs to him, which is at the end of his field. Let him give [sell] it to me for its full value, as a grave site among you.","re":"Machpeilah. I.e., a house with an upper level above it. Another explanation: It is doubled with couples.","p":[{"q":"Why is the cave called 'מכפלה'?","o":["From the root 'double': it had two levels, or couples were buried in it","Because it was in a double hill","Because Avraham paid a double price"]}]},"23:9.2":{"e":"'בכסף מלא' means with full payment, all that it is worth. So too David said to Aravna to buy the threshing floor from him 'בכסף מלא.'","pe":"Let him give me the Machpeilah [double] cave, which belongs to him, which is at the end of his field. Let him give [sell] it to me for its full value, as a grave site among you.","re":"For its full value. [Meaning:] its full value. Similarly, Dovid said to Arnun, “For its full value.”","p":[{"q":"What does 'כסף מלא' (full silver) mean?","o":["The full amount the land is worth, as David said to Aravna","Silver coins filled to the rim of the vessel","An excessive sum above the land's value"]}]},"23:10.1":{"e":"The word 'ישב' is written defectively, to teach that on that day they appointed Efron as an officer over them. Because of the importance of Avraham, who needed him, Efron rose to greatness.","pe":"Ephron lived in the midst of the sons of Cheis, Ephron the Chitite replied to Avraham in the ears [audience] of the sons of Cheis, for all who came to the city gate, saying,","re":"Ephron lived. It [ישֵׁב] is written [with a vav] missing. [This is because] on that day they appointed him [to be] an officer over them. Because of the exaltedness of Avraham who needed him [to purchase the land] he was raised to an important position.","p":[{"q":"Why is Efron's sitting written defectively (without a vav) as 'ישב'?","o":["That day they appointed him as an officer, and he was elevated because Avraham needed him","He sat in judgment as an established leader","He was a humble man who sat on the ground"]}]},"23:10.2":{"e":"All the people of the city were there, because everyone stopped their work and came to perform an act of kindness for Sarah.","pe":"Ephron lived in the midst of the sons of Cheis, Ephron the Chitite replied to Avraham in the ears [audience] of the sons of Cheis, for all who came to the city gate, saying,","re":"For all who came to the city gate. For they all left their work and came to pay their respects to Sarah.","p":[{"q":"Why does the Torah mention 'לכל באי שער עירו'?","o":["They all left their work and came to pay Sarah their last respects","They came to testify to a legal transaction","They gathered for a regular city assembly"]}]},"23:11.1":{"e":"Efron says 'No, my lord': you will not buy the field with money, rather I will give it to you as a gift.","pe":"No, my master, hear me: I have given you the field, and the cave that is in it, I have [also] given to you. Before the eyes of the sons of my people I have given it to you. Bury your dead.","re":"No, my master. “You will not buy it for money, [but. .]","p":[{"q":"What did Efron mean by 'לא אדני'?","o":["You need not buy it with money, I am giving it to you","He refused to sell the field at all","He wanted Avraham to keep haggling for a lower price"]}]},"23:11.2":{"e":"'נתתי לך' is written in the past tense, meaning it is as if I have already given you the field.","pe":"No, my master, hear me: I have given you the field, and the cave that is in it, I have [also] given to you. Before the eyes of the sons of my people I have given it to you. Bury your dead.","re":"I have given you. As though I have already given it to you.","p":[{"q":"Why does Efron use the past tense 'נתתי' (I have already given)?","o":["As if he had already given it, the gift being certain in his heart","He had promised the field to Avraham in the past","He had already transferred the deed"]}]},"23:13.1":{"e":"Avraham says to Efron: You are telling me to listen to you and take the field for free, and I do not want that.","pe":"He spoke to Ephron in the ears [audience] of the people of the land saying, If you will only listen to me. I have given the money for the field. Take it from me and I will bury my dead there.","re":"If you will only listen to me. “You tell me to listen to you and to take [the cave] without payment. I do not wish this.”","p":[{"q":"What is Avraham's response to Efron's offer to give for free?","o":["He does not want the field for free and insists on paying","He accepts happily but offers a symbolic payment","He asks Efron to lower the price"]},{"q":"What does Avraham ask Efron to do?","o":["To listen to him and accept payment for the field","To give him additional land in the area","To allow him to pay in installments"]}]},"23:13.2":{"e":"'אך אם אתה לו שמעני' means: If only you would listen to me and do as I request.","pe":"He spoke to Ephron in the ears [audience] of the people of the land saying, If you will only listen to me. I have given the money for the field. Take it from me and I will bury my dead there.","re":"If you will only listen to me. [Meaning:] “Would that you listen to me.”","p":[{"q":"What does Rashi say Avraham means by the expression 'אך אם אתה לו שמעני'?","o":["He expresses a wish that Efron listen to him and agree to his request","He sets Efron a condition he must fulfill before negotiations begin","He doubts Efron's ability to understand his words"]},{"q":"How does Rashi understand the tone of Avraham's words to Efron?","o":["As a hopeful wish or expression of desire, not as a demand or condition","As a harsh command that Efron must obey immediately","As a cynical remark doubting Efron's intelligence"]}]},"23:13.3":{"e":"'נתתי' here means I am giving: the money is ready with me, and would that I had already given it to you.","pe":"He spoke to Ephron in the ears [audience] of the people of the land saying, If you will only listen to me. I have given the money for the field. Take it from me and I will bury my dead there.","re":"I have given. Donne [“I am giving”] in Old French. “I have it available and I wish that I had already given it to you.”","p":[{"q":"What does Avraham's 'נתתי' (I have given) mean?","o":["The money is ready in my hand, and would that I had already given it to you","I already deposited the money with a third party","I gave money to Efron in the past"]}]},"23:15.1":{"e":"Efron says: Between two friends like us, what are four hundred shekels worth? They are of no importance. Drop the matter of the sale and go bury your dead.","pe":"My master, hear me. A land [worth] four hundred silver shekel—what is that between me and you? Bury your dead.","re":"Between me and you. Between two friends such as we are, what significance does it have? None! Disregard the sale [for now] and bury your dead!","p":[{"q":"What did Efron mean when he said 'ביני ובינך מה היא ארבע מאות שקל'?","o":["Between friends like us, four hundred shekels are nothing, just bury your dead","He hints that he wants more than four hundred shekels","He is splitting the cost equally with Avraham"]}]},"23:16.1":{"e":"The name 'עפרן' is written without a vav, because Efron said much and did not do even a little: he took from Avraham large shekels, which are kentarin. Therefore it says 'עבר לסוחר,' meaning shekels that are accepted as a shekel everywhere, since there are places where their shekels are large.","pe":"Avraham listened to Ephron, and Avraham weighed out for Ephron the silver that he spoke of in the hearing of the sons of Cheis, four hundred silver shekel, negotiable currency.","re":"Avraham weighed out for Ephron. [עֶפְרֹן is spelled] without a vav because he said much and did not do even a little, for he took superior shekels from him—centenars, as it is said, “Negotiable currency,” i.e., they are accepted as a shekel everywhere for there are places whose shekels are superior which are centenars in Old French.","p":[{"q":"Why is Efron's name written defectively (without a vav) when Avraham pays?","o":["He promised much but did little, and took large coins, so something is lacking in him","It is a scribal abbreviation with no special meaning","To indicate that Efron contributed part of the price"]}]},"23:17.1":{"e":"'ויקם' is an expression of rising: the field rose in importance because it passed from the hand of an ordinary person to the hand of a king. The plain meaning of the verse: the field, the cave in it, and all the trees in it were established for Avraham as a possession, meaning they passed into his ownership.","pe":"The field of Ephron was established [as Avraham’s possession], [the field] which was in Machpeilah, facing Mamrei; [this included] the field, the cave that was in it, and all the trees that were in the field that were in the entire circumference of its boundaries.","re":"The field of Ephron was established. It was elevated [in importance] for it left the possession of a commoner to [become] the possession of a king. The simple meaning of the verse is: The field and the cave within it and all the trees came into Avraham’s possession, etc.","p":[{"q":"What does 'ויקם' (it arose) indicate about the field?","o":["It rose in status from the ownership of an ordinary person to the ownership of a king","It rose in physical height after the purchase","The price of the field rose"]}]},"23:18.1":{"e":"Efron transferred the field to Avraham in the midst of all the people of the city and in the presence of all of them.","pe":"This became Avraham’s [possession] through a purchase before the eyes of the sons of Cheis, all who had come to the gate of his city.","re":"All who had come to the gate of his city. [I.e.,] amongst all of them and in the presence of all, he gave him possession.","p":[{"q":"What is the significance of the presence of the sons of Chet at the transaction?","o":["They all stood as witnesses who gave Avraham a legal title","They were required to approve the sale under local law","They protested the sale to a foreigner"]}]},"24:1.1":{"e":"The word 'בכל' has the same numerical value as the word 'בן.' Hashem blessed Avraham with a son, and since he had a son, he needed to marry him off.","pe":"Avraham was old, advanced in days [years], and Adonoy had blessed Avraham in all things.","re":"Blessed Avraham in all things. בַּכֹּל is numerically equal to בֵּן [son], and since he had a son he needed to find a wife for him.","p":[{"q":"Why does Rashi connect the word 'בכל' ('with everything') to 'בן' (son)?","o":["The gematria of 'בכל' equals that of 'בן'","The word 'בכל' is an acronym of 'בן כל לב'","The Targum translates 'בכל' as 'descendants'"]}]},"24:2.1":{"e":"The word 'זקן' is vocalized here with a patach, because it is in a construct relationship with the following word: the elder of his house.","pe":"Avraham said to his servant, the senior [servant] of his household, who was in charge of all that he owned, Place your hand under my thigh.","re":"The senior [servant] of his household. Since [the word זְקַן] is in the construct state it is punctuated זְקַן [rather than זָקֵן].","p":[{"q":"Why is the kuf in 'זקן' vocalized with a patach here?","o":["Because the noun is in the construct state, 'זקן ביתו'","Because it comes after a guttural letter","Because it is in the pause position at the end of the verse"]}]},"24:2.2":{"e":"One who swears must hold in his hand an object of a mitzvah, such as a Sefer Torah or tefillin. Circumcision was Avraham's first mitzvah, it came to him through pain and was dear to him, so he chose to have the oath taken on it.","pe":"Avraham said to his servant, the senior [servant] of his household, who was in charge of all that he owned, Place your hand under my thigh.","re":"Under my thigh. Since one who takes an oath requires holding a sacred object in his hand such as a Sefer Torah or Tefillin, and circumcision was his first mitzvah and came to him through pain, it was, therefore, dear to him, and he took it.","p":[{"q":"Why did Avraham command the servant to place his hand under his thigh?","o":["One who swears must hold an object of a mitzvah, and circumcision was Avraham's first mitzvah, dear to him through its pain","It was an accepted oath custom in Aram Naharayim","The thigh symbolizes the future descendants who will inherit the land"]}]},"24:7.1":{"e":"Here he said only 'God of heaven' and not 'and God of the earth' as he said earlier. For now Hashem is the God of heaven and the God of earth, because Avraham made His name familiar in people's mouths; but when He took him from his father's house He was only God of heaven, because the people of the world did not recognize Him and His name was not familiar on earth.","pe":"Adonoy, God of heaven, Who took me
