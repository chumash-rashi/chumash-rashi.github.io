<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-soft:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1a212b; --ink:#e6eaf0; --muted:#97a3b3; --line:#2c3644;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1a212b; --ink:#e6eaf0; --muted:#97a3b3; --line:#2c3644;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100dvh;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px;height:100%}
main{flex:1;min-height:0;overflow-y:auto}
header{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:22px;letter-spacing:.01em}
h1 span{font-family:var(--f-ui);font-weight:500;font-size:13px;color:var(--muted);margin-inline-start:8px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.count b{color:var(--ink)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-heb);font-size:24px;line-height:1.75;direction:rtl;text-align:right}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{font-family:var(--f-body);font-size:14px;color:var(--muted);line-height:1.55;margin-top:-6px}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:14px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:16px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.4;width:100%}
.opt .k{flex:none;font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;margin-top:1px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-soft)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.row{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.row .t{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap;min-width:92px}
.row p{margin:0;font-family:var(--f-body);font-size:15.5px;line-height:1.55;min-width:0}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:18px;line-height:1.8;direction:rtl;text-align:right}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted);text-align:center;flex-shrink:0}
.verdict{font-weight:600;font-size:14px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:26px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<script>
const DATA = [{"id": "23:1.1", "ch": 23, "v": 1, "n": 1, "dh": "ויהיו חיי שרה מאה שנה ועשרים שנה ושבע שנים", "pasuk_html": "<mark>וַיִּהְיוּ֙ חַיֵּ֣י שָׂרָ֔ה מֵאָ֥ה שָׁנָ֛ה וְעֶשְׂרִ֥ים שָׁנָ֖ה וְשֶׁ֣בַע שָׁנִ֑ים</mark> שְׁנֵ֖י חַיֵּ֥י שָׂרָֽה׃", "pasuk_en": "Sarah’s lifetime—the span of Sarah’s life—came to one hundred and twenty-seven years.", "rashi_he": "ויהיו חיי שרה מאה שנה ועשרים שנה ושבע שנים. לְכָךְ נִכְתַּב שָׁנָה בְּכָל כְּלָל וּכְלָל, לוֹמַר לְךָ שֶׁכָּל אֶחָד נִדְרָשׁ לְעַצְמוֹ, בַּת ק' כְּבַת כ' לְחֵטְא, מַה בַּת כ' לֹא חָטְאָה, שֶׁהֲרֵי אֵינָהּ בַּת עֳנָשִׁין, אַף בַּת ק' בְּלֹא חֵטְא, וּבַת כ' כְּבַת ז' לְיֹפִי:", "rashi_en": "ויהיו חיי שרה מאה שנה ועשרים שנה ושבע שנים AND THE LIFE OF SARAH WAS 127 YEARS (literally, 100 years, 20 years and 7 years) — The reason the word שנה is written at every term is to tell you that each term must be explained by itself as a complete number: at the age of one hundred she was as a woman of twenty as regards sin — for just as at the age of twenty one may regard her as having never sinned, since she had not then reached the age when she was subject to punishment, so, too, when she was one hundred years old she was sinless — and when she was twenty she was as beautiful as when she was seven (Genesis Rabbah 58:1).", "note": "", "points": [{"q": "Why does the Torah write 'years' after each group of numbers (100, 20, 7)?", "options": ["To teach that each is expounded on its own: at 100 like 20 (sinless), at 20 like 7 (beautiful)", "To emphasize that Sarah lived a very long life", "To match the style of other age descriptions in the Torah"], "kasha": "Why is the word 'years' repeated redundantly after each number?", "answer": "Each group is its own unit of interpretation: at 100 she was like 20 regarding sin, and at 20 she was like 7 regarding beauty."}]}, {"id": "23:1.2", "ch": 23, "v": 1, "n": 2, "dh": "שני חיי שרה", "pasuk_html": "וַיִּהְיוּ֙ חַיֵּ֣י שָׂרָ֔ה מֵאָ֥ה שָׁנָ֛ה וְעֶשְׂרִ֥ים שָׁנָ֖ה וְשֶׁ֣בַע שָׁנִ֑ים <mark>שְׁנֵ֖י חַיֵּ֥י שָׂרָֽה׃</mark>", "pasuk_en": "Sarah’s lifetime—the span of Sarah’s life—came to one hundred and twenty-seven years.", "rashi_he": "שני חיי שרה. כֻּלָּן שָׁוִין לְטוֹבָה:", "rashi_en": "שני חיי שרה THE YEARS OF SARAH’S LIFE — The word years is repeated and without a number to indicate that they were all equally good. ", "note": "", "points": [{"q": "What does the phrase 'the years of Sarah's life' (repeated without a number) teach?", "options": ["They were all equally good", "She lived without any suffering", "She never aged physically"], "kasha": "Why does the Torah add 'the years of Sarah's life' at the end when it already listed the years?", "answer": "The extra phrase teaches that all the years of her life were equally good."}]}, {"id": "23:2.1", "ch": 23, "v": 2, "n": 1, "dh": "בקרית ארבע", "pasuk_html": "וַתָּ֣מׇת שָׂרָ֗ה <mark>בְּקִרְיַ֥ת אַרְבַּ֛ע</mark> הִ֥וא חֶבְר֖וֹן בְּאֶ֣רֶץ כְּנָ֑עַן וַיָּבֹא֙ אַבְרָהָ֔ם לִסְפֹּ֥ד לְשָׂרָ֖ה וְלִבְכֹּתָֽהּ׃", "pasuk_en": "Sarah died in Kiriath-arba—now Hebron—in the land of Canaan; and Abraham proceeded to mourn for Sarah and to bewail her.", "rashi_he": "בקרית ארבע. עַל שֵׁם אַרְבַּע עֲנָקִים שֶׁהָיוּ שָׁם, אֲחִימָן שֵׁשַׁי וְתַלְמַי וַאֲבִיהֶם. דָּ\"אַ עַל שֵׁם אַרְבַּע זוּגוֹת שֶׁנִקְבְּרוּ שָׁם אִישׁ וְאִשְׁתּוֹ, אָדָם וְחַוָּה, אַבְרָהָם וְשָׂרָה, יִצְחָק וְרִבְקָה, יַעֲקֹב וְלֵאָה (בראשית רבה):", "rashi_en": "בקרית ארבע literally, the city of the Four, and it was so called because of the four giants who lived there: Ahiman, Sheshai, Talmai and their father (Numbers 13:22). Another explanation is that it was so called because of the four couples who were buried there, man and wife — Adam and Eve, Abraham and Sarah, Isaac and Rebecca, Jacob and Leah (Genesis Rabbah 58:4).", "note": "", "points": [{"q": "Why is Hebron called Kiriath-arba ('City of Four')?", "options": ["Because of four giants who lived there, or four couples buried there", "Because it had four gates", "Because it was divided into four districts"], "kasha": "What is the significance of the name 'Kiriath-arba' (City of Four)?", "answer": "It is called so either because of the four giants (Ahiman, Sheshai, Talmai, and their father) or the four couples buried there (Adam/Eve, Abraham/Sarah, Isaac/Rebecca, Jacob/Leah)."}]}, {"id": "23:2.2", "ch": 23, "v": 2, "n": 2, "dh": "ויבא אברהם", "pasuk_html": "וַתָּ֣מׇת שָׂרָ֗ה בְּקִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּאֶ֣רֶץ כְּנָ֑עַן <mark>וַיָּבֹא֙ אַבְרָהָ֔ם</mark> לִסְפֹּ֥ד לְשָׂרָ֖ה וְלִבְכֹּתָֽהּ׃", "pasuk_en": "Sarah died in Kiriath-arba—now Hebron—in the land of Canaan; and Abraham proceeded to mourn for Sarah and to bewail her.", "rashi_he": "ויבא אברהם. מִבְּאֵר שֶׁבַע:", "rashi_en": "ויבא אברהם AND ABRAHAM CAME from Beer-Sheba", "note": "", "points": [{"q": "Where did Abraham come from when he arrived to mourn Sarah?", "options": ["From Beer-Sheba", "From Mount Moriah", "From Haran"], "kasha": "Why does the Torah say Abraham 'came' — where was he coming from?", "answer": "He came from Beer-Sheba."}]}, {"id": "23:2.3", "ch": 23, "v": 2, "n": 3, "dh": "לספוד לשרה ולבכותה", "pasuk_html": "וַתָּ֣מׇת שָׂרָ֗ה בְּקִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּאֶ֣רֶץ כְּנָ֑עַן וַיָּבֹא֙ אַבְרָהָ֔ם לִסְפֹּ֥ד לְשָׂרָ֖ה וְלִבְכֹּתָֽהּ׃", "pasuk_en": "Sarah died in Kiriath-arba—now Hebron—in the land of Canaan; and Abraham proceeded to mourn for Sarah and to bewail her.", "rashi_he": "לספוד לשרה ולבכתה. וְנִסְמְכָה מִיתַת שָׂרָה לַעֲקֵדַת יִצְחָק לְפִי שֶׁעַל יְדֵי בְּשׂוֹרַת הָעֲקֵדָה, שֶׁנִּזְדַּמֵּן בְּנָהּ לִשְׁחִיטָה וְכִמְעַט שֶׁלֹּא נִשְׁחַט, פָּרְחָה נִשְׁמָתָהּ מִמֶּנָּה וּמֵתָה:", "rashi_en": "לספוד לשרה ולבכותה TO BEWAIL SARAH AND TO WEEP FOR HER — The narrative of the death of Sarah follows immediately on that of the Binding of Isaac, because through the announcement of the Binding — that her son had been made ready for sacrifice and had almost been sacrificed — she received a great shock (literally, her soul flew from her) and she died (Pirkei DeRabbi Eliezer 32). ", "note": "", "points": [{"q": "Why is Sarah's death placed right after the Binding of Isaac?", "options": ["The news that her son was nearly sacrificed shocked her and her soul departed", "To show Abraham mourned immediately after the Akeidah", "Because both events happened in the same year"], "kasha": "Why does the Torah juxtapose Sarah's death with the Binding of Isaac?", "answer": "When Sarah heard the announcement that her son had been bound on the altar and nearly slaughtered, the shock caused her soul to depart."}]}, {"id": "23:4.1", "ch": 23, "v": 4, "n": 1, "dh": "גר ותושב אנכי עמכם", "pasuk_html": "גֵּר־וְתוֹשָׁ֥ב אָנֹכִ֖י עִמָּכֶ֑ם תְּנ֨וּ לִ֤י אֲחֻזַּת־קֶ֙בֶר֙ עִמָּכֶ֔ם וְאֶקְבְּרָ֥ה מֵתִ֖י מִלְּפָנָֽי׃", "pasuk_en": "“I am a resident alien among you; sell me a burial site among you, that I may remove my dead for burial.” ", "rashi_he": "גר ותושב אנכי עמכם. גֵּר מֵאֶרֶץ אַחֶרֶת וְנִתְיַשַּׁבְתִּי עִמָּכֶם. וּמִדְרַשׁ אַגָּדָה אִם תִּרְצוּ הֲרֵינִי גֵּר, וְאִם לָאו אֶהְיֶה תּוֹשָׁב וְאֶטְּלֶנָּה מִן הַדִּין, שֶׁאָמַר לִי הַקָּבָּ\"ה לְזַרְעֲךָ אֶתֵּן אֶת הָאָרֶץ הַזֹּאת:", "rashi_en": "גר ותושב אנכי עמכם I AM A STRANGER AND A SETTLER WITH YOU — A stranger having come from another land, but I have settled down amongst you. A Midrashic explanation is: if you agree to sell me the land then I will regard myself as a stranger and will pay for it, but if not, I shall claim it as a settler and will take it as my legal right, because the Holy One, blessed be He, said to me, (12:7) “Unto thy seed I give this land\" (Genesis Rabbah 58:6).", "note": "", "points": [{"q": "What is the double meaning of Abraham calling himself 'a stranger and a settler'?", "options": ["If you sell willingly I am a stranger who will pay; if not, I will claim it as a settler by divine right", "He was both a newcomer and a long-time resident of the area", "He felt like a foreigner spiritually but at home physically"], "kasha": "Why does Abraham describe himself with two contradictory terms — stranger AND settler?", "answer": "If you agree to sell, I am a stranger and will pay. If not, I will take it as a settler by right, since God promised me this land."}]}, {"id": "23:4.2", "ch": 23, "v": 4, "n": 2, "dh": "אחזת קבר", "pasuk_html": "גֵּר־וְתוֹשָׁ֥ב אָנֹכִ֖י עִמָּכֶ֑ם תְּנ֨וּ לִ֤י אֲחֻזַּת־קֶ֙בֶר֙ עִמָּכֶ֔ם וְאֶקְבְּרָ֥ה מֵתִ֖י מִלְּפָנָֽי׃", "pasuk_en": "“I am a resident alien among you; sell me a burial site among you, that I may remove my dead for burial.” ", "rashi_he": "אחוזת קבר. אֲחֻזַּת קַרְקַע לְבֵית הַקְּבָרוֹת:", "rashi_en": "אחזת קבר A POSSESSION OF A BURYING PLACE — means possession of land to serve as a burying place. ", "note": "", "points": [{"q": "What does 'achuzat kever' mean?", "options": ["A possession of land to serve as a burial site", "A temporary resting place for the dead", "A family inheritance"], "kasha": "What is the precise meaning of the term 'achuzat kever'?", "answer": "It means a possession of land designated to serve as a burying place."}]}, {"id": "23:6.1", "ch": 23, "v": 6, "n": 1, "dh": "לא יכלה", "pasuk_html": "שְׁמָעֵ֣נוּ&thinsp;׀ אֲדֹנִ֗י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּתוֹכֵ֔נוּ בְּמִבְחַ֣ר קְבָרֵ֔ינוּ קְבֹ֖ר אֶת־מֵתֶ֑ךָ אִ֣ישׁ מִמֶּ֔נּוּ אֶת־קִבְר֛וֹ לֹֽא־יִכְלֶ֥ה מִמְּךָ֖ מִקְּבֹ֥ר מֵתֶֽךָ׃", "pasuk_en": "“Hear us, my lord: you are the elect of God among us. Bury your dead in the choicest of our burial places; none of us will withhold his burial place from you for burying your dead.” ", "rashi_he": "לא יכלה. לֹא יִמְנַע כְּמוֹ לֹא תִכְלָא רַחֲמֶיךָ (תהילים מ') וּכְמוֹ וַיִּכָּלֵא הַגֶּשֶׁם (בראשית ח'):", "rashi_en": "לא יכלה means will not withhold, just as (Psalms 40:12) “Thou wilt not withhold (תכלא) Thy mercies”, and (Genesis 8:2) “And the rain was restrained (ויכלא).", "note": "", "points": [{"q": "What does 'lo yichleh' mean in context?", "options": ["Will not withhold, as in Psalms 40:12", "Will not be able, expressing inability", "Will not finish or complete"], "kasha": "What is the meaning of the unusual word 'yichleh'?", "answer": "It means 'will not withhold,' as the same usage appears in Psalms 40:12."}]}, {"id": "23:8.1", "ch": 23, "v": 8, "n": 1, "dh": "נפשכם", "pasuk_html": "וַיְדַבֵּ֥ר אִתָּ֖ם לֵאמֹ֑ר אִם־יֵ֣שׁ אֶֽת־<mark>נַפְשְׁכֶ֗ם</mark> לִקְבֹּ֤ר אֶת־מֵתִי֙ מִלְּפָנַ֔י שְׁמָע֕וּנִי וּפִגְעוּ־לִ֖י בְּעֶפְר֥וֹן בֶּן־צֹֽחַר׃", "pasuk_en": "and he said to them, “If it is your wish that I remove my dead for burial, you must agree to intercede for me with Ephron son of Zohar. ", "rashi_he": "נפשכם. רְצוֹנְכֶם:", "rashi_en": "נפשכם means YOUR WILL.", "note": "", "points": [{"q": "What does 'nafshekhem' mean here?", "options": ["Your will or desire", "Your soul", "Your life"], "kasha": "What does the word 'nefesh' mean in this context?", "answer": "Here 'nefesh' means your will or desire, not soul."}]}, {"id": "23:8.2", "ch": 23, "v": 8, "n": 2, "dh": "ופגעו לי", "pasuk_html": "וַיְדַבֵּ֥ר אִתָּ֖ם לֵאמֹ֑ר אִם־יֵ֣שׁ אֶֽת־נַפְשְׁכֶ֗ם לִקְבֹּ֤ר אֶת־מֵתִי֙ מִלְּפָנַ֔י שְׁמָע֕וּנִי וּפִגְעוּ־לִ֖י בְּעֶפְר֥וֹן בֶּן־צֹֽחַר׃", "pasuk_en": "and he said to them, “If it is your wish that I remove my dead for burial, you must agree to intercede for me with Ephron son of Zohar. ", "rashi_he": "ופגעו לי. לְשוֹן בַּקָּשָׁה כְּמוֹ: אַל תִּפְגְּעִי בִּי (רות א'):", "rashi_en": "ופגעו לי — This phrase signifies entreaty, as (Ruth 1:16) “Do not entreat (תפגעי) me”. ", "note": "", "points": [{"q": "What does the word 'ufig'u' signify?", "options": ["Entreaty, as in Ruth 1:16 'Do not entreat me'", "A hostile confrontation", "A chance meeting"], "kasha": "What is the meaning of the root פגע here?", "answer": "It signifies entreaty or pleading, as demonstrated by Ruth 1:16 where the same root means 'do not entreat me.'"}]}, {"id": "23:9.1", "ch": 23, "v": 9, "n": 1, "dh": "המכפלה", "pasuk_html": "וְיִתֶּן־לִ֗י אֶת־מְעָרַ֤ת <mark>הַמַּכְפֵּלָה֙</mark> אֲשֶׁר־ל֔וֹ אֲשֶׁ֖ר בִּקְצֵ֣ה שָׂדֵ֑הוּ בְּכֶ֨סֶף מָלֵ֜א יִתְּנֶ֥נָּה לִּ֛י בְּתוֹכְכֶ֖ם לַאֲחֻזַּת־קָֽבֶר׃", "pasuk_en": "Let him sell me the cave of Machpelah that he owns, which is at the edge of his land. Let him sell it to me, at the full price, for a burial site in your midst.”", "rashi_he": "המכפלה. בַּית וַעֲלִיָּה עַל גַּבָּיו. דָּ\"אַ שֶׁכְּפוּלָה בְּזוּגוֹת (עירובין נ\"ג):", "rashi_en": "המכפלה MACHPELAH (the root, כפל, means double) — it had a lower and an upper cavern. Another explanation of why it was so called is, because it has the characteristic of being doubled on account of the couples who are buried there (see Rashi in verse 2) (Eruvin 53a).", "note": "", "points": [{"q": "Why is the cave called 'Machpelah'?", "options": ["From the root meaning 'double' — it had two levels, or it held couples", "Because it was in a doubled-over hill", "Because Abraham paid double the price"], "kasha": "What does the name 'Machpelah' signify?", "answer": "The root means 'double.' Either it had a lower and upper cavern, or it is called so because of the couples buried there."}]}, {"id": "23:9.2", "ch": 23, "v": 9, "n": 2, "dh": "בכסף מלא", "pasuk_html": "וְיִתֶּן־לִ֗י אֶת־מְעָרַ֤ת הַמַּכְפֵּלָה֙ אֲשֶׁר־ל֔וֹ אֲשֶׁ֖ר בִּקְצֵ֣ה שָׂדֵ֑הוּ <mark>בְּכֶ֨סֶף מָלֵ֜א</mark> יִתְּנֶ֥נָּה לִּ֛י בְּתוֹכְכֶ֖ם לַאֲחֻזַּת־קָֽבֶר׃", "pasuk_en": "Let him sell me the cave of Machpelah that he owns, which is at the edge of his land. Let him sell it to me, at the full price, for a burial site in your midst.”", "rashi_he": "בכסף מלא. שָׁלֵם, כָּל שָׁוְיָהּ; וְכֵן דָּוִד אָמַר לַאֲרַוְנָה בְּכֶסֶף מָלֵא (דברי הימים א כ\"א):", "rashi_en": "בכסף מלא FOR ITS FULL VALUE IN SILVER — מלא means שלם so that the phrase means all that it is worth. Thus, too, did David say to Ornan, (1 Chronicles 21:22) “for full money”. ", "note": "", "points": [{"q": "What does 'kesef malei' (full money) mean?", "options": ["The complete amount the land is worth, as David said to Ornan", "Silver coins filled to the brim of a container", "An exaggerated sum beyond the land's value"], "kasha": "What is the meaning of 'malei' (full) regarding the money?", "answer": "'Malei' means 'shalem' — all that the land is worth. David used the same expression when purchasing from Ornan."}]}, {"id": "23:10.1", "ch": 23, "v": 10, "n": 1, "dh": "ועפרון ישב", "pasuk_html": "<mark>וְעֶפְר֥וֹן יֹשֵׁ֖ב</mark> בְּת֣וֹךְ בְּנֵי־חֵ֑ת וַיַּ֩עַן֩ עֶפְר֨וֹן הַחִתִּ֤י אֶת־אַבְרָהָם֙ בְּאׇזְנֵ֣י בְנֵי־חֵ֔ת לְכֹ֛ל בָּאֵ֥י שַֽׁעַר־עִיר֖וֹ לֵאמֹֽר׃", "pasuk_en": "Ephron was present among the Hittites; so Ephron the Hittite answered Abraham in the hearing of the Hittites, all who entered the gate of his town,ball who entered the gate of his town I.e., the assembly in his town’s gate. saying, ", "rashi_he": "ועפרון ישב. כְּתִיב חָסֵר, אוֹתוֹ הַיּוֹם מִנּוּהוּ שׁוֹטֵר עֲלֵיהֶם; מִפְּנֵי חֲשִׁיבוּתוֹ שֶׁל אַבְרָהָם שֶׁהָיָה צָרִיךְ לוֹ, עָלָה לִגְדֻלָּה:", "rashi_en": "ועפרון ישב The verb is written without a ו so that it may be read ישב he sat, thus indicating that on that very day they had appointed him (Ephron) to be an officer over them. Because of the high standing of Abraham who needed to negotiate with him, he was elevated to a dignified position (so that Abraham whom they esteemed as a great prince might have to negotiate with an equal and not with an inferior person (Genesis Rabbah 58:7). ", "note": "", "points": [{"q": "Why is Ephron's name written defectively (without vav) as 'yoshev'?", "options": ["That day they appointed him an officer, elevated because Abraham needed him", "He was sitting in judgment as an established leader", "He was a humble man who sat on the ground"], "kasha": "Why is 'yoshev' written defectively (without vav)?", "answer": "Read as 'yashav' (sat down), meaning that very day they appointed Ephron as an officer, elevating him because Abraham had need of him."}]}, {"id": "23:10.2", "ch": 23, "v": 10, "n": 2, "dh": "לכל באי שער עירו", "pasuk_html": "וְעֶפְר֥וֹן יֹשֵׁ֖ב בְּת֣וֹךְ בְּנֵי־חֵ֑ת וַיַּ֩עַן֩ עֶפְר֨וֹן הַחִתִּ֤י אֶת־אַבְרָהָם֙ בְּאׇזְנֵ֣י בְנֵי־חֵ֔ת לְכֹ֛ל בָּאֵ֥י שַֽׁעַר־עִיר֖וֹ לֵאמֹֽר׃", "pasuk_en": "Ephron was present among the Hittites; so Ephron the Hittite answered Abraham in the hearing of the Hittites, all who entered the gate of his town,ball who entered the gate of his town I.e., the assembly in his town’s gate. saying, ", "rashi_he": "לכל באי שער עירו. שֶׁכֻּלָּן בָּטְלוּ מִמְּלָאכְתָּן וּבָאוּ לִגְמֹל חֶסֶד לְשָׂרָה:", "rashi_en": "לכל באי שער עירו OF ALL THAT CAME IN AT THE GATE OF HIS CITY — for they all left their work and came to pay their last respect to Sarah (Genesis Rabbah 58:7). ", "note": "", "points": [{"q": "Why does the Torah mention 'all who entered the gate of his city'?", "options": ["They all left their work to come pay last respects to Sarah", "They came to witness a legal transaction", "They gathered for a scheduled city assembly"], "kasha": "Why does the Torah emphasize that all the townspeople were present?", "answer": "They all left their occupations and came to pay their last respects to Sarah."}]}, {"id": "23:11.1", "ch": 23, "v": 11, "n": 1, "dh": "לא אדני", "pasuk_html": "לֹֽא־אֲדֹנִ֣י שְׁמָעֵ֔נִי הַשָּׂדֶה֙ נָתַ֣תִּי לָ֔ךְ וְהַמְּעָרָ֥ה אֲשֶׁר־בּ֖וֹ לְךָ֣ נְתַתִּ֑יהָ לְעֵינֵ֧י בְנֵי־עַמִּ֛י נְתַתִּ֥יהָ לָּ֖ךְ קְבֹ֥ר מֵתֶֽךָ׃", "pasuk_en": "“No, my lord, hear me: I give you the field and I give you the cave that is in it; I give it to you in the presence of my people. Bury your dead.” ", "rashi_he": "לא אדני. לֹא תִּקְנֶה אוֹתָהּ בְּדָמִים:", "rashi_en": "לא אדני NAY, MY LORD — You are not to buy it with money.", "note": "", "points": [{"q": "What did Ephron mean by 'No, my lord'?", "options": ["You should not have to buy it with money — I give it to you", "He refused to sell the field at all", "He wanted Abraham to negotiate a lower price"], "kasha": "What is Ephron refusing when he says 'No, my lord'?", "answer": "He is saying: You are not to buy it with money; I am giving it to you."}]}, {"id": "23:11.2", "ch": 23, "v": 11, "n": 2, "dh": "נתתי לך", "pasuk_html": "לֹֽא־אֲדֹנִ֣י שְׁמָעֵ֔נִי הַשָּׂדֶה֙ <mark>נָתַ֣תִּי לָ֔ךְ</mark> וְהַמְּעָרָ֥ה אֲשֶׁר־בּ֖וֹ לְךָ֣ נְתַתִּ֑יהָ לְעֵינֵ֧י בְנֵי־עַמִּ֛י נְתַתִּ֥יהָ לָּ֖ךְ קְבֹ֥ר מֵתֶֽךָ׃", "pasuk_en": "“No, my lord, hear me: I give you the field and I give you the cave that is in it; I give it to you in the presence of my people. Bury your dead.” ", "rashi_he": "נתתי לך. הֲרֵי הוּא כְּמוֹ שֶׁנְּתַתִּיהָ לְךָ:", "rashi_en": "נתתי לך I HAVE GIVEN IT TO THEE (a perfect tense) — See, it is as though I have already given it to you. ", "note": "", "points": [{"q": "Why does Ephron use the past tense 'natati' (I have given)?", "options": ["It is as though he has already given it — the gift is certain in his mind", "He had previously promised the field to Abraham", "He had already transferred the deed"], "kasha": "Why use the perfect (past) tense 'I have given' for something not yet done?", "answer": "The perfect tense conveys certainty: it is as though the giving has already been completed."}]}, {"id": "23:13.1", "ch": 23, "v": 13, "n": 1, "dh": "אך אם אתה לו שמעני", "pasuk_html": "וַיְדַבֵּ֨ר אֶל־עֶפְר֜וֹן בְּאׇזְנֵ֤י עַם־הָאָ֙רֶץ֙ לֵאמֹ֔ר אַ֛ךְ אִם־אַתָּ֥ה ל֖וּ שְׁמָעֵ֑נִי נָתַ֜תִּי כֶּ֤סֶף הַשָּׂדֶה֙ קַ֣ח מִמֶּ֔נִּי וְאֶקְבְּרָ֥ה אֶת־מֵתִ֖י שָֽׁמָּה׃", "pasuk_en": "and spoke to Ephron in the hearing of the people of the land, saying, “If only you would hear me out! Let me pay the price of the land; accept it from me, that I may bury my dead there.” ", "rashi_he": "אך אם אתה לו שמעני. אַתָּה אוֹמֵר לִי לִשְׁמֹעַ לְךָ וְלִקַּח בְּחִנָּם, אֲנִי אִי אֶפְשִׁי בְּכָךְ:", "rashi_en": "אך אם אתה לו שמעני BUT IF THOU WOULDST ONLY HEAR ME — You tell me to listen to you (verse 11) and to accept it without payment. I do not desire this: ", "note": "", "points": [{"q": "What is Abraham's response to Ephron's offer of a free gift?", "options": ["He does not desire the field for free and insists on paying", "He accepts gratefully but offers a token payment", "He asks Ephron to lower the price"], "kasha": "Why does Abraham say 'If only you would hear me out' after being offered the field for free?", "answer": "Abraham says: You tell me to accept it without payment, but I do not desire this. Please listen to me instead."}, {"q": "What does Abraham wish Ephron would do?", "options": ["Listen to him and accept payment for the field", "Give him additional land nearby", "Allow him to pay in installments"], "kasha": "What is Abraham asking when he says 'if only you would hear me'?", "answer": "He wishes Ephron would listen and do as he asks — accept full payment for the field."}]}, {"id": "23:13.2", "ch": 23, "v": 13, "n": 2, "dh": "אך אם אתה לו שמעני", "pasuk_html": "וַיְדַבֵּ֨ר אֶל־עֶפְר֜וֹן בְּאׇזְנֵ֤י עַם־הָאָ֙רֶץ֙ לֵאמֹ֔ר אַ֛ךְ אִם־אַתָּ֥ה ל֖וּ שְׁמָעֵ֑נִי נָתַ֜תִּי כֶּ֤סֶף הַשָּׂדֶה֙ קַ֣ח מִמֶּ֔נִּי וְאֶקְבְּרָ֥ה אֶת־מֵתִ֖י שָֽׁמָּה׃", "pasuk_en": "and spoke to Ephron in the hearing of the people of the land, saying, “If only you would hear me out! Let me pay the price of the land; accept it from me, that I may bury my dead there.” ", "rashi_he": "אך אם אתה לו שמעני. הַלְוַאי וְתִשְׁמָעֵנִי:", "rashi_en": "BUT IF THOU WOULDST ONLY HEAR ME!—i.e. I only wish that you would listen to me and do as I ask.", "note": "", "points": [{"q": "What does Rashi say Abraham means by the phrase 'If only you would hear me out'?", "options": ["He is expressing a wish that Ephron would listen to him and agree to his request", "He is giving Ephron a condition that must be met before any negotiation can begin", "He is doubting whether Ephron has the ability to understand what he is saying"], "kasha": "The phrase 'aach im attah lo shme'ani' seems grammatically odd and requires clarification of what Abraham is actually requesting or wishing for", "answer": "Rashi explains that Abraham is expressing a wish (halevai—'I only wish that')—he wants Ephron to listen to him and comply with his request to sell the field."}, {"q": "How does Rashi understand the tone of Abraham's opening words to Ephron?", "options": ["As a hopeful wish or expression of desire rather than a demand or condition", "As a stern command that Ephron must obey immediately", "As a sarcastic remark questioning Ephron's intelligence"], "kasha": "The Hebrew construction 'aach im' is ambiguous and could be read multiple ways, requiring interpretation of Abraham's intent", "answer": "Rashi interprets it as a wish or hopeful expression (halevai), showing that Abraham is politely requesting Ephron's cooperation rather than issuing a command."}]}, {"id": "23:13.3", "ch": 23, "v": 13, "n": 3, "dh": "נתתי", "pasuk_html": "וַיְדַבֵּ֨ר אֶל־עֶפְר֜וֹן בְּאׇזְנֵ֤י עַם־הָאָ֙רֶץ֙ לֵאמֹ֔ר אַ֛ךְ אִם־אַתָּ֥ה ל֖וּ שְׁמָעֵ֑נִי <mark>נָתַ֜תִּי</mark> כֶּ֤סֶף הַשָּׂדֶה֙ קַ֣ח מִמֶּ֔נִּי וְאֶקְבְּרָ֥ה אֶת־מֵתִ֖י שָֽׁמָּה׃", "pasuk_en": "and spoke to Ephron in the hearing of the people of the land, saying, “If only you would hear me out! Let me pay the price of the land; accept it from me, that I may bury my dead there.” ", "rashi_he": "נתתי. דני\"ש בלע\"ז, מוּכָן הוּא אֶצְלִי, וְהַלְוַאי נָתַתִּי לְךָ כְּבָר:", "rashi_en": "נתתי I GIVE (perfect with present sense) old French donne; English I give. I have the money ready and I only wish that I had already given it to you.", "note": "", "points": [{"q": "What does Abraham's 'natati' (I have given) mean?", "options": ["I have the money ready and wish I had already given it to you", "I already deposited the money with a third party", "I gave money to Ephron previously"], "kasha": "Why does Abraham also use the perfect tense 'natati' (I have given) for money not yet handed over?", "answer": "The perfect tense expresses readiness: I have the money prepared and wish I could have already given it to you."}]}, {"id": "23:15.1", "ch": 23, "v": 15, "n": 1, "dh": "ביני ובינך", "pasuk_html": "אֲדֹנִ֣י שְׁמָעֵ֔נִי אֶ֩רֶץ֩ אַרְבַּ֨ע מֵאֹ֧ת שֶֽׁקֶל־כֶּ֛סֶף <mark>בֵּינִ֥י וּבֵֽינְךָ֖</mark> מַה־הִ֑וא וְאֶת־מֵתְךָ֖ קְבֹֽר׃", "pasuk_en": "“My lord, do hear me! A piece of land worth four hundred shekels of silver—what is that between you and me? Go and bury your dead.” ", "rashi_he": "ביני ובינך. בֵּין שְׁנֵי אוֹהֲבִים כָּמוֹנוּ מַה הִיא חֲשׁוּבָה לִכְלוּם, אֶלָּא הַנַּח אֶת הַמֶּכֶר וְאֶת מֵתְךָ קְבֹר (בראשית רבה):", "rashi_en": "ביני ובינך BETWEEN ME AND THEE — Between two such friends as we are, of what importance is that? Nothing at all! Leave business alone and bury your dead! ", "note": "", "points": [{"q": "What does Ephron mean by 'between you and me, what is 400 shekels'?", "options": ["Between friends like us, 400 shekels is nothing — just bury your dead", "He is hinting that he wants more than 400 shekels", "He is splitting the cost equally with Abraham"], "kasha": "Why does Ephron mention the sum and then dismiss it?", "answer": "He says: Between two friends like us, what importance is 400 shekels? It is nothing! Leave the business aside and bury your dead."}]}, {"id": "23:16.1", "ch": 23, "v": 16, "n": 1, "dh": "וישקל אברהם לעפרן", "pasuk_html": "וַיִּשְׁמַ֣ע אַבְרָהָם֮ אֶל־עֶפְרוֹן֒ <mark>וַיִּשְׁקֹ֤ל אַבְרָהָם֙ לְעֶפְרֹ֔ן</mark> אֶת־הַכֶּ֕סֶף אֲשֶׁ֥ר דִּבֶּ֖ר בְּאׇזְנֵ֣י בְנֵי־חֵ֑ת אַרְבַּ֤ע מֵאוֹת֙ שֶׁ֣קֶל כֶּ֔סֶף עֹבֵ֖ר לַסֹּחֵֽר׃", "pasuk_en": "Abraham accepted Ephron’s terms. Abraham paid out to Ephron the money that he had named in the hearing of the Hittites—four hundred shekels of silver at the going merchants’ rate.", "rashi_he": "וישקל אברהם לעפרן. חָסֵר וָי\"ו; לְפִי שֶׁאָמַר הַרְבֵּה, וַאֲפִלּוּ מְעַט לֹא עָשָׂה (בבא מציעא פ\"ז), שֶׁנָּטַל מִמֶּנוּ שְׁקָלִים גְּדוֹלִים שֶׁהֵן קַנְטָרִין, שֶׁנֶּאֱמַר עֹבֵר לַסֹּחֵר, שֶׁמִּתְקַבְּלִים בְּשֶׁקֶל בְּכָל מָקוֹם (שם ובכורות נ'), וְיֵשׁ מָקוֹם שֶׁשִּׁקְלֵיהֶן גְּדוֹלִים, שֶׁהֵן קַנְטָרִין צנטינא\"רש בלע\"ז:", "rashi_en": "וישקל אברהם לעפרן AND ABRAHAM WEIGHED TO EPHRON [THE SILVER] — The name Ephron is written defectively (without the ו) to indicate that there was something missing in Ephron viz, sincerity — because he promised much but did not do even the very least (Bava Metzia 87a): He took from him big Shekels, viz., centenaria (worth a full 100 smaller units) as it is said, “money current with the merchant” which means, such coins as were everywhere accepted as worth a full Shekel — for there are places where their Shekels are of large size, centenaria; old French Centenars (cf. Ruth R. 7). ", "note": "", "points": [{"q": "Why is Ephron's name written defectively (without vav) when Abraham pays?", "options": ["He promised much but delivered little, and took oversized currency — something was missing in him", "It is a scribal abbreviation with no special meaning", "To indicate Ephron donated part of the price"], "kasha": "Why is Ephron's name suddenly spelled without the letter vav?", "answer": "The defective spelling hints that something was missing in Ephron — his sincerity. He promised much but did not do even the least, and he took large oversized shekels as payment."}]}, {"id": "23:17.1", "ch": 23, "v": 17, "n": 1, "dh": "ויקם שדה עפרון", "pasuk_html": "וַיָּ֣קׇם&thinsp;׀ שְׂדֵ֣ה עֶפְר֗וֹן אֲשֶׁר֙ בַּמַּכְפֵּלָ֔ה אֲשֶׁ֖ר לִפְנֵ֣י מַמְרֵ֑א הַשָּׂדֶה֙ וְהַמְּעָרָ֣ה אֲשֶׁר־בּ֔וֹ וְכׇל־הָעֵץ֙ אֲשֶׁ֣ר בַּשָּׂדֶ֔ה אֲשֶׁ֥ר בְּכׇל־גְּבֻל֖וֹ סָבִֽיב׃", "pasuk_en": "So Ephron’s land in Machpelah, near Mamre—the field with its cave and all the trees anywhere within the confines of that field—passed ", "rashi_he": "ויקם שדה עפרון. תְּקוּמָה הָיְתָה לוֹ, שֶׁיָּצָא מִיַּד הֶדְיוֹט לְיַד מֶלֶךְ; וּפְשׁוּטוֹ שֶׁל מִקְרָא וַיָּקָם הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ וְכָל הָעֵץ לְאַבְרָהָם לְמִקְנָה וגו':", "rashi_en": "ויקם שדה עפרון AND THE FIELD OF EPHRON WAS MADE SURE (literally, it rose) — It received a rise in importance because it passed from the possession of a commoner (הדיוט an ordinary person) into the possession of a king (Genesis Rabbah 58:8). But the real meaning of the verse is: The field and the cave that was therein and all the trees … became secured to Abraham as a possession etc. (i. e. verse 17 is an incomplete sentence and must be read together with verse 18, thus: ויקם השדה וגו… לאברהם למקנה —The field etc. became secured to Abraham as a possession). ", "note": "", "points": [{"q": "What does 'vayakom' (it rose) indicate about the field?", "options": ["It rose in status from a commoner's possession to a king's possession", "It physically rose in elevation after the purchase", "The price of the field increased"], "kasha": "Why does the Torah use the word 'vayakom' (it rose/was established) for the field?", "answer": "The field rose in importance — it went from being a commoner's possession to belonging to a king (Abraham)."}]}, {"id": "23:18.1", "ch": 23, "v": 18, "n": 1, "dh": "בכל באי שער עירו", "pasuk_html": "לְאַבְרָהָ֥ם לְמִקְנָ֖ה לְעֵינֵ֣י בְנֵי־חֵ֑ת בְּכֹ֖ל בָּאֵ֥י שַֽׁעַר־עִירֽוֹ׃", "pasuk_en": "to Abraham as his possession, in the presence of the Hittites, of the assembly in his town’s gate. ", "rashi_he": "בכל באי שער עירו. בְּקֶרֶב כֻּלָּם וּבְמַעֲמַד כֻּלָּם הִקְנָהוּ לוֹ:", "rashi_en": "בכל באי שער עירו BEFORE ALL THAT CAME IN AT THE GATE OF HIS CITY — In the midst of all them, and with all of them standing by he gave him legal possession of it.", "note": "", "points": [{"q": "What is the significance of the Hittites being present at the transaction?", "options": ["They all stood by as witnesses giving Abraham legal possession", "They were required to approve the sale by local law", "They protested the sale to an outsider"], "kasha": "Why does the Torah emphasize the presence of all who entered the city gate?", "answer": "In the midst of all of them standing by, Ephron gave Abraham legal possession of the field and cave."}]}, {"id": "24:1.1", "ch": 24, "v": 1, "n": 1, "dh": "ברך את אברהם בכל", "pasuk_html": "וְאַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּיָּמִ֑ים וַֽיהֹוָ֛ה בֵּרַ֥ךְ אֶת־אַבְרָהָ֖ם בַּכֹּֽל׃", "pasuk_en": "Abraham was now old, advanced in years, and GOD had blessed Abraham in all things. ", "rashi_he": "ברך את אברהם בכל. בַּכֹּל עוֹלֶה בְּגִימַטְרִיָּא בֵּן, וּמֵאַחַר שֶׁהָיָה לוֹ בֵּן הָיָה צָרִיךְ לְהַשִּׂיאוֹ אִשָּׁה:", "rashi_en": "ברך את אברהם בכל [THE LORD HAD] BLESSED ABRAHAM IN ALL THINGS — The numerical value of the word בכל is equal to that of בן (a son) — suggesting that God had blessed Abraham with a son and since he had a son he had to find him a wife.", "note": "", "points": [{"q": "Why does Rashi connect the word בכל ('in all things') to having a son?", "options": ["The numerical value (gematria) of בכל equals that of בן (son)", "The word בכל is an acronym for 'ben kol lev' (a wholehearted son)", "The Targum translates בכל as 'offspring'"], "kasha": "Why does the Torah mention this blessing right before the search for a wife?", "answer": "The gematria of בכל equals בן (son) — God blessed Abraham with a son, and now he needed to find that son a wife."}]}, {"id": "24:2.1", "ch": 24, "v": 2, "n": 1, "dh": "זקן ביתו", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָהָ֗ם אֶל־עַבְדּוֹ֙ <mark>זְקַ֣ן בֵּית֔וֹ</mark> הַמֹּשֵׁ֖ל בְּכׇל־אֲשֶׁר־ל֑וֹ שִֽׂים־נָ֥א יָדְךָ֖ תַּ֥חַת יְרֵכִֽי׃", "pasuk_en": "And Abraham said to the senior servant of his household, who had charge of all that he owned, “Put your hand under my thigh ", "rashi_he": "זקן ביתו. לְפִי שֶׁהוּא דָּבוּק נָקוּד זְקַן:", "rashi_en": "זקן ביתו THE ELDER OF HIS HOUSE — Because the noun is in the construct state the ק is punctuated with a Patach.", "note": "", "points": [{"q": "Why does the ק in זקן have a Patach vowel here?", "options": ["Because the noun is in the construct state (סמיכות), meaning 'elder OF his house'", "Because it follows a guttural letter", "Because it is in the pause position at the end of the verse"], "kasha": "What grammatical feature explains the unusual vowel under the ק?", "answer": "The noun is in construct state (זקן ביתו — 'elder of his house'), which changes the vowel of the ק to Patach."}]}, {"id": "24:2.2", "ch": 24, "v": 2, "n": 2, "dh": "תחת ירכי", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָהָ֗ם אֶל־עַבְדּוֹ֙ זְקַ֣ן בֵּית֔וֹ הַמֹּשֵׁ֖ל בְּכׇל־אֲשֶׁר־ל֑וֹ שִֽׂים־נָ֥א יָדְךָ֖ <mark>תַּ֥חַת יְרֵכִֽי׃</mark>", "pasuk_en": "And Abraham said to the senior servant of his household, who had charge of all that he owned, “Put your hand under my thigh ", "rashi_he": "תחת ירכי. לְפִי שֶׁהַנִּשְׁבָּע צָרִיךְ שֶׁיִּטֹּל בְּיָדוֹ חֵפֶץ שֶׁל מִצְוָה, כְּגוֹן סֵפֶר תּוֹרָה אוֹ תְּפִלִּין (שבועות ל\"ח), וְהַמִּילָה הָיְתָה מִצְוָה רִאשׁוֹנָה לוֹ וּבָאָה לוֹ עַל יְדֵי צַעַר וְהָיְתָה חֲבִיבָה עָלָיו וּנְטָלָהּ:", "rashi_en": "תחת ירכי UNDER MY THIGH — because whoever takes an oath must take in his hand some sacred object. such as a Scroll of the Law or Tefillin (Shevuot 38b). As circumcision was the first commandment given to him and became his only through much pain it was consequently dear to him and therefore he selected this as the object upon which to take the oath (Genesis Rabbah 59:8). ", "note": "", "points": [{"q": "Why did Abraham have the servant place his hand under his thigh?", "options": ["One who swears must hold a sacred object, and circumcision was Abraham's first commandment, dear to him through its pain", "It was a standard Mesopotamian oath custom", "The thigh symbolizes the future descendants who would inherit the land"], "kasha": "Why specifically the thigh — why not swear on an altar or another sacred item?", "answer": "Whoever swears must hold a sacred object (like a Torah scroll or Tefillin). Circumcision was Abraham's first commandment and was dear to him because of the pain he endured, so he chose it as the sacred object for the oath."}]}, {"id": "24:7.1", "ch": 24, "v": 7, "n": 1, "dh": "ה׳ אלהי השמים", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "ה' אלהי השמים אשר לקחני מבית אבי. וְלֹא אָמַר \"וֵאלֹהֵי הָאָרֶץ\", וּלְמַעְלָה אָמַר וְאַשְׁבִּיעֲךָ וגו'? אָמַר לוֹ עַכְשָׁו הוּא אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ, שֶׁהִרְגַּלְתִּיו בְּפִי הַבְּרִיּוֹת, אֲבָל כְּשֶׁלְּקָחַנִי מִבֵּית אָבִי הָיָה אֱלֹהֵי הַשָּׁמַיִם וְלֹא אֱלֹהֵי הָאָרֶץ, שֶׁלֹּא הָיוּ בָּאֵי עוֹלָם מַכִּירִים בּוֹ וּשְׁמוֹ לֹא הָיָה רָגִיל בָּאָרֶץ:", "rashi_en": "'ה אלהי השמים אשר לקחני מבית אבי THE LORD, GOD OF HEAVEN, WHO TOOK ME FROM MY FATHER'S HOUSE — Here he did not say “[The God of heaven] and the God of the earth”, whereas above (v. 3) he said, “And I will make thee swear etc. … [and the God of the earth]’’. But, in effect, Abraham said to him: Now He is the God of heaven and the God of the earth, because I have made him (i. e. His Name) a familiar one in peoples’ mouths: but at the time when He took me from my father’s house He was God of heaven only and not God of the earth for people did not acknowledge Him and His Name was not commonly known on earth (Genesis Rabbah 59:7).", "note": "", "points": [{"q": "Why does Abraham say only 'God of heaven' here but said 'God of heaven AND earth' earlier in verse 3?", "options": ["Now God is recognized on earth too thanks to Abraham's efforts, but when God first took him from his father's house only heaven recognized Him", "Abraham was being more formal when speaking to the servant directly", "The shorter phrase is used when referring to God's promise, the longer when invoking an oath"], "kasha": "Why the inconsistency — above (v.3) Abraham said 'God of heaven and earth,' but here he omits 'and earth'?", "answer": "Abraham explained: Now He is God of heaven AND earth because I made Him known among people. But when He first took me from my father's house, He was only God of heaven — people on earth did not yet recognize Him."}]}, {"id": "24:7.2", "ch": 24, "v": 7, "n": 2, "dh": "מבית אבי", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי <mark>מִבֵּ֣ית אָבִי֮</mark> וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "מבית אבי. מֵחָרָן:", "rashi_en": "מבית אבי FROM MY FATHER S HOUSE — from Haran.", "note": "", "points": [{"q": "What place does 'my father's house' refer to?", "options": ["Haran", "Ur-Kasdim", "Beer-Sheva"], "kasha": "Which specific location is meant by 'my father's house'?", "answer": "'My father's house' refers to Haran, where Abraham's father Terach settled."}]}, {"id": "24:7.3", "ch": 24, "v": 7, "n": 3, "dh": "ומארץ מולדתי", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ <mark>וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒</mark> וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "ומארץ מולדתי. מֵאוּר כַּשְׂדִּים:", "rashi_en": "ומארץ מולדתי AND FROM THE LAND OF MY NATIVITY — from Ur-Kasdim.", "note": "", "points": [{"q": "What place does 'the land of my nativity' refer to?", "options": ["Ur-Kasdim", "Haran", "Canaan"], "kasha": "Which specific location is 'the land of my birth'?", "answer": "'The land of my nativity' refers to Ur-Kasdim, where Abraham was originally born."}]}, {"id": "24:7.4", "ch": 24, "v": 7, "n": 4, "dh": "ואשר דבר לי", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "ואשר דבר לי. לְצָרְכִּי; כְּמוֹ אֲשֶׁר דִּבֶּר עָלַי (מלכים א' ב'), וְכֵן כָּל לִי וְלוֹ וְלָהֶם הַסְּמוּכִים אֵצֶל דִּבּוּר מְפֹרָשִׁים בִּלְשוֹן עַל, וְתַרְגּוּם שֶׁלָּהֶם עֲלַי, עֲלוֹהִי, עֲלֵיהוֹן, שֶׁאֵין נוֹפֵל אֵצֶל דִּבּוּר לְשׁוֹן לִי וְלוֹ וְלָהֶם, אֶלָּא אֵלַי, אֵלָיו, אֲלֵיהֶם, וְתַרְגּוּם שֶׁלָּהֶם עִמִּי, עִמֵּיהּ, עִמְּהוֹן, אֲבָל אֵצֶל אֲמִירָה נוֹפֵל לְשׁוֹן לִי וְלוֹ וְלָהֶם:", "rashi_en": "ואשר דבר לי AND WHO SPOKE לי—The word לי means “in my interest”, just as (1 Kings 2:4) “which He spake concerning me (עלי)”. In the same way, in every case where לי or לו or להם follow after the verb דבר they must be explained in the sense of על “concerning” — and in the Targum they should be rendered by עלי or עלוהי or עליהון regarding me etc. — for with this verb דבר in the sense of speaking to a person, the expressions לי and לו and להם are not the appropriate ones, but אלי and אליו and אליהן, and their renderings in the Targum should be עמי and עמיה and עמהן i. e., to speak with me or him or them. In the case of the verb אמר, however, the expressions לי and לו and להם are the appropriate ones.", "note": "", "points": [{"q": "How does Rashi explain the word לי in 'who spoke to me'?", "options": ["It means 'in my interest' or 'concerning me'", "It means 'directly to me in prophecy'", "It means 'for my descendants'"], "kasha": "What nuance does the word לי add beyond simply 'spoke to me'?", "answer": "The word לי means 'in my interest' or 'concerning me' — not just that God spoke to him, but that the speech was for his benefit."}]}, {"id": "24:7.5", "ch": 24, "v": 7, "n": 5, "dh": "ואשר נשבע לי", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "ואשר נשבע לי. בֵּין הַבְּתָרִים:", "rashi_en": "ואשר נשבע לי AND WHO SWORE UNTO ME at the Covenant between the Pieces (Genesis Rabbah 59:10).", "note": "", "points": [{"q": "When did the oath 'who swore unto me' take place?", "options": ["At the Covenant between the Pieces (Brit bein HaBetarim)", "At the Binding of Isaac (Akeidah)", "When Abraham first arrived in Canaan"], "kasha": "Which specific event is Abraham referencing when he says God 'swore' to him?", "answer": "God swore to Abraham at the Covenant between the Pieces (Brit bein HaBetarim)."}]}, {"id": "24:8.1", "ch": 24, "v": 8, "n": 1, "dh": "ונקית משבעתי", "pasuk_html": "וְאִם־לֹ֨א תֹאבֶ֤ה הָֽאִשָּׁה֙ לָלֶ֣כֶת אַחֲרֶ֔יךָ <mark>וְנִקִּ֕יתָ מִשְּׁבֻעָתִ֖י</mark> זֹ֑את רַ֣ק אֶת־בְּנִ֔י לֹ֥א תָשֵׁ֖ב שָֽׁמָּה׃", "pasuk_en": "And if the woman does not consent to follow you, you shall then be clear of this oath to me; but do not take my son back there.” ", "rashi_he": "ונקית משבועתי וגו'. וְקַח לוֹ אִשָּׁה מִבְּנוֹת עָנֵר אֶשְׁכּוֹל וּמַמְרֵא:", "rashi_en": "'ונקית משבעתי וגו THEN SHALT THOU BE CLEAR FROM THIS MY OATH etc. — and take a wife for him from the daughters of Aner or Eshcol or Mamre.", "note": "", "points": [{"q": "If the woman refuses to come, what is the servant permitted to do?", "options": ["He is released from the oath and may take a wife from the daughters of Aner, Eshcol, or Mamre", "He must return to Abraham empty-handed and the oath remains binding", "He must travel to a different branch of Abraham's family"], "kasha": "What happens to the oath obligation if the mission fails?", "answer": "The servant is cleared from the oath entirely, and may instead find a wife from the daughters of Aner, Eshcol, or Mamre."}]}, {"id": "24:8.2", "ch": 24, "v": 8, "n": 2, "dh": "רק את בני", "pasuk_html": "וְאִם־לֹ֨א תֹאבֶ֤ה הָֽאִשָּׁה֙ לָלֶ֣כֶת אַחֲרֶ֔יךָ וְנִקִּ֕יתָ מִשְּׁבֻעָתִ֖י זֹ֑את רַ֣ק אֶת־בְּנִ֔י לֹ֥א תָשֵׁ֖ב שָֽׁמָּה׃", "pasuk_en": "And if the woman does not consent to follow you, you shall then be clear of this oath to me; but do not take my son back there.” ", "rashi_he": "רק את בני וגו'. רַק מִעוּט הוּא; בְּנִי אֵינוֹ חוֹזֵר, אֲבָל יַעֲקֹב בֶּן בְּנִי סוֹפוֹ לַחֲזֹר:", "rashi_en": "רק את בני וגו ONLY [BRING NOT] MY SON [THITHER] etc. — The word רק narrows and limits (מעוט) the sense: it is only my son who may not go back there, but Jacob, my son’s son, in the end will go back there to find a wife  (Genesis Rabbah 59:10). ", "note": "", "points": [{"q": "What does the limiting word רק ('only') come to exclude?", "options": ["Only Isaac may not go back there, but Jacob (Abraham's grandson) will eventually return", "Only one son may not go — if Abraham has more sons they may go", "Only Isaac may not go permanently, but he may visit temporarily"], "kasha": "Why does the Torah use the restrictive word רק here?", "answer": "רק limits the prohibition to Isaac alone: only MY son may not go back there, but Jacob (my grandson) will eventually return to that land."}]}, {"id": "24:10.1", "ch": 24, "v": 10, "n": 1, "dh": "מגמלי אדניו", "pasuk_html": "וַיִּקַּ֣ח הָ֠עֶ֠בֶד עֲשָׂרָ֨ה גְמַלִּ֜ים <mark>מִגְּמַלֵּ֤י אֲדֹנָיו֙</mark> וַיֵּ֔לֶךְ וְכׇל־ט֥וּב אֲדֹנָ֖יו בְּיָד֑וֹ וַיָּ֗קׇם וַיֵּ֛לֶךְ אֶל־אֲרַ֥ם נַֽהֲרַ֖יִם אֶל־עִ֥יר נָחֽוֹר׃", "pasuk_en": "Then the servant took ten of his master’s camels and set out, taking with him all the bounty of his master; and he made his way to Aram-naharaim, to the city of Nahor. ", "rashi_he": "מגמלי אדוניו. נִכָּרִין הָיוּ מִשְּׁאָר גְּמַלִּים, שֶׁהָיוּ יוֹצְאִין זְמוּמִין מִפְּנֵי הַגֶּזֶל, שֶׁלֹּא יִרְעוּ בִשְׂדוֹת אֲחֵרִים (בראשית רבה):", "rashi_en": "מגמלי אדניו OF HIS MASTER’S CAMELS — These were distinguished from other camels by going out muzzled to avoid robbery — i.e. that they should not graze in other peoples’ fields (Genesis Rabbah 59:11).", "note": "", "points": [{"q": "How were Abraham's camels distinguished from other camels?", "options": ["They went out muzzled so they would not graze in others' fields", "They were marked with Abraham's brand on their legs", "They were white camels, a rare and expensive breed"], "kasha": "Why does the verse specify 'from his master's camels' — what was special about them?", "answer": "Abraham's camels were recognizable because they went out muzzled to prevent them from grazing in other people's fields, avoiding any form of robbery."}]}, {"id": "24:10.2", "ch": 24, "v": 10, "n": 2, "dh": "וכל טוב אדניו בידו", "pasuk_html": "וַיִּקַּ֣ח הָ֠עֶ֠בֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִגְּמַלֵּ֤י אֲדֹנָיו֙ וַיֵּ֔לֶךְ וְכׇל־ט֥וּב אֲדֹנָ֖יו בְּיָד֑וֹ וַיָּ֗קׇם וַיֵּ֛לֶךְ אֶל־אֲרַ֥ם נַֽהֲרַ֖יִם אֶל־עִ֥יר נָחֽוֹר׃", "pasuk_en": "Then the servant took ten of his master’s camels and set out, taking with him all the bounty of his master; and he made his way to Aram-naharaim, to the city of Nahor. ", "rashi_he": "וכל טוב אדוניו בידו. שְׁטָר מַתָּנָה כָּתַב לְיִצְחָק עַל כָּל אֲשֶׁר לוֹ, כְּדֵי שֶׁיִּקְפְּצוּ לִשְׁלֹחַ לוֹ בִּתָּם (בראשית רבה):", "rashi_en": "וכל טוב אדניו בידו AND ALL THE GOODS OF HIS MASTER WERE IN HIS HAND — He wrote a deed of gift of all his possessions in favour of Isaac so that they would be eager to send him their daughter (Genesis Rabbah 59:11).", "note": "", "points": [{"q": "What did 'all the bounty of his master in his hand' mean practically?", "options": ["He carried a deed of gift transferring all of Abraham's possessions to Isaac", "He brought ten camel-loads of expensive gifts and jewelry", "He carried a letter of introduction from Abraham describing his wealth"], "kasha": "How could a servant carry 'all' of his master's goods?", "answer": "He wrote a deed of gift of all Abraham's possessions to Isaac, so the family would be eager to send their daughter to marry such a wealthy man."}]}, {"id": "24:10.3", "ch": 24, "v": 10, "n": 3, "dh": "ארם נהרים", "pasuk_html": "וַיִּקַּ֣ח הָ֠עֶ֠בֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִגְּמַלֵּ֤י אֲדֹנָיו֙ וַיֵּ֔לֶךְ וְכׇל־ט֥וּב אֲדֹנָ֖יו בְּיָד֑וֹ וַיָּ֗קׇם וַיֵּ֛לֶךְ אֶל־<mark>אֲרַ֥ם נַֽהֲרַ֖יִם</mark> אֶל־עִ֥יר נָחֽוֹר׃", "pasuk_en": "Then the servant took ten of his master’s camels and set out, taking with him all the bounty of his master; and he made his way to Aram-naharaim, to the city of Nahor. ", "rashi_he": "ארם נהרים. בֵּין שְׁתֵּי נְהָרוֹת יוֹשֶׁבֶת:", "rashi_en": "ארם נהרים MESOPOTAMIA (literally, ARAM OF THE TWO RIVERS) — it was situated between the two rivers, Euphrates and Tigris. ", "note": "", "points": [{"q": "Why is it called Aram Naharayim (Aram of the two rivers)?", "options": ["Because it is situated between two rivers: the Euphrates and the Tigris", "Because two streams converge at the city center", "Because the Jordan and the Euphrates form its borders"], "kasha": "What is the meaning of the place name 'Aram Naharayim'?", "answer": "It means Mesopotamia — the land situated between two rivers, the Euphrates and the Tigris."}]}, {"id": "24:11.1", "ch": 24, "v": 11, "n": 1, "dh": "ויברך הגמלים", "pasuk_html": "<mark>וַיַּבְרֵ֧ךְ הַגְּמַלִּ֛ים</mark> מִח֥וּץ לָעִ֖יר אֶל־בְּאֵ֣ר הַמָּ֑יִם לְעֵ֣ת עֶ֔רֶב לְעֵ֖ת צֵ֥את הַשֹּׁאֲבֹֽת׃", "pasuk_en": "He made the camels kneel down by the well outside the city, at evening time, the time when women come out to draw water. ", "rashi_he": "ויברך הגמלים. הִרְבִּיצָם:", "rashi_en": "ויברך הגמלים means HE MADE THEM KNEEL (Genesis Rabbah 59:11).", "note": "", "points": [{"q": "What does ויברך mean in this context?", "options": ["He made the camels kneel down", "He blessed the camels before the journey", "He fed and watered the camels"], "kasha": "The word ויברך usually means 'he blessed' — what does it mean here?", "answer": "Here ויברך means he made them kneel — from the root meaning to bend the knee (ברך also means knee)."}]}, {"id": "24:14.1", "ch": 24, "v": 14, "n": 1, "dh": "אתה הכחת", "pasuk_html": "וְהָיָ֣ה הַֽנַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֙יהָ֙ הַטִּי־נָ֤א כַדֵּךְ֙ וְאֶשְׁתֶּ֔ה וְאָמְרָ֣ה שְׁתֵ֔ה וְגַם־גְּמַלֶּ֖יךָ אַשְׁקֶ֑ה <mark>אֹתָ֤הּ הֹכַ֙חְתָּ֙</mark> לְעַבְדְּךָ֣ לְיִצְחָ֔ק וּבָ֣הּ אֵדַ֔ע כִּי־עָשִׂ֥יתָ חֶ֖סֶד עִם־אֲדֹנִֽי׃", "pasuk_en": "let the maiden to whom I say, ‘Please, lower your jar that I may drink,’ and who replies, ‘Drink, and I will also water your camels’—let her be the one whom You have decreed for Your servant Isaac. Thereby shall I know that You have dealt graciously with my master.”", "rashi_he": "אתה הכחת. רְאוּיָה הִיא לוֹ שֶׁתְּהֵא גּוֹמֶלֶת חֲסָדִים, וּכְדַאי לִכָּנֵס בְּבֵיתוֹ שֶׁל אַבְרָהָם; וּלְשׁוֹן הֹכַחְתָּ בֵּרַרְתָּ, אפרו\"בישט בלע\"ז:", "rashi_en": "אתה הכחת HER THOU HAST APPOINTED — She is fit for him since she will be charitable and will therefore be worthy of admission into the house of Abraham. The word הכחת means selected; old French approuvest; English thou hast selected.", "note": "", "points": [{"q": "What does הכחת mean and why is this girl fit for Isaac?", "options": ["It means 'selected/approved' — she proved fit by showing charitable character worthy of Abraham's house", "It means 'tested' — she passed a physical endurance test", "It means 'revealed' — God made her identity known through a sign"], "kasha": "What quality is the servant looking for, and what does הכחת mean?", "answer": "הכחת means 'selected' or 'approved.' The girl who offers water to a stranger and his camels demonstrates a charitable character, making her worthy of joining Abraham's house."}]}, {"id": "24:14.2", "ch": 24, "v": 14, "n": 2, "dh": "ובה אדע", "pasuk_html": "וְהָיָ֣ה הַֽנַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֙יהָ֙ הַטִּי־נָ֤א כַדֵּךְ֙ וְאֶשְׁתֶּ֔ה וְאָמְרָ֣ה שְׁתֵ֔ה וְגַם־גְּמַלֶּ֖יךָ אַשְׁקֶ֑ה אֹתָ֤הּ הֹכַ֙חְתָּ֙ לְעַבְדְּךָ֣ לְיִצְחָ֔ק <mark>וּבָ֣הּ אֵדַ֔ע</mark> כִּי־עָשִׂ֥יתָ חֶ֖סֶד עִם־אֲדֹנִֽי׃", "pasuk_en": "let the maiden to whom I say, ‘Please, lower your jar that I may drink,’ and who replies, ‘Drink, and I will also water your camels’—let her be the one whom You have decreed for Your servant Isaac. Thereby shall I know that You have dealt graciously with my master.”", "rashi_he": "ובה אדע. לְשׁוֹן תְּחִנָּה, הוֹדַע לִי בָּהּ:", "rashi_en": "ובה אדע This is a petition: “Let me know through her”.", "note": "", "points": [{"q": "What is the nature of the servant's statement 'through her I will know'?", "options": ["It is a petition/prayer — 'Let me know through her'", "It is a statement of certainty — 'I already know she is the one'", "It is a condition — 'Only if she does this will I know'"], "kasha": "Is the servant making a demand, a prayer, or a logical deduction?", "answer": "It is a petition to God — the servant is praying: 'Let me know through her that she is the right one.'"}]}, {"id": "24:14.3", "ch": 24, "v": 14, "n": 3, "dh": "כי עשית חסד", "pasuk_html": "וְהָיָ֣ה הַֽנַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֙יהָ֙ הַטִּי־נָ֤א כַדֵּךְ֙ וְאֶשְׁתֶּ֔ה וְאָמְרָ֣ה שְׁתֵ֔ה וְגַם־גְּמַלֶּ֖יךָ אַשְׁקֶ֑ה אֹתָ֤הּ הֹכַ֙חְתָּ֙ לְעַבְדְּךָ֣ לְיִצְחָ֔ק וּבָ֣הּ אֵדַ֔ע כִּי־עָשִׂ֥יתָ חֶ֖סֶד עִם־אֲדֹנִֽי׃", "pasuk_en": "let the maiden to whom I say, ‘Please, lower your jar that I may drink,’ and who replies, ‘Drink, and I will also water your camels’—let her be the one whom You have decreed for Your servant Isaac. Thereby shall I know that You have dealt graciously with my master.”", "rashi_he": "כי עשית חסד. אִם תִּהְיֶה מִמִּשְׁפַּחְתּוֹ וְהוֹגֶנֶת לוֹ אֵדַע כִּי עָשִׂית חֶסֶד:", "rashi_en": "כי עשית חסד THAT THOU HAST SHOWN KINDNESS — if she is of his family and a fit companion for him I shall know that thou hast shown kindness to my master.", "note": "", "points": [{"q": "When will the servant know that God showed kindness to his master?", "options": ["If the girl turns out to be from Abraham's family and is fit for Isaac", "If the girl gives water to the camels quickly", "If the girl is beautiful and wealthy"], "kasha": "What specifically would confirm that God showed 'kindness' to Abraham?", "answer": "If the charitable girl also turns out to be from Abraham's family and fit for Isaac, then the servant will know God showed kindness to his master."}]}, {"id": "24:16.1", "ch": 24, "v": 16, "n": 1, "dh": "בתולה", "pasuk_html": "וְהַֽנַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד <mark>בְּתוּלָ֕ה</mark> וְאִ֖ישׁ לֹ֣א יְדָעָ֑הּ וַתֵּ֣רֶד הָעַ֔יְנָה וַתְּמַלֵּ֥א כַדָּ֖הּ וַתָּֽעַל׃", "pasuk_en": "The maiden was very beautiful, a virgin whom no man had known.bvirgin Or “young woman.” She went down to the spring, filled her jar, and came up. ", "rashi_he": "בתולה. מִמְּקוֹם בְּתוּלִים (בראשית רבה):", "rashi_en": "בתולה A VIRGIN — from the place of her hymen.", "note": "", "points": [{"q": "What does Rashi say בתולה (virgin) refers to specifically?", "options": ["Virgin from the place of her hymen — physical virginity", "A young unmarried woman of marriageable age", "A woman who has never been betrothed"], "kasha": "If the verse already says 'virgin,' why does Rashi need to explain it?", "answer": "Rashi specifies that בתולה means a virgin from the place of her hymen — it refers to actual physical virginity."}]}, {"id": "24:16.2", "ch": 24, "v": 16, "n": 2, "dh": "ואיש לא ידעה", "pasuk_html": "וְהַֽנַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד בְּתוּלָ֕ה <mark>וְאִ֖ישׁ לֹ֣א יְדָעָ֑הּ</mark> וַתֵּ֣רֶד הָעַ֔יְנָה וַתְּמַלֵּ֥א כַדָּ֖הּ וַתָּֽעַל׃", "pasuk_en": "The maiden was very beautiful, a virgin whom no man had known.bvirgin Or “young woman.” She went down to the spring, filled her jar, and came up. ", "rashi_he": "ואיש לא ידעה. שֶׁלֹּא כְּדַרְכָּהּ, לְפִי שֶׁבְּנוֹת הַגּוֹיִם הָיוּ מְשַׁמְּרוֹת מְקוֹם בְּתוּלֵיהֶן וּמַפְקִירוֹת עַצְמָן מִמָּקוֹם אַחֵר, הֵעִיד עַל זוֹ שֶׁנְּקִיָּה מִכֹּל:", "rashi_en": "ואיש לא ידעה AND A MAN DID NOT KNOW HER — not in its way (meaning, anally). Because the daughters of the nations would guard the place of their hymens, but abandon themselves from another place. It testifies about this one that she was clean from all [of this] (Genesis Rabbah 60:5). ", "note": "", "points": [{"q": "If she was already called a virgin, why does the verse add 'no man had known her'?", "options": ["To teach she was clean from unnatural relations too — daughters of the nations guarded technical virginity but not other conduct", "To emphasize she had never even spoken privately with a man", "To indicate she had never been betrothed or promised to anyone"], "kasha": "The verse already stated she was a בתולה — what does 'no man had known her' add?", "answer": "Daughters of the nations would guard their technical virginity but engage in unnatural relations. This phrase teaches that Rivkah was completely clean from all such conduct."}]}, {"id": "24:17.1", "ch": 24, "v": 17, "n": 1, "dh": "וירץ העבד לקראתה", "pasuk_html": "<mark>וַיָּ֥רׇץ הָעֶ֖בֶד לִקְרָאתָ֑הּ</mark> וַיֹּ֕אמֶר הַגְמִיאִ֥ינִי נָ֛א מְעַט־מַ֖יִם מִכַּדֵּֽךְ׃", "pasuk_en": "The servant ran toward her and said, “Please, let me sip a little water from your jar.” ", "rashi_he": "וירץ העבד לקראתה. לְפִי שֶׁרָאָה שֶׁעָלוּ הַמַּיִם לִקְרָאתָהּ (בראשית רבה):", "rashi_en": "וירץ העבד לקראתה AND THE SERVANT RAN TOWARDS HER — because he saw that the waters rose in the well when she approached it (Genesis Rabbah 60:5). ", "note": "", "points": [{"q": "Why did the servant run toward Rivkah?", "options": ["He saw that the waters of the well rose miraculously when she approached", "He wanted to be the first to speak to her before others arrived", "He was eager because she matched the physical description Abraham gave him"], "kasha": "What prompted the servant to suddenly run toward her?", "answer": "He ran because he saw the waters of the well rise up toward her as she approached — a miraculous sign."}]}, {"id": "24:17.2", "ch": 24, "v": 17, "n": 2, "dh": "הגמיאיני נא", "pasuk_html": "וַיָּ֥רׇץ הָעֶ֖בֶד לִקְרָאתָ֑הּ וַיֹּ֕אמֶר <mark>הַגְמִיאִ֥ינִי נָ֛א</mark> מְעַט־מַ֖יִם מִכַּדֵּֽךְ׃", "pasuk_en": "The servant ran toward her and said, “Please, let me sip a little water from your jar.” ", "rashi_he": "הגמיאיני נא. לְשׁוֹן גְּמִיעָה, הומיי\"ר בלע\"ז:", "rashi_en": "הגמיאיני נא GIVE ME TO DRINK, I PRAY THEE — the word means sipping; old French humer.", "note": "", "points": [{"q": "What does הגמיאיני mean?", "options": ["Let me sip — give me a small amount to drink", "Pour out water for me generously", "Draw water from the well for me"], "kasha": "What is the precise meaning of this unusual word?", "answer": "הגמיאיני means 'let me sip' — he asked for just a small amount of water."}]}, {"id": "24:18.1", "ch": 24, "v": 18, "n": 1, "dh": "ותרד כדה", "pasuk_html": "וַתֹּ֖אמֶר שְׁתֵ֣ה אֲדֹנִ֑י וַתְּמַהֵ֗ר <mark>וַתֹּ֧רֶד כַּדָּ֛הּ</mark> עַל־יָדָ֖הּ וַתַּשְׁקֵֽהוּ׃", "pasuk_en": "“Drink, my lord,” she said, and she quickly lowered her jar upon her hand and let him drink. ", "rashi_he": "ותרד כדה. מֵעַל שִׁכְמָהּ:", "rashi_en": "ותרד כדה SHE LET DOWN HER PITCHER from off her shoulder.", "note": "", "points": [{"q": "What action does ותרד כדה describe?", "options": ["She lowered/let down her pitcher from her shoulder", "She descended to the well with her pitcher", "She tilted the pitcher to pour water out"], "kasha": "What is the precise meaning of ותרד in this context?", "answer": "She let down her pitcher from her shoulder — ותרד here means she lowered it from where she was carrying it."}]}, {"id": "24:19.1", "ch": 24, "v": 19, "n": 1, "dh": "עד אם כלו", "pasuk_html": "וַתְּכַ֖ל לְהַשְׁקֹת֑וֹ וַתֹּ֗אמֶר גַּ֤ם לִגְמַלֶּ֙יךָ֙ אֶשְׁאָ֔ב עַ֥ד אִם־כִּלּ֖וּ לִשְׁתֹּֽת׃", "pasuk_en": "When she had let him drink his fill, she said, “I will also draw for your camels, until they finish drinking.” ", "rashi_he": "עד אם כלו. הֲרֵי אִם מְשַׁמֵּשׁ בִּלְשׁוֹן אֲשֶׁר, אִם כִּלּוּ דַי סִפּוּקוֹן, שֶׁזּוֹ הִיא גְּמַר שְׁתִיָּתָן, כְּשֶׁשָּׁתוּ דֵּי סִפּוּקָן:", "rashi_en": "עד אם כלו literally, UNTIL THAT THEY HAVE FINISHED [DRINKING] — Here the word אם is used in the sense of אשר “that”. The words אם כלו the Targum renders by \"That they have done enough drinking”. Though the verb כלה signifies to finish, to end, the Targum is right in translating it thus for this is the end of their drinking when they have drunk as much as they wanted (cf. Rashi on Genesis 43:2). ", "note": "", "points": [{"q": "How does Rashi explain the word אם in 'until they finish drinking'?", "options": ["Here אם means אשר ('that') — 'until THAT they finished,' and כלה means finishing", "אם means 'if' — she set a condition on how much they would drink", "אם is an emphasis particle meaning 'truly'"], "kasha": "The word אם usually means 'if' — what does it mean here?", "answer": "Here אם has the meaning of אשר ('that'). The phrase means 'until they finished drinking,' and כלה means finishing/completing."}]}, {"id": "24:20.1", "ch": 24, "v": 20, "n": 1, "dh": "ותער", "pasuk_html": "וַתְּמַהֵ֗ר <mark>וַתְּעַ֤ר</mark> כַּדָּהּ֙ אֶל־הַשֹּׁ֔קֶת וַתָּ֥רׇץ ע֛וֹד אֶֽל־הַבְּאֵ֖ר לִשְׁאֹ֑ב וַתִּשְׁאַ֖ב לְכׇל־גְּמַלָּֽיו׃", "pasuk_en": "Quickly emptying her jar into the trough, she ran back to the well to draw, and she drew for all his camels.", "rashi_he": "ותער. לְשׁוֹן נְפִיצָה, וְהַרְבֵּה יֵשׁ בִּלְשׁוֹן מִשְׁנָה הַמְעָרֶה מִכְּלִי אֶל כֶּלִי, וּבַמִּקְרָא יֵשׁ לוֹ דּוֹמֶה אַל תְּעַר נַפְשִׁי (תהילים קמא), אֲשֶׁר הֶעֱרָה לַמָּוֶת נַפְשׁוֹ (ישעיהו נ\"ג):", "rashi_en": "ותער AND SHE EMPTIED — It means “pouring out”. It occurs in this sense many times in the Mishna; e. g., (Avodah Zarah 72a), “He who pours (הטערה) from one vessel into another”, and we find it again in a similar sense in Biblical Hebrew: (Psalms 141:8) “O pour not out (תער) my soul”, and (Isaiah 53:12) “Because he poured forth (הערה) his soul unto death”", "note": "", "points": [{"q": "What does ותער mean?", "options": ["She poured out the contents of her pitcher", "She hurried quickly to the trough", "She stirred the water in the trough"], "kasha": "What is the precise meaning of this verb?", "answer": "ותער means 'she poured out' — she emptied her pitcher into the trough."}]}, {"id": "24:20.2", "ch": 24, "v": 20, "n": 2, "dh": "השקת", "pasuk_html": "וַתְּמַהֵ֗ר וַתְּעַ֤ר כַּדָּהּ֙ אֶל־<mark>הַשֹּׁ֔קֶת</mark> וַתָּ֥רׇץ ע֛וֹד אֶֽל־הַבְּאֵ֖ר לִשְׁאֹ֑ב וַתִּשְׁאַ֖ב לְכׇל־גְּמַלָּֽיו׃", "pasuk_en": "Quickly emptying her jar into the trough, she ran back to the well to draw, and she drew for all his camels.", "rashi_he": "השקת. אֶבֶן חֲלוּלָה שֶׁשּׁוֹתִים בָּה הַגְּמַלִּים:", "rashi_en": "השקת THE TROUGH — a hollowed-out stone from which the camels drink. ", "note": "", "points": [{"q": "What is a השקת?", "options": ["A hollowed-out stone trough from which camels drink", "A leather bucket used to draw water from wells", "A wooden feeding bin for animals"], "kasha": "What object does this word describe?", "answer": "A השקת is a hollowed-out stone trough used as a drinking basin for camels."}]}, {"id": "24:21.1", "ch": 24, "v": 21, "n": 1, "dh": "משתאה (1st)", "pasuk_html": "וְהָאִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑הּ מַחֲרִ֕ישׁ לָדַ֗עַת הַֽהִצְלִ֧יחַ יְהֹוָ֛ה דַּרְכּ֖וֹ אִם־לֹֽא׃", "pasuk_en": "The man, meanwhile, stood gazing at her, silently wondering whether GOD had made his errand successful or not. ", "rashi_he": "משתאה. לְשׁוֹן שְׁאִיָּה, כְּמוֹ שָׁאוּ עָרִים, תִּשָּׁאֶה שְׁמָמָה (שם ו'):", "rashi_en": "משתאה WAS WONDERING — The word really has the idea of being waste and desolate, as (Isaiah 6:11) “Until cities be waste (שאו) and the land become utterly desolate תשאה.", "note": "", "points": [{"q": "What is the root idea behind the word משתאה?", "options": ["Being waste or desolate — expressing stunned silence", "Being joyful and excited", "Being suspicious and cautious"], "kasha": "What is the underlying meaning of this unusual word?", "answer": "The root of משתאה carries the idea of being waste or desolate — expressing a state of stunned, silent wonder."}]}, {"id": "24:21.2", "ch": 24, "v": 21, "n": 2, "dh": "משתאה (2nd)", "pasuk_html": "וְהָאִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑הּ מַחֲרִ֕ישׁ לָדַ֗עַת הַֽהִצְלִ֧יחַ יְהֹוָ֛ה דַּרְכּ֖וֹ אִם־לֹֽא׃", "pasuk_en": "The man, meanwhile, stood gazing at her, silently wondering whether GOD had made his errand successful or not. ", "rashi_he": "משתאה. מִשְׁתּוֹמֵם וּמִתְבַּהַל עַל שֶׁרָאָה דְבָרוֹ קָרוֹב לְהַצְלִיחַ, אֲבָל אֵינוֹ יוֹדֵעַ אִם מִמִּשְׁפַּחַת אַבְרָהָם הִיא אִם לָאו. וְאַל תִּתְמַהּ בַּת' שֶׁל מִשְׁתָּאֵה, שֶׁאֵין לְךָ תֵּבָה שֶׁתְּחִלַּת יְסוֹדָהּ שִׁי\"ן וּמְדַבֶּרֶת בִּלְשׁוֹן מִתְפַּעֵל שֶׁאֵין תָּי\"ו מַפְרִידָה בֵּין שְׁתֵּי אוֹתִיּוֹת שֶׁל עִקָּר הַיְסוֹד כְּגוֹן מִשְׁתָּאֵה, מִשְׁתּוֹלֵל מִגִּזְרַת שׁוֹלָל, וַיִּשְׁתּוֹמֵם מִגִּזְרַת שְׁמָמָה, וְיִשְׁתַּמֵּר חֻקּוֹת עָמְרִי (מיכה ו') מִגִּזְרַת וַיִּשְׁמֹר, אַף כָּאן מִשְׁתָּאֵה מִגִּזְרַת תִּשָּׁאֶה, וּכְשֵׁם שֶׁאַתָּה מוֹצֵא לְשׁוֹן מְשׁוֹמֵם בְּאָדָם נִבְהָל וְנֶאֱלָם וּבַעַל מַחֲשָׁבוֹת, כְּמוֹ עַל יוֹמוֹ נָשַׁמּוּ אַחֲרֹנִים (איוב י\"ח), שֹׁמּוּ שָׁמַיִם (ירמיהו ב'), אֶשְׁתּוֹמַם כְּשָׁעָה חֲדָא (דניאל ד'), כָּךְ תְּפָרֵשׁ לְשׁוֹן שְׁאִיָּה בְּאָדָם בָּהוּל וּבַעַל מַחֲשָׁבוֹת (וְאֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן שְׁהִיָּה, וְגַבְרָא שָׁהֵי, שׁוֹהֵא וְעוֹמֵד בְּמָקוֹם אֶחָד לִרְאוֹת הַהִצְלִיחַ ה' דַּרְכּוֹ; וְאֵין לְתַרְגֵּם שָׁתֵי, שֶׁהֲרֵי אֵינוֹ לְשׁוֹן שְׁתִיָּה, שֶׁאֵין אָלֶף נוֹפֶלֶת בִּלְשׁוֹן שְׁתִיָּה):", "rashi_en": "משתאה means he was astonished and perplexed, because he saw that what he had said was nearly successful only that he did not know whether she belonged to Abraham’s family or not. Do not be puzzled by the ת in the word משתאה for you will find no word (verb) whose first root letter is ש where, when it is used in the Hithpael, the ת of the Hithpael-prefix does not come between the first two letters of the root, as e.g. משתאה (here) and (Isaiah 59:15) משתולל of the same root as שולל, and (Isaiah 59:16) וישתומם of the same root as שממה and (Micha 6:16) “For the statutes of Omri are kept (וישתמר )” from the same root as וישמר —so, also, here משתאה is of the same root as תשאה. Now, just as you find the expression שמם (which really means waste and desolate) applied to a person who is perplexed and speechless (with amazement) and sunk in deep thought (about what is happening) — e. g., (Job 18:20) “They that come after shall be astonished (נשמו) at his day”, and (Jeremiah 2:12) “Be astonished (שומו) ye heavens”, and (Daniel 4:16) “He was appalled אשתומם for a time” — so too you may explain the expression שאה (which also really means waste and desolate) in all its verbal or noun forms as referring to a person who is perplexed and sunk deep in thought. Onkelos translates it in the sense of lingering — “the man lingered” — i. e. he wailed, standing on one spot, to see “whether God had made his journey prosperous”. But one should not read in the Targum שתי in place of שהי, as the Targum of משתאה, (as evidently some versions of the Targum read), for the word משתאה certainly does not mean drinking, for א has no place in the Hebrew words which mean drinking root (שתה).", "note": "", "points": [{"q": "Why was the servant astonished and perplexed?", "options": ["He was nearly successful — she showed all the right signs — but didn't yet know if she was from Abraham's family", "He couldn't believe one girl could water ten camels alone", "He was unsure whether the miracle of the rising water was a true sign from God"], "kasha": "What caused the servant's state of wonder and confusion?", "answer": "He was astonished because everything pointed to success — she was charitable and kind — but he was still perplexed because he didn't yet know whether she was from Abraham's family."}]}, {"id": "24:21.3", "ch": 24, "v": 21, "n": 3, "dh": "משתאה לה", "pasuk_html": "וְהָאִ֥ישׁ <mark>מִשְׁתָּאֵ֖ה לָ֑הּ</mark> מַחֲרִ֕ישׁ לָדַ֗עַת הַֽהִצְלִ֧יחַ יְהֹוָ֛ה דַּרְכּ֖וֹ אִם־לֹֽא׃", "pasuk_en": "The man, meanwhile, stood gazing at her, silently wondering whether GOD had made his errand successful or not. ", "rashi_he": "משתאה לה. מִשְׁתּוֹמֵם עָלֶיהָ, כְּמוֹ אִמְרִי לִי אָחִי הוּא (בראשית כ׳:י״ג) וּכְמוֹ וַיִּשְׁאֲלוּ אַנְשֵׁי הַמָּקוֹם לְאִשְׁתּוֹ (שם כ\"ו):", "rashi_en": "משתאה לה means he was wondering about her, just as the ל has the meaning “about” in (20:13) “Say of me (לי), he is my brother”, and (26:7) “And the men of the place asked about his wife. ", "note": "", "points": [{"q": "How does Rashi explain the ל in לה?", "options": ["The ל means 'about' — he was wondering ABOUT her", "The ל means 'for' — he was waiting FOR her to finish", "The ל means 'to' — he was staring AT her"], "kasha": "What does the preposition ל mean in this phrase?", "answer": "The ל means 'about' — he was wondering about her, trying to figure out her identity."}]}, {"id": "24:22.1", "ch": 24, "v": 22, "n": 1, "dh": "בקע", "pasuk_html": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלּ֤וּ הַגְּמַלִּים֙ לִשְׁתּ֔וֹת וַיִּקַּ֤ח הָאִישׁ֙ נֶ֣זֶם זָהָ֔ב <mark>בֶּ֖קַע</mark> מִשְׁקָל֑וֹ וּשְׁנֵ֤י צְמִידִים֙ עַל־יָדֶ֔יהָ עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽם׃", "pasuk_en": "When the camels had finished drinking, the man took a gold nose-ring weighing a half-shekel,chalf-shekel Heb. beqaʻ. and two gold bands for her arms, ten shekels in weight. ", "rashi_he": "בקע. רֶמֶז לְשִׁקְלֵי יִשְׂרָאֵל בֶּקַע לַגֻּלְגֹּלֶת:", "rashi_en": "בקע BEKA (half a Shekel) — a symbol of the Shekels of the Israelites of which it is said (Exodus 38:26) “a Beka (half a Shekel) a head” (cf. Targum Jon).", "note": "", "points": [{"q": "What does the gold nose-ring weighing a בקע (beka/half-shekel) symbolize?", "options": ["The half-shekel that each Israelite would contribute for the Tabernacle", "The half-portion of manna each person collected daily", "The idea that husband and wife are two halves of one whole"], "kasha": "Why specifically a half-shekel weight for the nose-ring?", "answer": "The beka (half-shekel) is a symbol of the future half-shekel contribution that each Israelite would give."}]}, {"id": "24:22.2", "ch": 24, "v": 22, "n": 2, "dh": "ושני צמידים", "pasuk_html": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלּ֤וּ הַגְּמַלִּים֙ לִשְׁתּ֔וֹת וַיִּקַּ֤ח הָאִישׁ֙ נֶ֣זֶם זָהָ֔ב בֶּ֖קַע מִשְׁקָל֑וֹ <mark>וּשְׁנֵ֤י צְמִידִים֙</mark> עַל־יָדֶ֔יהָ עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽם׃", "pasuk_en": "When the camels had finished drinking, the man took a gold nose-ring weighing a half-shekel,chalf-shekel Heb. beqaʻ. and two gold bands for her arms, ten shekels in weight. ", "rashi_he": "ושני צמידים. רֶמֶז לִשְׁנֵי לוּחוֹת מְצֻמָּדוֹת:", "rashi_en": "ושני צמידים AND TWO BRACELETS (the word for bracelet signifies something joined or united) — a symbol of the two Tablets of stone, joined one to another (Genesis Rabbah 60:6).", "note": "", "points": [{"q": "What do the two bracelets symbolize?", "options": ["The Two Tablets of Stone, joined one to another", "The two covenants God made with Abraham", "The two wives of Jacob — Rachel and Leah"], "kasha": "Why specifically two bracelets?", "answer": "The two bracelets symbolize the Two Tablets of Stone that were paired together."}]}, {"id": "24:22.3", "ch": 24, "v": 22, "n": 3, "dh": "עשרה זהב משקלם", "pasuk_html": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלּ֤וּ הַגְּמַלִּים֙ לִשְׁתּ֔וֹת וַיִּקַּ֤ח הָאִישׁ֙ נֶ֣זֶם זָהָ֔ב בֶּ֖קַע מִשְׁקָל֑וֹ וּשְׁנֵ֤י צְמִידִים֙ עַל־יָדֶ֔יהָ <mark>עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽם׃</mark>", "pasuk_en": "When the camels had finished drinking, the man took a gold nose-ring weighing a half-shekel,chalf-shekel Heb. beqaʻ. and two gold bands for her arms, ten shekels in weight. ", "rashi_he": "עשרה זהב משקלם. רֶמֶז לַעֲשֶׂרֶת הַדִּבְּרוֹת שֶׁבָּהֶן:", "rashi_en": "עשרה זהב משקלם TEN SHEKELS OF GOLD WAS THEIR WEIGHT —a symbol of the Ten Commandments written on them (the Tablets) (Genesis Rabbah 60:6). ", "note": "", "points": [{"q": "What do the ten gold shekels of weight symbolize?", "options": ["The Ten Commandments written on the Tablets", "The ten generations from Noah to Abraham", "The ten trials of Abraham"], "kasha": "Why specifically ten shekels of gold?", "answer": "The ten shekels of gold symbolize the Ten Commandments that were inscribed on the Tablets."}]}, {"id": "24:23.1", "ch": 24, "v": 23, "n": 1, "dh": "ויאמר בת מי את", "pasuk_html": "וַיֹּ֙אמֶר֙ בַּת־מִ֣י אַ֔תְּ הַגִּ֥ידִי נָ֖א לִ֑י הֲיֵ֧שׁ בֵּית־אָבִ֛יךְ מָק֥וֹם לָ֖נוּ לָלִֽין׃", "pasuk_en": "“Pray tell me,” he said, “whose daughter are you? Is there room in your father’s house for us to spend the night?” ", "rashi_he": "ויאמר בת מי את. לְאַחַר שֶׁנָּתַן לָהּ שְׁאָלָהּ, לְפִי שֶׁהָיָה בָּטוּחַ בִּזְכוּתוֹ שֶׁל אַבְרָהָם שֶׁהִצְלִיחַ הַקָּבָּ\"ה דַּרְכּוֹ:", "rashi_en": "ויאמר בת מי את AND HE SAID, WHOSE DAUGHTER ART THOU? — He asked her this after he had given her these presents, for he was confident that, on account of the merit of Abraham, the Holy One blessed be He, had made his journey successful.", "note": "", "points": [{"q": "Why did the servant ask her identity AFTER already giving her the expensive gifts?", "options": ["He was confident that Abraham's merit guaranteed the journey's success", "He forgot to ask in his excitement when the water rose", "It was customary to give gifts before asking personal questions"], "kasha": "Shouldn't the servant have verified her identity before giving gifts?", "answer": "He asked after giving the presents because he was confident that Abraham's merit had made the journey successful — the signs were clear enough."}]}, {"id": "24:23.2", "ch": 24, "v": 23, "n": 2, "dh": "ללין", "pasuk_html": "וַיֹּ֙אמֶר֙ בַּת־מִ֣י אַ֔תְּ הַגִּ֥ידִי נָ֖א לִ֑י הֲיֵ֧שׁ בֵּית־אָבִ֛יךְ מָק֥וֹם לָ֖נוּ <mark>לָלִֽין׃</mark>", "pasuk_en": "“Pray tell me,” he said, “whose daughter are you? Is
