<style>[hidden]{display:none!important}img{max-width:100%}.hint a.fb{color:var(--accent);font-weight:600;font-size:1.15em}

.cite b{color:var(--ink);font-weight:600}

.cite a:hover{text-decoration:underline}

.quote .kp{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 2px}

.quote .src a{color:var(--accent);font-weight:600;text-decoration:none}

.quote{direction:rtl;text-align:right;font-family:var(--f-rashi);font-size:max(19px,calc(var(--s,1)*16px));line-height:1.55;background:var(--bg);border-radius:10px;padding:8px 12px;flex:1 1 0;min-height:24vh;overflow:auto}

<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-soft:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100dvh;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:4px;height:100%}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.top{display:contents}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
h1 span{display:none}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.count b{color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:none}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-heb);font-size:22px;line-height:1.7;letter-spacing:.03em;word-spacing:.08em;direction:rtl;text-align:right}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{display:none}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:6px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:8px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:18px;line-height:1.45;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:center;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-body);font-size:17px;line-height:1.4;width:100%;direction:rtl}
.opt .k{flex:none;font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-soft)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.row{display:flex;flex-direction:column;gap:2px}
.row .t{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);direction:rtl}
.row p{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--accent);font-size:18px;font-weight:600;display:inline-block;padding:5px 16px;border:1.5px solid var(--accent);border-radius:9px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:14px;line-height:1.6;direction:rtl;text-align:right}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface);font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line);font-size:14px}
.hint{font-size:14px;color:var(--muted);text-align:center;flex-shrink:0}
.verdict{font-weight:600;font-size:16px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:20px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* taamim: Frank Ruhl lacks cantillation glyphs, so those letters fell back to another font */
.pasuk{font-family:var(--f-heb)}
/* pasuk panel: visually separate the verse from the question */
.pasuk{background:var(--accent-soft);border-inline-start:5px solid var(--accent);border-radius:10px;padding:calc(var(--s,1)*6px) calc(var(--s,1)*12px)}
.point{border-top:1px solid var(--line);padding-top:calc(var(--s,1)*8px)}
/* fit layout: only pasuk + question + options in the card; fine print lives in the footer */
.wrap{max-width:min(1500px,100%)}
header .top,.tools,.ref,.dh{display:none}
.card{gap:calc(var(--s,1)*8px)}
.pasuk{font-size:calc(var(--s,1)*22px)}
.q{font-size:calc(var(--s,1)*18px)}
.opt{font-size:calc(var(--s,1)*17px);padding:calc(var(--s,1)*7px) calc(var(--s,1)*10px)}
.opt .k{width:calc(var(--s,1)*20px);height:calc(var(--s,1)*20px);font-size:calc(var(--s,1)*11px)}
.row p{font-size:25px;line-height:1.35}
.verdict{font-size:26px;font-weight:700}
.row .t{font-size:16px}
.point{gap:calc(var(--s,1)*10px)}
.card{position:relative}
.reveal{position:absolute;inset-inline:12px;bottom:56px;z-index:3;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.nav .btn{padding:4px 12px;font-size:13px}
@media (max-width:460px){.pasuk{font-size:calc(var(--s,1)*22px)}}
.hint{font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}

/* wide screens: split layout (pasuk | question+answers), fonts auto-fit each side */
@media (min-width:900px){
.wrap{max-width:min(1800px,100%)}
.card{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr) auto auto;column-gap:22px;row-gap:8px;overflow:hidden}
.card>.pasuk{grid-column:1;grid-row:1;overflow:hidden;align-self:stretch;font-size:calc(var(--sp,1)*22px);padding:calc(var(--sp,1)*10px) calc(var(--sp,1)*14px)}
.card>.point{position:relative;grid-column:2;grid-row:1;min-height:0;overflow:hidden;border-top:0;padding-top:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--s,1)*12px)}
.card>details{grid-column:1/-1;grid-row:2}
.card>.nav{grid-column:1/-1;grid-row:3}
.reveal{position:absolute;inset:auto 0 0 0;z-index:3;max-height:none;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.row p{font-size:calc(var(--s,1)*18px);line-height:1.4}
.verdict{font-size:30px;font-weight:700}
.row .t{font-size:20px}
.q{font-size:calc(var(--s,1)*21px)}
.opt{font-size:calc(var(--s,1)*21px)}
}

/*EN*/
html[dir=ltr] .opt{direction:ltr;text-align:left}
html[dir=ltr] .q{direction:ltr;text-align:left}
html[dir=ltr] .pnum{direction:ltr}
.q .hb,.opt .hb{font-family:var(--f-heb);font-size:1.12em}
.pasuk .pen{direction:ltr;text-align:left;font-family:var(--f-body);font-size:17px;line-height:1.4;letter-spacing:0;word-spacing:0;margin-top:.6em;color:var(--muted)}
.quote .enx{direction:ltr;text-align:left;font-family:var(--f-body);font-size:.82em;line-height:1.4;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.quote .enx i{color:var(--muted)}
.quote .src{direction:ltr}
.hint .ghost{padding:3px 10px;font-size:14px}
.hint select{font-size:14px;padding:3px 5px}
#pa{display:none}
@media print{
  @page{margin:14mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}
  body>*:not(#pa){display:none!important}
  #pa{display:block;font-family:var(--f-body);font-size:11.5pt;line-height:1.4;color:#000}
  #pa h1{font-size:18pt;margin:0 0 4pt}
  #pa .pr-meta{display:flex;justify-content:space-between;gap:16pt;border-bottom:1.5pt solid #000;padding:4pt 0 8pt;margin-bottom:10pt;font-size:11pt}
  #pa .pr-r{break-inside:avoid;margin:0 0 12pt;border-top:.75pt solid #999;padding-top:6pt}
  #pa .pr-ref{font-size:9.5pt;color:#444;margin-bottom:3pt}
  #pa .pr-pasuk{font-family:var(--f-heb);font-size:15pt;line-height:1.6;direction:rtl;text-align:right}
  #pa .pr-pasuk mark{background:#e8e8e8;color:#000;text-decoration:underline;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #pa .pr-pen{font-size:9.5pt;color:#333;margin:2pt 0 4pt}
  #pa .pr-q{margin:6pt 0 0}
  #pa .pr-qt{font-weight:600}
  #pa .pr-o{margin:1.5pt 0 0 14pt;display:flex;gap:6pt}
  #pa[dir=rtl] .pr-o{margin:1.5pt 14pt 0 0}
  #pa .pr-o b{flex:none}
  #pa .hb{font-family:var(--f-heb);font-size:1.12em}
  #pa .pr-key{break-before:page}
  #pa .pr-a{break-inside:avoid;margin:0 0 6pt;font-size:10.5pt}
  #pa .pr-ex{display:block;color:#444;font-size:9.5pt}
}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <h1>רש״י · חיי שרה <span>רש״י על חיי שרה</span></h1>

<script>
const DATA = [{"id": "23:1.1", "ch": 23, "v": 1, "n": 1, "dh": "ויהיו חיי שרה מאה שנה ועשרים שנה ושבע שנים", "pasuk_html": "<mark>וַיִּהְיוּ֙ חַיֵּ֣י שָׂרָ֔ה מֵאָ֥ה שָׁנָ֛ה וְעֶשְׂרִ֥ים שָׁנָ֖ה וְשֶׁ֣בַע שָׁנִ֑ים</mark> שְׁנֵ֖י חַיֵּ֥י שָׂרָֽה׃", "pasuk_en": "וַיִּהְיוּ חַיֵּי שָׂרָה מֵאָה שָׁנָה וְעֶשְׂרִים שָׁנָה וְשֶׁבַע שָׁנִים שְׁנֵי חַיֵּי שָׂרָה", "rashi_he": "ויהיו חיי שרה מאה שנה ועשרים שנה ושבע שנים. לְכָךְ נִכְתַּב שָׁנָה בְּכָל כְּלָל וּכְלָל, לוֹמַר לְךָ שֶׁכָּל אֶחָד נִדְרָשׁ לְעַצְמוֹ, בַּת ק' כְּבַת כ' לְחֵטְא, מַה בַּת כ' לֹא חָטְאָה, שֶׁהֲרֵי אֵינָהּ בַּת עֳנָשִׁין, אַף בַּת ק' בְּלֹא חֵטְא, וּבַת כ' כְּבַת ז' לְיֹפִי:", "rashi_en": "התורה כותבת את המילה \"שנה\" אחרי כל מספר כדי ללמד שכל חלק נדרש בפני עצמו. בגיל מאה הייתה שרה נקייה מחטא כמו בת עשרים, שעדיין אינה בת עונשין, ובגיל עשרים הייתה יפה כמו בת שבע.", "note": "", "points": [{"q": "מַדּוּעַ הַתּוֹרָה כּוֹתֶבֶת 'שָׁנִים' אַחֲרֵי כָּל קְבוּצַת מִסְפָּרִים (מֵאָה, עֶשְׂרִים, שֶׁבַע)?", "options": ["לְלַמֵּד שֶׁכָּל אַחַת נִדְרֶשֶׁת בִּפְנֵי עַצְמָהּ: בַּת מֵאָה כְּבַת עֶשְׂרִים (לְלֹא חֵטְא), בַּת עֶשְׂרִים כְּבַת שֶׁבַע (לְיֹפִי)", "לְהַדְגִּישׁ שֶׁשָּׂרָה חָיְתָה חַיִּים אֲרֻכִּים מְאוֹד", "לְהַתְאִים לְסִגְנוֹן תֵּאוּרֵי גִּיל אֲחֵרִים בַּתּוֹרָה"], "kasha": "מַדּוּעַ הַמִּלָּה 'שָׁנִים' חוֹזֶרֶת בִּיתוּר אַחֲרֵי כָּל מִסְפָּר?", "answer": "כָּל קְבוּצָה הִיא יְחִידַת פֵּרוּשׁ בִּפְנֵי עַצְמָהּ: בַּת מֵאָה הָיְתָה כְּבַת עֶשְׂרִים לְעִנְיַן חֵטְא, וּבַת עֶשְׂרִים הָיְתָה כְּבַת שֶׁבַע לְעִנְיַן יֹפִי.", "kp": ["לומר לך שכל אחד נדרש לעצמו", "בת ק' כבת כ' לחטא", "ובת כ' כבת ז' ליפי"]}]}, {"id": "23:1.2", "ch": 23, "v": 1, "n": 2, "dh": "שני חיי שרה", "pasuk_html": "וַיִּהְיוּ֙ חַיֵּ֣י שָׂרָ֔ה מֵאָ֥ה שָׁנָ֛ה וְעֶשְׂרִ֥ים שָׁנָ֖ה וְשֶׁ֣בַע שָׁנִ֑ים <mark>שְׁנֵ֖י חַיֵּ֥י שָׂרָֽה׃</mark>", "pasuk_en": "שְׁנֵי חַיֵּי שָׂרָה", "rashi_he": "שני חיי שרה. כֻּלָּן שָׁוִין לְטוֹבָה:", "rashi_en": "התורה חוזרת ואומרת \"שני חיי שרה\" כדי ללמד שכל שנותיה היו שוות לטובה.", "note": "", "points": [{"q": "מָה מְ ֙ אַבְרָהָ֔ם</mark> לִסְפֹּ֥ד לְשָׂרָ֖ה וְלִבְכֹּתָֽהּ׃", "pasuk_en": "וַיָּבֹא אַבְרָהָם לִסְפֹּד לְשָׂרָה וְלִבְכֹּתָהּ", "rashi_he": "ויבא אברהם. מִבְּאֵר שֶׁבַע:", "rashi_en": "אברהם בא לחברון מבאר שבע, שם היה כשמתה שרה.", "note": "", "points": [{"q": "מֵאַיִן בָּא אַבְרָהָם כְּשֶׁהִגִּיעַ לִסְפֹּד לְשָׂרָה?", "options": ["מִבְּאֵר שָׁבַע", "מֵהַר הַמּוֹרִיָּה", "מֵחָרָן"], "kasha": "מַדּוּעַ הַתּוֹרָה אוֹמֶרֶת שֶׁאַבְרָהָם 'בָּא' — מֵאַיִן הוּא בָּא?", "answer": "הוּא בָּא מִבְּאֵר שָׁבַע.", "kp": ["מבאר שבע"]}]}, {"id": "23:2.3", "ch": 23, "v": 2, "n": 3, "dh": "לספוד לשרה ולבכותה", "pasuk_html": "וַתָּ֣מׇת שָׂרָ֗ה בְּקִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּאֶ֣רֶץ כְּנָ֑עַן וַיָּבֹא֙ אַבְרָהָ֔ם <mark>לִסְפֹּ֥ד לְשָׂרָ֖ה וְלִבְכֹּתָֽהּ׃</mark>", "pasuk_en": "לִסְפֹּד לְשָׂרָה וְלִבְכֹּתָהּ", "rashi_he": "לספוד לשרה ולבכתה. וְנִסְמְכָה מִיתַת שָׂרָה לַעֲקֵדַת יִצְחָק לְפִי שֶׁעַל יְדֵי בְּשׂוֹרַת הָעֲקֵדָה, שֶׁנִּזְדַּמֵּן בְּנָהּ לִשְׁחִיטָה וְכִמְעַט שֶׁלֹּא נִשְׁחַט, פָּרְחָה נִשְׁמָתָהּ מִמֶּנָּה וּמֵתָה:", "rashi_en": "מיתת שרה נכתבה מיד אחרי עקדת יצחק, כי כששמעה שבנה הוכן לשחיטה וכמעט נשחט, פרחה נשמתה ממנה ומתה.", "note": "", "points": [{"q": "מַדּוּעַ מוֹת שָׂרָה מוּצָג מִיָּד אַחֲרֵי עֲקֵדַת יִצְחָק?", "options": ["הַבְּשׂוֹרָה שֶׁבְּנָהּ כִּמְעַט נִשְׁחַט הִלְמָה אוֹתָהּ וְנַפְשָׁהּ יָצְאָה", "לְהַרְאוֹת שֶׁאַבְרָהָם הִתְאַבֵּל מִיָּד אַחֲרֵי הָעֲקֵדָה", "בִּגְלַל שֶׁשְּׁנֵי הַמְּאוֹרָעוֹת קָרוּ בְּאוֹתָהּ שָׁנָה"], "kasha": "מַדּוּעַ הַתּוֹרָה סוֹמֶכֶת מוֹת שָׂרָה לַעֲקֵדַת יִצְחָק?", "answer": "כְּשֶׁשָּׂרָה שָׁמְעָה אֶת הַבְּשׂוֹרָה שֶׁבְּנָהּ נֶעֱקַד עַל הַמִּזְבֵּחַ וְכִמְעַט נִשְׁחַט, הַהֶלֶם גָּרַם לְנַפְשָׁהּ לָצֵאת.", "kp": ["וכמעט שלא נשחט", "פרחה נשמתה ממנה ומתה"]}]}, {"id": "23:4.1", "ch": 23, "v": 4, "n": 1, "dh": "גר ותושב אנכי עמכם", "pasuk_html": "<mark>גֵּר־וְתוֹשָׁ֥ב אָנֹכִ֖י עִמָּכֶ֑ם</mark> תְּנ֨וּ לִ֤י אֲחֻזַּת־קֶ֙בֶר֙ עִמָּכֶ֔ם וְאֶקְבְּרָ֥ה מֵתִ֖י מִלְּפָנָֽי׃", "pasuk_en": "גֵּר וְתוֹשָׁב אָנֹכִי עִמָּכֶם תְּנוּ לִי אֲחֻזַּת קֶבֶר עִמָּכֶם וְאֶקְבְּרָה מֵתִי מִלְּפָנָי", "rashi_he": "גר ותושב אנכי עמכם. גֵּר מֵאֶרֶץ אַחֶרֶת וְנִתְיַשַּׁבְתִּי עִמָּכֶם. וּמִדְרַשׁ אַגָּדָה אִם תִּרְצוּ הֲרֵינִי גֵּר, וְאִם לָאו אֶהְיֶה תּוֹשָׁב וְאֶטְּלֶנָּה מִן הַדִּין, שֶׁאָמַר לִי הַקָּבָּ\"ה לְזַרְעֲךָ אֶתֵּן אֶת הָאָרֶץ הַזֹּאת:", "rashi_en": "אברהם אומר: אני גר שבא מארץ אחרת והתיישבתי ביניכם. ובמדרש: אם תרצו אהיה כגר ואקנה את הקרקע בכסף, ואם לא, אהיה כתושב ואקח אותה על פי הדין, כי הקב\"ה אמר לי \"לזרעך אתן את הארץ הזאת\".", "note": "", "points": [{"q": "מַהוּ הַמַּשְׁמָעוּת הַכְּפוּלָה שֶׁל אַבְרָהָם הַקּוֹרֵא לְעַצְמוֹ 'גֵּר־וְתוֹשָׁב'?", "options": ["אִם תִּמְכְּרוּ בְּרָצוֹן, אֲנִי גֵּר שֶׁיְּשַׁלֵּם; אִם לֹא, אֶתְבַּע כְּתוֹשָׁב בְּזְכוּת אֱלֹהִית", "הוּא הָיָה גַּם חָדָשׁ וְגַם תּוֹשָׁב וָתִיק בָּאֵזוֹר", "הוּא הִרְגִּישׁ כְּזָר מִבְּחִינָה רוּחָנִית אַךְ כְּבֵן בַּיִת מִבְּחִינָה גוּפָנִית"], "kasha": "מַדּוּעַ אַבְרָהָם מְתָאֵר עַצְמוֹ בִּשְׁנֵי מֻשָּׂגִים סוֹתְרִים — גֵּר וְגַם תוֹשָׁב?", "answer": "אִם תַּסְכִּימוּ לִמְכֹּר, אֲנִי גֵּר וַאֲשַׁלֵּם. אִם לֹא, אֶקָּחֶנָּה כְּתוֹשָׁב מִדִּין, שֶׁהֲרֵי הַקָּדוֹשׁ בָּרוּךְ הוּא הִבְטִיחַ לִי אֶת הָאָרֶץ הַזֹּאת.", "kp": ["אם תרצו הריני גר", "ואם לאו אהיה תושב"]}]}, {"id": "23:4.2", "ch": 23, "v": 4, "n": 2, "dh": "אחזת קבר", "pasuk_html": "גֵּר־וְתוֹשָׁ֥ב אָנֹכִ֖י עִמָּכֶ֑ם תְּנ֨וּ לִ֤י <mark>אֲחֻזַּת־קֶ֙בֶר֙</mark> עִמָּכֶ֔ם וְאֶקְבְּרָ֥ה מֵתִ֖י מִלְּפָנָֽי׃", "pasuk_en": "תְּנוּ לִי אֲחֻזַּת קֶבֶר עִמָּכֶם", "rashi_he": "אחוזת קבר. אֲחֻזַּת קַרְקַע לְבֵית הַקְּבָרוֹת:", "rashi_en": "\"אחוזת קבר\" פירושה חלקת קרקע שתהיה שלי לבית קברות.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ 'אֲחֻזַּת־קֶבֶר'?", "options": ["אֲחִיזַת קַרְקַע שֶׁתְּשַׁמֵּשׁ כִּמְקוֹם קְבוּרָה", "מָקוֹם מְנוּחָה זְמַנִּי לַמֵּתִים", "נַחֲלַת מִשְׁפָּחָה"], "kasha": "מַהוּ הַמַּשְׁמָעוּת הַמְּדֻיֶּקֶת שֶׁל הַמֻּנָּח 'אֲחֻזַּת קֶבֶר'?", "answer": "פֵּרוּשׁוֹ אֲחִיזַת קַרְקַע הַמְּיֹעֶדֶת לְשַׁמֵּשׁ כִּמְקוֹם קְבוּרָה.", "kp": ["אחזת קרקע לבית הקברות"]}]}, {"id": "23:6.1", "ch": 23, "v": 6, "n": 1, "dh": "לא יכלה", "pasuk_html": "שְׁמָעֵ֣נוּ&thinsp;׀ אֲדֹנִ֗י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּתוֹכֵ֔נוּ בְּמִבְחַ֣ר קְבָרֵ֔ינוּ קְבֹ֖ר אֶת־מֵתֶ֑ךָ אִ֣ישׁ מִמֶּ֔נּוּ אֶת־קִבְר֛וֹ <mark>לֹֽא־יִכְלֶ֥ה</mark> מִמְּךָ֖ מִקְּבֹ֥ר מֵתֶֽךָ׃", "pasuk_en": "אִישׁ מִמֶּנּוּ אֶת קִבְרוֹ לֹא יִכְלֶה מִמְּךָ מִקְּבֹר מֵתֶךָ", "rashi_he": "לא יכלה. לֹא יִמְנַע כְּמוֹ לֹא תִכְלָא רַחֲמֶיךָ (תהילים מ') וּכְמוֹ וַיִּכָּלֵא הַגֶּשֶׁם (בראשית ח'):", "rashi_en": "\"לא יכלה\" פירושו לא ימנע, כמו \"לא תכלא רחמיך\" בתהילים וכמו \"ויכלא הגשם\" בבראשית.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ 'לֹא־יִכְלֶה' בְּהֶקְשֵׁר זֶה?", "options": ["לֹא יִמְנַע, כְּמוֹ בִּתְהִלִּים מ:יב", "לֹא יוּכַל, בִּלְשׁוֹן חֹסֶר יְכֹלֶת", "לֹא יְסַיֵּם אוֹ יַשְׁלִים"], "kasha": "מַה מַּשְׁמָעוּת הַמִּלָּה הַיּוֹצֵאת דֹּפֶן 'יִכְלֶה'?", "answer": "פֵּרוּשָׁהּ 'לֹא יִמְנַע', כְּפִי שֶׁאוֹתוֹ שִׁמּוּשׁ מוֹפִיעַ בִּתְהִלִּים מ:יב.", "kp": ["לא ימנע כמו לא תכלא רחמיך"]}]}, {"id": "23:8.1", "ch": 23, "v": 8, "n": 1, "dh": "נפשכם", "pasuk_html": "וַיְדַבֵּ֥ר אִתָּ֖ם לֵאמֹ֑ר אִם־יֵ֣שׁ אֶֽת־<mark>נַפְשְׁכֶ֗ם</mark> לִקְבֹּ֤ר אֶת־מֵתִי֙ מִלְּפָנַ֔י שְׁמָע֕וּנִי וּפִגְעוּ־לִ֖י בְּעֶפְר֥וֹן בֶּן־צֹֽחַר׃", "pasuk_en": "אִם יֵשׁ אֶת נַפְשְׁכֶם לִקְבֹּר אֶת מֵתִי מִלְּפָנַי", "rashi_he": "נפשכם. רְצוֹנְכֶם:", "rashi_en": "\"נפשכם\" כאן פירושו רצונכם: אם אתם רוצים שאקבור את מתי.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ 'נַפְשְׁכֶם' כָּאן?", "options": ["רְצוֹנְכֶם אוֹ חֶפְצְכֶם", "נִשְׁמַתְכֶם", "חַיֵּיכֶם"], "kasha": "מַה מַּשְׁמָעוּת הַמִּלָּה 'נֶפֶשׁ' בְּהֶקְשֵׁר זֶה?", "answer": "כָּאן 'נֶפֶשׁ' פֵּרוּשָׁהּ רְצוֹנְכֶם אוֹ חֶפְצְכֶם, וְלֹא נְשָׁמָה.", "kp": ["רצונכם"]}]}, {"id": "23:8.2", "ch": 23, "v": 8, "n": 2, "dh": "ופגעו לי", "pasuk_html": "וַיְדַבֵּ֥ר אִתָּ֖ם לֵאמֹ֑ר אִם־יֵ֣שׁ אֶֽת־נַפְשְׁכֶ֗ם לִקְבֹּ֤ר אֶת־מֵתִי֙ מִלְּפָנַ֔י שְׁמָע֕וּנִי <mark>וּפִגְעוּ־לִ֖י</mark> בְּעֶפְר֥וֹן בֶּן־צֹֽחַר׃", "pasuk_en": "שִׁמְעוּנִי וּפִגְעוּ לִי בְּעֶפְרוֹן בֶּן צֹחַר", "rashi_he": "ופגעו לי. לְשוֹן בַּקָּשָׁה כְּמוֹ: אַל תִּפְגְּעִי בִּי (רות א'):", "rashi_en": "\"ופגעו לי\" הוא לשון בקשה, כלומר בקשו בשבילי מעפרון, כמו \"אל תפגעי בי\" במגילת רות.", "note": "", "points": [{"q": "מַה מְסַמֶּלֶת הַמִּלָּה 'וּפִגְעוּ־'?", "options": ["בַּקָּשָׁה, כְּמוֹ בְּרוּת א:טז 'אַל תִּפְגְּעִי בִי'", "עִמּוּת עוֹיֵן", "פְּגִישָׁה מִקְרִית"], "kasha": "מַה פֵּרוּשׁ שֹׁרֶשׁ פ.ג.ע כָּאן?", "answer": "פֵּרוּשָׁהּ בַּקָּשָׁה אוֹ תַּחֲנוּן, כְּפִי שֶׁמּוֹכָח מֵרוּת א:טז שֶׁבָּהּ אוֹתוֹ שֹׁרֶשׁ מְשַׁמֵּשׁ בְּמַשְׁמָעוּת 'אַל תִּפְגְּעִי בִי'.", "kp": ["לשון בקשה כמו", "אל תפגעי בי"]}]}, {"id": "23:9.1", "ch": 23, "v": 9, "n": 1, "dh": "המכפלה", "pasuk_html": "וְיִתֶּן־לִ֗י אֶת־מְעָרַ֤ת <mark>הַמַּכְפֵּלָה֙</mark> אֲשֶׁר־ל֔וֹ אֲשֶׁ֖ר בִּקְצֵ֣ה שָׂדֵ֑הוּ בְּכֶ֨סֶף מָלֵ֜א יִתְּנֶ֥נָּה לִּ֛י בְּתוֹכְכֶ֖ם לַאֲחֻזַּת־קָֽבֶר׃", "pasuk_en": "וְיִתֶּן לִי אֶת מְעָרַת הַמַּכְפֵּלָה אֲשֶׁר לוֹ אֲשֶׁר בִּקְצֵה שָׂדֵהוּ", "rashi_he": "המכפלה. בַּית וַעֲלִיָּה עַל גַּבָּיו. דָּ\"אַ שֶׁכְּפוּלָה בְּזוּגוֹת (עירובין נ\"ג):", "rashi_en": "המערה נקראת \"המכפלה\" כי היו בה שתי קומות, בית ועליה מעליו. דבר אחר: כי היא כפולה בזוגות שנקברו בה.", "note": "", "points": [{"q": "מַדּוּעַ הַמְּעָרָה נִקְרֵאת 'מַכְפֵּלָה'?", "options": ["מִשֹּׁרֶשׁ 'כָּפוּל' — הָיוּ בָּהּ שְׁתֵּי קוֹמוֹת, אוֹ שֶׁנִּקְבְּרוּ בָּהּ זוּגוֹת", "בִּגְלַל שֶׁהָיְתָה בְּגִבְעָה כְּפוּלָה", "בִּגְלַל שֶׁאַבְרָהָם שִׁלֵּם מְחִיר כָּפוּל"], "kasha": "מַה מְסַמֵּל הַשֵּׁם 'מַכְפֵּלָה'?", "answer": "הַשֹּׁרֶשׁ פֵּרוּשׁוֹ 'כָּפוּל'. אוֹ שֶׁהָיוּ בָּהּ מְעָרָה תַּחְתּוֹנָה וְעֶלְיוֹנָה, אוֹ שֶׁנִּקְרֵאת כָּךְ עַל שֵׁם הַזּוּגוֹת שֶׁנִּקְבְּרוּ שָׁם.", "kp": ["בית ועליה על גביו", "שכפולה בזוגות"]}]}, {"id": "23:9.2", "ch": 23, "v": 9, "n": 2, "dh": "בכסף מלא", "pasuk_html": "וְיִתֶּן־לִ֗י אֶת־מְעָרַ֤ת הַמַּכְפֵּלָה֙ אֲשֶׁר־ל֔וֹ אֲשֶׁ֖ר בִּקְצֵ֣ה שָׂדֵ֑הוּ <mark>בְּכֶ֨סֶף מָלֵ֜א</mark> יִתְּנֶ֥נָּה לִּ֛י בְּתוֹכְכֶ֖ם לַאֲחֻזַּת־קָֽבֶר׃", "pasuk_en": "בְּכֶסֶף מָלֵא יִתְּנֶנָּה לִי בְּתוֹכְכֶם לַאֲחֻזַּת קָבֶר", "rashi_he": "בכסף מלא. שָׁלֵם, כָּל שָׁוְיָהּ; וְכֵן דָּוִד אָמַר לַאֲרַוְנָה בְּכֶסֶף מָלֵא (דברי הימים א כ\"א):", "rashi_en": "\"בכסף מלא\" פירושו בתשלום שלם, כל מה שהיא שווה. וכן דוד אמר לארנן שיקנה ממנו את הגורן \"בכסף מלא\".", "note": "", "points": [{"q": "מַה פֵּרוּשׁ 'כֶסֶף מָלֵא' (כֶּסֶף שָׁלֵם)?", "options": ["הַסְּכוּם הַמָּלֵא שֶׁהָאָרֶץ שָׁוָה, כְּמוֹ שֶׁדָּוִד אָמַר לְאָרְנָן", "מַטְבְּעוֹת כֶּסֶף מְלֵאוֹת עַד שְׂפַת הַכְּלִי", "סְכוּם מֻפְרָז מֵעַל לְשָׁוְיָהּ שֶׁל הָאָרֶץ"], "kasha": "מַה מַּשְׁמָעוּת 'מָלֵא' בְּנוֹגֵעַ לַכֶּסֶף?", "answer": "'מָלֵא' פֵּרוּשׁוֹ 'שָׁלֵם' — כָּל מַה שֶׁהָאָרֶץ שָׁוָה. דָּוִד הִשְׁתַּמֵּשׁ בְּאוֹתוֹ בִּטּוּי כְּשֶׁקָּנָה מֵאָרְנָן.", "kp": ["כל שויה", "וכן דוד אמר לארונה"]}]}, {"id": "23:10.1", "ch": 23, "v": 10, "n": 1, "dh": "ועפרון ישב", "pasuk_html": "<mark>וְעֶפְר֥וֹן יֹשֵׁ֖ב</mark> בְּת֣וֹךְ בְּנֵי־חֵ֑ת וַיַּ֩עַן֩ עֶפְר֨וֹן הַחִתִּ֤י אֶת־אַבְרָהָם֙ בְּאׇזְנֵ֣י בְנֵי־חֵ֔ת לְכֹ֛ל בָּאֵ֥י שַֽׁעַר־עִיר֖וֹ לֵאמֹֽר׃", "pasuk_en": "וְעֶפְרוֹן יֹשֵׁב בְּתוֹךְ בְּנֵי חֵת", "rashi_he": "ועפרון ישב. כְּתִיב חָסֵר, אוֹתוֹ הַיּוֹם מִנּוּהוּ שׁוֹטֵר עֲלֵיהֶם; מִפְּנֵי חֲשִׁיבוּתוֹ שֶׁל אַבְרָהָם שֶׁהָיָה צָרִיךְ לוֹ, עָלָה לִגְדֻלָּה:", "rashi_en": "המילה \"ישב\" כתובה חסר, כדי ללמד שבאותו יום מינו את עפרון לשוטר עליהם. בגלל חשיבותו של אברהם שהיה צריך לו, עלה עפרון לגדולה.", "note": "", "points": [{"q": "מַדּוּעַ שֵׁם עֶפְרוֹן כָּתוּב חָסֵר (בְּלִי וָי\"ו) כְּ'יֹשֵׁב'?", "options": ["בְּאוֹתוֹ יוֹם מִנּוּ אוֹתוֹ לְשַׂר, וְנִתְעַלָּה בִּגְלַל שֶׁאַבְרָהָם הָיָה צָרִיךְ לוֹ", "הוּא יָשַׁב בְּדִין כְּמַנְהִיג מְבֻסָּס", "הוּא הָיָה אִישׁ עָנָו שֶׁיָּשַׁב עַל הָאָרֶץ"], "kasha": "מַדּוּעַ 'יֹשֵׁב' כָּתוּב חָסֵר (בְּלִי וָי\"ו)?", "answer": "קוֹרְאִים 'יָשַׁב' (בְּעָבָר), כְּלוֹמַר בְּאוֹתוֹ יוֹם מִנּוּ אֶת עֶפְרוֹן לְשַׂר, וְנִתְעַלָּה בִּגְלַל שֶׁאַבְרָהָם הָיָה נִזְקָק לוֹ.", "kp": ["אותו היום מנוהו שוטר עליהם", "מפני חשיבותו של אברהם"]}]}, {"id": "23:10.2", "ch": 23, "v": 10, "n": 2, "dh": "לכל באי שער עירו", "pasuk_html": "וְעֶפְר֥וֹן יֹשֵׁ֖ב בְּת֣וֹךְ בְּנֵי־חֵ֑ת וַיַּ֩עַן֩ עֶפְר֨וֹן הַחִתִּ֤י אֶת־אַבְרָהָם֙ בְּאׇזְנֵ֣י בְנֵי־חֵ֔ת <mark>לְכֹ֛ל בָּאֵ֥י שַֽׁעַר־עִיר֖וֹ</mark> לֵאמֹֽר׃", "pasuk_en": "וַיַּעַן עֶפְרוֹן הַחִתִּי אֶת אַבְרָהָם בְּאָזְנֵי בְנֵי חֵת לְכֹל בָּאֵי שַׁעַר עִירוֹ", "rashi_he": "לכל באי שער עירו. שֶׁכֻּלָּן בָּטְלוּ מִמְּלָאכְתָּן וּבָאוּ לִגְמֹל חֶסֶד לְשָׂרָה:", "rashi_en": "כל אנשי העיר היו שם, כי כולם הפסיקו ממלאכתם ובאו לגמול חסד עם שרה.", "note": "", "points": [{"q": "מַדּוּעַ הַתּוֹרָה מַזְכִּירָה 'לְכֹל בָּאֵי שַׁעַר־עִירוֹ'?", "options": ["כֻּלָּם עָזְבוּ אֶת מְלַאכְתָּם וּבָאוּ לָחֲלֹק כָּבוֹד אַחֲרוֹן לְשָׂרָה", "הֵם בָּאוּ לְהָעִיד עַל עִסְקָה מִשְׁפָּטִית", "הֵם הִתְכַּנְּסוּ לַאֲסֵפַת עִיר קְבוּעָה"], "kasha": "מַדּוּעַ הַתּוֹרָה מַדְגִּישָׁה שֶׁכָּל אַנְשֵׁי הָעִיר נָכְחוּ?", "answer": "כֻּלָּם עָזְבוּ אֶת עִסּוּקֵיהֶם וּבָאוּ לָחֲלֹק כָּבוֹד אַחֲרוֹן לְשָׂרָה.", "kp": ["שכלן בטלו ממלאכתן", "ובאו לגמל חסד לשרה"]}]}, {"id": "23:11.1", "ch": 23, "v": 11, "n": 1, "dh": "לא אדני", "pasuk_html": "<mark>לֹֽא־אֲדֹנִ֣י</mark> שְׁמָעֵ֔נִי הַשָּׂדֶה֙ נָתַ֣תִּי לָ֔ךְ וְהַמְּעָרָ֥ה אֲשֶׁר־בּ֖וֹ לְךָ֣ נְתַתִּ֑יהָ לְעֵינֵ֧י בְנֵי־עַמִּ֛י נְתַתִּ֥יהָ לָּ֖ךְ קְבֹ֥ר מֵתֶֽךָ׃", "pasuk_en": "לֹא אֲדֹנִי שְׁמָעֵנִי הַשָּׂדֶה נָתַתִּי לָךְ", "rashi_he": "לא אדני. לֹא תִּקְנֶה אוֹתָהּ בְּדָמִים:", "rashi_en": "עפרון אומר \"לא אדני\": לא תקנה את השדה בכסף, אלא אתן לך אותו במתנה.", "note": "", "points": [{"q": "מַה הִתְכַּוֵּן עֶפְרוֹן בְּ'לא־אדני'?", "options": ["אֵינְךָ צָרִיךְ לִקְנוֹתָהּ בְּכֶסֶף — אֲנִי נוֹתֵן לְךָ אוֹתָהּ", "הוּא סֵרֵב לִמְכֹּר אֶת הַשָּׂדֶה כְּלָל", "הוּא רָצָה שֶׁאַבְרָהָם יַמְשִׁיךְ לְהִתְמַקֵּחַ עַל מְחִיר נָמוּךְ יוֹתֵר"], "kasha": "מַה עֶפְרוֹן מְסָרֵב כְּשֶׁהוּא אוֹמֵר 'לֹא אֲדֹנִי'?", "answer": "הוּא אוֹמֵר: אֵינְךָ צָרִיךְ לִקְנוֹתָהּ בְּכֶסֶף; אֲנִי נוֹתֵן אוֹתָהּ לְךָ.", "kp": ["לא תקנה אותה בדמים"]}]}, {"id": "23:11.2", "ch": 23, "v": 11, "n": 2, "dh": "נתתי לך", "pasuk_html": "לֹֽא־אֲדֹנִ֣י שְׁמָעֵ֔נִי הַשָּׂדֶה֙ <mark>נָתַ֣תִּי לָ֔ךְ</mark> וְהַמְּעָרָ֥ה אֲשֶׁר־בּ֖וֹ לְךָ֣ נְתַתִּ֑יהָ לְעֵינֵ֧י בְנֵי־עַמִּ֛י נְתַתִּ֥יהָ לָּ֖ךְ קְבֹ֥ר מֵתֶֽךָ׃", "pasuk_en": "הַשָּׂדֶה נָתַתִּי לָךְ וְהַמְּעָרָה אֲשֶׁר בּוֹ לְךָ נְתַתִּיהָ", "rashi_he": "נתתי לך. הֲרֵי הוּא כְּמוֹ שֶׁנְּתַתִּיהָ לְךָ:", "rashi_en": "\"נתתי לך\" כתוב בלשון עבר, כלומר הרי זה כאילו כבר נתתי לך את השדה.", "note": "", "points": [{"q": "מַדּוּעַ עֶפְרוֹן מִשְׁתַּמֵּשׁ בְּלָשׁוֹן עָבָר 'נָתַתִּי' (כְּבָר נָתַתִּי)?", "options": ["כְּאִלּוּ כְּבָר נָתַן אוֹתָהּ — הַמַּתָּנָה בְּטוּחָה בְּלִבּוֹ", "הוּא הִבְטִיחַ אֶת הַשָּׂדֶה לְאַבְרָהָם בְּעָבָר", "הוּא כְּבָר הֶעֱבִיר אֶת הַשְּׁטָר"], "kasha": "מַדּוּעַ לְהִשְׁתַּמֵּשׁ בְּלָשׁוֹן עָבָר 'נָתַתִּי' עַל דָּבָר שֶׁטֶּרֶם נַעֲשָׂה?", "answer": "לְשׁוֹן הֶעָבָר מְבַטֶּאֶת וַדָּאוּת: כְּאִלּוּ הַנְּתִינָה כְּבָר הֻשְׁלְמָה.", "kp": ["הרי הוא כמו שנתתיה לך"]}]}, {"id": "23:13.1", "ch": 23, "v": 13, "n": 1, "dh": "אך אם אתה לו שמעני", "pasuk_html": "וַיְדַבֵּ֨ר אֶל־עֶפְר֜וֹן בְּאׇזְנֵ֤י עַם־הָאָ֙רֶץ֙ לֵאמֹ֔ר <mark>אַ֛ךְ אִם־אַתָּ֥ה ל֖וּ שְׁמָעֵ֑נִי</mark> נָתַ֜תִּי כֶּ֤סֶף הַשָּׂדֶה֙ קַ֣ח מִמֶּ֔נִּי וְאֶקְבְּרָ֥ה אֶת־מֵתִ֖י שָֽׁמָּה׃", "pasuk_en": "אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי נָתַתִּי כֶּסֶף הַשָּׂדֶה קַח מִמֶּנִּי", "rashi_he": "אך אם אתה לו שמעני. אַתָּה אוֹמֵר לִי לִשְׁמֹעַ לְךָ וְלִקַּח בְּחִנָּם, אֲנִי אִי אֶפְשִׁי בְּכָךְ:", "rashi_en": "אברהם אומר לעפרון: אתה אומר לי לשמוע לך ולקחת את השדה בחינם, ואני איני רוצה בכך.", "note": "", "points": [{"q": "מָה תְּשׁוּבַת אַבְרָהָם לְהַצָּעַת עֶפְרוֹן לָתֵת בְּחִנָּם?", "options": ["אֵינוֹ רוֹצֶה אֶת הַשָּׂדֶה בְּחִנָּם וּמַתְעַקֵּשׁ לְשַׁלֵּם", "הוּא מְקַבֵּל בִּשְׂמָחָה אַךְ מַצִּיעַ תַּשְׁלוּם סִמְלִי", "הוּא מְבַקֵּשׁ מֵעֶפְרוֹן לְהוֹרִיד אֶת הַמְּחִיר"], "kasha": "מַדּוּעַ אַבְרָהָם אוֹמֵר 'אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי' אַחֲרֵי שֶׁהֻצַּע לוֹ הַשָּׂדֶה בְּחִנָּם?", "answer": "אַבְרָהָם אוֹמֵר: אַתָּה אוֹמֵר לִי לְקַבֵּל בְּלִי תַּשְׁלוּם, אֲבָל אֵינִי רוֹצֶה בְּכָךְ. אָנָּא שְׁמַע לִי בִּמְקוֹם זֶה.", "kp": ["אני אי אפשי בכך"]}, {"q": "מָה אַבְרָהָם מְבַקֵּשׁ שֶׁעֶפְרוֹן יַעֲשֶׂה?", "options": ["שֶׁיִּשְׁמַע לוֹ וְיְקַבֵּל תַּשְׁלוּם עַל הַשָּׂדֶה", "שֶׁיִּתֵּן לוֹ אָרֶץ נוֹסֶפֶת בַּסְּבִיבָה", "שֶׁיַּרְשֶׁה לוֹ לְשַׁלֵּם בְּתַשְׁלוּמִים"], "kasha": "מָה אַבְרָהָם מְבַקֵּשׁ כְּשֶׁהוּא אוֹמֵר 'אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי'?", "answer": "הוּא מְבַקֵּשׁ שֶׁעֶפְרוֹן יִשְׁמַע וְיַעֲשֶׂה כִּדְבָרָיו — יְקַבֵּל תַּשְׁלוּם מָלֵא עַל הַשָּׂדֶה.", "kp": ["אך אם אתה לו שמעני"]}]}, {"id": "23:13.2", "ch": 23, "v": 13, "n": 2, "dh": "אך אם אתה לו שמעני", "pasuk_html": "וַיְדַבֵּ֨ר אֶל־עֶפְר֜וֹן בְּאׇזְנֵ֤י עַם־הָאָ֙רֶץ֙ לֵאמֹ֔ר <mark>אַ֛ךְ אִם־אַתָּ֥ה ל֖וּ שְׁמָעֵ֑נִי</mark> נָתַ֜תִּי כֶּ֤סֶף הַשָּׂדֶה֙ קַ֣ח מִמֶּ֔נִּי וְאֶקְבְּרָ֥ה אֶת־מֵתִ֖י שָֽׁמָּה׃", "pasuk_en": "אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי נָתַתִּי כֶּסֶף הַשָּׂדֶה קַח מִמֶּנִּי", "rashi_he": "אך אם אתה לו שמעני. הַלְוַאי וְתִשְׁמָעֵנִי:", "rashi_en": "\"אך אם אתה לו שמעני\" פירושו: הלוואי שתשמע לי ותעשה כבקשתי.", "note": "", "points": [{"q": "מָה רַשִׁ\"י אוֹמֵר שֶׁאַבְרָהָם מִתְכַּוֵּן בַּבִּטּוּי 'אַךְ אִם־אַתָּה לוּ שְׁמָעֵנִי'?", "options": ["הוּא מְבַטֵּא מִשְׁאָלָה שֶׁעֶפְרוֹן יִשְׁמַע לוֹ וְיַסְכִּים לְבַקָּשָׁתוֹ", "הוּא מַצִּיב לְעֶפְרוֹן תְּנַאי שֶׁחַיָּב לְמַלֵּא לִפְנֵי שֶׁיָּחֵלּוּ מַשָּׂא וּמַתָּן", "הוּא מְפַקְפֵּק בִּיכֹלֶת עֶפְרוֹן לְהָבִין אֶת דְּבָרָיו"], "kasha": "הַבִּטּוּי 'אַךְ אִם אַתָּה' נִרְאֶה מְשֻׁנֶּה דִּקְדּוּקִית וּמְחַיֵּב הַבְהָרָה מַה אַבְרָהָם בֶּאֱמֶת מְבַקֵּשׁ", "answer": "רַשִׁ\"י מְפָרֵשׁ שֶׁאַבְרָהָם מְבַטֵּא מִשְׁאָלָה (הַלְוַאי) — הוּא רוֹצֶה שֶׁעֶפְרוֹן יִשְׁמַע וְיְשַׁתֵּף פְּעֻלָּה עִמּוֹ.", "kp": ["הלואי ותשמעני"]}, {"q": "כֵּיצַד רַשִׁ\"י מֵבִין אֶת הַטּוֹן שֶׁל דִּבְרֵי אַבְרָהָם לְעֶפְרוֹן?", "options": ["כְּמִשְׁאָלָה מְקַוָּה אוֹ בִּטּוּי שֶׁל רָצוֹן, וְלֹא כִּדְרִישָׁה אוֹ תְּנַאי", "כְּפְקֻדָּה נוֹקְשָׁה שֶׁעֶפְרוֹן חַיָּב לְצַיֵּת לָהּ מִיָּד", "כְּהֶעָרָה צִינִית הַמְּפַקְפֶּקֶת בְּתְבוּנָתוֹ שֶׁל עֶפְרוֹן"], "kasha": "הַמִּבְנֶה הָעִבְרִי 'אַךְ אִם' אֵינוֹ חַד מַשְׁמָעִי וְנִיתָּן לְקָרְאוֹ בִּמְגוָּנוֹת שׁוֹנוֹת", "answer": "רַשִׁ\"י מְפָרֵשׁ זֹאת כְּמִשְׁאָלָה וְתִקְוָה (הַלְוַאי), לְהַרְאוֹת שֶׁאַבְרָהָם מְבַקֵּשׁ בְּנִמּוּס אֶת שִׁתּוּף הַפְּעֻלָּה שֶׁל עֶפְרוֹן וְלֹא מְצַוֶּה עָלָיו.", "kp": ["הלואי ותשמעני"]}]}, {"id": "23:13.3", "ch": 23, "v": 13, "n": 3, "dh": "נתתי", "pasuk_html": "וַיְדַבֵּ֨ר אֶל־עֶפְר֜וֹן בְּאׇזְנֵ֤י עַם־הָאָ֙רֶץ֙ לֵאמֹ֔ר אַ֛ךְ אִם־אַתָּ֥ה ל֖וּ שְׁמָעֵ֑נִי <mark>נָתַ֜תִּי</mark> כֶּ֤סֶף הַשָּׂדֶה֙ קַ֣ח מִמֶּ֔נִּי וְאֶקְבְּרָ֥ה אֶת־מֵתִ֖י שָֽׁמָּה׃", "pasuk_en": "נָתַתִּי כֶּסֶף הַשָּׂדֶה קַח מִמֶּנִּי וְאֶקְבְּרָה אֶת מֵתִי שָׁמָּה", "rashi_he": "נתתי. דני\"ש בלע\"ז, מוּכָן הוּא אֶצְלִי, וְהַלְוַאי נָתַתִּי לְךָ כְּבָר:", "rashi_en": "\"נתתי\" כאן פירושו אני נותן: הכסף מוכן אצלי, והלוואי שכבר נתתי לך אותו.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ 'נָתַתִּי' (כְּבָר נָתַתִּי) שֶׁל אַבְרָהָם?", "options": ["הַכֶּסֶף מוּכָן בְּיָדִי וְהַלְוַאי שֶׁכְּבָר נְתַתִּיו לְךָ", "כְּבָר הִפְקַדְתִּי אֶת הַכֶּסֶף אֵצֶל צַד שְׁלִישִׁי", "נָתַתִּי כֶּסֶף לְעֶפְרוֹן בְּעָבָר"], "kasha": "מַדּוּעַ גַּם אַבְרָהָם מִשְׁתַּמֵּשׁ בְּלָשׁוֹן עָבָר 'נָתַתִּי' עַל כֶּסֶף שֶׁטֶּרֶם נִמְסַר?", "answer": "לְשׁוֹן הֶעָבָר מְבַטֶּאֶת מוּכָנוּת: יֵשׁ בְּיָדִי כֶּסֶף מוּכָן וְהַלְוַאי שֶׁכְּבָר נְתַתִּיו לְךָ.", "kp": ["מוכן הוא אצלי", "והלואי נתתי לך כבר"]}]}, {"id": "23:15.1", "ch": 23, "v": 15, "n": 1, "dh": "ביני ובינך", "pasuk_html": "אֲדֹנִ֣י שְׁמָעֵ֔נִי אֶ֩רֶץ֩ אַרְבַּ֨ע מֵאֹ֧ת שֶֽׁקֶל־כֶּ֛סֶף <mark>בֵּינִ֥י וּבֵֽינְךָ֖</mark> מַה־הִ֑וא וְאֶת־מֵתְךָ֖ קְבֹֽר׃", "pasuk_en": "אֲדֹנִי שְׁמָעֵנִי אֶרֶץ אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף בֵּינִי וּבֵינְךָ מַה הִוא", "rashi_he": "ביני ובינך. בֵּין שְׁנֵי אוֹהֲבִים כָּמוֹנוּ מַה הִיא חֲשׁוּבָה לִכְלוּם, אֶלָּא הַנַּח אֶת הַמֶּכֶר וְאֶת מֵתְךָ קְבֹר (בראשית רבה):", "rashi_en": "עפרון אומר: בין שני אוהבים כמונו, מה שווים ארבע מאות שקל? אינם חשובים לכלום. עזוב את עניין המכירה ולך קבור את מתך.", "note": "", "points": [{"q": "מָה כַּוָּנַת עֶפְרוֹן כְּשֶׁאוֹמֵר 'בֵּינִי וּבֵינְךָ מַה הִיא אַרְבַּע מֵאוֹת שֶׁקֶל'?", "options": ["בֵּין יְדִידִים כָּמוֹתֵנוּ, אַרְבַּע מֵאוֹת שֶׁקֶל אֵינָם כְּלוּם — פְּשׁוּט קְבֹר מֵתְךָ", "הוּא רוֹמֵז שֶׁרוֹצֶה יוֹתֵר מֵאַרְבַּע מֵאוֹת שֶׁקֶל", "הוּא מְחַלֵּק אֶת הָעֲלוּת בְּשָׁוֶה עִם אַבְרָהָם"], "kasha": "מַדּוּעַ עֶפְרוֹן מַזְכִּיר אֶת הַסְּכוּם וְאַחַר כָּךְ מְזַלְזֵל בּוֹ?", "answer": "הוּא אוֹמֵר: בֵּין שְׁנֵי יְדִידִים כְּמוֹתֵנוּ, מָה חֲשִׁיבוּתָם שֶׁל אַרְבַּע מֵאוֹת שֶׁקֶל? אֵינָם כְּלוּם! הַנַּח אֶת הָעֵסֶק וּקְבֹר אֶת מֵתְךָ.", "kp": ["בין שני אוהבים כמונו", "מה היא חשובה לכלום"]}]}, {"id": "23:16.1", "ch": 23, "v": 16, "n": 1, "dh": "וישקל אברהם לעפרן", "pasuk_html": "וַיִּשְׁמַ֣ע אַבְרָהָם֮ אֶל־עֶפְרוֹן֒ <mark>וַיִּשְׁקֹ֤ל אַבְרָהָם֙ לְעֶפְרֹ֔ן</mark> אֶת־הַכֶּ֕סֶף אֲשֶׁ֥ר דִּבֶּ֖ר בְּאׇזְנֵ֣י בְנֵי־חֵ֑ת אַרְבַּ֤ע מֵאוֹת֙ שֶׁ֣קֶל כֶּ֔סֶף עֹבֵ֖ר לַסֹּחֵֽר׃", "pasuk_en": "וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן וַיִּשְׁקֹל אַבְרָהָם לְעֶפְרֹן אֶת הַכֶּסֶף", "rashi_he": "וישקל אברהם לעפרן. חָסֵר וָי\"ו; לְפִי שֶׁאָמַר הַרְבֵּה, וַאֲפִלּוּ מְעַט לֹא עָשָׂה (בבא מציעא פ\"ז), שֶׁנָּטַל מִמֶּנוּ שְׁקָלִים גְּדוֹלִים שֶׁהֵן קַנְטָרִין, שֶׁנֶּאֱמַר עֹבֵר לַסֹּחֵר, שֶׁמִּתְקַבְּלִים בְּשֶׁקֶל בְּכָל מָקוֹם (שם ובכורות נ'), וְיֵשׁ מָקוֹם שֶׁשִּׁקְלֵיהֶן גְּדוֹלִים, שֶׁהֵן קַנְטָרִין צנטינא\"רש בלע\"ז:", "rashi_en": "השם \"עפרן\" כתוב בלי ו', כי עפרון אמר הרבה ולא עשה אפילו מעט: הוא לקח מאברהם שקלים גדולים, שהם קנטרין. לכן נאמר \"עבר לסוחר\", כלומר שקלים שמתקבלים כשקל בכל מקום, כי יש מקומות שהשקלים בהם גדולים.", "note": "", "points": [{"q": "מַדּוּעַ שֵׁם עֶפְרוֹן כָּתוּב חָסֵר (בְּלִי וָי\"ו) כְּשֶׁאַבְרָהָם מְשַׁלֵּם?", "options": ["הוּא הִבְטִיחַ הַרְבֵּה אַךְ עָשָׂה מְעַט, וְלָקַח מַטְבְּעוֹת גְּדוֹלוֹת — חָסֵר בּוֹ מַשֶּׁהוּ", "זוֹ קִצּוּר סוֹפְרִים בְּלִי מַשְׁמָעוּת מְיֻחֶדֶת", "לְצַיֵּן שֶׁעֶפְרוֹן תָּרַם חֵלֶק מֵהַמְּחִיר"], "kasha": "מַדּוּעַ פִּתְאוֹם שֵׁם עֶפְרוֹן כָּתוּב בְּלִי הָאוֹת וָי\"ו?", "answer": "הַכְּתִיב הַחָסֵר רוֹמֵז שֶׁחָסֵר מַשֶּׁהוּ בְּעֶפְרוֹן — כֵּנוּתוֹ. הוּא הִבְטִיחַ הַרְבֵּה אַךְ לֹא עָשָׂה אֲפִלּוּ מְעַט, וְלָקַח שְׁקָלִים גְּדוֹלִים וּמְנֻפָּחִים כְּתַשְׁלוּם.", "kp": ["לפי שאמר הרבה", "ואפלו מעט לא עשה", "שנטל ממנו שקלים גדולים"]}]}, {"id": "23:17.1", "ch": 23, "v": 17, "n": 1, "dh": "ויקם שדה עפרון", "pasuk_html": "<mark>וַיָּ֣קׇם&thinsp;׀ שְׂדֵ֣ה עֶפְר֗וֹן</mark> אֲשֶׁר֙ בַּמַּכְפֵּלָ֔ה אֲשֶׁ֖ר לִפְנֵ֣י מַמְרֵ֑א הַשָּׂדֶה֙ וְהַמְּעָרָ֣ה אֲשֶׁר־בּ֔וֹ וְכׇל־הָעֵץ֙ אֲשֶׁ֣ר בַּשָּׂדֶ֔ה אֲשֶׁ֥ר בְּכׇל־גְּבֻל֖וֹ סָבִֽיב׃", "pasuk_en": "וַיָּקָם שְׂדֵה עֶפְרוֹן אֲשֶׁר בַּמַּכְפֵּלָה אֲשֶׁר לִפְנֵי מַמְרֵא", "rashi_he": "ויקם שדה עפרון. תְּקוּמָה הָיְתָה לוֹ, שֶׁיָּצָא מִיַּד הֶדְיוֹט לְיַד מֶלֶךְ; וּפְשׁוּטוֹ שֶׁל מִקְרָא וַיָּקָם הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ וְכָל הָעֵץ לְאַבְרָהָם לְמִקְנָה וגו':", "rashi_en": "\"ויקם\" לשון תקומה: השדה עלה בחשיבותו כי עבר מיד אדם פשוט ליד מלך. ופשוטו של מקרא: השדה והמערה וכל העצים שבו קמו לאברהם למקנה, כלומר עברו לרשותו.", "note": "", "points": [{"q": "מָה מְצַיֵּן 'וַיָּקָם' (הוּא קָם) לְגַבֵּי הַשָּׂדֶה?", "options": ["הוּא עָלָה בְּמַעֲמָדוֹ מֵרְשׁוּת הֶדְיוֹט לִרְשׁוּת מֶלֶךְ", "הוּא עָלָה בְּגָבְהוֹ הַפִיזִי אַחֲרֵי הַקְּנִיָּה", "מְחִיר הַשָּׂדֶה עָלָה"], "kasha": "מַדּוּעַ הַתּוֹרָה מִשְׁתַּמֶּשֶׁת בַּמִּלָּה 'וַיָּקָם' (קָם/הוּקַם) לַשָּׂדֶה?", "answer": "הַשָּׂדֶה עָלָה בַּחֲשִׁיבוּתוֹ — עָבַר מֵרְשׁוּת הֶדְיוֹט לִרְשׁוּת מֶלֶךְ (אַבְרָהָם).", "kp": ["שיצא מיד הדיוט ליד מלך"]}]}, {"id": "23:18.1", "ch": 23, "v": 18, "n": 1, "dh": "בכל באי שער עירו", "pasuk_html": "לְאַבְרָהָ֥ם לְמִקְנָ֖ה לְעֵינֵ֣י בְנֵי־חֵ֑ת <mark>בְּכֹ֖ל בָּאֵ֥י שַֽׁעַר־עִירֽוֹ׃</mark>", "pasuk_en": "לְאַבְרָהָם לְמִקְנָה לְעֵינֵי בְנֵי חֵת בְּכֹל בָּאֵי שַׁעַר עִירוֹ", "rashi_he": "בכל באי שער עירו. בְּקֶרֶב כֻּלָּם וּבְמַעֲמַד כֻּלָּם הִקְנָהוּ לוֹ:", "rashi_en": "עפרון הקנה את השדה לאברהם בתוך כל אנשי העיר ובנוכחות כולם.", "note": "", "points": [{"q": "מַה חֲשִׁיבוּת נוֹכְחוּת בְּנֵי חֵת בָּעִסְקָה?", "options": ["כֻּלָּם עָמְדוּ כְּעֵדִים שֶׁנָּתְנוּ לְאַבְרָהָם חֲזָקָה מִשְׁפָּטִית", "הֵם הָיוּ חַיָּבִים לְאַשֵּׁר אֶת הַמְּכִירָה עַל פִּי הַחֹק הַמְּקוֹמִי", "הֵם מָחוּ עַל הַמְּכִירָה לְזָר"], "kasha": "מַדּוּעַ הַתּוֹרָה מַדְגִּישָׁה אֶת נוֹכְחוּת כָּל בָּאֵי שַׁעַר הָעִיר?", "answer": "בְּתוֹךְ מַעֲמָד כֻּלָּם, עֶפְרוֹן נָתַן לְאַבְרָהָם חֲזָקָה מִשְׁפָּטִית עַל הַשָּׂדֶה וְהַמְּעָרָה.", "kp": ["בקרב כלם ובמעמד כלם", "הקנהו לו"]}]}, {"id": "24:1.1", "ch": 24, "v": 1, "n": 1, "dh": "ברך את אברהם בכל", "pasuk_html": "וְאַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּיָּמִ֑ים וַֽיהֹוָ֛ה <mark>בֵּרַ֥ךְ אֶת־אַבְרָהָ֖ם בַּכֹּֽל׃</mark>", "pasuk_en": "Abraham was now old, advanced in years, and GOD had blessed Abraham in all things. ", "rashi_he": "ברך את אברהם בכל. בַּכֹּל עוֹלֶה בְּגִימַטְרִיָּא בֵּן, וּמֵאַחַר שֶׁהָיָה לוֹ בֵּן הָיָה צָרִיךְ לְהַשִּׂיאוֹ אִשָּׁה:", "rashi_en": "המילה \"בכל\" שווה בגימטריא למילה \"בן\". ה' ברך את אברהם בבן, ומכיון שהיה לו בן, היה צריך להשיא לו אשה.", "note": "", "points": [{"q": "מַדּוּעַ רַשִׁ\"י מְקַשֵּׁר אֶת הַמִּלָּה בַּכֹּל ('בַּכֹּל דָּבָר') לְבֵן?", "options": ["הַגִּימַטְרִיָּה שֶׁל בַּכֹּל שָׁוָה לְבֵן", "הַמִּלָּה בַּכֹּל הִיא רָאשֵׁי תֵּבוֹת שֶׁל 'בֵּן כָּל לֵב'", "הַתַּרְגּוּם מְתַרְגֵּם בַּכֹּל כְּ'צֶאֱצָאִים'"], "kasha": "מַדּוּעַ הַתּוֹרָה מַזְכִּירָה בְּרָכָה זוֹ בְּדִיּוּק לִפְנֵי הַחִפּוּשׂ אַחַר אִשָּׁה?", "answer": "הַגִּימַטְרִיָּה שֶׁל בַּכֹּל שָׁוָה לְבֵן — הַקָּדוֹשׁ בָּרוּךְ הוּא בֵּרַךְ אֶת אַבְרָהָם בְּבֵן, וְעַכְשָׁו הָיָה צָרִיךְ לִמְצֹא לוֹ אִשָּׁה.", "kp": ["בכל עולה בגימטריא בן"]}]}, {"id": "24:2.1", "ch": 24, "v": 2, "n": 1, "dh": "זקן ביתו", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָהָ֗ם אֶל־עַבְדּוֹ֙ <mark>זְקַ֣ן בֵּית֔וֹ</mark> הַמֹּשֵׁ֖ל בְּכׇל־אֲשֶׁר־ל֑וֹ שִֽׂים־נָ֥א יָדְךָ֖ תַּ֥חַת יְרֵכִֽי׃", "pasuk_en": "And Abraham said to the senior servant of his household, who had charge of all that he owned, “Put your hand under my thigh ", "rashi_he": "זקן ביתו. לְפִי שֶׁהוּא דָּבוּק נָקוּד זְקַן:", "rashi_en": "המילה \"זקן\" מנוקדת כאן בפתח, כי היא סמוכה למילה שאחריה: זקן של ביתו.", "note": "", "points": [{"q": "מַדּוּעַ הַקּוּף בְּ'זְקַן' מְנֻקֶּדֶת בְּפַתָּח כָּאן?", "options": ["מִפְּנֵי שֶׁהַשֵּׁם בִּסְמִיכוּת, כְּלוֹמַר 'זְקַן בֵּיתוֹ'", "מִפְּנֵי שֶׁהִיא בָּאָה אַחֲרֵי אוֹת גְּרוֹנִית", "מִפְּנֵי שֶׁהִיא בְּמָקוֹם הֶפְסֵק בְּסוֹף הַפָּסוּק"], "kasha": "אֵיזוֹ תְּכוּנָה דִּקְדּוּקִית מַסְבִּירָה אֶת הַנִּקּוּד הַחָרִיג תַּחַת הַקּוּף?", "answer": "הַשֵּׁם בִּסְמִיכוּת (זְקַן בֵּיתוֹ — 'זָקֵן שֶׁל בֵּיתוֹ'), וְזֶה מְשַׁנֶּה אֶת הַנִּקּוּד שֶׁל הַקּוּף לְפַתָּח.", "kp": ["לפי שהוא דבוק נקוד זקן"]}]}, {"id": "24:2.2", "ch": 24, "v": 2, "n": 2, "dh": "תחת ירכי", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָהָ֗ם אֶל־עַבְדּוֹ֙ זְקַ֣ן בֵּית֔וֹ הַמֹּשֵׁ֖ל בְּכׇל־אֲשֶׁר־ל֑וֹ שִֽׂים־נָ֥א יָדְךָ֖ <mark>תַּ֥חַת יְרֵכִֽי׃</mark>", "pasuk_en": "And Abraham said to the senior servant of his household, who had charge of all that he owned, “Put your hand under my thigh ", "rashi_he": "תחת ירכי. לְפִי שֶׁהַנִּשְׁבָּע צָרִיךְ שֶׁיִּטֹּל בְּיָדוֹ חֵפֶץ שֶׁל מִצְוָה, כְּגוֹן סֵפֶר תּוֹרָה אוֹ תְּפִלִּין (שבועות ל\"ח), וְהַמִּילָה הָיְתָה מִצְוָה רִאשׁוֹנָה לוֹ וּבָאָה לוֹ עַל יְדֵי צַעַר וְהָיְתָה חֲבִיבָה עָלָיו וּנְטָלָהּ:", "rashi_en": "מי שנשבע צריך להחזיק בידו חפץ של מצוה, כמו ספר תורה או תפילין. המילה הייתה המצוה הראשונה של אברהם, והיא באה לו בצער והייתה חביבה עליו, ולכן בחר להשביע עליה.", "note": "", "points": [{"q": "מַדּוּעַ אַבְרָהָם צִוָּה אֶת הָעֶבֶד לָשִׂים אֶת יָדוֹ תַּחַת יְרֵכוֹ?", "options": ["הַנִּשְׁבָּע חַיָּב לֶאֱחֹז בְּחֵפֶץ שֶׁל מִצְוָה, וְהַמִּילָה הָיְתָה מִצְוָתוֹ הָרִאשׁוֹנָה שֶׁל אַבְרָהָם, חֲבִיבָה עָלָיו עַל יְדֵי צַעֲרָהּ", "זֶה הָיָה מִנְהַג שְׁבוּעָה מְקוּבָּל בְּאֶרֶץ נַהֲרַיִם", "הַיָּרֵךְ מְסַמֶּלֶת אֶת הַצֶּאֱצָאִים הָעֲתִידִים שֶׁיִּירְשׁוּ אֶת הָאָרֶץ"], "kasha": "מַדּוּעַ דַּוְקָא הַיָּרֵךְ — לָמָּה לֹא לְהִשָּׁבַע עַל מִזְבֵּחַ אוֹ חֵפֶץ קָדוֹשׁ אַחֵר?", "answer": "כָּל הַנִּשְׁבָּע חַיָּב לֶאֱחֹז בְּחֵפֶץ שֶׁל מִצְוָה (כְּמוֹ סֵפֶר תּוֹרָה אוֹ תְּפִלִּין). הַמִּילָה הָיְתָה מִצְוָתוֹ הָרִאשׁוֹנָה שֶׁל אַבְרָהָם וְהָיְתָה חֲבִיבָה עָלָיו עַל יְדֵי הַצַּעַר שֶׁסָּבַל, וְלָכֵן בָּחַר בָּהּ כְּחֵפֶץ שֶׁל מִצְוָה לַשְּׁבוּעָה.", "kp": ["חפץ של מצוה", "והמילה היתה מצוה ראשונה לו", "והיתה חביבה עליו"]}]}, {"id": "24:7.1", "ch": 24, "v": 7, "n": 1, "dh": "ה׳ אלהי השמים", "pasuk_html": "<mark>יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם</mark> אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "ה' אלהי השמים אשר לקחני מבית אבי. וְלֹא אָמַר \"וֵאלֹהֵי הָאָרֶץ\", וּלְמַעְלָה אָמַר וְאַשְׁבִּיעֲךָ וגו'? אָמַר לוֹ עַכְשָׁו הוּא אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ, שֶׁהִרְגַּלְתִּיו בְּפִי הַבְּרִיּוֹת, אֲבָל כְּשֶׁלְּקָחַנִי מִבֵּית אָבִי הָיָה אֱלֹהֵי הַשָּׁמַיִם וְלֹא אֱלֹהֵי הָאָרֶץ, שֶׁלֹּא הָיוּ בָּאֵי עוֹלָם מַכִּירִים בּוֹ וּשְׁמוֹ לֹא הָיָה רָגִיל בָּאָרֶץ:", "rashi_en": "כאן אמר רק \"אלהי השמים\" ולא \"ואלהי הארץ\" כמו שאמר קודם. כי עכשיו ה' הוא אלהי השמים ואלהי הארץ, כי אברהם הרגיל את שמו בפי הבריות; אבל כשלקח אותו מבית אביו היה רק אלהי השמים, כי אנשי העולם לא הכירו בו ושמו לא היה מוכר בארץ.", "note": "", "points": [{"q": "מַדּוּעַ אַבְרָהָם אוֹמֵר כָּאן רַק 'אֱלֹהֵי הַשָּׁמַיִם' אֲבָל לְמַעְלָה בְּפָסוּק ג' אָמַר 'אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ'?", "options": ["עַכְשָׁו הַקָּדוֹשׁ בָּרוּךְ הוּא מוּכָּר גַּם בָּאָרֶץ בִּזְכוּת מַעֲשֵׂי אַבְרָהָם, אֲבָל כְּשֶׁלְּקָחוֹ מִבֵּית אָבִיו רַק הַשָּׁמַיִם הִכִּירוּהוּ", "אַבְרָהָם הָיָה יוֹתֵר רִשְׁמִי כְּשֶׁדִּבֵּר יְשִׁירוֹת לָעֶבֶד", "הַנּוּסָח הַקָּצָר מְשַׁמֵּשׁ כְּשֶׁמְּדַבְּרִים עַל הַבְטָחַת ה', וְהָאָרֹךְ כְּשֶׁמַּשְׁבִּיעִים"], "kasha": "מַדּוּעַ חֹסֶר הָעֲקֵבִיּוּת — לְמַעְלָה (פָּסוּק ג') אַבְרָהָם אָמַר 'אֱלֹהֵי הַשָּׁמַיִם וְהָאָרֶץ' וְכָאן הִשְׁמִיט 'וְהָאָרֶץ'?", "answer": "אַבְרָהָם הִסְבִּיר: עַכְשָׁו הוּא אֱלֹהֵי הַשָּׁמַיִם וְהָאָרֶץ, כִּי אֲנִי הִרְגַּלְתִּיו בְּפִי הַבְּרִיּוֹת. אֲבָל כְּשֶׁלְּקָחַנִי מִבֵּית אָבִי הָיָה רַק אֱלֹהֵי הַשָּׁמַיִם — בְּנֵי הָאָרֶץ עֲדַיִן לֹא הִכִּירוּהוּ.", "kp": ["שהרגלתיו בפי הבריות", "אבל כשלקחני מבית אבי", "היה אלהי השמים ולא אלהי הארץ"]}]}, {"id": "24:7.2", "ch": 24, "v": 7, "n": 2, "dh": "מבית אבי", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי <mark>מִבֵּ֣ית אָבִי֮</mark> וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "מבית אבי. מֵחָרָן:", "rashi_en": "\"מבית אבי\" פירושו מחרן, שם גר אביו.", "note": "", "points": [{"q": "לְאֵיזֶה מָקוֹם מִתְכַּוֵּן 'בֵית אָבִי'?", "options": ["חָרָן", "אוּר כַּשְׂדִּים", "בְּאֵר שָׁבַע"], "kasha": "לְאֵיזֶה מָקוֹם מְסֻיָּם מִתְכַּוֵּן 'בֵּית אָבִי'?", "answer": "'בֵּית אָבִי' מִתְכַּוֵּן לְחָרָן, שֶׁשָּׁם יָשַׁב תֶּרַח אֲבִי אַבְרָהָם.", "kp": ["מחרן"]}]}, {"id": "24:7.3", "ch": 24, "v": 7, "n": 3, "dh": "ומארץ מולדתי", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ <mark>וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒</mark> וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "ומארץ מולדתי. מֵאוּר כַּשְׂדִּים:", "rashi_en": "\"ארץ מולדתי\" שאברהם מזכיר כאן היא אור כשדים, המקום שממנו ה' לקח אותו.", "note": "", "points": [{"q": "לְאֵיזֶה מָקוֹם מִתְכַּוֵּן 'אֶרֶץ מוֹלַדְתִּי'?", "options": ["אוּר כַּשְׂדִּים", "חָרָן", "כְּנַעַן"], "kasha": "מַהוּ הַמָּקוֹם הַמְּסֻיָּם שֶׁל 'אֶרֶץ מוֹלַדְתִּי'?", "answer": "'אֶרֶץ מוֹלַדְתִּי' מִתְכַּוֵּן לְאוּר כַּשְׂדִּים, שֶׁשָּׁם נוֹלַד אַבְרָהָם.", "kp": ["מאור כשדים"]}]}, {"id": "24:7.4", "ch": 24, "v": 7, "n": 4, "dh": "ואשר דבר לי", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ <mark>וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י</mark> וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "ואשר דבר לי. לְצָרְכִּי; כְּמוֹ אֲשֶׁר דִּבֶּר עָלַי (מלכים א' ב'), וְכֵן כָּל לִי וְלוֹ וְלָהֶם הַסְּמוּכִים אֵצֶל דִּבּוּר מְפֹרָשִׁים בִּלְשוֹן עַל, וְתַרְגּוּם שֶׁלָּהֶם עֲלַי, עֲלוֹהִי, עֲלֵיהוֹן, שֶׁאֵין נוֹפֵל אֵצֶל דִּבּוּר לְשׁוֹן לִי וְלוֹ וְלָהֶם, אֶלָּא אֵלַי, אֵלָיו, אֲלֵיהֶם, וְתַרְגּוּם שֶׁלָּהֶם עִמִּי, עִמֵּיהּ, עִמְּהוֹן, אֲבָל אֵצֶל אֲמִירָה נוֹפֵל לְשׁוֹן לִי וְלוֹ וְלָהֶם:", "rashi_en": "\"דבר לי\" פירושו דיבר עליי ולטובתי, כמו \"אשר דבר עלי\". כשהמילים לי, לו, להם באות אחרי לשון דיבור, הפירוש הוא \"על\", כי לדבר אל מישהו אומרים \"אלי, אליו, אליהם\". אבל אחרי לשון אמירה מתאים לומר \"לי, לו, להם\".", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ\"י מַסְבִּיר אֶת הַמִּלָּה לִי בְּ'אֲשֶׁר דִּבֶּר לִי'?", "options": ["פֵּרוּשָׁהּ 'בִּשְׁבִילִי' אוֹ 'עַל אוֹדוֹתַי'", "פֵּרוּשָׁהּ 'יְשִׁירוֹת אֵלַי בִּנְבוּאָה'", "פֵּרוּשָׁהּ 'לְמַעַן צֶאֱצָאַי'"], "kasha": "מָה הַדִּיּוּק שֶׁהַמִּלָּה לִי מוֹסִיפָה מֵעֵבֶר לְ'דִבֶּר אֵלַי'?", "answer": "הַמִּלָּה לִי פֵּרוּשָׁהּ 'בִּשְׁבִילִי' אוֹ 'עַל אוֹדוֹתַי' — לֹא רַק שֶׁהַקָּדוֹשׁ בָּרוּךְ הוּא דִּבֶּר אֵלָיו, אֶלָּא שֶׁהַדִּבּוּר הָיָה לְטוֹבָתוֹ.", "kp": ["לצרכי", "כמו אשר דבר עלי"]}]}, {"id": "24:7.5", "ch": 24, "v": 7, "n": 5, "dh": "ואשר נשבע לי", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י <mark>וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙</mark> לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "ואשר נשבע לי. בֵּין הַבְּתָרִים:", "rashi_en": "השבועה שה' נשבע לאברהם היא השבועה בברית בין הבתרים.", "note": "", "points": [{"q": "מָתַי הָיְתָה הַשְּׁבוּעָה שֶׁ'אֲשֶׁר נִשְׁבַּע לִי' מַזְכִּיר?", "options": ["בִּבְרִית בֵּין הַבְּתָרִים", "בַּעֲקֵדַת יִצְחָק", "כְּשֶׁאַבְרָהָם הִגִּיעַ לְכְנַעַן לָרִאשׁוֹנָה"], "kasha": "לְאֵיזֶה אֵרוּעַ מְסֻיָּם מִתְכַּוֵּן אַבְרָהָם כְּשֶׁאוֹמֵר שֶׁה' 'נִשְׁבַּע' לוֹ?", "answer": "הַקָּדוֹשׁ בָּרוּךְ הוּא נִשְׁבַּע לְאַבְרָהָם בִּבְרִית בֵּין הַבְּתָרִים.", "kp": ["בין הבתרים"]}]}, {"id": "24:8.1", "ch": 24, "v": 8, "n": 1, "dh": "ונקית משבעתי", "pasuk_html": "וְאִם־לֹ֨א תֹאבֶ֤ה הָֽאִשָּׁה֙ לָלֶ֣כֶת אַחֲרֶ֔יךָ <mark>וְנִקִּ֕יתָ מִשְּׁבֻעָתִ֖י</mark> זֹ֑את רַ֣ק אֶת־בְּנִ֔י לֹ֥א תָשֵׁ֖ב שָֽׁמָּה׃", "pasuk_en": "And if the woman does not consent to follow you, you shall then be clear of this oath to me; but do not take my son back there.” ", "rashi_he": "ונקית משבועתי וגו'. וְקַח לוֹ אִשָּׁה מִבְּנוֹת עָנֵר אֶשְׁכּוֹל וּמַמְרֵא:", "rashi_en": "אם האשה לא תרצה ללכת, אתה פטור מהשבועה, ואז תיקח ליצחק אשה מבנות ענר, אשכול וממרא.", "note": "", "points": [{"q": "אִם הָאִשָּׁה תְּסָרֵב לָבוֹא, מָה מֻתָּר לָעֶבֶד לַעֲשׂוֹת?", "options": ["הוּא מְשֻׁחְרָר מִן הַשְּׁבוּעָה וּמֻתָּר לָקַחַת אִשָּׁה מִבְּנוֹת עָנֵר אֶשְׁכֹּל וּמַמְרֵא", "עָלָיו לַחֲזֹר לְאַבְרָהָם בְּיָדַיִם רֵיקוֹת וְהַשְּׁבוּעָה נִשְׁאֶרֶת בְּתָקְפָּהּ", "עָלָיו לִנְסֹעַ לְעָנָף אַחֵר שֶׁל מִשְׁפַּחַת אַבְרָהָם"], "kasha": "מָה קוֹרֶה לְחִיּוּב הַשְּׁבוּעָה אִם הַשְּׁלִיחוּת נִכְשֶׁלֶת?", "answer": "הָעֶבֶד מְשֻׁחְרָר מִן הַשְּׁבוּעָה לְגַמְרֵי, וְרַשָּׁאי לָקַחַת אִשָּׁה מִבְּנוֹת עָנֵר, אֶשְׁכֹּל אוֹ מַמְרֵא.", "kp": ["ונקית משבועתי", "מבנות ענר אשכול וממרא"]}]}, {"id": "24:8.2", "ch": 24, "v": 8, "n": 2, "dh": "רק את בני", "pasuk_html": "וְאִם־לֹ֨א תֹאבֶ֤ה הָֽאִשָּׁה֙ לָלֶ֣כֶת אַחֲרֶ֔יךָ וְנִקִּ֕יתָ מִשְּׁבֻעָתִ֖י זֹ֑את <mark>רַ֣ק אֶת־בְּנִ֔י</mark> לֹ֥א תָשֵׁ֖ב שָֽׁמָּה׃", "pasuk_en": "And if the woman does not consent to follow you, you shall then be clear of this oath to me; but do not take my son back there.” ", "rashi_he": "רק את בני וגו'. רַק מִעוּט הוּא; בְּנִי אֵינוֹ חוֹזֵר, אֲבָל יַעֲקֹב בֶּן בְּנִי סוֹפוֹ לַחֲזֹר:", "rashi_en": "המילה \"רק\" באה למעט: רק בני, יצחק, לא יחזור לשם. אבל יעקב, בן בני, יחזור לשם בסוף.", "note": "", "points": [{"q": "מָה בָּאָה מִלַּת הַמִּעוּט רַק ('רַק אֶת־בְּנִי') לְהוֹצִיא?", "options": ["רַק יִצְחָק לֹא יַחֲזֹר לְשָׁם, אֲבָל יַעֲקֹב (נֶכֶד אַבְרָהָם) סוֹפוֹ לַחֲזֹר", "רַק בֵּן אֶחָד לֹא יֵלֵךְ — אִם יִהְיוּ לְאַבְרָהָם עוֹד בָּנִים, הֵם רַשָּׁאִים", "רַק יִצְחָק לֹא יֵלֵךְ לִצְמִיתוּת, אֲבָל מֻתָּר לוֹ לְבַקֵּר זְמַנִּית"], "kasha": "מַדּוּעַ הַתּוֹרָה מִשְׁתַּמֶּשֶׁת בְּמִלַּת הַמִּעוּט רַק כָּאן?", "answer": "רַק מְמַעֵט אֶת הָאִסּוּר לְיִצְחָק בִּלְבַד: רַק בְּנִי לֹא יַחֲזֹר לְשָׁם, אֲבָל יַעֲקֹב (נֶכְדִּי) סוֹפוֹ לַחֲזֹר לְאוֹתָהּ אֶרֶץ.", "kp": ["רק מעוט הוא", "בני אינו חוזר", "אבל יעקב בן בני סופו לחזר"]}]}, {"id": "24:10.1", "ch": 24, "v": 10, "n": 1, "dh": "מגמלי אדניו", "pasuk_html": "וַיִּקַּ֣ח הָ֠עֶ֠בֶד עֲשָׂרָ֨ה גְמַלִּ֜ים <mark>מִגְּמַלֵּ֤י אֲדֹנָיו֙</mark> וַיֵּ֔לֶךְ וְכׇל־ט֥וּב אֲדֹנָ֖יו בְּיָד֑וֹ וַיָּ֗קׇם וַיֵּ֛לֶךְ אֶל־אֲרַ֥ם נַֽהֲרַ֖יִם אֶל־עִ֥יר נָחֽוֹר׃", "pasuk_en": "Then the servant took ten of his master’s camels and set out, taking with him all the bounty of his master; and he made his way to Aram-naharaim, to the city of Nahor. ", "rashi_he": "מגמלי אדוניו. נִכָּרִין הָיוּ מִשְּׁאָר גְּמַלִּים, שֶׁהָיוּ יוֹצְאִין זְמוּמִין מִפְּנֵי הַגֶּזֶל, שֶׁלֹּא יִרְעוּ בִשְׂדוֹת אֲחֵרִים (בראשית רבה):", "rashi_en": "הגמלים של אברהם היו ניכרים ושונים משאר הגמלים, כי יצאו עם מחסום על הפה כדי שלא יאכלו בשדות של אחרים, וכך לא יהיה בזה גזל.", "note": "", "points": [{"q": "בַּמָּה הִצְטַיְּנוּ גְּמַלֵּי אַבְרָהָם מִשְּׁאָר גְּמַלִּים?", "options": ["הֵם יָצְאוּ זְמוּמִים כְּדֵי שֶׁלֹּא יִרְעוּ בִּשְׂדוֹת אֲחֵרִים", "הֵם הָיוּ מְסֻמָּנִים בְּסִימַן אַבְרָהָם עַל רַגְלֵיהֶם", "הֵם הָיוּ גְּמַלִּים לְבָנִים, זַן יָקָר וְנָדִיר"], "kasha": "מַדּוּעַ הַפָּסוּק מְפָרֵשׁ 'מִגְּמַלֵּי אֲדֹנָיו' — מָה הָיָה מְיֻחָד בָּהֶם?", "answer": "גְּמַלֵּי אַבְרָהָם הָיוּ נִכָּרִים מִפְּנֵי שֶׁיָּצְאוּ זְמוּמִים, כְּדֵי לִמְנֹעַ אוֹתָם מִלִּרְעוֹת בִּשְׂדוֹת אֲחֵרִים, לְהִמָּנַע מִכָּל צוּרָה שֶׁל גָּזֵל.", "kp": ["נכרין היו משאר גמלים", "שהיו יוצאין זמומין מפני הגזל"]}]}, {"id": "24:10.2", "ch": 24, "v": 10, "n": 2, "dh": "וכל טוב אדניו בידו", "pasuk_html": "וַיִּקַּ֣ח הָ֠עֶ֠בֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִגְּמַלֵּ֤י אֲדֹנָיו֙ וַיֵּ֔לֶךְ <mark>וְכׇל־ט֥וּב אֲדֹנָ֖יו בְּיָד֑וֹ</mark> וַיָּ֗קׇם וַיֵּ֛לֶךְ אֶל־אֲרַ֥ם נַֽהֲרַ֖יִם אֶל־עִ֥יר נָחֽוֹר׃", "pasuk_en": "Then the servant took ten of his master’s camels and set out, taking with him all the bounty of his master; and he made his way to Aram-naharaim, to the city of Nahor. ", "rashi_he": "וכל טוב אדוניו בידו. שְׁטָר מַתָּנָה כָּתַב לְיִצְחָק עַל כָּל אֲשֶׁר לוֹ, כְּדֵי שֶׁיִּקְפְּצוּ לִשְׁלֹחַ לוֹ בִּתָּם (בראשית רבה):", "rashi_en": "אברהם כתב שטר מתנה ליצחק על כל מה שהיה לו, והעבד לקח אותו בידו, כדי שהמשפחה תמהר לתת את בתם ליצחק.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ 'וְכׇל־טוּב אֲדֹנָיו בְּיָדוֹ' בִּמְצִיאוּת?", "options": ["הוּא נָשָׂא שְׁטַר מַתָּנָה שֶׁמַּעֲבִיר אֶת כָּל רְכוּשׁ אַבְרָהָם לְיִצְחָק", "הוּא הֵבִיא עֲשָׂרָה מַשָּׂאוֹת גְּמַלִּים שֶׁל מַתָּנוֹת יְקָרוֹת וְתַכְשִׁיטִים", "הוּא נָשָׂא אִגֶּרֶת הֶכֵּר מֵאַבְרָהָם שֶׁמְּתָאֶרֶת אֶת עָשְׁרוֹ"], "kasha": "כֵּיצַד יָכֹל עֶבֶד לִשְׂאֵת אֶת 'כָּל' טוּב אֲדֹנָיו?", "answer": "הוּא כָּתַב שְׁטַר מַתָּנָה שֶׁל כָּל נִכְסֵי אַבְרָהָם לְיִצְחָק, כְּדֵי שֶׁהַמִּשְׁפָּחָה תִּרְצֶה לִשְׁלֹחַ אֶת בִּתָּם לְהִנָּשֵׂא לְעָשִׁיר כָּזֶה.", "kp": ["שטר מתנה כתב ליצחק", "על כל אשר לו"]}]}, {"id": "24:10.3", "ch": 24, "v": 10, "n": 3, "dh": "ארם נהרים", "pasuk_html": "וַיִּקַּ֣ח הָ֠עֶ֠בֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִגְּמַלֵּ֤י אֲדֹנָיו֙ וַיֵּ֔לֶךְ וְכׇל־ט֥וּב אֲדֹנָ֖יו בְּיָד֑וֹ וַיָּ֗קׇם וַיֵּ֛לֶךְ אֶל־<mark>אֲרַ֥ם נַֽהֲרַ֖יִם</mark> אֶל־עִ֥יר נָחֽוֹר׃", "pasuk_en": "Then the servant took ten of his master’s camels and set out, taking with him all the bounty of his master; and he made his way to Aram-naharaim, to the city of Nahor. ", "rashi_he": "ארם נהרים. בֵּין שְׁתֵּי נְהָרוֹת יוֹשֶׁבֶת:", "rashi_en": "ארם נהרים נקראת כך כי היא נמצאת בין שני נהרות.", "note": "", "points": [{"q": "מַדּוּעַ נִקְרֵאת אֲרַם נַהֲרַיִם ('אֲרַם שֶׁל שְׁנֵי נְהָרוֹת')?", "options": ["מִפְּנֵי שֶׁהִיא יוֹשֶׁבֶת בֵּין שְׁנֵי נְהָרוֹת: פְּרָת וְחִדֶּקֶל", "מִפְּנֵי שִׁשְׁנֵי נְחָלִים מִתְאַחֲדִים בְּמֶרְכַּז הָעִיר", "מִפְּנֵי שֶׁהַיַּרְדֵּן וְהַפְּרָת מְהַוִּים אֶת גְּבוּלוֹתֶיהָ"], "kasha": "מַה פֵּרוּשׁ שֵׁם הַמָּקוֹם 'אֲרַם נַהֲרַיִם'?", "answer": "פֵּרוּשָׁהּ מֵסוֹפּוֹטַמְיָה — הָאָרֶץ הַיּוֹשֶׁבֶת בֵּין שְׁנֵי נְהָרוֹת, פְּרָת וְחִדֶּקֶל.", "kp": ["בין שתי נהרות יושבת"]}]}, {"id": "24:11.1", "ch": 24, "v": 11, "n": 1, "dh": "ויברך הגמלים", "pasuk_html": "<mark>וַיַּבְרֵ֧ךְ הַגְּמַלִּ֛ים</mark> מִח֥וּץ לָעִ֖יר אֶל־בְּאֵ֣ר הַמָּ֑יִם לְעֵ֣ת עֶ֔רֶב לְעֵ֖ת צֵ֥את הַשֹּׁאֲבֹֽת׃", "pasuk_en": "He made the camels kneel down by the well outside the city, at evening time, the time when women come out to draw water. ", "rashi_he": "ויברך הגמלים. הִרְבִּיצָם:", "rashi_en": "\"ויברך הגמלים\" פירושו שהעבד השכיב את הגמלים על הארץ.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ וַיַּבְרֵךְ בְּהֶקְשֵׁר זֶה?", "options": ["הוּא הִבְרִיךְ אֶת הַגְּמַלִּים — גָּרַם לָהֶם לִכְרֹעַ", "הוּא בֵּרַךְ אֶת הַגְּמַלִּים לִפְנֵי הַמַּסָּע", "הוּא הֶאֱכִיל וְהִשְׁקָה אֶת הַגְּמַלִּים"], "kasha": "הַמִּלָּה וַיַּבְרֵךְ בְּדֶרֶךְ כְּלָל פֵּרוּשָׁהּ 'הוּא בֵּרַךְ' — מַה פֵּרוּשָׁהּ כָּאן?", "answer": "כָּאן וַיַּבְרֵךְ פֵּרוּשׁוֹ הוּא הִבְרִיכָם — מִלְּשׁוֹן כְּרִיעָה (בֶּרֶךְ פֵּרוּשָׁהּ גַּם 'בִּרְכַּיִם').", "kp": ["הרביצם"]}]}, {"id": "24:14.1", "ch": 24, "v": 14, "n": 1, "dh": "אתה הכחת", "pasuk_html": "וְהָיָ֣ה הַֽנַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֙יהָ֙ הַטִּי־נָ֤א כַדֵּךְ֙ וְאֶשְׁתֶּ֔ה וְאָמְרָ֣ה שְׁתֵ֔ה וְגַם־גְּמַלֶּ֖יךָ אַשְׁקֶ֑ה <mark>אֹתָ֤הּ הֹכַ֙חְתָּ֙</mark> לְעַבְדְּךָ֣ לְיִצְחָ֔ק וּבָ֣הּ אֵדַ֔ע כִּי־עָשִׂ֥יתָ חֶ֖סֶד עִם־אֲדֹנִֽי׃", "pasuk_en": "let the maiden to whom I say, ‘Please, lower your jar that I may drink,’ and who replies, ‘Drink, and I will also water your camels’—let her be the one whom You have decreed for Your servant Isaac. Thereby shall I know that You have dealt graciously with my master.”", "rashi_he": "אתה הכחת. רְאוּיָה הִיא לוֹ שֶׁתְּהֵא גּוֹמֶלֶת חֲסָדִים, וּכְדַאי לִכָּנֵס בְּבֵיתוֹ שֶׁל אַבְרָהָם; וּלְשׁוֹן הֹכַחְתָּ בֵּרַרְתָּ, אפרו\"בישט בלע\"ז:", "rashi_en": "העבד אומר: נערה שגומלת חסדים ראויה ליצחק וכדאי שתיכנס לבית אברהם. \"הוכחת\" פירושו בחרת.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ הֹכַחְתָּ וּמַדּוּעַ נַעֲרָה זוֹ רְאוּיָה לְיִצְחָק?", "options": ["פֵּרוּשָׁהּ 'בָּחַרְתָּ/הוֹכַחְתָּ' — הִיא הוֹכִיחָה שֶׁהִיא רְאוּיָה בְּכָךְ שֶׁהֶרְאֲתָה מִדַּת חֶסֶד הָרְאוּיָה לְבֵית אַבְרָהָם", "פֵּרוּשָׁהּ 'בָּחַנְתָּ' — הִיא עָבְרָה מִבְחָן סִבֹּלֶת גּוּפָנִי", "פֵּרוּשָׁהּ 'גִּלִּיתָ' — ה' הוֹדִיעַ אֶת זֶהוּתָהּ עַל יְדֵי אוֹת"], "kasha": "אֵיזוֹ מִדָּה מְחַפֵּשׂ הָעֶבֶד, וּמַה פֵּרוּשׁ הֹכַחְתָּ?", "answer": "הֹכַחְתָּ פֵּרוּשָׁהּ 'בָּחַרְתָּ' אוֹ 'הוֹכַחְתָּ'. הַנַּעֲרָה שֶׁמַּשְׁקָה מַיִם לְנָכְרִי וְלִגְמַלָּיו מוֹכִיחָה מִדַּת חֶסֶד, וְזֶה הוֹפֵךְ אוֹתָהּ לִרְאוּיָה לְהִצְטָרֵף לְבֵית אַבְרָהָם.", "kp": ["ולשון הכחת בררת", "ראויה היא לו שתהא גומלת חסדים"]}]}, {"id": "24:14.2", "ch": 24, "v": 14, "n": 2, "dh": "ובה אדע", "pasuk_html": "וְהָיָ֣ה הַֽנַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֙יהָ֙ הַטִּי־נָ֤א כַדֵּךְ֙ וְאֶשְׁתֶּ֔ה וְאָמְרָ֣ה שְׁתֵ֔ה וְגַם־גְּמַלֶּ֖יךָ אַשְׁקֶ֑ה אֹתָ֤הּ הֹכַ֙חְתָּ֙ לְעַבְדְּךָ֣ לְיִצְחָ֔ק <mark>וּבָ֣הּ אֵדַ֔ע</mark> כִּי־עָשִׂ֥יתָ חֶ֖סֶד עִם־אֲדֹנִֽי׃", "pasuk_en": "let the maiden to whom I say, ‘Please, lower your jar that I may drink,’ and who replies, ‘Drink, and I will also water your camels’—let her be the one whom You have decreed for Your servant Isaac. Thereby shall I know that You have dealt graciously with my master.”", "rashi_he": "ובה אדע. לְשׁוֹן תְּחִנָּה, הוֹדַע לִי בָּהּ:", "rashi_en": "\"ובה אדע\" הוא לשון בקשה: העבד מבקש מה' שיודיע לו דרכה.", "note": "", "points": [{"q": "מַהוּ טִיבָהּ שֶׁל אֲמִירַת הָעֶבֶד 'וּבָהּ אֵדַע'?", "options": ["זוֹ בַּקָּשָׁה/תְּפִלָּה — 'תֵּן לִי לָדַעַת עַל יָדָהּ'", "זוֹ הַצְהָרַת וַדָּאוּת — 'אֲנִי כְּבָר יוֹדֵעַ שֶׁהִיא הַנְּכוֹנָה'", "זֶהוּ תְּנַאי — 'רַק אִם תַּעֲשֶׂה כָּךְ אֵדַע'"], "kasha": "הַאִם הָעֶבֶד דּוֹרֵשׁ, מִתְפַּלֵּל, אוֹ מַסִּיק מַסְקָנָה הֶגְיוֹנִית?", "answer": "זוֹ בַּקָּשָׁה לַקָּדוֹשׁ בָּרוּךְ הוּא — הָעֶבֶד מִתְפַּלֵּל: 'תֵּן לִי לָדַעַת עַל יָדָהּ שֶׁהִיא הַנְּכוֹנָה'.", "kp": ["לשון תחנה"]}]}, {"id": "24:14.3", "ch": 24, "v": 14, "n": 3, "dh": "כי עשית חסד", "pasuk_html": "וְהָיָ֣ה הַֽנַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֙יהָ֙ הַטִּי־נָ֤א כַדֵּךְ֙ וְאֶשְׁתֶּ֔ה וְאָמְרָ֣ה שְׁתֵ֔ה וְגַם־גְּמַלֶּ֖יךָ אַשְׁקֶ֑ה אֹתָ֤הּ הֹכַ֙חְתָּ֙ לְעַבְדְּךָ֣ לְיִצְחָ֔ק וּבָ֣הּ אֵדַ֔ע <mark>כִּי־עָשִׂ֥יתָ חֶ֖סֶד</mark> עִם־אֲדֹנִֽי׃", "pasuk_en": "let the maiden to whom I say, ‘Please, lower your jar that I may drink,’ and who replies, ‘Drink, and I will also water your camels’—let her be the one whom You have decreed for Your servant Isaac. Thereby shall I know that You have dealt graciously with my master.”", "rashi_he": "כי עשית חסד. אִם תִּהְיֶה מִמִּשְׁפַּחְתּוֹ וְהוֹגֶנֶת לוֹ אֵדַע כִּי עָשִׂית חֶסֶד:", "rashi_en": "אם הנערה תהיה ממשפחת אברהם ומתאימה ליצחק, אדע שעשית חסד עם אדוני.", "note": "", "points": [{"q": "מָתַי יֵדַע הָעֶבֶד שֶׁה' עָשָׂה חֶסֶד עִם אֲדֹנָיו?", "options": ["אִם הַנַּעֲרָה תִּתְבָּרֵר כְּבַת מִשְׁפַּחַת אַבְרָהָם וּרְאוּיָה לְיִצְחָק", "אִם הַנַּעֲרָה תַּשְׁקֶה אֶת הַגְּמַלִּים בִּמְהִירוּת", "אִם הַנַּעֲרָה תִּהְיֶה יָפָה וַעֲשִׁירָה"], "kasha": "מָה בְּדִיּוּק יְאַשֵּׁר שֶׁה' עָשָׂה 'חֶסֶד' עִם אַבְרָהָם?", "answer": "אִם הַנַּעֲרָה בַּעֲלַת הַחֶסֶד תִּתְבָּרֵר גַּם כְּבַת מִשְׁפַּחַת אַבְרָהָם וּרְאוּיָה לְיִצְחָק, אָז יֵדַע הָעֶבֶד שֶׁה' עָשָׂה חֶסֶד עִם אֲדֹנָיו.", "kp": ["אם תהיה ממשפחתו והוגנת לו"]}]}, {"id": "24:16.1", "ch": 24, "v": 16, "n": 1, "dh": "בתולה", "pasuk_html": "וְהַֽנַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד <mark>בְּתוּלָ֕ה</mark> וְאִ֖ישׁ לֹ֣א יְדָעָ֑הּ וַתֵּ֣רֶד הָעַ֔יְנָה וַתְּמַלֵּ֥א כַדָּ֖הּ וַתָּֽעַל׃", "pasuk_en": "The maiden was very beautiful, a virgin whom no man had known.bvirgin Or “young woman.” She went down to the spring, filled her jar, and came up. ", "rashi_he": "בתולה. מִמְּקוֹם בְּתוּלִים (בראשית רבה):", "rashi_en": "\"בתולה\" פירושו שהיא בתולה במקום הבתולים.", "note": "", "points": [{"q": "מָה אוֹמֵר רַשִׁ\"י שֶׁבְּתוּלָה מִתְכַּוֶּנֶת בְּדִיּוּק?", "options": ["בְּתוּלָה מִמָּקוֹם בְּתוּלֶיהָ — בְּתוּלִים מַמָּשׁ", "נַעֲרָה צְעִירָה שֶׁלֹּא נִשְּׂאָה בְּגִיל נִשּׂוּאִין", "אִשָּׁה שֶׁמֵּעוֹלָם לֹא אֵרְסוּ אוֹתָהּ"], "kasha": "אִם הַפָּסוּק כְּבָר אָמַר 'בְּתוּלָה', מַדּוּעַ רַשִׁ\"י צָרִיךְ לְפָרֵשׁ?", "answer": "רַשִׁ\"י מְפָרֵשׁ שֶׁבְּתוּלָה פֵּרוּשָׁהּ בְּתוּלָה מִמָּקוֹם בְּתוּלֶיהָ — בְּתוּלִים גּוּפָנִיִּים מַמָּשׁ.", "kp": ["ממקום בתולים"]}]}, {"id": "24:16.2", "ch": 24, "v": 16, "n": 2, "dh": "ואיש לא ידעה", "pasuk_html": "וְהַֽנַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד בְּתוּלָ֕ה <mark>וְאִ֖ישׁ לֹ֣א יְדָעָ֑הּ</mark> וַתֵּ֣רֶד הָעַ֔יְנָה וַתְּמַלֵּ֥א כַדָּ֖הּ וַתָּֽעַל׃", "pasuk_en": "The maiden was very beautiful, a virgin whom no man had known.bvirgin Or “young woman.” She went down to the spring, filled her jar, and came up. ", "rashi_he": "ואיש לא ידעה. שֶׁלֹּא כְּדַרְכָּהּ, לְפִי שֶׁבְּנוֹת הַגּוֹיִם הָיוּ מְשַׁמְּרוֹת מְקוֹם בְּתוּלֵיהֶן וּמַפְקִירוֹת עַצְמָן מִמָּקוֹם אַחֵר, הֵעִיד עַל זוֹ שֶׁנְּקִיָּה מִכֹּל:", "rashi_en": "\"ואיש לא ידעה\" בא לומר שגם שלא כדרכה לא נגע בה איש. בנות הגויים היו שומרות על מקום בתוליהן אבל מפקירות את עצמן בדרך אחרת, והתורה מעידה שרבקה הייתה נקייה מכל זה.", "note": "", "points": [{"q": "אִם כְּבָר נִקְרְאָה בְּתוּלָה, מַדּוּעַ הַפָּסוּק מוֹסִיף 'וְאִישׁ לֹא יְדָעָהּ'?", "options": ["לְלַמֵּד שֶׁהָיְתָה נְקִיָּה גַּם מִתַּשְׁמִישׁ שֶׁלֹּא כְּדַרְכָּהּ — בְּנוֹת הָאֻמּוֹת שָׁמְרוּ עַל בְּתוּלִים מַמָּשׁ אַךְ לֹא עַל שְׁאָר הַהַנְהָגָה", "לְהַדְגִּישׁ שֶׁמֵּעוֹלָם לֹא דִּבְּרָה בְּפְרָטִיּוּת עִם גֶּבֶר", "לְצַיֵּן שֶׁמֵּעוֹלָם לֹא אֵרְסוּ אוֹתָהּ וְלֹא הֻבְטְחָה לְאִישׁ"], "kasha": "הַפָּסוּק כְּבָר אָמַר שֶׁהִיא בְּתוּלָה — מָה מוֹסִיף 'וְאִישׁ לֹא יְדָעָהּ'?", "answer": "בְּנוֹת הָאֻמּוֹת הָיוּ שׁוֹמְרוֹת עַל בְּתוּלֵיהֶן אַךְ מְשַׁמְּשׁוֹת שֶׁלֹּא כְּדַרְכָּן. בִּטּוּי זֶה מְלַמֵּד שֶׁרִבְקָה הָיְתָה נְקִיָּה מִכָּל הַנְהָגָה כָּזוֹ.", "kp": ["שלא כדרכה", "היו משמרות מקום בתוליהן", "ומפקירות עצמן ממקום אחר"]}]}, {"id": "24:17.1", "ch": 24, "v": 17, "n": 1, "dh": "וירץ העבד לקראתה", "pasuk_html": "<mark>וַיָּ֥רׇץ הָעֶ֖בֶד לִקְרָאתָ֑הּ</mark> וַיֹּ֕אמֶר הַגְמִיאִ֥ינִי נָ֛א מְעַט־מַ֖יִם מִכַּדֵּֽךְ׃", "pasuk_en": "The servant ran toward her and said, “Please, let me sip a little water from your jar.” ", "rashi_he": "וירץ העבד לקראתה. לְפִי שֶׁרָאָה שֶׁעָלוּ הַמַּיִם לִקְרָאתָהּ (בראשית רבה):", "rashi_en": "העבד רץ לקראת רבקה כי ראה שהמים בבאר עלו לקראתה.", "note": "", "points": [{"q": "מַדּוּעַ רָץ הָעֶבֶד לִקְרַאת רִבְקָה?", "options": ["הוּא רָאָה שֶׁמֵּי הַבְּאֵר עָלוּ בְּנֵס כְּשֶׁהִתְקָרְבָה", "הוּא רָצָה לִהְיוֹת הָרִאשׁוֹן לְדַבֵּר אִתָּהּ לִפְנֵי שֶׁאֲחֵרִים יַגִּיעוּ", "הוּא נִלְהַב מִפְּנֵי שֶׁהִיא הִתְאִימָה לְתֵאוּר הַגּוּפָנִי שֶׁאַבְרָהָם נָתַן לוֹ"], "kasha": "מָה גָּרַם לָעֶבֶד לָרוּץ אֵלֶיהָ פִּתְאוֹם?", "answer": "הוּא רָץ מִפְּנֵי שֶׁרָאָה אֶת מֵי הַבְּאֵר עוֹלִים לִקְרָאתָהּ כְּשֶׁהִתְקָרְבָה — אוֹת שֶׁל נֵס.", "kp": ["לפי שראה שעלו המים לקראתה"]}]}, {"id": "24:17.2", "ch": 24, "v": 17, "n": 2, "dh": "הגמיאיני נא", "pasuk_html": "וַיָּ֥רׇץ הָעֶ֖בֶד לִקְרָאתָ֑הּ וַיֹּ֕אמֶר <mark>הַגְמִיאִ֥ינִי נָ֛א</mark> מְעַט־מַ֖יִם מִכַּדֵּֽךְ׃", "pasuk_en": "The servant ran toward her and said, “Please, let me sip a little water from your jar.” ", "rashi_he": "הגמיאיני נא. לְשׁוֹן גְּמִיעָה, הומיי\"ר בלע\"ז:", "rashi_en": "\"הגמיאיני\" הוא לשון גמיעה, כלומר לשתות מעט, לגימה.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ הַגְמִיאִינִי?", "options": ["הַשְׁקִינִי מְעַט — תְּנִי לִי לִגְמֹעַ מְעַט מַיִם", "שִׁפְכִי לִי מַיִם בְּנָדִיבוּת", "שַׁאֲבִי לִי מַיִם מִן הַבְּאֵר"], "kasha": "מַה הַמַּשְׁמָעוּת הַמְּדֻיֶּקֶת שֶׁל מִלָּה חֲרִיגָה זוֹ?", "answer": "הַגְמִיאִינִי פֵּרוּשָׁהּ 'תְּנִי לִי לִגְמֹעַ' — הוּא בִּקֵּשׁ רַק כַּמּוּת קְטַנָּה שֶׁל מַיִם.", "kp": ["לשון גמיעה"]}]}, {"id": "24:18.1", "ch": 24, "v": 18, "n": 1, "dh": "ותרד כדה", "pasuk_html": "וַתֹּ֖אמֶר שְׁתֵ֣ה אֲדֹנִ֑י וַתְּמַהֵ֗ר <mark>וַתֹּ֧רֶד כַּדָּ֛הּ</mark> עַל־יָדָ֖הּ וַתַּשְׁקֵֽהוּ׃", "pasuk_en": "“Drink, my lord,” she said, and she quickly lowered her jar upon her hand and let him drink. ", "rashi_he": "ותרד כדה. מֵעַל שִׁכְמָהּ:", "rashi_en": "רבקה הורידה את הכד מעל הכתף שלה כדי להשקות את העבד.", "note": "", "points": [{"q": "אֵיזוֹ פְּעֻלָּה מְתָאֶרֶת וַתֹּרֶד כַּדָּהּ?", "options": ["הִיא הוֹרִידָה/הִנְמִיכָה אֶת כַּדָּהּ מֵעַל כְּתֵפָהּ", "הִיא יָרְדָה לַבְּאֵר עִם כַּדָּהּ", "הִיא הִטְּתָה אֶת הַכַּד כְּדֵי לִשְׁפֹּךְ מַיִם"], "kasha": "מַה הַמַּשְׁמָעוּת הַמְּדֻיֶּקֶת שֶׁל וַתֹּרֶד בְּהֶקְשֵׁר זֶה?", "answer": "הִיא הוֹרִידָה אֶת כַּדָּהּ מֵעַל כְּתֵפָהּ — וַתֹּרֶד כָּאן פֵּרוּשׁוֹ הִנְמִיכָה אוֹתוֹ מִמָּקוֹם שֶׁנְּשָׂאָה אוֹתוֹ.", "kp": ["מעל שכמה"]}]}, {"id": "24:19.1", "ch": 24, "v": 19, "n": 1, "dh": "עד אם כלו", "pasuk_html": "וַתְּכַ֖ל לְהַשְׁקֹת֑וֹ וַתֹּ֗אמֶר גַּ֤ם לִגְמַלֶּ֙יךָ֙ אֶשְׁאָ֔ב <mark>עַ֥ד אִם־כִּלּ֖וּ</mark> לִשְׁתֹּֽת׃", "pasuk_en": "When she had let him drink his fill, she said, “I will also draw for your camels, until they finish drinking.” ", "rashi_he": "עד אם כלו. הֲרֵי אִם מְשַׁמֵּשׁ בִּלְשׁוֹן אֲשֶׁר, אִם כִּלּוּ דַי סִפּוּקוֹן, שֶׁזּוֹ הִיא גְּמַר שְׁתִיָּתָן, כְּשֶׁשָּׁתוּ דֵּי סִפּוּקָן:", "rashi_en": "כאן המילה \"אם\" משמשת במובן \"אשר\". \"כלו\" אין פירושו שהגמלים נגמרו, אלא שגמרו לשתות כמה שהם צריכים, כי זה סוף השתייה.", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ\"י מַסְבִּיר אֶת הַמִּלָּה אִם בְּ'עַד אִם כִּלּוּ לִשְׁתּוֹת'?", "options": ["כָּאן אִם פֵּרוּשָׁהּ אֲשֶׁר ('שֶׁ') — 'עַד שֶׁגָּמְרוּ', וְכִלָּה פֵּרוּשָׁהּ סִיּוּם", "אִם פֵּרוּשָׁהּ 'אִם־' — הִיא הִתְנְתָה תְּנַאי עַל כַּמָּה יִשְׁתּוּ", "אִם הִיא מִלַּת הַדְגָּשָׁה בְּמוּבַן 'בֶּאֱמֶת'"], "kasha": "הַמִּלָּה אִם בְּדֶרֶךְ כְּלָל פֵּרוּשָׁהּ 'אִם' — מַה פֵּרוּשָׁהּ כָּאן?", "answer": "כָּאן אִם בְּמוּבַן שֶׁל אֲשֶׁר ('שֶׁ'). הַמִּשְׁפָּט פֵּרוּשׁוֹ 'עַד שֶׁגָּמְרוּ לִשְׁתּוֹת', וְכִלָּה פֵּרוּשָׁהּ סִיּוּם/גְּמִירָה.", "kp": ["הרי אם משמש בלשון אשר", "שזו היא גמר שתיתן"]}]}, {"id": "24:20.1", "ch": 24, "v": 20, "n": 1, "dh": "ותער", "pasuk_html": "וַתְּמַהֵ֗ר <mark>וַתְּעַ֤ר</mark> כַּדָּהּ֙ אֶל־הַשֹּׁ֔קֶת וַתָּ֥רׇץ ע֛וֹד אֶֽל־הַבְּאֵ֖ר לִשְׁאֹ֑ב וַתִּשְׁאַ֖ב לְכׇל־גְּמַלָּֽיו׃", "pasuk_en": "Quickly emptying her jar into the trough, she ran back to the well to draw, and she drew for all his camels.", "rashi_he": "ותער. לְשׁוֹן נְפִיצָה, וְהַרְבֵּה יֵשׁ בִּלְשׁוֹן מִשְׁנָה הַמְעָרֶה מִכְּלִי אֶל כֶּלִי, וּבַמִּקְרָא יֵשׁ לוֹ דּוֹמֶה אַל תְּעַר נַפְשִׁי (תהילים קמא), אֲשֶׁר הֶעֱרָה לַמָּוֶת נַפְשׁוֹ (ישעיהו נ\"ג):", "rashi_en": "\"ותער\" פירושו שפכה. כך הלשון במשנה \"המערה מכלי אל כלי\", וכך במקרא \"אל תער נפשי\" ו\"אשר הערה למות נפשו\".", "note": "", "points": [{"q": "מַה פֵּרוּשׁ וַתְּעַר?", "options": ["הִיא שָׁפְכָה אֶת תֹּכֶן כַּדָּהּ", "הִיא מִהֲרָה בִּמְהִירוּת אֶל הַשֹּׁקֶת", "הִיא עֵרְבְּבָה אֶת הַמַּיִם בַּשֹּׁקֶת"], "kasha": "מַה הַמַּשְׁמָעוּת הַמְּדֻיֶּקֶת שֶׁל פֹּעַל זֶה?", "answer": "וַתְּעַר פֵּרוּשָׁהּ 'הִיא שָׁפְכָה' — הִיא רוֹקְנָה אֶת כַּדָּהּ לְתוֹךְ הַשֹּׁקֶת.", "kp": ["לשון נפיצה", "המערה מכלי אל כלי"]}]}, {"id": "24:20.2", "ch": 24, "v": 20, "n": 2, "dh": "השקת", "pasuk_html": "וַתְּמַהֵ֗ר וַתְּעַ֤ר כַּדָּהּ֙ אֶל־<mark>הַשֹּׁ֔קֶת</mark> וַתָּ֥רׇץ ע֛וֹד אֶֽל־הַבְּאֵ֖ר לִשְׁאֹ֑ב וַתִּשְׁאַ֖ב לְכׇל־גְּמַלָּֽיו׃", "pasuk_en": "Quickly emptying her jar into the trough, she ran back to the well to draw, and she drew for all his camels.", "rashi_he": "השקת. אֶבֶן חֲלוּלָה שֶׁשּׁוֹתִים בָּה הַגְּמַלִּים:", "rashi_en": "\"השוקת\" היא אבן חלולה שהגמלים שותים ממנה.", "note": "", "points": [{"q": "מַהִי שֹׁקֶת?", "options": ["אֶבֶן חֲלוּלָה שֶׁמִּמֶּנָּה שׁוֹתִים גְּמַלִּים", "דְּלִי עוֹר שֶׁמְּשַׁמֵּשׁ לִשְׁאִיבַת מַיִם מִבְּאֵרוֹת", "אֵבוּס עֵץ לְהַאֲכָלַת בְּהֵמוֹת"], "kasha": "אֵיזֶה חֵפֶץ מְתָאֶרֶת מִלָּה זוֹ?", "answer": "שֹׁקֶת הִיא אֶבֶן חֲלוּלָה שֶׁמְּשַׁמֶּשֶׁת כְּגִגִּית שְׁתִיָּה לַגְּמַלִּים.", "kp": ["אבן חלולה ששותים בה הגמלים"]}]}, {"id": "24:21.1", "ch": 24, "v": 21, "n": 1, "dh": "משתאה (1st)", "pasuk_html": "וְהָאִ֥ישׁ <mark>מִשְׁתָּאֵ֖ה</mark> לָ֑הּ מַחֲרִ֕ישׁ לָדַ֗עַת הַֽהִצְלִ֧יחַ יְהֹוָ֛ה דַּרְכּ֖וֹ אִם־לֹֽא׃", "pasuk_en": "The man, meanwhile, stood gazing at her, silently wondering whether GOD had made his errand successful or not. ", "rashi_he": "משתאה. לְשׁוֹן שְׁאִיָּה, כְּמוֹ שָׁאוּ עָרִים, תִּשָּׁאֶה שְׁמָמָה (שם ו'):", "rashi_en": "\"משתאה\" בא מלשון שאיה, כלומר שממה, כמו \"שאו ערים\" ו\"תשאה שממה\".", "note": "", "points": [{"q": "מַהוּ הַיְסוֹד שֶׁבַּמִּלָּה מִשְׁתָּאֶה?", "options": ["מִלְּשׁוֹן שְׁמָמָה וְתִמָּהוֹן — הַבָּעַת דּוּמִיָּה הֲמוּמָה", "מִלְּשׁוֹן שִׂמְחָה וְהִתְלַהֲבוּת", "מִלְּשׁוֹן חֲשָׁד וּזְהִירוּת"], "kasha": "מַהוּ הַמּוּבָן הָעֲמֹק שֶׁל מִלָּה חֲרִיגָה זוֹ?", "answer": "שֹׁרֶשׁ מִשְׁתָּאֶה נוֹשֵׂא רַעְיוֹן שֶׁל שְׁמָמָה — הַבָּעַת מַצַּב שֶׁל תִּמָּהוֹן שׁוֹתֵק וְהָמוּם.", "kp": ["לשון שאיה", "תשאה שממה"]}]}, {"id": "24:21.2", "ch": 24, "v": 21, "n": 2, "dh": "משתאה (2nd)", "pasuk_html": "וְהָאִ֥ישׁ <mark>מִשְׁתָּאֵ֖ה</mark> לָ֑הּ מַחֲרִ֕ישׁ לָדַ֗עַת הַֽהִצְלִ֧יחַ יְהֹוָ֛ה דַּרְכּ֖וֹ אִם־לֹֽא׃", "pasuk_en": "The man, meanwhile, stood gazing at her, silently wondering whether GOD had made his errand successful or not. ", "rashi_he": "משתאה. מִשְׁתּוֹמֵם וּמִתְבַּהַל עַל שֶׁרָאָה דְבָרוֹ קָרוֹב לְהַצְלִיחַ, אֲבָל אֵינוֹ יוֹדֵעַ אִם מִמִּשְׁפַּחַת אַבְרָהָם הִיא אִם לָאו. וְאַל תִּתְמַהּ בַּת' שֶׁל מִשְׁתָּאֵה, שֶׁאֵין לְךָ תֵּבָה שֶׁתְּחִלַּת יְסוֹדָהּ שִׁי\"ן וּמְדַבֶּרֶת בִּלְשׁוֹן מִתְפַּעֵל שֶׁאֵין תָּי\"ו מַפְרִידָה בֵּין שְׁתֵּי אוֹתִיּוֹת שֶׁל עִקָּר הַיְסוֹד כְּגוֹן מִשְׁתָּאֵה, מִשְׁתּוֹלֵל מִגִּזְרַת שׁוֹלָל, וַיִּשְׁתּוֹמֵם מִגִּזְרַת שְׁמָמָה, וְיִשְׁתַּמֵּר חֻקּוֹת עָמְרִי (מיכה ו') מִגִּזְרַת וַיִּשְׁמֹר, אַף כָּאן מִשְׁתָּאֵה מִגִּזְרַת תִּשָּׁאֶה, וּכְשֵׁם שֶׁאַתָּה מוֹצֵא לְשׁוֹן מְשׁוֹמֵם בְּאָדָם נִבְהָל וְנֶאֱלָם וּבַעַל מַחֲשָׁבוֹת, כְּמוֹ עַל יוֹמוֹ נָשַׁמּוּ אַחֲרֹנִים (איוב י\"ח), שֹׁמּוּ שָׁמַיִם (ירמיהו ב'), אֶשְׁתּוֹמַם כְּשָׁעָה חֲדָא (דניאל ד'), כָּךְ תְּפָרֵשׁ לְשׁוֹן שְׁאִיָּה בְּאָדָם בָּהוּל וּבַעַל מַחֲשָׁבוֹת (וְאֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן שְׁהִיָּה, וְגַבְרָא שָׁהֵי, שׁוֹהֵא וְעוֹמֵד בְּמָקוֹם אֶחָד לִרְאוֹת הַהִצְלִיחַ ה' דַּרְכּוֹ; וְאֵין לְתַרְגֵּם שָׁתֵי, שֶׁהֲרֵי אֵינוֹ לְשׁוֹן שְׁתִיָּה, שֶׁאֵין אָלֶף נוֹפֶלֶת בִּלְשׁוֹן שְׁתִיָּה):", "rashi_en": "העבד היה נדהם ומבולבל, כי ראה שדבריו כמעט התקיימו, אבל עדיין לא ידע אם רבקה ממשפחת אברהם. האות ת' במילה באה בין אותיות השורש כמו בכל מילה שמתחילה בש' בבניין התפעל, ובדיוק כמו שלשון \"שממה\" משמשת לאדם נדהם ושקוע במחשבות, כך גם \"שאיה\". אונקלוס תרגם מלשון השהיה, שהעבד עמד במקום אחד וחיכה לראות אם ה' הצליח את דרכו, ואין לגרוס בתרגום מלשון שתייה.", "note": "", "points": [{"q": "מַדּוּעַ הָיָה הָעֶבֶד מִשְׁתּוֹמֵם וְנָבוֹךְ?", "options": ["הוּא כִּמְעַט הִצְלִיחַ — הִיא הֶרְאֲתָה אֶת כָּל הַסִּימָנִים הַנְּכוֹנִים — אַךְ עֲדַיִן לֹא יָדַע אִם הִיא מִמִּשְׁפַּחַת אַבְרָהָם", "הוּא לֹא יָכֹל לְהַאֲמִין שֶׁנַּעֲרָה אַחַת יְכוֹלָה לְהַשְׁקוֹת עֲשָׂרָה גְּמַלִּים לְבַדָּהּ", "הוּא לֹא הָיָה בָּטוּחַ אִם נֵס הַמַּיִם הָעוֹלִים הוּא אוֹת אֱמֶת מֵה'"], "kasha": "מָה גָּרַם לְמַצַּב הַתִּמָּהוֹן וְהַמְּבוּכָה שֶׁל הָעֶבֶד?", "answer": "הוּא הִשְׁתּוֹמֵם מִפְּנֵי שֶׁהַכֹּל הֵצְבִּיעַ עַל הַצְלָחָה — הִיא הָיְתָה בַּעֲלַת חֶסֶד וְטוּב לֵב — אַךְ עֲדַיִן הָיָה נָבוֹךְ כִּי לֹא יָדַע עֲדַיִן אִם הִיא מִמִּשְׁפַּחַת אַבְרָהָם.", "kp": ["משתומם ומתבהל", "שראה דברו קרוב להצליח", "אבל אינו יודע אם ממשפחת אברהם"]}]}, {"id": "24:21.3", "ch": 24, "v": 21, "n": 3, "dh": "משתאה לה", "pasuk_html": "וְהָאִ֥ישׁ <mark>מִשְׁתָּאֵ֖ה לָ֑הּ</mark> מַחֲרִ֕ישׁ לָדַ֗עַת הַֽהִצְלִ֧יחַ יְהֹוָ֛ה דַּרְכּ֖וֹ אִם־לֹֽא׃", "pasuk_en": "The man, meanwhile, stood gazing at her, silently wondering whether GOD had made his errand successful or not. ", "rashi_he": "משתאה לה. מִשְׁתּוֹמֵם עָלֶיהָ, כְּמוֹ אִמְרִי לִי אָחִי הוּא (בראשית כ׳:י״ג) וּכְמוֹ וַיִּשְׁאֲלוּ אַנְשֵׁי הַמָּקוֹם לְאִשְׁתּוֹ (שם כ\"ו):", "rashi_en": "\"משתאה לה\" פירושו שהעבד היה נדהם עליה. האות ל' כאן פירושה \"על\", כמו \"אמרי לי אחי הוא\", שפירושו אמרי עליי.", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ\"י מַסְבִּיר אֶת הַלָּמֶ\"ד בְּ'לָהּ'?", "options": ["הַלָּמֶ\"ד פֵּרוּשָׁהּ 'עַל אוֹדוֹת' — הוּא תָּמַהּ עַל אוֹדוֹתֶיהָ", "הַלָּמֶ\"ד פֵּרוּשָׁהּ 'בִּשְׁבִיל' — הוּא חִכָּה שֶׁתְּסַיֵּם", "הַלָּמֶ\"ד פֵּרוּשָׁהּ 'אֶל' — הוּא הִבִּיט אֵלֶיהָ"], "kasha": "מַה פֵּרוּשׁ מִלַּת הַיַּחַס לָמֶ\"ד בְּבִטּוּי זֶה?", "answer": "הַלָּמֶ\"ד פֵּרוּשָׁהּ 'עַל אוֹדוֹת' — הוּא תָּמַהּ עַל אוֹדוֹתֶיהָ, מְנַסֶּה לְהָבִין אֶת זֶהוּתָהּ.", "kp": ["משתומם עליה"]}]}, {"id": "24:22.1", "ch": 24, "v": 22, "n": 1, "dh": "בקע", "pasuk_html": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלּ֤וּ הַגְּמַלִּים֙ לִשְׁתּ֔וֹת וַיִּקַּ֤ח הָאִישׁ֙ נֶ֣זֶם זָהָ֔ב <mark>בֶּ֖קַע</mark> מִשְׁקָל֑וֹ וּשְׁנֵ֤י צְמִידִים֙ עַל־יָדֶ֔יהָ עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽם׃", "pasuk_en": "When the camels had finished drinking, the man took a gold nose-ring weighing a half-shekel,chalf-shekel Heb. beqaʻ. and two gold bands for her arms, ten shekels in weight. ", "rashi_he": "בקע. רֶמֶז לְשִׁקְלֵי יִשְׂרָאֵל בֶּקַע לַגֻּלְגֹּלֶת:", "rashi_en": "הנזם במשקל בקע הוא רמז לשקלים שבני ישראל נתנו, בקע לכל אדם.", "note": "", "points": [{"q": "מָה מְסַמֵּל נֶזֶם הַזָּהָב שֶׁמִּשְׁקָלוֹ בֶּקַע (חֲצִי שֶׁקֶל)?", "options": ["מַחֲצִית הַשֶּׁקֶל שֶׁכָּל יִשְׂרְאֵלִי יִתְרֹם לַמִּשְׁכָּן", "חֲצִי מָנַת הַמָּן שֶׁכָּל אָדָם אָסַף בְּכָל יוֹם", "הָרַעְיוֹן שֶׁאִישׁ וְאִשָּׁה הֵם שְׁנֵי חֲצָאִים שֶׁל שָׁלֵם אֶחָד"], "kasha": "מַדּוּעַ דַּוְקָא מִשְׁקַל חֲצִי שֶׁקֶל לַנֶּזֶם?", "answer": "הַבֶּקַע (חֲצִי הַשֶּׁקֶל) הוּא סֵמֶל לִתְרוּמַת מַחֲצִית הַשֶּׁקֶל שֶׁכָּל יִשְׂרְאֵלִי עָתִיד לִתְרֹם.", "kp": ["רמז לשקלי ישראל", "בקע לגלגלת"]}]}, {"id": "24:22.2", "ch": 24, "v": 22, "n": 2, "dh": "ושני צמידים", "pasuk_html": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלּ֤וּ הַגְּמַלִּים֙ לִשְׁתּ֔וֹת וַיִּקַּ֤ח הָאִישׁ֙ נֶ֣זֶם זָהָ֔ב בֶּ֖קַע מִשְׁקָל֑וֹ <mark>וּשְׁנֵ֤י צְמִידִים֙</mark> עַל־יָדֶ֔יהָ עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽם׃", "pasuk_en": "When the camels had finished drinking, the man took a gold nose-ring weighing a half-shekel,chalf-shekel Heb. beqaʻ. and two gold bands for her arms, ten shekels in weight. ", "rashi_he": "ושני צמידים. רֶמֶז לִשְׁנֵי לוּחוֹת מְצֻמָּדוֹת:", "rashi_en": "שני הצמידים הם רמז לשני לוחות הברית שהיו צמודים זה לזה.", "note": "", "points": [{"q": "מָה מְסַמְּלִים שְׁנֵי הַצְּמִידִים?", "options": ["שְׁנֵי לוּחוֹת הַבְּרִית, הַמְּחֻבָּרִים זֶה לְזֶה", "שְׁתֵּי הַבְּרִיתוֹת שֶׁכָּרַת ה' עִם אַבְרָהָם", "שְׁתֵּי נְשׁוֹת יַעֲקֹב — רָחֵל וְלֵאָה"], "kasha": "מַדּוּעַ דַּוְקָא שְׁנֵי צְמִידִים?", "answer": "שְׁנֵי הַצְּמִידִים מְסַמְּלִים אֶת שְׁנֵי לוּחוֹת הַבְּרִית שֶׁהָיוּ מְזֻוָּגִים זֶה עִם זֶה.", "kp": ["רמז לשני לוחות מצמדות"]}]}, {"id": "24:22.3", "ch": 24, "v": 22, "n": 3, "dh": "עשרה זהב משקלם", "pasuk_html": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלּ֤וּ הַגְּמַלִּים֙ לִשְׁתּ֔וֹת וַיִּקַּ֤ח הָאִישׁ֙ נֶ֣זֶם זָהָ֔ב בֶּ֖קַע מִשְׁקָל֑וֹ וּשְׁנֵ֤י צְמִידִים֙ עַל־יָדֶ֔יהָ <mark>עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽם׃</mark>", "pasuk_en": "When the camels had finished drinking, the man took a gold nose-ring weighing a half-shekel,chalf-shekel Heb. beqaʻ. and two gold bands for her arms, ten shekels in weight. ", "rashi_he": "עשרה זהב משקלם. רֶמֶז לַעֲשֶׂרֶת הַדִּבְּרוֹת שֶׁבָּהֶן:", "rashi_en": "המשקל של עשרה זהב הוא רמז לעשרת הדברות שהיו כתובים על הלוחות.", "note": "", "points": [{"q": "מָה מְסַמְּלִים עֲשָׂרָה זָהָב מִשְׁקָלָם?", "options": ["עֲשֶׂרֶת הַדִּבְּרוֹת שֶׁנִּכְתְּבוּ עַל הַלּוּחוֹת", "עֲשָׂרָה דּוֹרוֹת מִנֹּחַ עַד אַבְרָהָם", "עֲשָׂרָה נִסְיוֹנוֹת שֶׁל אַבְרָהָם"], "kasha": "מַדּוּעַ דַּוְקָא עֲשָׂרָה שְׁקָלִים שֶׁל זָהָב?", "answer": "עֲשָׂרָה שִׁקְלֵי הַזָּהָב מְסַמְּלִים אֶת עֲשֶׂרֶת הַדִּבְּרוֹת שֶׁנֶּחְקְקוּ עַל הַלּוּחוֹת.", "kp": ["רמז לעשרת הדברות שבהן"]}]}, {"id": "24:23.1", "ch": 24, "v": 23, "n": 1, "dh": "ויאמר בת מי את", "pasuk_html": "<mark>וַיֹּ֙אמֶר֙ בַּת־מִ֣י אַ֔תְּ</mark> הַגִּ֥ידִי נָ֖א לִ֑י הֲיֵ֧שׁ בֵּית־אָבִ֛יךְ מָק֥וֹם לָ֖נוּ לָלִֽין׃", "pasuk_en": "“Pray tell me,” he said, “whose daughter are you? Is there room in your father’s house for us to spend the night?” ", "rashi_he": "ויאמר בת מי את. לְאַחַר שֶׁנָּתַן לָהּ שְׁאָלָהּ, לְפִי שֶׁהָיָה בָּטוּחַ בִּזְכוּתוֹ שֶׁל אַבְרָהָם שֶׁהִצְלִיחַ הַקָּבָּ\"ה דַּרְכּוֹ:", "rashi_en": "העבד שאל את רבקה של מי היא בת רק אחרי שכבר נתן לה את המתנות, כי היה בטוח שבזכות אברהם ה' הצליח את דרכו.", "note": "", "points": [{"q": "מַדּוּעַ שָׁאַל הָעֶבֶד אֶת זֶהוּתָהּ רַק אַחֲרֵי שֶׁכְּבָר נָתַן לָהּ אֶת הַמַּתָּנוֹת הַיְקָרוֹת?", "options": ["הוּא בָּטַח שֶׁזְּכוּתוֹ שֶׁל אַבְרָהָם תַּבְטִיחַ אֶת הַצְלָחַת הַמַּסָּע", "הוּא שָׁכַח לִשְׁאֹל מֵרֹב הִתְלַהֲבוּתוֹ כְּשֶׁהַמַּיִם עָלוּ", "הָיָה נָהוּג לָתֵת מַתָּנוֹת לִפְנֵי שֶׁשּׁוֹאֲלִים שְׁאֵלוֹת אִישִׁיּוֹת"], "kasha": "הֲלֹא הָיָה עַל הָעֶבֶד לְוַדֵּא אֶת זֶהוּתָהּ לִפְנֵי מַתַּן הַמַּתָּנוֹת?", "answer": "הוּא שָׁאַל רַק אַחֲרֵי מַתַּן הַמַּתָּנוֹת מִפְּנֵי שֶׁבָּטַח שֶׁזְּכוּתוֹ שֶׁל אַבְרָהָם הִצְלִיחָה אֶת הַמַּסָּע — הַסִּימָנִים הָיוּ בְּרוּרִים דַּיָּם.", "kp": ["לפי שהיה בטוח בזכותו של אברהם"]}]}, {"id": "24:23.2", "ch": 24, "v": 23, "n": 2, "dh": "ללין", "pasuk_html": "וַיֹּ֙אמֶר֙ בַּת־מִ֣י אַ֔תְּ הַגִּ֥ידִי נָ֖א לִ֑י הֲיֵ֧שׁ בֵּית־אָבִ֛יךְ מָק֥וֹם לָ֖נוּ <mark>לָלִֽין׃</mark>", "pasuk_en": "“Pray tell me,” he said, “whose daughter are you? Is there room in your father’s house for us to spend the night?” ", "rashi_he": "ללין. לִינָה אַחַת, לִין שֵׁם דָּבָר; וְהִיא אָמְרָה לָלוּן – כַּמָּה לִינוֹת:", "rashi_en": "העבד ביקש \"ללין\", כלומר מקום ללינה אחת, כי \"לין\" הוא שם דבר. אבל רבקה ענתה \"ללון\", כלומר מקום לכמה לילות.", "note": "", "points": [{"q": "מַה הַהֶבְדֵּל בֵּין מִלַּת הָעֶבֶד לָלִין לְבֵין תְּשׁוּבַת רִבְקָה לָלוּן?", "options": ["לָלִין (שֵׁם) פֵּרוּשָׁהּ לִינַת לַיְלָה אֶחָד, אֲבָל לָלוּן (פֹּעַל) פֵּרוּשָׁהּ שְׁהִיָּה שֶׁל לֵילוֹת רַבִּים", "לָלִין הִיא בַּקָּשָׁה רִשְׁמִית וְלָלוּן הִיא הַסְכָּמָה בִּלְתִּי רִשְׁמִית", "לָלִין פֵּרוּשָׁהּ לִינָה לִבְנֵי אָדָם וְלָלוּן פֵּרוּשָׁהּ מַחְסֶה גַּם לִבְהֵמוֹת"], "kasha": "מַדּוּעַ הָעֶבֶד מִשְׁתַּמֵּשׁ בַּמִּלָּה לָלִין אֲבָל רִבְקָה עוֹנָה בַּמִּלָּה לָלוּן?", "answer": "לָלִין שֶׁל הָעֶבֶד הוּא שֵׁם בְּמוּבַן לִינַת לַיְלָה אֶחָד — הוּא בִּקֵּשׁ בִּצְנִיעוּת. אֲבָל רִבְקָה עָנְתָה בְּנָדִיבוּת עִם לָלוּן, פֹּעַל שֶׁמַּשְׁמָעוּתוֹ שְׁהִיָּה שֶׁל לֵילוֹת רַבִּים.", "kp": ["לינה אחת", "והיא אמרה ללון", "כמה לינות"]}]}, {"id": "24:24.1", "ch": 24, "v": 24, "n": 1, "dh": "בת בתואל", "pasuk_html": "וַתֹּ֣אמֶר אֵלָ֔יו <mark>בַּת־בְּתוּאֵ֖ל</mark> אָנֹ֑כִי בֶּן־מִלְכָּ֕ה אֲשֶׁ֥ר יָלְדָ֖ה לְנָחֽוֹר׃", "pasuk_en": "She replied, “I am the daughter of Bethuel the son of Milcah, whom she bore to Nahor.” ", "rashi_he": "בת בתואל. הֱשִׁיבַתּוּ עַל רִאשׁוֹן רִאשׁוֹן וְעַל אַחֲרוֹן אַחֲרוֹן:", "rashi_en": "רבקה ענתה לאליעזר לפי סדר השאלות: קודם ענתה על השאלה הראשונה (בת מי את), ואחר כך על השאלה האחרונה (היש מקום ללון).", "note": "", "points": [{"q": "מָה מְצַיֵּן רַשִׁ\"י לְגַבֵּי סֵדֶר תְּשׁוּבַת רִבְקָה?", "options": ["הִיא עָנְתָה עַל שְׁאֵלָתוֹ הָרִאשׁוֹנָה רִאשׁוֹנָה וְעַל הָאַחֲרוֹנָה אַחֲרוֹנָה — בְּסֵדֶר מְסֻ
