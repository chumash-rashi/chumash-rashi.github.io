</head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-soft:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100dvh;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:4px;height:100%}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.top{display:contents}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
h1 span{display:none}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.count b{color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:none}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-heb);font-size:22px;line-height:1.55;direction:rtl;text-align:right}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{display:none}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:6px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:8px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:18px;line-height:1.45;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:center;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-body);font-size:17px;line-height:1.4;width:100%;direction:rtl}
.opt .k{flex:none;font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-soft)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.row{display:flex;flex-direction:column;gap:2px}
.row .t{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);direction:rtl}
.row p{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:14px;line-height:1.6;direction:rtl;text-align:right}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface);font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line);font-size:14px}
.hint{font-size:11px;color:var(--muted);text-align:center;flex-shrink:0}
.verdict{font-weight:600;font-size:16px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:20px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* taamim: Frank Ruhl lacks cantillation glyphs, so those letters fell back to another font */
.pasuk{font-family:"Noto Serif Hebrew",var(--f-heb)}
/* pasuk panel: visually separate the verse from the question */
.pasuk{background:var(--accent-soft);border-inline-start:5px solid var(--accent);border-radius:10px;padding:calc(var(--s,1)*6px) calc(var(--s,1)*12px)}
.point{border-top:1px solid var(--line);padding-top:calc(var(--s,1)*8px)}
/* fit layout: only pasuk + question + options in the card; fine print lives in the footer */
.wrap{max-width:min(1500px,100%)}
header .top,.tools,.ref,.dh{display:none}
.card{gap:calc(var(--s,1)*8px)}
.pasuk{font-size:calc(var(--s,1)*22px)}
.q{font-size:calc(var(--s,1)*18px)}
.opt{font-size:calc(var(--s,1)*17px);padding:calc(var(--s,1)*7px) calc(var(--s,1)*10px)}
.opt .k{width:calc(var(--s,1)*20px);height:calc(var(--s,1)*20px);font-size:calc(var(--s,1)*11px)}
.row p{font-size:15px}
.verdict{font-size:15px}
.point{gap:calc(var(--s,1)*10px)}
.reveal{gap:4px}
.reveal[aria-hidden]{max-height:50px;overflow:hidden}
.nav .btn{padding:4px 12px;font-size:13px}
@media (max-width:460px){.pasuk{font-size:calc(var(--s,1)*22px)}}
.hint{font-size:11px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <h1>רש״י · חיי שרה <span>רש״י על חיי שרה</span></h1>
      <div class="count" id="count"></div>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="tools">
      <label for="jump" class="count">עבור אל</label>
      <select id="jump"></select>
      <button class="ghost" id="nextUnanswered" type="button">הבא ללא מענה</button>
      <span id="resetZone"><button class="ghost" id="reset" type="button">התחל מחדש</button></span>
    </div>
  </header>
  <main id="main"></main>
  <div class="hint">מקשים: 1-3 לתשובה · Enter להבא · ← / → לניווט</div>
</div>

<script>
const DATA = [{"id": "23:1.1", "ch": 23, "v": 1, "n": 1, "dh": "ויהיו חיי שרה מאה שנה ועשרים שנה ושבע שנים", "pasuk_html": "<mark>וַיִּהְיוּ֙ חַיֵּ֣י שָׂרָ֔ה מֵאָ֥ה שָׁנָ֛ה וְעֶשְׂרִ֥ים שָׁנָ֖ה וְשֶׁ֣בַע שָׁנִ֑ים</mark> שְׁנֵ֖י חַיֵּ֥י שָׂרָֽה׃", "pasuk_en": "וַיִּהְיוּ חַיֵּי שָׂרָה מֵאָה שָׁנָה וְעֶשְׂרִים שָׁנָה וְשֶׁבַע שָׁנִים שְׁנֵי חַיֵּי שָׂרָה", "rashi_he": "ויהיו חיי שרה מאה שנה ועשרים שנה ושבע שנים. לְכָךְ נִכְתַּב שָׁנָה בְּכָל כְּלָל וּכְלָל, לוֹמַר לְךָ שֶׁכָּל אֶחָד נִדְרָשׁ לְעַצְמוֹ, בַּת ק' כְּבַת כ' לְחֵטְא, מַה בַּת כ' לֹא חָטְאָה, שֶׁהֲרֵי אֵינָהּ בַּת עֳנָשִׁין, אַף בַּת ק' בְּלֹא חֵטְא, וּבַת כ' כְּבַת ז' לְיֹפִי:", "rashi_en": "ויהיו חיי שרה מאה שנה ועשרים שנה ושבע שנים AND THE LIFE OF SARAH WAS 127 YEARS (literally, 100 years, 20 years and 7 years) — The reason the word שנה is written at every term is to tell you that each term must be explained by itself as a complete number: at the age of one hundred she was as a woman of twenty as regards sin — for just as at the age of twenty one may regard her as having never sinned, since she had not then reached the age when she was subject to punishment, so, too, when she was one hundred years old she was sinless — and when she was twenty she was as beautiful as when she was seven (Genesis Rabbah 58:1).", "note": "", "points": [{"q": "מַדּוּעַ הַתּוֹרָה כּוֹתֶבֶת 'שָׁנִים' אַחֲרֵי כָּל קְבוּצַת מִסְפָּרִים (מֵאָה, עֶשְׂרִים, שֶׁבַע)?", "options": ["לְלַמֵּד שֶׁכָּל אַחַת נִדְרֶשֶׁת בִּפְנֵי עַצְמָהּ: בַּת מֵאָה כְּבַת עֶשְׂרִים (לְלֹא חֵטְא), בַּת עֶשְׂרִים כְּבַת שֶׁבַע (לְיֹפִי)", "לְהַדְגִּישׁ שֶׁשָּׂרָה חָיְתָה חַיִּים אֲרֻכִּים מְאוֹד", "לְהַתְאִים לְסִגְנוֹן תֵּאוּרֵי גִּיל אֲחֵרִים בַּתּוֹרָה"], "kasha": "מַדּוּעַ הַמִּלָּה 'שָׁנִים' חוֹזֶרֶת בִּיתוּר אַחֲרֵי כָּל מִסְפָּר?", "answer": "כָּל קְבוּצָה הִיא יְחִידַת פֵּרוּשׁ בִּפְנֵי עַצְמָהּ: בַּת מֵאָה הָיְתָה כְּבַת עֶשְׂרִים לְעִנְיַן חֵטְא, וּבַת עֶשְׂרִים הָיְתָה כְּבַת שֶׁבַע לְעִנְיַן יֹפִי."}]}, {"id": "23:1.2", "ch": 23, "v": 1, "n": 2, "dh": "שני חיי שרה", "pasuk_html": "וַיִּהְיוּ֙ חַיֵּ֣י שָׂרָ֔ה מֵאָ֥ה שָׁנָ֛ה וְעֶשְׂרִ֥ים שָׁנָ֖ה וְשֶׁ֣בַע שָׁנִ֑ים <mark>שְׁנֵ֖י חַיֵּ֥י שָׂרָֽה׃</mark>", "pasuk_en": "שְׁנֵי חַיֵּי שָׂרָה", "rashi_he": "שני חיי שרה. כֻּלָּן שָׁוִין לְטוֹבָה:", "rashi_en": "שני חיי שרה THE YEARS OF SARAH’S LIFE — The word years is repeated and without a number to indicate that they were all equally good. ", "note": "", "points": [{"q": "מָה מְלַמֵּד הַבִּטּוּי 'שְׁנֵי חַיֵּי שָׂרָה' (שֶׁחוֹזֵר בְּלִי מִסְפָּר)?", "options": ["כֻּלָּם שָׁוִים לְטוֹבָה", "הִיא חָיְתָה בְּלִי סֵבֶל כְּלָל", "הִיא לֹא הִזְדַּקְּנָה פִיזִית מֵעוֹלָם"], "kasha": "מַדּוּעַ הַתּוֹרָה מוֹסִיפָה 'שְׁנֵי חַיֵּי שָׂרָה' בַּסּוֹף כְּשֶׁכְּבָר פֵּרְטָה אֶת הַשָּׁנִים?", "answer": "הַבִּטּוּי הַנּוֹסָף מְלַמֵּד שֶׁכָּל שְׁנוֹת חַיֶּיהָ הָיוּ שָׁווֹת לְטוֹבָה."}]}, {"id": "23:2.1", "ch": 23, "v": 2, "n": 1, "dh": "בקרית ארבע", "pasuk_html": "וַתָּ֣מׇת שָׂרָ֗ה <mark>בְּקִרְיַ֥ת אַרְבַּ֛ע</mark> הִ֥וא חֶבְר֖וֹן בְּאֶ֣רֶץ כְּנָ֑עַן וַיָּבֹא֙ אַבְרָהָ֔ם לִסְפֹּ֥ד לְשָׂרָ֖ה וְלִבְכֹּתָֽהּ׃", "pasuk_en": "וַתָּמָת שָׂרָה בְּקִרְיַת אַרְבַּע הִיא חֶבְרוֹן בְּאֶרֶץ כְּנָעַן", "rashi_he": "בקרית ארבע. עַל שֵׁם אַרְבַּע עֲנָקִים שֶׁהָיוּ שָׁם, אֲחִימָן שֵׁשַׁי וְתַלְמַי וַאֲבִיהֶם. דָּ\"אַ עַל שֵׁם אַרְבַּע זוּגוֹת שֶׁנִקְבְּרוּ שָׁם אִישׁ וְאִשְׁתּוֹ, אָדָם וְחַוָּה, אַבְרָהָם וְשָׂרָה, יִצְחָק וְרִבְקָה, יַעֲקֹב וְלֵאָה (בראשית רבה):", "rashi_en": "בקרית ארבע literally, the city of the Four, and it was so called because of the four giants who lived there: Ahiman, Sheshai, Talmai and their father (Numbers 13:22). Another explanation is that it was so called because of the four couples who were buried there, man and wife — Adam and Eve, Abraham and Sarah, Isaac and Rebecca, Jacob and Leah (Genesis Rabbah 58:4).", "note": "", "points": [{"q": "מַדּוּעַ חֶבְרוֹן נִקְרֵאת קִרְיַת אַרְבַּע ('עִיר הָאַרְבַּע')?", "options": ["בִּגְלַל אַרְבָּעָה עֲנָקִים שֶׁיָּשְׁבוּ שָׁם, אוֹ אַרְבָּעָה זוּגוֹת שֶׁנִּקְבְּרוּ שָׁם", "בִּגְלַל שֶׁהָיוּ לָהּ אַרְבָּעָה שְׁעָרִים", "בִּגְלַל שֶׁהָיְתָה מְחֻלֶּקֶת לְאַרְבָּעָה רְבָעִים"], "kasha": "מַה מַּשְׁמָעוּת הַשֵּׁם 'קִרְיַת אַרְבַּע' (עִיר הָאַרְבַּע)?", "answer": "נִקְרֵאת כָּךְ אוֹ בִּגְלַל אַרְבָּעָה עֲנָקִים (אֲחִימָן, שֵׁשַׁי, תַּלְמַי וַאֲבִיהֶם) אוֹ בִּגְלַל אַרְבָּעָה זוּגוֹת שֶׁנִּקְבְּרוּ שָׁם (אָדָם/חַוָּה, אַבְרָהָם/שָׂרָה, יִצְחָק/רִבְקָה, יַעֲקֹב/לֵאָה)."}]}, {"id": "23:2.2", "ch": 23, "v": 2, "n": 2, "dh": "ויבא אברהם", "pasuk_html": "וַתָּ֣מׇת שָׂרָ֗ה בְּקִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּאֶ֣רֶץ כְּנָ֑עַן <mark>וַיָּבֹא֙ אַבְרָהָ֔ם</mark> לִסְפֹּ֥ד לְשָׂרָ֖ה וְלִבְכֹּתָֽהּ׃", "pasuk_en": "וַיָּבֹא אַבְרָהָם לִסְפֹּד לְשָׂרָה וְלִבְכֹּתָהּ", "rashi_he": "ויבא אברהם. מִבְּאֵר שֶׁבַע:", "rashi_en": "ויבא אברהם AND ABRAHAM CAME from Beer-Sheba", "note": "", "points": [{"q": "מֵאַיִן בָּא אַבְרָהָם כְּשֶׁהִגִּיעַ לִסְפֹּד לְשָׂרָה?", "options": ["מִבְּאֵר שָׁבַע", "מֵהַר הַמּוֹרִיָּה", "מֵחָרָן"], "kasha": "מַדּוּעַ הַתּוֹרָה אוֹמֶרֶת שֶׁאַבְרָהָם 'בָּא' — מֵאַיִן הוּא בָּא?", "answer": "הוּא בָּא מִבְּאֵר שָׁבַע."}]}, {"id": "23:2.3", "ch": 23, "v": 2, "n": 3, "dh": "לספוד לשרה ולבכותה", "pasuk_html": "וַתָּ֣מׇת שָׂרָ֗ה בְּקִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּאֶ֣רֶץ כְּנָ֑עַן וַיָּבֹא֙ אַבְרָהָ֔ם <mark>לִסְפֹּ֥ד לְשָׂרָ֖ה וְלִבְכֹּתָֽהּ׃</mark>", "pasuk_en": "לִסְפֹּד לְשָׂרָה וְלִבְכֹּתָהּ", "rashi_he": "לספוד לשרה ולבכתה. וְנִסְמְכָה מִיתַת שָׂרָה לַעֲקֵדַת יִצְחָק לְפִי שֶׁעַל יְדֵי בְּשׂוֹרַת הָעֲקֵדָה, שֶׁנִּזְדַּמֵּן בְּנָהּ לִשְׁחִיטָה וְכִמְעַט שֶׁלֹּא נִשְׁחַט, פָּרְחָה נִשְׁמָתָהּ מִמֶּנָּה וּמֵתָה:", "rashi_en": "לספוד לשרה ולבכותה TO BEWAIL SARAH AND TO WEEP FOR HER — The narrative of the death of Sarah follows immediately on that of the Binding of Isaac, because through the announcement of the Binding — that her son had been made ready for sacrifice and had almost been sacrificed — she received a great shock (literally, her soul flew from her) and she died (Pirkei DeRabbi Eliezer 32). ", "note": "", "points": [{"q": "מַדּוּעַ מוֹת שָׂרָה מוּצָג מִיָּד אַחֲרֵי עֲקֵדַת יִצְחָק?", "options": ["הַבְּשׂוֹרָה שֶׁבְּנָהּ כִּמְעַט נִשְׁחַט הִלְמָה אוֹתָהּ וְנַפְשָׁהּ יָצְאָה", "לְהַרְאוֹת שֶׁאַבְרָהָם הִתְאַבֵּל מִיָּד אַחֲרֵי הָעֲקֵדָה", "בִּגְלַל שֶׁשְּׁנֵי הַמְּאוֹרָעוֹת קָרוּ בְּאוֹתָהּ שָׁנָה"], "kasha": "מַדּוּעַ הַתּוֹרָה סוֹמֶכֶת מוֹת שָׂרָה לַעֲקֵדַת יִצְחָק?", "answer": "כְּשֶׁשָּׂרָה שָׁמְעָה אֶת הַבְּשׂוֹרָה שֶׁבְּנָהּ נֶעֱקַד עַל הַמִּזְבֵּחַ וְכִמְעַט נִשְׁחַט, הַהֶלֶם גָּרַם לְנַפְשָׁהּ לָצֵאת."}]}, {"id": "23:4.1", "ch": 23, "v": 4, "n": 1, "dh": "גר ותושב אנכי עמכם", "pasuk_html": "<mark>גֵּר־וְתוֹשָׁ֥ב אָנֹכִ֖י עִמָּכֶ֑ם</mark> תְּנ֨וּ לִ֤י אֲחֻזַּת־קֶ֙בֶר֙ עִמָּכֶ֔ם וְאֶקְבְּרָ֥ה מֵתִ֖י מִלְּפָנָֽי׃", "pasuk_en": "גֵּר וְתוֹשָׁב אָנֹכִי עִמָּכֶם תְּנוּ לִי אֲחֻזַּת קֶבֶר עִמָּכֶם וְאֶקְבְּרָה מֵתִי מִלְּפָנָי", "rashi_he": "גר ותושב אנכי עמכם. גֵּר מֵאֶרֶץ אַחֶרֶת וְנִתְיַשַּׁבְתִּי עִמָּכֶם. וּמִדְרַשׁ אַגָּדָה אִם תִּרְצוּ הֲרֵינִי גֵּר, וְאִם לָאו אֶהְיֶה תּוֹשָׁב וְאֶטְּלֶנָּה מִן הַדִּין, שֶׁאָמַר לִי הַקָּבָּ\"ה לְזַרְעֲךָ אֶתֵּן אֶת הָאָרֶץ הַזֹּאת:", "rashi_en": "גר ותושב אנכי עמכם I AM A STRANGER AND A SETTLER WITH YOU — A stranger having come from another land, but I have settled down amongst you. A Midrashic explanation is: if you agree to sell me the land then I will regard myself as a stranger and will pay for it, but if not, I shall claim it as a settler and will take it as my legal right, because the Holy One, blessed be He, said to me, (12:7) “Unto thy seed I give this land\" (Genesis Rabbah 58:6).", "note": "", "points": [{"q": "מַהוּ הַמַּשְׁמָעוּת הַכְּפוּלָה שֶׁל אַבְרָהָם הַקּוֹרֵא לְעַצְמוֹ 'גֵּר וְתוֹשָׁב'?", "options": ["אִם תִּמְכְּרוּ בְּרָצוֹן, אֲנִי גֵּר שֶׁיְּשַׁלֵּם; אִם לֹא, אֶתְבַּע כְּתוֹשָׁב בְּזְכוּת אֱלֹהִית", "הוּא הָיָה גַּם חָדָשׁ וְגַם תּוֹשָׁב וָתִיק בָּאֵזוֹר", "הוּא הִרְגִּישׁ כְּזָר מִבְּחִינָה רוּחָנִית אַךְ כְּבֵן בַּיִת מִבְּחִינָה גוּפָנִית"], "kasha": "מַדּוּעַ אַבְרָהָם מְתָאֵר עַצְמוֹ בִּשְׁנֵי מֻשָּׂגִים סוֹתְרִים — גֵּר וְגַם תוֹשָׁב?", "answer": "אִם תַּסְכִּימוּ לִמְכֹּר, אֲנִי גֵּר וַאֲשַׁלֵּם. אִם לֹא, אֶקָּחֶנָּה כְּתוֹשָׁב מִדִּין, שֶׁהֲרֵי הַקָּדוֹשׁ בָּרוּךְ הוּא הִבְטִיחַ לִי אֶת הָאָרֶץ הַזֹּאת."}]}, {"id": "23:4.2", "ch": 23, "v": 4, "n": 2, "dh": "אחזת קבר", "pasuk_html": "גֵּר־וְתוֹשָׁ֥ב אָנֹכִ֖י עִמָּכֶ֑ם תְּנ֨וּ לִ֤י <mark>אֲחֻזַּת־קֶ֙בֶר֙</mark> עִמָּכֶ֔ם וְאֶקְבְּרָ֥ה מֵתִ֖י מִלְּפָנָֽי׃", "pasuk_en": "תְּנוּ לִי אֲחֻזַּת קֶבֶר עִמָּכֶם", "rashi_he": "אחוזת קבר. אֲחֻזַּת קַרְקַע לְבֵית הַקְּבָרוֹת:", "rashi_en": "אחזת קבר A POSSESSION OF A BURYING PLACE — means possession of land to serve as a burying place. ", "note": "", "points": [{"q": "מַה פֵּרוּשׁ 'אֲחֻזַּת קֶבֶר'?", "options": ["אֲחִיזַת קַרְקַע שֶׁתְּשַׁמֵּשׁ כִּמְקוֹם קְבוּרָה", "מָקוֹם מְנוּחָה זְמַנִּי לַמֵּתִים", "נַחֲלַת מִשְׁפָּחָה"], "kasha": "מַהוּ הַמַּשְׁמָעוּת הַמְּדֻיֶּקֶת שֶׁל הַמֻּנָּח 'אֲחֻזַּת קֶבֶר'?", "answer": "פֵּרוּשׁוֹ אֲחִיזַת קַרְקַע הַמְּיֹעֶדֶת לְשַׁמֵּשׁ כִּמְקוֹם קְבוּרָה."}]}, {"id": "23:6.1", "ch": 23, "v": 6, "n": 1, "dh": "לא יכלה", "pasuk_html": "שְׁמָעֵ֣נוּ&thinsp;׀ אֲדֹנִ֗י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּתוֹכֵ֔נוּ בְּמִבְחַ֣ר קְבָרֵ֔ינוּ קְבֹ֖ר אֶת־מֵתֶ֑ךָ אִ֣ישׁ מִמֶּ֔נּוּ אֶת־קִבְר֛וֹ <mark>לֹֽא־יִכְלֶ֥ה</mark> מִמְּךָ֖ מִקְּבֹ֥ר מֵתֶֽךָ׃", "pasuk_en": "אִישׁ מִמֶּנּוּ אֶת קִבְרוֹ לֹא יִכְלֶה מִמְּךָ מִקְּבֹר מֵתֶךָ", "rashi_he": "לא יכלה. לֹא יִמְנַע כְּמוֹ לֹא תִכְלָא רַחֲמֶיךָ (תהילים מ') וּכְמוֹ וַיִּכָּלֵא הַגֶּשֶׁם (בראשית ח'):", "rashi_en": "לא יכלה means will not withhold, just as (Psalms 40:12) “Thou wilt not withhold (תכלא) Thy mercies”, and (Genesis 8:2) “And the rain was restrained (ויכלא).", "note": "", "points": [{"q": "מַה פֵּרוּשׁ 'לֹא יִכְלֶה' בְּהֶקְשֵׁר זֶה?", "options": ["לֹא יִמְנַע, כְּמוֹ בִּתְהִלִּים מ:יב", "לֹא יוּכַל, בִּלְשׁוֹן חֹסֶר יְכֹלֶת", "לֹא יְסַיֵּם אוֹ יַשְׁלִים"], "kasha": "מַה מַּשְׁמָעוּת הַמִּלָּה הַיּוֹצֵאת דֹּפֶן 'יִכְלֶה'?", "answer": "פֵּרוּשָׁהּ 'לֹא יִמְנַע', כְּפִי שֶׁאוֹתוֹ שִׁמּוּשׁ מוֹפִיעַ בִּתְהִלִּים מ:יב."}]}, {"id": "23:8.1", "ch": 23, "v": 8, "n": 1, "dh": "נפשכם", "pasuk_html": "וַיְדַבֵּ֥ר אִתָּ֖ם לֵאמֹ֑ר אִם־יֵ֣שׁ אֶֽת־<mark>נַפְשְׁכֶ֗ם</mark> לִקְבֹּ֤ר אֶת־מֵתִי֙ מִלְּפָנַ֔י שְׁמָע֕וּנִי וּפִגְעוּ־לִ֖י בְּעֶפְר֥וֹן בֶּן־צֹֽחַר׃", "pasuk_en": "אִם יֵשׁ אֶת נַפְשְׁכֶם לִקְבֹּר אֶת מֵתִי מִלְּפָנַי", "rashi_he": "נפשכם. רְצוֹנְכֶם:", "rashi_en": "נפשכם means YOUR WILL.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ 'נַפְשְׁכֶם' כָּאן?", "options": ["רְצוֹנְכֶם אוֹ חֶפְצְכֶם", "נִשְׁמַתְכֶם", "חַיֵּיכֶם"], "kasha": "מַה מַּשְׁמָעוּת הַמִּלָּה 'נֶפֶשׁ' בְּהֶקְשֵׁר זֶה?", "answer": "כָּאן 'נֶפֶשׁ' פֵּרוּשָׁהּ רְצוֹנְכֶם אוֹ חֶפְצְכֶם, וְלֹא נְשָׁמָה."}]}, {"id": "23:8.2", "ch": 23, "v": 8, "n": 2, "dh": "ופגעו לי", "pasuk_html": "וַיְדַבֵּ֥ר אִתָּ֖ם לֵאמֹ֑ר אִם־יֵ֣שׁ אֶֽת־נַפְשְׁכֶ֗ם לִקְבֹּ֤ר אֶת־מֵתִי֙ מִלְּפָנַ֔י שְׁמָע֕וּנִי <mark>וּפִגְעוּ־לִ֖י</mark> בְּעֶפְר֥וֹן בֶּן־צֹֽחַר׃", "pasuk_en": "שִׁמְעוּנִי וּפִגְעוּ לִי בְּעֶפְרוֹן בֶּן צֹחַר", "rashi_he": "ופגעו לי. לְשוֹן בַּקָּשָׁה כְּמוֹ: אַל תִּפְגְּעִי בִּי (רות א'):", "rashi_en": "ופגעו לי — This phrase signifies entreaty, as (Ruth 1:16) “Do not entreat (תפגעי) me”. ", "note": "", "points": [{"q": "מַה מְסַמֶּלֶת הַמִּלָּה 'וּפִגְעוּ'?", "options": ["בַּקָּשָׁה, כְּמוֹ בְּרוּת א:טז 'אַל תִּפְגְּעִי בִי'", "עִמּוּת עוֹיֵן", "פְּגִישָׁה מִקְרִית"], "kasha": "מַה פֵּרוּשׁ שֹׁרֶשׁ פ.ג.ע כָּאן?", "answer": "פֵּרוּשָׁהּ בַּקָּשָׁה אוֹ תַּחֲנוּן, כְּפִי שֶׁמּוֹכָח מֵרוּת א:טז שֶׁבָּהּ אוֹתוֹ שֹׁרֶשׁ מְשַׁמֵּשׁ בְּמַשְׁמָעוּת 'אַל תִּפְגְּעִי בִי'."}]}, {"id": "23:9.1", "ch": 23, "v": 9, "n": 1, "dh": "המכפלה", "pasuk_html": "וְיִתֶּן־לִ֗י אֶת־מְעָרַ֤ת <mark>הַמַּכְפֵּלָה֙</mark> אֲשֶׁר־ל֔וֹ אֲשֶׁ֖ר בִּקְצֵ֣ה שָׂדֵ֑הוּ בְּכֶ֨סֶף מָלֵ֜א יִתְּנֶ֥נָּה לִּ֛י בְּתוֹכְכֶ֖ם לַאֲחֻזַּת־קָֽבֶר׃", "pasuk_en": "וְיִתֶּן לִי אֶת מְעָרַת הַמַּכְפֵּלָה אֲשֶׁר לוֹ אֲשֶׁר בִּקְצֵה שָׂדֵהוּ", "rashi_he": "המכפלה. בַּית וַעֲלִיָּה עַל גַּבָּיו. דָּ\"אַ שֶׁכְּפוּלָה בְּזוּגוֹת (עירובין נ\"ג):", "rashi_en": "המכפלה MACHPELAH (the root, כפל, means double) — it had a lower and an upper cavern. Another explanation of why it was so called is, because it has the characteristic of being doubled on account of the couples who are buried there (see Rashi in verse 2) (Eruvin 53a).", "note": "", "points": [{"q": "מַדּוּעַ הַמְּעָרָה נִקְרֵאת 'מַכְפֵּלָה'?", "options": ["מִשֹּׁרֶשׁ 'כָּפוּל' — הָיוּ בָּהּ שְׁתֵּי קוֹמוֹת, אוֹ שֶׁנִּקְבְּרוּ בָּהּ זוּגוֹת", "בִּגְלַל שֶׁהָיְתָה בְּגִבְעָה כְּפוּלָה", "בִּגְלַל שֶׁאַבְרָהָם שִׁלֵּם מְחִיר כָּפוּל"], "kasha": "מַה מְסַמֵּל הַשֵּׁם 'מַכְפֵּלָה'?", "answer": "הַשֹּׁרֶשׁ פֵּרוּשׁוֹ 'כָּפוּל'. אוֹ שֶׁהָיוּ בָּהּ מְעָרָה תַּחְתּוֹנָה וְעֶלְיוֹנָה, אוֹ שֶׁנִּקְרֵאת כָּךְ עַל שֵׁם הַזּוּגוֹת שֶׁנִּקְבְּרוּ שָׁם."}]}, {"id": "23:9.2", "ch": 23, "v": 9, "n": 2, "dh": "בכסף מלא", "pasuk_html": "וְיִתֶּן־לִ֗י אֶת־מְעָרַ֤ת הַמַּכְפֵּלָה֙ אֲשֶׁר־ל֔וֹ אֲשֶׁ֖ר בִּקְצֵ֣ה שָׂדֵ֑הוּ <mark>בְּכֶ֨סֶף מָלֵ֜א</mark> יִתְּנֶ֥נָּה לִּ֛י בְּתוֹכְכֶ֖ם לַאֲחֻזַּת־קָֽבֶר׃", "pasuk_en": "בְּכֶסֶף מָלֵא יִתְּנֶנָּה לִי בְּתוֹכְכֶם לַאֲחֻזַּת קָבֶר", "rashi_he": "בכסף מלא. שָׁלֵם, כָּל שָׁוְיָהּ; וְכֵן דָּוִד אָמַר לַאֲרַוְנָה בְּכֶסֶף מָלֵא (דברי הימים א כ\"א):", "rashi_en": "בכסף מלא FOR ITS FULL VALUE IN SILVER — מלא means שלם so that the phrase means all that it is worth. Thus, too, did David say to Ornan, (1 Chronicles 21:22) “for full money”. ", "note": "", "points": [{"q": "מַה פֵּרוּשׁ 'כֶּסֶף מָלֵא' (כֶּסֶף שָׁלֵם)?", "options": ["הַסְּכוּם הַמָּלֵא שֶׁהָאָרֶץ שָׁוָה, כְּמוֹ שֶׁדָּוִד אָמַר לְאָרְנָן", "מַטְבְּעוֹת כֶּסֶף מְלֵאוֹת עַד שְׂפַת הַכְּלִי", "סְכוּם מֻפְרָז מֵעַל לְשָׁוְיָהּ שֶׁל הָאָרֶץ"], "kasha": "מַה מַּשְׁמָעוּת 'מָלֵא' בְּנוֹגֵעַ לַכֶּסֶף?", "answer": "'מָלֵא' פֵּרוּשׁוֹ 'שָׁלֵם' — כָּל מַה שֶׁהָאָרֶץ שָׁוָה. דָּוִד הִשְׁתַּמֵּשׁ בְּאוֹתוֹ בִּטּוּי כְּשֶׁקָּנָה מֵאָרְנָן."}]}, {"id": "23:10.1", "ch": 23, "v": 10, "n": 1, "dh": "ועפרון ישב", "pasuk_html": "<mark>וְעֶפְר֥וֹן יֹשֵׁ֖ב</mark> בְּת֣וֹךְ בְּנֵי־חֵ֑ת וַיַּ֩עַן֩ עֶפְר֨וֹן הַחִתִּ֤י אֶת־אַבְרָהָם֙ בְּאׇזְנֵ֣י בְנֵי־חֵ֔ת לְכֹ֛ל בָּאֵ֥י שַֽׁעַר־עִיר֖וֹ לֵאמֹֽר׃", "pasuk_en": "וְעֶפְרוֹן יֹשֵׁב בְּתוֹךְ בְּנֵי חֵת", "rashi_he": "ועפרון ישב. כְּתִיב חָסֵר, אוֹתוֹ הַיּוֹם מִנּוּהוּ שׁוֹטֵר עֲלֵיהֶם; מִפְּנֵי חֲשִׁיבוּתוֹ שֶׁל אַבְרָהָם שֶׁהָיָה צָרִיךְ לוֹ, עָלָה לִגְדֻלָּה:", "rashi_en": "ועפרון ישב The verb is written without a ו so that it may be read ישב he sat, thus indicating that on that very day they had appointed him (Ephron) to be an officer over them. Because of the high standing of Abraham who needed to negotiate with him, he was elevated to a dignified position (so that Abraham whom they esteemed as a great prince might have to negotiate with an equal and not with an inferior person (Genesis Rabbah 58:7). ", "note": "", "points": [{"q": "מַדּוּעַ שֵׁם עֶפְרוֹן כָּתוּב חָסֵר (בְּלִי וָי\"ו) כְּ'יֹשֵׁב'?", "options": ["בְּאוֹתוֹ יוֹם מִנּוּ אוֹתוֹ לְשַׂר, וְנִתְעַלָּה בִּגְלַל שֶׁאַבְרָהָם הָיָה צָרִיךְ לוֹ", "הוּא יָשַׁב בְּדִין כְּמַנְהִיג מְבֻסָּס", "הוּא הָיָה אִישׁ עָנָו שֶׁיָּשַׁב עַל הָאָרֶץ"], "kasha": "מַדּוּעַ 'יֹשֵׁב' כָּתוּב חָסֵר (בְּלִי וָי\"ו)?", "answer": "קוֹרְאִים 'יָשַׁב' (בְּעָבָר), כְּלוֹמַר בְּאוֹתוֹ יוֹם מִנּוּ אֶת עֶפְרוֹן לְשַׂר, וְנִתְעַלָּה בִּגְלַל שֶׁאַבְרָהָם הָיָה נִזְקָק לוֹ."}]}, {"id": "23:10.2", "ch": 23, "v": 10, "n": 2, "dh": "לכל באי שער עירו", "pasuk_html": "וְעֶפְר֥וֹן יֹשֵׁ֖ב בְּת֣וֹךְ בְּנֵי־חֵ֑ת וַיַּ֩עַן֩ עֶפְר֨וֹן הַחִתִּ֤י אֶת־אַבְרָהָם֙ בְּאׇזְנֵ֣י בְנֵי־חֵ֔ת <mark>לְכֹ֛ל בָּאֵ֥י שַֽׁעַר־עִיר֖וֹ</mark> לֵאמֹֽר׃", "pasuk_en": "וַיַּעַן עֶפְרוֹן הַחִתִּי אֶת אַבְרָהָם בְּאָזְנֵי בְנֵי חֵת לְכֹל בָּאֵי שַׁעַר עִירוֹ", "rashi_he": "לכל באי שער עירו. שֶׁכֻּלָּן בָּטְלוּ מִמְּלָאכְתָּן וּבָאוּ לִגְמֹל חֶסֶד לְשָׂרָה:", "rashi_en": "לכל באי שער עירו OF ALL THAT CAME IN AT THE GATE OF HIS CITY — for they all left their work and came to pay their last respect to Sarah (Genesis Rabbah 58:7). ", "note": "", "points": [{"q": "מַדּוּעַ הַתּוֹרָה מַזְכִּירָה 'לְכֹל בָּאֵי שַׁעַר עִירוֹ'?", "options": ["כֻּלָּם עָזְבוּ אֶת מְלַאכְתָּם וּבָאוּ לָחֲלֹק כָּבוֹד אַחֲרוֹן לְשָׂרָה", "הֵם בָּאוּ לְהָעִיד עַל עִסְקָה מִשְׁפָּטִית", "הֵם הִתְכַּנְּסוּ לַאֲסֵפַת עִיר קְבוּעָה"], "kasha": "מַדּוּעַ הַתּוֹרָה מַדְגִּישָׁה שֶׁכָּל אַנְשֵׁי הָעִיר נָכְחוּ?", "answer": "כֻּלָּם עָזְבוּ אֶת עִסּוּקֵיהֶם וּבָאוּ לָחֲלֹק כָּבוֹד אַחֲרוֹן לְשָׂרָה."}]}, {"id": "23:11.1", "ch": 23, "v": 11, "n": 1, "dh": "לא אדני", "pasuk_html": "<mark>לֹֽא־אֲדֹנִ֣י</mark> שְׁמָעֵ֔נִי הַשָּׂדֶה֙ נָתַ֣תִּי לָ֔ךְ וְהַמְּעָרָ֥ה אֲשֶׁר־בּ֖וֹ לְךָ֣ נְתַתִּ֑יהָ לְעֵינֵ֧י בְנֵי־עַמִּ֛י נְתַתִּ֥יהָ לָּ֖ךְ קְבֹ֥ר מֵתֶֽךָ׃", "pasuk_en": "לֹא אֲדֹנִי שְׁמָעֵנִי הַשָּׂדֶה נָתַתִּי לָךְ", "rashi_he": "לא אדני. לֹא תִּקְנֶה אוֹתָהּ בְּדָמִים:", "rashi_en": "לא אדני NAY, MY LORD — You are not to buy it with money.", "note": "", "points": [{"q": "מַה הִתְכַּוֵּן עֶפְרוֹן בְּ'לֹא אֲדֹנִי'?", "options": ["אֵינְךָ צָרִיךְ לִקְנוֹתָהּ בְּכֶסֶף — אֲנִי נוֹתֵן לְךָ אוֹתָהּ", "הוּא סֵרֵב לִמְכֹּר אֶת הַשָּׂדֶה כְּלָל", "הוּא רָצָה שֶׁאַבְרָהָם יַמְשִׁיךְ לְהִתְמַקֵּחַ עַל מְחִיר נָמוּךְ יוֹתֵר"], "kasha": "מַה עֶפְרוֹן מְסָרֵב כְּשֶׁהוּא אוֹמֵר 'לֹא אֲדֹנִי'?", "answer": "הוּא אוֹמֵר: אֵינְךָ צָרִיךְ לִקְנוֹתָהּ בְּכֶסֶף; אֲנִי נוֹתֵן אוֹתָהּ לְךָ."}]}, {"id": "23:11.2", "ch": 23, "v": 11, "n": 2, "dh": "נתתי לך", "pasuk_html": "לֹֽא־אֲדֹנִ֣י שְׁמָעֵ֔נִי הַשָּׂדֶה֙ <mark>נָתַ֣תִּי לָ֔ךְ</mark> וְהַמְּעָרָ֥ה אֲשֶׁר־בּ֖וֹ לְךָ֣ נְתַתִּ֑יהָ לְעֵינֵ֧י בְנֵי־עַמִּ֛י נְתַתִּ֥יהָ לָּ֖ךְ קְבֹ֥ר מֵתֶֽךָ׃", "pasuk_en": "הַשָּׂדֶה נָתַתִּי לָךְ וְהַמְּעָרָה אֲשֶׁר בּוֹ לְךָ נְתַתִּיהָ", "rashi_he": "נתתי לך. הֲרֵי הוּא כְּמוֹ שֶׁנְּתַתִּיהָ לְךָ:", "rashi_en": "נתתי לך I HAVE GIVEN IT TO THEE (a perfect tense) — See, it is as though I have already given it to you. ", "note": "", "points": [{"q": "מַדּוּעַ עֶפְרוֹן מִשְׁתַּמֵּשׁ בְּלָשׁוֹן עָבָר 'נָתַתִּי' (כְּבָר נָתַתִּי)?", "options": ["כְּאִלּוּ כְּבָר נָתַן אוֹתָהּ — הַמַּתָּנָה בְּטוּחָה בְּלִבּוֹ", "הוּא הִבְטִיחַ אֶת הַשָּׂדֶה לְאַבְרָהָם בְּעָבָר", "הוּא כְּבָר הֶעֱבִיר אֶת הַשְּׁטָר"], "kasha": "מַדּוּעַ לְהִשְׁתַּמֵּשׁ בְּלָשׁוֹן עָבָר 'נָתַתִּי' עַל דָּבָר שֶׁטֶּרֶם נַעֲשָׂה?", "answer": "לְשׁוֹן הֶעָבָר מְבַטֶּאֶת וַדָּאוּת: כְּאִלּוּ הַנְּתִינָה כְּבָר הֻשְׁלְמָה."}]}, {"id": "23:13.1", "ch": 23, "v": 13, "n": 1, "dh": "אך אם אתה לו שמעני", "pasuk_html": "וַיְדַבֵּ֨ר אֶל־עֶפְר֜וֹן בְּאׇזְנֵ֤י עַם־הָאָ֙רֶץ֙ לֵאמֹ֔ר <mark>אַ֛ךְ אִם־אַתָּ֥ה ל֖וּ שְׁמָעֵ֑נִי</mark> נָתַ֜תִּי כֶּ֤סֶף הַשָּׂדֶה֙ קַ֣ח מִמֶּ֔נִּי וְאֶקְבְּרָ֥ה אֶת־מֵתִ֖י שָֽׁמָּה׃", "pasuk_en": "אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי נָתַתִּי כֶּסֶף הַשָּׂדֶה קַח מִמֶּנִּי", "rashi_he": "אך אם אתה לו שמעני. אַתָּה אוֹמֵר לִי לִשְׁמֹעַ לְךָ וְלִקַּח בְּחִנָּם, אֲנִי אִי אֶפְשִׁי בְּכָךְ:", "rashi_en": "אך אם אתה לו שמעני BUT IF THOU WOULDST ONLY HEAR ME — You tell me to listen to you (verse 11) and to accept it without payment. I do not desire this: ", "note": "", "points": [{"q": "מָה תְּשׁוּבַת אַבְרָהָם לְהַצָּעַת עֶפְרוֹן לָתֵת בְּחִנָּם?", "options": ["אֵינוֹ רוֹצֶה אֶת הַשָּׂדֶה בְּחִנָּם וּמַתְעַקֵּשׁ לְשַׁלֵּם", "הוּא מְקַבֵּל בִּשְׂמָחָה אַךְ מַצִּיעַ תַּשְׁלוּם סִמְלִי", "הוּא מְבַקֵּשׁ מֵעֶפְרוֹן לְהוֹרִיד אֶת הַמְּחִיר"], "kasha": "מַדּוּעַ אַבְרָהָם אוֹמֵר 'אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי' אַחֲרֵי שֶׁהֻצַּע לוֹ הַשָּׂדֶה בְּחִנָּם?", "answer": "אַבְרָהָם אוֹמֵר: אַתָּה אוֹמֵר לִי לְקַבֵּל בְּלִי תַּשְׁלוּם, אֲבָל אֵינִי רוֹצֶה בְּכָךְ. אָנָּא שְׁמַע לִי בִּמְקוֹם זֶה."}, {"q": "מָה אַבְרָהָם מְבַקֵּשׁ שֶׁעֶפְרוֹן יַעֲשֶׂה?", "options": ["שֶׁיִּשְׁמַע לוֹ וְיְקַבֵּל תַּשְׁלוּם עַל הַשָּׂדֶה", "שֶׁיִּתֵּן לוֹ אָרֶץ נוֹסֶפֶת בַּסְּבִיבָה", "שֶׁיַּרְשֶׁה לוֹ לְשַׁלֵּם בְּתַשְׁלוּמִים"], "kasha": "מָה אַבְרָהָם מְבַקֵּשׁ כְּשֶׁהוּא אוֹמֵר 'אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי'?", "answer": "הוּא מְבַקֵּשׁ שֶׁעֶפְרוֹן יִשְׁמַע וְיַעֲשֶׂה כִּדְבָרָיו — יְקַבֵּל תַּשְׁלוּם מָלֵא עַל הַשָּׂדֶה."}]}, {"id": "23:13.2", "ch": 23, "v": 13, "n": 2, "dh": "אך אם אתה לו שמעני", "pasuk_html": "וַיְדַבֵּ֨ר אֶל־עֶפְר֜וֹן בְּאׇזְנֵ֤י עַם־הָאָ֙רֶץ֙ לֵאמֹ֔ר <mark>אַ֛ךְ אִם־אַתָּ֥ה ל֖וּ שְׁמָעֵ֑נִי</mark> נָתַ֜תִּי כֶּ֤סֶף הַשָּׂדֶה֙ קַ֣ח מִמֶּ֔נִּי וְאֶקְבְּרָ֥ה אֶת־מֵתִ֖י שָֽׁמָּה׃", "pasuk_en": "אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי נָתַתִּי כֶּסֶף הַשָּׂדֶה קַח מִמֶּנִּי", "rashi_he": "אך אם אתה לו שמעני. הַלְוַאי וְתִשְׁמָעֵנִי:", "rashi_en": "BUT IF THOU WOULDST ONLY HEAR ME!—i.e. I only wish that you would listen to me and do as I ask.", "note": "", "points": [{"q": "מָה רַשִׁ\"י אוֹמֵר שֶׁאַבְרָהָם מִתְכַּוֵּן בַּבִּטּוּי 'אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי'?", "options": ["הוּא מְבַטֵּא מִשְׁאָלָה שֶׁעֶפְרוֹן יִשְׁמַע לוֹ וְיַסְכִּים לְבַקָּשָׁתוֹ", "הוּא מַצִּיב לְעֶפְרוֹן תְּנַאי שֶׁחַיָּב לְמַלֵּא לִפְנֵי שֶׁיָּחֵלּוּ מַשָּׂא וּמַתָּן", "הוּא מְפַקְפֵּק בִּיכֹלֶת עֶפְרוֹן לְהָבִין אֶת דְּבָרָיו"], "kasha": "הַבִּטּוּי 'אַךְ אִם אַתָּה' נִרְאֶה מְשֻׁנֶּה דִּקְדּוּקִית וּמְחַיֵּב הַבְהָרָה מַה אַבְרָהָם בֶּאֱמֶת מְבַקֵּשׁ", "answer": "רַשִׁ\"י מְפָרֵשׁ שֶׁאַבְרָהָם מְבַטֵּא מִשְׁאָלָה (הַלְוַאי) — הוּא רוֹצֶה שֶׁעֶפְרוֹן יִשְׁמַע וְיְשַׁתֵּף פְּעֻלָּה עִמּוֹ."}, {"q": "כֵּיצַד רַשִׁ\"י מֵבִין אֶת הַטּוֹן שֶׁל דִּבְרֵי אַבְרָהָם לְעֶפְרוֹן?", "options": ["כְּמִשְׁאָלָה מְקַוָּה אוֹ בִּטּוּי שֶׁל רָצוֹן, וְלֹא כִּדְרִישָׁה אוֹ תְּנַאי", "כְּפְקֻדָּה נוֹקְשָׁה שֶׁעֶפְרוֹן חַיָּב לְצַיֵּת לָהּ מִיָּד", "כְּהֶעָרָה צִינִית הַמְּפַקְפֶּקֶת בְּתְבוּנָתוֹ שֶׁל עֶפְרוֹן"], "kasha": "הַמִּבְנֶה הָעִבְרִי 'אַךְ אִם' אֵינוֹ חַד מַשְׁמָעִי וְנִיתָּן לְקָרְאוֹ בִּמְגוָּנוֹת שׁוֹנוֹת", "answer": "רַשִׁ\"י מְפָרֵשׁ זֹאת כְּמִשְׁאָלָה וְתִקְוָה (הַלְוַאי), לְהַרְאוֹת שֶׁאַבְרָהָם מְבַקֵּשׁ בְּנִמּוּס אֶת שִׁתּוּף הַפְּעֻלָּה שֶׁל עֶפְרוֹן וְלֹא מְצַוֶּה עָלָיו."}]}, {"id": "23:13.3", "ch": 23, "v": 13, "n": 3, "dh": "נתתי", "pasuk_html": "וַיְדַבֵּ֨ר אֶל־עֶפְר֜וֹן בְּאׇזְנֵ֤י עַם־הָאָ֙רֶץ֙ לֵאמֹ֔ר אַ֛ךְ אִם־אַתָּ֥ה ל֖וּ שְׁמָעֵ֑נִי <mark>נָתַ֜תִּי</mark> כֶּ֤סֶף הַשָּׂדֶה֙ קַ֣ח מִמֶּ֔נִּי וְאֶקְבְּרָ֥ה אֶת־מֵתִ֖י שָֽׁמָּה׃", "pasuk_en": "נָתַתִּי כֶּסֶף הַשָּׂדֶה קַח מִמֶּנִּי וְאֶקְבְּרָה אֶת מֵתִי שָׁמָּה", "rashi_he": "נתתי. דני\"ש בלע\"ז, מוּכָן הוּא אֶצְלִי, וְהַלְוַאי נָתַתִּי לְךָ כְּבָר:", "rashi_en": "נתתי I GIVE (perfect with present sense) old French donne; English I give. I have the money ready and I only wish that I had already given it to you.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ 'נָתַתִּי' (כְּבָר נָתַתִּי) שֶׁל אַבְרָהָם?", "options": ["הַכֶּסֶף מוּכָן בְּיָדִי וְהַלְוַאי שֶׁכְּבָר נְתַתִּיו לְךָ", "כְּבָר הִפְקַדְתִּי אֶת הַכֶּסֶף אֵצֶל צַד שְׁלִישִׁי", "נָתַתִּי כֶּסֶף לְעֶפְרוֹן בְּעָבָר"], "kasha": "מַדּוּעַ גַּם אַבְרָהָם מִשְׁתַּמֵּשׁ בְּלָשׁוֹן עָבָר 'נָתַתִּי' עַל כֶּסֶף שֶׁטֶּרֶם נִמְסַר?", "answer": "לְשׁוֹן הֶעָבָר מְבַטֶּאֶת מוּכָנוּת: יֵשׁ בְּיָדִי כֶּסֶף מוּכָן וְהַלְוַאי שֶׁכְּבָר נְתַתִּיו לְךָ."}]}, {"id": "23:15.1", "ch": 23, "v": 15, "n": 1, "dh": "ביני ובינך", "pasuk_html": "אֲדֹנִ֣י שְׁמָעֵ֔נִי אֶ֩רֶץ֩ אַרְבַּ֨ע מֵאֹ֧ת שֶֽׁקֶל־כֶּ֛סֶף <mark>בֵּינִ֥י וּבֵֽינְךָ֖</mark> מַה־הִ֑וא וְאֶת־מֵתְךָ֖ קְבֹֽר׃", "pasuk_en": "אֲדֹנִי שְׁמָעֵנִי אֶרֶץ אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף בֵּינִי וּבֵינְךָ מַה הִוא", "rashi_he": "ביני ובינך. בֵּין שְׁנֵי אוֹהֲבִים כָּמוֹנוּ מַה הִיא חֲשׁוּבָה לִכְלוּם, אֶלָּא הַנַּח אֶת הַמֶּכֶר וְאֶת מֵתְךָ קְבֹר (בראשית רבה):", "rashi_en": "ביני ובינך BETWEEN ME AND THEE — Between two such friends as we are, of what importance is that? Nothing at all! Leave business alone and bury your dead! ", "note": "", "points": [{"q": "מָה כַּוָּנַת עֶפְרוֹן כְּשֶׁאוֹמֵר 'בֵּינִי וּבֵינְךָ מָה הִיא אַרְבַּע מֵאוֹת שֶׁקֶל'?", "options": ["בֵּין יְדִידִים כָּמוֹתֵנוּ, אַרְבַּע מֵאוֹת שֶׁקֶל אֵינָם כְּלוּם — פְּשׁוּט קְבֹר מֵתְךָ", "הוּא רוֹמֵז שֶׁרוֹצֶה יוֹתֵר מֵאַרְבַּע מֵאוֹת שֶׁקֶל", "הוּא מְחַלֵּק אֶת הָעֲלוּת בְּשָׁוֶה עִם אַבְרָהָם"], "kasha": "מַדּוּעַ עֶפְרוֹן מַזְכִּיר אֶת הַסְּכוּם וְאַחַר כָּךְ מְזַלְזֵל בּוֹ?", "answer": "הוּא אוֹמֵר: בֵּין שְׁנֵי יְדִידִים כְּמוֹתֵנוּ, מָה חֲשִׁיבוּתָם שֶׁל אַרְבַּע מֵאוֹת שֶׁקֶל? אֵינָם כְּלוּם! הַנַּח אֶת הָעֵסֶק וּקְבֹר אֶת מֵתְךָ."}]}, {"id": "23:16.1", "ch": 23, "v": 16, "n": 1, "dh": "וישקל אברהם לעפרן", "pasuk_html": "וַיִּשְׁמַ֣ע אַבְרָהָם֮ אֶל־עֶפְרוֹן֒ <mark>וַיִּשְׁקֹ֤ל אַבְרָהָם֙ לְעֶפְרֹ֔ן</mark> אֶת־הַכֶּ֕סֶף אֲשֶׁ֥ר דִּבֶּ֖ר בְּאׇזְנֵ֣י בְנֵי־חֵ֑ת אַרְבַּ֤ע מֵאוֹת֙ שֶׁ֣קֶל כֶּ֔סֶף עֹבֵ֖ר לַסֹּחֵֽר׃", "pasuk_en": "וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן וַיִּשְׁקֹל אַבְרָהָם לְעֶפְרֹן אֶת הַכֶּסֶף", "rashi_he": "וישקל אברהם לעפרן. חָסֵר וָי\"ו; לְפִי שֶׁאָמַר הַרְבֵּה, וַאֲפִלּוּ מְעַט לֹא עָשָׂה (בבא מציעא פ\"ז), שֶׁנָּטַל מִמֶּנוּ שְׁקָלִים גְּדוֹלִים שֶׁהֵן קַנְטָרִין, שֶׁנֶּאֱמַר עֹבֵר לַסֹּחֵר, שֶׁמִּתְקַבְּלִים בְּשֶׁקֶל בְּכָל מָקוֹם (שם ובכורות נ'), וְיֵשׁ מָקוֹם שֶׁשִּׁקְלֵיהֶן גְּדוֹלִים, שֶׁהֵן קַנְטָרִין צנטינא\"רש בלע\"ז:", "rashi_en": "וישקל אברהם לעפרן AND ABRAHAM WEIGHED TO EPHRON [THE SILVER] — The name Ephron is written defectively (without the ו) to indicate that there was something missing in Ephron viz, sincerity — because he promised much but did not do even the very least (Bava Metzia 87a): He took from him big Shekels, viz., centenaria (worth a full 100 smaller units) as it is said, “money current with the merchant” which means, such coins as were everywhere accepted as worth a full Shekel — for there are places where their Shekels are of large size, centenaria; old French Centenars (cf. Ruth R. 7). ", "note": "", "points": [{"q": "מַדּוּעַ שֵׁם עֶפְרוֹן כָּתוּב חָסֵר (בְּלִי וָי\"ו) כְּשֶׁאַבְרָהָם מְשַׁלֵּם?", "options": ["הוּא הִבְטִיחַ הַרְבֵּה אַךְ עָשָׂה מְעַט, וְלָקַח מַטְבְּעוֹת גְּדוֹלוֹת — חָסֵר בּוֹ מַשֶּׁהוּ", "זוֹ קִצּוּר סוֹפְרִים בְּלִי מַשְׁמָעוּת מְיֻחֶדֶת", "לְצַיֵּן שֶׁעֶפְרוֹן תָּרַם חֵלֶק מֵהַמְּחִיר"], "kasha": "מַדּוּעַ פִּתְאוֹם שֵׁם עֶפְרוֹן כָּתוּב בְּלִי הָאוֹת וָי\"ו?", "answer": "הַכְּתִיב הַחָסֵר רוֹמֵז שֶׁחָסֵר מַשֶּׁהוּ בְּעֶפְרוֹן — כֵּנוּתוֹ. הוּא הִבְטִיחַ הַרְבֵּה אַךְ לֹא עָשָׂה אֲפִלּוּ מְעַט, וְלָקַח שְׁקָלִים גְּדוֹלִים וּמְנֻפָּחִים כְּתַשְׁלוּם."}]}, {"id": "23:17.1", "ch": 23, "v": 17, "n": 1, "dh": "ויקם שדה עפרון", "pasuk_html": "<mark>וַיָּ֣קׇם&thinsp;׀ שְׂדֵ֣ה עֶפְר֗וֹן</mark> אֲשֶׁר֙ בַּמַּכְפֵּלָ֔ה אֲשֶׁ֖ר לִפְנֵ֣י מַמְרֵ֑א הַשָּׂדֶה֙ וְהַמְּעָרָ֣ה אֲשֶׁר־בּ֔וֹ וְכׇל־הָעֵץ֙ אֲשֶׁ֣ר בַּשָּׂדֶ֔ה אֲשֶׁ֥ר בְּכׇל־גְּבֻל֖וֹ סָבִֽיב׃", "pasuk_en": "וַיָּקָם שְׂדֵה עֶפְרוֹן אֲשֶׁר בַּמַּכְפֵּלָה אֲשֶׁר לִפְנֵי מַמְרֵא", "rashi_he": "ויקם שדה עפרון. תְּקוּמָה הָיְתָה לוֹ, שֶׁיָּצָא מִיַּד הֶדְיוֹט לְיַד מֶלֶךְ; וּפְשׁוּטוֹ שֶׁל מִקְרָא וַיָּקָם הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ וְכָל הָעֵץ לְאַבְרָהָם לְמִקְנָה וגו':", "rashi_en": "ויקם שדה עפרון AND THE FIELD OF EPHRON WAS MADE SURE (literally, it rose) — It received a rise in importance because it passed from the possession of a commoner (הדיוט an ordinary person) into the possession of a king (Genesis Rabbah 58:8). But the real meaning of the verse is: The field and the cave that was therein and all the trees … became secured to Abraham as a possession etc. (i. e. verse 17 is an incomplete sentence and must be read together with verse 18, thus: ויקם השדה וגו… לאברהם למקנה —The field etc. became secured to Abraham as a possession). ", "note": "", "points": [{"q": "מָה מְצַיֵּן 'וַיָּקָם' (הוּא קָם) לְגַבֵּי הַשָּׂדֶה?", "options": ["הוּא עָלָה בְּמַעֲמָדוֹ מֵרְשׁוּת הֶדְיוֹט לִרְשׁוּת מֶלֶךְ", "הוּא עָלָה בְּגָבְהוֹ הַפִיזִי אַחֲרֵי הַקְּנִיָּה", "מְחִיר הַשָּׂדֶה עָלָה"], "kasha": "מַדּוּעַ הַתּוֹרָה מִשְׁתַּמֶּשֶׁת בַּמִּלָּה 'וַיָּקָם' (קָם/הוּקַם) לַשָּׂדֶה?", "answer": "הַשָּׂדֶה עָלָה בַּחֲשִׁיבוּתוֹ — עָבַר מֵרְשׁוּת הֶדְיוֹט לִרְשׁוּת מֶלֶךְ (אַבְרָהָם)."}]}, {"id": "23:18.1", "ch": 23, "v": 18, "n": 1, "dh": "בכל באי שער עירו", "pasuk_html": "לְאַבְרָהָ֥ם לְמִקְנָ֖ה לְעֵינֵ֣י בְנֵי־חֵ֑ת <mark>בְּכֹ֖ל בָּאֵ֥י שַֽׁעַר־עִירֽוֹ׃</mark>", "pasuk_en": "לְאַבְרָהָם לְמִקְנָה לְעֵינֵי בְנֵי חֵת בְּכֹל בָּאֵי שַׁעַר עִירוֹ", "rashi_he": "בכל באי שער עירו. בְּקֶרֶב כֻּלָּם וּבְמַעֲמַד כֻּלָּם הִקְנָהוּ לוֹ:", "rashi_en": "בכל באי שער עירו BEFORE ALL THAT CAME IN AT THE GATE OF HIS CITY — In the midst of all them, and with all of them standing by he gave him legal possession of it.", "note": "", "points": [{"q": "מַה חֲשִׁיבוּת נוֹכְחוּת בְּנֵי חֵת בָּעִסְקָה?", "options": ["כֻּלָּם עָמְדוּ כְּעֵדִים שֶׁנָּתְנוּ לְאַבְרָהָם חֲזָקָה מִשְׁפָּטִית", "הֵם הָיוּ חַיָּבִים לְאַשֵּׁר אֶת הַמְּכִירָה עַל פִּי הַחֹק הַמְּקוֹמִי", "הֵם מָחוּ עַל הַמְּכִירָה לְזָר"], "kasha": "מַדּוּעַ הַתּוֹרָה מַדְגִּישָׁה אֶת נוֹכְחוּת כָּל בָּאֵי שַׁעַר הָעִיר?", "answer": "בְּתוֹךְ מַעֲמָד כֻּלָּם, עֶפְרוֹן נָתַן לְאַבְרָהָם חֲזָקָה מִשְׁפָּטִית עַל הַשָּׂדֶה וְהַמְּעָרָה."}]}, {"id": "24:1.1", "ch": 24, "v": 1, "n": 1, "dh": "ברך את אברהם בכל", "pasuk_html": "וְאַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּיָּמִ֑ים וַֽיהֹוָ֛ה <mark>בֵּרַ֥ךְ אֶת־אַבְרָהָ֖ם בַּכֹּֽל׃</mark>", "pasuk_en": "Abraham was now old, advanced in years, and GOD had blessed Abraham in all things. ", "rashi_he": "ברך את אברהם בכל. בַּכֹּל עוֹלֶה בְּגִימַטְרִיָּא בֵּן, וּמֵאַחַר שֶׁהָיָה לוֹ בֵּן הָיָה צָרִיךְ לְהַשִּׂיאוֹ אִשָּׁה:", "rashi_en": "ברך את אברהם בכל [THE LORD HAD] BLESSED ABRAHAM IN ALL THINGS — The numerical value of the word בכל is equal to that of בן (a son) — suggesting that God had blessed Abraham with a son and since he had a son he had to find him a wife.", "note": "", "points": [{"q": "מַדּוּעַ רַשִׁ\"י מְקַשֵּׁר אֶת הַמִּלָּה בַּכֹּל ('בְּכָל דָּבָר') לְבֵן?", "options": ["הַגִּימַטְרִיָּה שֶׁל בַּכֹּל שָׁוָה לְבֵן", "הַמִּלָּה בַּכֹּל הִיא רָאשֵׁי תֵּבוֹת שֶׁל 'בֵּן כָּל לֵב'", "הַתַּרְגּוּם מְתַרְגֵּם בַּכֹּל כְּ'צֶאֱצָאִים'"], "kasha": "מַדּוּעַ הַתּוֹרָה מַזְכִּירָה בְּרָכָה זוֹ בְּדִיּוּק לִפְנֵי הַחִפּוּשׂ אַחַר אִשָּׁה?", "answer": "הַגִּימַטְרִיָּה שֶׁל בַּכֹּל שָׁוָה לְבֵן — הַקָּדוֹשׁ בָּרוּךְ הוּא בֵּרַךְ אֶת אַבְרָהָם בְּבֵן, וְעַכְשָׁו הָיָה צָרִיךְ לִמְצֹא לוֹ אִשָּׁה."}]}, {"id": "24:2.1", "ch": 24, "v": 2, "n": 1, "dh": "זקן ביתו", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָהָ֗ם אֶל־עַבְדּוֹ֙ <mark>זְקַ֣ן בֵּית֔וֹ</mark> הַמֹּשֵׁ֖ל בְּכׇל־אֲשֶׁר־ל֑וֹ שִֽׂים־נָ֥א יָדְךָ֖ תַּ֥חַת יְרֵכִֽי׃", "pasuk_en": "And Abraham said to the senior servant of his household, who had charge of all that he owned, “Put your hand under my thigh ", "rashi_he": "זקן ביתו. לְפִי שֶׁהוּא דָּבוּק נָקוּד זְקַן:", "rashi_en": "זקן ביתו THE ELDER OF HIS HOUSE — Because the noun is in the construct state the ק is punctuated with a Patach.", "note": "", "points": [{"q": "מַדּוּעַ הַקּוּף בְּ'זְקַן' מְנֻקֶּדֶת בְּפַתָּח כָּאן?", "options": ["מִפְּנֵי שֶׁהַשֵּׁם בִּסְמִיכוּת, כְּלוֹמַר 'זְקַן בֵּיתוֹ'", "מִפְּנֵי שֶׁהִיא בָּאָה אַחֲרֵי אוֹת גְּרוֹנִית", "מִפְּנֵי שֶׁהִיא בְּמָקוֹם הֶפְסֵק בְּסוֹף הַפָּסוּק"], "kasha": "אֵיזוֹ תְּכוּנָה דִּקְדּוּקִית מַסְבִּירָה אֶת הַנִּקּוּד הַחָרִיג תַּחַת הַקּוּף?", "answer": "הַשֵּׁם בִּסְמִיכוּת (זְקַן בֵּיתוֹ — 'זָקֵן שֶׁל בֵּיתוֹ'), וְזֶה מְשַׁנֶּה אֶת הַנִּקּוּד שֶׁל הַקּוּף לְפַתָּח."}]}, {"id": "24:2.2", "ch": 24, "v": 2, "n": 2, "dh": "תחת ירכי", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָהָ֗ם אֶל־עַבְדּוֹ֙ זְקַ֣ן בֵּית֔וֹ הַמֹּשֵׁ֖ל בְּכׇל־אֲשֶׁר־ל֑וֹ שִֽׂים־נָ֥א יָדְךָ֖ <mark>תַּ֥חַת יְרֵכִֽי׃</mark>", "pasuk_en": "And Abraham said to the senior servant of his household, who had charge of all that he owned, “Put your hand under my thigh ", "rashi_he": "תחת ירכי. לְפִי שֶׁהַנִּשְׁבָּע צָרִיךְ שֶׁיִּטֹּל בְּיָדוֹ חֵפֶץ שֶׁל מִצְוָה, כְּגוֹן סֵפֶר תּוֹרָה אוֹ תְּפִלִּין (שבועות ל\"ח), וְהַמִּילָה הָיְתָה מִצְוָה רִאשׁוֹנָה לוֹ וּבָאָה לוֹ עַל יְדֵי צַעַר וְהָיְתָה חֲבִיבָה עָלָיו וּנְטָלָהּ:", "rashi_en": "תחת ירכי UNDER MY THIGH — because whoever takes an oath must take in his hand some sacred object. such as a Scroll of the Law or Tefillin (Shevuot 38b). As circumcision was the first commandment given to him and became his only through much pain it was consequently dear to him and therefore he selected this as the object upon which to take the oath (Genesis Rabbah 59:8). ", "note": "", "points": [{"q": "מַדּוּעַ אַבְרָהָם צִוָּה אֶת הָעֶבֶד לָשִׂים אֶת יָדוֹ תַּחַת יְרֵכוֹ?", "options": ["הַנִּשְׁבָּע חַיָּב לֶאֱחֹז בְּחֵפֶץ שֶׁל מִצְוָה, וְהַמִּילָה הָיְתָה מִצְוָתוֹ הָרִאשׁוֹנָה שֶׁל אַבְרָהָם, חֲבִיבָה עָלָיו עַל יְדֵי צַעֲרָהּ", "זֶה הָיָה מִנְהַג שְׁבוּעָה מְקוּבָּל בְּאֶרֶץ נַהֲרַיִם", "הַיָּרֵךְ מְסַמֶּלֶת אֶת הַצֶּאֱצָאִים הָעֲתִידִים שֶׁיִּירְשׁוּ אֶת הָאָרֶץ"], "kasha": "מַדּוּעַ דַּוְקָא הַיָּרֵךְ — לָמָּה לֹא לְהִשָּׁבַע עַל מִזְבֵּחַ אוֹ חֵפֶץ קָדוֹשׁ אַחֵר?", "answer": "כָּל הַנִּשְׁבָּע חַיָּב לֶאֱחֹז בְּחֵפֶץ שֶׁל מִצְוָה (כְּמוֹ סֵפֶר תּוֹרָה אוֹ תְּפִלִּין). הַמִּילָה הָיְתָה מִצְוָתוֹ הָרִאשׁוֹנָה שֶׁל אַבְרָהָם וְהָיְתָה חֲבִיבָה עָלָיו עַל יְדֵי הַצַּעַר שֶׁסָּבַל, וְלָכֵן בָּחַר בָּהּ כְּחֵפֶץ שֶׁל מִצְוָה לַשְּׁבוּעָה."}]}, {"id": "24:7.1", "ch": 24, "v": 7, "n": 1, "dh": "ה׳ אלהי השמים", "pasuk_html": "<mark>יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם</mark> אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "ה' אלהי השמים אשר לקחני מבית אבי. וְלֹא אָמַר \"וֵאלֹהֵי הָאָרֶץ\", וּלְמַעְלָה אָמַר וְאַשְׁבִּיעֲךָ וגו'? אָמַר לוֹ עַכְשָׁו הוּא אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ, שֶׁהִרְגַּלְתִּיו בְּפִי הַבְּרִיּוֹת, אֲבָל כְּשֶׁלְּקָחַנִי מִבֵּית אָבִי הָיָה אֱלֹהֵי הַשָּׁמַיִם וְלֹא אֱלֹהֵי הָאָרֶץ, שֶׁלֹּא הָיוּ בָּאֵי עוֹלָם מַכִּירִים בּוֹ וּשְׁמוֹ לֹא הָיָה רָגִיל בָּאָרֶץ:", "rashi_en": "'ה אלהי השמים אשר לקחני מבית אבי THE LORD, GOD OF HEAVEN, WHO TOOK ME FROM MY FATHER'S HOUSE — Here he did not say “[The God of heaven] and the God of the earth”, whereas above (v. 3) he said, “And I will make thee swear etc. … [and the God of the earth]’’. But, in effect, Abraham said to him: Now He is the God of heaven and the God of the earth, because I have made him (i. e. His Name) a familiar one in peoples’ mouths: but at the time when He took me from my father’s house He was God of heaven only and not God of the earth for people did not acknowledge Him and His Name was not commonly known on earth (Genesis Rabbah 59:7).", "note": "", "points": [{"q": "מַדּוּעַ אַבְרָהָם אוֹמֵר כָּאן רַק 'אֱלֹהֵי הַשָּׁמַיִם' אֲבָל לְמַעְלָה בְּפָסוּק ג' אָמַר 'אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ'?", "options": ["עַכְשָׁו הַקָּדוֹשׁ בָּרוּךְ הוּא מוּכָּר גַּם בָּאָרֶץ בִּזְכוּת מַעֲשֵׂי אַבְרָהָם, אֲבָל כְּשֶׁלְּקָחוֹ מִבֵּית אָבִיו רַק הַשָּׁמַיִם הִכִּירוּהוּ", "אַבְרָהָם הָיָה יוֹתֵר רִשְׁמִי כְּשֶׁדִּבֵּר יְשִׁירוֹת לָעֶבֶד", "הַנּוּסָח הַקָּצָר מְשַׁמֵּשׁ כְּשֶׁמְּדַבְּרִים עַל הַבְטָחַת ה', וְהָאָרֹךְ כְּשֶׁמַּשְׁבִּיעִים"], "kasha": "מַדּוּעַ חֹסֶר הָעֲקֵבִיּוּת — לְמַעְלָה (פָּסוּק ג') אַבְרָהָם אָמַר 'אֱלֹהֵי הַשָּׁמַיִם וְהָאָרֶץ' וְכָאן הִשְׁמִיט 'וְהָאָרֶץ'?", "answer": "אַבְרָהָם הִסְבִּיר: עַכְשָׁו הוּא אֱלֹהֵי הַשָּׁמַיִם וְהָאָרֶץ, כִּי אֲנִי הִרְגַּלְתִּיו בְּפִי הַבְּרִיּוֹת. אֲבָל כְּשֶׁלְּקָחַנִי מִבֵּית אָבִי הָיָה רַק אֱלֹהֵי הַשָּׁמַיִם — בְּנֵי הָאָרֶץ עֲדַיִן לֹא הִכִּירוּהוּ."}]}, {"id": "24:7.2", "ch": 24, "v": 7, "n": 2, "dh": "מבית אבי", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי <mark>מִבֵּ֣ית אָבִי֮</mark> וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "מבית אבי. מֵחָרָן:", "rashi_en": "מבית אבי FROM MY FATHER S HOUSE — from Haran.", "note": "", "points": [{"q": "לְאֵיזֶה מָקוֹם מִתְכַּוֵּן 'בֵּית אָבִי'?", "options": ["חָרָן", "אוּר כַּשְׂדִּים", "בְּאֵר שָׁבַע"], "kasha": "לְאֵיזֶה מָקוֹם מְסֻיָּם מִתְכַּוֵּן 'בֵּית אָבִי'?", "answer": "'בֵּית אָבִי' מִתְכַּוֵּן לְחָרָן, שֶׁשָּׁם יָשַׁב תֶּרַח אֲבִי אַבְרָהָם."}]}, {"id": "24:7.3", "ch": 24, "v": 7, "n": 3, "dh": "ומארץ מולדתי", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ <mark>וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒</mark> וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "ומארץ מולדתי. מֵאוּר כַּשְׂדִּים:", "rashi_en": "ומארץ מולדתי AND FROM THE LAND OF MY NATIVITY — from Ur-Kasdim.", "note": "", "points": [{"q": "לְאֵיזֶה מָקוֹם מִתְכַּוֵּן 'אֶרֶץ מוֹלַדְתִּי'?", "options": ["אוּר כַּשְׂדִּים", "חָרָן", "כְּנַעַן"], "kasha": "מַהוּ הַמָּקוֹם הַמְּסֻיָּם שֶׁל 'אֶרֶץ מוֹלַדְתִּי'?", "answer": "'אֶרֶץ מוֹלַדְתִּי' מִתְכַּוֵּן לְאוּר כַּשְׂדִּים, שֶׁשָּׁם נוֹלַד אַבְרָהָם."}]}, {"id": "24:7.4", "ch": 24, "v": 7, "n": 4, "dh": "ואשר דבר לי", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ <mark>וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י</mark> וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "ואשר דבר לי. לְצָרְכִּי; כְּמוֹ אֲשֶׁר דִּבֶּר עָלַי (מלכים א' ב'), וְכֵן כָּל לִי וְלוֹ וְלָהֶם הַסְּמוּכִים אֵצֶל דִּבּוּר מְפֹרָשִׁים בִּלְשוֹן עַל, וְתַרְגּוּם שֶׁלָּהֶם עֲלַי, עֲלוֹהִי, עֲלֵיהוֹן, שֶׁאֵין נוֹפֵל אֵצֶל דִּבּוּר לְשׁוֹן לִי וְלוֹ וְלָהֶם, אֶלָּא אֵלַי, אֵלָיו, אֲלֵיהֶם, וְתַרְגּוּם שֶׁלָּהֶם עִמִּי, עִמֵּיהּ, עִמְּהוֹן, אֲבָל אֵצֶל אֲמִירָה נוֹפֵל לְשׁוֹן לִי וְלוֹ וְלָהֶם:", "rashi_en": "ואשר דבר לי AND WHO SPOKE לי—The word לי means “in my interest”, just as (1 Kings 2:4) “which He spake concerning me (עלי)”. In the same way, in every case where לי or לו or להם follow after the verb דבר they must be explained in the sense of על “concerning” — and in the Targum they should be rendered by עלי or עלוהי or עליהון regarding me etc. — for with this verb דבר in the sense of speaking to a person, the expressions לי and לו and להם are not the appropriate ones, but אלי and אליו and אליהן, and their renderings in the Targum should be עמי and עמיה and עמהן i. e., to speak with me or him or them. In the case of the verb אמר, however, the expressions לי and לו and להם are the appropriate ones.", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ\"י מַסְבִּיר אֶת הַמִּלָּה לִי בְּ'אֲשֶׁר דִּבֶּר לִי'?", "options": ["פֵּרוּשָׁהּ 'בִּשְׁבִילִי' אוֹ 'עַל אוֹדוֹתַי'", "פֵּרוּשָׁהּ 'יְשִׁירוֹת אֵלַי בִּנְבוּאָה'", "פֵּרוּשָׁהּ 'לְמַעַן צֶאֱצָאַי'"], "kasha": "מָה הַדִּיּוּק שֶׁהַמִּלָּה לִי מוֹסִיפָה מֵעֵבֶר לְ'דִבֶּר אֵלַי'?", "answer": "הַמִּלָּה לִי פֵּרוּשָׁהּ 'בִּשְׁבִילִי' אוֹ 'עַל אוֹדוֹתַי' — לֹא רַק שֶׁהַקָּדוֹשׁ בָּרוּךְ הוּא דִּבֶּר אֵלָיו, אֶלָּא שֶׁהַדִּבּוּר הָיָה לְטוֹבָתוֹ."}]}, {"id": "24:7.5", "ch": 24, "v": 7, "n": 5, "dh": "ואשר נשבע לי", "pasuk_html": "יְהֹוָ֣ה&thinsp;׀ אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י <mark>וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙</mark> לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "pasuk_en": "The ETERNAL, the God of heaven—who took me from my father’s house and from my native land, who promised me on oath, saying, ‘I will assign this land to your offspring’—will send an angel before you, and you will get a wife for my son from there. ", "rashi_he": "ואשר נשבע לי. בֵּין הַבְּתָרִים:", "rashi_en": "ואשר נשבע לי AND WHO SWORE UNTO ME at the Covenant between the Pieces (Genesis Rabbah 59:10).", "note": "", "points": [{"q": "מָתַי הָיְתָה הַשְּׁבוּעָה שֶׁ'אֲשֶׁר נִשְׁבַּע לִי' מַזְכִּיר?", "options": ["בִּבְרִית בֵּין הַבְּתָרִים", "בַּעֲקֵדַת יִצְחָק", "כְּשֶׁאַבְרָהָם הִגִּיעַ לְכְנַעַן לָרִאשׁוֹנָה"], "kasha": "לְאֵיזֶה אֵרוּעַ מְסֻיָּם מִתְכַּוֵּן אַבְרָהָם כְּשֶׁאוֹמֵר שֶׁה' 'נִשְׁבַּע' לוֹ?", "answer": "הַקָּדוֹשׁ בָּרוּךְ הוּא נִשְׁבַּע לְאַבְרָהָם בִּבְרִית בֵּין הַבְּתָרִים."}]}, {"id": "24:8.1", "ch": 24, "v": 8, "n": 1, "dh": "ונקית משבעתי", "pasuk_html": "וְאִם־לֹ֨א תֹאבֶ֤ה הָֽאִשָּׁה֙ לָלֶ֣כֶת אַחֲרֶ֔יךָ <mark>וְנִקִּ֕יתָ מִשְּׁבֻעָתִ֖י</mark> זֹ֑את רַ֣ק אֶת־בְּנִ֔י לֹ֥א תָשֵׁ֖ב שָֽׁמָּה׃", "pasuk_en": "And if the woman does not consent to follow you, you shall then be clear of this oath to me; but do not take my son back there.” ", "rashi_he": "ונקית משבועתי וגו'. וְקַח לוֹ אִשָּׁה מִבְּנוֹת עָנֵר אֶשְׁכּוֹל וּמַמְרֵא:", "rashi_en": "'ונקית משבעתי וגו THEN SHALT THOU BE CLEAR FROM THIS MY OATH etc. — and take a wife for him from the daughters of Aner or Eshcol or Mamre.", "note": "", "points": [{"q": "אִם הָאִשָּׁה תְּסָרֵב לָבוֹא, מָה מֻתָּר לָעֶבֶד לַעֲשׂוֹת?", "options": ["הוּא מְשֻׁחְרָר מִן הַשְּׁבוּעָה וּמֻתָּר לָקַחַת אִשָּׁה מִבְּנוֹת עָנֵר אֶשְׁכֹּל וּמַמְרֵא", "עָלָיו לַחֲזֹר לְאַבְרָהָם בְּיָדַיִם רֵיקוֹת וְהַשְּׁבוּעָה נִשְׁאֶרֶת בְּתָקְפָּהּ", "עָלָיו לִנְסֹעַ לְעָנָף אַחֵר שֶׁל מִשְׁפַּחַת אַבְרָהָם"], "kasha": "מָה קוֹרֶה לְחִיּוּב הַשְּׁבוּעָה אִם הַשְּׁלִיחוּת נִכְשֶׁלֶת?", "answer": "הָעֶבֶד מְשֻׁחְרָר מִן הַשְּׁבוּעָה לְגַמְרֵי, וְרַשָּׁאי לָקַחַת אִשָּׁה מִבְּנוֹת עָנֵר, אֶשְׁכֹּל אוֹ מַמְרֵא."}]}, {"id": "24:8.2", "ch": 24, "v": 8, "n": 2, "dh": "רק את בני", "pasuk_html": "וְאִם־לֹ֨א תֹאבֶ֤ה הָֽאִשָּׁה֙ לָלֶ֣כֶת אַחֲרֶ֔יךָ וְנִקִּ֕יתָ מִשְּׁבֻעָתִ֖י זֹ֑את <mark>רַ֣ק אֶת־בְּנִ֔י</mark> לֹ֥א תָשֵׁ֖ב שָֽׁמָּה׃", "pasuk_en": "And if the woman does not consent to follow you, you shall then be clear of this oath to me; but do not take my son back there.” ", "rashi_he": "רק את בני וגו'. רַק מִעוּט הוּא; בְּנִי אֵינוֹ חוֹזֵר, אֲבָל יַעֲקֹב בֶּן בְּנִי סוֹפוֹ לַחֲזֹר:", "rashi_en": "רק את בני וגו ONLY [BRING NOT] MY SON [THITHER] etc. — The word רק narrows and limits (מעוט) the sense: it is only my son who may not go back there, but Jacob, my son’s son, in the end will go back there to find a wife  (Genesis Rabbah 59:10). ", "note": "", "points": [{"q": "מָה בָּאָה מִלַּת הַמִּעוּט רַק ('רַק אֶת בְּנִי') לְהוֹצִיא?", "options": ["רַק יִצְחָק לֹא יַחֲזֹר לְשָׁם, אֲבָל יַעֲקֹב (נֶכֶד אַבְרָהָם) סוֹפוֹ לַחֲזֹר", "רַק בֵּן אֶחָד לֹא יֵלֵךְ — אִם יִהְיוּ לְאַבְרָהָם עוֹד בָּנִים, הֵם רַשָּׁאִים", "רַק יִצְחָק לֹא יֵלֵךְ לִצְמִיתוּת, אֲבָל מֻתָּר לוֹ לְבַקֵּר זְמַנִּית"], "kasha": "מַדּוּעַ הַתּוֹרָה מִשְׁתַּמֶּשֶׁת בְּמִלַּת הַמִּעוּט רַק כָּאן?", "answer": "רַק מְמַעֵט אֶת הָאִסּוּר לְיִצְחָק בִּלְבַד: רַק בְּנִי לֹא יַחֲזֹר לְשָׁם, אֲבָל יַעֲקֹב (נֶכְדִּי) סוֹפוֹ לַחֲזֹר לְאוֹתָהּ אֶרֶץ."}]}, {"id": "24:10.1", "ch": 24, "v": 10, "n": 1, "dh": "מגמלי אדניו", "pasuk_html": "וַיִּקַּ֣ח הָ֠עֶ֠בֶד עֲשָׂרָ֨ה גְמַלִּ֜ים <mark>מִגְּמַלֵּ֤י אֲדֹנָיו֙</mark> וַיֵּ֔לֶךְ וְכׇל־ט֥וּב אֲדֹנָ֖יו בְּיָד֑וֹ וַיָּ֗קׇם וַיֵּ֛לֶךְ אֶל־אֲרַ֥ם נַֽהֲרַ֖יִם אֶל־עִ֥יר נָחֽוֹר׃", "pasuk_en": "Then the servant took ten of his master’s camels and set out, taking with him all the bounty of his master; and he made his way to Aram-naharaim, to the city of Nahor. ", "rashi_he": "מגמלי אדוניו. נִכָּרִין הָיוּ מִשְּׁאָר גְּמַלִּים, שֶׁהָיוּ יוֹצְאִין זְמוּמִין מִפְּנֵי הַגֶּזֶל, שֶׁלֹּא יִרְעוּ בִשְׂדוֹת אֲחֵרִים (בראשית רבה):", "rashi_en": "מגמלי אדניו OF HIS MASTER’S CAMELS — These were distinguished from other camels by going out muzzled to avoid robbery — i.e. that they should not graze in other peoples’ fields (Genesis Rabbah 59:11).", "note": "", "points": [{"q": "בַּמָּה הִצְטַיְּנוּ גְּמַלֵּי אַבְרָהָם מִשְּׁאָר גְּמַלִּים?", "options": ["הֵם יָצְאוּ זְמוּמִים כְּדֵי שֶׁלֹּא יִרְעוּ בִּשְׂדוֹת אֲחֵרִים", "הֵם הָיוּ מְסֻמָּנִים בְּסִימַן אַבְרָהָם עַל רַגְלֵיהֶם", "הֵם הָיוּ גְּמַלִּים לְבָנִים, זַן יָקָר וְנָדִיר"], "kasha": "מַדּוּעַ הַפָּסוּק מְפָרֵשׁ 'מִגְּמַלֵּי אֲדֹנָיו' — מָה הָיָה מְיֻחָד בָּהֶם?", "answer": "גְּמַלֵּי אַבְרָהָם הָיוּ נִכָּרִים מִפְּנֵי שֶׁיָּצְאוּ זְמוּמִים, כְּדֵי לִמְנֹעַ אוֹתָם מִלִּרְעוֹת בִּשְׂדוֹת אֲחֵרִים, לְהִמָּנַע מִכָּל צוּרָה שֶׁל גָּזֵל."}]}, {"id": "24:10.2", "ch": 24, "v": 10, "n": 2, "dh": "וכל טוב אדניו בידו", "pasuk_html": "וַיִּקַּ֣ח הָ֠עֶ֠בֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִגְּמַלֵּ֤י אֲדֹנָיו֙ וַיֵּ֔לֶךְ <mark>וְכׇל־ט֥וּב אֲדֹנָ֖יו בְּיָד֑וֹ</mark> וַיָּ֗קׇם וַיֵּ֛לֶךְ אֶל־אֲרַ֥ם נַֽהֲרַ֖יִם אֶל־עִ֥יר נָחֽוֹר׃", "pasuk_en": "Then the servant took ten of his master’s camels and set out, taking with him all the bounty of his master; and he made his way to Aram-naharaim, to the city of Nahor. ", "rashi_he": "וכל טוב אדוניו בידו. שְׁטָר מַתָּנָה כָּתַב לְיִצְחָק עַל כָּל אֲשֶׁר לוֹ, כְּדֵי שֶׁיִּקְפְּצוּ לִשְׁלֹחַ לוֹ בִּתָּם (בראשית רבה):", "rashi_en": "וכל טוב אדניו בידו AND ALL THE GOODS OF HIS MASTER WERE IN HIS HAND — He wrote a deed of gift of all his possessions in favour of Isaac so that they would be eager to send him their daughter (Genesis Rabbah 59:11).", "note": "", "points": [{"q": "מַה פֵּרוּשׁ 'וְכָל טוּב אֲדֹנָיו בְּיָדוֹ' בִּמְצִיאוּת?", "options": ["הוּא נָשָׂא שְׁטַר מַתָּנָה שֶׁמַּעֲבִיר אֶת כָּל רְכוּשׁ אַבְרָהָם לְיִצְחָק", "הוּא הֵבִיא עֲשָׂרָה מַשָּׂאוֹת גְּמַלִּים שֶׁל מַתָּנוֹת יְקָרוֹת וְתַכְשִׁיטִים", "הוּא נָשָׂא אִגֶּרֶת הֶכֵּר מֵאַבְרָהָם שֶׁמְּתָאֶרֶת אֶת עָשְׁרוֹ"], "kasha": "כֵּיצַד יָכֹל עֶבֶד לִשְׂאֵת אֶת 'כָּל' טוּב אֲדֹנָיו?", "answer": "הוּא כָּתַב שְׁטַר מַתָּנָה שֶׁל כָּל נִכְסֵי אַבְרָהָם לְיִצְחָק, כְּדֵי שֶׁהַמִּשְׁפָּחָה תִּרְצֶה לִשְׁלֹחַ אֶת בִּתָּם לְהִנָּשֵׂא לְעָשִׁיר כָּזֶה."}]}, {"id": "24:10.3", "ch": 24, "v": 10, "n": 3, "dh": "ארם נהרים", "pasuk_html": "וַיִּקַּ֣ח הָ֠עֶ֠בֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִגְּמַלֵּ֤י אֲדֹנָיו֙ וַיֵּ֔לֶךְ וְכׇל־ט֥וּב אֲדֹנָ֖יו בְּיָד֑וֹ וַיָּ֗קׇם וַיֵּ֛לֶךְ אֶל־<mark>אֲרַ֥ם נַֽהֲרַ֖יִם</mark> אֶל־עִ֥יר נָחֽוֹר׃", "pasuk_en": "Then the servant took ten of his master’s camels and set out, taking with him all the bounty of his master; and he made his way to Aram-naharaim, to the city of Nahor. ", "rashi_he": "ארם נהרים. בֵּין שְׁתֵּי נְהָרוֹת יוֹשֶׁבֶת:", "rashi_en": "ארם נהרים MESOPOTAMIA (literally, ARAM OF THE TWO RIVERS) — it was situated between the two rivers, Euphrates and Tigris. ", "note": "", "points": [{"q": "מַדּוּעַ נִקְרֵאת אֲרַם נַהֲרַיִם ('אֲרָם שֶׁל שְׁנֵי נְהָרוֹת')?", "options": ["מִפְּנֵי שֶׁהִיא יוֹשֶׁבֶת בֵּין שְׁנֵי נְהָרוֹת: פְּרָת וְחִדֶּקֶל", "מִפְּנֵי שִׁשְׁנֵי נְחָלִים מִתְאַחֲדִים בְּמֶרְכַּז הָעִיר", "מִפְּנֵי שֶׁהַיַּרְדֵּן וְהַפְּרָת מְהַוִּים אֶת גְּבוּלוֹתֶיהָ"], "kasha": "מַה פֵּרוּשׁ שֵׁם הַמָּקוֹם 'אֲרַם נַהֲרַיִם'?", "answer": "פֵּרוּשָׁהּ מֵסוֹפּוֹטַמְיָה — הָאָרֶץ הַיּוֹשֶׁבֶת בֵּין שְׁנֵי נְהָרוֹת, פְּרָת וְחִדֶּקֶל."}]}, {"id": "24:11.1", "ch": 24, "v": 11, "n": 1, "dh": "ויברך הגמלים", "pasuk_html": "<mark>וַיַּבְרֵ֧ךְ הַגְּמַלִּ֛ים</mark> מִח֥וּץ לָעִ֖יר אֶל־בְּאֵ֣ר הַמָּ֑יִם לְעֵ֣ת עֶ֔רֶב לְעֵ֖ת צֵ֥את הַשֹּׁאֲבֹֽת׃", "pasuk_en": "He made the camels kneel down by the well outside the city, at evening time, the time when women come out to draw water. ", "rashi_he": "ויברך הגמלים. הִרְבִּיצָם:", "rashi_en": "ויברך הגמלים means HE MADE THEM KNEEL (Genesis Rabbah 59:11).", "note": "", "points": [{"q": "מַה פֵּרוּשׁ וַיַּבְרֵךְ בְּהֶקְשֵׁר זֶה?", "options": ["הוּא הִבְרִיךְ אֶת הַגְּמַלִּים — גָּרַם לָהֶם לִכְרֹעַ", "הוּא בֵּרַךְ אֶת הַגְּמַלִּים לִפְנֵי הַמַּסָּע", "הוּא הֶאֱכִיל וְהִשְׁקָה אֶת הַגְּמַלִּים"], "kasha": "הַמִּלָּה וַיַּבְרֵךְ בְּדֶרֶךְ כְּלָל פֵּרוּשָׁהּ 'הוּא בֵּרַךְ' — מַה פֵּרוּשָׁהּ כָּאן?", "answer": "כָּאן וַיַּבְרֵךְ פֵּרוּשׁוֹ הוּא הִבְרִיכָם — מִלְּשׁוֹן כְּרִיעָה (בֶּרֶךְ פֵּרוּשָׁהּ גַּם 'בִּרְכַּיִם')."}]}, {"id": "24:14.1", "ch": 24, "v": 14, "n": 1, "dh": "אתה הכחת", "pasuk_html": "וְהָיָ֣ה הַֽנַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֙יהָ֙ הַטִּי־נָ֤א כַדֵּךְ֙ וְאֶשְׁתֶּ֔ה וְאָמְרָ֣ה שְׁתֵ֔ה וְגַם־גְּמַלֶּ֖יךָ אַשְׁקֶ֑ה <mark>אֹתָ֤הּ הֹכַ֙חְתָּ֙</mark> לְעַבְדְּךָ֣ לְיִצְחָ֔ק וּבָ֣הּ אֵדַ֔ע כִּי־עָשִׂ֥יתָ חֶ֖סֶד עִם־אֲדֹנִֽי׃", "pasuk_en": "let the maiden to whom I say, ‘Please, lower your jar that I may drink,’ and who replies, ‘Drink, and I will also water your camels’—let her be the one whom You have decreed for Your servant Isaac. Thereby shall I know that You have dealt graciously with my master.”", "rashi_he": "אתה הכחת. רְאוּיָה הִיא לוֹ שֶׁתְּהֵא גּוֹמֶלֶת חֲסָדִים, וּכְדַאי לִכָּנֵס בְּבֵיתוֹ שֶׁל אַבְרָהָם; וּלְשׁוֹן הֹכַחְתָּ בֵּרַרְתָּ, אפרו\"בישט בלע\"ז:", "rashi_en": "אתה הכחת HER THOU HAST APPOINTED — She is fit for him since she will be charitable and will therefore be worthy of admission into the house of Abraham. The word הכחת means selected; old French approuvest; English thou hast selected.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ הֹכַחְתָּ וּמַדּוּעַ נַעֲרָה זוֹ רְאוּיָה לְיִצְחָק?", "options": ["פֵּרוּשָׁהּ 'בָּחַרְתָּ/הוֹכַחְתָּ' — הִיא הוֹכִיחָה שֶׁהִיא רְאוּיָה בְּכָךְ שֶׁהֶרְאֲתָה מִדַּת חֶסֶד הָרְאוּיָה לְבֵית אַבְרָהָם", "פֵּרוּשָׁהּ 'בָּחַנְתָּ' — הִיא עָבְרָה מִבְחָן סִבֹּלֶת גּוּפָנִי", "פֵּרוּשָׁהּ 'גִּלִּיתָ' — ה' הוֹדִיעַ אֶת זֶהוּתָהּ עַל יְדֵי אוֹת"], "kasha": "אֵיזוֹ מִדָּה מְחַפֵּשׂ הָעֶבֶד, וּמַה פֵּרוּשׁ הֹכַחְתָּ?", "answer": "הֹכַחְתָּ פֵּרוּשָׁהּ 'בָּחַרְתָּ' אוֹ 'הוֹכַחְתָּ'. הַנַּעֲרָה שֶׁמַּשְׁקָה מַיִם לְנָכְרִי וְלִגְמַלָּיו מוֹכִיחָה מִדַּת חֶסֶד, וְזֶה הוֹפֵךְ אוֹתָהּ לִרְאוּיָה לְהִצְטָרֵף לְבֵית אַבְרָהָם."}]}, {"id": "24:14.2", "ch": 24, "v": 14, "n": 2, "dh": "ובה אדע", "pasuk_html": "וְהָיָ֣ה הַֽנַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֙יהָ֙ הַטִּי־נָ֤א כַדֵּךְ֙ וְאֶשְׁתֶּ֔ה וְאָמְרָ֣ה שְׁתֵ֔ה וְגַם־גְּמַלֶּ֖יךָ אַשְׁקֶ֑ה אֹתָ֤הּ הֹכַ֙חְתָּ֙ לְעַבְדְּךָ֣ לְיִצְחָ֔ק <mark>וּבָ֣הּ אֵדַ֔ע</mark> כִּי־עָשִׂ֥יתָ חֶ֖סֶד עִם־אֲדֹנִֽי׃", "pasuk_en": "let the maiden to whom I say, ‘Please, lower your jar that I may drink,’ and who replies, ‘Drink, and I will also water your camels’—let her be the one whom You have decreed for Your servant Isaac. Thereby shall I know that You have dealt graciously with my master.”", "rashi_he": "ובה אדע. לְשׁוֹן תְּחִנָּה, הוֹדַע לִי בָּהּ:", "rashi_en": "ובה אדע This is a petition: “Let me know through her”.", "note": "", "points": [{"q": "מַהוּ טִיבָהּ שֶׁל אֲמִירַת הָעֶבֶד 'וּבָהּ אֵדַע'?", "options": ["זוֹ בַּקָּשָׁה/תְּפִלָּה — 'תֵּן לִי לָדַעַת עַל יָדָהּ'", "זוֹ הַצְהָרַת וַדָּאוּת — 'אֲנִי כְּבָר יוֹדֵעַ שֶׁהִיא הַנְּכוֹנָה'", "זֶהוּ תְּנַאי — 'רַק אִם תַּעֲשֶׂה כָּךְ אֵדַע'"], "kasha": "הַאִם הָעֶבֶד דּוֹרֵשׁ, מִתְפַּלֵּל, אוֹ מַסִּיק מַסְקָנָה הֶגְיוֹנִית?", "answer": "זוֹ בַּקָּשָׁה לַקָּדוֹשׁ בָּרוּךְ הוּא — הָעֶבֶד מִתְפַּלֵּל: 'תֵּן לִי לָדַעַת עַל יָדָהּ שֶׁהִיא הַנְּכוֹנָה'."}]}, {"id": "24:14.3", "ch": 24, "v": 14, "n": 3, "dh": "כי עשית חסד", "pasuk_html": "וְהָיָ֣ה הַֽנַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֙יהָ֙ הַטִּי־נָ֤א כַדֵּךְ֙ וְאֶשְׁתֶּ֔ה וְאָמְרָ֣ה שְׁתֵ֔ה וְגַם־גְּמַלֶּ֖יךָ אַשְׁקֶ֑ה אֹתָ֤הּ הֹכַ֙חְתָּ֙ לְעַבְדְּךָ֣ לְיִצְחָ֔ק וּבָ֣הּ אֵדַ֔ע <mark>כִּי־עָשִׂ֥יתָ חֶ֖סֶד</mark> עִם־אֲדֹנִֽי׃", "pasuk_en": "let the maiden to whom I say, ‘Please, lower your jar that I may drink,’ and who replies, ‘Drink, and I will also water your camels’—let her be the one whom You have decreed for Your servant Isaac. Thereby shall I know that You have dealt graciously with my master.”", "rashi_he": "כי עשית חסד. אִם תִּהְיֶה מִמִּשְׁפַּחְתּוֹ וְהוֹגֶנֶת לוֹ אֵדַע כִּי עָשִׂית חֶסֶד:", "rashi_en": "כי עשית חסד THAT THOU HAST SHOWN KINDNESS — if she is of his family and a fit companion for him I shall know that thou hast shown kindness to my master.", "note": "", "points": [{"q": "מָתַי יֵדַע הָעֶבֶד שֶׁה' עָשָׂה חֶסֶד עִם אֲדֹנָיו?", "options": ["אִם הַנַּעֲרָה תִּתְבָּרֵר כְּבַת מִשְׁפַּחַת אַבְרָהָם וּרְאוּיָה לְיִצְחָק", "אִם הַנַּעֲרָה תַּשְׁקֶה אֶת הַגְּמַלִּים בִּמְהִירוּת", "אִם הַנַּעֲרָה תִּהְיֶה יָפָה וַעֲשִׁירָה"], "kasha": "מָה בְּדִיּוּק יְאַשֵּׁר שֶׁה' עָשָׂה 'חֶסֶד' עִם אַבְרָהָם?", "answer": "אִם הַנַּעֲרָה בַּעֲלַת הַחֶסֶד תִּתְבָּרֵר גַּם כְּבַת מִשְׁפַּחַת אַבְרָהָם וּרְאוּיָה לְיִצְחָק, אָז יֵדַע הָעֶבֶד שֶׁה' עָשָׂה חֶסֶד עִם אֲדֹנָיו."}]}, {"id": "24:16.1", "ch": 24, "v": 16, "n": 1, "dh": "בתולה", "pasuk_html": "וְהַֽנַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד <mark>בְּתוּלָ֕ה</mark> וְאִ֖ישׁ לֹ֣א יְדָעָ֑הּ וַתֵּ֣רֶד הָעַ֔יְנָה וַתְּמַלֵּ֥א כַדָּ֖הּ וַתָּֽעַל׃", "pasuk_en": "The maiden was very beautiful, a virgin whom no man had known.bvirgin Or “young woman.” She went down to the spring, filled her jar, and came up. ", "rashi_he": "בתולה. מִמְּקוֹם בְּתוּלִים (בראשית רבה):", "rashi_en": "בתולה A VIRGIN — from the place of her hymen.", "note": "", "points": [{"q": "מָה אוֹמֵר רַשִׁ\"י שֶׁבְּתוּלָה מִתְכַּוֶּנֶת בְּדִיּוּק?", "options": ["בְּתוּלָה מִמָּקוֹם בְּתוּלֶיהָ — בְּתוּלִים מַמָּשׁ", "נַעֲרָה צְעִירָה שֶׁלֹּא נִשְּׂאָה בְּגִיל נִשּׂוּאִין", "אִשָּׁה שֶׁמֵּעוֹלָם לֹא אֵרְסוּ אוֹתָהּ"], "kasha": "אִם הַפָּסוּק כְּבָר אָמַר 'בְּתוּלָה', מַדּוּעַ רַשִׁ\"י צָרִיךְ לְפָרֵשׁ?", "answer": "רַשִׁ\"י מְפָרֵשׁ שֶׁבְּתוּלָה פֵּרוּשָׁהּ בְּתוּלָה מִמָּקוֹם בְּתוּלֶיהָ — בְּתוּלִים גּוּפָנִיִּים מַמָּשׁ."}]}, {"id": "24:16.2", "ch": 24, "v": 16, "n": 2, "dh": "ואיש לא ידעה", "pasuk_html": "וְהַֽנַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד בְּתוּלָ֕ה <mark>וְאִ֖ישׁ לֹ֣א יְדָעָ֑הּ</mark> וַתֵּ֣רֶד הָעַ֔יְנָה וַתְּמַלֵּ֥א כַדָּ֖הּ וַתָּֽעַל׃", "pasuk_en": "The maiden was very beautiful, a virgin whom no man had known.bvirgin Or “young woman.” She went down to the spring, filled her jar, and came up. ", "rashi_he": "ואיש לא ידעה. שֶׁלֹּא כְּדַרְכָּהּ, לְפִי שֶׁבְּנוֹת הַגּוֹיִם הָיוּ מְשַׁמְּרוֹת מְקוֹם בְּתוּלֵיהֶן וּמַפְקִירוֹת עַצְמָן מִמָּקוֹם אַחֵר, הֵעִיד עַל זוֹ שֶׁנְּקִיָּה מִכֹּל:", "rashi_en": "ואיש לא ידעה AND A MAN DID NOT KNOW HER — not in its way (meaning, anally). Because the daughters of the nations would guard the place of their hymens, but abandon themselves from another place. It testifies about this one that she was clean from all [of this] (Genesis Rabbah 60:5). ", "note": "", "points": [{"q": "אִם כְּבָר נִקְרְאָה בְּתוּלָה, מַדּוּעַ הַפָּסוּק מוֹסִיף 'וְאִישׁ לֹא יְדָעָהּ'?", "options": ["לְלַמֵּד שֶׁהָיְתָה נְקִיָּה גַּם מִתַּשְׁמִישׁ שֶׁלֹּא כְּדַרְכָּהּ — בְּנוֹת הָאֻמּוֹת שָׁמְרוּ עַל בְּתוּלִים מַמָּשׁ אַךְ לֹא עַל שְׁאָר הַהַנְהָגָה", "לְהַדְגִּישׁ שֶׁמֵּעוֹלָם לֹא דִּבְּרָה בְּפְרָטִיּוּת עִם גֶּבֶר", "לְצַיֵּן שֶׁמֵּעוֹלָם לֹא אֵרְסוּ אוֹתָהּ וְלֹא הֻבְטְחָה לְאִישׁ"], "kasha": "הַפָּסוּק כְּבָר אָמַר שֶׁהִיא בְּתוּלָה — מָה מוֹסִיף 'וְאִישׁ לֹא יְדָעָהּ'?", "answer": "בְּנוֹת הָאֻמּוֹת הָיוּ שׁוֹמְרוֹת עַל בְּתוּלֵיהֶן אַךְ מְשַׁמְּשׁוֹת שֶׁלֹּא כְּדַרְכָּן. בִּטּוּי זֶה מְלַמֵּד שֶׁרִבְקָה הָיְתָה נְקִיָּה מִכָּל הַנְהָגָה כָּזוֹ."}]}, {"id": "24:17.1", "ch": 24, "v": 17, "n": 1, "dh": "וירץ העבד לקראתה", "pasuk_html": "<mark>וַיָּ֥רׇץ הָעֶ֖בֶד לִקְרָאתָ֑הּ</mark> וַיֹּ֕אמֶר הַגְמִיאִ֥ינִי נָ֛א מְעַט־מַ֖יִם מִכַּדֵּֽךְ׃", "pasuk_en": "The servant ran toward her and said, “Please, let me sip a little water from your jar.” ", "rashi_he": "וירץ העבד לקראתה. לְפִי שֶׁרָאָה שֶׁעָלוּ הַמַּיִם לִקְרָאתָהּ (בראשית רבה):", "rashi_en": "וירץ העבד לקראתה AND THE SERVANT RAN TOWARDS HER — because he saw that the waters rose in the well when she approached it (Genesis Rabbah 60:5). ", "note": "", "points": [{"q": "מַדּוּעַ רָץ הָעֶבֶד לִקְרַאת רִבְקָה?", "options": ["הוּא רָאָה שֶׁמֵּי הַבְּאֵר עָלוּ בְּנֵס כְּשֶׁהִתְקָרְבָה", "הוּא רָצָה לִהְיוֹת הָרִאשׁוֹן לְדַבֵּר אִתָּהּ לִפְנֵי שֶׁאֲחֵרִים יַגִּיעוּ", "הוּא נִלְהַב מִפְּנֵי שֶׁהִיא הִתְאִימָה לְתֵאוּר הַגּוּפָנִי שֶׁאַבְרָהָם נָתַן לוֹ"], "kasha": "מָה גָּרַם לָעֶבֶד לָרוּץ אֵלֶיהָ פִּתְאוֹם?", "answer": "הוּא רָץ מִפְּנֵי שֶׁרָאָה אֶת מֵי הַבְּאֵר עוֹלִים לִקְרָאתָהּ כְּשֶׁהִתְקָרְבָה — אוֹת שֶׁל נֵס."}]}, {"id": "24:17.2", "ch": 24, "v": 17, "n": 2, "dh": "הגמיאיני נא", "pasuk_html": "וַיָּ֥רׇץ הָעֶ֖בֶד לִקְרָאתָ֑הּ וַיֹּ֕אמֶר <mark>הַגְמִיאִ֥ינִי נָ֛א</mark> מְעַט־מַ֖יִם מִכַּדֵּֽךְ׃", "pasuk_en": "The servant ran toward her and said, “Please, let me sip a little water from your jar.” ", "rashi_he": "הגמיאיני נא. לְשׁוֹן גְּמִיעָה, הומיי\"ר בלע\"ז:", "rashi_en": "הגמיאיני נא GIVE ME TO DRINK, I PRAY THEE — the word means sipping; old French humer.", "note": "", "points": [{"q": "מַה פֵּרוּשׁ הַגְמִיאִינִי?", "options": ["הַשְׁקִינִי מְעַט — תְּנִי לִי לִגְמֹעַ מְעַט מַיִם", "שִׁפְכִי לִי מַיִם בְּנָדִיבוּת", "שַׁאֲבִי לִי מַיִם מִן הַבְּאֵר"], "kasha": "מַה הַמַּשְׁמָעוּת הַמְּדֻיֶּקֶת שֶׁל מִלָּה חֲרִיגָה זוֹ?", "answer": "הַגְמִיאִינִי פֵּרוּשָׁהּ 'תְּנִי לִי לִגְמֹעַ' — הוּא בִּקֵּשׁ רַק כַּמּוּת קְטַנָּה שֶׁל מַיִם."}]}, {"id": "24:18.1", "ch": 24, "v": 18, "n": 1, "dh": "ותרד כדה", "pasuk_html": "וַתֹּ֖אמֶר שְׁתֵ֣ה אֲדֹנִ֑י וַתְּמַהֵ֗ר <mark>וַתֹּ֧רֶד כַּדָּ֛הּ</mark> עַל־יָדָ֖הּ וַתַּשְׁקֵֽהוּ׃", "pasuk_en": "“Drink, my lord,” she said, and she quickly lowered her jar upon her hand and let him drink. ", "rashi_he": "ותרד כדה. מֵעַל שִׁכְמָהּ:", "rashi_en": "ותרד כדה SHE LET DOWN HER PITCHER from off her shoulder.", "note": "", "points": [{"q": "אֵיזוֹ פְּעֻלָּה מְתָאֶרֶת וַתֹּרֶד כַּדָּהּ?", "options": ["הִיא הוֹרִידָה/הִנְמִיכָה אֶת כַּדָּהּ מֵעַל כְּתֵפָהּ", "הִיא יָרְדָה לַבְּאֵר עִם כַּדָּהּ", "הִיא הִטְּתָה אֶת הַכַּד כְּדֵי לִשְׁפֹּךְ מַיִם"], "kasha": "מַה הַמַּשְׁמָעוּת הַמְּדֻיֶּקֶת שֶׁל וַתֹּרֶד בְּהֶקְשֵׁר זֶה?", "answer": "הִיא הוֹרִידָה אֶת כַּדָּהּ מֵעַל כְּתֵפָהּ — וַתֹּרֶד כָּאן פֵּרוּשׁוֹ הִנְמִיכָה אוֹתוֹ מִמָּקוֹם שֶׁנְּשָׂאָה אוֹתוֹ."}]}, {"id": "24:19.1", "ch": 24, "v": 19, "n": 1, "dh": "עד אם כלו", "pasuk_html": "וַתְּכַ֖ל לְהַשְׁקֹת֑וֹ וַתֹּ֗אמֶר גַּ֤ם לִגְמַלֶּ֙יךָ֙ אֶשְׁאָ֔ב <mark>עַ֥ד אִם־כִּלּ֖וּ</mark> לִשְׁתֹּֽת׃", "pasuk_en": "When she had let him drink his fill, she said, “I will also draw for your camels, until they finish drinking.” ", "rashi_he": "עד אם כלו. הֲרֵי אִם מְשַׁמֵּשׁ בִּלְשׁוֹן אֲשֶׁר, אִם כִּלּוּ דַי סִפּוּקוֹן, שֶׁזּוֹ הִיא גְּמַר שְׁתִיָּתָן, כְּשֶׁשָּׁתוּ דֵּי סִפּוּקָן:", "rashi_en": "עד אם כלו literally, UNTIL THAT THEY HAVE FINISHED [DRINKING] — Here the word אם is used in the sense of אשר “that”. The words אם כלו the Targum renders by \"That they have done enough drinking”. Though the verb כלה signifies to finish, to end, the Targum is right in translating it thus for this is the end of their drinking when they have drunk as much as they wanted (cf. Rashi on Genesis 43:2). ", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ\"י מַסְבִּיר אֶת הַמִּלָּה אִם בְּ'עַד אִם כִּלּוּ לִשְׁתּוֹת'?", "options": ["כָּאן אִם פֵּרוּשָׁהּ אֲשֶׁר ('שֶׁ') — 'עַד שֶׁגָּמְרוּ', וְכִלָּה פֵּרוּשָׁהּ סִיּוּם", "אִם פֵּרוּשָׁהּ 'אִם' — הִיא הִתְנְתָה תְּנַאי עַל כַּמָּה יִשְׁתּוּ", "אִם הִיא מִלַּת הַדְגָּשָׁה בְּמוּבַן 'בֶּאֱמֶת'"], "kasha": "הַמִּלָּה אִם בְּדֶרֶךְ כְּלָל פֵּרוּשָׁהּ 'אִם' — מַה פֵּרוּשָׁהּ כָּאן?", "answer": "כָּאן אִם בְּמוּבַן שֶׁל אֲשֶׁר ('שֶׁ'). הַמִּשְׁפָּט פֵּרוּשׁוֹ 'עַד שֶׁגָּמְרוּ לִשְׁתּוֹת', וְכִלָּה פֵּרוּשָׁהּ סִיּוּם/גְּמִירָה."}]}, {"id": "24:20.1", "ch": 24, "v": 20, "n": 1, "dh": "ותער", "pasuk_html": "וַתְּמַהֵ֗ר <mark>וַתְּעַ֤ר</mark> כַּדָּהּ֙ אֶל־הַשֹּׁ֔קֶת וַתָּ֥רׇץ ע֛וֹד אֶֽל־הַבְּאֵ֖ר לִשְׁאֹ֑ב וַתִּשְׁאַ֖ב לְכׇל־גְּמַלָּֽיו׃", "pasuk_en": "Quickly emptying her jar into the trough, she ran back to the well to draw, and she drew for all his camels.", "rashi_he": "ותער. לְשׁוֹן נְפִיצָה, וְהַרְבֵּה יֵשׁ בִּלְשׁוֹן מִשְׁנָה הַמְעָרֶה מִכְּלִי אֶל כֶּלִי, וּבַמִּקְרָא יֵשׁ לוֹ דּוֹמֶה אַל תְּעַר נַפְשִׁי (תהילים קמא), אֲשֶׁר הֶעֱרָה לַמָּוֶת נַפְשׁוֹ (ישעיהו נ\"ג):", "rashi_en": "ותער AND SHE EMPTIED — It means “pouring out”. It occurs in this sense many times in the Mishna; e. g., (Avodah Zarah 72a), “He who pours (הטערה) from one vessel into another”, and we find it again in a similar sense in Biblical Hebrew: (Psalms 141:8) “O pour not out (תער) my soul”, and (Isaiah 53:12) “Because he poured forth (הערה) his soul unto death”", "note": "", "points": [{"q": "מַה פֵּרוּשׁ וַתְּעַר?", "options": ["הִיא שָׁפְכָה אֶת תֹּכֶן כַּדָּהּ", "הִיא מִהֲרָה בִּמְהִירוּת אֶל הַשֹּׁקֶת", "הִיא עֵרְבְּבָה אֶת הַמַּיִם בַּשֹּׁקֶת"], "kasha": "מַה הַמַּשְׁמָעוּת הַמְּדֻיֶּקֶת שֶׁל פֹּעַל זֶה?", "answer": "וַתְּעַר פֵּרוּשָׁהּ 'הִיא שָׁפְכָה' — הִיא רוֹקְנָה אֶת כַּדָּהּ לְתוֹךְ הַשֹּׁקֶת."}]}, {"id": "24:20.2", "ch": 24, "v": 20, "n": 2, "dh": "השקת", "pasuk_html": "וַתְּמַהֵ֗ר וַתְּעַ֤ר כַּדָּהּ֙ אֶל־<mark>הַשֹּׁ֔קֶת</mark> וַתָּ֥רׇץ ע֛וֹד אֶֽל־הַבְּאֵ֖ר לִשְׁאֹ֑ב וַתִּשְׁאַ֖ב לְכׇל־גְּמַלָּֽיו׃", "pasuk_en": "Quickly emptying her jar into the trough, she ran back to the well to draw, and she drew for all his camels.", "rashi_he": "השקת. אֶבֶן חֲלוּלָה שֶׁשּׁוֹתִים בָּה הַגְּמַלִּים:", "rashi_en": "השקת THE TROUGH — a hollowed-out stone from which the camels drink. ", "note": "", "points": [{"q": "מַהִי שֹׁקֶת?", "options": ["אֶבֶן חֲלוּלָה שֶׁמִּמֶּנָּה שׁוֹתִים גְּמַלִּים", "דְּלִי עוֹר שֶׁמְּשַׁמֵּשׁ לִשְׁאִיבַת מַיִם מִבְּאֵרוֹת", "אֵבוּס עֵץ לְהַאֲכָלַת בְּהֵמוֹת"], "kasha": "אֵיזֶה חֵפֶץ מְתָאֶרֶת מִלָּה זוֹ?", "answer": "שֹׁקֶת הִיא אֶבֶן חֲלוּלָה שֶׁמְּשַׁמֶּשֶׁת כְּגִגִּית שְׁתִיָּה לַגְּמַלִּים."}]}, {"id": "24:21.1", "ch": 24, "v": 21, "n": 1, "dh": "משתאה (1st)", "pasuk_html": "וְהָאִ֥ישׁ <mark>מִשְׁתָּאֵ֖ה</mark> לָ֑הּ מַחֲרִ֕ישׁ לָדַ֗עַת הַֽהִצְלִ֧יחַ יְהֹוָ֛ה דַּרְכּ֖וֹ אִם־לֹֽא׃", "pasuk_en": "The man, meanwhile, stood gazing at her, silently wondering whether GOD had made his errand successful or not. ", "rashi_he": "משתאה. לְשׁוֹן שְׁאִיָּה, כְּמוֹ שָׁאוּ עָרִים, תִּשָּׁאֶה שְׁמָמָה (שם ו'):", "rashi_en": "משתאה WAS WONDERING — The word really has the idea of being waste and desolate, as (Isaiah 6:11) “Until cities be waste (שאו) and the land become utterly desolate תשאה.", "note": "", "points": [{"q": "מַהוּ הַיְסוֹד שֶׁבַּמִּלָּה מִשְׁתָּאֶה?", "options": ["מִלְּשׁוֹן שְׁמָמָה וְתִמָּהוֹן — הַבָּעַת דּוּמִיָּה הֲמוּמָה", "מִלְּשׁוֹן שִׂמְחָה וְהִתְלַהֲבוּת", "מִלְּשׁוֹן חֲשָׁד וּזְהִירוּת"], "kasha": "מַהוּ הַמּוּבָן הָעֲמֹק שֶׁל מִלָּה חֲרִיגָה זוֹ?", "answer": "שֹׁרֶשׁ מִשְׁתָּאֶה נוֹשֵׂא רַעְיוֹן שֶׁל שְׁמָמָה — הַבָּעַת מַצַּב שֶׁל תִּמָּהוֹן שׁוֹתֵק וְהָמוּם."}]}, {"id": "24:21.2", "ch": 24, "v": 21, "n": 2, "dh": "משתאה (2nd)", "pasuk_html": "וְהָאִ֥ישׁ <mark>מִשְׁתָּאֵ֖ה</mark> לָ֑הּ מַחֲרִ֕ישׁ לָדַ֗עַת הַֽהִצְלִ֧יחַ יְהֹוָ֛ה דַּרְכּ֖וֹ אִם־לֹֽא׃", "pasuk_en": "The man, meanwhile, stood gazing at her, silently wondering whether GOD had made his errand successful or not. ", "rashi_he": "משתאה. מִשְׁתּוֹמֵם וּמִתְבַּהַל עַל שֶׁרָאָה דְבָרוֹ קָרוֹב לְהַצְלִיחַ, אֲבָל אֵינוֹ יוֹדֵעַ אִם מִמִּשְׁפַּחַת אַבְרָהָם הִיא אִם לָאו. וְאַל תִּתְמַהּ בַּת' שֶׁל מִשְׁתָּאֵה, שֶׁאֵין לְךָ תֵּבָה שֶׁתְּחִלַּת יְסוֹדָהּ שִׁי\"ן וּמְדַבֶּרֶת בִּלְשׁוֹן מִתְפַּעֵל שֶׁאֵין תָּי\"ו מַפְרִידָה בֵּין שְׁתֵּי אוֹתִיּוֹת שֶׁל עִקָּר הַיְסוֹד כְּגוֹן מִשְׁתָּאֵה, מִשְׁתּוֹלֵל מִגִּזְרַת שׁוֹלָל, וַיִּשְׁתּוֹמֵם מִגִּזְרַת שְׁמָמָה, וְיִשְׁתַּמֵּר חֻקּוֹת עָמְרִי (מיכה ו') מִגִּזְרַת וַיִּשְׁמֹר, אַף כָּאן מִשְׁתָּאֵה מִגִּזְרַת תִּשָּׁאֶה, וּכְשֵׁם שֶׁאַתָּה מוֹצֵא לְשׁוֹן מְשׁוֹמֵם בְּאָדָם נִבְהָל וְנֶאֱלָם וּבַעַל מַחֲשָׁבוֹת, כְּמוֹ עַל יוֹמוֹ נָשַׁמּוּ אַחֲרֹנִים (איוב י\"ח), שֹׁמּוּ שָׁמַיִם (ירמיהו ב'), אֶשְׁתּוֹמַם כְּשָׁעָה חֲדָא (דניאל ד'), כָּךְ תְּפָרֵשׁ לְשׁוֹן שְׁאִיָּה בְּאָדָם בָּהוּל וּבַעַל מַחֲשָׁבוֹת (וְאֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן שְׁהִיָּה, וְגַבְרָא שָׁהֵי, שׁוֹהֵא וְעוֹמֵד בְּמָקוֹם אֶחָד לִרְאוֹת הַהִצְלִיחַ ה' דַּרְכּוֹ; וְאֵין לְתַרְגֵּם שָׁתֵי, שֶׁהֲרֵי אֵינוֹ לְשׁוֹן שְׁתִיָּה, שֶׁאֵין אָלֶף נוֹפֶלֶת בִּלְשׁוֹן שְׁתִיָּה):", "rashi_en": "משתאה means he was astonished and perplexed, because he saw that what he had said was nearly successful only that he did not know whether she belonged to Abraham’s family or not. Do not be puzzled by the ת in the word משתאה for you will find no word (verb) whose first root letter is ש where, when it is used in the Hithpael, the ת of the Hithpael-prefix does not come between the first two letters of the root, as e.g. משתאה (here) and (Isaiah 59:15) משתולל of the same root as שולל, and (Isaiah 59:16) וישתומם of the same root as שממה and (Micha 6:16) “For the statutes of Omri are kept (וישתמר )” from the same root as וישמר —so, also, here משתאה is of the same root as תשאה. Now, just as you find the expression שמם (which really means waste and desolate) applied to a person who is perplexed and speechless (with amazement) and sunk in deep thought (about what is happening) — e. g., (Job 18:20) “They that come after shall be astonished (נשמו) at his day”, and (Jeremiah 2:12) “Be astonished (שומו) ye heavens”, and (Daniel 4:16) “He was appalled אשתומם for a time” — so too you may explain the expression שאה (which also really means waste and desolate) in all its verbal or noun forms as referring to a person who is perplexed and sunk deep in thought. Onkelos translates it in the sense of lingering — “the man lingered” — i. e. he wailed, standing on one spot, to see “whether God had made his journey prosperous”. But one should not read in the Targum שתי in place of שהי, as the Targum of משתאה, (as evidently some versions of the Targum read), for the word משתאה certainly does not mean drinking, for א has no place in the Hebrew words which mean drinking root (שתה).", "note": "", "points": [{"q": "מַדּוּעַ הָיָה הָעֶבֶד מִשְׁתּוֹמֵם וְנָבוֹךְ?", "options": ["הוּא כִּמְעַט הִצְלִיחַ — הִיא הֶרְאֲתָה אֶת כָּל הַסִּימָנִים הַנְּכוֹנִים — אַךְ עֲדַיִן לֹא יָדַע אִם הִיא מִמִּשְׁפַּחַת אַבְרָהָם", "הוּא לֹא יָכֹל לְהַאֲמִין שֶׁנַּעֲרָה אַחַת יְכוֹלָה לְהַשְׁקוֹת עֲשָׂרָה גְּמַלִּים לְבַדָּהּ", "הוּא לֹא הָיָה בָּטוּחַ אִם נֵס הַמַּיִם הָעוֹלִים הוּא אוֹת אֱמֶת מֵה'"], "kasha": "מָה גָּרַם לְמַצַּב הַתִּמָּהוֹן וְהַמְּבוּכָה שֶׁל הָעֶבֶד?", "answer": "הוּא הִשְׁתּוֹמֵם מִפְּנֵי שֶׁהַכֹּל הֵצְבִּיעַ עַל הַצְלָחָה — הִיא הָיְתָה בַּעֲלַת חֶסֶד וְטוּב לֵב — אַךְ עֲדַיִן הָיָה נָבוֹךְ כִּי לֹא יָדַע עֲדַיִן אִם הִיא מִמִּשְׁפַּחַת אַבְרָהָם."}]}, {"id": "24:21.3", "ch": 24, "v": 21, "n": 3, "dh": "משתאה לה", "pasuk_html": "וְהָאִ֥ישׁ <mark>מִשְׁתָּאֵ֖ה לָ֑הּ</mark> מַחֲרִ֕ישׁ לָדַ֗עַת הַֽהִצְלִ֧יחַ יְהֹוָ֛ה דַּרְכּ֖וֹ אִם־לֹֽא׃", "pasuk_en": "The man, meanwhile, stood gazing at her, silently wondering whether GOD had made his errand successful or not. ", "rashi_he": "משתאה לה. מִשְׁתּוֹמֵם עָלֶיהָ, כְּמוֹ אִמְרִי לִי אָחִי הוּא (בראשית כ׳:י״ג) וּכְמוֹ וַיִּשְׁאֲלוּ אַנְשֵׁי הַמָּקוֹם לְאִשְׁתּוֹ (שם כ\"ו):", "rashi_en": "משתאה לה means he was wondering about her, just as the ל has the meaning “about” in (20:13) “Say of me (לי), he is my brother”, and (26:7) “And the men of the place asked about his wife. ", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ\"י מַסְבִּיר אֶת הַלָּמֶ\"ד בְּ'לָהּ'?", "options": ["הַלָּמֶ\"ד פֵּרוּשָׁהּ 'עַל אוֹדוֹת' — הוּא תָּמַהּ עַל אוֹדוֹתֶיהָ", "הַלָּמֶ\"ד פֵּרוּשָׁהּ 'בִּשְׁבִיל' — הוּא חִכָּה שֶׁתְּסַיֵּם", "הַלָּמֶ\"ד פֵּרוּשָׁהּ 'אֶל' — הוּא הִבִּיט אֵלֶיהָ"], "kasha": "מַה פֵּרוּשׁ מִלַּת הַיַּחַס לָמֶ\"ד בְּבִטּוּי זֶה?", "answer": "הַלָּמֶ\"ד פֵּרוּשָׁהּ 'עַל אוֹדוֹת' — הוּא תָּמַהּ עַל אוֹדוֹתֶיהָ, מְנַסֶּה לְהָבִין אֶת זֶהוּתָהּ."}]}, {"id": "24:22.1", "ch": 24, "v": 22, "n": 1, "dh": "בקע", "pasuk_html": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלּ֤וּ הַגְּמַלִּים֙ לִשְׁתּ֔וֹת וַיִּקַּ֤ח הָאִישׁ֙ נֶ֣זֶם זָהָ֔ב <mark>בֶּ֖קַע</mark> מִשְׁקָל֑וֹ וּשְׁנֵ֤י צְמִידִים֙ עַל־יָדֶ֔יהָ עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽם׃", "pasuk_en": "When the camels had finished drinking, the man took a gold nose-ring weighing a half-shekel,chalf-shekel Heb. beqaʻ. and two gold bands for her arms, ten shekels in weight. ", "rashi_he": "בקע. רֶמֶז לְשִׁקְלֵי יִשְׂרָאֵל בֶּקַע לַגֻּלְגֹּלֶת:", "rashi_en": "בקע BEKA (half a Shekel) — a symbol of the Shekels of the Israelites of which it is said (Exodus 38:26) “a Beka (half a Shekel) a head” (cf. Targum Jon).", "note": "", "points": [{"q": "מָה מְסַמֵּל נֶזֶם הַזָּהָב שֶׁמִּשְׁקָלוֹ בֶּקַע (חֲצִי שֶׁקֶל)?", "options": ["מַחֲצִית הַשֶּׁקֶל שֶׁכָּל יִשְׂרְאֵלִי יִתְרֹם לַמִּשְׁכָּן", "חֲצִי מָנַת הַמָּן שֶׁכָּל אָדָם אָסַף בְּכָל יוֹם", "הָרַעְיוֹן שֶׁאִישׁ וְאִשָּׁה הֵם שְׁנֵי חֲצָאִים שֶׁל שָׁלֵם אֶחָד"], "kasha": "מַדּוּעַ דַּוְקָא מִשְׁקַל חֲצִי שֶׁקֶל לַנֶּזֶם?", "answer": "הַבֶּקַע (חֲצִי הַשֶּׁקֶל) הוּא סֵמֶל לִתְרוּמַת מַחֲצִית הַשֶּׁקֶל שֶׁכָּל יִשְׂרְאֵלִי עָתִיד לִתְרֹם."}]}, {"id": "24:22.2", "ch": 24, "v": 22, "n": 2, "dh": "ושני צמידים", "pasuk_html": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלּ֤וּ הַגְּמַלִּים֙ לִשְׁתּ֔וֹת וַיִּקַּ֤ח הָאִישׁ֙ נֶ֣זֶם זָהָ֔ב בֶּ֖קַע מִשְׁקָל֑וֹ <mark>וּשְׁנֵ֤י צְמִידִים֙</mark> עַל־יָדֶ֔יהָ עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽם׃", "pasuk_en": "When the camels had finished drinking, the man took a gold nose-ring weighing a half-shekel,chalf-shekel Heb. beqaʻ. and two gold bands for her arms, ten shekels in weight. ", "rashi_he": "ושני צמידים. רֶמֶז לִשְׁנֵי לוּחוֹת מְצֻמָּדוֹת:", "rashi_en": "ושני צמידים AND TWO BRACELETS (the word for bracelet signifies something joined or united) — a symbol of the two Tablets of stone, joined one to another (Genesis Rabbah 60:6).", "note": "", "points": [{"q": "מָה מְסַמְּלִים שְׁנֵי הַצְּמִידִים?", "options": ["שְׁנֵי לוּחוֹת הַבְּרִית, הַמְּחֻבָּרִים זֶה לְזֶה", "שְׁתֵּי הַבְּרִיתוֹת שֶׁכָּרַת ה' עִם אַבְרָהָם", "שְׁתֵּי נְשׁוֹת יַעֲקֹב — רָחֵל וְלֵאָה"], "kasha": "מַדּוּעַ דַּוְקָא שְׁנֵי צְמִידִים?", "answer": "שְׁנֵי הַצְּמִידִים מְסַמְּלִים אֶת שְׁנֵי לוּחוֹת הַבְּרִית שֶׁהָיוּ מְזֻוָּגִים זֶה עִם זֶה."}]}, {"id": "24:22.3", "ch": 24, "v": 22, "n": 3, "dh": "עשרה זהב משקלם", "pasuk_html": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלּ֤וּ הַגְּמַלִּים֙ לִשְׁתּ֔וֹת וַיִּקַּ֤ח הָאִישׁ֙ נֶ֣זֶם זָהָ֔ב בֶּ֖קַע מִשְׁקָל֑וֹ וּשְׁנֵ֤י צְמִידִים֙ עַל־יָדֶ֔יהָ <mark>עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽם׃</mark>", "pasuk_en": "When the camels had finished drinking, the man took a gold nose-ring weighing a half-shekel,chalf-shekel Heb. beqaʻ. and two gold bands for her arms, ten shekels in weight. ", "rashi_he": "עשרה זהב משקלם. רֶמֶז לַעֲשֶׂרֶת הַדִּבְּרוֹת שֶׁבָּהֶן:", "rashi_en": "עשרה זהב משקלם TEN SHEKELS OF GOLD WAS THEIR WEIGHT —a symbol of the Ten Commandments written on them (the Tablets) (Genesis Rabbah 60:6). ", "note": "", "points": [{"q": "מָה מְסַמְּלִים עֲשָׂרָה זָהָב מִשְׁקָלָם?", "options": ["עֲשֶׂרֶת הַדִּבְּרוֹת שֶׁנִּכְתְּבוּ עַל הַלּוּחוֹת",
