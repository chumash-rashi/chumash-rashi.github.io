<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-soft:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;--f-pasuk:"Taamey Frank CLM","Cardo","Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100dvh;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:4px;height:100%}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.top{display:contents}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
h1 span{display:none}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.count b{color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:none}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-pasuk);font-size:22px;line-height:1.7;letter-spacing:.03em;word-spacing:.08em;direction:rtl;text-align:right}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{display:none}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:6px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:8px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:18px;line-height:1.45;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:center;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-body);font-size:17px;line-height:1.4;width:100%;direction:rtl}
.opt .k{flex:none;font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-soft)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.row{display:flex;flex-direction:column;gap:2px}
.row .t{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);direction:rtl}
.row p{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--accent);font-size:18px;font-weight:600;display:inline-block;padding:5px 16px;border:1.5px solid var(--accent);border-radius:9px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:14px;line-height:1.6;direction:rtl;text-align:right}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface);font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line);font-size:14px}
.hint{font-size:14px;color:var(--muted);text-align:center;flex-shrink:0}
.verdict{font-weight:600;font-size:16px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:20px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* taamim: Frank Ruhl lacks cantillation glyphs, so those letters fell back to another font */
.pasuk{font-family:var(--f-pasuk)}
/* pasuk panel: visually separate the verse from the question */
.pasuk{background:var(--accent-soft);border-inline-start:5px solid var(--accent);border-radius:10px;padding:calc(var(--s,1)*6px) calc(var(--s,1)*12px)}
.point{border-top:1px solid var(--line);padding-top:calc(var(--s,1)*8px)}
/* fit layout: only pasuk + question + options in the card; fine print lives in the footer */
.wrap{max-width:min(1500px,100%)}
header .top,.tools,.ref,.dh{display:none}
.card{gap:calc(var(--s,1)*8px)}
.pasuk{font-size:calc(var(--s,1)*22px)}
.q{font-size:calc(var(--s,1)*18px)}
.opt{font-size:calc(var(--s,1)*17px);padding:calc(var(--s,1)*7px) calc(var(--s,1)*10px)}
.opt .k{width:calc(var(--s,1)*20px);height:calc(var(--s,1)*20px);font-size:calc(var(--s,1)*11px)}
.row p{font-size:25px;line-height:1.35}
.verdict{font-size:26px;font-weight:700}
.row .t{font-size:16px}
.point{gap:calc(var(--s,1)*10px)}
.card{position:relative}
.reveal{position:absolute;inset-inline:12px;bottom:56px;z-index:3;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.nav .btn{padding:4px 12px;font-size:13px}
@media (max-width:460px){.pasuk{font-size:calc(var(--s,1)*22px)}}
.hint{font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}

/* wide screens: split layout (pasuk | question+answers), fonts auto-fit each side */
@media (min-width:900px){
.wrap{max-width:min(1800px,100%)}
.card{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr) auto auto;column-gap:22px;row-gap:8px;overflow:hidden}
.card>.pasuk{grid-column:1;grid-row:1;overflow:hidden;align-self:stretch;font-size:calc(var(--sp,1)*22px);padding:calc(var(--sp,1)*10px) calc(var(--sp,1)*14px)}
.card>.point{position:relative;grid-column:2;grid-row:1;min-height:0;overflow:hidden;border-top:0;padding-top:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--s,1)*12px)}
.card>details{grid-column:1/-1;grid-row:2}
.card>.nav{grid-column:1/-1;grid-row:3}
.reveal{position:absolute;inset:auto 0 0 0;z-index:3;max-height:none;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.row p{font-size:calc(var(--s,1)*18px);line-height:1.4}
.verdict{font-size:30px;font-weight:700}
.row .t{font-size:20px}
.q{font-size:calc(var(--s,1)*21px)}
.opt{font-size:calc(var(--s,1)*21px)}
}

/*EN*/
html[dir=ltr] .opt{direction:ltr;text-align:left}
html[dir=ltr] .q{direction:ltr;text-align:left}
html[dir=ltr] .pnum{direction:ltr}
.q .hb,.opt .hb{font-family:var(--f-heb);font-size:1.12em}
.pasuk .pen{direction:ltr;text-align:left;font-family:var(--f-body);font-size:17px;line-height:1.4;letter-spacing:0;word-spacing:0;margin-top:.6em;color:var(--muted)}
.quote .enx{direction:ltr;text-align:left;font-family:var(--f-body);font-size:.82em;line-height:1.4;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.quote .enx i{color:var(--muted)}
.quote .src{direction:ltr}
.hint .ghost{padding:3px 10px;font-size:14px}

<script>
const DATA = [{"id": "32:4.1", "ch": 32, "v": 4, "n": 1, "dh": "וישלח יעקב מלאכים", "pasuk_html": "<mark>וַיִּשְׁלַ֨ח יַעֲקֹ֤ב מַלְאָכִים֙</mark> לְפָנָ֔יו אֶל־עֵשָׂ֖ו אָחִ֑יו אַ֥רְצָה שֵׂעִ֖יר שְׂדֵ֥ה אֱדֽוֹם׃", "pasuk_en": "וַיִּשְׁלַח יַעֲקֹב מַלְאָכִים לְפָנָיו אֶל־עֵשָׂו אָחִיו אַרְצָה שֵׂעִיר שְׂדֵה אֱדוֹם׃", "rashi_he": "וישלח יעקב מלאכים. מַלְאָכִים מַמָּשׁ (בראשית רבה):", "rashi_en": "רש״י מבהיר שהמלאכים שיעקב שלח לעשו לא היו שליחים אנושיים אלא מלאכים ממש, כלומר מלאכי שמים.", "note": "", "points": [{"q": "מִי הָיוּ הַמַּלְאָכִים שֶׁשָּׁלַח יַעֲקֹב לְעֵשָׂו לְפִי רַשִׁ״י?", "options": ["מַלְאָכִים מַמָּשׁ, כְּלוֹמַר מַלְאֲכֵי שָׁמַיִם", "שְׁלִיחִים אֲנוֹשִׁיִּים שֶׁנִּבְחֲרוּ מֵאַנְשֵׁי בֵּיתוֹ", "בְּנֵי מִשְׁפַּחְתּוֹ שֶׁל יַעֲקֹב"], "kasha": "המילה \"מלאכים\" יכולה להתפרש כשליחים רגילים או כמלאכי שמים, וצריך להכריע.", "answer": "רש״י מפרש שהיו מלאכים ממש, כלומר מלאכי שמים ולא שליחים אנושיים.", "kp": ["מלאכים ממש"]}]}, {"id": "32:4.2", "ch": 32, "v": 4, "n": 2, "dh": "ארצה שעיר", "pasuk_html": "וַיִּשְׁלַ֨ח יַעֲקֹ֤ב מַלְאָכִים֙ לְפָנָ֔יו אֶל־עֵשָׂ֖ו אָחִ֑יו <mark>אַ֥רְצָה שֵׂעִ֖יר</mark> שְׂדֵ֥ה אֱדֽוֹם׃", "pasuk_en": "וַיִּשְׁלַח יַעֲקֹב מַלְאָכִים לְפָנָיו אֶל־עֵשָׂו אָחִיו אַרְצָה שֵׂעִיר שְׂדֵה אֱדוֹם׃", "rashi_he": "ארצה שעיר. לְאֶרֶץ שֵׂעִיר כָּל תֵּבָה שֶׁצְּרִיכָה לָמֶ\"ד בִּתְּחִלָּתָהּ הֵטִיל לָהּ הַכָּתוּב הֵ\"א בְּסוֹפָהּ:", "rashi_en": "רש״י מסביר שהמילה \"ארצה\" פירושה \"לארץ\". זהו כלל לשוני: כל מילה שצריכה ל׳ בתחילתה, הכתוב מוסיף ה״א בסופה במקום.", "note": "", "points": [{"q": "כֵּיצַד מַסְבִּיר רַשִׁ״י אֶת הַצּוּרָה \"אַרְצָה\" בִּמְקוֹם \"לָאָרֶץ\"?", "options": ["מִילָּה שֶׁצְּרִיכָה לָ׳ בִּתְחִילָּתָהּ מְקַבֶּלֶת הֵ״א בְּסוֹפָהּ", "הֵ״א בְּסוֹף הַמִּילָּה מְצַיֶּינֶת כִּיּווּן מְסוּיָּם", "זוֹ צוּרַת סְמִיכוּת מְיֻוחֶדֶת הַנְּהוּגָה בִּשְׁמוֹת מְקוֹמוֹת"], "kasha": "מדוע כתוב \"ארצה שעיר\" ולא \"לארץ שעיר\" כפי שהיה מצופה.", "answer": "רש״י מלמד כלל: כל תיבה שצריכה ל׳ בתחילתה, הכתוב מטיל לה ה״א בסופה, ולכן \"ארצה\" היינו \"לארץ\".", "kp": ["כל תבה שצריכה למ\"ד בתחלתה הטיל לה הכתוב ה\"א בסופה"]}]}, {"id": "32:5.1", "ch": 32, "v": 5, "n": 1, "dh": "גרתי", "pasuk_html": "וַיְצַ֤ו אֹתָם֙ לֵאמֹ֔ר כֹּ֣ה תֹאמְר֔וּן לַֽאדֹנִ֖י לְעֵשָׂ֑ו כֹּ֤ה אָמַר֙ עַבְדְּךָ֣ יַעֲקֹ֔ב עִם־לָבָ֣ן <mark>גַּ֔רְתִּי</mark> וָאֵחַ֖ר עַד־עָֽתָּה׃", "pasuk_en": "וַיְצַו אֹתָם לֵאמֹר כֹּה תֹאמְרוּן לַאדֹנִי לְעֵשָׂו כֹּה אָמַר עַבְדְּךָ יַעֲקֹב עִם־לָבָן גַּרְתִּי וָאֵחַר עַד־עָתָּה׃", "rashi_he": "גרתי. לֹא נַעֲשֵׂיתִי שַׂר וְחָשׁוּב אֶלָּא גֵּר, אֵינְךָ כְּדַאי לִשְׂנֹא אוֹתִי עַל בִּרְכַּת אָבִיךָ שֶׁבֵּרְכַנִי הֱוֵה גְבִיר לְאַחֶיךָ, שֶׁהֲרֵי לֹא נִתְקַיְּמָה בִי. דָּ\"אַ גַּרְתִּי בְּגִימַטְרִיָּא תרי\"ג, כְּלוֹמַר, עִם לָבָן גַּרְתִּי וְתַרְיַ\"ג מִצְוֹת שָׁמַרְתִּי וְלֹא לָמַדְתִּי מִמַּעֲשָׂיו הָרָעִים:", "rashi_en": "רש״י נותן שני פירושים. הראשון: יעקב אומר לעשו שלא נעשה שר וחשוב אלא נשאר גר, כדי שעשו לא ישנא אותו בגלל ברכת יצחק שלא התקיימה. השני: גרתי בגימטריא תרי״ג, רמז שיעקב שמר תרי״ג מצוות ולא למד ממעשי לבן הרעים.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן בְּרַשׁ״י, מַדּוּעַ אָמַר יַעֲקֹב לְעֵשָׂו \"גַּרְתִּי\"?", "options": ["כְּדֵי לוֹמַר שֶׁלֹּא נִתְקַייְּמָה בוֹ בִּרְכַּת \"הֱוֵה גְּבִיר לְאַחֶיךָ\"", "כְּדֵי לְסַפֵּר שֶׁחַי בְּתָנָאִים קָשִׁים אֵצֶל לָבָן", "כְּדֵי לְהַרְאוֹת שֶׁהוּא עָשִׁיר וּמַצְלִיחַ לְמַרוֹת הַגָּלוּת"], "kasha": "מדוע יעקב מדגיש את עובדת מגוריו אצל לבן דווקא בפנייתו לעשו.", "answer": "יעקב רוצה לומר שלא נעשה שר וחשוב אלא גר בלבד, ולכן אין לעשו סיבה לשנוא אותו על ברכת אביו שלא נתקיימה.", "kp": ["לא נעשיתי שר וחשוב אלא גר", "אינך כדאי לשנא אותי על ברכת אביך"]}, {"q": "מַהוּ הָרֶמֶז בְּגִימַטְרִיָּא שֶׁל \"גַּרְתִּי\" לְפִי הַפֵּירוּשׁ הַשֵּׁנִי?", "options": ["גַּרְתִּי עוֹלֶה תרי״ג — שָׁמַר תרי״ג מִצְווֹת וְלֹא לָמַד מִמַּעֲשֵׂי לָבָן", "גַּרְתִּי עוֹלֶה תרי״ג — מִנְיַין שְׁנוֹת הַגָּלוּת אֵצֶל לָבָן", "גַּרְתִּי עוֹלֶה תרי״ג — מִסְפַּר בְּנֵי בֵיתוֹ שֶׁל יַעֲקֹב"], "kasha": "מדוע בחר יעקב דווקא במילה \"גרתי\" ולא במילה אחרת לתאר את שהותו.", "answer": "גרתי בגימטריא תרי״ג, כלומר יעקב רומז שעם לבן גר ובכל זאת שמר תרי״ג מצוות ולא למד ממעשיו הרעים.", "kp": ["גרתי בגימטריא תרי\"ג", "תרי\"ג מצות שמרתי ולא למדתי ממעשיו הרעים"]}]}, {"id": "32:6.1", "ch": 32, "v": 6, "n": 1, "dh": "ויהי לי שור וחמור", "pasuk_html": "<mark>וַֽיְהִי־לִי֙ שׁ֣וֹר וַחֲמ֔וֹר</mark> צֹ֖אן וְעֶ֣בֶד וְשִׁפְחָ֑ה וָֽאֶשְׁלְחָה֙ לְהַגִּ֣יד לַֽאדֹנִ֔י לִמְצֹא־חֵ֖ן בְּעֵינֶֽיךָ׃", "pasuk_en": "וַיְהִי־לִי שׁוֹר וַחֲמוֹר צֹאן וְעֶבֶד וְשִׁפְחָה וָאֶשְׁלְחָה לְהַגִּיד לַאדֹנִי לִמְצֹא־חֵן בְּעֵינֶיךָ׃", "rashi_he": "ויהי לי שור וחמור. אַבָּא אָמַר לִי מִטַּל הַשָּׁמַיִם וּמִשְׁמַנֵּי הָאָרֶץ, זוֹ אֵינָהּ לֹא מִן הַשָּׁמַיִם וְלֹא מִן הָאָרֶץ:", "rashi_en": "רש״י מסביר שיעקב רומז לעשו שרכושו — שור וחמור — אינו מתוך ברכת יצחק שהבטיחה טל השמים ושמני הארץ, שהרי בהמות אינן מן השמים ולא מן הארץ.", "note": "", "points": [{"q": "מַדּוּעַ מַדְגִּישׁ יַעֲקֹב שֶׁיֵּשׁ לוֹ \"שׁוֹר וַחֲמוֹר\" לְפִי רַשִׁ״י?", "options": ["כְּדֵי לִרְמוֹז שֶׁרְכוּשׁוֹ אֵינוֹ מִבִּרְכַּת אָבִיו שֶׁהִבְטִיחָה טַל הַשָּׁמַיִם וְשַׁמְנֵי הָאָרֶץ", "כְּדֵי לְהַרְאוֹת לְעֵשָׂו שֶׁהוּא עָשִׁיר וְשֶׁאֵין צֹורֶךְ בְּרָכוּשׁ נוֹסָף", "כְּדֵי לְהַצִּיעַ לְעֵשָׂו מַתָּנוֹת וּלְפַיֵּיס אוֹתוֹ"], "kasha": "מדוע יעקב מפרט דווקא שור וחמור, שהם רכוש פשוט, בפנייתו לעשו.", "answer": "יצחק בירך את יעקב בטל השמים ושמני הארץ, ויעקב מראה שרכושו — שור וחמור — אינו מן השמים ולא מן הארץ, כלומר הברכה לא נתקיימה.", "kp": ["אבא אמר לי מטל השמים ומשמני הארץ", "זו אינה לא מן השמים ולא מן הארץ"]}]}, {"id": "32:6.2", "ch": 32, "v": 6, "n": 2, "dh": "שור וחמור", "pasuk_html": "וַֽיְהִי־לִי֙ <mark>שׁ֣וֹר וַחֲמ֔וֹר</mark> צֹ֖אן וְעֶ֣בֶד וְשִׁפְחָ֑ה וָֽאֶשְׁלְחָה֙ לְהַגִּ֣יד לַֽאדֹנִ֔י לִמְצֹא־חֵ֖ן בְּעֵינֶֽיךָ׃", "pasuk_en": "וַיְהִי־לִי שׁוֹר וַחֲמוֹר צֹאן וְעֶבֶד וְשִׁפְחָה וָאֶשְׁלְחָה לְהַגִּיד לַאדֹנִי לִמְצֹא־חֵן בְּעֵינֶיךָ׃", "rashi_he": "שור וחמור. דֶּרֶךְ אֶרֶץ לוֹמַר עַל שְׁוָרִים הַרְבֵּה שׁוֹר – אָדָם אוֹמֵר לַחֲבֵרוֹ בַּלַּיְלָה קָרָא הַתַּרְנְגוֹל וְאֵינוֹ אוֹמֵר קָרְאוּ הַתַּרְנְגוֹלִים:", "rashi_en": "רש״י מסביר שדרך ארץ לומר על רבים בלשון יחיד, כמו שאומרים ״קרא התרנגול״ ולא ״קראו התרנגולים״. לכן הפסוק אומר ״שור וחמור״ אף שהכוונה לרבים.", "note": "", "points": [{"q": "מַדּוּעַ כָּתוּב ״שׁוֹר וַחֲמוֹר״ בִּלְשׁוֹן יָחִיד, לְפִי רַשִׁ״י?", "options": ["דֶּרֶךְ אֶרֶץ לוֹמַר עַל רַבִּים בִּלְשׁוֹן יָחִיד", "לְיַעֲקֹב הָיָה רַק שׁוֹר אֶחָד וַחֲמוֹר אֶחָד", "יַעֲקֹב מִיעֵּט בִּלְשׁוֹנוֹ כְּדֵי שֶׁלֹּא לְעוֹרֵר קִנְאָה"], "kasha": "הפסוק כותב ״שור וחמור״ בלשון יחיד, אף שליעקב היו בוודאי בהמות רבות.", "answer": "דרך ארץ לומר על רבים בלשון יחיד, כמו שאדם אומר ״קרא התרנגול בלילה״ ולא ״קראו התרנגולים״.", "kp": ["דרך ארץ לומר על שורים הרבה שור", "קרא התרנגול ואינו אומר קראו התרנגולים"]}]}, {"id": "32:6.3", "ch": 32, "v": 6, "n": 3, "dh": "ואשלחה להגיד לאדני", "pasuk_html": "וַֽיְהִי־לִי֙ שׁ֣וֹר וַחֲמ֔וֹר צֹ֖אן וְעֶ֣בֶד וְשִׁפְחָ֑ה <mark>וָֽאֶשְׁלְחָה֙ לְהַגִּ֣יד לַֽאדֹנִ֔י</mark> לִמְצֹא־חֵ֖ן בְּעֵינֶֽיךָ׃", "pasuk_en": "וַיְהִי־לִי שׁוֹר וַחֲמוֹר צֹאן וְעֶבֶד וְשִׁפְחָה וָאֶשְׁלְחָה לְהַגִּיד לַאדֹנִי לִמְצֹא־חֵן בְּעֵינֶיךָ׃", "rashi_he": "ואשלחה להגיד לאדני. לְהוֹדִיעַ שֶׁאֲנִי בָא אֵלֶיךָ:", "rashi_en": "רש״י מסביר שמטרת השליחות היתה להודיע לעשו שיעקב בא אליו.", "note": "", "points": [{"q": "מַה מַטָּרַת הַהַגָּדָה לַאֲדֹונִי, לְפִי רַשִׁ״י?", "options": ["לְהוֹדִיעַ לְעֵשָׂו שֶׁיַּעֲקֹב בָּא אֵלָיו", "לְבַקֵּשׁ רְשׁוּת מֵעֵשָׂו לְהִיכָּנֵס לָאָרֶץ", "לְהַזְהִיר אֶת עֵשָׂו שֶׁלֹּא יִלָּחֵם בּוֹ"], "kasha": "לשם מה שלח יעקב להגיד לעשו, ומה תוכן ההודעה?", "answer": "מטרת השליחה היתה להודיע לעשו שיעקב בא אליו.", "kp": ["להודיע שאני בא אליך"]}]}, {"id": "32:6.4", "ch": 32, "v": 6, "n": 4, "dh": "למצא חן בעיניך", "pasuk_html": "וַֽיְהִי־לִי֙ שׁ֣וֹר וַחֲמ֔וֹר צֹ֖אן וְעֶ֣בֶד וְשִׁפְחָ֑ה וָֽאֶשְׁלְחָה֙ לְהַגִּ֣יד לַֽאדֹנִ֔י <mark>לִמְצֹא־חֵ֖ן בְּעֵינֶֽיךָ׃</mark>", "pasuk_en": "וַיְהִי־לִי שׁוֹר וַחֲמוֹר צֹאן וְעֶבֶד וְשִׁפְחָה וָאֶשְׁלְחָה לְהַגִּיד לַאדֹנִי לִמְצֹא־חֵן בְּעֵינֶיךָ׃", "rashi_he": "למצא חן בעיניך. שֶׁאֲנִי שָׁלֵם עִמְּךָ וּמְבַקֵּשׁ אַהֲבָתְךָ:", "rashi_en": "רש״י מסביר ש״למצא חן בעיניך״ פירושו שיעקב שלם עם עשו ומבקש את אהבתו.", "note": "", "points": [{"q": "מַה כַּווָּנַת ״לִמְצֹא חֵן בְּעֵינֶיךָ״ לְפִי רַשִׁ״י?", "options": ["שֶׁיַּעֲקֹב שָׁלֵם עִם עֵשָׂו וּמְבַקֵּשׁ אַהֲבָתוֹ", "שֶׁיַּעֲקֹב מְבַקֵּשׁ מֵעֵשָׂו מַתָּנוֹת וּרְכוּשׁ", "שֶׁיַּעֲקֹב מִתְחַנֵּן שֶׁעֵשָׂו לֹא יַהַרְגֵהוּ"], "kasha": "מה משמעות הביטוי ״למצא חן בעיניך״ בהקשר של שליחות יעקב לעשו?", "answer": "יעקב מודיע לעשו שהוא שלם עמו ומבקש את אהבתו.", "kp": ["שאני שלם עמך ומבקש אהבתך"]}]}, {"id": "32:7.1", "ch": 32, "v": 7, "n": 1, "dh": "באנו אל אחיך אל עשו", "pasuk_html": "וַיָּשֻׁ֙בוּ֙ הַמַּלְאָכִ֔ים אֶֽל־יַעֲקֹ֖ב לֵאמֹ֑ר <mark>בָּ֤אנוּ אֶל־אָחִ֙יךָ֙ אֶל־עֵשָׂ֔ו</mark> וְגַם֙ הֹלֵ֣ךְ לִקְרָֽאתְךָ֔ וְאַרְבַּע־מֵא֥וֹת אִ֖ישׁ עִמּֽוֹ׃", "pasuk_en": "וַיָּשֻׁבוּ הַמַּלְאָכִים אֶל־יַעֲקֹב לֵאמֹר בָּאנוּ אֶל־אָחִיךָ אֶל־עֵשָׂו וְגַם הֹלֵךְ לִקְרָאתְךָ וְאַרְבַּע־מֵאוֹת אִישׁ עִמּוֹ׃", "rashi_he": "באנו אל אחיך אל עשו. שֶׁהָיִיתָ אוֹמֵר אָחִי הוּא, אֲבָל הוּא נוֹהֵג עִמְּךָ כְּעֵשָׂו הָרָשָׁע, עוֹדֶנּוּ בְּשִׂנְאָתוֹ (בראשית רבה פ'):", "rashi_en": "רש״י מסביר שהמלאכים רמזו ליעקב: אתה קורא לו ״אחי״, אבל הוא נוהג כעשו הרשע ועדיין שונא אותך.", "note": "", "points": [{"q": "מַה רָמְזוּ הַמַּלְאָכִים בְּכֶפֶל הַלָּשׁוֹן ״אֶל אָחִיךָ אֶל עֵשָׂו״?", "options": ["אַתָּה קוֹרְאוֹ אָחִיךָ, אַךְ הוּא נוֹהֵג כְּעֵשָׂו הָרָשָׁע וְעוֹדֶנּוּ שׂוֹנְאֶךָ", "הֵם מַדְגִּישִׁים שֶׁעֵשָׂו אָכֵן אָחִיו וְרוֹצֶה שָׁלוֹם", "הֵם מַזְהִירִים שֶׁעֵשָׂו כְּבָר אֵינוֹ נֶחְשָׁב אָחִיו כְּלָל"], "kasha": "מדוע כפלו המלאכים ואמרו ״אל אחיך אל עשו״ — למה לא הספיק שם אחד?", "answer": "המלאכים רמזו: אתה אומר ״אחי הוא״, אבל הוא נוהג עמך כעשו הרשע ועודנו בשנאתו.", "kp": ["שהיית אומר אחי הוא", "נוהג עמך כעשו הרשע עודנו בשנאתו"]}]}, {"id": "32:8.1", "ch": 32, "v": 8, "n": 1, "dh": "ויירא ויצר", "pasuk_html": "וַיִּירָ֧א יַעֲקֹ֛ב מְאֹ֖ד וַיֵּ֣צֶר ל֑וֹ וַיַּ֜חַץ אֶת־הָעָ֣ם אֲשֶׁר־אִתּ֗וֹ וְאֶת־הַצֹּ֧אן וְאֶת־הַבָּקָ֛ר וְהַגְּמַלִּ֖ים לִשְׁנֵ֥י מַחֲנֽוֹת׃", "pasuk_en": "וַיִּירָא יַעֲקֹב מְאֹד וַיֵּצֶר לוֹ וַיַּחַץ אֶת־הָעָם אֲשֶׁר־אִתּוֹ וְאֶת־הַצֹּאן וְאֶת־הַבָּקָר וְהַגְּמַלִּים לִשְׁנֵי מַחֲנוֹת׃", "rashi_he": "ויירא ויצר. וַיִּירָא שֶׁמָּא יֵהָרֵג, וַיֵּצֶר לוֹ אִם יַהֲרֹג הוּא אֶת אֲחֵרִים (בראשית רבה ותנחומא):", "rashi_en": "רש״י מסביר שיש הבדל בין ״ויירא״ ל״ויצר לו״: יעקב פחד שמא ייהרג, והצטער שמא יצטרך להרוג אחרים.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ נֶאֶמְרוּ גַּם ״וַיִּירָא״ וְגַם ״וַיֵּצֶר לוֹ״?", "options": ["פַּחַד שֶׁייֵּהָרֵג, וְהִצְטַעֵר שֶׁמָּא יַהֲרֹוג אֲחֵרִים", "פַּחַד מֵעֵשָׂו, וְהִצְטַעֵר עַל עֲזִיבַת אֶרֶץ לָבָן", "פַּחַד עַל רְכוּשׁוֹ, וְהִצְטַעֵר עַל כְּבוֹד אָבִיו"], "kasha": "מדוע הכפילות בפסוק — הרי ״ויירא״ ו״ויצר לו״ לכאורה אומרים את אותו דבר.", "answer": "רש״י מחלק בין שני הביטויים: ״ויירא״ — שמא ייהרג, ״ויצר לו״ — שמא יהרוג הוא את אחרים.", "kp": ["ויירא שמא יהרג", "ויצר לו אם יהרג הוא את אחרים"]}]}, {"id": "32:9.1", "ch": 32, "v": 9, "n": 1, "dh": "המחנה האחת והכהו", "pasuk_html": "וַיֹּ֕אמֶר אִם־יָב֥וֹא עֵשָׂ֛ו אֶל־<mark>הַמַּחֲנֶ֥ה הָאַחַ֖ת וְהִכָּ֑הוּ</mark> וְהָיָ֛ה הַמַּחֲנֶ֥ה הַנִּשְׁאָ֖ר לִפְלֵיטָֽה׃", "pasuk_en": "וַיֹּאמֶר אִם־יָבוֹא עֵשָׂו אֶל־הַמַּחֲנֶה הָאַחַת וְהִכָּהוּ וְהָיָה הַמַּחֲנֶה הַנִּשְׁאָר לִפְלֵיטָה׃", "rashi_he": "המחנה האחת והכהו. מַחֲנֶה מְשַׁמֵּשׁ לְשׁוֹן זָכָר וּלְשׁוֹן נְקֵבָה, אִם תַּחֲנֶה עָלַי מַחֲנֶה (תהלים כ\"ז), הֲרֵי נְקֵבָה, הַמַּחֲנֶה הַזֶּה (בראשית ל\"ג), זָכָר, וְכֵן יֵשׁ שְׁאָר דְּבָרִים מְשַׁמְּשִׁים לְשׁוֹן זָכָר וּלְשׁוֹן נְקֵבָה, הַשֶּׁמֶשׁ יָצָא עַל הָאָרֶץ (בראשית י״ט:כ״ג), מִקְצֵה הַשָּׁמַיִם מוֹצָאוֹ (תהלים י\"ט), הֲרֵי לְשׁוֹן זָכָר; וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם (מלכים ב ג'), הֲרֵי לְשׁוֹן נְקֵבָה. וְכֵן רוּחַ, וְהִנֵּה רוּחַ גְּדוֹלָה בָּאָה, הֲרֵי לְשׁוֹן נְקֵבָה, וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת (איוב א'), הֲרֵי לְשׁוֹן זָכָר, וְרוּחַ גְּדוֹלָה וְחָזָק מְפָרֵק הָרִים (מלכים א' י\"ט), הֲרֵי לְשׁוֹן זָכָר וּלְשׁוֹן נְקֵבָה. וְכֵן אֵשׁ, וְאֵשׁ יָצְאָה מֵאֵת ה' (במדבר ט\"ז), לְשׁוֹן נְקֵבָה, אֵשׁ לֹהֵט (תהילים ק\"ד), לְשׁוֹן זָכָר:", "rashi_en": "רש״י מסביר שהמילה ״מחנה״ משמשת בלשון זכר ובלשון נקבה, ומביא דוגמאות נוספות של מילים כאלה: שמש, רוח ואש.", "note": "", "points": [{"q": "מַה רַשִׁ״י מְסַבֵּיר לְגַבֵּי הַמִּילָּה ״מַחֲנֶה״ בַּפָּסוּק?", "options": ["הִיא מְשַׁמֶּשֶׁת גַּם בִּלְשׁוֹן זָכָר וְגַם בִּלְשׁוֹן נְקֵבָה", "הִיא תָּמִיד בִּלְשׁוֹן נְקֵבָה כִּי מְדֻובָּר בִּקְבוּצָה", "הִיא תָּמִיד בִּלְשׁוֹן זָכָר כִּי מְדֻובָּר בְּמָקוֹם"], "kasha": "בפסוק כתוב ״האחת״ (נקבה) ו״והכהו״ (זכר) על אותה מילה ״מחנה״, וצריך ביאור.", "answer": "רש״י מבאר שהמילה ״מחנה״ משמשת בלשון זכר ובלשון נקבה, ומביא ראיות מפסוקים נוספים. כך גם שמש, רוח ואש.", "kp": ["מחנה משמש לשון זכר ולשון נקבה"]}]}, {"id": "32:9.2", "ch": 32, "v": 9, "n": 2, "dh": "והיה המחנה הנשאר לפליטה", "pasuk_html": "וַיֹּ֕אמֶר אִם־יָב֥וֹא עֵשָׂ֛ו אֶל־הַמַּחֲנֶ֥ה הָאַחַ֖ת וְהִכָּ֑הוּ <mark>וְהָיָ֛ה הַמַּחֲנֶ֥ה הַנִּשְׁאָ֖ר לִפְלֵיטָֽה׃</mark>", "pasuk_en": "וַיֹּאמֶר אִם־יָבוֹא עֵשָׂו אֶל־הַמַּחֲנֶה הָאַחַת וְהִכָּהוּ וְהָיָה הַמַּחֲנֶה הַנִּשְׁאָר לִפְלֵיטָה׃", "rashi_he": "והיה המחנה הנשאר לפליטה. עַל כָּרְחוֹ, כִּי אֶלָּחֵם עִמּוֹ. הִתְקִין עַצְמוֹ לִשְׁלֹשָׁה דְּבָרִים, לְדוֹרוֹן, לִתְפִלָּה וּלְמִלְחָמָה. לְדוֹרוֹן, וַתַּעֲבֹר הַמִּנְחָה עַל פָּנָיו; לִתְפִלָּה, אֱלֹהֵי אָבִי אַבְרָהָם; לְמִלְחָמָה, וְהָיָה הַמַּחֲנֶה הַנִּשְׁאָר לִפְלֵיטָה:", "rashi_en": "רש״י מסביר שיעקב התכונן לשלושה דברים: דורון, תפילה ומלחמה, וכל אחד מהם רמוז בפסוקים שלאחר מכן.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, לְאֵילּוּ שְׁלֹושָׁה דְּבָרִים הִתְקִין יַעֲקֹב אֶת עַצְמוֹ?", "options": ["דּוֹרוֹן, תְּפִילָּה וּמִלְחָמָה", "בְּרִיחָה, תְּפִילָּה וּפִיּוּס", "צוֹם, תְּפִילָּה וּצְדָקָה"], "kasha": "מדוע אמר יעקב ״והיה המחנה הנשאר לפליטה״ בביטחון כזה, הרי עדיין לא ידע מה יקרה.", "answer": "רש״י מפרש שיעקב אמר ״על כרחו כי אלחם עמו״ — כלומר התכונן גם למלחמה. בסך הכול התקין עצמו לשלושה דברים: דורון, תפילה ומלחמה.", "kp": ["התקין עצמו לשלשה דברים", "לדורון לתפלה ולמלחמה"]}]}, {"id": "32:10.1", "ch": 32, "v": 10, "n": 1, "dh": "ואלהי אבי יצחק", "pasuk_html": "וַיֹּאמֶר֮ יַעֲקֹב֒ אֱלֹהֵי֙ אָבִ֣י אַבְרָהָ֔ם <mark>וֵאלֹהֵ֖י אָבִ֣י יִצְחָ֑ק</mark> יְהוָ֞ה הָאֹמֵ֣ר אֵלַ֗י שׁ֧וּב לְאַרְצְךָ֛ וּלְמוֹלַדְתְּךָ֖ וְאֵיטִ֥יבָה עִמָּֽךְ׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק יְהוָה הָאֹמֵר אֵלַי שׁוּב לְאַרְצְךָ וּלְמוֹלַדְתְּךָ וְאֵיטִיבָה עִמָּךְ׃", "rashi_he": "ואלהי אבי יצחק. וּלְהַלָּן הוּא אוֹמֵר וּפַחַד יִצְחָק? וְעוֹד וּמַהוּ שֶׁחָזַר וְהִזְכִּיר שֵׁם הַמְיֻחָד? הָיָה לוֹ לִכְתֹּב הָאוֹמֵר אֵלַי שׁוּב לְאַרְצְךָ וְגוֹ'. אֶלָּא כָּךְ אָמַר יַעֲקֹב לִפְנֵי הַקָּבָּ\"ה, שְׁתֵּי הַבְטָחוֹת הִבְטַחְתַּנִי, אַחַת בְּצֵאתִי מִבֵּית אָבִי מִבְּאֵר שֶׁבַע, שֶׁאָמַרְתָּ לִי אֲנִי ה' אֱלֹהֵי אַבְרָהָם אָבִיךָ וֵאלֹהֵי יִצְחָק, וְשָׁם אָמַרְתָּ לִי וּשְׁמַרְתִּיךָ בְּכֹל אֲשֶׁר תֵּלֵךְ, וּבְבֵית לָבָן אָמַרְתָּ לִי (בראשית ל\"א) שׁוּב אֶל אֶרֶץ אֲבוֹתֶיךָ וּלְמוֹלַדְתֶּךָ וְאֶהְיֶה עִמָּךְ, וְשָׁם נִגְלֵיתָ אֵלַי בַּשֵּׁם הַמְיֻחָד לְבַדּוֹ, שֶׁנֶּאֱמַר וַיֹּאמֶר ה' אֶל יַעֲקֹב שׁוּב אֶל אֶרֶץ אֲבוֹתֶיךָ וְגוֹ', בִּשְׁתֵּי הַבְטָחוֹת אֵלּוּ אֲנִי בָא לְפָנֶיךָ:", "rashi_en": "רש״י מסביר שיעקב הזכיר את שם ה׳ פעמיים כי בא לפני הקב״ה בשתי הבטחות: אחת כשיצא מבאר שבע ואחת בבית לבן.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ חָזַר יַעֲקֹב וְהִזְכִּיר אֶת שֵׁם ה׳ בִּתְפִילָּתוֹ?", "options": ["כִּי בָּא לִפְנֵי ה׳ בִּשְׁתֵּי הַבְטָחוֹת שֶׁהִבְטִיחוֹ", "כִּי רָצָה לְהַדְגִּישׁ אֶת גְּדֻולַּת ה׳ בִּתְפִילָּתוֹ", "כִּי נָהַג כְּמִנְהַג אֲבוֹתָיו שֶׁהִזְכִּירוּ שֵׁם ה׳ פְּעָמַיִים"], "kasha": "מדוע יעקב חזר והזכיר את שם ה׳ המיוחד, ולא אמר בקצרה ״האומר אלי שוב לארצך״?", "answer": "רש״י מבאר שיעקב הזכיר שתי הבטחות שהבטיחו הקב״ה — אחת ביציאתו מבאר שבע ואחת בבית לבן — ובשתיהן בא לפניו.", "kp": ["שתי הבטחות הבטחתני", "בשתי הבטחות אלו אני בא לפניך"]}]}, {"id": "32:11.1", "ch": 32, "v": 11, "n": 1, "dh": "קטנתי מכל החסדים", "pasuk_html": "<mark>קָטֹ֜נְתִּי מִכֹּ֤ל הַחֲסָדִים֙</mark> וּמִכָּל־הָ֣אֱמֶ֔ת אֲשֶׁ֥ר עָשִׂ֖יתָ אֶת־עַבְדֶּ֑ךָ כִּ֣י בְמַקְלִ֗י עָבַ֙רְתִּי֙ אֶת־הַיַּרְדֵּ֣ן הַזֶּ֔ה וְעַתָּ֥ה הָיִ֖יתִי לִשְׁנֵ֥י מַחֲנֽוֹת׃", "pasuk_en": "קָטֹנְתִּי מִכֹּל הַחֲסָדִים וּמִכָּל־הָאֱמֶת אֲשֶׁר עָשִׂיתָ אֶת־עַבְדֶּךָ כִּי בְמַקְלִי עָבַרְתִּי אֶת־הַיַּרְדֵּן הַזֶּה וְעַתָּה הָיִיתִי לִשְׁנֵי מַחֲנוֹת׃", "rashi_he": "קטנתי מכל החסדים. נִתְמַעֲטוּ זְכֻיּוֹתַי עַל יְדֵי הַחֲסָדִים וְהָאֱמֶת שֶׁעָשִׂיתָ עִמִּי, לְכָךְ אֲנִי יָרֵא, שֶׁמָּא מִשֶּׁהִבְטַחְתַּנִי נִתְקַלְקַלְתִּי בְחֵטְא וְיִגְרֹם לִי לְהִמָּסֵר בְּיַד עֵשָׂו (שבת ל\"ב):", "rashi_en": "רש״י מסביר שיעקב לא אמר שהוא קטן או שפל, אלא שזכויותיו נתמעטו בגלל כל החסדים שקיבל מה׳. לכן הוא חושש שמא חטא בינתיים וייענש.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ אָמַר יַעֲקֹב 'קָטֹנְתִּי מִכֹּל הַחֲסָדִים'?", "options": ["זְכֻויּוֹתָיו נִתְמַעֲטוּ בִּגְלַל הַחֲסָדִים שֶׁקִּיבֵּל", "הוּא הִרְגִּישׁ קָטָן וְשָׁפָל מוּל גֹּודֶל הַחֲסָדִים", "הוּא חָשַׁשׁ שֶׁאֵינוֹ רָאוּי לְבַקֵּשׁ חֲסָדִים נוֹסָפִים"], "kasha": "מהי כוונת 'קטנתי' — הרי יעקב לא מדבר על גודלו או ערכו, אלא פונה לה׳ בתפילה?", "answer": "זכויותיו של יעקב נתמעטו על ידי החסדים שה׳ עשה עמו, ולכן הוא ירא שמא נתקלקל בחטא ויימסר ביד עשו.", "kp": ["נתמעטו זכיותי על ידי החסדים", "שמא משהבטחתני נתקלקלתי בחטא"]}]}, {"id": "32:11.2", "ch": 32, "v": 11, "n": 2, "dh": "ומכל האמת", "pasuk_html": "קָטֹ֜נְתִּי מִכֹּ֤ל הַחֲסָדִים֙ <mark>וּמִכָּל־הָ֣אֱמֶ֔ת</mark> אֲשֶׁ֥ר עָשִׂ֖יתָ אֶת־עַבְדֶּ֑ךָ כִּ֣י בְמַקְלִ֗י עָבַ֙רְתִּי֙ אֶת־הַיַּרְדֵּ֣ן הַזֶּ֔ה וְעַתָּ֥ה הָיִ֖יתִי לִשְׁנֵ֥י מַחֲנֽוֹת׃", "pasuk_en": "קָטֹנְתִּי מִכֹּל הַחֲסָדִים וּמִכָּל־הָאֱמֶת אֲשֶׁר עָשִׂיתָ אֶת־עַבְדֶּךָ כִּי בְמַקְלִי עָבַרְתִּי אֶת־הַיַּרְדֵּן הַזֶּה וְעַתָּה הָיִיתִי לִשְׁנֵי מַחֲנוֹת׃", "rashi_he": "ומכל האמת. אֲמִתַּת דְּבָרֶיךָ, שֶׁשָּׁמַרְתָּ לִי כָּל הַבְטָחוֹת שֶׁהִבְטַחְתַּנִי:", "rashi_en": "רש״י מפרש ש'אמת' כאן פירושה אמתת דבריו של ה׳ — כלומר שה׳ שמר ליעקב את כל ההבטחות שהבטיח לו.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מַהִי 'הָאֱמֶת' שֶׁיַּעֲקֹב מַזְכִּיר?", "options": ["שֶׁהַ׳ שָׁמַר אֶת כָּל הַהַבְטָחוֹת שֶׁהִבְטִיחַ לוֹ", "שֶׁיַּעֲקֹב תָּמִיד נָהַג בֶּאֱמֶת וְלֹא שִׁיקֵּר", "שֶׁהַ׳ שָׁפַט אוֹתוֹ בְּמִידַּת ן"]}]}, {"id": "32:12.1", "ch": 32, "v": 12, "n": 1, "dh": "מיד אחי מיד עשו", "pasuk_html": "הַצִּילֵ֥נִי נָ֛א <mark>מִיַּ֥ד אָחִ֖י מִיַּ֣ד עֵשָׂ֑ו</mark> כִּֽי־יָרֵ֤א אָנֹכִי֙ אֹת֔וֹ פֶּן־יָב֣וֹא וְהִכַּ֔נִי אֵ֖ם עַל־בָּנִֽים׃", "pasuk_en": "הַצִּילֵנִי נָא מִיַּד אָחִי מִיַּד עֵשָׂו כִּי־יָרֵא אָנֹכִי אֹתוֹ פֶּן־יָבוֹא וְהִכַּנִי אֵם עַל־בָּנִים׃", "rashi_he": "מיד אחי מיד עשו. מִיַּד אָחִי שֶׁאֵין נוֹהֵג עִמִּי כְאָח אֶלָּא כְעֵשָׂו הָרָשָׁע:", "rashi_en": "רש״י מסביר מדוע יעקב כפל את לשונו ואמר גם 'אחי' וגם 'עשו': כי עשו אינו נוהג עמו כאח, אלא כעשו הרשע.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ כָּפַל יַעֲקֹב וְאָמַר 'מִיַּד אָחִי מִיַּד עֵשָׂו'?", "options": ["כִּי עֵשָׂו אֵינוֹ נוֹהֵג עִמּוֹ כְּאָח אֶלָּא כְּרָשָׁע", "כְּדֵי לְהַדְגִּישׁ שֶׁעֵשָׂו חָזָק הֵן כְּאָח הֵן כְּאוֹיֵב", "כְּדֵי לְהַזְכִּיר לַה׳ שֶׁעֵשָׂו הוּא אָחִיו וְיֵשׁ לְרַחֵם עָלָיו"], "kasha": "מדוע יעקב כפל את הלשון ואמר 'מיד אחי' וגם 'מיד עשו', הרי הם אותו אדם?", "answer": "יעקב התכוון שעשו אינו נוהג עמו כאח, אלא כעשו הרשע, ולכן הזכיר את שני הצדדים.", "kp": ["שאין נוהג עמי כאח אלא כעשו הרשע"]}]}, {"id": "32:13.1", "ch": 32, "v": 13, "n": 1, "dh": "היטב איטיב", "pasuk_html": "וְאַתָּ֣ה אָמַ֔רְתָּ <mark>הֵיטֵ֥ב אֵיטִ֖יב</mark> עִמָּ֑ךְ וְשַׂמְתִּ֤י אֶֽת־זַרְעֲךָ֙ כְּח֣וֹל הַיָּ֔ם אֲשֶׁ֥ר לֹא־יִסָּפֵ֖ר מֵרֹֽב׃", "pasuk_en": "וְאַתָּה אָמַרְתָּ הֵיטֵב אֵיטִיב עִמָּךְ וְשַׂמְתִּי אֶת־זַרְעֲךָ כְּחוֹל הַיָּם אֲשֶׁר לֹא־יִסָּפֵר מֵרֹב׃", "rashi_he": "היטב איטיב. הֵיטֵב בִּזְכוּתְךָ, אֵיטִיב בִּזְכוּת אֲבוֹתֶיךָ (בראשית רבה):", "rashi_en": "רש״י מסביר שהכפילות \"היטב איטיב\" רומזת לשני מקורות זכות: \"היטב\" — בזכות יעקב עצמו, ו\"איטיב\" — בזכות אבותיו.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ נֶאֱמַר \"הֵיטֵב אֵיטִיב\" בְּלָשׁוֹן כְּפוּלָה?", "options": ["\"הֵיטֵב\" בִּזְכוּת יַעֲקֹב עַצְמוֹ, \"אֵיטִיב\" בִּזְכוּת אֲבוֹתָיו", "\"הֵיטֵב\" בָּעוֹלָם הַזֶּה, \"אֵיטִיב\" בָּעוֹלָם הַבָּא", "\"הֵיטֵב\" לְיַעֲקֹב, \"אֵיטִיב\" לְזַרְעוֹ אַחֲרָיו"], "kasha": "מדוע הכפיל הכתוב \"היטב איטיב\" במקום לומר פשוט \"איטיב עמך\"?", "answer": "הכפילות מלמדת על שני מקורות זכות: \"היטב\" בזכות יעקב עצמו, ו\"איטיב\" בזכות אבותיו.", "kp": ["היטב בזכותך איטיב בזכות אבותיך"]}]}, {"id": "32:13.2", "ch": 32, "v": 13, "n": 2, "dh": "ושמתי את זרעך כחול הים", "pasuk_html": "וְאַתָּ֣ה אָמַ֔רְתָּ הֵיטֵ֥ב אֵיטִ֖יב עִמָּ֑ךְ <mark>וְשַׂמְתִּ֤י אֶֽת־זַרְעֲךָ֙ כְּח֣וֹל הַיָּ֔ם</mark> אֲשֶׁ֥ר לֹא־יִסָּפֵ֖ר מֵרֹֽב׃", "pasuk_en": "וְאַתָּה אָמַרְתָּ הֵיטֵב אֵיטִיב עִמָּךְ וְשַׂמְתִּי אֶת־זַרְעֲךָ כְּחוֹל הַיָּם אֲשֶׁר לֹא־יִסָּפֵר מֵרֹב׃", "rashi_he": "ושמתי את זרעך כחול הים. וְהֵיכָן אָ\"לֹ כֵן, וַהֲלֹא לֹא אָ\"לֹ אֶלָּא וְהָיָה זַרְעֲךָ כַּעֲפַר הָאָרֶץ (שם כ\"ח)? אֶלָּא שֶׁאָ\"לֹ כִּי לֹא אֶעֱזָבְךָ עַד אֲשֶׁר אִם עָשִׂיתִי אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ (שם), וּלְאַבְרָהָם אָמַר וְהַרְבָּה אַרְבֶּה אֶת זַרְעֲךָ כְּכוֹכְבֵי הַשָּׁמַיִם וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם:", "rashi_en": "רש״י מקשה שהקב״ה לא הבטיח ליעקב ישירות שזרעו יהיה \"כחול הים\", אלא \"כעפר הארץ\". הוא מתרץ שהקב״ה הבטיח ליעקב לקיים את כל מה שדיבר, וכיוון שלאברהם הבטיח \"ככוכבי השמים וכחול אשר על שפת הים\", הרי שגם הבטחה זו כלולה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, כֵּיצַד אָמַר ה׳ לְיַעֲקֹב \"כְּחוֹל הַיָּם\" אִם הִבְטִיחַ לוֹ רַק \"כְּעַפַר הָאָרֶץ\"?", "options": ["ה׳ הִבְטִיחַ לְיַעֲקֹב לְקַיֵּים מַה שֶׁאָמַר לְאַבְרָהָם, שֶׁכָּלַל \"כְּחוֹל הַיָּם\"", "יַעֲקֹב קִיבֵּל הַבְטָחָה נוֹסֶפֶת בַּחֲלוֹם שֶׁלֹּא מְפֹורֶשֶׁת בַּתּוֹרָה", "\"כַּעֲפַר הָאָרֶץ\" וּ\"כְּחוֹל הַיָּם\" הֵם אוֹתוֹ דָּבָר בִּלְשׁוֹן אַחֶרֶת"], "kasha": "היכן מצינו שה׳ הבטיח ליעקב שזרעו יהיה \"כחול הים\"? הרי ליעקב נאמר רק \"כעפר הארץ\".", "answer": "ה׳ אמר ליעקב \"לא אעזבך עד אשר אם עשיתי את אשר דברתי לך\", ולאברהם הבטיח \"ככוכבי השמים וכחול אשר על שפת הים\", כך שההבטחה כוללת גם את מה שנאמר לאברהם.", "kp": ["שאל כי לא אעזבך עד אשר אם עשיתי את אשר דברתי לך", "ולאברהם אמר והרבה ארבה את זרעך ככוכבי השמים וכחול"]}]}, {"id": "32:14.1", "ch": 32, "v": 14, "n": 1, "dh": "הבא בידו", "pasuk_html": "וַיָּ֥לֶן שָׁ֖ם בַּלַּ֣יְלָה הַה֑וּא וַיִּקַּ֞ח מִן־<mark>הַבָּ֧א בְיָד֛וֹ</mark> מִנְחָ֖ה לְעֵשָׂ֥ו אָחִֽיו׃", "pasuk_en": "וַיָּלֶן שָׁם בַּלַּיְלָה הַהוּא וַיִּקַּח מִן־הַבָּא בְיָדוֹ מִנְחָה לְעֵשָׂו אָחִיו׃", "rashi_he": "הבא בידו. בִּרְשׁוּתוֹ, וְכֵן וַיִּקַּח אֶת כָּל אַרְצוֹ מִיָּדוֹ (במדבר כ\"א). וּמִ\"אַ מִן הַבָּא בְיָדוֹ – אֲבָנִים טוֹבוֹת וּמַרְגָלִיּוֹת, שֶׁאָדָם צָר בִּצְרוֹר וְנוֹשְׂאָם בְּיָדוֹ (דָּ\"אַ מִן הַבָּא בְיָדוֹ, מִן הַחֻלִּין, שֶׁנָּטַל מַעֲשֵׂר, כְּמָה דְּאַתְּ אָמַר עַשֵּׂר אֲעַשְּׂרֶנּוּ לָךְ, וַהֲדַר לָקַח מִנְחָה):", "rashi_en": "רש״י מפרש את \"הבא בידו\" בשני פירושים: לפי הפשט — מה שברשותו. לפי המדרש — אבנים טובות ומרגליות שאדם נושא בידו. ויש פירוש נוסף שנטל מן החולין לאחר שהפריש מעשר.", "note": "", "points": [{"q": "לְפִי הַפְּשָׁט בְּרַשׁ״י, מַה פֵּירוּשׁ \"הַבָּא בְיָדוֹ\"?", "options": ["מַה שֶּׁבִּרְשׁוּתוֹ וּבִבְעָלוּתוֹ", "אֲבָנִים טוֹבוֹת וּמַרְגָּלִיּוֹת שֶׁנָּשָׂא בְּיָדוֹ", "מַה שֶּׁנִּשְׁאַר אַחֲרֵי שֶׁהִפְרִישׁ מַעֲשֵׂר"], "kasha": "מה משמעות הביטוי \"הבא בידו\" — האם הכוונה ממש למה שהחזיק בידו?", "answer": "לפי הפשט, \"הבא בידו\" פירושו ברשותו, כמו \"ויקח את כל ארצו מידו\".", "kp": ["ברשותו", "ויקח את כל ארצו מידו"]}]}, {"id": "32:15.1", "ch": 32, "v": 15, "n": 1, "dh": "עזים מאתים ותישים עשרים", "pasuk_html": "<mark>עִזִּ֣ים מָאתַ֔יִם וּתְיָשִׁ֖ים עֶשְׂרִ֑ים</mark> רְחֵלִ֥ים מָאתַ֖יִם וְאֵילִ֥ים עֶשְׂרִֽים׃", "pasuk_en": "עִזִּים מָאתַיִם וּתְיָשִׁים עֶשְׂרִים רְחֵלִים מָאתַיִם וְאֵילִים עֶשְׂרִים׃", "rashi_he": "עזים מאתים ותישים עשרים. מָאתַיִם עִזִּים צְרִיכוֹת עֶשְׂרִים תְּיָשִׁים, וְכֵן כֻּלָּם, הַזְּכָרִים כְּדֵי צֹרֶךְ הַנְּקֵבוֹת; וּבִבְ\"רַ דּוֹרֵשׁ מִכָּאן לָעוֹנָה הָאֲמוּרָה בַּתּוֹרָה, הַטַּיָּלִים בְּכָל יוֹם, הַפּוֹעֲלִים שְׁתַּיִם בְּשַׁבָּת, הַחַמָּרִים אַחַת בְּשַׁבָּת, הַגַּמָּלִים אַחַת לִשְׁלֹשִׁים יוֹם, הַסַּפָּנִים אַחַת לְשִׁשָּׁה חֳדָשִׁים; וְאֵינִי יוֹדֵעַ לְכַוֵּן הַמִּדְרָשׁ הַזֶּה בְּכִוּוּן, אַךְ נִרְאֶה בְעֵינַי שֶׁלָּמַדְנוּ מִכָּאן שֶׁאֵין הָעוֹנָה שָׁוָה בְּכָל אָדָם אֶלָּא לְפִי טֹרַח הַמֻּטָּל עָלָיו, שֶׁמָּצִינוּ כָּאן שֶׁמָּסַר לְכָל תַּיִשׁ עֶשֶׂר עִזִּים וְכֵן לְכָל אַיִל; לְפִי שֶׁהֵם פְּנוּיִים מִמְּלָאכָה דַּרְכָּם לְהַרְבּוֹת תַּשְׁמִישׁ וּלְעַבֵּר עֶשֶׂר נְקֵבוֹת, וּבְהֵמָה מִשֶּׁנִּתְעַבְּרָה אֵינָהּ מְקַבֶּלֶת זָכָר, וּפָרִים שֶׁעוֹסְקִין בִּמְלָאכָה, לֹא מָסַר לְזָכָר אֶלָּא אַרְבַּע נְקֵבוֹת, וְלַחֲמוֹר שֶׁהוֹלֵךְ בְּדֶרֶךְ רְחוֹקָה שְׁתֵּי נְקֵבוֹת לְזָכָר, וְלַגְּמַלִּים שֶׁהוֹלְכִים דֶּרֶךְ יוֹתֵר רְחוֹקָה נְקֵבָה אַחַת לְזָכָר:", "rashi_en": "רש״י מסביר שמספר הזכרים נקבע לפי צורך הנקבות. מכאן דרשו חז״ל את דיני עונה: כל אדם לפי עיסוקו. הבטלנים — כל יום, הפועלים — פעמיים בשבוע, וכן הלאה. עיקר הלימוד הוא שככל שהטורח גדול יותר, העונה מועטת יותר.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מָה הַכְּלָל שֶׁנִּלְמַד מִיַּחַס הַזְּכָרִים לַנְּקֵבוֹת בַּמִּנְחָה?", "options": ["הָעוֹנָה תְּלוּיָה בַּטּוֹרַח — כְּכָל שֶׁהַמְּלָאכָה קָשָׁה יוֹתֵר, הָעוֹנָה מוּעֶטֶת יוֹתֵר", "יֵשׁ לָתֵת תָּמִיד עֶשֶׂר נְקֵבוֹת לְכָל זָכָר בְּכָל מִין", "מִסְפַּר בְּהֵמוֹת הַמִּנְחָה נִקְבַּע לְפִי עָושְׁרוֹ שֶׁל הַנּוֹתֵן"], "kasha": "מדוע יחס הזכרים לנקבות משתנה בין סוגי הבהמות במנחת יעקב?", "answer": "היחס תלוי בטורח המוטל על כל מין: בהמות פנויות ממלאכה — עשר נקבות לזכר, פרים העוסקים במלאכה — ארבע, חמורים ההולכים בדרך — שתיים, וגמלים ההולכים דרך רחוקה יותר — אחת.", "kp": ["שאין העונה שוה בכל אדם אלא לפי טרח המטל עליו"]}, {"q": "מַדּוּעַ לְפִי רַשִׁ״י מָסַר יַעֲקֹב לְכָל פַּר רַק אַרְבַּע נְקֵבוֹת, בְּעוֹד לְתַיִשׁ — עֶשֶׂר?", "options": ["פָּרִים עוֹסְקִים בִּמְלָאכָה וְלָכֵן מְמַעֲטִים בְּתַשְׁמִישׁ", "פָּרִים חַלָּשִׁים יוֹתֵר מִתְּייָשִׁים וְאֵינָם יְכוֹלִים לְהַרְבּוֹת", "מִסְפַּר הַפָּרוֹת בָּעֵדֶר הָיָה קָטָן יוֹתֵר מִלְּכַתְּחִילָּה"], "kasha": "מדוע יחס הפרים לפרות (1:4) שונה מיחס התיישים לעזים (1:10)?", "answer": "הפרים עוסקים במלאכה, ולכן דרכם למעט בתשמיש, ואינם מעברים אלא ארבע נקבות.", "kp": ["ופרים שעוסקין במלאכה לא מסר לזכר אלא ארבע נקבות"]}]}, {"id": "32:16.1", "ch": 32, "v": 16, "n": 1, "dh": "גמלים מיניקות שלשים, ובניהם", "pasuk_html": "גְּמַלִּ֧ים מֵינִיק֛וֹת וּבְנֵיהֶ֖ם שְׁלֹשִׁ֑ים פָּר֤וֹת אַרְבָּעִים֙ וּפָרִ֣ים עֲשָׂרָ֔ה אֲתֹנֹ֣ת עֶשְׂרִ֔ים וַעְיָרִ֖ם עֲשָׂרָֽה׃", "pasuk_en": "גְּמַלִּים מֵינִיקוֹת וּבְנֵיהֶם שְׁלֹשִׁים פָּרוֹת אַרְבָּעִים וּפָרִים עֲשָׂרָה אֲתֹנֹת עֶשְׂרִים וַעְיָרִם עֲשָׂרָה׃", "rashi_he": "גמלים מיניקות שלשים, ובניהם. עִמָּהֶם: וּמִ\"אַ: וּבְנֵיהֶם – בַּנָּאֵיהֶם, זָכָר כְּנֶגֶד נְקֵבָה, וּלְפִי שֶׁצָּנוּעַ בְּתַשְׁמִישׁ לֹא פִרְסְמוֹ הַכָּתוּב (בראשית רבה):", "rashi_en": "רש״י מביא שני פירושים ל״ובניהם״: פשוטו — הוולדות שעמהם. ולפי המדרש — ״בנאיהם״, היינו הזכרים, זכר כנגד כל נקבה. הטעם שהכתוב לא פירש את הזכרים בגלוי הוא שהגמל צנוע בתשמיש.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ, מַה פֵּירוּשׁ ״וּבְנֵיהֶם״ וּמַדּוּעַ לֹא פֹּורְשׁוּ בַּכָּתוּב?", "options": ["הַזְּכָרִים שֶׁכְּנֶגֶד הַנְּקֵבוֹת, וְלֹא פֵּורְשׁוּ כִּי הַגָּמָל צָנוּעַ בְּתַשְׁמִישׁ", "הַווְּלָדוֹת הַקְּטַנִּים, וְלֹא פֵּורְשׁוּ כִּי אֵין לָהֶם עֵרֶךְ כַּלְכָּלִי", "הָעוֹבְדִים שֶׁמְּטַפְּלִים בַּגְּמַלִּים, וְלֹא פֹּורְשׁוּ כִּי אֵינָם חֵלֶק מֵהַמִּנְחָה"], "kasha": "מדוע הכתוב מזכיר ״ובניהם״ סתם ולא מפרט את מספר הזכרים כפי שעשה בשאר המינים?", "answer": "לפי המדרש ״ובניהם״ היינו ״בנאיהם״ — הזכרים, זכר כנגד כל נקבה. הכתוב לא פירש אותם בגלוי כי הגמל צנוע בתשמיש.", "kp": ["בנאיהם זכר כנגד נקבה", "צנוע בתשמיש לא פרסמו הכתוב"]}]}, {"id": "32:16.2", "ch": 32, "v": 16, "n": 2, "dh": "ועירם", "pasuk_html": "גְּמַלִּ֧ים מֵינִיק֛וֹת וּבְנֵיהֶ֖ם שְׁלֹשִׁ֑ים פָּר֤וֹת אַרְבָּעִים֙ וּפָרִ֣ים עֲשָׂרָ֔ה אֲתֹנֹ֣ת עֶשְׂרִ֔ים <mark>וַעְיָרִ֖ם</mark> עֲשָׂרָֽה׃", "pasuk_en": "גְּמַלִּים מֵינִיקוֹת וּבְנֵיהֶם שְׁלֹשִׁים פָּרוֹת אַרְבָּעִים וּפָרִים עֲשָׂרָה אֲתֹנֹת עֶשְׂרִים וַעְיָרִם עֲשָׂרָה׃", "rashi_he": "ועירם. חֲמוֹרִים זְכָרִים:", "rashi_en": "רש״י מפרש ש״עירם״ הם חמורים זכרים.", "note": "", "points": [{"q": "מַהֵם ״עִירָם״ לְפִי רַשִׁ״י?", "options": ["חֲמוֹרִים זְכָרִים", "סְייָחִים צְעִירִים שֶׁל סוּסִים", "עִיזִּים זְכָרִים"], "kasha": "המילה ״עירם״ אינה מובנת מאליה וצריכה ביאור — מהו מין בעל החיים הזה?", "answer": "רש״י מפרש ש״עירם״ הם חמורים זכרים.", "kp": ["חמורים זכרים"]}]}, {"id": "32:17.1", "ch": 32, "v": 17, "n": 1, "dh": "עדר עדר לבדו", "pasuk_html": "וַיִּתֵּן֙ בְּיַד־עֲבָדָ֔יו <mark>עֵ֥דֶר עֵ֖דֶר לְבַדּ֑וֹ</mark> וַ֤יֹּאמֶר אֶל־עֲבָדָיו֙ עִבְר֣וּ לְפָנַ֔י וְרֶ֣וַח תָּשִׂ֔ימוּ בֵּ֥ין עֵ֖דֶר וּבֵ֥ין עֵֽדֶר׃", "pasuk_en": "וַיִּתֵּן בְּיַד־עֲבָדָיו עֵדֶר עֵדֶר לְבַדּוֹ וַיֹּאמֶר אֶל־עֲבָדָיו עִבְרוּ לְפָנַי וְרֶוַח תָּשִׂימוּ בֵּין עֵדֶר וּבֵין עֵדֶר׃", "rashi_he": "עדר עדר לבדו. כָּל מִין וָמִין לְעַצְמוֹ:", "rashi_en": "רש״י מפרש ש״עדר עדר לבדו״ פירושו שכל מין ומין של בהמות היה בנפרד.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ ״עֵדֶר עֵדֶר לְבַדּוֹ״ לְפִי רַשִׁ״י?", "options": ["כָּל מִין בְּהֵמָה הָלַךְ בְּנִפְרָד מֵהָאֲחֵרִים", "כָּל בְּהֵמָה הָלְכָה לְבַדָּהּ לְלֹא רוֹעֶה", "כָּל עֵדֶר חֻולַּק לִשְׁנֵי חֲלָקִים נִפְרָדִים"], "kasha": "מה הכוונה ב״עדר עדר לבדו״ — מהי החלוקה שיעקב עשה?", "answer": "רש״י מפרש שכל מין ומין הלך לעצמו, כלומר הפרידם לפי סוג הבהמה.", "kp": ["כל מין ומין לעצמו"]}]}, {"id": "32:17.2", "ch": 32, "v": 17, "n": 2, "dh": "עברו לפני", "pasuk_html": "וַיִּתֵּן֙ בְּיַד־עֲבָדָ֔יו עֵ֥דֶר עֵ֖דֶר לְבַדּ֑וֹ וַ֤יֹּאמֶר אֶל־עֲבָדָיו֙ <mark>עִבְר֣וּ לְפָנַ֔י</mark> וְרֶ֣וַח תָּשִׂ֔ימוּ בֵּ֥ין עֵ֖דֶר וּבֵ֥ין עֵֽדֶר׃", "pasuk_en": "וַיִּתֵּן בְּיַד־עֲבָדָיו עֵדֶר עֵדֶר לְבַדּוֹ וַיֹּאמֶר אֶל־עֲבָדָיו עִבְרוּ לְפָנַי וְרֶוַח תָּשִׂימוּ בֵּין עֵדֶר וּבֵין עֵדֶר׃", "rashi_he": "עברו לפני. דֶּרֶךְ יוֹם אוֹ פָּחוֹת וַאֲנִי אָבֹא אַחֲרֵיכֶם:", "rashi_en": "רש״י מפרש ש״עברו לפני״ פירושו שהעבדים ילכו לפניו במרחק של יום דרך או פחות, והוא יבוא אחריהם.", "note": "", "points": [{"q": "כַּמָּה מֶרְחָק צִיווָּה יַעֲקֹב שֶׁהָעֲבָדִים יַקְדִּימוּ לְפָנָיו?", "options": ["דֶּרֶךְ יוֹם אֶחָד אוֹ פָּחוֹת", "דֶּרֶךְ שְׁלֹושָׁה יָמִים", "דֶּרֶךְ שָׁעוֹת סְפוּרוֹת בִּלְבַד"], "kasha": "הביטוי ״עברו לפני״ סתום — באיזה מרחק ממנו היו העבדים אמורים ללכת?", "answer": "רש״י מפרש שהעבדים הלכו לפני יעקב מרחק של יום דרך או פחות, והוא בא אחריהם.", "kp": ["דרך יום או פחות", "ואני אבא אחריכם"]}]}, {"id": "32:17.3", "ch": 32, "v": 17, "n": 3, "dh": "ורוח תשימו", "pasuk_html": "וַיִּתֵּן֙ בְּיַד־עֲבָדָ֔יו עֵ֥דֶר עֵ֖דֶר לְבַדּ֑וֹ וַ֤יֹּאמֶר אֶל־עֲבָדָיו֙ עִבְר֣וּ לְפָנַ֔י <mark>וְרֶ֣וַח תָּשִׂ֔ימוּ</mark> בֵּ֥ין עֵ֖דֶר וּבֵ֥ין עֵֽדֶר׃", "pasuk_en": "וַיִּתֵּן בְּיַד־עֲבָדָיו עֵדֶר עֵדֶר לְבַדּוֹ וַיֹּאמֶר אֶל־עֲבָדָיו עִבְרוּ לְפָנַי וְרֶוַח תָּשִׂימוּ בֵּין עֵדֶר וּבֵין עֵדֶר׃", "rashi_he": "ורוח תשימו. עֵדֶר לִפְנֵי חֲבֵרוֹ מְלֹא עַיִן, כְּדֵי לְהַשְׂבִּיעַ עֵינוֹ שֶׁל אוֹתוֹ רָשָׁע וּלְתַוֵּהוּ עַל רִבּוּי הַדּוֹרוֹן:", "rashi_en": "רש״י מסביר שיעקב הרחיק כל עדר מחברו מלוא עיניים, כדי להשביע את עינו של עשו ולהדהים אותו בגודל המנחה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ צִיווָּה יַעֲקֹב לְהַשְׁאִיר רֶוַוח בֵּין עֵדֶר לְעֵדֶר?", "options": ["כְּדֵי לְהַשְׂבִּיעַ אֶת עֵינוֹ שֶׁל עֵשָׂו וּלְתֹוהוֹ עַל רֹוב הַדּוֹרוֹן", "כְּדֵי שֶׁהַבְּהֵמוֹת לֹא יִתְעַרְבְּבוּ זוֹ בָּזוֹ בַּדֶּרֶךְ", "כְּדֵי שֶׁעֵשָׂו יַחְשֹׁוב שֶׁמְּדֻובָּר בְּכַמָּה שׁוֹלְחִים שׁוֹנִים"], "kasha": "מדוע הקפיד יעקב לשלוח כל עדר בנפרד עם רווח ביניהם, ולא שלח הכול ביחד?", "answer": "יעקב רצה שעשו יראה עדר אחר עדר מלוא עיניים, כך שעינו תשבע וייתמה על גודל המנחה.", "kp": ["להשביע עינו של אותו רשע", "לתוהו על רבוי הדורון"]}]}, {"id": "32:18.1", "ch": 32, "v": 18, "n": 1, "dh": "למי אתה", "pasuk_html": "וַיְצַ֥ו אֶת־הָרִאשׁ֖וֹן לֵאמֹ֑ר כִּ֣י יִֽפְגָּשְׁךָ֞ עֵשָׂ֣ו אָחִ֗י וִשְׁאֵֽלְךָ֙ לֵאמֹ֔ר <mark>לְמִי־אַ֙תָּה֙</mark> וְאָ֣נָה תֵלֵ֔ךְ וּלְמִ֖י אֵ֥לֶּה לְפָנֶֽיךָ׃", "pasuk_en": "וַיְצַו אֶת־הָרִאשׁוֹן לֵאמֹר כִּי יִפְגָּשְׁךָ עֵשָׂו אָחִי וִשְׁאֵלְךָ לֵאמֹר לְמִי־אַתָּה וְאָנָה תֵלֵךְ וּלְמִי אֵלֶּה לְפָנֶיךָ׃", "rashi_he": "למי אתה. שֶׁל מִי אַתָּה, מִי שׁוֹלְחֲךָ, וְתַרְגּוּם דְּמָאן אַתְּ?", "rashi_en": "רש״י מפרש ש״למי אתה״ פירושו של מי אתה, כלומר מי שולחך, וכן תרגם אונקלוס: דמאן את.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מָה פֵּירוּשׁ הַשְּׁאֵלָה ״לְמִי אַתָּה״?", "options": ["שֶׁל מִי אַתָּה, כְּלוֹמַר מִי שׁוֹלַחֲךָ", "לְאָן אַתָּה הוֹלֵךְ וּמַה מַּטָּרַת דַּרְכֶּךָ", "מַה שִּׁמְךָ וּמֵאֵיזֶה מָקוֹם אַתָּה בָּא"], "kasha": "מהו הפירוש המדויק של ״למי אתה״ — האם זו שאלה על זהות העבד או על שולחו?", "answer": "רש״י מפרש ש״למי אתה״ פירושו של מי אתה, מי שולחך, וכתרגום אונקלוס: דמאן את.", "kp": ["של מי אתה מי שולחך"]}]}, {"id": "32:18.2", "ch": 32, "v": 18, "n": 2, "dh": "ולמי אלה לפניך", "pasuk_html": "וַיְצַ֥ו אֶת־הָרִאשׁ֖וֹן לֵאמֹ֑ר כִּ֣י יִֽפְגָּשְׁךָ֞ עֵשָׂ֣ו אָחִ֗י וִשְׁאֵֽלְךָ֙ לֵאמֹ֔ר לְמִי־אַ֙תָּה֙ וְאָ֣נָה תֵלֵ֔ךְ <mark>וּלְמִ֖י אֵ֥לֶּה לְפָנֶֽיךָ׃</mark>", "pasuk_en": "וַיְצַו אֶת־הָרִאשׁוֹן לֵאמֹר כִּי יִפְגָּשְׁךָ עֵשָׂו אָחִי וִשְׁאֵלְךָ לֵאמֹר לְמִי־אַתָּה וְאָנָה תֵלֵךְ וּלְמִי אֵלֶּה לְפָנֶיךָ׃", "rashi_he": "ולמי אלה לפניך. וְאֵלֶּה שֶׁלְּפָנֶיךָ שֶׁל מִי הֵם; לְמִי הַמִּנְחָה הַזֹּאת שְׁלוּחָה? לָמֶ\"ד מְשַׁמֶּשֶׁת בְּרֹאשׁ הַתֵּבָה בִּמְקוֹם שֶׁל, כְּמוֹ: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא (בראשית ל״א:מ״ג) – שֶׁלִּי הוּא; לַה' הָאָרֶץ וּמְלוֹאָהּ (תהילים כ\"ד) – שֶׁל ה':", "rashi_en": "רש״י מסביר ש״למי״ כאן פירושו ״של מי״, כלומר למי שייכת המנחה. הלמ״ד משמשת במקום ״של״, כמו ״לה׳ הארץ״ שפירושו של ה׳.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, כֵּיצַד מְשַׁמֶּשֶׁת הַלָּמֶ״ד בַּמִּילָּה ״וּלְמִי״ בַּפָּסוּק זֶה?", "options": ["הַלָּמֶ״ד מְשַׁמֶּשֶׁת בִּמְקוֹם ״שֶׁל״ — שֶׁל מִי אֵלֶּה", "הַלָּמֶ״ד מְצַיֶּינֶת כִּיּווּן — לְאָן הוֹלְכִים אֵלֶּה", "הַלָּמֶ״ד מְצַיֶּינֶת שַׁייָּכוּת שֶׁל קִנְיָין וּמְכִירָה"], "kasha": "מהו הפירוש המדויק של ״ולמי אלה לפניך״ — שאלה על הבעלות או על היעד?", "answer": "הלמ״ד משמשת כאן במקום ״של״, כלומר של מי הם אלה שלפניך, למי המנחה שלוחה. כמו ״לה׳ הארץ״ — של ה׳.", "kp": ["למד משמשת בראש התבה במקום של"]}]}, {"id": "32:19.1", "ch": 32, "v": 19, "n": 1, "dh": "ואמרת לעבדך ליעקב", "pasuk_html": "<mark>וְאָֽמַרְתָּ֙ לְעַבְדְּךָ֣ לְיַעֲקֹ֔ב</mark> מִנְחָ֥ה הִוא֙ שְׁלוּחָ֔ה לַֽאדֹנִ֖י לְעֵשָׂ֑ו וְהִנֵּ֥ה גַם־ה֖וּא אַחֲרֵֽינוּ׃", "pasuk_en": "וְאָמַרְתָּ לְעַבְדְּךָ לְיַעֲקֹב מִנְחָה הִוא שְׁלוּחָה לַאדֹנִי לְעֵשָׂו וְהִנֵּה גַם־הוּא אַחֲרֵינוּ׃", "rashi_he": "ואמרת לעבדך ליעקב. עַל רִאשׁוֹן רִאשׁוֹן וְעַל אַחֲרוֹן אַחֲרוֹן; שֶׁשָּׁאַלְתָּ לְמִי אַתָּה? לְעַבְדְּךָ לְיַעֲקֹב אֲנִי – וְתַרְגּוּמוֹ דְּעַבְדָּךְ דְּיַעֲקֹב – וְשֶׁשָּׁאַלְתָּ וּלְמִי אֵלֶּה לְפָנֶיךָ, מִנְחָה הִיא שְׁלוּחָה וְגוֹ':", "rashi_en": "רש״י מסביר שסדר התשובה מתאים לסדר השאלות: על השאלה הראשונה ״למי אתה״ — לעבדך ליעקב; ועל השאלה האחרונה ״ולמי אלה״ — מנחה היא שלוחה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, כֵּיצַד מִתְייַחֲסוֹת תְּשׁוּבוֹת הָעֶבֶד לְשַׁאֵלוֹת עֵשָׂו?", "options": ["עַל הָרִאשׁוֹנָה רִאשׁוֹן וְעַל הָאַחֲרוֹנָה אַחֲרוֹן, לְפִי סֵדֶר הַשְּׁאֵלוֹת", "הָעֶבֶד עָנָה רַק עַל הַשְּׁאֵלָה הַחֲשׁוּבָה בְּיוֹתֵר וְהִתְעַלֵּם מֵהַשְּׁאָר", "הָעֶבֶד שִׁינָּה אֶת הַסֵּדֶר וְעָנָה עַל הָאַחֲרוֹנָה תְּחִילָּה"], "kasha": "מדוע מפרט הפסוק את התשובה בסדר מסוים ולא מקצר?", "answer": "רש״י מסביר שהתשובה עונה על כל שאלה לפי סדרה: על ״למי אתה״ — לעבדך ליעקב, ועל ״ולמי אלה״ — מנחה היא שלוחה.", "kp": ["על ראשון ראשון ועל אחרון אחרון"]}]}, {"id": "32:19.2", "ch": 32, "v": 19, "n": 2, "dh": "והנה גם הוא", "pasuk_html": "וְאָֽמַרְתָּ֙ לְעַבְדְּךָ֣ לְיַעֲקֹ֔ב מִנְחָ֥ה הִוא֙ שְׁלוּחָ֔ה לַֽאדֹנִ֖י לְעֵשָׂ֑ו <mark>וְהִנֵּ֥ה גַם־ה֖וּא</mark> אַחֲרֵֽינוּ׃", "pasuk_en": "וְאָמַרְתָּ לְעַבְדְּךָ לְיַעֲקֹב מִנְחָה הִוא שְׁלוּחָה לַאדֹנִי לְעֵשָׂו וְהִנֵּה גַם־הוּא אַחֲרֵינוּ׃", "rashi_he": "והנה גם הוא. יַעֲקֹב:", "rashi_en": "רש״י מבהיר שהמילים \"גם הוא\" בפסוק מתייחסות ליעקב עצמו, שגם הוא הולך אחרי המנחה.", "note": "", "points": [{"q": "לְמִי מִתְייַחֲסוֹת הַמִּילִּים \"גַם־הוּא אַחֲרֵינוּ\" לְפִי רַשִׁ״י?", "options": ["לְיַעֲקֹב", "לְעֵשָׂו", "לְאֶחָד מִן הָעֲבָדִים"], "kasha": "לא ברור למי מתייחס הכינוי \"הוא\" בפסוק.", "answer": "רש״י מפרש ש\"גם הוא\" מתייחס ליעקב, כלומר יעקב עצמו בא אחרי המנחה.", "kp": ["יעקב"]}]}, {"id": "32:21.1", "ch": 32, "v": 21, "n": 1, "dh": "אכפרה פניו", "pasuk_html": "וַאֲמַרְתֶּ֕ם גַּ֗ם הִנֵּ֛ה עַבְדְּךָ֥ יַעֲקֹ֖ב אַחֲרֵ֑ינוּ כִּֽי־אָמַ֞ר <mark>אֲכַפְּרָ֣ה פָנָ֗יו</mark> בַּמִּנְחָה֙ הַהֹלֶ֣כֶת לְפָנָ֔י וְאַחֲרֵי־כֵן֙ אֶרְאֶ֣ה פָנָ֔יו אוּלַ֖י יִשָּׂ֥א פָנָֽי׃", "pasuk_en": "וַאֲמַרְתֶּם גַּם הִנֵּה עַבְדְּךָ יַעֲקֹב אַחֲרֵינוּ כִּי־אָמַר אֲכַפְּרָה פָנָיו בַּמִּנְחָה הַהֹלֶכֶת לְפָנָי וְאַחֲרֵי־כֵן אֶרְאֶה פָנָיו אוּלַי יִשָּׂא פָנָי׃", "rashi_he": "אכפרה פניו. אֲבַטֵּל רָגְזוֹ; וְכֵן וְכֻפַּר בְּרִיתְכֶם אֶת מָוֶת (ישעיהו כ\"ח), לֹא תוּכְלִי כַּפְּרָהּ (שם מ\"ז). וְנִרְאֶה בְעֵינַי שֶׁכָּל כַּפָּרָה שֶׁאֵצֶל עָוֹן וְחֵטְא וְאֵצֶל פָּנִים כֻּלָּן לְשׁוֹן קִנּוּחַ וְהַעֲבָרָה הֵן, וְלָשׁוֹן אֲרַמִּי הוּא, וְהַרְבֵּה בַּתַּלְמוּד וְכַפֵּר יְדֵיהּ, בָּעֵי לְכַפּוּרֵי יְדֵי בְּהַהוּא גַבְרָא, וְגַם בִּלְשׁוֹן הַמִּקְרָא נִקְרָאִים הַמִּזְרָקִים שֶׁל קֹדֶשׁ כְּפוֹרֵי זָהָב (עזרא א'), עַל שֵׁם שֶׁהַכֹּהֵן מְקַנֵּחַ יָדָיו בָּהֶן בִּשְׂפַת הַמִּזְרָק:", "rashi_en": "רש״י מסביר שהמילה \"אכפרה\" פירושה אבטל את כעסו של עשו. לשון כפרה ליד עוון או פנים משמעה קינוח והעברה, והיא לשון ארמית. גם כלי המקדש נקראו \"כפורי זהב\" כי הכהן היה מקנח בהם ידיו.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה \"אֲכַפְּרָה\" בַּפָּסוּק?", "options": ["אֲבַטֵּל אֶת כַּעֲסוֹ — לְשׁוֹן קִינּוּחַ וְהַעֲבָרָה", "אֲבַקֵּשׁ מִמֶּנּוּ סְלִיחָה וּמְחִילָה", "אֶתֵּן לוֹ כֹּופֶר וְתַשְׁלוּם"], "kasha": "המילה \"אכפרה\" קשורה בדרך כלל לכפרת חטאים, ולא ברור מה משמעותה כאן ביחס לפנים.", "answer": "רש״י מפרש שאכפרה פניו היינו אבטל רגזו. כל כפרה אצל עוון או פנים היא לשון קינוח והעברה, מלשון ארמית.", "kp": ["אבטל רגזו", "לשון קנוח והעברה", "לשון ארמי"]}, {"q": "מַה הָרְאָיָה שֶׁרַשִׁ״י מֵבִיא מִכְּלֵי הַמִּקְדָּשׁ לְפֵירוּשׁוֹ?", "options": ["כְּפוֹרֵי זָהָב — שֶׁהַכֹּהֵן מְקַנֵּחַ בָּהֶם יָדָיו בִּשְׂפַת הַמִּזְרָק", "כְּלֵי הַזָּהָב כִּיפְּרוּ עַל חַטָּאֵי יִשְׂרָאֵל", "כְּלֵי הַמִּקְדָּשׁ נוֹעֲדוּ לְכַפָּרָה עַל עֲוֹונוֹת"], "kasha": "רש״י צריך להוכיח שלשון \"כפרה\" משמעה קינוח והעברה, ולא רק סליחה.", "answer": "כלי המקדש נקראו כפורי זהב על שם שהכהן מקנח ידיו בהם בשפת המזרק, וזו ראיה שכפרה פירושה קינוח.", "kp": ["כפורי זהב", "שהכהן מקנח ידיו בהן בשפת המזרק"]}]}, {"id": "32:22.1", "ch": 32, "v": 22, "n": 1, "dh": "על פניו", "pasuk_html": "וַתַּעֲבֹ֥ר הַמִּנְחָ֖ה <mark>עַל־פָּנָ֑יו</mark> וְה֛וּא לָ֥ן בַּלַּֽיְלָה־הַה֖וּא בַּֽמַּחֲנֶֽה׃", "pasuk_en": "וַתַּעֲבֹר הַמִּנְחָה עַל־פָּנָיו וְהוּא לָן בַּלַּיְלָה־הַהוּא בַּמַּחֲנֶה׃", "rashi_he": "על פניו. כְּמוֹ לְפָנָיו, וְכֵן חָמָס וָשֹׁד יִשָּׁמַע בָּהּ עַל פָּנַי תָּמִיד (ירמיהו ו'), וְכֵן הַמַּכְעִסִים אֹתִי עַל פָּנַי (ישעיהו ס\"ה); וּמִ\"אַ עַל פָּנָיו, אַף הוּא שָׁרוּי בְּכַעַס, שֶׁהָיָה צָרִיךְ לְכָל זֶה (בראשית רבה):", "rashi_en": "רש״י מפרש את \"על פניו\" כמו \"לפניו\", ומביא פסוקים נוספים שבהם \"על פני\" משמעו \"לפני\". המדרש מפרש שיעקב היה שרוי בכעס על שנזקק לכל זה.", "note": "", "points": [{"q": "מַהוּ הַפְּשָׁט שֶׁל \"עַל־פָּנָיו\" לְפִי רַשִׁ״י?", "options": ["כְּמוֹ \"לְפָנָיו\" — הַמִּנְחָה עָבְרָה לְפָנָיו", "יַעֲקֹב הָיָה כּוֹעֵס עַל שֶׁנִּזְקַק לְכָךְ", "הַמִּנְחָה עָבְרָה מוּל פְּנֵי עֵשָׂו"], "kasha": "הביטוי \"על פניו\" אינו שגור במשמעות של \"לפניו\", וצריך ביאור.", "answer": "רש״י מפרש ש\"על פניו\" כמו \"לפניו\", ומביא ראיות מפסוקים בירמיהו ובישעיהו.", "kp": ["כמו לפניו"]}, {"q": "מַה מוֹסִיף הַמִּדְרָשׁ עַל פְּשַׁט הַפָּסוּק?", "options": ["יַעֲקֹב הָיָה שָׁרוּי בְּכַעַס עַל שֶׁנִּזְקַק לְכָל זֶה", "עֵשָׂו כָּעַס כְּשֶׁרָאָה אֶת הַמִּנְחָה מוּלוֹ", "הַמִּנְחָה עָבְרָה עַל פָּנָיו שֶׁל עֵשָׂו מַמָּשׁ"], "kasha": "רש״י מביא גם מדרש בנוסף לפשט, ויש להבין מה המדרש דורש מן הלשון.", "answer": "לפי המדרש, \"על פניו\" רומז שגם יעקב עצמו היה שרוי בכעס על שהיה צריך לכל זה.", "kp": ["אף הוא שרוי בכעס", "שהיה צריך לכל זה"]}]}, {"id": "32:23.1", "ch": 32, "v": 23, "n": 1, "dh": "ואת אחד עשר ילדיו", "pasuk_html": "וַיָּ֣קָם ׀ בַּלַּ֣יְלָה ה֗וּא וַיִּקַּ֞ח אֶת־שְׁתֵּ֤י נָשָׁיו֙ וְאֶת־שְׁתֵּ֣י שִׁפְחֹתָ֔יו <mark>וְאֶת־אַחַ֥ד עָשָׂ֖ר יְלָדָ֑יו</mark> וַֽיַּעֲבֹ֔ר אֵ֖ת מַעֲבַ֥ר יַבֹּֽק׃", "pasuk_en": "וַיָּקָם בַּלַּיְלָה הוּא וַיִּקַּח אֶת־שְׁתֵּי נָשָׁיו וְאֶת־שְׁתֵּי שִׁפְחֹתָיו וְאֶת־אַחַד עָשָׂר יְלָדָיו וַיַּעֲבֹר אֵת מַעֲבַר יַבֹּק׃", "rashi_he": "ואת אחד עשר ילדיו. וְדִינָה הֵיכָן הָיְתָה? נְתָנָהּ בְּתֵבָה וְנָעַל בְּפָנֶיהָ, שֶׁלֹּא יִתֵּן בָּהּ עֵשָׂו עֵינָיו, וּלְכָךְ נֶעֱנַשׁ יַעֲקֹב שֶׁמְּנָעָהּ מֵאָחִיו, שֶׁמָּא תַּחֲזִירֶנּוּ לַמּוּטָב, וְנָפְלָה בְּיַד שְׁכֶם (בראשית רבה):", "rashi_en": "רש״י שואל היכן היתה דינה, שהרי נמנו רק אחד עשר ילדים. הוא מסביר שיעקב הטמין אותה בתיבה ונעל בפניה כדי שעשו לא יתן בה עיניו. על כך נענש יעקב, שמא היתה מחזירה את עשו למוטב, ונפלה ביד שכם.", "note": "", "points": [{"q": "מַדּוּעַ נֶעֱנַשׁ יַעֲקֹב עַל שֶׁהֶחְבִּיא אֶת דִּינָה, לְפִי רַשִׁ״י?", "options": ["שֶׁמָּא הָיְתָה מַחֲזִירָה אֶת עֵשָׂו לְמוּטָב", "כִּי שִׁיקֵּר לְעֵשָׂו לְגַבֵּי מִסְפַּר יְלָדָיו", "כִּי לֹא בָּטַח בַּהקב״ה שֶׁיִּשְׁמוֹר עָלֶיהָ"], "kasha": "הפסוק מונה רק אחד עשר ילדים, אף שליעקב היתה גם דינה, ולא ברור מדוע חסרה.", "answer": "יעקב נתן את דינה בתיבה ונעל בפניה שלא יתן בה עשו עיניו. נענש על שמנעה מאחיו, שמא היתה מחזירתו למוטב, ונפלה ביד שכם.", "kp": ["נתנה בתבה ונעל בפניה", "שמא תחזירנו למוטב", "ונפלה ביד שכם"]}]}, {"id": "32:23.2", "ch": 32, "v": 23, "n": 2, "dh": "יבק", "pasuk_html": "וַיָּ֣קָם ׀ בַּלַּ֣יְלָה ה֗וּא וַיִּקַּ֞ח אֶת־שְׁתֵּ֤י נָשָׁיו֙ וְאֶת־שְׁתֵּ֣י שִׁפְחֹתָ֔יו וְאֶת־אַחַ֥ד עָשָׂ֖ר יְלָדָ֑יו וַֽיַּעֲבֹ֔ר אֵ֖ת מַעֲבַ֥ר <mark>יַבֹּֽק׃</mark>", "pasuk_en": "וַיָּקָם בַּלַּיְלָה הוּא וַיִּקַּח אֶת־שְׁתֵּי נָשָׁיו וְאֶת־שְׁתֵּי שִׁפְחֹתָיו וְאֶת־אַחַד עָשָׂר יְלָדָיו וַיַּעֲבֹר אֵת מַעֲבַר יַבֹּק׃", "rashi_he": "יבק. שֵׁם הַנָּהָר:", "rashi_en": "רש״י מבהיר שיבק הוא שם הנהר שיעקב עבר אותו.", "note": "", "points": [{"q": "מַה רַשִׁ״י מְסַבֵּיר לְגַבֵּי הַמִּילָּה 'יַבֹּק'?", "options": ["יַבֹּק הוּא שֵׁם הַנָּהָר", "יַבֹּק הוּא שֵׁם הַמָּקוֹם שֶׁבּוֹ חָנָה יַעֲקֹב", "יַבֹּק פֵּירוּשׁוֹ מַעֲבָר צַר בֵּין הָרִים"], "kasha": "המילה 'יבק' אינה מוכרת, ולא ברור מהי.", "answer": "רש״י מפרש שיבק הוא שם הנהר.", "kp": ["שם הנהר"]}]}, {"id": "32:24.1", "ch": 32, "v": 24, "n": 1, "dh": "את אשר לו", "pasuk_html": "וַיִּקָּחֵ֔ם וַיַּֽעֲבִרֵ֖ם אֶת־הַנָּ֑חַל וַֽיַּעֲבֵ֖ר <mark>אֶת־אֲשֶׁר־לוֹ׃</mark>", "pasuk_en": "וַיִּקָּחֵם וַיַּעֲבִרֵם אֶת־הַנָּחַל וַיַּעֲבֵר אֶת־אֲשֶׁר־לוֹ׃", "rashi_he": "את אשר לו. הַבְּהֵמָה וְהַמִּטַּלְטְלִים; עָשָׂה עַצְמוֹ כְּגַשָּׁר נוֹטֵל מִכָּאן וּמַנִּיחַ כָּאן (בראשית רבה):", "rashi_en": "רש״י מפרש ש'את אשר לו' הכוונה לבהמות ולמטלטלין, ושיעקב עשה עצמו כגשר — נטל מצד אחד והניח בצד השני.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מָה פֵּירוּשׁ 'אֶת אֲשֶׁר לוֹ'?", "options": ["הַבְּהֵמָה וְהַמִּטַּלְטְלִין", "נָשָׁיו וִילָדָיו", "כְּלֵי הַמִּלְחָמָה שֶׁלּוֹ"], "kasha": "הביטוי 'את אשר לו' סתמי, ולא ברור למה הוא מתייחס.", "answer": "רש״י מפרש ש'את אשר לו' הכוונה לבהמה ולמטלטלין.", "kp": ["הבהמה והמטלטלים"]}, {"q": "כֵּיצַד רַשִׁ״י מְתָאֵר אֶת אֹופֶן הַהַעֲבָרָה שֶׁל יַעֲקֹב?", "options": ["עָשָׂה עַצְמוֹ כְּגֶשֶׁר, נוֹטֵל מִכָּאן וּמַנִּיחַ כָּאן", "הֶעֱבִיר הַכֹּל בְּבַת אַחַת עַל גַּבֵּי עֲגָלוֹת", "בָּנָה רַפְסוֹדָה וְהִשִּׁיט עָלֶיהָ אֶת הָרְכוּשׁ"], "kasha": "הפסוק אומר 'ויעבר' בלשון יחיד, ולא ברור כיצד בפועל העביר יעקב את כל רכושו.", "answer": "לפי המדרש, יעקב עשה עצמו כגשר — נטל מצד זה והניח בצד זה.", "kp": ["עשה עצמו כגשר", "נוטל מכאן ומניח כאן"]}]}, {"id": "32:25.1", "ch": 32, "v": 25, "n": 1, "dh": "ויותר יעקב", "pasuk_html": "<mark>וַיִּוָּתֵ֥ר יַעֲקֹ֖ב</mark> לְבַדּ֑וֹ וַיֵּאָבֵ֥ק אִישׁ֙ עִמּ֔וֹ עַ֖ד עֲל֥וֹת הַשָּֽׁחַר׃", "pasuk_en": "וַיִּוָּתֵר יַעֲקֹב לְבַדּוֹ וַיֵּאָבֵק אִישׁ עִמּוֹ עַד עֲלוֹת הַשָּׁחַר׃", "rashi_he": "ויותר יעקב. שָׁכַח פַּכִּים קְטַנִּים וְחָזַר עֲלֵיהֶם (חולין צ\"א):", "rashi_en": "רש״י מסביר שיעקב נשאר לבדו כי שכח פכים קטנים וחזר לקחתם.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ נוֹתַר יַעֲקֹב לְבַדּוֹ?", "options": ["שָׁכַח פַּכִּים קְטַנִּים וְחָזַר עֲלֵיהֶם", "רָצָה לְהִתְפַּלֵּל בְּיִחִידוּת לִפְנֵי הַמִּפְגָּשׁ עִם עֵשָׂו", "נִשְׁאַר לִשְׁמֹור עַל הַמַּחֲנֶה הָאַחֲרוֹן"], "kasha": "לא ברור מדוע נשאר יעקב לבדו אחרי שכבר העביר את כל משפחתו ורכושו.", "answer": "רש״י מביא מחז״ל שיעקב שכח פכים קטנים וחזר עליהם, ולכן נותר לבדו.", "kp": ["שכח פכים קטנים", "וחזר עליהם"]}]}, {"id": "32:25.2", "ch": 32, "v": 25, "n": 2, "dh": "ויאבק איש", "pasuk_html": "וַיִּוָּתֵ֥ר יַעֲקֹ֖ב לְבַדּ֑וֹ <mark>וַיֵּאָבֵ֥ק אִישׁ֙</mark> עִמּ֔וֹ עַ֖ד עֲל֥וֹת הַשָּֽׁחַר׃", "pasuk_en": "וַיִּוָּתֵר יַעֲקֹב לְבַדּוֹ וַיֵּאָבֵק אִישׁ עִמּוֹ עַד עֲלוֹת הַשָּׁחַר׃", "rashi_he": "ויאבק איש. מְנַחֵם פֵּי' וַיִּתְעַפֵּר אִישׁ, לְשׁוֹן אָבָק, שֶׁהָיוּ מַעֲלִים עָפָר בְּרַגְלֵיהֶם עַ\"י נִעְנוּעָם. וְלִי נִרְאֶה שֶׁהוּא לְשׁוֹן וַיִּתְקַשֵּׁר, וְלָשׁוֹן אֲרַמִּי הוּא, בָּתַר דַּאֲבִיקוּ בֵיהּ, וַאֲבֵיק לֵיהּ מֵיבַק – לְשׁוֹן עֲנִיבָה, שֶׁכֵּן דֶּרֶךְ שְׁנַיִם שֶׁמִּתְעַצְּמִים לְהַפִּיל אִישׁ אֶת רֵעֵהוּ, שֶׁחוֹבְקוֹ וְאוֹבְקוֹ בִּזְרוֹעוֹתָיו. וּפֵרְשׁוּ רַזִ\"לִ שֶׁהוּא שָׂרוֹ שֶׁל עֵשָׂו (בראשית רבה):", "rashi_en": "רש״י מביא שני פירושים ל'ויאבק': מנחם פירש מלשון אבק (עפר), ורש״י עצמו סובר שהוא מלשון קשירה וחיבוק בארמית. חז״ל פירשו שהאיש הוא שרו של עשו.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ 'וַיֵּאָבֵק' לְדַעַת רַשִׁ״י עַצְמוֹ?", "options": ["לְשׁוֹן הִתְקַשְּׁרוּת וְחִיבּוּק, מֵאֲרַמִּית", "לְשׁוֹן אָבָק וְעָפָר שֶׁהֶעֱלוּ בְּרַגְלֵיהֶם", "לְשׁוֹן מַכָּה וְהִתְנַגְּשׁוּת"], "kasha": "המילה 'ויאבק' אינה שכיחה במקרא, ופירושה טעון הסבר.", "answer": "רש״י סובר שהמילה מלשון התקשרות בארמית, כדרך שניים שנאבקים וחובקים זה את זה בזרועותיהם.", "kp": ["לשון ויתקשר", "לשון ארמי הוא"]}, {"q": "מִיהוּ הָ'אִישׁ' שֶׁנֶּאֱבַק עִם יַעֲקֹב, לְפִי חַז״ל שֶׁרַשִׁ״י מֵבִיא?", "options": ["שָׂרוֹ שֶׁל עֵשָׂו", "עֵשָׂו בְּעַצְמוֹ", "מַלְאָךְ שֶׁנִּשְׁלַח מֵאֵת ה׳ לְנַסּוֹתוֹ"], "kasha": "הפסוק אומר סתם 'איש' ולא מזהה מי הוא.", "answer": "חז״ל פירשו שהאיש שנאבק עם יעקב הוא שרו של עשו.", "kp": ["שרו של עשו"]}]}, {"id": "32:26.1", "ch": 32, "v": 26, "n": 1, "dh": "ויגע בכף ירכו", "pasuk_html": "וַיַּ֗רְא כִּ֣י לֹ֤א יָכֹל֙ ל֔וֹ <mark>וַיִּגַּ֖ע בְּכַף־יְרֵכ֑וֹ</mark> וַתֵּ֙קַע֙ כַּף־יֶ֣רֶךְ יַעֲקֹ֔ב בְּהֵֽאָבְק֖וֹ עִמּֽוֹ׃", "pasuk_en": "וַיַּרְא כִּי לֹא יָכֹל לוֹ וַיִּגַּע בְּכַף־יְרֵכוֹ וַתֵּקַע כַּף־יֶרֶךְ יַעֲקֹב בְּהֵאָבְקוֹ עִמּוֹ׃", "rashi_he": "ויגע בכף ירכו. קוּלִית הַיָּרֵךְ הַתָּקוּעַ בְּקַּלְבּוּסִית קָרוּי כַּף, עַ\"שֵׁ שֶׁהַבָּשָׂר שֶׁעָלֶיהָ כְּמִין כַּף שֶׁל קְדֵרָה:", "rashi_en": "רש״י מסביר שכף הירך היא עצם הקולית העליונה התקועה בקלבוסית (שקע מפרק הירך), ונקראת כף כי הבשר שעליה דומה לכף של קדרה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ נִקְרָא חֵלֶק זֶה שֶׁל הַיָּרֵךְ בְּשֵׁם כַּף?", "options": ["כִּי הַבָּשָׂר שֶׁעָלָיו דּוֹמֶה לְכַף שֶׁל קְדֵרָה", "כִּי צוּרַת הָעֶצֶם עֲגֻולָּה וּשְׁטוּחָה כְּכַף יָד", "כִּי מַכִּים עָלָיו בְּכַף הַיָּד בִּשְׁעַת שְׁחִיטָה"], "kasha": "מה פירוש המילה כף בהקשר של ירך, שהרי כף פירושה הרגיל הוא כף יד או כלי?", "answer": "העצם נקראת כף משום שהבשר שעליה נראה כמין כף של קדרה, כלומר כמצקת.", "kp": ["שהבשר שעליה כמין כף של קדרה", "קולית הירך התקוע בקלבוסית"]}]}, {"id": "32:26.2", "ch": 32, "v": 26, "n": 2, "dh": "ותקע", "pasuk_html": "וַיַּ֗רְא כִּ֣י לֹ֤א יָכֹל֙ ל֔וֹ וַיִּגַּ֖ע בְּכַף־יְרֵכ֑וֹ <mark>וַתֵּ֙קַע֙</mark> כַּף־יֶ֣רֶךְ יַעֲקֹ֔ב בְּהֵֽאָבְק֖וֹ עִמּֽוֹ׃", "pasuk_en": "וַיַּרְא כִּי לֹא יָכֹל לוֹ וַיִּגַּע בְּכַף־יְרֵכוֹ וַתֵּקַע כַּף־יֶרֶךְ יַעֲקֹב בְּהֵאָבְקוֹ עִמּוֹ׃", "rashi_he": "ותקע. נִתְקַעְקְעָה מִמְּקוֹם מַחְבַּרְתָּהּ, וְדוֹמֶה לוֹ פֶּן תֵּקַע נַפְשִׁי מִמֵּךְ (ירמיהו ו'), לְשׁוֹן הֲסָרָה. וּבְמִשְׁנָה לְקַעְקֵעַ בֵּיצָתָן – לְשָׁרֵשׁ שָׁרְשֵׁיהֶן:", "rashi_en": "רש״י מפרש שותקע פירושו שהירך נעקרה ממקום חיבורה. הוא מביא ראיה מירמיהו ומלשון המשנה שתקע משמעו הסרה ועקירה.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מָה פֵּירוּשׁ וַתֵּקַע כַּף יֶרֶךְ יַעֲקֹב?", "options": ["הַיָּרֵךְ נֶעֶקְרָה מִמְּקוֹם חִיבּוּרָהּ — לְשׁוֹן הֲסָרָה", "הַיָּרֵךְ נִשְׁבְּרָה לְגַמְרֵי — לְשׁוֹן שְׁבִירָה", "הַיָּרֵךְ נִפְגְּעָה מִחוּץ — לְשׁוֹן מַכָּה וְחַבָּלָה"], "kasha": "מה משמעות המילה ותקע, שאינה מובנת מאליה בהקשר של פגיעה בירך?", "answer": "ותקע פירושו שנתקעקעה ממקום מחברתה, כלומר נעקרה מהמפרק, לשון הסרה.", "kp": ["נתקעקעה ממקום מחברתה", "לשון הסרה"]}]}, {"id": "32:27.1", "ch": 32, "v": 27, "n": 1, "dh": "כי עלה השחר", "pasuk_html": "וַיֹּ֣אמֶר שַׁלְּחֵ֔נִי <mark>כִּ֥י עָלָ֖ה הַשָּׁ֑חַר</mark> וַיֹּ֙אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲךָ֔ כִּ֖י אִם־בֵּרַכְתָּֽנִי׃", "pasuk_en": "וַיֹּאמֶר שַׁלְּחֵנִי כִּי עָלָה הַשָּׁחַר וַיֹּאמֶר לֹא אֲשַׁלֵּחֲךָ כִּי אִם־בֵּרַכְתָּנִי׃", "rashi_he": "כי עלה השחר. וְצָרִיךְ אֲנִי לוֹמַר שִׁירָה בַּיּוֹם (חולין צ\"א):", "rashi_en": "רש״י מסביר שהמלאך ביקש שישלחו יעקב כי עלה השחר והוא צריך לומר שירה לפני הקב״ה ביום.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ בִּיקֵּשׁ הַמַּלְאָךְ מִיַּעֲקֹב לְשַׁלְּחוֹ עִם עֲלוֹת הַשַּׁחַר?", "options": ["כִּי הַמַּלְאָךְ צָרִיךְ לוֹמַר שִׁירָה בַּיּוֹם", "כִּי כֹּוחוֹ שֶׁל הַמַּלְאָךְ פּוֹקֵעַ בְּאוֹר הַיּוֹם", "כִּי הַמַּלְאָךְ חָשַׁשׁ שֶׁיַּעֲקֹב יִרְאֶה אֶת פָּנָיו"], "kasha": "מדוע הזכיר המלאך את עלות השחר כסיבה לשחררו, ומה דוחק מיוחד יש בזמן זה?", "answer": "המלאך היה צריך לומר שירה לפני הקב״ה ביום, ולכן ביקש שישלחנו.", "kp": ["וצריך אני לומר שירה ביום"]}]}, {"id": "32:27.2", "ch": 32, "v": 27, "n": 2, "dh": "ברכתני", "pasuk_html": "וַיֹּ֣אמֶר שַׁלְּחֵ֔נִי כִּ֥י עָלָ֖ה הַשָּׁ֑חַר וַיֹּ֙אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲךָ֔ כִּ֖י אִם־<mark>בֵּרַכְתָּֽנִי׃</mark>", "pasuk_en": "וַיֹּאמֶר שַׁלְּחֵנִי כִּי עָלָה הַשָּׁחַר וַיֹּאמֶר לֹא אֲשַׁלֵּחֲךָ כִּי אִם־בֵּרַכְתָּנִי׃", "rashi_he": "ברכתני. הוֹדֵה לִי עַל הַבְּרָכוֹת שֶׁבֵּרְכַנִי אָבִי, שֶׁעֵשָׂו מְעַרְעֵר עֲלֵיהֶן:", "rashi_en": "רש״י מפרש שיעקב לא ביקש ברכה חדשה, אלא שהמלאך יודה לו על הברכות שבירכו יצחק אביו, שעשו ערער עליהן.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מָה בִּיקֵּשׁ יַעֲקֹב כְּשֶׁאָמַר כִּי אִם בֵּרַכְתַּנִי?", "options": ["שֶׁהַמַּלְאָךְ יוֹדֶה לוֹ עַל בִּרְכוֹת יִצְחָק שֶׁעֵשָׂו עֵרְעֵר עֲלֵיהֶן", "שֶׁהַמַּלְאָךְ יְבָרֵךְ אוֹתוֹ בְּבִרְכָה חֲדָשָׁה מִשֶּׁלּוֹ", "שֶׁהַמַּלְאָךְ יַבְטִיחַ לוֹ שֶׁעֵשָׂו לֹא יִילָּחֵם בּוֹ"], "kasha": "מדוע ביקש יעקב ברכה מן המלאך, והרי כבר בירכו יצחק אביו?", "answer": "יעקב לא ביקש ברכה חדשה, אלא שהמלאך יודה לו על הברכות שבירכו אביו, שעשו מערער עליהן.", "kp": ["הודה לי על הברכות שברכני אבי", "שעשו מערער עליהן"]}]}, {"id": "32:29.1", "ch": 32, "v": 29, "n": 1, "dh": "לא יעקב", "pasuk_html": "וַיֹּ֗אמֶר <mark>לֹ֤א יַעֲקֹב֙</mark> יֵאָמֵ֥ר עוֹד֙ שִׁמְךָ֔ כִּ֖י אִם־יִשְׂרָאֵ֑ל כִּֽי־שָׂרִ֧יתָ עִם־אֱלֹהִ֛ים וְעִם־אֲנָשִׁ֖ים וַתּוּכָֽל׃", "pasuk_en": "וַיֹּאמֶר לֹא יַעֲקֹב יֵאָמֵר עוֹד שִׁמְךָ כִּי אִם־יִשְׂרָאֵל כִּי־שָׂרִיתָ עִם־אֱלֹהִים וְעִם־אֲנָשִׁים וַתּוּכָל׃", "rashi_he": "לא יעקב. לֹא יֵאָמֵר עוֹד שֶׁהַבְּרָכוֹת בָּאוּ לְךָ בְעָקְבָּה וּרְמִיָּה כִּי אִם בִשְׂרָרָה וְגִלּוּי פָּנִים, וְסוֹפְךָ שֶׁהַקָּבָּ\"ה נִגְלֶה אֵלֶיךָ בְּבֵית אֵל וּמַחֲלִיף שִׁמְךָ וְשָׁם הוּא מְבָרֶכְךָ, וַאֲנִי שָׁם אֶהְיֶה וְאוֹדֶה לְךָ עֲלֵיהֶן, וְזֶה שֶׁכָּתוּב וַיָּשַׂר אֶל מַלְאָךְ וַיֻּכָל בָּכָה וַיִּתְחַנֶּן לוֹ (הושע י\"ב) – בָּכָה הַמַּלְאָךְ וַיִּתְחַנֶּן לוֹ, וּמַה נִּתְחַנֵּן לוֹ? בֵּית אֵל יִמְצָאֶנּוּ וְשָׁם יְדַבֵּר עִמָּנוּ, הַמְתֵּן לִי עַד שֶׁיְּדַבֵּר עִמָּנוּ שָׁם; וְלֹא רָצָה יַעֲקֹב, וְעַל כָּרְחוֹ הוֹדָה לוֹ עֲלֵיהֶן, וְזֶהוּ וַיְבָרֶךְ אֹתוֹ שָׁם, שֶׁהָיָה מִתְחַנֵּן לְהַמְתִּין לוֹ וְלֹא רָצָה:", "rashi_en": "רש״י מסביר שהמלאך אמר ליעקב שהברכות לא יתוארו עוד כאילו באו בעקבה ורמיה, אלא בשררה וגלוי פנים. המלאך בכה והתחנן ליעקב שימתין עד בית אל, אך יעקב סירב, והמלאך הודה לו על הברכות בעל כרחו.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מָה בִּיקֵּשׁ הַמַּלְאָךְ מִיַּעֲקֹב כְּשֶׁהִתְחַנֵּן אֵלָיו?", "options": ["שֶׁיַּמְתִּין לוֹ עַד שֶׁהַקָּבָּ\"ה יְדַבֵּר עִמָּם בְּבֵית אֵל", "שֶׁיַחֲזִיר לְעֵשָׂו אֶת הַבְּרָכוֹת שֶׁלָּקַח מִמֶּנּוּ", "שֶׁיְּשַׁחְרְרוּ מִיָּד כִּי עָלָיו לָשִׁיר שִׁירָה"], "kasha": "מדוע הפסוק בהושע אומר שהמלאך בכה והתחנן ליעקב — על מה התחנן?", "answer": "המלאך התחנן ליעקב שימתין עד בית אל, שם הקב\"ה ידבר עמם ויברכו, אך יעקב סירב והמלאך נאלץ להודות לו על הברכות בעל כרחו.", "kp": ["המתן לי עד שידבר עמנו שם", "ולא רצה יעקב ועל כרחו הודה לו"]}, {"q": "לְפִי רַשִׁ״י, מָה הַמַּשְׁמָעוּת שֶׁל שִׁינּוּי הַשֵּׁם מִיַּעֲקֹב לְיִשְׂרָאֵל?", "options": ["שֶׁהַבְּרָכוֹת בָּאוּ לוֹ בְּשָׂרָרָה וְגִלּוּי פָּנִים, לֹא בְּעָקְבָה", "שֶׁהוּא נַעֲשָׂה שַׂר וּמוֹשֵׁל עַל כָּל הָעַמִּים", "שֶׁהוּא נִיצַּח אֶת הַמַּלְאָךְ בְּכֹוחַ גּוּפָנִי בִּלְבַד"], "kasha": "מדוע שינוי השם מ\"יעקב\" ל\"ישראל\" קשור לאופן קבלת הברכות?", "answer": "השם יעקב מרמז על עקבה ורמיה, ואילו ישראל מרמז על שררה וגלוי פנים — כלומר הברכות הגיעו לו בזכות ולא בתחבולה.", "kp": ["לא יאמר עוד שהברכות באו לך בעקבה ורמיה", "כי אם בשררה וגלוי פנים"]}]}, {"id": "32:29.2", "ch": 32, "v": 29, "n": 2, "dh": "ועם אנשים", "pasuk_html": "וַיֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְךָ֔ כִּ֖י אִם־יִשְׂרָאֵ֑ל כִּֽי־שָׂרִ֧יתָ עִם־אֱלֹהִ֛ים <mark>וְעִם־אֲנָשִׁ֖ים</mark> וַתּוּכָֽל׃", "pasuk_en": "וַיֹּאמֶר לֹא יַעֲקֹב יֵאָמֵר עוֹד שִׁמְךָ כִּי אִם־יִשְׂרָאֵל כִּי־שָׂרִיתָ עִם־אֱלֹהִים וְעִם־אֲנָשִׁים וַתּוּכָל׃", "rashi_he": "ועם אנשים. עֵשָׂו וְלָבָן:", "rashi_en": "רש״י מפרש שהאנשים שיעקב שרה עמהם הם עשו ולבן.", "note": "", "points": [{"q": "לְפִי רַשְׁ״י, מִיהֶם הָ\"אֲנָשִׁים\" שֶׁיַּעֲקֹב שָׂרָה עִמָּם?", "options": ["עֵשָׂו וְלָבָן", "עֵשָׂו וְהַמַּלְאָךְ", "לָבָן וּפַרְעֹה"], "kasha": "הפסוק אומר \"שרית עם אנשים\" בלי לפרט מי הם — למי הכוונה?", "answer": "רש״י מזהה שהאנשים הם עשו ולבן, שעמם התמודד יעקב.", "kp": ["עשו ולבן"]}]}, {"id": "32:29.3", "ch": 32, "v": 29, "n": 3, "dh": "ותוכל", "pasuk_html": "וַיֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְךָ֔ כִּ֖י אִם־יִשְׂרָאֵ֑ל כִּֽי־שָׂרִ֧יתָ עִם־אֱלֹהִ֛ים וְעִם־אֲנָשִׁ֖ים <mark>וַתּוּכָֽל׃</mark>", "pasuk_en": "וַיֹּאמֶר לֹא יַעֲקֹב יֵאָמֵר עוֹד שִׁמְךָ כִּי אִם־יִשְׂרָאֵל כִּי־שָׂרִיתָ עִם־אֱלֹהִים וְעִם־אֲנָשִׁים וַתּוּכָל׃", "rashi_he": "ותוכל. לָהֶם:", "rashi_en": "רש״י מפרש שהמילה \"ותוכל\" פירושה שיעקב יכול להם, כלומר ניצח אותם.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מָה מַשְׁלִימָה הַמִּילָּה \"וַתּוּכָל\" בַּפָּסוּק?", "options": ["וַתּוּכַל לָהֶם — נִיצַּחְתָּ אוֹתָם", "וְתוּכַל לִסְלֹוחַ — מָחַלְתָּ לָהֶם", "וְתוּכַל לִבְרֹוחַ — נִמְלַטְתָּ מֵהֶם"], "kasha": "המילה \"ותוכל\" נאמרת בלי מושא — יכולת למי או למה?", "answer": "רש״י משלים שהכוונה \"ותוכל להם\" — יעקב ניצח את כל מי ששרה עמו.", "kp": ["להם"]}]}, {"id": "32:30.1", "ch": 32, "v": 30, "n": 1, "dh": "למה זה תשאל", "pasuk_html": "וַיִּשְׁאַ֣ל יַעֲקֹ֗ב וַיֹּ֙אמֶר֙ הַגִּֽידָה־נָּ֣א שְׁמֶ֔ךָ וַיֹּ֕אמֶר <mark>לָ֥מָּה זֶּ֖ה תִּשְׁאַ֣ל</mark> לִשְׁמִ֑י וַיְבָ֥רֶךְ אֹת֖וֹ שָֽׁם׃", "pasuk_en": "וַיִּשְׁאַל יַעֲקֹב וַיֹּאמֶר הַגִּידָה־נָּא שְׁמֶךָ וַיֹּאמֶר לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי וַיְבָרֶךְ אֹתוֹ שָׁם׃", "rashi_he": "למה זה תשאל. אֵין לָנוּ שֵׁם קָבוּעַ, מִשְׁתַּנִּים שְׁמוֹתֵנוּ, הַכֹּל לְפִי מִצְוַת עֲבוֹדַת הַשְּׁלִיחוּת שֶׁאָנוּ מִשְׁתַּלְּחִים (בראשית רבה):", "rashi_en": "רש״י מסביר שהמלאך ענה שאין למלאכים שם קבוע, אלא שמותיהם משתנים לפי השליחות שהם נשלחים אליה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ הַמַּלְאָךְ לֹא גִּילָּה אֶת שְׁמוֹ לְיַעֲקֹב?", "options": ["כִּי לַמַּלְאָכִים אֵין שֵׁם קָבוּעַ — שְׁמָם מִשְׁתַּנֶּה לְפִי שְׁלִיחוּתָם", "כִּי אָסוּר לְמַלְאָךְ לְגַלּוֹת אֶת שְׁמוֹ לִבְנֵי אָדָם", "כִּי הַמַּלְאָךְ הִתְבַּיֵּישׁ מִכִּישְׁלוֹנוֹ בַּמַּאֲבָק עִם יַעֲקֹב"], "kasha": "המלאך לא ענה על שאלת יעקב בפשטות — למה סירב לומר את שמו?", "answer": "המלאך הסביר שאין למלאכים שם קבוע, כי שמותיהם משתנים לפי מצוות השליחות שהם נשלחים אליה.", "kp": ["אין לנו שם קבוע", "משתנים שמותנו הכל לפי מצות עבודת השליחות"]}]}, {"id": "32:32.1", "ch": 32, "v": 32, "n": 1, "dh": "ויזרח לו השמש", "pasuk_html": "<mark>וַיִּֽזְרַֽח־ל֣וֹ הַשֶּׁ֔מֶשׁ</mark> כַּאֲשֶׁ֥ר עָבַ֖ר אֶת־פְּנוּאֵ֑ל וְה֥וּא צֹלֵ֖עַ עַל־יְרֵכֽוֹ׃", "pasuk_en": "וַיִּזְרַח־לוֹ הַשֶּׁמֶשׁ כַּאֲשֶׁר עָבַר אֶת־פְּנוּאֵל וְהוּא צֹלֵעַ עַל־יְרֵכוֹ׃", "rashi_he": "ויזרח לו השמש. לְשׁוֹן בְּנֵי אָדָם הוּא כְּשֶׁהִגַּעְנוּ לְמָקוֹם פְּלוֹנִי הֵאִיר לָנוּ הַשַּׁחַר, זֶהוּ פְשׁוּטוֹ; וּמִ\"אַ ויזרח לו לְצָרְכּוֹ – לְרַפְּאוֹת אֶת צָלַעְתּוֹ, כְּמָה דְּתֵימָא שֶׁמֶשׁ צְדָקָה וּמַרְפֵּא בִּכְנָפֶיהָ (מלאכי ג'); וְאוֹתָן שָׁעוֹת שֶׁמִּהֲרָה לִשְׁקֹעַ בִּשְׁבִילוֹ כְּשֶׁיָּצָא מִבְּאֵר שֶׁבַע מִהֲרָה לִזְרֹחַ בִּשְׁבִילוֹ:", "rashi_en": "רש״י מביא שני פירושים: לפי הפשט, זהו ביטוי רגיל שאומרים בני אדם כשמגיעים למקום מסוים והשחר מאיר להם. לפי המדרש, השמש זרחה במיוחד עבור יעקב כדי לרפא את צלעתו, וכשם שמיהרה לשקוע בשבילו כשיצא מבאר שבע, כך מיהרה לזרוח בשבילו.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ שֶׁמֵּבִיא רַשׁ״י, מַדּוּעַ מִיהֲרָה הַשֶּׁמֶשׁ לִזְרֹוחַ לְיַעֲקֹב?", "options": ["כְּדֵי לְרַפֵּא אֶת צַלְעָתוֹ, כְּפִי שֶׁנֶּאֱמַר שֶׁמֶשׁ צְדָקָה וּמַרְפֵּא", "כְּדֵי לְהָאִיר לוֹ אֶת הַדֶּרֶךְ בַּחֲזָרָה לְאֶרֶץ יִשְׂרָאֵל", "כְּדֵי לְסַמֵּן שֶׁנִּיצַּח בַּמַּאֲבָק עִם הַמַּלְאָךְ"], "kasha": "מה המיוחד בביטוי \"ויזרח לו\" — מדוע כתוב \"לו\" ולא סתם \"ויזרח השמש\"?", "answer": "המילה \"לו\" מלמדת שהשמש זרחה לצרכו של יעקב, לרפא את צלעתו, כמו שנאמר שמש צדקה ומרפא בכנפיה.", "kp": ["לצרכו לרפאות את צלעתו", "שמש צדקה ומרפא בכנפיה"]}, {"q": "מַה הַקֶּשֶׁר שֶׁרַשִׁ״י עוֹשֶׂה בֵּין שְׁקִיעַת הַשֶּׁמֶשׁ לִזְרִיחָתָהּ?", "options": ["כְּשֵׁם שֶׁמִּיהֲרָה לִשְׁקֹועַ בִּשְׁבִילוֹ, מִיהֲרָה לִזְרֹוחַ בִּשְׁבִילוֹ", "הַשֶּׁמֶשׁ שָׁקְעָה כְּעֹונֶשׁ וְזָרְחָה כְּסִימָן לִמְחִילָה", "שְׁקִיעַת הַשֶּׁמֶשׁ סִימְּנָה תְּחִילַת הַמַּאֲבָק וּזְרִיחָתָהּ אֶת סוֹפוֹ"], "kasha": "למה מזכיר רש״י את שקיעת השמש כשיצא מבאר שבע, מה הקשר לזריחה כאן?", "answer": "רש״י מלמד שאותן שעות שהשמש מיהרה לשקוע בשבילו כשיצא מבאר שבע, מיהרה עכשיו לזרוח בשבילו.", "kp": ["מהרה לשקע בשבילו", "מהרה לזרח בשבילו"]}]}, {"id": "32:32.2", "ch": 32, "v": 32, "n": 2, "dh": "והוא צלע", "pasuk_html": "וַיִּֽזְרַֽח־ל֣וֹ הַשֶּׁ֔מֶשׁ כַּאֲשֶׁ֥ר עָבַ֖ר אֶת־פְּנוּאֵ֑ל <mark>וְה֥וּא צֹלֵ֖עַ</mark> עַל־יְרֵכֽוֹ׃", "pasuk_en": "וַיִּזְרַח־לוֹ הַשֶּׁמֶשׁ כַּאֲשֶׁר עָבַר אֶת־פְּנוּאֵל וְהוּא צֹלֵעַ עַל־יְרֵכוֹ׃", "rashi_he": "והוא צלע. הָיָה צוֹלֵעַ כְּשֶׁזָּרְחָה הַשֶּׁמֶשׁ:", "rashi_en": "רש״י מדייק שיעקב היה צולע דווקא בשעה שזרחה השמש, כלומר הצליעה לא נמשכה לאחר מכן.", "note": "", "points": [{"q": "מַה מְדַייֵּק רַשִׁ״י לְגַבֵּי זְמַן הַצְּלִיעָה שֶׁל יַעֲקֹב?", "options": ["הוּא צָלַע רַק כְּשֶׁזָּרְחָה הַשֶּׁמֶשׁ, וְאָז נִרְפָּא", "הוּא הֵחֵל לִצְלֹועַ מִיָּד לְאַחַר הַמַּאֲבָק עִם הַמַּלְאָךְ", "הוּא צָלַע כָּל יָמָיו לְזֵכֶר הַמַּאֲבָק"], "kasha": "מדוע רש״י צריך לפרש \"והוא צלע\" — הרי כבר כתוב שנפגע בירכו?", "answer": "רש״י מדייק שהצליעה היתה רק בזמן זריחת השמש, ולאחר מכן נרפא.", "kp": ["היה צולע כשזרחה השמש"]}]}, {"id": "32:33.1", "ch": 32, "v": 33, "n": 1, "dh": "גיד הנשה", "pasuk_html": "עַל־כֵּ֡ן לֹֽא־יֹאכְל֨וּ בְנֵֽי־יִשְׂרָאֵ֜ל אֶת־<mark>גִּ֣יד הַנָּשֶׁ֗ה</mark> אֲשֶׁר֙ עַל־כַּ֣ף הַיָּרֵ֔ךְ עַ֖ד הַיּ֣וֹם הַזֶּ֑ה כִּ֤י נָגַע֙ בְּכַף־יֶ֣רֶךְ יַעֲקֹ֔ב בְּגִ֖יד הַנָּשֶֽׁה׃", "pasuk_en": "עַל־כֵּן לֹא־יֹאכְלוּ בְנֵי־יִשְׂרָאֵל אֶת־גִּיד הַנָּשֶׁה אֲשֶׁר עַל־כַּף הַיָּרֵךְ עַד הַיּוֹם הַזֶּה כִּי נָגַע בְּכַף־יֶרֶךְ יַעֲקֹב בְּגִיד הַנָּשֶׁה׃", "rashi_he": "גיד הנשה. לָמָּה נִקְרָא שְׁמוֹ גִּיד הַנָּשֶׁה? לְפִי שֶׁנָּשָׁה מִמְּקוֹמוֹ וְעָלָה, וְהוּא לְשׁוֹן קְפִיצָה, וְכֵן נָשְׁתָה גְבוּרָתָם (ירמיהו נ\"א), וְכֵן כִּי נַשַּׁנִי אֱלֹהִים אֶת כָּל עֲמָלִי (בראשית מ\"א):", "rashi_en": "רש״י מסביר שגיד הנשה נקרא כך כי הוא נשה — קפץ ממקומו ועלה. המילה \"נשה\" פירושה קפיצה, וכן מצינו לשון זו בפסוקים נוספים.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ נִקְרָא גִּיד הַנָּשֶׁה בְּשֵׁם זֶה?", "options": ["כִּי הַגִּיד קָפַץ מִמְּקוֹמוֹ וְעָלָה", "כִּי הַגִּיד גָּרַם לְיַעֲקֹב לִשְׁכֹּוחַ אֶת הַכְּאֵב", "כִּי הַמַּלְאָךְ נָשָׁה אֶת יְרֵכוֹ שֶׁל יַעֲקֹב בְּכֹוחַ"], "kasha": "מה פירוש המילה \"נשה\" בשם \"גיד הנשה\"?", "answer": "רש״י מפרש שנשה פירושו קפיצה — הגיד נשה ממקומו ועלה, ומביא ראיות מפסוקים נוספים.", "kp": ["נשה ממקומו ועלה", "לשון קפיצה"]}]}, {"id": "33:2.1", "ch": 33, "v": 2, "n": 1, "dh": "ואת לאה וילדיה אחרנים", "pasuk_html": "וַיָּ֧שֶׂם אֶת־הַשְּׁפָח֛וֹת וְאֶת־יַלְדֵיהֶ֖ן רִֽאשֹׁנָ֑ה <mark>וְאֶת־לֵאָ֤ה וִֽילָדֶ֙יהָ֙ אַחֲרֹנִ֔ים</mark> וְאֶת־רָחֵ֥ל וְאֶת־יוֹסֵ֖ף אַחֲרֹנִֽים׃", "pasuk_en": "וַיָּשֶׂם אֶת־הַשְּׁפָחוֹת וְאֶת־יַלְדֵיהֶן רִאשֹׁנָה וְאֶת־לֵאָה וִילָדֶיהָ אַחֲרֹנִים וְאֶת־רָחֵל וְאֶת־יוֹסֵף אַחֲרֹנִים׃", "rashi_he": "ואת לאה וילדיה אחרנים. אַחֲרוֹן אַחֲרוֹן חָבִיב:", "rashi_en": "רש״י מסביר שיעקב סידר את נשיו וילדיו כך שמי שנזכר אחרון הוא החביב ביותר, ולכן רחל ויוסף הוזכרו אחרונים.", "note": "", "points": [{"q": "מַה הַכְּלָל שֶׁרַשִׁ״י מְלַמֵּד מִסֵּדֶר הַצָּבַת הַנָּשִׁים וְהַיְּלָדִים?", "options": ["אַחֲרוֹן אַחֲרוֹן חָבִיב — הַמְּאֻוחָר יוֹתֵר הוּא הֶחָבִיב יוֹתֵר", "יַעֲקֹב הִצִּיב אֶת הַחֲזָקִים אַחֲרוֹנִים כְּדֵי לְהָגֵן עֲלֵיהֶם", "יַעֲקֹב סִידֵּר לְפִי גִּיל, מֵהַגְּדוֹלִים לַקְּטַנִּים"], "kasha": "מדוע מציין הפסוק את סדר ההצבה של הנשים והילדים לפני עשו?", "answer": "רש״י מלמד שהסדר מבטא חביבות: אחרון אחרון חביב, ולכן רחל ויוסף הוצבו אחרונים.", "kp": ["אחרון אחרון חביב"]}]}, {"id": "33:3.1", "ch": 33, "v": 3, "n": 1, "dh": "עבר לפניהם", "pasuk_html": "וְה֖וּא <mark>עָבַ֣ר לִפְנֵיהֶ֑ם</mark> וַיִּשְׁתַּ֤חוּ אַ֙רְצָה֙ שֶׁ֣בַע פְּעָמִ֔ים עַד־גִּשְׁתּ֖וֹ עַד־אָחִֽיו׃", "pasuk_en": "וְהוּא עָבַר לִפְנֵיהֶם וַיִּשְׁתַּחוּ אַרְצָה שֶׁבַע פְּעָמִים עַד־גִּשְׁתּוֹ עַד־אָחִיו׃", "rashi_he": "עבר לפניהם. אָמַר אִם יָבֹא אוֹתוֹ רָשָׁע לְהִלָּחֵם יִלָּחֵם בִּי תְּחִלָּה:", "rashi_en": "יעקב עבר לפני משפחתו לקראת עשו, כי חשב שאם עשו יבוא להילחם — עדיף שילחם בו תחילה ולא בנשים ובילדים.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ עָבַר יַעֲקֹב לִפְנֵי מִשְׁפַּחְתּוֹ לִקְרַאת עֵשָׂו?", "options": ["כְּדֵי שֶׁאִם עֵשָׂו יִלָּחֵם — יִלָּחֵם בְּיַעֲקֹב תְּחִילָּה", "כְּדֵי לְכַבֵּד אֶת עֵשָׂו וְלָצֵאת לִקְרָאתוֹ רִאשׁוֹן", "כְּדֵי לְהַרְאוֹת לְעֵשָׂו שֶׁאֵינוֹ מְפַחֵד מִמֶּנּוּ"], "kasha": "מדוע יעקב הקדים ללכת לפני כל המחנה במקום להישאר מאחור בבטחה?", "answer": "יעקב חשב שאם עשו יבוא להילחם, עדיף שילחם בו תחילה ולא במשפחתו.", "kp": ["ילחם בי תחלה"]}]}, {"id": "33:4.1", "ch": 33, "v": 4, "n": 1, "dh": "ויחבקהו", "pasuk_html": "וַיָּ֨רָץ עֵשָׂ֤ו לִקְרָאתוֹ֙ <mark>וַֽיְחַבְּקֵ֔הוּ</mark> וַיִּפֹּ֥ל עַל־צַוָּארָ֖ו וַׄיִּׄשָּׁׄקֵ֑ׄהׄוּׄ וַיִּבְכּֽוּ׃", "pasuk_en": "וַיָּרָץ עֵשָׂו לִקְרָאתוֹ וַיְחַבְּקֵהוּ וַיִּפֹּל עַל־צַוָּארָו וַיִּשָּׁקֵהוּ וַיִּבְכּוּ׃", "rashi_he": "ויחבקהו. נִתְגַּלְגְּלוּ רַחֲמָיו, כְּשֶׁרָאָהוּ מִשְׁתַּחֲוֶה כָּל הִשְׁתַּחֲוָאוֹת הַלָּלוּ:", "rashi_en": "רש״י מסביר שעשו חיבק את יעקב כי נתגלגלו רחמיו עליו, לאחר שראה אותו משתחווה פעמים רבות.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מָה גָּרַם לְעֵשָׂו לְחַבֵּק אֶת יַעֲקֹב?", "options": ["רָאָה אוֹתוֹ מִשְׁתַּחֲווֶה פְּעָמִים רַבּוֹת וְנִתְעוֹרְרוּ רַחֲמָיו", "רָצָה לְהַרְאוֹת לְמִשְׁפַּחַת יַעֲקֹב שֶׁהוּא אָדָם טוֹב", "נִזְכַּר בְּאַהֲבַת אַחִים מִימֵי יַלְדוּתָם"], "kasha": "עשו בא עם ארבע מאות איש ונראה כאויב — מה השתנה פתאום שחיבק את יעקב?", "answer": "כשעשו ראה את יעקב משתחווה כל ההשתחוואות הללו, נתגלגלו רחמיו עליו וחיבקו.", "kp": ["נתגלגלו רחמיו", "כשראהו משתחוה כל השתחואות הללו"]}]}, {"id": "33:4.2", "ch": 33, "v": 4, "n": 2, "dh": "וישקהו", "pasuk_html": "וַיָּ֨רָץ עֵשָׂ֤ו לִקְרָאתוֹ֙ וַֽיְחַבְּקֵ֔הוּ וַיִּפֹּ֥ל עַל־צַוָּארָ֖ו <mark>וַׄיִּׄשָּׁׄקֵ֑ׄהׄוּׄ</mark> וַיִּבְכּֽוּ׃", "pasuk_en": "וַיָּרָץ עֵשָׂו לִקְרָאתוֹ וַיְחַבְּקֵהוּ וַיִּפֹּל עַל־צַוָּארָו וַיִּשָּׁקֵהוּ וַיִּבְכּוּ׃", "rashi_he": "וישקהו. נָקוּד עָלָיו; וְיֵשׁ חוֹלְקִין בַּדָּבָר הַזֶּה בַּבָּרַיְתָא דְּסִפְרֵי, יֵשׁ שֶׁדָּרְשׁוּ נְקֻדָּה זוֹ שֶׁלֹּא נְשָׁקוֹ בְּכָל לִבּוֹ, אָמַר רַבִּי שִׁמְעוֹן בֶּן יוֹחַאי, הֲלָכָה הִיא בְּיָדוּעַ שֶׁעֵשָׂו שׂוֹנֵא לְיַעֲקֹב, אֶלָּא שֶׁנִּכְמְרוּ רַחֲמָיו בְּאוֹתָהּ שָׁעָה וּנְשָׁקוֹ בְּכָל לִבּוֹ (ספרי במדבר):", "rashi_en": "על המילה וישקהו יש נקודות. יש מי שדרשו שלא נשקו בכל לבו. אך רבי שמעון בן יוחאי אמר שהלכה היא שעשו שונא ליעקב, אלא שבאותה שעה נכמרו רחמיו ונשקו בכל לבו.", "note": "", "points": [{"q": "מַה הַמַּחֲלֹוקֶת בְּעִנְיַין הַנְּקֻודּוֹת שֶׁעַל הַמִּילָּה וַיִּשָּׁקֵהוּ?", "options": ["הַאִם עֵשָׂו נְשָׁקוֹ בְּכָל לִבּוֹ אוֹ שֶׁלֹּא נְשָׁקוֹ בְּכָל לִבּוֹ", "הַאִם עֵשָׂו נְשָׁקוֹ עַל מִצְחוֹ אוֹ עַל לֶחְיוֹ", "הַאִם הַנְּשִׁיקָה הָייְתָה סִימַן שָׁלוֹם אוֹ סִימַן מִלְחָמָה"], "kasha": "מדוע יש נקודות מעל המילה וישקהו, ומה הן באות ללמד?", "answer": "יש שדרשו שלא נשקו בכל לבו. רבי שמעון בן יוחאי אמר שאף שעשו שונא ליעקב, באותה שעה נכמרו רחמיו ונשקו בכל לבו.", "kp": ["נקוד עליו", "שלא נשקו בכל לבו", "נכמרו רחמיו באותה שעה ונשקו בכל לבו"]}, {"q": "מַהִי עֶמְדַּת רַבִּי שִׁמְעוֹן בֶּן יוֹחַאי לְגַבֵּי נְשִׁיקַת עֵשָׂו?", "options": ["רַחֲמָיו נִכְמְרוּ בְּאוֹתָהּ שָׁעָה וְנִשְּׁקוֹ בְּכָל לִבּוֹ", "עֵשָׂו הֶעֱמִיד פָּנִים וְנִשְּׁקוֹ אַךְ לֹא בְּכַנּוּת", "עֵשָׂו נְשָׁקוֹ מִתּוֹךְ פַּחַד מִכֹּוחוֹ שֶׁל יַעֲקֹב"], "kasha": "כיצד ייתכן שעשו, השונא את יעקב, נשקו בכנות?", "answer": "לפי רשב״י, הלכה שעשו שונא ליעקב, אך באותה שעה מיוחדת נכמרו רחמיו ונשקו בכל לבו.", "kp": ["הלכה היא בידוע שעשו שונא ליעקב", "נכמרו רחמיו באותה שעה"]}]}, {"id": "33:5.1", "ch": 33, "v": 5, "n": 1, "dh": "מי אלה לך", "pasuk_html": "וַיִּשָּׂ֣א אֶת־עֵינָ֗יו וַיַּ֤רְא אֶת־הַנָּשִׁים֙ וְאֶת־הַיְלָדִ֔ים וַיֹּ֖אמֶר <mark>מִי־אֵ֣לֶּה לָּ֑ךְ</mark> וַיֹּאמַ֕ר הַיְלָדִ֕ים אֲשֶׁר־חָנַ֥ן אֱלֹהִ֖ים אֶת־עַבְדֶּֽךָ׃", "pasuk_en": "וַיִּשָּׂא אֶת־עֵינָיו וַיַּרְא אֶת־הַנָּשִׁים וְאֶת־הַיְלָדִים וַיֹּאמֶר מִי־אֵלֶּה לָּךְ וַיֹּאמַר הַיְלָדִים אֲשֶׁר־חָנַן אֱלֹהִים אֶת־עַבְדֶּךָ׃", "rashi_he": "מי אלה לך. מִי אֵלֶּה לִהְיוֹת שֶׁלְּךָ:", "rashi_en": "רש״י מפרש ש״מי אלה לך״ פירושו מי אלה שהם ראויים להיות שלך — כלומר, מי הם שזכית בהם.", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ״י מְפָרֵשׁ אֶת שְׁאֵלַת עֵשָׂו ״מִי אֵלֶּה לָךְ״?", "options": ["מִי אֵלֶּה שֶׁרְאוּיִים לִהְיוֹת שֶׁלְּךָ", "מַה שְּׁמוֹתֵיהֶם שֶׁל יְלָדִים אֵלֶּה", "מַדּוּעַ הֵבֵאתָ אוֹתָם אֵלַיי"], "kasha": "מה משמעות המילה ״לך״ בביטוי ״מי אלה לך״ שרש״י ראה צורך לפרש?", "answer": "רש״י מפרש שהכוונה: מי אלה להיות שלך — כלומר, מי הם שזכית שיהיו שלך.", "kp": ["מי אלה להיות שלך"]}]}, {"id": "33:7.1", "ch": 33, "v": 7, "n": 1, "dh": "נגש יוסף ורחל", "pasuk_html": "וַתִּגַּ֧שׁ גַּם־לֵאָ֛ה וִילָדֶ֖יהָ וַיִּֽשְׁתַּחֲו֑וּ וְאַחַ֗ר <mark>נִגַּ֥שׁ יוֹסֵ֛ף וְרָחֵ֖ל</mark> וַיִּֽשְׁתַּחֲוֽוּ׃", "pasuk_en": "וַתִּגַּשׁ גַּם־לֵאָה וִילָדֶיהָ וַיִּשְׁתַּחֲווּ וְאַחַר נִגַּשׁ יוֹסֵף וְרָחֵל וַיִּשְׁתַּחֲווּ׃", "rashi_he": "נגש יוסף ורחל. בְּכֻלָּן הָאִמָּהוֹת נִגָּשׁוֹת לִפְנֵי הַבָּנִים, אֲבָל בְּרָחֵל יוֹסֵף נִגַּשׁ לְפָנֶיהָ, אָמַר אִמִּי יְפַת תֹּאַר, שֶׁמָּא יִתְלֶה בָהּ עֵינָיו אוֹתוֹ רָשָׁע, אֶעֱמֹד כְּנֶגְדָהּ וַאֲעַכְּבֶנּוּ מִלְּהִסְתַּכֵּל בָּהּ; מִכָּאן זָכָה יוֹסֵף לְבִרְכַּת עֲלֵי עַיִן:", "rashi_en": "בכל השפחות והשבטים האמהות נגשו לפני ילדיהן להשתחוות לעשו, אבל יוסף נגש לפני רחל אמו כדי לחסום את מבטו של עשו ממנה, כי היא היתה יפת תואר. בזכות מעשה זה זכה יוסף לברכת עלי עין.", "note": "", "points": [{"q": "מַדּוּעַ נִגַּשׁ יוֹסֵף לִפְנֵי רָחֵל, לְפִי רַשִׁ״י?", "options": ["כְּדֵי לַחְסוֹם אֶת עֵשָׂו מִלְּהִסְתַּכֵּל בְּאִמּוֹ יְפַת הַתֹּואַר", "כְּדֵי לְהַרְאוֹת כָּבוֹד לְעֵשָׂו לִפְנֵי אִמּוֹ", "כִּי הוּא הָיָה הַבְּכוֹר שֶׁל רָחֵל וְכָךְ נָהוּג"], "kasha": "בכל המשפחות האמהות נגשו לפני הבנים, ומדוע דווקא אצל רחל נגש יוסף לפניה?", "answer": "יוסף ידע שאמו יפת תואר וחשש שעשו הרשע יתלה בה עיניו, ולכן עמד לפניה כדי למנוע ממנו להסתכל בה.", "kp": ["אמי יפת תאר", "אעמד כנגדה ואעכבנו מלהסתכל בה"]}, {"q": "מַה זָּכָה יוֹסֵף בְּעִקְבוֹת מַעֲשֵׂה זֶה, לְפִי רַשִׁ״י?", "options": ["בִּרְכַּת עֲלֵי עַיִן", "בִּרְכַּת בֶּן פֹּורָת יוֹסֵף", "בִּרְכַּת רֵאשִׁית אוֹנוֹ"], "kasha": "מדוע מספרת התורה שיוסף נגש לפני רחל, ומה יצא מכך?", "answer": "בזכות שעמד לפני אמו וחסם את מבטו של עשו, זכה יוסף לברכת עלי עין.", "kp": ["מכאן זכה יוסף לברכת עלי עין"]}]}, {"id": "33:8.1", "ch": 33, "v": 8, "n": 1, "dh": "מי לך כל המחנה", "pasuk_html": "וַיֹּ֕אמֶר <mark>מִ֥י לְךָ֛ כָּל־הַמַּחֲנֶ֥ה</mark> הַזֶּ֖ה אֲשֶׁ֣ר פָּגָ֑שְׁתִּי וַיֹּ֕אמֶר לִמְצֹא־חֵ֖ן בְּעֵינֵ֥י אֲדֹנִֽי׃", "pasuk_en": "וַיֹּאמֶר מִי לְךָ כָּל־הַמַּחֲנֶה הַזֶּה אֲשֶׁר פָּגָשְׁתִּי וַיֹּאמֶר לִמְצֹא־חֵן בְּעֵינֵי אֲדֹנִי׃", "rashi_he": "מי לך כל המחנה. מִי כָּל הַמַּחֲנֶה אֲשֶׁר פָּגַשְׁתִּי, שֶׁהוּא שֶׁלְּךָ? כְּלוֹמַר לָמָּה הוּא לְךָ? פְּשׁוּטוֹ שֶׁל מִקְרָא עַל מוֹלִיכֵי הַמִּנְחָה, וּמִדְרָשׁוֹ כִּתּוֹת שֶׁל מַלְאָכִים פָּגַע, שֶׁהָיוּ דּוֹחֲפִין אוֹתוֹ וְאֶת אֲנָשָׁיו וְאוֹמְרִים לָהֶם שֶׁל מִי אַתֶּם? וְהֵם אוֹמְרִים לָהֶם שֶׁל עֵשָׂו, וְהֵם אוֹמְרִים הַכּוּ, הַכּוּ, וְאֵלּוּ אוֹמְרִים הַנִּיחוּ, בְּנוֹ שֶׁל יִצְחָק הוּא, וְלֹא הָיוּ מַשְׁגִּיחִים עָלָיו; בֶּן בְּנוֹ שֶׁל אַבְרָהָם הוּא, וְלֹא הָיוּ מַשְׁגִּיחִין; אָחִיו שֶׁל יַעֲקֹב הוּא, אוֹמְרִים לָהֶם אִם כֵּן, מִשֶּׁלָּנוּ אַתֶּם:", "rashi_en": "רש״י מפרש את שאלת עשו בשני אופנים: לפי הפשט, עשו שאל על מוליכי המנחה שפגש. לפי המדרש, עשו פגש כתות של מלאכים שדחפו אותו ואת אנשיו, ורק כששמעו שהוא אחי יעקב הסכימו לעזוב אותם.", "note": "", "points":
