ssion. Similarly: “He took his entire land from his possession.” The Midrashic explanation of מִן הַבָּא בְיָדוֹ: [It refers to] precious stones and jewels which a person ties into a packet so that he can carry them in his hand. (An alternate explanation of מִן הַבָּא בְיָדוֹ: from that which is not sacred [i.e.,] that he had already tithed as it stated: I [Yaakov] will surely give a tenth to You,” afterwards did he take it as a gift.)","p":[{"q":"According to the plain meaning in Rashi, what does \"הַבָּא בְיָדוֹ\" mean?","o":["What is in his possession and ownership","Precious stones and pearls that he carried in his hand","What remained after he separated the tithe"]}]},"32:15.1":{"e":"Rashi explains that the number of males was set according to the needs of the females. From this the Sages derived the laws of onah (conjugal duty): each person according to his occupation. Those who are idle — every day; workers — twice a week; and so on. The main lesson is that the greater the toil, the less frequent the onah.","pe":"Two hundred female goats and twenty male goats, two hundred ewes and twenty rams.","re":"Two hundred female goats and twenty male goats. Two hundred she-goats require twenty he-goats. So, too, regarding all [the animals]. The [number of] males according to the need of the females. Bereishis Rabbah infers from here the frequency of fulfilling marital duties. Those of the leisure class—every day, laborers—twice a week, mule drivers—once a week, the camel drivers—once in thirty days, sailors—once in six months. I do not know how specifically the Midrash arrives at these exact [inferences]. But, what [does] seem right to me is that we infer from this that the time of fulfilling marital duties is not the same for every person but is according to the amount of labor that is upon him, for we find here that for each he-goat he gave ten she-goats, as well as for each ram. Because they are free of labor it is their way to mate often—to impregnate ten females. Once an animal has become pregnant it does not accept the male. [But,] bulls who are busy laboring he gave for each male only four females, and for the donkey, which travels long distances, two females per male, and for camels which travel longer distances one female per male.","p":[{"q":"According to Rashi, what principle is learned from the ratio of males to females in the gift?","o":["Onah depends on toil — the harder the work, the less frequent the onah","One must always give ten females for every male of each species","The number of animals in the gift was determined by the wealth of the giver"]},{"q":"Why, according to Rashi, did Jacob give each bull only four females, while for a goat he gave ten?","o":["Bulls are used for labor and therefore have less frequent conjugal relations","Bulls are weaker than goats and cannot reproduce as much","The number of cows in the herd was simply smaller to begin with"]}]},"32:16.1":{"e":"Rashi gives two explanations of \"וּבְנֵיהֶם\": the plain meaning — the young offspring that were with them. According to the Midrash — \"their builders\" (בנאיהם), meaning the males, one male for each female. The reason the verse does not mention the males openly is that the camel is modest in mating.","pe":"Thirty nursing camels and their young, forty cows and ten bulls, twenty female donkeys and ten male donkeys.","re":"Thirty nursing camels. And their young were with them. The Midrashic explanation of בְּנֵיהֶם is בְּנָאֵיהֶם —their builders, i.e., one male per female. Since it [the camel species] is discreet in mating Scripture does not state it explicitly.","p":[{"q":"According to the Midrash, what does \"וּבְנֵיהֶם\" mean, and why were they not mentioned openly in the verse?","o":["The males corresponding to the females, and they were not mentioned openly because the camel is modest in mating","The young offspring, and they were not mentioned because they have no financial value","The workers who care for the camels, and they were not mentioned because they are not part of the gift"]}]},"32:16.2":{"e":"Rashi explains that \"עִירָם\" are male donkeys.","pe":"Thirty nursing camels and their young, forty cows and ten bulls, twenty female donkeys and ten male donkeys.","re":"Male donkeys. [עֲיָרִים are] male donkeys.","p":[{"q":"What are \"עִירָם\" according to Rashi?","o":["Male donkeys","Young foals of horses","Male goats"]}]},"32:17.1":{"e":"Rashi explains that \"עֵדֶר עֵדֶר לְבַדּוֹ\" means that each species of animal was kept separate from the others.","pe":"He placed them in the hand of his servants, each herd by itself. He said to his servants, Pass on ahead of me, and keep a space between each herd.","re":"Each herd by itself. [I.e.,] each species separately.","p":[{"q":"What does \"עֵדֶר עֵדֶר לְבַדּוֹ\" mean according to Rashi?","o":["Each species of animal walked separately from the others","Each animal walked alone without a shepherd","Each herd was divided into two separate parts"]}]},"32:17.2":{"e":"Rashi explains that \"עִבְרוּ לְפָנַי\" means the servants should go ahead of Jacob at a distance of one day's journey or less, and he would come after them.","pe":"He placed them in the hand of his servants, each herd by itself. He said to his servants, Pass on ahead of me, and keep a space between each herd.","re":"Pass on ahead of me. A distance of one day or less and I will follow behind you.","p":[{"q":"How far ahead did Jacob command the servants to go before him?","o":["One day's journey or less","Three days' journey","Just a few hours' journey"]}]},"32:17.3":{"e":"Rashi explains that Jacob spaced each flock from the next by a full eyeful of distance, in order to satisfy Esau's eye and overwhelm him with the size of the gift.","pe":"He placed them in the hand of his servants, each herd by itself. He said to his servants, Pass on ahead of me, and keep a space between each herd.","re":"And keep a space. One herd was ahead of the other as far as the eye can see. [Yaakov did this] so that the eye of the wicked man [Eisov] be satisfied, and to amaze him with the immensity of the gift.","p":[{"q":"According to Rashi, why did Jacob command that a gap be left between one flock and the next?","o":["To satisfy Esau's eye and stun him with the great size of the gift","So that the animals would not get mixed together on the way","So that Esau would think several different senders had sent them"]}]},"32:18.1":{"e":"Rashi explains that לְמִי אַתָּה means 'whose are you' — that is, who is sending you — and so Onkelos translated it: דְּמַאן אַתְּ.","pe":"He commanded the first one, saying, When my brother, Eisov meets you and asks you saying, To whom do you belong, and where are you going; and who is the owner of this that is before you?","re":"To whom do you belong? [Meaning] of whom are you? [i.e.,] “Who has sent you?” [as] Onkelos translates it דְּמָאן אַתְּ —whose are you?.","p":[{"q":"According to Rashi, what does the question לְמִי אַתָּה mean?","o":["Whose are you — that is, who is sending you","Where are you going and what is the purpose of your journey","What is your name and where do you come from"]}]},"32:18.2":{"e":"Rashi explains that לְמִי here means 'whose' — that is, to whom does the gift belong. The letter lamed serves in place of 'of,' just as in לַה׳ הָאָרֶץ, which means 'belonging to God.'","pe":"He commanded the first one, saying, When my brother, Eisov meets you and asks you saying, To whom do you belong, and where are you going; and who is the owner of this that is before you?","re":"And who is the owner of this that is before you? [Meaning:] and those before you, whose are they? [I.e.,] to whom is this gift being sent? The למ\"ד [here] is used as a prefix in place of the word שֶׁל —of [possessive] as in: “Everything that you see לִי הוּא,” meaning “is mine” שֶׁלִי הוּא, [or] “לַה' [God’s] is the earth and its fullness,” [לה' being the same as] שֶׁל ה' [God’s].","p":[{"q":"According to Rashi, how does the letter lamed function in the word וּלְמִי in this verse?","o":["The lamed serves in place of 'of' — whose are these","The lamed indicates direction — where these are going","The lamed indicates ownership through purchase and sale"]}]},"32:19.1":{"e":"Rashi explains that the order of the servant's answers matches the order of the questions: for the first question לְמִי אַתָּה — 'to your servant Jacob'; and for the last question וּלְמִי אֵלֶּה — 'it is a gift that is being sent.'","pe":"You should [then] say, [They belong] to your servant, Yaakov. It is a present sent to my master, Eisov, and see, he is also behind us.","re":"You should [then] say, [they belong] to your servant, Yaakov. [Answer] his first [question] first and his last [question] last. That which you asked, “To whom do you belong?” [respond,] “I belong to your servant, Yaakov.” As Onkelos translates it—belonging to your servant, Yaakov. And that which you ask, “And who is the owner of this that is before you?” [respond,] “It is a present sent, etc.”","p":[{"q":"According to Rashi, how do the servant's answers correspond to Esau's questions?","o":["First question first and last question last, following the order of the questions","The servant answered only the most important question and ignored the rest","The servant changed the order and answered the last question first"]}]},"32:19.2":{"e":"Rashi clarifies that the words גַּם הוּא in the verse refer to Jacob himself — that he too is coming behind the gift.","pe":"You should [then] say, [They belong] to your servant, Yaakov. It is a present sent to my master, Eisov, and see, he is also behind us.","re":"And see, he is also behind us. [Referring to] Yaakov.","p":[{"q":"According to Rashi, to whom do the words גַּם הוּא אַחֲרֵינוּ refer?","o":["Jacob","Esau","One of the servants"]}]},"32:21.1":{"e":"Rashi explains that the word אֲכַפְּרָה means 'I will cancel his anger.' The term כַּפָּרָה when used near sin or a face means wiping away and removing, and it is an Aramaic expression. The Temple vessels were also called כְּפוֹרֵי זָהָב because the priest would wipe his hands on them.","pe":"You should also say, See, your servant Yaakov is behind us. For he said, I will appease him with the present that goes before me, and afterwards I will see his face, perhaps he will forgive me.","re":"I will appease him. [Meaning:] I will nullify [אֲכַפְּרָה] his anger [פָנָיו]. Similarly: “Your covenant with death will be nullified,” [or:] “You will not be able to nullify it.” It seems to me that whenever the term כַּפָּרָה [is used] in conjunction with iniquity and sin and anger they always signify wiping away and removing. [כַּפָּרָה] is rooted in Aramaic and is often found in the Talmud: “He wiped his hand,” “He wants to wipe his hands on this man.” In Scripture, too, the Temple vessels are called. כְּפוֹרֵי זָהָב —vessels of gold—so called because the priest would wipe his hands [from blood] on the edge of the vessel.","p":[{"q":"How does Rashi explain the word אֲכַפְּרָה in the verse?","o":["I will cancel his anger — an expression of wiping away and removing","I will ask him for forgiveness and pardon","I will give him payment and compensation"]},{"q":"What proof does Rashi bring from the Temple vessels for his explanation?","o":["כְּפוֹרֵי זָהָב — on which the priest wiped his hands at the rim of the basin","The golden vessels atoned for the sins of Israel","The Temple vessels were meant to bring atonement for iniquities"]}]},"32:22.1":{"e":"Rashi explains עַל פָּנָיו as meaning 'before him,' and brings additional verses where עַל פְּנֵי means 'before.' The Midrash adds that Jacob was filled with anger that he was forced to resort to all this.","pe":"The present passed on ahead of him, but he spent the night in the camp.","re":"Ahead of him. עַל פָּנָיו has the same meaning as לְפָנָיו —before him. Similarly: “Robbery and violence are heard in her before me, constantly.” Similarly: “Those who anger Me before Me.” The Midrashic explanation of עַל פָּנָיו [is] he [Yaakov] was also angry that he had to resort to all this.","p":[{"q":"What is the plain meaning of עַל פָּנָיו according to Rashi?","o":["Like לְפָנָיו — the gift passed before him","Jacob was angry that he was forced to resort to this","The gift passed in front of Esau's face"]},{"q":"What does the Midrash add beyond the plain meaning of the verse?","o":["Jacob was filled with anger that he was forced to resort to all this","Esau became angry when he saw the gift facing him","The gift physically passed before Esau's face"]}]},"32:23.1":{"e":"Rashi asks where Dinah was, since only eleven children are counted. He explains that Jacob hid her in a chest and locked it before her so that Esau would not set his eyes on her. For this Jacob was punished — perhaps she would have brought Esau back to the right path — and she fell into the hands of Shechem.","pe":"He got up that night and took his two wives, his two handmaids, and his eleven children, and crossed over the ford of the Yabbok [River].","re":"And his eleven children. But, where was Deenah? She had been placed in a box and locked in so that Eisov could not set eyes on her. Yaakov was thus punished for withholding her from his brother because she might have turned him to good, and she [consequently] fell into the hands of Shechem.","p":[{"q":"Why was Jacob punished for hiding Dinah, according to Rashi?","o":["Perhaps she would have brought Esau back to the right path","Because he lied to Esau about the number of his children","Because he did not trust God to protect her"]}]},"32:23.2":{"e":"Rashi clarifies that Yabok is the name of the river that Jacob crossed.","pe":"He got up that night and took his two wives, his two handmaids, and his eleven children, and crossed over the ford of the Yabbok [River].","re":"Yabbok. [יַבֹּק] is the name of the river.","p":[{"q":"What does Rashi explain about the word 'יַבֹּק'?","o":["יַבֹּק is the name of the river","יַבֹּק is the name of the place where Jacob camped","יַבֹּק means a narrow pass between mountains"]}]},"32:24.1":{"e":"Rashi explains that 'אֶת אֲשֶׁר לוֹ' refers to the animals and movable property, and that Jacob acted like a bridge — he took from one side and set it down on the other side.","pe":"He [then] took them and crossed them over the stream. He [also] brought over all that he possessed.","re":"All that he possessed. [Referring to] the cattle and movable property. [וַיַעֲבֵר —and brought over means] he acted as a bridge taking things from one side [of the river] and placing them on the other.","p":[{"q":"According to Rashi, what does 'אֶת אֲשֶׁר לוֹ' mean?","o":["The animals and movable property","His wives and children","His weapons"]},{"q":"How does Rashi describe the way Jacob carried everything across?","o":["He made himself like a bridge, taking from one side and setting down on the other","He moved everything at once on wagons","He built a raft and floated his belongings on it"]}]},"32:25.1":{"e":"Rashi explains that Jacob was left alone because he had forgotten some small jugs and went back to get them.","pe":"Yaakov remained alone, and a man wrestled with him until daybreak.","re":"Yaakov remained. He had forgotten some small jars and he returned for them.","p":[{"q":"According to Rashi, why was Jacob left alone?","o":["He had forgotten small jugs and went back for them","He wanted to pray by himself before meeting Esau","He stayed behind to guard the last camp"]}]},"32:25.2":{"e":"Rashi brings two interpretations of 'וַיֵּאָבֵק': Menachem explained it as related to dust (אָבָק), while Rashi himself holds it means grappling and embracing, from an Aramaic root. The Sages explained that the man was the guardian angel of Esau.","pe":"Yaakov remained alone, and a man wrestled with him until daybreak.","re":"A man wrestled. Menachem explained it: a man became covered with dirt, [וַיִּתְעַפֵּר] meaning אָבָק —dust, because they were kicking up dirt with their feet as a result of their movement [while struggling]. To me, however, it seems that it stems from וַיִּתְקַשֵּׁר —he attached himself and it [וַיֵּאָבֵק] is of Aramaic origin [as in] “After they became [דַאֲבִיקוּ] attached in it,” [or] “He [וַאֲבֵיק] attached it with loops, [מֵיבַק] meaning a loop. For it is the way of two who struggle for one person to throw the other down, then he grasps him and entwines him in his arms. Our Sages have explained that this was Eisov’s guardian angel.","p":[{"q":"What does 'וַיֵּאָבֵק' mean according to Rashi himself?","o":["A term for grappling and embracing, from Aramaic","A term for dust that they kicked up with their feet","A term for striking and colliding"]},{"q":"Who is the 'man' who wrestled with Jacob, according to the Sages that Rashi cites?","o":["The guardian angel of Esau","Esau himself","An angel sent by God to test him"]}]},"32:26.1":{"e":"Rashi explains that the hip socket is the upper round bone that fits into the hip joint, and it is called כַּף because the flesh on it looks like the hollow of a pot.","pe":"He [the man] saw that he could not defeat him, and he struck the socket of his hip. Yaakov’s hip joint was dislocated as he wrestled with him.","re":"And he struck the socket of his hip. The upper thigh-bone that joins the hip-bone is called the כַּף [lit. ladle] because the flesh which is on it appears like a pot-ladle.","p":[{"q":"According to Rashi, why is this part of the thigh called כַּף?","o":["Because the flesh on it looks like the hollow of a pot","Because the bone is round and flat like the palm of a hand","Because it is struck with the palm of the hand during slaughter"]}]},"32:26.2":{"e":"Rashi explains that וַתֵּקַע means that the thigh was uprooted from where it was joined. He brings proof from Jeremiah and from the language of the Mishnah that תָּקַע means removal and uprooting.","pe":"He [the man] saw that he could not defeat him, and he struck the socket of his hip. Yaakov’s hip joint was dislocated as he wrestled with him.","re":"Dislocated. [I.e.,] it was dislocated from its joint. A similar usage: “Lest my soul become [תֵּקַע] disconnected from you,” [תֵּקַע] meaning removal, dislocation. In the Mishnah [this usage can be found:]. לְקַעֲקֵעַ בֵּיצָתָן “To rip up their roots.”","p":[{"q":"According to Rashi, what does וַתֵּקַע כַּף יֶרֶךְ יַעֲקֹב mean?","o":["The thigh was uprooted from its joint — a term for removal","The thigh was completely broken — a term for breaking","The thigh was struck from outside — a term for a blow and injury"]}]},"32:27.1":{"e":"Rashi explains that the angel asked to be released because dawn had arrived and he needed to sing praises before God during the day.","pe":"He [the man] said, Let me go, for the dawn is breaking. He [Yaakov] said, I will not let you go unless you bless me.","re":"For the dawn is breaking. And I must sing [God’s] praises by day.","p":[{"q":"According to Rashi, why did the angel ask Jacob to release him at daybreak?","o":["Because the angel needed to sing praises during the day","Because the angel's power expires in daylight","Because the angel was afraid Jacob would see his face"]}]},"32:27.2":{"e":"Rashi explains that Jacob was not asking for a new blessing, but rather that the angel should confirm the blessings that his father Isaac had given him, which Esau had contested.","pe":"He [the man] said, Let me go, for the dawn is breaking. He [Yaakov] said, I will not let you go unless you bless me.","re":"You bless me. [Meaning:] concede to me the blessings with which my father blessed me, those which Eisov has been protesting.","p":[{"q":"According to Rashi, what was Jacob asking for when he said כִּי אִם בֵּרַכְתַּנִי?","o":["That the angel acknowledge the blessings of Isaac that Esau had contested","That the angel give him a new blessing of his own","That the angel promise him that Esau would not fight him"]}]},"32:29.1":{"e":"Rashi explains that the angel told Jacob that the blessings would no longer be described as having come through trickery and deceit, but rather through authority and openly. The angel wept and pleaded with Jacob to wait until Beth El, but Jacob refused, and the angel acknowledged the blessings in his favor against his will.","pe":"He [the man] said, No longer will your name be spoken of as Yaakov, but as Yisrael, for you have contended with God[ly beings] and with men, and you have won.","re":"No longer … Yaakov. [I.e.,] it will no longer be said that the blessings came to you through deceit and trickery, but, rather, with nobility and openness, and, in the end, God will reveal Himself to you in Beis Eil, and change your name, and, there, He will bless you and I, too, will be there and will concede them to you. That is what is written: “He struggled with an angel and prevailed, he cried and pleaded with him” [which means] the angel cried and pleaded with him. What was the matter about which he pleaded? “At Beis Eil He will find us and there He will speak with us,” [which means] “Wait for me until He will speak with us there.” Yaakov refused [to wait] and given no choice he had to concede them to him. That is meant by what is said: “He then blessed him there,” for he pleaded with Yaakov to wait for him but he [Yaakov] did not agree.","p":[{"q":"According to Rashi, what did the angel ask of Jacob when he pleaded with him?","o":["That he wait for him until God would speak with them in Beth El","That he return to Esau the blessings he had taken from him","That he release him immediately because he had to sing a song"]},{"q":"According to Rashi, what is the meaning of the name change from Jacob to Israel?","o":["That the blessings came to him with authority and openly, not through trickery","That he became a ruler and governor over all the nations","That he defeated the angel by physical strength alone"]}]},"32:29.2":{"e":"Rashi explains that the \"men\" Jacob struggled with were Esau and Laban.","pe":"He [the man] said, No longer will your name be spoken of as Yaakov, but as Yisrael, for you have contended with God[ly beings] and with men, and you have won.","re":"And with men. [Referring to] Eisov and Lavan.","p":[{"q":"According to Rashi, who are the \"men\" that Jacob struggled with?","o":["Esau and Laban","Esau and the angel","Laban and Pharaoh"]}]},"32:29.3":{"e":"Rashi explains that the word וַתּוּכַל means that Jacob prevailed over them — that is, he defeated them.","pe":"He [the man] said, No longer will your name be spoken of as Yaakov, but as Yisrael, for you have contended with God[ly beings] and with men, and you have won.","re":"And you have won. Over them.","p":[{"q":"According to Rashi, what does the word וַתּוּכַל complete in the verse?","o":["וַתּוּכַל לָהֶם — you prevailed over them","וְתוּכַל לִסְלֹוחַ — you forgave them","וְתוּכַל לִבְרֹוחַ — you escaped from them"]}]},"32:30.1":{"e":"Rashi explains that the angel answered that angels have no permanent name — their names change according to the mission they are sent on.","pe":"Yaakov asked him, and said, Please tell me your name. He said, Why then do you ask my name? He then blessed him [Yaakov] there.","re":"Why then do you ask? We do not have a set name. Our names keep changing all depending on the command of the mission we are sent to fulfill.","p":[{"q":"According to Rashi, why did the angel not reveal his name to Jacob?","o":["Because angels have no permanent name — their name changes according to their mission","Because an angel is forbidden to reveal his name to human beings","Because the angel was ashamed of his failure in the struggle with Jacob"]}]},"32:32.1":{"e":"Rashi offers two explanations: According to the plain meaning, this is an ordinary expression people use when they arrive at a place and the dawn shines on them. According to the Midrash, the sun shone especially for Jacob in order to heal his thigh, and just as it had hastened to set for him when he left Beer Sheba, so it hastened to rise for him.","pe":"The sun shone for him as he passed by Penuel, and he limped due to his hip.","re":"The sun shone for him. It is an expression that people use: “When we reached such-and-such a place the dawn broke for us.” That is the simple explanation. The Midrashic explanation of וַיִּזְרַח לוֹ is for his needs, to heal his lameness, as it states: “The sun of righteousness and healing in its wings.” Those hours that [the sun] prematurely set for him when he left Beer Sheva, it [now] prematurely rose for him.","p":[{"q":"According to the Midrash that Rashi cites, why did the sun hasten to shine for Jacob?","o":["In order to heal his thigh, as it is said שֶׁמֶשׁ צְדָקָה וּמַרְפֵּא","In order to light his way back to the Land of Israel","In order to mark that he had won the struggle with the angel"]},{"q":"What connection does Rashi draw between the setting of the sun and its rising?","o":["Just as it hastened to set for him, it hastened to rise for him","The sun set as a punishment and rose as a sign of forgiveness","The setting of the sun marked the beginning of the struggle and its rising marked the end"]}]},"32:32.2":{"e":"Rashi notes precisely that Jacob was limping specifically at the moment the sun rose — meaning the limp did not continue after that.","pe":"The sun shone for him as he passed by Penuel, and he limped due to his hip.","re":"And he limped. He was limping [only] when the sun rose.","p":[{"q":"What does Rashi note precisely about the timing of Jacob's limp?","o":["He limped only when the sun rose, and then he was healed","He began to limp immediately after the struggle with the angel","He limped all his days as a remembrance of the struggle"]}]},"32:33.1":{"e":"Rashi explains that the גִּיד הַנָּשֶׁה is called by this name because it נָשָׁה — it jumped from its place and went up. The word נָשָׁה means jumping, and this same usage is found in other verses as well.","pe":"Therefore, the children of Israel must not eat the displaced tendon [nerve] which is on the hip joint to this very day; because he struck Yaakov’s hip joint on the displaced tendon.","re":"The displaced tendon. Why is it called the גִיד הַנָּשֶׁה? Because it was dislocated and moved up. It [the word נָשֶׁה] means springing. So, too, “Their strength sprang away,” also, “For God has caused all my suffering to spring away.”","p":[{"q":"According to Rashi, why is the גִּיד הַנָּשֶׁה called by this name?","o":["Because the sinew jumped from its place and went up","Because the sinew caused Jacob to forget the pain","Because the angel struck Jacob's thigh forcefully"]}]},"33:2.1":{"e":"Rashi explains that Jacob arranged his wives and children so that whoever was mentioned last was the most beloved, and therefore Rachel and Joseph were mentioned last.","pe":"He placed the handmaids and their children foremost, Leah and her sons behind them, and Rochel and Yoseif in the rear.","re":"Leah and her sons behind them. The later [mentioned] the more beloved.","p":[{"q":"What rule does Rashi teach from the order in which the wives and children were placed?","o":["אַחֲרוֹן אַחֲרוֹן חָבִיב — the later one is the more beloved","Jacob placed the strongest ones last in order to protect them","Jacob arranged them by age, from oldest to youngest"]}]},"33:3.1":{"e":"Jacob walked in front of his family toward Esau, because he thought that if Esau came to fight — it would be better for Esau to fight Jacob first and not the women and children.","pe":"He went ahead of them, and he prostrated himself to the earth seven times, until he approached his brother.","re":"Went ahead of them. He thought, “If that wicked one will come to do battle, let him do battle first with me.”","p":[{"q":"According to Rashi, why did Jacob walk in front of his family toward Esau?","o":["So that if Esau fights — he would fight Jacob first","To honor Esau and go out to meet him first","To show Esau that he was not afraid of him"]}]},"33:4.1":{"e":"Rashi explains that Esau hugged Jacob because his compassion was stirred toward him, after he saw Jacob bowing down many times.","pe":"Eisov ran to meet him. He hugged him and fell on his neck and kissed him. They [both] wept.","re":"He hugged him. His pity was aroused when he saw him bowing so many times.","p":[{"q":"According to Rashi, what caused Esau to hug Jacob?","o":["He saw Jacob bowing down many times and his compassion was stirred","He wanted to show Jacob's family that he was a good person","He remembered the brotherly love from their childhood days"]}]},"33:4.2":{"e":"The word וַיִּשָּׁקֵהוּ has dots over it. Some interpreted that Esau did not kiss Jacob wholeheartedly. But Rabbi Shimon ben Yochai said that it is a rule that Esau hates Jacob, but at that particular moment his compassion was stirred and he kissed him wholeheartedly.","pe":"Eisov ran to meet him. He hugged him and fell on his neck and kissed him. They [both] wept.","re":"And kissed him. There are dots above [the word וַיִּשָּׁקֵהוּ]. There is a difference of opinion concerning this matter in the Beraysa of the Sifre. There are those who explained these dots as saying that he did not kiss him wholeheartedly. R. Shimon b. Yochai said: “It is a rule that it is common knowledge that Eisov hates Yaakov, but, his pity was aroused at that moment and he kissed him wholeheartedly.","p":[{"q":"What is the debate about the dots on the word וַיִּשָּׁקֵהוּ?","o":["Whether Esau kissed Jacob wholeheartedly or did not kiss him wholeheartedly","Whether Esau kissed him on the forehead or on the cheek","Whether the kiss was a sign of peace or a sign of war"]},{"q":"What is Rabbi Shimon ben Yochai's view about Esau's kiss?","o":["His compassion was stirred at that moment and he kissed Jacob wholeheartedly","Esau pretended and kissed Jacob but not sincerely","Esau kissed Jacob out of fear of Jacob's strength"]}]},"33:5.1":{"e":"Rashi explains that מִי אֵלֶּה לָךְ means: who are these who are worthy of being yours — that is, who are they that you merited having.","pe":"[Eisov] raised his eyes and saw the women and children. He said, Who are these to you? He [Yaakov] said, These are the children whom God has graciously granted your servant.","re":"Who are these to you? [Meaning:] “Who are these that they should be yours?”","p":[{"q":"How does Rashi explain Esau's question מִי אֵלֶּה לָךְ?","o":["Who are these who are worthy of being yours","What are the names of these children","Why did you bring them to me"]}]},"33:7.1":{"e":"With all the maidservants and the tribes, the mothers went before their children to bow down to Esau. But Joseph went before his mother Rachel in order to block Esau's gaze from her, because she was beautiful. Because of this act, Joseph merited the blessing of עֲלֵי עַיִן.","pe":"Leah and her children also approached and prostrated themselves, and finally Yoseif and Rochel approached and prostrated themselves.","re":"Yoseif and Rochel approached In each case the mothers stepped forward ahead of the children, but, in the case of Rochel Yoseif steped forward ahead of her. He thought: “My mother is beautiful, lest that wicked man desire her, I will stand in front of her and prevent him from gazing upon her.” It is from this [incident] that Yoseif merited the [Yaakov’s] blessing of עֲלֵי עָיִן “at the well.”","p":[{"q":"Why did Joseph go before Rachel, according to Rashi?","o":["To block Esau from looking at his beautiful mother","To show honor to Esau before his mother","Because he was Rachel's firstborn and that is the custom"]},{"q":"What did Joseph merit because of this act, according to Rashi?","o":["The blessing of עֲלֵי עַיִן","The blessing of בֶּן פֹּורָת יוֹסֵף","The blessing of רֵאשִׁית אוֹנוֹ"]}]},"33:8.1":{"e":"Rashi explains Esau's question in two ways: according to the plain meaning, Esau asked about the people leading the gift who he had encountered. According to the Midrash, Esau encountered groups of angels who pushed him and his men, and only when they heard that he was Jacob's brother did they agree to leave them alone.","pe":"He [Eisov] said, What do you have to do with that whole camp that approached me? He [Yaakov] said, It was to find favor in the eyes of my master.","re":"What do you have to do with that whole camp. [I.e.,] “Who is this entire camp that I have met that is yours”—meaning to say: “What is its purpose to you?” And the simple explanation of the verse is that it is referring to the gift-bearers. The Midrashic explanation, [however], is: He [Eisov] met up with groups of angels that were shoving him and his people and saying to them, “Who are you?” and they responded, “[We belong] to Eisov,” [whereupon the angels] said, “Hit them! Hit them!” [Eisov’s people, then] said, “Release him, He is Yitzchok’s son!” They [the angels] paid no attention to this: “He is Avraham’s grandson!” They [the angels] paid no attention to this. “He is Yaakov’s brother!” [whereupon] they [the angels] responded to them, “If that is so, you are one of ours!”","p":[{"q":"According to the Midrash that Rashi brings, when did the angels stop attacking Esau?","o":["When they heard that he was Jacob's brother","When they heard that he was Isaac's son","When they heard that he was Abraham's grandson"]}]},"33:9.1":{"e":"When Esau said יְהִי לְךָ אֲשֶׁר לָךְ to Jacob, he was in effect acknowledging the blessings that Jacob had taken from him and giving them up.","pe":"Eisov said, I have plenty. My brother, let what you have remain yours.","re":"Let what you have, remain yours. Here, he conceded the blessings to him.","p":[{"q":"What is the meaning of Esau's words יְהִי לְךָ אֲשֶׁר לָךְ, according to Rashi?","o":["Esau acknowledged to Jacob the blessings that Jacob had received","Esau refused to accept the gift from Jacob","Esau asked Jacob to keep his possessions"]}]},"33:10.1":{"e":"Rashi explains that Jacob's intention in saying אַל נָא was: please do not say that to me — meaning, do not refuse my gift.","pe":"Yaakov said, Please, no. If I have found favor in your eyes, take my present from my hand, because I have seen your face [and it was] like seeing the face of a God[ly being]; and you have received me favorably.","re":"Please, no. [Meaning:] do not tell me this.","p":[{"q":"How does Rashi explain the words אַל נָא that Jacob said?","o":["Please do not say that to me, meaning do not refuse","Please do not be angry at me about the blessings","Please do not leave here before me"]}]},"33:10.2":{"e":"Rashi explains that Yaakov told Esav that it was right for him to accept his gift, because seeing Esav's face was as important to him as seeing the face of an angel — since he had seen Esav's guardian angel. Additionally, Esav had agreed to forgive him. Rashi adds that Yaakov mentioned the angel so that Esav would be afraid of him and think: he saw angels and survived — I cannot overpower him.","pe":"Yaakov said, Please, no. If I have found favor in your eyes, take my present from my hand, because I have seen your face [and it was] like seeing the face of a God[ly being]; and you have received me favorably.","re":"If I have found favor in your eyes take my present from my hand, because I have seen your face, etc. [Meaning:] for it is right and proper for you to accept my gift as a result of my having seen your face which is as esteemed to me as seeing the face of an angel, for I have seen your guardian angel. And another reason [that you should accept my gift], for you have agreed to forgive me for my wrongdoing [i.e., the stealing of the blessings]. Why did he [Yaakov] mention seeing the angel? So that he [Eisov] might fear him and think, “He has seen angels and survived, now, I certainly cannot overcome him.”","p":[{"q":"According to Rashi, why did Yaakov compare seeing Esav's face to seeing the face of God?","o":["Because he had seen Esav's guardian angel, and seeing Esav's face was as important to him as seeing the face of an angel","Because Esav appeared to him at that moment like an angel of mercy sent from heaven","Because he wanted to flatter Esav and honor him so that he would accept the gift"]},{"q":"According to Rashi, why did Yaakov mention to Esav that he had seen an angel?","o":["So that Esav would fear him and say: he saw angels and survived — I cannot overpower him","To show Esav that he deserved the blessings he had received from their father","To convince Esav that God was sending him peace and love"]}]},"33:10.3":{"e":"Rashi explains that וַתִּרְצֵנִי means \"you were appeased toward me.\" Every expression of רָצוֹן in the Torah is an expression of appeasement, just as with the bringing of sacrifices, which come to appease and make amends.","pe":"Yaakov said, Please, no. If I have found favor in your eyes, take my present from my hand, because I have seen your face [and it was] like seeing the face of a God[ly being]; and you have received me favorably.","re":"And you have received me favorably. [Meaning:] you have become reconciled to me. Similarly every term רָצוֹן in Scripture [means] appeasement, apeiement in O.F., as in “It shall not be acceptable for you” [because] sacrifices serve to appease and to conciliate. Similarly, “The lips of the righteous know רָצוֹן,” [meaning:] they know how to appease and conciliate.","p":[{"q":"According to Rashi, what is the meaning of the word וַתִּרְצֵנִי?","o":["You were appeased toward me — an expression of appeasement and making amends","You desired me — an expression of will and affection","You accepted me — an expression of acceptance and agreement"]}]},"33:11.1":{"e":"Rashi explains that בִּרְכָתִי means \"my gift.\" A gift brought at the time of greeting someone is nothing other than a form of saying hello, and so every בְּרָכָה in the Torah connected to greeting someone is a greeting of peace — such as וַיְבָרֶךְ יַעֲקֹב אֶת פַּרְעֹה and similar cases.","pe":"Please accept my blessing as it was brought to you, for God has been gracious to me, for I have everything. He thus urged him and he took it.","re":"My blessing. [Meaning:] my gift. This kind of a gift, which is brought on the occasion of meeting someone at intervals is meant only as a greeting, as is every blessing given on the occasion of meeting, such as “And Yaakov blessed Pharoah,” and “Make peace with me,” regarding Sancheriv. Similarly, “To greet him and to bless him” concerning Toey, King of Chamas; all these are greetings which are called saluder in O.F. Here, too, בִּרְכָתִי means mon salud [in O.F.].","p":[{"q":"According to Rashi, why did Yaakov call his gift בִּרְכָתִי?","o":["Because a gift brought when greeting someone is a blessing of peace","Because the gift included an explicit blessing that Yaakov said to Esav","Because Yaakov wished that the gift would bring blessing and success to Esav"]}]},"33:11.2":{"e":"Rashi explains that Yaakov said to Esav: you did not labor for it, while I worked hard to bring it until it reached your hands — meaning, please accept it because I put in great effort to bring it to you.","pe":"Please accept my blessing as it was brought to you, for God has been gracious to me, for I have everything. He thus urged him and he took it.","re":"As it was brought to you. You did not need to exert yourself for it, whereas, I toiled to transport it until it has [finally] come into your hand.","p":[{"q":"According to Rashi, what did Yaakov want to emphasize by saying אֲשֶׁר הֻבָאת לְךָ?","o":["That Esav had not labored for it, while Yaakov had worked hard to bring it all the way to him","That the gift was brought by special messengers whom Yaakov had sent ahead","That the gift was given to Esav as a present from God and not from Yaakov"]}]},"33:11.3":{"e":"Rashi explains that the first נ in the word חָנֵּנִי has a dagesh because it stands in place of two נs. The root is חָנַן (with two נs), and the third נ is the suffix נ as in עָשַׂנִי and זְבָדַנִי.","pe":"Please accept my blessing as it was brought to you, for God has been gracious to me, for I have everything. He thus urged him and he took it.","re":"Has been gracious. The first נוּ\"ן [in the word חַנַּנִי] contains a dagesh because it serves in the place of two נוּנִי\"ן, for, grammatically, it should have said חֲנָנַנִי because the root, חָנן, is never without two נוּנִי\"ן whereas the third one is a formative letter as in עָשַׂנִי —He made me; זְבָדַנִי —a portion.","p":[{"q":"Why does the first נ in the word חָנֵּנִי have a dagesh, according to Rashi?","o":["Because it stands in place of the two נs of the root חָנַן","Because the dagesh comes to emphasize the act of showing favor","Because every נ at the beginning of a word receives a dagesh"]}]},"33:11.4":{"e":"Rashi explains that Yaakov said יֵשׁ לִי כֹל — I have everything I need. Esav, by contrast, spoke with pride and said יֵשׁ לִי רָב — I have much more than I need.","pe":"Please accept my blessing as it was brought to you, for God has been gracious to me, for I have everything. He thus urged him and he took it.","re":"I have everything. [כֹּל —“everything,” means] all that I need. Whereas, Eisov expressed himself haughtily: “I have plenty,” [meaning] much more than my needs.","p":[{"q":"What is the difference between Yaakov's phrase יֵשׁ לִי כֹל and Esav's phrase יֵשׁ לִי רָב, according to Rashi?","o":["Yaakov said he has everything he needs, while Esav boasted that he has more than he needs","Yaakov said he has absolutely everything, while Esav admitted that he was lacking something","They both said the same thing but in different words"]}]},"33:12.1":{"e":"Rashi explains that the word נָסְעָה is not plural but singular, like שִׁמְעָה and סְלָחָה which mean \"hear\" and \"forgive.\" The נ is part of the root. Esav was saying to Yaakov: let us travel from here and go.","pe":"He [Eisov] said, Go and we will move on, and I will move on with you.","re":"Go. As in שְׁמָעָה, סְלָחָה, which is the same as שְׁמַע [Listen!] סְלַח [Forgive!] Here, too, נִסְעָה is the same as נְסַע, with the נוּ\"ן being part of the root of the word. The translation of Onkelos טוּל וּנְהַךְ [also supports this,] i.e., Eisov said to Yaakov, “Let us journey from here and go on!”","p":[{"q":"How does Rashi explain the word נָסְעָה — is it singular or plural?","o":["Singular, like שִׁמְעָה and סְלָחָה","Plural — you and I travel together","An expression of request — please, let us travel"]}]},"33:12.2":{"e":"Rashi explains that וְאֵלְכָה לְנֶגְדְּךָ means: I will walk at the same pace as you. Esav offered to slow down his journey and walk at Yaakov's pace.","pe":"He [Eisov] said, Go and we will move on, and I will move on with you.","re":"I will move on with you. [Meaning:] at a pace equal to yours. “This I will do for you that I will extend the time of my travel by traveling slowly, as is your need.” This is the meaning of לְנֶגְדֶךָ —equal to you.","p":[{"q":"What is the meaning of לְנֶגְדְּךָ according to Rashi?","o":["At the same pace as you — walking at the same speed as you","In front of you — I will walk ahead of you and lead you","Opposite you — I will walk in the direction away from you"]}]},"33:13.1":{"e":"Rashi explains that the words \"עֲלוֹת עָלַי\" mean that the nursing flocks and herds are placed upon Jacob to lead them slowly — that is, they are his responsibility.","pe":"He [Yaakov] said to him, My master knows that the children are delicate, and that the sheep and cattle with me are nursing. If they are driven hard for [even] one day, all the sheep will die.","re":"With me are nursing. [Meaning:] the sheep and the cattle who are suckling, are my responsibility to drive them slowly.","p":[{"q":"According to Rashi, what is the meaning of \"עֲלוֹת עָלַי\"?","o":["The nursing flocks are placed upon him to lead them slowly","The flocks climb the mountain together with him","The flocks are a heavy financial burden on him"]}]},"33:13.2":{"e":"Rashi explains that the word \"עָלוֹת\" means raising their young — that is, nursing — from the same root as \"עוֹלֵל וְיוֹנֵק\" (infant and nursling). He brings additional proofs from the Bible for this root.","pe":"He [Yaakov] said to him, My master knows that the children are delicate, and that the sheep and cattle with me are nursing. If they are driven hard for [even] one day, all the sheep will die.","re":"Nursing. [So called because] they raise their young, [עָלוֹת is] from the same root as. עוֹלֵל וְיוֹנֵק —“The young and the sucklings,” [or] עוּל יָמִים —“An infant of only a few days,” [or] שְׁתֵּי פָרוֹת עָלוֹת —“Two nursing cows.” In O.F. enfanteis.","p":[{"q":"According to Rashi, what is the meaning of the word \"עָלוֹת\"?","o":["Raising their young, from the language of עוֹלֵל וְיוֹנֵק (infant and nursling)","Traveling along the road and climbing mountains","Carrying a heavy load on their backs"]}]},"33:13.3":{"e":"Rashi explains that \"וּדְפָקוּם\" means exhausting them by driving them quickly, and if this is done even one day, all the flocks will die.","pe":"He [Yaakov] said to him, My master knows that the children are delicate, and that the sheep and cattle with me are nursing. If they are driven hard for [even] one day, all the sheep will die.","re":"If they are driven hard for [even] one day. Exhausting them by rushing them and thereby causing all the sheep to die.","p":[{"q":"According to Rashi, what is the concern with \"וּדְפָקוּם יוֹם אֶחָד\"?","o":["That they will exhaust the flocks by driving them too fast and they will die","That an enemy will suddenly strike them in one day","That the flocks will lose their way on a stormy day"]}]},"33:13.4":{"e":"Rashi explains that the word \"וּדְפָקוּם\" comes from the language of knocking, like \"קוֹל דּוֹדִי דּוֹפֵק\" — knocking on the door — meaning striking and beating.","pe":"He [Yaakov] said to him, My master knows that the children are delicate, and that the sheep and cattle with me are nursing. If they are driven hard for [even] one day, all the sheep will die.","re":"If they are driven. As in “The sound of my beloved is knocking,” [meaning:] knocking at the door.","p":[{"q":"To which verse does Rashi compare the word \"וּדְפָקוּם\"?","o":["\"קוֹל דּוֹדִי דּוֹפֵק\" — knocking on the door","\"דָּפַקְתִּי עַל לִבִּי\" — I reflected in my heart","\"וְדָפַק עַל הַחוֹמָה\" — striking the wall in a siege"]}]},"33:14.1":{"e":"Rashi explains that Jacob asked Esau not to slow his pace on his account, but to continue at his own usual speed even if he moved far ahead.","pe":"Please my master, go on ahead of your servant. I will lead on gently, in my slow pace, according to the pace of the work that is before me, and according to the pace of the children, until I come to my master in Seir.","re":"Please go on ahead, my master. [I.e.,] please do not extend the length of your trip. Pass on at your normal pace, though you will thereby distance yourself.","p":[{"q":"What did Jacob ask of Esau according to Rashi?","o":["That he go at his own usual pace and not slow his journey","That he go slowly so that Jacob would be able to catch up to him","That he wait in place until Jacob arrived"]}]},"33:14.2":{"e":"Rashi explains that the word \"אֶתְנַהֲלָה\" is the same as \"אֶתְנַהֵל,\" and the ה at the end is an extra letter, just as we find with \"אֵרְדָה\" and \"אֶשְׁמְעָה\".","pe":"Please my master, go on ahead of your servant. I will lead on gently, in my slow pace, according to the pace of the work that is before me, and according to the pace of the children, until I come to my master in Seir.","re":"Lead on gently. [The same as] אֶתְנַהֵל, the הֵ\"א being extra, as in אֵרְדָה —[the same as אֵרֵד] [or] אֶשְׁמְעָה —[the same as אֶשְׁמַע].","p":[{"q":"What does Rashi explain about the form of the word \"אֶתְנַהֲלָה\"?","o":["The ה is extra, just like אֵרְדָה and אֶשְׁמְעָה","The ה indicates direction, like \"בֵּיתָה\"","The ה is a marker for the third person, not the speaker"]}]},"33:14.3":{"e":"Rashi explains that \"לְאִטִּי\" means my own slowness, an expression of ease. The lamed is part of the root and not a prefix letter — meaning: I will move along at my own gentle pace.","pe":"Please my master, go on ahead of your servant. I will lead on gently, in my slow pace, according to the pace of the work that is before me, and according to the pace of the children, until I come to my master in Seir.","re":"In my slow pace. [Meaning:] my slowness. [לְאַט] meaning slowly, calmly, [as in] “That go softly” [or] “Be gentle for me with the young one.” In my slow pace. The letter למ\"ד is part of the root and is not a prefix [אֶתְנַהַלָה לְאִטִי means] according to my slowness.","p":[{"q":"What does Rashi teach us about the lamed in the word \"לְאִטִּי\"?","o":["The lamed is part of the root and is not a prefix letter","The lamed is a prefix letter meaning \"according to\"","The lamed indicates direction, like \"לְבֵיתוֹ\""]}]},"33:14.4":{"e":"Rashi explains that \"לְרֶגֶל הַמְּלָאכָה\" means according to the pace needed by the feet of the livestock that he is responsible to lead.","pe":"Please my master, go on ahead of your servant. I will lead on gently, in my slow pace, according to the pace of the work that is before me, and according to the pace of the children, until I come to my master in Seir.","re":"According to the pace of the work. According to the requirement of the pace of the feet of the work [flocks] that I have the responsibility of leading.","p":[{"q":"What is the \"מְּלָאכָה\" that Jacob is referring to, according to Rashi?","o":["The livestock that he is responsible to lead","The work his servants did in the fields","The gifts he had prepared for Esau"]}]},"33:14.5":{"e":"Rashi explains that 'לְרֶגֶל הַיְלָדִים' means according to the pace that the children are able to walk — in other words, at whatever speed their feet can manage.","pe":"Please my master, go on ahead of your servant. I will lead on gently, in my slow pace, according to the pace of the work that is before me, and according to the pace of the children, until I come to my master in Seir.","re":"And according to the pace of the children. [Meaning:] according to their feet [pace] that they are capable of traveling.","p":[{"q":"What does 'לְרֶגֶל הַיְלָדִים' mean according to Rashi?","o":["According to the pace that the children are able to walk","Because the children need to rest along the way","So that the children will learn to travel on foot"]}]},"33:14.6":{"e":"Rashi explains that Yaakov did not really intend to go to Se'ir — only as far as Sukkot. He mentioned a distant destination so that if Esav wanted to harm him, Esav would wait in vain. In the future, in the days of Mashiach, Yaakov will indeed arrive at Se'ir to judge the mountain of Esav.","pe":"Please my master, go on ahead of your servant. I will lead on gently, in my slow pace, according to the pace of the work that is before me, and according to the pace of the children, until I come to my master in Seir.","re":"Until I come to my master in Seir. He [Yaakov] set a greater distance [for his meeting Eisov], for he intended to go only until Sukkos. He thought: “If he intends to harm me, let him wait until I come to him.” And, therefore, he did not go [to Seir]. When will he [eventually] go? In the days of the Moshiach, as it is said: “And deliverers will go up to Mount Zion to judge Mount Eisov.” There are many Midrashic explanations to this narrative.","p":[{"q":"Where did Yaakov really intend to go, according to Rashi?","o":["Only as far as Sukkot, and not to Se'ir","To Se'ir, as he told Esav","To Beit El to bring offerings"]},{"q":"When will 'עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה' be fulfilled, according to Rashi?","o":["In the days of Mashiach, as stated in Ovadyah","When Yaakov returned from Lavan","When Yaakov and Esav met again in Chevron"]}]},"33:15.1":{"e":"Rashi explains that Yaakov said to Esav: Why would you do me this favor? I do not need it.","pe":"Eisov said, Let me leave with you some of the people that are with me. He [Yaakov] said, What for? Let me find favor in the eyes of my master.","re":"He [Yaakov] said, “what for”— Do you do this favor for me for which I have no need.","p":[{"q":"What did Yaakov mean by 'לָמָּה זֶה' according to Rashi?","o":["Why would you do me a favor that I do not need","Why are you offering something that will be a burden to you","Why do you suspect that I am afraid of you"]}]},"33:15.2":{"e":"Rashi explains that Yaakov asked Esav not to repay him anything now — only to find favor in his eyes.","pe":"Eisov said, Let me leave with you some of the people that are with me. He [Yaakov] said, What for? Let me find favor in the eyes of my master.","re":"Let me find favor in the eyes of my master. And do not reward me now in any manner.","p":[{"q":"What was Yaakov asking when he said 'אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי', according to Rashi?","o":["That Esav should not repay him anything now","That Esav should forgive him for what he had done in the past","That Esav should love him like a brother from now on"]}]},"33:16.1":{"e":"Rashi explains that Esav returned alone because the four hundred men who had accompanied him slipped away from him one by one. God repaid them in the days of David, as it says, 'except for four hundred young men who rode on camels.'","pe":"On that day Eisov returned on his way—going to Seir.","re":"On that day Eisov returned on his way. Eisov alone [returned] whereas, the four hundred men that had gone with him slipped away from him, one by one. Where did God reward them [for this]? In the days of Dovid, as it is said, “Except for four hundred young men who rode upon the camels.”","p":[{"q":"What happened to the four hundred men who went with Esav, according to Rashi?","o":["They slipped away from him one by one and Esav returned alone","They stayed with Yaakov and served him","They all returned together with Esav to Se'ir"]}]},"33:17.1":{"e":"Rashi explains that Yaakov stayed in Sukkot for eighteen months: a summer, a winter, and a summer. The first mention of 'סֻכּוֹת' hints at summer, 'בַּיִת' hints at winter, and the second 'סֻכּוֹת' hints at another summer.","pe":"Yaakov traveled to Sukkos and built himself a house, and for his livestock he made shelters. He therefore named the place Sukkos.","re":"And built himself a house. He stayed there eighteen months; a summer, a winter, and [another] summer. [The first mention of] סֻכּוֹת [booths] is [one] summer. [The mention of] בַּיִת [house] is a winter. [The second mention of] סֻכּוֹת is [another] summer.","p":[{"q":"How long did Yaakov stay in Sukkot, and how does Rashi learn this?","o":["Eighteen months — from the mention of סֻכּוֹת, בַּיִת, and סֻכּוֹת in the verse","One year — from the mention of בַּיִת alone","Three years — one year for each season mentioned"]}]},"33:18.1":{"e":"Rashi interprets the word 'שָׁלֵם' in three ways: whole in his body — he had healed from his limp; whole in his money — he had lost nothing despite the gift to Esav; and whole in his Torah — he had not forgotten his learning while in Lavan's house.","pe":"Yaakov arrived safely at the city of Shechem, which is in the Land of Canaan, when he came from Padan Aram. He encamped before the city.","re":"Safely. Safe [whole] in body, for he was healed from his lameness. Safe [whole] in his possessions for he was not lacking anything despite all of that gift [that was given to Eisov]. Safe [whole] in his Torah [knowledge], for he did not forget his learning at Lavan’s house.","p":[{"q":"What are the three meanings of 'שָׁלֵם' according to Rashi?","o":["Whole in his body, in his money, and in his Torah","Whole in his body, in his family, and in his faith","Whole in his soul, in his honor, and in his trust"]}]},"33:18.2":{"e":"Rashi explains that the word 'עִיר' here means 'to the city' — that is, to the city of Shechem — just as 'עַד בּוֹאֲנָה בֵּית לֶחֶם' means 'to Beit Lechem.'","pe":"Yaakov arrived safely at the city of Shechem, which is in the Land of Canaan, when he came from Padan Aram. He encamped before the city.","re":"At the city of Shechem. [עִיר] is the same as לָעִיר —to the city. Similarly: “Until they came [to] Beis Lechem.”","p":[{"q":"How does Rashi explain the word 'עִיר' in the phrase 'עִיר שְׁכֶם'?","o":["Like 'לָעִיר' — meaning to the city of Shechem","As a proper noun — עִיר is the name of a place","As a walled fortress, in contrast to a village"]}]},"33:18.3":{"e":"Rashi explains that the Torah mentions \"בְּבֹאוֹ מִפַּדַּן אֲרָם\" to tell us that Jacob arrived safely from the dangers of the journey — from Laban and from Esau, who both confronted him along the way — like someone who says that his friend came out safely from between two lions.","pe":"Yaakov arrived safely at the city of Shechem, which is in the Land of Canaan, when he came from Padan Aram. He encamped before the city.","re":"When he came from Padan Aram. Just as a person would tell another, “So and so has escaped from the lions’ teeth and has returned safely.” Here, too, he returned safely from Padan Aram. [Meaning:] from Lavan and Eisov who had confronted him on his way [back].","p":[{"q":"According to Rashi, what does the Torah teach with the words \"בְּבֹאוֹ מִפַּדַּן אֲרָם\"?","o":["That Jacob was saved from two dangers — from Laban and from Esau, who encountered him on the way","That Jacob returned to the land of Canaan from Padan Aram without stopping along the way","That Jacob arrived at Shechem after many long years in exile"]}]},"33:19.1":{"e":"Rashi explains that \"קְשִׂיטָה\" is a coin called a \"מָעָה.\" Rabbi Akiva testified that in the port cities overseas, a מָעָה was called a קְשִׂיטָה. The Targum's translation \"חורפן\" means good coins that are accepted in trade.","pe":"He bought the part of the field where he had spread his tent, from the sons of Chamor, father of Shechem, for one hundred kesitahs.","re":"Kesitah. [A coin called a] mo’oh. R. Akiva said: “When I journeyed to the port cities [I noted that] they referred to a mo’oh as kesitah.” (Onkelos renders it חוּרְפָן —good ones, i.e., that are negotiable everywhere; the same as עוֹבֵר לַסּוֹחֵר —negotiable currency.)","p":[{"q":"According to Rashi, what is a \"קְשִׂיטָה\"?","o":["A coin called a מָעָה, as Rabbi Akiva testified from the port cities overseas","A unit of silver weight that was used in the land of Canaan","A special coin used only for purchasing land"]}]},"33:20.1":{"e":"Rashi clarifies that it was not the altar that was called \"אֱלֹהֵי יִשְׂרָאֵל\" — rather, Jacob gave the altar a name to commemorate the miracle, that God had been with him and saved him. The meaning of the name is: the One who is God, the Holy One blessed be He, is my God — I whose name is Israel. Rashi brings a parallel example from Moses's altar, \"ה׳ נִסִּי.\"","pe":"He erected an altar there and called it the Almighty is God of Yisrael.","re":"And called it, “the Almighty is God of Yisrael.” Not that the altar was called “God of Israel,” but, rather, since God had been with him and had saved him, he gave the altar a name reminiscent of the miracle so that the praise of God be recalled by calling [the altar] by [this] name. I.e., “He Who is Almighty, God, He is God to me, whose name is Yisrael.” We find something similar concerning Moshe: “And he called its name ה' נִסִי .” Not that the altar was called God, but, rather, reminiscent of the miracle he named the altar to recall the praise of God, i.e., “God is my miracle.” Our Sages interpret it that it was God who called Yaakov— אֵל. The words of the Torah are as a hammer that splinters stone [in that] they can be divided into many interpretations. But, I intend only to give the plain explanation of Scripture.","p":[{"q":"According to Rashi's explanation, why did Jacob call the altar \"אֵל אֱלֹהֵי יִשְׂרָאֵל\"?","o":["To commemorate the praise of God who had been with him and saved him","To hint at his new name \"יִשְׂרָאֵל\" that he had received from the angel","To give thanks for having merited to purchase the plot of field in Shechem"]}]},"34:1.1":{"e":"Rashi asks why the verse calls Dinah \"בַּת לֵאָה\" and not \"בַּת יַעֲקֹב.\" His answer: she is called the daughter of Leah because of her going out, since Leah too was one who went out, as it says \"וַתֵּצֵא לֵאָה לִקְרָאתוֹ\" — like mother, like daughter.","pe":"Deenah went out, the daughter of Leah, whom she had borne to Yaakov, to see [visit] the local girls.","re":"The daughter of Leah. [Why is she] not [called] “the daughter of Yaakov”? But, because of her “going out” she is called “the daughter of Leah” because she [Leah] too, was in the habit of “going out,” as it is said, “And Leah went out to meet him.” (She is the source of the adage: “Like mother like daughter.”)","p":[{"q":"According to Rashi, why is Dinah called \"בַּת לֵאָה\" and not \"בַּת יַעֲקֹב\"?","o":["Because Leah too was one who went out, and Dinah was like her in going out","Because Leah was the one who raised her while Jacob was busy learning","Because the Torah wants to emphasize that Dinah was from the firstborn tribes"]}]},"34:2.1":{"e":"Rashi explains that the expression \"וַיִּשְׁכַּב אֹתָהּ\" describes a natural act, as opposed to \"וַיְעַנֶּהָ\" which describes an unnatural act.","pe":"She was seen by Shechem, son of Chamor, the Chivite, who was the prince of the land. He took her, was with her, and mistreated her.","re":"He was with her. In the usual manner.","p":[{"q":"According to Rashi, what does the expression \"וַיִּשְׁכַּב אֹתָהּ\" describe?","o":["A natural act","An unnatural act","That he was with her without any act at all"]}]},"34:2.2":{"e":"Rashi explains that \"וַיְעַנֶּהָ\" means an unnatural act, based on Bereishit Rabbah. This is an additional step beyond \"וַיִּשְׁכַּב אֹתָהּ,\" which refers to a natural act.","pe":"She was seen by Shechem, son of Chamor, the Chivite, who was the prince of the land. He took her, was with her, and mistreated her.","re":"And mistreated her. In an unusual manner.","p":[{"q":"According to Rashi, what is the meaning of \"וַיְעַנֶּהָ\"?","o":["An unnatural act","A natural act","That he degraded her with words"]}]},"34:3.1":{"e":"Rashi explains that \"וַיְדַבֵּר עַל לֵב הַנַּעַר\" refers to words of persuasion that settle on the heart. Shechem told Dinah that her father had paid a great sum of money for a small plot of land, whereas he would marry her and she would acquire the whole city and its fields.","pe":"He became deeply attached to Deenah, the daughter of Yaakov, and he loved the girl. He spoke to the girl’s heart.","re":"To the girl’s heart. [Meaning:] seductive words, “Look at your father—for a small plot of land—how much he had to overpay. I will marry you and you will own the city and all its fields.”","p":[{"q":"According to Rashi, what did Shechem argue in order to persuade Dinah?","o":["Your father wasted money on a small field, but I will give you an entire city","I am the prince of the land and I will give you great honor","Your father will agree to the match because I am wealthier than he is"]}]},"34:7.1":{"e":"Rashi explains that the expression \"וְכֵן לֹא יֵעָשֶׂה\" refers to the prohibition of violating young women. Even the nations of the world had fenced themselves off from sexual immorality in the wake of the Flood.","pe":"The sons of Yaakov returned from the field when they heard [what had happened]. The men grieved and were very angry, for he [Shechem] had committed an outrage against Yisrael to lie with a daughter of Yaakov. Such a thing should not be done.","re":"Such a thing should not be done. To forcibly take the maidens. For [even] the gentiles constrained themselves from illicit relationships as a result of the Flood.","p":[{"q":"According to Rashi, why did the sons of Jacob say \"וְכֵן לֹא יֵעָשֶׂה\"?","o":["Even the nations had fenced themselves off from sexual immorality after the Flood","Because the Torah forbids the descendants of Noah to violate young women","Because Jacob and his sons had sworn not to intermarry with the daughters of the land"]}]},"34:8.1":{"e":"Rashi explains that the word \"חָשְׁקָה\" means desired — that is, Shechem's soul wanted and longed for Dinah.","pe":"Chamor spoke with them saying, My son, Shechem, desires your daughter. Please grant her to him for a wife.","re":"Desires. [חָשְׁקָה means] desires.","p":[{"q":"How does Rashi explain the word \"חָשְׁקָה\"?","o":["חָפְצָה — it desired/wanted","נִקְשְׁרָה — it became attached/fell in love","נִדְבְּקָה — it would not let go"]}]},"34:12.1":{"e":"Rashi explains that the word \"מַהַר\" means a kesubah — that is, the sum written in the marriage document.","pe":"Increase greatly the amount I must pay for the bridal dowry and gifts. I will give whatever you say, but give me the girl for a wife.","re":"Bridal dowry. [Meaning: the amount agreed to in the] marriage contract.","p":[{"q":"What is the \"מַהַר\" according to Rashi?","o":["כְּתֻובָּה — the marriage document","Precious gifts for the bride's father","An immediate cash payment"]}]},"34:13.1":{"e":"Rashi explains that the word \"בְּמִרְמָה\" means with wisdom — that is, Jacob's sons responded with a clever plan, not simply with crude deception.","pe":"The sons of Yaakov answered Shechem, and his father Chamor, with guile, when they spoke; because he had defiled their sister, Deenah.","re":"With guile. [I.e.,] with cleverness.","p":[{"q":"How does Rashi explain the word \"בְּמִרְמָה\"?","o":["בְּחָכְמָה — with a calculated plan","With outright lies and wicked intent","With anger and fury at Shechem"]}]},"34:13.2":{"e":"Rashi explains that the Torah mentions \"אֲשֶׁר טִמֵּא אֶת דִּינָה אֲחוֹתָם\" to teach that there was no real deception here, since Shechem had indeed defiled Dinah and deserved what was coming to him.","pe":"The sons of Yaakov answered Shechem, and his father Chamor, with guile, when they spoke; because he had defiled their sister, Deenah.","re":"Because he had defiled. Scripture tells us that there was no deceit for he had defiled their sister Deenah.","p":[{"q":"Why does the verse mention \"אֲשֶׁר טִמֵּא אֶת דִּינָה אֲחוֹתָם\" according to Rashi?","o":["To teach that there was no real deception, since he had defiled their sister","To describe the reason Jacob's sons were angry","To explain why Jacob's sons agreed to intermarry"]}]},"34:14.1":{"e":"Rashi explains that the word \"חֶרְפָּה\" means disgrace and disqualification. Jacob's sons argued that being uncircumcised was considered a shameful blemish among them, and when someone wants to insult another person he calls him an uncircumcised man or the son of one.","pe":"They said to them, We cannot do such a thing—to give our sister [in marriage] to an uncircumcised man, for that is a disgrace to us.","re":"That is a disgrace. Among us it is considered a defect; when one wants to insult another he says to him, “you are uncircumcised” or, “you are the son of one who is uncircumcised.” Wherever the word חֶרְפָּה is found [it means] insulting.","p":[{"q":"According to Rashi, what is the meaning of \"חֶרְפָּה\" in the verse?","o":["Disgrace and shameful blemish","Embarrassment and pain","A severe punishment"]}]},"34:15.1":{"e":"Rashi explains that the word \"נָאוֹת\" does not come from the root meaning beauty or handsomeness, but rather from the root meaning agreement and consent, like the word \"וַיֵּאָתוּ\" in the book of Kings.","pe":"This is the only way we will consent to you: if you will be like us, circumcising all your males.","re":"We will consent. [Meaning:] will we be reconciled with you, from the word וַיֵאוֹתוּ —“and they were agreeable.”","p":[{"q":"According to Rashi, what is the meaning of the word \"נָאוֹת\" in the verse?","o":["We will agree and consent, from the root of \"וַיֵּאָתוּ\"","We will beautify and adorn ourselves, from the root of beauty","We will rest and be quiet, from the root of rest"]}]},"34:15.2":{"e":"Rashi clarifies that the word \"לְהִמֹּל\" is not in the active form (acting upon others) but in the passive form — to be circumcised, meaning that they themselves will be circumcised.","pe":"This is the only way we will consent to you: if you will be like us, circumcising all your males.","re":"Circumcising. [Meaning:] to be circumcised. It is not an active infinitive—to do, but rather, an inactive infinitive—to be done.","p":[{"q":"According to Rashi, what is the grammatical form of \"לְהִמֹּל\" in the verse?","o":["Passive (נִפְעַל) — to be circumcised","Active (פָּעַל) — to circumcise others","Intensive (פִּיעֵל) — to heal the circumcision"]}]},"34:16.1":{"e":"Rashi explains that the second נ in the word \"וְנָתְנוּ\" has a dagesh (a dot indicating a doubled letter) because it stands in place of two נ's — \"וְנָתַנּנוּ\".","pe":"[Then] we will give our daughters to you, and we will take your daughters for ourselves. We will live together with you, and we will become one people.","re":"[Then] we will give. The second letter נוּ\"ן has a dagesh [dot] because it serves in the place of two נוני\"ן - ± וְנָתַנְנוּ.","p":[{"q":"According to Rashi, why does the second נ of \"וְנָתְנוּ\" have a dagesh?","o":["Because it stands in place of two נ's — וְנָתַנּנוּ","Because it indicates plural rather than singular","Because it distinguishes between giving and taking"]}]},"34:16.2":{"e":"Rashi shows that in Hamor's words to Jacob and in Jacob's sons' reply, the importance was given to Jacob's sons — they choose who to take and who to give. But when Hamor and Shechem spoke to the men of their city, they reversed their words in order to please them and get them to agree to be circumcised.","pe":"[Then] we will give our daughters to you, and we will take your daughters for ourselves. We will live together with you, and we will become one people.","re":"And we will take your daughters for ourselves. You will note that in the proposal that Chamor made to Yaakov, as well as in the response of Yaakov’s sons to Chamor, they regarded Yaakov’s sons as the important ones in that they could select the daughters of Shechem according to their choice, and give their daughters as they saw fit, as it is written, “We will give our daughters”—as we see fit. “And we will take your daughters,” whichever we see fit. Whereas, when Chamor, and his son, Shechem, spoke to the inhabitants of their city they reversed the words, [saying:] “We will take their daughters as wives and give them our daughters. [They did this] in order to convince them to consent to be circumcised.","p":[{"q":"What change does Rashi point out between Hamor's words to Jacob and his words to the men of his city?","o":["Hamor reversed the order of things in order to please the men of his city so they would be circumcised","Hamor added economic conditions for the men of his city that were not mentioned to Jacob","Hamor left out the circumcision requirement from the men of his city in order to convince them"]}]},"34:21.1":{"e":"Rashi explains that ״שְׁלָמִים״ means in peace and with a whole heart — that is, their intentions are good and there is no deceit in them.","pe":"These men are completely at peace with us. Let them live in the land and trade in it. The land has ample room to be open to them. We will take their daughters for wives, and we will give them our daughters.","re":"Completely at peace. [Meaning:] in peace and wholeheartedly.","p":[{"q":"How does Rashi explain the word ״שְׁלָמִים״?","o":["In peace and with a whole heart","Complete in their faith and their religion","Ready to pay full price"]}]},"34:21.2":{"e":"Rashi explains ״רַחֲבַת יָדַיִם״ as like a person whose hand is wide and generous — meaning there is much merchandise here with no buyers, and you will lose nothing.","pe":"These men are completely at peace with us. Let them live in the land and trade in it. The land has ample room to be open to them. We will take their daughters for wives, and we will give them our daughters.","re":"The Land has ample room. Like a person who is open-handed and generous. The idea being: “You will lose nothing, for much merchandise has arrived here and it has no buyers.”","p":[{"q":"What is Rashi's explanation of ״רַחֲבַת יָדַיִם״?","o":["Like a person whose hand is wide and generous — there is much merchandise with no buyers","The land is large and wide and there is room for everyone","There are many agricultural fields in the land that have not yet been worked"]}]},"34:22.1":{"e":"Rashi explains that ״בְּהִמּוֹל״ means 'when being circumcised,' meaning the verb form indicates a state of circumcision.","pe":"But only on these terms will the men consent to live with us, to become one people: every male among us must be circumcised, just as they are circumcised.","re":"Must be circumcised. [בְּהִמוֹל means] by being circumcised.","p":[{"q":"How does Rashi explain the word ״בְּהִמּוֹל״?","o":["When being circumcised","At the time when they will circumcise them","By a mohel"]}]},"34:23.1":{"e":"Rashi explains that Hamor and Shechem told the men of their city: we will agree to the condition of circumcision, and through this Jacob's sons will settle with us and their property will become ours.","pe":"Their livestock, their possessions and all their cattle, will it not be ours? Only let us consent to them, and they will live with us.","re":"Only let us consent to them. To this matter and, as a result, they will settle with us.","p":[{"q":"According to Rashi, what is the meaning of ״אַךְ נָאוֹתָה לָהֶם״?","o":["We will agree to this matter, and through this they will dwell with us","We will fight them and force them to stay","We will give them gifts to appease them"]}]},"34:25.1":{"e":"Rashi explains that the Torah writes 'two sons of Jacob' even though it is already known, to teach that they acted like strangers who were not his sons, since they did not take counsel from their father.","pe":"On the third day when they were in pain, two of Yaakov’s sons, Shimon and Leivi, brothers of Deenah, each took his sword. They approached the city with confidence, and killed every male.","re":"Two of Yaakov’s sons. They were his sons, yet, Shimon and Leivi acted as other people who are not his sons, in that they did not seek his advice.","p":[{"q":"Why does the Torah emphasize ״שְׁנֵי בְנֵי יַעֲקֹב״ according to Rashi?","o":["To teach that they acted like strangers and did not take counsel from their father","To emphasize that only two of all the brothers went out to battle","To hint that Jacob sent them himself"]}]},"34:25.2":{"e":"Rashi explains that the verse calls Simeon and Levi 'Dinah's brothers' because they gave their lives for her, and therefore they merited this title.","pe":"On the third day when they were in pain, two of Yaakov’s sons, Shimon and Leivi, brothers of Deenah, each took his sword. They approached the city with confidence, and killed every male.","re":"Brothers of Deenah. Because they risked their lives for her, they are called her brothers.","p":[{"q":"Why were Simeon and Levi specifically called ״אַחֵי דִינָה״ according to Rashi?","o":["Because they gave their lives for her and therefore were called her brothers","Because they were her brothers from the same mother (Leah)","Because Dinah explicitly asked them to take revenge"]}]},"34:25.3":{"e":"Rashi explains ״בֶּטַח״ in two ways: according to the plain meaning — they came with confidence because the men of Shechem were in pain from the circumcision. According to the midrash — they relied on the strength of their father Jacob.","pe":"On the third day when they were in pain, two of Yaakov’s sons, Shimon and Leivi, brothers of Deenah, each took his sword. They approached the city with confidence, and killed every male.","re":"With confidence. Because they [the Shechemites] were in pain. The Aggadaic explanation is: They were confident of the power of the “old one” [Yaakov].","p":[{"q":"How does Rashi explain the word ״בֶּטַח״ according to its plain meaning?","o":["They came with confidence because the men of Shechem were in pain","They relied on the strength of their father Jacob","They trusted in God that He would help them in battle"]},{"q":"What is the midrashic explanation of ״בֶּטַח״ according to Rashi?","o":["They relied on the strength of their father Jacob","They trusted that the men of the city would not notice them","They knew that the men of Shechem had already fled the city"]}]},"34:27.1":{"e":"Rashi explains that the sons of Jacob came upon the slain in order to strip them — that is, to take the clothing and belongings of the dead.","pe":"The sons of Yaakov came upon the corpses, and they plundered the city that had defiled their sister.","re":"Upon the corpses. In order to strip the slain.","p":[{"q":"What does \"came upon the slain\" mean according to Rashi?","o":["They came to strip the dead of their possessions","They came to bury the dead with honor","They came to fight with soldiers who were still alive"]}]},"34:29.1":{"e":"Rashi explains that the word \"חֵילָם\" means their wealth, and he brings three additional verses where \"חַיִל\" is used in the sense of money and riches.","pe":"All their wealth, all their children, and their wives—they took captive, and plundered—including everything in the houses.","re":"Their wealth. [חֵילָם means] their wealth. Similarly: “Has gotten for me this wealth,” [or] “And Israel has acquired wealth,” [or] “They will leave their wealth to others.”","p":[{"q":"What does the word \"חֵילָם\" mean according to Rashi?","o":["Their money and possessions","Their army and fighters","Their strength and might"]}]},"34:29.2":{"e":"Rashi explains that \"שְׁבוּ\" is a term of captivity (taking as prisoners), and therefore the accent is mil-ra — on the last syllable.","pe":"All their wealth, all their children, and their wives—they took captive, and plundered—including everything in the houses.","re":"They took captive. From the term שִׁבְיָה —taking captive. The accent is, therefore, on the latter syllable.","p":[{"q":"How does Rashi prove that the word \"שְׁבוּ\" is a term of captivity?","o":["From the fact that the accent is mil-ra, on the last syllable","From the fact that the accent is mil-eil, on the first syllable","From the context alone, without any proof from the accent"]}]},"34:30.1":{"e":"Rashi explains \"עֲכַרְתֶּם\" as a term of murky water — meaning Jacob's mind is not clear right now. He also adds a midrash: the Canaanites knew they were destined to fall into the hands of Jacob's sons, but they thought this would only happen once they grew numerous, so they kept quiet until now.","pe":"Yaakov said to Shimon and Leivi, You have made trouble for me, making me obnoxious to the inhabitants of the land, the Canaanites and the Perizzites. [Since] I am few in number, they will gather together and attack me. I and my house [family] will be destroyed.","re":"You have made trouble. From [the expression] מַיִם עֲכוּרִים —clouded waters, i.e., my mind is now not clear. An Aggadaic explanation: The [liquid in the] cask was clear and you have clouded it. [Meaning:] the Canaanites had a tradition that [someday] they would fall in the hands of the children of Yaakov. But, they thought [that this would not happen] until, “When your numbers will increase, then will you inherit the land,” and they had, therefore, been silent.","p":[{"q":"What does \"עֲכַרְתֶּם\" mean according to the plain meaning in Rashi?","o":["A term of murky water — my mind is not clear","A term of uprooting — you have uprooted me from the land","A term of delay — you have delayed my salvation"]},{"q":"According to the midrash that Rashi brings, why did the Canaanites keep quiet until now?","o":["Because they knew they would fall into the hands of Jacob's sons, but thought it would only happen once they became numerous","Because they feared the military strength of Jacob's sons","Because they had a peace treaty with our forefather Abraham"]}]},"34:30.2":{"e":"Rashi explains that the phrase \"מְתֵי מִסְפָּר\" means a small number of people — that is, Jacob feared that his family was too few to fight against the inhabitants of the land.","pe":"Yaakov said to Shimon and Leivi, You have made trouble for me, making me obnoxious to the inhabitants of the land,
