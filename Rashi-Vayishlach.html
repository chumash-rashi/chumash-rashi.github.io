לְבֵית־אֵל תַּחַת הָאַלּוֹן וַיִּקְרָא שְׁמוֹ אַלּוֹן בָּכוּת׃", "rashi_he": "תחת האלון. בְּשִׁפּוּלֵי מֵישְׁרָא, שֶׁהָיָה מִישׁוֹר מִלְמַעְלָה בְּשִׁפּוּעַ הָהָר וְהַקְּבוּרָה מִלְּמַטָּה, וּמִישׁוֹר שֶׁל בֵּית אֵל הָיוּ קוֹרִין לוֹ אַלּוֹן. וְאַגָּדָה, נִתְבַּשֵּׂר שָׁם בְּאֵבֶל שֵׁנִי, שֶׁהֻגַּד לוֹ עַל אִמּוֹ שֶׁמֵּתָה (בראשית רבה), וְאַלּוֹן בִּלְשׁוֹן יְוָנִי אַחֵר, וּלְפִי שֶׁהֶעֱלִימוּ אֶת יוֹם מוֹתָהּ שֶׁלֹּא יְקַלְּלוּ הַבְּרִיּוֹת כֶּרֶס שֶׁיָּצָא מִמֶּנּוּ עֵשָׂו, אַף הַכָּתוּב לֹא פִרְסְמָהּ:", "rashi_en": "רש״י מביא שני פירושים: לפי הפשט, ״אלון״ הוא שם המישור שמעל הקבורה בשפוע ההר. לפי האגדה, ״אלון״ בלשון יוונית פירושו ״אחר״, ויעקב נתבשר שם באבל שני — על מות אמו רבקה, שהעלימו את מותה כדי שלא יקללו את מי שילדה את עשו.", "note": "", "points": [{"q": "לְפִי הָאַגָּדָה שֶׁמֵּבִיא רַשׁ״י, מַהוּ הָ״אֵבֶל שֵׁנִי״ שֶׁנִּתְבַּשֵּׂר בּוֹ יַעֲקֹב?", "options": ["נוֹדַע לוֹ עַל מוֹת אִמּוֹ רִבְקָה", "נוֹדַע לוֹ עַל מוֹת אָבִיו יִצְחָק", "נוֹדַע לוֹ עַל צָרָה שֶׁפָּקְדָה אֶת בְּנֵי בֵּיתוֹ"], "kasha": "שם המקום ״אלון בכות״ תמוה — למה לקרוא למקום על שם בכי על מינקת.", "answer": "לפי האגדה, ״אלון״ בלשון יוונית פירושו ״אחר״, ויעקב נתבשר שם שאמו רבקה מתה.", "kp": ["נתבשר שם באבל שני", "שהגד לו על אמו שמתה", "אלון בלשון יוני אחר"]}, {"q": "מַדּוּעַ הֶעֱלִימוּ אֶת מוֹת רִבְקָה לְפִי רַשׁ״י?", "options": ["שֶׁלֹּא יְקַלְלוּ הַבְּרִיּוֹת אֶת מִי שֶׁיָּלְדָה אֶת עֵשָׂו", "כְּדֵי שֶׁלֹּא יִתְאַבֵּל יַעֲקֹב בְּדַרְכּוֹ חֲזָרָה מִפַּדַּן אֲרָם", "כְּדֵי שֶׁלֹּא יִשְׁמַע עֵשָׂו וְיָבוֹא לַהֲלָוָויָה"], "kasha": "רש״י מסביר מדוע התורה לא סיפרה במפורש על מות רבקה.", "answer": "העלימו את יום מותה כדי שלא יקללו הבריות את הכרס שממנה יצא עשו, ואף הכתוב לא פרסם זאת.", "kp": ["שלא יקללו הבריות כרס שיצא ממנו עשו", "אף הכתוב לא פרסמה"]}]}, {"id": "35:9.1", "ch": 35, "v": 9, "n": 1, "dh": "עוד", "pasuk_html": "וַיֵּרָ֨א אֱלֹהִ֤ים אֶֽל־יַעֲקֹב֙ <mark>ע֔וֹד</mark> בְּבֹא֖וֹ מִפַּדַּ֣ן אֲרָ֑ם וַיְבָ֖רֶךְ אֹתֽוֹ׃", "pasuk_en": "וַיֵּרָא אֱלֹהִים אֶל־יַעֲקֹב עוֹד בְּבֹאוֹ מִפַּדַּן אֲרָם וַיְבָרֶךְ אֹתוֹ׃", "rashi_he": "עוד. פַּעַם שֵׁנִי בַּמָּקוֹם הַזֶּה, אֶחָד בְּלֶכְתּוֹ וְאֶחָד בְּשׁוּבוֹ:", "rashi_en": "רש״י מסביר שהמילה ״עוד״ מלמדת שהקב״ה נראה ליעקב פעם שנייה באותו מקום — פעם אחת בלכתו לפדן ארם ופעם אחת בשובו.", "note": "", "points": [{"q": "מַה מְלַמֶּדֶת הַמִּילָּה ״עוֹד״ לְפִי רַשִׁ״י?", "options": ["שֶׁהַ׳ נִגְלָה לְיַעֲקֹב בַּמָּקוֹם הַזֶּה פְּעָמַיִים — בְּלֶכְתּוֹ וּבְשׁוּבוֹ", "שֶׁהַ׳ הוֹסִיף בְּרָכָה חֲדָשָׁה עַל הַבְּרָכוֹת הַקּוֹדְמוֹת", "שֶׁהַ׳ נִגְלָה לְיַעֲקֹב שׁוּב אַחֲרֵי הַפְּסָקָה אֲרוּכָּה"], "kasha": "המילה ״עוד״ מיותרת לכאורה — היה אפשר לכתוב ״וירא אלהים אל יעקב״ בלבד.", "answer": "״עוד״ מלמד שזו פעם שנייה שנגלה אליו באותו מקום: פעם בלכתו ופעם בשובו.", "kp": ["פעם שני במקום הזה", "אחד בלכתו ואחד בשובו"]}]}, {"id": "35:9.2", "ch": 35, "v": 9, "n": 2, "dh": "ויברך אתו", "pasuk_html": "וַיֵּרָ֨א אֱלֹהִ֤ים אֶֽל־יַעֲקֹב֙ ע֔וֹד בְּבֹא֖וֹ מִפַּדַּ֣ן אֲרָ֑ם <mark>וַיְבָ֖רֶךְ אֹתֽוֹ׃</mark>", "pasuk_en": "וַיֵּרָא אֱלֹהִים אֶל־יַעֲקֹב עוֹד בְּבֹאוֹ מִפַּדַּן אֲרָם וַיְבָרֶךְ אֹתוֹ׃", "rashi_he": "ויברך אתו. בִּרְכַּת אֲבֵלִים (בראשית רבה):", "rashi_en": "רש״י מפרש שהברכה שבירך הקב״ה את יעקב היתה ברכת אבלים, כי יצחק אביו נפטר.", "note": "", "points": [{"q": "אֵיזוֹ בְּרָכָה בֵּירַךְ הַקָּב״ה אֶת יַעֲקֹב לְפִי רַשִׁ״י?", "options": ["בִּרְכַּת אֲבֵלִים", "בִּרְכַּת הַדֶּרֶךְ", "בִּרְכַּת פְּרוּ וּרְבוּ"], "kasha": "לא מפורש בפסוק מהי הברכה שבירך אותו, ורש״י בא לפרש מה תוכנה.", "answer": "הברכה היתה ברכת אבלים, כמבואר בבראשית רבה.", "kp": ["ברכת אבלים"]}]}, {"id": "35:10.1", "ch": 35, "v": 10, "n": 1, "dh": "לא יקרא שמך עוד יעקב", "pasuk_html": "וַיֹּֽאמֶר־ל֥וֹ אֱלֹהִ֖ים שִׁמְךָ֣ יַעֲקֹ֑ב <mark>לֹֽא־יִקָּרֵא֩ שִׁמְךָ֨ ע֜וֹד יַעֲקֹ֗ב</mark> כִּ֤י אִם־יִשְׂרָאֵל֙ יִהְיֶ֣ה שְׁמֶ֔ךָ וַיִּקְרָ֥א אֶת־שְׁמ֖וֹ יִשְׂרָאֵֽל׃", "pasuk_en": "וַיֹּאמֶר־לוֹ אֱלֹהִים שִׁמְךָ יַעֲקֹב לֹא־יִקָּרֵא שִׁמְךָ עוֹד יַעֲקֹב כִּי אִם־יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל׃", "rashi_he": "לא יקרא שמך עוד יעקב. לְשׁוֹן אָדָם הַבָּא בְּמַאֲרָב וְעָקְבָּה, אֶלָּא לְשׁוֹן שַׂר וְנָגִיד:", "rashi_en": "רש״י מסביר שהשם 'יעקב' מורה על מארב ועקבה, ואילו 'ישראל' מורה על שררה ונגידות.", "note": "", "points": [{"q": "מַה מַשְׁמָעוּת הַשֵּׁם 'יַעֲקֹב' לְפִי רַשִׁ״י, וְלָמָּה הוּחְלַף?", "options": ["לְשׁוֹן מַאֲרָב וַעֲקֵבָה, וְהוּחְלַף לִלְשׁוֹן שַׂר וְנָגִיד", "לְשׁוֹן עָקֵב וָרֶגֶל, וְהוּחְלַף לִלְשׁוֹן יְשָׁרוּת", "לְשׁוֹן עֲקִיבָה וּמַעֲקָב, וְהוּחְלַף לִלְשׁוֹן כֹּוחַ"], "kasha": "מדוע יש צורך לשנות את שמו של יעקב — מה הפגם בשם הקודם?", "answer": "השם 'יעקב' מורה על אדם הבא במארב ועקבה, ואילו 'ישראל' מורה על שר ונגיד.", "kp": ["לשון אדם הבא במארב ועקבה", "לשון שר ונגיד"]}]}, {"id": "35:11.1", "ch": 35, "v": 11, "n": 1, "dh": "אני אל שדי", "pasuk_html": "וַיֹּאמֶר֩ ל֨וֹ אֱלֹהִ֜ים <mark>אֲנִ֨י אֵ֤ל שַׁדַּי֙</mark> פְּרֵ֣ה וּרְבֵ֔ה גּ֛וֹי וּקְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑ךָּ וּמְלָכִ֖ים מֵחֲלָצֶ֥יךָ יֵצֵֽאוּ׃", "pasuk_en": "וַיֹּאמֶר לוֹ אֱלֹהִים אֲנִי אֵל שַׁדַּי פְּרֵה וּרְבֵה גּוֹי וּקְהַל גּוֹיִם יִהְיֶה מִמֶּךָּ וּמְלָכִים מֵחֲלָצֶיךָ יֵצֵאוּ׃", "rashi_he": "אני אל שדי. שֶׁאֲנִי כְדַי לְבָרֵךְ, שֶׁהַבְּרָכוֹת שֶׁלִּי:", "rashi_en": "רש״י מפרש שהקב״ה אמר 'אני אל שדי' כדי לומר שיש בכוחו לברך, כי הברכות שלו הן.", "note": "", "points": [{"q": "מַדּוּעַ הִקְדִּים הַקָּב״ה 'אֲנִי אֵל שַׁדַּי' לִפְנֵי הַבְּרָכָה, לְפִי רַשׁ״י?", "options": ["כִּי יֵשׁ בְּכֹוחוֹ לְבָרֵךְ, שֶׁהַבְּרָכוֹת שֶׁלּוֹ", "כְּדֵי לְהַזְכִּיר אֶת הַבְּרִית עִם אַבְרָהָם", "כְּדֵי לְהַבְטִיחַ שֶׁיָּגֵן עָלָיו מִפְּנֵי אוֹיְבָיו"], "kasha": "לכאורה מיותר לומר 'אני אל שדי' — מה בא להוסיף לפני הברכה?", "answer": "הקב״ה הקדים לומר שהוא כדי לברך, כי הברכות שלו הן.", "kp": ["שאני כדי לברך", "שהברכות שלי"]}]}, {"id": "35:11.2", "ch": 35, "v": 11, "n": 2, "dh": "פרה ורבה", "pasuk_html": "וַיֹּאמֶר֩ ל֨וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ <mark>פְּרֵ֣ה וּרְבֵ֔ה</mark> גּ֛וֹי וּקְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑ךָּ וּמְלָכִ֖ים מֵחֲלָצֶ֥יךָ יֵצֵֽאוּ׃", "pasuk_en": "וַיֹּאמֶר לוֹ אֱלֹהִים אֲנִי אֵל שַׁדַּי פְּרֵה וּרְבֵה גּוֹי וּקְהַל גּוֹיִם יִהְיֶה מִמֶּךָּ וּמְלָכִים מֵחֲלָצֶיךָ יֵצֵאוּ׃", "rashi_he": "פרה ורבה. עַל שֵׁם שֶׁעֲדַיִן לֹא נוֹלַד בִּנְיָמִין, וְאַף עַל פִּי שֶׁכְּבָר נִתְעַבְּרָה מִמֶּנּוּ:", "rashi_en": "רש״י מסביר שהקב״ה בירך את יעקב 'פרה ורבה' כי בנימין עדיין לא נולד, אף שרחל כבר היתה מעוברת ממנו.", "note": "", "points": [{"q": "מַדּוּעַ הֻוצְרַךְ יַעֲקֹב לְבִרְכַּת 'פְּרֵה וּרְבֵה' בַּשַּׁלָב זֶה?", "options": ["כִּי בִּנְיָמִין עֲדַיִין לֹא נוֹלַד, אַף שֶׁכְּבָר נִתְעַבְּרָה מִמֶּנּוּ", "כִּי עֲדַייִן לֹא נוֹלְדוּ לוֹ שְׁנֵים עָשָׂר בָּנִים מֵאַרְבַּע נָשָׁיו", "כִּי רָחֵל הָיְתָה עֲקָרָה וּזְקוּקָה לְבָרָכָה מְיֻוחֶדֶת"], "kasha": "יעקב כבר זכה לבנים רבים — מדוע צריך עוד ברכת פריה ורביה?", "answer": "בנימין עדיין לא נולד, ולכן היה צורך בברכה זו, אף על פי שרחל כבר נתעברה ממנו.", "kp": ["שעדין לא נולד בנימין", "ואף על פי שכבר נתעברה ממנו"]}]}, {"id": "35:11.3", "ch": 35, "v": 11, "n": 3, "dh": "גוי", "pasuk_html": "וַיֹּאמֶר֩ ל֨וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּרְבֵ֔ה <mark>גּ֛וֹי</mark> וּקְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑ךָּ וּמְלָכִ֖ים מֵחֲלָצֶ֥יךָ יֵצֵֽאוּ׃", "pasuk_en": "וַיֹּאמֶר לוֹ אֱלֹהִים אֲנִי אֵל שַׁדַּי פְּרֵה וּרְבֵה גּוֹי וּקְהַל גּוֹיִם יִהְיֶה מִמֶּךָּ וּמְלָכִים מֵחֲלָצֶיךָ יֵצֵאוּ׃", "rashi_he": "גוי. בִּנְיָמִין:", "rashi_en": "רש\"י מסביר שהמילה \"גוי\" בפסוק מתייחסת לבנימין, שעתיד להיוולד מיעקב.", "note": "", "points": [{"q": "לְפִי רַשׁ\"י, לְמִי מִתְיַיחֶסֶת הַמִּילָּה \"גּוֹי\" בַּפָּסוּק?", "options": ["לְבִנְיָמִין שֶׁעָתִיד לְהִיווָּלֵד", "לְיוֹסֵף שֶׁכְּבָר נוֹלַד", "לִכְלַל בְּנֵי יַעֲקֹב"], "kasha": "מדוע נאמר \"גוי\" בלשון יחיד, הרי ליעקב כבר היו בנים רבים?", "answer": "המילה \"גוי\" בלשון יחיד מתייחסת לבנימין, שעדיין לא נולד.", "kp": ["בנימין"]}]}, {"id": "35:11.4", "ch": 35, "v": 11, "n": 4, "dh": "גוים", "pasuk_html": "וַיֹּאמֶר֩ ל֨וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּרְבֵ֔ה גּ֛וֹי וּקְהַ֥ל <mark>גּוֹיִ֖ם</mark> יִהְיֶ֣ה מִמֶּ֑ךָּ וּמְלָכִ֖ים מֵחֲלָצֶ֥יךָ יֵצֵֽאוּ׃", "pasuk_en": "וַיֹּאמֶר לוֹ אֱלֹהִים אֲנִי אֵל שַׁדַּי פְּרֵה וּרְבֵה גּוֹי וּקְהַל גּוֹיִם יִהְיֶה מִמֶּךָּ וּמְלָכִים מֵחֲלָצֶיךָ יֵצֵאוּ׃", "rashi_he": "גוים. מְנַשֶּׁה וְאֶפְרַיִם, שֶׁעֲתִידִים לָצֵאת מִיּוֹסֵף, וְהֵם בְּמִנְיַן הַשְּׁבָטִים (בראשית רבה):", "rashi_en": "רש\"י מסביר ש\"קהל גוים\" מתייחס למנשה ואפרים בני יוסף, שעתידים להימנות כשבטים נפרדים.", "note": "", "points": [{"q": "לְפִי רַשׁ\"י, לְמִי מִתְיַיחֶסֶת הַמִּילָּה \"גּוֹיִם\" בִּלְשׁוֹן רַבִּים?", "options": ["לִמְנַשֶּׁה וְאֶפְרַיִם שֶׁייֵּחָשְׁבוּ כִּשְׁבָטִים נִפְרָדִים", "לִשְׁנֵים עָשָׂר הַשְּׁבָטִים כֻּולָּם", "לְבִנְיָמִין וְיוֹסֵף שֶׁעֲדַיִין לֹא נוֹלְדוּ"], "kasha": "מדוע נאמר \"קהל גוים\" בלשון רבים, ולא הסתפק ב\"גוי\"?", "answer": "\"גוים\" מתייחס למנשה ואפרים בני יוסף, שעתידים לצאת ממנו ולהימנות כשבטים נפרדים.", "kp": ["מנשה ואפרים", "שעתידים לצאת מיוסף", "והם במנין השבטים"]}]}, {"id": "35:11.5", "ch": 35, "v": 11, "n": 5, "dh": "ומלכים", "pasuk_html": "וַיֹּאמֶר֩ ל֨וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּרְבֵ֔ה גּ֛וֹי וּקְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑ךָּ <mark>וּמְלָכִ֖ים</mark> מֵחֲלָצֶ֥יךָ יֵצֵֽאוּ׃", "pasuk_en": "וַיֹּאמֶר לוֹ אֱלֹהִים אֲנִי אֵל שַׁדַּי פְּרֵה וּרְבֵה גּוֹי וּקְהַל גּוֹיִם יִהְיֶה מִמֶּךָּ וּמְלָכִים מֵחֲלָצֶיךָ יֵצֵאוּ׃", "rashi_he": "ומלכים. שָׁאוּל וְאִישׁ בֹּשֶׁת, שֶׁהָיוּ מִשֵּׁבֶט בִּנְיָמִין (בראשית רבה), שֶׁעֲדַיִן לֹא נוֹלְדוּ (וּפָסוּק זֶה דְּרָשׁוֹ אַבְנֵר כְּשֶׁהִמְלִיךְ אִישׁ בֹּשֶׁת, וְאַף הַשְּׁבָטִים דְּרָשׁוּהוּ וְקֵרְבוּ בִּנְיָמִין, דִּכְתִיב אִישׁ מִמֶּנּוּ לֹא יִתֵּן אֶת בִּתּוֹ לְבִנְיָמִן לְאִשָּׁה (שופטים כ\"א), וְחָזְרוּ וְאָמְרוּ אִלְמָלֵא הָיָה עוֹלֶה מִן הַשְּׁבָטִים לֹא הָיָה הַקָּבָּ\"ה אוֹמֵר לְיַעֲקֹב וּמְלָכִים מֵחֲלָצֶיךָ יֵצֵאוּ:", "rashi_en": "רש\"י מסביר ש\"מלכים מחלציך\" מתייחס לשאול ואיש בושת משבט בנימין. אבנר דרש פסוק זה כשהמליך את איש בושת, וגם השבטים דרשו אותו כדי להתפייס עם בנימין.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מִיהֶם הַמְּלָכִים שֶׁעֲתִידִים לָצֵאת מֵחֲלָצֵי יַעֲקֹב?", "options": ["שָׁאוּל וְאִישׁ בֹּושֶׁת מִשֵּׁבֶט בִּנְיָמִין", "דָּוִד וּשְׁלֹמֹה מִשֵּׁבֶט יְהוּדָה", "יָרָבְעָם וְרָחַבְעָם מִשֵּׁבֶט אֶפְרַיִם"], "kasha": "מדוע נאמר \"ומלכים מחלציך יצאו\" — הרי הבטחת המלוכה ניתנה ליהודה?", "answer": "\"ומלכים\" מתייחס לשאול ואיש בושת שהיו משבט בנימין, שעדיין לא נולד.", "kp": ["שאול ואיש בשת", "שהיו משבט בנימין"]}, {"q": "כֵּיצַד דָּרְשׁוּ הַשְּׁבָטִים אֶת הַפָּסוּק \"וּמְלָכִים מֵחֲלָצֶיךָ יֵצֵאוּ\"?", "options": ["כְּהוֹכָחָה שֶׁבִּנְיָמִין נִמְנָה עַל הַשְּׁבָטִים וְיֵשׁ לְהִתְפַּיֵּיס עִמּוֹ", "כְּהַבְטָחָה שֶׁמַּלְכוּת בֵּית דָּוִד תִּימָּשֵׁךְ לָעַד", "כִּנְבוּאָה עַל חֻורְבַּן מַמְלֶכֶת יִשְׂרָאֵל"], "kasha": "מה הקשר בין הבטחת המלוכה לבנימין לבין השבועה שלא לתת בנות לבנימין?", "answer": "השבטים דרשו שאם בנימין לא היה עולה מן השבטים, לא היה הקב\"ה מבטיח ליעקב מלכים מחלציו, ולכן חזרו והתפייסו עמו.", "kp": ["אלמלא היה עולה מן השבטים", "לא היה הקב\"ה אומר ליעקב ומלכים מחלציך יצאו"]}]}, {"id": "35:11.6", "ch": 35, "v": 11, "n": 6, "dh": "גוי וקהל גוים", "pasuk_html": "וַיֹּאמֶר֩ ל֨וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּרְבֵ֔ה <mark>גּ֛וֹי וּקְהַ֥ל גּוֹיִ֖ם</mark> יִהְיֶ֣ה מִמֶּ֑ךָּ וּמְלָכִ֖ים מֵחֲלָצֶ֥יךָ יֵצֵֽאוּ׃", "pasuk_en": "וַיֹּאמֶר לוֹ אֱלֹהִים אֲנִי אֵל שַׁדַּי פְּרֵה וּרְבֵה גּוֹי וּקְהַל גּוֹיִם יִהְיֶה מִמֶּךָּ וּמְלָכִים מֵחֲלָצֶיךָ יֵצֵאוּ׃", "rashi_he": "גוי וקהל גוים. שֶׁגּוֹיִם עֲתִידִים בָּנָיו לְהֵעָשׂוֹת כְּמִנְיַן הַגּוֹיִם, שֶׁהֵם ע' אֻמּוֹת, וְכֵן כָּל הַסַּנְהֶדְרִין שִׁבְעִים; דָּבָר אַחֵר שֶׁעֲתִידִים בָּנָיו לְהַקְרִיב בִּשְׁעַת אִסּוּר בָּמוֹת כַּגּוֹיִם בִּימֵי אֵלִיָּהוּ):", "rashi_en": "רש\"י מביא שני פירושים: האחד — שבני יעקב עתידים להגיע למניין שבעים כמספר אומות העולם, וכן הסנהדרין מונה שבעים. השני — שבניו עתידים להקריב קרבנות בשעת איסור במות, כגויים, בימי אליהו.", "note": "", "points": [{"q": "לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן בְּרַשׁ\"י, מַהוּ הַקֶּשֶׁר בֵּין \"גּוֹי וּקְהַל גּוֹיִם\" לְמִסְפַּר שִׁבְעִים?", "options": ["בְּנֵי יַעֲקֹב יִהְיוּ שִׁבְעִים כְּמִנְיַין אֻומּוֹת הָעוֹלָם", "שִׁבְעִים פַּעַם ייִגָּלוּ יִשְׂרָאֵל בֵּין הָאֻומּוֹת", "שִׁבְעִים שָׁנָה יִשְׁלְטוּ יִשְׂרָאֵל עַל הַגּוֹיִים"], "kasha": "מה המשמעות של הביטוי \"גוי וקהל גוים\" — הרי בני יעקב אינם גויים?", "answer": "בני יעקב עתידים להיות במניין שבעים כמספר אומות העולם, וכן הסנהדרין שבעים.", "kp": ["שגוים עתידים בניו להעשות כמנין הגוים", "שהם ע' אמות"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי בְּרַשׁ\"י, מַהוּ הַמַּעֲשֶׂה שֶׁעֲתִידִים בְּנֵי יַעֲקֹב לַעֲשׂוֹת \"כַּגּוֹיִים\"?", "options": ["לְהַקְרִיב קָרְבָּנוֹת בִּשְׁעַת אִיסּוּר בָּמוֹת בִּימֵי אֵלִיָּהוּ", "לְהִילָּחֵם זֶה בָּזֶה כְּמִנְהַג הַגּוֹיִים", "לַעֲבֹוד עֲבוֹדָה זָרָה בִּימֵי יָרָבְעָם"], "kasha": "מדוע נאמר \"גוים\" על בני ישראל — במה הם דומים לגויים?", "answer": "בני יעקב עתידים להקריב קרבנות בשעת איסור במות כמו הגויים, וזה קרה בימי אליהו.", "kp": ["שעתידים בניו להקריב בשעת אסור במות כגוים", "בימי אליהו"]}]}, {"id": "35:13.1", "ch": 35, "v": 13, "n": 1, "dh": "במקום אשר דבר אתו", "pasuk_html": "וַיַּ֥עַל מֵעָלָ֖יו אֱלֹהִ֑ים <mark>בַּמָּק֖וֹם אֲשֶׁר־דִּבֶּ֥ר אִתּֽוֹ׃</mark>", "pasuk_en": "וַיַּעַל מֵעָלָיו אֱלֹהִים בַּמָּקוֹם אֲשֶׁר־דִּבֶּר אִתּוֹ׃", "rashi_he": "במקום אשר דבר אתו. אֵינִי יוֹדֵעַ מַה מְּלַמְּדֵנוּ:", "rashi_en": "רש״י מודה שאינו יודע מה באה תיבה זו ללמדנו.", "note": "", "points": [{"q": "מַה אוֹמֵר רַשִׁ״י עַל הַבִּיטּוּי \"בַּמָּקוֹם אֲשֶׁר־דִּבֶּר אִתּוֹ\"?", "options": ["שֶׁאֵינוֹ יוֹדֵעַ מַה הוּא בָּא לְלַמְּדֵנוּ", "שֶׁהַמָּקוֹם הוּא בֵּית אֵל שֶׁבּוֹ נִגְלָה אֵלָיו בִּצְעִירוּתוֹ", "שֶׁהַכַּווָּנָה לִמְקוֹם הַמִּזְבֵּחַ שֶׁבָּנָה שָׁם"], "kasha": "לא ברור מה מוסיפות המילים \"במקום אשר דבר אתו\", שהרי כבר ידוע היכן דיבר עמו.", "answer": "רש״י אומר בפירוש שאינו יודע מה המילים הללו מלמדות אותנו.", "kp": ["איני יודע מה מלמדנו"]}]}, {"id": "35:16.1", "ch": 35, "v": 16, "n": 1, "dh": "כברת הארץ", "pasuk_html": "וַיִּסְעוּ֙ מִבֵּ֣ית אֵ֔ל וַֽיְהִי־ע֥וֹד <mark>כִּבְרַת־הָאָ֖רֶץ</mark> לָב֣וֹא אֶפְרָ֑תָה וַתֵּ֥לֶד רָחֵ֖ל וַתְּקַ֥שׁ בְּלִדְתָּֽהּ׃", "pasuk_en": "וַיִּסְעוּ מִבֵּית אֵל וַיְהִי־עוֹד כִּבְרַת־הָאָרֶץ לָבוֹא אֶפְרָתָה וַתֵּלֶד רָחֵל וַתְּקַשׁ בְּלִדְתָּהּ׃", "rashi_he": "כברת הארץ. מְנַחֵם פֵּרֵשׁ לְשׁוֹן כַּבִּיר, רִבּוּי, מַהֲלָךְ רַב. וְאַגָּדָה, בִּזְמַן שֶׁהָאָרֶץ חֲלוּלָה וּמְנֻקֶּבֶת כִּכְבָרָה (בראשית רבה), שֶׁהַנִּיר מָצוּי, הַסְּתָו עָבַר וְהַשָּׁרָב עֲדַיִן לֹא בָא (שם ז), וְאֵין זֶה פְּשׁוּטוֹ שֶׁל מִקְרָא, שֶׁהֲרֵי בְּנַעֲמָן מָצִינוּ וַיֵּלֶךְ מֵאִתּוֹ כִּבְרַת אָרֶץ (מלכים ב ה'). וְאוֹמֵר אֲנִי שֶׁהוּא שֵׁם מִדַּת קַרְקַע, כְּמוֹ מַהֲלַךְ פַּרְסָה אוֹ יוֹתֵר, כְּמוֹ שֶׁאַתָּה אוֹמֵר צֶמֶד כֶּרֶם (ישעיהו ה'), חֶלְקַת הַשָּׂדֶה (בראשית ל\"ג), כָּךְ בְּמַהֲלַךְ אָדָם נוֹתֵן שֵׁם מִדָּה כִּבְרַת אֶרֶץ:", "rashi_en": "רש״י מביא שלושה פירושים למילה \"כברת\": מנחם פירש לשון ריבוי ומרחק רב; האגדה פירשה כזמן שהארץ חלולה ככברה — עונת החריש; ורש״י עצמו סובר שזו שם של מידת קרקע, כמו פרסה, בדומה ל\"צמד כרם\" ו\"חלקת השדה\".", "note": "", "points": [{"q": "מַהוּ פֵּירוּשׁוֹ שֶׁל רַשִׁ״י עַצְמוֹ לַמִּילָּה \"כִּבְרַת־\"?", "options": ["שֵׁם שֶׁל מִידַת קַרְקַע, כְּמוֹ מַהֲלַךְ פַּרְסָה אוֹ יוֹתֵר", "לְשׁוֹן כַּבִּיר — מַהֲלָךְ רַב וּמֶרְחָק גָּדוֹל", "זְמַן שֶׁהָאָרֶץ חֲלוּלָה כִּכְבָרָה, בְּעוֹנַת הַחֲרִישׁ"], "kasha": "המילה \"כברת\" אינה שכיחה במקרא וצריך להסביר את משמעותה.", "answer": "רש״י סובר שזהו שם מידת קרקע, כמו פרסה, בדומה לביטויים כמו \"צמד כרם\" ו\"חלקת השדה\".", "kp": ["שם מדת קרקע כמו מהלך פרסה או יותר", "כמו שאתה אומר צמד כרם"]}, {"q": "מַדּוּעַ דּוֹחֶה רַשׁ״י אֶת פֵּירוּשׁ הָאַגָּדָה?", "options": ["כִּי גַּם אֵצֶל נַעֲמָן כָּתוּב \"כִּבְרַת אֶרֶץ\", וְשָׁם אֵין קֶשֶׁר לָעוֹנָה", "כִּי פֵּירוּשׁ זֶה אֵינוֹ מַתְאִים לְדִקְדּוּק הַמִּילָּה", "כִּי לֹא מָצִינוּ בַּמִּקְרָא שֶׁכִּבְרָה מְצַיֶּינֶת זְמַן בַּשָּׁנָה"], "kasha": "האגדה פירשה \"כברת\" כזמן שהאדמה חלולה ככברה, אך רש״י אינו מקבל זאת כפשט.", "answer": "אצל נעמן נאמר \"כברת ארץ\" בלי קשר לעונה מסוימת, ולכן פירוש האגדה אינו פשוטו של מקרא.", "kp": ["שהרי בנעמן מצינו וילך מאתו כברת ארץ"]}]}, {"id": "35:17.1", "ch": 35, "v": 17, "n": 1, "dh": "כי גם זה", "pasuk_html": "וַיְהִ֥י בְהַקְשֹׁתָ֖הּ בְּלִדְתָּ֑הּ וַתֹּ֨אמֶר לָ֤הּ הַמְיַלֶּ֙דֶת֙ אַל־תִּ֣ירְאִ֔י <mark>כִּֽי־גַם־זֶ֥ה</mark> לָ֖ךְ בֵּֽן׃", "pasuk_en": "וַיְהִי בְהַקְשֹׁתָהּ בְּלִדְתָּהּ וַתֹּאמֶר לָהּ הַמְיַלֶּדֶת אַל־תִּירְאִי כִּי־גַם־זֶה לָךְ בֵּן׃", "rashi_he": "כי גם זה. נוֹסַף לְךָ עַל יוֹסֵף; וְרַבּוֹתֵינוּ דָּרְשׁוּ: עִם כָּל שֵׁבֶט נוֹלְדָה תְּאוֹמָה, וְעִם בִּנְיָמִין נוֹלְדָה תְאוֹמָה יְתֵרָה:", "rashi_en": "רש״י מפרש ש\"גם זה\" פירושו נוסף על יוסף. עוד מביא שחז״ל דרשו שעם כל שבט נולדה תאומה, ועם בנימין נולדה תאומה נוספת.", "note": "", "points": [{"q": "מַה דָּרְשׁוּ חַזַ״ל עַל הַמִּילָּה \"גַם־\" לְפִי רַשִׁ״י?", "options": ["שֶׁעִם בִּנְיָמִין נוֹלְדָה תְּאוֹמָה יְתֵרָה עַל הָרָגִיל", "שֶׁבִּנְיָמִין נוֹסַף עַל יוֹסֵף כְּבֵן שֵׁנִי לְרָחֵל", "שֶׁרָחֵל יָדְעָה בִּנְבוּאָה שֶׁיִּיווָּלֵד לָהּ בֵּן נוֹסָף"], "kasha": "המילה \"גם\" מיותרת לכאורה — היה מספיק לומר \"זה לך בן\".", "answer": "חז״ל דרשו שעם כל שבט נולדה תאומה, ועם בנימין נולדה תאומה יתרה — וזו משמעות \"גם\".", "kp": ["עם בנימין נולדה תאומה יתרה"]}]}, {"id": "35:18.1", "ch": 35, "v": 18, "n": 1, "dh": "בן אוני", "pasuk_html": "וַיְהִ֞י בְּצֵ֤את נַפְשָׁהּ֙ כִּ֣י מֵ֔תָה וַתִּקְרָ֥א שְׁמ֖וֹ <mark>בֶּן־אוֹנִ֑י</mark> וְאָבִ֖יו קָֽרָא־ל֥וֹ בִנְיָמִֽין׃", "pasuk_en": "וַיְהִי בְּצֵאת נַפְשָׁהּ כִּי מֵתָה וַתִּקְרָא שְׁמוֹ בֶּן־אוֹנִי וְאָבִיו קָרָא־לוֹ בִנְיָמִין׃", "rashi_he": "בן אוני. בֶּן צַעֲרִי:", "rashi_en": "רש״י מפרש ש\"בן אוני\" פירושו בן צערי — בן שנולד מתוך צער.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַשֵּׁם \"בֶּן־אוֹנִי\"?", "options": ["בֶּן צַעֲרִי — בֵּן שֶׁנּוֹלַד מִתּוֹךְ סֵבֶל", "בֶּן כֹּוחִי — בֵּן שֶׁנּוֹלַד בְּעֹוז וְתַעֲצוּמוֹת", "בֶּן אַבְלִי — בֵּן שֶׁגָּרַם לְאֵבֶל"], "kasha": "יש לבאר את משמעות המילה \"אוני\" בשם שקראה לו רחל.", "answer": "רש״י מפרש ש\"אוני\" פירושו צערי, כלומר רחל קראה לו כך בגלל צער הלידה.", "kp": ["בן צערי"]}]}, {"id": "35:18.2", "ch": 35, "v": 18, "n": 2, "dh": "בנימין", "pasuk_html": "וַיְהִ֞י בְּצֵ֤את נַפְשָׁהּ֙ כִּ֣י מֵ֔תָה וַתִּקְרָ֥א שְׁמ֖וֹ בֶּן־אוֹנִ֑י וְאָבִ֖יו קָֽרָא־ל֥וֹ <mark>בִנְיָמִֽין׃</mark>", "pasuk_en": "וַיְהִי בְּצֵאת נַפְשָׁהּ כִּי מֵתָה וַתִּקְרָא שְׁמוֹ בֶּן־אוֹנִי וְאָבִיו קָרָא־לוֹ בִנְיָמִין׃", "rashi_he": "בנימין. נִרְאֶה בְעֵינַי, לְפִי שֶׁהוּא לְבַדּוֹ נוֹלַד בְּאֶרֶץ כְּנַעַן שֶׁהוּא בַּנֶּגֶב כְּשֶׁאָדָם בָּא מֵאֲרַם נַהֲרַיִם, כְּמוֹ שֶׁנֶּאֱמַר בַּנֶּגֶב בְּאֶרֶץ כְּנָעַן (במדבר ל\"ג), הָלוֹךְ וְנָסוֹעַ הַנֶּגְבָּה (בראשית י\"ב):", "rashi_en": "רש\"י מסביר שבנימין נקרא כך כי הוא היחיד שנולד בארץ כנען, שהיא בדרום (נגב) ביחס לארם נהריים.", "note": "", "points": [{"q": "לְפִי רַשׁ\"י, מַדּוּעַ קָרָא יַעֲקֹב לִבְנוֹ \"בִּנְיָמִין\"?", "options": ["כִּי הוּא לְבַדּוֹ נוֹלַד בְּאֶרֶץ כְּנַעַן שֶׁהִיא בַּנֶּגֶב", "כִּי הוּא הָיָה הַבֵּן הַצָּעִיר וְהָאָהוּב בְּיוֹתֵר", "כִּי רָחֵל בָּחֲרָה בַּשֵּׁם הַזֶּה לִפְנֵי מוֹתָהּ"], "kasha": "מדוע שינה יעקב את השם שרחל נתנה (בן אוני) דווקא לשם \"בנימין\"?", "answer": "בנימין נולד כבן יחיד בארץ כנען, שהיא בנגב (דרום) כשבאים מארם נהריים, ולכן נקרא על שם הדרום — ימין.", "kp": ["לבדו נולד בארץ כנען", "שהוא בנגב"]}]}, {"id": "35:18.3", "ch": 35, "v": 18, "n": 3, "dh": "בנימין", "pasuk_html": "וַיְהִ֞י בְּצֵ֤את נַפְשָׁהּ֙ כִּ֣י מֵ֔תָה וַתִּקְרָ֥א שְׁמ֖וֹ בֶּן־אוֹנִ֑י וְאָבִ֖יו קָֽרָא־ל֥וֹ <mark>בִנְיָמִֽין׃</mark>", "pasuk_en": "וַיְהִי בְּצֵאת נַפְשָׁהּ כִּי מֵתָה וַתִּקְרָא שְׁמוֹ בֶּן־אוֹנִי וְאָבִיו קָרָא־לוֹ בִנְיָמִין׃", "rashi_he": "בנימין. בֶּן יָמִין, לְשׁוֹן צָפוֹן וְיָמִין אַתָּה בְרָאתָם (תהילים פ\"ט), לְפִיכָךְ הוּא מָלֵא:", "rashi_en": "רש\"י מסביר שבנימין הוא בן ימין, במובן של דרום, כלשון \"צפון וימין אתה בראתם\". לכן השם נכתב מלא.", "note": "", "points": [{"q": "לְפִי רַשׁ\"י, מַדּוּעַ הַשֵּׁם \"בִּנְיָמִין\" נִכְתַּב מָלֵא?", "options": ["כִּי פֵּירוּשׁוֹ \"בֶּן יָמִין\" מִלְּשׁוֹן דָּרוֹם, כְּמוֹ \"צָפוֹן וְיָמִין\"", "כִּי יַעֲקֹב רָצָה לְהַדְגִּישׁ שֶׁהוּא בְּנוֹ שֶׁל יְמִינוֹ", "כִּי הַכְּתִיב הַמָּלֵא מוֹרֶה עַל חֲשִׁיבוּתוֹ שֶׁל הַבֵּן הָאַחֲרוֹן"], "kasha": "מה טעם הכתיב המלא של השם \"בנימין\"?", "answer": "\"בנימין\" פירושו \"בן ימין\" מלשון דרום, כמו \"צפון וימין אתה בראתם\", ולכן נכתב מלא עם יו\"ד.", "kp": ["בן ימין", "לפיכך הוא מלא"]}]}, {"id": "35:22.1", "ch": 35, "v": 22, "n": 1, "dh": "בשכן ישראל בארץ ההיא", "pasuk_html": "וַיְהִ֗י <mark>בִּשְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּאָ֣רֶץ הַהִ֔וא</mark> וַיֵּ֣לֶךְ רְאוּבֵ֔ן וַיִּשְׁכַּ֕ב֙ אֶת־בִּלְהָ֖ה֙ פִּילֶ֣גֶשׁ אָבִ֑֔יו וַיִּשְׁמַ֖ע יִשְׂרָאֵֽ֑ל (פ) וַיִּֽהְי֥וּ בְנֵֽי־יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר׃", "pasuk_en": "וַיְהִי בִּשְׁכֹּן יִשְׂרָאֵל בָּאָרֶץ הַהִוא וַיֵּלֶךְ רְאוּבֵן וַיִּשְׁכַּב אֶת־בִּלְהָה פִּילֶגֶשׁ אָבִיו וַיִּשְׁמַע יִשְׂרָאֵל וַיִּהְיוּ בְנֵי־יַעֲקֹב שְׁנֵים עָשָׂר׃", "rashi_he": "בשכן ישראל בארץ ההיא. עַד שֶׁלֹּא בָא לְחֶבְרוֹן אֵצֶל יִצְחָק אֵרְעוּהוּ כָל אֵלֶּה:", "rashi_en": "רש\"י מבהיר שכל האירועים המסופרים כאן קרו לפני שיעקב הגיע לחברון אצל יצחק אביו.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מָתַי אֵירְעוּ הַמְּאוֹרָעוֹת הַמְּתוּאָרִים כָּאן?", "options": ["לִפְנֵי שֶׁיַּעֲקֹב הִגִּיעַ לְחֶבְרוֹן אֵצֶל יִצְחָק", "לְאַחַר שֶׁיַּעֲקֹב הִתְייַשֵּׁב בְּחֶבְרוֹן עִם יִצְחָק", "בִּזְמַן שֶׁיַּעֲקֹב שָׁהָה עֲדַיִין בְּבֵית לָבָן"], "kasha": "מה מלמדנו הביטוי \"בארץ ההיא\" על זמן המאורעות?", "answer": "הביטוי מלמד שכל האירועים אירעו עוד לפני שיעקב הגיע לחברון אצל יצחק אביו.", "kp": ["עד שלא בא לחברון אצל יצחק"]}]}, {"id": "35:22.2", "ch": 35, "v": 22, "n": 2, "dh": "וישכב", "pasuk_html": "וַיְהִ֗י בִּשְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּאָ֣רֶץ הַהִ֔וא וַיֵּ֣לֶךְ רְאוּבֵ֔ן <mark>וַיִּשְׁכַּ֕ב֙</mark> אֶת־בִּלְהָ֖ה֙ פִּילֶ֣גֶשׁ אָבִ֑֔יו וַיִּשְׁמַ֖ע יִשְׂרָאֵֽ֑ל (פ) וַיִּֽהְי֥וּ בְנֵֽי־יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר׃", "pasuk_en": "וַיְהִי בִּשְׁכֹּן יִשְׂרָאֵל בָּאָרֶץ הַהִוא וַיֵּלֶךְ רְאוּבֵן וַיִּשְׁכַּב אֶת־בִּלְהָה פִּילֶגֶשׁ אָבִיו וַיִּשְׁמַע יִשְׂרָאֵל וַיִּהְיוּ בְנֵי־יַעֲקֹב שְׁנֵים עָשָׂר׃", "rashi_he": "וישכב. מִתּוֹךְ שֶׁבִּלְבֵּל מִשְׁכָּבוֹ, מַעֲלֶה עָלָיו הַכָּתוּב כְּאִלּוּ שְׁכָבָהּ; וְלָמָּה בִלְבֵּל וְחִלֵּל יְצוּעָיו? שֶׁכְּשֶׁמֵּתָה רָחֵל נָטַל יַעֲקֹב מִטָּתוֹ, שֶׁהָיְתָה נְתוּנָה תָּדִיר בְּאֹהֶל רָחֵל וְלֹא בִּשְׁאָר אֹהָלִים, וּנְתָנָהּ בְּאֹהֶל בִּלְהָה; בָּא רְאוּבֵן וְתָבַע עֶלְבּוֹן אִמּוֹ, אָמַר אִם אֲחוֹת אִמִּי הָיְתָה צָרָה לְאִמִּי, שִׁפְחַת אֲחוֹת אִמִּי תְּהֵא צָרָה לְאִמִּי? לְכָךְ בִּלְבֵּל (שבת נ\"ה):", "rashi_en": "רש\"י מסביר שראובן לא שכב עם בלהה ממש, אלא בלבל את סדרי המשכב של יעקב. כשמתה רחל, יעקב העביר מיטתו לאוהל בלהה, וראובן תבע את עלבון אמו לאה ובלבל את המיטה.", "note": "", "points": [{"q": "לְפִי רַשׁ\"י, מַה עָשָׂה רְאוּבֵן בַּפֹּועַל?", "options": ["בִּלְבֵּל אֶת סִדְרֵי הַמִּשְׁכָּב שֶׁל יַעֲקֹב אָבִיו", "שָׁכַב עִם בִּלְהָה פִּילֶגֶשׁ אָבִיו כִּפְשׁוּטוֹ", "הֶעֱבִיר אֶת מִיטַּת יַעֲקֹב לְאֹוהֶל לֵאָה אִמּוֹ"], "kasha": "האם הפסוק \"וישכב את בלהה\" מתפרש כפשוטו?", "answer": "ראובן לא שכב עמה ממש, אלא בלבל את משכב אביו. הכתוב מעלה עליו כאילו שכבה בגלל שבלבל את היצועים.", "kp": ["בלבל משכבו", "מעלה עליו הכתוב כאלו שכבה"]}, {"q": "לְפִי רַשׁ\"י, מַדּוּעַ בִּלְבֵּל רְאוּבֵן אֶת יְצוּעֵי אָבִיו?", "options": ["תָּבַע עֶלְבּוֹן אִמּוֹ שֶׁלֹּא תִּהְיֶה בִּלְהָה צָרָתָהּ", "כַּעַס עַל אָבִיו שֶׁלֹּא הִסְפִּיד אֶת רָחֵל כָּרָאוּי", "רָצָה שֶׁיַּעֲקֹב יַעֲבִיר מִיטָּתוֹ לְאֹוהֶל זִלְפָּה"], "kasha": "מה הניע את ראובן לבלבל את משכב יעקב?", "answer": "כשמתה רחל, יעקב העביר מיטתו לאוהל בלהה. ראובן תבע את עלבון לאה אמו: אם אחות אמי היתה צרה לאמי, שפחתה תהא צרה לאמי?", "kp": ["תבע עלבון אמו", "שפחת אחות אמי תהא צרה לאמי"]}]}, {"id": "35:22.3", "ch": 35, "v": 22, "n": 3, "dh": "ויהיו בני יעקב שנים עשר", "pasuk_html": "וַיְהִ֗י בִּשְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּאָ֣רֶץ הַהִ֔וא וַיֵּ֣לֶךְ רְאוּבֵ֔ן וַיִּשְׁכַּ֕ב֙ אֶת־בִּלְהָ֖ה֙ פִּילֶ֣גֶשׁ אָבִ֑֔יו וַיִּשְׁמַ֖ע יִשְׂרָאֵֽ֑ל (פ) <mark>וַיִּֽהְי֥וּ בְנֵֽי־יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר׃</mark>", "pasuk_en": "וַיְהִי בִּשְׁכֹּן יִשְׂרָאֵל בָּאָרֶץ הַהִוא וַיֵּלֶךְ רְאוּבֵן וַיִּשְׁכַּב אֶת־בִּלְהָה פִּילֶגֶשׁ אָבִיו וַיִּשְׁמַע יִשְׂרָאֵל וַיִּהְיוּ בְנֵי־יַעֲקֹב שְׁנֵים עָשָׂר׃", "rashi_he": "ויהיו בני יעקב שנים עשר. מַתְחִיל לְעִנְיָן רִאשׁוֹן, מִשֶּׁנּוֹלַד בִּנְיָמִין נִשְׁלְמָה הַמִּטָּה וּמֵעַתָּה רְאוּיִים לְהִמָּנוֹת, וּמְנָאָן; וְרַבּוֹתֵינוּ דָּרְשׁוּ, לְלַמְּדֵנוּ בָא, שֶׁכֻּלָּן שָׁוִין וְכֻלָּן צַדִּיקִים, שֶׁלֹּא חָטָא רְאוּבֵן:", "rashi_en": "הכתוב חוזר לעניין הראשון — משנולד בנימין נשלמו שנים עשר השבטים והיו ראויים להימנות. חז״ל דרשו שהכתוב בא ללמד שכולם שווים וצדיקים, ושראובן לא חטא.", "note": "", "points": [{"q": "לְפִי דְּרָשַׁת חַז״ל שֶׁמֵּבִיא רַשׁ״י, מַה בָּא הַכָּתוּב לְלַמְּדֵנוּ בְּמִנְיַין בְּנֵי יַעֲקֹב?", "options": ["שֶׁכֻּולָּם שָׁווִים וְצַדִּיקִים, וְשֶׁרְאוּבֵן לֹא חָטָא", "שֶׁבִּנְיָמִין הָיָה הָאַחֲרוֹן לְהִיוָּולֵד וְהִשְׁלִים אֶת הַמִּנְיָין", "שֶׁרַק שְׁנֵים עָשָׂר בָּנִים רְאוּיִים לִהְיוֹת שְׁבָטִים"], "kasha": "מדוע הכתוב מונה את בני יעקב דווקא כאן, מיד אחרי מעשה ראובן?", "answer": "חז״ל דרשו שהכתוב בא ללמד שכולם שווים וכולם צדיקים, ושראובן לא חטא.", "kp": ["שכלן שוין וכלן צדיקים", "שלא חטא ראובן"]}, {"q": "לְפִי הַפְּשָׁט שֶׁבְּרַשׁ״י, מַדּוּעַ נִמְנוּ בְּנֵי יַעֲקֹב דַּוְוקָא כָּאן?", "options": ["מִשֶּׁנּוֹלַד בִּנְיָמִין נִשְׁלְמָה הַמַּטֶּה וְהָיוּ רְאוּיִים לְהִימָּנוֹת", "כְּדֵי לְסַייֵּם אֶת פָּרָשַׁת וַיִּשְׁלַח בְּמִנְיַין הַשְּׁבָטִים", "כְּדֵי לְהַרְאוֹת שֶׁרְאוּבֵן עֲדַיִין נֶחְשָׁב בֵּין הַבָּנִים"], "kasha": "מדוע הכתוב חוזר ומונה את בני יעקב באמצע הסיפור?", "answer": "משנולד בנימין נשלמה המטה ומעתה היו ראויים להימנות, והכתוב חוזר לעניין הראשון ומונה אותם.", "kp": ["משנולד בנימין נשלמה המטה", "ומעתה ראויים להמנות"]}]}, {"id": "35:23.1", "ch": 35, "v": 23, "n": 1, "dh": "בכור יעקב", "pasuk_html": "בְּנֵ֣י לֵאָ֔ה <mark>בְּכ֥וֹר יַעֲקֹ֖ב</mark> רְאוּבֵ֑ן וְשִׁמְעוֹן֙ וְלֵוִ֣י וִֽיהוּדָ֔ה וְיִשָּׂשכָ֖ר וּזְבוּלֻֽן׃", "pasuk_en": "בְּנֵי לֵאָה בְּכוֹר יַעֲקֹב רְאוּבֵן וְשִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וּזְבוּלֻן׃", "rashi_he": "בכור יעקב. אֲפִלּוּ בִּשְׁעַת הַקַּלְקָלָה קְרָאוֹ בְּכוֹר:", "rashi_en": "רש״י מדגיש שגם כשהכתוב מספר על קלקולו של ראובן, הוא עדיין קורא לו בכור יעקב.", "note": "", "points": [{"q": "מַה מַדְגִּישׁ רַשִׁ״י לְגַבֵּי הַכִּינּוּי ״בְּכוֹר יַעֲקֹב״?", "options": ["אֲפִילּוּ בִּשְׁעַת הַקִּלְקָלָה הַכָּתוּב קוֹרֵא לוֹ בְּכוֹר", "הַבְּכוֹרָה נִיתְּנָה לוֹ בִּזְכוּת מַעֲשָׂיו הַטּוֹבִים", "הַתּוֹאַר מוֹכִיחַ שֶׁלֹּא אֵירַע שׁוּם קִלְקוּל"], "kasha": "מדוע הכתוב קורא לראובן ״בכור יעקב״ דווקא בהקשר של מעשה בלהה?", "answer": "אפילו בשעת הקלקלה, הכתוב עדיין קורא לראובן בכור.", "kp": ["אפלו בשעת הקלקלה קראו בכור"]}]}, {"id": "35:23.2", "ch": 35, "v": 23, "n": 2, "dh": "בכור יעקב", "pasuk_html": "בְּנֵ֣י לֵאָ֔ה <mark>בְּכ֥וֹר יַעֲקֹ֖ב</mark> רְאוּבֵ֑ן וְשִׁמְעוֹן֙ וְלֵוִ֣י וִֽיהוּדָ֔ה וְיִשָּׂשכָ֖ר וּזְבוּלֻֽן׃", "pasuk_en": "בְּנֵי לֵאָה בְּכוֹר יַעֲקֹב רְאוּבֵן וְשִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וּזְבוּלֻן׃", "rashi_he": "בכור יעקב. בְּכוֹר לַנַּחֲלָה, בְּכוֹר לָעֲבוֹדָה, בְּכוֹר לְמִנְיָן, וְלֹא נִתְּנָה בְכוֹרָה לְיוֹסֵף אֶלָּא לְעִנְיַן הַשְּׁבָטִים – שֶׁנַּעֲשָׂה לִשְׁנֵי שְׁבָטִים:", "rashi_en": "ראובן נשאר בכור לעניין נחלה, עבודה ומניין. ליוסף ניתנה הבכורה רק לעניין השבטים, שנעשה לשני שבטים.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, לְאֵילּוּ עִנְייָנִים נִשְׁאֲרָה הַבְּכוֹרָה אֵצֶל רְאוּבֵן?", "options": ["לְנַחֲלָה, לַעֲבוֹדָה וּלְמִנְיָין", "לְנַחֲלָה, לְבָרָכָה וּלְמַלְכוּת", "לַעֲבוֹדָה, לְמִנְיָין וְלִשְׁבָטִים"], "kasha": "אם הבכורה ניטלה מראובן וניתנה ליוסף, מדוע הכתוב עדיין קורא לראובן בכור?", "answer": "ראובן נשאר בכור לנחלה, לעבודה ולמניין. ליוסף ניתנה בכורה רק לעניין השבטים — שנעשה לשני שבטים.", "kp": ["בכור לנחלה בכור לעבודה בכור למנין", "לא נתנה בכורה ליוסף אלא לענין השבטים"]}]}, {"id": "35:27.1", "ch": 35, "v": 27, "n": 1, "dh": "ממרא", "pasuk_html": "וַיָּבֹ֤א יַעֲקֹב֙ אֶל־יִצְחָ֣ק אָבִ֔יו <mark>מַמְרֵ֖א</mark> קִרְיַ֣ת הָֽאַרְבַּ֑ע הִ֣וא חֶבְר֔וֹן אֲשֶׁר־גָּֽר־שָׁ֥ם אַבְרָהָ֖ם וְיִצְחָֽק׃", "pasuk_en": "וַיָּבֹא יַעֲקֹב אֶל־יִצְחָק אָבִיו מַמְרֵא קִרְיַת הָאַרְבַּע הִוא חֶבְרוֹן אֲשֶׁר־גָּר־שָׁם אַבְרָהָם וְיִצְחָק׃", "rashi_he": "ממרא. שֵׁם הַמִּישׁוֹר:", "rashi_en": "רש״י מפרש ש״ממרא״ הוא שם המישור, כלומר שם המקום ולא שם אדם.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה ״מַמְרֵא״ בַּפָּסוּק זֶה?", "options": ["שֵׁם הַמִּישׁוֹר שֶׁבּוֹ נִמְצֵאת חֶבְרוֹן", "שֵׁם הָאָדָם שֶׁהָיָה בַּעַל הַקַּרְקַע", "שֵׁם הָעִיר הַסְּמוּכָה לְחֶבְרוֹן"], "kasha": "מהו הפירוש של ״ממרא״ — האם זה שם אדם או שם מקום?", "answer": "ממרא הוא שם המישור.", "kp": ["שם המישור"]}]}, {"id": "35:27.2", "ch": 35, "v": 27, "n": 2, "dh": "קרית הארבע", "pasuk_html": "וַיָּבֹ֤א יַעֲקֹב֙ אֶל־יִצְחָ֣ק אָבִ֔יו מַמְרֵ֖א <mark>קִרְיַ֣ת הָֽאַרְבַּ֑ע</mark> הִ֣וא חֶבְר֔וֹן אֲשֶׁר־גָּֽר־שָׁ֥ם אַבְרָהָ֖ם וְיִצְחָֽק׃", "pasuk_en": "וַיָּבֹא יַעֲקֹב אֶל־יִצְחָק אָבִיו מַמְרֵא קִרְיַת הָאַרְבַּע הִוא חֶבְרוֹן אֲשֶׁר־גָּר־שָׁם אַבְרָהָם וְיִצְחָק׃", "rashi_he": "קרית הארבע. שֵׁם הָעִיר:", "rashi_en": "רש\"י מבהיר שקרית הארבע הוא שם העיר, כלומר חברון.", "note": "", "points": [{"q": "מַה מַבְהִיר רַשִׁ\"י לְגַבֵּי הַבִּיטּוּי \"קִרְיַת הָאַרְבַּע\"?", "options": ["שֶׁזֶּהוּ שֵׁם הָעִיר", "שֶׁהָיוּ שָׁם אַרְבָּעָה זוּגוֹת קְבוּרִים", "שֶׁהִיא נִקְרֵאת כָּךְ עַל שֵׁם אַרְבָּעָה עֲנָקִים"], "kasha": "לא ברור מהפסוק מהו \"קרית הארבע\" — שם מקום, תואר, או משהו אחר.", "answer": "רש\"י מפרש שקרית הארבע הוא שם העיר.", "kp": ["שם העיר"]}]}, {"id": "35:27.3", "ch": 35, "v": 27, "n": 3, "dh": "ממרא קרית הארבע", "pasuk_html": "וַיָּבֹ֤א יַעֲקֹב֙ אֶל־יִצְחָ֣ק אָבִ֔יו <mark>מַמְרֵ֖א קִרְיַ֣ת הָֽאַרְבַּ֑ע</mark> הִ֣וא חֶבְר֔וֹן אֲשֶׁר־גָּֽר־שָׁ֥ם אַבְרָהָ֖ם וְיִצְחָֽק׃", "pasuk_en": "וַיָּבֹא יַעֲקֹב אֶל־יִצְחָק אָבִיו מַמְרֵא קִרְיַת הָאַרְבַּע הִוא חֶבְרוֹן אֲשֶׁר־גָּר־שָׁם אַבְרָהָם וְיִצְחָק׃", "rashi_he": "ממרא קרית הארבע. אֶל מִישׁוֹר שֶׁל קִרְיַת אַרְבַּע. וְאִ\"תֹּ הָיָה לוֹ לִכְתּוֹב מַמְרֵא הַקִּרְיַת אַרְבַּע? כֵּן דֶּרֶךְ הַמִּקְרָא בְּכָל דָּבָר שֶׁשְּׁמוֹ כָּפוּל, כְּגוֹן זֶה, וּכְגוֹן בֵּית לֶחֶם, אֲבִי עֶזֶר, בֵּית אֵל, אִם הֻצְרַךְ לְהַטִּיל בּוֹ הֵ\"א, נוֹתְנָהּ בְּרֹאשׁ הַתֵּבָה הַשְּׁנִיָּה – בֵּית הַלַּחְמִי (שמואל א ט\"ז), בְּעָפְרָת אֲבִי הָעֶזְרִי (שופטים ו'), בָּנָה חִיאֵל בֵּית הָאֱלִי (מלכים א ט\"ז):", "rashi_en": "רש\"י מסביר מדוע ה\"א הידיעה באה על המילה \"ארבע\" ולא על \"קרית\". בשמות כפולים, ה\"א הידיעה ניתנת בראש התיבה השנייה, כמו \"בית הלחמי\" ו\"אבי העזרי\".", "note": "", "points": [{"q": "מַדּוּעַ כָּתוּב \"קִרְיַת הָאַרְבַּע\" וְלֹא \"הַקִּרְיַת אַרְבַּע\"?", "options": ["בְּשֵׁם כָּפוּל הָ\"א הַיְּדִיעָה בָּאָה בְּרֹאשׁ הַתֵּיבָה הַשְּׁנִיָּיה", "כִּי \"אַרְבַּע\" הוּא שֵׁם עֶצֶם פְּרָטִי וְצָרִיךְ הֵ\"א", "כִּי \"קִרְיַת\" אֵינָהּ מְקַבֶּלֶת הֵ\"א הַיְּדִיעָה לְעוֹלָם"], "kasha": "קשה מדוע ה\"א הידיעה מופיעה על \"ארבע\" ולא על \"קרית\", שהיא התיבה הראשונה.", "answer": "רש\"י מסביר שבכל שם כפול במקרא, כשצריך ה\"א הידיעה, נותנים אותה בראש התיבה השנייה, כמו \"בית הלחמי\" ו\"בית האלי\".", "kp": ["כן דרך המקרא בכל דבר ששמו כפול", "נותנה בראש התבה השניה"]}]}, {"id": "35:29.1", "ch": 35, "v": 29, "n": 1, "dh": "ויגוע יצחק", "pasuk_html": "<mark>וַיִּגְוַ֨ע יִצְחָ֤ק</mark> וַיָּ֙מָת֙ וַיֵּאָ֣סֶף אֶל־עַמָּ֔יו זָקֵ֖ן וּשְׂבַ֣ע יָמִ֑ים וַיִּקְבְּר֣וּ אֹת֔וֹ עֵשָׂ֥ו וְיַעֲקֹ֖ב בָּנָֽיו׃ (פ)", "pasuk_en": "וַיִּגְוַע יִצְחָק וַיָּמָת וַיֵּאָסֶף אֶל־עַמָּיו זָקֵן וּשְׂבַע יָמִים וַיִּקְבְּרוּ אֹתוֹ עֵשָׂו וְיַעֲקֹב בָּנָיו׃", "rashi_he": "ויגוע יצחק. אֵין מֻקְדָּם וּמְאֻחָר בַּתּוֹרָה; מְכִירָתוֹ שֶׁל יוֹסֵף קָדְמָה לְמִיתָתוֹ שֶׁל יִצְחָק י\"ב שָׁנָה, שֶׁהֲרֵי כְּשֶׁנּוֹלַד יַעֲקֹב הָיָה יִצְחָק בֶּן שִׁשִּׁים שָׁנָה, שֶׁנֶּאֱמַר וְיִצְחָק בֶּן שִׁשִּׁים שָׁנָה וְגוֹ', וְיִצְחָק מֵת בִּשְׁנַת ק\"כ לְיַעֲקֹב – אִם תּוֹצִיא שִׁשִּׁים מִמֵּאָה וּשְׁמוֹנִים שָׁנָה נִשְׁאֲרוּ ק\"כ – וְיוֹסֵף נִמְכַּר בֶּן י\"ז שָׁנָה, וְאוֹתָהּ שָׁנָה שְׁנַת מֵאָה וּשְׁמוֹנֶה לְיַעֲקֹב, כֵּיצַד? בֶּן שִׁשִּׁים וְשָׁלוֹשׁ נִתְבָּרֵךְ, אַרְבַּע עֶשְׂרֵה שָׁנָה נִטְמַן בְּבֵית עֵבֶר, הֲרֵי שִׁבְעִים וְשֶׁבַע, וְאַרְבַּע עֶשְׂרֵה עָבַד בְּאִשָּׁה, וּבְסוֹף אַרְבַּע עֶשְׂרֵה נוֹלַד יוֹסֵף, שֶׁנֶּאֱמַר וַיְהִי כַּאֲשֶׁר יָלְדָה רָחֵל אֶת יוֹסֵף וְגוֹ', הֲרֵי תִּשְׁעִים וְאַחַת, וְי\"ז עַד שֶׁלֹּא נִמְכַּר יוֹסֵף, הֲרֵי מֵאָה וּשְׁמוֹנֶה (עוֹד מְפֹרָשׁ מִן הַמִּקְרָא מִשֶּׁנִּמְכַּר יוֹסֵף עַד שֶׁבָּא יַעֲקֹב מִצְרַיִמָה כ\"ב שָׁנָה שֶׁנֶּ', וְיוֹסֵף בֶּן שְׁלֹשִׁים שָׁנָה וְגוֹ', וְז' שָׁנִים שָׂבָע וּשְׁנָתַיִם רָעָב, הֲרֵי כ\"ב, וּכְתִיב יְמֵי שְׁנֵי מְגוּרַי שְׁלֹשִׁים וּמְאַת שָׁנָה, נִמְצָא יַעֲקֹב בִּמְכִירָתוֹ ק\"ח):", "rashi_en": "רש\"י מבהיר שמיתת יצחק לא אירעה בזמן שהיא כתובה. מכירת יוסף קדמה למיתת יצחק בשתים עשרה שנה, כי אין מוקדם ומאוחר בתורה. רש\"י מוכיח זאת בחישוב מפורט של גילאות יעקב ויוסף.", "note": "", "points": [{"q": "מַה מְלַמֵּד רַשִׁ\"י לְגַבֵּי סֵדֶר הָאֵירוּעִים בַּפָּרָשָׁה?", "options": ["מְכִירַת יוֹסֵף קָדְמָה לְמִיתַת יִצְחָק בִּשְׁתֵּים עֶשְׂרֵה שָׁנָה", "מִיתַת יִצְחָק קָדְמָה לִמְכִירַת יוֹסֵף בִּשְׁתֵּים עֶשְׂרֵה שָׁנָה", "מְכִירַת יוֹסֵף וּמִיתַת יִצְחָק אֵירְעוּ בְּאוֹתָהּ שָׁנָה"], "kasha": "לפי סדר הכתובים נראה שיצחק מת לפני מכירת יוסף, אך החישוב אינו מתיישב עם כך.", "answer": "רש\"י מלמד שאין מוקדם ומאוחר בתורה, ומכירת יוסף קדמה למיתת יצחק בשתים עשרה שנה.", "kp": ["אין מקדם ומאחר בתורה", "מכירתו של יוסף קדמה למיתתו של יצחק י\"ב שנה"]}]}, {"id": "36:2.1", "ch": 36, "v": 2, "n": 1, "dh": "עדה בת אילון", "pasuk_html": "עֵשָׂ֛ו לָקַ֥ח אֶת־נָשָׁ֖יו מִבְּנ֣וֹת כְּנָ֑עַן אֶת־<mark>עָדָ֗ה בַּת־אֵילוֹן֙</mark> הַֽחִתִּ֔י וְאֶת־אָהֳלִֽיבָמָה֙ בַּת־עֲנָ֔ה בַּת־צִבְע֖וֹן הַֽחִוִּֽי׃", "pasuk_en": "עֵשָׂו לָקַח אֶת־נָשָׁיו מִבְּנוֹת כְּנָעַן אֶת־עָדָה בַּת־אֵילוֹן הַחִתִּי וְאֶת־אָהֳלִיבָמָה בַּת־עֲנָה בַּת־צִבְעוֹן הַחִוִּי׃", "rashi_he": "עדה בת אילון. הִיא בָּשְׂמַת בַּת אֵילוֹן, וְנִקְרֵאת בָּשְׂמַת עַל שֵׁם שֶׁהָיְתָה מְקַטֶּרֶת בְּשָׂמִים לַעֲ\"זָ:", "rashi_en": "רש\"י מזהה שעדה בת אילון היא בשמת בת אילון הנזכרת במקום אחר. היא נקראה \"בשמת\" על שם שהיתה מקטרת בשמים לעבודה זרה.", "note": "", "points": [{"q": "מַדּוּעַ נִקְרְאָה עָדָה בַּת אֵילוֹן גַּם בְּשֵׁם \"בָּשְׂמַת\"?", "options": ["עַל שֵׁם שֶׁהָיְתָה מְקַטֶּרֶת בְּשָׂמִים לַעֲבוֹדָה זָרָה", "עַל שֵׁם רֵיחַ הַבְּשָׂמִים שֶׁהָיְתָה מִשְׁתַּמֶּשֶׁת בָּהֶם לִרְפוּאָה", "עַל שֵׁם אִמָּהּ שֶׁשְּׁמָהּ הָיָה בָּשְׂמַת"], "kasha": "אשת עשו נקראת בפסוק \"עדה\", אך במקום אחר היא נקראת \"בשמת\", ולא ברור מדוע יש לה שני שמות.", "answer": "רש\"י מסביר שעדה היא בשמת בת אילון, ונקראה בשמת כי היתה מקטרת בשמים לעבודה זרה.", "kp": ["היא בשמת בת אילון", "מקטרת בשמים לע\"ז"]}]}, {"id": "36:2.2", "ch": 36, "v": 2, "n": 2, "dh": "אהליבמה", "pasuk_html": "עֵשָׂ֛ו לָקַ֥ח אֶת־נָשָׁ֖יו מִבְּנ֣וֹת כְּנָ֑עַן אֶת־עָדָ֗ה בַּת־אֵילוֹן֙ הַֽחִתִּ֔י וְאֶת־<mark>אָהֳלִֽיבָמָה֙</mark> בַּת־עֲנָ֔ה בַּת־צִבְע֖וֹן הַֽחִוִּֽי׃", "pasuk_en": "עֵשָׂו לָקַח אֶת־נָשָׁיו מִבְּנוֹת כְּנָעַן אֶת־עָדָה בַּת־אֵילוֹן הַחִתִּי וְאֶת־אָהֳלִיבָמָה בַּת־עֲנָה בַּת־צִבְעוֹן הַחִוִּי׃", "rashi_he": "אהליבמה. הִיא יְהוּדִית, וְהוּא כִנָּה שְׁמָהּ יְהוּדִית לוֹמַר שֶׁהִיא כּוֹפֶרֶת בַּעֲ\"זָ כְּדֵי לְהַטְעוֹת אֶת אָבִיו:", "rashi_en": "אהליבמה היא יהודית. עשו כינה אותה 'יהודית' כדי לרמוז שהיא כופרת בעבודה זרה, ובכך להטעות את יצחק אביו.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ כִּינָּה עֵשָׂו אֶת אָהֳלִיבָמָה בְּשֵׁם 'יְהוּדִית'?", "options": ["כְּדֵי לְהַטְעוֹת אֶת אָבִיו שֶׁהִיא כּוֹפֶרֶת בַּעֲבוֹדָה זָרָה", "כִּי הִיא בָּאָה מִשֵּׁבֶט יְהוּדָה", "כִּי הִיא הִתְגַּייְּרָה וְהֶחְלִיטָה לַעֲבֹוד אֶת ה׳"], "kasha": "מדוע יש לאהליבמה שם נוסף — יהודית — ומה משמעותו?", "answer": "עשו כינה אותה יהודית כדי לרמוז שהיא כופרת בעבודה זרה, ובכך להטעות את יצחק אביו.", "kp": ["כופרת בע\"ז", "להטעות את אביו"]}]}, {"id": "36:2.3", "ch": 36, "v": 2, "n": 3, "dh": "בת ענה בת צבעון", "pasuk_html": "עֵשָׂ֛ו לָקַ֥ח אֶת־נָשָׁ֖יו מִבְּנ֣וֹת כְּנָ֑עַן אֶת־עָדָ֗ה בַּת־אֵילוֹן֙ הַֽחִתִּ֔י וְאֶת־אָהֳלִֽיבָמָה֙ <mark>בַּת־עֲנָ֔ה בַּת־צִבְע֖וֹן</mark> הַֽחִוִּֽי׃", "pasuk_en": "עֵשָׂו לָקַח אֶת־נָשָׁיו מִבְּנוֹת כְּנָעַן אֶת־עָדָה בַּת־אֵילוֹן הַחִתִּי וְאֶת־אָהֳלִיבָמָה בַּת־עֲנָה בַּת־צִבְעוֹן הַחִוִּי׃", "rashi_he": "בת ענה בת צבעון. אִם בַּת עֲנָה לֹא בַּת צִבְעוֹן? עֲנָה בְּנוֹ שֶׁל צִבְעוֹן, שֶׁנֶּאֱמַר וְאֵלֶּה בְנֵי צִבְעוֹן וְאַיָּה וַעֲנָה? מְלַמֵּד שֶׁבָּא צִבְעוֹן עַל כַּלָּתוֹ אֵשֶׁת עֲנָה, וְיָצְאָה אָהֳלִיבָמָה מִבֵּין שְׁנֵיהֶם, וְהוֹדִיעֲךָ הַכָּתוּב שֶׁכֻּלָּן בְּנֵי מַמְזֵרוּת הָיוּ:", "rashi_en": "הפסוק קורא לאהליבמה 'בת ענה בת צבעון', אף שענה הוא בנו של צבעון ולא בתו. רש״י מסביר שצבעון בא על כלתו אשת ענה, ומכאן שאהליבמה נולדה משניהם, וכולם היו בני ממזרות.", "note": "", "points": [{"q": "מַה הַקֹּושִׁי שֶׁרַשִׁ״י מַעֲלֶה בַּבִּיטּוּי 'בַּת עָנָה בַּת צִבְעוֹן'?", "options": ["אִם הִיא בַּת עָנָה, אֵין צֹורֶךְ לוֹמַר שֶׁהִיא בַּת צִבְעוֹן — אֶלָּא אִם כֵּן יֵשׁ יַחַס מְיֻוחָד", "הַפָּסוּק הָיָה צָרִיךְ לִכְתֹּוב 'בַּת צִבְעוֹן' בִּלְבַד כִּי הוּא הַסָּב", "לֹא בָּרוּר אִם עָנָה הוּא גֶּבֶר אוֹ אִשָּׁה"], "kasha": "אם אהליבמה היא בת ענה, מדוע הפסוק מוסיף שהיא גם בת צבעון, הרי צבעון הוא סבה?", "answer": "צבעון בא על כלתו אשת ענה, ולכן אהליבמה היא בתם של שניהם — גם של ענה וגם של צבעון.", "kp": ["בא צבעון על כלתו אשת ענה", "יצאה אהליבמה מבין שניהם"]}, {"q": "מַה רַשִׁ״י לוֹמֵד מִכְּפִילוּת הַיִּיחוּס לְגַבֵּי בְּנֵי עֵשָׂו?", "options": ["שֶׁכֻּולָּם הָיוּ בְּנֵי מַמְזֵרוּת", "שְׁעָנָה וְצִבְעוֹן הָיוּ מֵאוֹתוֹ שֵׁבֶט", "שְׁעֵשָׂו לֹא יָדַע אֶת יִיחוּסָהּ הָאֲמִיתִּי"], "kasha": "מדוע הכתוב טורח לפרט ייחוס כפול שלכאורה מיותר?", "answer": "הכתוב בא להודיע שכולם היו בני ממזרות, שהרי אהליבמה נולדה מצבעון שבא על כלתו.", "kp": ["כלן בני ממזרות היו"]}]}, {"id": "36:3.1", "ch": 36, "v": 3, "n": 1, "dh": "בשמת בת ישמעאל", "pasuk_html": "וְאֶת־<mark>בָּשְׂמַ֥ת בַּת־יִשְׁמָעֵ֖אל</mark> אֲח֥וֹת נְבָיֽוֹת׃", "pasuk_en": "וְאֶת־בָּשְׂמַת בַּת־יִשְׁמָעֵאל אֲחוֹת נְבָיוֹת׃", "rashi_he": "בשמת בת ישמעאל. וּלְהַלָּן קוֹרֵא לָהּ מָחֲלַת? מָצִינוּ בְּאַגָּדַת מִדְרַשׁ סֵפֶר שְׁמוּאֵל ג' מוֹחֲלִים לָהֶן עֲוֹנוֹתֵיהֶן, גֵּר שֶׁנִּתְגַּיֵּר, וְהָעוֹלֶה לִגְדֻלָּה, וְהַנּוֹשֵׂא אִשָּׁה. וְלָמַד הַטַּעַם מִכָּאן – לְכָךְ נִקְרֵאת מָחֲלַת, שֶׁנִּמְחֲלוּ עֲוֹנוֹתָיו:", "rashi_en": "בשמת נקראת במקום אחר 'מחלת'. רש״י מביא מדרש שיש שלושה שנמחלים עוונותיהם: גר שנתגייר, מי שעולה לגדולה, ומי שנושא אשה. לכן נקראת מחלת — שנמחלו עוונות עשו בנישואיו.", "note": "", "points": [{"q": "מַדּוּעַ נִקְרֵאת בָּשְׂמַת גַּם בְּשֵׁם 'מַחֲלַת', לְפִי רַשִׁ״י?", "options": ["כִּי הַנּוֹשֵׂא אִשָּׁה נִמְחָלִים עֲוֺונוֹתָיו, וְעֵשָׂו נָשָׂא אוֹתָהּ", "כִּי הִיא חָלְתָה לִפְנֵי הַנִּישּׂוּאִין וְהִתְרַפְּאָה", "כִּי מַחֲלַת הוּא שְׁמָהּ הַמְּקוֹרִי וּבָשְׂמַת הוּא כִּינּוּי"], "kasha": "מדוע הכתוב קורא לאותה אשה בשני שמות שונים — בשמת ומחלת?", "answer": "נקראת מחלת כי הנושא אשה נמחלים עוונותיו, ומכאן נלמד שנמחלו עוונות עשו כשנשא אותה.", "kp": ["הנושא אשה", "נקראת מחלת שנמחלו עונותיו"]}]}, {"id": "36:3.2", "ch": 36, "v": 3, "n": 2, "dh": "אחות נביות", "pasuk_html": "וְאֶת־בָּשְׂמַ֥ת בַּת־יִשְׁמָעֵ֖אל <mark>אֲח֥וֹת נְבָיֽוֹת׃</mark>", "pasuk_en": "וְאֶת־בָּשְׂמַת בַּת־יִשְׁמָעֵאל אֲחוֹת נְבָיוֹת׃", "rashi_he": "אחות נביות. עַל שֵׁם שֶׁהוּא הִשִּׂיאָהּ לוֹ מִשֶּׁמֵּת יִשְׁמָעֵאל נִקְרֵאת עַל שְׁמוֹ:", "rashi_en": "בשמת נקראת 'אחות נביות' כי נביות הוא שהשיא אותה לעשו לאחר מות ישמעאל אביהם.", "note": "", "points": [{"q": "מַדּוּעַ הַכָּתוּב מְייַחֵס אֶת בָּשְׂמַת לִנְבָיוֹת אָחִיהָ וְלֹא לְיִשְׁמָעֵאל אָבִיהָ?", "options": ["כִּי נְבָיוֹת הוּא שֶׁהִשִּׂיא אוֹתָהּ לְעֵשָׂו אַחֲרֵי מוֹת יִשְׁמָעֵאל", "כִּי נְבָיוֹת הָיָה גָּדוֹל מִמֶּנָּה וְגִידֵּל אוֹתָהּ", "כִּי יִשְׁמָעֵאל הִתְנַגֵּד לַנִּישׂוּאִין וְלָכֵן לֹא הוּזְכַּר"], "kasha": "הפסוק כבר אמר שבשמת היא בת ישמעאל, אז מדוע צריך להוסיף 'אחות נביות'?", "answer": "נביות השיא אותה לעשו לאחר שישמעאל נפטר, ולכן נקראת על שם נביות.", "kp": ["השיאה לו משמת ישמעאל"]}]}, {"id": "36:5.1", "ch": 36, "v": 5, "n": 1, "dh": "ואהליבמה ילדה וגו'", "pasuk_html": "<mark>וְאָהֳלִֽיבָמָה֙ יָֽלְדָ֔ה</mark> אֶת־יעיש [יְע֥וּשׁ] וְאֶת־יַעְלָ֖ם וְאֶת־קֹ֑רַח אֵ֚לֶּה בְּנֵ֣י עֵשָׂ֔ו אֲשֶׁ֥ר יֻלְּדוּ־ל֖וֹ בְּאֶ֥רֶץ כְּנָֽעַן׃", "pasuk_en": "וְאָהֳלִיבָמָה יָלְדָה אֶת־יעיש [יְעוּשׁ] וְאֶת־יַעְלָם וְאֶת־קֹרַח אֵלֶּה בְּנֵי עֵשָׂו אֲשֶׁר יֻלְּדוּ־לוֹ בְּאֶרֶץ כְּנָעַן׃", "rashi_he": "ואהליבמה ילדה וגו'. קֹרַח זֶה מַמְזֵר הָיָה, וּבֶן אֱלִיפַז הָיָה, שֶׁבָּא עַל אֵשֶׁת אָבִיו, אֶל אָהֳלִיבָמָה אֵשֶׁת עֵשָׂו, שֶׁהֲרֵי הוּא מָנוּי עִם אַלּוּפֵי אֱלִיפַז בְּסוֹף הָעִנְיָן (בראשית רבה):", "rashi_en": "רש\"י מסביר שקרח הנזכר כאן היה ממזר, בנו של אליפז שבא על אהליבמה אשת עשו אביו. הראיה לכך היא שקרח מנוי בין אלופי אליפז בהמשך הפרשה.", "note": "", "points": [{"q": "לְפִי רַשׁ\"י, מַדּוּעַ קֹרַח נֶחְשַׁב מַמְזֵר?", "options": ["כִּי אֱלִיפַז בָּא עַל אָהֳלִיבָמָה אֵשֶׁת עֵשָׂו אָבִיו", "כִּי עֵשָׂו נָשָׂא אֶת אָהֳלִיבָמָה שֶׁלֹּא כַּדִּין", "כִּי קֹרַח נוֹלַד לִפְנֵי נִישּׂוּאֵי עֵשָׂו וְאָהֳלִיבָמָה"], "kasha": "קרח מופיע גם בין בני אהליבמה וגם בין אלופי אליפז, וצריך להבין מדוע.", "answer": "קרח היה ממזר, בנו של אליפז שבא על אהליבמה אשת אביו עשו, ולכן הוא מנוי עם אלופי אליפז.", "kp": ["קרח זה ממזר היה", "ובן אליפז היה שבא על אשת אביו"]}]}, {"id": "36:6.1", "ch": 36, "v": 6, "n": 1, "dh": "וילך אל ארץ", "pasuk_html": "וַיִּקַּ֣ח עֵשָׂ֡ו אֶת־נָ֠שָׁיו וְאֶת־בָּנָ֣יו וְאֶת־בְּנֹתָיו֮ וְאֶת־כָּל־נַפְשׁ֣וֹת בֵּיתוֹ֒ וְאֶת־מִקְנֵ֣הוּ וְאֶת־כָּל־בְּהֶמְתּ֗וֹ וְאֵת֙ כָּל־קִנְיָנ֔וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּאֶ֣רֶץ כְּנָ֑עַן <mark>וַיֵּ֣לֶךְ אֶל־אֶ֔רֶץ</mark> מִפְּנֵ֖י יַעֲקֹ֥ב אָחִֽיו׃", "pasuk_en": "וַיִּקַּח עֵשָׂו אֶת־נָשָׁיו וְאֶת־בָּנָיו וְאֶת־בְּנֹתָיו וְאֶת־כָּל־נַפְשׁוֹת בֵּיתוֹ וְאֶת־מִקְנֵהוּ וְאֶת־כָּל־בְּהֶמְתּוֹ וְאֵת כָּל־קִנְיָנוֹ אֲשֶׁר רָכַשׁ בְּאֶרֶץ כְּנָעַן וַיֵּלֶךְ אֶל־אֶרֶץ מִפְּנֵי יַעֲקֹב אָחִיו׃", "rashi_he": "וילך אל ארץ. לָגוּר בַּאֲשֶׁר יִמְצָא:", "rashi_en": "רש\"י מפרש שעשו הלך לגור בכל מקום שימצא, ולא למקום מסוים.", "note": "", "points": [{"q": "לְפִי רַשׁ\"י, לְאָן הָלַךְ עֵשָׂו כְּשֶׁיָּצָא מֵאֶרֶץ כְּנָעַן?", "options": ["לָגוּר בְּכָל מָקוֹם שֶׁיִּמְצָא", "יְשִׁירוֹת לְהַר שֵׂעִיר שֶׁכְּבָר הִכִּיר", "לְאֶרֶץ מִצְרַיִם שֶׁהָיְתָה קְרוֹבָה"], "kasha": "הפסוק אומר \"וילך אל ארץ\" בלי לפרט לאיזו ארץ, וצריך להבין מה כוונת הביטוי הסתום הזה.", "answer": "עשו הלך לגור באשר ימצא, כלומר לא היה לו יעד מוגדר אלא חיפש מקום מגורים.", "kp": ["לגור באשר ימצא"]}]}, {"id": "36:7.1", "ch": 36, "v": 7, "n": 1, "dh": "ולא יכלה ארץ מגוריהם", "pasuk_html": "כִּֽי־הָיָ֧ה רְכוּשָׁ֛ם רָ֖ב מִשֶּׁ֣בֶת יַחְדָּ֑ו <mark>וְלֹ֨א יָֽכְלָ֜ה אֶ֤רֶץ מְגֽוּרֵיהֶם֙</mark> לָשֵׂ֣את אֹתָ֔ם מִפְּנֵ֖י מִקְנֵיהֶֽם׃", "pasuk_en": "כִּי־הָיָה רְכוּשָׁם רָב מִשֶּׁבֶת יַחְדָּו וְלֹא יָכְלָה אֶרֶץ מְגוּרֵיהֶם לָשֵׂאת אֹתָם מִפְּנֵי מִקְנֵיהֶם׃", "rashi_he": "ולא יכלה ארץ מגוריהם. לְהַסְפִּיק מִרְעֶה לַבְּהֵמוֹת שֶׁלָּהֶם (ב\"ר). וּמִ\"אַ: מפני יעקב אחיו. מִפְּנֵי שְׁטַר חוֹב שֶׁל גְּזֵרַת \"כִּי גֵר יִהְיֶה זַרְעֲךָ\" הַמֻּטָּל עַל זַרְעוֹ שֶׁל יִצְחָק, אָמַר אֵלֵךְ לִי מִכָּאן, אֵין לִי חֵלֶק לֹא בַּמַּתָּנָה, שֶׁנִּתְּנָה לוֹ הָאָרֶץ הַזֹּאת, וְלֹא בְּפִרְעוֹן הַשְּׁטָר, וּמִפְּנֵי הַבּוּשָׁה שֶׁמָּכַר בְּכוֹרָתוֹ:", "rashi_en": "לפי הפשט, הארץ לא הספיקה מרעה לבהמותיהם. לפי המדרש, עשו ברח מפני שטר החוב של \"כי גר יהיה זרעך\" שחל על זרע יצחק, ולא רצה חלק במתנת הארץ ולא בגזרת הגלות, וגם מפני הבושה שמכר את בכורתו.", "note": "", "points": [{"q": "לְפִי הַפְּשָׁט בְּרַשׁ\"י, מַדּוּעַ לֹא יָכְלָה הָאָרֶץ לָשֵׂאת אֶת שְׁנֵיהֶם?", "options": ["כִּי לֹא הָיָה מַסְפִּיק מִרְעֶה לַבְּהֵמוֹת שֶׁלָּהֶם", "כִּי הָיוּ בֵּינֵיהֶם מְרִיבוֹת עַל יְרֻושַּׁת הָאָרֶץ", "כִּי יוֹשְׁבֵי הָאָרֶץ לֹא הִסְכִּימוּ לְקַבְּלָם יַחַד"], "kasha": "הביטוי \"ולא יכלה ארץ מגוריהם\" טעון הסבר — מה בדיוק חסר בארץ.", "answer": "הארץ לא יכלה להספיק מרעה לבהמות של שניהם.", "kp": ["להספיק מרעה לבהמות שלהם"]}, {"q": "לְפִי הַמִּדְרָשׁ, מַה הַסִּיבָּה שֶׁעֵשָׂו עָזַב אֶת אֶרֶץ כְּנַעַן?", "options": ["לֹא רָצָה חֵלֶק בִּגְזֵרַת \"כִּי גֵר יִהְיֶה זַרְעֲךָ\" וּבוֹשׁ עַל מְכִירַת הַבְּכוֹרָה", "פַּחַד מֵעֹונֶשׁ עַל שֶׁנָּשָׂא נָשִׁים כְּנַעֲנִיּוֹת", "יַעֲקֹב דָּרַשׁ מִמֶּנּוּ לַעֲזֹוב כִּתְנַאי לְשָׁלוֹם בֵּינֵיהֶם"], "kasha": "הפסוק מזכיר \"מפני יעקב אחיו\" וצריך להבין מה בדיוק גרם לו לברוח מפני יעקב.", "answer": "עשו לא רצה חלק בשטר החוב של גזרת הגלות שחלה על זרע יצחק, ולא במתנת הארץ, וגם בוש שמכר את בכורתו.", "kp": ["מפני שטר חוב של גזרת כי גר יהיה זרעך", "ומפני הבושה שמכר בכורתו"]}]}, {"id": "36:9.1", "ch": 36, "v": 9, "n": 1, "dh": "ואלה", "pasuk_html": "<mark>וְאֵ֛לֶּה</mark> תֹּלְד֥וֹת עֵשָׂ֖ו אֲבִ֣י אֱד֑וֹם בְּהַ֖ר שֵׂעִֽיר׃", "pasuk_en": "וְאֵלֶּה תֹּלְדוֹת עֵשָׂו אֲבִי אֱדוֹם בְּהַר שֵׂעִיר׃", "rashi_he": "ואלה. הַתּוֹלָדוֹת שֶׁהוֹלִידוּ בָנָיו עַכְשָׁו מִשֶּׁהָלַךְ לְשֵׂעִיר:", "rashi_en": "רש\"י מסביר ש\"אלה\" מתייחס לתולדות שנולדו לבני עשו לאחר שהלך לשעיר, ולא לאלה שנזכרו קודם.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מָתַי נוֹלְדוּ הַתּוֹלָדוֹת הַמְּנוּיִים כָּאן?", "options": ["לְאַחַר שֶׁעֵשָׂו הָלַךְ לְשֵׂעִיר", "בְּעוֹדָם בְּאֶרֶץ כְּנַעַן לִפְנֵי הַמַּעֲבָר", "בִּתְקוּפָה שֶׁעֵשָׂו גָּר בְּבֵית יִצְחָק אָבִיו"], "kasha": "הפסוק חוזר ואומר \"ואלה תולדות עשו\" למרות שכבר מנה את בניו, וצריך להבין למה.", "answer": "אלה התולדות שהולידו בניו של עשו אחרי שהלך לשעיר, ולא אלו שנזכרו קודם.", "kp": ["התולדות שהולידו בניו עכשו משהלך לשעיר"]}]}, {"id": "36:12.1", "ch": 36, "v": 12, "n": 1, "dh": "ותמנע היתה פילגש", "pasuk_html": "<mark>וְתִמְנַ֣ע ׀ הָיְתָ֣ה פִילֶ֗גֶשׁ</mark> לֶֽאֱלִיפַז֙ בֶּן־עֵשָׂ֔ו וַתֵּ֥לֶד לֶאֱלִיפַ֖ז אֶת־עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׃", "pasuk_en": "וְתִמְנַע הָיְתָה פִילֶגֶשׁ לֶאֱלִיפַז בֶּן־עֵשָׂו וַתֵּלֶד לֶאֱלִיפַז אֶת־עֲמָלֵק אֵלֶּה בְּנֵי עָדָה אֵשֶׁת עֵשָׂו׃", "rashi_he": "ותמנע היתה פילגש. לְהוֹדִיעַ גְּדֻלָּתוֹ שֶׁל אַבְרָהָם, כַּמָּה הָיוּ תְאֵבִים לִדַּבֵּק בְּזַרְעוֹ. תִּמְנַע זוֹ בַּת אַלּוּפִים הָיְתָה, שֶׁנֶּאֱמַר וַאֲחוֹת לוֹטָן תִּמְנָע, וְלוֹטָן מֵאַלּוּפֵי יוֹשְׁבֵי שֵׂעִיר הָיָה מִן הַחוֹרִים שֶׁיָּשְׁבוּ בָהּ לְפָנִים, אָמְרָה אֵינִי זוֹכָה לְהִנָּשֵׂא לְךָ, הַלְוַאי וְאֶהְיֶה פִּילֶגֶשׁ. וּבְדִבְרֵי הַיָּמִים מוֹנֶה אוֹתָהּ בְּבָנָיו שֶׁל אֱלִיפַז, מְלַמֵּד שֶׁבָּא עַל אִשְׁתּוֹ שֶׁל שֵׂעִיר וְיָצְאָה תִּמְנָע מִבֵּינֵיהֶם, וּכְשֶׁגָּדְלָה נַעֲשֵׂית פִּילַגְשׁוֹ, וְזֶהוּ וַאֲחוֹת לוֹטָן תִּמְנָע, וְלֹא מְנָאָהּ עִם בְּנֵי שֵׂעִיר שֶׁהָיְתָה אֲחוֹתוֹ מִן הָאֵם וְלֹא מִן הָאָב:", "rashi_en": "רש״י מסביר שהתורה מספרת על תמנע כדי להראות את גדולת אברהם. תמנע היתה בת אלופים, אך העדיפה להיות פילגש לאליפז ובלבד שתידבק בזרע אברהם. בדברי הימים היא נמנית בבני אליפז כי אליפז בא על אשת שעיר ונולדה תמנע, ולכן היא אחות לוטן מן האם בלבד.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ הַתּוֹרָה מְסַפֶּרֶת שֶׁתִּמְנָע הָיְתָה פִּילֶגֶשׁ לֶאֱלִיפַז?", "options": ["כְּדֵי לְהוֹדִיעַ אֶת גְּדֻולַּת אַבְרָהָם, שֶׁתָּאֲבוּ לְהִידָּבֵק בְּזַרְעוֹ", "כְּדֵי לְהַסְבִּיר מַדּוּעַ עֲמָלֵק הָיָה שׂוֹנֵא אֶת יִשְׂרָאֵל", "כְּדֵי לְפָרֵט אֶת תּוֹלְדוֹת מִשְׁפַּחַת שֵׂעִיר הַחֹורִי"], "kasha": "מדוע התורה טורחת לספר פרטים על תמנע ומעמדה כפילגש, שלכאורה אינם נצרכים לתולדות עשו?", "answer": "התורה מספרת זאת כדי להודיע את גדולת אברהם — שתמנע, שהיתה בת אלופים, העדיפה להיות פילגש ובלבד שתידבק בזרעו של אברהם.", "kp": ["להודיע גדלתו של אברהם", "כמה היו תאבים לדבק בזרעו", "בת אלופים היתה"]}, {"q": "לְפִי רַשִׁ״י, מַדּוּעַ תִּמְנָע אֵינָהּ נִמְנֵית עִם בְּנֵי שֵׂעִיר אַף שֶׁהִיא אֲחוֹת לוֹטָן?", "options": ["כִּי הָיְתָה אֲחוֹתוֹ מִן הָאֵם וְלֹא מִן הָאָב", "כִּי וִיתְּרָה עַל מַעֲמָדָהּ כְּשֶׁנַּעֲשֵׂתָה פִּילֶגֶשׁ", "כִּי נוֹלְדָה לְאַחַר שֶׁעֵשָׂו כָּבַשׁ אֶת שֵׂעִיר"], "kasha": "אם תמנע אחות לוטן בן שעיר, מדוע לא מנאה הכתוב בין בני שעיר?", "answer": "רש״י מסביר שאליפז בא על אשת שעיר ונולדה תמנע, כך שהיא אחות לוטן מן האם בלבד ולא מן האב, ולכן לא נמנתה עם בני שעיר.", "kp": ["שהיתה אחותו מן האם ולא מן האב", "שבא על אשתו של שעיר ויצאה תמנע מביניהם"]}]}, {"id": "36:15.1", "ch": 36, "v": 15, "n": 1, "dh": "אלה אלופי בני עשו", "pasuk_html": "<mark>אֵ֖לֶּה אַלּוּפֵ֣י בְנֵֽי־עֵשָׂ֑ו</mark> בְּנֵ֤י אֱלִיפַז֙ בְּכ֣וֹר עֵשָׂ֔ו אַלּ֤וּף תֵּימָן֙ אַלּ֣וּף אוֹמָ֔ר אַלּ֥וּף צְפ֖וֹ אַלּ֥וּף קְנַֽז׃", "pasuk_en": "אֵלֶּה אַלּוּפֵי בְנֵי־עֵשָׂו בְּנֵי אֱלִיפַז בְּכוֹר עֵשָׂו אַלּוּף תֵּימָן אַלּוּף אוֹמָר אַלּוּף צְפוֹ אַלּוּף קְנַז׃", "rashi_he": "אלה אלופי בני עשו. רָאשֵׁי מִשְׁפָּחוֹת:", "rashi_en": "רש״י מפרש ש״אלופים״ פירושו ראשי משפחות.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מַהוּ ״אַלּוּפִים״?", "options": ["רָאשֵׁי מִשְׁפָּחוֹת", "מְלָכִים וְשַׁלִּיטִים עַל עַמִּים", "שָׂרֵי צָבָא וְגִיבּוֹרֵי מִלְחָמָה"], "kasha": "מה פירוש התואר ״אלוף״ הנזכר כאן?", "answer": "רש״י מפרש שאלופים הם ראשי משפחות.", "kp": ["ראשי משפחות"]}]}, {"id": "36:20.1", "ch": 36, "v": 20, "n": 1, "dh": "ישבי הארץ", "pasuk_html": "אֵ֤לֶּה בְנֵֽי־שֵׂעִיר֙ הַחֹרִ֔י <mark>יֹשְׁבֵ֖י הָאָ֑רֶץ</mark> לוֹטָ֥ן וְשׁוֹבָ֖ל וְצִבְע֥וֹן וַעֲנָֽה׃", "pasuk_en": "אֵלֶּה בְנֵי־שֵׂעִיר הַחֹרִי יֹשְׁבֵי הָאָרֶץ לוֹטָן וְשׁוֹבָל וְצִבְעוֹן וַעֲנָה׃", "rashi_he": "ישבי הארץ. שֶׁהָיוּ יוֹשְׁבֶיהָ קֹדֶם שֶׁבָּא עֵשָׂו לְשָׁם. וְרַבּוֹתֵינוּ דָּרְשׁוּ (שבת פ\"ה) שֶׁהָיוּ בְּקִיאִין בְּיִשּׁוּבָהּ שֶׁל אֶרֶץ; מְלֹא קָנֶה זֶה לְזֵיתִים, מְלֹא קָנֶה זֶה לִגְפָנִים, שֶׁהָיוּ טוֹעֲמִין הֶעָפָר וְיוֹדְעִין אֵי זוֹ נְטִיעָה רְאוּיָה לוֹ:", "rashi_en": "רש״י מביא שני פירושים ל״ישבי הארץ״: לפי הפשט — שישבו בארץ לפני שבא עשו. ולפי חז״ל — שהיו בקיאים בישובה של ארץ, טועמים את העפר ויודעים איזו נטיעה מתאימה לכל מקום.", "note": "", "points": [{"q": "לְפִי הַפְּשָׁט בְּרַשׁ״י, מַה מַשְׁמָעוּת ״יֹשְׁבֵי הָאָרֶץ״?", "options": ["שֶׁהָיוּ יוֹשְׁבֶיהָ שֶׁל הָאָרֶץ לִפְנֵי שֶׁבָּא עֵשָׂו לְשָׁם", "שֶׁהָיוּ בְּקִיאִים בְּעִיבּוּד הַקַּרְקַע וּטְעִימַת הֶעָפָר", "שֶׁקִּיבְּלוּ אֶת הָאָרֶץ בִּירֻושָּׁה מֵאֲבוֹתֵיהֶם"], "kasha": "מדוע הכתוב מדגיש שבני שעיר הם ״ישבי הארץ״, והרי פשוט שגרו שם?", "answer": "לפי הפשט, הכוונה שהם ישבו בארץ קודם שבא עשו לשם, כלומר הם התושבים המקוריים.", "kp": ["שהיו יושביה קדם שבא עשו לשם"]}, {"q": "לְפִי דְּרָשַׁת חַז״ל שֶׁמֵּבִיא רַשׁ״י, בַּמֶּה הָיוּ הַחֹורִים בְּקִיאִים?", "options": ["בְּיִשּׁוּבָהּ שֶׁל אֶרֶץ — טוֹעֲמִים עָפָר וְיוֹדְעִים מַה לִּנְטוֹעַ", "בַּחֲפִירַת מְעָרוֹת וּבְנִיַּית מַחְסוֹת בֶּהָרִים", "בְּגִידּוּל בְּהֵמוֹת וּמְצִיאַת מַרְעֶה טוֹב"], "kasha": "מדוע הכתוב קורא להם ״ישבי הארץ״ ולא סתם תושבים?", "answer": "חז״ל דרשו שהיו בקיאים בישובה של ארץ — היו טועמים את העפר ויודעים איזו נטיעה ראויה לכל קרקע.", "kp": ["בקיאין בישובה של ארץ", "שהיו טועמין העפר ויודעין אי זו נטיעה ראויה לו"]}]}, {"id": "36:24.1", "ch": 36, "v": 24, "n": 1, "dh": "ואיה וענה", "pasuk_html": "וְאֵ֥לֶּה בְנֵֽי־צִבְע֖וֹן <mark>וְאַיָּ֣ה וַעֲנָ֑ה</mark> ה֣וּא עֲנָ֗ה אֲשֶׁ֨ר מָצָ֤א אֶת־הַיֵּמִם֙ בַּמִּדְבָּ֔ר בִּרְעֹת֥וֹ אֶת־הַחֲמֹרִ֖ים לְצִבְע֥וֹן אָבִֽיו׃", "pasuk_en": "וְאֵלֶּה בְנֵי־צִבְעוֹן וְאַיָּה וַעֲנָה הוּא עֲנָה אֲשֶׁר מָצָא אֶת־הַיֵּמִם בַּמִּדְבָּר בִּרְעֹתוֹ אֶת־הַחֲמֹרִים לְצִבְעוֹן אָבִיו׃", "rashi_he": "ואיה וענה. וָי\"ו יְתֵרָה, וְהוּא כְּמוֹ אַיָּה וַעֲנָה, וְהַרְבֵּה יֵשׁ בַּמִּקְרָא, תֵּת וְקֹדֶשׁ וְצָבָא מִרְמָס (דניאל ח'), נִרְדָּם וְרֶכֶב וָסוּס (תהילים ע\"ו):", "rashi_en": "רש״י מסביר שהוי״ו של ״ואיה״ היא יתרה, והכוונה היא ״איה וענה״. הוא מביא דוגמאות נוספות מן המקרא לוי״ו יתרה.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מַהִי הַבְּעָיָה בְּתֵיבַת ״וְאַיֵּה״ וּמָה פִּתְרוֹנָהּ?", "options": ["הַוָּי״ו יְתֵרָה, וְהַכַּוָּונָה ״אַיָּה וְעַנָה״", "הַמִּילָּה מְיֻותֶּרֶת לְגַמְרֵי כִּי אַיָּה וְעַנָה הֵם אוֹתוֹ אָדָם", "הַוָּי״ו מְחַבֶּרֶת לַפָּסוּק הַקּוֹדֵם וּמוֹסִיפָה בֵּן נוֹסָף לְצִבְעוֹן"], "kasha": "הוי״ו בתחילת ״ואיה״ מיותרת, שהרי הפסוק כבר פתח ב״ואלה בני צבעון״ ואין צורך בוי״ו חיבור לפני השם הראשון.", "answer": "רש״י מסביר שהוי״ו של ״ואיה״ היא יתרה, וכאילו כתוב ״איה וענה״, ומביא דוגמאות נוספות מן המקרא לתופעה זו.", "kp": ["ויו יתרה", "והוא כמו איה וענה"]}]}, {"id": "36:24.2", "ch": 36, "v": 24, "n": 2, "dh": "הוא ענה", "pasuk_html": "וְאֵ֥לֶּה בְנֵֽי־צִבְע֖וֹן וְאַיָּ֣ה וַעֲנָ֑ה <mark>ה֣וּא עֲנָ֗ה</mark> אֲשֶׁ֨ר מָצָ֤א אֶת־הַיֵּמִם֙ בַּמִּדְבָּ֔ר בִּרְעֹת֥וֹ אֶת־הַחֲמֹרִ֖ים לְצִבְע֥וֹן אָבִֽיו׃", "pasuk_en": "וְאֵלֶּה בְנֵי־צִבְעוֹן וְאַיָּה וַעֲנָה הוּא עֲנָה אֲשֶׁר מָצָא אֶת־הַיֵּמִם בַּמִּדְבָּר בִּרְעֹתוֹ אֶת־הַחֲמֹרִים לְצִבְעוֹן אָבִיו׃", "rashi_he": "הוא ענה. הָאָמוּר לְמַעְלָה שֶׁהוּא אָחִיו שֶׁל צִבְעוֹן וְכָאן הוּא קוֹרֵא אוֹתוֹ בְּנוֹ? מְלַמֵּד שֶׁבָּא צִבְעוֹן עַל אִמּוֹ וְהוֹלִיד אֶת עֲנָה:", "rashi_en": "רש\"י מקשה שלמעלה ענה נקרא אחיו של צבעון, וכאן הוא נקרא בנו. התשובה היא שצבעון בא על אמו והוליד את ענה, כך שענה הוא גם אחיו וגם בנו.", "note": "", "points": [{"q": "מַדּוּעַ קוֹרֵא הַכָּתוּב לְעָנָה גַּם 'אָחִיו' שֶׁל צִבְעוֹן וְגַם 'בְּנוֹ'?", "options": ["צִבְעוֹן בָּא עַל אִמּוֹ וְהוֹלִיד אֶת עָנָה, שֶׁהוּא גַּם אָחִיו וְגַם בְּנוֹ", "הָיוּ שְׁנֵי אֲנָשִׁים בְּשֵׁם עֲנָה, אֶחָד אָח וְאֶחָד בֵּן", "הַכָּתוּב מִשְׁתַּמֵּשׁ בְּ'אָח' בְּמוּבַן שֶׁל בֶּן שֵׁבֶט, לֹא אָח מַמָּשׁ"], "kasha": "למעלה ענה נקרא אחיו של צבעון, וכאן הוא נקרא בנו, וזו סתירה.", "answer": "צבעון בא על אמו והוליד את ענה, ולכן ענה הוא גם אחיו (מצד האם) וגם בנו.", "kp": ["שבא צבעון על אמו והוליד את ענה"]}]}, {"id": "36:24.3", "ch": 36, "v": 24, "n": 3, "dh": "את הימם", "pasuk_html": "וְאֵ֥לֶּה בְנֵֽי־צִבְע֖וֹן וְאַיָּ֣ה וַעֲנָ֑ה ה֣וּא עֲנָ֗ה אֲשֶׁ֨ר מָצָ֤א <mark>אֶת־הַיֵּמִם֙</mark> בַּמִּדְבָּ֔ר בִּרְעֹת֥וֹ אֶת־הַחֲמֹרִ֖ים לְצִבְע֥וֹן אָבִֽיו׃", "pasuk_en": "וְאֵלֶּה בְנֵי־צִבְעוֹן וְאַיָּה וַעֲנָה הוּא עֲנָה אֲשֶׁר מָצָא אֶת־הַיֵּמִם בַּמִּדְבָּר בִּרְעֹתוֹ אֶת־הַחֲמֹרִים לְצִבְעוֹן אָבִיו׃", "rashi_he": "את הימם. פְּרָדִים, הִרְבִּיעַ חֲמוֹר עַל סוּס נְקֵבָה וְיָלְדָה פֶּרֶד, וְהוּא הָיָה מַמְזֵר וְהֵבִיא פְסוּלִין לָעוֹלָם; וְלָמָּה נִקְרָא שְׁמָם יֵמִים? שֶׁאֵימָתָן מֻטֶּלֶת עַל הַבְּרִיּוֹת, דְּאָמַר רַבִּי חֲנִינָא מִיָּמַי לֹא שְׁאָלַנִי אָדָם עַל מַכַּת פִּרְדָּה לְבָנָה וְחָיָה (חולין ז') (וַהֲלֹא קָא חֲזִינָן דְּחָיָה? אַל תִּקְרֵי וְחָיָה אֶלָּא וְחָיְתָה, כִּי הַמַּכָּה לֹא תֵּרָפֵא לְעוֹלָם, בְרַשִׁ\"י יָשָׁן) וְלֹא הֻזְקַק לִכְתֹּב לָנוּ מִשְׁפְּחוֹת הַחוֹרִי אֶלָּא מִפְּנֵי תִּמְנָע, וּלְהוֹדִיעַ גְּדֻלַּת אַבְרָהָם, כְּמוֹ שֶׁפֵּרַשְׁתִּי לְמַעְלָה:", "rashi_en": "רש\"י מסביר ש'ימים' הם פרדים, שענה יצר על ידי הרבעת חמור על סוס נקבה. הם נקראים 'ימים' כי אימתם מוטלת על הבריות. רש\"י מוסיף שהתורה כתבה את משפחות החורי רק בגלל תמנע, להודיע את גדולת אברהם.", "note": "", "points": [{"q": "מַהֵם הַ'יֵמִים' שֶׁמָּצָא עַנָה בַּמִּדְבָּר, וּמַדּוּעַ נִקְרְאוּ כָּךְ?", "options": ["פְּרָדִים, וְנִקְרְאוּ כָּךְ כִּי אֵימָתָם מוּטֶלֶת עַל הַבְּרִיּוֹת", "מַעְייָנוֹת חַמִּים, וְנִקְרְאוּ כָּךְ עַל שֵׁם חֻומָּם", "חַיּוֹת מִדְבָּר נְדִירוֹת, וְנִקְרְאוּ כָּךְ עַל שֵׁם יְמֵי קֶדֶם"], "kasha": "מהו 'ימים' שמצא ענה, ומה המשמעות של שם זה?", "answer": "ימים הם פרדים שענה יצר בהרבעת חמור על סוס נקבה, ונקראו ימים כי אימתם מוטלת על הבריות.", "kp": ["פרדים הרביע חמור על סוס נקבה", "שאימתן מטלת על הבריות"]}, {"q": "מַדּוּעַ כָּתְבָה הַתּוֹרָה אֶת מִשְׁפְּחוֹת הָחֹורִי?", "options": ["בִּגְלַל תִּמְנָע, לְהוֹדִיעַ אֶת גְּדֻולַּת אַבְרָהָם", "כְּדֵי לִמְנוֹת אֶת עַמֵּי הָאָרֶץ שֶׁיִּשְׂרָאֵל עֲתִידִים לָרֶשֶׁת", "כְּדֵי לְפָרֵט אֶת צֶאֱצָאֵי עֵשָׂו שֶׁהִתְעָרְבוּ בַּחֹורִים"], "kasha": "לכאורה אין צורך לפרט את משפחות החורי, שאינם מזרע אברהם.", "answer": "התורה כתבה את משפחות החורי בגלל תמנע, כדי להודיע את גדולת אברהם, כפי שפירש רש\"י למעלה.", "kp": ["ולא הזקק לכתב לנו משפחות החורי אלא מפני תמנע", "ולהודיע גדלת אברהם"]}]}, {"id": "36:31.1", "ch": 36, "v": 31, "n": 1, "dh": "ואלה המלכים וגו'", "pasuk_html": "<mark>וְאֵ֙לֶּה֙ הַמְּלָכִ֔ים</mark> אֲשֶׁ֥ר מָלְכ֖וּ בְּאֶ֣רֶץ אֱד֑וֹם לִפְנֵ֥י מְלָךְ־מֶ֖לֶךְ לִבְנֵ֥י יִשְׂרָאֵֽל׃", "pasuk_en": "וְאֵלֶּה הַמְּלָכִים אֲשֶׁר מָלְכוּ בְּאֶרֶץ אֱדוֹם לִפְנֵי מְלָךְ־מֶלֶךְ לִבְנֵי יִשְׂרָאֵל׃", "rashi_he": "ואלה המלכים וגו'. שְׁמוֹנָה הָיוּ וּכְנֶגְדָּן הֶעֱמִיד יַעֲקֹב וּבִטֵּל מַלְכוּת עֵשָׂו בִּימֵיהֶם, אֵלּוּ הֵן, שָׁאוּל וְאִישׁ בֹּשֶׁת, דָּוִד וּשְׁלֹמֹה, רְחַבְעָם, אֲבִיָּה, אָסָא, יְהוֹשָׁפָט; וּבִימֵי יוֹרָם בְּנוֹ כָּתוּב בְּיָמָיו פָּשַׁע אֱדוֹם מִתַּחַת יַד יְהוּדָה וַיַּמְלִכוּ עֲלֵיהֶם מֶלֶךְ (מלכים ב ח'), וּבִימֵי שָׁאוּל כָּתוּב וּמֶלֶךְ אֵין בֶּאֱדוֹם נִצָּב מֶלֶךְ (מלכים א כ\"ב):", "rashi_en": "רש\"י מסביר ששמונה מלכים מלכו באדום, וכנגדם העמיד יעקב שמונה מלכים שבימיהם בטלה מלכות עשו. בימי יורם בן יהושפט פשע אדום מתחת יד יהודה.", "note": "", "points": [{"q": "כַּמָּה מְלָכִים מָלְכוּ בֶּאֱדוֹם, וּמָה כְּנֶגְדָּם בְּיִשְׂרָאֵל?", "options": ["שְׁמוֹנָה, וּכְנֶגְדָּם שְׁמוֹנָה מַלְכֵי יִשְׂרָאֵל שֶׁבִּימֵיהֶם בָּטְלָה מַלְכוּת עֵשָׂו", "שִׁבְעָה, וּכְנֶגְדָּם שִׁבְעַת הַשּׁוֹפְטִים הָרִאשׁוֹנִים בְּיִשְׂרָאֵל", "שְׁמוֹנָה, וּכְנֶגְדָּם שְׁמוֹנָה שִׁבְטֵי יִשְׂרָאֵל שֶׁנִּלְחֲמוּ בֶּאֱדוֹם"], "kasha": "מדוע מונה הכתוב בדיוק שמונה מלכים באדום, ומה משמעות המספר?", "answer": "שמונה מלכים מלכו באדום, וכנגדם העמיד יעקב שמונה מלכים — משאול ועד יהושפט — שבימיהם בטלה מלכות עשו.", "kp": ["שמונה היו וכנגדן העמיד יעקב ובטל מלכות עשו בימיהם"]}]}, {"id": "36:33.1", "ch": 36, "v": 33, "n": 1, "dh": "יובב בן זרח מבצרה", "pasuk_html": "וַיָּ֖מָת בָּ֑לַע וַיִּמְלֹ֣ךְ תַּחְתָּ֔יו <mark>יוֹבָ֥ב בֶּן־זֶ֖רַח מִבָּצְרָֽה׃</mark>", "pasuk_en": "וַיָּמָת בָּלַע וַיִּמְלֹךְ תַּחְתָּיו יוֹבָב בֶּן־זֶרַח מִבָּצְרָה׃", "rashi_he": "יובב בן זרח מבצרה. בָּצְרָה מֵעָרֵי מוֹאָב הִיא, שֶׁנֶּאֱמַר וְעַל קְרִיּוֹת וְעַל בָּצְרָה וגו' (ירמיהו מ\"ח); וּלְפִי שֶׁהֶעֱמִידָה מֶלֶךְ לֶאֱדוֹם, עֲתִידָה לִלְקוֹת עִמָּהֶם, שֶׁנֶּאֱמַר כִּי זֶבַח לַה' בְּבָצְרָה (ישעיהו ל\"ד):", "rashi_en": "רש\"י מסביר שבצרה היא עיר מואבית, ומכיוון שהעמידה מלך לאדום, היא עתידה ללקות עמהם, כפי שנאמר 'כי זבח לה' בבצרה'.", "note": "", "points": [{"q": "מַדּוּעַ עֲתִידָה בָּצְרָה לִלְקוֹת יַחַד עִם אֱדוֹם?", "options": ["כִּי הִיא הֶעֱמִידָה מֶלֶךְ לֶאֱדוֹם, אַף שֶׁהִיא עִיר מוֹאָבִית", "כִּי תּוֹשָׁבֶיהָ סִייְּעוּ לֶאֱדוֹם בַּמִּלְחָמָה נֶגֶד יִשְׂרָאֵל", "כִּי הִיא נִמְצֵאת בְּתוֹךְ גְּבוּלוֹת אֶרֶץ אֱדוֹם"], "kasha": "בצרה היא עיר של מואב ולא של אדום, ומדוע היא נענשת עם אדום?", "answer": "בצרה היא מערי מואב, אך מכיוון שהעמידה מלך לאדום, עתידה ללקות עמהם.", "kp": ["בצרה מערי מואב היא", "ולפי שהעמידה מלך לאדום עתידה ללקות עמהם"]}]}, {"id": "36:35.1", "ch": 36, "v": 35, "n": 1, "dh": "המכה את מדין בשדה מואב", "pasuk_html": "וַיָּ֖מָת חֻשָׁ֑ם וַיִּמְלֹ֨ךְ תַּחְתָּ֜יו הֲדַ֣ד בֶּן־בְּדַ֗ד <mark>הַמַּכֶּ֤ה אֶת־מִדְיָן֙ בִּשְׂדֵ֣ה מוֹאָ֔ב</mark> וְשֵׁ֥ם עִיר֖וֹ עֲוִֽית׃", "pasuk_en": "וַיָּמָת חֻשָׁם וַיִּמְלֹךְ תַּחְתָּיו הֲדַד בֶּן־בְּדַד הַמַּכֶּה אֶת־מִדְיָן בִּשְׂדֵה מוֹאָב וְשֵׁם עִירוֹ עֲוִית׃", "rashi_he": "המכה את מדין בשדה מואב. שֶׁבָּאוּ מִדְיָן עַל מוֹאָב לַמִּלְחָמָה, וְהָלַךְ מֶלֶךְ אֱדוֹם לַעֲזֹר אֶת מוֹאָב; וּמִכָּאן אָנוּ לְמֵדִים, שֶׁהָיוּ מִדְיָן וּמוֹאָב מְרִיבִים זֶה עִם זֶה, וּבִימֵי בִלְעָם עָשׂוּ שָׁלוֹם לְהִתְקַשֵּׁר עַל יִשְׂרָאֵל:", "rashi_en": "רש״י מסביר שמדין באו להילחם במואב, ומלך אדום הלך לעזור למואב. מכאן למדים שמדין ומואב היו ביריבות, ורק בימי בלעם עשו שלום ביניהם כדי להתאחד נגד ישראל.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מָה לוֹמְדִים מִכָּךְ שֶׁמֶּלֶךְ אֱדוֹם הִכָּה אֶת מִדְיָן בִּשְׂדֵה מוֹאָב?", "options": ["שֶׁמִּדְיָן וּמוֹאָב הָיוּ יְרִיבִים, וְרַק בִּימֵי בִּלְעָם עָשׂוּ שָׁלוֹם נֶגֶד יִשְׂרָאֵל", "שֶׁמּוֹאָב וֶאֱדוֹם הָיוּ בַּעֲלֵי בְּרִית קְבוּעִים נֶגֶד מִדְיָן", "שֶׁמִּדְיָן וּמוֹאָב הָיוּ תָּמִיד בְּשָׁלוֹם זֶה עִם זֶה"], "kasha": "מדוע הוצרך הכתוב לציין שההכאה היתה \"בשדה מואב\" — מה מלמד פרט זה?", "answer": "מדין באו למלחמה על מואב ומלך אדום עזר למואב, ומכאן שמדין ומואב רבו, ורק בימי בלעם השלימו כדי להתקשר על ישראל.", "kp": ["שהיו מדין ומואב מריבים זה עם זה", "בימי בלעם עשו שלום להתקשר על ישראל"]}]}, {"id": "36:39.1", "ch": 36, "v": 39, "n": 1, "dh": "בת מי זהב", "pasuk_html": "וַיָּמָת֮ בַּ֣עַל חָנָ֣ן בֶּן־עַכְבּוֹר֒ וַיִּמְלֹ֤ךְ תַּחְתָּיו֙ הֲדַ֔ר וְשֵׁ֥ם עִיר֖וֹ פָּ֑עוּ וְשֵׁ֨ם אִשְׁתּ֤וֹ מְהֵֽיטַבְאֵל֙ בַּת־מַטְרֵ֔ד <mark>בַּ֖ת מֵ֥י זָהָֽב׃</mark>", "pasuk_en": "וַיָּמָת בַּעַל חָנָן בֶּן־עַכְבּוֹר וַיִּמְלֹךְ תַּחְתָּיו הֲדַר וְשֵׁם עִירוֹ פָּעוּ וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל בַּת־מַטְרֵד בַּת מֵי זָהָב׃", "rashi_he": "בת מי זהב. מַהוּ זָהָב? עָשִׁיר הָיָה, וְאֵין זָהָב חָשׁוּב בְּעֵינָיו לִכְלוּם:", "rashi_en": "רש״י מפרש את השם \"מי זהב\" כביטוי של זלזול בזהב — היה עשיר כל כך שהזהב לא היה חשוב בעיניו כלל.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ נִקְרָא שְׁמוֹ \"מֵי זָהָב\"?", "options": ["הָיָה עָשִׁיר כָּל כָּךְ שֶׁזָהָב לֹא הָיָה חָשׁוּב בְּעֵינָיו", "הָיָה עָנִי וְתָמִיד שָׁאַל הֵיכָן יִמְצָא זָהָב", "הָיָה צוֹרֵף זָהָב מֻומְחֶה וּמְפֻורְסָם"], "kasha": "השם \"מי זהב\" טעון ביאור — מה משמעותו?", "answer": "היה עשיר מאוד, והיה אומר \"מהו זהב\" — כלומר הזהב לא היה נחשב בעיניו לכלום.", "kp": ["עשיר היה ואין זהב חשוב בעיניו לכלום"]}]}, {"id": "36:40.1", "ch": 36, "v": 40, "n": 1, "dh": "ואלה שמות אלופי עשו", "pasuk_html": "<mark>וְ֠אֵלֶּה שְׁמ֞וֹת אַלּוּפֵ֤י עֵשָׂו֙</mark> לְמִשְׁפְּחֹתָ֔ם לִמְקֹמֹתָ֖ם בִּשְׁמֹתָ֑ם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עַֽלְוָ֖ה אַלּ֥וּף יְתֵֽת׃", "pasuk_en": "וְאֵלֶּה שְׁמוֹת אַלּוּפֵי עֵשָׂו לְמִשְׁפְּחֹתָם לִמְקֹמֹתָם בִּשְׁמֹתָם אַלּוּף תִּמְנָע אַלּוּף עַלְוָה אַלּוּף יְתֵת׃", "rashi_he": "ואלה שמות אלופי עשו. שֶׁנִּקְרְאוּ עַל שֵׁם מְדִינוֹתֵיהֶם לְאַחַר שֶׁמֵּת הֲדַר וּפָסְקָה מֵהֶם מַלְכוּת, וְהָרִאשׁוֹנִים הַנִּזְכָּרִים לְמַעְלָה הֵם שְׁמוֹת תּוֹלְדוֹתָם; וְכֵן מְפֹרָשׁ בְּדִבְרֵי הַיָּמִים וַיָּמָת הֲדָד וַיִּהְיוּ אַלּוּפֵי אֱדוֹם אַלּוּף תִּמְנָע וְגוֹמֵר:", "rashi_en": "רש״י מסביר שאלופים אלו נקראו על שם מדינותיהם לאחר שמת הדר ופסקה המלכות מאדום, בניגוד לאלופים הראשונים שהוזכרו קודם (פסוק טו) שנקראו על שם משפחותיהם.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מָה הַהֶבְדֵּל בֵּין הָאַלּוּפִים כָּאן לָאַלּוּפִים שֶׁהוּזְכְּרוּ קֹודֶם?", "options": ["אֵלּוּ נִקְרְאוּ עַל שֵׁם מְדִינוֹתֵיהֶם, וְהָרִאשׁוֹנִים עַל שֵׁם תּוֹלְדוֹתָם", "אֵלּוּ הָיוּ חֲזָקִים יוֹתֵר, וְהָרִאשׁוֹנִים הָיוּ חַלָּשִׁים", "אֵלּוּ מָלְכוּ אַחֲרֵי בִּלְעָם, וְהָרִאשׁוֹנִים מָלְכוּ לְפָנָיו"], "kasha": "מדוע חוזר הכתוב ומונה אלופים נוספים, הרי כבר נמנו אלופי עשו לעיל?", "answer": "האלופים הראשונים נקראו על שם תולדותיהם (משפחותיהם), ואילו אלו נקראו על שם מדינותיהם לאחר שמת הדר ופסקה המלכות.", "kp": ["שנקראו על שם מדינותיהם", "לאחר שמת הדר ופסקה מהם מלכות"]}]}, {"id": "36:43.1", "ch": 36, "v": 43, "n": 1, "dh": "מגדיאל", "pasuk_html": "אַלּ֥וּף <mark>מַגְדִּיאֵ֖ל</mark> אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה ׀ אַלּוּפֵ֣י אֱד֗וֹם לְמֹֽשְׁבֹתָם֙ בְּאֶ֣רֶץ אֲחֻזָּתָ֔ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׃ (פ)", "pasuk_en": "אַלּוּף מַגְדִּיאֵל אַלּוּף עִירָם אֵלֶּה אַלּוּפֵי אֱדוֹם לְמֹשְׁבֹתָם בְּאֶרֶץ אֲחֻזָּתָם הוּא עֵשָׂו אֲבִי אֱדוֹם׃", "rashi_he": "מגדיאל. הִיא רוֹמִי:", "rashi_en": "רש״י מזהה את מגדיאל עם רומי.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מַהִי מַגְדִּיאֵל?", "options": ["הִיא רוֹמִי", "הִיא בָּבֶל", "הִיא יְרוּשָׁלַיִם"], "kasha": "מיהו \"מגדיאל\" הנזכר באלופי אדום?", "answer": "מגדיאל היא רומי.", "kp": ["היא רומי"]}]}];
const EN = {"32:4.1":{"e":"Rashi clarifies that the messengers Jacob sent to Esau were not human messengers but actual angels — that is, heavenly angels.","pe":"Yaakov sent messengers before him to Eisov, his brother, to the Land of Seir, to the field of Edom.","re":"Yaakov sent messengers. Actual angels.","p":[{"q":"According to Rashi, who were the messengers that Jacob sent to Esau?","o":["Actual angels — that is, heavenly angels","Human messengers chosen from the members of his household","Members of Jacob's family"]}]},"32:4.2":{"e":"Rashi explains that the word \"אַרְצָה\" means \"to the land.\" This is a linguistic rule: any word that would need a לָ at the beginning instead receives a הֵ״א at the end.","pe":"Yaakov sent messengers before him to Eisov, his brother, to the Land of Seir, to the field of Edom.","re":"To the Land of Seir. [אַרְצָה שֵׂעִיר] is the same as לְאֶרֶץ שֵׂעִיר. Any word that requires the prefix ל', Scripture [instead] places a ה' at the end of it.","p":[{"q":"How does Rashi explain the form \"אַרְצָה\" instead of \"לָאָרֶץ\"?","o":["A word that needs a לָ at the beginning receives a הֵ״א at the end","A הֵ״א at the end of a word indicates a specific direction","This is a special construct form used for place names"]}]},"32:5.1":{"e":"Rashi gives two explanations. The first: Jacob is telling Esau that he did not become a prince or important person but remained a stranger, so that Esau would not hate him for Isaac's blessing not having come true. The second: \"גַּרְתִּי\" equals 613 in gematria, hinting that Jacob kept all 613 commandments and did not learn from Laban's wicked deeds.","pe":"He commanded them saying, This is what you should say to my master, Eisov. Your servant, Yaakov says, I lived as a stranger with Lavan, and was delayed until now.","re":"I lived as a stranger. I have not become an officer or anyone of importance, but merely a transient guest. It is not worthy of you to hate me on account of your father’s blessings. He blessed me “Be master over your brother,” for it has not been fulfilled in me. Another explanation: The gimatria [numerical value] of גַרְתִּי is 613 [תרי\"ג]; as if to say, “I have resided with the wicked Lavan and yet have kept תַּרְיַ\"ג [613] commandments and have not learned from his wicked deeds.”","p":[{"q":"According to Rashi's first explanation, why did Jacob say \"גַּרְתִּי\" to Esau?","o":["To say that the blessing \"הֱוֵה גְּבִיר לְאַחֶיךָ\" had not been fulfilled in him","To tell him that he had lived under difficult conditions with Laban","To show that he was wealthy and successful despite the exile"]},{"q":"What is the gematria hint in \"גַּרְתִּי\" according to the second explanation?","o":["\"גַּרְתִּי\" equals 613 — he kept all 613 commandments and did not learn from Laban's deeds","\"גַּרְתִּי\" equals 613 — the number of years of exile with Laban","\"גַּרְתִּי\" equals 613 — the number of members of Jacob's household"]}]},"32:6.1":{"e":"Rashi explains that Jacob is hinting to Esau that his wealth — ox and donkey — does not come from Isaac's blessing, which had promised the dew of heaven and the fat of the earth, since animals do not come from heaven or from the earth.","pe":"I acquired oxen, donkeys, sheep, servants and maidservants. I have sent [these messengers] to tell my master, to find favor in your eyes.","re":"I acquired oxen, donkeys. Father told me, “[May God give you] of the dew of heaven and of the fatness of the land,” these [cattle and servants] are neither from the heavens nor from the earth.","p":[{"q":"Why does Jacob emphasize that he has \"שׁוֹר וַחֲמוֹר\" according to Rashi?","o":["To hint that his wealth does not come from his father's blessing, which had promised the dew of heaven and the fat of the earth","To show Esau that he is wealthy and has no need for more property","To offer Esau gifts and appease him"]}]},"32:6.2":{"e":"Rashi explains that it is the normal way of speaking to refer to many things in the singular — just as one says \"the rooster crowed\" rather than \"the roosters crowed.\" Therefore the verse says \"שׁוֹר וַחֲמוֹר\" in the singular even though many are meant.","pe":"I acquired oxen, donkeys, sheep, servants and maidservants. I have sent [these messengers] to tell my master, to find favor in your eyes.","re":"Oxen, donkeys It is customary to refer to many oxen as ox, A person might say to another, “The rooster crowed during the night” and does not say, “The roosters crowed.”","p":[{"q":"Why is \"שׁוֹר וַחֲמוֹר\" written in the singular, according to Rashi?","o":["It is the normal way of speaking to refer to many things in the singular","Jacob had only one ox and one donkey","Jacob minimized his words so as not to stir up envy"]}]},"32:6.3":{"e":"Rashi explains that the purpose of the message was to inform Esau that Jacob was coming to him.","pe":"I acquired oxen, donkeys, sheep, servants and maidservants. I have sent [these messengers] to tell my master, to find favor in your eyes.","re":"I have sent to tell my master. To announce that I am coming to you.","p":[{"q":"What is the purpose of \"telling my lord,\" according to Rashi?","o":["To inform Esau that Jacob was coming to him","To ask Esau's permission to enter the land","To warn Esau not to fight him"]}]},"32:6.4":{"e":"Rashi explains that \"לִמְצֹא חֵן בְּעֵינֶיךָ\" means that Jacob is at peace with Esau and is seeking his love.","pe":"I acquired oxen, donkeys, sheep, servants and maidservants. I have sent [these messengers] to tell my master, to find favor in your eyes.","re":"To find favor in your eyes. That I am at peace with you and seek your love.","p":[{"q":"What is the meaning of \"לִמְצֹא חֵן בְּעֵינֶיךָ\" according to Rashi?","o":["That Jacob is at peace with Esau and is seeking his love","That Jacob is asking Esau for gifts and property","That Jacob is pleading for Esau not to kill him"]}]},"32:7.1":{"e":"Rashi explains that the angels were hinting to Jacob: you call him \"my brother,\" but he is acting like the wicked Esau and still hates you.","pe":"The messengers returned to Yaakov saying, We came to your brother, to Eisov, and he is also coming to meet you; and there are four hundred men with him.","re":"We came to your brother, to Eisov. [The one] that you said, “He is my brother” but he, nevertheless, acts towards you as the wicked Eisov; he is still harboring his hatred.","p":[{"q":"What were the angels hinting with the double language \"אֶל אָחִיךָ אֶל עֵשָׂו\"?","o":["You call him your brother, but he is acting like the wicked Esau and still hates you","They are emphasizing that Esau is indeed his brother and wants peace","They are warning that Esau is no longer considered his brother at all"]}]},"32:8.1":{"e":"Rashi explains that there is a difference between וַיִּירָא and וַיֵּצֶר לוֹ: Jacob was afraid that he might be killed, and he was distressed that he might have to kill others.","pe":"Yaakov was very frightened, and distressed. He divided the people that were with him, along with the sheep, cattle and camels, into two camps.","re":"Frightened and distressed. וַיִּירָא [he feared] lest he be killed. וַיֵּצֶר לוֹ [he was distressed] that he might kill others.","p":[{"q":"According to Rashi, why does the verse use both וַיִּירָא and וַיֵּצֶר לוֹ?","o":["He was afraid of being killed, and distressed that he might kill others","He was afraid of Esau, and distressed about leaving Laban's land","He was afraid for his property, and distressed about his father's honor"]}]},"32:9.1":{"e":"Rashi explains that the word מַחֲנֶה can be used as either masculine or feminine, and he brings additional examples of such words: שֶׁמֶשׁ, רוּחַ, and אֵשׁ.","pe":"He said, If Eisov comes to one camp and attacks it, the remaining camp will survive.","re":"To one camp and attacks it.. מַחֲנֶה is grammatically used as male and female. “If a camp should encamp [תַּחֲנֶה] against me,” is the feminine form. “This [הַזֶּה] camp,” is the male form. There are also other words that can be either masculine or feminine. [An example שֶׁמֶשׁ:] “The sun rose [יָצָא] upon the earth.” [Also in the verse:] “From one end of the sky is its rising [מוֹצָאוֹ],” which are masculine [יָצָא and מוֹצָאוֹ being masculine], [whereas:] “The sun shone [זָרְחָה] upon the waters,” which is feminine. The same [holds true concerning the word] רוּחַ: “Behold a great wind is coming [בָּאָה].” [בָּאָה] being the feminine form, [whereas:] “And it [the wind] touched [וַיִּגַּע] the four corners of the house,” [וַיִּגַּע] is in the masculine form. “And a great [גְּדוֹלָה] and a strong [וְחָזָק] wind takes apart mountains.” Here it is both masculine [וְחָזָק] and feminine [גְּדוֹלָה]. Similarly אֵש [is both masculine and feminine]. “A fire came forth [יָצְאָה] from God,” [יָצְאָה] is in the feminine form, [whereas:] “A flaming [לוֹהֵט] fire,” [לוֹהֵט] is in the masculine form.","p":[{"q":"What does Rashi explain about the word מַחֲנֶה in the verse?","o":["It can be used as both masculine and feminine","It is always feminine because it refers to a group","It is always masculine because it refers to a place"]}]},"32:9.2":{"e":"Rashi explains that Jacob prepared himself for three things: a gift, prayer, and war, and each one is hinted at in the verses that follow.","pe":"He said, If Eisov comes to one camp and attacks it, the remaining camp will survive.","re":"The remaining camp will survive. Against his [Eisov’s] will because I will do battle with him. He [Yaakov] prepared himself for three things, for the giving of a gift, for prayer and for war: For the giving of a gift, [as it says:] “The present passed on ahead of him.” For prayer, [as it says:] “The God of my father Avraham.” For war, [as it says:] “The remaining camp will survive.”","p":[{"q":"According to Rashi, what three things did Jacob prepare himself for?","o":["A gift, prayer, and war","Fleeing, prayer, and making peace","Fasting, prayer, and charity"]}]},"32:10.1":{"e":"Rashi explains that Jacob mentioned God's name twice because he came before God with two promises: one made when he left Be'er Sheva, and one made at Laban's house.","pe":"Yaakov said, God of my father Avraham, and God of my father Yitzchok, Adonoy Who said to me, Return to your land, to your birthplace, and I will do good with you.","re":"And God of my father Yitzchok. Whereas elsewhere he says “the Fear of Yitzchok.” And, furthermore, why does he go on to repeat the Tetragrammaton [ה' הָאוֹמֵר אֵלַי]? It should have been written, “Who said to me ‘return.’” But, this is what Yaakov was saying to God: “You made two promises to me—one, when I left my father’s house from Beer Sheva when You said to me, ‘I am Adonoy, God of Avraham, your father, and God of Yitzchok,’ and, there You said to me, ‘I will guard you wherever you go,’ and, in Lavan’s house You said to me, ‘Return to the Land of your fathers, and to your birthplace, and I will be with you.’ And there You revealed Yourself to me only with the Proper Name [Tetragrammaton] as it is said, ‘And Adonoy said to Yaakov, “Return to the land of your fathers,’” etc. [It is based] upon these two promises [that] I came before You.”","p":[{"q":"According to Rashi, why did Jacob mention God's name again in his prayer?","o":["Because he came before God with the two promises God had made to him","Because he wanted to emphasize God's greatness in his prayer","Because he followed the custom of his forefathers who mentioned God's name twice"]}]},"32:11.1":{"e":"Rashi explains that Jacob was not saying he was small or lowly, but rather that his merits had been diminished by all the kindnesses he had already received from God. He therefore feared that he may have sinned in the meantime and would be punished.","pe":"I am unworthy because of all the kindness and of all the faithfulness that you have done with Your servant; for I crossed over this Jordan [only] with my staff, and now I have become two camps.","re":"I am unworthy because of all the kindness. [Meaning:] “My merits have diminished because of the kindnesses and truth that You have done with me. I am afraid for the following reason: Lest from the time you made me the promises I have become tainted by sin which will cause me to be delivered into Eisov’s hand.”","p":[{"q":"According to Rashi, why did Jacob say קָטֹנְתִּי מִכֹּל הַחֲסָדִים?","o":["His merits had been diminished by the kindnesses he had received","He felt small and lowly in the face of such great kindnesses","He was worried he was not worthy to ask for more kindnesses"]}]},"32:11.2":{"e":"Rashi explains that אֱמֶת here means the truth of God's word — that is, that God kept all the promises He had made to Jacob.","pe":"I am unworthy because of all the kindness and of all the faithfulness that you have done with Your servant; for I crossed over this Jordan [only] with my staff, and now I have become two camps.","re":"And of all the faithfulness. [Meaning:] “Making Your words come true—[i.e.,] that You have kept all the promises that You have promised me.”","p":[{"q":"According to Rashi, what is the הָאֱמֶת that Jacob mentions?","o":["That God kept all the promises He had made to him","That Jacob always acted truthfully and never lied","That God judged him with the standard of truth and strict justice"]}]},"32:11.3":{"e":"Rashi gives two interpretations: according to the plain meaning, Jacob crossed the Jordan with nothing — no silver, gold, or flocks — only his staff. According to the Midrash, Jacob placed his staff in the Jordan and the Jordan split.","pe":"I am unworthy because of all the kindness and of all the faithfulness that you have done with Your servant; for I crossed over this Jordan [only] with my staff, and now I have become two camps.","re":"For with my staff. “I had with me neither silver nor gold nor cattle—only my staff itself.” The Midrashic explanation is: He placed his staff into the Jordan [River] and the Jordan split [so that he could cross].","p":[{"q":"According to the plain meaning in Rashi, what did Jacob mean when he said כִּי בְמַקְלִי עָבַרְתִּי?","o":["That he had nothing with him except his staff alone","That the staff served him as a weapon for protection on the way","That he leaned on his staff because he was tired from the journey"]},{"q":"What is the Midrashic interpretation that Rashi brings for בְּמַקְלִי עָבַרְתִּי אֶת הַיַּרְדֵּן?","o":["Jacob placed his staff in the Jordan and the Jordan split","The staff symbolized the promise that God had given him","Jacob used his staff to measure the depth of the Jordan"]}]},"32:12.1":{"e":"Rashi explains why Jacob doubled his language and said both אָחִי and עֵשָׂו: because Esau does not act toward him like a brother, but like the wicked Esau.","pe":"Rescue me, I pray, from the hand of my brother, from the hand of Eisov, for I fear him, that he will come and attack me—mother and children alike.","re":"From the hand of my brother, from the hand of Eisov. [Meaning:] “From the hand of my brother who does not act towards me as a brother but as the wicked Eisov.”","p":[{"q":"According to Rashi, why did Jacob repeat himself and say מִיַּד אָחִי מִיַּד עֵשָׂו?","o":["Because Esau does not act toward him like a brother but like a wicked man","To emphasize that Esau is dangerous both as a brother and as an enemy","To remind God that Esau is his brother and deserves mercy"]}]},"32:13.1":{"e":"Rashi explains that the doubling \"הֵיטֵב אֵיטִיב\" hints at two sources of merit: \"הֵיטֵב\" — in the merit of Jacob himself, and \"אֵיטִיב\" — in the merit of his forefathers.","pe":"You have said, I will do very good with you, and I will make your offspring like the sands of the sea, which are too numerous to count.","re":"I will do very good. [I.e.,] doing good on account of your own merits, and I will do good on account of your fathers’ merits.","p":[{"q":"According to Rashi, why is \"הֵיטֵב אֵיטִיב\" said in double language?","o":["\"הֵיטֵב\" in the merit of Jacob himself, \"אֵיטִיב\" in the merit of his forefathers","\"הֵיטֵב\" in this world, \"אֵיטִיב\" in the World to Come","\"הֵיטֵב\" for Jacob, \"אֵיטִיב\" for his descendants after him"]}]},"32:13.2":{"e":"Rashi raises a difficulty: God did not promise Jacob directly that his descendants would be \"כְּחוֹל הַיָּם\", but rather \"כְּעַפַר הָאָרֶץ\". He answers that God promised Jacob to fulfill everything He had spoken, and since He had promised Abraham \"כְּכוֹכְבֵי הַשָּׁמַיִם וּכְחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם\", that promise was included as well.","pe":"You have said, I will do very good with you, and I will make your offspring like the sands of the sea, which are too numerous to count.","re":"And I will make your offspring like the sands of the sea. But, where did He tell him this? Did He not say to him only: “Your descendants shall be as the dust of the earth”? But, [the answer is] that He did say to him, “I will not forsake you until I have done that which I have spoken for you.” And to Avraham He had said, “I will make your descendants as numerous as the stars of the sky and like the sand on the sea shore.”","p":[{"q":"According to Rashi, how could God say to Jacob \"כְּחוֹל הַיָּם\" if He only promised him \"כְּעַפַר הָאָרֶץ\"?","o":["God promised Jacob to fulfill what He said to Abraham, which included \"כְּחוֹל הַיָּם\"","Jacob received an additional promise in a dream that is not written explicitly in the Torah","\"כַּעֲפַר הָאָרֶץ\" and \"כְחוֹל הַיָּם\" are the same thing expressed in different words"]}]},"32:14.1":{"e":"Rashi gives two explanations of \"הַבָּא בְיָדוֹ\": according to the plain meaning — what is in his possession. According to the Midrash — precious stones and pearls that a person carries in his hand. There is also an additional explanation: he took from the non-tithed portion after separating the tithe.","pe":"He spent that night there. He took from that which comes into his hand, [for] a present to his brother, Eisov.","re":"Which comes into his hand. [Meaning: what was] in his posse
