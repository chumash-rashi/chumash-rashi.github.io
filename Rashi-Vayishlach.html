 [{"q": "לְפִי הַמִּדְרָשׁ שֶׁמֵּבִיא רַשׁ״י, מָתַי הִפְסִיקוּ הַמַּלְאָכִים לִתְקֹוף אֶת עֵשָׂו?", "options": ["כְּשֶׁשָּׁמְעוּ שֶׁהוּא אָחִיו שֶׁל יַעֲקֹב", "כְּשֶׁשָּׁמְעוּ שֶׁהוּא בְּנוֹ שֶׁל יִצְחָק", "כְּשֶׁשָּׁמְעוּ שֶׁהוּא נִכְדּוֹ שֶׁל אַבְרָהָם"], "kasha": "מהו המחנה שפגש עשו, ומדוע שאל עליו?", "answer": "לפי המדרש, מלאכים דחפו את עשו ואנשיו ולא הרפו כששמעו שהוא בן יצחק או נכד אברהם, אלא רק כשאמרו שהוא אחי יעקב אמרו להם משלנו אתם.", "kp": ["כתות של מלאכים פגע", "אחיו של יעקב הוא", "אם כן משלנו אתם"]}]}, {"id": "33:9.1", "ch": 33, "v": 9, "n": 1, "dh": "יהי לך אשר לך", "pasuk_html": "וַיֹּ֥אמֶר עֵשָׂ֖ו יֶשׁ־לִ֣י רָ֑ב אָחִ֕י <mark>יְהִ֥י לְךָ֖ אֲשֶׁר־לָֽךְ׃</mark>", "pasuk_en": "וַיֹּאמֶר עֵשָׂו יֶשׁ־לִי רָב אָחִי יְהִי לְךָ אֲשֶׁר־לָךְ׃", "rashi_he": "יהי לך אשר לך. כָּאן הוֹדָה לוֹ עַל הַבְּרָכוֹת (בראשית רבה):", "rashi_en": "כשעשו אמר ליעקב יהי לך אשר לך, הוא למעשה הודה לו על הברכות שלקח ממנו, וויתר עליהן.", "note": "", "points": [{"q": "מַה הַמַּשְׁמָעוּת שֶׁל דִּבְרֵי עֵשָׂו 'יְהִי לְךָ אֲשֶׁר לְךָ', לְפִי רַשִׁ״י?", "options": ["עֵשָׂו הוֹדָה לְיַעֲקֹב עַל הַבְּרָכוֹת שֶׁקִּיבֵּל", "עֵשָׂו סֵירֵב לְקַבֵּל אֶת הַמִּנְחָה מִיַּעֲקֹב", "עֵשָׂו בִּיקֵּשׁ מִיַּעֲקֹב לִשְׁמוֹר אֶת רְכוּשׁוֹ"], "kasha": "מדוע מדגישה התורה את לשון עשו יהי לך אשר לך, ומה כוונתו?", "answer": "בדברים אלו הודה עשו ליעקב על הברכות שקיבל מיצחק.", "kp": ["כאן הודה לו על הברכות"]}]}, {"id": "33:10.1", "ch": 33, "v": 10, "n": 1, "dh": "אל נא", "pasuk_html": "וַיֹּ֣אמֶר יַעֲקֹ֗ב <mark>אַל־נָא֙</mark> אִם־נָ֨א מָצָ֤אתִי חֵן֙ בְּעֵינֶ֔יךָ וְלָקַחְתָּ֥ מִנְחָתִ֖י מִיָּדִ֑י כִּ֣י עַל־כֵּ֞ן רָאִ֣יתִי פָנֶ֗יךָ כִּרְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַתִּרְצֵֽנִי׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אַל־נָא אִם־נָא מָצָאתִי חֵן בְּעֵינֶיךָ וְלָקַחְתָּ מִנְחָתִי מִיָּדִי כִּי עַל־כֵּן רָאִיתִי פָנֶיךָ כִּרְאֹת פְּנֵי אֱלֹהִים וַתִּרְצֵנִי׃", "rashi_he": "אל נא. אַל נָא תֹאמַר לִי כֵּן:", "rashi_en": "רש״י מפרש שכוונת יעקב באמרו אל נא היא: אל נא תאמר לי כן, כלומר אל תסרב למנחתי.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילִּים 'אַל נָא' שֶׁאָמַר יַעֲקֹב?", "options": ["אַל נָא תֹּאמַר לִי כֵּן, כְּלוֹמַר אַל תְּסָרֵב", "אַל נָא תִּכְעַס עָלַי עַל הַבְּרָכוֹת", "אַל נָא תֵּלֵךְ מִכָּאן לְפָנַי"], "kasha": "המילים אל נא סתומות — למה בדיוק מתנגד יעקב?", "answer": "רש״י מפרש שיעקב ביקש מעשו: אל נא תאמר לי כן, כלומר אל תסרב לקבל את מנחתי.", "kp": ["אל נא תאמר לי כן"]}]}, {"id": "33:10.2", "ch": 33, "v": 10, "n": 2, "dh": "אם נא מצאתי חן בעיניך ולקחת מנחתי מידי כי על כן ראיתי פניך וגו'", "pasuk_html": "וַיֹּ֣אמֶר יַעֲקֹ֗ב אַל־נָא֙ <mark>אִם־נָ֨א מָצָ֤אתִי חֵן֙ בְּעֵינֶ֔יךָ וְלָקַחְתָּ֥ מִנְחָתִ֖י מִיָּדִ֑י כִּ֣י עַל־כֵּ֞ן רָאִ֣יתִי פָנֶ֗יךָ</mark> כִּרְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַתִּרְצֵֽנִי׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אַל־נָא אִם־נָא מָצָאתִי חֵן בְּעֵינֶיךָ וְלָקַחְתָּ מִנְחָתִי מִיָּדִי כִּי עַל־כֵּן רָאִיתִי פָנֶיךָ כִּרְאֹת פְּנֵי אֱלֹהִים וַתִּרְצֵנִי׃", "rashi_he": "אם נא מצאתי חן בעיניך ולקחת מנחתי מידי כי על כן ראיתי פניך וגו'. כִּי כְּדַאי וְהָגוּן לְךָ שֶׁתְּקַבֵּל מִנְחָתִי עַל אֲשֶׁר רָאִיתִי פָנֶיךָ, וְהֵן חֲשׁוּבִין לִי כִּרְאִיַּת פְּנֵי הַמַּלְאָךְ, שֶׁרָאִיתִי שַׂר שֶׁלְּךָ, וְעוֹד עַל שֶׁנִּתְרַצֵּיתָ לִמְחֹל עַל סֻרְחָנִי. וְלָמָּה הִזְכִּיר לוֹ רְאִיַּת הַמַּלְאָךְ? כְּדֵי שֶׁיִּתְיָרֵא הֵימֶנּוּ וְיֹאמַר רָאָה מַלְאָכִים וְנִצַּל, אֵינִי יָכוֹל לוֹ מֵעַתָּה:", "rashi_en": "רש״י מסביר שיעקב אמר לעשו שראוי שיקבל את מנחתו, כי ראיית פניו חשובה לו כראיית פני מלאך — שהרי ראה את שרו של עשו. בנוסף, עשו נתרצה למחול לו. ורש״י מוסיף שיעקב הזכיר את המלאך כדי שעשו יירא ממנו ויאמר: ראה מלאכים וניצל, איני יכול לו.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ הִשְׁוָוה יַעֲקֹב אֶת רְאִייַּת פְּנֵי עֵשָׂו לִרְאִיַּית פְּנֵי אֱלֹהִים?", "options": ["כִּי רָאָה אֶת שָׂרוֹ שֶׁל עֵשָׂו, וּרְאִיַּית פָּנָיו חֲשׁוּבָה לוֹ כִּרְאִיַּית פְּנֵי מַלְאָךְ", "כִּי עֵשָׂו נִרְאָה לוֹ בְּאוֹתוֹ רֶגַע כְּמַלְאַךְ רַחֲמִים שֶׁנִּשְׁלַח מִן הַשָּׁמַיִם", "כִּי רָצָה לְהַחֲנִיף לְעֵשָׂו וּלְכַבְּדוֹ כְּדֵי שֶׁיְּקַבֵּל אֶת הַמִּנְחָה"], "kasha": "מה כוונת יעקב באמרו \"כראת פני אלהים\" — וכי עשו דומה למלאך?", "answer": "יעקב ראה את שרו של עשו (המלאך שנאבק עמו), ולכן ראיית פני עשו חשובה בעיניו כראיית פני מלאך.", "kp": ["שראיתי שר שלך", "והן חשובין לי כראית פני המלאך"]}, {"q": "לְפִי רַשִׁ״י, מַדּוּעַ הִזְכִּיר יַעֲקֹב לְעֵשָׂו שֶׁרָאָה מַלְאָךְ?", "options": ["כְּדֵי שֶׁעֵשָׂו יִירָא מִמֶּנּוּ וְיֹאמַר: רָאָה מַלְאָכִים וְנִיצַּל, אֵינִי יָכוֹל לוֹ", "כְּדֵי לְהַרְאוֹת לְעֵשָׂו שֶׁהוּא רָאוּי לַבְּרָכוֹת שֶׁקִּיבֵּל מֵאֲבִיהֶם", "כְּדֵי לְשַׁכְנֵעַ אֶת עֵשָׂו שֶׁהַקָּבָּ״ה שׁוֹלֵחַ לוֹ שָׁלוֹם וְאַהֲבָה"], "kasha": "לשם מה היה צריך יעקב להזכיר את ראיית המלאך בפני עשו?", "answer": "יעקב רצה שעשו יפחד ממנו, שיאמר: הוא ראה מלאכים וניצל מהם, ודאי איני יכול לו.", "kp": ["כדי שיתירא הימנו", "ראה מלאכים ונצל איני יכול לו מעתה"]}]}, {"id": "33:10.3", "ch": 33, "v": 10, "n": 3, "dh": "ותרצני", "pasuk_html": "וַיֹּ֣אמֶר יַעֲקֹ֗ב אַל־נָא֙ אִם־נָ֨א מָצָ֤אתִי חֵן֙ בְּעֵינֶ֔יךָ וְלָקַחְתָּ֥ מִנְחָתִ֖י מִיָּדִ֑י כִּ֣י עַל־כֵּ֞ן רָאִ֣יתִי פָנֶ֗יךָ כִּרְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים <mark>וַתִּרְצֵֽנִי׃</mark>", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אַל־נָא אִם־נָא מָצָאתִי חֵן בְּעֵינֶיךָ וְלָקַחְתָּ מִנְחָתִי מִיָּדִי כִּי עַל־כֵּן רָאִיתִי פָנֶיךָ כִּרְאֹת פְּנֵי אֱלֹהִים וַתִּרְצֵנִי׃", "rashi_he": "ותרצני. נִתְפַּיַּסְתָּ לִי, וְכֵן כָּל רָצוֹן שֶׁבַּמִּקְרָא לְשׁוֹן פִּיּוּס, אפייצימנ\"טו בְּלַעַז, כִּי לֹא לְרָצוֹן יִהְיֶה לָכֶם (ויקרא כ\"ב) – הַקָּרְבָּנוֹת בָּאוֹת לְפַיֵּס וּלְרַצּוֹת, וְכֵן שִׂפְתֵי צַדִּיק יֵדְעוּן רָצוֹן (משלי י') – יוֹדְעִים לְפַיֵּס וּלְרַצּוֹת:", "rashi_en": "רש״י מסביר ש\"ותרצני\" פירושו נתפייסת לי. כל לשון רצון במקרא הוא לשון פיוס, כמו בהקרבת קרבנות שבאות לפייס ולרצות.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מַהוּ פֵּירוּשׁ הַמִּילָּה \"וַתִּרְצֵנִי\"?", "options": ["נִתְפַּייַּסְתְּ לִי — לְשׁוֹן פִּיּוּס וְרִיצּוּי", "רָצִיתָ בִּי — לְשׁוֹן רָצוֹן וְחִיבָּה", "קִיבַּלְתָּ אוֹתִי — לְשׁוֹן קַבָּלָה וְהַסְכָּמָה"], "kasha": "מהו הפירוש המדויק של \"ותרצני\" — האם הכוונה לרצון, לפיוס או למשהו אחר?", "answer": "\"ותרצני\" פירושו נתפייסת לי. כל לשון רצון במקרא הוא לשון פיוס וריצוי.", "kp": ["נתפיסת לי", "כל רצון שבמקרא לשון פיוס"]}]}, {"id": "33:11.1", "ch": 33, "v": 11, "n": 1, "dh": "ברכתי", "pasuk_html": "קַח־נָ֤א אֶת־<mark>בִּרְכָתִי֙</mark> אֲשֶׁ֣ר הֻבָ֣את לָ֔ךְ כִּֽי־חַנַּ֥נִי אֱלֹהִ֖ים וְכִ֣י יֶשׁ־לִי־כֹ֑ל וַיִּפְצַר־בּ֖וֹ וַיִּקָּֽח׃", "pasuk_en": "קַח־נָא אֶת־בִּרְכָתִי אֲשֶׁר הֻבָאת לָךְ כִּי־חַנַּנִי אֱלֹהִים וְכִי יֶשׁ־לִי־כֹל וַיִּפְצַר־בּוֹ וַיִּקָּח׃", "rashi_he": "ברכתי. מִנְחָתִי, מִנְחָה זוֹ הַבָּאָה עַל רְאִיַּת פָּנִים וְלִפְרָקִים אֵינָה בָאָה אֶלָּא לִשְׁאֵלַת שָׁלוֹם, וְכָל בְּרָכָה שֶׁהִיא לִרְאִיַּת פָּנִים – כְּגוֹן וַיְבָרֶךְ יַעֲקֹב אֶת פַּרְעֹה (בראשית מ״ז:ז׳), עֲשׂוּ אִתִּי בְרָכָה דְּסַנְחֵרִיב (מלכים ב י\"ח), וְכֵן לִשְׁאָל לוֹ לְשָׁלוֹם וּלְבָרְכוֹ דְּתֹעִי מֶלֶךְ חֲמָת (שמואל ב ח') – כֻּלָּם לְשׁוֹן בִּרְכַּת שָׁלוֹם הֵן, שֶׁקּוֹרִין בְּלַעַז שלו\"איר, אַף זוֹ בִּרְכָתִי מו\"ן שלו\"ד:", "rashi_en": "רש״י מסביר ש\"ברכתי\" פירושו מנחתי. מנחה הבאה בשעת ראיית פנים אינה אלא שאלת שלום, וכך כל \"ברכה\" שבמקרא הקשורה לראיית פנים היא ברכת שלום — כמו \"ויברך יעקב את פרעה\" וכדומה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ קָרָא יַעֲקֹב לְמִנְחָתוֹ \"בִּרְכָתִי\"?", "options": ["כִּי מִנְחָה הַבָּאָה בִּרְאִייַּת פָּנִים הִיא בִּרְכַּת שָׁלוֹם", "כִּי הַמִּנְחָה כָּלְלָה בְּרָכָה מְפֹורֶשֶׁת שֶׁיַּעֲקֹב אָמַר לְעֵשָׂו", "כִּי יַעֲקֹב בִּיקֵּשׁ שֶׁהַמִּנְחָה תָּבִיא בְּרָכָה וְהַצְלָחָה לְעֵשָׂו"], "kasha": "מדוע השתמש יעקב בלשון \"ברכתי\" ולא אמר \"מנחתי\"?", "answer": "מנחה הבאה בשעת ראיית פנים אינה אלא שאלת שלום, ולכן נקראת ברכה — ברכת שלום.", "kp": ["מנחה זו הבאה על ראית פנים", "אינה באה אלא לשאלת שלום", "כלם לשון ברכת שלום הן"]}]}, {"id": "33:11.2", "ch": 33, "v": 11, "n": 2, "dh": "אשר הבאת לך", "pasuk_html": "קַח־נָ֤א אֶת־בִּרְכָתִי֙ <mark>אֲשֶׁ֣ר הֻבָ֣את לָ֔ךְ</mark> כִּֽי־חַנַּ֥נִי אֱלֹהִ֖ים וְכִ֣י יֶשׁ־לִי־כֹ֑ל וַיִּפְצַר־בּ֖וֹ וַיִּקָּֽח׃", "pasuk_en": "קַח־נָא אֶת־בִּרְכָתִי אֲשֶׁר הֻבָאת לָךְ כִּי־חַנַּנִי אֱלֹהִים וְכִי יֶשׁ־לִי־כֹל וַיִּפְצַר־בּוֹ וַיִּקָּח׃", "rashi_he": "אשר הבאת לך. לֹא טָרַחְתָּ בָּהּ וַאֲנִי יָגַעְתִּי לְהַגִּיעָהּ עַד שֶׁבָּאָה לְיָדְךָ (בראשית רבה):", "rashi_en": "רש״י מסביר שיעקב אמר לעשו: אתה לא טרחת בה, ואני יגעתי להביאה עד שהגיעה לידך — כלומר, קבל אותה כי אני השקעתי מאמץ להגישה לך.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מָה רָצָה יַעֲקֹב לְהַדְגִּישׁ בְּאָמְרוֹ \"אֲשֶׁר הֻבָאת לָךְ\"?", "options": ["שְׁעֵשָׂו לֹא טָרַח בָּהּ, וְאִילּוּ יַעֲקֹב יָגַע לְהָבִיאָהּ עַד אֵלָיו", "שֶׁהַמִּנְחָה הוּבְאָה בִּידֵי שְׁלִיחִים מְיֻוחָדִים שֶׁיַּעֲקֹב שָׁלַח מֵרֹאשׁ", "שֶׁהַמִּנְחָה נִיתְּנָה לְעֵשָׂו כְּמַתָּנָה מֵאֵת הַקָּבָּ״ה וְלֹא מִיַּעֲקֹב"], "kasha": "מה משמעות הביטוי \"אשר הבאת לך\" — הרי עשו לא הביא דבר?", "answer": "יעקב הדגיש שעשו לא טרח במנחה כלל, ואילו הוא עצמו יגע להביאה עד שהגיעה לידו.", "kp": ["לא טרחת בה ואני יגעתי להגיעה עד שבאה לידך"]}]}, {"id": "33:11.3", "ch": 33, "v": 11, "n": 3, "dh": "חנני", "pasuk_html": "קַח־נָ֤א אֶת־בִּרְכָתִי֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔ךְ כִּֽי־<mark>חַנַּ֥נִי</mark> אֱלֹהִ֖ים וְכִ֣י יֶשׁ־לִי־כֹ֑ל וַיִּפְצַר־בּ֖וֹ וַיִּקָּֽח׃", "pasuk_en": "קַח־נָא אֶת־בִּרְכָתִי אֲשֶׁר הֻבָאת לָךְ כִּי־חַנַּנִי אֱלֹהִים וְכִי יֶשׁ־לִי־כֹל וַיִּפְצַר־בּוֹ וַיִּקָּח׃", "rashi_he": "חנני. נוּ\"ן רִאשׁוֹנָה מֻדְגֶּשֶׁת, לְפִי שֶׁהִיא מְשַׁמֶּשֶׁת בִּמְקוֹם שְׁתֵּי נוּנִי\"ן, שֶׁהָיָה לוֹ לוֹמַר חֲנָנַנִי, שֶׁאֵין חָנֹן בְּלֹא שְׁתֵּי נוּנִי\"ן, וְהַשְּׁלִישִׁית לְשִׁמּוּשׁ, כְּמוֹ עָשַׂנִי, זְבָדַנִי:", "rashi_en": "רש״י מסביר שהנו״ן הראשונה במילה 'חנני' דגושה כי היא משמשת במקום שתי נוני״ן. השורש הוא חנן (עם שתי נוני״ן), והנו״ן השלישית היא נו״ן השימוש כמו 'עשני' ו'זבדני'.", "note": "", "points": [{"q": "מַדּוּעַ הַנּוּ״ן הָרִאשׁוֹנָה בַּמִּילָּה 'חָנֵּנִי' דְּגוּשָׁה, לְפִי רַשׁ״י?", "options": ["כִּי הִיא מְשַׁמֶּשֶׁת בִּמְקוֹם שְׁתֵּי נוּנִי״ן שֶׁל הַשֹּׁורֶשׁ חָנַן", "כִּי הַדָּגֵשׁ בָּא לְהַדְגִּישׁ אֶת פְּעֻולַּת הַחֲנִינָה", "כִּי כָּל נוּ״ן בְּרֹאשׁ מִילָּה מְקַבֶּלֶת דָּגֵשׁ"], "kasha": "המילה 'חנני' חסרה נו״ן אחת ביחס לשורש חנן עם נו״ן השימוש, שהיו צריכות להיות שלוש נוני״ן.", "answer": "השורש חנן כולל שתי נוני״ן, ונו״ן שלישית נוספת לשימוש (כמו עשני, זבדני). הנו״ן הראשונה דגושה כי היא ממלאת מקום של שתי נוני״ן.", "kp": ["משמשת במקום שתי נוני\"ן", "שאין חנן בלא שתי נוני\"ן", "והשלישית לשמוש"]}]}, {"id": "33:11.4", "ch": 33, "v": 11, "n": 4, "dh": "יש לי כל", "pasuk_html": "קַח־נָ֤א אֶת־בִּרְכָתִי֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔ךְ כִּֽי־חַנַּ֥נִי אֱלֹהִ֖ים וְכִ֣י <mark>יֶשׁ־לִי־כֹ֑ל</mark> וַיִּפְצַר־בּ֖וֹ וַיִּקָּֽח׃", "pasuk_en": "קַח־נָא אֶת־בִּרְכָתִי אֲשֶׁר הֻבָאת לָךְ כִּי־חַנַּנִי אֱלֹהִים וְכִי יֶשׁ־לִי־כֹל וַיִּפְצַר־בּוֹ וַיִּקָּח׃", "rashi_he": "יש לי כל. כָּל סִפּוּקִי; וְעֵשָׂו דִּבֵּר בִּלְשׁוֹן גַּאֲוָה יֶשׁ לִי רָב, יוֹתֵר וְיוֹתֵר מִכְּדֵי צָרְכִּי:", "rashi_en": "רש״י מסביר שיעקב אמר 'יש לי כל' — כל מה שאני צריך. לעומתו, עשו דיבר בגאווה ואמר 'יש לי רב' — הרבה יותר ממה שצריך.", "note": "", "points": [{"q": "מַה הַהֶבְדֵּל בֵּין לְשׁוֹן יַעֲקֹב 'יֵשׁ לִי כֹל' לִלְשׁוֹן עֵשָׂו 'יֵשׁ לִי רָב', לְפִי רַשִׁ״י?", "options": ["יַעֲקֹב אָמַר שֶׁיֵּשׁ לוֹ כָּל צְרָכָיו, וְעֵשָׂו הִתְגָּאָה שֶׁיֵּשׁ לוֹ יוֹתֵר מִצְרָכָיו", "יַעֲקֹב אָמַר שֶׁיֵּשׁ לוֹ הַכּוֹל מַמָּשׁ, וְעֵשָׂו הוֹדָה שֶׁחָסֵר לוֹ", "שְׁנֵיהֶם אָמְרוּ אוֹתוֹ דָּבָר אַךְ בְּמִילִּים שׁוֹנוֹת"], "kasha": "מדוע יעקב בחר לומר 'יש לי כל' ולא 'יש לי רב' כמו שאמר עשו?", "answer": "'יש לי כל' פירושו כל מה שאני צריך. עשו לעומתו אמר 'יש לי רב' בלשון גאווה — יותר ויותר מכדי צרכיו.", "kp": ["כל ספוקי", "ועשו דבר בלשון גאוה", "יותר ויותר מכדי צרכי"]}]}, {"id": "33:12.1", "ch": 33, "v": 12, "n": 1, "dh": "נסעה", "pasuk_html": "וַיֹּ֖אמֶר <mark>נִסְעָ֣ה</mark> וְנֵלֵ֑כָה וְאֵלְכָ֖ה לְנֶגְדֶּֽךָ׃", "pasuk_en": "וַיֹּאמֶר נִסְעָה וְנֵלֵכָה וְאֵלְכָה לְנֶגְדֶּךָ׃", "rashi_he": "נסעה. כְּמוֹ שִׁמְעָה, סִלְחָה, שֶׁהוּא כְּמוֹ שְׁמַע, סְלַח, אַף כָּאן נִסְעָה כְּמוֹ נְסַע, וְהַנּוּ\"ן יְסוֹד בַּתֵּבָה, וְתַרְגּוּם שֶׁל אֻנְקְלוֹס טוּל וּנְהָךְ, עֵשָׂו אָמַר לְיַעֲקֹב נְסַע מִכָּאן וְנֵלֵךְ:", "rashi_en": "רש״י מסביר שהמילה 'נסעה' אינה לשון רבים אלא לשון יחיד, כמו 'שמעה' ו'סלחה' שפירושם שמע וסלח. הנו״ן היא חלק מן השורש. עשו אמר ליעקב: נסע מכאן ונלך.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה 'נָסְעָה' — לְשׁוֹן יָחִיד אוֹ רַבִּים?", "options": ["לְשׁוֹן יָחִיד, כְּמוֹ 'שִׁמְעָה' וְ'סְלָחָה'", "לָשׁוֹן רַבִּים — נָסַע אֲנִי וְאַתָּה יַחַד", "לְשׁוֹן בַּקָּשָׁה — בְּבַקָּשָׁה נִיסַּע"], "kasha": "המילה 'נסעה' נשמעת כלשון רבים (ניסע יחד), אך ההקשר מראה שעשו פונה ליעקב בציווי.", "answer": "'נסעה' היא לשון יחיד כמו 'שמעה' ו'סלחה', והנו״ן היא יסוד בתיבה. עשו אמר ליעקב: נסע מכאן ונלך.", "kp": ["כמו שמעה סלחה", "והנו\"ן יסוד בתבה", "עשו אמר ליעקב נסע מכאן ונלך"]}]}, {"id": "33:12.2", "ch": 33, "v": 12, "n": 2, "dh": "ואלכה לנגדך", "pasuk_html": "וַיֹּ֖אמֶר נִסְעָ֣ה וְנֵלֵ֑כָה <mark>וְאֵלְכָ֖ה לְנֶגְדֶּֽךָ׃</mark>", "pasuk_en": "וַיֹּאמֶר נִסְעָה וְנֵלֵכָה וְאֵלְכָה לְנֶגְדֶּךָ׃", "rashi_he": "ואלכה לנגדך. בְּשָׁוֶה לְךָ; טוֹבָה זוֹ אֶעֱשֶׂה לְךָ, שֶׁאַאֲרִיךְ יְמֵי מַהֲלַכְתִּי, לָלֶכֶת לְאַט כַּאֲשֶׁר אַתָּה צָרִיךְ, וְזֶהוּ לְנֶגְדֶּךָ – בְּשָׁוֶה לְךָ:", "rashi_en": "רש״י מסביר ש'ואלכה לנגדך' פירושו: אלך בשווה לך. עשו הציע ליעקב שיאריך את ימי מהלכתו וילך לאט בהתאם לקצב של יעקב.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ 'לְנֶגְדְּךָ' לְפִי רַשִׁ״י?", "options": ["בְּשָׁווֶה לְךָ — בְּאוֹתוֹ קֶצֶב הֲלִיכָה כָּמוֹךָ", "מוֹלֵךְ — אֵלֵךְ לְפָנֶיךָ וְאוֹבִיל אוֹתְךָ", "כְּנֶגְדְּךָ — אֵלֵךְ בְּכִיוּון הַהָפוּךְ מִמְּךָ"], "kasha": "המילה 'לנגדך' אינה ברורה — האם פירושה מול, כנגד, או משהו אחר?", "answer": "'לנגדך' פירושו בשווה לך. עשו הציע שיאריך ימי מהלכתו וילך לאט כפי שיעקב צריך.", "kp": ["בשוה לך", "שאאריך ימי מהלכתי ללכת לאט"]}]}, {"id": "33:13.1", "ch": 33, "v": 13, "n": 1, "dh": "עלות עלי", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֗יו אֲדֹנִ֤י יֹדֵ֙עַ֙ כִּֽי־הַיְלָדִ֣ים רַכִּ֔ים וְהַצֹּ֥אן וְהַבָּקָ֖ר <mark>עָל֣וֹת עָלָ֑י</mark> וּדְפָקוּם֙ י֣וֹם אֶחָ֔ד וָמֵ֖תוּ כָּל־הַצֹּֽאן׃", "pasuk_en": "וַיֹּאמֶר אֵלָיו אֲדֹנִי יֹדֵעַ כִּי־הַיְלָדִים רַכִּים וְהַצֹּאן וְהַבָּקָר עָלוֹת עָלָי וּדְפָקוּם יוֹם אֶחָד וָמֵתוּ כָּל־הַצֹּאן׃", "rashi_he": "עלות עלי. הַצֹּאן וְהַבָּקָר, שֶׁהֵן עָלוֹת, מֻטָּלוֹת עָלַי לְנַהֲלָן לְאַט:", "rashi_en": "רש״י מפרש שהמילים \"עלות עלי\" פירושן שהצאן והבקר המיניקות מוטלות על יעקב לנהלן לאט, כלומר הן באחריותו.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מָה כַּוָּונַת \"עָלוֹת עָלָי\"?", "options": ["הַצֹּאן הַמֵּינִיקוֹת מֻוטָּלוֹת עָלָיו לְנַהֲלָן לְאַט", "הַצֹּאן עוֹלוֹת עַל הָהָר יַחַד אִיתּוֹ", "הַצֹּאן מְהַוּוֹת עָלָיו נֵטֶל כַּסְפִּי כָּבֵד"], "kasha": "לא ברור מה הקשר בין \"עלות\" לבין \"עלי\" — האם הכוונה שהן עולות עליו, או משהו אחר?", "answer": "רש״י מסביר שהצאן והבקר המיניקות מוטלות עליו — באחריותו — לנהלן לאט.", "kp": ["מטלות עלי לנהלן לאט"]}]}, {"id": "33:13.2", "ch": 33, "v": 13, "n": 2, "dh": "עלות", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֗יו אֲדֹנִ֤י יֹדֵ֙עַ֙ כִּֽי־הַיְלָדִ֣ים רַכִּ֔ים וְהַצֹּ֥אן וְהַבָּקָ֖ר <mark>עָל֣וֹת</mark> עָלָ֑י וּדְפָקוּם֙ י֣וֹם אֶחָ֔ד וָמֵ֖תוּ כָּל־הַצֹּֽאן׃", "pasuk_en": "וַיֹּאמֶר אֵלָיו אֲדֹנִי יֹדֵעַ כִּי־הַיְלָדִים רַכִּים וְהַצֹּאן וְהַבָּקָר עָלוֹת עָלָי וּדְפָקוּם יוֹם אֶחָד וָמֵתוּ כָּל־הַצֹּאן׃", "rashi_he": "עלות. מְגַדְּלוֹת עוֹלְלֵיהֶן, לְשׁוֹן עוֹלֵל וְיוֹנֵק (איכה ב'), עוּל יָמִים (ישעיהו ס\"ה), וּשְׁתֵּי פָרוֹת עָלוֹת (שמואל א ו') וּבְלַעַז אנפנטיי\"ש:", "rashi_en": "רש״י מסביר שהמילה \"עלות\" פירושה מגדלות עולליהן, כלומר מיניקות, מלשון \"עולל ויונק\". הוא מביא ראיות נוספות מן המקרא לשורש זה.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מַהִי מַשְׁמָעוּת הַמִּילָּה \"עָלוֹת\"?", "options": ["מְגַדְּלוֹת אֶת צֶאֱצָאֵיהֶן, מִלְּשׁוֹן עוֹלֵל וְיוֹנֵק", "עוֹלוֹת בַּדֶּרֶךְ וּמְטַפְּסוֹת עַל הֶהָרִים", "נוֹשְׂאוֹת מַשָּׂא כָּבֵד עַל גַּבָּן"], "kasha": "המילה \"עלות\" אינה מובנת מאליה — האם הכוונה לעלייה, או למשמעות אחרת?", "answer": "רש״י מפרש ש\"עלות\" פירושו מגדלות עולליהן, מלשון עולל ויונק, כלומר בהמות מיניקות.", "kp": ["מגדלות עולליהן", "לשון עולל ויונק"]}]}, {"id": "33:13.3", "ch": 33, "v": 13, "n": 3, "dh": "ודפקום יום אחד", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֗יו אֲדֹנִ֤י יֹדֵ֙עַ֙ כִּֽי־הַיְלָדִ֣ים רַכִּ֔ים וְהַצֹּ֥אן וְהַבָּקָ֖ר עָל֣וֹת עָלָ֑י <mark>וּדְפָקוּם֙ י֣וֹם אֶחָ֔ד</mark> וָמֵ֖תוּ כָּל־הַצֹּֽאן׃", "pasuk_en": "וַיֹּאמֶר אֵלָיו אֲדֹנִי יֹדֵעַ כִּי־הַיְלָדִים רַכִּים וְהַצֹּאן וְהַבָּקָר עָלוֹת עָלָי וּדְפָקוּם יוֹם אֶחָד וָמֵתוּ כָּל־הַצֹּאן׃", "rashi_he": "ודפקום יום אחד. לְיַגְּעָם בַּדֶּרֶךְ בִּמְרוּצָה ומתו כל הצאן:", "rashi_en": "רש״י מפרש ש\"ודפקום\" פירושו ליגעם בדרך במרוצה, ואם יעשו כן אפילו יום אחד — ימותו כל הצאן.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מַהוּ הַחֲשַׁשׁ בְּ\"וּדְפָקוּם יוֹם אֶחָד\"?", "options": ["שֶׁיְיַגְּעוּ אֶת הַצֹּאן בִּמְרוּצָה וְיָמוּתוּ", "שֶׁיַכֵּום אוֹיֵב פִּתְאֹום בְּיוֹם אֶחָד", "שֶׁהַצֹּאן תֹּאבַד אֶת דַּרְכָּהּ בְּיוֹם סוֹעֵר"], "kasha": "מה פירוש \"ודפקום\" — האם מדובר בהכאה, בדחיפה או במשהו אחר?", "answer": "רש״י מסביר שהכוונה ליגעם בדרך במרוצה, ובכך יגרמו למות כל הצאן.", "kp": ["ליגעם בדרך במרוצה"]}]}, {"id": "33:13.4", "ch": 33, "v": 13, "n": 4, "dh": "ודפקום", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֗יו אֲדֹנִ֤י יֹדֵ֙עַ֙ כִּֽי־הַיְלָדִ֣ים רַכִּ֔ים וְהַצֹּ֥אן וְהַבָּקָ֖ר עָל֣וֹת עָלָ֑י <mark>וּדְפָקוּם֙</mark> י֣וֹם אֶחָ֔ד וָמֵ֖תוּ כָּל־הַצֹּֽאן׃", "pasuk_en": "וַיֹּאמֶר אֵלָיו אֲדֹנִי יֹדֵעַ כִּי־הַיְלָדִים רַכִּים וְהַצֹּאן וְהַבָּקָר עָלוֹת עָלָי וּדְפָקוּם יוֹם אֶחָד וָמֵתוּ כָּל־הַצֹּאן׃", "rashi_he": "ודפקום. כְּמוֹ קוֹל דּוֹדִי דּוֹפֵק (שיר השירים), נוֹקֵשׁ בַּדֶּלֶת:", "rashi_en": "רש״י מסביר שהמילה \"ודפקום\" היא מלשון דפיקה, כמו \"קול דודי דופק\" — נוקש בדלת, כלומר הכאה והקשה.", "note": "", "points": [{"q": "לְאֵיזֶה פָּסוּק מְשַׁוֶּוה רַשִׁ״י אֶת הַמִּילָּה \"וּדְפָקוּם\"?", "options": ["\"קוֹל דּוֹדִי דּוֹפֵק\" — נוֹקֵשׁ בַּדֶּלֶת", "\"דָּפַקְתִּי עַל לִבִּי\" — הִרְהַרְתִּי בְּלִבִּי", "\"וְדָפַק עַל הַחוֹמָה\" — מַכֶּה בַּמָּצוֹר"], "kasha": "המילה \"ודפקום\" אינה שכיחה במקרא וצריכה ביאור — מה שורשה ומה משמעותה?", "answer": "רש״י מדמה את \"ודפקום\" ל\"קול דודי דופק\" בשיר השירים, שפירושו נוקש בדלת.", "kp": ["קול דודי דופק", "נוקש בדלת"]}]}, {"id": "33:14.1", "ch": 33, "v": 14, "n": 1, "dh": "יעבר נא אדני", "pasuk_html": "<mark>יַעֲבָר־נָ֥א אֲדֹנִ֖י</mark> לִפְנֵ֣י עַבְדּ֑וֹ וַאֲנִ֞י אֶֽתְנָהֲלָ֣ה לְאִטִּ֗י לְרֶ֨גֶל הַמְּלָאכָ֤ה אֲשֶׁר־לְפָנַי֙ וּלְרֶ֣גֶל הַיְלָדִ֔ים עַ֛ד אֲשֶׁר־אָבֹ֥א אֶל־אֲדֹנִ֖י שֵׂעִֽירָה׃", "pasuk_en": "יַעֲבָר־נָא אֲדֹנִי לִפְנֵי עַבְדּוֹ וַאֲנִי אֶתְנָהֲלָה לְאִטִּי לְרֶגֶל הַמְּלָאכָה אֲשֶׁר־לְפָנַי וּלְרֶגֶל הַיְלָדִים עַד אֲשֶׁר־אָבֹא אֶל־אֲדֹנִי שֵׂעִירָה׃", "rashi_he": "יעבר נא אדני. אַל נָא תַאֲרִיךְ יְמֵי הֲלִיכָתְךָ, עֲבֹר כְּפִי דַּרְכְּךָ וְאַף אִם תִּתְרַחֵק:", "rashi_en": "רש״י מסביר שיעקב ביקש מעשו שלא יאט את הליכתו בגללו, אלא ילך בקצב הרגיל שלו גם אם יתרחק.", "note": "", "points": [{"q": "מַה בִּיקֵּשׁ יַעֲקֹב מֵעֵשָׂו לְפִי רַשִׁ״י?", "options": ["שֶׁיֵלֵךְ בְּקֶצֶב הָרָגִיל שֶׁלּוֹ וְלֹא יַאֲרִיךְ דַּרְכּוֹ", "שֶׁיֵלֵךְ לְאַט כְּדֵי שֶׁיַעֲקֹב יוּכַל לְהַדְבִּיקוֹ", "שֶׁיְחַכֶּה לוֹ בַּמָּקוֹם עַד שֶׁיַגִּיעַ"], "kasha": "לא ברור מה הכוונה ב״יעבר נא אדני לפני עבדו״ — מה בדיוק מבקש יעקב מעשו?", "answer": "יעקב מבקש מעשו שלא יאריך את ימי הליכתו, אלא יעבור כפי דרכו הרגילה, גם אם יתרחק ממנו.", "kp": ["אל נא תאריך ימי הליכתך", "עבר כפי דרכך"]}]}, {"id": "33:14.2", "ch": 33, "v": 14, "n": 2, "dh": "אתנהלה", "pasuk_html": "יַעֲבָר־נָ֥א אֲדֹנִ֖י לִפְנֵ֣י עַבְדּ֑וֹ וַאֲנִ֞י <mark>אֶֽתְנָהֲלָ֣ה</mark> לְאִטִּ֗י לְרֶ֨גֶל הַמְּלָאכָ֤ה אֲשֶׁר־לְפָנַי֙ וּלְרֶ֣גֶל הַיְלָדִ֔ים עַ֛ד אֲשֶׁר־אָבֹ֥א אֶל־אֲדֹנִ֖י שֵׂעִֽירָה׃", "pasuk_en": "יַעֲבָר־נָא אֲדֹנִי לִפְנֵי עַבְדּוֹ וַאֲנִי אֶתְנָהֲלָה לְאִטִּי לְרֶגֶל הַמְּלָאכָה אֲשֶׁר־לְפָנַי וּלְרֶגֶל הַיְלָדִים עַד אֲשֶׁר־אָבֹא אֶל־אֲדֹנִי שֵׂעִירָה׃", "rashi_he": "אתנהלה. אֶתְנַהֵל, הֵ\"א יְתֵירָה, כְּמוֹ אֵרְדָה, אֶשְׁמְעָה:", "rashi_en": "רש״י מסביר שהמילה ״אתנהלה״ היא כמו ״אתנהל״, וה-ה״א בסופה היא אות יתירה, כמו שמצינו ב״ארדה״ ו״אשמעה״.", "note": "", "points": [{"q": "מַה מְסַבֵּיר רַשִׁ״י לְגַבֵּי צוּרַת הַמִּילָּה ״אֶתְנַהֲלָה״?", "options": ["הַהֵ״א יְתֵירָה, כְּמוֹ אֵרְדָה וְאֶשְׁמְעָה", "הַהֵ״א מְצַייֶּנֶת כִּיוּוּן, כְּמוֹ ״בֵּיתָה״", "הַהֵ״א הִיא סִימָן לַנִּסְתֶּרֶת, לֹא לַדּוֹבֵר"], "kasha": "המילה ״אתנהלה״ תמוהה — מה תפקיד הה״א בסוף המילה?", "answer": "הה״א בסוף ״אתנהלה״ היא אות יתירה, והמילה שווה ל״אתנהל״, כמו ״ארדה״ שהיא כמו ״ארד״.", "kp": ["ה\"א יתירה", "כמו ארדה אשמעה"]}]}, {"id": "33:14.3", "ch": 33, "v": 14, "n": 3, "dh": "לאטי", "pasuk_html": "יַעֲבָר־נָ֥א אֲדֹנִ֖י לִפְנֵ֣י עַבְדּ֑וֹ וַאֲנִ֞י אֶֽתְנָהֲלָ֣ה <mark>לְאִטִּ֗י</mark> לְרֶ֨גֶל הַמְּלָאכָ֤ה אֲשֶׁר־לְפָנַי֙ וּלְרֶ֣גֶל הַיְלָדִ֔ים עַ֛ד אֲשֶׁר־אָבֹ֥א אֶל־אֲדֹנִ֖י שֵׂעִֽירָה׃", "pasuk_en": "יַעֲבָר־נָא אֲדֹנִי לִפְנֵי עַבְדּוֹ וַאֲנִי אֶתְנָהֲלָה לְאִטִּי לְרֶגֶל הַמְּלָאכָה אֲשֶׁר־לְפָנַי וּלְרֶגֶל הַיְלָדִים עַד אֲשֶׁר־אָבֹא אֶל־אֲדֹנִי שֵׂעִירָה׃", "rashi_he": "לאטי. לְאַט שֶׁלִּי, לְשׁוֹן נַחַת, הַהוֹלְכִים לְאַט, לְאַט לִי לַנַּעַר (שמואל ב י\"ח). לְאִטִּי הַלָּמֶ\"ד מִן הַיְסוֹד, וְאֵינָהּ מְשַׁמֶּשֶׁת – אֶתְנַהֵל נַחַת שֶׁלִּי:", "rashi_en": "רש״י מפרש ש״לאטי״ פירושו לאט שלי, לשון נחת. הלמ״ד היא חלק מן השורש ולא אות שימוש, כלומר הפירוש הוא: אתנהל בנחת שלי.", "note": "", "points": [{"q": "מַה מְחַדֵּשׁ רַשִׁ״י לְגַבֵּי הַלָּמֶ״ד בַּמִּילָּה ״לְאִטִּי״?", "options": ["הַלָּמֶ״ד הִיא מִן הַשֹּׁורֶשׁ וְאֵינָהּ אוֹת שִׁימּוּשׁ", "הַלָּמֶ״ד הִיא אוֹת שִׁימּוּשׁ בְּמַשְׁמָעוּת ״לְפִי״", "הַלָּמֶ״ד מְצַיֶּינֶת כִּיּווּן כְּמוֹ ״לְבֵיתוֹ״"], "kasha": "במילה ״לאטי״ אפשר היה לחשוב שהלמ״ד היא אות שימוש (כמו ״ל-אט שלי״) — מה באמת תפקידה?", "answer": "הלמ״ד היא חלק מן השורש של המילה ואינה משמשת כאות שימוש. הפירוש הוא: אתנהל בנחת שלי.", "kp": ["הלמ\"ד מן היסוד", "ואינה משמשת"]}]}, {"id": "33:14.4", "ch": 33, "v": 14, "n": 4, "dh": "לרגל המלאכה", "pasuk_html": "יַעֲבָר־נָ֥א אֲדֹנִ֖י לִפְנֵ֣י עַבְדּ֑וֹ וַאֲנִ֞י אֶֽתְנָהֲלָ֣ה לְאִטִּ֗י <mark>לְרֶ֨גֶל הַמְּלָאכָ֤ה</mark> אֲשֶׁר־לְפָנַי֙ וּלְרֶ֣גֶל הַיְלָדִ֔ים עַ֛ד אֲשֶׁר־אָבֹ֥א אֶל־אֲדֹנִ֖י שֵׂעִֽירָה׃", "pasuk_en": "יַעֲבָר־נָא אֲדֹנִי לִפְנֵי עַבְדּוֹ וַאֲנִי אֶתְנָהֲלָה לְאִטִּי לְרֶגֶל הַמְּלָאכָה אֲשֶׁר־לְפָנַי וּלְרֶגֶל הַיְלָדִים עַד אֲשֶׁר־אָבֹא אֶל־אֲדֹנִי שֵׂעִירָה׃", "rashi_he": "לרגל המלאכה. לְפִי צֹרֶךְ הֲלִיכַת רַגְלֵי הַמְּלָאכָה הַמֻּטֶּלֶת עָלַי לְהוֹלִיךְ:", "rashi_en": "רש״י מפרש ש״לרגל המלאכה״ פירושו לפי צורך הליכת רגלי המקנה שמוטל עליו להוליך.", "note": "", "points": [{"q": "מַהִי ״הַמְּלָאכָה״ שֶׁיַּעֲקֹב מְדַבֵּר עָלֶיהָ לְפִי רַשִׁ״י?", "options": ["הַמִּקְנֶה שֶׁמּוּטָל עָלָיו לְהוֹלִיךְ", "הָעֲבוֹדָה שֶׁעָשׂוּ עֲבָדָיו בַּשָּׂדוֹת", "הַמַּתָּנוֹת שֶׁהֵכִין לְעֵשָׂו"], "kasha": "לא ברור מה הכוונה ב״המלאכה אשר לפני״ — איזו מלאכה?", "answer": "המלאכה היא המקנה (הצאן והבקר) שמוטל על יעקב להוליך, וצריך ללכת לפי קצב רגליהם.", "kp": ["המלאכה המטלת עלי להוליך"]}]}, {"id": "33:14.5", "ch": 33, "v": 14, "n": 5, "dh": "ולרגל הילדים", "pasuk_html": "יַעֲבָר־נָ֥א אֲדֹנִ֖י לִפְנֵ֣י עַבְדּ֑וֹ וַאֲנִ֞י אֶֽתְנָהֲלָ֣ה לְאִטִּ֗י לְרֶ֨גֶל הַמְּלָאכָ֤ה אֲשֶׁר־לְפָנַי֙ <mark>וּלְרֶ֣גֶל הַיְלָדִ֔ים</mark> עַ֛ד אֲשֶׁר־אָבֹ֥א אֶל־אֲדֹנִ֖י שֵׂעִֽירָה׃", "pasuk_en": "יַעֲבָר־נָא אֲדֹנִי לִפְנֵי עַבְדּוֹ וַאֲנִי אֶתְנָהֲלָה לְאִטִּי לְרֶגֶל הַמְּלָאכָה אֲשֶׁר־לְפָנַי וּלְרֶגֶל הַיְלָדִים עַד אֲשֶׁר־אָבֹא אֶל־אֲדֹנִי שֵׂעִירָה׃", "rashi_he": "ולרגל הילדים. לְפִי רַגְלֵיהֶם שֶׁהֵם יְכוֹלִים לֵילֵךְ:", "rashi_en": "רש\"י מפרש ש\"לרגל הילדים\" פירושו לפי קצב הליכתם של הילדים, כלומר לפי מה שרגליהם מסוגלות ללכת.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"לְרֶגֶל הַיְלָדִים\" לְפִי רַשִׁ\"י?", "options": ["לְפִי קֶצֶב הַהֲלִיכָה שֶׁהַיְּלָדִים מְסֻוגָּלִים לוֹ", "בִּגְלַל שֶׁהַיְּלָדִים צְרִיכִים לָנוּחַ בַּדֶּרֶךְ", "כְּדֵי שֶׁהַיְּלָדִים יִלְמְדוּ לָלֶכֶת בְּרַגֶּל"], "kasha": "מה פירוש המילה \"לרגל\" בהקשר זה — הרי אין מדובר ברגל ממש.", "answer": "\"לרגל\" פירושו לפי רגליהם, כלומר לפי הקצב שהם יכולים ללכת.", "kp": ["לפי רגליהם שהם יכולים לילך"]}]}, {"id": "33:14.6", "ch": 33, "v": 14, "n": 6, "dh": "עד אשר אבא אל אדני שעירה", "pasuk_html": "יַעֲבָר־נָ֥א אֲדֹנִ֖י לִפְנֵ֣י עַבְדּ֑וֹ וַאֲנִ֞י אֶֽתְנָהֲלָ֣ה לְאִטִּ֗י לְרֶ֨גֶל הַמְּלָאכָ֤ה אֲשֶׁר־לְפָנַי֙ וּלְרֶ֣גֶל הַיְלָדִ֔ים <mark>עַ֛ד אֲשֶׁר־אָבֹ֥א אֶל־אֲדֹנִ֖י שֵׂעִֽירָה׃</mark>", "pasuk_en": "יַעֲבָר־נָא אֲדֹנִי לִפְנֵי עַבְדּוֹ וַאֲנִי אֶתְנָהֲלָה לְאִטִּי לְרֶגֶל הַמְּלָאכָה אֲשֶׁר־לְפָנַי וּלְרֶגֶל הַיְלָדִים עַד אֲשֶׁר־אָבֹא אֶל־אֲדֹנִי שֵׂעִירָה׃", "rashi_he": "עד אשר אבא אל אדני שעירה. הִרְחִיב לוֹ הַדֶּרֶךְ, שֶׁלֹּא הָיָה דַעְתּוֹ לָלֶכֶת אֶלָּא עַד סֻכּוֹת; אָמַר אִם דַּעְתּוֹ לַעֲשׂוֹת לִי רָעָה, יַמְתִּין עַד בּוֹאִי אֶצְלוֹ, וְהוּא לֹא הָלַךְ; וְאֵימָתַי יֵלֵךְ? בִּימֵי הַמָּשִׁיחַ (בראשית רבה), שֶׁנֶּאֱמַר וְעָלוּ מוֹשִׁעִים בְּהַר צִיּוֹן לִשְׁפֹּט אֶת הַר עֵשָׂו (עובדיה א'); וּמִ\"אַ יֵשׁ לְפָרָשָׁה זוֹ רַבִּים:", "rashi_en": "רש\"י מסביר שיעקב לא התכוון באמת ללכת לשעיר אלא רק עד סוכות. הוא הרחיק את היעד כדי שאם עשו ירצה להרע לו, ימתין לשווא. ולעתיד לבוא, בימי המשיח, יעקב אכן יגיע לשעיר לשפוט את הר עשו.", "note": "", "points": [{"q": "לְאָן הִתְכַּווֵּן יַעֲקֹב לָלֶכֶת בֶּאֱמֶת, לְפִי רַשִׁ\"י?", "options": ["רַק עַד סֻוכּוֹת, וְלֹא עַד שֵׂעִיר", "עַד שֵׂעִיר כְּפִי שֶׁאָמַר לְעֵשָׂו", "עַד בֵּית אֵל לְהַקְרִיב קָרְבָּנוֹת"], "kasha": "למה אמר יעקב שילך לשעיר, אם בפועל לא הלך לשם?", "answer": "יעקב הרחיב לו את הדרך ולא התכוון ללכת אלא עד סוכות, כדי שאם עשו ירצה להרע לו — ימתין לשווא.", "kp": ["הרחיב לו הדרך", "לא היה דעתו ללכת אלא עד סכות"]}, {"q": "מָתַי יִתְקַייֵּם \"עַד אֲשֶׁר־אָבֹא אֶל־אֲדֹנִי שֵׂעִירָה\" לְפִי רַשִׁ\"י?", "options": ["בִּימֵי הַמָּשִׁיחַ, כַּנֶּאֱמַר בְּעוֹבַדְיָה", "בִּזְמַן שֶׁיַּעֲקֹב חָזַר מִלָּבָן", "כְּשֶׁיַּעֲקֹב וְעֵשָׂו נִפְגְּשׁוּ שׁוּב בְּחֶבְרוֹן"], "kasha": "אם יעקב לא הלך לשעיר, מתי יתקיים מה שאמר?", "answer": "בימי המשיח, שנאמר \"ועלו מושעים בהר ציון לשפוט את הר עשו\".", "kp": ["ואימתי ילך בימי המשיח"]}]}, {"id": "33:15.1", "ch": 33, "v": 15, "n": 1, "dh": "ויאמר למה זה", "pasuk_html": "וַיֹּ֣אמֶר עֵשָׂ֔ו אַצִּֽיגָה־נָּ֣א עִמְּךָ֔ מִן־הָעָ֖ם אֲשֶׁ֣ר אִתִּ֑י <mark>וַיֹּ֙אמֶר֙ לָ֣מָּה זֶּ֔ה</mark> אֶמְצָא־חֵ֖ן בְּעֵינֵ֥י אֲדֹנִֽי׃", "pasuk_en": "וַיֹּאמֶר עֵשָׂו אַצִּיגָה־נָּא עִמְּךָ מִן־הָעָם אֲשֶׁר אִתִּי וַיֹּאמֶר לָמָּה זֶּה אֶמְצָא־חֵן בְּעֵינֵי אֲדֹנִי׃", "rashi_he": "ויאמר למה זה. תַעֲשֶׂה לִי טוֹבָה זוֹ שֶׁאֵינִי צָרִיךְ לָהּ:", "rashi_en": "רש\"י מפרש שיעקב אמר לעשו: למה תעשה לי טובה זו, איני צריך לה.", "note": "", "points": [{"q": "מַה כַּווָּנַת יַעֲקֹב בְּ\"לָמָּה זֶּה\" לְפִי רַשִׁ\"י?", "options": ["לָמָּה תַּעֲשֶׂה לִי טוֹבָה שֶׁאֵינִי צָרִיךְ לָהּ", "לָמָּה אַתָּה מַצִּיעַ דָּבָר שֶׁיַּכְבִּיד עָלֶיךָ", "לָמָּה אַתָּה חוֹשֵׁד שֶׁאֲנִי מְפַחֵד מִמְּךָ"], "kasha": "מה בדיוק ענה יעקב כשאמר \"למה זה\" — מה הטענה שבדבריו?", "answer": "יעקב אמר לעשו שאין לו צורך בטובה זו שהוא מציע לו.", "kp": ["טובה זו שאיני צריך לה"]}]}, {"id": "33:15.2", "ch": 33, "v": 15, "n": 2, "dh": "אמצא חן בעיני אדני", "pasuk_html": "וַיֹּ֣אמֶר עֵשָׂ֔ו אַצִּֽיגָה־נָּ֣א עִמְּךָ֔ מִן־הָעָ֖ם אֲשֶׁ֣ר אִתִּ֑י וַיֹּ֙אמֶר֙ לָ֣מָּה זֶּ֔ה <mark>אֶמְצָא־חֵ֖ן בְּעֵינֵ֥י אֲדֹנִֽי׃</mark>", "pasuk_en": "וַיֹּאמֶר עֵשָׂו אַצִּיגָה־נָּא עִמְּךָ מִן־הָעָם אֲשֶׁר אִתִּי וַיֹּאמֶר לָמָּה זֶּה אֶמְצָא־חֵן בְּעֵינֵי אֲדֹנִי׃", "rashi_he": "אמצא חן בעיני אדני. וְלֹא תְשַׁלֵּם לִי עַתָּה שׁוּם גְּמוּל:", "rashi_en": "רש\"י מפרש שיעקב ביקש מעשו שלא ישלם לו שום גמול עכשיו, אלא רק ימצא חן בעיניו.", "note": "", "points": [{"q": "מַה בִּיקֵּשׁ יַעֲקֹב בְּאָמְרוֹ \"אֶמְצָא־חֵן בְּעֵינֵי אֲדֹנִי\" לְפִי רַשִׁ\"י?", "options": ["שְׁעֵשָׂו לֹא יְשַׁלֵּם לוֹ שׁוּם גְּמוּל עַתָּה", "שְׁעֵשָׂו יִמְחַל לוֹ עַל מַה שֶּׁעָשָׂה בֶּעָבָר", "שְׁעֵשָׂו יֶאֱהַב אוֹתוֹ כְּאָח מֵעַתָּה"], "kasha": "מה הקשר בין מציאת חן לבין הצעת עשו להציג אנשים?", "answer": "יעקב ביקש שעשו לא ישלם לו גמול עכשיו, ודי לו במציאת חן בעיניו.", "kp": ["ולא תשלם לי עתה שום גמול"]}]}, {"id": "33:16.1", "ch": 33, "v": 16, "n": 1, "dh": "וישב ביום ההוא עשו לדרכו", "pasuk_html": "<mark>וַיָּשָׁב֩ בַּיּ֨וֹם הַה֥וּא עֵשָׂ֛ו לְדַרְכּ֖וֹ</mark> שֵׂעִֽירָה׃", "pasuk_en": "וַיָּשָׁב בַּיּוֹם הַהוּא עֵשָׂו לְדַרְכּוֹ שֵׂעִירָה׃", "rashi_he": "וישב ביום ההוא עשו לדרכו. עֵשָׂו לְבַדּוֹ, וְד' מֵאוֹת אִישׁ שֶׁהָלְכוּ עִמּוֹ נִשְׁמְטוּ מֵאֶצְלוֹ אֶחָד אֶחָד, וְהֵיכָן פָּרַע לָהֶם הַקָּבָּ\"ה? בִּימֵי דָוִד, שֶׁנֶּאֱמַר כִּי אִם אַרְבַּע מֵאוֹת אִישׁ נַעַר אֲשֶׁר רָכְבוּ עַל הַגְּמַלִּים (שמואל א ל') (בראשית רבה):", "rashi_en": "רש״י מסביר שעשו חזר לבדו, כי ארבע מאות האיש שליוו אותו נשמטו ממנו אחד אחד. הקב״ה פרע להם בימי דוד, שנאמר 'כי אם ארבע מאות איש נער אשר רכבו על הגמלים'.", "note": "", "points": [{"q": "מַה קָרָה לְאַרְבַּע מֵאוֹת הָאִישׁ שֶׁהָלְכוּ עִם עֵשָׂו, לְפִי רַשִׁ״י?", "options": ["נִשְׁמְטוּ מִמֶּנּוּ אֶחָד אֶחָד וְעֵשָׂו חָזַר לְבַדּוֹ", "נִשְׁאֲרוּ עִם יַעֲקֹב וְעָבְדוּ אוֹתוֹ", "חָזְרוּ יַחַד עִם עֵשָׂו לְשֵׂעִיר"], "kasha": "הפסוק אומר שעשו שב לדרכו, אך לא מזכיר את ארבע מאות האיש שהיו עמו — מה עלה בגורלם?", "answer": "ארבע מאות האיש נשמטו מעשו אחד אחד, והוא חזר לבדו. הקב״ה פרע להם בימי דוד.", "kp": ["עשו לבדו", "נשמטו מאצלו אחד אחד", "בימי דוד"]}]}, {"id": "33:17.1", "ch": 33, "v": 17, "n": 1, "dh": "ויבן לו בית", "pasuk_html": "וְיַעֲקֹב֙ נָסַ֣ע סֻכֹּ֔תָה <mark>וַיִּ֥בֶן ל֖וֹ בָּ֑יִת</mark> וּלְמִקְנֵ֙הוּ֙ עָשָׂ֣ה סֻכֹּ֔ת עַל־כֵּ֛ן קָרָ֥א שֵׁם־הַמָּק֖וֹם סֻכּֽוֹת׃ (ס)", "pasuk_en": "וְיַעֲקֹב נָסַע סֻכֹּתָה וַיִּבֶן לוֹ בָּיִת וּלְמִקְנֵהוּ עָשָׂה סֻכֹּת עַל־כֵּן קָרָא שֵׁם־הַמָּקוֹם סֻכּוֹת׃", "rashi_he": "ויבן לו בית. שָׁהָה שָׁם י\"ח חֹדֶשׁ, קַיִץ וְחֹרֶף וְקַיִץ (מגילה י\"ז), סֻכּוֹת – קַיִץ; בַּיִת – חֹרֶף, סֻכּוֹת – קַיִץ:", "rashi_en": "רש״י מסביר שיעקב שהה בסוכות שמונה עשר חודשים: קיץ, חורף וקיץ. 'סוכות' הראשון רומז לקיץ, 'בית' לחורף, ו'סוכות' השני לקיץ נוסף.", "note": "", "points": [{"q": "כַּמָּה זְמַן שָׁהָה יַעֲקֹב בְּסֻוכּוֹת, וּמִנַּייִן לוֹמֵד זֹאת רַשִׁ״י?", "options": ["י״ח חֳודָשִׁים — מֵהַזְכָּרַת סֻוכּוֹת, בַּיִת וְסֻוכּוֹת בַּפָּסוּק", "שָׁנָה אַחַת — מֵהַזְכָּרַת בַּיִת בִּלְבַד", "שָׁלוֹשׁ שָׁנִים — שָׁנָה לְכָל עוֹנָה שֶׁנִּזְכֶּרֶת"], "kasha": "הפסוק מזכיר גם 'בית' וגם 'סוכות' — מדוע שני סוגי מגורים שונים?", "answer": "יעקב שהה שם י״ח חודשים: סוכות רומז לקיץ ובית רומז לחורף, ונמצא קיץ וחורף וקיץ.", "kp": ["י\"ח חדש", "קיץ וחרף וקיץ", "סכות קיץ בית חרף"]}]}, {"id": "33:18.1", "ch": 33, "v": 18, "n": 1, "dh": "שלם", "pasuk_html": "וַיָּבֹא֩ יַעֲקֹ֨ב <mark>שָׁלֵ֜ם</mark> עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּאֶ֣רֶץ כְּנַ֔עַן בְּבֹא֖וֹ מִפַּדַּ֣ן אֲרָ֑ם וַיִּ֖חַן אֶת־פְּנֵ֥י הָעִֽיר׃", "pasuk_en": "וַיָּבֹא יַעֲקֹב שָׁלֵם עִיר שְׁכֶם אֲשֶׁר בְּאֶרֶץ כְּנַעַן בְּבֹאוֹ מִפַּדַּן אֲרָם וַיִּחַן אֶת־פְּנֵי הָעִיר׃", "rashi_he": "שלם. שָׁלֵם בְּגוּפוֹ, שֶׁנִּתְרַפֵּא מִצָּלַעְתּוֹ; שָׁלֵם בְּמָמוֹנוֹ, שֶׁלֹּא חָסַר כְּלוּם מִכָּל אוֹתוֹ דּוֹרוֹן; שָׁלֵם בְּתוֹרָתוֹ, שֶׁלֹּא שָׁכַח תַּלְמוּדוֹ בְּבֵית לָבָן (שבת ל\"ג):", "rashi_en": "רש״י דורש את המילה 'שלם' בשלושה מובנים: שלם בגופו — שנרפא מצליעתו, שלם בממונו — שלא חסר כלום למרות הדורון לעשו, ושלם בתורתו — שלא שכח תלמודו בבית לבן.", "note": "", "points": [{"q": "מַהֵם שְׁלֹושֶׁת הַמּוּבָנוֹת שֶׁל 'שָׁלֵם' לְפִי רַשִׁ״י?", "options": ["שָׁלֵם בְּגוּפוֹ, בְּמָמוֹנוֹ וּבְתוֹרָתוֹ", "שָׁלֵם בְּגוּפוֹ, בְּמִשְׁפַּחְתּוֹ וּבֶאֱמוּנָתוֹ", "שָׁלֵם בְּנַפְשׁוֹ, בִּכְבוֹדוֹ וּבְבִיטְחוֹנוֹ"], "kasha": "המילה 'שלם' מיותרת לכאורה — הפסוק יכול לומר 'ויבא יעקב עיר שכם' בלבד. מה באה המילה ללמד?", "answer": "שלם בגופו שנרפא מצליעתו, שלם בממונו שלא חסר כלום מהדורון, ושלם בתורתו שלא שכח תלמודו בבית לבן.", "kp": ["שלם בגופו", "שלם בממונו", "שלם בתורתו"]}]}, {"id": "33:18.2", "ch": 33, "v": 18, "n": 2, "dh": "עיר שכם", "pasuk_html": "וַיָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם <mark>עִ֣יר שְׁכֶ֗ם</mark> אֲשֶׁר֙ בְּאֶ֣רֶץ כְּנַ֔עַן בְּבֹא֖וֹ מִפַּדַּ֣ן אֲרָ֑ם וַיִּ֖חַן אֶת־פְּנֵ֥י הָעִֽיר׃", "pasuk_en": "וַיָּבֹא יַעֲקֹב שָׁלֵם עִיר שְׁכֶם אֲשֶׁר בְּאֶרֶץ כְּנַעַן בְּבֹאוֹ מִפַּדַּן אֲרָם וַיִּחַן אֶת־פְּנֵי הָעִיר׃", "rashi_he": "עיר שכם. כְּמוֹ לְעִיר, וְכָמוֹהוּ עַד בּוֹאָנָה בֵּית לָחֶם (רות א'):", "rashi_en": "רש״י מסביר שהמילה 'עיר' כאן משמעותה 'לעיר' — אל העיר שכם, כמו 'עד בואנה בית לחם' שפירושו 'לבית לחם'.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה 'עִיר' בַּבִּיטּוּי 'עִיר שְׁכֶם'?", "options": ["כְּמוֹ 'לָעִיר' — אֶל הָעִיר שְׁכֶם", "כְּשֵׁם עֶצֶם פְּרָטִי — עִיר הִיא שֵׁם מָקוֹם", "כְּבִיצּוּר מוּקָּף חוֹמָה, בְּנִיגּוּד לַכְּפָר"], "kasha": "המילה 'עיר' בפסוק חסרה את אות היחס — היה צריך לכתוב 'לעיר שכם'.", "answer": "'עיר' כאן משמעותו 'לעיר', כמו 'עד בואנה בית לחם' שפירושו 'לבית לחם'.", "kp": ["כמו לעיר", "עד בואנה בית לחם"]}]}, {"id": "33:18.3", "ch": 33, "v": 18, "n": 3, "dh": "בבאו מפדן ארם", "pasuk_html": "וַיָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּאֶ֣רֶץ כְּנַ֔עַן <mark>בְּבֹא֖וֹ מִפַּדַּ֣ן אֲרָ֑ם</mark> וַיִּ֖חַן אֶת־פְּנֵ֥י הָעִֽיר׃", "pasuk_en": "וַיָּבֹא יַעֲקֹב שָׁלֵם עִיר שְׁכֶם אֲשֶׁר בְּאֶרֶץ כְּנַעַן בְּבֹאוֹ מִפַּדַּן אֲרָם וַיִּחַן אֶת־פְּנֵי הָעִיר׃", "rashi_he": "בבאו מפדן ארם. כְּאָדָם הָאוֹמֵר לַחֲבֵרוֹ יָצָא פְּלוֹנִי מִבֵּין שִׁנֵּי אֲרָיוֹת וּבָא שָׁלֵם, אַף כָּאן וַיָּבֹא שָׁלֵם מִפַּדַּן אֲרָם, מִלָּבָן וּמֵעֵשָׂו שֶׁנִזְדַּוְּגוּ לוֹ בַּדֶּרֶךְ:", "rashi_en": "רש״י מסביר שהתורה מזכירה \"בבאו מפדן ארם\" כדי לומר שיעקב יצא בשלום מסכנות הדרך — מלבן ומעשו שנזדמנו לו, כמו אדם שמספר שחברו יצא שלם מבין שני אריות.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מָה מְלַמֶּדֶת הַתּוֹרָה בַּמִּילִּים \"בְּבֹאוֹ מִפַּדַּן אֲרָם\"?", "options": ["שֶׁיַּעֲקֹב נִיצֵּל מִשְּׁנֵי סִיכּוּנִים — מִלָּבָן וּמֵעֵשָׂו שֶׁפָּגְעוּ בוֹ בַּדֶּרֶךְ", "שֶׁיַּעֲקֹב שָׁב לְאֶרֶץ כְּנַעַן מִפַּדַּן אֲרָם בְּלִי לַעֲצֹור בַּדֶּרֶךְ", "שֶׁיַּעֲקֹב הִגִּיעַ לִשְׁכֶם אַחֲרֵי שָׁנִים אֲרֻוכּוֹת בַּגָּלוּת"], "kasha": "מדוע הוסיפה התורה \"בבאו מפדן ארם\" — דבר שכבר ידוע לנו מהסיפור?", "answer": "רש״י מדמה זאת לאדם שמספר שחברו יצא מבין שני אריות ובא שלם. כך יעקב בא שלם מלבן ומעשו שנזדוגו לו בדרך.", "kp": ["מלבן ומעשו שנזדוגו לו בדרך", "מבין שני אריות ובא שלם"]}]}, {"id": "33:19.1", "ch": 33, "v": 19, "n": 1, "dh": "קשיטה", "pasuk_html": "וַיִּ֜קֶן אֶת־חֶלְקַ֣ת הַשָּׂדֶ֗ה אֲשֶׁ֤ר נָֽטָה־שָׁם֙ אָהֳל֔וֹ מִיַּ֥ד בְּנֵֽי־חֲמ֖וֹר אֲבִ֣י שְׁכֶ֑ם בְּמֵאָ֖ה <mark>קְשִׂיטָֽה׃</mark>", "pasuk_en": "וַיִּקֶן אֶת־חֶלְקַת הַשָּׂדֶה אֲשֶׁר נָטָה־שָׁם אָהֳלוֹ מִיַּד בְּנֵי־חֲמוֹר אֲבִי שְׁכֶם בְּמֵאָה קְשִׂיטָה׃", "rashi_he": "קשיטה. מָעָה. אָרַ\"עֲ כְּשֶׁהָלַכְתִּי לִכְרַכֵּי הַיָּם הָיוּ קוֹרִין לְמָעָה קְשִׂיטָה (וְתַרְגּוּמוֹ חוּרְפָן – טוֹבִים, חֲרִיפִים בְּכָל מָקוֹם, כְּגוֹן עוֹבֵר לַסּוֹחֵר):", "rashi_en": "רש״י מסביר ש\"קשיטה\" היא מטבע הנקראת \"מעה\". רבי עקיבא העיד שבכרכי הים קראו למעה קשיטה. התרגום \"חורפן\" פירושו מטבעות טובות העוברות לסוחר.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מַהִי \"קְשִׂיטָה\"?", "options": ["מַטְבֵּעַ הַנִּקְרֵאת מָעָה, כְּפִי שֶׁהֵעִיד רַבִּי עֲקִיבָא מִכַּרְכֵּי הַיָּם", "יְחִידַת מִשְׁקָל שֶׁל כֶּסֶף שֶׁהָיְתָה נְהוּגָה בְּאֶרֶץ כְּנַעַן", "מַטְבֵּעַ מְיֻוחֶדֶת שֶׁשִּׁימְּשָׁה רַק לִקְנִיַּית קַרְקָעוֹת"], "kasha": "מהו הפירוש של המילה הנדירה \"קשיטה\"?", "answer": "קשיטה היא מעה. רבי עקיבא סיפר שכשהלך לכרכי הים היו קוראים למעה קשיטה, והתרגום \"חורפן\" פירושו מטבעות טובות העוברות לסוחר.", "kp": ["מעה", "היו קורין למעה קשיטה"]}]}, {"id": "33:20.1", "ch": 33, "v": 20, "n": 1, "dh": "ויקרא לו אל אלהי ישראל", "pasuk_html": "וַיַּצֶּב־שָׁ֖ם מִזְבֵּ֑חַ <mark>וַיִּ֨קְרָא־ל֔וֹ אֵ֖ל אֱלֹהֵ֥י יִשְׂרָאֵֽל׃</mark> (ס)", "pasuk_en": "וַיַּצֶּב־שָׁם מִזְבֵּחַ וַיִּקְרָא־לוֹ אֵל אֱלֹהֵי יִשְׂרָאֵל׃", "rashi_he": "ויקרא לו אל אלהי ישראל. לֹא שֶׁהַמִּזְבֵּחַ קָרוּי אֱלֹהֵי יִשְׂרָאֵל אֶלָּא עַל שֵׁם שֶׁהָיָה הַקָּבָּ\"ה עִמּוֹ וְהִצִּילוֹ קָרָא שֵׁם הַמִּזְבֵּחַ עַל שֵׁם הַנֵּס, לִהְיוֹת שִׁבְחוֹ שֶׁל מָקוֹם נִזְכָּר בִּקְרִיאַת הַשֵּׁם, כְּלוֹמַר מִי שֶׁהוּא אֵל, הוּא הַקָּבָּ\"ה, הוּא לֵאלֹהִים לִי, שֶׁשְּׁמִי יִשְׂרָאֵל. וְכֵן מָצִינוּ בְּמֹשֶׁה וַיִּקְרָא שְׁמוֹ ה' נִסִּי (שמות י\"ז), לֹא שֶׁהַמִּזְבֵּחַ קָרוּי ה', אֶלָּא עַל שֵׁם הַנֵּס קָרָא שֵׁם הַמִּזְבֵּחַ לְהַזְכִּיר שִׁבְחוֹ שֶׁל הַקָּדוֹשׁ בָּרוּךְ הוּא, ה' הוּא נִסִּי. וְרַבּוֹתֵנוּ דָּרְשׁוּ שֶׁהַקָּבָּ\"ה קְרָאוֹ לְיַעֲקֹב אֵל (מגילה י\"ח); וְדִבְרֵי תוֹרָה כְּפַטִּישׁ יְפֹצֵץ סָלַע (ע' שבת פ\"ח) – מִתְחַלְּקִים לְכַמָּה טְעָמִים, וַאֲנִי לְיַשֵּׁב פְּשׁוּטוֹ שֶׁל מִקְרָא בָּאתִי:", "rashi_en": "רש״י מבהיר שלא המזבח נקרא \"אלהי ישראל\", אלא יעקב קרא למזבח שם לזכר הנס — שהקב״ה היה עמו והצילו. כוונת השם: מי שהוא אל, הקב״ה, הוא אלוהים לי ששמי ישראל. רש״י מביא דוגמה מקבילה ממזבח משה \"ה׳ נסי\".", "note": "", "points": [{"q": "לְפִי פְּשַׁט רַשׁ״י, מַדּוּעַ קָרָא יַעֲקֹב לַמִּזְבֵּחַ \"אֵל אֱלֹהֵי יִשְׂרָאֵל\"?", "options": ["כְּדֵי לְהַזְכִּיר אֶת שֶׁבַח הַקָּב״ה שֶׁהָיָה עִמּוֹ וְהִצִּילוֹ", "כְּדֵי לִרְמוֹז עַל שְׁמוֹ הֶחָדָשׁ \"יִשְׂרָאֵל\" שֶׁקִּיבֵּל מֵהַמַּלְאָךְ", "כְּדֵי לְהוֹדוֹת עַל שֶׁזָּכָה לִקְנוֹת אֶת חֶלְקַת הַשָּׂדֶה בִּשְׁכֶם"], "kasha": "כיצד יש לפרש את השם \"אל אלהי ישראל\" — האם המזבח נקרא אלוהים?", "answer": "לא המזבח נקרא \"אלהי ישראל\", אלא יעקב קרא למזבח שם על שם הנס — שהקב״ה היה עמו והצילו. הכוונה: מי שהוא אל, הקב״ה, הוא לאלוהים לי ששמי ישראל.", "kp": ["לא שהמזבח קרוי אלהי ישראל", "על שם הנס קרא שם המזבח"]}]}, {"id": "34:1.1", "ch": 34, "v": 1, "n": 1, "dh": "בת לאה", "pasuk_html": "וַתֵּצֵ֤א דִינָה֙ <mark>בַּת־לֵאָ֔ה</mark> אֲשֶׁ֥ר יָלְדָ֖ה לְיַעֲקֹ֑ב לִרְא֖וֹת בִּבְנ֥וֹת הָאָֽרֶץ׃", "pasuk_en": "וַתֵּצֵא דִינָה בַּת־לֵאָה אֲשֶׁר יָלְדָה לְיַעֲקֹב לִרְאוֹת בִּבְנוֹת הָאָרֶץ׃", "rashi_he": "בת לאה. וְלֹא בַת יַעֲקֹב? אֶלָּא עַל שֵׁם יְצִיאָתָהּ נִקְרֵאת בַּת לֵאָה, שֶׁאַף הִיא יַצְאָנִית הָיְתָה (בראשית רבה), שֶׁנֶּאֱמַר וַתֵּצֶא לֵאָה לִקְרָאתוֹ (וְעָלֶיהָ מָשְׁלוּ הַמָּשָׁל כְּאִמָּהּ כְּבִתָּהּ):", "rashi_en": "רש״י שואל מדוע הכתוב קורא לדינה \"בת לאה\" ולא \"בת יעקב\". תשובתו: על שם יציאתה נקראת בת לאה, כי גם לאה היתה יצאנית, שנאמר \"ותצא לאה לקראתו\" — כאמה כבתה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ נִקְרֵאת דִּינָה \"בַּת־לֵאָה\" וְלֹא \"בַּת יַעֲקֹב\"?", "options": ["כִּי גַם לֵאָה הָיְתָה יַצְאָנִית, וְדִינָה דוֹמָה לָהּ בִּיצִיאָתָהּ", "כִּי לֵאָה הִיא שֶׁגִּידְּלָה אוֹתָהּ בְּעוֹד יַעֲקֹב עָסַק בְּלִימּוּד", "כִּי הַתּוֹרָה רוֹצָה לְהַדְגִּישׁ שֶׁדִּינָה הָיְתָה מֵהַשְּׁבָטִים הַבְּכוֹרִים"], "kasha": "מדוע התורה מייחסת את דינה ללאה דווקא ולא ליעקב אביה?", "answer": "על שם יציאתה נקראת בת לאה, שאף לאה היתה יצאנית, שנאמר \"ותצא לאה לקראתו\" — כאמה כבתה.", "kp": ["על שם יציאתה נקראת בת לאה", "שאף היא יצאנית היתה"]}]}, {"id": "34:2.1", "ch": 34, "v": 2, "n": 1, "dh": "וישכב אתה", "pasuk_html": "וַיַּ֨רְא אֹתָ֜הּ שְׁכֶ֧ם בֶּן־חֲמ֛וֹר הַֽחִוִּ֖י נְשִׂ֣יא הָאָ֑רֶץ וַיִּקַּ֥ח אֹתָ֛הּ <mark>וַיִּשְׁכַּ֥ב אֹתָ֖הּ</mark> וַיְעַנֶּֽהָ׃", "pasuk_en": "וַיַּרְא אֹתָהּ שְׁכֶם בֶּן־חֲמוֹר הַחִוִּי נְשִׂיא הָאָרֶץ וַיִּקַּח אֹתָהּ וַיִּשְׁכַּב אֹתָהּ וַיְעַנֶּהָ׃", "rashi_he": "וישכב אתה. כְּדַרְכָּהּ:", "rashi_en": "רש״י מבאר שהביטוי \"וישכב אתה\" מתאר ביאה כדרכה, בניגוד ל\"ויענה\" שמתאר ביאה שלא כדרכה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מָה מְתָאֵר הַבִּיטּוּי \"וַיִּשְׁכַּב אֹתָהּ\"?", "options": ["בִּיאָה כְּדַרְכָּהּ", "בִּיאָה שֶׁלֹּא כְּדַרְכָּהּ", "שֶׁהָיָה עִמָּהּ בְּלִי בִּיאָה כְּלָל"], "kasha": "מדוע הפסוק כותב גם \"וישכב\" וגם \"ויענה\" — מה ההבדל ביניהם?", "answer": "\"וישכב אתה\" מתאר ביאה כדרכה, בעוד ש\"ויענה\" מתאר מעשה נוסף ושונה.", "kp": ["כדרכה"]}]}, {"id": "34:2.2", "ch": 34, "v": 2, "n": 2, "dh": "ויענה", "pasuk_html": "וַיַּ֨רְא אֹתָ֜הּ שְׁכֶ֧ם בֶּן־חֲמ֛וֹר הַֽחִוִּ֖י נְשִׂ֣יא הָאָ֑רֶץ וַיִּקַּ֥ח אֹתָ֛הּ וַיִּשְׁכַּ֥ב אֹתָ֖הּ <mark>וַיְעַנֶּֽהָ׃</mark>", "pasuk_en": "וַיַּרְא אֹתָהּ שְׁכֶם בֶּן־חֲמוֹר הַחִוִּי נְשִׂיא הָאָרֶץ וַיִּקַּח אֹתָהּ וַיִּשְׁכַּב אֹתָהּ וַיְעַנֶּהָ׃", "rashi_he": "ויענה. שֶׁלֹּא כְדַרְכָּהּ (בראשית רבה):", "rashi_en": "רש״י מבאר ש\"ויענה\" פירושו ביאה שלא כדרכה, על פי בראשית רבה. זהו שלב נוסף מעבר ל\"וישכב אתה\" שהוא כדרכה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מָה פֵּירוּשׁ \"וַיְעַנֶּהָ\"?", "options": ["בִּיאָה שֶׁלֹּא כְּדַרְכָּהּ", "בִּיאָה כְּדַרְכָּהּ", "שֶׁהִשְׁפִּיל אוֹתָהּ בִּדְבָרִים"], "kasha": "למה הפסוק מוסיף \"ויענה\" אחרי \"וישכב אתה\" — מה זה בא להוסיף?", "answer": "\"ויענה\" פירושו שלא כדרכה, כלומר מעשה נוסף וחמור מעבר לביאה הרגילה.", "kp": ["שלא כדרכה"]}]}, {"id": "34:3.1", "ch": 34, "v": 3, "n": 1, "dh": "על לב הנערה", "pasuk_html": "וַתִּדְבַּ֣ק נַפְשׁ֔וֹ בְּדִינָ֖ה בַּֽת־יַעֲקֹ֑ב וַיֶּֽאֱהַב֙ אֶת־הַֽנַּעֲרָ֔ וַיְדַבֵּ֖ר <mark>עַל־לֵ֥ב הַֽנַּעֲרָֽ׃</mark>", "pasuk_en": "וַתִּדְבַּק נַפְשׁוֹ בְּדִינָה בַּת־יַעֲקֹב וַיֶּאֱהַב אֶת־הַנַּעֲרָ וַיְדַבֵּר עַל־לֵב הַנַּעֲרָ׃", "rashi_he": "על לב הנערה. דְּבָרִים הַמִּתְיַשְּׁבִים עַל הַלֵּב; רְאִי, אָבִיךְ בְּחֶלְקַת שָׂדֶה קְטַנָּה כַּמָּה מָמוֹן בִּזְבֵּז, אֲנִי אַשִּׂיאֵךְ וְתִקְנֶה הָעִיר וְכָל שְׂדוֹתֶיהָ:", "rashi_en": "רש״י מבאר ש\"וידבר על לב הנער\" הם דברי פיתוי שמתיישבים על הלב. שכם אמר לדינה שאביה שילם הון רב על חלקת שדה קטנה, ואילו הוא ישיא אותה ותקנה את כל העיר ושדותיה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מָה טָעַן שְׁכֶם כְּדֵי לְפַתּוֹת אֶת דִּינָה?", "options": ["אָבִיךָ בִּזְבֵּז מָמוֹן עַל שָׂדֶה קְטַנָּה, וַאֲנִי אֶתֵּן לְךָ עִיר שְׁלֵמָה", "אֲנִי נְשִׂיא הָאָרֶץ וְאֶעֱנִיק לְךָ כָּבוֹד גָּדוֹל", "אָבִיךָ יַסְכִּים לַשִּׁידּוּךְ כִּי אֲנִי עָשִׁיר מִמֶּנּוּ"], "kasha": "מה פירוש \"וידבר על לב הנער\" — מה בדיוק אמר לה שכם?", "answer": "שכם דיבר דברים המתיישבים על הלב: אביך בזבז ממון רב על חלקת שדה, ואני אשיאך ותקני את העיר וכל שדותיה.", "kp": ["דברים המתישבים על הלב", "אביך בחלקת שדה קטנה כמה ממון בזבז", "אני אשיאך ותקנה העיר וכל שדותיה"]}]}, {"id": "34:7.1", "ch": 34, "v": 7, "n": 1, "dh": "וכן לא יעשה", "pasuk_html": "וּבְנֵ֨י יַעֲקֹ֜ב בָּ֤אוּ מִן־הַשָּׂדֶה֙ כְּשָׁמְעָ֔ם וַיִּֽתְעַצְּבוּ֙ הָֽאֲנָשִׁ֔ים וַיִּ֥חַר לָהֶ֖ם מְאֹ֑ד כִּֽי־נְבָלָ֞ה עָשָׂ֣ה בְיִשְׂרָאֵ֗ל לִשְׁכַּב֙ אֶת־בַּֽת־יַעֲקֹ֔ב <mark>וְכֵ֖ן לֹ֥א יֵעָשֶֽׂה׃</mark>", "pasuk_en": "וּבְנֵי יַעֲקֹב בָּאוּ מִן־הַשָּׂדֶה כְּשָׁמְעָם וַיִּתְעַצְּבוּ הָאֲנָשִׁים וַיִּחַר לָהֶם מְאֹד כִּי־נְבָלָה עָשָׂה בְיִשְׂרָאֵל לִשְׁכַּב אֶת־בַּת־יַעֲקֹב וְכֵן לֹא יֵעָשֶׂה׃", "rashi_he": "וכן לא יעשה. לְעַנּוֹת אֶת הַבְּתוּלוֹת, שֶׁהָאֻמּוֹת גָּדְרוּ עַצְמָן מִן הָעֲרָיוֹת עַל יְדֵי הַמַּבּוּל (בראשית רבה):", "rashi_en": "רש״י מבאר שהביטוי \"וכן לא יעשה\" מתייחס לאיסור לענות בתולות. אפילו אומות העולם גדרו עצמן מן העריות בעקבות המבול.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ אָמְרוּ בְּנֵי יַעֲקֹב \"וְכֵן לֹא יֵעָשֶׂה\"?", "options": ["אֲפִילּוּ הָאֻומּוֹת גָּדְרוּ עַצְמָן מֵעֲרָיוֹת אַחֲרֵי הַמַּבּוּל", "כִּי הַתּוֹרָה אוֹסֶרֶת עַל בְּנֵי נֹחַ לְעַנּוֹת בְּתוּלוֹת", "כִּי יַעֲקֹב וּבָנָיו נִשְׁבְּעוּ שֶׁלֹּא לְהִתְחַתֵּן עִם בְּנוֹת הָאָרֶץ"], "kasha": "מה הכוונה ב\"וכן לא יעשה\" — מניין שזה דבר שאף אומות העולם אינן עושות?", "answer": "האומות גדרו עצמן מן העריות בעקבות המבול, ולכן עינוי בתולות הוא דבר שאף הן אינן עושות.", "kp": ["לענות את הבתולות", "האמות גדרו עצמן מן העריות על ידי המבול"]}]}, {"id": "34:8.1", "ch": 34, "v": 8, "n": 1, "dh": "חשקה", "pasuk_html": "וַיְדַבֵּ֥ר חֲמ֖וֹר אִתָּ֣ם לֵאמֹ֑ר שְׁכֶ֣ם בְּנִ֗י <mark>חָֽשְׁקָ֤ה</mark> נַפְשׁוֹ֙ בְּבִתְּכֶ֔ם תְּנ֨וּ נָ֥א אֹתָ֛הּ ל֖וֹ לְאִשָּֽׁה׃", "pasuk_en": "וַיְדַבֵּר חֲמוֹר אִתָּם לֵאמֹר שְׁכֶם בְּנִי חָשְׁקָה נַפְשׁוֹ בְּבִתְּכֶם תְּנוּ נָא אֹתָהּ לוֹ לְאִשָּׁה׃", "rashi_he": "חשקה. חָפְצָה:", "rashi_en": "רש״י מפרש שהמילה \"חשקה\" פירושה חפצה, כלומר נפשו של שכם רצתה וחפצה בדינה.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה \"חָשְׁקָה\"?", "options": ["חָפְצָה — רָצְתָה", "נִקְשְׁרָה — הִתְאַהֲבָה", "נִדְבְּקָה — לֹא הִרְפְּתָה"], "kasha": "המילה \"חשקה\" אינה שגורה ויש לבאר את משמעותה.", "answer": "רש״י מפרש ש\"חשקה\" פירושו חפצה, כלומר נפשו של שכם רצתה בבתם.", "kp": ["חפצה"]}]}, {"id": "34:12.1", "ch": 34, "v": 12, "n": 1, "dh": "מהר", "pasuk_html": "הַרְבּ֨וּ עָלַ֤י מְאֹד֙ <mark>מֹ֣הַר</mark> וּמַתָּ֔ן וְאֶ֨תְּנָ֔ה כַּאֲשֶׁ֥ר תֹּאמְר֖וּ אֵלָ֑י וּתְנוּ־לִ֥י אֶת־הַֽנַּעֲרָ֖ לְאִשָּֽׁה׃", "pasuk_en": "הַרְבּוּ עָלַי מְאֹד מֹהַר וּמַתָּן וְאֶתְּנָה כַּאֲשֶׁר תֹּאמְרוּ אֵלָי וּתְנוּ־לִי אֶת־הַנַּעֲרָ לְאִשָּׁה׃", "rashi_he": "מהר. כְּתֻבָּה:", "rashi_en": "רש״י מפרש שהמילה \"מהר\" פירושה כתובה, היינו הסכום הכתוב בשטר הנישואין.", "note": "", "points": [{"q": "מַהוּ הַ\"מֹהַר\" לְפִי רַשִׁ״י?", "options": ["כְּתֻובָּה — שְׁטַר הַנִּישּׁוּאִין", "מַתָּנוֹת יְקָרוֹת לַאֲבִי הַכַּלָּה", "תַּשְׁלוּם מִיָּידִי בִּמְזֻומָּן"], "kasha": "המילה \"מהר\" טעונה ביאור — מה בדיוק מציע שכם לתת?", "answer": "רש״י מפרש ש\"מהר\" היינו כתובה, הסכום הנקוב בשטר הנישואין.", "kp": ["כתבה"]}]}, {"id": "34:13.1", "ch": 34, "v": 13, "n": 1, "dh": "במרמה", "pasuk_html": "וַיַּעֲנ֨וּ בְנֵֽי־יַעֲקֹ֜ב אֶת־שְׁכֶ֨ם וְאֶת־חֲמ֥וֹר אָבִ֛יו <mark>בְּמִרְמָ֖ה</mark> וַיְדַבֵּ֑רוּ אֲשֶׁ֣ר טִמֵּ֔א אֵ֖ת דִּינָ֥ה אֲחֹתָֽם׃", "pasuk_en": "וַיַּעֲנוּ בְנֵי־יַעֲקֹב אֶת־שְׁכֶם וְאֶת־חֲמוֹר אָבִיו בְּמִרְמָה וַיְדַבֵּרוּ אֲשֶׁר טִמֵּא אֵת דִּינָה אֲחֹתָם׃", "rashi_he": "במרמה. בְּחָכְמָה:", "rashi_en": "רש״י מפרש שהמילה \"במרמה\" פירושה בחכמה, כלומר בני יעקב ענו בתחבולה חכמה ולא סתם בשקר גס.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַמִּילָּה \"בְּמִרְמָה\"?", "options": ["בְּחָכְמָה — בְּתַחְבּוּלָה מְחֻושֶּׁבֶת", "בְּשֶׁקֶר גָּמוּר וּבְכַוָּונַת זָדוֹן", "בְּרֹוגֶז וּבְכַעַס עַל שְׁכֶם"], "kasha": "המילה \"במרמה\" משמעה רמאות, וצריך להבין מדוע הכתוב משתמש בביטוי זה לגבי בני יעקב.", "answer": "רש״י מפרש ש\"במרמה\" פירושו בחכמה, כלומר דיברו בתחבולה חכמה.", "kp": ["בחכמה"]}]}, {"id": "34:13.2", "ch": 34, "v": 13, "n": 2, "dh": "אשר טמא", "pasuk_html": "וַיַּעֲנ֨וּ בְנֵֽי־יַעֲקֹ֜ב אֶת־שְׁכֶ֨ם וְאֶת־חֲמ֥וֹר אָבִ֛יו בְּמִרְמָ֖ה וַיְדַבֵּ֑רוּ <mark>אֲשֶׁ֣ר טִמֵּ֔א</mark> אֵ֖ת דִּינָ֥ה אֲחֹתָֽם׃", "pasuk_en": "וַיַּעֲנוּ בְנֵי־יַעֲקֹב אֶת־שְׁכֶם וְאֶת־חֲמוֹר אָבִיו בְּמִרְמָה וַיְדַבֵּרוּ אֲשֶׁר טִמֵּא אֵת דִּינָה אֲחֹתָם׃", "rashi_he": "אשר טמא. הַכָּתוּב אוֹמֵר שֶׁלֹּא הָיְתָה רְמִיָּה, שֶׁהֲרֵי טִמֵּא אֶת דִּינָה אֲחֹתָם (בראשית רבה):", "rashi_en": "רש״י מסביר שהתורה מציינת \"אשר טמא את דינה אחותם\" כדי ללמד שלא היתה כאן רמאות אמיתית, שהרי שכם אכן טימא את דינה והיה מגיע לו.", "note": "", "points": [{"q": "מַדּוּעַ מְצַייֵּן הַכָּתוּב \"אֲשֶׁר טִמֵּא אֶת דִּינָה אֲחוֹתָם\" לְפִי רַשִׁ״י?", "options": ["לְלַמֵּד שֶׁלֹּא הָיְתָה רַמָּאוּת, שֶׁהֲרֵי טִימֵּא אֶת אֲחוֹתָם", "לְתָאֵר אֶת הַסִּיבָּה שֶׁבִּגְלָלָהּ כָּעֲסוּ בְּנֵי יַעֲקֹב", "לְהַסְבִּיר מַדּוּעַ הִסְכִּימוּ בְּנֵי יַעֲקֹב לְהִתְחַתֵּן"], "kasha": "לכאורה המילים \"אשר טמא את דינה אחותם\" מיותרות, שהרי הדבר כבר ידוע.", "answer": "הכתוב מוסיף \"אשר טמא את דינה אחותם\" כדי להצדיק את מעשיהם ולומר שלא היתה רמאות, שהרי שכם טימא את אחותם.", "kp": ["שלא היתה רמיה", "שהרי טמא את דינה אחתם"]}]}, {"id": "34:14.1", "ch": 34, "v": 14, "n": 1, "dh": "חרפה הוא", "pasuk_html": "וַיֹּאמְר֣וּ אֲלֵיהֶ֗ם לֹ֤א נוּכַל֙ לַעֲשׂוֹת֙ הַדָּבָ֣ר הַזֶּ֔ה לָתֵת֙ אֶת־אֲחֹתֵ֔נוּ לְאִ֖ישׁ אֲשֶׁר־ל֣וֹ עָרְלָ֑ה כִּֽי־<mark>חֶרְפָּ֥ה הִ֖וא</mark> לָֽנוּ׃", "pasuk_en": "וַיֹּאמְרוּ אֲלֵיהֶם לֹא נוּכַל לַעֲשׂוֹת הַדָּבָר הַזֶּה לָתֵת אֶת־אֲחֹתֵנוּ לְאִישׁ אֲשֶׁר־לוֹ עָרְלָה כִּי־חֶרְפָּה הִוא לָנוּ׃", "rashi_he": "חרפה הוא. שֶׁמֶץ פְּסוּל הוּא אֶצְלֵנוּ; הַבָּא לְחָרֵף חֲבֵרוֹ הוּא אוֹמֵר לוֹ עָרֵל אַתָּה אוֹ בֶּן עָרֵל. חֶרְפָּה בְּכָל מָקוֹם גִּדּוּף:", "rashi_en": "רש״י מסביר שהמילה \"חרפה\" פירושה גידוף ופסול. בני יעקב טענו שהערלה נחשבת אצלם לשמץ פסול, וכשאדם רוצה לחרף את חברו הוא קורא לו ערל או בן ערל.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מַהוּ הַמַּשְׁמָעוּת שֶׁל \"חֶרְפָּה\" בַּפָּסוּק?", "options": ["גִּידּוּף וְשֶׁמֶץ פָּסוּל", "בּוּשָׁה וְצַעַר", "עֹונֶשׁ חָמוּר"], "kasha": "מדוע בחרו בני יעקב דווקא במילה \"חרפה\" כדי לתאר את הערלה, ולא מילה אחרת.", "answer": "רש״י מסביר ש\"חרפה\" היא לשון גידוף ופסול. הערלה נחשבת שמץ פסול, וכשרוצים לחרף אדם אומרים לו \"ערל אתה\" או \"בן ערל\".", "kp": ["שמץ פסול הוא אצלנו", "חרפה בכל מקום גדוף"]}]}, {"id": "34:15.1", "ch": 34, "v": 15, "n": 1, "dh": "נאות לכם", "pasuk_html": "אַךְ־בְּזֹ֖את <mark>נֵא֣וֹת לָכֶ֑ם</mark> אִ֚ם תִּהְי֣וּ כָמֹ֔נוּ לְהִמֹּ֥ל לָכֶ֖ם כָּל־זָכָֽר׃", "pasuk_en": "אַךְ־בְּזֹאת נֵאוֹת לָכֶם אִם תִּהְיוּ כָמֹנוּ לְהִמֹּל לָכֶם כָּל־זָכָר׃", "rashi_he": "נאות לכם. נִתְרַצֶּה לָכֶם, לְשׁוֹן וַיֵּאֹתוּ (מלכים ב י\"ב):", "rashi_en": "רש״י מסביר שהמילה \"נאות\" אינה מלשון נוי ויופי, אלא מלשון ריצוי והסכמה, כמו \"ויאתו\" שבספר מלכים.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מַהִי מַשְׁמָעוּת הַמִּילָּה \"נֵאוֹת\" בַּפָּסוּק?", "options": ["נִתְרַצֶּה וְנַסְכִּים, מִלְּשׁוֹן \"וַיֵּאָתוּ\"", "נְייַפֶּה וְנִקָּשֵׁט, מִלְּשׁוֹן נוֹי", "נָנוּחַ וְנִשְׁקֹוט, מִלְּשׁוֹן מְנוּחָה"], "kasha": "המילה \"נאות\" עשויה להתפרש כלשון נוי ויופי, וצריך להבהיר שמשמעותה כאן היא הסכמה.", "answer": "רש״י מפרש ש\"נאות\" פירושו נתרצה, מלשון \"ויאתו\" שבמלכים ב׳ י״ב.", "kp": ["נתרצה לכם", "לשון ויאתו"]}]}, {"id": "34:15.2", "ch": 34, "v": 15, "n": 2, "dh": "להמול", "pasuk_html": "אַךְ־בְּזֹ֖את נֵא֣וֹת לָכֶ֑ם אִ֚ם תִּהְי֣וּ כָמֹ֔נוּ <mark>לְהִמֹּ֥ל</mark> לָכֶ֖ם כָּל־זָכָֽר׃", "pasuk_en": "אַךְ־בְּזֹאת נֵאוֹת לָכֶם אִם תִּהְיוּ כָמֹנוּ לְהִמֹּל לָכֶם כָּל־זָכָר׃", "rashi_he": "להמול. לִהְיוֹת נִמּוֹל. אֵינוֹ לְשׁוֹן לִפְעֹל אֶלָּא לְשׁוֹן לְהִפָּעֵל:", "rashi_en": "רש״י מבהיר שהמילה \"להמל\" אינה בלשון פועל יוצא (לפעול על אחרים) אלא בלשון נפעל — להיות נמול, כלומר שהם עצמם יימולו.", "note": "", "points": [{"q": "לְפִי רַשׁ״י, מַהוּ הַבִּנְיָין הַדִּקְדּוּקִי שֶׁל \"לְהִמֹּל\" בַּפָּסוּק?", "options": ["לְשׁוֹן נִפְעַל — לִהְיוֹת נִמּוֹל", "לָשׁוֹן פָּעַל — לָמוּל אֲחֵרִים", "לָשׁוֹן פִּיעֵל — לְרַפֵּא אֶת הַמִּילָּה"], "kasha": "המילה \"להמל\" עשויה להתפרש כציווי פעיל למול אחרים, וצריך להבהיר שהכוונה להיות נמול.", "answer": "רש״י מסביר ש\"להמל\" אינו לשון לפעול אלא לשון להיפעל — להיות נמול.", "kp": ["להיות נמול", "לשון להפעל"]}]}, {"id": "34:16.1", "ch": 34, "v": 16, "n": 1, "dh": "ונתנו", "pasuk_html": "<mark>וְנָתַ֤נּוּ</mark> אֶת־בְּנֹתֵ֙ינוּ֙ לָכֶ֔ם וְאֶת־בְּנֹתֵיכֶ֖ם נִֽקַּֽח־לָ֑נוּ וְיָשַׁ֣בְנוּ אִתְּכֶ֔ם וְהָיִ֖ינוּ לְעַ֥ם אֶחָֽד׃", "pasuk_en": "וְנָתַנּוּ אֶת־בְּנֹתֵינוּ לָכֶם וְאֶת־בְּנֹתֵיכֶם נִקַּח־לָנוּ וְיָשַׁבְנוּ אִתְּכֶם וְהָיִינוּ לְעַם אֶחָד׃", "rashi_he": "ונתנו. נוּ\"ן שְׁנִיָּה מֻדְגֶּשֶׁת לְפִי שֶׁהִיא מְשַׁמֶּשֶׁת בִּמְקוֹם שְׁתֵּי נוּנִי\"ן, וְנָתַנְנוּ:", "rashi_en": "רש״י מסביר שהנו״ן השנייה במילה \"ונתנו\" דגושה, כיוון שהיא משמשת במקום שתי נוני\"ן — \"ונתננו\".", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ הַנּוּ״ן הַשְּׁנִיָּיה שֶׁל \"וְנָתַנּוּ\" דְּגוּשָׁה?", "options": ["כִּי הִיא מְשַׁמֶּשֶׁת בִּמְקוֹם שְׁתֵּי נוּנִי\"ן — וְנָתַנּנוּ", "כִּי הִיא מְצַייֶּנֶת לְשׁוֹן רַבִּים וְלֹא יָחִיד", "כִּי הִיא מַבְדִּילָה בֵּין נְתִינָה לִנְטִיָּיה"], "kasha": "הצורה \"ונתנו\" חסרה נו״ן אחת ביחס לצורה המלאה \"ונתננו\", וצריך להסביר כיצד הדגש מפצה על כך.", "answer": "רש״י מסביר שהנו״ן השנייה דגושה כי היא באה במקום שתי נוני\"ן, והצורה המלאה היא \"ונתננו\".", "kp": ["נון שניה מדגשת", "משמשת במקום שתי נונין"]}]}, {"id": "34:16.2", "ch": 34, "v": 16, "n": 2, "dh": "ואת בנתיכם נקח לנו", "pasuk_html": "וְנָתַ֤נּוּ אֶת־בְּנֹתֵ֙ינוּ֙ לָכֶ֔ם <mark>וְאֶת־בְּנֹתֵיכֶ֖ם נִֽקַּֽח־לָ֑נוּ</mark> וְיָשַׁ֣בְנוּ אִתְּכֶ֔ם וְהָיִ֖ינוּ לְעַ֥ם אֶחָֽד׃", "pasuk_en": "וְנָתַנּוּ אֶת־בְּנֹתֵינוּ לָכֶם וְאֶת־בְּנֹתֵיכֶם נִקַּח־לָנוּ וְיָשַׁבְנוּ אִתְּכֶם וְהָיִינוּ לְעַם אֶחָד׃", "rashi_he": "ואת בנתיכם נקח לנו. אַתָּה מוֹצֵא בַּתְּנַאי שֶׁאָמַר חֲמוֹר לְיַעֲקֹב וּבִתְשׁוּבַת בְּנֵי יַעֲקֹב לַחֲמוֹר, שֶׁתָּלוּ הַחֲשִׁיבוּת בִּבְנֵי יַעֲקֹב לִקַּח בְּנוֹת שְׁכֶם אֶת שֶׁיִּבְחֲרוּ לָהֶם, וּבְנוֹתֵיהֶם יִתְּנוּ לָהֶם לְפִי דַעְתָּם, דִּכְתִיב וְנָתַנּוּ אֶת בְּנֹתֵינוּ – לְפִי דַעְתֵּנוּ, וְאֶת בְּנֹתֵיכֶם נִקַּח לָנוּ – כְּכָל אֲשֶׁר נַחְפֹּץ; וּכְשֶׁדִּבְּרוּ חֲמוֹר וּשְׁכֶם בְּנוֹ אֶל יוֹשְׁבֵי עִירָם הָפְכוּ הַדְּבָרִים, אֶת בְּנֹתָם נִקַּח לָנוּ לְנָשִׁים וְאֶת בְּנֹתֵינוּ נִתֵּן לָהֶם, כְּדֵי לְרַצּוֹתָם שֶׁיֵּאוֹתוּ לְהִמּוֹל:", "rashi_en": "רש״י מראה שבדברי חמור ליעקב ובתשובת בני יעקב, החשיבות ניתנה לבני יעקב — הם בוחרים מי לקחת ומי לתת. אך כשחמור ושכם דיברו אל אנשי עירם, הפכו את הדברים כדי לרצותם שיסכימו להימול.", "note": "", "points": [{"q": "מַה הַשִּׁינּוּי שֶׁרַשִׁ״י מַצְבִּיעַ עָלָיו בֵּין דִּבְרֵי חֲמוֹר לְיַעֲקֹב לְבֵין דְּבָרָיו לְאַנְשֵׁי עִירוֹ?", "options": ["חֲמוֹר הָפַךְ אֶת סֵדֶר הַדְּבָרִים כְּדֵי לְרַצּוֹת אֶת אַנְשֵׁי עִירוֹ שֶׁיִּימּוֹלוּ", "חֲמוֹר הוֹסִיף לְאַנְשֵׁי עִירוֹ תְּנָאִים כַּלְכָּלִיִּים שֶׁלֹּא הוּזְכְּרוּ לְיַעֲקֹב", "חֲמוֹר הִשְׁמִיט מֵאַנְשֵׁי עִירוֹ אֶת דְּרִישַׁת הַמִּילָה כְּדֵי לְשַׁכְנְעָם"], "kasha": "מדוע יש הבדל בניסוח בין מה שחמור אמר ליעקב לבין מה שאמר לאנשי עירו?", "answer": "כשדיבר ליעקב, תלה את החשיבות בבני יעקב — הם בוחרים את הבנות ונותנים את בנותיהם כרצונם. אך לאנשי עירו הפך את הדברים כדי לרצותם שיסכימו להימול.", "kp": ["הפכו הדברים", "כדי לרצותם שיאותו להמול", "שתלו החשיבות בבני יעקב"]}]}, {"id": "34:21.1", "ch": 34, "v": 21, "n": 1, "dh": "שלמים", "pasuk_html": "הָאֲנָשִׁ֨ים הָאֵ֜לֶּה <mark>שְֽׁלֵמִ֧ים</mark> הֵ֣ם אִתָּ֗נוּ וְיֵשְׁב֤וּ בָאָ֙רֶץ֙ וְיִסְחֲר֣וּ אֹתָ֔הּ וְהָאָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת־יָדַ֖יִם לִפְנֵיהֶ֑ם אֶת־בְּנֹתָם֙ נִקַּֽח־לָ֣נוּ לְנָשִׁ֔ים וְאֶת־בְּנֹתֵ֖ינוּ נִתֵּ֥ן לָהֶֽם׃", "pasuk_en": "הָאֲנָשִׁים הָאֵלֶּה שְׁלֵמִים הֵם אִתָּנוּ וְיֵשְׁבוּ בָאָרֶץ וְיִסְחֲרוּ אֹתָהּ וְהָאָרֶץ הִנֵּה רַחֲבַת־יָדַיִם לִפְנֵיהֶם אֶת־בְּנֹתָם נִקַּח־לָנוּ לְנָשִׁים וְאֶת־בְּנֹתֵינוּ נִתֵּן לָהֶם׃", "rashi_he": "שלמים. בְּשָׁלוֹם וּבְלֵב שָׁלֵם:", "rashi_en": "רש״י מפרש ש״שלמים״ פירושו בשלום ובלב שלם, כלומר כוונתם טובה ואין בהם רמאות.", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ״י מְפָרֵשׁ אֶת הַמִּילָּה ״שְׁלָמִים״?", "options": ["בְּשָׁלוֹם וּבְלֵב שָׁלֵם", "שְׁלֵמִים בֶּאֱמוּנָתָם וּבְדָתָם", "שֶׁמּוּכָנִים לְשַׁלֵּם מְחִיר מָלֵא"], "kasha": "מה משמעות ״שלמים״ בהקשר זה — האם הכוונה לשלמות, לשלום, או למשהו אחר?", "answer": "שלמים פירושו בשלום ובלב שלם, כלומר כוונתם כנה.", "kp": ["בשלום ובלב שלם"]}]}, {"id": "34:21.2", "ch": 34, "v": 21, "n": 2, "dh": "והארץ הנה רחבת ידים", "pasuk_html": "הָאֲנָשִׁ֨ים הָאֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗נוּ וְיֵשְׁב֤וּ בָאָ֙רֶץ֙ וְיִסְחֲר֣וּ אֹתָ֔הּ <mark>וְהָאָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת־יָדַ֖יִם</mark> לִפְנֵיהֶ֑ם אֶת־בְּנֹתָם֙ נִקַּֽח־לָ֣נוּ לְנָשִׁ֔ים וְאֶת־בְּנֹתֵ֖ינוּ נִתֵּ֥ן לָהֶֽם׃", "pasuk_en": "הָאֲנָשִׁים הָאֵלֶּה שְׁלֵמִים הֵם אִתָּנוּ וְיֵשְׁבוּ בָאָרֶץ וְיִסְחֲרוּ אֹתָהּ וְהָאָרֶץ הִנֵּה רַחֲבַת־יָדַיִם לִפְנֵיהֶם אֶת־בְּנֹתָם נִקַּח־לָנוּ לְנָשִׁים וְאֶת־בְּנֹתֵינוּ נִתֵּן לָהֶם׃", "rashi_he": "והארץ הנה רחבת ידים. כְּאָדָם שֶׁיָּדוֹ רְחָבָה וּוַתְרָנִית; כְּלוֹמַר, אַל תַּפְסִידוּ כְּלוּם – פְּרַקְמַטְיָא הַרְבֵּה בָּאָה לְכָאן וְאֵין לָהּ קוֹנִים:", "rashi_en": "רש״י מפרש ״רחבת ידים״ כמו אדם שידו רחבה וותרנית, כלומר יש כאן סחורה רבה ואין לה קונים, ולא תפסידו מאומה.", "note": "", "points": [{"q": "מַהוּ הַפֵּירוּשׁ שֶׁל ״רַחֲבַת יָדַיִם״ לְפִי רַשִׁ״י?", "options": ["כְּאָדָם שֶׁיָּדוֹ רְחָבָה וְוַתְרָנִית — יֵשׁ סְחוֹרָה רַבָּה וְאֵין קוֹנִים", "הָאָרֶץ גְּדוֹלָה וּרְחָבָה וְיֵשׁ בָּהּ מָקוֹם לַכֻּולָּם", "יֵשׁ בָּאָרֶץ אֲדָמוֹת חַקְלָאִיּוֹת רַבּוֹת שֶׁטֶּרֶם עֻובְּדוּ"], "kasha": "מה פירוש הביטוי ״רחבת ידים״ — האם הכוונה לגודל הארץ או למשמעות אחרת?", "answer": "רש״י מפרש שהביטוי דומה לאדם שידו רחבה וותרנית: יש כאן סחורה רבה ואין לה קונים, כלומר לא תפסידו.", "kp": ["כאדם שידו רחבה וותרנית", "פרקמטיא הרבה באה לכאן ואין לה קונים"]}]}, {"id": "34:22.1", "ch": 34, "v": 22, "n": 1, "dh": "בהמול", "pasuk_html": "אַךְ־בְּ֠זֹאת יֵאֹ֨תוּ לָ֤נוּ הָאֲנָשִׁים֙ לָשֶׁ֣בֶת אִתָּ֔נוּ לִהְי֖וֹת לְעַ֣ם אֶחָ֑ד <mark>בְּהִמּ֥וֹל</mark> לָ֙נוּ֙ כָּל־זָכָ֔ר כַּאֲשֶׁ֖ר הֵ֥ם נִמֹּלִֽים׃", "pasuk_en": "אַךְ־בְּזֹאת יֵאֹתוּ לָנוּ הָאֲנָשִׁים לָשֶׁבֶת אִתָּנוּ לִהְיוֹת לְעַם אֶחָד בְּהִמּוֹל לָנוּ כָּל־זָכָר כַּאֲשֶׁר הֵם נִמֹּלִים׃", "rashi_he": "בהמול. בִּהְיוֹת נִמּוֹל:", "rashi_en": "רש״י מפרש ש״בהמול״ פירושו בהיות נמול, כלומר צורת הפועל מציינת מצב של מילה.", "note": "", "points": [{"q": "כֵּיצַד רַשִׁ״י מְבָאֵר אֶת הַמִּילָּה ״בְּהִמּוֹל״?", "options": ["בִּהְיוֹת נָמוּל", "בִּזְמַן שֶׁיָּמוּלוּ אוֹתָם", "עַל יְדֵי מוֹהֵל"], "kasha": "מה המשמעות המדויקת של צורת הפועל ״בהמול״?", "answer": "רש״י מפרש ש״בהמול״ פירושו בהיות נמול.", "kp": ["בהיות נמול"]}]}, {"id": "34:23.1", "ch": 34, "v": 23, "n": 1, "dh": "אך נאותה להם", "pasuk_html": "מִקְנֵהֶ֤ם וְקִנְיָנָם֙ וְכָל־בְּהֶמְתָּ֔ם הֲל֥וֹא לָ֖נוּ הֵ֑ם <mark>אַ֚ךְ נֵא֣וֹתָה לָהֶ֔ם</mark> וְיֵשְׁב֖וּ אִתָּֽנוּ׃", "pasuk_en": "מִקְנֵהֶם וְקִנְיָנָם וְכָל־בְּהֶמְתָּם הֲלוֹא לָנוּ הֵם אַךְ נֵאוֹתָה לָהֶם וְיֵשְׁבוּ אִתָּנוּ׃", "rashi_he": "אך נאותה להם. לְדָבָר זֶה, וְעַל יְדֵי כֵן יֵשְׁבוּ אִתָּנוּ:", "rashi_en": "רש\"י מפרש שחמור ושכם אמרו לאנשי עירם: נסכים לתנאי המילה, ועל ידי כך בני יעקב יתיישבו אתנו ורכושם יהיה לנו.", "note": "", "points": [{"q": "לְפִי רַשׁ\"י, מַה פֵּירוּשׁ \"אַךְ נָאוֹתָה לָהֶם\"?", "options": ["נַסְכִּים לַדָּבָר הַזֶּה, וְעַל יְדֵי כֵן יֵשְׁבוּ אִתָּנוּ", "נִלָּחֵם בָּהֶם וְנַכְרִיחַ אוֹתָם לְהִישָּׁאֵר", "נִיתֵּן לָהֶם מַתָּנוֹת כְּדֵי לְפַיְּיסָם"], "kasha": "הביטוי \"נאותה\" אינו שגור, וצריך ביאור מה בדיוק מציעים חמור ושכם לאנשי עירם.", "answer": "\"נאותה\" פירושו נסכים לתנאי שהציבו בני יעקב, ובזכות הסכמה זו הם יתיישבו אתנו.", "kp": ["לדבר זה ועל ידי כן ישבו אתנו"]}]}, {"id": "34:25.1", "ch": 34, "v": 25, "n": 1, "dh": "שני בני יעקב", "pasuk_html": "וַיְהִי֩ בַיּ֨וֹם הַשְּׁלִישִׁ֜י בִּֽהְיוֹתָ֣ם כֹּֽאֲבִ֗ים וַיִּקְח֣וּ <mark>שְׁנֵֽי־בְנֵי־יַ֠עֲקֹב</mark> שִׁמְע֨וֹן וְלֵוִ֜י אֲחֵ֤י דִינָה֙ אִ֣ישׁ חַרְבּ֔וֹ וַיָּבֹ֥אוּ עַל־הָעִ֖יר בֶּ֑טַח וַיַּֽהַרְג֖וּ כָּל־זָכָֽר׃", "pasuk_en": "וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיוֹתָם כֹּאֲבִים וַיִּקְחוּ שְׁנֵי־בְנֵי־יַעֲקֹב שִׁמְעוֹן וְלֵוִי אֲחֵי דִינָה אִישׁ חַרְבּוֹ וַיָּבֹאוּ עַל־הָעִיר בֶּטַח וַיַּהַרְגוּ כָּל־זָכָר׃", "rashi_he": "שני בני יעקב. בָּנָיו הָיוּ, וְאַעַ\"פִּ כֵן נָהֲגוּ עַצְמָן שִׁמְעוֹן וְלֵוִי כִּשְׁאָר אֲנָשִׁים שֶׁאֵינָם בָּנָיו, שֶׁלֹּא נָטְלוּ עֵצָה הֵימֶנּוּ (בראשית רבה):", "rashi_en": "רש\"י מסביר שהתורה כותבת \"שני בני יעקב\" אף שזה ידוע, כדי ללמד שנהגו כזרים שאינם בניו, שהרי לא נטלו עצה מאביהם.", "note": "", "points": [{"q": "מַדּוּעַ מַדְגִּישָׁה הַתּוֹרָה \"שְׁנֵי־בְנֵי־יַעֲקֹב\", לְפִי רַשִׁ\"י?", "options": ["לְלַמֵּד שֶׁנָּהֲגוּ כְּזָרִים וְלֹא נָטְלוּ עֵצָה מֵאֲבִיהֶם", "לְהַדְגִּישׁ שֶׁרַק שְׁנַייִם מִכָּל הָאַחִים יָצְאוּ לַמִּלְחָמָה", "לְרַמֵּוז שֶׁיַּעֲקֹב שָׁלַח אוֹתָם בְּעַצְמוֹ"], "kasha": "מדוע התורה מציינת \"שני בני יעקב\" — הרי ידוע ששמעון ולוי הם בניו?", "answer": "התורה מדגישה שהם בניו כדי ללמד שלמרות זאת נהגו כאנשים זרים ולא נטלו עצה מיעקב.", "kp": ["נהגו עצמן שמעון ולוי כשאר אנשים שאינם בניו", "שלא נטלו עצה הימנו"]}]}, {"id": "34:25.2", "ch": 34, "v": 25, "n": 2, "dh": "אחי דינה", "pasuk_html": "וַיְהִי֩ בַיּ֨וֹם הַשְּׁלִישִׁ֜י בִּֽהְיוֹתָ֣ם כֹּֽאֲבִ֗ים וַיִּקְח֣וּ שְׁנֵֽי־בְנֵי־יַ֠עֲקֹב שִׁמְע֨וֹן וְלֵוִ֜י <mark>אֲחֵ֤י דִינָה֙</mark> אִ֣ישׁ חַרְבּ֔וֹ וַיָּבֹ֥אוּ עַל־הָעִ֖יר בֶּ֑טַח וַיַּֽהַרְג֖וּ כָּל־זָכָֽר׃", "pasuk_en": "וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיוֹתָם כֹּאֲבִים וַיִּקְחוּ שְׁנֵי־בְנֵי־יַעֲקֹב שִׁמְעוֹן וְלֵוִי אֲחֵי דִינָה אִישׁ חַרְבּוֹ וַיָּבֹאוּ עַל־הָעִיר בֶּטַח וַיַּהַרְגוּ כָּל־זָכָר׃", "rashi_he": "אחי דינה. לְפִי שֶׁמָּסְרוּ עַצְמָן עָלֶיהָ נִקְרְאוּ אַחֶיהָ:", "rashi_en": "רש\"י מסביר שהכתוב קורא לשמעון ולוי \"אחי דינה\" כי הם מסרו את נפשם עליה, ולכן זכו לתואר זה.", "note": "", "points": [{"q": "מַדּוּעַ נִקְרְאוּ שִׁמְעוֹן וְלֵוִי \"אֲחֵי דִינָה\" דַּוְוקָא, לְפִי רַשִׁ\"י?", "options": ["כִּי מָסְרוּ נַפְשָׁם עָלֶיהָ וְלָכֵן נִקְרְאוּ אַחֶיהָ", "כִּי הָיוּ אַחֶיהָ מֵאוֹתָהּ אֵם (לֵאָה)", "כִּי דִינָה בִּיקְּשָׁה מֵהֶם בְּמִפֹורָשׁ לִנְקֹום"], "kasha": "כל בני יעקב הם אחי דינה, מדוע הכתוב מייחד דווקא את שמעון ולוי בתואר זה?", "answer": "לפי שמסרו עצמם עליה נקראו אחיה — התואר ניתן בזכות מעשיהם, לא רק בזכות קרבת משפחה.", "kp": ["לפי שמסרו עצמן עליה נקראו אחיה"]}]}, {"id": "34:25.3", "ch": 34, "v": 25, "n": 3, "dh": "בטח", "pasuk_html": "וַיְהִי֩ בַיּ֨וֹם הַשְּׁלִישִׁ֜י בִּֽהְיוֹתָ֣ם כֹּֽאֲבִ֗ים וַיִּקְח֣וּ שְׁנֵֽי־בְנֵי־יַ֠עֲקֹב שִׁמְע֨וֹן וְלֵוִ֜י אֲחֵ֤י דִינָה֙ אִ֣ישׁ חַרְבּ֔וֹ וַיָּבֹ֥אוּ עַל־הָעִ֖יר <mark>בֶּ֑טַח</mark> וַיַּֽהַרְג֖וּ כָּל־זָכָֽר׃", "pasuk_en": "וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיוֹתָם כֹּאֲבִים וַיִּקְחוּ שְׁנֵי־בְנֵי־יַעֲקֹב שִׁמְעוֹן וְלֵוִי אֲחֵי דִינָה אִישׁ חַרְבּוֹ וַיָּבֹאוּ עַל־הָעִיר בֶּטַח וַיַּהַרְגוּ כָּל־זָכָר׃", "rashi_he": "בטח. שֶׁהָיוּ כוֹאֲבִים וּמִ\"אַ בְּטוּחִים הָיוּ עַל כֹּחוֹ שֶׁל זָקֵן (בראשית רבה):", "rashi_en": "רש\"י מפרש את \"בטח\" בשני אופנים: לפי הפשט — באו בביטחון כי אנשי שכם היו כואבים מהמילה. לפי המדרש — סמכו על כוחו של יעקב אביהם.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ\"י אֶת הַמִּילָּה \"בֶּטַח\" לְפִי פְּשׁוּטוֹ?", "options": ["בָּאוּ בְּבִיטָּחוֹן כִּי אַנְשֵׁי שְׁכֶם הָיוּ כּוֹאֲבִים", "סָמְכוּ עַל כֹּוחוֹ שֶׁל יַעֲקֹב אֲבִיהֶם", "בָּטְחוּ בַּה' שֶׁיַּעֲזוֹר לָהֶם בַּמִּלְחָמָה"], "kasha": "המילה \"בטח\" טעונה ביאור — מדוע היו שמעון ולוי בטוחים כל כך בבואם על עיר שלמה?", "answer": "לפי הפשט, באו בביטחון כי אנשי שכם היו כואבים מהמילה ולא יכלו להילחם.", "kp": ["שהיו כואבים"]}, {"q": "מַהוּ הַפֵּירוּשׁ הַמִּדְרָשִׁי לְ\"בֶּטַח\", לְפִי רַשִׁ\"י?", "options": ["סָמְכוּ עַל כֹּוחוֹ שֶׁל יַעֲקֹב אֲבִיהֶם", "בָּטְחוּ שֶׁאַנְשֵׁי הָעִיר לֹא יַבְחִינוּ בָּהֶם", "יָדְעוּ שֶׁאַנְשֵׁי שְׁכֶם כְּבָר בָּרְחוּ מֵהָעִיר"], "kasha": "רש\"י מביא פירוש נוסף מהמדרש מלבד הפשט — מה טעם הביטחון לפי דרך הדרש?", "answer": "לפי המדרש, שמעון ולוי היו בטוחים בכוחו של יעקב (\"הזקן\") שיעמוד לצדם.", "kp": ["בטוחים היו על כחו של זקן"]}]}, {"id": "34:27.1", "ch": 34, "v": 27, "n": 1, "dh": "על החללים", "pasuk_html": "בְּנֵ֣י יַעֲקֹ֗ב בָּ֚אוּ <mark>עַל־הַ֣חֲלָלִ֔ים</mark> וַיָּבֹ֖זּוּ הָעִ֑יר אֲשֶׁ֥ר טִמְּא֖וּ אֲחוֹתָֽם׃", "pasuk_en": "בְּנֵי יַעֲקֹב בָּאוּ עַל־הַחֲלָלִים וַיָּבֹזּוּ הָעִיר אֲשֶׁר טִמְּאוּ אֲחוֹתָם׃", "rashi_he": "על החללים. לְפַשֵּׁט הַחֲלָלִים:", "rashi_en": "רש״י מפרש שבני יעקב באו על החללים כדי לפשוט אותם, כלומר ליטול את בגדיהם וחפציהם של ההרוגים.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"בָּאוּ עַל־הַחֲלָלִים\" לְפִי רַשִׁ״י?", "options": ["בָּאוּ לִפְשׁוֹט אֶת הַהֲרוּגִים מֵרְכוּשָׁם", "בָּאוּ לִקְבּוֹר אֶת הַהֲרוּגִים בְּכָבוֹד", "בָּאוּ לְהִילָּחֵם עִם חַייָּלִים שֶׁנּוֹתְרוּ בַּחַיִּים"], "kasha": "מה משמעות הביטוי \"על החללים\" — מה עשו בני יעקב לחללים?", "answer": "\"על החללים\" פירושו לפשט את החללים, כלומר ליטול את שלל ההרוגים.", "kp": ["לפשט החללים"]}]}, {"id": "34:29.1", "ch": 34, "v": 29, "n": 1, "dh": "חילם", "pasuk_html": "וְאֶת־כָּל־<mark>חֵילָ֤ם</mark> וְאֶת־כָּל־טַפָּם֙ וְאֶת־נְשֵׁיהֶ֔ם שָׁב֖וּ וַיָּבֹ֑זּוּ וְאֵ֖ת כָּל־אֲשֶׁ֥ר בַּבָּֽיִת׃", "pasuk_en": "וְאֶת־כָּל־חֵילָם וְאֶת־כָּל־טַפָּם וְאֶת־נְשֵׁיהֶם שָׁבוּ וַיָּבֹזּוּ וְאֵת כָּל־אֲשֶׁר בַּבָּיִת׃", "rashi_he": "חילם. מָמוֹנָם וְכֵן עָשָׂה לִי אֶת הַחַיִל הַזֶּה (דברים ח'), וְיִשְׂרָאֵל עֹשֶׂה חָיִל (במדבר כ\"ד), וְעָזְבוּ לַאֲחֵרִים חֵילָם (תהילים מ\"ט):", "rashi_en": "רש״י מפרש שהמילה \"חילם\" פירושה ממונם, ומביא שלושה פסוקים נוספים שבהם \"חיל\" משמש במובן של ממון ועושר.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילָּה \"חֵילָם\" לְפִי רַשִׁ״י?", "options": ["מָמוֹנָם וּרְכוּשָׁם", "צְבָאָם וְלוֹחֲמֵיהֶם", "כֹּוחָם וּגְבוּרָתָם"], "kasha": "המילה \"חילם\" עשויה להתפרש כצבא או כוח — מה משמעותה כאן?", "answer": "\"חילם\" פירושו ממונם, כמו \"עשה לי את החיל הזה\" וכדומה.", "kp": ["ממונם"]}]}, {"id": "34:29.2", "ch": 34, "v": 29, "n": 2, "dh": "שבו", "pasuk_html": "וְאֶת־כָּל־חֵילָ֤ם וְאֶת־כָּל־טַפָּם֙ וְאֶת־נְשֵׁיהֶ֔ם <mark>שָׁב֖וּ</mark> וַיָּבֹ֑זּוּ וְאֵ֖ת כָּל־אֲשֶׁ֥ר בַּבָּֽיִת׃", "pasuk_en": "וְאֶת־כָּל־חֵילָם וְאֶת־כָּל־טַפָּם וְאֶת־נְשֵׁיהֶם שָׁבוּ וַיָּבֹזּוּ וְאֵת כָּל־אֲשֶׁר בַּבָּיִת׃", "rashi_he": "שבו. לְשׁוֹן שְׁבִיָּה, לְפִיכָךְ טַעֲמוֹ מִלְּרָע:", "rashi_en": "רש״י מפרש ש\"שבו\" הוא לשון שביה (לקיחה בשבי), ולכן הטעם מלרע — על ההברה האחרונה.", "note": "", "points": [{"q": "כֵּיצַד מוֹכִיחַ רַשִׁ״י שֶׁהַמִּילָּה \"שָׁבוּ\" הִיא לְשׁוֹן שְׁבִיָּה?", "options": ["מִכָּךְ שֶׁהַטַּעַם מִלְּרַע, עַל הַהַבְרָה הָאַחֲרוֹנָה", "מִכָּךְ שֶׁהַטַּעַם מִלְּעֵיל, עַל הַהַבְרָה הָרִאשׁוֹנָה", "מֵהַהֶקְשֵׁר בִּלְבַד, בְּלִי רְאִיָּה מֵהַטַּעַם"], "kasha": "האם \"שבו\" הוא לשון ישיבה או לשון שביה?", "answer": "\"שבו\" הוא לשון שביה, ולכן טעמו מלרע — שאילו היה לשון ישיבה היה מלעיל.", "kp": ["לשון שביה", "טעמו מלרע"]}]}, {"id": "34:30.1", "ch": 34, "v": 30, "n": 1, "dh": "עכרתם", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־שִׁמְע֣וֹן וְאֶל־לֵוִי֮ <mark>עֲכַרְתֶּ֣ם</mark> אֹתִי֒ לְהַבְאִישֵׁ֙נִי֙ בְּיֹשֵׁ֣ב הָאָ֔רֶץ בַּֽכְּנַעֲנִ֖י וּבַפְּרִזִּ֑י וַאֲנִי֙ מְתֵ֣י מִסְפָּ֔ר וְנֶאֶסְפ֤וּ עָלַי֙ וְהִכּ֔וּנִי וְנִשְׁמַדְתִּ֖י אֲנִ֥י וּבֵיתִֽי׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־שִׁמְעוֹן וְאֶל־לֵוִי עֲכַרְתֶּם אֹתִי לְהַבְאִישֵׁנִי בְּיֹשֵׁב הָאָרֶץ בַּכְּנַעֲנִי וּבַפְּרִזִּי וַאֲנִי מְתֵי מִסְפָּר וְנֶאֶסְפוּ עָלַי וְהִכּוּנִי וְנִשְׁמַדְתִּי אֲנִי וּבֵיתִי׃", "rashi_he": "עכרתם. לְשׁוֹן מַיִם עֲכוּרִים, אֵין דַּעְתִּי צְלוּלָה עַכְשָׁו (ברכות כ\"ה). וְאַגָּדָה, צְלוּלָה הָיְתָה הֶחָבִית וַעֲכַרְתֶּם אוֹתָהּ (בראשית רבה) – מָסֹרֶת הָיְתָה בְּיַד כְּנַעֲנִים שֶׁיִּפְּלוּ בְּיַד בְּנֵי יַעֲקֹב, אֶלָּא שֶׁהָיוּ אוֹמְרִים עַד אֲשֶׁר תִּפְרֶה וְנָחַלְתָּ אֶת הָאָרֶץ (שמות כ\"ג), לְפִיכָךְ הָיוּ שׁוֹתְקִין:", "rashi_en": "רש״י מפרש \"עכרתם\" מלשון מים עכורים — שדעתו של יעקב אינה צלולה עכשיו. ומוסיף מדרש: הכנענים ידעו שעתידים ליפול ביד בני יעקב, אבל סברו שזה יהיה רק כשיתרבו, ולכן שתקו עד עתה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"עֲכַרְתֶּם\" לְפִי הַפְּשָׁט בְּרַשִׁ״י?", "options": ["לְשׁוֹן מַיִם עֲכוּרִים — דַּעְתִּי אֵינָהּ צְלוּלָה", "לָשׁוֹן עֲקִירָה — עֲקַרְתֶּם אוֹתִי מִן הָאָרֶץ", "לְשׁוֹן עִכָּבָה — עִיכַּבְתֶּם אֶת יְשׁוּעָתִי"], "kasha": "מהו שורש המילה \"עכרתם\" ומה משמעותה?", "answer": "\"עכרתם\" מלשון מים עכורים, כלומר אין דעתי צלולה עכשיו.", "kp": ["לשון מים עכורים", "אין דעתי צלולה"]}, {"q": "לְפִי הַמִּדְרָשׁ שֶׁמֵּבִיא רַשׁ״י, מַדּוּעַ שָׁתְקוּ הַכְּנַעֲנִים עַד עַכְשָׁיו?", "options": ["כִּי יָדְעוּ שֶׁיִּיפְּלוּ בְּיַד בְּנֵי יַעֲקֹב, אַךְ סָבְרוּ שֶׁרַק כְּשֶׁיִּתְרַבּוּ", "כִּי פָּחֲדוּ מִכֹּוחָם הַצְּבָאִי שֶׁל בְּנֵי יַעֲקֹב", "כִּי הָיָה לָהֶם בְּרִית שָׁלוֹם עִם אַבְרָהָם אָבִינוּ"], "kasha": "אם הכנענים היו חזקים יותר, מדוע לא תקפו את יעקב קודם לכן?", "answer": "הכנענים ידעו שעתידים ליפול ביד בני יעקב, אבל חשבו שזה יקרה רק כשיתרבו וינחלו את הארץ, ולכן שתקו.", "kp": ["צלולה היתה החבית ועכרתם אותה", "עד אשר תפרה ונחלת את הארץ"]}]}, {"id": "34:30.2", "ch": 34, "v": 30, "n": 2, "dh": "מתי מספר", "pasuk_html": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־שִׁמְע֣וֹן וְאֶל־לֵוִי֮ עֲכַרְתֶּ֣ם אֹתִי֒ לְהַבְאִישֵׁ֙נִי֙ בְּיֹשֵׁ֣ב הָאָ֔רֶץ בַּֽכְּנַעֲנִ֖י וּבַפְּרִזִּ֑י וַאֲנִי֙ <mark>מְתֵ֣י מִסְפָּ֔ר</mark> וְנֶאֶסְפ֤וּ עָלַי֙ וְהִכּ֔וּנִי וְנִשְׁמַדְתִּ֖י אֲנִ֥י וּבֵיתִֽי׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־שִׁמְעוֹן וְאֶל־לֵוִי עֲכַרְתֶּם אֹתִי לְהַבְאִישֵׁנִי בְּיֹשֵׁב הָאָרֶץ בַּכְּנַעֲנִי וּבַפְּרִזִּי וַאֲנִי מְתֵי מִסְפָּר וְנֶאֶסְפוּ עָלַי וְהִכּוּנִי וְנִשְׁמַדְתִּי אֲנִי וּבֵיתִי׃", "rashi_he": "מתי מספר. אֲנָשִׁים מוּעָטִים:", "rashi_en": "רש״י מפרש שהביטוי ״מתי מספר״ פירושו אנשים מועטים, כלומר יעקב חשש כי בני משפחתו מעטים מדי להילחם בתושבי הארץ.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ״י אֶת הַבִּיטּוּי ״מְתֵי מִסְפָּר״?", "options": ["אֲנָשִׁים מוּעָטִים", "אֲנָשִׁים שֶׁאֵין לָהֶם חֲשִׁיבוּת", "אֲנָשִׁים שֶׁלֹּא נִסְפְּרוּ בַּמִּנְיָין"], "kasha": "לא ברור מה פירוש הביטוי ״מתי מספר״ שאומר יעקב.", "answer": "רש״י מפרש ש״מתי מספר״ פירושו אנשים מועטים.", "kp": ["אנשים מועטים"]}]}, {"id": "34:31.1", "ch": 34, "v": 31, "n": 1, "dh": "הכזונה", "pasuk_html": "וַיֹּאמְר֑וּ <mark>הַכְזוֹנָ֕ה</mark> יַעֲשֶׂ֖ה אֶת־אֲחוֹתֵֽנוּ׃ (פ)", "pasuk_en": "וַיֹּאמְרוּ הַכְזוֹנָה יַעֲשֶׂה אֶת־אֲחוֹתֵנוּ׃", "rashi_he": "הכזונה. הֶפְקֵר:", "rashi_en": "רש״י מפרש שהמילה ״זונה״ כאן אינה במובן הרגיל אלא במשמעות של הפקר, כלומר: האם ייעשה באחותנו כבדבר מופקר?", "note": "", "points": [{"q": "מַהִי מַשְׁמָעוּת ״זוֹנָה״ לְפִי רַשִׁ״י?", "options": ["הֶפְקֵר", "אִישָּׁה שֶׁמְּקַבֶּלֶת תַּשְׁלוּם תְּמוּרַת בִּיאָה", "אִישָּׁה שֶׁנִּטְמְאָה בַּעֲבֵירָה"], "kasha": "המילה ״זונה״ אינה מתאימה למה שקרה לדינה, שנלקחה בעל כורחה.", "answer": "רש״י מפרש ש״זונה״ כאן פירושו הפקר — דבר מופקר שכל אחד יכול לעשות בו כרצונו.", "kp": ["הפקר"]}]}, {"id": "34:31.2", "ch": 34, "v": 31, "n": 2, "dh": "את אחותנו", "pasuk_html": "וַיֹּאמְר֑וּ הַכְזוֹנָ֕ה יַעֲשֶׂ֖ה <mark>אֶת־אֲחוֹתֵֽנוּ׃</mark> (פ)", "pasuk_en": "וַיֹּאמְרוּ הַכְזוֹנָה יַעֲשֶׂה אֶת־אֲחוֹתֵנוּ׃", "rashi_he": "את אחותנו. יָת אֲחָתָנָא:", "rashi_en": "רש״י מביא את תרגום אונקלוס ״ית אחתנא״, שמשמעותו ״לאחותנו״, כלומר המילה ״את״ כאן היא במובן של ״ל״.", "note": "", "points": [{"q": "כֵּיצַד מְתַרְגֵּם אוּנְקְלוֹס אֶת ״אֶת אֲחוֹתֵנוּ״ לְפִי רַשִׁ״י?", "options": ["יָת אֲחָתָנָא — לַאֲחוֹתֵנוּ", "עִם אַחְתְּנָא — עִם אֲחוֹתֵנוּ", "בְּרַת אֲחָתָנָא — בַּת אֲחוֹתֵנוּ"], "kasha": "המילה ״את״ יכולה להתפרש כסימן מושא ישיר או כמילת יחס.", "answer": "רש״י מביא את תרגום אונקלוס ״ית אחתנא״, כלומר ״לאחותנו״.", "kp": ["ית אחתנא"]}]}, {"id": "35:1.1", "ch": 35, "v": 1, "n": 1, "dh": "קום עלה", "pasuk_html": "וַיֹּ֤אמֶר אֱלֹהִים֙ אֶֽל־יַעֲקֹ֔ב <mark>ק֛וּם עֲלֵ֥ה</mark> בֵֽית־אֵ֖ל וְשֶׁב־שָׁ֑ם וַעֲשֵׂה־שָׁ֣ם מִזְבֵּ֔חַ לָאֵל֙ הַנִּרְאֶ֣ה אֵלֶ֔יךָ בְּבָרְחֲךָ֔ מִפְּנֵ֖י עֵשָׂ֥ו אָחִֽיךָ׃", "pasuk_en": "וַיֹּאמֶר אֱלֹהִים אֶל־יַעֲקֹב קוּם עֲלֵה בֵית־אֵל וְשֶׁב־שָׁם וַעֲשֵׂה־שָׁם מִזְבֵּחַ לָאֵל הַנִּרְאֶה אֵלֶיךָ בְּבָרְחֲךָ מִפְּנֵי עֵשָׂו אָחִיךָ׃", "rashi_he": "קום עלה. לְפִי שֶׁאֵחַרְתָּ בַּדֶּרֶךְ נֶעֱנַשְׁתָּ וּבָא לְךָ זֹאת מִבִּתְּךָ (תנחומא):", "rashi_en": "רש״י מסביר שהקב״ה אמר ליעקב לעלות לבית אל משום שהתעכב בדרך ולא מילא את נדרו, ובעקבות כך נענש במה שאירע לדינה בתו.", "note": "", "points": [{"q": "מַדּוּעַ, לְפִי רַשִׁ״י, נֶעֱנַשׁ יַעֲקֹב בְּמַעֲשֵׂה דִינָה?", "options": ["מִפְּנֵי שֶׁאִיחֵר בַּדֶּרֶךְ וְלֹא עָלָה לְבֵית אֵל", "מִפְּנֵי שֶׁלֹּא חִינֵּךְ אֶת בָּנָיו כָּרָאוּי", "מִפְּנֵי שֶׁלֹּא נִפְרַד מֵעֵשָׂו כַּהֲלָכָה"], "kasha": "מה הקשר בין הציווי ״קום עלה בית אל״ לבין מעשה דינה שסופר קודם?", "answer": "רש״י מסביר שיעקב איחר בדרכו ולא עלה לבית אל בזמן, ולכן נענש במה שאירע לבתו.", "kp": ["שאחרת בדרך נענשת", "בא לך זאת מבתך"]}]}, {"id": "35:2.1", "ch": 35, "v": 2, "n": 1, "dh": "הנכר", "pasuk_html": "וַיֹּ֤אמֶר יַעֲקֹב֙ אֶל־בֵּית֔וֹ וְאֶ֖ל כָּל־אֲשֶׁ֣ר עִמּ֑וֹ הָסִ֜רוּ אֶת־אֱלֹהֵ֤י <mark>הַנֵּכָר֙</mark> אֲשֶׁ֣ר בְּתֹכְכֶ֔ם וְהִֽטַּהֲר֔וּ וְהַחֲלִ֖יפוּ שִׂמְלֹתֵיכֶֽם׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־בֵּיתוֹ וְאֶל כָּל־אֲשֶׁר עִמּוֹ הָסִרוּ אֶת־אֱלֹהֵי הַנֵּכָר אֲשֶׁר בְּתֹכְכֶם וְהִטַּהֲרוּ וְהַחֲלִיפוּ שִׂמְלֹתֵיכֶם׃", "rashi_he": "הנכר. שֶׁיֵּשׁ בְּיֶדְכֶם מִשָּׁלָל שֶׁל שְׁכֶם:", "rashi_en": "רש\"י מסביר שאלהי הנכר שיעקב דרש להסיר היו מתוך השלל שבני יעקב לקחו מאנשי שכם.", "note": "", "points": [{"q": "מֵהֵיכָן הָיוּ אֱלֹהֵי הַנֵּכָר שֶׁיַּעֲקֹב צִיווָּה לְהָסִיר?", "options": ["מִשְּׁלַל שְׁכֶם שֶׁהָיָה בְּיָדָם", "מִבֵּית לָבָן שֶׁהֵבִיאוּ עִמָּם מֵחָרָן", "מֵעַמֵּי כְּנַעַן שֶׁסָּחֲרוּ עִמָּם"], "kasha": "מדוע כינה אותם \"אלהי הנכר\" ולא סתם \"עבודה זרה\" — מה מקורם המיוחד?", "answer": "רש\"י מפרש שאלהי הנכר הם אלה שהיו בידם משלל שכם.", "kp": ["שיש בידכם משלל של שכם"]}]}, {"id": "35:2.2", "ch": 35, "v": 2, "n": 2, "dh": "והטהרו", "pasuk_html": "וַיֹּ֤אמֶר יַעֲקֹב֙ אֶל־בֵּית֔וֹ וְאֶ֖ל כָּל־אֲשֶׁ֣ר עִמּ֑וֹ הָסִ֜רוּ אֶת־אֱלֹהֵ֤י הַנֵּכָר֙ אֲשֶׁ֣ר בְּתֹכְכֶ֔ם <mark>וְהִֽטַּהֲר֔וּ</mark> וְהַחֲלִ֖יפוּ שִׂמְלֹתֵיכֶֽם׃", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־בֵּיתוֹ וְאֶל כָּל־אֲשֶׁר עִמּוֹ הָסִרוּ אֶת־אֱלֹהֵי הַנֵּכָר אֲשֶׁר בְּתֹכְכֶם וְהִטַּהֲרוּ וְהַחֲלִיפוּ שִׂמְלֹתֵיכֶם׃", "rashi_he": "והטהרו. מֵעֲ\"זָ:", "rashi_en": "רש\"י מפרש ש\"והטהרו\" אין הכוונה לטהרה גופנית רגילה, אלא טהרה מעבודה זרה.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מִמַּה צִיווָּה יַעֲקֹב לְהִיטַּהֵר?", "options": ["מֵעֲבוֹדָה זָרָה", "מִטֻּומְאַת מֵתֵי שְׁכֶם", "מִטֻּומְאַת הַדֶּרֶךְ"], "kasha": "למה הוצרך יעקב לומר \"והטהרו\" בנוסף ל\"הסירו את אלהי הנכר\" — מה מוסיפה הטהרה?", "answer": "רש\"י מפרש ש\"והטהרו\" הכוונה מעבודה זרה.", "kp": ["מע\"ז"]}]}, {"id": "35:2.3", "ch": 35, "v": 2, "n": 3, "dh": "והחליפו שמלתיכם", "pasuk_html": "וַיֹּ֤אמֶר יַעֲקֹב֙ אֶל־בֵּית֔וֹ וְאֶ֖ל כָּל־אֲשֶׁ֣ר עִמּ֑וֹ הָסִ֜רוּ אֶת־אֱלֹהֵ֤י הַנֵּכָר֙ אֲשֶׁ֣ר בְּתֹכְכֶ֔ם וְהִֽטַּהֲר֔וּ <mark>וְהַחֲלִ֖יפוּ שִׂמְלֹתֵיכֶֽם׃</mark>", "pasuk_en": "וַיֹּאמֶר יַעֲקֹב אֶל־בֵּיתוֹ וְאֶל כָּל־אֲשֶׁר עִמּוֹ הָסִרוּ אֶת־אֱלֹהֵי הַנֵּכָר אֲשֶׁר בְּתֹכְכֶם וְהִטַּהֲרוּ וְהַחֲלִיפוּ שִׂמְלֹתֵיכֶם׃", "rashi_he": "והחליפו שמלתיכם. שֶׁמָּא יֵשׁ בְּיֶדְכֶם כְּסוּת שֶׁל עֲ\"זָ:", "rashi_en": "רש\"י מסביר שיעקב ציווה להחליף שמלות כי אולי היו בידם בגדים ששימשו לעבודה זרה.", "note": "", "points": [{"q": "לְפִי רַשׁ\"י, מַדּוּעַ צִיווָּה יַעֲקֹב לְהַחֲלִיף שְׂמָלוֹת?", "options": ["שֶׁמָּא הָיוּ בְּיָדָם בְּגָדִים שֶׁל עֲבוֹדָה זָרָה", "כְּדֵי לְהִתְלַבֵּשׁ בְּכָבוֹד לִקְרַאת הָעֲלִיָּיה לְבֵית אֵל", "כִּי בִּגְדֵיהֶם נִטְמְאוּ בְּדַם מִלְחֶמֶת שְׁכֶם"], "kasha": "מה הקשר בין החלפת בגדים להסרת אלהי נכר?", "answer": "רש\"י מפרש שהחלפת השמלות נדרשה כי שמא יש בידם כסות של עבודה זרה.", "kp": ["שמא יש בידכם כסות של ע\"ז"]}]}, {"id": "35:4.1", "ch": 35, "v": 4, "n": 1, "dh": "האלה", "pasuk_html": "וַיִּתְּנ֣וּ אֶֽל־יַעֲקֹ֗ב אֵ֣ת כָּל־אֱלֹהֵ֤י הַנֵּכָר֙ אֲשֶׁ֣ר בְּיָדָ֔ם וְאֶת־הַנְּזָמִ֖ים אֲשֶׁ֣ר בְּאָזְנֵיהֶ֑ם וַיִּטְמֹ֤ן אֹתָם֙ יַעֲקֹ֔ב תַּ֥חַת <mark>הָאֵלָ֖ה</mark> אֲשֶׁ֥ר עִם־שְׁכֶֽם׃", "pasuk_en": "וַיִּתְּנוּ אֶל־יַעֲקֹב אֵת כָּל־אֱלֹהֵי הַנֵּכָר אֲשֶׁר בְּיָדָם וְאֶת־הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם וַיִּטְמֹן אֹתָם יַעֲקֹב תַּחַת הָאֵלָה אֲשֶׁר עִם־שְׁכֶם׃", "rashi_he": "האלה. מִין אִילַן סְרָק:", "rashi_en": "רש\"י מפרש שהאלה היא מין אילן סרק, כלומר עץ שאינו נושא פירות.", "note": "", "points": [{"q": "לְפִי רַשׁ\"י, מַהִי \"הָאֵלָה\" שֶׁתַּחְתֶּיהָ טָמַן יַעֲקֹב אֶת הָאֱלִילִים?", "options": ["מִין אִילָן סְרָק שֶׁאֵינוֹ עוֹשֶׂה פְּרִי", "עֵץ אַלּוֹן גָּדוֹל הַנּוֹשֵׂא פֵּירוֹת", "שֵׁם הַמָּקוֹם לְיַד שְׁכֶם"], "kasha": "מהו עץ ה\"אלה\" שהכתוב מזכיר?", "answer": "רש\"י מפרש שהאלה היא מין אילן סרק, כלומר עץ שאינו נותן פירות.", "kp": ["מין אילן סרק"]}]}, {"id": "35:4.2", "ch": 35, "v": 4, "n": 2, "dh": "עם שכם", "pasuk_html": "וַיִּתְּנ֣וּ אֶֽל־יַעֲקֹ֗ב אֵ֣ת כָּל־אֱלֹהֵ֤י הַנֵּכָר֙ אֲשֶׁ֣ר בְּיָדָ֔ם וְאֶת־הַנְּזָמִ֖ים אֲשֶׁ֣ר בְּאָזְנֵיהֶ֑ם וַיִּטְמֹ֤ן אֹתָם֙ יַעֲקֹ֔ב תַּ֥חַת הָאֵלָ֖ה אֲשֶׁ֥ר <mark>עִם־שְׁכֶֽם׃</mark>", "pasuk_en": "וַיִּתְּנוּ אֶל־יַעֲקֹב אֵת כָּל־אֱלֹהֵי הַנֵּכָר אֲשֶׁר בְּיָדָם וְאֶת־הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם וַיִּטְמֹן אֹתָם יַעֲקֹב תַּחַת הָאֵלָה אֲשֶׁר עִם־שְׁכֶם׃", "rashi_he": "עם שכם. אֵצֶל שְׁכֶם:", "rashi_en": "רש\"י מבהיר שהמילה \"עם\" בפסוק אינה במשמעות של ביחד עם, אלא במשמעות של אצל, ליד שכם.", "note": "", "points": [{"q": "כֵּיצַד מְפָרֵשׁ רַשִׁ\"י אֶת הַמִּילָּה \"עִם\" בַּבִּיטּוּי \"עִם שְׁכֶם\"?", "options": ["אֵצֶל שְׁכֶם, כְּלוֹמַר לְיַד שְׁכֶם", "יַחַד עִם אַנְשֵׁי שְׁכֶם", "בְּתוֹךְ הָעִיר שְׁכֶם עַצְמָהּ"], "kasha": "המילה \"עם\" משמעותה הרגילה היא ביחד עם, וקשה מה הכוונה כאן שטמן אותם \"עם שכם\".", "answer": "רש\"י מפרש שהמילה \"עם\" כאן פירושה אצל, כלומר ליד שכם ולא ביחד עם מישהו.", "kp": ["אצל שכם"]}]}, {"id": "35:5.1", "ch": 35, "v": 5, "n": 1, "dh": "חתת", "pasuk_html": "וַיִּסָּ֑עוּ וַיְהִ֣י ׀ <mark>חִתַּ֣ת</mark> אֱלֹהִ֗ים עַל־הֶֽעָרִים֙ אֲשֶׁר֙ סְבִיבֹ֣תֵיהֶ֔ם וְלֹ֣א רָֽדְפ֔וּ אַחֲרֵ֖י בְּנֵ֥י יַעֲקֹֽב׃", "pasuk_en": "וַיִּסָּעוּ וַיְהִי חִתַּת אֱלֹהִים עַל־הֶעָרִים אֲשֶׁר סְבִיבֹתֵיהֶם וְלֹא רָדְפוּ אַחֲרֵי בְּנֵי יַעֲקֹב׃", "rashi_he": "חתת. פַּחַד:", "rashi_en": "רש\"י מפרש שהמילה \"חתת\" פירושה פחד.", "note": "", "points": [{"q": "מַהִי מַשְׁמָעוּת הַמִּילָּה \"חִתַּת\" לְפִי רַשִׁ\"י?", "options": ["פַּחַד", "מַכָּה אוֹ עֹונֶשׁ", "שֶׁבֶר וְחֻורְבָּן"], "kasha": "המילה \"חתת\" אינה שגורה ויש לבאר את משמעותה.", "answer": "רש\"י מפרש שהמילה \"חתת\" פירושה פחד.", "kp": ["פחד"]}]}, {"id": "35:7.1", "ch": 35, "v": 7, "n": 1, "dh": "אל בית אל", "pasuk_html": "וַיִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ וַיִּקְרָא֙ לַמָּק֔וֹם <mark>אֵ֖ל בֵּֽית־אֵ֑ל</mark> כִּ֣י שָׁ֗ם נִגְל֤וּ אֵלָיו֙ הָֽאֱלֹהִ֔ים בְּבָרְח֖וֹ מִפְּנֵ֥י אָחִֽיו׃", "pasuk_en": "וַיִּבֶן שָׁם מִזְבֵּחַ וַיִּקְרָא לַמָּקוֹם אֵל בֵּית־אֵל כִּי שָׁם נִגְלוּ אֵלָיו הָאֱלֹהִים בְּבָרְחוֹ מִפְּנֵי אָחִיו׃", "rashi_he": "אל בית אל. הַקָּבָּ\"ה בְּבֵית אֵל, גִּלּוּי שְׁכִינָתוֹ בְּבֵית אֵל. יֵשׁ תֵּבָה חֲסֵרָה בֵּי\"ת הַמְשַׁמֶּשֶׁת בְּרֹאשָׁהּ, כְּמוֹ הִנֵּה הוּא בֵּית מָכִיר בֶּן עַמִּיאֵל (שמואל ב ט') – כְּמוֹ בְּבֵית מָכִיר; בֵּית אָבִיךְ (בראשית ל״ח:י״א) – כְּמוֹ בְּבֵית אָבִיךְ:", "rashi_en": "רש\"י מסביר שהביטוי \"אל בית אל\" פירושו: הקב\"ה בבית אל. המילה \"אל\" היא שם ה', וחסרה האות ב' בראש \"בית אל\", שהיה צריך לומר \"בבית אל\". רש\"י מביא דוגמאות נוספות למקרא שחסרה בו ב' השימוש.", "note": "", "points": [{"q": "מַדּוּעַ לְפִי רַשִׁ\"י לֹא כָּתוּב \"אֵל בְּבֵית אֵל\" אֶלָּא \"אֵל בֵּית אֵל\"?", "options": ["כִּי לִפְעָמִים חָסְרָה ב' הַשִּׁימּוּשׁ מִתְּחִילַּת הַמִּילָּה", "כִּי \"בֵּית־אֵל\" הוּא שֵׁם הַמָּקוֹם וְאֵין צֹורֶךְ בְּתוֹסֶפֶת בְּ'", "כִּי \"אֵל\" כְּבָר כּוֹלֵל בְּתוֹכוֹ אֶת מַשְׁמָעוּת בְּ'"], "kasha": "הביטוי \"אל בית אל\" קשה, שהרי אם \"אל\" הוא שם ה', היה צריך לומר \"אל בבית אל\".", "answer": "רש\"י מסביר שיש תיבה שחסרה ב' השימוש בראשה, והכוונה היא \"בבית אל\", ומביא דוגמאות דומות מן המקרא.", "kp": ["הקב\"ה בבית אל", "יש תבה חסרה בי\"ת המשמשת בראשה"]}]}, {"id": "35:7.2", "ch": 35, "v": 7, "n": 2, "dh": "נגלו אליו האלהים", "pasuk_html": "וַיִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ וַיִּקְרָא֙ לַמָּק֔וֹם אֵ֖ל בֵּֽית־אֵ֑ל כִּ֣י שָׁ֗ם <mark>נִגְל֤וּ אֵלָיו֙ הָֽאֱלֹהִ֔ים</mark> בְּבָרְח֖וֹ מִפְּנֵ֥י אָחִֽיו׃", "pasuk_en": "וַיִּבֶן שָׁם מִזְבֵּחַ וַיִּקְרָא לַמָּקוֹם אֵל בֵּית־אֵל כִּי שָׁם נִגְלוּ אֵלָיו הָאֱלֹהִים בְּבָרְחוֹ מִפְּנֵי אָחִיו׃", "rashi_he": "נגלו אליו האלהים. בִּמְקוֹמוֹת הַרְבֵּה יֵשׁ שֵׁם אֱלֹהוּת וְאַדְנוּת בִּלְשׁוֹן רַבִּים, כְּמוֹ אֲדֹנֵי יוֹסֵף (שם ל\"ט), אִם בְּעָלָיו עִמּוֹ (שמות כ'), וְלֹא נֶאֱמַר בַּעֲלוֹ, וְכֵן אֱלֹהוּת שֶׁהוּא לְשׁוֹן שׁוֹפֵט וּמָרוּת נִזְכָּר בִּלְשׁוֹן רַבִּים, אֲבָל אֶחָד מִכָּל שְׁאָר הַשֵּׁמוֹת לֹא תִמְצָא בִּלְשׁוֹן רַבִּים:", "rashi_en": "רש\"י מסביר מדוע כתוב \"נגלו\" בלשון רבים על הקב\"ה. שמות המורים על שררה ומרות נאמרים בלשון רבים, כמו \"אדני יוסף\" ו\"בעליו\", וכן \"אלהים\" שהוא לשון שופט ומרות. אבל שאר שמות ה' לא נמצאים בלשון רבים.", "note": "", "points": [{"q": "מַדּוּעַ כָּתוּב \"נִגְלוּ\" בִּלְשׁוֹן רַבִּים אַף שֶׁמְּדֻובָּר בְּהַקָּבָּ\"ה?", "options": ["כִּי שֵׁמוֹת הַמּוֹרִים עַל שְׁרָרָה וּמָרוּת נֶאֱמָרִים בִּלְשׁוֹן רַבִּים", "כִּי נִגְלוּ אֵלָיו מַלְאָכִים רַבִּים יַחַד עִם הַשְּׁכִינָה", "כִּי הָיוּ הִתְגַּלּוּיוֹת רַבּוֹת בִּזְמַנִּים שׁוֹנִים"], "kasha": "קשה מדוע כתוב \"נגלו\" בלשון רבים כשמדובר באלוקים אחד.", "answer": "רש\"י מסביר ש\"אלהים\" הוא לשון שופט ומרות, ושמות כאלו נאמרים בלשון רבים, כמו \"אדני יוסף\" ו\"בעליו\". אבל שאר שמות ה' אינם בלשון רבים.", "kp": ["שם אלהות ואדנות בלשון רבים", "לשון שופט ומרות"]}]}, {"id": "35:8.1", "ch": 35, "v": 8, "n": 1, "dh": "ותמת דבורה", "pasuk_html": "<mark>וַתָּ֤מָת דְּבֹרָה֙</mark> מֵינֶ֣קֶת רִבְקָ֔ה וַתִּקָּבֵ֛ר מִתַּ֥חַת לְבֵֽית־אֵ֖ל תַּ֣חַת הָֽאַלּ֑וֹן וַיִּקְרָ֥א שְׁמ֖וֹ אַלּ֥וֹן בָּכֽוּת׃ (פ)", "pasuk_en": "וַתָּמָת דְּבֹרָה מֵינֶקֶת רִבְקָה וַתִּקָּבֵר מִתַּחַת לְבֵית־אֵל תַּחַת הָאַלּוֹן וַיִּקְרָא שְׁמוֹ אַלּוֹן בָּכוּת׃", "rashi_he": "ותמת דבורה. מָה עִנְיַן דְּבוֹרָה בְּבֵית יַעֲקֹב? אֶלָּא לְפִי שֶׁאָמְרָה רִבְקָה לְיַעֲקֹב וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם, שָׁלְחָה דְבוֹרָה אֶצְלוֹ לְפַדַּן אֲרָם לָצֵאת מִשָּׁם, וּמֵתָה בַדֶּרֶךְ; מִדִּבְרֵי רַבִּי מֹשֶׁה הַדַּרְשָׁן לְמַדְתִּיהָ:", "rashi_en": "רש״י שואל מה עשתה דבורה בבית יעקב, ומסביר שרבקה שלחה את דבורה לפדן ארם כדי להודיע ליעקב לצאת משם, כפי שהבטיחה לו, ודבורה מתה בדרך חזרה.", "note": "", "points": [{"q": "לְפִי רַשִׁ״י, מַדּוּעַ הִגִּיעָה דְּבוֹרָה לְבֵית יַעֲקֹב?", "options": ["רִבְקָה שָׁלְחָה אוֹתָהּ לְפַדַּן אֲרָם לְהוֹצִיא אֶת יַעֲקֹב מִשָּׁם", "הִיא לִיווְּתָה אֶת יַעֲקֹב מִלְּכַתְּחִילָּה כְּשֶׁבָּרַח לְפַדַּן אֲרָם", "הִיא בָּאָה מֵעַצְמָהּ לְבַקֵּר אֶת בְּנֵי רִבְקָה"], "kasha": "קשה מדוע מוזכרת דבורה מינקת רבקה דווקא בבית יעקב, שהרי היא שייכת לבית רבקה.", "answer": "רבקה הבטיחה ליעקב ושלחתי ולקחתיך משם, ולכן שלחה את דבורה לפדן ארם לומר לו לצאת, ודבורה מתה בדרך.", "kp": ["שלחה דבורה אצלו לפדן ארם לצאת משם", "ומתה בדרך"]}]}, {"id": "35:8.2", "ch": 35, "v": 8, "n": 2, "dh": "מתחת לבית אל", "pasuk_html": "וַתָּ֤מָת דְּבֹרָה֙ מֵינֶ֣קֶת רִבְקָ֔ה וַתִּקָּבֵ֛ר <mark>מִתַּ֥חַת לְבֵֽית־אֵ֖ל</mark> תַּ֣חַת הָֽאַלּ֑וֹן וַיִּקְרָ֥א שְׁמ֖וֹ אַלּ֥וֹן בָּכֽוּת׃ (פ)", "pasuk_en": "וַתָּמָת דְּבֹרָה מֵינֶקֶת רִבְקָה וַתִּקָּבֵר מִתַּחַת לְבֵית־אֵל תַּחַת הָאַלּוֹן וַיִּקְרָא שְׁמוֹ אַלּוֹן בָּכוּת׃", "rashi_he": "מתחת לבית אל. הָעִיר יוֹשֶׁבֶת בָּהָר וְנִקְבְּרָה בְּרַגְלֵי הָהָר:", "rashi_en": "רש״י מסביר ש״מתחת לבית אל״ פירושו שבית אל יושבת על הר, ודבורה נקברה למרגלות ההר.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ ״מִתַּחַת לְבֵית אֵל״ לְפִי רַשִׁ״י?", "options": ["בֵּית אֵל יוֹשֶׁבֶת בָּהָר וּדְבוֹרָה נִקְבְּרָה בְּרַגְלֵי הָהָר", "נִקְבְּרָה מִתַּחַת לָאֵילָן הַסָּמוּךְ לְבֵית אֵל", "נִקְבְּרָה בִּמְעָרָה שֶׁמִּתַּחַת לְעִיר בֵּית אֵל"], "kasha": "הביטוי ״מתחת לבית אל״ אינו ברור — האם הכוונה מדרום לעיר, או במקום נמוך ממנה.", "answer": "העיר בית אל יושבת בהר, ודבורה נקברה ברגלי ההר, כלומר במקום נמוך מן העיר.", "kp": ["העיר יושבת בהר ונקברה ברגלי ההר"]}]}, {"id": "35:8.3", "ch": 35, "v": 8, "n": 3, "dh": "תחת האלון", "pasuk_html": "וַתָּ֤מָת דְּבֹרָה֙ מֵינֶ֣קֶת רִבְקָ֔ה וַתִּקָּבֵ֛ר מִתַּ֥חַת לְבֵֽית־אֵ֖ל <mark>תַּ֣חַת הָֽאַלּ֑וֹן</mark> וַיִּקְרָ֥א שְׁמ֖וֹ אַלּ֥וֹן בָּכֽוּת׃ (פ)", "pasuk_en": "וַתָּמָת דְּבֹרָה מֵינֶקֶת רִבְקָה וַתִּקָּבֵר מִתַּחַת
