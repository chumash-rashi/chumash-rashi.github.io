<style>[hidden]{display:none!important}img{max-width:100%}.hint a.fb{color:var(--accent);font-weight:600;font-size:1.15em}
.cite{direction:rtl;font-size:14px;margin-bottom:-4px;color:var(--muted);line-height:1.4}
.cite b{color:var(--ink);font-weight:600}
.cite a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.cite a:hover{text-decoration:underline}
.quote .dhw{font-weight:700}
.quote .qw{text-decoration:underline dotted;text-underline-offset:4px}
.quote .kp{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 2px}
.quote .src{display:block;direction:rtl;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-top:4px}
.quote .src a{color:var(--accent);font-weight:600;text-decoration:none}

.quote{direction:rtl;text-align:right;font-family:var(--f-rashi);font-size:max(19px,calc(var(--s,1)*16px));line-height:1.55;background:var(--bg);border-radius:10px;padding:8px 12px;flex:1 1 0;min-height:24vh;overflow:auto}
</style>

<body dir="rtl">

<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-soft:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1e2632; --ink:#f0f3f7; --muted:#bcc5d0; --line:#364052;
  --accent:#8fb0e6; --accent-soft:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-soft:#173328; --bad:#ef8a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100dvh;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:4px;height:100%}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.top{display:contents}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
h1 span{display:none}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.count b{color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:none}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-heb);font-size:22px;line-height:1.7;letter-spacing:.03em;word-spacing:.08em;direction:rtl;text-align:right}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{display:none}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:6px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:8px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:18px;line-height:1.45;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:center;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-body);font-size:17px;line-height:1.4;width:100%;direction:rtl}
.opt .k{flex:none;font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-soft)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.row{display:flex;flex-direction:column;gap:2px}
.row .t{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);direction:rtl}
.row p{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--accent);font-size:18px;font-weight:600;display:inline-block;padding:5px 16px;border:1.5px solid var(--accent);border-radius:9px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:14px;line-height:1.6;direction:rtl;text-align:right}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface);font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line);font-size:14px}
.hint{font-size:11px;color:var(--muted);text-align:center;flex-shrink:0}
.verdict{font-weight:600;font-size:16px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:20px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* taamim: Frank Ruhl lacks cantillation glyphs, so those letters fell back to another font */
.pasuk{font-family:var(--f-heb)}
/* pasuk panel: visually separate the verse from the question */
.pasuk{background:var(--accent-soft);border-inline-start:5px solid var(--accent);border-radius:10px;padding:calc(var(--s,1)*6px) calc(var(--s,1)*12px)}
.point{border-top:1px solid var(--line);padding-top:calc(var(--s,1)*8px)}
/* fit layout: only pasuk + question + options in the card; fine print lives in the footer */
.wrap{max-width:min(1500px,100%)}
header .top,.tools,.ref,.dh{display:none}
.card{gap:calc(var(--s,1)*8px)}
.pasuk{font-size:calc(var(--s,1)*22px)}
.q{font-size:calc(var(--s,1)*18px)}
.opt{font-size:calc(var(--s,1)*17px);padding:calc(var(--s,1)*7px) calc(var(--s,1)*10px)}
.opt .k{width:calc(var(--s,1)*20px);height:calc(var(--s,1)*20px);font-size:calc(var(--s,1)*11px)}
.row p{font-size:25px;line-height:1.35}
.verdict{font-size:26px;font-weight:700}
.row .t{font-size:16px}
.point{gap:calc(var(--s,1)*10px)}
.card{position:relative}
.reveal{position:absolute;inset-inline:12px;bottom:56px;z-index:3;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.nav .btn{padding:4px 12px;font-size:13px}
@media (max-width:460px){.pasuk{font-size:calc(var(--s,1)*22px)}}
.hint{font-size:11px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}

/* wide screens: split layout (pasuk | question+answers), fonts auto-fit each side */
@media (min-width:900px){
.wrap{max-width:min(1800px,100%)}
.card{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr) auto auto;column-gap:22px;row-gap:8px;overflow:hidden}
.card>.pasuk{grid-column:1;grid-row:1;overflow:hidden;align-self:stretch;font-size:calc(var(--sp,1)*22px);padding:calc(var(--sp,1)*10px) calc(var(--sp,1)*14px)}
.card>.point{position:relative;grid-column:2;grid-row:1;min-height:0;overflow:hidden;border-top:0;padding-top:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--s,1)*12px)}
.card>details{grid-column:1/-1;grid-row:2}
.card>.nav{grid-column:1/-1;grid-row:3}
.reveal{position:absolute;inset:auto 0 0 0;z-index:3;max-height:none;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.reveal[aria-hidden]{box-shadow:none;border-color:transparent}
.row p{font-size:calc(var(--s,1)*18px);line-height:1.4}
.verdict{font-size:30px;font-weight:700}
.row .t{font-size:20px}
.q{font-size:calc(var(--s,1)*21px)}
.opt{font-size:calc(var(--s,1)*21px)}
}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <h1>רש״י · לך לך <span>רש״י על לך לך</span></h1>
      <div class="count" id="count"></div>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="tools">
      <label for="jump" class="count">עבור אל</label>
      <select id="jump"></select>
      <button class="ghost" id="nextUnanswered" type="button">הבא ללא מענה</button>
      <span id="resetZone"><button class="ghost" id="reset" type="button">התחל מחדש</button></span>
    </div>
  </header>
  <main id="main"></main>
  <div class="hint">מקשים: 1-3 לתשובה · Enter להבא · ← / → לניווט</div>
</div>

<script>
const DATA = [{"id": "12:1.1", "ch": 12, "v": 1, "n": 1, "dh": "לך לך", "pasuk_html": "וַיֹּ֤אמֶר יְהוָה֙ אֶל־אַבְרָ֔ם <mark>לֶךְ־לְךָ֛</mark> מֵאַרְצְךָ֥ וּמִמּֽוֹלַדְתְּךָ֖ וּמִבֵּ֣ית אָבִ֑יךָ אֶל־הָאָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽךָּ׃", "pasuk_en": "וַיֹּאמֶר יְהוָה אֶל־אַבְרָם לֶךְ־לְךָ מֵאַרְצְךָ וּמִמּוֹלַדְתְּךָ וּמִבֵּית אָבִיךָ אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ׃", "rashi_he": "לך לך. לַהֲנָאָתְךָ וּלְטוֹבָתְךָ, שָׁם אֶעֶשְׂךָ לְגוֹי גָדוֹל, כָּאן אִי אַתָּה זוֹכֶה לְבָנִים, וְעוֹד שֶׁאוֹדִיעַ טִבְעֲךָ בָּעוֹלָם:", "rashi_en": "רש\"י מסביר שהמילה \"לך\" הנוספת פירושה לטובתך ולהנאתך. בארץ החדשה ייעשה אברם לגוי גדול ויזכה לבנים, מה שלא יזכה לו כאן, וגם טבעו הטוב ייוודע בעולם.", "note": "", "points": [{"q": "מַה מְלַמֶּדֶת הַמִּילָּה \"לֶךְ\" הַכְּפוּלָה בַּצִּיווּי לְאַבְרָם לְפִי רַשִׁ\"י?", "options": ["שֶׁהַהֲלִיכָה הִיא לְטוֹבָתוֹ וּלְהַנָּאָתוֹ שֶׁל אַבְרָם", "שֶׁעָלָיו לָלֶכֶת מַהֵר וּבְלִי לְהִתְעַכֵּב בַּדֶּרֶךְ", "שֶׁעָלָיו לָלֶכֶת לְבַדּוֹ, בְּלִי בְּנֵי מִשְׁפַּחְתּוֹ"], "kasha": "למה נאמר \"לך לך\" ולא די במילה \"לך\" אחת?", "answer": "\"לך\" פירושו להנאתך ולטובתך: שם ייעשה לגוי גדול, ואילו כאן לא יזכה לבנים, ועוד שטבעו ייוודע בעולם.", "kp": ["להנאתך ולטובתך", "כאן אי אתה זוכה לבנים"]}]}, {"id": "12:2.1", "ch": 12, "v": 2, "n": 1, "dh": "ואעשך לגוי גדול", "pasuk_html": "<mark>וְאֶֽעֶשְׂךָ֙ לְג֣וֹי גָּד֔וֹל</mark> וַאֲבָ֣רֶכְךָ֔ וַאֲגַדְּלָ֖ה שְׁמֶ֑ךָ וֶהְיֵ֖ה בְּרָכָֽה׃", "pasuk_en": "וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ וֶהְיֵה בְּרָכָה׃", "rashi_he": "ואעשך לגוי גדול. לְפִי שֶׁהַדֶּרֶךְ גּוֹרֶמֶת לִשְׁלֹשָׁה דְבָרִים, מְמַעֶטֶת פְּרִיָּה וּרְבִיָּה וּמְמַעֶטֶת אֶת הַמָּמוֹן וּמְמַעֶטֶת אֶת הַשֵּׁם, לְכָךְ הֻזְקַק לִשְׁלֹשָׁה בְּרָכוֹת הַלָּלוּ, שֶׁהִבְטִיחוֹ עַל הַבָּנִים וְעַל הַמָּמוֹן וְעַל הַשֵּׁם:", "rashi_en": "הדרך גורמת לשלושה נזקים: מעטה בילדים, מעטה בממון ומעטה בשם. לכן הבטיח ה' לאברם שלוש ברכות כנגדם: בנים, ממון ושם.", "note": "", "points": [{"q": "לָמָּה הֻוצְרַךְ ה' לְבָרֵךְ אֶת אַבְרָם דַּוְוקָא בִּשְׁלֹושׁ הַבְּרָכוֹת שֶׁבַּפָּסוּק?", "options": ["כִּי הַדֶּרֶךְ מְמַעֶטֶת יְלָדִים, מָמוֹן וָשֵׁם", "כִּי אַבְרָם בִּיקֵּשׁ שָׁלוֹשׁ בְּרָכוֹת בִּתְפִילָּתוֹ", "כִּי כְּנֶגְדָּן עֲתִידִים לְהִיווָּלֵד לוֹ שְׁלוֹשָׁה בָּנִים"], "kasha": "למה היה צורך להבטיח לאברם דווקא את שלוש הברכות האלה כשיצא לדרך?", "answer": "הדרך גורמת לשלושה דברים: ממעטת פרייה ורבייה, ממעטת ממון וממעטת שם, ולכן הבטיחו על הבנים, על הממון ועל השם.", "kp": ["שהדרך גורמת לשלשה דברים", "על הבנים ועל הממון ועל השם"]}]}, {"id": "12:2.2", "ch": 12, "v": 2, "n": 2, "dh": "ואברכך", "pasuk_html": "וְאֶֽעֶשְׂךָ֙ לְג֣וֹי גָּד֔וֹל <mark>וַאֲבָ֣רֶכְךָ֔</mark> וַאֲגַדְּלָ֖ה שְׁמֶ֑ךָ וֶהְיֵ֖ה בְּרָכָֽה׃", "pasuk_en": "וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ וֶהְיֵה בְּרָכָה׃", "rashi_he": "ואברכך. בְּמָמוֹן (בראשית רבה):", "rashi_en": "הברכה \"ואברכך\" היא ברכה בממון.", "note": "", "points": [{"q": "בְּאֵיזֶה תְּחוּם מִתְבָּרֵךְ אַבְרָם בַּמִּילָּה \"וַאֲבָרֶכְךָ\"?", "options": ["בְּמָמוֹן וּבְעֹושֶׁר", "בְּבָנִים רַבִּים", "בִּבְרִיאוּת וּבַאֲרִיכוּת יָמִים"], "kasha": "\"ואברכך\" היא ברכה כללית, ולא מפורש במה יתברך.", "answer": "הכוונה לברכה בממון.", "kp": ["בממון"]}]}, {"id": "12:2.3", "ch": 12, "v": 2, "n": 3, "dh": "והיה ברכה", "pasuk_html": "וְאֶֽעֶשְׂךָ֙ לְג֣וֹי גָּד֔וֹל וַאֲבָ֣רֶכְךָ֔ וַאֲגַדְּלָ֖ה שְׁמֶ֑ךָ <mark>וֶהְיֵ֖ה בְּרָכָֽה׃</mark>", "pasuk_en": "וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ וֶהְיֵה בְּרָכָה׃", "rashi_he": "והיה ברכה. הַבְּרָכוֹת נְתוּנוֹת בְּיָדְךָ; עַד עַכְשָׁו הָיוּ בְיָדִי, בֵּרַכְתִּי לְאָדָם וְנֹחַ, וּמֵעַכְשָׁו אַתָּה תְבָרֵךְ אֶת אֲשֶׁר תַּחְפֹּץ (בראשית רבה). דָּבָר אַחֵר ואעשך לגוי גדול זֶה שֶׁאוֹמְרִים אֱלֹהֵי אַבְרָהָם, ואברכך זֶה שֶׁאוֹמְרִים אֱלֹהֵי יִצְחָק, ואגדלה שמך זֶה שֶׁאוֹמְרִים אֱלֹהֵי יַעֲקֹב. יָכוֹל יִהְיוּ חוֹתְמִין בְּכֻלָּן, תַּלְמוּד לוֹמַר וֶהְיֵה בְּרָכָה, בְּךָ חוֹתְמִין וְלֹא בָהֶם:", "rashi_en": "עד עכשיו הברכות היו בידי ה', ומעתה נמסרו לאברם והוא יברך את מי שירצה. לפי פירוש אחר, שלוש הברכות כנגד שלושת האבות בתפילה, ו\"והיה ברכה\" מלמד שחותמים את הברכה באברהם בלבד.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וֶהְיֵה בְּרָכָה\" לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן בְּרַשִׁ\"י?", "options": ["הַבְּרָכוֹת נִמְסְרוּ לְאַבְרָם, וְהוּא יְבָרֵךְ אֶת מִי שֶׁיִּרְצֶה", "אַבְרָם יִתְבָּרֵךְ יוֹתֵר מִכָּל אָדָם אַחֵר בָּעוֹלָם", "כָּל מִי שֶׁיִּפְגֹּושׁ אֶת אַבְרָם יִתְבָּרֵךְ מִיָּד"], "kasha": "מה מוסיף \"והיה ברכה\" אחרי שכבר נאמר \"ואברכך\"?", "answer": "הברכות נתונות בידו: עד עכשיו היו בידי ה', שבירך את אדם ואת נח, ומעתה אברם יברך את מי שירצה.", "kp": ["הברכות נתונות בידך", "אתה תברך את אשר תחפץ"]}, {"q": "לְפִי הַ\"דָּבָר אַחֵר\", מַה לוֹמְדִים מִ\"וֶהְיֵה בְּרָכָה\" עַל הַבְּרָכָה הָרִאשׁוֹנָה בִּתְפִילָּה?", "options": ["שֶׁחוֹתְמִים אוֹתָהּ בְּאַבְרָהָם בִּלְבַד", "שֶׁחוֹתְמִים אוֹתָהּ בִּשְׁלֹושֶׁת הָאָבוֹת יַחַד", "שֶׁאֵין מַזְכִּירִים בָּהּ אֶת יִצְחָק וְיַעֲקֹב כְּלָל"], "kasha": "אם שלוש הברכות כנגד שלושת האבות, למה נוסף עוד \"והיה ברכה\"?", "answer": "\"ואעשך לגוי גדול\", \"ואברכך\" ו\"ואגדלה שמך\" כנגד אלהי אברהם, אלהי יצחק ואלהי יעקב, ו\"והיה ברכה\" מלמד שחותמים באברהם ולא בהם.", "kp": ["בך חותמין ולא בהם"]}]}, {"id": "12:2.4", "ch": 12, "v": 2, "n": 4, "dh": "מארצך", "pasuk_html": "וְאֶֽעֶשְׂךָ֙ לְג֣וֹי גָּד֔וֹל וַאֲבָ֣רֶכְךָ֔ וַאֲגַדְּלָ֖ה שְׁמֶ֑ךָ וֶהְיֵ֖ה בְּרָכָֽה׃", "pasuk_en": "וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ וֶהְיֵה בְּרָכָה׃", "rashi_he": "מארצך. וַהֲלֹא כְבָר יָצָא מִשָּׁם עִם אָבִיו וּבָא עַד חָרָן? אֶלָּא כָּךְ אָמַר לוֹ הִתְרַחֵק עוֹד מִשָּׁם וְצֵא מִבֵּית אָבִיךָ:", "rashi_en": "אברם כבר יצא מארצו עם אביו והגיע לחרן, ולכן הציווי \"מארצך\" פירושו שיתרחק עוד יותר משם ויצא גם מבית אביו.", "note": "", "points": [{"q": "מַה קָשֶׁה לְרַשִׁ\"י בַּצִיוּוּי לָלֶכֶת \"מֵאַרְצְךָ\"?", "options": ["הֲרֵי אַבְרָם כְּבָר יָצָא מֵאַרְצוֹ וְהִגִּיעַ לְחָרָן", "לֹא בָּרוּר אֵיזוֹ אֶרֶץ הִיא אֶרֶץ מוֹלַדְתּוֹ", "הֲרֵי אַבְרָם עֲדַייִן לֹא יָדַע לְאָן לָלֶכֶת"], "kasha": "איך מצווה ה' את אברם לצאת מארצו, והרי כבר יצא משם עם אביו לחרן?", "answer": "כך אמר לו: התרחק עוד משם וצא מבית אביך.", "kp": ["והלא כבר יצא משם", "התרחק עוד משם"]}]}, {"id": "12:2.5", "ch": 12, "v": 2, "n": 5, "dh": "אשר אראך", "pasuk_html": "וְאֶֽעֶשְׂךָ֙ לְג֣וֹי גָּד֔וֹל וַאֲבָ֣רֶכְךָ֔ וַאֲגַדְּלָ֖ה שְׁמֶ֑ךָ וֶהְיֵ֖ה בְּרָכָֽה׃", "pasuk_en": "וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ וֶהְיֵה בְּרָכָה׃", "rashi_he": "אשר אראך. לֹא גִּלָּה לוֹ הָאָרֶץ מִיָּד כְּדֵּי לְחַבְּבָהּ בְּעֵינָיו, וְלָתֵת לוֹ שָׂכָר עַל כָּל דִּבּוּר וְדִבּוּר; כַּיּוֹצֵא בוֹ, אֶת בִּנְךָ אֶת יְחִידְךָ אֲשֶׁר אָהַבְתָּ אֶת יִצְחָק (ברא' כ\"ב), כַּיּוֹצֵא בוֹ עַל אַחַד הֶהָרִים אֲשֶׁר אֹמַר אֵלֶיךָ, וכיו\"בּ וּקְרָא אֵלֶיהָ אֶת הַקְּרִיאָה אֲשֶׁר אָנֹכִי דֹּבֵר אֵלֶיךָ (יונה ג'):", "rashi_en": "ה' לא גילה לאברם מיד לאיזו ארץ ילך, כדי שהארץ תהיה חביבה בעיניו וכדי לתת לו שכר על כל דיבור ודיבור. כך גם בעקדה ואצל יונה.", "note": "", "points": [{"q": "לָמָּה לֹא גִּילָּה ה' לְאַבְרָם מִיָּד אֶת הָאָרֶץ שֶׁאֵלֶיהָ יֵלֵךְ?", "options": ["כְּדֵי לְחַבְּבָהּ בְּעֵינָיו וְלִתֵּת לוֹ שָׂכָר עַל כָּל דִּיבּוּר", "כְּדֵי שֶׁלֹּא יְסַפֵּר לְאַנְשֵׁי חָרָן לְאָן הוּא הוֹלֵךְ", "כִּי עֲדַייִן לֹא נִקְבַּע אֵיזוֹ אֶרֶץ תִּינָּתֵן לוֹ"], "kasha": "למה אמר ה' \"אשר אראך\" ולא אמר במפורש שמדובר בארץ כנען?", "answer": "לא גילה לו את הארץ מיד כדי לחבבה בעיניו ולתת לו שכר על כל דיבור ודיבור, וכמוהו \"את בנך את יחידך\" ו\"על אחד ההרים\".", "kp": ["כדי לחבבה בעיניו", "שכר על כל דבור ודבור"]}]}, {"id": "12:3.1", "ch": 12, "v": 3, "n": 1, "dh": "ונברכו בך", "pasuk_html": "וַאֲבָֽרֲכָה֙ מְבָ֣רְכֶ֔יךָ וּמְקַלֶּלְךָ֖ אָאֹ֑ר <mark>וְנִבְרְכ֣וּ בְךָ֔</mark> כֹּ֖ל מִשְׁפְּחֹ֥ת הָאֲדָמָֽה׃", "pasuk_en": "וַאֲבָרֲכָה מְבָרְכֶיךָ וּמְקַלֶּלְךָ אָאֹר וְנִבְרְכוּ בְךָ כֹּל מִשְׁפְּחֹת הָאֲדָמָה׃", "rashi_he": "ונברכו בך. יֵשׁ אַגָּדוֹת רַבּוֹת, וְזֶהוּ פְשׁוּטוֹ, אָדָם אוֹמֵר לִבְנוֹ תְּהֵא כְּאַבְרָהָם, וְכֵן כָּל וְנִבְרְכוּ בְךָ שֶׁבַּמִּקְרָא, וְזֶה מוֹכִיחַ בְּךָ יְבָרֵךְ יִשְׂרָאֵל לֵאמֹר יְשִׂמְךָ אֱלֹהִים כְּאֶפְרַיִם וְכִמְנַשֶּׁה (בר' מ\"ח):", "rashi_en": "יש על כך דרשות רבות, אבל הפשט הוא שאדם יברך את בנו ויאמר לו \"תהא כאברהם\". כך מוכח מהפסוק \"ישמך אלהים כאפרים וכמנשה\".", "note": "", "points": [{"q": "מַה הַפְּשָׁט שֶׁל \"וְנִבְרְכוּ בְךָ\" לְפִי רַשִׁ\"י?", "options": ["אָדָם יְבָרֵךְ אֶת בְּנוֹ שֶׁיִּהְיֶה כְּאַבְרָהָם", "כָּל הָעוֹלָם יְקַבֵּל שֶׁפַע בִּזְכוּתוֹ שֶׁל אַבְרָהָם", "אַבְרָהָם יְבָרֵךְ בְּעַצְמוֹ אֶת כָּל הַמִּשְׁפָּחוֹת"], "kasha": "מה פירוש הדבר שכל משפחות האדמה יתברכו באברם?", "answer": "יש אגדות רבות, אבל זה פשוטו: אדם אומר לבנו \"תהא כאברהם\", כמו שמוכיח הפסוק \"ישמך אלהים כאפרים וכמנשה\".", "kp": ["וזהו פשוטו", "אדם אומר לבנו תהא כאברהם"]}]}, {"id": "12:5.1", "ch": 12, "v": 5, "n": 1, "dh": "אשר עשו בחרן", "pasuk_html": "וַיִּקַּ֣ח אַבְרָם֩ אֶת־שָׂרַ֨י אִשְׁתּ֜וֹ וְאֶת־ל֣וֹט בֶּן־אָחִ֗יו וְאֶת־כָּל־רְכוּשָׁם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְאֶת־הַנֶּ֖פֶשׁ <mark>אֲשֶׁר־עָשׂ֣וּ בְחָרָ֑ן</mark> וַיֵּצְא֗וּ לָלֶ֙כֶת֙ אַ֣רְצָה כְּנַ֔עַן וַיָּבֹ֖אוּ אַ֥רְצָה כְּנָֽעַן׃", "pasuk_en": "וַיִּקַּח אַבְרָם אֶת־שָׂרַי אִשְׁתּוֹ וְאֶת־לוֹט בֶּן־אָחִיו וְאֶת־כָּל־רְכוּשָׁם אֲשֶׁר רָכָשׁוּ וְאֶת־הַנֶּפֶשׁ אֲשֶׁר־עָשׂוּ בְחָרָן וַיֵּצְאוּ לָלֶכֶת אַרְצָה כְּנַעַן וַיָּבֹאוּ אַרְצָה כְּנָעַן׃", "rashi_he": "אשר עשו בחרן. שֶׁהִכְנִיסָן תַּחַת כַּנְפֵי הַשְּׁכִינָה; אַבְרָהָם מְגַיֵּר אֶת הָאֲנָשִׁים וְשָׂרָה מְגַיֶּרֶת הַנָּשִׁים, וּמַעֲלֶה עֲלֵיהֶם הַכָּתוּב כְּאִלּוּ עֲשָׂאוּם; וּפְשׁוּטוֹ שֶׁל מִקְרָא עֲבָדִים וּשְׁפָחוֹת שֶׁקָּנוּ לָהֶם, כְּמוֹ עָשָׂה אֵת כָּל הַכָּבֹד הַזֶּה (שם ל\"א), וְיִשְׂרָאֵל עֹשֶׂה חָיִל (במדבר כד יח), לְשׁוֹן קוֹנֶה וְכוֹנֵס:", "rashi_en": "לפי המדרש, אלה האנשים והנשים שאברהם ושרה גיירו, והכתוב מחשיב אותם כאילו עשאום. לפי הפשט, אלה עבדים ושפחות שקנו, ו\"עשה\" הוא לשון קנייה.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ, מִי הֵן הַנְּפָשׁוֹת שֶׁאַבְרָם וְשָׂרַי \"עָשׂוּ\" בְּחָרָן?", "options": ["אֲנָשִׁים וְנָשִׁים שֶׁגִּייְּרוּ וְהִכְנִיסוּ תַּחַת כַּנְפֵי הַשְּׁכִינָה", "יְלָדִים שֶׁנּוֹלְדוּ לָהֶם בַּשָּׁנִים שֶׁגָּרוּ בְּחָרָן", "בְּנֵי מִשְׁפָּחָה מֵחָרָן שֶׁהִצְטָרְפוּ אֲלֵיהֶם לַדֶּרֶךְ"], "kasha": "איך אפשר לומר על אדם שהוא \"עשה\" נפשות?", "answer": "הם הכניסו אותם תחת כנפי השכינה: אברהם גייר את האנשים ושרה את הנשים, והכתוב מחשיב זאת כאילו עשאום.", "kp": ["שהכניסן תחת כנפי השכינה", "כאלו עשאום"]}, {"q": "מַה פֵּירוּשׁ \"עָשׂוּ\" בַּפָּסוּק לְפִי פְּשׁוּטוֹ שֶׁל מִקְרָא?", "options": ["קָנוּ עֲבָדִים וּשְׁפָחוֹת, כִּי \"עָשָׂה\" הוּא לְשׁוֹן קְנִיָּיה", "הוֹלִידוּ בָּנִים וּבָנוֹת בִּזְמַן שֶׁיָּשְׁבוּ בְּחָרָן", "גִּייְּרוּ אֲנָשִׁים וְנָשִׁים וְהֵבִיאוּם לֶאֱמוּנָה"], "kasha": "איך אפשר לומר על אדם שהוא \"עשה\" נפשות?", "answer": "אלה עבדים ושפחות שקנו להם, ו\"עשה\" הוא לשון קונה וכונס, כמו \"עשה את כל הכבד הזה\".", "kp": ["עבדים ושפחות שקנו להם", "לשון קונה וכונס"]}]}, {"id": "12:6.1", "ch": 12, "v": 6, "n": 1, "dh": "ויעבר אברם בארץ", "pasuk_html": "<mark>וַיַּעֲבֹ֤ר אַבְרָם֙ בָּאָ֔רֶץ</mark> עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְהַֽכְּנַעֲנִ֖י אָ֥ז בָּאָֽרֶץ׃", "pasuk_en": "וַיַּעֲבֹר אַבְרָם בָּאָרֶץ עַד מְקוֹם שְׁכֶם עַד אֵלוֹן מוֹרֶה וְהַכְּנַעֲנִי אָז בָּאָרֶץ׃", "rashi_he": "ויעבר אברם בארץ. נִכְנַס לְתוֹכָהּ:", "rashi_en": "\"ויעבר אברם בארץ\" פירושו שנכנס לתוך הארץ.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וַיַּעֲבֹר אַבְרָם בָּאָרֶץ\"?", "options": ["נִכְנַס לְתוֹךְ הָאָרֶץ", "עָבַר דֶּרֶךְ הָאָרֶץ וְיָצָא מִמֶּנָּה", "עָבַר לְאֹורֶךְ גְּבוּלוֹת הָאָרֶץ"], "kasha": "המילה \"ויעבר\" יכולה להתפרש כמעבר דרך הארץ ויציאה ממנה.", "answer": "הכוונה שנכנס לתוכה.", "kp": ["נכנס לתוכה"]}]}, {"id": "12:6.2", "ch": 12, "v": 6, "n": 2, "dh": "עד מקום שכם", "pasuk_html": "וַיַּעֲבֹ֤ר אַבְרָם֙ בָּאָ֔רֶץ <mark>עַ֚ד מְק֣וֹם שְׁכֶ֔ם</mark> עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְהַֽכְּנַעֲנִ֖י אָ֥ז בָּאָֽרֶץ׃", "pasuk_en": "וַיַּעֲבֹר אַבְרָם בָּאָרֶץ עַד מְקוֹם שְׁכֶם עַד אֵלוֹן מוֹרֶה וְהַכְּנַעֲנִי אָז בָּאָרֶץ׃", "rashi_he": "עד מקום שכם. לְהִתְפַּלֵּל עַל בְּנֵי יַעֲקֹב, כְּשֶׁיָּבֹאוּ לְהִלָּחֵם בִּשְׁכֶם:", "rashi_en": "אברם הלך עד שכם כדי להתפלל שם על בני יעקב, שעתידים להילחם בשכם.", "note": "", "points": [{"q": "לָמָּה הָלַךְ אַבְרָם דַּווְקָא \"עַד מְקוֹם שְׁכֶם\"?", "options": ["כְּדֵי לְהִתְפַּלֵּל עַל בְּנֵי יַעֲקֹב שֶׁיִּילָּחֲמוּ בִּשְׁכֶם", "כִּי שָׁם הֶרְאָהוּ ה' אֶת הַר גְּרִיזִים וְהַר עֵיבָל", "כִּי שָׁם רָצָה לִבְנוֹת אֶת הַמִּזְבֵּחַ הָרִאשׁוֹן"], "kasha": "למה מציינת התורה את המקום שעד אליו הגיע אברם?", "answer": "הוא הלך לשם כדי להתפלל על בני יעקב, כשיבואו להילחם בשכם.", "kp": ["להתפלל על בני יעקב"]}]}, {"id": "12:6.3", "ch": 12, "v": 6, "n": 3, "dh": "אלון מורה", "pasuk_html": "וַיַּעֲבֹ֤ר אַבְרָם֙ בָּאָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד <mark>אֵל֣וֹן מוֹרֶ֑ה</mark> וְהַֽכְּנַעֲנִ֖י אָ֥ז בָּאָֽרֶץ׃", "pasuk_en": "וַיַּעֲבֹר אַבְרָם בָּאָרֶץ עַד מְקוֹם שְׁכֶם עַד אֵלוֹן מוֹרֶה וְהַכְּנַעֲנִי אָז בָּאָרֶץ׃", "rashi_he": "אלון מורה. הוּא שְׁכֶם. הֶרְאָהוּ הַר גְּרִיזִים וְהַר עֵיבָל, שֶׁשָּׁם קִבְּלוּ יִשְׂרָאֵל שְׁבוּעַת הַתּוֹרָה:", "rashi_en": "אלון מורה הוא שכם. שם הראה ה' לאברם את הר גריזים והר עיבל, שבהם קיבלו ישראל את שבועת התורה.", "note": "", "points": [{"q": "מַה הֶרְאָה ה' לְאַבְרָם בְּ\"אֵלוֹן מוֹרֶה\" לְפִי רַשִׁ\"י?", "options": ["אֶת הַר גְּרִיזִים וְהַר עֵיבָל", "אֶת הָאָרֶץ כֻּולָּהּ לְאָרְכָּהּ וּלְרָחְבָּהּ", "אֶת הַמָּקוֹם שֶׁבּוֹ יִיבָּנֶה הַמִּקְדָּשׁ"], "kasha": "מהו \"אלון מורה\" ומה פשר השם \"מורה\"?", "answer": "הוא שכם, ושם הראהו הר גריזים והר עיבל, ששם קיבלו ישראל את שבועת התורה.", "kp": ["הוא שכם", "הראהו הר גריזים והר עיבל"]}]}, {"id": "12:6.4", "ch": 12, "v": 6, "n": 4, "dh": "והכנעני אז בארץ", "pasuk_html": "וַיַּעֲבֹ֤ר אַבְרָם֙ בָּאָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה <mark>וְהַֽכְּנַעֲנִ֖י אָ֥ז בָּאָֽרֶץ׃</mark>", "pasuk_en": "וַיַּעֲבֹר אַבְרָם בָּאָרֶץ עַד מְקוֹם שְׁכֶם עַד אֵלוֹן מוֹרֶה וְהַכְּנַעֲנִי אָז בָּאָרֶץ׃", "rashi_he": "והכנעני אז בארץ. הָיָה הוֹלֵךְ וְכוֹבֵשׁ אֶת אֶרֶץ יִשְׂרָאֵל מִזַּרְעוֹ שֶׁל שֵׁם, שֶׁבְּחֶלְקוֹ שֶׁל שֵׁם נָפְלָה כְּשֶׁחָלַק נֹחַ אֶת הָאָרֶץ לְבָנָיו, שֶׁנֶּאֱמַר וּמַלְכִּי צֶדֶק מֶלֶךְ שָׁלֵם (ברא' י\"ב), לְפִיכָךְ וַיֹּאמֶר ה' אֶל אַבְרָם לְזַרְעֲךָ אֶתֵּן אֶת הָאָרֶץ הַזֹּאת, עָתִיד אֲנִי לְהַחֲזִירָהּ לְבָנֶיךָ שֶׁהֵם מִזַּרְעוֹ שֶׁל שֵׁם:", "rashi_en": "באותה תקופה היה הכנעני כובש את ארץ ישראל מזרעו של שם, שבחלקו נפלה הארץ. לכן הבטיח ה' לאברם, שהוא מזרע שם, להחזיר את הארץ לבניו.", "note": "", "points": [{"q": "מַה מְלַמֶּדֶת הַתּוֹרָה בְּאָומְרָהּ \"וְהַכְּנַעֲנִי אָז בָּאָרֶץ\"?", "options": ["שֶׁבְּאוֹתָהּ שָׁעָה הָיָה הַכְּנַעֲנִי כּוֹבֵשׁ אֶת הָאָרֶץ מִזֶּרַע שֵׁם", "שֶׁהַכְּנַעֲנִי יָשַׁב בָּאָרֶץ מֵאָז וּמֵעוֹלָם", "שֶׁהַכְּנַעֲנִי עָמַד לָצֵאת מִן הָאָרֶץ בְּאוֹתָהּ שָׁעָה"], "kasha": "מה חשוב לדעת שהכנעני היה \"אז\" בארץ?", "answer": "הכנעני היה הולך וכובש את הארץ מזרעו של שם, שבחלקו נפלה, ולכן אמר ה' שעתיד להחזירה לבני אברם, שהם מזרע שם.", "kp": ["היה הולך וכובש את ארץ ישראל", "עתיד אני להחזירה לבניך"]}]}, {"id": "12:7.1", "ch": 12, "v": 7, "n": 1, "dh": "ויבן שם מזבח", "pasuk_html": "וַיֵּרָ֤א יְהוָה֙ אֶל־אַבְרָ֔ם וַיֹּ֕אמֶר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את <mark>וַיִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ</mark> לַיהוָ֖ה הַנִּרְאֶ֥ה אֵלָֽיו׃", "pasuk_en": "וַיֵּרָא יְהוָה אֶל־אַבְרָם וַיֹּאמֶר לְזַרְעֲךָ אֶתֵּן אֶת־הָאָרֶץ הַזֹּאת וַיִּבֶן שָׁם מִזְבֵּחַ לַיהוָה הַנִּרְאֶה אֵלָיו׃", "rashi_he": "ויבן שם מזבח. עַל בְּשׂוֹרַת הַזֶּרַע וְעַל בְּשׂוֹרַת אֶרֶץ יִשְׂרָאֵל:", "rashi_en": "אברם בנה מזבח כדי להודות על שתי הבשורות: שיהיה לו זרע ושזרעו יירש את ארץ ישראל.", "note": "", "points": [{"q": "עַל מָה בָּנָה אַבְרָם אֶת הַמִּזְבֵּחַ בַּפָּסוּק זֶה?", "options": ["עַל הַבְּשׂוֹרָה שֶׁיִּהְיֶה לוֹ זֶרַע וְשֶׁיִּירַשׁ אֶת הָאָרֶץ", "עַל שֶׁנִּיצַּל מִסַּכָּנוֹת הַדֶּרֶךְ מֵחָרָן לִכְנָעַן", "כְּדֵי לְהִתְפַּלֵּל עַל בָּנָיו שֶׁיִּיכָּשְׁלוּ בַּעֲוֹן עָכָן"], "kasha": "הפסוק אינו מפרש לשם מה בנה אברם את המזבח.", "answer": "על בשורת הזרע ועל בשורת ארץ ישראל.", "kp": ["על בשורת הזרע", "ועל בשורת ארץ ישראל"]}]}, {"id": "12:8.1", "ch": 12, "v": 8, "n": 1, "dh": "ויעתק משם", "pasuk_html": "<mark>וַיַּעְתֵּ֨ק מִשָּׁ֜ם</mark> הָהָ֗רָה מִקֶּ֛דֶם לְבֵֽית־אֵ֖ל וַיֵּ֣ט אָהֳלֹ֑ה בֵּֽית־אֵ֤ל מִיָּם֙ וְהָעַ֣י מִקֶּ֔דֶם וַיִּֽבֶן־שָׁ֤ם מִזְבֵּ֙חַ֙ לַֽיהוָ֔ה וַיִּקְרָ֖א בְּשֵׁ֥ם יְהוָֽה׃", "pasuk_en": "וַיַּעְתֵּק מִשָּׁם הָהָרָה מִקֶּדֶם לְבֵית־אֵל וַיֵּט אָהֳלֹה בֵּית־אֵל מִיָּם וְהָעַי מִקֶּדֶם וַיִּבֶן־שָׁם מִזְבֵּחַ לַיהוָה וַיִּקְרָא בְּשֵׁם יְהוָה׃", "rashi_he": "ויעתק משם. אָהֳלוֹ:", "rashi_en": "\"ויעתק\" פירושו שהעתיק את אהלו ממקום למקום.", "note": "", "points": [{"q": "מַה הֶעְתִּיק אַבְרָם מִשָּׁם?", "options": ["אֶת אָהֳלוֹ", "אֶת הַמִּזְבֵּחַ שֶׁבָּנָה", "אֶת צֹאנוֹ וּבְקָרוֹ"], "kasha": "\"ויעתק\" הוא לשון הזזה, ולא מפורש מה הוזז.", "answer": "הוא העתיק את אהלו.", "kp": ["אהלו"]}]}, {"id": "12:8.2", "ch": 12, "v": 8, "n": 2, "dh": "מקדם לבית אל", "pasuk_html": "וַיַּעְתֵּ֨ק מִשָּׁ֜ם הָהָ֗רָה <mark>מִקֶּ֛דֶם לְבֵֽית־אֵ֖ל</mark> וַיֵּ֣ט אָהֳלֹ֑ה בֵּֽית־אֵ֤ל מִיָּם֙ וְהָעַ֣י מִקֶּ֔דֶם וַיִּֽבֶן־שָׁ֤ם מִזְבֵּ֙חַ֙ לַֽיהוָ֔ה וַיִּקְרָ֖א בְּשֵׁ֥ם יְהוָֽה׃", "pasuk_en": "וַיַּעְתֵּק מִשָּׁם הָהָרָה מִקֶּדֶם לְבֵית־אֵל וַיֵּט אָהֳלֹה בֵּית־אֵל מִיָּם וְהָעַי מִקֶּדֶם וַיִּבֶן־שָׁם מִזְבֵּחַ לַיהוָה וַיִּקְרָא בְּשֵׁם יְהוָה׃", "rashi_he": "מקדם לבית אל. בְּמִזְרָחָהּ שֶׁל בֵּית אֵל נִמְצֵאת בֵּית אֵל בְּמַעֲרָבוֹ, הוּא שֶׁנֶּאֱמַר בֵּית אֵל מִיָּם:", "rashi_en": "אברם נטה את אהלו במזרחה של בית אל, כך שבית אל הייתה ממערב לו. לכן נאמר \"בית אל מים\".", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"מִקֶּדֶם לְבֵיתְאֵל\"?", "options": ["בְּמִזְרָחָהּ שֶׁל בֵּית אֵל, וּבֵית אֵל נִמְצֵאת מִמַּעֲרָבוֹ", "קֹודֶם שֶׁהִגִּיעַ אַבְרָם לְבֵית אֵל", "בַּיָּמִים הַקְּדוּמִים, לִפְנֵי שֶׁנִּבְנְתָה בֵּית אֵל"], "kasha": "המילה \"מקדם\" יכולה להתפרש כזמן ויכולה להתפרש ככיוון.", "answer": "במזרחה של בית אל, כך שבית אל נמצאת ממערבו, וזהו שנאמר \"בית אל מים\".", "kp": ["במזרחה של בית אל", "בית אל במערבו"]}]}, {"id": "12:8.3", "ch": 12, "v": 8, "n": 3, "dh": "אהלו", "pasuk_html": "וַיַּעְתֵּ֨ק מִשָּׁ֜ם הָהָ֗רָה מִקֶּ֛דֶם לְבֵֽית־אֵ֖ל וַיֵּ֣ט <mark>אָהֳלֹ֑ה</mark> בֵּֽית־אֵ֤ל מִיָּם֙ וְהָעַ֣י מִקֶּ֔דֶם וַיִּֽבֶן־שָׁ֤ם מִזְבֵּ֙חַ֙ לַֽיהוָ֔ה וַיִּקְרָ֖א בְּשֵׁ֥ם יְהוָֽה׃", "pasuk_en": "וַיַּעְתֵּק מִשָּׁם הָהָרָה מִקֶּדֶם לְבֵית־אֵל וַיֵּט אָהֳלֹה בֵּית־אֵל מִיָּם וְהָעַי מִקֶּדֶם וַיִּבֶן־שָׁם מִזְבֵּחַ לַיהוָה וַיִּקְרָא בְּשֵׁם יְהוָה׃", "rashi_he": "אהלו. אהלה כְתִיב, בַּתְּחִלָּה נָטָה אֶת אֹהֶל אִשְׁתּוֹ וְאַחַר כָּךְ אֶת שֶׁלּוֹ (בראשית רבה):", "rashi_en": "בפסוק כתוב \"אהלה\" בה\"א, ללמד שאברם נטה קודם את אוהל אשתו ורק אחר כך את אוהלו.", "note": "", "points": [{"q": "מַה לוֹמְדִים מִכָּךְ שֶׁבַּפָּסוּק נִכְתַּב \"אָהֳלֹה\" בְּהֵ\"א?", "options": ["שֶׁקֹּודֶם נָטָה אֶת אֹוהֶל אִשְׁתּוֹ וְאַחַר כָּךְ אֶת שֶׁלּוֹ", "שֶׁהָאֹוהֶל הָיָה שַׁייָּךְ לְשָׂרָה וְלֹא לְאַבְרָם", "שֶׁאַבְרָם וְשָׂרָה גָּרוּ יַחַד בְּאֹוהֶל אֶחָד"], "kasha": "למה כתוב \"אהלה\", בלשון נקבה, כשמדובר באוהל של אברם?", "answer": "\"אהלה\" כתיב, כי בתחילה נטה את אוהל אשתו ואחר כך את שלו.", "kp": ["אהלה כתיב", "בתחלה נטה את אהל אשתו"]}]}, {"id": "12:8.4", "ch": 12, "v": 8, "n": 4, "dh": "ויבן שם מזבח", "pasuk_html": "וַיַּעְתֵּ֨ק מִשָּׁ֜ם הָהָ֗רָה מִקֶּ֛דֶם לְבֵֽית־אֵ֖ל וַיֵּ֣ט אָהֳלֹ֑ה בֵּֽית־אֵ֤ל מִיָּם֙ וְהָעַ֣י מִקֶּ֔דֶם <mark>וַיִּֽבֶן־שָׁ֤ם מִזְבֵּ֙חַ֙</mark> לַֽיהוָ֔ה וַיִּקְרָ֖א בְּשֵׁ֥ם יְהוָֽה׃", "pasuk_en": "וַיַּעְתֵּק מִשָּׁם הָהָרָה מִקֶּדֶם לְבֵית־אֵל וַיֵּט אָהֳלֹה בֵּית־אֵל מִיָּם וְהָעַי מִקֶּדֶם וַיִּבֶן־שָׁם מִזְבֵּחַ לַיהוָה וַיִּקְרָא בְּשֵׁם יְהוָה׃", "rashi_he": "ויבן שם מזבח. נִתְנַבֵּא שֶׁעֲתִידִין בָּנָיו לְהִכָּשֵׁל שָׁם עַל עֲוֹן עָכָן, וְהִתְפַּלֵּל שָׁם עֲלֵיהֶם:", "rashi_en": "אברם ראה בנבואה שבניו עתידים להיכשל שם בגלל חטא עכן, ובנה שם מזבח כדי להתפלל עליהם.", "note": "", "points": [{"q": "לָמָּה בָּנָה אַבְרָם מִזְבֵּחַ נוֹסָף בַּמָּקוֹם הַזֶּה, בֵּין בֵּית אֵל לָעַי?", "options": ["כְּדֵי לְהִתְפַּלֵּל עַל בָּנָיו שֶׁיִּיכָּשְׁלוּ שָׁם בַּעֲוֹן עָכָן", "כְּדֵי לְהוֹדוֹת עַל בְּשׂוֹרַת הַזֶּרַע וְהָאָרֶץ", "כְּדֵי לְפַרְסֵם אֶת שֵׁם ה' בֵּין הַכְּנַעֲנִים"], "kasha": "למה בנה אברם מזבח נוסף, אחרי שכבר בנה מזבח בשכם?", "answer": "הוא ניבא שבניו עתידים להיכשל שם בעון עכן, והתפלל שם עליהם.", "kp": ["להכשל שם על עון עכן", "והתפלל שם עליהם"]}]}, {"id": "12:9.1", "ch": 12, "v": 9, "n": 1, "dh": "הלוך ונסוע", "pasuk_html": "וַיִּסַּ֣ע אַבְרָ֔ם <mark>הָל֥וֹךְ וְנָס֖וֹעַ</mark> הַנֶּֽגְבָּה׃ (פ)", "pasuk_en": "וַיִּסַּע אַבְרָם הָלוֹךְ וְנָסוֹעַ הַנֶּגְבָּה׃", "rashi_he": "הלוך ונסוע. לִפְרָקִים יוֹשֵׁב כָּאן חֹדֶשׁ אוֹ יוֹתֵר, וְנוֹסֵעַ מִשָּׁם וְנוֹטֶה אָהֳלוֹ בְּמָקוֹם אַחֵר, וְכָל מַסָּעָיו הַנֶּגְבָּה, לָלֶכֶת לִדְרוֹמָהּ שֶׁל אֶרֶץ יִשְֹרָאֵל וְהִיא לְצַד יְרוּשָׁלַיִם, שֶׁהוּא בְּחֶלְקוֹ שֶׁל יְהוּדָה, שֶׁנָּטְלוּ בִּדְרוֹמָהּ שֶׁל אֶרֶץ יִשְֹרָאֵל לְהַר הַמּוֹרִיָּה שֶׁהִיא נַחֲלָתוֹ (בראשית רבה):", "rashi_en": "אברם נסע בהפסקות: ישב חודש או יותר במקום אחד ואז נסע הלאה. כל מסעותיו היו דרומה, לכיוון ירושלים והר המוריה שבחלקו של יהודה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"הָלוֹךְ וְנָסוֹעַ\"?", "options": ["נָסַע בְּהַפְסָקוֹת, וְשָׁהָה חוֹדֶשׁ אוֹ יוֹתֵר בְּכָל מָקוֹם", "נָסַע בִּרְצִיפוּת בְּלִי לַעֲצֹור בְּשׁוּם מָקוֹם", "הָלַךְ בְּרֶגֶל וְנָסַע בִּרְכִיבָה לְסֵירוּגִין"], "kasha": "מה פירוש הלשון הכפולה \"הלוך ונסוע\"?", "answer": "לפרקים ישב במקום אחד חודש או יותר, ואחר כך נסע משם ונטה את אהלו במקום אחר.", "kp": ["לפרקים יושב כאן חדש או יותר"]}, {"q": "לְאָן כִּיווֵּן אַבְרָם אֶת כָּל מַסָּעוֹתָיו \"הַנֶּגְבָּה\"?", "options": ["לְצַד יְרוּשָׁלַיִם וְהַר הַמּוֹרִיָּה שֶׁבְּחֶלְקוֹ שֶׁל יְהוּדָה", "לְצַד מִצְרַיִם, כְּדֵי לָרֶדֶת לְשָׁם בְּעֵת הַצֹּורֶךְ", "לְצַד יַם הַמֶּלַח וְעָרֵי סְדֹום"], "kasha": "למה מדגישה התורה שמסעותיו היו דווקא \"הנגבה\"?", "answer": "כל מסעיו היו לדרומה של ארץ ישראל, לצד ירושלים, שבחלקו של יהודה, עד הר המוריה.", "kp": ["וכל מסעיו הנגבה", "והיא לצד ירושלים", "להר המוריה"]}]}, {"id": "12:10.1", "ch": 12, "v": 10, "n": 1, "dh": "רעב בארץ", "pasuk_html": "וַיְהִ֥י <mark>רָעָ֖ב בָּאָ֑רֶץ</mark> וַיֵּ֨רֶד אַבְרָ֤ם מִצְרַ֙יְמָה֙ לָג֣וּר שָׁ֔ם כִּֽי־כָבֵ֥ד הָרָעָ֖ב בָּאָֽרֶץ׃", "pasuk_en": "וַיְהִי רָעָב בָּאָרֶץ וַיֵּרֶד אַבְרָם מִצְרַיְמָה לָגוּר שָׁם כִּי־כָבֵד הָרָעָב בָּאָרֶץ׃", "rashi_he": "רעב בארץ. בְּאוֹתָהּ הָאָרֶץ לְבַדָּהּ, לְנַסּוֹתוֹ, אִם יְהַרְהֵר אַחַר דְּבָרָיו שֶׁל הַקָּבָּ\"ה שֶׁאָמַר לָלֶכֶת אֶל אֶרֶץ כְּנַעַן, וְעַכְשָׁו מַשִּׂיאוֹ לָצֵאת מִמֶּנָּה:", "rashi_en": "הרעב היה רק בארץ כנען, כדי לנסות את אברם אם יהרהר אחר דברי ה', שציווה עליו ללכת לכנען ועכשיו מכריח אותו לצאת ממנה.", "note": "", "points": [{"q": "לָמָּה בָּא הָרָעָב דַּווְקָא בְּאֶרֶץ כְּנַעַן לְפִי רַשִׁ\"י?", "options": ["כְּדֵי לְנַסּוֹת אֶת אַבְרָם אִם יְהַרְהֵר אַחַר דִּבְרֵי ה'", "כְּדֵי לְהַעֲנִישׁ אֶת הַכְּנַעֲנִים עַל מַעֲשֵׂיהֶם הָרָעִים", "כְּדֵי שֶׁאַבְרָם יֵרֵד לְמִצְרַיִם וְיִתְעַשֵּׁר שָׁם"], "kasha": "למה מדגיש הפסוק שהרעב היה \"בארץ\", ומה טעמו של הרעב?", "answer": "הרעב היה באותה הארץ לבדה, כדי לנסות את אברם אם יהרהר אחר דברי ה', שאמר לו ללכת לכנען ועכשיו מכריחו לצאת ממנה.", "kp": ["באותה הארץ לבדה", "אם יהרהר אחר דבריו"]}]}, {"id": "12:11.1", "ch": 12, "v": 11, "n": 1, "dh": "הנה נא ידעתי", "pasuk_html": "וַיְהִ֕י כַּאֲשֶׁ֥ר הִקְרִ֖יב לָב֣וֹא מִצְרָ֑יְמָה וַיֹּ֙אמֶר֙ אֶל־שָׂרַ֣י אִשְׁתּ֔וֹ <mark>הִנֵּה־נָ֣א יָדַ֔עְתִּי</mark> כִּ֛י אִשָּׁ֥ה יְפַת־מַרְאֶ֖ה אָֽתְּ׃", "pasuk_en": "וַיְהִי כַּאֲשֶׁר הִקְרִיב לָבוֹא מִצְרָיְמָה וַיֹּאמֶר אֶל־שָׂרַי אִשְׁתּוֹ הִנֵּה־נָא יָדַעְתִּי כִּי אִשָּׁה יְפַת־מַרְאֶה אָתְּ׃", "rashi_he": "הנה נא ידעתי. מִדְרַש אַגָּדָה עַד עַכְשָׁו לֹא הִכִּיר בָּהּ מִתּוֹךְ צְנִיעוּת שֶׁבִּשְׁנֵיהֶם, וְעַכְשָׁו הִכִּיר בָּה עַל יְדֵי מַעֲשֶׂה. דָּבָר אַחֵר, מִנְהַג הָעוֹלָם שֶׁעַל יְדֵי טֹרַח הַדֶּרֶךְ אָדָם מִתְבַּזֶּה, וְזֹאת עָמְדָה בְּיָפְיָהּ. וּפְשׁוּטוֹ שֶׁל מִקְרָא הִנֵּה נָא הִגִּיעַ הַשָּׁעָה שֶׁיֵּשׁ לִדְאֹג עַל יָפְיֵךְ, יָדַעְתִּי זֶה יָמִים רַבִּים כִּי יְפַת מַרְאֶה אַתְּ, וְעַכְשָׁו אָנוּ בָאִים בֵּין אֲנָשִׁים שְׁחֹרִים וּמְכֹעָרִים, אֲחֵיהֶם שֶׁל כּוּשִׁים, וְלֹא הֻרְגְּלוּ בְאִשָּׁה יָפָה; וְדוֹמֶה לוֹ הִנֶּה נָּא אֲדֹנַי סוּרוּ נָא (בר' י\"ט):", "rashi_en": "לפי המדרש, אברם לא הבחין עד עכשיו ביופייה של שרה מרוב צניעות. לפי הפשט, הוא ידע מזמן שהיא יפה, אבל עכשיו הגיעה השעה לדאוג, כי הם באים בין אנשים שאינם רגילים באשה יפה.", "note": "", "points": [{"q": "לְפִי פְּשׁוּטוֹ שֶׁל מִקְרָא, מַה הִתְכַּוֵּון אַבְרָם בְּאָומְרוֹ \"יָדַעְתִּי\"?", "options": ["יָדַע מִזְּמַן שֶׁהִיא יָפָה, וְעַכְשָׁיו הִגִּיעָה שָׁעָה לִדְאוֹג", "רַק עַכְשָׁיו הִבְחִין לָרִאשׁוֹנָה בְּיָופְיָיהּ", "גִּילָּה שֶׁיּוֹפְייָהּ לֹא נִפְגַּע מִטֹּורַח הַדֶּרֶךְ"], "kasha": "וכי אברם לא ידע עד עכשיו שאשתו יפה?", "answer": "\"הנה נא\" פירושו שהגיעה השעה לדאוג על יופייה; ידע זה ימים רבים שהיא יפה, אבל עכשיו באים בין אנשים שחורים ומכוערים שאינם רגילים באשה יפה.", "kp": ["הגיע השעה שיש לדאג", "ידעתי זה ימים רבים"]}, {"q": "לְפִי מִדְרַשׁ הָאַגָּדָה, לָמָּה רַק עַכְשָׁיו הִכִּיר אַבְרָם בְּיָופְייָהּ שֶׁל שָׂרָי?", "options": ["מִתּוֹךְ צְנִיעוּת לֹא הִכִּיר בָּהּ עַד עַכְשָׁיו", "כִּי עַד עַכְשָׁיו לֹא הָיְיתָה יָפָה כָּל כָּךְ", "כִּי רַק עַכְשָׁיו סִיפְּרוּ לוֹ אֲחֵרִים עַל יוֹפְיָיהּ"], "kasha": "וכי אברם לא ידע עד עכשיו שאשתו יפה?", "answer": "עד עכשיו לא הכיר בה מתוך הצניעות של שניהם, ועכשיו הכיר בה על ידי מעשה.", "kp": ["מתוך צניעות שבשניהם"]}]}, {"id": "12:13.1", "ch": 12, "v": 13, "n": 1, "dh": "למען ייטב לי בעבורך", "pasuk_html": "אִמְרִי־נָ֖א אֲחֹ֣תִי אָ֑תְּ <mark>לְמַ֙עַן֙ יִֽיטַב־לִ֣י בַעֲבוּרֵ֔ךְ</mark> וְחָיְתָ֥ה נַפְשִׁ֖י בִּגְלָלֵֽךְ׃", "pasuk_en": "אִמְרִי־נָא אֲחֹתִי אָתְּ לְמַעַן יִיטַב־לִי בַעֲבוּרֵךְ וְחָיְתָה נַפְשִׁי בִּגְלָלֵךְ׃", "rashi_he": "למען ייטב לי בעבורך. יִתְּנוּ לִי מַתָּנוֹת:", "rashi_en": "אברם קיווה שבזכות שרי יתנו לו מתנות.", "note": "", "points": [{"q": "אֵיזוֹ טוֹבָה קִיווָּה אַבְרָם לְקַבֵּל בַּעֲבוּר שָׂרַי?", "options": ["שֶׁיִּתְּנוּ לוֹ מַתָּנוֹת", "שֶׁיְּכַבְּדוּ אוֹתוֹ כְּאָדָם חָשׁוּב", "שֶׁיִּתְּנוּ לוֹ מָקוֹם לָגוּר בּוֹ"], "kasha": "לא מפורש באיזה אופן \"ייטב\" לאברם בעבור שרי.", "answer": "יתנו לו מתנות.", "kp": ["יתנו לי מתנות"]}]}, {"id": "12:14.1", "ch": 12, "v": 14, "n": 1, "dh": "ויהי כבוא אברם מצרימה", "pasuk_html": "<mark>וַיְהִ֕י כְּב֥וֹא אַבְרָ֖ם מִצְרָ֑יְמָה</mark> וַיִּרְא֤וּ הַמִּצְרִים֙ אֶת־הָ֣אִשָּׁ֔ה כִּֽי־יָפָ֥ה הִ֖וא מְאֹֽד׃", "pasuk_en": "וַיְהִי כְּבוֹא אַבְרָם מִצְרָיְמָה וַיִּרְאוּ הַמִּצְרִים אֶת־הָאִשָּׁה כִּי־יָפָה הִוא מְאֹד׃", "rashi_he": "ויהי כבוא אברם מצרימה. הָיָה לוֹ לוֹמַר כְּבוֹאָם מִצְרַיְמָה? אֶלָּא לִמֵּד שֶׁהִטְמִין אוֹתָהּ בְּתֵבָה, וְעַל יְדֵי שֶׁתָּבְעוּ אֶת הַמֶּכֶס פָּתְחוּ וְרָאוּ אוֹתָהּ:", "rashi_en": "היה צריך לכתוב \"כבואם\", שהרי שרי באה עמו. מכאן לומדים שאברם הטמין אותה בתיבה, וכשדרשו ממנו מכס פתחו את התיבה וראו אותה.", "note": "", "points": [{"q": "מַה קָשֶׁה לְרַשִׁ\"י בִּלְשׁוֹן \"כְּבוֹא אַבְרָם מִצְרַיְמָה\"?", "options": ["הָיָה צָרִיךְ לוֹמַר \"כְּבוֹאָם\", שֶׁהֲרֵי שָׂרַי בָּאָה עִמּוֹ", "לֹא בָּרוּר מָתַי בְּדִיּוּק הִגִּיעַ אַבְרָם לְמִצְרַיִם", "הֲרֵי כְּבָר נֶאֱמַר קֹודֶם שֶׁאַבְרָם יָרַד מִצְרַיְמָה"], "kasha": "למה נאמר \"כבוא אברם\" בלשון יחיד, והרי שרי באה עמו?", "answer": "מכאן לומדים שהטמין אותה בתיבה, וכשתבעו את המכס פתחו אותה וראו אותה.", "kp": ["היה לו לומר כבואם מצרימה", "שהטמין אותה בתבה"]}]}, {"id": "12:15.1", "ch": 12, "v": 15, "n": 1, "dh": "ויהללו אותה אל פרעה", "pasuk_html": "וַיִּרְא֤וּ אֹתָהּ֙ שָׂרֵ֣י פַרְעֹ֔ה <mark>וַיְהַֽלְל֥וּ אֹתָ֖הּ אֶל־פַּרְעֹ֑ה</mark> וַתֻּקַּ֥ח הָאִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה׃", "pasuk_en": "וַיִּרְאוּ אֹתָהּ שָׂרֵי פַרְעֹה וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה וַתֻּקַּח הָאִשָּׁה בֵּית פַּרְעֹה׃", "rashi_he": "ויהללו אותה אל פרעה. הִלְּלוּהָ בֵינֵיהֶם לוֹמַר הֲגוּנָה זוֹ לַמֶּלֶךְ:", "rashi_en": "שרי פרעה שיבחו את שרי ביניהם ואמרו שהיא ראויה למלך.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וַיְהַלְלוּ אֹתָהּ\" לְפִי רַשִׁ\"י?", "options": ["שִׁיבְּחוּ אוֹתָהּ בֵּינֵיהֶם וְאָמְרוּ שֶׁהִיא רְאוּיָה לַמֶּלֶךְ", "שִׁיבְּחוּ אוֹתָהּ בְּאָוזְנֵי פַּרְעֹה בְּאַרְמוֹנוֹ", "שָׂרַי שִׁיבְּחָה אֶת פַּרְעֹה לִפְנֵי שָׂרָיו"], "kasha": "מה היה תוכן ההלל, ולפני מי הללו אותה?", "answer": "הם הללו אותה ביניהם ואמרו שאשה זו הגונה למלך.", "kp": ["הללוה ביניהם", "הגונה זו למלך"]}]}, {"id": "12:16.1", "ch": 12, "v": 16, "n": 1, "dh": "ולאברם היטיב", "pasuk_html": "<mark>וּלְאַבְרָ֥ם הֵיטִ֖יב</mark> בַּעֲבוּרָ֑הּ וַֽיְהִי־ל֤וֹ צֹאן־וּבָקָר֙ וַחֲמֹרִ֔ים וַעֲבָדִים֙ וּשְׁפָחֹ֔ת וַאֲתֹנֹ֖ת וּגְמַלִּֽים׃", "pasuk_en": "וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ וַיְהִי־לוֹ צֹאן־וּבָקָר וַחֲמֹרִים וַעֲבָדִים וּשְׁפָחֹת וַאֲתֹנֹת וּגְמַלִּים׃", "rashi_he": "ולאברם היטיב. פַּרְעֹה בעבורה:", "rashi_en": "פרעה הוא שהיטיב לאברם, בעבור שרי.", "note": "", "points": [{"q": "מִי הֵיטִיב לְאַבְרָם בַּעֲבוּר שָׂרַי?", "options": ["פַּרְעֹה", "שָׂרֵי פַרְעֹה", "הַמִּצְרִים שֶׁרָאוּ אוֹתָהּ"], "kasha": "הפסוק אינו מפרש מי הוא שהיטיב לאברם.", "answer": "פרעה היטיב לו בעבורה.", "kp": ["פרעה בעבורה"]}]}, {"id": "12:17.1", "ch": 12, "v": 17, "n": 1, "dh": "וינגע ה' וגו'", "pasuk_html": "<mark>וַיְנַגַּ֨ע יְהוָ֧ה</mark> ׀ אֶת־פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְאֶת־בֵּית֑וֹ עַל־דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׃", "pasuk_en": "וַיְנַגַּע יְהוָה אֶת־פַּרְעֹה נְגָעִים גְּדֹלִים וְאֶת־בֵּיתוֹ עַל־דְּבַר שָׂרַי אֵשֶׁת אַבְרָם׃", "rashi_he": "וינגע ה' וגו'. בְּמַכַּת רָאתָן לָקָה, שֶׁהַתַּשְׁמִישׁ קָשֶׁה לוֹ (בראשית רבה):", "rashi_en": "פרעה לקה במכת ראתן, מחלה שבגללה התשמיש קשה לו.", "note": "", "points": [{"q": "בְּאֵיזֶה נֶגַע לָקָה פַּרְעֹה לְפִי רַשִׁ\"י?", "options": ["בְּמַכַּת רַאֲתָן, שֶׁהַתַּשְׁמִישׁ קָשֶׁה לוֹ", "בַּצָּרַעַת שֶׁפָּשְׁטָה בְּכָל גּוּפוֹ", "בַּדֶּבֶר שֶׁפָּגַע בִּבְהֶמוֹתָיו"], "kasha": "הפסוק אומר \"נגעים גדלים\" ואינו מפרש איזה נגע.", "answer": "הוא לקה במכת ראתן, שהתשמיש קשה לו.", "kp": ["במכת ראתן לקה", "שהתשמיש קשה לו"]}]}, {"id": "12:17.2", "ch": 12, "v": 17, "n": 2, "dh": "ואת ביתו", "pasuk_html": "וַיְנַגַּ֨ע יְהוָ֧ה ׀ אֶת־פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים <mark>וְאֶת־בֵּית֑וֹ</mark> עַל־דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׃", "pasuk_en": "וַיְנַגַּע יְהוָה אֶת־פַּרְעֹה נְגָעִים גְּדֹלִים וְאֶת־בֵּיתוֹ עַל־דְּבַר שָׂרַי אֵשֶׁת אַבְרָם׃", "rashi_he": "(ואת ביתו כְּתַרְגּוּמוֹ וְעַל אֱנַשׁ בֵּיתֵהּ וּמִדְרָשׁוֹ לְרַבּוֹת כֹּתָלָיו וְעַמּוּדָיו וְכֵּלָיו בְּרַשִׁ\"י יָשָׁן):", "rashi_en": "לפי התרגום, \"ואת ביתו\" הם אנשי ביתו. לפי המדרש, הכוונה גם לכתלי הבית, לעמודיו ולכליו.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ, מָה נִכְלַל בְּ\"וְאַתְבֵּיתוּ\" שֶׁלָּקָה?", "options": ["גַּם כָּתְלֵי הַבַּיִת, עַמּוּדָיו וּכֵלָיו", "רַק בְּנֵי מִשְׁפַּחְתּוֹ הַקְּרוֹבִים שֶׁל פַּרְעֹה", "רַק שָׂרָיו וַעֲבָדָיו שֶׁל פַּרְעֹה"], "kasha": "מה פירוש \"ביתו\": אנשי הבית או הבית עצמו?", "answer": "כתרגומו, אנשי ביתו; ומדרשו לרבות את כתליו, עמודיו וכליו.", "kp": ["ועל אנש ביתה", "לרבות כתליו ועמודיו וכליו"]}]}, {"id": "12:17.3", "ch": 12, "v": 17, "n": 3, "dh": "על דבר שרי", "pasuk_html": "וַיְנַגַּ֨ע יְהוָ֧ה ׀ אֶת־פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְאֶת־בֵּית֑וֹ <mark>עַל־דְּבַ֥ר שָׂרַ֖י</mark> אֵ֥שֶׁת אַבְרָֽם׃", "pasuk_en": "וַיְנַגַּע יְהוָה אֶת־פַּרְעֹה נְגָעִים גְּדֹלִים וְאֶת־בֵּיתוֹ עַל־דְּבַר שָׂרַי אֵשֶׁת אַבְרָם׃", "rashi_he": "על דבר שרי. עַל פִּי דִּבּוּרָהּ; אוֹמֶרֶת לַמַּלְאָךְ הַךְ, וְהוּא מַכֶּה;", "rashi_en": "\"על דבר שרי\" פירושו על פי דיבורה: שרי אומרת למלאך \"הך\", והוא מכה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"עַלְדְּבַר שָׂרַי\" לְפִי רַשִׁ\"י?", "options": ["עַל פִּי דִּיבּוּרָהּ: הִיא אוֹמֶרֶת לַמַּלְאָךְ לְהַכּוֹת וְהוּא מַכֶּה", "בִּגְלַל שֶׁפַּרְעֹה דִּיבֵּר עִם שָׂרַי וּבִיקֵּשׁ לְקַחְתָּהּ", "בִּגְלַל שֶׁאַבְרָם אָמַר שֶׁהִיא אֲחוֹתוֹ"], "kasha": "מה פירוש \"דבר\" כאן: עניין, או דיבור ממש?", "answer": "על פי דיבורה: היא אומרת למלאך \"הך\", והוא מכה.", "kp": ["על פי דבורה", "אומרת למלאך הך"]}]}, {"id": "12:19.1", "ch": 12, "v": 19, "n": 1, "dh": "קח ולך", "pasuk_html": "לָמָ֤ה אָמַ֙רְתָּ֙ אֲחֹ֣תִי הִ֔וא וָאֶקַּ֥ח אֹתָ֛הּ לִ֖י לְאִשָּׁ֑ה וְעַתָּ֕ה הִנֵּ֥ה אִשְׁתְּךָ֖ <mark>קַ֥ח וָלֵֽךְ׃</mark>", "pasuk_en": "לָמָה אָמַרְתָּ אֲחֹתִי הִוא וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה וְעַתָּה הִנֵּה אִשְׁתְּךָ קַח וָלֵךְ׃", "rashi_he": "קח ולך. לֹא כַאֲבִימֶלֶךְ שֶׁאָמַר לוֹ הִנֵּה אַרְצִי לְפָנֶיךָ, אֶלָּא אָמַר לוֹ לֵךְ וְאַל תַּעֲמֹד, שֶׁהַמִּצְרִים שְׁטוּפֵי זִמָּה הֵם, שֶׁנֶּאֱמַר וְזִרְמַת סוּסִים זִרְמָתָם: (יחזקאל כ\"ג):", "rashi_en": "פרעה, בניגוד לאבימלך שהזמין את אברהם לשבת בארצו, אמר לאברם ללכת ולא להישאר, כי המצרים שטופי זימה.", "note": "", "points": [{"q": "לָמָּה אָמַר פַּרְעֹה לְאַבְרָם \"קַח וָלֵךְ\" וְלֹא הִצִּיעַ לוֹ לְהִישָּׁאֵר?", "options": ["כִּי הַמִּצְרִים שְׁטוּפֵי זִימָּה, וְאֵין לוֹ לְהִישָּׁאֵר שָׁם", "כִּי פַּרְעֹה כָּעַס עַל אַבְרָם וְרָצָה לְהַעֲנִישׁוֹ", "כִּי פַּרְעֹה יָדַע שֶׁהָרָעָב בִּכְנַעַן כְּבָר הִסְתַּיֵּים"], "kasha": "למה אמר פרעה \"ולך\", ולא כאבימלך שאמר \"הנה ארצי לפניך\"?", "answer": "אמר לו: לך ואל תעמוד כאן, כי המצרים שטופי זימה הם.", "kp": ["לך ואל תעמד", "שהמצרים שטופי זמה הם"]}]}, {"id": "12:20.1", "ch": 12, "v": 20, "n": 1, "dh": "ויצו עליו", "pasuk_html": "<mark>וַיְצַ֥ו עָלָ֛יו</mark> פַּרְעֹ֖ה אֲנָשִׁ֑ים וַֽיְשַׁלְּח֥וּ אֹת֛וֹ וְאֶת־אִשְׁתּ֖וֹ וְאֶת־כָּל־אֲשֶׁר־לֽוֹ׃", "pasuk_en": "וַיְצַו עָלָיו פַּרְעֹה אֲנָשִׁים וַיְשַׁלְּחוּ אֹתוֹ וְאֶת־אִשְׁתּוֹ וְאֶת־כָּל־אֲשֶׁר־לוֹ׃", "rashi_he": "ויצו עליו. עַל אוֹדוֹתָיו, לְשַׁלְּחוֹ וּלְשָׁמְרוֹ:", "rashi_en": "\"ויצו עליו\" פירושו שפרעה ציווה אנשים בעניינו של אברם, ללוותו ולשמור עליו.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וַיְצַו עָלָיו\" בַּפָּסוּק זֶה?", "options": ["צִיווָּה אֲנָשִׁים בְּעִנְייָנוֹ, לְלַוּוֹתוֹ וְלִשְׁמוֹר עָלָיו", "צִיווָּה עַל אַבְרָם לַעֲזוֹב מִיָּד אֶת מִצְרַיִם", "מִינָּה אֲנָשִׁים שֶׁיִּשְׁגִּיחוּ עָלָיו כְּעַל אַסִּיר"], "kasha": "\"ויצו עליו\" משמע שציווה את אברם, אבל הציווי היה לאנשים.", "answer": "\"עליו\" פירושו על אודותיו: ציווה אנשים לשלחו ולשמרו.", "kp": ["על אודותיו", "לשלחו ולשמרו"]}]}, {"id": "12:20.2", "ch": 12, "v": 20, "n": 2, "dh": "וישלחו", "pasuk_html": "וַיְצַ֥ו עָלָ֛יו פַּרְעֹ֖ה אֲנָשִׁ֑ים <mark>וַֽיְשַׁלְּח֥וּ</mark> אֹת֛וֹ וְאֶת־אִשְׁתּ֖וֹ וְאֶת־כָּל־אֲשֶׁר־לֽוֹ׃", "pasuk_en": "וַיְצַו עָלָיו פַּרְעֹה אֲנָשִׁים וַיְשַׁלְּחוּ אֹתוֹ וְאֶת־אִשְׁתּוֹ וְאֶת־כָּל־אֲשֶׁר־לוֹ׃", "rashi_he": "וישלחו. כְּתַרְגּוּמוֹ וְאַלְוִיאוּ:", "rashi_en": "\"וישלחו\" פירושו כתרגום אונקלוס: ליוו אותו.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וַיְשַׁלְּחוּ\" לְפִי הַתַּרְגּוּם שֶׁמֵּבִיא רַשִׁ\"י?", "options": ["לִיווּ אוֹתוֹ בְּדַרְכּוֹ", "גֵּירְשׁוּ אוֹתוֹ מִן הָאָרֶץ", "שִׁלְּחוּ אוֹתוֹ עִם מַתָּנוֹת"], "kasha": "\"וישלחו\" עלול להתפרש כגירוש.", "answer": "כתרגומו \"ואלוויאו\", כלומר ליוו אותו.", "kp": ["כתרגומו ואלויאו"]}]}, {"id": "13:1.1", "ch": 13, "v": 1, "n": 1, "dh": "ויעל אברם וגו' הנגבה", "pasuk_html": "<mark>וַיַּעַל֩ אַבְרָ֨ם</mark> מִמִּצְרַ֜יִם ה֠וּא וְאִשְׁתּ֧וֹ וְכָל־אֲשֶׁר־ל֛וֹ וְל֥וֹט עִמּ֖וֹ <mark>הַנֶּֽגְבָּה׃</mark>", "pasuk_en": "וַיַּעַל אַבְרָם מִמִּצְרַיִם הוּא וְאִשְׁתּוֹ וְכָל־אֲשֶׁר־לוֹ וְלוֹט עִמּוֹ הַנֶּגְבָּה׃", "rashi_he": "ויעל אברם וגו' הנגבה. לָבֹא לִדְרוֹמָהּ שֶׁל אֶרֶץ יִשְֹרָאֵל, כְּמוֹ שֶׁאָמַר לְמַעְלָה הָלוֹךְ וְנָסוֹעַ הַנֶּגְבָּה, לְהַר הַמּוֹרִיָּה; וּמִכָּל מָקוֹם כְּשֶׁהוּא הוֹלֵךְ מִמִּצְרַיִם לְאֶרֶץ כְּנַעַן, מִדָּרוֹם לְצָפוֹן הוּא מְהַלֵּךְ, שֶׁאֶרֶץ מִצְרַיִם בִּדְרוֹמָהּ שֶׁל אֶרֶץ יִשְׂרָאֵל כְּמוֹ שֶׁמּוֹכִיחַ בַּמַּסָּעוֹת וּבִגְבוּלֵי הָאָרֶץ:", "rashi_en": "אברם עלה ממצרים כדי להגיע לדרום ארץ ישראל, אל הר המוריה. בפועל הוא הלך מדרום לצפון, כי מצרים נמצאת דרומית לארץ ישראל.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַה פֵּירוּשׁ \"הַנֶּגְבָּה\" בַּפָּסוּק, אִם מִצְרַיִם נִמְצֵאת דְּרוֹמִית לְאֶרֶץ יִשְׂרָאֵל?", "options": ["שֶׁהָלַךְ כְּדֵי לְהַגִּיעַ לְדָרוֹם אֶרֶץ יִשְׂרָאֵל, אֶל הַר הַמּוֹרִיָּה", "שֶׁהָלַךְ דָּרוֹמָה מִמִּצְרַיִם, וְהִתְרַחֵק מֵאֶרֶץ כְּנַעַן", "שֶׁהָלַךְ אֶל הַחֵלֶק הַצְּפוֹנִי שֶׁל אֶרֶץ יִשְׂרָאֵל"], "kasha": "מצרים נמצאת בדרום ארץ ישראל, ואיך ייתכן שההולך ממנה לארץ כנען הולך \"הנגבה\"?", "answer": "\"הנגבה\" פירושו שמטרתו הייתה להגיע לדרום ארץ ישראל, אל הר המוריה. אבל הדרך עצמה ממצרים לארץ כנען היא מדרום לצפון.", "kp": ["לבא לדרומה של ארץ ישראל", "מדרום לצפון הוא מהלך"]}]}, {"id": "13:2.1", "ch": 13, "v": 2, "n": 1, "dh": "כבד מאד", "pasuk_html": "וְאַבְרָ֖ם <mark>כָּבֵ֣ד מְאֹ֑ד</mark> בַּמִּקְנֶ֕ה בַּכֶּ֖סֶף וּבַזָּהָֽב׃", "pasuk_en": "וְאַבְרָם כָּבֵד מְאֹד בַּמִּקְנֶה בַּכֶּסֶף וּבַזָּהָב׃", "rashi_he": "כבד מאד. טָעוּן מַשָּׂאוֹת:", "rashi_en": "\"כבד\" כאן פירושו שאברם היה עמוס משאות רבים של רכוש.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"כָּבֵד מְאֹד\" לְפִי רַשִׁ\"י?", "options": ["שֶׁהָיָה טָעוּן מַשָּׂאוֹת רַבִּים שֶׁל רְכוּשׁ", "שֶׁהָיָה מְכֻובָּד מְאֹוד בְּעֵינֵי אַנְשֵׁי מִצְרַיִם", "שֶׁהָיָה כָּבֵד בְּגוּפוֹ מֵרֹוב אֲכִילָה"], "kasha": "המילה \"כבד\" אינה מילה רגילה לתיאור עושר, ויש לבאר מה משמעותה כאן.", "answer": "\"כבד\" במובן המילולי: אברם היה טעון משאות של מקנה, כסף וזהב.", "kp": ["טעון משאות"]}]}, {"id": "13:3.1", "ch": 13, "v": 3, "n": 1, "dh": "וילך למסעיו", "pasuk_html": "<mark>וַיֵּ֙לֶךְ֙ לְמַסָּעָ֔יו</mark> מִנֶּ֖גֶב וְעַד־בֵּֽית־אֵ֑ל עַד־הַמָּק֗וֹם אֲשֶׁר־הָ֨יָה שָׁ֤ם אהלה [אָֽהֳלוֹ֙] בַּתְּחִלָּ֔ה בֵּ֥ין בֵּֽית־אֵ֖ל וּבֵ֥ין הָעָֽי׃", "pasuk_en": "וַיֵּלֶךְ לְמַסָּעָיו מִנֶּגֶב וְעַד־בֵּית־אֵל עַד־הַמָּקוֹם אֲשֶׁר־הָיָה שָׁם אהלה [אָהֳלוֹ] בַּתְּחִלָּה בֵּין בֵּית־אֵל וּבֵין הָעָי׃", "rashi_he": "וילך למסעיו. כְּשֶׁחָזַר מִמִּצְרַיִם לְאֶרֶץ כְּנַעַן הָיָה הוֹלֵךְ וְלָן בָּאַכְסַנְיוֹת שֶׁלָּן בָּהֶם בַּהֲלִיכָתוֹ לְמִצְרַיִם, לִמֶּדְךָ דֶּרֶך אֶרֶץ, שֶׁלֹּא יְשַׁנֶּה אָדָם מֵאַכְסַנְיָא שֶׁלּוֹ. דָּבָר אַחֵר בַּחֲזָרָתוֹ פָּרַע הַקָּפוֹתָיו (בראשית רבה):", "rashi_en": "בדרכו חזרה ממצרים לן אברם באותן אכסניות שבהן לן בדרכו למצרים, וזה מלמד דרך ארץ שאין אדם מחליף את האכסניה שלו. פירוש אחר: בדרך חזרה פרע את החובות שלקח בהליכתו.", "note": "", "points": [{"q": "מַה לָמַדְנוּ מִכָּךְ שֶׁאַבְרָם חָזַר \"לְמַסָּעָיו\", בְּאוֹתָהּ הַדֶּרֶךְ שֶׁבָּהּ הָלַךְ?", "options": ["שֶׁאֵין אָדָם צָרִיךְ לְהַחֲלִיף אֶת הָאַכְסַנְיָה שֶׁלּוֹ", "שֶׁיֵּשׁ לַחֲזוֹר תָּמִיד בַּדֶּרֶךְ הַקְּצָרָה בְּיוֹתֵר", "שֶׁאַבְרָם פָּחַד לָלֶכֶת בַּדֶּרֶךְ שֶׁאֵינָהּ מוּכֶּרֶת לוֹ"], "kasha": "מדוע הפסוק מדגיש \"למסעיו\", ולא כתב רק שהלך לארץ כנען?", "answer": "אברם לן בחזרתו באותן אכסניות שלן בהן בדרכו למצרים, וזה מלמד דרך ארץ: שלא ישנה אדם מאכסניה שלו.", "kp": ["באכסניות שלן בהם", "שלא ישנה אדם מאכסניא שלו"]}, {"q": "לְפִי הַפֵּירוּשׁ הַשֵּׁנִי בְּרַשִׁ\"י, מָה עָשָׂה אַבְרָם בְּדֶרֶךְ חֲזֵרָתוֹ?", "options": ["פָּרַע אֶת הַחוֹבוֹת שֶׁלָּקַח בְּדַרְכּוֹ לְמִצְרַיִם", "בָּנָה מִזְבְּחוֹת בְּכָל מָקוֹם שֶׁעָבַר בּוֹ", "קָנָה מִקְנֶה רַב מִבַּעֲלֵי הָאַכְסַנְיּוֹת"], "kasha": "מה הייתה הסיבה לחזור דווקא במסלול שבו הלך?", "answer": "בחזרתו עבר באותם מקומות כדי לפרוע את חובותיו, שלקח בהקפה בדרכו למצרים.", "kp": ["בחזרתו פרע הקפותיו"]}]}, {"id": "13:3.2", "ch": 13, "v": 3, "n": 2, "dh": "מנגב", "pasuk_html": "וַיֵּ֙לֶךְ֙ לְמַסָּעָ֔יו <mark>מִנֶּ֖גֶב</mark> וְעַד־בֵּֽית־אֵ֑ל עַד־הַמָּק֗וֹם אֲשֶׁר־הָ֨יָה שָׁ֤ם אהלה [אָֽהֳלוֹ֙] בַּתְּחִלָּ֔ה בֵּ֥ין בֵּֽית־אֵ֖ל וּבֵ֥ין הָעָֽי׃", "pasuk_en": "וַיֵּלֶךְ לְמַסָּעָיו מִנֶּגֶב וְעַד־בֵּית־אֵל עַד־הַמָּקוֹם אֲשֶׁר־הָיָה שָׁם אהלה [אָהֳלוֹ] בַּתְּחִלָּה בֵּין בֵּית־אֵל וּבֵין הָעָי׃", "rashi_he": "מנגב. אֶרֶץ מִצְרַיִם בִּדְרוֹמָהּ שֶׁל אֶרֶץ כְּנַעַן:", "rashi_en": "\"מנגב\" פירושו ממצרים, שנמצאת בדרום ארץ כנען.", "note": "", "points": [{"q": "מַהוּ הַ\"נֶגֶב\" שֶׁמִּמֶּנּוּ הָלַךְ אַבְרָם בַּפָּסוּק זֶה?", "options": ["אֶרֶץ מִצְרַיִם, הַנִּמְצֵאת בְּדָרוֹם אֶרֶץ כְּנַעַן", "הַחֵלֶק הַדְּרוֹמִי שֶׁל אֶרֶץ כְּנַעַן", "הַמִּדְבָּר שֶׁבֵּין מִצְרַיִם לְאֶרֶץ כְּנַעַן"], "kasha": "לא ברור מאיזה \"נגב\" יצא אברם בדרכו.", "answer": "הכוונה לארץ מצרים, שנקראת נגב משום שהיא בדרומה של ארץ כנען.", "kp": ["ארץ מצרים בדרומה של ארץ כנען"]}]}, {"id": "13:4.1", "ch": 13, "v": 4, "n": 1, "dh": "אשר עשה שם בראשנה", "pasuk_html": "אֶל־מְקוֹם֙ הַמִּזְבֵּ֔חַ <mark>אֲשֶׁר־עָ֥שָׂה שָׁ֖ם בָּרִאשֹׁנָ֑ה</mark> וַיִּקְרָ֥א שָׁ֛ם אַבְרָ֖ם בְּשֵׁ֥ם יְהוָֽה׃", "pasuk_en": "אֶל־מְקוֹם הַמִּזְבֵּחַ אֲשֶׁר־עָשָׂה שָׁם בָּרִאשֹׁנָה וַיִּקְרָא שָׁם אַבְרָם בְּשֵׁם יְהוָה׃", "rashi_he": "אשר עשה שם בראשנה. וַאֲשֶׁר קָרָא שָׁם אַבְרָם בְּשֵׁם ה' וְגַם יֵשׁ לוֹמַר וַיִּקְרָא שָׁם עַכְשָׁו בְּשֵׁם ה':", "rashi_en": "המילים \"ויקרא שם אברם בשם ה'\" יכולות להמשיך את תיאור המקום שבו קרא אברם בשם ה' בפעם הראשונה, ואפשר גם לפרש שעכשיו קרא שם שוב בשם ה'.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, לְמָה מִתְיַיחֲסוֹת הַמִּילִּים \"וַיִּקְרָא שָׁם אַבְרָם בְּשֵׁם יְהוָה\"?", "options": ["לִקְרִיאָה שֶׁקָּרָא שָׁם בֶּעָבָר, אוֹ לִקְרִיאָה חֲדָשָׁה שֶׁקָּרָא עַכְשָׁיו", "רַק לִקְרִיאָה שֶׁיִּקְרָא שָׁם בֶּעָתִיד, כְּשֶׁיָּשׁוּב לְשָׁם", "לִקְרִיאָה שֶׁקָּרְאוּ שָׁם אַנְשֵׁי הַמָּקוֹם לִפְנֵי אַבְרָם"], "kasha": "לא ברור אם \"ויקרא שם\" ממשיך את תיאור מה שעשה שם \"בראשנה\", או מספר על מעשה חדש.", "answer": "אפשר לפרש: המקום אשר עשה שם מזבח ואשר קרא שם בשם ה' בעבר. ויש לומר גם שעכשיו קרא שם בשם ה'.", "kp": ["ואשר קרא שם אברם", "ויקרא שם עכשו"]}]}, {"id": "13:5.1", "ch": 13, "v": 5, "n": 1, "dh": "ההלך את אברם", "pasuk_html": "וְגַם־לְל֔וֹט <mark>הַהֹלֵ֖ךְ אֶת־אַבְרָ֑ם</mark> הָיָ֥ה צֹאן־וּבָקָ֖ר וְאֹהָלִֽים׃", "pasuk_en": "וְגַם־לְלוֹט הַהֹלֵךְ אֶת־אַבְרָם הָיָה צֹאן־וּבָקָר וְאֹהָלִים׃", "rashi_he": "ההלך את אברם. מִי גָרַם שֶׁהָיָה לוֹ זֹאת? הֲלִיכָתוֹ עִם אַבְרָם:", "rashi_en": "הפסוק מדגיש שלוט הלך עם אברם, כי זה מה שגרם לו להתעשר.", "note": "", "points": [{"q": "מַדּוּעַ הִדְגִּישׁ הַפָּסוּק שֶׁלּוֹט הָיָה \"הַהֹלֵךְ אֶתְאַבְרָם\"?", "options": ["כְּדֵי לְלַמֵּד שֶׁבִּזְכוּת הֲלִיכָתוֹ עִם אַבְרָם הִתְעַשֵּׁר", "כְּדֵי לְלַמֵּד שֶׁלּוֹט הָיָה מְשָׁרְתוֹ שֶׁל אַבְרָם", "כְּדֵי לְלַמֵּד שֶׁלּוֹט לֹא רָצָה לָלֶכֶת לְבַדּוֹ"], "kasha": "כבר ידוע שלוט הלך עם אברם, ולמה צריך לחזור על כך כאן?", "answer": "הפסוק מסביר מי גרם שיהיה ללוט כל הרכוש הזה: הליכתו עם אברם.", "kp": ["מי גרם שהיה לו זאת", "הליכתו עם אברם"]}]}, {"id": "13:6.1", "ch": 13, "v": 6, "n": 1, "dh": "ולא נשא אתם", "pasuk_html": "<mark>וְלֹא־נָשָׂ֥א אֹתָ֛ם</mark> הָאָ֖רֶץ לָשֶׁ֣בֶת יַחְדָּ֑ו כִּֽי־הָיָ֤ה רְכוּשָׁם֙ רָ֔ב וְלֹ֥א יָֽכְל֖וּ לָשֶׁ֥בֶת יַחְדָּֽו׃", "pasuk_en": "וְלֹא־נָשָׂא אֹתָם הָאָרֶץ לָשֶׁבֶת יַחְדָּו כִּי־הָיָה רְכוּשָׁם רָב וְלֹא יָכְלוּ לָשֶׁבֶת יַחְדָּו׃", "rashi_he": "ולא נשא אתם. לֹא הָיְתָה יְכוֹלָה לְהַסְפִּיק מִרְעֶה לְמִקְנֵיהֶם, וְלָשׁוֹן קָצָר הוּא, וְצָרִיךְ לְהוֹסִיף עָלָיו, כְּמוֹ וְלֹא נָשָׂא אוֹתָם מִרְעֵה הָאָרֶץ, לְפִיכָךְ כָּתַב וְלֹא נָשָׂא בִּלְשׁוֹן זָכָר:", "rashi_en": "הארץ לא הספיקה מרעה למקנה של אברם ולוט. הלשון קצרה, וכוונתה \"מרעה הארץ\", ולכן כתוב \"נשא\" בלשון זכר.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וְלֹאנָשָׂא אֹתָם הָאָרֶץ\" לְפִי רַשִׁ\"י?", "options": ["הָאָרֶץ לֹא הִסְפִּיקָה מִרְעֶה לְמִקְנֵה שֶׁל שְׁנֵיהֶם", "הָאָרֶץ לֹא הָייְתָה רְחָבָה דַּיָּהּ לְאוֹהֲלֵיהֶם", "יוֹשְׁבֵי הָאָרֶץ לֹא הִסְכִּימוּ שֶׁיָגוּרוּ יַחַד"], "kasha": "לא מובן מה פירוש שהארץ \"לא נשאה\" אותם.", "answer": "הארץ לא הייתה יכולה להספיק מרעה למקנה שלהם.", "kp": ["לא היתה יכולה להספיק מרעה"]}, {"q": "מַדּוּעַ כָּתוּב \"נָשָׂא\" בִּלְשׁוֹן זָכָר, אַף שֶׁהַמִּילָּה \"הָאָרֶץ\" הִיא בִּלְשׁוֹן נְקֵבָה?", "options": ["כִּי הַכַּווָּנָה לְ\"מִרְעֵה הָאָרֶץ\", וּמִרְעֶה הוּא בִּלְשׁוֹן זָכָר", "כִּי הַכַּווָּנָה לְאַבְרָם, שֶׁלֹּא יָכוֹל הָיָה לָשֵׂאת אֶת לוֹט", "כִּי בַּמִּקְרָא הַמִּילָּה אֶרֶץ בָּאָה תָּמִיד בִּלְשׁוֹן זָכָר"], "kasha": "\"הארץ\" היא לשון נקבה, ולכן היה צריך לכתוב \"נשאה\".", "answer": "זו לשון קצרה, וצריך להוסיף עליה: \"ולא נשא אותם מרעה הארץ\". לכן כתוב \"נשא\" בלשון זכר.", "kp": ["ולא נשא אותם מרעה הארץ", "לפיכך כתב ולא נשא בלשון זכר"]}]}, {"id": "13:7.1", "ch": 13, "v": 7, "n": 1, "dh": "ויהי ריב", "pasuk_html": "<mark>וַֽיְהִי־רִ֗יב</mark> בֵּ֚ין רֹעֵ֣י מִקְנֵֽה־אַבְרָ֔ם וּבֵ֖ין רֹעֵ֣י מִקְנֵה־ל֑וֹט וְהַֽכְּנַעֲנִי֙ וְהַפְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּאָֽרֶץ׃", "pasuk_en": "וַיְהִי־רִיב בֵּין רֹעֵי מִקְנֵה־אַבְרָם וּבֵין רֹעֵי מִקְנֵה־לוֹט וְהַכְּנַעֲנִי וְהַפְּרִזִּי אָז יֹשֵׁב בָּאָרֶץ׃", "rashi_he": "ויהי ריב. לְפִי שְׁהָיוּ רוֹעִים שֶׁל לוֹט רְשָׁעִים וּמַרְעִים בְּהֶמְתָּם בִּשְׂדוֹת אֲחֵרִים, וְרוֹעֵי אַבְרָם מוֹכִיחִים אוֹתָם עַל הַגֶּזֶל, וְהֵם אוֹמְרִים נִתְּנָה הָאָרֶץ לְאַבְרָם, וְלוֹ אֵין יוֹרֵשׁ, וְלוֹט יוֹרְשׁוֹ, וְאֵין זֶה גֶּזֶל, וְהַכָּתוּב אוֹמֵר וְהַכְּנַעֲנִי וְהַפְּרִזִּי אָז יֹשֵׁב בָּאָרֶץ, וְלֹא זָכָה בָהּ אַבְרָם עֲדַיִן (ב\"):", "rashi_en": "רועי לוט היו רשעים ורעו בשדות של אחרים. רועי אברם הוכיחו אותם על הגזל, והם טענו שהארץ ניתנה לאברם ולוט הוא יורשו. אבל הפסוק מעיד שהכנעני והפרזי עוד ישבו בארץ, ואברם עדיין לא זכה בה.", "note": "", "points": [{"q": "עַל מָה הָיָה הָרִיב בֵּין רוֹעֵי אַבְרָם לְרוֹעֵי לוֹט?", "options": ["רוֹעֵי לוֹט רָעוּ בִּשְׂדוֹת אֲחֵרִים, וְרוֹעֵי אַבְרָם הוֹכִיחוּ אוֹתָם עַל הַגֶּזֶל", "שְׁנֵי הַצְּדָדִים רָבוּ עַל בְּאֵרוֹת הַמַּיִם הַמְּעַטּוֹת שֶׁבָּאָרֶץ", "רוֹעֵי אַבְרָם רָצוּ לְהַפְרִיד בֵּין הַמִּקְנֶה שֶׁלָּהֶם לְמִקְנֵה שֶׁל לוֹט"], "kasha": "הפסוק לא מפרש מה הייתה סיבת הריב בין הרועים.", "answer": "רועי לוט הרשעים רעו בשדות של אחרים, ורועי אברם הוכיחו אותם על הגזל. הם השיבו שהארץ ניתנה לאברם, ולוט יורשו, ולכן אין זה גזל.", "kp": ["ומרעים בהמתם בשדות אחרים", "מוכיחים אותם על הגזל"]}, {"q": "מַדּוּעַ מַזְכִּיר הַפָּסוּק כַּאן \"וְהַכְּנַעֲנִי וְהַפְּרִזִּי אָז יֹשֵׁב בָּאָרֶץ\"?", "options": ["לְהַרְאוֹת שֶׁאַבְרָם עֲדַייִן לֹא זָכָה בָּאָרֶץ, וְלָכֵן זֶה גָּזֵל", "לְהַרְאוֹת שֶׁהָאָרֶץ הָייְתָה צְפוּפָה וְלָכֵן לֹא הִסְפִּיקָה לָהֶם", "לְהַרְאוֹת שֶׁהַכְּנַעֲנִי וְהַפְּרִזִּי הֵם שֶׁגָּרְמוּ לָרִיב"], "kasha": "מה הקשר בין ישיבת הכנעני והפרזי בארץ לבין הריב בין הרועים?", "answer": "הפסוק דוחה את טענת רועי לוט: הכנעני והפרזי עדיין ישבו בארץ, ואברם לא זכה בה עדיין, ולכן מעשיהם היו גזל.", "kp": ["ולא זכה בה אברם עדין"]}]}, {"id": "13:8.1", "ch": 13, "v": 8, "n": 1, "dh": "אנשים אחים", "pasuk_html": "וַיֹּ֨אמֶר אַבְרָ֜ם אֶל־ל֗וֹט אַל־נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣י וּבֵינֶ֔יךָ וּבֵ֥ין רֹעַ֖י וּבֵ֣ין רֹעֶ֑יךָ כִּֽי־<mark>אֲנָשִׁ֥ים אַחִ֖ים</mark> אֲנָֽחְנוּ׃", "pasuk_en": "וַיֹּאמֶר אַבְרָם אֶל־לוֹט אַל־נָא תְהִי מְרִיבָה בֵּינִי וּבֵינֶיךָ וּבֵין רֹעַי וּבֵין רֹעֶיךָ כִּי־אֲנָשִׁים אַחִים אֲנָחְנוּ׃", "rashi_he": "אנשים אחים. קְרוֹבִים, וּמִדְרַשׁ אַגָּדָה דּוֹמִין בִּקְלַסְתֵּר פָּנִים:", "rashi_en": "\"אחים\" כאן פירושו קרובי משפחה. לפי המדרש, הם היו דומים זה לזה בתווי הפנים.", "note": "", "points": [{"q": "מַדּוּעַ אָמַר אַבְרָם לְלוֹט \"אֲנָשִׁים אַחִים אֲנָחְנוּ\", הֲרֵי לוֹט הָיָה בֶּן אָחִיו?", "options": ["כִּי \"אַחִים\" כָּאן פֵּירוּשׁוֹ קְרוֹבֵי מִשְׁפָּחָה", "כִּי לוֹט הָיָה גַּם אָחִיהָ שֶׁל שָׂרָה", "כִּי כָּל בְּנֵי הָאָדָם נֶחְשָׁבִים אַחִים זֶה לָזֶה"], "kasha": "לוט לא היה אחיו של אברם אלא בן אחיו.", "answer": "\"אחים\" פירושו קרובים. ולפי המדרש, הם היו דומים זה לזה בקלסתר פניהם.", "kp": ["קרובים", "דומין בקלסתר פנים"]}]}, {"id": "13:9.1", "ch": 13, "v": 9, "n": 1, "dh": "אם השמאל ואימנה", "pasuk_html": "הֲלֹ֤א כָל־הָאָ֙רֶץ֙ לְפָנֶ֔יךָ הִפָּ֥רֶד נָ֖א מֵעָלָ֑י <mark>אִם־הַשְּׂמֹ֣אל וְאֵימִ֔נָה</mark> וְאִם־הַיָּמִ֖ין וְאַשְׂמְאִֽילָה׃", "pasuk_en": "הֲלֹא כָל־הָאָרֶץ לְפָנֶיךָ הִפָּרֶד נָא מֵעָלָי אִם־הַשְּׂמֹאל וְאֵימִנָה וְאִם־הַיָּמִין וְאַשְׂמְאִילָה׃", "rashi_he": "אם השמאל ואימנה. בְּכָל אֲשֶׁר תֵּשֵׁב, לֹא אֶתְרַחֵק מִמְּךָ וְאֶעֱמֹד לְךָ לְמָגֵן וּלְעֵזֶר, וְסוֹף דָּבָר הֻצְרַךְ לוֹ, שְׁנֶּאֱמַר וַיִּשְׁמַע אַבְרָם כִּי נִשְׁבָּה אָחִיו וְגוֹ':", "rashi_en": "אברם אמר ללוט שבכל מקום שיבחר לשבת, הוא לא יתרחק ממנו ויעמוד לו למגן ולעזר. ובסוף לוט אכן נזקק לו, כשנשבה במלחמה.", "note": "", "points": [{"q": "מַה הִתְכַּווֵּן אַבְרָם בְּאָומְרוֹ \"אִםהַשְּׂמֹאל וְאֵימִנָה\"?", "options": ["שֶׁבְּכָל מָקוֹם שֶׁיֵּלֵךְ לוֹט, אַבְרָם לֹא יִתְרַחֵק מִמֶּנּוּ וְיָגֵן עָלָיו", "שֶׁאַבְרָם וְלוֹט יֵלְכוּ לְכִיּווּנִים הֲפוּכִים וְלֹא יִיפָּגְשׁוּ עוֹד", "שֶׁלוֹט יִבְחַר רִאשׁוֹן, וְאַבְרָם יִיקַּח אֶת הַחֵלֶק הַטּוֹב יוֹתֵר"], "kasha": "אם אברם מבקש מלוט להיפרד ממנו, מדוע הוא מתאר את מקומו ביחס למקומו של לוט?", "answer": "בכל מקום שלוט ישב, אברם לא יתרחק ממנו ויעמוד לו למגן ולעזר. ובסוף לוט נזקק לו, כשנשבה.", "kp": ["לא אתרחק ממך", "ואעמד לך למגן ולעזר"]}]}, {"id": "13:9.2", "ch": 13, "v": 9, "n": 2, "dh": "ואימנה", "pasuk_html": "הֲלֹ֤א כָל־הָאָ֙רֶץ֙ לְפָנֶ֔יךָ הִפָּ֥רֶד נָ֖א מֵעָלָ֑י אִם־הַשְּׂמֹ֣אל <mark>וְאֵימִ֔נָה</mark> וְאִם־הַיָּמִ֖ין וְאַשְׂמְאִֽילָה׃", "pasuk_en": "הֲלֹא כָל־הָאָרֶץ לְפָנֶיךָ הִפָּרֶד נָא מֵעָלָי אִם־הַשְּׂמֹאל וְאֵימִנָה וְאִם־הַיָּמִין וְאַשְׂמְאִילָה׃", "rashi_he": "ואימנה. אַיְמִין אֶת עַצְמִי, כְּמוֹ וְאַשְׂמְאִילָה אַשְׂמְאִיל אֶת עַצְמִי. וְאִם תֹּאמַר הָיָה לוֹ לִנָּקֵד וְאַיְמִינָה, כָּךְ מָצִינוּ בְּמָקוֹם אַחֵר אִם יֵשׁ לְהֵמִין (שמואל ב י\"ד) וְאֵין נָקוּד לְהַיְמִין:", "rashi_en": "\"ואימנה\" פירושו אפנה את עצמי לימין, כמו \"ואשמאילה\" שפירושו אפנה את עצמי לשמאל. ואף שהיה מתאים לנקד \"ואימינה\", מצאנו גם במקום אחר \"להמין\" ולא \"להימין\".", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילָּה \"וְאֵימִנָה\" לְפִי רַשִׁ\"י?", "options": ["אֶפְנֶה אֶת עַצְמִי לַיָּמִין, כְּמוֹ \"וְאַשְׂמְאִילָה\" לַשְּׂמֹאל", "אַאֲמִין לְךָ וְאֶה \"מִקֶּדֶם\"?", "options": ["מִקַּדְמוֹנוֹ שֶׁל עוֹלָם – לֹא רָצָה בְּאַבְרָם וּבֵאלֹוהָיו", "מֵאַנְשֵׁי הַמִּזְרָח הָרְשָׁעִים שֶׁגָּרוּ סְבִיבוֹ", "מִן הַמָּקוֹם שֶׁבּוֹ גָּר בַּתְּחִילָּה עִם תֶּרַח"], "kasha": "למה הפסוק מציין את הכיוון שממנו נסע לוט?", "answer": "המדרש דורש: לוט הסיע את עצמו מקדמונו של עולם, ואמר: אי אפשי לא באברם ולא באלוהיו.", "kp": ["הסיע עצמו מקדמונו של עולם", "אי אפשי לא באברם ולא באלהיו"]}]}, {"id": "13:12.1", "ch": 13, "v": 12, "n": 1, "dh": "ויאהל", "pasuk_html": "אַבְרָ֖ם יָשַׁ֣ב בְּאֶֽרֶץ־כְּנָ֑עַן וְל֗וֹט יָשַׁב֙ בְּעָרֵ֣י הַכִּכָּ֔ר <mark>וַיֶּאֱהַ֖ל</mark> עַד־סְדֹֽם׃", "pasuk_en": "אַבְרָם יָשַׁב בְּאֶרֶץ־כְּנָעַן וְלוֹט יָשַׁב בְּעָרֵי הַכִּכָּר וַיֶּאֱהַל עַד־סְדֹם׃", "rashi_he": "ויאהל. נָטָה אֳהָלִים לְרוֹעָיו וּלְמִקְנֵהוּ עַד סְדוֹם:", "rashi_en": "לוט נטה אוהלים לרועים ולמקנה שלו, עד סדום.", "note": "", "points": [{"q": "מַדּוּעַ כָּתוּב \"וַיֶּאֱהַל עַדְסְדֹם\", אִם לוֹט יָשַׁב בְּעָרֵי הַכִּכָּר?", "options": ["כִּי נָטָה אֹוהָלִים לְרוֹעָיו וּלְמִקְנֵהוּ עַד סְדוֹם", "כִּי לוֹט עַצְמוֹ גָּר בְּאֹוהֶל וְלֹא בָּעִיר", "כִּי סְדוֹם הָיְיתָה עִיר שֶׁכֻּולָּהּ אֹוהָלִים"], "kasha": "הפסוק אומר שלוט ישב בערים, ומה פירוש שנטה אוהל?", "answer": "לוט נטה אוהלים לרועים ולמקנה שלו, עד סדום.", "kp": ["נטה אהלים לרועיו ולמקנהו"]}]}, {"id": "13:13.1", "ch": 13, "v": 13, "n": 1, "dh": "ואנשי סדום רעים", "pasuk_html": "<mark>וְאַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים</mark> וְחַטָּאִ֑ים לַיהוָ֖ה מְאֹֽד׃", "pasuk_en": "וְאַנְשֵׁי סְדֹם רָעִים וְחַטָּאִים לַיהוָה מְאֹד׃", "rashi_he": "ואנשי סדום רעים. וְאַף עַל פִּי כֵן לֹא נִמְנַע לוֹט מִלִּשְׁכֹּן עִמָּהֶם. וְרַבּוֹתֵינוּ לָמְדוּ מִכָּאן (יומא ל\"ח) וְשֵׁם רְשָׁעִים יִרְקָב (משלי י'):", "rashi_en": "אף על פי שאנשי סדום היו רעים, לוט לא נמנע מלגור איתם. וחז\"ל למדו מכאן את הפסוק \"ושם רשעים ירקב\".", "note": "", "points": [{"q": "מַדּוּעַ מְסַפֵּר הַפָּסוּק עַל רִשְׁעַת אַנְשֵׁי סְדוֹם דַּווְקָא כַּאן?", "options": ["לְלַמֵּד שֶׁלְּמַרוֹת רִשְׁעָתָם, לוֹט לֹא נִמְנַע מִלָּגוּר עִמָּהֶם", "לְלַמֵּד שֶׁלּוֹט לֹא יָדַע כְּלָל עַל רִשְׁעָתָם", "לְהַסְבִּיר מַדּוּעַ אַבְרָם סֵירֵב לָגוּר בִּסְדוֹם"], "kasha": "מה הקשר בין רשעת אנשי סדום לבין הסיפור על בחירתו של לוט?", "answer": "הפסוק בא ללמד שאף על פי שהיו רעים, לוט לא נמנע מלשכון עמהם. וחז\"ל למדו מכאן \"ושם רשעים ירקב\".", "kp": ["לא נמנע לוט מלשכן עמהם"]}]}, {"id": "13:13.2", "ch": 13, "v": 13, "n": 2, "dh": "רעים", "pasuk_html": "וְאַנְשֵׁ֣י סְדֹ֔ם <mark>רָעִ֖ים</mark> וְחַטָּאִ֑ים לַיהוָ֖ה מְאֹֽד׃", "pasuk_en": "וְאַנְשֵׁי סְדֹם רָעִים וְחַטָּאִים לַיהוָה מְאֹד׃", "rashi_he": "רעים. בְּגוּפָם:", "rashi_en": "\"רעים\" פירושו שאנשי סדום היו רעים בגופם.", "note": "", "points": [{"q": "בַּמֶּה הָיוּ אַנְשֵׁי סְדוֹם \"רָעִים\" לְפִי רַשִׁ\"י?", "options": ["בְּגוּפָם", "בְּמָמוֹנָם", "בְּדֵעוֹתֵיהֶם"], "kasha": "הפסוק אומר גם \"רעים\" וגם \"חטאים\", ויש להבין מה ההבדל ביניהם.", "answer": "\"רעים\" – בחטאי הגוף.", "kp": ["בגופם"]}]}, {"id": "13:13.3", "ch": 13, "v": 13, "n": 3, "dh": "וחטאים", "pasuk_html": "וְאַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים <mark>וְחַטָּאִ֑ים</mark> לַיהוָ֖ה מְאֹֽד׃", "pasuk_en": "וְאַנְשֵׁי סְדֹם רָעִים וְחַטָּאִים לַיהוָה מְאֹד׃", "rashi_he": "וחטאים. בְּמָמוֹנָם (סנה' ק\"ט):", "rashi_en": "\"חטאים\" פירושו שאנשי סדום חטאו בממונם.", "note": "", "points": [{"q": "בַּמֶּה הָיוּ אַנְשֵׁי סְדוֹם \"חַטָּאִים\" לְפִי רַשִׁ\"י?", "options": ["בְּמָמוֹנָם", "בְּגוּפָם", "בְּדִיבּוּרָם"], "kasha": "מה מוסיפה המילה \"חטאים\" על המילה \"רעים\"?", "answer": "\"חטאים\" – בחטאי הממון.", "kp": ["בממונם"]}]}, {"id": "13:13.4", "ch": 13, "v": 13, "n": 4, "dh": "לה' מאד", "pasuk_html": "וְאַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְחַטָּאִ֑ים <mark>לַיהוָ֖ה מְאֹֽד׃</mark>", "pasuk_en": "וְאַנְשֵׁי סְדֹם רָעִים וְחַטָּאִים לַיהוָה מְאֹד׃", "rashi_he": "לה' מאד. יוֹדְעִים רִבּוֹנָם, וּמִתְכַּוְּנִים לִמְרֹד בּוֹ:", "rashi_en": "אנשי סדום הכירו את ריבונם, ובכל זאת התכוונו למרוד בו.", "note": "", "points": [{"q": "מַה מוֹסִיפוֹת הַמִּילִּים \"לַיהוָה מְאֹד\" עַל חַטְאֵי אַנְשֵׁי סְדוֹם?", "options": ["שֶׁהִכִּירוּ אֶת רִיבּוֹנָם, וּבְכָל זֹאת הִתְכַּוְּונוּ לִמְרֹוד בּוֹ", "שֶׁחָטְאוּ בִּשְׁגָגָה, כִּי לֹא הִכִּירוּ אֶת ה'", "שֶׁחָטְאוּ רַק כְּלַפֵּי ה' וְלֹא כְּלַפֵּי בְּנֵי אָדָם"], "kasha": "למה מדגיש הפסוק שחטאו \"לה'\", ומה מוסיפה המילה \"מאד\"?", "answer": "הם ידעו את ריבונם, ובכל זאת התכוונו למרוד בו.", "kp": ["יודעים רבונם", "ומתכונים למרד בו"]}]}, {"id": "13:14.1", "ch": 13, "v": 14, "n": 1, "dh": "אחרי הפרד לוט", "pasuk_html": "וַֽיהוָ֞ה אָמַ֣ר אֶל־אַבְרָ֗ם <mark>אַחֲרֵי֙ הִפָּֽרֶד־ל֣וֹט</mark> מֵֽעִמּ֔וֹ שָׂ֣א נָ֤א עֵינֶ֙יךָ֙ וּרְאֵ֔ה מִן־הַמָּק֖וֹם אֲשֶׁר־אַתָּ֣ה שָׁ֑ם צָפֹ֥נָה וָנֶ֖גְבָּה וָקֵ֥דְמָה וָיָֽמָּה׃", "pasuk_en": "וַיהוָה אָמַר אֶל־אַבְרָם אַחֲרֵי הִפָּרֶד־לוֹט מֵעִמּוֹ שָׂא נָא עֵינֶיךָ וּרְאֵה מִן־הַמָּקוֹם אֲשֶׁר־אַתָּה שָׁם צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה׃", "rashi_he": "אחרי הפרד לוט. כָּל זְמַן שֶׁהָרָשָׁע עִמּוֹ הָיָה הַדִּבּוּר פּוֹרֵשׁ מִמֵֶּנּוּ:", "rashi_en": "כל זמן שהרשע, לוט, היה עם אברם, הדיבור של ה' פרש ממנו. לכן ה' דיבר אליו רק אחרי שלוט נפרד ממנו.", "note": "", "points": [{"q": "מַדּוּעַ מַדְגִּישׁ הַפָּסוּק שֶׁה' דִּיבֵּר אֶל אַבְרָם \"אַחֲרֵי הִפָּרֶדְלוֹט מֵעִמּוֹ\"?", "options": ["כִּי כָּל זְמַן שֶׁהָרָשָׁע הָיָה עִמּוֹ, הַדִּיבּוּר פָּרַשׁ מִמֶּנּוּ", "כִּי אַבְרָם הָיָה עָצוּב, וַה' בָּא לְנַחֵם אוֹתוֹ", "כִּי לוֹט הָיָה עָלוּל לִטְעוֹן שֶׁגַּם לוֹ נִיתְּנָה הָאָרֶץ"], "kasha": "מה החשיבות של הזמן הזה, אחרי שלוט נפרד, לדיבור של ה' אל אברם?", "answer": "כל זמן שהרשע היה עם אברם, הדיבור היה פורש ממנו.", "kp": ["כל זמן שהרשע עמו", "היה הדבור פורש ממנו"]}]}, {"id": "13:16.1", "ch": 13, "v": 16, "n": 1, "dh": "אשר אם יוכל איש", "pasuk_html": "וְשַׂמְתִּ֥י אֶֽת־זַרְעֲךָ֖ כַּעֲפַ֣ר הָאָ֑רֶץ <mark>אֲשֶׁ֣ר ׀ אִם־יוּכַ֣ל אִ֗ישׁ</mark> לִמְנוֹת֙ אֶת־עֲפַ֣ר הָאָ֔רֶץ גַּֽם־זַרְעֲךָ֖ יִמָּנֶֽה׃", "pasuk_en": "וְשַׂמְתִּי אֶת־זַרְעֲךָ כַּעֲפַר הָאָרֶץ אֲשֶׁר אִם־יוּכַל אִישׁ לִמְנוֹת אֶת־עֲפַר הָאָרֶץ גַּם־זַרְעֲךָ יִמָּנֶה׃", "rashi_he": "אשר אם יוכל איש. כְּשֵׁם שֶׁאִי אֶפְשָׁר לֶעָפָר לְהִמָּנוֹת כָּךְ זַרְעֲךָ לֹא יִמָּנֶה:", "rashi_en": "כשם שאי אפשר למנות את העפר, כך גם זרעו של אברם לא יימנה.", "note": "", "points": [{"q": "מַה כַּווָּנַת הַהַשְׁוָּואָה \"אִםיוּכַל אִישׁ לִמְנוֹת אֶתְעֲפַר הָאָרֶץ גַּםזַרְעֲךָ יִמָּנֶה\"?", "options": ["כְּשֵׁם שֶׁאִי אֶפְשָׁר לִמְנוֹת אֶת הֶעָפָר, כָּךְ זַרְעֲךָ לֹא יִימָּנֶה", "שֶׁרַק אָדָם חָכָם מְאֹוד יוּכַל לִמְנוֹת אֶת זַרְעֲךָ", "שֶׁזַּרְעֲךָ יִהְיֶה מְפֻוזָּר בְּכָל הָאָרֶץ כְּמוֹ עָפָר"], "kasha": "לשון הפסוק נשמעת כאילו אפשר למנות את זרעו של אברם.", "answer": "כשם שאי אפשר למנות את העפר, כך זרעך לא יימנה.", "kp": ["כשם שאי אפשר לעפר להמנות", "כך זרעך לא ימנה"]}]}, {"id": "13:18.1", "ch": 13, "v": 18, "n": 1, "dh": "ממרא", "pasuk_html": "וַיֶּאֱהַ֣ל אַבְרָ֗ם וַיָּבֹ֛א וַיֵּ֛שֶׁב בְּאֵלֹנֵ֥י <mark>מַמְרֵ֖א</mark> אֲשֶׁ֣ר בְּחֶבְר֑וֹן וַיִּֽבֶן־שָׁ֥ם מִזְבֵּ֖חַ לַֽיהוָֽה׃ (פ)", "pasuk_en": "וַיֶּאֱהַל אַבְרָם וַיָּבֹא וַיֵּשֶׁב בְּאֵלֹנֵי מַמְרֵא אֲשֶׁר בְּחֶבְרוֹן וַיִּבֶן־שָׁם מִזְבֵּחַ לַיהוָה׃", "rashi_he": "ממרא. שֵׁם אָדָם:", "rashi_en": "ממרא הוא שם של אדם.", "note": "", "points": [{"q": "מַהוּ \"מַמְרֵא\" שֶׁבַּפָּסוּק \"בְּאֵלֹנֵי מַמְרֵא\"?", "options": ["שֵׁם שֶׁל אָדָם", "שֵׁם שֶׁל עִיר", "שֵׁם שֶׁל הַר"], "kasha": "לא ברור אם \"ממרא\" הוא שם של מקום או של אדם.", "answer": "ממרא הוא שם של אדם.", "kp": ["שם אדם"]}]}, {"id": "14:1.1", "ch": 14, "v": 1, "n": 1, "dh": "אמרפל", "pasuk_html": "וַיְהִ֗י בִּימֵי֙ <mark>אַמְרָפֶ֣ל</mark> מֶֽלֶךְ־שִׁנְעָ֔ר אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר כְּדָרְלָעֹ֙מֶר֙ מֶ֣לֶךְ עֵילָ֔ם וְתִדְעָ֖ל מֶ֥לֶךְ גּוֹיִֽם׃", "pasuk_en": "וַיְהִי בִּימֵי אַמְרָפֶל מֶלֶךְ־שִׁנְעָר אַרְיוֹךְ מֶלֶךְ אֶלָּסָר כְּדָרְלָעֹמֶר מֶלֶךְ עֵילָם וְתִדְעָל מֶלֶךְ גּוֹיִם׃", "rashi_he": "אמרפל. הוּא נִמְרוֹד, שֶׁאָמַר לְאַבְרָהָם פֹּל לְתוֹךְ כִּבְשַׁן הָאֵשׁ (בראשית רבה):", "rashi_en": "אמרפל הוא נמרוד, ונקרא כך משום שאמר לאברהם \"פול\" לתוך כבשן האש.", "note": "", "points": [{"q": "מִי הוּא \"אַמְרָפֶל\", וּמַדּוּעַ נִקְרָא כָּךְ?", "options": ["נִמְרוֹד, שֶׁאָמַר לְאַבְרָהָם \"פּוֹל\" לְתוֹךְ כִּבְשַׁן הָאֵשׁ", "מֶלֶךְ שִׁנְעָר, שֶׁנָּפַל בַּמִּלְחָמָה נֶגֶד אַבְרָהָם", "נִמְרוֹד, שֶׁאָמַר לְאַנְשֵׁי בָּבֶל לִבְנוֹת מִגְדָּל"], "kasha": "השם \"אמרפל\" לא הוזכר קודם לכן, ויש לבאר מי הוא.", "answer": "אמרפל הוא נמרוד, שאמר לאברהם: פול לתוך כבשן האש.", "kp": ["הוא נמרוד", "פל לתוך כבשן האש"]}]}, {"id": "14:1.2", "ch": 14, "v": 1, "n": 2, "dh": "מלך גוים", "pasuk_html": "וַיְהִ֗י בִּימֵי֙ אַמְרָפֶ֣ל מֶֽלֶךְ־שִׁנְעָ֔ר אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר כְּדָרְלָעֹ֙מֶר֙ מֶ֣לֶךְ עֵילָ֔ם וְתִדְעָ֖ל <mark>מֶ֥לֶךְ גּוֹיִֽם׃</mark>", "pasuk_en": "וַיְהִי בִּימֵי אַמְרָפֶל מֶלֶךְ־שִׁנְעָר אַרְיוֹךְ מֶלֶךְ אֶלָּסָר כְּדָרְלָעֹמֶר מֶלֶךְ עֵילָם וְתִדְעָל מֶלֶךְ גּוֹיִם׃", "rashi_he": "מלך גוים. מָקוֹם יֵשׁ שֶׁשְּׁמוֹ גּוֹיִם, עַל שֵׁם שֶׁנִּתְקַבְּצוּ שָׁמָּה מִכַּמָּה אֻמּוֹת וּמְקוֹמוֹת וְהִמְלִיכוּ אִישׁ עֲלֵיהֶם וּשְׁמוֹ תִדְעָל:", "rashi_en": "\"גוים\" הוא שם של מקום, שנקרא כך משום שהתקבצו בו אנשים מכמה אומות ומקומות, והמליכו עליהם איש בשם תדעל.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"מֶלֶךְ גּוֹיִם\"?", "options": ["מֶלֶךְ שֶׁל מָקוֹם שֶׁשְּׁמוֹ גּוֹיִם, שֶׁהִתְקַבְּצוּ בוֹ אֲנָשִׁים מֵאֻומּוֹת רַבּוֹת", "מֶלֶךְ שֶׁשָּׁלַט עַל כָּל אֻומּוֹת הָעוֹלָם", "מֶלֶךְ שֶׁהָיָה נָכְרִי וְלֹא מִבְּנֵי שֵׁם"], "kasha": "שאר המלכים נקראים על שם ארצם, ולא מובן מהי מלכות \"גוים\".", "answer": "יש מקום ששמו גוים, משום שהתקבצו שם אנשים מכמה אומות ומקומות, והמליכו עליהם איש ששמו תדעל.", "kp": ["מקום יש ששמו גוים", "נתקבצו שמה מכמה אמות"]}]}, {"id": "14:2.1", "ch": 14, "v": 2, "n": 1, "dh": "ברע", "pasuk_html": "עָשׂ֣וּ מִלְחָמָ֗ה אֶת־<mark>בֶּ֙רַע֙</mark> מֶ֣לֶךְ סְדֹ֔ם וְאֶת־בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב ׀ מֶ֣לֶךְ אַדְמָ֗ה וְשֶׁמְאֵ֙בֶר֙ מֶ֣לֶךְ צביים [צְבוֹיִ֔ים] וּמֶ֥לֶךְ בֶּ֖לַע הִיא־צֹֽעַר׃", "pasuk_en": "עָשׂוּ מִלְחָמָה אֶת־בֶּרַע מֶלֶךְ סְדֹם וְאֶת־בִּרְשַׁע מֶלֶךְ עֲמֹרָה שִׁנְאָב מֶלֶךְ אַדְמָה וְשֶׁמְאֵבֶר מֶלֶךְ צביים [צְבוֹיִים] וּמֶלֶךְ בֶּלַע הִיא־צֹעַר׃", "rashi_he": "ברע. רַע לַשָּׁמַיִם וְרַע לַבְּרִיּוֹת:", "rashi_en": "שמו של מלך סדום, ברע, מלמד שהיה רע לשמים ורע לבריות.", "note": "", "points": [{"q": "מַה מְלַמֵּד שְׁמוֹ שֶ  "שֶׁהוּא שָׂנֵא אֶת אָבִיו הַגַּשְׁמִי וּמָרַד בּוֹ", "שֶׁהוּא הָיָה שׂוֹנֵא אֶת אַבְרָם וְאֶת בְּנֵי בֵיתוֹ"], "kasha": "השם \"שנאב\" נשמע כשם בעל משמעות, ויש לבאר מה הוא מלמד על המלך.", "answer": "השם מורכב מ\"שונא אב\", ומלמד שהיה שונא את אביו שבשמים.", "kp": ["שונא אביו שבשמים"]}]}, {"id": "14:2.4", "ch": 14, "v": 2, "n": 4, "dh": "שמאבר", "pasuk_html": "עָשׂ֣וּ מִלְחָמָ֗ה אֶת־בֶּ֙רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְאֶת־בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב ׀ מֶ֣לֶךְ אַדְמָ֗ה <mark>וְשֶׁמְאֵ֙בֶר֙</mark> מֶ֣לֶךְ צביים [צְבוֹיִ֔ים] וּמֶ֥לֶךְ בֶּ֖לַע הִיא־צֹֽעַר׃", "pasuk_en": "עָשׂוּ מִלְחָמָה אֶת־בֶּרַע מֶלֶךְ סְדֹם וְאֶת־בִּרְשַׁע מֶלֶךְ עֲמֹרָה שִׁנְאָב מֶלֶךְ אַדְמָה וְשֶׁמְאֵבֶר מֶלֶךְ צביים [צְבוֹיִים] וּמֶלֶךְ בֶּלַע הִיא־צֹעַר׃", "rashi_he": "שמאבר. שָׂם אֵבֶר לָעוּף וְלִקְפֹּץ וְלִמְרֹד בְּהַקָּבָּ\"ה:", "rashi_en": "רש\"י דורש את שמו של מלך צביים: \"שמאבר\" הוא \"שם אבר\", כלומר שם לעצמו כנפיים כדי לעוף, לקפוץ ולמרוד בקב\"ה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַשֵּׁם \"שֶׁמְאֵבֶר\" לְפִי רַשִׁ\"י?", "options": ["שָׂם לְעַצְמוֹ כְּנָפַייִם כְּדֵי לִמְרוֹד בַּקָּב\"ה", "אִיבֵּד אֶת אֵיבָרָיו בַּמִּלְחָמָה עִם כְּדָרְלָעֹמֶר", "שָׁמַר עַל כָּל אֵיבָרָיו וְלֹא נִפְגַּע בַּמִּלְחָמָה"], "kasha": "השם \"שמאבר\" נראה כשם בעל משמעות, ויש להבין מה הוא מלמד.", "answer": "\"שם אבר\" - שם כנפיים לעוף ולקפוץ ולמרוד בקב\"ה.", "kp": ["שם אבר לעוף ולקפץ", "ולמרד בהקב\"ה"]}]}, {"id": "14:2.5", "ch": 14, "v": 2, "n": 5, "dh": "בלע", "pasuk_html": "עָשׂ֣וּ מִלְחָמָ֗ה אֶת־בֶּ֙רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְאֶת־בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב ׀ מֶ֣לֶךְ אַדְמָ֗ה וְשֶׁמְאֵ֙בֶר֙ מֶ֣לֶךְ צביים [צְבוֹיִ֔ים] וּמֶ֥לֶךְ <mark>בֶּ֖לַע</mark> הִיא־צֹֽעַר׃", "pasuk_en": "עָשׂוּ מִלְחָמָה אֶת־בֶּרַע מֶלֶךְ סְדֹם וְאֶת־בִּרְשַׁע מֶלֶךְ עֲמֹרָה שִׁנְאָב מֶלֶךְ אַדְמָה וְשֶׁמְאֵבֶר מֶלֶךְ צביים [צְבוֹיִים] וּמֶלֶךְ בֶּלַע הִיא־צֹעַר׃", "rashi_he": "בלע. שֵׁם הָעִיר:", "rashi_en": "\"בלע\" אינו שם של אדם אלא שם של עיר, ולכן לא נזכר שם המלך.", "note": "", "points": [{"q": "מַהוּ \"בֶּלַע\" בַּפָּ ברור ממתי נמנות ארבע עשרה השנים שבהן בא כדרלעמר.", "answer": "השנה הארבע עשרה היא שנה למרדן, כלומר לאחר שתים עשרה שנות עבודה ושנת מרד.", "kp": ["למרדן"]}]}, {"id": "14:5.2", "ch": 14, "v": 5, "n": 2, "dh": "בא כדרלעמר", "pasuk_html": "וּבְאַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה <mark>בָּ֣א כְדָרְלָעֹ֗מֶר</mark> וְהַמְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔וֹ וַיַּכּ֤וּ אֶת־רְפָאִים֙ בְּעַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְאֶת־הַזּוּזִ֖ים בְּהָ֑ם וְאֵת֙ הָֽאֵימִ֔ים בְּשָׁוֵ֖ה קִרְיָתָֽיִם׃", "pasuk_en": "וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה בָּא כְדָרְלָעֹמֶר וְהַמְּלָכִים אֲשֶׁר אִתּוֹ וַיַּכּוּ אֶת־רְפָאִים בְּעַשְׁתְּרֹת קַרְנַיִם וְאֶת־הַזּוּזִים בְּהָם וְאֵת הָאֵימִים בְּשָׁוֵה קִרְיָתָיִם׃", "rashi_he": "בא כדרלעמר. לְפִי שֶׁהוּא הָיָה בַעַל הַמַּעֲשֶׂה נִכְנַס בְּעֹבִי הַקּוֹרָה:", "rashi_en": "כדרלעמר נזכר לבדו ובראש, משום שהמרד היה נגדו, ולכן הוא שנשא בעיקר המלחמה.", "note": "", "points": [{"q": "לָמָּה נֶאֱמַר \"בָּא כְדָרְלָעֹמֶר\" לְבַדּוֹ, לִפְנֵי שְׁאַר הַמְּלָכִים?", "options": ["כִּי הַמֶּרֶד הָיָה נֶגְדּוֹ וְלָכֵן נָשָׂא בְּעִיקַר הַמִּלְחָמָה", "כִּי הוּא הָיָה הַמֶּלֶךְ הַגָּדוֹל וְהַחָשׁוּב מִכֻּולָּם", "כִּי שְׁאָר הַמְּלָכִים לֹא רָצוּ לְהִילָּחֵם כְּלָל"], "kasha": "בפסוק הקודם נמנה אמרפל ראשון, וכאן כדרלעמר מוזכר לבדו ובראש.", "answer": "כיוון שהוא היה בעל המעשה, שהרי נגדו מרדו, הוא נכנס בעובי הקורה.", "kp": ["היה בעל המעשה", "נכנס בעבי הקורה"]}]}, {"id": "14:5.3", "ch": 14, "v": 5, "n": 3, "dh": "והמלכים", "pasuk_html": "וּבְאַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר <mark>וְהַמְּלָכִים֙</mark> אֲשֶׁ֣ר אִתּ֔וֹ וַיַּכּ֤וּ אֶת־רְפָאִים֙ בְּעַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְאֶת־הַזּוּזִ֖ים בְּהָ֑ם וְאֵת֙ הָֽאֵימִ֔ים בְּשָׁוֵ֖ה קִרְיָתָֽיִם׃", "pasuk_en": "וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה בָּא כְדָרְלָעֹמֶר וְהַמְּלָכִים אֲשֶׁר אִתּוֹ וַיַּכּוּ אֶת־רְפָאִים בְּעַשְׁתְּרֹת קַרְנַיִם וְאֶת־הַזּוּזִים בְּהָם וְאֵת הָאֵימִים בְּשָׁוֵה קִרְיָתָיִם׃", "rashi_he": "והמלכים. אֵלֶּה שְׁלשָׁה מְלָכִים:", "rashi_en": "\"והמלכים אשר אתו\" הם שלושת המלכים האחרים שנזכרו לעיל.", "note": "", "points": [{"q": "מִי הֵם \"וְהַמְּלָכִים\" שֶׁבָּאוּ עִם כְּדָרְלָעֹמֶר?", "options": ["שְׁלוֹשֶׁת הַמְּלָכִים הָאֲחֵרִים שֶׁנִּזְכְּרוּ לְעֵיל", "חֲמֵשֶׁת הַמְּלָכִים שֶׁמָּרְדוּ בוֹ", "מְלָכִים חֲדָשִׁים שֶׁהִצְטָרְפוּ אֵלָיו בַּמִּלְחָמָה"], "kasha": "הפסוק אומר \"והמלכים אשר אתו\" ואינו מפרש מי הם.", "answer": "אלה שלושת המלכים שהיו עמו: אמרפל, אריוך ותדעל.", "kp": ["אלה שלשה מלכים"]}]}, {"id": "14:5.4", "ch": 14, "v": 5, "n": 4, "dh": "הזוזים", "pasuk_html": "וּבְאַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְהַמְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔וֹ וַיַּכּ֤וּ אֶת־רְפָאִים֙ בְּעַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְאֶת־<mark>הַזּוּזִ֖ים</mark> בְּהָ֑ם וְאֵת֙ הָֽאֵימִ֔ים בְּשָׁוֵ֖ה קִרְיָתָֽיִם׃", "pasuk_en": "וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה בָּא כְדָרְלָעֹמֶר וְהַמְּלָכִים אֲשֶׁר אִתּוֹ וַיַּכּוּ אֶת־רְפָאִים בְּעַשְׁתְּרֹת קַרְנַיִם וְאֶת־הַזּוּזִים בְּהָם וְאֵת הָאֵימִים בְּשָׁוֵה קִרְיָתָיִם׃", "rashi_he": "הזוזים. הֵם זַמְזֻמִּים:", "rashi_en": "הזוזים הם העם שנקרא במקום אחר זמזמים.", "note": "", "points": [{"q": "מִי הֵם \"הַזּוּזִים\" לְפִי רַשִׁ\"י?", "options": ["הֵם הָעָם הַנִּקְרָא בְּמָקוֹם אַחֵר זַמְזֻמִּים", "הֵם שֵׁבֶט שֶׁל רוֹעֵי צֹאן נוֹדְדִים", "הֵם צְבָא שְׂכִירִים שֶׁל מֶלֶךְ סְדוֹם"], "kasha": "העם \"הזוזים\" אינו מוכר ממקום אחר בתורה.", "answer": "הזוזים הם הזמזמים הנזכרים בספר דברים.", "kp": ["הם זמזמים"]}]}, {"id": "14:6.1", "ch": 14, "v": 6, "n": 1, "dh": "בהררם", "pasuk_html": "וְאֶת־הַחֹרִ֖י <mark>בְּהַרְרָ֣ם</mark> שֵׂעִ֑יר עַ֚ד אֵ֣יל פָּארָ֔ן אֲשֶׁ֖ר עַל־הַמִּדְבָּֽר׃", "pasuk_en": "וְאֶת־הַחֹרִי בְּהַרְרָם שֵׂעִיר עַד אֵיל פָּארָן אֲשֶׁר עַל־הַמִּדְבָּר׃", "rashi_he": "בהררם. בְּהַר שֶׁלָּהֶם:", "rashi_en": "\"בהררם\" פירושו בהר שלהם.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילָּה \"בְּהַרְרָם\"?", "options": ["בְּהַר שֶׁלָּהֶם", "בְּהָרִים רַבִּים מִסָּבִיבָם", "בְּכַעְסָם וּבַחֲמָתָם"], "kasha": "המילה \"בהררם\" בנויה בצורה לא רגילה, ויש לבאר את משמעותה.", "answer": "בהררם פירושו בהר שלהם.", "kp": ["בהר שלהם"]}]}, {"id": "14:6.2", "ch": 14, "v": 6, "n": 2, "dh": "איל פארן", "pasuk_html": "וְאֶת־הַחֹרִ֖י בְּהַרְרָ֣ם שֵׂעִ֑יר עַ֚ד <mark>אֵ֣יל פָּארָ֔ן</mark> אֲשֶׁ֖ר עַל־הַמִּדְבָּֽר׃", "pasuk_en": "וְאֶת־הַחֹרִי בְּהַרְרָם שֵׂעִיר עַד אֵיל פָּארָן אֲשֶׁר עַל־הַמִּדְבָּר׃", "rashi_he": "איל פארן. כְּתַרְגּוּמוֹ מִישׁוֹר. וְאוֹמֵר אֲנִי שֶׁאֵין אֵיל לְשׁוֹן מִישׁוֹר, אֶלָּא מִישׁוֹר שֶׁל פָּארָן אֵיל שְׁמוֹ, וְשֶׁל מַמְרֵא אֵלוֹנֵי שְׁמוֹ, וְשֶׁל יַרְדֵּן כִּכָּר שְׁמוֹ, וְשֶׁל שִׁטִּים אָבֵל שְׁמוֹ, אָבֵל הַשִּׁטִּים, וְכֵן בַּעַל גָּד בַּעַל שְׁמוֹ; וְכֻלָּם מְתֻרְגָּמִין מִישׁוֹר, וְכָל א' שְׁמוֹ עָלָיו:", "rashi_en": "אונקלוס תרגם \"איל\" מישור, אבל רש\"י אומר ש\"איל\" אינו פירוש המילה מישור, אלא שמו של מישור פארן, כמו שלכל מישור יש שם משלו: אלוני ממרא, כיכר הירדן, אבל השטים ובעל גד.", "note": "", "points": [{"q": "אֵיךְ מְבָאֵר רַשִׁ\"י אֶת הַמִּילָּה \"אֵיל\" בְּ\"אֵיל פָּארָן\"?", "options": ["זֶהוּ שְׁמוֹ הַפְּרָטִי שֶׁל מִישׁוֹר פָּארָן", "זוֹהִי מִילָּה רְגִילָה שֶׁפֵּירוּשָׁהּ מִישׁוֹר", "זֶהוּ עֵץ גָּדוֹל שֶׁעָמַד בְּפָארָן"], "kasha": "אונקלוס תרגם \"איל\" מישור, ואין מוכר שהמילה \"איל\" משמעה מישור.", "answer": "איל אינו לשון מישור, אלא זהו שמו של מישור פארן, כמו שלכל מישור יש שם משלו, ואונקלוס תרגם את כולם מישור.", "kp": ["אין איל לשון מישור", "מישור של פארן איל שמו", "וכל א' שמו עליו"]}]}, {"id": "14:6.3", "ch": 14, "v": 6, "n": 3, "dh": "על המדבר", "pasuk_html": "וְאֶת־הַחֹרִ֖י בְּהַרְרָ֣ם שֵׂעִ֑יר עַ֚ד אֵ֣יל פָּארָ֔ן אֲשֶׁ֖ר <mark>עַל־הַמִּדְבָּֽר׃</mark>", "pasuk_en": "וְאֶת־הַחֹרִי בְּהַרְרָם שֵׂעִיר עַד אֵיל פָּארָן אֲשֶׁר עַל־הַמִּדְבָּר׃", "rashi_he": "על המדבר. אֵצֶל הַמִּדְבָּר, כְּמוֹ וְעָלָיו מַטֵּה מְנַשֶּׁה (במדבר ב'):", "rashi_en": "\"על המדבר\" פירושו ליד המדבר, כמו \"ועליו מטה מנשה\" שפירושו לידו.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"עַל הַמִּדְבָּר\" לְפִי רַשִׁ\"י?", "options": ["לְיַד הַמִּדְבָּר", "מֵעַל הַמִּדְבָּר, בְּמָקוֹם גָּבוֹהַּ", "בְּתוֹךְ הַמִּדְבָּר עַצְמוֹ"], "kasha": "המילה \"על\" משמעה בדרך כלל מעל, ואין זה מתאים למקום שנמצא במדבר.", "answer": "על המדבר פירושו אצל המדבר, כמו \"ועליו מטה מנשה\".", "kp": ["אצל המדבר", "ועליו מטה מנשה"]}]}, {"id": "14:7.1", "ch": 14, "v": 7, "n": 1, "dh": "עין משפט היא קדש", "pasuk_html": "וַ֠יָּשֻׁבוּ וַיָּבֹ֜אוּ אֶל־<mark>עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ</mark> וַיַּכּ֕וּ אֶֽת־כָּל־שְׂדֵ֖ה הָעֲמָלֵקִ֑י וְגַם֙ אֶת־הָ֣אֱמֹרִ֔י הַיֹּשֵׁ֖ב בְּחַֽצְצֹ֥ן תָּמָֽר׃", "pasuk_en": "וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־עֵין מִשְׁפָּט הִוא קָדֵשׁ וַיַּכּוּ אֶת־כָּל־שְׂדֵה הָעֲמָלֵקִי וְגַם אֶת־הָאֱמֹרִי הַיֹּשֵׁב בְּחַצְצֹן תָּמָר׃", "rashi_he": "עין משפט היא קדש. עַל שֵׁם הֶעָתִיד, שֶׁעֲתִידִין מֹשֶׁה וְאַהֲרֹן לְהִשְָּׁפֵט שָׁם עַל עִסְקֵי אוֹתוֹ הָעַיִן וְהֵם מֵי מְרִיבָה. וְאֻנְקְלוֹס תִּרְגְּמוֹ כִפְשׁוּטוֹ מָקוֹם שֶׁהָיוּ בְנֵי הַמְּדִינָה מִתְקַבְּצִים שָׁם לְכָל מִשְׁפָּט:", "rashi_en": "המקום נקרא \"עין משפט\" על שם מה שעתיד לקרות שם, כשמשה ואהרן נשפטו על עסקי מי מריבה. אונקלוס פירש כפשוטו שזה המקום שבו התקבצו בני המדינה לכל משפט.", "note": "", "points": [{"q": "לְפִי פֵּירוּשׁוֹ הָרִאשׁוֹן שֶׁל רַשִׁ\"י, עַל שֵׁם מַה נִקְרָא הַמָּקוֹם \"עֵין מִשְׁפָּט\"?", "options": ["עַל שֵׁם מִשְׁפָּטָם הֶעָתִידִי שֶׁל מֹשֶׁה וְאַהֲרֹן בְּמֵי מְרִיבָה", "עַל שֵׁם בֵּית דִּין גָּדוֹל שֶׁיָּשַׁב שָׁם בְּאוֹתוֹ זְמַן", "עַל שֵׁם הַמִּלְחָמָה שֶׁבָּהּ נִשְׁפְּטוּ הַמְּלָכִים הַמּוֹרְדִים"], "kasha": "בזמן המלחמה לא היה ידוע שום משפט שקשור לעין, ולמה נקרא כך?", "answer": "נקרא כך על שם העתיד, שעתידים משה ואהרן להישפט שם על עסקי אותה העין, והם מי מריבה.", "kp": ["על שם העתיד", "והם מי מריבה"]}, {"q": "אֵיךְ פֵּירֵשׁ אוּנְקְלוֹס אֶת הַשֵּׁם \"עֵין מִשְׁפָּט\"?", "options": ["מָקוֹם שֶׁבּוֹ הִתְקַבְּצוּ בְּנֵי הַמְּדִינָה לְכָל מִשְׁפָּט", "מָקוֹם שֶׁבּוֹ עֲתִידִים מֹשֶׁה וְאַהֲרֹן לְהִישָּׁפֵט", "מַעְייָן שֶׁמֵּימָיו שִׁימְּשׁוּ לִבְדִיקַת סוֹטָה"], "kasha": "יש לבאר את השם גם לפי פשוטו, בלי להיזקק לאירוע עתידי.", "answer": "אונקלוס תרגם כפשוטו: מקום שבני המדינה היו מתקבצים בו לכל משפט.", "kp": ["כפשוטו מקום", "מתקבצים שם לכל משפט"]}]}, {"id": "14:7.2", "ch": 14, "v": 7, "n": 2, "dh": "שדה העמלקי", "pasuk_html": "וַ֠יָּשֻׁבוּ וַיָּבֹ
