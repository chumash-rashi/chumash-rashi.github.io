<style>
/* Layout: one narrow study column; a single card per Rashi, posuk on top, question below, reveal under it. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#1d3d6e; --accent-sמתוךt:#e3eaf5; --mark:#f6e7b4; --mark-ink:#18202b;
  --good:#1f7a4d; --good-sמתוךt:#e1f2e8; --bad:#b23a2e; --bad-sמתוךt:#f8e3e0;
  --f-heb:"Frank Ruhl Libre","Times New Roman",serif;
  --f-rashi:"Noto רש״י Hebrew","Frank Ruhl Libre",serif;
  --f-body:"Literata",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1a212b; --ink:#e6eaf0; --muted:#97a3b3; --line:#2c3644;
  --accent:#8fb0e6; --accent-sמתוךt:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-sמתוךt:#173328; --bad:#ef8a7e; --bad-sמתוךt:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1a212b; --ink:#e6eaf0; --muted:#97a3b3; --line:#2c3644;
  --accent:#8fb0e6; --accent-sמתוךt:#223149; --mark:#5a4a17; --mark-ink:#fff4cf;
  --good:#5fc794; --good-sמתוךt:#173328; --bad:#ef8a7e; --bad-sמתוךt:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100dvh;overflow:hidden}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-נכון:max(16px,env(safe-area-inset-נכון,0px));padding-block:12px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px;height:100%}
main{flex:1;min-height:0;overflow-y:auto}
header{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--f-heb);font-weight:700;font-size:22px;letter-spacing:.01em}
h1 span{font-family:var(--f-ui);font-weight:500;font-size:13px;color:var(--muted);margin-inline-start:8px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.count b{color:var(--ink)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{font-family:var(--f-ui);font-size:14px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.ref{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.pasuk{font-family:var(--f-heb);font-size:24px;line-height:1.75;direction:rtl;text-align:נכון}
.pasuk mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.pasuk-en{font-family:var(--f-body);font-size:14px;color:var(--muted);line-height:1.55;margin-top:-6px}
.dh{display:flex;align-items:center;gap:10px;direction:rtl;border-top:1px solid var(--line);padding-top:14px}
.dh .lbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.dh .pts{margin-inline-start:auto}
.point{display:flex;flex-direction:column;gap:12px}
.point+.point{border-top:1px dashed var(--line);padding-top:16px}
.pnum{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh .w{font-family:var(--f-rashi);font-size:20px;font-weight:600}
.q{font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
.q :lang(he),.heb{font-family:var(--f-heb);font-size:1.12em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.4;width:100%}
.opt .k{flex:none;font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;margin-top:1px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-מתוךfset:2px}
.opt[disabled]{cursor:default}
.opt.נכון{border-color:var(--good);background:var(--good-sמתוךt)}
.opt.נכון .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-sמתוךt)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.row{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.row .t{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap;min-width:92px}
.row p{margin:0;font-family:var(--f-body);font-size:15.5px;line-height:1.55;min-width:0}
@media (max-width:460px){.row{grid-template-columns:1fr}.pasuk{font-size:22px}}
details{font-size:14px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
.full{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.full .he{font-family:var(--f-rashi);font-size:18px;line-height:1.8;direction:rtl;text-align:נכון}
.full .he b{font-weight:600}
.full .en{font-family:var(--f-body);color:var(--muted);line-height:1.55}
.full .src{font-size:11px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted);text-align:center;flex-shrink:0}
.verdict{font-weight:600;font-size:14px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.done h2{font-family:var(--f-heb);margin:0;font-size:26px}
.done p{margin:0;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<script>
const DATA = [{"id": "12:1.1", "ch": 12, "v": 1, "n": 1, "dh": "לך לך", "pasuk_html": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־אַבְרָ֔ם לֶךְ־לְךָ֛ מֵאַרְצְךָ֥ וּמִמּֽוֹלַדְתְּךָ֖ וּמִבֵּ֣ית אָבִ֑יךָ אֶל־הָאָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽךָּ׃", "pasuk_en": "Adonoy said to Avram, Go from your land, from your birthplace, and from your father’s house, [and go] to the land that I will show you.", "rashi_he": "לַהֲנָאָתְךָ וּלְטוֹבָתְךָ, שָׁם אֶעֶשְׂךָ לְגוֹי גָדוֹל, כָּאן אִי אַתָּה זוֹכֶה לְבָנִים, וְעוֹד שֶׁאוֹדִיעַ טִבְעֲךָ בָּעוֹלָם:", "rashi_en": "[Meaning:] “For your own benefit, for your own good. It is there that I will make you into a great nation, [whereas] here you will not merit having children. Also, I will make your character known to the world.”", "note": "", "points": [{"q": "Hashem tells Avram 'לך לך', literally 'go for yourself.' Why add 'for yourself'?", "options": ["It's for Avram's own benefit", "Avram had to go alone", "It means 'go quickly'"], "kasha": "'לך' alone means 'go', so the extra 'לך' seems unnecessary.", "answer": "It means 'for your benefit and your good': there I'll make you a great nation, while here you won't merit having children."}, {"q": "Besides children, what other benefit does רש״י say Avram gains by leaving?", "options": ["Hashem will make his character known in the world", "He will become king מתוך Canaan", "He will escape Nimrod's anger"], "kasha": "Is having children the only benefit מתוך 'for yourself'?", "answer": "Also: Hashem will make Avram's nature known throughout the world."}]}, {"id": "12:2.1", "ch": 12, "v": 2, "n": 1, "dh": "ואעשך לגוי גדול", "pasuk_html": "<mark>וְאֶֽעֶשְׂךָ֙ לְג֣וֹי גָּד֔וֹל</mark> וַאֲבָ֣רֶכְךָ֔ וַאֲגַדְּלָ֖ה שְׁמֶ֑ךָ וֶהְיֵ֖ה בְּרָכָֽה׃", "pasuk_en": "I will make you into a great nation, I will bless you and make your name great; and you will be a blessing [and you will be blessed].", "rashi_he": "לְפִי שֶׁהַדֶּרֶךְ גּוֹרֶמֶת לִשְׁלֹשָׁה דְבָרִים, מְמַעֶטֶת פְּרִיָּה וּרְבִיָּה וּמְמַעֶטֶת אֶת הַמָּמוֹן וּמְמַעֶטֶת אֶת הַשֵּׁם, לְכָךְ הֻזְקַק לִשְׁלֹשָׁה בְּרָכוֹת הַלָּלוּ, שֶׁהִבְטִיחוֹ עַל הַבָּנִים וְעַל הַמָּמוֹן וְעַל הַשֵּׁם:", "rashi_en": "Since traveling causes three things: It inhibits the birth מתוך children, and decreases one’s wealth and lessens one’s fame, therefore, these three blessings were necessary. He [God], promised him children, wealth and fame.", "note": "", "points": [{"q": "Why does Hashem promise Avram three things here: a great nation, a blessing, and a great name?", "options": ["Travel lessens children, wealth and fame", "Avram asked for exactly three things", "Each one is for a different son"], "kasha": "Why does Hashem need to promise these three specific blessings נכון when Avram sets out?", "answer": "Traveling reduces three things: having children, wealth, and one's reputation. So Hashem had to promise him children, wealth and a great name."}]}, {"id": "12:2.2", "ch": 12, "v": 2, "n": 2, "dh": "ואברכך", "pasuk_html": "וְאֶֽעֶשְׂךָ֙ לְג֣וֹי גָּד֔וֹל <mark>וַאֲבָ֣רֶכְךָ֔</mark> וַאֲגַדְּלָ֖ה שְׁמֶ֑ךָ וֶהְיֵ֖ה בְּרָכָֽה׃", "pasuk_en": "I will make you into a great nation, I will bless you and make your name great; and you will be a blessing [and you will be blessed].", "rashi_he": "בְּמָמוֹן (בראשית רבה):", "rashi_en": "With wealth.", "note": "", "points": [{"q": "'ואברכך' — 'I will bless you.' Bless him with what?", "options": ["With wealth", "With long life", "With wisdom"], "kasha": "'I will bless you' is vague; it doesn't say what the blessing is.", "answer": "With money (Midrash)."}]}, {"id": "12:2.3", "ch": 12, "v": 2, "n": 3, "dh": "והיה ברכה", "pasuk_html": "וְאֶֽעֶשְׂךָ֙ לְג֣וֹי גָּד֔וֹל וַאֲבָ֣רֶכְךָ֔ וַאֲגַדְּלָ֖ה שְׁמֶ֑ךָ <mark>וֶהְיֵ֖ה בְּרָכָֽה׃</mark>", "pasuk_en": "I will make you into a great nation, I will bless you and make your name great; and you will be a blessing [and you will be blessed].", "rashi_he": "הַבְּרָכוֹת נְתוּנוֹת בְּיָדְךָ; עַד עַכְשָׁו הָיוּ בְיָדִי, בֵּרַכְתִּי לְאָדָם וְנֹחַ, וּמֵעַכְשָׁו אַתָּה תְבָרֵךְ אֶת אֲשֶׁר תַּחְפֹּץ (בראשית רבה). דָּבָר אַחֵר <b>ואעשך לגוי גדול</b> זֶה שֶׁאוֹמְרִים אֱלֹהֵי אַבְרָהָם, <b>ואברכך</b> זֶה שֶׁאוֹמְרִים אֱלֹהֵי יִצְחָק, <b>ואגדלה שמך</b> זֶה שֶׁאוֹמְרִים אֱלֹהֵי יַעֲקֹב. יָכוֹל יִהְיוּ חוֹתְמִין בְּכֻלָּן, תַּלְמוּד לוֹמַר וֶהְיֵה בְּרָכָה, בְּךָ חוֹתְמִין וְלֹא בָהֶם:", "rashi_en": "[I.e.,] the blessings are entrusted to you. Until now they were in My hand; I blessed Adam and Noach. Henceforth, you shall bless whomever you desire. An alternate explanation: I will make you into a great nation. This [is the basis מתוך the opening Shemoneh Esrei prayer], when we say: “God מתוך Avraham.” I will bless you. This is the basis מתוך saying: “God מתוך Yitzchok.” And [I will] make your name great. This is the basis מתוך saying: “God מתוך Yaakov.” One might think [that the first berachah מתוך Shemoneh Esrei] should be concluded by [mentioning] all [three]. The text, therefore, states … And you will be a blessing. Only with your mention is it concluded and not with them [Yitzchok and Yaakov].", "note": "", "points": [{"q": "'והיה ברכה' — 'you will be a blessing.' What does it mean for a person to 'be' a blessing?", "options": ["The power to bless is given to Avram", "Avram will become very wealthy", "Avram will have many children"], "kasha": "How can a person 'be' a blessing? The phrase is unclear.", "answer": "The blessings are put in your hands. Until now they were in Mine: I blessed Adam and Noach. From now on, you will bless whomever you wish (Midrash)."}, {"q": "Another explanation links the three promises — great nation, blessing, great name — to something people say. What?", "options": ["'God מתוך Avraham, God מתוך Yitzchak, God מתוך Yaakov'", "The three meals מתוך Shabbos", "The three daily tefillos"], "kasha": "Why list three separate promises at all?", "answer": "'A great nation' is why we say 'God מתוך Avraham'; 'I will bless you,' 'God מתוך Yitzchak'; 'I will make your name great,' 'God מתוך Yaakov.'"}, {"q": "If all three Avos are mentioned at the start מתוך the brachah, how does 'והיה ברכה' affect how it ends?", "options": ["It ends with Avraham alone", "It ends with all three Avos", "It ends with Yaakov alone"], "kasha": "One might think the brachah should conclude by mentioning all three.", "answer": "'And you will be a blessing' teaches that the brachah concludes with you alone, not with them."}]}, {"id": "12:2.4", "ch": 12, "v": 2, "n": 4, "dh": "מארצך", "pasuk_html": "וְאֶֽעֶשְׂךָ֙ לְג֣וֹי גָּד֔וֹל וַאֲבָ֣רֶכְךָ֔ וַאֲגַדְּלָ֖ה שְׁמֶ֑ךָ וֶהְיֵ֖ה בְּרָכָֽה׃", "pasuk_en": "Adonoy said to Avram, Go from your land, from your birthplace, and from your father’s house, [and go] to the land that I will show you.", "rashi_he": "וַהֲלֹא כְבָר יָצָא מִשָּׁם עִם אָבִיו וּבָא עַד חָרָן? אֶלָּא כָּךְ אָמַר לוֹ הִתְרַחֵק עוֹד מִשָּׁם וְצֵא מִבֵּית אָבִיךָ:", "rashi_en": "But, had he not already left there with his father and come to Charan? But, He [in effect] was telling him, “Keep distancing yourself from there and leave your father’s house [as well].”", "note": "These words are from posuk 12:1:", "points": [{"q": "Hashem tells Avram to leave 'מארצך' — his land. Hadn't he already left it?", "options": ["Go even farther, and leave your father's house", "He had secretly gone back home", "Charan was also called his land"], "kasha": "Avram had already left his homeland with his father and come to Charan.", "answer": "Hashem was telling him: distance yourself even farther from there, and leave your father's house too."}]}, {"id": "12:2.5", "ch": 12, "v": 2, "n": 5, "dh": "אשר אראך", "pasuk_html": "וְאֶֽעֶשְׂךָ֙ לְג֣וֹי גָּד֔וֹל וַאֲבָ֣רֶכְךָ֔ וַאֲגַדְּלָ֖ה שְׁמֶ֑ךָ וֶהְיֵ֖ה בְּרָכָֽה׃", "pasuk_en": "Adonoy said to Avram, Go from your land, from your birthplace, and from your father’s house, [and go] to the land that I will show you.", "rashi_he": "לֹא גִּלָּה לוֹ הָאָרֶץ מִיָּד כְּדֵּי לְחַבְּבָהּ בְּעֵינָיו, וְלָתֵת לוֹ שָׂכָר עַל כָּל דִּבּוּר וְדִבּוּר; כַּיּוֹצֵא בוֹ, אֶת בִּנְךָ אֶת יְחִידְךָ אֲשֶׁר אָהַבְתָּ אֶת יִצְחָק (ברא' כ\"ב), כַּיּוֹצֵא בוֹ עַל אַחַד הֶהָרִים אֲשֶׁר אֹמַר אֵלֶיךָ, וכיו\"בּ וּקְרָא אֵלֶיהָ אֶת הַקְּרִיאָה אֲשֶׁר אָנֹכִי דֹּבֵר אֵלֶיךָ (יונה ג'):", "rashi_en": "He did not immediately reveal which land it was in order that it be precious in his eyes, as well as to reward him for every word. Similarly: “Your son, your only, the one you love, Yitzchok” Similarly: “On one מתוך the mountains that I will tell you,” and similarly: “And proclaim to it the proclamation that I will tell you.”", "note": "These words are from posuk 12:1:", "points": [{"q": "'אל הארץ אשר אראך' — why didn't Hashem just name the land נכון away?", "options": ["To make it dear to him and add reward", "Avram wouldn't have recognized the name", "The land didn't have a name yet"], "kasha": "Why keep the destination hidden instead מתוך naming it?", "answer": "To make the land precious in his eyes, and to give him reward for each and every word."}, {"q": "Where else does Hashem reveal something only gradually, in the same way?", "options": ["The Akeidah, and Yonah's message to Ninveh", "The ten makkos in Mitzrayim", "The building מתוך the Mishkan"], "kasha": "Is this a one-time style, or does Hashem do this elsewhere?", "answer": "At the Akeidah: 'your son, your only one, whom you love, Yitzchak' and 'one מתוך the mountains that I will tell you'; and to Yonah: 'the proclamation that I will tell you.'"}]}, {"id": "12:3.1", "ch": 12, "v": 3, "n": 1, "dh": "ונברכו בך", "pasuk_html": "וַאֲבָֽרְכָה֙ מְבָ֣רְכֶ֔יךָ וּמְקַלֶּלְךָ֖ אָאֹ֑ר <mark>וְנִבְרְכ֣וּ בְךָ֔</mark> כֹּ֖ל מִשְׁפְּחֹ֥ת הָאֲדָמָֽה׃", "pasuk_en": "I will bless those who bless you, and he who curses you, I will curse; and through you [and because מתוך you], will be blessed all the families מתוך the earth.", "rashi_he": "יֵשׁ אַגָּדוֹת רַבּוֹת, וְזֶהוּ פְשׁוּטוֹ, אָדָם אוֹמֵר לִבְנוֹ תְּהֵא כְּאַבְרָהָם, וְכֵן כָּל וְנִבְרְכוּ בְךָ שֶׁבַּמִּקְרָא, וְזֶה מוֹכִיחַ בְּךָ יְבָרֵךְ יִשְׂרָאֵל לֵאמֹר יְשִׂמְךָ אֱלֹהִים כְּאֶפְרַיִם וְכִמְנַשֶּׁה (בר' מ\"ח):", "rashi_en": "There are many Aggadaic interpretations, but this is the simple meaning: A man says to his son, “May you be like Avraham.” This is the meaning every [time the expression] וְנִבְרְכוּ בְךָ [appears] in Scripture. The following [expression] proves this: “Through you shall [the People מתוך] Israel bless, saying: May Elohim make you as Ephraim and Menasheh.”", "note": "", "points": [{"q": "'ונברכו בך כל משפחות האדמה' — how will all families be blessed 'through' Avram?", "options": ["People will bless their sons: 'Be like Avraham'", "Avram will personally visit every family", "All nations will get his wealth"], "kasha": "What does it mean that everyone will be blessed 'through you'?", "answer": "There are many Aggados, but the simple meaning is: a man says to his son, 'May you be like Avraham.'"}, {"q": "Is this meaning only for Avram? What posuk proves how 'ונברכו בך' is used?", "options": ["'Through you Yisroel will bless: be like Ephraim and Menashe'", "'I will bless those who bless you'", "'You will be a blessing'"], "kasha": "How do we know 'blessed through you' means using that person's name in a blessing?", "answer": "Every 'ונברכו בך' in Tanach means this. Proמתוך: 'Through you Yisroel will bless, saying: may Elokim make you like Ephraim and Menashe.'"}]}, {"id": "12:5.1", "ch": 12, "v": 5, "n": 1, "dh": "אשר עשו בחרן", "pasuk_html": "וַיִּקַּ֣ח אַבְרָם֩ אֶת־שָׂרַ֨י אִשְׁתּ֜וֹ וְאֶת־ל֣וֹט בֶּן־אָחִ֗יו וְאֶת־כׇּל־רְכוּשָׁם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְאֶת־הַנֶּ֖פֶשׁ אֲשֶׁר־עָשׂ֣וּ בְחָרָ֑ן וַיֵּצְא֗וּ לָלֶ֙כֶת֙ אַ֣רְצָה כְּנַ֔עַן וַיָּבֹ֖אוּ אַ֥רְצָה כְּנָֽעַן׃", "pasuk_en": "Avram took his wife Sarai, Lot, his brother’s son, all their possessions they had acquired, and the souls [people] that they had made [converted] in Charan, and they set out to go to the land מתוך Canaan. They came to the land מתוך Canaan.", "rashi_he": "שֶׁהִכְנִיסָן תַּחַת כַּנְפֵי הַשְּׁכִינָה; אַבְרָהָם מְגַיֵּר אֶת הָאֲנָשִׁים וְשָׂרָה מְגַיֶּרֶת הַנָּשִׁים, וּמַעֲלֶה עֲלֵיהֶם הַכָּתוּב כְּאִלּוּ עֲשָׂאוּם; וּפְשׁוּטוֹ שֶׁל מִקְרָא עֲבָדִים וּשְׁפָחוֹת שֶׁקָּנוּ לָהֶם, כְּמוֹ עָשָׂה אֵת כָּל הַכָּבֹד הַזֶּה (שם ל\"א), וְיִשְׂרָאֵל עֹשֶׂה חָיִל (במדבר כד יח), לְשׁוֹן קוֹנֶה וְכוֹנֵס:", "rashi_en": "[Meaning those souls] that he brought under the protective wings מתוך the Divine Presence. Avraham would convert the men and Sarah would convert the women, and Scripture considers them as if they had “made” them. But, the plain meaning מתוך the verse is [that this refers to] the slaves and maidservants whom they acquired for themselves, as in the verse, “He acquired all this wealth” [or,] “And Israel acquires wealth,” meaning acquiring and amassing.", "note": "", "points": [{"q": "'הנפש אשר עשו בחרן' — the souls they 'made' in Charan. How can people make souls?", "options": ["They brought people close to Hashem", "They had many children in Charan", "They built statues מתוך people"], "kasha": "People can't 'make' souls, so what does 'עשו' mean here?", "answer": "They brought them under the wings מתוך the Shechinah: Avram converted the men and Sarai the women, and the Torah counts it as if they 'made' them."}, {"q": "What is the plain meaning (פשוטו) מתוך 'הנפש אשר עשו'?", "options": ["Servants they acquired; 'עשה' can mean acquire", "Children born to them in Charan", "Animals they raised in Charan"], "kasha": "The converts explanation is a drash; what do the words simply mean?", "answer": "Slaves and maidservants they acquired. 'עשה' means acquire and amass, as in 'עשה את כל הכבד הזה' and 'וישראל עשה חיל.'"}]}, {"id": "12:6.1", "ch": 12, "v": 6, "n": 1, "dh": "ויעבר אברם בארץ", "pasuk_html": "<mark>וַיַּעֲבֹ֤ר אַבְרָם֙ בָּאָ֔רֶץ</mark> עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְהַֽכְּנַעֲנִ֖י אָ֥ז בָּאָֽרֶץ׃", "pasuk_en": "Avram passed [traveled] through the land until the place מתוך Shechem, until the Plain מתוך Moreh. The Canaanites were then in the land.", "rashi_he": "נִכְנַס לְתוֹכָהּ:", "rashi_en": "[Meaning] he entered it.", "note": "", "points": [{"q": "'ויעבר אברם בארץ' — 'passed through the land.' Does that mean he passed by without entering?", "options": ["No, it means he entered it", "Yes, he only went around it", "He crossed it to reach Mitzrayim"], "kasha": "'ויעבר' could sound like he passed by without going in.", "answer": "It means he entered into it."}]}, {"id": "12:6.2", "ch": 12, "v": 6, "n": 2, "dh": "עד מקום שכם", "pasuk_html": "וַיַּעֲבֹ֤ר אַבְרָם֙ בָּאָ֔רֶץ <mark>עַ֚ד מְק֣וֹם שְׁכֶ֔ם</mark> עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְהַֽכְּנַעֲנִ֖י אָ֥ז בָּאָֽרֶץ׃", "pasuk_en": "Avram passed [traveled] through the land until the place מתוך Shechem, until the Plain מתוך Moreh. The Canaanites were then in the land.", "rashi_he": "לְהִתְפַּלֵּל עַל בְּנֵי יַעֲקֹב, כְּשֶׁיָּבֹאוּ לְהִלָּחֵם בִּשְׁכֶם:", "rashi_en": "In order to pray for Yaakov’s sons when they will come to do battle against Shechem.", "note": "", "points": [{"q": "Why does the posuk mention that Avram went specifically 'עד מקום שכם'?", "options": ["To pray for Yaakov's sons who'd fight there", "It was the biggest city around", "His family lived in Shechem"], "kasha": "Why does the Torah tell us Avram went specifically to Shechem?", "answer": "He went to pray for Yaakov's sons, who would one day come to fight at Shechem."}]}, {"id": "12:6.3", "ch": 12, "v": 6, "n": 3, "dh": "אלון מורה", "pasuk_html": "וַיַּעֲבֹ֤ר אַבְרָם֙ בָּאָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד <mark>אֵל֣וֹן מוֹרֶ֑ה</mark> וְהַֽכְּנַעֲנִ֖י אָ֥ז בָּאָֽרֶץ׃", "pasuk_en": "Avram passed [traveled] through the land until the place מתוך Shechem, until the Plain מתוך Moreh. The Canaanites were then in the land.", "rashi_he": "הוּא שְׁכֶם. הֶרְאָהוּ הַר גְּרִיזִים וְהַר עֵיבָל, שֶׁשָּׁם קִבְּלוּ יִשְׂרָאֵל שְׁבוּעַת הַתּוֹרָה:", "rashi_en": "It is [another name for] Shechem. [It is so called because there] He showed him Mount Gerizim and Mount Eival where Israel accepted the oath to abide by the Torah.", "note": "", "points": [{"q": "Avram came to 'עד מקום שכם עד אלון מורה'. Is אלון מורה a second, different place?", "options": ["No, it is Shechem itself", "Yes, a place far past Shechem", "Yes, a city near Mitzrayim"], "kasha": "The posuk names two places; is Avram traveling further?", "answer": "It is Shechem."}, {"q": "What did Hashem show Avram at אלון מורה?", "options": ["Har Gerizim and Har Eival", "The whole מתוך Eretz Yisroel", "The place מתוך the Akeidah"], "kasha": "Why does the posuk add this name for Shechem?", "answer": "Hashem showed him Har Gerizim and Har Eival, where Yisroel would later accept the oath מתוך the Torah."}]}, {"id": "12:6.4", "ch": 12, "v": 6, "n": 4, "dh": "והכנעני אז בארץ", "pasuk_html": "וַיַּעֲבֹ֤ר אַבְרָם֙ בָּאָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה <mark>וְהַֽכְּנַעֲנִ֖י אָ֥ז בָּאָֽרֶץ׃</mark>", "pasuk_en": "Avram passed [traveled] through the land until the place מתוך Shechem, until the Plain מתוך Moreh. The Canaanites were then in the land.", "rashi_he": "הָיָה הוֹלֵךְ וְכוֹבֵשׁ אֶת אֶרֶץ יִשְׂרָאֵל מִזַּרְעוֹ שֶׁל שֵׁם, שֶׁבְּחֶלְקוֹ שֶׁל שֵׁם נָפְלָה כְּשֶׁחָלַק נֹחַ אֶת הָאָרֶץ לְבָנָיו, שֶׁנֶּאֱמַר וּמַלְכִּי צֶדֶק מֶלֶךְ שָׁלֵם (ברא' י\"ב), לְפִיכָךְ וַיֹּאמֶר ה' אֶל אַבְרָם לְזַרְעֲךָ אֶתֵּן אֶת הָאָרֶץ הַזֹּאת, עָתִיד אֲנִי לְהַחֲזִירָהּ לְבָנֶיךָ שֶׁהֵם מִזַּרְעוֹ שֶׁל שֵׁם:", "rashi_en": "He [the Canaanite] gradually conquered Eretz Yisrael from the descendants מתוך Sheim. For it fell to the share מתוך Sheim when Noach apportioned the land to his sons as it is said: “Malki Zedek King מתוך Shaleim.” For this reason—“Adonoy said to Avram, ‘to your descendants will I give this land,’” meaning, “In the future I will return it to your children who are descendants מתוך Sheim.”", "note": "", "points": [{"q": "'והכנעני אז בארץ' — why tell us the Canaanites were 'then' in the land?", "options": ["They were then conquering it from others", "They had just left the land", "They welcomed Avram warmly"], "kasha": "Why does the posuk need to say the Canaanite was 'then' in the land?", "answer": "The Canaanite was then gradually conquering Eretz Yisroel from the descendants מתוך Sheim."}, {"q": "Why did the land belong to Sheim's family? How do we know?", "options": ["Noach gave it to Sheim; Malki-tzedek ruled Shalem", "Sheim bought it from Canaan", "Avram inherited it from Terach"], "kasha": "What claim did Sheim's descendants have to this land?", "answer": "It fell to Sheim's share when Noach divided the earth among his sons, as it says 'ומלכי צדק מלך שלם'."}, {"q": "How does this explain Hashem's next words, 'לזרעך אתן את הארץ הזאת'?", "options": ["He'll return it to Sheim's descendants, Avram's children", "He'll let the Canaanites keep it forever", "He'll give it to Lot's children"], "kasha": "Why does Hashem promise the land נכון after mentioning the Canaanites?", "answer": "Therefore Hashem told Avram: in the future I will return it to your children, who are descendants מתוך Sheim."}]}, {"id": "12:7.1", "ch": 12, "v": 7, "n": 1, "dh": "ויבן שם מזבח", "pasuk_html": "וַיֵּרָ֤א יְהֹוָה֙ אֶל־אַבְרָ֔ם וַיֹּ֕אמֶר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את <mark>וַיִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ</mark> לַיהֹוָ֖ה הַנִּרְאֶ֥ה אֵלָֽיו׃", "pasuk_en": "Adonoy appeared [became revealed] to Avram and said: To your descendants I will give this land. There he built an altar to [before] Adonoy Who had appeared [been revealed] to him.", "rashi_he": "עַל בְּשׂוֹרַת הַזֶּרַע וְעַל בְּשׂוֹרַת אֶרֶץ יִשְׂרָאֵל:", "rashi_en": "[In thanksgiving] for the tidings מתוך [his having] children and for the tidings [that they would inherit] Eretz Yisrael.", "note": "", "points": [{"q": "'ויבן שם מזבח' — why did Avram build an altar at this point?", "options": ["Thanks for promises מתוך children and the land", "To bring a korban for the famine", "To mark the border מתוך the land"], "kasha": "Why build an altar נכון here?", "answer": "For the good news that he would have children and the good news מתוך Eretz Yisroel."}]}, {"id": "12:8.1", "ch": 12, "v": 8, "n": 1, "dh": "ויעתק משם", "pasuk_html": "<mark>וַיַּעְתֵּ֨ק מִשָּׁ֜ם</mark> הָהָ֗רָה מִקֶּ֛דֶם לְבֵֽית־אֵ֖ל וַיֵּ֣ט אׇהֳלֹ֑ה בֵּֽית־אֵ֤ל מִיָּם֙ וְהָעַ֣י מִקֶּ֔דֶם וַיִּֽבֶן־שָׁ֤ם מִזְבֵּ֙חַ֙ לַֽיהֹוָ֔ה וַיִּקְרָ֖א בְּשֵׁ֥ם יְהֹוָֽה׃", "pasuk_en": "From there he moved [ascended] to the mountain that was east מתוך Beis-Eil and set up his tent. Beis-Eil was to the west and Ai was to the east. There he built an altar to [before] Adonoy, and he proclaimed the Name, [and he prayed in the Name,] Adonoy.", "rashi_he": "אָהֳלוֹ:", "rashi_en": "[This refers to] his tent.", "note": "", "points": [{"q": "'ויעתק משם' — he moved from there. What did he move?", "options": ["His tent", "His altar", "His flocks"], "kasha": "'ויעתק' is an unusual word, and the posuk doesn't say what was moved.", "answer": "His tent."}]}, {"id": "12:8.2", "ch": 12, "v": 8, "n": 2, "dh": "מקדם לבית אל", "pasuk_html": "וַיַּעְתֵּ֨ק מִשָּׁ֜ם הָהָ֗רָה מִקֶּ֛דֶם לְבֵֽית־אֵ֖ל וַיֵּ֣ט אׇהֳלֹ֑ה בֵּֽית־אֵ֤ל מִיָּם֙ וְהָעַ֣י מִקֶּ֔דֶם וַיִּֽבֶן־שָׁ֤ם מִזְבֵּ֙חַ֙ לַֽיהֹוָ֔ה וַיִּקְרָ֖א בְּשֵׁ֥ם יְהֹוָֽה׃", "pasuk_en": "From there he moved [ascended] to the mountain that was east מתוך Beis-Eil and set up his tent. Beis-Eil was to the west and Ai was to the east. There he built an altar to [before] Adonoy, and he proclaimed the Name, [and he prayed in the Name,] Adonoy.", "rashi_he": "בְּמִזְרָחָהּ שֶׁל בֵּית אֵל נִמְצֵאת בֵּית אֵל בְּמַעֲרָבוֹ, הוּא שֶׁנֶּאֱמַר בֵּית אֵל מִיָּם:", "rashi_en": "Means east מתוך Beis-Eil. Whereby Beis-Eil is located to his west, and that is what is meant by: “Beis-Eil in the west.”", "note": "", "points": [{"q": "The mountain was 'מקדם לבית אל'. Which side מתוך the mountain was Beis-Eil?", "options": ["West; the mountain was east מתוך Beis-Eil", "East; Beis-Eil was east מתוך the mountain", "North מתוך the mountain"], "kasha": "'מקדם לבית אל' is unclear: what was east מתוך what?", "answer": "The mountain was east מתוך Beis-Eil, so Beis-Eil was to his west, as the posuk says 'בית אל מים'."}]}, {"id": "12:8.3", "ch": 12, "v": 8, "n": 3, "dh": "אהלו", "pasuk_html": "וַיַּעְתֵּ֨ק מִשָּׁ֜ם הָהָ֗רָה מִקֶּ֛דֶם לְבֵֽית־אֵ֖ל וַיֵּ֣ט אׇהֳלֹ֑ה בֵּֽית־אֵ֤ל מִיָּם֙ וְהָעַ֣י מִקֶּ֔דֶם וַיִּֽבֶן־שָׁ֤ם מִזְבֵּ֙חַ֙ לַֽיהֹוָ֔ה וַיִּקְרָ֖א בְּשֵׁ֥ם יְהֹוָֽה׃", "pasuk_en": "From there he moved [ascended] to the mountain that was east מתוך Beis-Eil and set up his tent. Beis-Eil was to the west and Ai was to the east. There he built an altar to [before] Adonoy, and he proclaimed the Name, [and he prayed in the Name,] Adonoy.", "rashi_he": "אהלה כְתִיב, בַּתְּחִלָּה נָטָה אֶת אֹהֶל אִשְׁתּוֹ וְאַחַר כָּךְ אֶת שֶׁלּוֹ (בראשית רבה):", "rashi_en": "It is written אהלה [her tent]. [The reason for this is because] he first pitched his wife’s tent and, afterwards, his own.", "note": "", "points": [{"q": "'אהלה' is spelled with a ה instead מתוך a ו. What does that hint to?", "options": ["He pitched his wife's tent first", "Sarai owned the tent", "Sarai pitched both tents"], "kasha": "'אהלה' is written with a ה, which reads 'her tent' instead מתוך 'his tent.'", "answer": "He first pitched his wife's tent and afterwards his own (Midrash)."}]}, {"id": "12:8.4", "ch": 12, "v": 8, "n": 4, "dh": "ויבן שם מזבח", "pasuk_html": "וַיַּעְתֵּ֨ק מִשָּׁ֜ם הָהָ֗רָה מִקֶּ֛דֶם לְבֵֽית־אֵ֖ל וַיֵּ֣ט אׇהֳלֹ֑ה בֵּֽית־אֵ֤ל מִיָּם֙ וְהָעַ֣י מִקֶּ֔דֶם וַיִּֽבֶן־שָׁ֤ם מִזְבֵּ֙חַ֙ לַֽיהֹוָ֔ה וַיִּקְרָ֖א בְּשֵׁ֥ם יְהֹוָֽה׃", "pasuk_en": "From there he moved [ascended] to the mountain that was east מתוך Beis-Eil and set up his tent. Beis-Eil was to the west and Ai was to the east. There he built an altar to [before] Adonoy, and he proclaimed the Name, [and he prayed in the Name,] Adonoy.", "rashi_he": "נִתְנַבֵּא שֶׁעֲתִידִין בָּנָיו לְהִכָּשֵׁל שָׁם עַל עֲוֹן עָכָן, וְהִתְפַּלֵּל שָׁם עֲלֵיהֶם:", "rashi_en": "He prophetically saw that his descendants were destined to be weakened there through Achan’s transgression, so he prayed for them there.", "note": "", "points": [{"q": "Avram already built an altar in Shechem. Why build another 'ויבן שם מזבח' near Ai?", "options": ["To pray for his descendants who'd fall there", "To thank Hashem for the famine ending", "His first altar had broken"], "kasha": "Why another altar here, by Ai, with no new promise mentioned?", "answer": "He foresaw that his descendants would stumble there because מתוך Achan's sin, so he prayed for them there."}]}, {"id": "12:9.1", "ch": 12, "v": 9, "n": 1, "dh": "הלוך ונסוע", "pasuk_html": "וַיִּסַּ֣ע אַבְרָ֔ם <mark>הָל֥וֹךְ וְנָס֖וֹעַ</mark> הַנֶּֽגְבָּה׃&nbsp;{פ}", "pasuk_en": "Avram journeyed, traveling steadily southward.", "rashi_he": "לִפְרָקִים יוֹשֵׁב כָּאן חֹדֶשׁ אוֹ יוֹתֵר, וְנוֹסֵעַ מִשָּׁם וְנוֹטֶה אָהֳלוֹ בְּמָקוֹם אַחֵר, וְכָל מַסָּעָיו הַנֶּגְבָּה, לָלֶכֶת לִדְרוֹמָהּ שֶׁל אֶרֶץ יִשְֹרָאֵל וְהִיא לְצַד יְרוּשָׁלַיִם, שֶׁהוּא בְּחֶלְקוֹ שֶׁל יְהוּדָה, שֶׁנָּטְלוּ בִּדְרוֹמָהּ שֶׁל אֶרֶץ יִשְֹרָאֵל לְהַר הַמּוֹרִיָּה שֶׁהִיא נַחֲלָתוֹ (בראשית רבה):", "rashi_en": "At intervals. He would stay here a month or so, then travel and pitch his tent somewhere else. But, all his travels were southward [aimed at] going to the south מתוך Eretz Yisrael, which is in the direction מתוך Yerushalayim, which is in the territory מתוך Yehudah, who took [his portion] in southern Eretz Yisrael to Mount Moriah which is his [Yehudah’s] possession.", "note": "", "points": [{"q": "'הלוך ונסוע' — 'going and traveling.' How did Avram travel?", "options": ["In stages, staying a month or so each place", "Nonstop, day and night", "Back and forth between two places"], "kasha": "The double expression 'הלוך ונסוע' seems repetitive.", "answer": "At intervals: he would stay in one place a month or more, then travel on and pitch his tent somewhere else."}, {"q": "All his travels were 'הנגבה', southward. What was he heading toward?", "options": ["Yerushalayim and Har HaMoriah, in Yehudah's portion", "Mitzrayim, to escape the famine", "The Yam HaMelach and Sedom"], "kasha": "Why stress that every stage was southward?", "answer": "Toward the south מתוך Eretz Yisroel, toward Yerushalayim in Yehudah's portion, up to Har HaMoriah, which is Yehudah's inheritance (Midrash)."}]}, {"id": "12:10.1", "ch": 12, "v": 10, "n": 1, "dh": "רעב בארץ", "pasuk_html": "וַיְהִ֥י <mark>רָעָ֖ב בָּאָ֑רֶץ</mark> וַיֵּ֨רֶד אַבְרָ֤ם מִצְרַ֙יְמָה֙ לָג֣וּר שָׁ֔ם כִּֽי־כָבֵ֥ד הָרָעָ֖ב בָּאָֽרֶץ׃", "pasuk_en": "There was a famine in the land. Avram went down to Egypt to live there temporarily, for the famine was severe in the land.", "rashi_he": "בְּאוֹתָהּ הָאָרֶץ לְבַדָּהּ, לְנַסּוֹתוֹ, אִם יְהַרְהֵר אַחַר דְּבָרָיו שֶׁל הַקָּבָּ\"ה שֶׁאָמַר לָלֶכֶת אֶל אֶרֶץ כְּנַעַן, וְעַכְשָׁו מַשִּׂיאוֹ לָצֵאת מִמֶּנָּה:", "rashi_en": "In that land only. [This was] in order to test him [Avram] whether he will question the words מתוך God who had told him to go to the Land מתוך Canaan and now is forcing him to leave it.", "note": "", "points": [{"q": "'ויהי רעב בארץ' — what does the word 'בארץ' tell us about the famine?", "options": ["It was only in that land", "It was all over the world", "It was only in Mitzrayim"], "kasha": "'בארץ' seems extra; which land is meant?", "answer": "The famine was in that land alone."}, {"q": "Why would Hashem bring a famine only on the land He had just sent Avram to?", "options": ["To test whether Avram would question Hashem", "To punish the Canaanites only", "To make Avram wealthy in Mitzrayim"], "kasha": "Hashem sent him there; now He forces him out?", "answer": "To test him: would he question Hashem, Who told him to go to Canaan and now forces him to leave it?"}]}, {"id": "12:11.1", "ch": 12, "v": 11, "n": 1, "dh": "הנה נא ידעתי", "pasuk_html": "וַיְהִ֕י כַּאֲשֶׁ֥ר הִקְרִ֖יב לָב֣וֹא מִצְרָ֑יְמָה וַיֹּ֙אמֶר֙ אֶל־שָׂרַ֣י אִשְׁתּ֔וֹ הִנֵּה־נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת־מַרְאֶ֖ה אָֽתְּ׃", "pasuk_en": "As he came near and was about to enter Egypt, he said to his wife Sarai, Behold, I now realize that you are a woman מתוך beautiful appearance.", "rashi_he": "מִדְרַש אַגָּדָה עַד עַכְשָׁו לֹא הִכִּיר בָּהּ מִתּוֹךְ צְנִיעוּת שֶׁבִּשְׁנֵיהֶם, וְעַכְשָׁו הִכִּיר בָּה עַל יְדֵי מַעֲשֶׂה. דָּבָר אַחֵר, מִנְהַג הָעוֹלָם שֶׁעַל יְדֵי טֹרַח הַדֶּרֶךְ אָדָם מִתְבַּזֶּה, וְזֹאת עָמְדָה בְּיָפְיָהּ. וּפְשׁוּטוֹ שֶׁל מִקְרָא הִנֵּה נָא הִגִּיעַ הַשָּׁעָה שֶׁיֵּשׁ לִדְאֹג עַל יָפְיֵךְ, יָדַעְתִּי זֶה יָמִים רַבִּים כִּי יְפַת מַרְאֶה אַתְּ, וְעַכְשָׁו אָנוּ בָאִים בֵּין אֲנָשִׁים שְׁחֹרִים וּמְכֹעָרִים, אֲחֵיהֶם שֶׁל כּוּשִׁים, וְלֹא הֻרְגְּלוּ בְאִשָּׁה יָפָה; וְדוֹמֶה לוֹ הִנֶּה נָּא אֲדֹנַי סוּרוּ נָא (בר' י\"ט):", "rashi_en": "The Aggadaic explanation is: Until now he had not been aware [מתוך her beauty] due to the modesty מתוך both מתוך them. But, now, he became aware מתוך her due to an event. Another explanation: It is usual that due to the hardship מתוך travel a person becomes unattractive, but she had remained with her beauty. But, the simple explanation מתוך this verse is, Behold I now realize [that] the time has come to be concerned over your beauty. I have known for a long time that you are beautiful. But, now we will be coming amongst black and repulsive people, brothers מתוך the Kushim, who are not accustomed to [seeing] a beautiful woman. An example similar to this: “See now my lords, please turn.”", "note": "", "points": [{"q": "'הנה נא ידעתי כי אשה יפת מראה את' — didn't Avram know this before? What does the Midrash Aggadah answer?", "options": ["Out מתוך modesty, he hadn't noticed until now", "He had never seen her before", "She had just become beautiful"], "kasha": "Avram was married to Sarai for years; why does he only 'now know' she's beautiful?", "answer": "Midrash Aggadah: until now he hadn't recognized her beauty because מתוך both their modesty; now he noticed through an incident."}, {"q": "Another explanation: what did Avram 'now' realize, after their long journey?", "options": ["She stayed beautiful despite the travel", "She was tired from the journey", "She was younger than he thought"], "kasha": "Why would the journey make him notice her beauty now?", "answer": "Usually the strain מתוך travel makes a person look worn, yet she kept her beauty."}, {"q": "What is the simple meaning (פשוטו) מתוך 'הנה נא ידעתי'?", "options": ["He always knew; now it was time to worry", "He had just discovered her beauty", "He was praising her to cheer her up"], "kasha": "Both Midrashim assume he just found out; what do the words plainly mean?", "answer": "Now the time has come to worry about your beauty. I've known for long that you're beautiful, but now we're coming among dark, unattractive people, brothers מתוך the Kushim, unused to a beautiful woman."}, {"q": "In the simple meaning, which posuk does רש״י say is similar to 'הנה נא' here?", "options": ["'הנה נא אדני סורו נא' (Lot to the malachim)", "'קח נא את בנך'", "'שא נא עיניך'"], "kasha": "Is 'הנה נא' used this way anywhere else?", "answer": "It is similar to 'הנה נא אדני סורו נא' (בראשית 19)."}]}, {"id": "12:13.1", "ch": 12, "v": 13, "n": 1, "dh": "למען ייטב לי בעבורך", "pasuk_html": "אִמְרִי־נָ֖א אֲחֹ֣תִי אָ֑תְּ לְמַ֙עַן֙ יִֽיטַב־לִ֣י בַעֲבוּרֵ֔ךְ וְחָיְתָ֥ה נַפְשִׁ֖י בִּגְלָלֵֽךְ׃", "pasuk_en": "Please [Now] say [therefore] that you are my sister, so that it will go well with me for your sake, and my life will be spared because מתוך you [through your words].", "rashi_he": "יִתְּנוּ לִי מַתָּנוֹת:", "rashi_en": "So that they give me gifts.", "note": "", "points": [{"q": "'למען ייטב לי בעבורך' — how would it 'go well' for Avram?", "options": ["They would give him gifts", "They would let him rule", "They would give him land"], "kasha": "What does 'it will go well with me' mean specifically?", "answer": "They would give him gifts."}]}, {"id": "12:14.1", "ch": 12, "v": 14, "n": 1, "dh": "ויהי כבוא אברם מצרימה", "pasuk_html": "<mark>וַיְהִ֕י כְּב֥וֹא אַבְרָ֖ם מִצְרָ֑יְמָה</mark> וַיִּרְא֤וּ הַמִּצְרִים֙ אֶת־הָ֣אִשָּׁ֔ה כִּֽי־יָפָ֥ה הִ֖וא מְאֹֽד׃", "pasuk_en": "And it was when Avram was entering Egypt, that the Egyptians beheld the woman, because she was very beautiful.", "rashi_he": "הָיָה לוֹ לוֹמַר כְּבוֹאָם מִצְרַיְמָה? אֶלָּא לִמֵּד שֶׁהִטְמִין אוֹתָהּ בְּתֵבָה, וְעַל יְדֵי שֶׁתָּבְעוּ אֶת הַמֶּכֶס פָּתְחוּ וְרָאוּ אוֹתָהּ:", "rashi_en": "It should have said, “When they came to Egypt.” But, this teaches that he hid her in a box and when they demanded the customs taxes they opened it and saw her.", "note": "", "points": [{"q": "'כבוא אברם מצרימה' — why only Avram coming? Wasn't Sarai there too?", "options": ["He hid her in a box", "She arrived later on her own", "She stayed behind in Canaan"], "kasha": "It should say 'when they came'; why mention only Avram?", "answer": "He hid her in a box. When the customs מתוךficers demanded duty, they opened it and saw her."}]}, {"id": "12:15.1", "ch": 12, "v": 15, "n": 1, "dh": "ויהללו אותה אל פרעה", "pasuk_html": "וַיִּרְא֤וּ אֹתָהּ֙ שָׂרֵ֣י פַרְעֹ֔ה וַיְהַֽלְל֥וּ אֹתָ֖הּ אֶל־פַּרְעֹ֑ה וַתֻּקַּ֥ח הָאִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה׃", "pasuk_en": "Pharaoh’s מתוךficials saw her and praised her to Pharaoh. The woman was taken to Pharaoh’s house.", "rashi_he": "הִלְּלוּהָ בֵינֵיהֶם לוֹמַר הֲגוּנָה זוֹ לַמֶּלֶךְ:", "rashi_en": "They praised her among themselves saying, “This [woman] is fit for the king.”", "note": "", "points": [{"q": "'ויהללו אותה אל פרעה' — what did the מתוךficers' praise consist מתוך?", "options": ["Saying among themselves she's fit for the king", "Singing songs about her to Pharaoh", "Writing Pharaoh a letter about her"], "kasha": "What does it mean they praised her 'to' Pharaoh?", "answer": "They praised her among themselves, saying: 'This woman is fit for the king.'"}]}, {"id": "12:16.1", "ch": 12, "v": 16, "n": 1, "dh": "ולאברם היטיב", "pasuk_html": "<mark>וּלְאַבְרָ֥ם הֵיטִ֖יב</mark> בַּעֲבוּרָ֑הּ וַֽיְהִי־ל֤וֹ צֹאן־וּבָקָר֙ וַחֲמֹרִ֔ים וַעֲבָדִים֙ וּשְׁפָחֹ֔ת וַאֲתֹנֹ֖ת וּגְמַלִּֽים׃", "pasuk_en": "He treated Avram well for her sake. He thus acquired sheep, oxen, donkeys, male and female slaves, female donkeys and camels.", "rashi_he": "פַּרְעֹה <b>בעבורה</b>:", "rashi_en": "[“he” refers to] Pharaoh, <b>for her sake.</b>", "note": "", "points": [{"q": "'ולאברם היטיב' — who treated Avram well?", "options": ["Pharaoh", "The Egyptian מתוךficers", "Sarai"], "kasha": "The posuk doesn't say who treated Avram well.", "answer": "Pharaoh treated him well, for Sarai's sake."}]}, {"id": "12:17.1", "ch": 12, "v": 17, "n": 1, "dh": "וינגע ה' וגו'", "pasuk_html": "וַיְנַגַּ֨ע יְהֹוָ֧ה&thinsp;׀&thinsp;אֶת־פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְאֶת־בֵּית֑וֹ עַל־דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׃", "pasuk_en": "Adonoy afflicted Pharaoh with severe plagues [brought severe plagues upon Pharaoh], and also his household, because מתוך Sarai, Avram’s wife.", "rashi_he": "בְּמַכַּת רָאתָן לָקָה, שֶׁהַתַּשְׁמִישׁ קָשֶׁה לוֹ (בראשית רבה):", "rashi_en": "He was smitten with a kind מתוך skin disease for which marital relations are harmful.", "note": "", "points": [{"q": "'וינגע ה' את פרעה נגעים גדלים' — what kind מתוך plague struck Pharaoh?", "options": ["A skin disease that prevents marital relations", "Blindness", "A deadly fever"], "kasha": "The posuk doesn't say what the 'plagues' were.", "answer": "A skin disease (ראתן) for which marital relations are harmful (Midrash)."}]}, {"id": "12:17.2", "ch": 12, "v": 17, "n": 2, "dh": "ואת ביתו", "pasuk_html": "וַיְנַגַּ֨ע יְהֹוָ֧ה&thinsp;׀&thinsp;אֶת־פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְאֶת־בֵּית֑וֹ עַל־דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׃", "pasuk_en": "Adonoy afflicted Pharaoh with severe plagues [brought severe plagues upon Pharaoh], and also his household, because מתוך Sarai, Avram’s wife.", "rashi_he": "(כְּתַרְגּוּמוֹ וְעַל אֱנַשׁ בֵּיתֵהּ וּמִדְרָשׁוֹ לְרַבּוֹת כֹּתָלָיו וְעַמּוּדָיו וְכֵּלָיו בְּרַשִׁ\"י יָשָׁן):", "rashi_en": "[This should be interpreted] as its Targum: “And on the people מתוך his house.” Its Midrashic interpretation [is that]: [וְאֶת בֵּיתוֹ] includes its walls, pillars and utensils.", "note": "", "points": [{"q": "'ואת ביתו' — Pharaoh's 'house' was also struck. According to the Targum, what does 'ביתו' mean?", "options": ["The people מתוך his household", "The building itself", "His land and fields"], "kasha": "'ביתו' can mean his house or his household; which is it?", "answer": "As the Targum translates: the people מתוך his house."}, {"q": "What does the Midrash learn from the word 'ואת ביתו'?", "options": ["Even walls, pillars and utensils were struck", "Only his servants were struck", "His house burned down"], "kasha": "Does 'ביתו' include more than the people?", "answer": "It includes even the walls, pillars and utensils מתוך his house."}]}, {"id": "12:17.3", "ch": 12, "v": 17, "n": 3, "dh": "על דבר שרי", "pasuk_html": "וַיְנַגַּ֨ע יְהֹוָ֧ה&thinsp;׀&thinsp;אֶת־פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְאֶת־בֵּית֑וֹ עַל־דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׃", "pasuk_en": "Adonoy afflicted Pharaoh with severe plagues [brought severe plagues upon Pharaoh], and also his household, because מתוך Sarai, Avram’s wife.", "rashi_he": "עַל פִּי דִּבּוּרָהּ; אוֹמֶרֶת לַמַּלְאָךְ הַךְ, וְהוּא מַכֶּה;", "rashi_en": "[Meaning:] according to her words, she tells the angel, “Strike [him]!” and he strikes [him].", "note": "", "points": [{"q": "'על דבר שרי' — what does 'דבר' mean here?", "options": ["By her word: she told the angel to strike", "She spoke to Pharaoh and warned him", "She prayed for Pharaoh to recover"], "kasha": "'על דבר' is unclear: in what way were the plagues 'about' Sarai?", "answer": "By her word: she told the angel 'Strike!' and he struck."}]}, {"id": "12:19.1", "ch": 12, "v": 19, "n": 1, "dh": "קח ולך", "pasuk_html": "לָמָ֤ה אָמַ֙רְתָּ֙ אֲחֹ֣תִי הִ֔וא וָאֶקַּ֥ח אֹתָ֛הּ לִ֖י לְאִשָּׁ֑ה וְעַתָּ֕ה הִנֵּ֥ה אִשְׁתְּךָ֖ <mark>קַ֥ח וָלֵֽךְ׃</mark>", "pasuk_en": "Why did you say, She is my sister, so that I should take her to myself for a wife? Now here is your wife, take [her] and go.", "rashi_he": "לֹא כַאֲבִימֶלֶךְ שֶׁאָמַר לוֹ הִנֵּה אַרְצִי לְפָנֶיךָ, אֶלָּא אָמַר לוֹ לֵךְ וְאַל תַּעֲמֹד, שֶׁהַמִּצְרִים שְׁטוּפֵי זִמָּה הֵם, שֶׁנֶּאֱמַר וְזִרְמַת סוּסִים זִרְמָתָם: (יחזקאל כ\"ג):", "rashi_en": "Unlike Avimelech who told him, “Here is my land before you.” But, [instead, Pharaoh] told him, “Go, do not remain here for the Egyptians are permeated with lewdness,” as it is said: “Their issue is the issue מתוך horses.”", "note": "", "points": [{"q": "Pharaoh says 'קח ולך' — take her and go. How was this different from Avimelech later?", "options": ["Avimelech invited him to stay; Pharaoh said leave", "Avimelech also sent him away", "Avimelech gave no gifts"], "kasha": "Why does Pharaoh tell him to leave, instead מתוך inviting him to stay?", "answer": "Unlike Avimelech, who told him 'my land is before you,' Pharaoh told him 'go, and don't stay here.'"}, {"q": "Why didn't Pharaoh want Avram and Sarai to remain in Mitzrayim?", "options": ["Egyptians are steeped in immorality", "Pharaoh feared Avram's army", "The famine there was worse"], "kasha": "What danger was there in staying?", "answer": "The Egyptians were steeped in immorality, as Yechezkel says: 'their issue is like the issue מתוך horses.'"}]}, {"id": "12:20.1", "ch": 12, "v": 20, "n": 1, "dh": "ויצו עליו", "pasuk_html": "<mark>וַיְצַ֥ו עָלָ֛יו</mark> פַּרְעֹ֖ה אֲנָשִׁ֑ים וַֽיְשַׁלְּח֥וּ אֹת֛וֹ וְאֶת־אִשְׁתּ֖וֹ וְאֶת־כׇּל־אֲשֶׁר־לֽוֹ׃", "pasuk_en": "Pharaoh assigned men to him and they escorted him and his wife and all that was his.", "rashi_he": "עַל אוֹדוֹתָיו, לְשַׁלְּחוֹ וּלְשָׁמְרוֹ:", "rashi_en": "[עָלָיו here means] concerning him, [i.e.,] to escort and protect him.", "note": "", "points": [{"q": "'ויצו עליו פרעה אנשים' — what does 'עליו' mean here?", "options": ["Concerning him: to escort and protect him", "Against him: to attack him", "Over him: to rule him"], "kasha": "'עליו' literally means 'upon him', which doesn't fit here.", "answer": "'Concerning him': Pharaoh commanded men about him, to escort and protect him."}]}, {"id": "12:20.2", "ch": 12, "v": 20, "n": 2, "dh": "וישלחו", "pasuk_html": "וַיְצַ֥ו עָלָ֛יו פַּרְעֹ֖ה אֲנָשִׁ֑ים <mark>וַֽיְשַׁלְּח֥וּ</mark> אֹת֛וֹ וְאֶת־אִשְׁתּ֖וֹ וְאֶת־כׇּל־אֲשֶׁר־לֽוֹ׃", "pasuk_en": "Pharaoh assigned men to him and they escorted him and his wife and all that was his.", "rashi_he": "כְּתַרְגּוּמוֹ וְאַלְוִיאוּ:", "rashi_en": "As the Targum translates: “They escorted him.”", "note": "", "points": [{"q": "'וישלחו אותו' — does this mean they expelled him?", "options": ["No, they escorted him", "Yes, they drove him out", "They sent him with a letter"], "kasha": "'וישלחו' could mean 'sent away'; what does it mean here?", "answer": "As the Targum translates (ואלויאו): they escorted him."}]}, {"id": "13:1.1", "ch": 13, "v": 1, "n": 1, "dh": "ויעל אברם וגו' הנגבה", "pasuk_html": "וַיַּ֩עַל֩ אַבְרָ֨ם מִמִּצְרַ֜יִם ה֠וּא וְאִשְׁתּ֧וֹ וְכׇל־אֲשֶׁר־ל֛וֹ וְל֥וֹט עִמּ֖וֹ הַנֶּֽגְבָּה׃", "pasuk_en": "Avram went up from Egypt; he, his wife, and all that he had, together with Lot into the south.", "rashi_he": "לָבֹא לִדְרוֹמָהּ שֶׁל אֶרֶץ יִשְֹרָאֵל, כְּמוֹ שֶׁאָמַר לְמַעְלָה הָלוֹךְ וְנָסוֹעַ הַנֶּגְבָּה, לְהַר הַמּוֹרִיָּה; וּמִכָּל מָקוֹם כְּשֶׁהוּא הוֹלֵךְ מִמִּצְרַיִם לְאֶרֶץ כְּנַעַן, מִדָּרוֹם לְצָפוֹן הוּא מְהַלֵּךְ, שֶׁאֶרֶץ מִצְרַיִם בִּדְרוֹמָהּ שֶׁל אֶרֶץ יִשְׂרָאֵל כְּמוֹ שֶׁמּוֹכִיחַ בַּמַּסָּעוֹת וּבִגְבוּלֵי הָאָרֶץ:", "rashi_en": "[Meaning:] to arrive at the south מתוך Eretz Yisrael, as it was stated above, “traveling steadily southward,” [meaning:] to Mount Moriah. Nevertheless, when one travels from Egypt to the Land מתוך Canaan, he travels from south to north, for Egypt is south מתוך Eretz Yisrael as can be shown by the “journeys” and at the boundaries מתוך Eretz Yisrael.", "note": "", "points": [{"q": "Avram goes up from Mitzrayim 'הנגבה' — southward. Where exactly was he heading?", "options": ["The south מתוך Eretz Yisroel, toward Har HaMoriah", "Back down to Mitzrayim", "The far north, near Charan"], "kasha": "Going from Mitzrayim to Canaan is travelling north, yet the posuk says 'הנגבה' (southward).", "answer": "'הנגבה' means to arrive at the southern part מתוך Eretz Yisroel — toward Har HaMoriah, as said earlier 'הלוך ונסוע הנגבה'."}, {"q": "Even heading to Eretz Yisroel's south, which direction was Avram actually travelling from Mitzrayim?", "options": ["South to north", "North to south", "West to east"], "kasha": "If his goal is called 'south,' we need to know which way the trip itself went.", "answer": "Still south to north, since Mitzrayim lies south מתוך Eretz Yisroel — as shown by the journeys (מסעות) and the borders מתוך the land."}]}, {"id": "13:2.1", "ch": 13, "v": 2, "n": 1, "dh": "כבד מאד", "pasuk_html": "וְאַבְרָ֖ם <mark>כָּבֵ֣ד מְאֹ֑ד</mark> בַּמִּקְנֶ֕ה בַּכֶּ֖סֶף וּבַזָּהָֽב׃", "pasuk_en": "Avram was very wealthy in livestock, silver and gold.", "rashi_he": "טָעוּן מַשָּׂאוֹת:", "rashi_en": "[I.e.,] he was laden with baggage.", "note": "", "points": [{"q": "Avram was 'כבד מאד' — literally 'very heavy.' What does 'heavy' mean here?", "options": ["Loaded down with baggage", "He was physically overweight", "He was slow and tired"], "kasha": "'כבד' means heavy — why describe a rich man as heavy?", "answer": "He was laden with loads — weighed down by all the possessions he carried."}]}, {"id": "13:3.1", "ch": 13, "v": 3, "n": 1, "dh": "וילך למסעיו", "pasuk_html": "<mark>וַיֵּ֙לֶךְ֙ לְמַסָּעָ֔יו</mark> מִנֶּ֖גֶב וְעַד־בֵּֽית־אֵ֑ל עַד־הַמָּק֗וֹם אֲשֶׁר־הָ֨יָה שָׁ֤ם אׇֽהֳלֹה֙ בַּתְּחִלָּ֔ה בֵּ֥ין בֵּֽית־אֵ֖ל וּבֵ֥ין הָעָֽי׃", "pasuk_en": "He continued on his travels from the south to Beis-Eil, until the place where he originally had [set up] his tent, between Beis-Eil and Ai.", "rashi_he": "כְּשֶׁחָזַר מִמִּצְרַיִם לְאֶרֶץ כְּנַעַן הָיָה הוֹלֵךְ וְלָן בָּאַכְסַנְיוֹת שֶׁלָּן בָּהֶם בַּהֲלִיכָתוֹ לְמִצְרַיִם, לִמֶּדְךָ דֶּרֶך אֶרֶץ, שֶׁלֹּא יְשַׁנֶּה אָדָם מֵאַכְסַנְיָא שֶׁלּוֹ. דָּבָר אַחֵר בַּחֲזָרָתוֹ פָּרַע הַקָּפוֹתָיו (בראשית רבה):", "rashi_en": "[This indicates] that when he returned from Egypt to the Land מתוך Canaan he went and lodged in those inns in which he had lodged on his way to Egypt. This teaches that good manners [require] that a person not change his place מתוך lodging. Another explanation: On his return trip he paid the debts he incurred.", "note": "", "points": [{"q": "'וילך למסעיו' — 'he went on his journeys.' What do 'his journeys' tell us about the trip home?", "options": ["He stayed at the same inns as on the way down", "He took a new, shorter road home", "He travelled only by night"], "kasha": "'למסעיו' — 'his journeys' — seems to point to specific, earlier journeys; why mention it?", "answer": "Returning from Mitzrayim, he lodged at the same inns he had used going down."}, {"q": "What lesson in derech eretz does רש״י learn from Avram reusing the same inns?", "options": ["A person shouldn't change his lodging place", "Always travel by the shortest route", "Never stay at an inn twice"], "kasha": "Why would the Torah bother telling us where Avram slept?", "answer": "It teaches derech eretz: a person should not switch from his regular lodging place."}, {"q": "רש״י מתוךfers another reading מתוך 'וילך למסעיו.' What did Avram do on the way back?", "options": ["He paid מתוךf the debts he had run up", "He collected money owed to him", "He built altars at each stop"], "kasha": "Going back along the same stops suggests he had unfinished business there.", "answer": "Another explanation (בראשית Rabbah): on his return trip he paid מתוךf the debts he had incurred on the way down."}]}, {"id": "13:3.2", "ch": 13, "v": 3, "n": 2, "dh": "מנגב", "pasuk_html": "וַיֵּ֙לֶךְ֙ לְמַסָּעָ֔יו <mark>מִנֶּ֖גֶב</mark> וְעַד־בֵּֽית־אֵ֑ל עַד־הַמָּק֗וֹם אֲשֶׁר־הָ֨יָה שָׁ֤ם אׇֽהֳלֹה֙ בַּתְּחִלָּ֔ה בֵּ֥ין בֵּֽית־אֵ֖ל וּבֵ֥ין הָעָֽי׃", "pasuk_en": "He continued on his travels from the south to Beis-Eil, until the place where he originally had [set up] his tent, between Beis-Eil and Ai.", "rashi_he": "אֶרֶץ מִצְרַיִם בִּדְרוֹמָהּ שֶׁל אֶרֶץ כְּנַעַן:", "rashi_en": "[Meaning] from Egypt [and it is called מִנֶּגֶב because] [it is] south מתוך the Land מתוך Canaan.", "note": "", "points": [{"q": "Avram travels 'מנגב' — 'from the south.' Which place is meant?", "options": ["Mitzrayim, which is south מתוך Canaan", "The southern desert מתוך Arabia", "The land מתוך the Pelishtim"], "kasha": "He was coming from Mitzrayim, so what is 'מנגב' referring to?", "answer": "Mitzrayim — it is called 'the south' because it lies south מתוך Canaan."}]}, {"id": "13:4.1", "ch": 13, "v": 4, "n": 1, "dh": "אשר עשה שם בראשנה", "pasuk_html": "אֶל־מְקוֹם֙ הַמִּזְבֵּ֔חַ אֲשֶׁר־עָ֥שָׂה שָׁ֖ם בָּרִאשֹׁנָ֑ה וַיִּקְרָ֥א שָׁ֛ם אַבְרָ֖ם בְּשֵׁ֥ם יְהֹוָֽה׃", "pasuk_en": "To the site מתוך the altar which he made there at first; and there Avram called [prayed] in the Name מתוך Adonoy.", "rashi_he": "וַאֲשֶׁר קָרָא שָׁם אַבְרָם בְּשֵׁם ה' וְגַם יֵשׁ לוֹמַר וַיִּקְרָא שָׁם עַכְשָׁו בְּשֵׁם ה':", "rashi_en": "And where “Avram called in the Name מתוך Hashem.” It can also be taken to mean, that “He now called there in the Name מתוך Hashem.”", "note": "", "points": [{"q": "'ויקרא שם אברם בשם ה'' — one reading ties this to the past. How?", "options": ["It's where Avram had called in Hashem's name before", "Avram called someone else to come there", "Avram renamed the place after Hashem"], "kasha": "It is unclear whether 'ויקרא שם' describes what he did originally or what he did now.", "answer": "It continues 'אשר עשה שם בראשנה': the place where he made the altar and where Avram had called in Hashem's name."}, {"q": "What is Rashi's second way מתוך reading 'ויקרא שם אברם בשם ה''?", "options": ["Now, on his return, he called in Hashem's name again", "He only built an altar but didn't pray", "Someone else called there in his place"], "kasha": "The first reading leaves the verb describing the past, though it could describe the present.", "answer": "One can also say it means he now called there in Hashem's name."}]}, {"id": "13:5.1", "ch": 13, "v": 5, "n": 1, "dh": "ההלך את אברם", "pasuk_html": "וְגַ֨ם־לְל֔וֹט הַהֹלֵ֖ךְ אֶת־אַבְרָ֑ם הָיָ֥ה צֹאן־וּבָקָ֖ר וְאֹהָלִֽים׃", "pasuk_en": "Lot who accompanied Avram also had sheep, cattle and tents.", "rashi_he": "מִי גָרַם שֶׁהָיָה לוֹ זֹאת? הֲלִיכָתוֹ עִם אַבְרָם:", "rashi_en": "What brought this about? The fact that he traveled with Avram.", "note": "", "points": [{"q": "Why does the posuk describe Lot as 'ההלך את אברם' — 'who went with Avram' — here?", "options": ["His wealth came from travelling with Avram", "To show Lot was Avram's servant", "To show Lot left Avram here"], "kasha": "We already know Lot went with Avram — why repeat it when telling us Lot's wealth?", "answer": "It explains what caused Lot's wealth: it came because he travelled with Avram."}]}, {"id": "13:6.1", "ch": 13, "v": 6, "n": 1, "dh": "ולא נשא אתם", "pasuk_html": "וְלֹא־נָשָׂ֥א אֹתָ֛ם הָאָ֖רֶץ לָשֶׁ֣בֶת יַחְדָּ֑ו כִּֽי־הָיָ֤ה רְכוּשָׁם֙ רָ֔ב וְלֹ֥א יָֽכְל֖וּ לָשֶׁ֥בֶת יַחְדָּֽו׃", "pasuk_en": "The land was unable to support them that they might dwell together, for their wealth was so great that they were unable to dwell together.", "rashi_he": "לֹא הָיְתָה יְכוֹלָה לְהַסְפִּיק מִרְעֶה לְמִקְנֵיהֶם, וְלָשׁוֹן קָצָר הוּא, וְצָרִיךְ לְהוֹסִיף עָלָיו, כְּמוֹ וְלֹא נָשָׂא אוֹתָם מִרְעֵה הָאָרֶץ, לְפִיכָךְ כָּתַב וְלֹא נָשָׂא בִּלְשׁוֹן זָכָר:", "rashi_en": "[Meaning] It could not provide [enough] pasture for their cattle. The phrase is abbreviated and an additional [word] is needed: “The pasture מתוך the land could not support them.” The text, therefore, reads וְלֹא נָשָׂא in the masculine form.", "note": "", "points": [{"q": "'ולא נשא אתם הארץ' — how could the land not 'carry' them?", "options": ["Its pasture couldn't feed their cattle", "The ground was too sמתוךt to walk on", "The local kings banned them"], "kasha": "Land can always hold people — what couldn't it 'carry'?", "answer": "The land couldn't provide enough pasture for their livestock."}, {"q": "'ארץ' is feminine, yet the verb 'נשא' is masculine. Why?", "options": ["The phrase is short for 'מרעה הארץ', masculine", "Its subject is Hashem, not the land", "It refers to Avram, not the land"], "kasha": "'ארץ' is feminine but the verb 'נשא' is masculine.", "answer": "It's an abbreviated phrase; add a word: 'ולא נשא אותם מרעה הארץ' — the land's pasture. So 'נשא' is masculine."}]}, {"id": "13:7.1", "ch": 13, "v": 7, "n": 1, "dh": "ויהי ריב", "pasuk_html": "וַֽיְהִי־רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה־אַבְרָ֔ם וּבֵ֖ין רֹעֵ֣י מִקְנֵה־ל֑וֹט וְהַֽכְּנַעֲנִי֙ וְהַפְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּאָֽרֶץ׃", "pasuk_en": "There was a quarrel between the herdsmen מתוך Avram’s flocks and the herdsmen מתוך Lot’s flocks. The Canaanites and the Perizzites were then living in the land.", "rashi_he": "לְפִי שְׁהָיוּ רוֹעִים שֶׁל לוֹט רְשָׁעִים וּמַרְעִים בְּהֶמְתָּם בִּשְׂדוֹת אֲחֵרִים, וְרוֹעֵי אַבְרָם מוֹכִיחִים אוֹתָם עַל הַגֶּזֶל, וְהֵם אוֹמְרִים נִתְּנָה הָאָרֶץ לְאַבְרָם, וְלוֹ אֵין יוֹרֵשׁ, וְלוֹט יוֹרְשׁוֹ, וְאֵין זֶה גֶּזֶל, וְהַכָּתוּב אוֹמֵר וְהַכְּנַעֲנִי וְהַפְּרִזִּי אָז יֹשֵׁב בָּאָרֶץ, וְלֹא זָכָה בָהּ אַבְרָם עֲדַיִן (ב\"):", "rashi_en": "Because Lot’s shepherds were wicked and grazed their animals in others’ fields. [When] Avram’s shepherds admonished them for [committing] robbery, they responded: “The land was given to Avram who has no heir. Lot, his nephew, is his heir and, [therefore,] this does not constitute robbery.” But, the verse states: “The Canaanites and Perizzites were then living in the land,” so that Avram did not yet possess it.", "note": "", "points": [{"q": "There was a 'ריב' between the shepherds. What started it?", "options": ["Lot's shepherds grazed in others' fields; Avram's rebuked them", "They fought over water wells", "They argued over whose flock was larger"], "kasha": "The posuk doesn't say what the quarrel was about.", "answer": "Lot's shepherds were wicked and grazed their animals in other people's fields. Avram's shepherds rebuked them for stealing."}, {"q": "How did Lot's shepherds defend grazing in others' fields?", "options": ["The land was given to childless Avram; Lot is his heir", "The owners had given them permission", "The fields were ownerless wilderness"], "kasha": "Lot's shepherds needed some justification for what looked like robbery.", "answer": "They said: the land was given to Avram, he has no heir, Lot will inherit him — so this isn't robbery."}, {"q": "Why does the posuk add 'והכנעני והפרזי אז ישב בארץ' here?", "options": ["To refute them: Avram didn't own the land yet", "To explain why there was no pasture", "To show the Canaanites joined the fight"], "kasha": "Mentioning the Canaanites in the middle מתוך the shepherds' quarrel seems out מתוך place.", "answer": "It answers their claim: the Canaanites and Perizzites still lived in the land, so Avram had not yet acquired it."}]}, {"id": "13:8.1", "ch": 13, "v": 8, "n": 1, "dh": "אנשים אחים", "pasuk_html": "וַיֹּ֨אמֶר אַבְרָ֜ם אֶל־ל֗וֹט אַל־נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣י וּבֵינֶ֔ךָ וּבֵ֥ין רֹעַ֖י וּבֵ֣ין רֹעֶ֑יךָ כִּֽי־<mark>אֲנָשִׁ֥ים אַחִ֖ים</mark> אֲנָֽחְנוּ׃", "pasuk_en": "Avram said to Lot: Please [Now], let there not be strife between me and you, and between my herdsmen and your herdsmen, for we are kinsmen.", "rashi_he": "קְרוֹבִים, וּמִדְרַשׁ אַגָּדָה דּוֹמִין בִּקְלַסְתֵּר פָּנִים:", "rashi_en": "[Here meaning:] relatives. The Midrashic explanation is: they had similar facial features.", "note": "", "points": [{"q": "Avram says 'אנשים אחים אנחנו' — 'we are brothers.' But Lot was his nephew. What does it mean?", "options": ["We are relatives", "We are partners in business", "We share the same parents"], "kasha": "Lot was Avram's nephew, not his brother.", "answer": "'אחים' here means relatives."}, {"q": "How does the Midrash explain 'אנשים אחים'?", "options": ["They looked alike in their facial features", "They were equally נכוןeous", "They were born in the same year"], "kasha": "The Midrash reads 'אחים' more literally than just 'relatives'.", "answer": "The Midrash Aggadah says they resembled each other in their facial appearance."}]}, {"id": "13:9.1", "ch": 13, "v": 9, "n": 1, "dh": "אם השמאל ואימנה", "pasuk_html": "הֲלֹ֤א כׇל־הָאָ֙רֶץ֙ לְפָנֶ֔יךָ הִפָּ֥רֶד נָ֖א מֵעָלָ֑י אִם־הַשְּׂמֹ֣אל וְאֵימִ֔נָה וְאִם־הַיָּמִ֖ין וְאַשְׂמְאִֽילָה׃", "pasuk_en": "Is not all the land before you? Please [Now] separate from me, if [you go] to the left [north], I [will go] to the נכון [south], and if [you go] to the נכון [south], I [will go] to the left [north].", "rashi_he": "בְּכָל אֲשֶׁר תֵּשֵׁב, לֹא אֶתְרַחֵק מִמְּךָ וְאֶעֱמֹד לְךָ לְמָגֵן וּלְעֵזֶר, וְסוֹף דָּבָר הֻצְרַךְ לוֹ, שְׁנֶּאֱמַר וַיִּשְׁמַע אַבְרָם כִּי נִשְׁבָּה אָחִיו וְגוֹ':", "rashi_en": "[Meaning:] wherever you may settle I will not go far from you and I will stand by you [to serve] as a shield and as a help. In the end he, indeed, needed him as it is said, “When Avram heard that his kinsman was taken captive.”", "note": "", "points": [{"q": "Avram tells Lot to separate, then says 'אם השמאל ואימנה.' What is he promising?", "options": ["Wherever you settle, I'll stay near to protect you", "I'll go as far from you as possible", "I'll take whatever land you reject"], "kasha": "If they're separating, why does Avram detail exactly where he'll go relative to Lot?", "answer": "Wherever Lot settles, Avram won't go far from him and will stand by him as a shield and a help."}, {"q": "Did Lot ever actually need Avram's protection? Which posuk shows it?", "options": ["Yes — 'וישמע אברם כי נשבה אחיו'", "No, Lot never needed him again", "Yes — when Lot quarreled with Avram's shepherds"], "kasha": "Why make a point מתוך a promise מתוך protection unless it later mattered?", "answer": "In the end Lot did need him, as it says: 'When Avram heard that his kinsman was taken captive.'"}]}, {"id": "13:9.2", "ch": 13, "v": 9, "n": 2, "dh": "ואימנה", "pasuk_html": "הֲלֹ֤א כׇל־הָאָ֙רֶץ֙ לְפָנֶ֔יךָ הִפָּ֥רֶד נָ֖א מֵעָלָ֑י אִם־הַשְּׂמֹ֣אל <mark>וְאֵימִ֔נָה</mark> וְאִם־הַיָּמִ֖ין וְאַשְׂמְאִֽילָה׃", "pasuk_en": "Is not all the land before you? Please [Now] separate from me, if [you go] to the left [north], I [will go] to the נכון [south], and if [you go] to the נכון [south], I [will go] to the left [north].", "rashi_he": "אַיְמִין אֶת עַצְמִי, כְּמוֹ וְאַשְׂמְאִילָה אַשְׂמְאִיל אֶת עַצְמִי. וְאִם תֹּאמַר הָיָה לוֹ לִנָּקֵד וְאַיְמִינָה, כָּךְ מָצִינוּ בְּמָקוֹם אַחֵר אִם יֵשׁ לְהֵמִין (שמואל ב י\"ד) וְאֵין נָקוּד לְהַיְמִין:", "rashi_en": "[Meaning:] “I will direct myself towards the נכון,” just as וְאַשְׂמְאִילָה [means] “I will direct myself towards the left.” If you may ask that it should have been vocalized וְאַיְמִינָה [you may be answered that] we find similarly in another place [in Scripture]: “Can one direct himself to the נכון?” and it is not vocalized לְהַיְמִין.", "note": "", "points": [{"q": "What does the unusual word 'ואימנה' mean?", "options": ["I'll turn myself to the נכון", "I will believe", "I'll stay where I am"], "kasha": "'ואימנה' is an unusual form — what does it mean?", "answer": "'I'll direct myself to the נכון,' just as 'ואשמאילה' means 'I'll direct myself to the left.'"}, {"q": "Shouldn't it be vowelled 'ואַימינה'? How does רש״י defend the vowelling 'ואֵימנה'?", "options": ["'להמין' in Shmuel II is vowelled the same way", "It's a copying mistake in the posuk", "It's a different word entirely"], "kasha": "One would expect the vowelling 'ואַימינה'.", "answer": "We find the same elsewhere: 'אם יש להמין' (Shmuel II 14), which is not vowelled 'להַימין'."}]}, {"id": "13:10.1", "ch": 13, "v": 10, "n": 1, "dh": "כי כלה משקה", "pasuk_html": "וַיִּשָּׂא־ל֣וֹט אֶת־עֵינָ֗יו וַיַּרְא֙ אֶת־כׇּל־כִּכַּ֣ר הַיַּרְדֵּ֔ן <mark>כִּ֥י כֻלָּ֖הּ מַשְׁקֶ֑ה</mark> לִפְנֵ֣י&thinsp;׀ שַׁחֵ֣ת יְהֹוָ֗ה אֶת־סְדֹם֙ וְאֶת־עֲמֹרָ֔ה כְּגַן־יְהֹוָה֙ כְּאֶ֣רֶץ מִצְרַ֔יִם בֹּאֲכָ֖ה צֹֽעַר׃", "pasuk_en": "Lot raised his eyes and saw the entire Jordan Plain, that it was [an] abundantly watered [place]; before Adonoy destroyed Sedom and Amorah, it was like Adonoy’s garden, like the land מתוך Egypt, going towards Zoar.", "rashi_he": "אֶרֶץ נַחֲלֵי מַיִם:", "rashi_en": "A land מתוך water streams.", "note": "", "points": [{"q": "Lot saw the Jordan plain 'כי כלה משקה' — 'all מתוך it watered.' What kind מתוך land is this?", "options": ["A land מתוך flowing streams", "A land flooded and swampy", "A land with heavy rainfall only"], "kasha": "'משקה' is an unclear description — what made it 'watered'?", "answer": "It was a land מתוך streams מתוך water."}]}, {"id": "13:10.2", "ch": 13, "v": 10, "n": 2, "dh": "לפני שחת ה' את סדום ואת עמרה", "pasuk_html": "וַיִּשָּׂא־ל֣וֹט אֶת־עֵינָ֗יו וַיַּרְא֙ אֶת־כׇּל־כִּכַּ֣ר הַיַּרְדֵּ֔ן כִּ֥י כֻלָּ֖הּ מַשְׁקֶ֑ה לִפְנֵ֣י&thinsp;׀ שַׁחֵ֣ת יְהֹוָ֗ה אֶת־סְדֹם֙ וְאֶת־עֲמֹרָ֔ה כְּגַן־יְהֹוָה֙ כְּאֶ֣רֶץ מִצְרַ֔יִם בֹּאֲכָ֖ה צֹֽעַר׃", "pasuk_en": "Lot raised his eyes and saw the entire Jordan Plain, that it was [an] abundantly watered [place]; before Adonoy destroyed Sedom and Amorah, it was like Adonoy’s garden, like the land מתוך Egypt, going towards Zoar.", "rashi_he": "הָיָה אוֹתוֹ מִישׁוֹר:", "rashi_en": "That plain was …", "note": "", "points": [{"q": "The phrase 'לפני שחת ה' את סדם' sits mid-posuk. What does it connect to?", "options": ["Before Sedom's destruction, the plain was like Hashem's garden", "Sedom was destroyed before Lot arrived", "Avram prayed before the destruction"], "kasha": "The phrase seems out מתוך place — what was 'before Hashem destroyed Sedom'?", "answer": "It goes with what follows: before Hashem destroyed Sedom and Amorah, that plain was like Hashem's garden, like Mitzrayim."}]}, {"id": "13:10.3", "ch": 13, "v": 10, "n": 3, "dh": "כגן ה'", "pasuk_html": "וַיִּשָּׂא־ל֣וֹט אֶת־עֵינָ֗יו וַיַּרְא֙ אֶת־כׇּל־כִּכַּ֣ר הַיַּרְדֵּ֔ן כִּ֥י כֻלָּ֖הּ מַשְׁקֶ֑ה לִפְנֵ֣י&thinsp;׀ שַׁחֵ֣ת יְהֹוָ֗ה אֶת־סְדֹם֙ וְאֶת־עֲמֹרָ֔ה כְּגַן־יְהֹוָה֙ כְּאֶ֣רֶץ מִצְרַ֔יִם בֹּאֲכָ֖ה צֹֽעַר׃", "pasuk_en": "Lot raised his eyes and saw the entire Jordan Plain, that it was [an] abundantly watered [place]; before Adonoy destroyed Sedom and Amorah, it was like Adonoy’s garden, like the land מתוך Egypt, going towards Zoar.", "rashi_he": "לָאִילָנוֹת:", "rashi_en": "for [the growing מתוך] trees …", "note": "", "points": [{"q": "The plain was 'כגן ה'' — like Hashem's garden. In what way?", "options": ["For growing trees", "For its beautiful flowers", "For its holiness"], "kasha": "Comparing it to both Hashem's garden and Mitzrayim seems repetitive — each must refer to something different.", "answer": "Like Hashem's garden for trees."}]}, {"id": "13:10.4", "ch": 13, "v": 10, "n": 4, "dh": "כארץ מצרים", "pasuk_html": "וַיִּשָּׂא־ל֣וֹט אֶת־עֵינָ֗יו וַיַּרְא֙ אֶת־כׇּל־כִּכַּ֣ר הַיַּרְדֵּ֔ן כִּ֥י כֻלָּ֖הּ מַשְׁקֶ֑ה לִפְנֵ֣י&thinsp;׀ שַׁחֵ֣ת יְהֹוָ֗ה אֶת־סְדֹם֙ וְאֶת־עֲמֹרָ֔ה כְּגַן־יְהֹוָה֙ <mark>כְּאֶ֣רֶץ מִצְרַ֔יִם</mark> בֹּאֲכָ֖ה צֹֽעַר׃", "pasuk_en": "Lot raised his eyes and saw the entire Jordan Plain, that it was [an] abundantly watered [place]; before Adonoy destroyed Sedom and Amorah, it was like Adonoy’s garden, like the land מתוך Egypt, going towards Zoar.", "rashi_he": "לַזְּרָעִים (בראשית רבה):", "rashi_en": "for [growing] grain and vegetables.", "note": "", "points": [{"q": "The plain was also 'כארץ מצרים' — like Mitzrayim. In what way?", "options": ["For growing seed crops", "For its great cities", "For its hot climate"], "kasha": "After 'like Hashem's garden', why also compare it to Mitzrayim?", "answer": "Like Mitzrayim for seed crops (בראשית Rabbah)."}]}, {"id": "13:10.5", "ch": 13, "v": 10, "n": 5, "dh": "באכה צער", "pasuk_html": "וַיִּשָּׂא־ל֣וֹט אֶת־עֵינָ֗יו וַיַּרְא֙ אֶת־כׇּל־כִּכַּ֣ר הַיַּרְדֵּ֔ן כִּ֥י כֻלָּ֖הּ מַשְׁקֶ֑ה לִפְנֵ֣י&thinsp;׀ שַׁחֵ֣ת יְהֹוָ֗ה אֶת־סְדֹם֙ וְאֶת־עֲמֹרָ֔ה כְּגַן־יְהֹוָה֙ כְּאֶ֣רֶץ מִצְרַ֔יִם <mark>בֹּאֲכָ֖ה צֹֽעַר׃</mark>", "pasuk_en": "Lot raised his eyes and saw the entire Jordan Plain, that it was [an] abundantly watered [place]; before Adonoy destroyed Sedom and Amorah, it was like Adonoy’s garden, like the land מתוך Egypt, going towards Zoar.", "rashi_he": "עַד צֹעַר. וּמִדְרַשׁ אַגָּדָה דוֹרְשָׁהּ לִגְנַאי, עַל שֶׁהָיוּ שְׁטוּפֵי זִמָּה בָּחַר לוֹ לוֹט בִּשְׁכוּנָתָם:", "rashi_en": "[Meaning:] until Zoar. The Midrashic interpretation explains it disparagingly. It was because they were permeated with immorality that Lot chose their locality.", "note": "", "points": [{"q": "'באכה צער' — 'as you come to Tzoar.' What does it mean simply?", "options": ["The plain stretched until Tzoar", "Lot walked to Tzoar in tears", "Tzoar was the best-watered city"], "kasha": "The phrase is unclear — what does 'as you come to Tzoar' add?", "answer": "It means 'until Tzoar.'"}, {"q": "The Midrash reads this description מתוך Lot's choice negatively. Why did Lot choose there?", "options": ["Because its people were steeped in immorality", "Because he wanted to convert them", "Because it was far from idol worship"], "kasha": "The posuk dwells on why Lot found this area attractive.", "answer": "The Midrash Aggadah reads it disparagingly: Lot chose to live in their neighborhood because they were steeped in immorality."}]}, {"id": "13:11.1", "ch": 13, "v": 11, "n": 1, "dh": "ככר", "pasuk_html": "וַיִּבְחַר־ל֣וֹ ל֗וֹט אֵ֚ת כׇּל־<mark>כִּכַּ֣ר</mark> הַיַּרְדֵּ֔ן וַיִּסַּ֥ע ל֖וֹט מִקֶּ֑דֶם וַיִּפָּ֣רְד֔וּ אִ֖ישׁ מֵעַ֥ל אָחִֽיו׃", "pasuk_en": "Lot chose for himself the entire Jordan Plain; Lot journeyed from the east [before], and they separated one from another.", "rashi_he": "מִישׁוֹר, כְּתַרְגּוּמוֹ:", "rashi_en": "[Means] “plain” as the Targum translates.", "note": "", "points": [{"q": "Lot chose 'כל ככר הירדן.' What does 'ככר' mean?", "options": ["A plain", "A round loaf", "A mountain range"], "kasha": "'ככר' is an unusual word — what does it mean here?", "answer": "A plain, as the Targum translates it."}]}, {"id": "13:11.2", "ch": 13, "v": 11, "n": 2, "dh": "מקדם", "pasuk_html": "וַיִּבְחַר־ל֣וֹ ל֗וֹט אֵ֚ת כׇּל־כִּכַּ֣ר הַיַּרְדֵּ֔ן וַיִּסַּ֥ע ל֖וֹט <mark>מִקֶּ֑דֶם</mark> וַיִּפָּ֣רְד֔וּ אִ֖ישׁ מֵעַ֥ל אָחִֽיו׃", "pasuk_en": "Lot chose for himself the entire Jordan Plain; Lot journeyed from the east [before], and they separated one from another.", "rashi_he": "נָסַע מֵאֵצֶל אַבְרָם וְהָלַך לוֹ לְמַעֲרָבוֹ שֶׁל אַבְרָם; נִמְצָא נוֹסֵעַ מִמִּזְרָח לְמַעֲרָב. וּמִדְרַשׁ אַגָּדָה הִסִּיעַ עַצְמוֹ מִקַּדְמוֹנוֹ שֶׁל עוֹלָם; אָמַר אִי אֶפְשִׁי לֹא בְּאַבְרָם וְלֹא בֵאלֹהָיו:", "rashi_en": "He departed from Avram and traveled to the west מתוך Avram, consequently traveling from east to west. The Midrashic interpretation is; he removed himself from the One Who precedes the world, saying, “I want neither Avram nor his God.”", "note": "", "points": [{"q": "'ויסע לוט מקדם' — Lot journeyed 'from the east.' Simply, which way did he go?", "options": ["West מתוך Avram — from east to west", "East מתוך Avram — from west to east", "North, toward Charan"], "kasha": "'מקדם' is unclear: from what east?", "answer": "He left Avram and went to Avram's west, so he travelled from east to west."}, {"q": "How does the Midrash read 'מקדם' — whom did Lot really leave?", "options": ["Hashem, the 'קדמון' מתוך the world", "The people מתוך the east", "His wife's family"], "kasha": "Why would the posuk stress the direction Lot left from?", "answer": "The Midrash: he removed himself from the 'קדמון' (the One Who preceded the world), saying, 'I want neither Avram nor his G-d.'"}]}, {"id": "13:12.1", "ch": 13, "v": 12, "n": 1, "dh": "ויאהל", "pasuk_html": "אַבְרָ֖ם יָשַׁ֣ב בְּאֶֽרֶץ־כְּנָ֑עַן וְל֗וֹט יָשַׁב֙ בְּעָרֵ֣י הַכִּכָּ֔ר <mark>וַיֶּאֱהַ֖ל</mark> עַד־סְדֹֽם׃", "pasuk_en": "Avram lived in the land מתוך Canaan; and Lot lived in the cities מתוך the Plain, setting up his tents as far as Sedom.", "rashi_he": "נָטָה אֳהָלִים לְרוֹעָיו וּלְמִקְנֵהוּ עַד סְדוֹם:", "rashi_en": "[Meaning:] he pitched tents for his shepherds and for his cattle as far as Sedom.", "note": "", "points": [{"q": "Lot lived in the plain's cities, yet 'ויאהל עד סדם' — pitched tents up to Sedom. Why both?", "options": ["Tents for his shepherds and cattle, reaching Sedom", "He kept moving from city to city", "He lived in a tent inside Sedom"], "kasha": "If Lot lived in cities, what were these tents for?", "answer": "He pitched tents for his shepherds and cattle, stretching as far as Sedom."}]}, {"id": "13:13.1", "ch": 13, "v": 13, "n": 1, "dh": "ואנשי סדום רעים", "pasuk_html": "וְאַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְחַטָּאִ֑ים לַיהֹוָ֖ה מְאֹֽד׃", "pasuk_en": "The people מתוך Sedom were wicked [with their property] and sinful [with their bodies] towards [before] Adonoy, exceedingly.", "rashi_he": "וְאַף עַל פִּי כֵן לֹא נִמְנַע לוֹט מִלִּשְׁכֹּן עִמָּהֶם. וְרַבּוֹתֵינוּ לָמְדוּ מִכָּאן (יומא ל\"ח) וְשֵׁם רְשָׁעִים יִרְקָב (משלי י'):", "rashi_en": "And yet Lot did not refrain from residing with them. Our Sages learned from here: “The names מתוך the wicked shall rot.”", "note": "", "points": [{"q": "Why tell us here, נכון after Lot moves there, that 'אנשי סדם רעים'?", "options": ["Lot settled there anyway, despite their wickedness", "To show Lot didn't know what they were like", "To praise Lot for converting them"], "kasha": "Sedom's wickedness seems irrelevant to the story מתוך Lot moving there.", "answer": "To show that even so, Lot did not hold back from living with them."}, {"q": "Chazal (Yoma) learn a posuk from Mishlei from this description מתוך Sedom. Which one?", "options": ["'ושם רשעים ירקב' — the name מתוך the wicked shall rot", "'Do not judge your friend until in his place'", "'Hashem waits for the wicked to repent'"], "kasha": "The Torah goes out מתוך its way to describe Sedom's people negatively by name.", "answer": "Chazal learned from here the posuk 'ושם רשעים ירקב' — the name מתוך the wicked shall rot (Mishlei 10; Yoma 38)."}]}, {"id": "13:13.2", "ch": 13, "v": 13, "n": 2, "dh": "רעים", "pasuk_html": "וְאַנְשֵׁ֣י סְדֹ֔ם <mark>רָעִ֖ים</mark> וְחַטָּאִ֑ים לַיהֹוָ֖ה מְאֹֽד׃", "pasuk_en": "The people מתוך Sedom were wicked [with their property] and sinful [with their bodies] towards [before] Adonoy, exceedingly.", "rashi_he": "בְּגוּפָם:", "rashi_en": "With their persons.", "note": "", "points": [{"q": "Sedom's people were 'רעים' and 'חטאים.' What does 'רעים' refer to?", "options": ["Wicked with their bodies", "Wicked with their money", "Wicked in their thoughts"], "kasha": "'רעים' and 'חטאים' seem to say the same thing twice.", "answer": "'רעים' means evil with their bodies."}]}, {"id": "13:13.3", "ch": 13, "v": 13, "n": 3, "dh": "וחטאים", "pasuk_html": "וְאַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים <mark>וְחַטָּאִ֑ים</mark> לַיהֹוָ֖ה מְאֹֽד׃", "pasuk_en": "The people מתוך Sedom were wicked [with their property] and sinful [with their bodies] towards [before] Adonoy, exceedingly.", "rashi_he": "בְּמָמוֹנָם (סנה' ק\"ט):", "rashi_en": "With their wealth.", "note": "", "points": [{"q": "And 'וחטאים' — sinful in what way?", "options": ["Sinful with their money", "Sinful with their bodies", "Sinful by worshipping idols"], "kasha": "'חטאים' must mean something different from 'רעים'.", "answer": "'חטאים' means sinful with their money (Sanhedrin)."}]}, {"id": "13:13.4", "ch": 13, "v": 13, "n": 4, "dh": "לה' מאד", "pasuk_html": "וְאַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְחַטָּאִ֑ים לַיהֹוָ֖ה מְאֹֽד׃", "pasuk_en": "The people מתוך Sedom were wicked [with their property] and sinful [with their bodies] towards [before] Adonoy, exceedingly.", "rashi_he": "יוֹדְעִים רִבּוֹנָם, וּמִתְכַּוְּנִים לִמְרֹד בּוֹ:", "rashi_en": "They know their Master and intentionally rebel against Him.", "note": "", "points": [{"q": "Why add 'לה' מאד' — 'to Hashem, exceedingly'?", "options": ["They knew Hashem and deliberately rebelled", "They brought many korbanos to Hashem", "They sinned only once"], "kasha": "Every sin is against Hashem — why stress 'to Hashem'?", "answer": "They knew their Master and intended to rebel against Him."}]}, {"id": "13:14.1", "ch": 13, "v": 14, "n": 1, "dh": "אחרי הפרד לוט", "pasuk_html": "וַֽיהֹוָ֞ה אָמַ֣ר אֶל־אַבְרָ֗ם אַחֲרֵי֙ הִפָּֽרֶד־ל֣וֹט מֵֽעִמּ֔וֹ שָׂ֣א נָ֤א עֵינֶ֙יךָ֙ וּרְאֵ֔ה מִן־הַמָּק֖וֹם אֲשֶׁר־אַתָּ֣ה שָׁ֑ם צָפֹ֥נָה וָנֶ֖גְבָּה וָקֵ֥דְמָה וָיָֽמָּה׃", "pasuk_en": "Adonoy said to Avram after Lot had separated from him: Raise your eyes and look about from the place where you are, to the north, to the south to the east and to the west.", "rashi_he": "כָּל זְמַן שֶׁהָרָשָׁע עִמּוֹ הָיָה הַדִּבּוּר פּוֹרֵשׁ מִמֵֶּנּוּ:", "rashi_en": "As long as the wicked person was with him, the Word [מתוך God] withdrew from him. (And above when Lot was [still] with him and [yet] it is written: “And God appeared to Avram,” [we must assume that] at that time he [Lot] was [still נכוןeous]).", "note": "", "points": [{"q": "Why does the posuk say Hashem spoke to Avram 'אחרי הפרד לוט' — after Lot left?", "options": ["While the wicked Lot was with him, Hashem didn't speak", "Avram was too busy to listen before", "Hashem waited until Avram was alone in prayer"], "kasha": "Why connect Hashem's speaking to Lot's leaving?", "answer": "As long as the wicked one was with Avram, Hashem's speech withdrew from him."}]}, {"id": "13:16.1", "ch": 13, "v": 16, "n": 1, "dh": "אשר אם יוכל איש", "pasuk_html": "וְשַׂמְתִּ֥י אֶֽת־זַרְעֲךָ֖ כַּעֲפַ֣ר הָאָ֑רֶץ אֲשֶׁ֣ר&thinsp;׀ אִם־יוּכַ֣ל אִ֗ישׁ לִמְנוֹת֙ אֶת־עֲפַ֣ר הָאָ֔רֶץ גַּֽם־זַרְעֲךָ֖ יִמָּנֶֽה׃", "pasuk_en": "I will make your descendants [numerous] as the dust מתוך the earth; so that if a man can count the dust מתוך the earth, then your descendants too will be countable [just as it is impossible for a man to count the dust מתוך the earth, so too your descendants will not be countable].", "rashi_he": "כְּשֵׁם שֶׁאִי אֶפְשָׁר לֶעָפָר לְהִמָּנוֹת כָּךְ זַרְעֲךָ לֹא יִמָּנֶה:", "rashi_en": "Just as it is impossible for dust to be counted so, too, your progeny will not be counted.", "note": "", "points": [{"q": "'אשר אם יוכל איש למנות... גם זרעך ימנה' — is Hashem saying Avram's children can be counted?", "options": ["Just as dust can't be counted, neither can they", "Yes, they will be counted precisely", "Only some מתוך them will be counted"], "kasha": "Read simply, the posuk sounds like his descendants will be countable.", "answer": "It's a comparison: just as it's impossible to count the dust, so too your children won't be countable."}]}, {"id": "13:18.
