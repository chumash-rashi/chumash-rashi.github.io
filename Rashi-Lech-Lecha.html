וֹיִ֔ם וְאַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְאַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר <mark>אַרְבָּעָ֥ה מְלָכִ֖ים</mark> אֶת־הַחֲמִשָּֽׁה׃", "pasuk_en": "אֵת כְּדָרְלָעֹמֶר מֶלֶךְ עֵילָם וְתִדְעָל מֶלֶךְ גּוֹיִם וְאַמְרָפֶל מֶלֶךְ שִׁנְעָר וְאַרְיוֹךְ מֶלֶךְ אֶלָּסָר אַרְבָּעָה מְלָכִים אֶת־הַחֲמִשָּׁה׃", "rashi_he": "ארבעה מלכים וגו'. וְאַף עַל פִּי כֵן נִצְּחוּ הַמֻּעָטִים, לְהוֹדִיעֲךָ שֶׁגִּבּוֹרִים הָיוּ, וְאַף עַל פִּי כֵן לֹא נִמְנַע אַבְרָהָם מִלִּרְדֹּף אַחֲרֵיהֶם:", "rashi_en": "אף שהיו רק ארבעה מלכים נגד חמישה, ניצחו המעטים, וזה מלמד שהיו גיבורים. ואף על פי כן אברהם לא נמנע מלרדוף אחריהם.", "note": "", "points": [{"q": "מַה מְלַמֵּד רַשִׁ\"י מִכָּךְ שֶׁהַפָּסוּק מַדְגִּישׁ \"אַרְבָּעָה מְלָכִים\" נֶגֶד חֲמִישָּׁה?", "options": ["שֶׁהַמְּעַטִּים נִיצְּחוּ וְהָיוּ גִּיבּוֹרִים, וּבְכָל זֹאת אַבְרָהָם רָדַף אַחֲרֵיהֶם", "שֶׁהַחֲמִישָּׁה הָיוּ חֲלָשִׁים וְלָכֵן אַבְרָהָם נִיצֵּחַ בְּקַלּוּת", "שֶׁהָאַרְבָּעָה לֹא בֶּאֱמֶת נִלְחֲמוּ, אֶלָּא הַחֲמִישָּׁה נִכְנְעוּ"], "kasha": "למה הפסוק חוזר ומונה את מספר המלכים, \"ארבעה\" מול \"החמשה\", כשכבר נזכרו קודם?", "answer": "אף על פי כן ניצחו המעטים, להודיעך שגיבורים היו, ובכל זאת לא נמנע אברהם מלרדוף אחריהם.", "kp": ["נצחו המעטים", "להודיעך שגבורים היו", "לא נמנע אברהם מלרדף"]}]}, {"id": "14:10.1", "ch": 14, "v": 10, "n": 1, "dh": "בארת בארת חמר", "pasuk_html": "וְעֵ֣מֶק הַשִׂדִּ֗ים <mark>בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר</mark> וַיָּנֻ֛סוּ מֶֽלֶךְ־סְדֹ֥ם וַעֲמֹרָ֖ה וַיִּפְּלוּ־שָׁ֑מָּה וְהַנִּשְׁאָרִ֖ים הֶ֥רָה נָּֽסוּ׃", "pasuk_en": "וְעֵמֶק הַשִׂדִּים בֶּאֱרֹת בֶּאֱרֹת חֵמָר וַיָּנֻסוּ מֶלֶךְ־סְדֹם וַעֲמֹרָה וַיִּפְּלוּ־שָׁמָּה וְהַנִּשְׁאָרִים הֶרָה נָּסוּ׃", "rashi_he": "בארת בארת חמר. בְּאֵרוֹת הַרְבֵּה הָיוּ שָׁם, שֶׁנּוֹטְלִין מִשָּׁם אֲדָמָה לְטִיט שֶׁל בִּנְיָן. וּמִדְרַש אַגָּדָה שֶׁהָיָה הַטִּיט מֻגְבָּל בָּהֶם, וְנַעֲשָׂה נֵס לְמֶלֶךְ סְדוֹם שֶׁיָּצָא מִשָּׁם, לְפִי שֶׁהָיוּ בָאֻמּוֹת מִקְצָתָן שֶׁלֹּא הָיוּ מַאֲמִינִין שֶׁנִּצַּל אַבְרָהָם מֵאוּר כַּשְׂדִּים מִכִּבְשַׁן הָאֵשׁ, וְכֵיוָן שֶׁיָּצָא זֶה מִן הַחֵמָר, הֶאֱמִינוּ בְאַבְרָם לְמַפְרֵעַ:", "rashi_en": "בעמק היו בורות רבים שמהם לקחו אדמה לטיט של בניין. לפי המדרש מלך סדום נפל לטיט ויצא משם בנס, וכך האמינו גם המפקפקים שאברהם ניצל מכבשן האש באור כשדים.", "note": "", "points": [{"q": "לְפִי הַפְּשָׁט, מָה הָיוּ \"בֶּאֱרֹת בֶּאֱרֹת חֵמָר\"?", "options": ["בּוֹרוֹת רַבִּים שֶׁלָּקְחוּ מֵהֶם אֲדָמָה לְטִיט לְבִנְיָין", "בּוֹרוֹת מַיִם שֶׁהַמְּלָכִים חָפְרוּ לִשְׁתִיָּיה", "מַלְכּוֹדוֹת שֶׁהַמְּלָכִים חָפְרוּ לְאוֹיְבֵיהֶם"], "kasha": "הכפילות \"בארת בארת\" צריכה ביאור, וגם יש לבאר מה טיבם של בורות אלה.", "answer": "היו שם בורות רבים, שנוטלים מהם אדמה לטיט של בניין.", "kp": ["בארות הרבה היו שם", "שנוטלין משם אדמה לטיט"]}, {"q": "לְפִי הַמִּדְרָשׁ, מָה הָיָה הַטַּעַם לַנֵּס שֶׁנַּעֲשָׂה לְמֶלֶךְ סְדוֹם?", "options": ["כְּדֵי שֶׁהַמְּפַקְפְּקִים יַאֲמִינוּ שֶׁאַבְרָהָם נִיצַּל מִכִּבְשַׁן הָאֵשׁ", "כְּדֵי שֶׁמֶּלֶךְ סְדוֹם יַחְזֹור בִּתְשׁוּבָה מֵרִשְׁעוּתוֹ", "כְּדֵי שֶׁמֶּלֶךְ סְדוֹם יוּכַל לְנַצֵּחַ אֶת אַרְבַּעַת הַמְּלָכִים"], "kasha": "הפסוק אומר שמלך סדום נפל שמה, ובהמשך מצאנו אותו חי, ויש להבין איך יצא.", "answer": "הטיט היה מגובל בבורות ונעשה נס למלך סדום שיצא משם, וכיוון שיצא מן החמר האמינו באברם למפרע שניצל מכבשן האש.", "kp": ["נעשה נס למלך סדום", "האמינו באברם למפרע"]}]}, {"id": "14:10.2", "ch": 14, "v": 10, "n": 2, "dh": "הרה נסו", "pasuk_html": "וְעֵ֣מֶק הַשִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַיָּנֻ֛סוּ מֶֽלֶךְ־סְדֹ֥ם וַעֲמֹרָ֖ה וַיִּפְּלוּ־שָׁ֑מָּה וְהַנִּשְׁאָרִ֖ים <mark>הֶ֥רָה נָּֽסוּ׃</mark>", "pasuk_en": "וְעֵמֶק הַשִׂדִּים בֶּאֱרֹת בֶּאֱרֹת חֵמָר וַיָּנֻסוּ מֶלֶךְ־סְדֹם וַעֲמֹרָה וַיִּפְּלוּ־שָׁמָּה וְהַנִּשְׁאָרִים הֶרָה נָּסוּ׃", "rashi_he": "הרה נסו. לְהָר נָסוּ, הֶרָה, כְּמוֹ לְהָר; כָּל תֵּבָה שֶׁצְּרִיכָה לָמֶ\"ד בִּתְחִלָּתָהּ, הֵטִיל לָהּ הֵ\"א בְּסוֹפָהּ. וְיֵשׁ חִלּוּק בֵּין הֶרָה לְהָהָרָה, שֶׁהֵ\"א שֶׁבְּסוֹף הַתֵּבָה עוֹמֶדֶת בִּמְקוֹם לָמֶ\"ד שֶׁבְּרֹאשָׁהּ, אֲבָל אֵינָהּ עוֹמֶדֶת בִּמְקוֹם לָמֶ\"ד וּנְקוּדָה פַּתָּח תַּחְתֶּיהָ, וַהֲרֵי הֶרָה כְּמוֹ לְהַר אוֹ כְּמוֹ אֶל הַר, וְאֵינוֹ מְפָרֵשׁ לְאֵיזֶה הַר, אֶלָּא שֶׁכָּל אֶחָד נָס בַּאֲשֶׁר מָצָא הַר תְּחִלָּה, וּכְשֶׁהוּא נוֹתֵן הֵ\"א בְרֹאשָׁהּ לִכְתֹּב הָהָרָה אוֹ הַמִּדְבָּרָה, פִּתְרוֹנוֹ כְּמוֹ אֶל הָהָר אוֹ כְמוֹ לְהָהָר, וּמַשְׁמַע לְאוֹתוֹ הַר הַיָּדוּעַ וּמְפֹרָשׁ בַּפָּרָשָׁה:", "rashi_en": "\"הרה\" פירושו להר: הה\"א בסוף המילה באה במקום למ\"ד בתחילתה. \"הרה\" בלי ה\"א בתחילה אינו מפרש לאיזה הר, כי כל אחד ברח להר הראשון שמצא, ואילו \"ההרה\" עם ה\"א בתחילה פירושו להר הידוע.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"הֶרָה נָּסוּ\" לְפִי רַשִׁ\"י?", "options": ["נָסוּ לָהָר, הַהֵ\"א בַּסּוֹף בִּמְקוֹם לָמֶ\"ד בַּתְּחִילָּה", "נָסוּ מִן הָהָר אֶל הָעֵמֶק", "נָסוּ מַהֵר וּבְבֶהָלָה גְּדוֹלָה"], "kasha": "המילה \"הרה\" בנויה בצורה לא רגילה, עם ה\"א בסופה.", "answer": "הרה כמו להר: כל מילה שצריכה למ\"ד בתחילתה אפשר לשים לה ה\"א בסופה.", "kp": ["הרה, כמו להר", "הטיל לה ה\"א בסופה"]}, {"q": "לָמָּה נֶאֱמַר \"הֶרָה\" וְלֹא \"הָהָרָה\"?", "options": ["כִּי כָּל אֶחָד בָּרַח לְהַר הָרִאשׁוֹן שֶׁמָּצָא", "כִּי כֻּולָּם בָּרְחוּ יַחַד לְהַר אֶחָד יָדוּעַ", "כִּי הָהָר נִקְרָא בְּשֵׁם זֶה מֵאָז וּמֵעוֹלָם"], "kasha": "צריך להבין למה לא נאמר \"ההרה\" עם ה\"א הידיעה, ולא פורש לאיזה הר נסו.", "answer": "הרה אינו מפרש לאיזה הר, אלא שכל אחד נס להר שמצא ראשון. ואילו ההרה פירושו אל ההר הידוע והמפורש בפרשה.", "kp": ["ואינו מפרש לאיזה הר", "כל אחד נס באשר מצא הר", "לאותו הר הידוע"]}]}, {"id": "14:12.1", "ch": 14, "v": 12, "n": 1, "dh": "והוא ישב בסדום", "pasuk_html": "וַיִּקְח֨וּ אֶת־ל֧וֹט וְאֶת־רְכֻשׁ֛וֹ בֶּן־אֲחִ֥י אַבְרָ֖ם וַיֵּלֵ֑כוּ <mark>וְה֥וּא יֹשֵׁ֖ב בִּסְדֹֽם׃</mark>", "pasuk_en": "וַיִּקְחוּ אֶת־לוֹט וְאֶת־רְכֻשׁוֹ בֶּן־אֲחִי אַבְרָם וַיֵּלֵכוּ וְהוּא יֹשֵׁב בִּסְדֹם׃", "rashi_he": "והוא ישב בסדום. מִי גָרַם לוֹ זֹאת? יְשִׁיבָתוֹ בִסְדוֹם:", "rashi_en": "התורה מוסיפה שלוט ישב בסדום כדי ללמד שישיבתו בסדום היא שגרמה לו להיות נשבה.", "note": "", "points": [{"q": "לָמָּה הַפָּסוּק מוֹסִיף \"וְהוּא יֹשֵׁב בִּסְדֹם\"?", "options": ["לְלַמֵּד שֶׁיְּשִׁיבָתוֹ בִּסְדוֹם גָּרְמָה לוֹ לְהִישָּׁבוֹת", "לְלַמֵּד שֶׁלּוֹט הָיָה מַנְהִיג חָשׁוּב בִּסְדוֹם", "לְלַמֵּד שֶׁאַבְרָם לֹא יָדַע אֵיפֹה לוֹט גָּר"], "kasha": "כבר ידוע שלוט ישב בסדום, ולמה הפסוק חוזר ומזכיר זאת כאן?", "answer": "הפסוק בא ללמד מה גרם ללוט להישבות: ישיבתו בסדום.", "kp": ["מי גרם לו זאת", "ישיבתו בסדום"]}]}, {"id": "14:13.1", "ch": 14, "v": 13, "n": 1, "dh": "ויבא הפליט", "pasuk_html": "<mark>וַיָּבֹא֙ הַפָּלִ֔יט</mark> וַיַּגֵּ֖ד לְאַבְרָ֣ם הָעִבְרִ֑י וְהוּא֩ שֹׁכֵ֨ן בְּאֵֽלֹנֵ֜י מַמְרֵ֣א הָאֱמֹרִ֗י אֲחִ֤י אֶשְׁכֹּל֙ וַאֲחִ֣י עָנֵ֔ר וְהֵ֖ם בַּעֲלֵ֥י בְרִית־אַבְרָֽם׃", "pasuk_en": "וַיָּבֹא הַפָּלִיט וַיַּגֵּד לְאַבְרָם הָעִבְרִי וְהוּא שֹׁכֵן בְּאֵלֹנֵי מַמְרֵא הָאֱמֹרִי אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר וְהֵם בַּעֲלֵי בְרִית־אַבְרָם׃", "rashi_he": "ויבא הפליט. לְפִי פְשׁוּטוֹ זֶה עוֹג, שֶׁפָּלַט מִן הַמִּלְחָמָה, וְהוּא שֶׁכָּתוּב כִּי רַק עוֹג נִשְׁאַר מִיֶּתֶר הָרְפָאִים (דבר' ג') וְזֶהוּ נִשְׁאַר, שֶׁלֹּא הֲרָגוּהוּ אַמְרָפֶל וַחֲבֵרָיו כְּשֶׁהִכּוּ הָרְפָאִים בְּעַשְׁתְּרוֹת קַרְנַיִם, תַּנְחוּמָא וּמִדְרַשׁ בְּ\"רַ זֶה עוֹג, שֶׁפָּלַט מִדּוֹר הַמַּבּוּל; וְזֶהוּ מִיֶּתֶר הָרְפָאִים, שֶׁנֶּאֱמַר הַנְּפִלִים הָיוּ בָאָרֶץ וְגוֹ' (לְעֵיל ו') וּמִתְכַּוֵּן שֶׁיֵּהָרֵג אַבְרָם וְיִשָּׂא אֶת שָׂרָה:", "rashi_en": "הפליט הוא עוג. לפי הפשט הוא נמלט מהמלחמה כשהכו המלכים את הרפאים, ולפי המדרש הוא נמלט מדור המבול. כוונתו הייתה שאברם ייהרג במלחמה וכך יוכל לשאת את שרה.", "note": "", "points": [{"q": "מִי הָיָה \"הַפָּלִיט\" לְפִי הַפְּשָׁט?", "options": ["עוֹג, שֶׁנִּמְלַט כְּשֶׁהִכּוּ הַמְּלָכִים אֶת הָרְפָאִים", "לוֹט, שֶׁבָּרַח מִן הַשְּׁבִי בִּסְדוֹם", "מֶלֶךְ סְדֹום, שֶׁיָּצָא מִבּוֹר הַחֵמָר"], "kasha": "הפסוק אומר \"הפליט\" בה\"א הידיעה, כאילו מדובר בפליט מסוים וידוע, ואינו מפרש מי הוא.", "answer": "לפי פשוטו זה עוג, שנמלט מן המלחמה, ועליו נאמר \"כי רק עוג נשאר מיתר הרפאים\", שלא הרגוהו אמרפל וחבריו.", "kp": ["זה עוג, שפלט מן המלחמה", "שלא הרגוהו אמרפל וחבריו"]}, {"q": "לְפִי רַשִׁ\"י, מַה הָיְיתָה כַּווָּנַת עוֹג כְּשֶׁסִיפֵּר לְאַבְרָם עַל שְׁבִי לוֹט?", "options": ["שֶׁאַבְרָם יֵיהָרֵג בַּמִּלְחָמָה וְהוּא יִישָּׂא אֶת שָׂרָה", "לְהַצִּיל אֶת לוֹט כִּי הָיָה קָרוֹב מִשְׁפַּחְתּוֹ", "לְהִתְחַבֵּר לְאַבְרָם וּלְהִילָּחֵם בְּאַרְבַּעַת הַמְּלָכִים"], "kasha": "צריך להבין למה טרח הפליט לבוא ולספר דווקא לאברם.", "answer": "עוג התכוון שאברם ייהרג במלחמה, וכך יוכל לשאת את שרה.", "kp": ["שיהרג אברם וישא את שרה"]}]}, {"id": "14:13.2", "ch": 14, "v": 13, "n": 2, "dh": "העברי", "pasuk_html": "וַיָּבֹא֙ הַפָּלִ֔יט וַיַּגֵּ֖ד לְאַבְרָ֣ם <mark>הָעִבְרִ֑י</mark> וְהוּא֩ שֹׁכֵ֨ן בְּאֵֽלֹנֵ֜י מַמְרֵ֣א הָאֱמֹרִ֗י אֲחִ֤י אֶשְׁכֹּל֙ וַאֲחִ֣י עָנֵ֔ר וְהֵ֖ם בַּעֲלֵ֥י בְרִית־אַבְרָֽם׃", "pasuk_en": "וַיָּבֹא הַפָּלִיט וַיַּגֵּד לְאַבְרָם הָעִבְרִי וְהוּא שֹׁכֵן בְּאֵלֹנֵי מַמְרֵא הָאֱמֹרִי אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר וְהֵם בַּעֲלֵי בְרִית־אַבְרָם׃", "rashi_he": "העברי. שֶׁבָּא מֵעֵבֶר הַנָּהָר (בראשית רבה):", "rashi_en": "אברם נקרא \"העברי\" משום שבא מעבר הנהר.", "note": "", "points": [{"q": "לָמָּה נִקְרָא אַבְרָם \"הָעִבְרִי\"?", "options": ["מִשּׁוּם שֶׁבָּא מֵעֵבֶר הַנָּהָר", "מִשּׁוּם שֶׁהָיָה מִצֶּאֱצָאֵי עֵבֶר בִּלְבַד", "מִשּׁוּם שֶׁעָבַר מִמָּקוֹם לְמָקוֹם בָּאָרֶץ"], "kasha": "הכינוי \"העברי\" לא הוזכר עד כאן לגבי אברם, ויש לבאר את משמעותו.", "answer": "נקרא עברי משום שבא מעבר הנהר.", "kp": ["שבא מעבר הנהר"]}]}, {"id": "14:13.3", "ch": 14, "v": 13, "n": 3, "dh": "בעלי ברית אברם", "pasuk_html": "וַיָּבֹא֙ הַפָּלִ֔יט וַיַּגֵּ֖ד לְאַבְרָ֣ם הָעִבְרִ֑י וְהוּא֩ שֹׁכֵ֨ן בְּאֵֽלֹנֵ֜י מַמְרֵ֣א הָאֱמֹרִ֗י אֲחִ֤י אֶשְׁכֹּל֙ וַאֲחִ֣י עָנֵ֔ר וְהֵ֖ם <mark>בַּעֲלֵ֥י בְרִית־אַבְרָֽם׃</mark>", "pasuk_en": "וַיָּבֹא הַפָּלִיט וַיַּגֵּד לְאַבְרָם הָעִבְרִי וְהוּא שֹׁכֵן בְּאֵלֹנֵי מַמְרֵא הָאֱמֹרִי אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר וְהֵם בַּעֲלֵי בְרִית־אַבְרָם׃", "rashi_he": "בעלי ברית אברם. שֶׁכָּרְתוּ עִמּוֹ בְּרִית:", "rashi_en": "\"בעלי ברית אברם\" פירושו שכרתו עם אברם ברית.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"בַּעֲלֵי בְרִית\" אַבְרָם?", "options": ["שֶׁכָּרְתוּ עִמּוֹ בְּרִית", "שֶׁהָיוּ נִימּוֹלִים כָּמוֹתוֹ", "שֶׁהָיוּ קְרוֹבֵי מִשְׁפָּחָה שֶׁלּוֹ"], "kasha": "יש לבאר מה פירוש הביטוי \"בעלי ברית\" ובמה היו קשורים לאברם.", "answer": "הם כרתו עמו ברית.", "kp": ["שכרתו עמו ברית"]}]}, {"id": "14:14.1", "ch": 14, "v": 14, "n": 1, "dh": "וירק", "pasuk_html": "וַיִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑יו <mark>וַיָּ֨רֶק</mark> אֶת־חֲנִיכָ֜יו יְלִידֵ֣י בֵית֗וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּשְׁלֹ֣שׁ מֵא֔וֹת וַיִּרְדֹּ֖ף עַד־דָּֽן׃", "pasuk_en": "וַיִּשְׁמַע אַבְרָם כִּי נִשְׁבָּה אָחִיו וַיָּרֶק אֶת־חֲנִיכָיו יְלִידֵי בֵיתוֹ שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת וַיִּרְדֹּף עַד־דָּן׃", "rashi_he": "וירק. כְּתַרְגּוּמוֹ וְזָרִיז, וְכֵן וַהֲרִיקֹתִי אַחֲרֵיכֶם חָרֶב (ויקרא כ\"ו) – אֶזְדַּיֵּן בְּחַרְבִּי עֲלֵיכֶם, וְכֵן אָרִיק חַרְבִּי (שמות ט\"ו), וְכֵן וְהָרֵק חֲנִית וּסְגֹר (תה' ל\"ה):", "rashi_en": "\"וירק\" פירושו כתרגום אונקלוס: זירז וחימש את אנשיו בכלי נשק, וכך פירוש \"והריקתי אחריכם חרב\" ו\"אריק חרבי\".", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילָּה \"וַיָּרֶק\" לְפִי רַשִׁ\"י?", "options": ["זֵירֵז וְחִימֵּשׁ אֶת אַנְשָׁיו בִּכְלֵי נֶשֶׁק", "רִוקֵּן אֶת בֵּיתוֹ מִכָּל אֲנָשָׁיו", "הוֹרִיק אֶת פְּנֵי חֲנִיכָיו מִפַּחַד"], "kasha": "המילה \"וירק\" נראית כלשון ריקון, ואין זה מתאים לעניין יציאה למלחמה.", "answer": "כתרגומו \"וזריז\", כלומר חימש אותם בכלי נשק, וכן \"והריקתי אחריכם חרב\" שתרגומו \"אזדיין בחרבי עליכם\".", "kp": ["כתרגומו וזריז", "אזדין בחרבי עליכם"]}]}, {"id": "14:14.2", "ch": 14, "v": 14, "n": 2, "dh": "חניכיו", "pasuk_html": "וַיִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑יו וַיָּ֨רֶק אֶת־<mark>חֲנִיכָ֜יו</mark> יְלִידֵ֣י בֵית֗וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּשְׁלֹ֣שׁ מֵא֔וֹת וַיִּרְדֹּ֖ף עַד־דָּֽן׃", "pasuk_en": "וַיִּשְׁמַע אַבְרָם כִּי נִשְׁבָּה אָחִיו וַיָּרֶק אֶת־חֲנִיכָיו יְלִידֵי בֵיתוֹ שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת וַיִּרְדֹּף עַד־דָּן׃", "rashi_he": "חניכיו. חנכו כְּתִיב (ס\"אֲ קְרֵי), זֶה אֱלִיעֶזֶר שֶׁחִנְּכוֹ לְמִצְוֹת וְהוּא לְשׁוֹן הַתְחָלַת כְּנִיסַת הָאָדָם אוֹ כְלִי לָאֻמָּנוּת שֶׁהוּא עָתִיד לַעֲמֹד בָּהּ, וְכֵן חֲנֹךְ לַנַּעַר (משלי כ\"ב), חֲנֻכַּת הַמִּזְבֵּחַ (במד' ז'), חֲנֻכַּת הַבַּיִת (תה' ל') ובלע\"ז קוֹרִין לוֹ אינצ\"נייר:", "rashi_en": "\"חניכיו\" נכתב בלשון יחיד, \"חנכו\", ומדובר באליעזר שאברם חינך אותו למצוות. לשון חינוך היא התחלת כניסתו של אדם או כלי לתפקיד שהוא עתיד לעמוד בו.", "note": "", "points": [{"q": "מַה לוֹמֵד רַשִׁ\"י מִכָּךְ שֶׁהַמִּילָּה \"חֲנִיכָיו\" כְּתוּבָה \"חֲנִכּוֹ\"?", "options": ["שֶׁמְּדֻובָּר בְּאֱלִיעֶזֶר, שֶׁאַבְרָם חִינֵּךְ אוֹתוֹ לְמִצְווֹת", "שֶׁאַבְרָם לָקַח עִמּוֹ רַק אֶת בְּנוֹ הַקָּטָן", "שֶׁאַבְרָם לֹא לָקַח עִמּוֹ אִישׁ מֵחֲנִיכָיו"], "kasha": "המילה נקראת בלשון רבים, \"חניכיו\", אבל כתובה בלשון יחיד, \"חנכו\".", "answer": "חנכו כתיב, וזה אליעזר שאברם חינך אותו למצוות.", "kp": ["חנכו כתיב", "זה אליעזר שחנכו למצות"]}, {"q": "מַה מַשְׁמָעוּת לְשׁוֹן \"חִינּוּךְ\" לְפִי רַשִׁ\"י?", "options": ["הַתְחָלַת כְּנִיסַת אָדָם אוֹ כְּלִי לְתַפְקִידוֹ הֶעָתִידִי", "לִימּוּד תּוֹרָה לִילָדִים קְטַנִּים בְּבֵית הַסֵּפֶר", "סִיּוּם הַכְשָׁרָה אֲרוּכָּה שֶׁל עֶבֶד אֵצֶל אֲדוֹנוֹ"], "kasha": "יש לבאר מה פירוש המילה \"חניכיו\" ומה משמעות לשון חינוך.", "answer": "חינוך הוא לשון התחלת כניסת האדם או הכלי לאומנות שהוא עתיד לעמוד בה, כמו \"חנך לנער\" ו\"חנכת המזבח\".", "kp": ["לשון התחלת כניסת האדם", "שהוא עתיד לעמד בה"]}]}, {"id": "14:14.3", "ch": 14, "v": 14, "n": 3, "dh": "שמנה עשר וגו'", "pasuk_html": "וַיִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑יו וַיָּ֨רֶק אֶת־חֲנִיכָ֜יו יְלִידֵ֣י בֵית֗וֹ <mark>שְׁמֹנָ֤ה עָשָׂר֙</mark> וּשְׁלֹ֣שׁ מֵא֔וֹת וַיִּרְדֹּ֖ף עַד־דָּֽן׃", "pasuk_en": "וַיִּשְׁמַע אַבְרָם כִּי נִשְׁבָּה אָחִיו וַיָּרֶק אֶת־חֲנִיכָיו יְלִידֵי בֵיתוֹ שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת וַיִּרְדֹּף עַד־דָּן׃", "rashi_he": "שמנה עשר וגו'. רַבּוֹתֵינוּ אָמְרוּ אֱלִיעֶזֶר לְבַדּוֹ הָיָה (נדרים ל\"ב), וְהוּא מִנְיַן גִּימַטְרִיָּא שֶׁל שְׁמוֹ:", "rashi_en": "חז\"ל אמרו שאליעזר לבדו יצא עם אברם, והמספר שלוש מאות ושמונה עשר הוא הגימטריא של שמו.", "note": "", "points": [{"q": "מַה דָּרְשׁוּ חַזַ\"ל עַל הַמִּסְפָּר \"שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת\"?", "options": ["שֶׁזֶּה אֱלִיעֶזֶר לְבַדּוֹ, וְזוֹ הַגִּימַטְרִיָּא שֶׁל שְׁמוֹ", "שְׁאֵלָה הָיוּ כָּל עַבְדֵי אַבְרָם יַחַד עִם לוֹט", "שְׁאֵלָה הָיוּ בַּעֲלֵי בְּרִיתוֹ שֶׁל אַבְרָם עִם עֲבָדֵיהֶם"], "kasha": "לא מסתבר שאברם יצא עם שלוש מאות ושמונה עשר איש בלבד לנצח ארבעה מלכים גיבורים.", "answer": "רבותינו אמרו שאליעזר לבדו היה, והמספר הוא מניין הגימטריא של שמו.", "kp": ["אליעזר לבדו היה", "מנין גימטריא של שמו"]}]}, {"id": "14:14.4", "ch": 14, "v": 14, "n": 4, "dh": "עד דן", "pasuk_html": "וַיִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑יו וַיָּ֨רֶק אֶת־חֲנִיכָ֜יו יְלִידֵ֣י בֵית֗וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּשְׁלֹ֣שׁ מֵא֔וֹת וַיִּרְדֹּ֖ף <mark>עַד־דָּֽן׃</mark>", "pasuk_en": "וַיִּשְׁמַע אַבְרָם כִּי נִשְׁבָּה אָחִיו וַיָּרֶק אֶת־חֲנִיכָיו יְלִידֵי בֵיתוֹ שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת וַיִּרְדֹּף עַד־דָּן׃", "rashi_he": "עד דן. שָׁם תָּשַׁשׁ כֹּחוֹ, שֶׁרָאָה שֶׁעֲתִידִין בָּנָיו לְהַעֲמִיד שָׁם עֵגֶל (סנה' צ\"ו):", "rashi_en": "כשהגיע אברם לדן תשש כוחו, משום שראה שבניו עתידים להעמיד שם עגל.", "note": "", "points": [{"q": "מַה קָרָה לְאַבְרָם כְּשֶׁהִגִּיעַ לְדָן, לְפִי רַשִׁ\"י?", "options": ["תָּשַׁשׁ כֹּוחוֹ, כִּי רָאָה שֶׁבָּנָיו יַעֲמִידוּ שָׁם עֵגֶל", "נִיצַּח שָׁם אֶת כָּל הַמְּלָכִים וְהֶחֱזִיר אֶת הַשְּׁבִי", "פָּגַשׁ שָׁם אֶת מַלְכִּי צֶדֶק מֶלֶךְ שָׁלֵם"], "kasha": "הפסוק מציין שרדף עד דן, אף שבהמשך נאמר שרדף עד חובה, ויש להבין מה מיוחד בדן.", "answer": "שם תשש כוחו, שראה שבניו עתידים להעמיד שם עגל.", "kp": ["שם תשש כחו", "להעמיד שם עגל"]}]}, {"id": "14:15.1", "ch": 14, "v": 15, "n": 1, "dh": "ויחלק עליהם", "pasuk_html": "<mark>וַיֵּחָלֵ֨ק עֲלֵיהֶ֧ם</mark> ׀ לַ֛יְלָה ה֥וּא וַעֲבָדָ֖יו וַיַּכֵּ֑ם וַֽיִּרְדְּפֵם֙ עַד־חוֹבָ֔ה אֲשֶׁ֥ר מִשְּׂמֹ֖אל לְדַמָּֽשֶׂק׃", "pasuk_en": "וַיֵּחָלֵק עֲלֵיהֶם לַיְלָה הוּא וַעֲבָדָיו וַיַּכֵּם וַיִּרְדְּפֵם עַד־חוֹבָה אֲשֶׁר מִשְּׂמֹאל לְדַמָּשֶׂק׃", "rashi_he": "ויחלק עליהם. לְפִי פְשׁוּטוֹ סָרֵס הַמִּקְרָא \"וַיֵּחָלֵק הוּא וַעֲבָדָיו עֲלֵיהֶם לַיְלָה\" כְּדֶּרֶך הָרוֹדְפִים שֶׁמִּתְפַּלְּגִים אַחַר הַנִּרְדָּפִים, כְּשֶׁבּוֹרְחִין זֶה לְכָאן וְזֶה לְכָאן:", "rashi_en": "לפי פשוטו יש להפוך את סדר המילים: \"ויחלק הוא ועבדיו עליהם לילה\", כדרך רודפים שמתפצלים אחרי הנרדפים כשהם בורחים לכיוונים שונים.", "note": "", "points": [{"q": "אֵיךְ מְבָאֵר רַשִׁ\"י אֶת \"וַיַּחֲלֵק עֲלֵיהֶם\" לְפִי הַפְּשָׁט?", "options": ["אַבְרָם וַעֲבָדָיו הִתְפַּצְּלוּ אַחֲרֵי הַנִּרְדָּפִים שֶׁבָּרְחוּ לְכִיוּוּנִים שׁוֹנִים", "אַבְרָם חִילֵּק אֶת הַשָּׁלָל בֵּין עֲבָדָיו", "אַבְרָם חִילֵּק אֶת הַלַּיְלָה לִשְׁנֵי חֲלָקִים"], "kasha": "סדר המילים בפסוק אינו מובן, ולא ברור מי נחלק ועל מה.", "answer": "יש לסרס את המקרא: \"ויחלק הוא ועבדיו עליהם לילה\", כדרך הרודפים שמתפלגים אחרי הנרדפים כשבורחים לכאן ולכאן.", "kp": ["סרס המקרא", "כדרך הרודפים שמתפלגים"]}]}, {"id": "14:15.2", "ch": 14, "v": 15, "n": 2, "dh": "לילה", "pasuk_html": "וַיֵּחָלֵ֨ק עֲלֵיהֶ֧ם ׀ <mark>לַ֛יְלָה</mark> ה֥וּא וַעֲבָדָ֖יו וַיַּכֵּ֑ם וַֽיִּרְדְּפֵם֙ עַד־חוֹבָ֔ה אֲשֶׁ֥ר מִשְּׂמֹ֖אל לְדַמָּֽשֶׂק׃", "pasuk_en": "וַיֵּחָלֵק עֲלֵיהֶם לַיְלָה הוּא וַעֲבָדָיו וַיַּכֵּם וַיִּרְדְּפֵם עַד־חוֹבָה אֲשֶׁר מִשְּׂמֹאל לְדַמָּשֶׂק׃", "rashi_he": "לילה. כְּלוֹמַר אַחַר שֶׁחָשְׁכָה לֹא נִמְנַע מִלְּרָדְפָם. וּמִדְרַשׁ אַגָּדָה שֶׁנֶּחֱלַק הַלַּיְלָה, וּבְחֶצְיוֹ הָרִאשׁוֹן נַעֲשָׂה לוֹ נֵס, וְחֶצְיוֹ הַשֵּׁנִי נִשְׁמַר וּבָא לוֹ לַחֲצוֹת לַיְלָה שֶׁל מִצְרַיִם:", "rashi_en": "לפי הפשט, גם אחרי שהחשיך לא הפסיק אברם לרדוף. לפי המדרש, הלילה נחלק: בחציו הראשון נעשה לו נס, וחציו השני נשמר לנס של חצות הלילה במצרים.", "note": "", "points": [{"q": "לְפִי הַפְּשָׁט, מָה מְלַמֶּדֶת הַמִּילָּה \"לַיְלָה\"?", "options": ["שֶׁגַּם אַחֲרֵי שֶׁהֶחְשִׁיךְ לֹא נִמְנַע מִלִּרְדּוֹף", "שֶׁאַבְרָם הִתְחַבֵּא בַּיּוֹם וְתָקַף רַק בַּלַּיְלָה", "שֶׁהַמִּלְחָמָה כֻּולָּהּ נִמְשְׁכָה לַיְלָה אֶחָד בִּלְבַד"], "kasha": "צריך להבין מה מוסיפה המילה \"לילה\" לתיאור המלחמה.", "answer": "כלומר אחרי שהחשיך לא נמנע מלרדוף אחריהם.", "kp": ["לא נמנע מלרדפם"]}, {"q": "לְפִי הַמִּדְרָשׁ, מָה פֵּירוּשׁ \"וַיֵּחָלֵק עֲלֵיהֶם לַיְלָה\"?", "options": ["הַלַּיְלָה נֶחְלַק, וַחֲצִיוֹ הַשֵּׁנִי נִשְׁמַר לַחֲצוֹת שֶׁל מִצְרַיִם", "אַבְרָם חִילֵּק אֶת אַנְשָׁיו לִשְׁתֵּי מִשְׁמָרוֹת לַיְלָה", "הַלַּיְלָה הִתְאָרֵךְ בְּנֵס עַד שֶׁנִּיצַּח אַבְרָם"], "kasha": "המילים \"ויחלק\" ו\"לילה\" סמוכות, ונראה שהלילה עצמו הוא שנחלק.", "answer": "הלילה נחלק: בחציו הראשון נעשה לאברם נס, וחציו השני נשמר לחצות הלילה של מצרים.", "kp": ["שנחלק הלילה", "לחצות לילה של מצרים"]}]}, {"id": "14:15.3", "ch": 14, "v": 15, "n": 3, "dh": "עד חובה", "pasuk_html": "וַיֵּחָלֵ֨ק עֲלֵיהֶ֧ם ׀ לַ֛יְלָה ה֥וּא וַעֲבָדָ֖יו וַיַּכֵּ֑ם וַֽיִּרְדְּפֵם֙ <mark>עַד־חוֹבָ֔ה</mark> אֲשֶׁ֥ר מִשְּׂמֹ֖אל לְדַמָּֽשֶׂק׃", "pasuk_en": "וַיֵּחָלֵק עֲלֵיהֶם לַיְלָה הוּא וַעֲבָדָיו וַיַּכֵּם וַיִּרְדְּפֵם עַד־חוֹבָה אֲשֶׁר מִשְּׂמֹאל לְדַמָּשֶׂק׃", "rashi_he": "עד חובה. אֵין מָקוֹם שֶׁשְּׁמוֹ חוֹבָה, וְדָן קוֹרֵא חוֹבָה, עַל שֵׁם עֲבוֹדָה זָרָה שֶׁעֲתִידָה לִהְיוֹת שָׁם:", "rashi_en": "אין מקום ששמו חובה, אלא העיר דן נקראת כאן חובה, על שם העבודה זרה שעתידה להיות שם.", "note": "", "points": [{"q": "מַהוּ הַמָּקוֹם חוֹבָה שֶׁאֵלָיו רָדַף אַבְרָם, לְפִי רַשִׁ\"י?", "options": ["זוֹ הָעִיר דָּן, שֶׁנִּקְרֵאת כָּךְ עַל שֵׁם הָעֲבוֹדָה זָרָה הָעֲתִידָה", "זוֹ עִיר בְּשֵׁם חוֹבָה לְיַד דַּמֶּשֶׂק", "זֶה הַמָּקוֹם שֶׁבּוֹ נִתְחַיְּיבוּ הַמְּלָכִים מִיתָה"], "kasha": "אין בשום מקום אחר עיר שנקראת חובה.", "answer": "אין מקום ששמו חובה, אלא דן נקראת חובה על שם העבודה זרה שעתידה להיות שם.", "kp": ["אין מקום ששמו חובה", "ודן קורא חובה", "על שם עבודה זרה"]}]}, {"id": "14:17.1", "ch": 14, "v": 17, "n": 1, "dh": "עמק שוה", "pasuk_html": "וַיֵּצֵ֣א מֶֽלֶךְ־סְדֹם֮ לִקְרָאתוֹ֒ אַחֲרֵ֣י שׁוּב֗וֹ מֵֽהַכּוֹת֙ אֶת־כְּדָרלָעֹ֔מֶר וְאֶת־הַמְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑וֹ אֶל־<mark>עֵ֣מֶק שָׁוֵ֔ה</mark> ה֖וּא עֵ֥מֶק הַמֶּֽלֶךְ׃", "pasuk_en": "וַיֵּצֵא מֶלֶךְ־סְדֹם לִקְרָאתוֹ אַחֲרֵי שׁוּבוֹ מֵהַכּוֹת אֶת־כְּדָרלָעֹמֶר וְאֶת־הַמְּלָכִים אֲשֶׁר אִתּוֹ אֶל־עֵמֶק שָׁוֵה הוּא עֵמֶק הַמֶּלֶךְ׃", "rashi_he": "עמק שוה. כָּךְ שְׁמוֹ, כְּתַרְגּוּמוֹ לְמֵישַׁר מְפַנָּא – פָּנוּי מֵאִילָנוֹת וּמִכָּל מִכְשׁוֹל:", "rashi_en": "\"עמק שוה\" הוא שמו של המקום. לפי התרגום פירושו מישור פנוי, שאין בו עצים ולא שום מכשול.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"עֵמֶק שָׁוֵה\" לפי רש\"י?", "options": ["מִישׁוֹר פָּנוּי מֵעֵצִים וּמִכָּל מִכְשׁוֹל", "עֵמֶק שֶׁנִּקְרָא עַל שֵׁם מֶלֶךְ בְּשֵׁם שָׁוֵה", "עֵמֶק שֶׁגָּובְהוֹ שָׁווֶה לְגֹובַהּ הֶהָרִים סְבִיבוֹ"], "kasha": "לא ברור אם \"שוה\" הוא שם המקום או תיאור של העמק.", "answer": "זה שמו של העמק, וכתרגום אונקלוס \"מישר מפנא\" – מקום פנוי מאילנות ומכל מכשול.", "kp": ["כך שמו", "פנוי מאילנות ומכל מכשול"]}]}, {"id": "14:17.2", "ch": 14, "v": 17, "n": 2, "dh": "עמק המלך", "pasuk_html": "וַיֵּצֵ֣א מֶֽלֶךְ־סְדֹם֮ לִקְרָאתוֹ֒ אַחֲרֵ֣י שׁוּב֗וֹ מֵֽהַכּוֹת֙ אֶת־כְּדָרלָעֹ֔מֶר וְאֶת־הַמְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑וֹ אֶל־עֵ֣מֶק שָׁוֵ֔ה ה֖וּא <mark>עֵ֥מֶק הַמֶּֽלֶךְ׃</mark>", "pasuk_en": "וַיֵּצֵא מֶלֶךְ־סְדֹם לִקְרָאתוֹ אַחֲרֵי שׁוּבוֹ מֵהַכּוֹת אֶת־כְּדָרלָעֹמֶר וְאֶת־הַמְּלָכִים אֲשֶׁר אִתּוֹ אֶל־עֵמֶק שָׁוֵה הוּא עֵמֶק הַמֶּלֶךְ׃", "rashi_he": "עמק המלך. בֵּית רֵיסָא דְמַלְכָּא בֵּית רִיס א' שֶׁהוּא שְׁלֹשִׁים קָנִים, שֶׁהָיָה מְיֻחָד לַמֶּלֶךְ לְצַחֵק שָׁם. וּמִדְרַשׁ אַגָּדָה עֵמֶק, שֶׁהֻשְׁווּ שָׁם כָּל הָאֻמּוֹת וְהִמְלִיכוּ אֶת אַבְרָהָם עֲלֵיהֶם לִנְשִׂיא אֱלֹהִים וּלְקָצִין:", "rashi_en": "לפי התרגום, \"עמק המלך\" היה שטח מיוחד שבו המלך היה משתעשע. לפי המדרש, שם השוו כל העמים את דעתם והמליכו את אברהם עליהם.", "note": "", "points": [{"q": "לְפִי הַתַּרְגּוּם, מַדּוּעַ נִקְרָא הַמָּקוֹם \"עֵמֶק הַמֶּלֶךְ\"?", "options": ["שָׁם הָיָה מָקוֹם מְיֻוחָד לְשַׁעֲשׁוּעֵי הַמֶּלֶךְ", "שָׁם נִקְבַּר אֶחָד הַמְּלָכִים שֶׁנֶּהֶרְגוּ בַּמִּלְחָמָה", "שָׁם יָשַׁב הַמֶּלֶךְ לִשְׁפּוֹט אֶת בְּנֵי עִירוֹ"], "kasha": "מה הקשר בין העמק הזה לבין מלך?", "answer": "לפי התרגום זהו \"בית ריסא דמלכא\" – שטח באורך ריס אחד, שלושים קנים, שהיה מיוחד למלך לשחק בו.", "kp": ["שהיה מיחד למלך לצחק שם"]}, {"q": "לְפִי הַמִּדְרָשׁ, אֵיזֶה מֶלֶךְ נִרְמַז בְּשֵׁם \"עֵמֶק הַמֶּלֶךְ\"?", "options": ["אַבְרָהָם, שֶׁהָעַמִּים הִמְלִיכוּ אוֹתוֹ עֲלֵיהֶם", "מֶלֶךְ סְדֹום, שֶׁיָּצָא שָׁם לִקְרַאת אַבְרָם", "כְּדׇרְלָעֹמֶר, שֶׁמָּלַךְ עַל כָּל הַמְּלָכִים"], "kasha": "הפסוק מוסיף לעמק שם נוסף, ויש לבאר את משמעותו.", "answer": "לפי מדרש אגדה, שם השוו כל העמים את דעתם והמליכו את אברהם עליהם לנשיא אלהים ולקצין.", "kp": ["שהשוו שם כל האמות", "והמליכו את אברהם עליהם"]}]}, {"id": "14:18.1", "ch": 14, "v": 18, "n": 1, "dh": "ומלכי צדק", "pasuk_html": "<mark>וּמַלְכִּי־צֶ֙דֶק֙</mark> מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָיָ֑יִן וְה֥וּא כֹהֵ֖ן לְאֵ֥ל עֶלְיֽוֹן׃", "pasuk_en": "וּמַלְכִּי־צֶדֶק מֶלֶךְ שָׁלֵם הוֹצִיא לֶחֶם וָיָיִן וְהוּא כֹהֵן לְאֵל עֶלְיוֹן׃", "rashi_he": "ומלכי צדק. מִ\"אַ הוּא שֵׁם בֶן נֹחַ (נדרים ל\"ב):", "rashi_en": "לפי המדרש, מלכי צדק הוא שם, בנו של נח.", "note": "", "points": [{"q": "מִי הָיָה \"מַלְכִּי־צֶדֶק\" לְפִי הַמִּדְרָשׁ?", "options": ["שֵׁם בֶּן נֹחַ", "אֱלִיעֶזֶר עֶבֶד אַבְרָהָם", "עָנֵר, בַּעַל בְּרִיתוֹ שֶׁל אַבְרָם"], "kasha": "מלכי צדק מופיע פתאום ככהן לאל עליון, ואין אנו יודעים מי הוא.", "answer": "לפי מדרש אגדה הוא שם בן נח.", "kp": ["הוא שם בן נח"]}]}, {"id": "14:18.2", "ch": 14, "v": 18, "n": 2, "dh": "לחם ויין", "pasuk_html": "וּמַלְכִּי־צֶ֙דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא <mark>לֶ֣חֶם וָיָ֑יִן</mark> וְה֥וּא כֹהֵ֖ן לְאֵ֥ל עֶלְיֽוֹן׃", "pasuk_en": "וּמַלְכִּי־צֶדֶק מֶלֶךְ שָׁלֵם הוֹצִיא לֶחֶם וָיָיִן וְהוּא כֹהֵן לְאֵל עֶלְיוֹן׃", "rashi_he": "לחם ויין. כָּךְ עוֹשִׂים לִיגִיעֵי מִלְחָמָה, וְהֶרְאָה לוֹ שֶׁאֵין בְּלִבּוֹ עָלָיו עַל שֶׁהָרַג אֶת בָּנָיו. ומִ\"אַ רָמַז לוֹ עַל הַמְּנָחוֹת וְעַל הַנְּסָכִים שֶׁיַּקְרִיבוּ שָׁם בָּנָיו:", "rashi_en": "מלכי צדק הביא לחם ויין, כמו שנוהגים לכבד עייפי מלחמה, וכך הראה לאברם שאינו כועס עליו על שהרג את בניו. לפי המדרש רמז לו בזה על המנחות והנסכים שיקריבו שם בניו.", "note": "", "points": [{"q": "מַדּוּעַ הוֹצִיא מַלְכִּי צֶדֶק \"לֶחֶם וָיָיִן\" לְאַבְרָם?", "options": ["כָּךְ מְכַבְּדִים עֲיֵיפֵי מִלְחָמָה, וְהֶרְאָה שֶׁאֵינוֹ כּוֹעֵס עָלָיו", "כְּדֵי לְהַקְרִיב קָרְבַּן תּוֹדָה עַל הַנִּיצָּחוֹן בַּמִּלְחָמָה", "כְּדֵי לִגְמֹול לְאַבְרָם עַל שֶׁהִצִּיל אֶת אַנְשֵׁי סְדֹום"], "kasha": "למה הוציא מלכי צדק דווקא לחם ויין?", "answer": "כך עושים לעייפי מלחמה, ובזה הראה לאברם שאין בלבו עליו על שהרג את בניו.", "kp": ["כך עושים ליגיעי מלחמה", "שאין בלבו עליו"]}, {"q": "לְפִי הַמִּדְרָשׁ, לָמָּה רָמַז מַלְכִּי צֶדֶק בַּלֶּחֶם וּבַיַּיִן?", "options": ["לְמִנְחוֹת וּלִנְסָכִים שֶׁיַּקְרִיבוּ שָׁם בְּנֵי אַבְרָהָם", "לִסְעוּדָה שֶׁיַּעֲשֶׂה אַבְרָהָם בְּיוֹם שֶׁיִּיגָּמֵל יִצְחָק", "לְשֶׁפַע הַפַּרְנָסָה שֶׁיִּהְיֶה לִבְנֵי אַבְרָהָם בָּאָרֶץ"], "kasha": "יש לדרוש מה מרמזים הלחם והיין שהוציא הכהן לאל עליון.", "answer": "לפי המדרש רמז לו על המנחות ועל הנסכים שיקריבו שם בניו.", "kp": ["רמז לו על המנחות ועל הנסכים"]}]}, {"id": "14:19.1", "ch": 14, "v": 19, "n": 1, "dh": "קנה שמים וארץ", "pasuk_html": "וַֽיְבָרְכֵ֖הוּ וַיֹּאמַ֑ר בָּר֤וּךְ אַבְרָם֙ לְאֵ֣ל עֶלְי֔וֹן <mark>קֹנֵ֖ה שָׁמַ֥יִם וָאָֽרֶץ׃</mark>", "pasuk_en": "וַיְבָרְכֵהוּ וַיֹּאמַר בָּרוּךְ אַבְרָם לְאֵל עֶלְיוֹן קֹנֵה שָׁמַיִם וָאָרֶץ׃", "rashi_he": "קנה שמים וארץ. כְּמוֹ עֹשֵׂה שָׁמַיִם וָאָרֶץ (תה' קל\"ד); עַל יְדֵי עֲשִׂיָּתָן קְנָאָן לִהְיוֹת שֶׁלּוֹ:", "rashi_en": "\"קנה שמים וארץ\" פירושו שעשה את השמים והארץ, ובכך שעשה אותם הם נעשו שלו.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"קֹנֵה שָׁמַיִם וָאָרֶץ\"?", "options": ["שֶׁעָשָׂה אוֹתָם, וּבְכָךְ הֵם נַעֲשׂוּ שֶׁלּוֹ", "שֶׁקָּנָה אוֹתָם מֵאֲחֵרִים כְּמוֹ שֶׁקּוֹנִים חֵפֶץ", "שֶׁהוּא עָתִיד לִקְנוֹת אוֹתָם בְּאַחֲרִית הַיָּמִים"], "kasha": "לא שייך לומר שה' \"קנה\" את העולם כאילו קנה אותו ממישהו.", "answer": "\"קנה\" כמו \"עשה שמים וארץ\"; על ידי שעשה אותם קנה אותם להיות שלו.", "kp": ["כמו עשה שמים וארץ", "על ידי עשיתן קנאן"]}]}, {"id": "14:20.1", "ch": 14, "v": 20, "n": 1, "dh": "אשר מגן", "pasuk_html": "וּבָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן <mark>אֲשֶׁר־מִגֵּ֥ן</mark> צָרֶ֖יךָ בְּיָדֶ֑ךָ וַיִּתֶּן־ל֥וֹ מַעֲשֵׂ֖ר מִכֹּֽל׃", "pasuk_en": "וּבָרוּךְ אֵל עֶלְיוֹן אֲשֶׁר־מִגֵּן צָרֶיךָ בְּיָדֶךָ וַיִּתֶּן־לוֹ מַעֲשֵׂר מִכֹּל׃", "rashi_he": "אשר מגן. אֲשֶׁר הִסְגִּיר, וְכֵן אֲמַגֶּנְךָ יִשְׂרָאֵל (הושע י\"א):", "rashi_en": "\"מגן\" כאן פירושו מסר, כלומר ה' מסר את האויבים בידו של אברם.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"אֲשֶׁרמִגֵּן צָרֶיךָ בְּיָדֶךָ\"?", "options": ["אֲשֶׁר מָסַר אֶת אוֹיְבֶיךָ בְּיָדֶךָ", "אֲשֶׁר הֵגֵן עָלֶיךָ מִפְּנֵי אוֹיְבֶיךָ", "אֲשֶׁר נָתַן בְּיָדֶךָ מָגֵן לַמִּלְחָמָה"], "kasha": "המילה \"מגן\" נראית כלשון הגנה, ואינה מתאימה ל\"צריך בידך\".", "answer": "\"מגן\" פירושו הסגיר, כמו \"אמגנך ישראל\".", "kp": ["אשר הסגיר", "וכן אמגנך ישראל"]}]}, {"id": "14:20.2", "ch": 14, "v": 20, "n": 2, "dh": "ויתן לו", "pasuk_html": "וּבָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר־מִגֵּ֥ן צָרֶ֖יךָ בְּיָדֶ֑ךָ <mark>וַיִּתֶּן־ל֥וֹ</mark> מַעֲשֵׂ֖ר מִכֹּֽל׃", "pasuk_en": "וּבָרוּךְ אֵל עֶלְיוֹן אֲשֶׁר־מִגֵּן צָרֶיךָ בְּיָדֶךָ וַיִּתֶּן־לוֹ מַעֲשֵׂר מִכֹּל׃", "rashi_he": "ויתן לו. אַבְרָהָם מעשר מכל אֲשֶׁר לוֹ, לְפִי שֶׁהָיָה כֹהֵן:", "rashi_en": "אברם הוא שנתן למלכי צדק מעשר מכל אשר לו, משום שמלכי צדק היה כהן.", "note": "", "points": [{"q": "מִי נָתַן מַעֲשֵׂר לְמִי, וּמַדּוּעַ?", "options": ["אַבְרָם נָתַן לְמַלְכִּי צֶדֶק, כִּי הָיָה כֹּהֵן", "מַלְכִּי צֶדֶק נָתַן לְאַבְרָם, כְּשָׂכָר עַל הַמִּלְחָמָה", "אַבְרָם נָתַן לְמֶלֶךְ סְדוֹם, לְהָשִׁיב לוֹ אֶת רְכוּשׁוֹ"], "kasha": "הפסוק אינו מפרש מי נתן את המעשר ולמי.", "answer": "אברהם נתן למלכי צדק מעשר מכל אשר לו, לפי שהיה כהן.", "kp": ["אברהם מעשר מכל אשר לו", "לפי שהיה כהן"]}]}, {"id": "14:21.1", "ch": 14, "v": 21, "n": 1, "dh": "תן לי הנפש", "pasuk_html": "וַיֹּ֥אמֶר מֶֽלֶךְ־סְדֹ֖ם אֶל־אַבְרָ֑ם <mark>תֶּן־לִ֣י הַנֶּ֔פֶשׁ</mark> וְהָרְכֻ֖שׁ קַֽח־לָֽךְ׃", "pasuk_en": "וַיֹּאמֶר מֶלֶךְ־סְדֹם אֶל־אַבְרָם תֶּן־לִי הַנֶּפֶשׁ וְהָרְכֻשׁ קַח־לָךְ׃", "rashi_he": "תן לי הנפש. מִן הַשְּׁבִי שֶׁלִּי שֶׁהִצַּלְתָּ, הַחֲזֵר לִי הַגּוּפִים לְבַדָּם:", "rashi_en": "מלך סדום ביקש מאברם שמתוך השבי שהציל יחזיר לו רק את האנשים, והרכוש יישאר אצל אברם.", "note": "", "points": [{"q": "מַה בִּיקֵּשׁ מֶלֶךְ סְדֹום בַּמִּילִּים \"תֶּןלִי הַנֶּפֶשׁ\"?", "options": ["שֶׁיַּחֲזִיר לוֹ רַק אֶת הָאֲנָשִׁים מִן הַשְּׁבִי", "שֶׁיַּחֲזִיר לוֹ אֶת כָּל הַשְּׁבִי וְאֶת כָּל הָרְכוּשׁ", "שֶׁייִּתֵּן לוֹ עֲבָדִים מִשֶּׁלּוֹ בִּמְקוֹם אֲנָשָׁיו"], "kasha": "לא ברור איזו \"נפש\" ביקש מלך סדום.", "answer": "מן השבי שלו שאברם הציל, ביקש שיחזיר לו את האנשים לבדם.", "kp": ["החזר לי הגופים לבדם"]}]}, {"id": "14:22.1", "ch": 14, "v": 22, "n": 1, "dh": "הרימתי ידי", "pasuk_html": "וַיֹּ֥אמֶר אַבְרָ֖ם אֶל־מֶ֣לֶךְ סְדֹ֑ם <mark>הֲרִימֹ֨תִי יָדִ֤י</mark> אֶל־יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָאָֽרֶץ׃", "pasuk_en": "וַיֹּאמֶר אַבְרָם אֶל־מֶלֶךְ סְדֹם הֲרִימֹתִי יָדִי אֶל־יְהוָה אֵל עֶלְיוֹן קֹנֵה שָׁמַיִם וָאָרֶץ׃", "rashi_he": "הרימתי ידי. לְשׁוֹן שְׁבוּעָה, מֵרִים אֲנִי אֶת יָדִי לְאֵל עֶלְיוֹן, וְכֵן בִּי נִשְׁבַּעְתִּי (בר' כ\"ב), נִשְׁבָּע אֲנִי, וְכֵן נָתַתִּי כֶּסֶף הַשָּׂדֶה קַח מִמֶּנִּי (שם כ\"ג), נוֹתֵן אֲנִי לְךָ כֶּסֶף הַשָּׂדֶה, קָחֵהוּ מִמֶּנִּי:", "rashi_en": "\"הרימתי ידי\" היא לשון שבועה, ופירושה בהווה: אני מרים את ידי ונשבע לה'. כך גם \"בי נשבעתי\" פירושו נשבע אני.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"הֲרִימֹתִי יָדִי\"?", "options": ["אֲנִי נִשְׁבָּע עַכְשָׁיו בְּהַרָמַת יָד לַה'", "כְּבָר נִשְׁבַּעְתִּי לַה' בֶּעָבָר עַל כָּךְ", "הִתְפַּלַּלְתִּי לַה' לִפְנֵי שֶׁיָּצָאתִי לַמִּלְחָמָה"], "kasha": "מה עניין הרמת היד כאן, ומדוע נאמר בלשון עבר?", "answer": "זו לשון שבועה: \"מרים אני את ידי לאל עליון\", כמו \"בי נשבעתי\" שפירושו נשבע אני.", "kp": ["לשון שבועה", "מרים אני את ידי"]}]}, {"id": "14:23.1", "ch": 14, "v": 23, "n": 1, "dh": "אם מחוט ועד שרוך נעל", "pasuk_html": "<mark>אִם־מִחוּט֙ וְעַ֣ד שְׂרֽוֹךְ־נַ֔עַל</mark> וְאִם־אֶקַּ֖ח מִכָּל־אֲשֶׁר־לָ֑ךְ וְלֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת־אַבְרָֽם׃", "pasuk_en": "אִם־מִחוּט וְעַד שְׂרוֹךְ־נַעַל וְאִם־אֶקַּח מִכָּל־אֲשֶׁר־לָךְ וְלֹא תֹאמַר אֲנִי הֶעֱשַׁרְתִּי אֶת־אַבְרָם׃", "rashi_he": "אם מחוט ועד שרוך נעל. אֲעַכֵּב לְעַצְמִי מִן הַשְּׁבִי:", "rashi_en": "אברם אמר שלא ישאיר לעצמו מן השבי אפילו חוט או שרוך נעל.", "note": "", "points": [{"q": "מִמַּה אָמַר אַבְרָם שֶׁלֹּא יִיקַּח אֲפִילוּ חוּט וּשְׂרוֹךְ נַעַל?", "options": ["מִן הַשְּׁבִי שֶׁהִצִּיל", "מֵאוֹצְרוֹת בֵּיתוֹ שֶׁל מֶלֶךְ סְדוֹם", "מִן הָרְכוּשׁ שֶׁנָּתַן לוֹ מַלְכִּי צֶדֶק"], "kasha": "הפסוק אינו מפרש ממה לא ייקח אברם.", "answer": "לא יעכב לעצמו מן השבי אפילו חוט או שרוך נעל.", "kp": ["אעכב לעצמי מן השבי"]}]}, {"id": "14:23.2", "ch": 14, "v": 23, "n": 2, "dh": "ואם אקח מכל אשר לך", "pasuk_html": "אִם־מִחוּט֙ וְעַ֣ד שְׂרֽוֹךְ־נַ֔עַל <mark>וְאִם־אֶקַּ֖ח מִכָּל־אֲשֶׁר־לָ֑ךְ</mark> וְלֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת־אַבְרָֽם׃", "pasuk_en": "אִם־מִחוּט וְעַד שְׂרוֹךְ־נַעַל וְאִם־אֶקַּח מִכָּל־אֲשֶׁר־לָךְ וְלֹא תֹאמַר אֲנִי הֶעֱשַׁרְתִּי אֶת־אַבְרָם׃", "rashi_he": "ואם אקח מכל אשר לך. וְאִם תֹּאמַר לָתֵת לִי שָׂכָר מִבֵּית גְּנָזֶיךָ, לֹא אֶקַּח:", "rashi_en": "אברם הוסיף שגם אם מלך סדום ירצה לתת לו שכר מאוצרותיו, לא יקבל.", "note": "", "points": [{"q": "מַה מוֹסִיף אַבְרָם בְּאוֹמְרוֹ \"וְאִםאֶקַּח מִכֹּלאֲשֶׁרלָךְ\"?", "options": ["שֶׁלֹּא יִיקַּח אֲפִילּוּ שָׂכָר מֵאוֹצְרוֹת מֶלֶךְ סְדוֹם", "שֶׁלֹּא יִיקַּח מִן הַשְּׁבִי אֲפִילּוּ דָּבָר קָטָן", "שֶׁלֹּא יִיקַּח אֶת הָאֲנָשִׁים שֶׁהִצִּיל מִן הַשְּׁבִי"], "kasha": "אברם כבר אמר שלא ייקח מן השבי, ומה הוסיף כאן?", "answer": "גם אם תרצה לתת לי שכר מבית גנזיך, לא אקח.", "kp": ["לתת לי שכר מבית גנזיך", "לא אקח"]}]}, {"id": "14:23.3", "ch": 14, "v": 23, "n": 3, "dh": "ולא תאמר וגו'", "pasuk_html": "אִם־מִחוּט֙ וְעַ֣ד שְׂרֽוֹךְ־נַ֔עַל וְאִם־אֶקַּ֖ח מִכָּל־אֲשֶׁר־לָ֑ךְ <mark>וְלֹ֣א תֹאמַ֔ר</mark> אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת־אַבְרָֽם׃", "pasuk_en": "אִם־מִחוּט וְעַד שְׂרוֹךְ־נַעַל וְאִם־אֶקַּח מִכָּל־אֲשֶׁר־לָךְ וְלֹא תֹאמַר אֲנִי הֶעֱשַׁרְתִּי אֶת־אַבְרָם׃", "rashi_he": "ולא תאמר וגו'. שֶׁהַקָּדוֹשׁ בָּרוּךְ הוּא הִבְטִיחַנִי לְעַשְּׁרֵנִי, שֶׁנֶּאֱמַר וַאֲבָרֶכְךָ וְגוֹ':", "rashi_en": "אברם לא רצה שמלך סדום יתפאר שהעשיר אותו, כי הקב\"ה כבר הבטיח לו לעשרו, כמו שנאמר \"ואברכך\".", "note": "", "points": [{"q": "מַדּוּעַ לֹא רָצָה אַבְרָם שֶׁמֶּלֶךְ סְדוֹם יֹאמַר \"אֲנִי הֶעֱשַׁרְתִּי אֶתְאַבְרָם\"?", "options": ["כִּי הַקָּב\"ה כְּבָר הִבְטִיחַ לוֹ שֶׁיַּעֲשִׁיר אוֹתוֹ", "כִּי חָשַׁשׁ שֶׁמֶּלֶךְ סְדוֹם יִדְרוֹשׁ מִמֶּנּוּ תַּשְׁלוּם", "כִּי רָצָה שֶׁהָעֹושֶׁר יִישָּׁאֵר אֵצֶל אַנְשֵׁי סְדוֹם"], "kasha": "מה אכפת לאברם אם מלך סדום יתפאר שהעשיר אותו?", "answer": "הקב\"ה הבטיח לו לעשרו, שנאמר \"ואברכך\", ולכן לא רצה שייאמר שמלך סדום העשירו.", "kp": ["הבטיחני לעשרני", "שנאמר ואברכך"]}]}, {"id": "14:24.1", "ch": 14, "v": 24, "n": 1, "dh": "הנערים", "pasuk_html": "בִּלְעָדַ֗י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ <mark>הַנְּעָרִ֔ים</mark> וְחֵ֙לֶק֙ הָֽאֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑י עָנֵר֙ אֶשְׁכֹּ֣ל וּמַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽם׃ (ס)", "pasuk_en": "בִּלְעָדַי רַק אֲשֶׁר אָכְלוּ הַנְּעָרִים וְחֵלֶק הָאֲנָשִׁים אֲשֶׁר הָלְכוּ אִתִּי עָנֵר אֶשְׁכֹּל וּמַמְרֵא הֵם יִקְחוּ חֶלְקָם׃", "rashi_he": "הנערים. עֲבָדַי אֲשֶׁר הָלְכוּ אִתִּי וְעוֹד עָנֵר אֶשְׁכֹּל וּמַמְרֵא וְגוֹ'; אַף עַל פִּי שֶׁעֲבָדַי נִכְנְסוּ לַמִּלְחָמָה, שֶׁנֶּאֱמַר הוּא וַעֲבָדָיו וַיַּכֵּם, וְעָנֵר וַחֲבֵרָיו יָשְׁבוּ עַל הַכֵּלִים לִשְׁמֹר, אֲפִלּוּ הָכִי הֵם יִקְחוּ חֶלְקָם. וּמִמֶּנּוּ לָמַד דָּוִד, שֶׁאָמַר כְּחֵלֶק הַיֹּרֵד בַּמִּלְחָמָה וּכְחֵלֶק הַיֹּשֵׁב עַל הַכֵּלִים יַחְדָּו יַחֲלֹקוּ (שמואל א ל'), וּלְכָךְ נֶאֱמַר וַיְהִי מֵהַיּוֹם הַהוּא וָמָעְלָה וַיְשִׂמֶהָ לְחֹק וּלְמִשְׁפָּט (שם), וְלֹא נֶאֱמַר וָהָלְאָה, לְפִי שֶׁכְּבָר נִתַּן הַחֹק בִּימֵי אַבְרָם:", "rashi_en": "\"הנערים\" הם עבדי אברם שנלחמו. ענר אשכל וממרא רק שמרו על הכלים, ובכל זאת יקבלו חלק. מכאן למד דוד שהיורד למלחמה והיושב על הכלים חולקים בשווה, וחוק זה כבר נקבע בימי אברם.", "note": "", "points": [{"q": "מַדּוּעַ יְקַבְּלוּ עָנֵר אֶשְׁכֹּל וּמַמְרֵא חֵלֶק, אַף שֶׁלֹּא נִלְחֲמוּ?", "options": ["כִּי שָׁמְרוּ עַל הַכֵּלִים, וְגַם הַשּׁוֹמֵר מְקַבֵּל חֵלֶק", "כִּי הָיוּ בַּעֲלֵי בְּרִיתוֹ שֶׁל אַבְרָם וְנִלְחֲמוּ עִמּוֹ", "כִּי אַבְרָם רָצָה לְהַכִּיר לָהֶם טוֹבָה עַל עֲצָתָם"], "kasha": "עבדי אברם הם שנכנסו למלחמה, ומדוע ענר וחבריו יקחו חלק?", "answer": "אף על פי שעבדי אברם נכנסו למלחמה, וענר וחבריו רק ישבו על הכלים לשמור, בכל זאת הם יקחו חלקם.", "kp": ["ישבו על הכלים לשמר", "אפלו הכי הם יקחו חלקם"]}, {"q": "מַדּוּעַ נֶאֱמַר אֵצֶל דָּוִד \"מֵהַיּוֹם הַהוּא וּמַעְלָה\" וְלֹא \"וְהָלְאָה\"?", "options": ["כִּי הַחֹוק כְּבָר נִיתַּן בִּימֵי אַבְרָם", "כִּי דָּוִד בִּיטֵּל אֶת הַחֹוק מֵאוֹתוֹ יוֹם", "כִּי הַחֹוק נָהַג רַק בִּימֵי דָּוִד עַצְמוֹ"], "kasha": "החוק שקבע דוד, שהיורד למלחמה והיושב על הכלים חולקים יחד, מקורו במעשה אברם.", "answer": "דוד למד מאברם שהיורד למלחמה והיושב על הכלים חולקים יחד, ולכן נאמר \"ומעלה\" ולא \"והלאה\", שכבר ניתן החוק בימי אברם.", "kp": ["וממנו למד דוד", "שכבר נתן החק בימי אברם"]}]}, {"id": "15:1.1", "ch": 15, "v": 1, "n": 1, "dh": "אחר הדברים האלה", "pasuk_html": "<mark>אַחַ֣ר ׀ הַדְּבָרִ֣ים הָאֵ֗לֶּה</mark> הָיָ֤ה דְבַר־יְהוָה֙ אֶל־אַבְרָ֔ם בַּֽמַּחֲזֶ֖ה לֵאמֹ֑ר אַל־תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔ךְ שְׂכָרְךָ֖ הַרְבֵּ֥ה מְאֹֽד׃", "pasuk_en": "אַחַר הַדְּבָרִים הָאֵלֶּה הָיָה דְבַר־יְהוָה אֶל־אַבְרָם בַּמַּחֲזֶה לֵאמֹר אַל־תִּירָא אַבְרָם אָנֹכִי מָגֵן לָךְ שְׂכָרְךָ הַרְבֵּה מְאֹד׃", "rashi_he": "אחר הדברים האלה. כָּל מָקוֹם שֶׁנֶאֱמַר אַחַר – סָמוּךְ, אַחֲרֵי – מֻפְלָג (בראשית רבה). אַחַר הַדְּבָרִים הָאֵלֶּה אַחַר שֶׁנַּעֲשָׂה לוֹ נֵס זֶה, שֶׁהָרַג אֶת הַמְּלָכִים וְהָיָה דוֹאֵג וְאוֹמֵר, שֶׁמָּא קִבַּלְתִּי שָׂכָר עַל כָּל צִדְקוֹתַי, לְכָךְ אָמַר לוֹ הַמָּקוֹם אַל תִּירָא אַבְרָם אָנֹכִי מָגֵן לָךְ, מִן הָעֹנֶשׁ, שֶׁלֹּא תֵּעָנֵשׁ עַל כָּל אוֹתָן נְפָשׁוֹת שֶׁהָרַגְתָּ; וּמַה שֶּׁאַתָּה דוֹאֵג עַל קִבּוּל שְׂכָרְךָ, שְׂכָרְךָ הַרְבֵּה מְאֹד (בראשית רבה):", "rashi_en": "\"אחר\" פירושו מיד, סמוך לנס שבו הרג אברם את המלכים. אברם דאג שמא קיבל כבר את שכר כל צדקותיו ושמא ייענש על האנשים שהרג, וה' הרגיע אותו שיגן עליו מעונש ושכרו הרבה מאד.", "note": "", "points": [{"q": "מַה מְלַמֶּדֶת הַמִּילָּה \"אַחַר\" בַּפָּסוּק?", "options": ["שֶׁהַדָּבָר בָּא מִיָּד, סָמוּךְ לְמִלְחֶמֶת הַמְּלָכִים", "שֶׁהַדָּבָר בָּא זְמַן רַב אַחֲרֵי הַמִּלְחָמָה", "שֶׁהַדָּבָר בָּא לִפְנֵי הַמִּלְחָמָה וְנִכְתַּב אַחֲרֶיהָ"], "kasha": "צריך לדעת מתי בא הדיבור הזה ביחס למעשה הקודם.", "answer": "כל מקום שנאמר \"אחר\" הוא סמוך, ו\"אחרי\" הוא מופלג; כלומר מיד אחרי הנס שהרג את המלכים.", "kp": ["אחר – סמוך", "אחר שנעשה לו נס זה"]}, {"q": "מִמַּה חָשַׁשׁ אַבְרָם, שֶׁבִּגְלָלוֹ אָמַר לוֹ ה' \"אַלְתִּירָא\"?", "options": ["שֶׁייֵּעָנֵשׁ עַל הַהֲרוּגִים וְשֶׁכְּבָר קִיבֵּל אֶת שְׂכָרוֹ", "שֶׁהַמְּלָכִים יַחְזְרוּ לְהִילָּחֵם בּוֹ וּבְלוֹט", "שֶׁלֹּא יִזְכֶּה לְבָנִים שֶׁיִּירְשׁוּ אֶת הָאָרֶץ"], "kasha": "מדוע היה אברם צריך הרגעה דווקא אחרי ניצחון גדול?", "answer": "אברם דאג שמא קיבל בנס הזה שכר על כל צדקותיו, ושמא ייענש על הנפשות שהרג; ה' אמר לו \"אנכי מגן לך\" מן העונש, ו\"שכרך הרבה מאד\".", "kp": ["שמא קבלתי שכר על כל צדקותי", "שלא תענש על כל אותן נפשות"]}]}, {"id": "15:2.1", "ch": 15, "v": 2, "n": 1, "dh": "הולך ערירי", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤י יֱהוִה֙ מַה־תִּתֶּן־לִ֔י וְאָנֹכִ֖י <mark>הוֹלֵ֣ךְ עֲרִירִ֑י</mark> וּבֶן־מֶ֣שֶׁק בֵּיתִ֔י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר׃", "pasuk_en": "וַיֹּאמֶר אַבְרָם אֲדֹנָי יֱהוִה מַה־תִּתֶּן־לִי וְאָנֹכִי הוֹלֵךְ עֲרִירִי וּבֶן־מֶשֶׁק בֵּיתִי הוּא דַּמֶּשֶׂק אֱלִיעֶזֶר׃", "rashi_he": "הולך ערירי. מְנַחֵם בֶּן סָרוּק פֵּרְשׁוֹ לְשׁוֹן יוֹרֵשׁ, וְחָבֵר לוֹ עֵר וְעֹנֶה (מלאכי ב'), עֲרִירִי, בְלֹא יוֹרֵשׁ, כַּאֲשֶׁר תֹּאמַר וּבְכָל תְּבוּאָתִי תְשָׁרֵשׁ (איוב ל\"א), תְּעַקֵּר שָׁרָשֶׁיהָ, כָּךְ לְשׁוֹן עֲרִירִי חֲסַר בָּנִים, ובלע\"ז דישאנפנטיש. וְלִי נִרְאֶה עֵר וְעֹנֶה מִגִּזְרַת וְלִבִּי עֵר (שיר השירים ה'), וַעֲרִירִי לְשׁוֹן חֻרְבָּן, וְכֵן עָרוּ עָרוּ (תה' קל\"ז), וְכֵן עָרוֹת יְסוֹד (חבקוק ג'), וְכֵן עַרְעֵר תִּתְעַרְעָר (ירמ' נ\"א), וְכֵן כִּי אַרְזָה עֵרָה (צפניה ב'):", "rashi_en": "מנחם בן סרוק פירש ש\"ערירי\" הוא חסר יורש. רש\"י חולק ומפרש ש\"ערירי\" הוא לשון חורבן, כמו \"ערו ערו\".", "note": "", "points": [{"q": "לְפִי דַּעַת רַשִׁ\"י עַצְמוֹ, מַה פֵּירוּשׁ \"עֲרִירִי\"?", "options": ["לְשׁוֹן חֻורְבָּן, כְּמוֹ \"עָרוּ עָרוּ\"", "לְשׁוֹן יוֹרֵשׁ, כְּמוֹ \"עֵר וַעֲנָה\"", "לְשׁוֹן הִתְעוֹרְרוּת, כְּמוֹ \"וְלִבִּי עֵר\""], "kasha": "המילה \"ערירי\" נדירה, וצריך לבאר את שורשה ואת משמעותה.", "answer": "מנחם פירש שערירי הוא בלא יורש, מלשון \"ער וענה\"; אבל לרש\"י נראה ש\"ער וענה\" הוא מלשון \"ולבי ער\", ו\"ערירי\" הוא לשון חורבן, כמו \"ערו ערו\".", "kp": ["וערירי לשון חרבן", "וכן ערו ערו"]}]}, {"id": "15:2.2", "ch": 15, "v": 2, "n": 2, "dh": "ובן משק ביתי", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤י יֱהוִה֙ מַה־תִּתֶּן־לִ֔י וְאָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י <mark>וּבֶן־מֶ֣שֶׁק בֵּיתִ֔י</mark> ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר׃", "pasuk_en": "וַיֹּאמֶר אַבְרָם אֲדֹנָי יֱהוִה מַה־תִּתֶּן־לִי וְאָנֹכִי הוֹלֵךְ עֲרִירִי וּבֶן־מֶשֶׁק בֵּיתִי הוּא דַּמֶּשֶׂק אֱלִיעֶזֶר׃", "rashi_he": "ובן משק ביתי. כְּתַרְגּוּמוֹ, שֶׁכָּל בֵּיתִי נִזּוֹן עַל פִּיו, כְּמוֹ וְעַל פִּיךָ יִשַּׁק (בר' מלכים א), אַפּוֹטְרוֹפּוֹס שֶׁלִּי, וְאִלּוּ הָיָה לִי בֵן, הָיָה בְנִי מְמֻנֶּה עַל שֶׁלִּי:", "rashi_en": "\"בן משק ביתי\" הוא האפוטרופוס, שכל בני הבית ניזונים על פיו. אברם אמר: אילו היה לי בן, הוא היה ממונה על רכושי.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וּבֶןמֶשֶׁק בֵּיתִי\"?", "options": ["הָאַפּוֹטְרוֹפּוֹס שֶׁכָּל בְּנֵי בֵיתִי נִיזוֹנִים עַל פִּיו", "הָעֶבֶד שֶׁמַּשְׁקֶה אֶת הַצֹּאן שֶׁל בֵּיתִי", "הַבֵּן שֶׁנּוֹלַד לִי מֵאַחַת הַשְּׁפָחוֹת"], "kasha": "הביטוי \"בן משק\" אינו מובן מעצמו.", "answer": "כתרגומו, שכל ביתו ניזון על פיו, כמו \"ועל פיך ישק\" – הוא האפוטרופוס; ואילו היה לאברם בן, היה בנו ממונה על רכושו.", "kp": ["שכל ביתי נזון על פיו", "אפוטרופוס שלי"]}]}, {"id": "15:2.3", "ch": 15, "v": 2, "n": 3, "dh": "דמשק", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤י יֱהוִה֙ מַה־תִּתֶּן־לִ֔י וְאָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּבֶן־מֶ֣שֶׁק בֵּיתִ֔י ה֖וּא <mark>דַּמֶּ֥שֶׂק</mark> אֱלִיעֶֽזֶר׃", "pasuk_en": "וַיֹּאמֶר אַבְרָם אֲדֹנָי יֱהוִה מַה־תִּתֶּן־לִי וְאָנֹכִי הוֹלֵךְ עֲרִירִי וּבֶן־מֶשֶׁק בֵּיתִי הוּא דַּמֶּשֶׂק אֱלִיעֶזֶר׃", "rashi_he": "דמשק. לְפִי הַתַּרְגּוּם מִדַּמֶּשֶׂק הָיָה, וּלְפִי מִ\"אַ שֶׁרָדַף הַמְּלָכִים עַד דַּמֶּשֶׂק. וּבַתַּלְמוּד דָרְשׁוּ נוֹטָרִיקוֹן דּוֹלֶה וּמַשְׁקֶה מִתּוֹרַת רַבּוֹ לַאֲחֵרִים:", "rashi_en": "לפי התרגום אליעזר היה מדמשק. לפי המדרש נקרא כך כי רדף אחרי המלכים עד דמשק, ובתלמוד דרשו \"דמשק\" כראשי תיבות של \"דולה ומשקה\" מתורת רבו לאחרים.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ, מַדּוּעַ נִקְרָא אֱלִיעֶזֶר \"דַּמֶּשֶׂק\"?", "options": ["כִּי רָדַף עִם אַבְרָם אַחֲרֵי הַמְּלָכִים עַד דַּמֶּשֶׂק", "כִּי נוֹלַד בְּעִיר דַּמֶּשֶׂק וְגָדַל בָּהּ", "כִּי הָיָה דּוֹלֶה וּמַשְׁקֶה מַיִם לַגְּמַלִּים"], "kasha": "מה פירוש הכינוי \"דמשק\" שניתן לאליעזר?", "answer": "לפי התרגום היה מדמשק; לפי מדרש אגדה – שרדף את המלכים עד דמשק; ובתלמוד דרשו \"דולה ומשקה\" מתורת רבו לאחרים.", "kp": ["שרדף המלכים עד דמשק"]}]}, {"id": "15:3.1", "ch": 15, "v": 3, "n": 1, "dh": "הן לי לא נתת זרע", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָ֔ם <mark>הֵ֣ן לִ֔י לֹ֥א נָתַ֖תָּה זָ֑רַע</mark> וְהִנֵּ֥ה בֶן־בֵּיתִ֖י יוֹרֵ֥שׁ אֹתִֽי׃", "pasuk_en": "וַיֹּאמֶר אַבְרָם הֵן לִי לֹא נָתַתָּה זָרַע וְהִנֵּה בֶן־בֵּיתִי יוֹרֵשׁ אֹתִי׃", "rashi_he": "הן לי לא נתת זרע. וּמַה תּוֹעֶלֶת בְּכָל אֲשֶׁר תִּתֵּן לִי?", "rashi_en": "אברם אמר: אם לא נתת לי זרע, מה תועלת יש לי בכל מה שתיתן לי?", "note": "", "points": [{"q": "מַה רָצָה אַבְרָם לוֹמַר בַּמִּילִּים \"הֵן לִי לֹא נָתַתָּה זָרַע\"?", "options": ["שֶׁאֵין לוֹ תּוֹעֶלֶת בְּכָל מַה שֶׁה' יִיתֵּן לוֹ", "שֶׁהוּא מְבַקֵּשׁ לְאַמֵּץ אֶת אֱלִיעֶזֶר כִּבְנוֹ", "שֶׁהוּא כְּבָר מִתְייָאֵשׁ מִכָּל הַבְטָחוֹת ה'"], "kasha": "מדוע חוזר אברם ואומר שלא ניתן לו זרע, אחרי שה' הבטיח לו \"שכרך הרבה מאד\"?", "answer": "אם אין לו זרע, מה תועלת יש בכל אשר ייתן לו ה'.", "kp": ["ומה תועלת בכל אשר תתן לי"]}]}, {"id": "15:5.1", "ch": 15, "v": 5, "n": 1, "dh": "ויוצא אתו החוצה", "pasuk_html": "<mark>וַיּוֹצֵ֨א אֹת֜וֹ הַח֗וּצָה</mark> וַיֹּ֙אמֶר֙ הַבֶּט־נָ֣א הַשָּׁמַ֗יְמָה וּסְפֹר֙ הַכּ֣וֹכָבִ֔ים אִם־תּוּכַ֖ל לִסְפֹּ֣ר אֹתָ֑ם וַיֹּ֣אמֶר ל֔וֹ כֹּ֥ה יִהְיֶ֖ה זַרְעֶֽךָ׃", "pasuk_en": "וַיּוֹצֵא אֹתוֹ הַחוּצָה וַיֹּאמֶר הַבֶּט־נָא הַשָּׁמַיְמָה וּסְפֹר הַכּוֹכָבִים אִם־תּוּכַל לִסְפֹּר אֹתָם וַיֹּאמֶר לוֹ כֹּה יִהְיֶה זַרְעֶךָ׃", "rashi_he": "ויוצא אתו החוצה. לְפִי פְּשׁוּטוֹ הוֹצִיאוֹ מֵאָהֳלוֹ לַחוּץ לִרְאוֹת הַכּוֹכָבִים, וּלְפִי מִדְרָשׁוֹ אָמַר לוֹ צֵא מֵאִצְטַגְנִינוּת שֶׁלְּךָ שֶׁרָאִיתָ בַּמַּזָּלוֹת שֶׁאֵינְךָ עָתִיד לְהַעֲמִיד בֵּן, אַבְרָם אֵין לוֹ בֵן, אֲבָל אַבְרָהָם יֵשׁ לוֹ בֵן, שָׂרַי לֹא תֵלֵד, אֲבָל שָׂרָה תֵלֵד; אֲנִי קוֹרֵא לָכֶם שֵׁם אַחֵר וְיִשְׁתַּנֶּה הַמַּזָּל. דָּ\"אַ הוֹצִיאוֹ מֵחֲלָלוֹ שֶׁל עוֹלָם וְהִגְבִּיהוֹ לְמַעְלָה מִן הַכּוֹכָבִים, וְזֶהוּ לְשׁוֹן הַבָּטָה מִלְמַעְלָה לְמַטָּה:", "rashi_en": "לפי הפשט, ה' הוציא את אברם מאהלו לראות את הכוכבים. לפי המדרש אמר לו לצאת מן האצטגנינות, כי שינוי השם משנה את המזל. ועוד פירוש: הגביה אותו מעל הכוכבים, ולכן נאמר \"הבט\", הסתכלות מלמעלה למטה.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ, מָה פֵּירוּשׁ \"וַיּוֹצֵא אֹתוֹ הַחוּצָה\"?", "options": ["צֵא מִן הָאִצְטַגְנִינוּת שֶׁרָאִיתָ בָּהּ שֶׁלֹּא יִהְיֶה לְךָ בֵּן", "הוֹצִיאוּ מִן הָאֹוהֶל כְּדֵי שֶׁיִּסְפֹּור אֶת הַכּוֹכָבִים", "הוֹצִיאוּ מֵאֶרֶץ כְּנַעַן כְּדֵי לְהַרְאוֹת לוֹ אֶרֶץ אַחֶרֶת"], "kasha": "מה משמעות היציאה \"החוצה\" בפסוק?", "answer": "אמר לו: צא מאצטגנינות שלך; אברם אין לו בן, אבל אברהם יש לו בן, ושרי לא תלד אבל שרה תלד – אני קורא לכם שם אחר וישתנה המזל.", "kp": ["צא מאצטגנינות שלך", "וישתנה המזל"]}, {"q": "לְפִי הַפֵּירוּשׁ הָאַחֵר, מָה מְלַמֶּדֶת הַמִּילָּה \"הַבֶּט\"?", "options": ["שֶׁאַבְרָם הִסְתַּכֵּל עַל הַכּוֹכָבִים מִלְמַעְלָה לְמַטָּה", "שֶׁאַבְרָם הִסְתַּכֵּל מִן הָאָרֶץ אֶל הַשָּׁמַיִם", "שֶׁאַבְרָם הִסְתַּכֵּל בַּמַּזָּלוֹת לָדַעַת אֶת עֲתִידוֹ"], "kasha": "לשון \"הבטה\" מורה על הסתכלות מלמעלה למטה, ואיך מסתכלים כך על הכוכבים?", "answer": "ה' הוציאו מחללו של עולם והגביהו למעלה מן הכוכבים, ולכן נאמר \"הבט\", שהיא הסתכלות מלמעלה למטה.", "kp": ["והגביהו למעלה מן הכוכבים", "הבטה מלמעלה למטה"]}]}, {"id": "15:6.1", "ch": 15, "v": 6, "n": 1, "dh": "והאמין בה'", "pasuk_html": "<mark>וְהֶאֱמִ֖ן בַּֽיהוָ֑ה</mark> וַיַּחְשְׁבֶ֥הָ לּ֖וֹ צְדָקָֽה׃", "pasuk_en": "וְהֶאֱמִן בַּיהוָה וַיַּחְשְׁבֶהָ לּוֹ צְדָקָה׃", "rashi_he": "והאמין בה'. לֹא שָׁאַל לוֹ אוֹת עַל זֹאת; אֲבָל עַל יְרֻשַּׁת הָאָרֶץ שָׁאַל לוֹ אוֹת וְאָמַר לוֹ בַּמָּה אֵדַע.", "rashi_en": "אברם האמין להבטחת הזרע בלי לבקש אות, אבל על ירושת הארץ ביקש אות ואמר \"במה אדע\".", "note": "", "points": [{"q": "מַה מַדְגִּישׁ הַפָּסוּק בְּאוֹמְרוֹ \"וְהֶאֱמִן בַּיהוָה\"?", "options": ["שֶׁלֹּא בִּיקֵּשׁ אוֹת עַל הַבְטָחַת הַזֶּרַע", "שֶׁלֹּא בִּיקֵּשׁ אוֹת גַּם עַל יְרֻושַּׁת הָאָרֶץ", "שֶׁהֶאֱמִין רַק אַחֲרֵי שֶׁרָאָה אֶת  מְשֻׁלָּשׁ וְתֹר וְגוֹזָל׃", "rashi_he": "עגלה משלשת. שְׁלשָׁה עֲגָלִים; רֶמֶז לִשְׁלֹשָׁה פָרִים, פַּר יוֹם הַכִּפּוּרִים וּפַר הֶעְלֵם דָּבָר שֶׁל צִבּוּר וְעֶגְלָה עֲרוּפָה:", "rashi_en": "\"עגלה משלשת\" היא שלושה עגלים, רמז לשלושה פרים: פר יום הכיפורים, פר העלם דבר של ציבור ועגלה ערופה.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"עֶגְלָה מְשֻׁלֶּשֶׁת\" לְפִי רַשִׁ\"י?", "options": ["שְׁלוֹשָׁה עֲגָלִים, רֶמֶז לִשְׁלוֹשָׁה פָּרִים", "עֶגְלָה אַחַת שֶׁהִיא בַּת שָׁלוֹשׁ שָׁנִים", "עֶגְלָה שֶׁהִיא הַשְּׁלִישִׁית שֶׁיָּלְדָה אִמָּהּ"], "kasha": "\"משלשת\" אינו מבואר: האם הכוונה לשלוש עגלות או לעגלה בת שלוש?", "answer": "שלושה עגלים, רמז לשלושה פרים: פר יום הכיפורים, פר העלם דבר של ציבור ועגלה ערופה.", "kp": ["שלשה עגלים", "רמז לשלשה פרים"]}]}, {"id": "15:9.2", "ch": 15, "v": 9, "n": 2, "dh": "ועז משלשת", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֗יו קְחָ֥ה לִי֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת <mark>וְעֵ֥ז מְשֻׁלֶּ֖שֶׁת</mark> וְאַ֣יִל מְשֻׁלָּ֑שׁ וְתֹ֖ר וְגוֹזָֽל׃", "pasuk_en": "וַיֹּאמֶר אֵלָיו קְחָה לִי עֶגְלָה מְשֻׁלֶּשֶׁת וְעֵז מְשֻׁלֶּשֶׁת וְאַיִל מְשֻׁלָּשׁ וְתֹר וְגוֹזָל׃", "rashi_he": "ועז משלשת. רֶמֶז לְשָׂעִיר הַנַּעֲשֶׂה בִּפְנִים וּשְׂעִירֵי מוּסָפִין שֶׁל מוֹעֵד וּשְׂעִיר חַטַּאת יָחִיד:", "rashi_en": "שלוש העזים רומזות לשעיר הנעשה בפנים ביום הכיפורים, לשעירי המוספים של המועדים ולשעיר חטאת של יחיד.", "note": "", "points": [{"q": "לְאֵילוּ קָרְבָּנוֹת רוֹמְזוֹת שָׁלוֹשׁ הָעִזִּים?", "options": ["הַשָּׂעִיר הַפְּנִימִי, שְׂעִירֵי הַמּוּסָפִים וּשְׂעִיר חַטַּאת יָחִיד", "שְׂעִיר הַמִּשְׁתַּלֵּחַ, שְׂעִיר רֹאשׁ חֹודֶשׁ וּשְׂעִיר נָשִׂיא", "אָשָׁם וַדַּאי, אָשָׁם תָּלוּי וְכִבְשַׂת חַטָּאת יָחִיד"], "kasha": "מה טעם ציווה ה' לקחת שלוש עזים?", "answer": "הן רמז לשעיר הנעשה בפנים, לשעירי מוספי המועד ולשעיר חטאת יחיד.", "kp": ["רמז לשעיר הנעשה בפנים", "ושעיר חטאת יחיד"]}]}, {"id": "15:9.3", "ch": 15, "v": 9, "n": 3, "dh": "ואיל משלש", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֗יו קְחָ֥ה לִי֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְעֵ֥ז מְשֻׁלֶּ֖שֶׁת <mark>וְאַ֣יִל מְשֻׁלָּ֑שׁ</mark> וְתֹ֖ר וְגוֹזָֽל׃", "pasuk_en": "וַיֹּאמֶר אֵלָיו קְחָה לִי עֶגְלָה מְשֻׁלֶּשֶׁת וְעֵז מְשֻׁלֶּשֶׁת וְאַיִל מְשֻׁלָּשׁ וְתֹר וְגוֹזָל׃", "rashi_he": "ואיל משלש. אֲשַׁם וַדַּאי וְאָשָׁם תָּלוּי וְכִבְשָׂה שֶׁל חַטַּאת יָחִיד:", "rashi_en": "שלושת האילים רומזים לאשם ודאי, לאשם תלוי ולכבשת חטאת של יחיד.", "note": "", "points": [{"q": "לְאֵילוּ קָרְבָּנוֹת רוֹמְזִים שְׁלֹושֶׁת הָאֵילִים?", "options": ["אָשָׁם וַדַּאי, אָשָׁם תָּלוּי וְכִבְשַׂת חַטָּאת יָחִיד", "עוֹלַת תָּמִיד, עוֹלַת מוּסָף וְעוֹלַת נְדָבָה", "הַשָּׂעִיר הַפְּנִימִי, שְׂעִירֵי הַמּוּסָפִים וְחַטַּאת יָחִיד"], "kasha": "מה טעם ציווה ה' לקחת שלושה אילים?", "answer": "הם רמז לאשם ודאי, לאשם תלוי ולכבשה של חטאת יחיד.", "kp": ["אשם ודאי ואשם תלוי"]}]}, {"id": "15:9.4", "ch": 15, "v": 9, "n": 4, "dh": "ותור וגוזל", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֗יו קְחָ֥ה לִי֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְעֵ֥ז מְשֻׁלֶּ֖שֶׁת וְאַ֣יִל מְשֻׁלָּ֑שׁ <mark>וְתֹ֖ר וְגוֹזָֽל׃</mark>", "pasuk_en": "וַיֹּאמֶר אֵלָיו קְחָה לִי עֶגְלָה מְשֻׁלֶּשֶׁת וְעֵז מְשֻׁלֶּשֶׁת וְאַיִל מְשֻׁלָּשׁ וְתֹר וְגוֹזָל׃", "rashi_he": "ותור וגוזל. תּוֹר וּבֶן יוֹנָה (בראשית רבה):", "rashi_en": "\"תור וגוזל\" הם תור ובן יונה.", "note": "", "points": [{"q": "מַהוּ הַ\"גוֹזָל\" שֶׁנֶּאֱמַר בַּפָּסוּק?", "options": ["בֶּן יוֹנָה", "אֶפְרוֹחַ שֶׁל תּוֹר", "אֶפְרוֹחַ שֶׁל כָּל עוֹף טָהוֹר"], "kasha": "\"גוזל\" הוא שם כללי לאפרוח, ולא ברור של איזה עוף.", "answer": "הגוזל הוא בן יונה, יחד עם התור.", "kp": ["תור ובן יונה"]}]}, {"id": "15:10.1", "ch": 15, "v": 10, "n": 1, "dh": "ויבתר אתם", "pasuk_html": "וַיִּֽקַּֽח־ל֣וֹ אֶת־כָּל־אֵ֗לֶּה <mark>וַיְבַתֵּ֤ר אֹתָם֙</mark> בַּתָּ֔וֶךְ וַיִּתֵּ֥ן אִישׁ־בִּתְר֖וֹ לִקְרַ֣את רֵעֵ֑הוּ וְאֶת־הַצִפֹּ֖ר לֹ֥א בָתָֽר׃", "pasuk_en": "וַיִּקַּח־לוֹ אֶת־כָּל־אֵלֶּה וַיְבַתֵּר אֹתָם בַּתָּוֶךְ וַיִּתֵּן אִישׁ־בִּתְרוֹ לִקְרַאת רֵעֵהוּ וְאֶת־הַצִפֹּר לֹא בָתָר׃", "rashi_he": "ויבתר אתם. חָלַק כָּל אֶחָד לִשְׁנֵי חֲלָקִים; וְאֵין הַמִּקְרָא יוֹצֵא מִידֵי פְשׁוּטוֹ, לְפִי שֶׁהָיָה כוֹרֵת בְּרִית עִמּוֹ לִשְׁמֹר הַבְטָחָתוֹ לְהוֹרִיש לְבָנָיו אֶת הָאָרֶץ כְּדִכְתִיב בַּיּוֹם הַהוּא כָּרַת ה' אֶת אַבְרָם בְּרִית לֵאמֹר וְגוֹמֵר, וְדֶרֶך כּוֹרְתֵי בְרִית לְחַלֵּק בְּהֵמָה וְלַעֲבֹר בֵּין בְּתָרֶיהָ, כְּמַה שֶּׁנֶּאֱמַר לְהַלָּן הָעֹבְרִים בֵּין בִּתְרֵי הָעֵגֶל (ירמיה ל\"ד), אַף כָּאן תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הוּא שְׁלוּחוֹ שֶׁל שְׁכִינָה, שֶׁהוּא אֵשׁ.", "rashi_en": "אברם חילק כל בהמה לשני חלקים, כדרך כורתי ברית שעוברים בין הבתרים. כאן ה' כרת עמו ברית להוריש לבניו את הארץ, והתנור והלפיד שעברו בין הגזרים היו שליח השכינה.", "note": "", "points": [{"q": "מַדּוּעַ חִילֵּק אַבְרָם אֶת הַבְּהֵמוֹת לִשְׁנֵי חֲלָקִים?", "options": ["כָּךְ נוֹהֲגִים כּוֹרְתֵי בְּרִית, לַעֲבֹור בֵּין הַבְּתָרִים", "כְּדֵי לְהַקְרִיב כָּל חֵלֶק כְּקָרְבָּן בִּפְנֵי עַצְמוֹ", "כְּדֵי לִרְמוֹז שֶׁהָאָרֶץ תִּתְחַלֵּק בֵּין שְׁנֵי בָּנָיו"], "kasha": "מה טעם יש בביתור הבהמות?", "answer": "ה' כרת עמו ברית לשמור הבטחתו להוריש לבניו את הארץ, ודרך כורתי ברית לחלק בהמה ולעבור בין בתריה; וכאן התנור והלפיד שעברו בין הגזרים הם שלוחו של השכינה.", "kp": ["ודרך כורתי ברית לחלק בהמה", "ולעבר בין בתריה"]}]}, {"id": "15:10.2", "ch": 15, "v": 10, "n": 2, "dh": "ואת הצפור לא בתר", "pasuk_html": "וַיִּֽקַּֽח־ל֣וֹ אֶת־כָּל־אֵ֗לֶּה וַיְבַתֵּ֤ר אֹתָם֙ בַּתָּ֔וֶךְ וַיִּתֵּ֥ן אִישׁ־בִּתְר֖וֹ לִקְרַ֣את רֵעֵ֑הוּ <mark>וְאֶת־הַצִפֹּ֖ר לֹ֥א בָתָֽר׃</mark>", "pasuk_en": "וַיִּקַּח־לוֹ אֶת־כָּל־אֵלֶּה וַיְבַתֵּר אֹתָם בַּתָּוֶךְ וַיִּתֵּן אִישׁ־בִּתְרוֹ לִקְרַאת רֵעֵהוּ וְאֶת־הַצִפֹּר לֹא בָתָר׃", "rashi_he": "ואת הצפור לא בתר. לְפִי שֶׁהָאֻמּוֹת נִמְשְׁלוּ לְפָרִים וְאֵילִים וּשְֹעִירִים, שֶׁנֶּאֱמַר סְבָבוּנִי פָּרִים רַבִּים וְגוֹ' (תהל' כ\"ב), וְאוֹמֵר הָאַיִל אֲשֶׁר רָאִיתָ בַּעַל הַקְּרָנָיִם מַלְכֵי מָדַי וּפָרָס (דניאל ח'), וְאוֹמֵר וְהַצָּפִיר הַשָּׂעִיר מֶלֶךְ יָוָן (שם), וְיִשְֹרָאֵל נִמְשְׁלוּ לִבְנֵי יוֹנָה, שֶׁנֶּאֱמַר יוֹנָתִי בְּחַגְוֵי הַסֶּלַע (שיר השירים ב'), לְפִיכָךְ בִּתֵּר הַבְּהֵמוֹת, רֶמֶז שֶׁיִּהְיוּ הָאֻמּוֹת כָּלִים וְהוֹלְכִים, ואת הצפור לא בתר, רֶמֶז שֶׁיִּהְיוּ יִשְֹרָאֵל קַיָּמִין לְעוֹלָם:", "rashi_en": "העמים נמשלו לפרים, אילים ושעירים, וישראל נמשלו ליונה. ביתור הבהמות רומז שהעמים יכלו והולכים, ואי-ביתור הצפור רומז שישראל יתקיימו לעולם.", "note": "", "points": [{"q": "מַדּוּעַ לֹא בִּיתֵּר אַבְרָם אֶת הַצִּפּוֹר?", "options": ["רָמַז שֶׁיִּשְׂרָאֵל, הַנִּמְשָׁלִים לְיוֹנָה, יִתְקַיְּימוּ לְעוֹלָם", "כִּי אֵין דֶּרֶךְ לְבַתֵּר עוֹפוֹת כְּשֶׁמַּקְרִיבִים אוֹתָם", "רָמַז שֶׁבְּנֵי אַבְרָהָם לֹא יִגְלוּ לְעוֹלָם מִן הָאָרֶץ"], "kasha": "מדוע שינה אברם בין הבהמות לבין הצפור?", "answer": "העמים נמשלו לפרים, אילים ושעירים, וישראל לבני יונה; ביתור הבהמות רומז שהעמים כלים והולכים, ואי-ביתור הצפור רומז שישראל קיימים לעולם.", "kp": ["וישראל נמשלו לבני יונה", "שיהיו ישראל קימין לעולם"]}]}, {"id": "15:11.1", "ch": 15, "v": 11, "n": 1, "dh": "העיט", "pasuk_html": "וַיֵּ֥רֶד <mark>הָעַ֖יִט</mark> עַל־הַפְּגָרִ֑ים וַיַּשֵּׁ֥ב אֹתָ֖ם אַבְרָֽם׃", "pasuk_en": "וַיֵּרֶד הָעַיִט עַל־הַפְּגָרִים וַיַּשֵּׁב אֹתָם אַבְרָם׃", "rashi_he": "העיט. הוּא עוֹף, עַל שֵׁם שֶׁהוּא עָט וְשׁוֹאֵף אֶל הַנְּבֵלוֹת לָטוּשׂ עֲלֵי אֹכֶל, כְּמוֹ וַתַּעַט אֶל הַשָּׁלָל (שמואל א ט\"ו):", "rashi_en": "העיט הוא עוף, ונקרא כך משום שהוא עט ומתנפל על הנבלות כדי לאכול, כמו \"ותעט אל השלל\".", "note": "", "points": [{"q": "מַדּוּעַ נִקְרָא הָעוֹף \"עַיִט\"?", "options": ["כִּי הוּא עָט וְשׁוֹאֵף אֶל הַנְּבֵלוֹת", "כִּי הוּא עָף גָּבוֹהַּ מֵעַל כָּל הָעוֹפוֹת", "כִּי הוּא נִיזוֹן רַק מֵעוֹפוֹת קְטַנִּים"], "kasha": "מהו \"העיט\" ומה מקור שמו?", "answer": "זהו עוף, ונקרא כך משום שהוא עט ושואף אל הנבלות לעוט על האוכל, כמו \"ותעט אל השלל\".", "kp": ["שהוא עט ושואף אל הנבלות"]}]}, {"id": "15:11.2", "ch": 15, "v": 11, "n": 2, "dh": "על הפגרים", "pasuk_html": "וַיֵּ֥רֶד הָעַ֖יִט <mark>עַל־הַפְּגָרִ֑ים</mark> וַיַּשֵּׁ֥ב אֹתָ֖ם אַבְרָֽם׃", "pasuk_en": "וַיֵּרֶד הָעַיִט עַל־הַפְּגָרִים וַיַּשֵּׁב אֹתָם אַבְרָם׃", "rashi_he": "על הפגרים. עַל הַבְּתָרִים. הַפְּגָרִים מְתַרְגְּמִינָן פַּגְלַיָּא, אֶלָּא מִתּוֹךְ שֶׁהֻרְגְּלוּ לְתַרְגֵּם \"איש בִּתְרוֹ\" וִיהַב פַּלְגַּיָּא, נִתְחַלֵּף לָהֶם תֵּבַת פַּגְלַיָּא לְפַלְגַּיָּא, וְתִרְגְּמוּ הַפְּגָרִים פַּלְגַּיָּא; וְכָל הַמְתַרְגֵּם כֵּן טוֹעֶה, לְפִי שֶׁאֵין לְהַקִּיש בְּתָרִים לִפְגָרִים, שֶׁבְּתָרִים תַּרְגּוּמוֹ פַּלְגַּיָּא, וּפְגָרִים תַּרְגּוּמוֹ פַּגְלַיָּא, לְשׁוֹן פִּגּוּל, כְּמוֹ פִּגּוּל הוּא (ויקרא ז') לְ' פֶּגֶר:", "rashi_en": "\"הפגרים\" הם הבתרים. התרגום הנכון של \"פגרים\" הוא \"פגליא\", מלשון פיגול, ומי שמתרגם \"פלגיא\" כמו \"בתרים\" טועה.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, אֵיךְ צָרִיךְ לְתַרְגֵּם \"הַפְּגָרִים\"?", "options": ["פַּגְלְיָא, מִלְּשׁוֹן פִּיגּוּל", "פַּלְגְּיָא, כְּמוֹ בְּתָרִים", "נַבְלְיָא, מִלְּשׁוֹן נְבֵלָה"], "kasha": "מאחר שהעיט ירד על הבתרים, יש שתרגמו \"פגרים\" כמו \"בתרים\".", "answer": "הפגרים הם הבתרים, אבל תרגומם \"פגליא\" מלשון פיגול ולא \"פלגיא\"; המתרגם \"פלגיא\" טועה, כי אין להשוות בתרים לפגרים.", "kp": ["ופגרים תרגומו פגליא", "וכל המתרגם כן טועה"]}]}, {"id": "15:11.3", "ch": 15, "v": 11, "n": 3, "dh": "וישב", "pasuk_html": "וַיֵּ֥רֶד הָעַ֖יִט עַל־הַפְּגָרִ֑ים <mark>וַיַּשֵּׁ֥ב</mark> אֹתָ֖ם אַבְרָֽם׃", "pasuk_en": "וַיֵּרֶד הָעַיִט עַל־הַפְּגָרִים וַיַּשֵּׁב אֹתָם אַבְרָם׃", "rashi_he": "וישב. לְשׁוֹן נְשִׁיבָה וְהַפְרָחָה, כְּמוֹ יַשֵּׁב רוּחוֹ (תה' קמ\"ז), רֶמֶז שֶׁיָּבֹא דָוִד בֶּן יִשַּׁי לְכַלּוֹתָם, וְאֵין מַנִּיחִין אוֹתוֹ מִן הַשָּׁמַיִם עַד שֶׁיָּבֹא מֶלֶךְ הַמָּשִׁיחַ:", "rashi_en": "\"וישב\" פירושו הפריח, מלשון נשיבת רוח. הדבר רומז שדוד ירצה לכלות את העמים, אך מן השמים לא יניחו לו עד שיבוא מלך המשיח.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וַיַּשֵּׁב\" בַּפָּסוּק?", "options": ["הִפְרִיחַ אוֹתָם, מִלְּשׁוֹן נְשִׁיבַת רוּחַ", "יָשַׁב לְיַדָּם כְּדֵי לִשְׁמוֹר עֲלֵיהֶם", "הֶחֱזִיר אוֹתָם אֶל מְקוֹמָם הָרִאשׁוֹן"], "kasha": "\"וישב\" יכול להתפרש כלשון ישיבה או כלשון השבה.", "answer": "זו לשון נשיבה והפרחה, כמו \"ישב רוחו\".", "kp": ["לשון נשיבה והפרחה", "כמו ישב רוחו"]}, {"q": "לָמָּה רוֹמֶזֶת הַבְרָחַת הָעַיִט מֵעַל הַפְּגָרִים?", "options": ["דָּוִד יִרְצֶה לְכַלּוֹת אֶת הָעַמִּים, וְלֹא יַנִּיחוּהוּ עַד הַמָּשִׁיחַ", "יִשְׂרָאֵל יִגְלוּ מֵאַרְצָם וְיַחְזְרוּ אֵלֶיהָ מִיָּד", "אַבְרָם עַצְמוֹ יִנְצַח אֶת כָּל הָעַמִּים בְּחַיָּיו"], "kasha": "יש לבאר מה מרמזת ירידת העיט והברחתו במעמד הברית.", "answer": "רמז שיבוא דוד בן ישי לכלות את העמים, ומן השמים אין מניחים אותו עד שיבוא מלך המשיח.", "kp": ["שיבא דוד בן ישי לכלותם", "עד שיבא מלך המשיח"]}]}, {"id": "15:12.1", "ch": 15, "v": 12, "n": 1, "dh": "והנה אימה וגו'", "pasuk_html": "וַיְהִ֤י הַשֶּׁ֙מֶשׁ֙ לָב֔וֹא וְתַרְדֵּמָ֖ה נָפְלָ֣ה עַל־אַבְרָ֑ם <mark>וְהִנֵּ֥ה אֵימָ֛ה</mark> חֲשֵׁכָ֥ה גְדֹלָ֖ה נֹפֶ֥לֶת עָלָֽיו׃", "pasuk_en": "וַיְהִי הַשֶּׁמֶשׁ לָבוֹא וְתַרְדֵּמָה נָפְלָה עַל־אַבְרָם וְהִנֵּה אֵימָה חֲשֵׁכָה גְדֹלָה נֹפֶלֶת עָלָיו׃", "rashi_he": "והנה אימה וגו'. רֶמֶז לְצָרוֹת וְחשֶׁךְ שֶׁל גָּלִיּוֹת:", "rashi_en": "האימה והחשכה שנפלו על אברם בזמן הברית רמזו לו על הצרות והחושך שיעברו על זרעו בגלויות.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַה מְסַמֶּלֶת הָאֵימָה וְהַחֲשֵׁכָה שֶׁנָּפְלָה עַל אַבְרָם?", "options": ["אֶת הַצָּרוֹת וְהַחֹושֶׁךְ שֶׁל הַגָּלֻויּוֹת שֶׁיַּעַבְרוּ עַל זַרְעוֹ", "אֶת הַפַּחַד שֶׁל אַבְרָם מֵהַמְּלָכִים שֶׁנִּלְחַם בָּהֶם", "אֶת הַחֹושֶׁךְ הַטִבְעִי שֶׁל שְׁעַת הַשְּׁקִיעָה"], "kasha": "מדוע נפלה על אברם דווקא אימה וחשכה גדולה בשעת כריתת הברית?", "answer": "זה היה רמז לצרות ולחושך של הגלויות שעתידים לעבור על ישראל.", "kp": ["רמז לצרות וחשך של גליות"]}]}, {"id": "15:13.1", "ch": 15, "v": 13, "n": 1, "dh": "כי גר יהיה זרעך", "pasuk_html": "וַיֹּ֣אמֶר לְאַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע <mark>כִּי־גֵ֣ר ׀ יִהְיֶ֣ה זַרְעֲךָ֗</mark> בְּאֶ֙רֶץ֙ לֹ֣א לָהֶ֔ם וַעֲבָד֖וּם וְעִנּ֣וּ אֹתָ֑ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה׃", "pasuk_en": "וַיֹּאמֶר לְאַבְרָם יָדֹעַ תֵּדַע כִּי־גֵר יִהְיֶה זַרְעֲךָ בְּאֶרֶץ לֹא לָהֶם וַעֲבָדוּם וְעִנּוּ אֹתָם אַרְבַּע מֵאוֹת שָׁנָה׃", "rashi_he": "כי גר יהיה זרעך. מִשֶּׁנּוֹלַד יִצְחָק עַד שֶׁיָּצְאוּ יִשְֹרָאֵל מִמִּצְרַיִם אַרְבַּע מֵאוֹת שָׁנָה כֵּיצַד? יִצְחָק בֶּן שִׁשִּׁים שָׁנָה כְּשֶׁנּוֹלַד יַעֲקֹב, וְיַעֲקֹב כְּשֶׁיָּרַד לְמִצְרַיִם אָמַר יְמֵי שְׁנֵי מְגוּרַי שְׁלֹשִׁים וּמְאַת שָׁנָה, הֲרֵי ק\"צ, וּבְמִצְרַיִם הָיוּ מָאתַיִם וְעֶשֶׂר \" מיותרת לכאורה, שהרי היה אפשר לכתוב רק \"את הגוי\".", "answer": "\"וגם\" מרבה את ארבע המלכויות, שאף הן יכלו על ששעבדו את ישראל.", "kp": ["וגם לרבות ד' מלכיות", "על ששעבדו את ישראל"]}]}, {"id": "15:14.2", "ch": 15, "v": 14, "n": 2, "dh": "דן אנכי", "pasuk_html": "וְגַ֧ם אֶת־הַגּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ <mark>דָּ֣ן אָנֹ֑כִי</mark> וְאַחֲרֵי־כֵ֥ן יֵצְא֖וּ בִּרְכֻ֥שׁ גָּדֽוֹל׃", "pasuk_en": "וְגַם אֶת־הַגּוֹי אֲשֶׁר יַעֲבֹדוּ דָּן אָנֹכִי וְאַחֲרֵי־כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל׃", "rashi_he": "דן אנכי. בְּעֶשֶׂר מַכּוֹת:", "rashi_en": "הדין שה' עתיד לדון את מצרים הוא עשר המכות.", "note": "", "points": [{"q": "בַּמֶּה לְפִי רַשִׁ\"י יָדוּן ה' אֶת הַגּוֹי הַמְשַׁעְבֵּד?", "options": ["בְּעֶשֶׂר הַמַּכּוֹת", "בִּטְבִיעָה בְּיַם סוּף", "בְּגָלוּת מֵאַרְצוֹ"], "kasha": "הפסוק אומר \"דן אנכי\" ואינו מפרש מהו הדין.", "answer": "הדין הוא עשר המכות שהביא ה' על מצרים.", "kp": ["בעשר מכות"]}]}, {"id": "15:14.3", "ch": 15, "v": 14, "n": 3, "dh": "ברכש גדול", "pasuk_html": "וְגַ֧ם אֶת־הַגּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְאַחֲרֵי־כֵ֥ן יֵצְא֖וּ <mark>בִּרְכֻ֥שׁ גָּדֽוֹל׃</mark>", "pasuk_en": "וְגַם אֶת־הַגּוֹי אֲשֶׁר יַעֲבֹדוּ דָּן אָנֹכִי וְאַחֲרֵי־כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל׃", "rashi_he": "ברכש גדול. בְּמָמוֹן גָּדוֹל, כְּמוֹ שֶׁנֶּאֱמַר וַיְנַצְּלוּ אֶת מִצְרָיִם (שמות י\"ב):", "rashi_en": "\"רכש גדול\" פירושו ממון רב, כמו שנאמר ביציאת מצרים \"וינצלו את מצרים\".", "note": "", "points": [{"q": "מַהוּ \"רְכֻשׁ גָּדוֹל\" שֶׁעִמּוֹ יָצְאוּ יִשְׂרָאֵל לְפִי רַשִׁ\"י?", "options": ["מָמוֹן רַב שֶׁלָּקְחוּ מִמִּצְרַיִם", "בְּהֵמוֹת וָצֹאן רַבִּים מְאוֹד", "כָּבוֹד וְשֵׁם טוֹב בֵּין הָעַמִּים"], "kasha": "המילה \"רכש\" אינה מפורשת, ולא ברור מה הוא הרכוש הזה.", "answer": "רכש גדול הוא ממון רב, כמו שנאמר \"וינצלו את מצרים\".", "kp": ["בממון גדול", "וינצלו את מצרים"]}]}, {"id": "15:15.1", "ch": 15, "v": 15, "n": 1, "dh": "ואתה תבוא", "pasuk_html": "<mark>וְאַתָּ֛ה תָּב֥וֹא</mark> אֶל־אֲבֹתֶ֖יךָ בְּשָׁל֑וֹם תִּקָּבֵ֖ר בְּשֵׂיבָ֥ה טוֹבָֽה׃", "pasuk_en": "וְאַתָּה תָּבוֹא אֶל־אֲבֹתֶיךָ בְּשָׁלוֹם תִּקָּבֵר בְּשֵׂיבָה טוֹבָה׃", "rashi_he": "ואתה תבוא. וְלֹא תִרְאֶה כָּל אֵלֶה:", "rashi_en": "ה' מבטיח לאברם שימות לפני שיבואו כל הצרות האלה, ולכן לא יראה אותן.", "note": "", "points": [{"q": "מַה מוֹסִיף רַשִׁ\"י בַּהַבְטָחָה \"וְאַתָּה תָּבוֹא\"?", "options": ["שֶׁאַבְרָם לֹא יִרְאֶה אֶת כָּל הַצָּרוֹת שֶׁנֶּאֶמְרוּ", "שֶׁאַבְרָם יִזְכֶּה לִרְאוֹת אֶת יְצִיאַת מִצְרַיִם", "שֶׁאַבְרָם יִיקָּבֵר בְּאֶרֶץ מִצְרַיִם עִם זַרְעוֹ"], "kasha": "מדוע מזכיר הפסוק את מות אברם מיד אחרי תיאור הגלות?", "answer": "כדי לומר לו שימות קודם לכן ולא יראה את כל הצרות האלה.", "kp": ["ולא תראה כל אלה"]}]}, {"id": "15:15.2", "ch": 15, "v": 15, "n": 2, "dh": "אל אבותיך", "pasuk_html": "וְאַתָּ֛ה תָּב֥וֹא <mark>אֶל־אֲבֹתֶ֖יךָ</mark> בְּשָׁל֑וֹם תִּקָּבֵ֖ר בְּשֵׂיבָ֥ה טוֹבָֽה׃", "pasuk_en": "וְאַתָּה תָּבוֹא אֶל־אֲבֹתֶיךָ בְּשָׁלוֹם תִּקָּבֵר בְּשֵׂיבָה טוֹבָה׃", "rashi_he": "אל אבותיך. אָבִיו עוֹבֵד עֲ\"זָ וְהוּא מְבַשְּׂרוֹ שֶׁיָּבֹא אֵלָיו? לִמֶּדְךָ שֶׁעָשָׂה תֶּרַח תְּשׁוּבָה:", "rashi_en": "אביו של אברם, תרח, היה עובד עבודה זרה, ובכל זאת ה' מבשר לאברם שיבוא אליו. מכאן לומדים שתרח עשה תשובה.", "note": "", "points": [{"q": "מַה לוֹמֵד רַשִׁ\"י מִכָּךְ שֶׁה' מְבַשֵּׂר לְאַבְרָם שֶׁיָּבוֹא אֶל אֲבוֹתָיו?", "options": ["שֶׁתֶּרַח אָבִיו עָשָׂה תְּשׁוּבָה", "שֶׁאַבְרָם יִיקָּבֵר בְּחָרָן לְיַד אָבִיו", "שֶׁגַּם אֲבוֹתָיו שֶׁל אַבְרָם הָיוּ נְבִיאִים"], "kasha": "תרח היה עובד עבודה זרה, ואיך תיחשב בשורה טובה לאברם שיבוא אליו?", "answer": "מכאן שתרח עשה תשובה, ולכן זו בשורה טובה.", "kp": ["אביו עובד ע\"ז", "שעשה תרח תשובה"]}]}, {"id": "15:15.3", "ch": 15, "v": 15, "n": 3, "dh": "תקבר בשיבה טובה", "pasuk_html": "וְאַתָּ֛ה תָּב֥וֹא אֶל־אֲבֹתֶ֖יךָ בְּשָׁל֑וֹם <mark>תִּקָּבֵ֖ר בְּשֵׂיבָ֥ה טוֹבָֽה׃</mark>", "pasuk_en": "וְאַתָּה תָּבוֹא אֶל־אֲבֹתֶיךָ בְּשָׁלוֹם תִּקָּבֵר בְּשֵׂיבָה טוֹבָה׃", "rashi_he": "תקבר בשיבה טובה. בִּשְּׂרוֹ שֶׁיַּעֲשֶׂה יִשְׁמָעֵאל תְּשׁוּבָה בְּיָמָיו, וְלֹא יֵצֵא עֵשָׂו לְתַרְבּוּת רָעָה בְּיָמָיו; וּלְפִיכָךְ מֵת ה' שָׁנִים קֹדֶם זְמַנּוֹ, וּבוֹ בַיּוֹם מָרַד עֵשָׂו:", "rashi_en": "\"שיבה טובה\" היא הבשורה שישמעאל יעשה תשובה בימי אברהם, ושעשו לא יצא לתרבות רעה בימיו. לכן מת אברהם חמש שנים לפני זמנו, ובאותו יום מרד עשו.", "note": "", "points": [{"q": "מַה הוֹפֵךְ אֶת שֵׂיבָתוֹ שֶׁל אַבְרָם לְ\"שֵׂיבָה טוֹבָה\" לְפִי רַשִׁ\"י?", "options": ["שֶׁיִּשְׁמָעֵאל יַחֲזוֹר בִּתְשׁוּבָה וְעֵשָׂו לֹא יֶחֱטָא בְּיָמָיו", "שֶׁיִּזְכֶּה לַאֲרִיכוּת יָמִים בִּבְרִיאוּת וּבְעֹושֶׁר", "שֶׁיִּזְכֶּה לִרְאוֹת אֶת זַרְעוֹ יוֹרֵשׁ אֶת הָאָרֶץ"], "kasha": "מה מיוחד בשיבה זו שהיא נקראת \"טובה\"?", "answer": "ה' בישר לו שישמעאל יעשה תשובה בימיו, ושעשו לא יצא לתרבות רעה בימיו.", "kp": ["בשרו שיעשה ישמעאל תשובה בימיו", "ולא יצא עשו לתרבות רעה"]}, {"q": "לְפִי רַשִׁ\"י, מַדּוּעַ מֵת אַבְרָהָם חָמֵשׁ שָׁנִים לִפְנֵי זְמַנּוֹ?", "options": ["כְּדֵי שֶׁלֹּא יִרְאֶה אֶת עֵשָׂו יוֹצֵא לְתַרְבּוּת רָעָה", "כְּעוֹנֶשׁ עַל שֶׁלֹּא הִתְפַּלֵּל עַל שָׂרָה", "כִּי יִשְׁמָעֵאל לֹא עָשָׂה תְּשׁוּבָה בִּזְמַן"], "kasha": "איך התקיימה ההבטחה שעשו לא יחטא בימי אברהם?", "answer": "אברהם מת חמש שנים קודם זמנו, ובו ביום מרד עשו.", "kp": ["ולפיכך מת ה' שנים קדם זמנו", "ובו ביום מרד עשו"]}]}, {"id": "15:16.1", "ch": 15, "v": 16, "n": 1, "dh": "ודור רביעי", "pasuk_html": "<mark>וְד֥וֹר רְבִיעִ֖י</mark> יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא־שָׁלֵ֛ם עֲוֺ֥ן הָאֱמֹרִ֖י עַד־הֵֽנָּה׃", "pasuk_en": "וְדוֹר רְבִיעִי יָשׁוּבוּ הֵנָּה כִּי לֹא־שָׁלֵם עֲוֺן הָאֱמֹרִי עַד־הֵנָּה׃", "rashi_he": "ודור רביעי. לְאַחַר שֶׁיִּגְלוּ לְמִצְרַיִם יִהְיוּ שָׁם ג' דּוֹרוֹת, וְהָרְבִיעִי יָשׁוּבוּ לָאָרֶץ הַזֹּאת, לְפִי שֶׁבְּאֶרֶץ כְּנַעַן הָיָה מְדַבֵּר עִמּוֹ, וְכָרַת בְּרִית זוֹ, כְּדִכְתִיב: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ. וְכֵן הָיָה: יַעֲקֹב יָרַד לְמִצְרַיִם, צֵא וַחֲשֹׁב דּוֹרוֹתָיו: יְהוּדָה, פֶּרֶץ, וְחֶצְרוֹן, וְכָלֵב בֶּן חֶצְרוֹן מִבָּאֵי הָאָרֶץ הָיָה:", "rashi_en": "אחרי שירדו ישראל למצרים יהיו שם שלושה דורות, והדור הרביעי ישוב לארץ כנען, שבה נכרתה הברית. וכך היה: יהודה, פרץ, חצרון, וכלב בן חצרון נכנס לארץ.", "note": "", "points": [{"q": "מֵאֵיזוֹ נְקוּדָה נִמְנִים אַרְבַּעַת הַדּוֹרוֹת לְפִי רַשִׁ\"י, וּמִי הַדּוֹר הָרְבִיעִי?", "options": ["מֵהַיְּרִידָה לְמִצְרַיִם, וְהָרְבִיעִי הוּא כָּלֵב בֶּן חֶצְרוֹן", "מִלֵּידַת יִצְחָק, וְהָרְבִיעִי הוּא לֵוִי בֶּן יַעֲקֹב", "מִלֵּידַת אַבְרָם, וְהָרְבִיעִי הוּא יְהוּדָה בֶּן יַעֲקֹב"], "kasha": "הפסוק אומר \"ודור רביעי\" ואינו מפרש ממתי מונים את הדורות ולאן ישובו.", "answer": "מונים מהגלות למצרים: יהודה, פרץ וחצרון היו שם, והרביעי, כלב בן חצרון, היה מבאי הארץ.", "kp": ["והרביעי ישובו לארץ הזאת", "וכלב בן חצרון מבאי הארץ היה"]}]}, {"id": "15:16.2", "ch": 15, "v": 16, "n": 2, "dh": "כי לא שלם עון האמרי", "pasuk_html": "וְד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה <mark>כִּ֧י לֹא־שָׁלֵ֛ם עֲוֺ֥ן הָאֱמֹרִ֖י</mark> עַד־הֵֽנָּה׃", "pasuk_en": "וְדוֹר רְבִיעִי יָשׁוּבוּ הֵנָּה כִּי לֹא־שָׁלֵם עֲוֺן הָאֱמֹרִי עַד־הֵנָּה׃", "rashi_he": "כי לא שלם עון האמרי. לִהְיוֹת מִשְׁתַּלֵּחַ מֵאַרְצוֹ עַד אוֹתוֹ זְמַן, שֶׁאֵין הַקָּבָּ\"ה נִפְרָע מֵאֻמָּה עַד שֶׁתִּתְמַלֵּא סְאָתָהּ, שֶׁנֶּאֱמַר בְּסַאסְּאָה בְּשַׁלְחָהּ תְּרִיבֶנָּה (יש' כ\"ז):", "rashi_en": "האמורי עדיין לא התמלא עוונו כדי שיגורש מארצו, כי ה' אינו מעניש אומה עד שתתמלא סאתה.", "note": "", "points": [{"q": "מַדּוּעַ לְפִי רַשִׁ\"י צָרִיךְ לְחַכּוֹת עַד שֶׁיִּתְמַלֵּא \"עֲוֹן הָאֱמֹרִי\"?", "options": ["כִּי ה' אֵינוֹ מַעֲנִישׁ אֻומָּה עַד שֶׁתִּתְמַלֵּא סְאָתָהּ", "כִּי יִשְׂרָאֵל עֲדַייִן לֹא הָיוּ רְאוּיִים לְקַבֵּל אֶת הָאָרֶץ", "כִּי הָאֱמֹורִי עֲדַייִן לֹא שִׁעְבֵּד אֶת יִשְׂרָאֵל"], "kasha": "מה הקשר בין עוון האמורי לבין הזמן שבו ישובו ישראל לארץ?", "answer": "האמורי לא יגורש מארצו עד שיתמלא עוונו, כי הקב\"ה אינו נפרע מאומה עד שתתמלא סאתה.", "kp": ["להיות משתלח מארצו", "עד שתתמלא סאתה"]}]}, {"id": "15:17.1", "ch": 15, "v": 17, "n": 1, "dh": "ויהי השמש באה", "pasuk_html": "<mark>וַיְהִ֤י הַשֶּׁ֙מֶשׁ֙ בָּ֔אָה</mark> וַעֲלָטָ֖ה הָיָ֑ה וְהִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְלַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַגְּזָרִ֥ים הָאֵֽלֶּה׃", "pasuk_en": "וַיְהִי הַשֶּׁמֶשׁ בָּאָה וַעֲלָטָה הָיָה וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָר ְמַעְלָה, לְשׁוֹן עָבַר הוּא, כְּגוֹן זֶה, וּכְגוֹן וְרָחֵל בָּאָה, קָמָה אֲלֻמָּתִי, הִנֵּה שָׁבָה יְבִמְתֵּךְ, וּכְשֶׁהַטַּעַם לְמַטָּה הוּא לְשׁוֹן הוֹוֶה, דָּבָר שֶׁנַּעֲשֶׂה עַכְשָׁו וְהוֹלֵךְ, כְּמוֹ בָּאָה עִם הַצֹּאן, בָּעֶרֶב הִיא בָאָה וּבַבֹּקֶר הִיא שָׁבָה:", "rashi_en": "\"באה\" כאן הטעם בה למעלה, ולכן היא לשון עבר: השמש כבר שקעה. אי אפשר לפרש שהיא שוקעת עכשיו, שהרי כבר נאמר קודם \"ויהי השמש לבוא\". וזה כלל בכל מילה בלשון נקבה שיסודה שתי אותיות: טעם למעלה הוא עבר, וטעם למטה הוא הווה.", "note": "", "points": [{"q": "מַה לוֹמֵד רַשִׁ\"י מִכָּךְ שֶׁהַטַּעַם בַּמִּילָּה \"בָּאָה\" הוּא לְמַעְלָה?", "options": ["שֶׁהַשֶּׁמֶשׁ כְּבָר שָׁקְעָה לְגַמְרֵי", "שֶׁהַשֶּׁמֶשׁ עֲדַייִן שׁוֹקַעַת בְּאוֹתוֹ רֶגַע", "שֶׁהַשֶּׁמֶשׁ עוֹמֶדֶת לִשְׁקוֹעַ בְּקָרוֹב"], "kasha": "האם \"באה\" כאן פירושו שהשמש כבר שקעה או שהיא שוקעת עכשיו?", "answer": "הטעם למעלה, ולכן זה לשון עבר, שכבר שקעה; ואי אפשר לפרש שהיא שוקעת, שהרי כבר נאמר קודם \"ויהי השמש לבוא\".", "kp": ["טעמו למעלה", "שהרי כבר כתיב ויהי השמש לבוא"]}, {"q": "מַהוּ הַכְּלָל שֶׁקּוֹבֵעַ רַשִׁ\"י בְּמִילִּים כְּמוֹ \"בָּאָה\", \"קָמָה\", \"שָׁבָה\"?", "options": ["טַעַם לְמַעְלָה הוּא עָבָר, וְטַעַם לְמַטָּה הוּא הֹוֶוה", "טַעַם לְמַעְלָה הוּא הֹווֶה, וְטַעַם לְמַטָּה הוּא עָבָר", "טַעַם לְמַעְלָה הוּא עָתִיד, וְטַעַם לְמַטָּה הוּא צִיווּי"], "kasha": "איך מבחינים בין עבר להווה במילה בלשון נקבה שיסודה שתי אותיות?", "answer": "כשהטעם למעלה זה לשון עבר, כמו \"ורחל באה\"; וכשהטעם למטה זה לשון הווה, כמו \"באה עם הצאן\".", "kp": ["כשהטעם למעלה, לשון עבר הוא", "וכשהטעם למטה הוא לשון הווה"]}]}, {"id": "15:18.1", "ch": 15, "v": 18, "n": 1, "dh": "לזרעך נתתי", "pasuk_html": "בַּיּ֣וֹם הַה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת־אַבְרָ֖ם בְּרִ֣ית לֵאמֹ֑ר <mark>לְזַרְעֲךָ֗ נָתַ֙תִּי֙</mark> אֶת־הָאָ֣רֶץ הַזֹּ֔את מִנְּהַ֣ר מִצְרַ֔יִם עַד־הַנָּהָ֥ר הַגָּדֹ֖ל נְהַר־פְּרָֽת׃", "pasuk_en": "בַּיּוֹם הַהוּא כָּרַת יְהוָה אֶת־אַבְרָם בְּרִית לֵאמֹר לְזַרְעֲךָ נָתַתִּי אֶת־הָאָרֶץ הַזֹּאת מִנְּהַר מִצְרַיִם עַד־הַנָּהָר הַגָּדֹל נְהַר־פְּרָת׃", "rashi_he": "לזרעך נתתי. אֲמִירָתוֹ שֶׁל הַקָּבָּ\"ה כְּאִלוּ הִיא עֲשׂוּיָה:", "rashi_en": "ה' אומר \"נתתי\" בלשון עבר אף שהנתינה עוד לא נעשתה, כי אמירתו של הקב\"ה נחשבת כאילו כבר נעשתה.", "note": "", "points": [{"q": "מַדּוּעַ נֶאֱמַר \"נָתַתִּי\" בִּלְשׁוֹן עָבָר, אַף שֶׁהָאָרֶץ עֲדַיִין לֹא נִיתְּנָה?", "options": ["כִּי אֲמִירַת הַקָּבָּ\"ה נֶחְשֶׁבֶת כְּאִילּוּ כְּבָר נַעֲשָׂתָה", "כִּי הָאָרֶץ כְּבָר נִיתְּנָה לְאַבְרָם קֹודֶם לָכֵן", "כִּי זֶה לְשׁוֹן תְּפִילָּה וּבַקָּשָׁה שֶׁל אַבְרָם"], "kasha": "הארץ תינתן רק בעתיד, ומדוע כתוב \"נתתי\" כאילו כבר ניתנה?", "answer": "אמירתו של הקב\"ה היא כאילו כבר נעשתה.", "kp": ["כאלו היא עשויה"]}]}, {"id": "15:18.2", "ch": 15, "v": 18, "n": 2, "dh": "הנהר הגדול", "pasuk_html": "בַּיּ֣וֹם הַה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת־אַבְרָ֖ם בְּרִ֣ית לֵאמֹ֑ר לְזַרְעֲךָ֗ נָתַ֙תִּי֙ אֶת־הָאָ֣רֶץ הַזֹּ֔את מִנְּהַ֣ר מִצְרַ֔יִם עַד־<mark>הַנָּהָ֥ר הַגָּדֹ֖ל</mark> נְהַר־פְּרָֽת׃", "pasuk_en": "בַּיּוֹם הַהוּא כָּרַת יְהוָה אֶת־אַבְרָם בְּרִית לֵאמֹר לְזַרְעֲךָ נָתַתִּי אֶת־הָאָרֶץ הַזֹּאת מִנְּהַר מִצְרַיִם עַד־הַנָּהָר הַגָּדֹל נְהַר־פְּרָת׃", "rashi_he": "הנהר הגדול. לְפִי שֶׁהוּא דָבוּק לְאֶרֶץ יִשְׂרָאֵל קוֹרְאֵהוּ גָּדוֹל, אַעַ\"פִּ שֶׁהוּא מְאֻחָר בְּאַרְבָּעָה נְהָרוֹת הַיּוֹצְאִים מֵעֵדֶן, שֶׁנֶּאֱמַר וְהַנָּהָר הָרְבִיעִי הוּא פְרָת. מָשָׁל הֶדְיוֹט: עֶבֶד מֶלֶךְ מֶלֶךְ, הִדָּבֵק לַשַּׁחֲוָר וְיִשְׁתַּחֲווּ לְךָ (בראשית רבה):", "rashi_en": "נהר פרת נקרא \"גדול\" משום שהוא סמוך לארץ ישראל, אף שהוא האחרון מבין ארבעת הנהרות היוצאים מעדן. כמו שאומרים: עבד של מלך הוא כמלך.", "note": "", "points": [{"q": "מַדּוּעַ נִקְרָא נְהַר פְּרָת בַּפָּסוּק \"הַנָּהָר הַגָּדוֹל\" לְפִי רַשִׁ\"י?", "options": ["כִּי הוּא דָּבוּק לְאֶרֶץ יִשְׂרָאֵל", "כִּי הוּא הַגָּדוֹל מִכָּל נַהֲרוֹת עֵדֶן", "כִּי הוּא הָרִאשׁוֹן מִנַּהֲרוֹת עֵדֶן"], "kasha": "פרת הוא האחרון מבין ארבעת נהרות עדן, ולמה ייקרא דווקא הוא גדול?", "answer": "בגלל שהוא דבוק לארץ ישראל הוא נקרא גדול, כמשל העם: עבד מלך מלך.", "kp": ["לפי שהוא דבוק לארץ ישראל", "עבד מלך מלך"]}]}, {"id": "15:19.1", "ch": 15, "v": 19, "n": 1, "dh": "את הקני", "pasuk_html": "<mark>אֶת־הַקֵּינִי֙</mark> וְאֶת־הַקְּנִזִּ֔י וְאֵ֖ת הַקַּדְמֹנִֽי׃", "pasuk_en": "אֶת־הַקֵּינִי וְאֶת־הַקְּנִזִּי וְאֵת הַקַּדְמֹנִי׃", "rashi_he": "את הקני. עֶשֶׂר אֻמּוֹת יֵשׁ כָּאן וְלֹא נָתַן לָהֶם אֶלָּא שִׁבְעָה גוֹיִם, וְהַשְּׁלשָׁה אֱדוֹם וּמוֹאָב וְעַמּוֹן, וְהֵם קֵינִי, קְנִזִּי, וְקַדְּמוֹנִי עֲתִידִים לִהְיוֹת יְרֻשָּׁה לֶעָתִיד (בראשית רבה), שֶׁנֶּאֱמַר: אֱדוֹם וּמוֹאָב מִשְׁלוֹחַ יָדָם וּבְנֵי עַמּוֹן מִשְׁמַעְתָּם (ישעיה י\"א):", "rashi_en": "בפסוקים מנויים עשרה עמים, אבל לישראל ניתנה רק ארץ שבעה עמים. שלושת הנותרים, הקיני, הקנזי והקדמוני, הם אדום, מואב ועמון, וארצם תינתן לישראל לעתיד לבוא.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַדּוּעַ נִמְנוּ כָּאן עֲשָׂרָה עַמִּים, וְאִילּוּ יִשְׂרָאֵל קִיבְּלוּ רַק שִׁבְעָה?", "options": ["שְׁלוֹשֶׁת הָעַמִּים הַנּוֹסָפִים יִירְשׁוּ יִשְׂרָאֵל לֶעָתִיד לָבוֹא", "שְׁלוֹשָׁה מֵהָעַמִּים נֶעֶלְמוּ לִפְנֵי כְּנִיסַת יִשְׂרָאֵל לָאָרֶץ", "שְׁלוֹשָׁה מֵהָעַמִּים הִשְׁלִימוּ עִם יִשְׂרָאֵל וְלָכֵן נִשְׁאֲרוּ"], "kasha": "בהבטחה לאברם מנויים עשרה עמים, ובפועל קיבלו ישראל רק את ארץ שבעת העמים.", "answer": "הקיני, הקנזי והקדמוני הם אדום, מואב ועמון, וארצם עתידה להיות ירושה לישראל לעתיד לבוא.", "kp": ["עשר אמות יש כאן", "עתידים להיות ירשה לעתיד"]}]}, {"id": "15:20.1", "ch": 15, "v": 20, "n": 1, "dh": "ואת הרפאים", "pasuk_html": "וְאֶת־הַחִתִּ֥י וְאֶת־הַפְּרִזִּ֖י <mark>וְאֶת־הָרְפָאִֽים׃</mark>", "pasuk_en": "וְאֶת־הַחִתִּי וְאֶת־הַפְּרִזִּי וְאֶת־הָרְפָאִים׃", "rashi_he": "ואת הרפאים. אֶרֶץ עוֹג, שֶׁנֶּאֱמַר בָּהּ: הַהוּא יִקָּרֵא אֶרֶץ רְפָאִים (דברים ג'):", "rashi_en": "הרפאים הם ארץ עוג, שעליה נאמר \"ההוא יקרא ארץ רפאים\".", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, אֵיזוֹ אֶרֶץ הִיא אֶרֶץ \"הָרְפָאִים\"?", "options": ["אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן", "אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹורִי", "אֶרֶץ פְּלִשְׁתִּים שֶׁלְחוֹף הַיָּם"], "kasha": "הרפאים אינם מוכרים כאחד מעמי כנען, ולא ברור לאיזו ארץ הכוונה.", "answer": "זו ארץ עוג, שעליה נאמר \"ההוא יקרא ארץ רפאים\".", "kp": ["ארץ עוג"]}]}, {"id": "16:1.1", "ch": 16, "v": 1, "n": 1, "dh": "שׁפחה מצרית", "pasuk_html": "וְשָׂרַי֙ אֵ֣שֶׁת אַבְרָ֔ם לֹ֥א יָלְדָ֖ה ל֑וֹ וְלָ֛הּ <mark>שִׁפְחָ֥ה מִצְרִ֖ית</mark> וּשְׁמָ֥הּ הָגָֽר׃", "pasuk_en": "וְשָׂרַי אֵשֶׁת אַבְרָם לֹא יָלְדָה לוֹ וְלָהּ שִׁפְחָה מִצְרִית וּשְׁמָהּ הָגָר׃", "rashi_he": "שׁפחה מצרית. בַּת פַּרְעֹה הָיְתָה, כְּשֶׁרָאָה נִסִּים שֶׁנַּעֲשׂוּ לְשָׂרָה אָמַר: מוּטָב שֶׁתְּהֵא בִתִּי שִׁפְחָה בְּבַיִת זֶה וְלֹא גְבִירָה בְּבַיִת אַחֵר:", "rashi_en": "הגר הייתה בתו של פרעה. כשראה פרעה את הניסים שנעשו לשרה, אמר שעדיף שבתו תהיה שפחה בבית הזה מאשר גבירה בבית אחר.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מִי הָייְתָה הָגָר הַשִּׁפְחָה הַמִּצְרִית?", "options": ["בִּתּוֹ שֶׁל פַּרְעֹה, שֶׁנָּתַן אוֹתָהּ לְשָׂרָה", "שִׁפְחָה שֶׁאַבְרָם קָנָה בַּשּׁוּק בְּמִצְרַיִם", "אִישָּׁה מִצְרִית שֶׁבָּרְחָה מִבֵּית פַּרְעֹה"], "kasha": "מדוע מדגיש הפסוק שהשפחה הייתה מצרית, ואיך הגיעה לשרה?", "answer": "היא הייתה בת פרעה, שאמר כשראה את הניסים: מוטב שתהא בתי שפחה בבית זה ולא גבירה בבית אחר.", "kp": ["בת פרעה היתה", "מוטב שתהא בתי שפחה"]}]}, {"id": "16:2.1", "ch": 16, "v": 2, "n": 1, "dh": "אולי אבנה ממנה", "pasuk_html": "וַתֹּ֨אמֶר שָׂרַ֜י אֶל־אַבְרָ֗ם הִנֵּה־נָ֞א עֲצָרַ֤נִי יְהוָה֙ מִלֶּ֔דֶת בֹּא־נָא֙ אֶל־שִׁפְחָתִ֔י <mark>אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑נָּה</mark> וַיִּשְׁמַ֥ע אַבְרָ֖ם לְק֥וֹל שָׂרָֽי׃", "pasuk_en": "וַתֹּאמֶר שָׂרַי אֶל־אַבְרָם הִנֵּה־נָא עֲצָרַנִי יְהוָה מִלֶּדֶת בֹּא־נָא אֶל־שִׁפְחָתִי אוּלַי אִבָּנֶה מִמֶּנָּה וַיִּשְׁמַע אַבְרָם לְקוֹל שָׂרָי׃", "rashi_he": "אולי אבנה ממנה. לִמֵּד עַל מִי שֶׁאֵין לוֹ בָּנִים שֶׁאֵינוֹ בָנוּי אֶלָּא הָרוּס:", "rashi_en": "מכך ששרה אומרת \"אבנה\" לומדים שמי שאין לו בנים אינו בנוי אלא הרוס.", "note": "", "points": [{"q": "מַה לוֹמֵד רַשִׁ\"י מֵהַלָּשׁוֹן \"אֶבָּנֶה\" שֶׁבְּדִבְרֵי שָׂרָה?", "options": ["שֶׁמִּי שֶׁאֵין לוֹ בָּנִים אֵינוֹ בָּנוּי אֶלָּא הָרוּס", "שֶׁשָּׂרָה רָצְתָה לִבְנוֹת לְעַצְמָהּ בַּיִת חָדָשׁ", "שֶׁהַבֵּן שֶׁל הָגָר יֵיחָשֵׁב כִּבְנוֹ שֶׁל אַבְרָם"], "kasha": "מדוע k_en": "וַיָּבֹא אֶל־הָגָר וַתַּהַר וַתֵּרֶא כִּי הָרָתָה וַתֵּקַל גְּבִרְתָּהּ בְּעֵינֶיהָ׃", "rashi_he": "ויבא אל הגר ותהר. מִבִּיאָה רִאשׁוֹנָה (בראשית רבה):", "rashi_en": "הגר נתעברה כבר מהביאה הראשונה.", "note": "", "points": [{"q": "מַה לוֹמֵד רַשִׁ\"י מֵהַסְּמִיכוּת \"וַיָּבֹא אֶל הָגָר וַתַּהַר\"?", "options": ["שֶׁהָגָר נִתְעַבְּרָה מֵהַבִּיאָה הָרִאשׁוֹנָה", "שֶׁהָגָר נִתְעַבְּרָה רַק אַחֲרֵי זְמַן רַב", "שֶׁהָגָר נִתְעַבְּרָה בִּזְכוּת תְּפִילַּת שָׂרָה"], "kasha": "מדוע הפסוק סומך את ההיריון מיד לביאה?", "answer": "ללמד שנתעברה מביאה ראשונה.", "kp": ["מביאה ראשונה"]}]}, {"id": "16:4.2", "ch": 16, "v": 4, "n": 2, "dh": "ותקל גברתה בעיניה", "pasuk_html": "וַיָּבֹ֥א אֶל־הָגָ֖ר וַתַּ֑הַר וַתֵּ֙רֶא֙ כִּ֣י הָרָ֔תָה <mark>וַתֵּקַ֥ל גְּבִרְתָּ֖הּ בְּעֵינֶֽיהָ׃</mark>", "pasuk_en": "וַיָּבֹא אֶל־הָגָר וַתַּהַר וַתֵּרֶא כִּי הָרָתָה וַתֵּקַל גְּבִרְתָּהּ בְּעֵינֶיהָ׃", "rashi_he": "ותקל גברתה בעיניה. אָמְרָה שָׂרַי זוֹ אֵין סִתְרָהּ כִּגְלוּיָהּ מַרְאָה עַצְמָהּ כְּאִלּוּ הִיא צַדֶּקֶת וְאֵינָהּ צַדֶּקֶת, שֶׁלֹּא זָכְתָה לְהֵרָיוֹן כָּל הַשָּׁנִים הַלָּלוּ, וַאֲנִי נִתְעַבַּרְתִּי מִבִּיאָה רִאשׁוֹנָה (בראשית רבה):", "rashi_en": "הגר זלזלה בשרה ואמרה שאינה צדקת באמת כפי שהיא נראית, שהרי לא זכתה להריון כל השנים, ואילו היא נתעברה מהביאה הראשונה.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַדּוּעַ זִלְזְלָה הָגָר בְּשָׂרָה?", "options": ["חָשְׁבָה שֶׁשָּׂרָה אֵינָהּ צַדֶּקֶת בֶּאֱמֶת, כִּי לֹא זָכְתָה לְהֵרָיוֹן", "חָשְׁבָה שֶׁשָּׂרָה זְקֵנָה מִדַּי מִלִּהְיוֹת גְּבִירָתָהּ", "חָשְׁבָה שֶׁשָּׂרָה מְקַנְּאָה בָּהּ וּמִתְכַּוֶּונֶת לְגָרְשָׁהּ"], "kasha": "מה גרם להגר לזלזל בגבירתה דווקא אחרי שהרתה?", "answer": "אמרה שאין סתרה של שרה כגלויה: היא מעמידה פנים של צדקת, ואילו הייתה צדקת הייתה זוכה להריון, ואני נתעברתי מביאה ראשונה.", "kp": ["אין סתרה כגלויה", "שלא זכתה להריון"]}]}, {"id": "16:5.1", "ch": 16, "v": 5, "n": 1, "dh": "חמסי עליך", "pasuk_html": "וַתֹּ֨אמֶר שָׂרַ֣י אֶל־אַבְרָם֮ <mark>חֲמָסִ֣י עָלֶיךָ֒</mark> אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִי֙ בְּחֵיקֶ֔ךָ וַתֵּ֙רֶא֙ כִּ֣י הָרָ֔תָה וָאֵקַ֖ל בְּעֵינֶ֑יהָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥י וּבֵינֶֽיׄךָ׃", "pasuk_en": "וַתֹּאמֶר שָׂרַי אֶל־אַבְרָם חֲמָסִי עָלֶיךָ אָנֹכִי נָתַתִּי שִׁפְחָתִי בְּחֵיקֶךָ וַתֵּרֶא כִּי הָרָתָה וָאֵקַל בְּעֵינֶיהָ יִשְׁפֹּט יְהוָה בֵּינִי וּבֵינֶיךָ׃", "rashi_he": "חמסי עליך. חָמָס הֶעָשׂוּי לִי, עָלֶיךָ אֲנִי מֵטִיל הָעֹנֶשׁ; כְּשֶׁהִתְפַּלַּלְתָּ לְהַקָּבָּ\"ה מַה תִּתֶּן לִי וְאָנֹכִי הוֹלֵךְ עֲרִירִי, לֹא הִתְפַּלַּלְתָּ אֶלָּא עָלֶיךָ, וְהָיָה לְךָ לְהִתְפַּלֵּל עַל שְׁנֵינוּ, וְהָיִיתִי אֲנִי נִפְקֶדֶת עִמְּךָ, וְעוֹד דְּבָרֶיךָ אַתָּה חוֹמֵס מִמֶּנִי, שֶׁאַתָּה שׁוֹמֵעַ בִּזְיוֹנִי וְשׁוֹתֵק (בראשית רבה):", "rashi_en": "שרה מטילה על אברם את העונש על העוול שנעשה לה: כשהתפלל על בנים התפלל רק על עצמו ולא על שניהם, וגם עכשיו הוא שומע את ביזיונה ושותק.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, עַל מַה הֶאֱשִׁימָה שָׂרָה אֶת אַבְרָם בִּתְפִילָּתוֹ?", "options": ["שֶׁהִתְפַּלֵּל רַק עַל עַצְמוֹ וְלֹא עַל שְׁנֵיהֶם", "שֶׁלֹּא הִתְפַּלֵּל כְּלָל שֶׁיִּהְיוּ לוֹ בָּנִים", "שֶׁהִתְפַּלֵּל שֶׁיִּיווָּלֵד לוֹ בֵּן מֵהָגָר"], "kasha": "מדוע שרה מאשימה את אברם, הרי הגר היא שזלזלה בה?", "answer": "כשהתפלל \"מה תתן לי\" התפלל רק על עצמו, והיה עליו להתפלל על שניהם ואז הייתה נפקדת עמו.", "kp": ["לא התפללת אלא עליך", "להתפלל על שנינו"]}, {"q": "מַהוּ הָעַוְוֶל הַנּוֹסָף שֶׁתּוֹלָה שָׂרָה בְּאַבְרָם לְפִי רַשִׁ\"י?", "options": ["שֶׁהוּא שׁוֹמֵעַ אֶת בִּיזְיוֹנָהּ וְשׁוֹתֵק", "שֶׁהוּא מַעְדִּיף אֶת הָגָר עַל פָּנֶיהָ", "שֶׁהוּא הִבְטִיחַ לָהּ בֵּן וְלֹא קִיֵּים"], "kasha": "מה פירוש \"חמסי עליך\" מעבר לעניין התפילה?", "answer": "אברם חומס ממנה את דבריו, כי הוא שומע את ביזיונה ושותק.", "kp": ["שאתה שומע בזיוני ושותק"]}]}, {"id": "16:5.2", "ch": 16, "v": 5, "n": 2, "dh": "אנכי נתתי שפחתי וגו' ביני וביניך", "pasuk_html": "וַתֹּ֨אמֶר שָׂרַ֣י אֶל־אַבְרָם֮ חֲמָסִ֣י עָלֶיךָ֒ <mark>אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִי֙</mark> בְּחֵיקֶ֔ךָ וַתֵּ֙רֶא֙ כִּ֣י הָרָ֔תָה וָאֵקַ֖ל בְּעֵינֶ֑יהָ יִשְׁפֹּ֥ט יְהוָ֖ה <mark>בֵּינִ֥י וּבֵינֶֽיׄךָ׃</mark>", "pasuk_en": "וַתֹּאמֶר שָׂרַי אֶל־אַבְרָם חֲמָסִי עָלֶיךָ אָנֹכִי נָתַתִּי שִׁפְחָתִי בְּחֵיקֶךָ וַתֵּרֶא כִּי הָרָתָה וָאֵקַל בְּעֵינֶיהָ יִשְׁפֹּט יְהוָה בֵּינִי וּבֵינֶיךָ׃", "rashi_he": "אנכי נתתי שפחתי וגו' ביני וביניך. כָּל בֵּינֶיךָ שֶׁבַּמִּקְרָא חָסֵר, וְזֶה מָלֵא, קְרִי בֵיהּ וּבָנַיִךְ, שֶׁהִכְנִיסָה עַיִן הָרָע בְּעִבּוּרָהּ שֶׁל הָגָר וְהִפִּילָה עֻבָּרָהּ; הוּא שֶׁהַמַּלְאָךְ אוֹמֵר לְהָגָר הִנָּךְ הָרָה, וְהֲלֹא כְבָר הָרְתָה, וְהוּא מְבַשֵּׁר לָהּ שֶׁתַּהַר? אֶלָּא מְלַמֵּד שֶׁהִפִּילָה הֵרָיוֹן הָרִאשׁוֹן:", "rashi_en": "המילה \"וביניך\" כתובה כאן מלאה ביו\"ד, שלא כרגיל, ולכן דורשים אותה גם \"ובניך\". שרי נתנה עין הרע בעובר של הגר והיא הפילה אותו, ולכן אמר לה המלאך אחר כך \"הנך הרה\", כלומר תהרי שוב.", "note": "", "points": [{"q": "מַדּוּעַ דּוֹרֵשׁ רַשִׁ\"י אֶת הַמִּילָּה \"וּבֵינֶיךָ\" כְּרֶמֶז לַבָּנִים?", "options": ["כִּי הִיא כְּתוּבָה מְלֵאָה בְּיוֹ\"ד, שֶׁלֹּא כְּרָגִיל בַּמִּקְרָא", "כִּי שָׂרַי דִּיבְּרָה עַל הַבָּנִים שֶׁעֲתִידִים לְהִיוָּולֵד לְאַבְרָם", "כִּי הַמִּילָּה חוֹזֶרֶת פְּעָמַיִים בְּאוֹתוֹ פָּסוּק"], "kasha": "מדוע נכתבה המילה \"וביניך\" ביו\"ד נוספת, בשונה מכל מקום אחר במקרא?", "answer": "כל \"ביניך\" במקרא חסר וכאן הוא מלא, ולכן קוראים בו \"ובניך\": שרי הכניסה עין הרע בעובר של הגר.", "kp": ["וזה מלא", "קרי ביה ובניך"]}, {"q": "מַה קָרָה לְהֵרָיוֹנָהּ הָרִאשׁוֹן שֶׁל הָגָר לְפִי רַשִׁ\"י?", "options": ["שָׂרַי נָתְנָה בוֹ עַיִן הָרָע וְהָגָר הִפִּילָה אוֹתוֹ", "הָגָר הִפִּילָה אוֹתוֹ מֵחֲמַת הַבְּרִיחָה הַקָּשָׁה בַּמִּדְבָּר", "הָעֻובָּר נוֹלַד וָמֵת זְמַן קָצָר אַחַר הַלֵּידָה"], "kasha": "מדוע מבשר המלאך להגר \"הנך הרה\", והרי היא כבר הרתה?", "answer": "שרי הכניסה עין הרע בעוברה של הגר והיא הפילה, ולכן המלאך מבשר לה שתהרה שוב.", "kp": ["והפילה עברה", "שהפילה הריון הראשון"]}]}, {"id": "16:6.1", "ch": 16, "v": 6, "n": 1, "dh": "ותענה", "pasuk_html": "וַיֹּ֨אמֶר אַבְרָ֜ם אֶל־שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵךְ֙ בְּיָדֵ֔ךְ עֲשִׂי־לָ֖הּ הַטּ֣וֹב בְּעֵינָ֑יִךְ <mark>וַתְּעַנֶּ֣הָ</mark> שָׂרַ֔י וַתִּבְרַ֖ח מִפָּנֶֽיהָ׃", "pasuk_en": "וַיֹּאמֶר אַבְרָם אֶל־שָׂרַי הִנֵּה שׁ מעותו.", "answer": "\"אי מזה\" פירושו: איה המקום שתוכלי לומר עליו \"מזה אני באה\".", "kp": ["איה המקום שתאמר עליו", "מזה אני באה"]}]}, {"id": "16:9.1", "ch": 16, "v": 9, "n": 1, "dh": "ויאמר לה מלאך וגו'", "pasuk_html": "<mark>וַיֹּ֤אמֶר לָהּ֙ מַלְאַ֣ךְ</mark> יְהוָ֔ה שׁ֖וּבִי אֶל־גְּבִרְתֵּ֑ךְ וְהִתְעַנִּ֖י תַּ֥חַת יָדֶֽיהָ׃", "pasuk_en": "וַיֹּאמֶר לָהּ מַלְאַךְ יְהוָה שׁוּבִי אֶל־גְּבִרְתֵּךְ וְהִתְעַנִּי תַּחַת יָדֶיהָ׃", "rashi_he": "ויאמר לה מלאך וגו'. עַל כָּל אֲמִירָה הָיָה שָׁלוּחַ לָהּ מַלְאָךְ אַחֵר, לְכָךְ נֶאֱמַר מַלְאָךְ בְּכָל אֲמִירָה וַאֲמִירָה:", "rashi_en": "על כל אמירה נשלח להגר מלאך אחר, ולכן התורה חוזרת ואומרת \"מלאך\" בכל אמירה ואמירה.", "note": "", "points": [{"q": "מַדּוּעַ חוֹזֶרֶת הַתּוֹרָה וְאוֹמֶרֶת \"וַיֹּאמֶר לָהּ מַלְאַךְ\" בְּכָל אֲמִירָה מֵחָדָשׁ?", "options": ["כִּי עַל כָּל אֲמִירָה נִשְׁלַח לָהּ מַלְאָךְ אַחֵר", "כִּי הַמַּלְאָךְ חָזַר עַל דְּבָרָיו כְּדֵי לְחַזֵּק אוֹתָהּ", "כִּי הָגָר לֹא שָׁמְעָה אֶת דְּבָרָיו בַּפַּעַם הָרִאשׁוֹנָה"], "kasha": "מדוע נאמר \"ויאמר לה מלאך\" שלוש פעמים ברצף, ולא נאמר פעם אחת בלבד?", "answer": "על כל אמירה נשלח להגר מלאך אחר, ולכן נאמר \"מלאך\" בכל אמירה ואמירה.", "kp": ["היה שלוח לה מלאך אחר", "בכל אמירה ואמירה"]}]}, {"id": "16:11.1", "ch": 16, "v": 11, "n": 1, "dh": "הנך הרה", "pasuk_html": "וַיֹּ֤אמֶר לָהּ֙ מַלְאַ֣ךְ יְהוָ֔ה <mark>הִנָּ֥ךְ הָרָ֖ה</mark> וְיֹלַ֣דְתְּ בֵּ֑ן וְקָרָ֤את שְׁמוֹ֙ יִשְׁמָעֵ֔אל כִּֽי־שָׁמַ֥ע יְהוָ֖ה אֶל־עָנְיֵֽךְ׃", "pasuk_en": "וַיֹּאמֶר לָהּ מַלְאַךְ יְהוָה הִנָּךְ הָרָה וְיֹלַדְתְּ בֵּן וְקָרָאת שְׁמוֹ יִשְׁמָעֵאל כִּי־שָׁמַע יְהוָה אֶל־עָנְיֵךְ׃", "rashi_he": "הנך הרה. כְּשֶׁתָּשׁוּבִי תַּהֲרִי, כְּמוֹ הִנָּךְ הָרָה דְאֵשֶׁת מָנוֹחַ:", "rashi_en": "\"הנך הרה\" פירושו: כשתשובי לבית אברם תהרי, כמו שנאמר לאשת מנוח \"הנך הרה\" על הריון עתידי.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"הִנָּךְ הָרָה\", אִם הָגָר כְּבָר הָרְתָה קֹודֶם לָכֵן?", "options": ["כְּשֶׁתָּשׁוּבִי לְבֵית אַבְרָם תַּהֲרִי שׁוּב", "אַתְּ עֲדַיִין בְּהֵרָיוֹן וְלֹא הִפַּלְתְּ כְּלָל", "אַתְּ ה
