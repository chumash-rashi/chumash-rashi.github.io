1", "ch": 13, "v": 18, "n": 1, "dh": "ממרא", "pasuk_html": "וַיֶּאֱהַ֣ל אַבְרָ֗ם וַיָּבֹ֛א וַיֵּ֛שֶׁב בְּאֵלֹנֵ֥י <mark>מַמְרֵ֖א</mark> אֲשֶׁ֣ר בְּחֶבְר֑וֹן וַיִּֽבֶן־שָׁ֥ם מִזְבֵּ֖חַ לַֽיהֹוָֽה׃&nbsp;{פ}", "pasuk_en": "Avram set up his tent, and he came and settled in the Plains מתוך Mamrei which are in Chevron, and he built there an altar to [before] Adonoy.", "rashi_he": "שֵׁם אָדָם:", "rashi_en": "The name מתוך a person.", "note": "", "points": [{"q": "Avram settled in 'אלני ממרא.' What is 'ממרא'?", "options": ["The name מתוך a person", "The name מתוך a river", "A type מתוך tree"], "kasha": "'ממרא' is unfamiliar — is it a place, a tree, or a person?", "answer": "Mamrei is a person's name."}]}, {"id": "14:1.1", "ch": 14, "v": 1, "n": 1, "dh": "אמרפל", "pasuk_html": "וַיְהִ֗י בִּימֵי֙ <mark>אַמְרָפֶ֣ל</mark> מֶֽלֶךְ־שִׁנְעָ֔ר אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר כְּדׇרְלָעֹ֙מֶר֙ מֶ֣לֶךְ עֵילָ֔ם וְתִדְעָ֖ל מֶ֥לֶךְ גּוֹיִֽם׃", "pasuk_en": "This happened in the days מתוך Amraphel, king מתוך Shinar [Babylon], Aryoch, king מתוך Elasar, Kedorlaomer, king מתוך Ailam, and Tidal, king מתוך Goyim [king מתוך peoples].", "rashi_he": "הוּא נִמְרוֹד, שֶׁאָמַר לְאַבְרָהָם פֹּל לְתוֹךְ כִּבְשַׁן הָאֵשׁ (בראשית רבה):", "rashi_en": "He is Nimrod who told Avraham, “Jump into the fiery furnace.”", "note": "", "points": [{"q": "Who is 'אמרפל', king מתוך Shinar, and what does his name hint to?", "options": ["Nimrod, who told Avraham to jump into the furnace", "The king מתוך Sedom's older brother", "A grandson מתוך Kedorlaomer who ruled Eilam"], "kasha": "The name 'אמרפל' is unfamiliar — who is this king, and why this odd name?", "answer": "He is Nimrod. He is called אמרפל because he said (אמר) to Avraham 'jump' (פל) into the fiery furnace (בראשית Rabbah)."}]}, {"id": "14:1.2", "ch": 14, "v": 1, "n": 2, "dh": "מלך גוים", "pasuk_html": "וַיְהִ֗י בִּימֵי֙ אַמְרָפֶ֣ל מֶֽלֶךְ־שִׁנְעָ֔ר אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר כְּדׇרְלָעֹ֙מֶר֙ מֶ֣לֶךְ עֵילָ֔ם וְתִדְעָ֖ל <mark>מֶ֥לֶךְ גּוֹיִֽם׃</mark>", "pasuk_en": "This happened in the days מתוך Amraphel, king מתוך Shinar [Babylon], Aryoch, king מתוך Elasar, Kedorlaomer, king מתוך Ailam, and Tidal, king מתוך Goyim [king מתוך peoples].", "rashi_he": "מָקוֹם יֵשׁ שֶׁשְּׁמוֹ גּוֹיִם, עַל שֵׁם שֶׁנִּתְקַבְּצוּ שָׁמָּה מִכַּמָּה אֻמּוֹת וּמְקוֹמוֹת וְהִמְלִיכוּ אִישׁ עֲלֵיהֶם וּשְׁמוֹ תִדְעָל:", "rashi_en": "There is a place called Goyim because in that place were gathered [people] from many nations and places and they proclaimed as king a man named Sidal.", "note": "", "points": [{"q": "Tidal is called 'מלך גוים' — king מתוך nations. Which nations?", "options": ["A place where many nations gathered and crowned him", "He ruled over every nation in the world", "He was king over the Pelishtim"], "kasha": "Every king rules people — 'king מתוך גוים' doesn't seem to name any place.", "answer": "Goyim was the name מתוך a place, called so because people from many nations and places gathered there and crowned a man named Tidal over them."}]}, {"id": "14:2.1", "ch": 14, "v": 2, "n": 1, "dh": "ברע", "pasuk_html": "עָשׂ֣וּ מִלְחָמָ֗ה אֶת־<mark>בֶּ֙רַע֙</mark> מֶ֣לֶךְ סְדֹ֔ם וְאֶת־בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב&thinsp;׀ מֶ֣לֶךְ אַדְמָ֗ה וְשֶׁמְאֵ֙בֶר֙ מֶ֣לֶךְ (צביים) [צְבוֹיִ֔ם] וּמֶ֥לֶךְ בֶּ֖לַע הִיא־צֹֽעַר׃", "pasuk_en": "They waged war against Bera, king מתוך Sedom, Birsha, king מתוך Amorah, Shinav, king מתוך Admah, Shemeiver, king מתוך Tzevoyim, and the king מתוך Bela, which is Zoar.", "rashi_he": "רַע לַשָּׁמַיִם וְרַע לַבְּרִיּוֹת:", "rashi_en": "He was evil towards God and evil towards mankind.", "note": "", "points": [{"q": "The king מתוך Sedom is named 'ברע'. What does the name hint to?", "options": ["He was evil to Hashem and evil to people", "He was a friend (רע) מתוך Avram", "He was the son מתוך a man named Ra"], "kasha": "Why tell us the kings' names at all? The names seem to carry a meaning.", "answer": "ברע = 'with evil': he was evil toward Heaven and evil toward people."}]}, {"id": "14:2.2", "ch": 14, "v": 2, "n": 2, "dh": "ברשע", "pasuk_html": "עָשׂ֣וּ מִלְחָמָ֗ה אֶת־בֶּ֙רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְאֶת־<mark>בִּרְשַׁ֖ע</mark> מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב&thinsp;׀ מֶ֣לֶךְ אַדְמָ֗ה וְשֶׁמְאֵ֙בֶר֙ מֶ֣לֶךְ (צביים) [צְבוֹיִ֔ם] וּמֶ֥לֶךְ בֶּ֖לַע הִיא־צֹֽעַר׃", "pasuk_en": "They waged war against Bera, king מתוך Sedom, Birsha, king מתוך Amorah, Shinav, king מתוך Admah, Shemeiver, king מתוך Tzevoyim, and the king מתוך Bela, which is Zoar.", "rashi_he": "שֶׁנִּתְעַלָּה בְרֶשַׁע:", "rashi_en": "Because he rose by means מתוך wickedness.", "note": "", "points": [{"q": "What does the name מתוך Amorah's king, 'ברשע', hint to?", "options": ["He rose to power through wickedness", "He was the most wicked מתוך the five kings", "He later repented from his wickedness"], "kasha": "The name 'ברשע' sounds like 'with wickedness' — what does it tell us about him?", "answer": "He rose to greatness by means מתוך wickedness."}]}, {"id": "14:2.3", "ch": 14, "v": 2, "n": 3, "dh": "שנאב", "pasuk_html": "עָשׂ֣וּ מִלְחָמָ֗ה אֶת־בֶּ֙רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְאֶת־בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה <mark>שִׁנְאָ֣ב</mark>&thinsp;׀ מֶ֣לֶךְ אַדְמָ֗ה וְשֶׁמְאֵ֙בֶר֙ מֶ֣לֶךְ (צביים) [צְבוֹיִ֔ם] וּמֶ֥לֶךְ בֶּ֖לַע הִיא־צֹֽעַר׃", "pasuk_en": "They waged war against Bera, king מתוך Sedom, Birsha, king מתוך Amorah, Shinav, king מתוך Admah, Shemeiver, king מתוך Tzevoyim, and the king מתוך Bela, which is Zoar.", "rashi_he": "שׂוֹנֵא אָבִיו שׁבַּשָּׁמָיִם:", "rashi_en": "He hated his Father in Heaven.", "note": "", "points": [{"q": "How does רש״י read the name 'שנאב', king מתוך Admah?", "options": ["He hated his Father in Heaven", "He was the son מתוך a man named Av", "He had two fathers (שני אב)"], "kasha": "The name 'שנאב' seems to carry a hidden meaning.", "answer": "שונא אב: he hated his Father in Heaven."}]}, {"id": "14:2.4", "ch": 14, "v": 2, "n": 4, "dh": "שמאבר", "pasuk_html": "עָשׂ֣וּ מִלְחָמָ֗ה אֶת־בֶּ֙רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְאֶת־בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב&thinsp;׀ מֶ֣לֶךְ אַדְמָ֗ה וְ<mark>שֶׁמְאֵ֙בֶר֙</mark> מֶ֣לֶךְ (צביים) [צְבוֹיִ֔ם] וּמֶ֥לֶךְ בֶּ֖לַע הִיא־צֹֽעַר׃", "pasuk_en": "They waged war against Bera, king מתוך Sedom, Birsha, king מתוך Amorah, Shinav, king מתוך Admah, Shemeiver, king מתוך Tzevoyim, and the king מתוך Bela, which is Zoar.", "rashi_he": "שָׂם אֵבֶר לָעוּף וְלִקְפֹּץ וְלִמְרֹד בְּהַקָּבָּ\"ה:", "rashi_en": "He set his wings to fly, to leap, and to rebel against God.", "note": "", "points": [{"q": "How does רש״י read the name 'שמאבר', king מתוך Tzevoyim?", "options": ["He 'put on wings' to rebel against Hashem", "He lost a limb (אבר) in battle", "He placed his army across the river"], "kasha": "The name 'שמאבר' seems to carry a hidden meaning.", "answer": "שם אבר: he set himself wings (אבר) to fly, leap and rebel against Hashem."}]}, {"id": "14:2.5", "ch": 14, "v": 2, "n": 5, "dh": "בלע", "pasuk_html": "עָשׂ֣וּ מִלְחָמָ֗ה אֶת־בֶּ֙רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְאֶת־בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב&thinsp;׀ מֶ֣לֶךְ אַדְמָ֗ה וְשֶׁמְאֵ֙בֶר֙ מֶ֣לֶךְ (צביים) [צְבוֹיִ֔ם] וּמֶ֥לֶךְ <mark>בֶּ֖לַע</mark> הִיא־צֹֽעַר׃", "pasuk_en": "They waged war against Bera, king מתוך Sedom, Birsha, king מתוך Amorah, Shinav, king מתוך Admah, Shemeiver, king מתוך Tzevoyim, and the king מתוך Bela, which is Zoar.", "rashi_he": "שֵׁם הָעִיר:", "rashi_en": "Is the name מתוך the city.", "note": "", "points": [{"q": "In 'ומלך בלע', is 'בלע' the king's name like the others?", "options": ["No, it's the name מתוך the city", "Yes, it's the king's name", "No, it means 'swallowed up'"], "kasha": "Every other king is named, so 'בלע' could be mistaken for this king's name.", "answer": "Bela is the name מתוך the city (later called Tzoar); this king's name isn't given."}]}, {"id": "14:3.1", "ch": 14, "v": 3, "n": 1, "dh": "עמק השדים", "pasuk_html": "כׇּל־אֵ֙לֶּה֙ חָֽבְר֔וּ אֶל־<mark>עֵ֖מֶק הַשִּׂדִּ֑ים</mark> ה֖וּא יָ֥ם הַמֶּֽלַח׃", "pasuk_en": "All these joined together [assembled] at the valley מתוך Siddim [the plain מתוך the fields], which is [now] [the place מתוך] the Salt Sea.", "rashi_he": "כָּךְ שְׁמוֹ, עַל שֵׁם שֶׁהָיו בוֹ שָׂדוֹת הַרְבֵּה:", "rashi_en": "It was so called because מתוך the many fields that were in it. There are many [other] Midrashic interpretations.", "note": "", "points": [{"q": "Why was the valley called 'עמק השדים'?", "options": ["It had many fields (שדות)", "Demons (שדים) lived there", "It was named after a king called Siddim"], "kasha": "'עמק השדים' is an unusual name — what does it mean?", "answer": "That was its name, because there were many fields (שדות) in it."}]}, {"id": "14:3.2", "ch": 14, "v": 3, "n": 2, "dh": "הוא ים המלח", "pasuk_html": "כׇּל־אֵ֙לֶּה֙ חָֽבְר֔וּ אֶל־עֵ֖מֶק הַשִּׂדִּ֑ים <mark>ה֖וּא יָ֥ם הַמֶּֽלַח׃</mark>", "pasuk_en": "All these joined together [assembled] at the valley מתוך Siddim [the plain מתוך the fields], which is [now] [the place מתוך] the Salt Sea.", "rashi_he": "לְאַחַר זְמַן נִמְשַׁךְ הַיָּם לְתוֹכוֹ וְנַעֲשָׂה יָם הַמֶּלַח. וּמִדְרַשׁ אַגָּדָה אוֹמֵר שֶׁנִּתְבַּקְּעוּ הַצּוּרִים סְבִיבוֹתָיו וְנִמְשְׁכוּ יְאוֹרִים לְתוֹכוֹ:", "rashi_en": "Afterward, the sea flowed into it and it became the Salt Sea. The Midrashic explanation says that the surrounding stones cracked [causing] streams to flow into it.", "note": "", "points": [{"q": "The kings gathered at a valley 'הוא ים המלח'. How can a valley מתוך fields be a sea?", "options": ["Later, water flowed in and it became the sea", "The armies fought on boats on the sea", "The sea had dried up at that time"], "kasha": "A valley full מתוך fields where armies gathered can't be a sea.", "answer": "At that time it was a valley; later the sea flowed into it and it became the Salt Sea."}, {"q": "רש״י brings a Midrash on how the water got into the valley. What happened?", "options": ["The surrounding rocks split and rivers flowed in", "Hashem brought a flood מתוך rain upon it", "The Yarden changed its course into it"], "kasha": "'The sea flowed into it' doesn't say how the water got there.", "answer": "Midrash Aggadah: the rocks around it split open and rivers flowed into it."}]}, {"id": "14:4.1", "ch": 14, "v": 4, "n": 1, "dh": "שתים עשרה שנה עבדו", "pasuk_html": "<mark>שְׁתֵּ֤ים עֶשְׂרֵה֙ שָׁנָ֔ה עָבְד֖וּ</mark> אֶת־כְּדׇרְלָעֹ֑מֶר וּשְׁלֹשׁ־עֶשְׂרֵ֥ה שָׁנָ֖ה מָרָֽדוּ׃", "pasuk_en": "[For] twelve years they had served Kedorlaomer, and for thirteen years they rebelled.", "rashi_he": "חֲמִשָּׁה מְלָכִים הַלָּלוּ אֶת כְּדָרְלָעֹמֶר:", "rashi_en": "These five kings [served] Kedorlaomer.", "note": "", "points": [{"q": "'שתים עשרה שנה עבדו' — who served whom for twelve years?", "options": ["The five kings served Kedorlaomer", "The four kings served the king מתוך Sedom", "Lot's shepherds served Avram"], "kasha": "The posuk doesn't say clearly who 'they' are.", "answer": "These five kings (מתוך Sedom, Amorah, etc.) served Kedorlaomer."}]}, {"id": "14:5.1", "ch": 14, "v": 5, "n": 1, "dh": "ובארבע עשרה שנה", "pasuk_html": "<mark>וּבְאַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה</mark> בָּ֣א כְדׇרְלָעֹ֗מֶר וְהַמְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔וֹ וַיַּכּ֤וּ אֶת־רְפָאִים֙ בְּעַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְאֶת־הַזּוּזִ֖ים בְּהָ֑ם וְאֵת֙ הָֽאֵימִ֔ים בְּשָׁוֵ֖ה קִרְיָתָֽיִם׃", "pasuk_en": "In the fourteenth year, Kedorlaomer came together with the kings that were with him and they defeated the Rephaim [the mighty ones] in Ashteros Karnayim, the Zuzim [the powerful ones] in Ham, the Aimim [the ones that incite fear] at Shaveh Kiryasayim,", "rashi_he": "לְמִרְדָּן:", "rashi_en": "Of their rebellion.", "note": "", "points": [{"q": "'ובארבע עשרה שנה' — the fourteenth year counting from what?", "options": ["From their rebellion", "From Avram's arrival in Canaan", "From Kedorlaomer becoming king"], "kasha": "The posuk doesn't say what the fourteen years are counted from.", "answer": "The fourteenth year מתוך their rebellion."}]}, {"id": "14:5.2", "ch": 14, "v": 5, "n": 2, "dh": "בא כדרלעמר", "pasuk_html": "וּבְאַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה <mark>בָּ֣א כְדׇרְלָעֹ֗מֶר</mark> וְהַמְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔וֹ וַיַּכּ֤וּ אֶת־רְפָאִים֙ בְּעַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְאֶת־הַזּוּזִ֖ים בְּהָ֑ם וְאֵת֙ הָֽאֵימִ֔ים בְּשָׁוֵ֖ה קִרְיָתָֽיִם׃", "pasuk_en": "In the fourteenth year, Kedorlaomer came together with the kings that were with him and they defeated the Rephaim [the mighty ones] in Ashteros Karnayim, the Zuzim [the powerful ones] in Ham, the Aimim [the ones that incite fear] at Shaveh Kiryasayim,", "rashi_he": "לְפִי שֶׁהוּא הָיָה בַעַל הַמַּעֲשֶׂה נִכְנַס בְּעֹבִי הַקּוֹרָה:", "rashi_en": "Since the matter concerned him he “carries the heavier side מתוך the beam.”", "note": "", "points": [{"q": "Four kings came to fight, so why does the posuk single out 'בא כדרלעמר'?", "options": ["The rebellion was against him, so he led", "He was the oldest מתוך the four kings", "He came alone, without the other kings"], "kasha": "All four kings came — why is only Kedorlaomer named as coming?", "answer": "Since the rebellion was against him, he was the main party and took on the heaviest part מתוך the burden ('the thick מתוך the beam')."}]}, {"id": "14:5.3", "ch": 14, "v": 5, "n": 3, "dh": "והמלכים", "pasuk_html": "וּבְאַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדׇרְלָעֹ֗מֶר <mark>וְהַמְּלָכִים֙</mark> אֲשֶׁ֣ר אִתּ֔וֹ וַיַּכּ֤וּ אֶת־רְפָאִים֙ בְּעַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְאֶת־הַזּוּזִ֖ים בְּהָ֑ם וְאֵת֙ הָֽאֵימִ֔ים בְּשָׁוֵ֖ה קִרְיָתָֽיִם׃", "pasuk_en": "In the fourteenth year, Kedorlaomer came together with the kings that were with him and they defeated the Rephaim [the mighty ones] in Ashteros Karnayim, the Zuzim [the powerful ones] in Ham, the Aimim [the ones that incite fear] at Shaveh Kiryasayim,", "rashi_he": "אֵלֶּה שְׁלשָׁה מְלָכִים:", "rashi_en": "This refers to the three kings [that were with him.]", "note": "", "points": [{"q": "'והמלכים אשר אתו' — which kings were with Kedorlaomer?", "options": ["The other three מתוך the four kings", "The five rebelling kings", "The kings מתוך Mitzrayim"], "kasha": "'The kings' is vague — which kings does it mean?", "answer": "These are the other three kings (Amraphel, Aryoch and Tidal)."}]}, {"id": "14:5.4", "ch": 14, "v": 5, "n": 4, "dh": "הזוזים", "pasuk_html": "וּבְאַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדׇרְלָעֹ֗מֶר וְהַמְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔וֹ וַיַּכּ֤וּ אֶת־רְפָאִים֙ בְּעַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְאֶת־<mark>הַזּוּזִ֖ים</mark> בְּהָ֑ם וְאֵת֙ הָֽאֵימִ֔ים בְּשָׁוֵ֖ה קִרְיָתָֽיִם׃", "pasuk_en": "In the fourteenth year, Kedorlaomer came together with the kings that were with him and they defeated the Rephaim [the mighty ones] in Ashteros Karnayim, the Zuzim [the powerful ones] in Ham, the Aimim [the ones that incite fear] at Shaveh Kiryasayim,", "rashi_he": "הֵם זַמְזֻמִּים:", "rashi_en": "These are the Zamzumim.", "note": "", "points": [{"q": "Who are 'הזוזים' that Kedorlaomer struck?", "options": ["The Zamzumim", "Lot's household", "Avram's allies"], "kasha": "'הזוזים' is an unknown nation — who are they?", "answer": "They are the Zamzumim."}]}, {"id": "14:6.1", "ch": 14, "v": 6, "n": 1, "dh": "בהררם", "pasuk_html": "וְאֶת־הַחֹרִ֖י <mark>בְּהַרְרָ֣ם</mark> שֵׂעִ֑יר עַ֚ד אֵ֣יל פָּארָ֔ן אֲשֶׁ֖ר עַל־הַמִּדְבָּֽר׃", "pasuk_en": "And the Chorites in their hills מתוך Seir, as far as Eil [the Plain מתוך] Paran which borders [is next to] the wilderness.", "rashi_he": "בְּהַר שֶׁלָּהֶם:", "rashi_en": "[Meaning] in their mountain.", "note": "", "points": [{"q": "What does 'בהררם' mean in 'ואת החרי בהררם שעיר'?", "options": ["In their mountain", "In their caves", "In their cities"], "kasha": "'בהררם' is an unusual word form — what does it mean?", "answer": "In their mountain (בהר שלהם)."}]}, {"id": "14:6.2", "ch": 14, "v": 6, "n": 2, "dh": "איל פארן", "pasuk_html": "וְאֶת־הַחֹרִ֖י בְּהַרְרָ֣ם שֵׂעִ֑יר עַ֚ד <mark>אֵ֣יל פָּארָ֔ן</mark> אֲשֶׁ֖ר עַל־הַמִּדְבָּֽר׃", "pasuk_en": "And the Chorites in their hills מתוך Seir, as far as Eil [the Plain מתוך] Paran which borders [is next to] the wilderness.", "rashi_he": "כְּתַרְגּוּמוֹ מִישׁוֹר. וְאוֹמֵר אֲנִי שֶׁאֵין אֵיל לְשׁוֹן מִישׁוֹר, אֶלָּא מִישׁוֹר שֶׁל פָּארָן אֵיל שְׁמוֹ, וְשֶׁל מַמְרֵא אֵלוֹנֵי שְׁמוֹ, וְשֶׁל יַרְדֵּן כִּכָּר שְׁמוֹ, וְשֶׁל שִׁטִּים אָבֵל שְׁמוֹ, אָבֵל הַשִּׁטִּים, וְכֵן בַּעַל גָּד בַּעַל שְׁמוֹ; וְכֻלָּם מְתֻרְגָּמִין מִישׁוֹר, וְכָל א' שְׁמוֹ עָלָיו:", "rashi_en": "According to the translation [מתוך Onkelos], it means “plain.” [However,] I maintain that this does not mean that \"אֵיל\" is to be translated as “plain” but that the plain מתוך Paran was called אֵיל and the one מתוך Mamrei was called Elonei and the one מתוך Jordan was called Kikar and the one מתוך Shittim was called Avel. Similarly, בַּעַל גָד [is a plain] whose name is Ba’al. [Though] they are all translated as “plain,” it actually refers to each one’s name.", "note": "", "points": [{"q": "Onkelos translates 'איל פארן' as 'the plain מתוך Paran'. Does רש״י agree that the word 'איל' means 'plain'?", "options": ["No, it's that plain's proper name", "Yes, איל always means a plain", "No, it means rams grazed there"], "kasha": "'איל' isn't a normal word for plain — is Onkelos translating it or naming it?", "answer": "Onkelos renders it 'plain,' but רש״י אומר איל isn't a word meaning plain; rather, Paran's plain was named איל."}, {"q": "How does רש״י show that different plains each had their own name?", "options": ["Other plains' names are also translated 'plain'", "Avram named every plain he passed", "One posuk lists all the plains together"], "kasha": "If איל is just a name, why would Onkelos translate it 'plain'?", "answer": "Mamrei's plain is called Elonei, the Yarden's Kikar, Shittim's Avel, and Baal Gad's Baal. All are translated 'plain,' yet each word is that plain's own name."}]}, {"id": "14:6.3", "ch": 14, "v": 6, "n": 3, "dh": "על המדבר", "pasuk_html": "וְאֶת־הַחֹרִ֖י בְּהַרְרָ֣ם שֵׂעִ֑יר עַ֚ד אֵ֣יל פָּארָ֔ן אֲשֶׁ֖ר עַל־הַמִּדְבָּֽר׃", "pasuk_en": "And the Chorites in their hills מתוך Seir, as far as Eil [the Plain מתוך] Paran which borders [is next to] the wilderness.", "rashi_he": "אֵצֶל הַמִּדְבָּר, כְּמוֹ וְעָלָיו מַטֵּה מְנַשֶּׁה (במדבר ב'):", "rashi_en": "[Meaning] by the wilderness, similar to “And next to him was the tribe מתוך Menasheh.”", "note": "", "points": [{"q": "'אשר על המדבר' — literally 'on the wilderness.' What does 'על' mean here?", "options": ["Next to the wilderness", "Above the wilderness, on a hill", "Because מתוך the wilderness"], "kasha": "'On the wilderness' doesn't make sense for a place.", "answer": "Next to the wilderness, like 'ועליו מטה מנשה' — and next to him was the tribe מתוך Menasheh."}]}, {"id": "14:7.1", "ch": 14, "v": 7, "n": 1, "dh": "עין משפט היא קדש", "pasuk_html": "וַ֠יָּשֻׁ֠בוּ וַיָּבֹ֜אוּ אֶל־עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַיַּכּ֕וּ אֶֽת־כׇּל־שְׂדֵ֖ה הָעֲמָלֵקִ֑י וְגַם֙ אֶת־הָ֣אֱמֹרִ֔י הַיֹּשֵׁ֖ב בְּחַֽצְצֹ֥ן תָּמָֽר׃", "pasuk_en": "They turned back and came to Ein Mishpat [the plain מתוך compromise] which is Kadeish [Rekem], and they struck all the territory מתוך Amaleik, as well as the Emorites who lived in Chazazon Tamar [Ein Gedi].", "rashi_he": "עַל שֵׁם הֶעָתִיד, שֶׁעֲתִידִין מֹשֶׁה וְאַהֲרֹן לְהִשְָּׁפֵט שָׁם עַל עִסְקֵי אוֹתוֹ הָעַיִן וְהֵם מֵי מְרִיבָה. וְאֻנְקְלוֹס תִּרְגְּמוֹ כִפְשׁוּטוֹ מָקוֹם שֶׁהָיוּ בְנֵי הַמְּדִינָה מִתְקַבְּצִים שָׁם לְכָל מִשְׁפָּט:", "rashi_en": "It was so called on account [מתוך the events] מתוך the future. For Moshe and Aharon were destined to be judged there concerning the events מתוך that fountain, which were the waters מתוך Merivah. Onkelos, however, translates it plainly, [i.e.,] “The place where the citizens מתוך the country would gather for all judgments.”", "note": "", "points": [{"q": "Why was Kadesh called 'עין משפט' — 'spring מתוך judgment'?", "options": ["Moshe and Aharon would be judged there later", "Avram judged the four kings there", "Its waters were used to test sotos"], "kasha": "No judgment had happened there yet — why this name?", "answer": "It's named for the future: Moshe and Aharon would be judged there over matters מתוך that spring — Mei Merivah."}, {"q": "How does Onkelos explain the name 'עין משפט' more simply?", "options": ["Where locals gathered for all their judgments", "Where Avram judged the four kings", "A spring whose water tested the guilty"], "kasha": "Naming a place for a far-מתוךf future event is unusual — is there a plainer meaning?", "answer": "Onkelos translates it plainly: the place where the people מתוך the land would gather for every judgment."}]}, {"id": "14:7.2", "ch": 14, "v": 7, "n": 2, "dh": "שדה העמלקי", "pasuk_html": "וַ֠יָּשֻׁ֠בוּ וַיָּבֹ֜אוּ אֶל־עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַיַּכּ֕וּ אֶֽת־כׇּל־<mark>שְׂדֵ֖ה הָעֲמָלֵקִ֑י</mark> וְגַם֙ אֶת־הָ֣אֱמֹרִ֔י הַיֹּשֵׁ֖ב בְּחַֽצְצֹ֥ן תָּמָֽר׃", "pasuk_en": "They turned back and came to Ein Mishpat [the plain מתוך compromise] which is Kadeish [Rekem], and they struck all the territory מתוך Amaleik, as well as the Emorites who lived in Chazazon Tamar [Ein Gedi].", "rashi_he": "עֲדַיִן לֹא נוֹלַד עֲמָלֵק, וְנִקְרָא עַל שֵׁם הֶעָתִיד:", "rashi_en": "[Though] Amaleik was not yet born [nevertheless,] it was so called based on the future.", "note": "", "points": [{"q": "The kings struck 'שדה העמלקי'. But was Amalek around yet?", "options": ["No — it's named for what it would become", "Yes, Amalek was already an old nation", "It was a different man named Amalek"], "kasha": "Amalek wasn't born yet at that time.", "answer": "Amalek wasn't born yet; the area is called by the name it would have in the future."}]}, {"id": "14:7.3", "ch": 14, "v": 7, "n": 3, "dh": "בחצצון תמר", "pasuk_html": "וַ֠יָּשֻׁ֠בוּ וַיָּבֹ֜אוּ אֶל־עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַיַּכּ֕וּ אֶֽת־כׇּל־שְׂדֵ֖ה הָעֲמָלֵקִ֑י וְגַם֙ אֶת־הָ֣אֱמֹרִ֔י הַיֹּשֵׁ֖ב בְּחַֽצְצֹ֥ן תָּמָֽר׃", "pasuk_en": "They turned back and came to Ein Mishpat [the plain מתוך compromise] which is Kadeish [Rekem], and they struck all the territory מתוך Amaleik, as well as the Emorites who lived in Chazazon Tamar [Ein Gedi].", "rashi_he": "הוּא עֵין גֶּדִי, מִקְרָא מָלֵא בְּדִבְרֵי הַיָּמִים (ב' כ') בִּיהוֹשָׁפָט:", "rashi_en": "Which is Ein Gedi. [It is] clearly stated in Divrei Hayamim concerning Yehoshafat.", "note": "", "points": [{"q": "Where is 'חצצן תמר'?", "options": ["Ein Gedi", "Yerushalayim", "Chevron"], "kasha": "'חצצן תמר' is an unfamiliar place name.", "answer": "It is Ein Gedi, as stated explicitly in Divrei Hayamim about Yehoshafat."}]}, {"id": "14:9.1", "ch": 14, "v": 9, "n": 1, "dh": "ארבעה מלכים וגו'", "pasuk_html": "אֵ֣ת כְּדׇרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְתִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְאַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְאַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת־הַחֲמִשָּֽׁה׃", "pasuk_en": "Against Kedorlaomer, king מתוך Eilam, Sidal, king מתוך Goyim [king מתוך peoples], Amraphel, king מתוך Shinar [Babylon], and Aryoch, king מתוך Elasar; [there were] four kings against the five.", "rashi_he": "וְאַף עַל פִּי כֵן נִצְּחוּ הַמֻּעָטִים, לְהוֹדִיעֲךָ שֶׁגִּבּוֹרִים הָיוּ, וְאַף עַל פִּי כֵן לֹא נִמְנַע אַבְרָהָם מִלִּרְדֹּף אַחֲרֵיהֶם:", "rashi_en": "Yet, the fewer ones were victorious. [This is] to inform you that they were powerful and, yet, Avraham did not refrain from giving chase to them.", "note": "", "points": [{"q": "The posuk stresses 'ארבעה מלכים את החמשה' — and the four won. What does that teach about them?", "options": ["They were mighty warriors", "The five kings never really fought", "The five kings surrendered without battle"], "kasha": "We can count the kings ourselves — why spell out four against five?", "answer": "Even though they were fewer, the four won — to tell you they were mighty warriors."}, {"q": "Why does the Torah want us to know these four kings were so mighty?", "options": ["Even so, Avram didn't hold back from chasing them", "To explain why Lot was captured so easily", "To show the five kings were cowards"], "kasha": "Why should the strength מתוך these kings matter to the story?", "answer": "Even so, Avraham did not refrain from pursuing them."}]}, {"id": "14:10.1", "ch": 14, "v": 10, "n": 1, "dh": "בארת בארת חמר", "pasuk_html": "וְעֵ֣מֶק הַשִּׂדִּ֗ים <mark>בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר</mark> וַיָּנֻ֛סוּ מֶֽלֶךְ־סְדֹ֥ם וַעֲמֹרָ֖ה וַיִּפְּלוּ־שָׁ֑מָּה וְהַנִּשְׁאָרִ֖ים הֶ֥רָה נָּֽסוּ׃", "pasuk_en": "The Valley מתוך Siddim [The plain מתוך the fields] was [full מתוך] mortar pits [pits from which they raise up mortar]; [and when] the Kings מתוך Sedom and Amorah fled they fell there [into the pits], while the remainder fled to the mountains.", "rashi_he": "בְּאֵרוֹת הַרְבֵּה הָיוּ שָׁם, שֶׁנּוֹטְלִין מִשָּׁם אֲדָמָה לְטִיט שֶׁל בִּנְיָן. וּמִדְרַש אַגָּדָה שֶׁהָיָה הַטִּיט מֻגְבָּל בָּהֶם, וְנַעֲשָׂה נֵס לְמֶלֶךְ סְדוֹם שֶׁיָּצָא מִשָּׁם, לְפִי שֶׁהָיוּ בָאֻמּוֹת מִקְצָתָן שֶׁלֹּא הָיוּ מַאֲמִינִין שֶׁנִּצַּל אַבְרָהָם מֵאוּר כַּשְׂדִּים מִכִּבְשַׁן הָאֵשׁ, וְכֵיוָן שֶׁיָּצָא זֶה מִן הַחֵמָר, הֶאֱמִינוּ בְאַבְרָם לְמַפְרֵעַ:", "rashi_en": "There were many pits from which earth was taken for mortar. The Midrashic explanation is, that the mortar was mixed in them and it was through a miracle that the King מתוך Sedom escaped from there. For among the nations there were some who did not believe that Avraham was saved from Ur Kasdim, from the fiery furnace. But, once he [the king מתוך Sedom] escaped from the mortar, they believed [the event concerning] Avraham retroactively.", "note": "", "points": [{"q": "What were the 'בארת בארת חמר' in the valley?", "options": ["Pits dug for clay used in building", "Wells מתוך water for the armies", "Traps dug by the four kings"], "kasha": "What were these pits מתוך חמר?", "answer": "There were many pits there from which earth was taken for building mortar."}, {"q": "The king מתוך Sedom fell into these pits, yet later goes out to meet Avram. How did he survive, per the Midrash?", "options": ["A miracle got him out מתוך the mortar", "His soldiers pulled him out with ropes", "The pits were shallow and dry"], "kasha": "Someone who fell into pits מתוך mortar should have died, yet the king מתוך Sedom reappears later.", "answer": "Midrash Aggadah: the mortar was mixed in the pits, and a miracle was done for the king מתוך Sedom that he came out."}, {"q": "Why would Hashem make a miracle for the wicked king מתוך Sedom?", "options": ["So doubters would believe Avram survived the furnace", "As a reward for fighting the four kings", "So he could return Lot's property"], "kasha": "The king מתוך Sedom was wicked — why did he deserve a miracle?", "answer": "Some among the nations didn't believe Avram was saved from the furnace in Ur Kasdim. Once this king came out מתוך the mortar, they believed about Avram retroactively."}]}, {"id": "14:10.2", "ch": 14, "v": 10, "n": 2, "dh": "הרה נסו", "pasuk_html": "וְעֵ֣מֶק הַשִּׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַיָּנֻ֛סוּ מֶֽלֶךְ־סְדֹ֥ם וַעֲמֹרָ֖ה וַיִּפְּלוּ־שָׁ֑מָּה וְהַנִּשְׁאָרִ֖ים <mark>הֶ֥רָה נָּֽסוּ׃</mark>", "pasuk_en": "The Valley מתוך Siddim [The plain מתוך the fields] was [full מתוך] mortar pits [pits from which they raise up mortar]; [and when] the Kings מתוך Sedom and Amorah fled they fell there [into the pits], while the remainder fled to the mountains.", "rashi_he": "לְהָר נָסוּ, הֶרָה, כְּמוֹ לְהָר; כָּל תֵּבָה שֶׁצְּרִיכָה לָמֶ\"ד בִּתְחִלָּתָהּ, הֵטִיל לָהּ הֵ\"א בְּסוֹפָהּ. וְיֵשׁ חִלּוּק בֵּין הֶרָה לְהָהָרָה, שֶׁהֵ\"א שֶׁבְּסוֹף הַתֵּבָה עוֹמֶדֶת בִּמְקוֹם לָמֶ\"ד שֶׁבְּרֹאשָׁהּ, אֲבָל אֵינָהּ עוֹמֶדֶת בִּמְקוֹם לָמֶ\"ד וּנְקוּדָה פַּתָּח תַּחְתֶּיהָ, וַהֲרֵי הֶרָה כְּמוֹ לְהַר אוֹ כְּמוֹ אֶל הַר, וְאֵינוֹ מְפָרֵשׁ לְאֵיזֶה הַר, אֶלָּא שֶׁכָּל אֶחָד נָס בַּאֲשֶׁר מָצָא הַר תְּחִלָּה, וּכְשֶׁהוּא נוֹתֵן הֵ\"א בְרֹאשָׁהּ לִכְתֹּב הָהָרָה אוֹ הַמִּדְבָּרָה, פִּתְרוֹנוֹ כְּמוֹ אֶל הָהָר אוֹ כְמוֹ לְהָהָר, וּמַשְׁמַע לְאוֹתוֹ הַר הַיָּדוּעַ וּמְפֹרָשׁ בַּפָּרָשָׁה:", "rashi_en": "[Meaning:] They fled to a mountain. הֶרָה is the same as לְהַר Any word that requires the letter ל' at the beginning one may put the letter ה' at the end, [instead]. There is a difference between הֶרָה and הָהָרָה in that the letter ה' at the end מתוך the word replaces a ל' at the beginning. But, it does not replace a ל' which has a pasach as vowel. Thus הֶרָה has the same meaning as לְהָר or אֶל הַר, not being explicit as to which mountain, because each one fled to whichever one he found first. But, when the letter ה' is placed at the beginning in order to write הָהָרָה or הַמִדְבָּרָה, then the meaning is “to the mountain” or the same as לְהָהָר — to the mountain connoting to the known mountain which is explicitly mentioned in that chapter.", "note": "", "points": [{"q": "What does 'הרה' mean in 'והנשארים הרה נסו'?", "options": ["To a mountain (להר)", "From the mountain", "On top מתוך the mountain"], "kasha": "'הרה' is an unusual word form.", "answer": "הרה = להר, 'to a mountain.' Any word that needs a ל at its start can take a ה at its end instead."}, {"q": "What's the difference between 'הרה' here and 'ההרה' (with an extra ה at the start)?", "options": ["הרה is any mountain; ההרה a specific known one", "There is no difference in meaning", "הרה is one mountain; ההרה many mountains"], "kasha": "The posuk doesn't say which mountain they fled to.", "answer": "The end-ה replaces a plain ל, not ל with a patach. So הרה = 'to a mountain' — each fled to whichever he found first. ההרה = 'to the mountain' already known from the parsha."}]}, {"id": "14:12.1", "ch": 14, "v": 12, "n": 1, "dh": "והוא ישב בסדום", "pasuk_html": "וַיִּקְח֨וּ אֶת־ל֧וֹט וְאֶת־רְכֻשׁ֛וֹ בֶּן־אֲחִ֥י אַבְרָ֖ם וַיֵּלֵ֑כוּ וְה֥וּא יֹשֵׁ֖ב בִּסְדֹֽם׃", "pasuk_en": "They took [captured] Lot and his wealth. [Lot was] Avram’s nephew. Then they went on their way. He had been living in Sedom.", "rashi_he": "מִי גָרַם לוֹ זֹאת? יְשִׁיבָתוֹ בִסְדוֹם:", "rashi_en": "[This is to teach:] what caused this to happen to him? [The fact] that he resided in Sedom.", "note": "", "points": [{"q": "Why does the posuk add 'והוא ישב בסדם' — don't we know Lot lived there?", "options": ["It explains why Lot got captured", "It shows Lot owned land in Sedom", "It tells us Lot was a judge there"], "kasha": "We already know Lot lived in Sedom — why repeat it here?", "answer": "To teach what caused his capture: his living in Sedom."}]}, {"id": "14:13.1", "ch": 14, "v": 13, "n": 1, "dh": "ויבא הפליט", "pasuk_html": "<mark>וַיָּבֹא֙ הַפָּלִ֔יט</mark> וַיַּגֵּ֖ד לְאַבְרָ֣ם הָעִבְרִ֑י וְהוּא֩ שֹׁכֵ֨ן בְּאֵֽלֹנֵ֜י מַמְרֵ֣א הָאֱמֹרִ֗י אֲחִ֤י אֶשְׁכֹּל֙ וַאֲחִ֣י עָנֵ֔ר וְהֵ֖ם בַּעֲלֵ֥י בְרִית־אַבְרָֽם׃", "pasuk_en": "The one who had escaped came and told Avram the Ivri, who was living in the Plains מתוך Mamrei the Emorite, the brother מתוך Eshkol and Aneir. They were Avram’s allies.", "rashi_he": "לְפִי פְשׁוּטוֹ זֶה עוֹג, שֶׁפָּלַט מִן הַמִּלְחָמָה, וְהוּא שֶׁכָּתוּב כִּי רַק עוֹג נִשְׁאַר מִיֶּתֶר הָרְפָאִים (דבר' ג') וְזֶהוּ נִשְׁאַר, שֶׁלֹּא הֲרָגוּהוּ אַמְרָפֶל וַחֲבֵרָיו כְּשֶׁהִכּוּ הָרְפָאִים בְּעַשְׁתְּרוֹת קַרְנַיִם, תַּנְחוּמָא וּמִדְרַשׁ בְּ\"רַ זֶה עוֹג, שֶׁפָּלַט מִדּוֹר הַמַּבּוּל; וְזֶהוּ מִיֶּתֶר הָרְפָאִים, שֶׁנֶּאֱמַר הַנְּפִלִים הָיוּ בָאָרֶץ וְגוֹ' (לְעֵיל ו') וּמִתְכַּוֵּן שֶׁיֵּהָרֵג אַבְרָם וְיִשָּׂא אֶת שָׂרָה:", "rashi_en": "According to the plain meaning, this refers to Og who escaped from the war. This is what is referred to in Scripture “For only Og was left from the remnant מתוך the Rephaim.” This is the meaning מתוך “was left,” that Amrophel and his company did not kill him when they smote the Rephaim in Ashteros Karnayim. [This is based on Midrash] Tanchuma. [However,] the Midrash Ber. Rab. [explains:] This refers to Og who escaped from the Generation מתוך the Flood. And that is [the meaning מתוך:] מִיֶּתֶר הָרְפָאִים as is written, “The giants were upon the land, etc.” It was his [Og’s] intention that Avram be killed so that he might marry Sarah.", "note": "", "points": [{"q": "'ויבא הפליט' — 'the escapee' came. By the simple meaning, who was he?", "options": ["Og, who escaped from this war", "Lot, who escaped his captors", "A servant sent by the king מתוך Sedom"], "kasha": "The posuk says 'the' escapee as if we know him, but doesn't say who.", "answer": "Og, who escaped the battle. That's 'רק עוג נשאר מיתר הרפאים' (Devarim 3): he was left when Amraphel and his allies struck the Rephaim in Ashteros Karnayim."}, {"q": "The Midrash also says the escapee was Og — but that he escaped from something else. From what?", "options": ["From the generation מתוך the Mabul", "From Nimrod's fiery furnace", "From the destruction מתוך Sedom"], "kasha": "'מיתר הרפאים' — 'remnant מתוך the Rephaim' — could refer to the ancient giants.", "answer": "בראשית Rabbah: Og escaped the generation מתוך the Mabul. That's 'מיתר הרפאים' — left over from the giants מתוך 'הנפלים היו בארץ' (בראשית 6)."}, {"q": "Why would Og bother to tell Avram that Lot was captured?", "options": ["He hoped Avram would be killed, so he'd marry Sarai", "He wanted Avram's help against the four kings", "He was Avram's loyal friend and ally"], "kasha": "Og was no friend מתוך Avram — why bring him the news?", "answer": "He intended that Avram be killed so that he could marry Sarah."}]}, {"id": "14:13.2", "ch": 14, "v": 13, "n": 2, "dh": "העברי", "pasuk_html": "וַיָּבֹא֙ הַפָּלִ֔יט וַיַּגֵּ֖ד לְאַבְרָ֣ם <mark>הָעִבְרִ֑י</mark> וְהוּא֩ שֹׁכֵ֨ן בְּאֵֽלֹנֵ֜י מַמְרֵ֣א הָאֱמֹרִ֗י אֲחִ֤י אֶשְׁכֹּל֙ וַאֲחִ֣י עָנֵ֔ר וְהֵ֖ם בַּעֲלֵ֥י בְרִית־אַבְרָֽם׃", "pasuk_en": "The one who had escaped came and told Avram the Ivri, who was living in the Plains מתוך Mamrei the Emorite, the brother מתוך Eshkol and Aneir. They were Avram’s allies.", "rashi_he": "שֶׁבָּא מֵעֵבֶר הַנָּהָר (בראשית רבה):", "rashi_en": "[He was so called] because he came from the other side מתוך the river.", "note": "", "points": [{"q": "Why is Avram called 'העברי' here?", "options": ["He came from across the river", "He spoke the Hebrew language", "He crossed over to fight the kings"], "kasha": "What does the title 'העברי' mean?", "answer": "Because he came from the other side (עבר) מתוך the river (בראשית Rabbah)."}]}, {"id": "14:13.3", "ch": 14, "v": 13, "n": 3, "dh": "בעלי ברית אברם", "pasuk_html": "וַיָּבֹא֙ הַפָּלִ֔יט וַיַּגֵּ֖ד לְאַבְרָ֣ם הָעִבְרִ֑י וְהוּא֩ שֹׁכֵ֨ן בְּאֵֽלֹנֵ֜י מַמְרֵ֣א הָאֱמֹרִ֗י אֲחִ֤י אֶשְׁכֹּל֙ וַאֲחִ֣י עָנֵ֔ר וְהֵ֖ם בַּעֲלֵ֥י בְרִית־אַבְרָֽם׃", "pasuk_en": "The one who had escaped came and told Avram the Ivri, who was living in the Plains מתוך Mamrei the Emorite, the brother מתוך Eshkol and Aneir. They were Avram’s allies.", "rashi_he": "שֶׁכָּרְתוּ עִמּוֹ בְּרִית:", "rashi_en": "They had entered into a covenant with him. (Another version [מתוך Rashi]: Another explanation: They advised him concerning his circumcision, as is explained elsewhere.).", "note": "", "points": [{"q": "What does 'בעלי ברית אברם' mean?", "options": ["They had made a treaty with him", "They were his blood relatives", "They owned the land he lived on"], "kasha": "'Masters מתוך Avram's bris' is unclear — which bris?", "answer": "They had made a covenant with him."}]}, {"id": "14:14.1", "ch": 14, "v": 14, "n": 1, "dh": "וירק", "pasuk_html": "וַיִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑יו <mark>וַיָּ֨רֶק</mark> אֶת־חֲנִיכָ֜יו יְלִידֵ֣י בֵית֗וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּשְׁלֹ֣שׁ מֵא֔וֹת וַיִּרְדֹּ֖ף עַד־דָּֽן׃", "pasuk_en": "When Avram heard that his kinsman was taken captive, he armed his trained servants [lads] who were born in his household, three hundred and eighteen [men], and he pursued [them] until Dan.", "rashi_he": "כְּתַרְגּוּמוֹ וְזָרִיז, וְכֵן וַהֲרִיקֹתִי אַחֲרֵיכֶם חָרֶב (ויקרא כ\"ו) – אֶזְדַּיֵּן בְּחַרְבִּי עֲלֵיכֶם, וְכֵן אָרִיק חַרְבִּי (שמות ט\"ו), וְכֵן וְהָרֵק חֲנִית וּסְגֹר (תה' ל\"ה):", "rashi_en": "As the Targum translates: “And he armed.” Similarly: וַהֲרִיקוֹתִי אַחֲרֵיכֶם חָרֶב [is translated by Onkelos:] “I will arm myself with a sword against you.” Similarly: אָרִיק חַרְבִּי [“I will arm myself with sword”]. “Similarly:” Arm yourself with sword and ax.”", "note": "", "points": [{"q": "What does 'וירק' mean in 'וירק את חניכיו'?", "options": ["He armed them", "He emptied his house מתוך them", "He sent them away quickly"], "kasha": "'וירק' is an unusual word (it usually means 'emptied') — what does it mean here?", "answer": "As Onkelos translates: he armed them. Similarly 'והריקתי אחריכם חרב', 'אריק חרבי' and 'והרק חנית' — arming with a weapon."}]}, {"id": "14:14.2", "ch": 14, "v": 14, "n": 2, "dh": "חניכיו", "pasuk_html": "וַיִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑יו וַיָּ֨רֶק אֶת־<mark>חֲנִיכָ֜יו</mark> יְלִידֵ֣י בֵית֗וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּשְׁלֹ֣שׁ מֵא֔וֹת וַיִּרְדֹּ֖ף עַד־דָּֽן׃", "pasuk_en": "When Avram heard that his kinsman was taken captive, he armed his trained servants [lads] who were born in his household, three hundred and eighteen [men], and he pursued [them] until Dan.", "rashi_he": "חנכו כְּתִיב (ס\"אֲ קְרֵי), זֶה אֱלִיעֶזֶר שֶׁחִנְּכוֹ לְמִצְוֹת וְהוּא לְשׁוֹן הַתְחָלַת כְּנִיסַת הָאָדָם אוֹ כְלִי לָאֻמָּנוּת שֶׁהוּא עָתִיד לַעֲמֹד בָּהּ, וְכֵן חֲנֹךְ לַנַּעַר (משלי כ\"ב), חֲנֻכַּת הַמִּזְבֵּחַ (במד' ז'), חֲנֻכַּת הַבַּיִת (תה' ל') ובלע\"ז קוֹרִין לוֹ אינצ\"נייר:", "rashi_en": "It is written חֲנִיכוֹ [singular], “his trained one,” referring to Eliezer whom he trained to observe the mitzvos. And it [i.e., the word חֲנִיכָיו] means the initiation [or training] מתוך a person or vessel to its designated occupation [or use]. Similarly: “Train the youth,” [or:] “The initiation מתוך the altar,” [or:] “The initiation [i.e., dedication] מתוך the Temple.” In Old French it is called enseigner.", "note": "", "points": [{"q": "'חניכיו' is written without a yud (חנכו), as if singular. Who is meant?", "options": ["Eliezer, whom Avram trained in mitzvos", "Avram's sons, who were still young", "Lot's servants who came to help"], "kasha": "The word is spelled singular but read plural.", "answer": "The spelling hints to one man, Eliezer, whom Avram trained in mitzvos."}, {"q": "What does the root 'חנך' mean?", "options": ["Starting a person or vessel in its future role", "Feeding and raising a child", "Giving a gift to a teacher"], "kasha": "Why call trained servants 'חניכים'?", "answer": "It means initiating a person or vessel into the work it will do, like 'חנך לנער', 'חנכת המזבח' and 'חנכת הבית'."}]}, {"id": "14:14.3", "ch": 14, "v": 14, "n": 3, "dh": "שמנה עשר וגו'", "pasuk_html": "וַיִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑יו וַיָּ֨רֶק אֶת־חֲנִיכָ֜יו יְלִידֵ֣י בֵית֗וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּשְׁלֹ֣שׁ מֵא֔וֹת וַיִּרְדֹּ֖ף עַד־דָּֽן׃", "pasuk_en": "When Avram heard that his kinsman was taken captive, he armed his trained servants [lads] who were born in his household, three hundred and eighteen [men], and he pursued [them] until Dan.", "rashi_he": "רַבּוֹתֵינוּ אָמְרוּ אֱלִיעֶזֶר לְבַדּוֹ הָיָה (נדרים ל\"ב), וְהוּא מִנְיַן גִּימַטְרִיָּא שֶׁל שְׁמוֹ:", "rashi_en": "Our Sages said that it was Eliezer alone. And it [the number 318] is the gematria equivalent מתוך his name.", "note": "", "points": [{"q": "Did Avram really go to war with exactly 318 men ('שמנה עשר ושלש מאות')?", "options": ["It was Eliezer alone — his name equals 318", "Yes, 318 trained soldiers and nobody else", "318 was the number מתוך years Avram lived"], "kasha": "Why give such an exact, odd number?", "answer": "Chazal (Nedarim) say it was Eliezer alone: 318 is the gematria מתוך אליעזר."}]}, {"id": "14:14.4", "ch": 14, "v": 14, "n": 4, "dh": "עד דן", "pasuk_html": "וַיִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑יו וַיָּ֨רֶק אֶת־חֲנִיכָ֜יו יְלִידֵ֣י בֵית֗וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּשְׁלֹ֣שׁ מֵא֔וֹת וַיִּרְדֹּ֖ף עַד־דָּֽן׃", "pasuk_en": "When Avram heard that his kinsman was taken captive, he armed his trained servants [lads] who were born in his household, three hundred and eighteen [men], and he pursued [them] until Dan.", "rashi_he": "שָׁם תָּשַׁשׁ כֹּחוֹ, שֶׁרָאָה שֶׁעֲתִידִין בָּנָיו לְהַעֲמִיד שָׁם עֵגֶל (סנה' צ\"ו):", "rashi_en": "There his strength ebbed. For he saw [prophetically] that his children were destined to erect a [golden] calf there.", "note": "", "points": [{"q": "Avram chased the kings 'עד דן'. Why mention where he got to?", "options": ["He foresaw a golden calf would stand there", "Dan was the border מתוך Eretz Yisroel", "His men refused to go any further"], "kasha": "Why stop at Dan, and why tell us?", "answer": "There his strength weakened, because he foresaw that his descendants would set up a golden calf there (Sanhedrin)."}]}, {"id": "14:15.1", "ch": 14, "v": 15, "n": 1, "dh": "ויחלק עליהם", "pasuk_html": "<mark>וַיֵּחָלֵ֨ק עֲלֵיהֶ֧ם</mark>&thinsp;׀&thinsp;לַ֛יְלָה ה֥וּא וַעֲבָדָ֖יו וַיַּכֵּ֑ם וַֽיִּרְדְּפֵם֙ עַד־חוֹבָ֔ה אֲשֶׁ֥ר מִשְּׂמֹ֖אל לְדַמָּֽשֶׂק׃", "pasuk_en": "He divided [his men] against them at night, he and his servants and he attacked them. He pursued them until Chovah, which is to the left [north] מתוך Damascus.", "rashi_he": "לְפִי פְשׁוּטוֹ סָרֵס הַמִּקְרָא \"וַיֵּחָלֵק הוּא וַעֲבָדָיו עֲלֵיהֶם לַיְלָה\" כְּדֶּרֶך הָרוֹדְפִים שֶׁמִּתְפַּלְּגִים אַחַר הַנִּרְדָּפִים, כְּשֶׁבּוֹרְחִין זֶה לְכָאן וְזֶה לְכָאן:", "rashi_en": "According to its plain meaning the verse should be inverted [as if to read:] “He divided himself, he and his servants, against them, at night,” in the manner מתוך pursuers who chase after those who are fleeing who run in different directions.", "note": "", "points": [{"q": "'ויחלק עליהם לילה הוא ועבדיו' — the word order is odd. How should we read it?", "options": ["Avram and his men split up to chase scattered enemies", "Avram divided the spoils among his servants", "The enemy split Avram's camp in two"], "kasha": "The word order is jumbled and it's unclear who divided what.", "answer": "Rearrange it: 'He divided himself, he and his servants, against them at night' — like pursuers who split up to chase enemies fleeing in different directions."}]}, {"id": "14:15.2", "ch": 14, "v": 15, "n": 2, "dh": "לילה", "pasuk_html": "וַיֵּחָלֵ֨ק עֲלֵיהֶ֧ם&thinsp;׀&thinsp;<mark>לַ֛יְלָה</mark> ה֥וּא וַעֲבָדָ֖יו וַיַּכֵּ֑ם וַֽיִּרְדְּפֵם֙ עַד־חוֹבָ֔ה אֲשֶׁ֥ר מִשְּׂמֹ֖אל לְדַמָּֽשֶׂק׃", "pasuk_en": "He divided [his men] against them at night, he and his servants and he attacked them. He pursued them until Chovah, which is to the left [north] מתוך Damascus.", "rashi_he": "כְּלוֹמַר אַחַר שֶׁחָשְׁכָה לֹא נִמְנַע מִלְּרָדְפָם. וּמִדְרַשׁ אַגָּדָה שֶׁנֶּחֱלַק הַלַּיְלָה, וּבְחֶצְיוֹ הָרִאשׁוֹן נַעֲשָׂה לוֹ נֵס, וְחֶצְיוֹ הַשֵּׁנִי נִשְׁמַר וּבָא לוֹ לַחֲצוֹת לַיְלָה שֶׁל מִצְרַיִם:", "rashi_en": "Meaning, that [even] after nightfall they didn’t give up pursuing them. [However,] the Midrashic explanation is: The night was divided [into two parts]. During the first half a miracle occurred for him, while the second half was held in reserve for [the miracle מתוך] midnight in Egypt.", "note": "", "points": [{"q": "Why does the posuk mention that the attack was 'לילה' — at night?", "options": ["Even after dark he kept chasing them", "The enemies were asleep and unguarded", "Hashem made it dark in the daytime"], "kasha": "Why tell us it was night?", "answer": "Even after nightfall he didn't hold back from pursuing them."}, {"q": "The Midrash reads 'ויחלק... לילה' as the night itself being divided. How?", "options": ["First half for Avram's miracle; second saved for Mitzrayim", "Half the night fighting, half resting", "Avram split his men into night watches"], "kasha": "'ויחלק' stands נכון next to 'לילה' — maybe the night was what was divided.", "answer": "The night was split: in its first half a miracle was done for Avram, and the second half was kept for midnight in Mitzrayim."}]}, {"id": "14:15.3", "ch": 14, "v": 15, "n": 3, "dh": "עד חובה", "pasuk_html": "וַיֵּחָלֵ֨ק עֲלֵיהֶ֧ם&thinsp;׀&thinsp;לַ֛יְלָה ה֥וּא וַעֲבָדָ֖יו וַיַּכֵּ֑ם וַֽיִּרְדְּפֵם֙ עַד־חוֹבָ֔ה אֲשֶׁ֥ר מִשְּׂמֹ֖אל לְדַמָּֽשֶׂק׃", "pasuk_en": "He divided [his men] against them at night, he and his servants and he attacked them. He pursued them until Chovah, which is to the left [north] מתוך Damascus.", "rashi_he": "אֵין מָקוֹם שֶׁשְּׁמוֹ חוֹבָה, וְדָן קוֹרֵא חוֹבָה, עַל שֵׁם עֲבוֹדָה זָרָה שֶׁעֲתִידָה לִהְיוֹת שָׁם:", "rashi_en": "There is no place that is called Chovah, but [the city מתוך] Dan is called Chovah [guilty] because מתוך the idolatry that would eventually take place there.", "note": "", "points": [{"q": "Where is 'חובה', north מתוך Damascus?", "options": ["Dan, called 'guilt' for its future avodah zarah", "A small town just outside Damascus", "Chevron, where Avram lived"], "kasha": "There's no known place called Chovah.", "answer": "No place is named Chovah; Dan is called חובה ('guilt') because מתוך the avodah zarah that would be there."}]}, {"id": "14:17.1", "ch": 14, "v": 17, "n": 1, "dh": "עמק שוה", "pasuk_html": "וַיֵּצֵ֣א מֶֽלֶךְ־סְדֹם֮ לִקְרָאתוֹ֒ אַחֲרֵ֣י שׁוּב֗וֹ מֵֽהַכּוֹת֙ אֶת־כְּדׇרְלָעֹ֔מֶר וְאֶת־הַמְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑וֹ אֶל־<mark>עֵ֣מֶק שָׁוֵ֔ה</mark> ה֖וּא עֵ֥מֶק הַמֶּֽלֶךְ׃", "pasuk_en": "The King מתוך Sedom went out to meet him after his return from defeating Kedorlaomer and the kings that were with him, to the Valley מתוך Shaveh which is the King’s Valley [to the barren plain, which is the place מתוך the racetrack מתוך the king].", "rashi_he": "כָּךְ שְׁמוֹ, כְּתַרְגּוּמוֹ לְמֵישַׁר מְפַנָּא – פָּנוּי מֵאִילָנוֹת וּמִכָּל מִכְשׁוֹל:", "rashi_en": "That is its name as the Targum explains לְמֵיֹשַר מַפְנָא [the barren plain] — empty מתוך trees and from all impediments.", "note": "", "points": [{"q": "What is 'עמק שוה'?", "options": ["A plain clear מתוך trees and obstacles", "A valley full מתוך hills and rocks", "A valley worth (שוה) much money"], "kasha": "'עמק שוה' is an unusual name — what does it mean?", "answer": "That's its name; Onkelos renders it a clear plain — empty מתוך trees and any obstacle."}]}, {"id": "14:17.2", "ch": 14, "v": 17, "n": 2, "dh": "עמק המלך", "pasuk_html": "וַיֵּצֵ֣א מֶֽלֶךְ־סְדֹם֮ לִקְרָאתוֹ֒ אַחֲרֵ֣י שׁוּב֗וֹ מֵֽהַכּוֹת֙ אֶת־כְּדׇרְלָעֹ֔מֶר וְאֶת־הַמְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑וֹ אֶל־עֵ֣מֶק שָׁוֵ֔ה ה֖וּא <mark>עֵ֥מֶק הַמֶּֽלֶךְ׃</mark>", "pasuk_en": "The King מתוך Sedom went out to meet him after his return from defeating Kedorlaomer and the kings that were with him, to the Valley מתוך Shaveh which is the King’s Valley [to the barren plain, which is the place מתוך the racetrack מתוך the king].", "rashi_he": "בֵּית רֵיסָא דְמַלְכָּא בֵּית רִיס א' שֶׁהוּא שְׁלֹשִׁים קָנִים, שֶׁהָיָה מְיֻחָד לַמֶּלֶךְ לְצַחֵק שָׁם. וּמִדְרַשׁ אַגָּדָה עֵמֶק, שֶׁהֻשְׁווּ שָׁם כָּל הָאֻמּוֹת וְהִמְלִיכוּ אֶת אַבְרָהָם עֲלֵיהֶם לִנְשִׂיא אֱלֹהִים וּלְקָצִין:", "rashi_en": "[Onkelos:] “the hippodrome מתוך the king.” One hippodrome, thirty kanim long, that was designated for the king’s sport. [However,] Midrash Aggadah [explains] that it was a valley where all nations were in agreement and appointed Avraham over them as a prince מתוך God and leader.", "note": "", "points": [{"q": "Why was it called 'עמק המלך' — the king's valley?", "options": ["It was the king's sporting ground", "The king מתוך Sedom was buried there", "Malki Tzedek's palace stood there"], "kasha": "Which king, and why is the valley named for him?", "answer": "Onkelos: the king's racecourse — one ris, thirty kanim long — set aside for the king's sport."}, {"q": "The Midrash explains 'עמק שוה... עמק המלך' differently. What happened in this valley?", "options": ["All the nations agreed and crowned Avraham their leader", "The kings made a peace treaty with Sedom", "Malki Tzedek was crowned king מתוך Shalem"], "kasha": "'שוה' (equal, agreed) and 'המלך' (king) together hint at an event.", "answer": "Midrash Aggadah: there all the nations were מתוך one mind (הושוו) and made Avraham king over them — a prince מתוך Hashem and a leader."}]}, {"id": "14:18.1", "ch": 14, "v": 18, "n": 1, "dh": "ומלכי צדק", "pasuk_html": "וּמַלְכִּי־צֶ֙דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָיָ֑יִן וְה֥וּא כֹהֵ֖ן לְאֵ֥ל עֶלְיֽוֹן׃", "pasuk_en": "Malki Zedek, king מתוך Shaleim [Yerushalayim], brought out bread and wine. He was a Kohein מתוך [He was serving before] the Most High Almighty.", "rashi_he": "מִ\"אַ הוּא שֵׁם בֶן נֹחַ (נדרים ל\"ב):", "rashi_en": "The Midrash Aggadah [explains] that he is Sheim, the son מתוך Noach.", "note": "", "points": [{"q": "Who was 'מלכי צדק', king מתוך Shalem?", "options": ["Shem, son מתוך Noach", "Ever, Avram's teacher", "Nimrod's son"], "kasha": "A new person suddenly appears with no background — who is he?", "answer": "The Midrash (Nedarim) says he was Shem, son מתוך Noach."}]}, {"id": "14:18.2", "ch": 14, "v": 18, "n": 2, "dh": "לחם ויין", "pasuk_html": "וּמַלְכִּי־צֶ֙דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא <mark>לֶ֣חֶם וָיָ֑יִן</mark> וְה֥וּא כֹהֵ֖ן לְאֵ֥ל עֶלְיֽוֹן׃", "pasuk_en": "Malki Zedek, king מתוך Shaleim [Yerushalayim], brought out bread and wine. He was a Kohein מתוך [He was serving before] the Most High Almighty.", "rashi_he": "כָּךְ עוֹשִׂים לִיגִיעֵי מִלְחָמָה, וְהֶרְאָה לוֹ שֶׁאֵין בְּלִבּוֹ עָלָיו עַל שֶׁהָרַג אֶת בָּנָיו. ומִ\"אַ רָמַז לוֹ עַל הַמְּנָחוֹת וְעַל הַנְּסָכִים שֶׁיַּקְרִיבוּ שָׁם בָּנָיו:", "rashi_en": "This is done for those who are battle-weary. He showed him that he bore him no resentment for his having killed his descendants. [However,] Midrash Aggadah [explains:] that he [Malki Zedek] intimated to him regarding the meal-מתוךferings and the libations that his [Avraham’s] descendants would מתוךfer there.", "note": "", "points": [{"q": "Why did Malki Tzedek bring out specifically 'לחם ויין'?", "options": ["That's what is given to battle-weary men", "It was a holiday feast", "It was payment for rescuing Lot"], "kasha": "Why bread and wine, and why now?", "answer": "This is what is done for men worn out from war."}, {"q": "Malki Tzedek is Shem, and the kings Avram killed were his descendants. What did his gift show?", "options": ["That he held no grudge against Avram", "That he wanted Avram to make peace", "That he would avenge them later"], "kasha": "Shem might have been angry at Avram for killing his own descendants.", "answer": "He showed Avram that he bore no resentment in his heart for Avram's killing his descendants."}, {"q": "Malki Tzedek was a kohen. What did the bread and wine hint to, per the Midrash?", "options": ["Menachos and nesachim Avram's children would מתוךfer there", "The meal Avraham would serve the malachim", "The bread and wine מתוך Kiddush"], "kasha": "A kohen bringing bread and wine may be hinting at something holy.", "answer": "Midrash Aggadah: he hinted to Avram about the menachos (flour-מתוךferings) and nesachim (wine-libations) his descendants would מתוךfer there."}]}, {"id": "14:19.1", "ch": 14, "v": 19, "n": 1, "dh": "קנה שמים וארץ", "pasuk_html": "וַֽיְבָרְכֵ֖הוּ וַיֹּאמַ֑ר בָּר֤וּךְ אַבְרָם֙ לְאֵ֣ל עֶלְי֔וֹן <mark>קֹנֵ֖ה שָׁמַ֥יִם וָאָֽרֶץ׃</mark>", "pasuk_en": "He blessed him and said: Blessed be Avram to the Most High, Almighty Possessor מתוך heaven and earth.", "rashi_he": "כְּמוֹ עֹשֵׂה שָׁמַיִם וָאָרֶץ (תה' קל\"ד); עַל יְדֵי עֲשִׂיָּתָן קְנָאָן לִהְיוֹת שֶׁלּוֹ:", "rashi_en": "[The meaning is] the same as “Maker מתוך heaven and earth.” Through His having made them He acquired them to be His.", "note": "", "points": [{"q": "Hashem is called 'קנה שמים וארץ'. Did Hashem 'buy' heaven and earth?", "options": ["By making them, He owns them", "He bought them from the malachim", "He will acquire them in the future"], "kasha": "'קנה' usually means 'acquire' or 'buy' — how does that fit Hashem?", "answer": "It means 'Maker מתוך heaven and earth' (like 'עשה שמים וארץ', Tehillim): by making them, He acquired them as His own."}]}, {"id": "14:20.1", "ch": 14, "v": 20, "n": 1, "dh": "אשר מגן", "pasuk_html": "וּבָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר־מִגֵּ֥ן צָרֶ֖יךָ בְּיָדֶ֑ךָ וַיִּתֶּן־ל֥וֹ מַעֲשֵׂ֖ר מִכֹּֽל׃", "pasuk_en": "And blessed be the Most High Almighty Who has delivered your enemies into your hand. [Avram] gave him a tenth מתוך everything.", "rashi_he": "אֲשֶׁר הִסְגִּיר, וְכֵן אֲמַגֶּנְךָ יִשְׂרָאֵל (הושע י\"א):", "rashi_en": "[Meaning] “who has delivered,” as in “[How] can I deliver you, Israel?”", "note": "", "points": [{"q": "What does 'מגן' mean in 'אשר מגן צריך בידך'?", "options": ["Delivered, handed over", "Shielded you from", "Weakened"], "kasha": "'מגן' usually means 'shield,' which doesn't fit 'your enemies into your hand.'", "answer": "'Who delivered' your enemies, as in 'אמגנך ישראל' (Hoshea)."}]}, {"id": "14:20.2", "ch": 14, "v": 20, "n": 2, "dh": "ויתן לו", "pasuk_html": "וּבָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר־מִגֵּ֥ן צָרֶ֖יךָ בְּיָדֶ֑ךָ וַיִּתֶּן־ל֥וֹ מַעֲשֵׂ֖ר מִכֹּֽל׃", "pasuk_en": "And blessed be the Most High Almighty Who has delivered your enemies into your hand. [Avram] gave him a tenth מתוך everything.", "rashi_he": "אַבְרָהָם <b>מעשר מכל</b> אֲשֶׁר לוֹ, לְפִי שֶׁהָיָה כֹהֵן:", "rashi_en": "Avram [gave him] a tenth מתוך everything that he owned because he [Malki Zedek] was a kohein.", "note": "", "points": [{"q": "'ויתן לו מעשר מכל' — who gave a tenth to whom, and why?", "options": ["Avram to Malki Tzedek, since he was a kohen", "Malki Tzedek to Avram, as a reward", "Avram to Sedom's king, as a tax"], "kasha": "The posuk doesn't say who gave to whom.", "answer": "Avram gave Malki Tzedek a tenth מתוך everything he had, because he was a kohen."}]}, {"id": "14:21.1", "ch": 14, "v": 21, "n": 1, "dh": "תן לי הנפש", "pasuk_html": "וַיֹּ֥אמֶר מֶֽלֶךְ־סְדֹ֖ם אֶל־אַבְרָ֑ם תֶּן־לִ֣י הַנֶּ֔פֶשׁ וְהָרְכֻ֖שׁ קַֽח־לָֽךְ׃", "pasuk_en": "The King מתוך Sedom said to Avram: Give me the people, and take the possessions for yourself.", "rashi_he": "מִן הַשְּׁבִי שֶׁלִּי שֶׁהִצַּלְתָּ, הַחֲזֵר לִי הַגּוּפִים לְבַדָּם:", "rashi_en": "[Meaning:] מתוך all my things that were captured that you rescued, return only the people to me.", "note": "", "points": [{"q": "What does Sedom's king mean by 'תן לי הנפש'?", "options": ["Return just the captured people", "Give me your own life in surrender", "Hand Lot over to be my servant"], "kasha": "'Give me the soul' is unclear — whose souls?", "answer": "Of my captured property that you rescued, return only the people to me (and keep the goods)."}]}, {"id": "14:22.1", "ch": 14, "v": 22, "n": 1, "dh": "הרימתי ידי", "pasuk_html": "וַיֹּ֥אמֶר אַבְרָ֖ם אֶל־מֶ֣לֶךְ סְדֹ֑ם הֲרִמֹ֨תִי יָדִ֤י אֶל־יְהֹוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָאָֽרֶץ׃", "pasuk_en": "Avram said to the King מתוך Sedom: I have lifted my hand [in prayer] to [before] Adonoy [before] the Most High Almighty, Possessor מתוך heaven and earth.", "rashi_he": "לְשׁוֹן שְׁבוּעָה, מֵרִים אֲנִי אֶת יָדִי לְאֵל עֶלְיוֹן, וְכֵן בִּי נִשְׁבַּעְתִּי (בר' כ\"ב), נִשְׁבַּע אֲנִי, וְכֵן נָתַתִּי כֶּסֶף הַשָּׂדֶה קַח מִמֶּנִּי (שם כ\"ג), נוֹתֵן אֲנִי לְךָ כֶּסֶף הַשָּׂדֶה, קָחֵהוּ מִמֶּנִּי:", "rashi_en": "This is an expression מתוך an oath: “I lift my hand to God, Most High.” Similarly: בִּי נִשְׁבַּעְתִּי [means,] “I swear.” Similarly: נָתַתִּי כֶּסֶף הַשָּׂדֶה קַח מִמֶּנִּי, [means:] “I am giving you the price מתוך the field, take it from me.”", "note": "", "points": [{"q": "Avram says 'הרימתי ידי אל ה''. What does lifting the hand mean here?", "options": ["Swearing an oath", "Raising a weapon to fight", "Signaling surrender"], "kasha": "Lifting a hand to Hashem is unclear here.", "answer": "It's an expression מתוך an oath: 'I lift my hand to Hashem, the Most High' — I swear."}, {"q": "'הרימתי' is past tense, yet Avram swears נכון now. How does רש״י read the tense?", "options": ["As present: 'I lift my hand'", "As future: 'I will lift my hand'", "As a command: 'Lift your hand'"], "kasha": "The past tense 'I lifted' doesn't fit an oath being made now.", "answer": "As present: 'I lift.' Similarly 'בי נשבעתי' means 'I swear,' and 'נתתי כסף השדה קח ממני' means 'I am giving you the field's money, take it.'"}]}, {"id": "14:23.1", "ch": 14, "v": 23, "n": 1, "dh": "אם מחוט ועד שרוך נעל", "pasuk_html": "אִם־מִחוּט֙ וְעַ֣ד שְׂרֽוֹךְ־נַ֔עַל וְאִם־אֶקַּ֖ח מִכׇּל־אֲשֶׁר־לָ֑ךְ וְלֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת־אַבְרָֽם׃", "pasuk_en": "Neither a thread nor a shoelace! And I will not take anything מתוך yours, so you will not [be able] to say, I have made Avram wealthy.", "rashi_he": "אַעֲכֵּב לְעַצְמִי מִן הַשְּׁבִי:", "rashi_en": "Will I retain for myself from the spoils.", "note": "", "points": [{"q": "'אם מחוט ועד שרוך נעל' is an incomplete sentence. What is missing?", "options": ["...will I keep for myself from the spoils", "...will I give you as payment", "...did Lot lose in the war"], "kasha": "The sentence doesn't finish — not even a thread … what?", "answer": "'…will I keep for myself from the captured spoils.'"}]}, {"id": "14:23.2", "ch": 14, "v": 23, "n": 2, "dh": "ואם אקח מכל אשר לך", "pasuk_html": "אִם־מִחוּט֙ וְעַ֣ד שְׂרֽוֹךְ־נַ֔עַל וְאִם־אֶקַּ֖ח מִכׇּל־אֲשֶׁר־לָ֑ךְ וְלֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת־אַבְרָֽם׃", "pasuk_en": "Neither a thread nor a shoelace! And I will not take anything מתוך yours, so you will not [be able] to say, I have made Avram wealthy.", "rashi_he": "וְאִם תֹּאמַר לָתֵת לִי שָׂכָר מִבֵּית גְּנָזֶיךָ, לֹא אֶקַּח:", "rashi_en": "And if you מתוךfer to compensate me from your own treasure house I will not accept.", "note": "", "points": [{"q": "Avram already refused the spoils. What does 'ואם אקח מכל אשר לך' add?", "options": ["He won't take a reward from Sedom's own treasury", "He won't take Lot's property either", "He won't eat Sedom's food on the way home"], "kasha": "This seems to repeat what Avram already said.", "answer": "Even if you מתוךfer to pay me from your own treasury, I won't take it."}]}, {"id": "14:23.3", "ch": 14, "v": 23, "n": 3, "dh": "ולא תאמר וגו'", "pasuk_html": "אִם־מִחוּט֙ וְעַ֣ד שְׂרֽוֹךְ־נַ֔עַל וְאִם־אֶקַּ֖ח מִכׇּל־אֲשֶׁר־לָ֑ךְ וְלֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת־אַבְרָֽם׃", "pasuk_en": "Neither a thread nor a shoelace! And I will not take anything מתוך yours, so you will not [be able] to say, I have made Avram wealthy.", "rashi_he": "שֶׁהַקָּדוֹשׁ בָּרוּךְ הוּא הִבְטִיחַנִי לְעַשְּׁרֵנִי, שֶׁנֶּאֱמַר וַאֲבָרֶכְךָ וְגוֹ':", "rashi_en": "“For, God, has [already] promised me to make me wealthy,” as it is said: “And I will bless you, etc.”", "note": "", "points": [{"q": "Why does Avram care that Sedom's king won't say 'אני העשרתי את אברם'?", "options": ["Hashem had already promised to make him rich", "He feared Sedom would later demand it back", "He didn't want Lot to be jealous"], "kasha": "Why should it matter to Avram who gets credit for his wealth?", "answer": "Because Hashem already promised to make him wealthy, as it says 'ואברכך.'"}]}, {"id": "14:24.1", "ch": 14, "v": 24, "n": 1, "dh": "הנערים", "pasuk_html": "בִּלְעָדַ֗י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ <mark>הַנְּעָרִ֔ים</mark> וְחֵ֙לֶק֙ הָֽאֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑י עָנֵר֙ אֶשְׁכֹּ֣ל וּמַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽם׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "I am excluding myself; only what the lads have eaten, and the portion מתוך the men who went with me, Aneir, Eshkol and Mamrei, they may take their portion.", "rashi_he": "עֲבָדַי אֲשֶׁר הָלְכוּ אִתִּי וְעוֹד עָנֵר אֶשְׁכֹּל וּמַמְרֵא וְגוֹ'; אַף עַל פִּי שֶׁעֲבָדַי נִכְנְסוּ לַמִּלְחָמָה, שֶׁנֶּאֱמַר הוּא וַעֲבָדָיו וַיַּכֵּם, וְעָנֵר וַחֲבֵרָיו יָשְׁבוּ עַל הַכֵּלִים לִשְׁמֹר, אֲפִלּוּ הָכִי הֵם יִקְחוּ חֶלְקָם. וּמִמֶּנּוּ לָמַד דָּוִד, שֶׁאָמַר כְּחֵלֶק הַיֹּרֵד בַּמִּלְחָמָה וּכְחֵלֶק הַיֹּשֵׁב עַל הַכֵּלִים יַחְדָּו יַחֲלֹקוּ (שמואל א ל'), וּלְכָךְ נֶאֱמַר וַיְהִי מֵהַיּוֹם הַהוּא וָמָעְלָה וַיְשִׂמֶהָ לְחֹק וּלְמִשְׁפָּט (שם), וְלֹא נֶאֱמַר וָהָלְאָה, לְפִי שֶׁכְּבָר נִתַּן הַחֹק בִּימֵי אַבְרָם:", "rashi_en": "[Meaning:] my servants who went with me. In addition, “Aneir, Eshkol, and Mamrei, etc. Though it was my servants who took part in the war,” as it is said, “He and his servants smote them,” and, Aneir and his friends [only] stayed with the supplies to guard it, nevertheless, they will get their share. From him [Avram], Dovid learned a lesson when he said, “As the share מתוך the participant in battle and as the share מתוך the one that remains with the supplies — they will share together.” It is therefore said, “This was so from that day [and had been so] from earlier times and he [Dovid] made it an ordinance and a law.” It does not state and on, because the law had already been given in the days מתוך Avram.", "note": "", "points": [{"q": "Only Avram's servants ('הנערים') fought. Why do Aner, Eshkol and Mamrei also take 'חלקם'?", "options": ["Those guarding supplies share equally with fighters", "They fought harder than Avram's servants", "They paid Avram for their portion"], "kasha": "Only Avram's servants fought ('הוא ועבדיו ויכם') — why do the allies get a share?", "answer": "Avram's servants went into battle while Aner and his friends sat guarding the supplies; even so, they take their share."}, {"q": "Who later learned this rule from Avram and applied it?", "options": ["Dovid HaMelech", "Moshe Rabbeinu", "Yehoshua bin Nun"], "kasha": "Is this just Avram's generosity, or a rule for the future?", "answer": "Dovid learned it from Avram, saying: 'as the share מתוך one who goes down to battle, so the share מתוך one who stays with the supplies — they share alike' (Shmuel I 30)."}, {"q": "Of Dovid's rule it says 'מהיום ההוא ומעלה', not 'והלאה'. What does that wording teach?", "options": ["The law already existed since Avram's time", "Dovid made it retroactive for past wars", "It applied only to higher-ranking soldiers"], "kasha": "'ומעלה' is odd wording for a law that starts from that day on.", "answer": "It says 'ומעלה' and not 'והלאה' because the law had already been given in Avram's days."}]}, {"id": "15:1.1", "ch": 15, "v": 1, "n": 1, "dh": "אחר הדברים האלה", "pasuk_html": "אַחַ֣ר&thinsp;׀ הַדְּבָרִ֣ים הָאֵ֗לֶּה הָיָ֤ה דְבַר־יְהֹוָה֙ אֶל־אַבְרָ֔ם בַּֽמַּחֲזֶ֖ה לֵאמֹ֑ר אַל־תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔ךְ שְׂכָרְךָ֖ הַרְבֵּ֥ה מְאֹֽד׃", "pasuk_en": "After these events, the word מתוך Adonoy came to Avram in a vision, saying: Fear not Avram, I am your shield [My Word is your strength], your reward is very great.", "rashi_he": "כָּל מָקוֹם שֶׁנֶאֱמַר אַחַר – סָמוּךְ, אַחֲרֵי – מֻפְלָג (בראשית רבה). אַחַר הַדְּבָרִים הָאֵלֶּה אַחַר שֶׁנַּעֲשָׂה לוֹ נֵס זֶה, שֶׁהָרַג אֶת הַמְּלָכִים וְהָיָה דוֹאֵג וְאוֹמֵר, שֶׁמָּא קִבַּלְתִּי שָׂכָר עַל כָּל צִדְקוֹתַי, לְכָךְ אָמַר לוֹ הַמָּקוֹם אַל תִּירָא אַבְרָם אָנֹכִי מָגֵן לָךְ, מִן הָעֹנֶשׁ, שֶׁלֹּא תֵּעָנֵשׁ עַל כָּל אוֹתָן נְפָשׁוֹת שֶׁהָרַגְתָּ; וּמַה שֶּׁאַתָּה דוֹאֵג עַל קִבּוּל שְׂכָרְךָ, שְׂכָרְךָ הַרְבֵּה מְאֹד (בראשית רבה):", "rashi_en": "Wherever אַחַר is used it signifies immediately [after]. [When] אַחֲרֵי [is used] [it means] long afterwards. [Thus, immediately] “after these events,” [i.e.,] after this miracle occurred to him that he killed the kings, he became anxious and said, “Maybe I have already received my reward for all my נכוןeousness.” Therefore, God said to him… <b>Fear not Avram, I am your shield.</b> From punishment. [I.e.,] that you will not be punished for all the people that you killed. And as for you anxiety that you have already received you reward, “Your reward is very great.”", "note": "", "points": [{"q": "The posuk says 'אחר הדברים האלה,' not 'אחרי.' What does 'אחר' tell us about the timing?", "options": ["Right after the events", "Long after the events", "At the same time as the events"], "kasha": "When exactly did this vision come, compared to the war with the kings?", "answer": "Wherever 'אחר' is used it means נכון after; 'אחרי' means long after. So this came נכון after the miracle מתוך killing the kings."}, {"q": "Right after his victory Hashem tells Avram 'אל תירא.' What was Avram worried about?", "options": ["He had already received his reward for his נכוןeousness", "Lot would be captured again", "Sarai would be taken again"], "kasha": "Avram just won a miraculous war — why would he need reassurance?", "answer": "He worried that the miracle had used up his reward for all his נכוןeousness. So Hashem said 'שכרך הרבה מאד' — your reward is still very great."}, {"q": "Hashem says 'אנכי מגן לך' — I am your shield. A shield from what?", "options": ["From punishment for the people he killed", "From the armies מתוך the four kings", "From illness in his old age"], "kasha": "The war is already over — why does Avram need a shield now?", "answer": "A shield from punishment: Avram will not be punished for all the people he killed in the war."}]}, {"id": "15:2.1", "ch": 15, "v": 2, "n": 1, "dh": "הולך ערירי", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤י יֱהֹוִה֙ מַה־תִּתֶּן־לִ֔י וְאָנֹכִ֖י <mark>הוֹלֵ֣ךְ עֲרִירִ֑י</mark> וּבֶן־מֶ֣שֶׁק בֵּיתִ֔י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר׃", "pasuk_en": "Avram said: My Master, God, what will You give me since I continue to be childless, and the manager מתוך my household [this supplier who is in my house] is Eliezer מתוך Damascus.", "rashi_he": "מְנַחֵם בֶּן סָרוּק פֵּרְשׁוֹ לְשׁוֹן יוֹרֵשׁ, וְחָבֵר לוֹ עֵר וְעֹנֶה (מלאכי ב'), עֲרִירִי, בְלֹא יוֹרֵשׁ, כַּאֲשֶׁר תֹּאמַר וּבְכָל תְּבוּאָתִי תְשָׁרֵשׁ (איוב ל\"א), תְּעַקֵּר שָׁרָשֶׁיהָ, כָּךְ לְשׁוֹן עֲרִירִי חֲסַר בָּנִים, ובלע\"ז דישאנפנטיש. וְלִי נִרְאֶה עֵר וְעֹנֶה מִגִּזְרַת וְלִבִּי עֵר (שיר השירים ה'), וַעֲרִירִי לְשׁוֹן חֻרְבָּן, וְכֵן עָרוּ עָרוּ (תה' קל\"ז), וְכֵן עָרוֹת יְסוֹד (חבקוק ג'), וְכֵן עַרְעֵר תִּתְעַרְעָר (ירמ' נ\"א), וְכֵן כִּי אַרְזָה עֵרָה (צפניה ב'):", "rashi_en": "Menachem ben Saruk explains it [עֲרִירִי] as meaning “heir,” comparable to עֵר וְעוֹנֶה. עֲרִירִי [would then mean] without an heir as you would say “It will תְשָׁרֵשׁ all my crops,” meaning, “it will tear up its roots.” Similarly עֲרִירִי means childless — in Old French desanfantez. [However,] it seems to me that עֵר וְעוֹנֶה is מתוך the same derivation as וְלִבִּי עֵר, [meaning, “my heart is awake”], whereas וַעֲרִירִי means “destruction” as in “Destroy it, destroy it,” and as in “Destroying the foundation,” and as in “Shall be completely destroyed,” and as in “For the cedar will be destroyed.”", "note": "", "points": [{"q": "Avram says 'ואנכי הולך ערירי.' According to Menachem ben Saruk, what does 'ערירי' mean?", "options": ["Without an heir — childless", "Wandering without a home", "Old and weak"], "kasha": "'ערירי' is an unusual word — what does it mean?", "answer": "Menachem reads 'ער' (in 'ער ועונה') as 'heir,' so ערירי means without an heir, childless — just as 'תשרש' means tearing out roots."}, {"q": "רש״י disagrees with Menachem. What does רש״י say 'ערירי' means?", "options": ["Destruction, as in 'ערו ערו'", "An heir, as in 'ער ועונה'", "Lonely, without any friends"], "kasha": "Menachem's proמתוך depends on 'ער ועונה' meaning 'heir' — is that נכון?", "answer": "רש״י אומר 'ער ועונה' means 'awake,' like 'ולבי ער.' ערירי means destruction, as in 'ערו ערו,' 'ערות יסוד,' 'ערער תתערער,' and 'ארזה ערה.'"}]}, {"id": "15:2.2", "ch": 15, "v": 2, "n": 2, "dh": "ובן משק ביתי", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤י יֱהֹוִה֙ מַה־תִּתֶּן־לִ֔י וְאָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּבֶן־מֶ֣שֶׁק בֵּיתִ֔י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר׃", "pasuk_en": "Avram said: My Master, God, what will You give me since I continue to be childless, and the manager מתוך my household [this supplier who is in my house] is Eliezer מתוך Damascus.", "rashi_he": "כְּתַרְגּוּמוֹ, שֶׁכָּל בֵּיתִי נִזּוֹן עַל פִּיו, כְּמוֹ וְעַל פִּיךָ יִשַּׁק (בר' מלכים א), אַפּוֹטְרוֹפּוֹס שֶׁלִּי, וְאִלּוּ הָיָה לִי בֵן, הָיָה בְנִי מְמֻנֶּה עַל שֶׁלִּי:", "rashi_en": "As Onkelos translates it, [meaning:] “That my entire household is fed by his orders,” as in “According to your orders shall they be fed.” [Avraham meant] “He is my steward. But, if I had a son then my son would be in charge מתוך my possessions.”", "note": "", "points": [{"q": "Eliezer is called 'בן משק ביתי.' What does that phrase mean?", "options": ["The steward whose orders feed my household", "My adopted son and heir", "My nephew who lives with me"], "kasha": "'בן משק ביתי' is an unclear phrase.", "answer": "As Onkelos: my whole household is fed by his orders, like 'ועל פיך ישק.' He is my steward."}, {"q": "Why does Avram mention, in his complaint, that Eliezer runs his household?", "options": ["Had he a son, his son would be in charge", "Eliezer wanted to marry into the family", "He wanted Hashem to bless Eliezer"], "kasha": "What does Eliezer's job have to do with Avram having no children?", "answer": "If I had a son, my son would be in charge מתוך my possessions — instead it is my steward."}]}, {"id": "15:2.3", "ch": 15, "v": 2, "n": 3, "dh": "דמשק", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤י יֱהֹוִה֙ מַה־תִּתֶּן־לִ֔י וְאָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּבֶן־מֶ֣שֶׁק בֵּיתִ֔י ה֖וּא <mark>דַּמֶּ֥שֶׂק</mark> אֱלִיעֶֽזֶר׃", "pasuk_en": "Avram said: My Master, God, what will You give me since I continue to be childless, and the manager מתוך my household [this supplier who is in my house] is Eliezer מתוך Damascus.", "rashi_he": "לְפִי הַתַּרְגּוּם מִדַּמֶּשֶׂק הָיָה, וּלְפִי מִ\"אַ שֶׁרָדַף הַמְּלָכִים עַד דַּמֶּשֶׂק. וּבַתַּלְמוּד דָרְשׁוּ נוֹטָרִיקוֹן דּוֹלֶה וּמַשְׁקֶה מִתּוֹרַת רַבּוֹ לַאֲחֵרִים:", "rashi_en": "According to Targum, he was from Damascus. But, according to Midrash Aggadah [he was so called] because he pursued the kings until Damascus. In the Talmud they explained it [דַּמֶּשֶׂק] as an acrostic מתוך דּוֹלֶה וּמַשְׁקֶה [he draws water and gives to drink] from the Torah מתוך his master, to others.", "note": "", "points": [{"q": "Eliezer is called 'דמשק.' According to Targum, why?", "options": ["He came from Damascus", "He traded goods in Damascus", "Damascus was his father's name"], "kasha": "Why is Eliezer identified by the word 'דמשק'?", "answer": "According to Targum, he was from Damascus."}, {"q": "The Midrash ties the name 'דמשק' to the war with the four kings. How?", "options": ["He chased the kings until Damascus", "He was captured by the kings at Damascus", "He made peace with the kings at Damascus"], "kasha": "Targum's reading doesn't connect the name to anything Eliezer did.", "answer": "Midrash Aggadah: he was called דמשק because he pursued the kings until Damascus."}, {"q": "The Gemara reads 'דמשק' as an acronym (נוטריקון). What does it stand for?", "options": ["דולה ומשקה — draws his master's Torah for others", "The names מתוך his father and mother", "The cities that Eliezer ruled over"], "kasha": "The Gemara looks for a deeper meaning in the name.", "answer": "דולה ומשקה: he drew from his master's Torah and gave it to others to drink."}]}, {"id": "15:3.1", "ch": 15, "v": 3, "n": 1, "dh": "הן לי לא נתת זרע", "pasuk_html": "וַיֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔י לֹ֥א נָתַ֖תָּה זָ֑רַע וְהִנֵּ֥ה בֶן־בֵּיתִ֖י יוֹרֵ֥שׁ אֹתִֽי׃", "pasuk_en": "And Avram said: Behold, You have not given me children, and thus one מתוך my household will be my heir.", "rashi_he": "וּמַה תּוֹעֶלֶת בְּכָל אֲשֶׁר תִּתֵּן לִי?", "rashi_en": "And what benefit [is there] from all that you shall give to me?", "note": "", "points": [{"q": "Avram already said he's childless. Why does he add 'הן לי לא נתתה זרע'?", "options": ["What use are Your gifts without children?", "He wants more wealth instead מתוך children", "He is complaining that Eliezer is disloyal"], "kasha": "Avram seems to repeat his complaint from the previous posuk.", "answer": "He explains his question 'מה תתן לי': since You haven't given me children, what benefit is there in anything You give me?"}]}, {"id": "15:5.1", "ch": 15, "v": 5, "n": 1, "dh": "ויוצא אתו החוצה", "pasuk_html": "<mark>וַיּוֹצֵ֨א אֹת֜וֹ הַח֗וּצָה</mark> וַיֹּ֙אמֶר֙ הַבֶּט־נָ֣א הַשָּׁמַ֗יְמָה וּסְפֹר֙ הַכּ֣וֹכָבִ֔ים אִם־תּוּכַ֖ל לִסְפֹּ֣ר אֹתָ֑ם וַיֹּ֣אמֶר ל֔וֹ כֹּ֥ה יִהְיֶ֖ה זַרְעֶֽךָ׃", "pasuk_en": "He [then] took him outside and said: Look towards the heavens and count the stars if you are able to count them. He then said to him: So [numerous] will your descendants be.", "rashi_he": "לְפִי פְּשׁוּטוֹ הוֹצִיאוֹ מֵאָהֳלוֹ לַחוּץ לִרְאוֹת הַכּוֹכָבִים, וּלְפִי מִדְרָשׁוֹ אָמַר לוֹ צֵא מֵאִצְטַגְנִינוּת שֶׁלְּךָ שֶׁרָאִיתָ בַּמַּזָּלוֹת שֶׁאֵינְךָ עָתִיד לְהַעֲמִיד בֵּן, אַבְרָם אֵין לוֹ בֵן, אֲבָל אַבְרָהָם יֵשׁ לוֹ בֵן, שָׂרַי לֹא תֵלֵד, אֲבָל שָׂרָה תֵלֵד; אֲנִי קוֹרֵא לָכֶם שֵׁם אַחֵר וְיִשְׁתַּנֶּה הַמַּזָּל. דָּ\"אַ הוֹצִיאוֹ מֵחֲלָלוֹ שֶׁל עוֹלָם וְהִגְבִּיהוֹ לְמַעְלָה מִן הַכּוֹכָבִים, וְזֶהוּ לְשׁוֹן הַבָּטָה מִלְמַעְלָה לְמַטָּה:", "rashi_en": "According to the plain meaning: He took him from his tent, outside, to see the stars. However, according to its Midrash, He said to him, “Leave your astrological calculations that you have seen in the constellations that you are not destined to have a son. It is Avram who will have no son, but Avraham will have a son. Similarly, it is Sarai who will not give birth, but Sarah will give birth. By My calling you by a [different] name [your] destiny will change. An alternate explanation: He took him out מתוך the terrestrial void and lifted him above the stars. This explains the use מתוך the term הַבֶּט [which signifies looking] from above to below.", "note": "", "points": [{"q": "'ויוצא אתו החוצה' — on the simple level, where did Hashem take Avram?", "options": ["Out מתוך his tent, to see the stars", "Out מתוך Canaan, toward Mitzrayim", "Out מתוך the city מתוך Charan"], "kasha": "Why mention taking him outside — and outside מתוך what?", "answer": "Simple meaning: He took him out מתוך his tent, outside, to see the stars."}, {"q": "The Midrash reads 'החוצה' as leaving something else behind. What did Hashem tell Avram to leave?", "options": ["His astrology, which said he'd have no son", "His father's house and its idols", "His fears about the four kings"], "kasha": "Taking Avram outside to see the stars seems to have no point מתוך its own.", "answer": "Leave your astrology that showed you won't have a son. Avram has no son, but Avraham will; Sarai won't give birth, but Sarah will. I'll call you by new names and the mazal will change."}, {"q": "Another explanation: Hashem lifted Avram above the stars. Which word in the posuk supports this?", "options": ["'הבט' — looking from above downward", "'וספר' — counting each star", "'אם תוכל' — if you are able"], "kasha": "'הבט' means looking down, yet Avram is told to look at the sky.", "answer": "דבר אחר: He took him out מתוך the space מתוך the world and raised him above the stars. That is why it says 'הבט,' which means looking from above to below."}]}, {"id": "15:6.1", "ch": 15, "v": 6, "n": 1, "dh": "והאמין בה'", "pasuk_html": "וְהֶאֱמִ֖ן בַּֽיהֹוָ֑ה וַיַּחְשְׁבֶ֥הָ לּ֖וֹ צְדָקָֽה׃", "pasuk_en": "He believed in [the Word מתוך] Adonoy, and this He accounted to him for נכוןeousness.", "rashi_he": "לֹא שָׁאַל לוֹ אוֹת עַל זֹאת; אֲבָל עַל יְרֻשַּׁת הָאָרֶץ שָׁאַל לוֹ אוֹת וְאָמַר לוֹ בַּמָּה אֵדַע.", "rashi_en": "[Meaning:] he did not ask מתוך Him a sign concerning this. Whereas, concerning the inheritance מתוך the land he asked Him for a sign and said to Him, “With what [sign] will I know?”", "note": "", "points": [{"q": "'והאמין בה'' — what was special about Avram's belief here?", "options": ["He didn't ask for a sign about children", "He believed despite being so old", "He believed without seeing any stars"], "kasha": "Why stress that he believed — later he asks 'במה אדע'?", "answer": "He didn't ask for a sign about having children, unlike the inheritance מתוך the land, where he asked 'במה אדע' — how will I know?"}]}, {"id": "15:6.2", "ch": 15, "v": 6, "n": 2, "dh": "ויחשבה לו צדקה", "pasuk_html": "וְהֶאֱמִ֖ן בַּֽיהֹוָ֑ה <mark>וַיַּחְשְׁבֶ֥הָ לּ֖וֹ צְדָקָֽה׃</mark>", "pasuk_en": "He believed in [the Word מתוך] Adonoy, and this He accounted to him for נכוןeousness.", "rashi_he": "הַקָּבָּ\"ה חֲשָׁבָהּ לאַבְרָם לִזְכוּת וְלִצְדָקָה עַל הַאֲמָנָה שֶׁהֶאֱמִין בּוֹ. דָּבָר אַחֵר בַּמָּה אֵדַע, לֹא שָׁאַל לוֹ אוֹת אֶלָּא אָמַר לְפָנָיו, הוֹדִיעֵנִי בְּאֵיזֶה זְכוּת יִתְקַיְּמוּ בָּהּ, אָמַר לוֹ הַקָּבָּ\"ה, בִּזְכוּת הַקָּרְבָּנוֹת:", "rashi_en": "[Meaning:] God considered it—for Avram— as merit and נכוןeousness for the trust that he [Avram] placed in Him. An alternate explanation [מתוך the question] “How will I know…?”: He did not ask for a sign but, rather, said to Him, “Tell me by what merit will they [my descendants] remain in it?” God replied to him, “In the merit מתוך the sacrifices.”", "note": "", "points": [{"q": "'ויחשבה לו צדקה' — who counted what as נכוןeousness?", "options": ["Hashem counted Avram's trust as merit", "Avram counted Hashem's promise as kindness", "Avram gave tzedakah to thank Hashem"], "kasha": "'ויחשבה לו' is ambiguous — who considered what, for whom?", "answer": "Hashem counted it for Avram as merit and נכוןeousness, for the trust Avram placed in Him."}, {"q": "רש״י gives another reading מתוך Avram's later question 'במה אדע.' What was he really asking?", "options": ["In what merit his children would keep the land", "Whether Lot would share in the land", "How many children he would have"], "kasha": "Asking for a sign seems to clash with Avram's praised belief.", "answer": "He didn't ask for a sign; he asked: tell me in what merit they will remain in the land. Hashem answered: in the merit מתוך the korbanos."}]}, {"id": "15:9.1", "ch": 15, "v": 9, "n": 1, "dh": "עגלה משלשת", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֗יו קְחָ֥ה לִי֙ <mark>עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת</mark> וְעֵ֥ז מְשֻׁלֶּ֖שֶׁת וְאַ֣יִל מְשֻׁלָּ֑שׁ וְתֹ֖ר וְגוֹזָֽל׃", "pasuk_en": "He said to him: Bring Me [Sacrifice before Me] three heifers, three goats and three rams, a dove, and a young pigeon.", "rashi_he": "שְׁלשָׁה עֲגָלִים; רֶמֶז לִשְׁלֹשָׁה פָרִים, פַּר יוֹם הַכִּפּוּרִים וּפַר הֶעְלֵם דָּבָר שֶׁל צִבּוּר וְעֶגְלָה עֲרוּפָה:", "rashi_en": "Three heifers are a symbol for the three bulls: 1) the bull מתוךfered on Yom Kippur; 2) the bull [מתוךfered] when the law is “hidden” from the people; and 3) the heifer whose neck was broken.", "note": "", "points": [{"q": "Hashem says 'קחה לי עגלה משלשת.' What does 'משלשת' mean here?", "options": ["Three calves, hinting at three bull מתוךferings", "A calf brought on the third day", "A calf cut into three pieces"], "kasha": "'משלשת' is unclear — what does 'tripled' mean here?", "answer": "Three calves, hinting at three bull מתוךferings: the Yom Kippur bull, the bull for a communal error (העלם דבר), and the עגלה ערופה."}]}, {"id": "15:9.2", "ch": 15, "v": 9, "n": 2, "dh": "ועז משלשת", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֗יו קְחָ֥ה לִי֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת <mark>וְעֵ֥ז מְשֻׁלֶּ֖שֶׁת</mark> וְאַ֣יִל מְשֻׁלָּ֑שׁ וְתֹ֖ר וְגוֹזָֽל׃", "pasuk_en": "He said to him: Bring Me [Sacrifice before Me] three heifers, three goats and three rams, a dove, and a young pigeon.", "rashi_he": "רֶמֶז לְשָׂעִיר הַנַּעֲשֶׂה בִּפְנִים וּשְׂעִירֵי מוּסָפִין שֶׁל מוֹעֵד וּשְׂעִיר חַטַּאת יָחִיד:", "rashi_en": "Symbolic מתוך the goat that is מתוךfered inside [the Beis Hamikdosh]; and the goats מתוך the added sacrifices מתוך the holidays; and the goat מתוךfered as an individual’s sin-מתוךfering.", "note": "", "points": [{"q": "What do the three goats, 'ועז משלשת,' hint at?", "options": ["Three kinds מתוך goat korbanos", "The three Avos", "Three exiles מתוך Klal Yisroel"], "kasha": "Why specifically three goats?", "answer": "The goat מתוךfered inside on Yom Kippur, the goats מתוך the Yom Tov mussafim, and an individual's goat sin-מתוךfering."}]}, {"id": "15:9.3", "ch": 15, "v": 9, "n": 3, "dh": "ואיל משלש", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֗יו קְחָ֥ה לִי֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְעֵ֥ז מְשֻׁלֶּ֖שֶׁת <mark>וְאַ֣יִל מְשֻׁלָּ֑שׁ</mark> וְתֹ֖ר וְגוֹזָֽל׃", "pasuk_en": "He said to him: Bring Me [Sacrifice before Me] three heifers, three goats and three rams, a dove, and a young pigeon.", "rashi_he": "אֲשַׁם וַדַּאי וְאָשָׁם תָּלוּי וְכִבְשָׂה שֶׁל חַטַּאת יָחִיד:", "rashi_en": "[Symbolizing] 1) a sin-מתוךfering [for certain מתוךfenses where the person is] certain [to have committed them]; 2) a sin-מתוךfering [where the person is] in doubt [whether he committed those מתוךfenses]; and 3) a ewe brought as an individual’s sin-מתוךfering.", "note": "", "points": [{"q": "And the three rams, 'ואיל משלש' — what do they hint at?", "options": ["Three kinds מתוך guilt and sin מתוךferings", "The three Regalim", "Three kings who will rule Yisroel"], "kasha": "Why specifically three rams?", "answer": "אשם ודאי (certain guilt), אשם תלוי (doubtful guilt), and the ewe מתוך an individual's sin-מתוךfering."}]}, {"id": "15:9.4", "ch": 15, "v": 9, "n": 4, "dh": "ותור וגוזל", "pasuk_html": "וַיֹּ֣אמֶר אֵלָ֗יו קְחָ֥ה לִי֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְעֵ֥ז מְשֻׁלֶּ֖שֶׁת וְאַ֣יִל מְשֻׁלָּ֑שׁ וְתֹ֖ר וְגוֹזָֽל׃", "pasuk_en": "He said to him: Bring Me [Sacrifice before Me] three heifers, three goats and three rams, a dove, and a young pigeon.", "rashi_he": "תּוֹר וּבֶן יוֹנָה (בראשי
