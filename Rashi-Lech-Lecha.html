hen you come to trouble and suffering","When you leave the city of Tzo'ar"]},{"q":"According to the Midrash, why did Lot choose this particular place?","o":["Because its people were steeped in immorality, and Lot wanted to live in their neighborhood","Because he wanted to influence the people of Sedom to repent","Because it was the place farthest from Avram"]}]},"13:11.1":{"e":"'ככר' means a plain, as Onkelos translated.","pe":"Lot chose for himself the entire Jordan Plain; Lot journeyed from the east [before], and they separated one from another.","re":"Plain. [Means] “plain” as the Targum translates.","p":[{"q":"What does 'ככר הירדן' mean?","o":["The plain near the Jordan","The large city on the Jordan","The mountain above the Jordan"]}]},"13:11.2":{"e":"According to the simple meaning, Lot traveled from east to west and arrived west of Avram. According to the Midrash, he distanced himself from the Primordial One of the world, saying that he wanted neither Avram nor his God.","pe":"Lot chose for himself the entire Jordan Plain; Lot journeyed from the east [before], and they separated one from another.","re":"From the east. He departed from Avram and traveled to the west of Avram, consequently traveling from east to west. The Midrashic interpretation is; he removed himself from the One Who precedes the world, saying, “I want neither Avram nor his God.”","p":[{"q":"What does 'ויסע לוט מקדם' mean according to the simple meaning?","o":["He traveled from east to west, and ended up west of Avram","He traveled from west to east, and distanced himself from Avram","He traveled from the place where he had lived before"]},{"q":"According to the Midrash, from what did Lot distance himself when he traveled 'מקדם'?","o":["From the Primordial One of the world - he did not want Avram or his God","From the wicked people of the East who lived around him","From the place where he had lived at first with Terach"]}]},"13:12.1":{"e":"Lot pitched tents for his shepherds and his livestock, as far as Sedom.","pe":"Avram lived in the land of Canaan; and Lot lived in the cities of the Plain, setting up his tents as far as Sedom.","re":"Setting up his tents. [Meaning:] he pitched tents for his shepherds and for his cattle as far as Sedom.","p":[{"q":"Why does it say 'ויאהל עד סדם', if Lot lived in the cities of the plain?","o":["Because he pitched tents for his shepherds and his livestock as far as Sedom","Because Lot himself lived in a tent and not in a city","Because Sedom was a city made entirely of tents"]}]},"13:13.1":{"e":"Even though the people of Sedom were evil, Lot did not refrain from living with them. And the Sages learned from here the verse 'the name of the wicked will rot.'","pe":"The people of Sedom were wicked [with their property] and sinful [with their bodies] towards [before] Adonoy, exceedingly.","re":"The people of Sedom were wicked. And yet Lot did not refrain from residing with them. Our Sages learned from here: “The names of the wicked shall rot.”","p":[{"q":"Why does the verse tell of the wickedness of the people of Sedom specifically here?","o":["To teach that despite their wickedness, Lot did not refrain from living among them","To teach that Lot did not know about their wickedness at all","To explain why Avram refused to live in Sedom"]}]},"13:13.2":{"e":"'רעים' means that the people of Sedom were evil in their bodies.","pe":"The people of Sedom were wicked [with their property] and sinful [with their bodies] towards [before] Adonoy, exceedingly.","re":"Wicked. With their persons.","p":[{"q":"In what way were the people of Sedom 'רעים' according to Rashi?","o":["In their bodies","In their money","In their opinions"]}]},"13:13.3":{"e":"'חטאים' means that the people of Sedom sinned with their money.","pe":"The people of Sedom were wicked [with their property] and sinful [with their bodies] towards [before] Adonoy, exceedingly.","re":"Sinful. With their wealth.","p":[{"q":"In what way were the people of Sedom 'חטאים' according to Rashi?","o":["In their money","In their bodies","In their speech"]}]},"13:13.4":{"e":"The people of Sedom knew their Master, and yet intended to rebel against Him.","pe":"The people of Sedom were wicked [with their property] and sinful [with their bodies] towards [before] Adonoy, exceedingly.","re":"Towards Hashem, exceedingly. They know their Master and intentionally rebel against Him.","p":[{"q":"What do the words 'לה' מאד' add about the sins of the people of Sedom?","o":["That they knew their Master and still intended to rebel against Him","That they sinned unintentionally, because they did not know Hashem","That they sinned only against Hashem and not against people"]}]},"13:14.1":{"e":"As long as the wicked one, Lot, was with Avram, Hashem's speech withdrew from him. Therefore Hashem spoke to him only after Lot separated from him.","pe":"Adonoy said to Avram after Lot had separated from him: Raise your eyes and look about from the place where you are, to the north, to the south to the east and to the west.","re":"After Lot had separated. As long as the wicked person was with him, the Word [of God] withdrew from him. (And above when Lot was [still] with him and [yet] it is written: “And God appeared to Avram,” [we must assume that] at that time he [Lot] was [still righteous]).","p":[{"q":"Why does the verse stress that Hashem spoke to Avram 'אחרי הפרד לוט מעמו'?","o":["Because as long as the wicked one was with him, the divine speech withdrew from him","Because Avram was sad and Hashem came to comfort him","Because Lot might claim that the land was given to him too"]}]},"13:16.1":{"e":"Just as the dust cannot be counted, so too Avram's offspring will not be counted.","pe":"I will make your descendants [numerous] as the dust of the earth; so that if a man can count the dust of the earth, then your descendants too will be countable [just as it is impossible for a man to count the dust of the earth, so too your descendants will not be countable].","re":"So that if a man can. Just as it is impossible for dust to be counted so, too, your progeny will not be counted.","p":[{"q":"What is the meaning of the comparison \"אם יוכל איש למנות את עפר הארץ גם זרעך ימנה\" (If a man can count the dust of the earth, so too your offspring can be counted)?","o":["Just as the dust cannot be counted, so too your offspring will not be counted","That only a very wise person will be able to count your offspring","That your offspring will be scattered throughout the land like dust"]}]},"13:18.1":{"e":"Mamre is the name of a person.","pe":"Avram set up his tent, and he came and settled in the Plains of Mamrei which are in Chevron, and he built there an altar to [before] Adonoy.","re":"Mamrei. The name of a person.","p":[{"q":"What is \"ממרא\" (Mamre) in the phrase \"באלני ממרא\" (in the plains of Mamre)?","o":["The name of a person","The name of a city","The name of a mountain"]}]},"14:1.1":{"e":"Amraphel is Nimrod, and he was called this because he said to Avraham, \"Fall\" into the fiery furnace.","pe":"This happened in the days of Amraphel, king of Shinar [Babylon], Aryoch, king of Elasar, Kedorlaomer, king of Ailam, and Tidal, king of Goyim [king of peoples].","re":"Amraphel. He is Nimrod who told Avraham, “Jump into the fiery furnace.”","p":[{"q":"Who is \"אמרפל\" (Amraphel), and why was he called that?","o":["Nimrod, who said to Avraham \"fall\" into the fiery furnace","The king of Shinar, who fell in the war against Avraham","Nimrod, who told the people of Babylon to build a tower"]}]},"14:1.2":{"e":"\"גוים\" is the name of a place, called this because people from many nations and places gathered there, and they crowned a man over them named Tidal.","pe":"This happened in the days of Amraphel, king of Shinar [Babylon], Aryoch, king of Elasar, Kedorlaomer, king of Ailam, and Tidal, king of Goyim [king of peoples].","re":"King of Goyim. There is a place called Goyim because in that place were gathered [people] from many nations and places and they proclaimed as king a man named Sidal.","p":[{"q":"What is the meaning of \"מלך גוים\" (king of Goiim)?","o":["The king of a place named Goiim, where people from many nations gathered","A king who ruled over all the nations of the world","A king who was a gentile and not from the descendants of Shem"]}]},"14:2.1":{"e":"The name of the king of Sodom, Bera, teaches that he was evil to Heaven and evil to people.","pe":"They waged war against Bera, king of Sedom, Birsha, king of Amorah, Shinav, king of Admah, Shemeiver, king of Tzevoyim, and the king of Bela, which is Zoar.","re":"Bera. He was evil towards God and evil towards mankind.","p":[{"q":"What does the name of the king of Sodom, \"ברע\" (Bera), teach?","o":["That he was evil to Heaven and evil to people","That he was the son of a wicked man","That he was evil only to the people of his own city"]}]},"14:2.2":{"e":"The name of the king of Gomorrah, Birsha, teaches that he rose to greatness through his wickedness.","pe":"They waged war against Bera, king of Sedom, Birsha, king of Amorah, Shinav, king of Admah, Shemeiver, king of Tzevoyim, and the king of Bela, which is Zoar.","re":"Birsha. Because he rose by means of wickedness.","p":[{"q":"What does the name of the king of Gomorrah, \"ברשע\" (Birsha), teach?","o":["That he attained greatness through his wickedness","That he was the son of a wicked man","That he was wicked only in secret"]}]},"14:2.3":{"e":"Rashi interprets the name of the king of Admah: \"שנאב\" (Shinav) is a combination of \"שונא אב\" (hater of a father), meaning he hated his Father in Heaven.","pe":"They waged war against Bera, king of Sedom, Birsha, king of Amorah, Shinav, king of Admah, Shemeiver, king of Tzevoyim, and the king of Bela, which is Zoar.","re":"Shinav. He hated his Father in Heaven.","p":[{"q":"What does Rashi learn from the name \"שנאב\" (Shinav)?","o":["That he hated his Father in Heaven, the Holy One, blessed be He","That he hated his physical father and rebelled against him","That he hated Avram and the members of his household"]}]},"14:2.4":{"e":"Rashi interprets the name of the king of Zeboiim: \"שמאבר\" (Shemeber) is \"שם אבר\" (he put a wing), meaning he made wings for himself to fly, leap, and rebel against the Holy One, blessed be He.","pe":"They waged war against Bera, king of Sedom, Birsha, king of Amorah, Shinav, king of Admah, Shemeiver, king of Tzevoyim, and the king of Bela, which is Zoar.","re":"Shemeiver. He set his wings to fly, to leap, and to rebel against God.","p":[{"q":"What is the meaning of the name \"שמאבר\" (Shemeber) according to Rashi?","o":["He made wings for himself in order to rebel against the Holy One, blessed be He","He lost his limbs in the war with Chedorlaomer","He kept all his limbs and was not injured in the war"]}]},"14:2.5":{"e":"\"בלע\" (Bela) is not the name of a person but the name of a city, which is why the king's name is not mentioned.","pe":"They waged war against Bera, king of Sedom, Birsha, king of Amorah, Shinav, king of Admah, Shemeiver, king of Tzevoyim, and the king of Bela, which is Zoar.","re":"Bela. Is the name of the city.","p":[{"q":"What is \"בלע\" (Bela) in the verse according to Rashi?","o":["The name of the city where the king reigned","The name of the fifth king","A derogatory nickname for a king who swallowed his neighbors"]}]},"14:3.1":{"e":"The place was called \"עמק השדים\" (the Valley of Siddim) because it contained many fields.","pe":"All these joined together [assembled] at the valley of Siddim [the plain of the fields], which is [now] [the place of] the Salt Sea.","re":"Valley of Siddim. It was so called because of the many fields that were in it. There are many [other] Midrashic interpretations.","p":[{"q":"Why was the place called \"עמק השדים\" (the Valley of Siddim)?","o":["Because it contained many fields","Because it contained demons and evil spirits","Because it contained many springs of water"]}]},"14:3.2":{"e":"At the time of the war this was a valley, and only later did the sea flow into it and it became the Dead Sea. According to the Midrash, the rocks around it split open and rivers flowed into it.","pe":"All these joined together [assembled] at the valley of Siddim [the plain of the fields], which is [now] [the place of] the Salt Sea.","re":"Which is [now] the Salt Sea. Afterward, the sea flowed into it and it became the Salt Sea. The Midrashic explanation says that the surrounding stones cracked [causing] streams to flow into it.","p":[{"q":"How did the valley become the \"ים המלח\" (the Salt Sea) according to Rashi?","o":["After some time the sea flowed into it and it became a sea","It was already a sea at the time of the war","The kings dug pits in it and flooded it with water"]}]},"14:4.1":{"e":"Rashi explains who was serving: the five kings mentioned earlier served Chedorlaomer for twelve years.","pe":"[For] twelve years they had served Kedorlaomer, and for thirteen years they rebelled.","re":"[For] twelve years they had served. These five kings [served] Kedorlaomer.","p":[{"q":"Who served Chedorlaomer \"שתים עשרה שנה\" (twelve years)?","o":["The five kings mentioned earlier","The three kings who went with him","Only the inhabitants of the Valley of Siddim"]}]},"14:5.1":{"e":"The fourteenth year is counted from the beginning of their servitude, meaning Chedorlaomer came in the second year of their rebellion.","pe":"In the fourteenth year, Kedorlaomer came together with the kings that were with him and they defeated the Rephaim [the mighty ones] in Ashteros Karnayim, the Zuzim [the powerful ones] in Ham, the Aimim [the ones that incite fear] at Shaveh Kiryasayim,","re":"In the fourteenth year. Of their rebellion.","p":[{"q":"According to Rashi, from when are the years counted in \"ובארבע עשרה שנה\" (and in the fourteenth year)?","o":["From the beginning of their servitude, the second year of their rebellion","From the beginning of Chedorlaomer's reign","From the time Avram arrived in the land of Canaan"]}]},"14:5.2":{"e":"Chedorlaomer is mentioned alone and first because the rebellion was against him, so he bore the brunt of the war.","pe":"In the fourteenth year, Kedorlaomer came together with the kings that were with him and they defeated the Rephaim [the mighty ones] in Ashteros Karnayim, the Zuzim [the powerful ones] in Ham, the Aimim [the ones that incite fear] at Shaveh Kiryasayim,","re":"Kedorlaomer came. Since the matter concerned him he “carries the heavier side of the beam.”","p":[{"q":"Why does it say \"בא כדרלעמר\" (Chedorlaomer came) by himself, before the other kings?","o":["Because the rebellion was against him, so he bore the brunt of the war","Because he was the greatest and most important king of all","Because the other kings did not want to fight at all"]}]},"14:5.3":{"e":"\"והמלכים אשר אתו\" (and the kings who were with him) are the other three kings mentioned above.","pe":"In the fourteenth year, Kedorlaomer came together with the kings that were with him and they defeated the Rephaim [the mighty ones] in Ashteros Karnayim, the Zuzim [the powerful ones] in Ham, the Aimim [the ones that incite fear] at Shaveh Kiryasayim,","re":"With the kings. This refers to the three kings [that were with him.]","p":[{"q":"Who are \"והמלכים\" (the kings) who came with Chedorlaomer?","o":["The three other kings mentioned above","The five kings who rebelled against him","New kings who joined him in the war"]}]},"14:5.4":{"e":"The Zuzim are the people called Zamzummim elsewhere.","pe":"In the fourteenth year, Kedorlaomer came together with the kings that were with him and they defeated the Rephaim [the mighty ones] in Ashteros Karnayim, the Zuzim [the powerful ones] in Ham, the Aimim [the ones that incite fear] at Shaveh Kiryasayim,","re":"Zuzim. These are the Zamzumim.","p":[{"q":"Who are \"הזוזים\" (the Zuzim) according to Rashi?","o":["They are the people called Zamzummim elsewhere","They are a tribe of wandering shepherds","They are a mercenary army of the king of Sodom"]}]},"14:6.1":{"e":"\"בהררם\" means on their mountain.","pe":"And the Chorites in their hills of Seir, as far as Eil [the Plain of] Paran which borders [is next to] the wilderness.","re":"In their hills. [Meaning] in their mountain.","p":[{"q":"What is the meaning of the word \"בהררם\"?","o":["On their mountain","In the many mountains around them","In their anger and fury"]}]},"14:6.2":{"e":"Onkelos translated \"איל\" as plain, but Rashi says that \"איל\" does not mean plain. Rather, it is the name of the plain of Paran, just as each plain has its own name: the plain of Mamre, the Kikar of the Jordan, Avel HaShittim, and Baal Gad.","pe":"And the Chorites in their hills of Seir, as far as Eil [the Plain of] Paran which borders [is next to] the wilderness.","re":"Eil Paran. According to the translation [of Onkelos], it means “plain.” [However,] I maintain that this does not mean that \"אֵיל\" is to be translated as “plain” but that the plain of Paran was called אֵיל and the one of Mamrei was called Elonei and the one of Jordan was called Kikar and the one of Shittim was called Avel. Similarly, בַּעַל גָד [is a plain] whose name is Ba’al. [Though] they are all translated as “plain,” it actually refers to each one’s name.","p":[{"q":"How does Rashi explain the word \"איל\" in \"איל פארן\" (El Paran)?","o":["It is the proper name of the plain of Paran","It is an ordinary word meaning plain","It is a large tree that stood in Paran"]}]},"14:6.3":{"e":"\"על המדבר\" means near the desert, like \"ועליו מטה מנשה\", which means next to it.","pe":"And the Chorites in their hills of Seir, as far as Eil [the Plain of] Paran which borders [is next to] the wilderness.","re":"Borders the wilderness. [Meaning] by the wilderness, similar to “And next to him was the tribe of Menasheh.”","p":[{"q":"What is the meaning of \"על המדבר\" according to Rashi?","o":["Near the desert","Above the desert, in a high place","Inside the desert itself"]}]},"14:7.1":{"e":"The place was called \"עין משפט\" (En Mishpat) because of what would happen there in the future, when Moshe and Aharon would be judged there over the matter of the waters of Meriva. Onkelos explained it simply: the place where the people of the region would gather for every judgment.","pe":"They turned back and came to Ein Mishpat [the plain of compromise] which is Kadeish [Rekem], and they struck all the territory of Amaleik, as well as the Emorites who lived in Chazazon Tamar [Ein Gedi].","re":"Ein Mishpat which is Kadeish. It was so called on account [of the events] of the future. For Moshe and Aharon were destined to be judged there concerning the events of that fountain, which were the waters of Merivah. Onkelos, however, translates it plainly, [i.e.,] “The place where the citizens of the country would gather for all judgments.”","p":[{"q":"According to Rashi's first explanation, why was the place called \"עין משפט\" (En Mishpat)?","o":["Because of the future judgment of Moshe and Aharon at the waters of Meriva","Because a great court sat there at that time","Because the rebel kings were judged there in the war"]},{"q":"How did Onkelos explain the name \"עין משפט\"?","o":["A place where the people of the region gathered for every judgment","A place where Moshe and Aharon would be judged in the future","A spring whose waters were used to test a sotah"]}]},"14:7.2":{"e":"Amalek had not yet been born at this time, and the place was called \"שדה העמלקי\" (the field of the Amalekite) because of the future.","pe":"They turned back and came to Ein Mishpat [the plain of compromise] which is Kadeish [Rekem], and they struck all the territory of Amaleik, as well as the Emorites who lived in Chazazon Tamar [Ein Gedi].","re":"The territory of Amaleik. [Though] Amaleik was not yet born [nevertheless,] it was so called based on the future.","p":[{"q":"What difficulty does Rashi see in the phrase \"שדה העמלקי\" (the field of the Amalekite)?","o":["Amalek was not yet born, and the name was given because of the future","Amalek never lived in this area","It is not known whether \"the Amalekite\" was the name of a king"]}]},"14:7.3":{"e":"Hazazon-tamar is Ein Gedi, as is stated explicitly in the book of Chronicles in the account of Yehoshafat.","pe":"They turned back and came to Ein Mishpat [the plain of compromise] which is Kadeish [Rekem], and they struck all the territory of Amaleik, as well as the Emorites who lived in Chazazon Tamar [Ein Gedi].","re":"In Chazazon Tamar. Which is Ein Gedi. [It is] clearly stated in Divrei Hayamim concerning Yehoshafat.","p":[{"q":"What place is \"בחצצן תמר\" (Hazazon-tamar) according to Rashi?","o":["It is Ein Gedi","It is the Valley of Siddim","It is Kadesh Barnea"]}]},"14:9.1":{"e":"Even though it was only four kings against five, the few defeated the many, which teaches that they were mighty. And even so, Avraham did not refrain from pursuing them.","pe":"Against Kedorlaomer, king of Eilam, Sidal, king of Goyim [king of peoples], Amraphel, king of Shinar [Babylon], and Aryoch, king of Elasar; [there were] four kings against the five.","re":"Four kings, etc. Yet, the fewer ones were victorious. [This is] to inform you that they were powerful and, yet, Avraham did not refrain from giving chase to them.","p":[{"q":"What does Rashi teach from the verse's emphasis on \"ארבעה מלכים\" (four kings) against five?","o":["That the few won and were mighty, yet Avraham still pursued them","That the five were weak and so Avraham won easily","That the four did not really fight, but the five surrendered"]}]},"14:10.1":{"e":"There were many pits in the valley from which they took earth for building mortar. According to the Midrash, the king of Sodom fell into the mortar and miraculously came out, and so even those who doubted believed that Avraham had been saved from the fiery furnace in Ur Kasdim.","pe":"The Valley of Siddim [The plain of the fields] was [full of] mortar pits [pits from which they raise up mortar]; [and when] the Kings of Sedom and Amorah fled they fell there [into the pits], while the remainder fled to the mountains.","re":"[Full of] mortar pits. There were many pits from which earth was taken for mortar. The Midrashic explanation is, that the mortar was mixed in them and it was through a miracle that the King of Sedom escaped from there. For among the nations there were some who did not believe that Avraham was saved from Ur Kasdim, from the fiery furnace. But, once he [the king of Sedom] escaped from the mortar, they believed [the event concerning] Avraham retroactively.","p":[{"q":"According to the simple meaning, what were the \"בארת בארת חמר\" (pits upon pits of bitumen)?","o":["Many pits from which they took earth for building mortar","Water pits that the kings dug for drinking","Traps that the kings dug for their enemies"]},{"q":"According to the Midrash, what was the reason for the miracle that happened to the king of Sodom?","o":["So that the doubters would believe that Avraham was saved from the fiery furnace","So that the king of Sodom would repent of his wickedness","So that the king of Sodom could defeat the four kings"]}]},"14:10.2":{"e":"\"הרה\" means to the mountain: the letter heh at the end of the word takes the place of a lamed at the beginning. \"הרה\" without a heh at the beginning does not specify which mountain, because each one fled to the first mountain he found, whereas \"ההרה\" with a heh at the beginning means to the known mountain.","pe":"The Valley of Siddim [The plain of the fields] was [full of] mortar pits [pits from which they raise up mortar]; [and when] the Kings of Sedom and Amorah fled they fell there [into the pits], while the remainder fled to the mountains.","re":"Fled to the mountains. [Meaning:] They fled to a mountain. הֶרָה is the same as לְהַר Any word that requires the letter ל' at the beginning one may put the letter ה' at the end, [instead]. There is a difference between הֶרָה and הָהָרָה in that the letter ה' at the end of the word replaces a ל' at the beginning. But, it does not replace a ל' which has a pasach as vowel. Thus הֶרָה has the same meaning as לְהָר or אֶל הַר, not being explicit as to which mountain, because each one fled to whichever one he found first. But, when the letter ה' is placed at the beginning in order to write הָהָרָה or הַמִדְבָּרָה, then the meaning is “to the mountain” or the same as לְהָהָר — to the mountain connoting to the known mountain which is explicitly mentioned in that chapter.","p":[{"q":"What is the meaning of \"הרה נסו\" according to Rashi?","o":["They fled to a mountain, with the heh at the end taking the place of a lamed at the beginning","They fled from the mountain to the valley","They fled from a mountain in great panic"]},{"q":"Why does it say \"הרה\" and not \"ההרה\"?","o":["Because each one fled to the first mountain he found","Because they all fled together to one known mountain","Because the mountain had always been called by this name"]}]},"14:12.1":{"e":"The Torah adds that Lot lived in Sodom to teach that his living in Sodom is what caused him to be taken captive.","pe":"They took [captured] Lot and his wealth. [Lot was] Avram’s nephew. Then they went on their way. He had been living in Sedom.","re":"He had been living in Sedom. [This is to teach:] what caused this to happen to him? [The fact] that he resided in Sedom.","p":[{"q":"Why does the verse add \"והוא ישב בסדם\" (and he was living in Sodom)?","o":["To teach that his living in Sodom caused him to be taken captive","To teach that Lot was an important leader in Sodom","To teach that Avram did not know where Lot lived"]}]},"14:13.1":{"e":"The fugitive is Og. According to the simple meaning, he escaped from the war when the kings struck the Rephaim, and according to the Midrash he escaped from the generation of the Flood. His intention was that Avram be killed in the war so that he could marry Sarah.","pe":"The one who had escaped came and told Avram the Ivri, who was living in the Plains of Mamrei the Emorite, the brother of Eshkol and Aneir. They were Avram’s allies.","re":"The one who had escaped came. According to the plain meaning, this refers to Og who escaped from the war. This is what is referred to in Scripture “For only Og was left from the remnant of the Rephaim.” This is the meaning of “was left,” that Amrophel and his company did not kill him when they smote the Rephaim in Ashteros Karnayim. [This is based on Midrash] Tanchuma. [However,] the Midrash Ber. Rab. [explains:] This refers to Og who escaped from the Generation of the Flood. And that is [the meaning of:] מִיֶּתֶר הָרְפָאִים as is written, “The giants were upon the land, etc.” It was his [Og’s] intention that Avram be killed so that he might marry Sarah.","p":[{"q":"Who was \"הפליט\" (the fugitive) according to the simple meaning?","o":["Og, who escaped when the kings struck the Rephaim","Lot, who escaped from captivity in Sodom","The king of Sodom, who came out of the bitumen pit"]},{"q":"According to Rashi, what was Og's intention when he told Avram about Lot's captivity?","o":["That Avram be killed in the war and he would marry Sarah","To save Lot because he was his relative","To ally with Avram and fight the four kings"]}]},"14:13.2":{"e":"Avram was called \"העברי\" (the Hebrew) because he came from across the river.","pe":"The one who had escaped came and told Avram the Ivri, who was living in the Plains of Mamrei the Emorite, the brother of Eshkol and Aneir. They were Avram’s allies.","re":"The Ivri. [He was so called] because he came from the other side of the river.","p":[{"q":"Why was Avram called \"העברי\" (the Hebrew)?","o":["Because he came from across the river","Because he was descended only from Ever","Because he passed from place to place in the land"]}]},"14:13.3":{"e":"\"בעלי ברית אברם\" (Avram's allies) means that they had made a covenant with Avram.","pe":"The one who had escaped came and told Avram the Ivri, who was living in the Plains of Mamrei the Emorite, the brother of Eshkol and Aneir. They were Avram’s allies.","re":"Avram’s allies. They had entered into a covenant with him. (Another version [of Rashi]: Another explanation: They advised him concerning his circumcision, as is explained elsewhere.).","p":[{"q":"What is the meaning of Avram's \"בעלי ברית\" (covenant allies)?","o":["That they had made a covenant with him","That they were circumcised like him","That they were his relatives"]}]},"14:14.1":{"e":"\"וירק\" means as Onkelos translates it: he mobilized and armed his men with weapons, and this is also the meaning of \"והריקתי אחריכם חרב\" and \"אריק חרבי\".","pe":"When Avram heard that his kinsman was taken captive, he armed his trained servants [lads] who were born in his household, three hundred and eighteen [men], and he pursued [them] until Dan.","re":"He armed. As the Targum translates: “And he armed.” Similarly: וַהֲרִיקוֹתִי אַחֲרֵיכֶם חָרֶב [is translated by Onkelos:] “I will arm myself with a sword against you.” Similarly: אָרִיק חַרְבִּי [“I will arm myself with sword”]. “Similarly:” Arm yourself with sword and ax.”","p":[{"q":"What is the meaning of the word \"וירק\" according to Rashi?","o":["He mobilized and armed his men with weapons","He emptied his house of all its people","He made his disciples turn pale with fear"]}]},"14:14.2":{"e":"\"חניכיו\" is written in the singular, \"חנכו\", and refers to Eliezer, whom Avram trained in the commandments. The term chinuch refers to the beginning of a person's or an object's entry into a role in which he will stand in the future.","pe":"When Avram heard that his kinsman was taken captive, he armed his trained servants [lads] who were born in his household, three hundred and eighteen [men], and he pursued [them] until Dan.","re":"His trained servants. It is written חֲנִיכוֹ [singular], “his trained one,” referring to Eliezer whom he trained to observe the mitzvos. And it [i.e., the word חֲנִיכָיו] means the initiation [or training] of a person or vessel to its designated occupation [or use]. Similarly: “Train the youth,” [or:] “The initiation of the altar,” [or:] “The initiation [i.e., dedication] of the Temple.” In Old French it is called enseigner.","p":[{"q":"What does Rashi learn from the fact that the word \"חניכיו\" is written \"חנכו\"?","o":["That it refers to Eliezer, whom Avram trained in the commandments","That Avram took only his young son with him","That Avram took none of his disciples with him"]},{"q":"What is the meaning of the term \"chinuch\" (initiation) according to Rashi?","o":["The beginning of the entry of a person or object into its future role","Teaching Torah to small children in school","The completion of a servant's long training with his master"]}]},"14:14.3":{"e":"Our Sages said that Eliezer alone went with Avram, and the number three hundred and eighteen is the gematria of his name.","pe":"When Avram heard that his kinsman was taken captive, he armed his trained servants [lads] who were born in his household, three hundred and eighteen [men], and he pursued [them] until Dan.","re":"[Three hundred and] eighteen. Our Sages said that it was Eliezer alone. And it [the number 318] is the gematria equivalent of his name.","p":[{"q":"What did our Sages teach about the number \"שמנה עשר ושלש מאות\" (three hundred and eighteen)?","o":["That it was Eliezer alone, and this is the gematria of his name","That these were all of Avram's servants together with Lot","That these were Avram's allies together with their servants"]}]},"14:14.4":{"e":"When Avram reached Dan his strength failed, because he saw that his descendants would set up a calf there.","pe":"When Avram heard that his kinsman was taken captive, he armed his trained servants [lads] who were born in his household, three hundred and eighteen [men], and he pursued [them] until Dan.","re":"Until Dan. There his strength ebbed. For he saw [prophetically] that his children were destined to erect a [golden] calf there.","p":[{"q":"What happened to Avram when he reached Dan, according to Rashi?","o":["His strength failed, because he saw that his descendants would set up a calf there","He defeated all the kings there and brought back the captives","He met Malki-Tzedek, king of Shalem, there"]}]},"14:15.1":{"e":"According to the simple meaning, the words should be rearranged: \"He and his servants divided against them at night,\" like pursuers who split up after the pursued when they flee in different directions.","pe":"He divided [his men] against them at night, he and his servants and he attacked them. He pursued them until Chovah, which is to the left [north] of Damascus.","re":"He divided [his men] against them. According to its plain meaning the verse should be inverted [as if to read:] “He divided himself, he and his servants, against them, at night,” in the manner of pursuers who chase after those who are fleeing who run in different directions.","p":[{"q":"How does Rashi explain \"ויחלק עליהם\" (he divided against them) according to the simple meaning?","o":["Avram and his servants split up after the pursued who fled in different directions","Avram divided the spoils among his servants","Avram divided the night into two parts"]}]},"14:15.2":{"e":"According to the simple meaning, even after it got dark Avram did not stop pursuing. According to the Midrash, the night was divided: a miracle was done for him in the first half, and the second half was saved for the midnight miracle in Egypt.","pe":"He divided [his men] against them at night, he and his servants and he attacked them. He pursued them until Chovah, which is to the left [north] of Damascus.","re":"At night. Meaning, that [even] after nightfall they didn’t give up pursuing them. [However,] the Midrashic explanation is: The night was divided [into two parts]. During the first half a miracle occurred for him, while the second half was held in reserve for [the miracle of] midnight in Egypt.","p":[{"q":"According to the simple meaning, what does the word \"לילה\" (night) teach?","o":["That even after dark he did not refrain from pursuing","That Avram hid by day and attacked only at night","That the entire war lasted only one night"]},{"q":"According to the Midrash, what is the meaning of \"ויחלק עליהם לילה\" (he divided against them at night)?","o":["The night was divided, and its second half was saved for the midnight of Egypt","Avram divided his men into two night watches","The night was miraculously lengthened until Avram won"]}]},"14:15.3":{"e":"There is no place called Chovah; rather, the city of Dan is called Chovah here, because of the idolatry that would be there in the future.","pe":"He divided [his men] against them at night, he and his servants and he attacked them. He pursued them until Chovah, which is to the left [north] of Damascus.","re":"Until Chovah. There is no place that is called Chovah, but [the city of] Dan is called Chovah [guilty] because of the idolatry that would eventually take place there.","p":[{"q":"What is the place Chovah to which Avram pursued, according to Rashi?","o":["It is the city of Dan, called that because of the future idolatry","It is a city named Chovah near Damascus","It is the place where the kings became liable to death"]}]},"14:17.1":{"e":"\"עמק שוה\" (Emek Shaveh) is the name of the place. According to the Targum it means a cleared plain, with no trees and no obstacle.","pe":"The King of Sedom went out to meet him after his return from defeating Kedorlaomer and the kings that were with him, to the Valley of Shaveh which is the King’s Valley [to the barren plain, which is the place of the racetrack of the king].","re":"Valley of Shaveh. That is its name as the Targum explains לְמֵיֹשַר מַפְנָא [the barren plain] — empty of trees and from all impediments.","p":[{"q":"What is the meaning of \"עמק שוה\" (Emek Shaveh) according to Rashi?","o":["A plain cleared of trees and of any obstacle","A valley named after a king named Shaveh","A valley whose height is equal to the mountains around it"]}]},"14:17.2":{"e":"According to the Targum, the \"עמק המלך\" (Valley of the King) was a special area where the king would amuse himself. According to the Midrash, there all the nations came to agreement and crowned Avraham over them.","pe":"The King of Sedom went out to meet him after his return from defeating Kedorlaomer and the kings that were with him, to the Valley of Shaveh which is the King’s Valley [to the barren plain, which is the place of the racetrack of the king].","re":"King’s Valley. [Onkelos:] “the hippodrome of the king.” One hippodrome, thirty kanim long, that was designated for the king’s sport. [However,] Midrash Aggadah [explains] that it was a valley where all nations were in agreement and appointed Avraham over them as a prince of God and leader.","p":[{"q":"According to the Targum, why was the place called \"עמק המלך\" (the Valley of the King)?","o":["It was a special place for the king's recreation","One of the kings killed in the war was buried there","The king sat there to judge the people of his city"]},{"q":"According to the Midrash, which king is alluded to in the name \"עמק המלך\"?","o":["Avraham, whom the nations crowned over them","The king of Sodom, who went out there to meet Avram","Chedorlaomer, who ruled over all the kings"]}]},"14:18.1":{"e":"According to the Midrash, Malki-Tzedek is Shem, the son of Noach.","pe":"Malki Zedek, king of Shaleim [Yerushalayim], brought out bread and wine. He was a Kohein of [He was serving before] the Most High Almighty.","re":"Malki Zedek. The Midrash Aggadah [explains] that he is Sheim, the son of Noach.","p":[{"q":"Who was \"מלכי צדק\" (Malki-Tzedek) according to the Midrash?","o":["Shem, son of Noach","Eliezer, servant of Avraham","Aner, Avram's ally"]}]},"14:18.2":{"e":"Malki-Tzedek brought bread and wine, as is done for those wearied by war, thereby showing Avram that he was not angry at him for having killed his children. According to the Midrash, he alluded to the meal offerings and libations that Avram's descendants would offer there.","pe":"Malki Zedek, king of Shaleim [Yerushalayim], brought out bread and wine. He was a Kohein of [He was serving before] the Most High Almighty.","re":"Bread and wine. This is done for those who are battle-weary. He showed him that he bore him no resentment for his having killed his descendants. [However,] Midrash Aggadah [explains:] that he [Malki Zedek] intimated to him regarding the meal-offerings and the libations that his [Avraham’s] descendants would offer there.","p":[{"q":"Why did Malki-Tzedek bring out \"לחם ויין\" (bread and wine) for Avram?","o":["This is how those wearied by war are honored, and it showed he was not angry at him","To bring a thanksgiving offering for the victory in the war","To repay Avram for saving the people of Sodom"]},{"q":"According to the Midrash, what did Malki-Tzedek allude to with the bread and wine?","o":["The meal offerings and libations that Avraham's descendants would offer there","The feast Avraham would make on the day Yitzchak was weaned","The abundance of livelihood Avraham's descendants would have in the land"]}]},"14:19.1":{"e":"\"קנה שמים וארץ\" means that He made heaven and earth, and by making them, they became His.","pe":"He blessed him and said: Blessed be Avram to the Most High, Almighty Possessor of heaven and earth.","re":"Possesor of heaven and earth. [The meaning is] the same as “Maker of heaven and earth.” Through His having made them He acquired them to be His.","p":[{"q":"What is the meaning of \"קנה שמים וארץ\" (Possessor of heaven and earth)?","o":["That He made them, and thereby they became His","That He bought them from others, as one buys an object","That He will acquire them in the end of days"]}]},"14:20.1":{"e":"\"מגן\" here means delivered, that is, Hashem delivered the enemies into Avram's hand.","pe":"And blessed be the Most High Almighty Who has delivered your enemies into your hand. [Avram] gave him a tenth of everything.","re":"Who has delivered. [Meaning] “who has delivered,” as in “[How] can I deliver you, Israel?”","p":[{"q":"What is the meaning of \"אשר מגן צריך בידך\" (who has delivered your enemies into your hand)?","o":["Who delivered your enemies into your hand","Who protected you from your enemies","Who put a shield in your hand for war"]}]},"14:20.2":{"e":"Avram is the one who gave Malki-Tzedek a tithe of everything he had, because Malki-Tzedek was a kohen.","pe":"And blessed be the Most High Almighty Who has delivered your enemies into your hand. [Avram] gave him a tenth of everything.","re":"He [Avram] gave him. Avram [gave him] a tenth of everything that he owned because he [Malki Zedek] was a kohein.","p":[{"q":"Who gave a tithe to whom, and why?","o":["Avram gave to Malki-Tzedek, because he was a kohen","Malki-Tzedek gave to Avram, as a reward for the war","Avram gave to the king of Sodom, to return his property to him"]}]},"14:21.1":{"e":"The king of Sodom asked Avram that from the captives he had rescued he return to him only the people, and the property would remain with Avram.","pe":"The King of Sedom said to Avram: Give me the people, and take the possessions for yourself.","re":"Give me the people. [Meaning:] of all my things that were captured that you rescued, return only the people to me.","p":[{"q":"What did the king of Sodom request with the words \"תן לי הנפש\" (give me the persons)?","o":["That he return to him only the people from the captives","That he return all the captives and all the property","That he give him servants of his own in place of his people"]}]},"14:22.1":{"e":"\"הרימתי ידי\" is an expression of an oath, and means in the present: I am raising my hand and swearing to Hashem. Likewise \"בי נשבעתי\" means \"I swear.\"","pe":"Avram said to the King of Sedom: I have lifted my hand [in prayer] to [before] Adonoy [before] the Most High Almighty, Possessor of heaven and earth.","re":"I have lifted my hand. This is an expression of an oath: “I lift my hand to God, Most High.” Similarly: בִּי נִשְׁבַּעְתִּי [means,] “I swear.” Similarly: נָתַתִּי כֶּסֶף הַשָּׂדֶה קַח מִמֶּנִּי, [means:] “I am giving you the price of the field, take it from me.”","p":[{"q":"What is the meaning of \"הרימתי ידי\" (I have raised my hand)?","o":["I am now swearing to Hashem with a raised hand","I already swore to Hashem about this in the past","I prayed to Hashem before going out to war"]}]},"14:23.1":{"e":"Avram said that he would not keep for himself even a thread or a shoelace from the captives.","pe":"Neither a thread nor a shoelace! And I will not take anything of yours, so you will not [be able] to say, I have made Avram wealthy.","re":"Neither a thread nor a shoelace. Will I retain for myself from the spoils.","p":[{"q":"From what did Avram say he would not take even a thread or a shoelace?","o":["From the captives he had rescued","From the treasures of the house of the king of Sodom","From the property that Malki-Tzedek gave him"]}]},"14:23.2":{"e":"Avram added that even if the king of Sodom wanted to give him a reward from his treasuries, he would not accept it.","pe":"Neither a thread nor a shoelace! And I will not take anything of yours, so you will not [be able] to say, I have made Avram wealthy.","re":"And I will not take anything of yours. And if you offer to compensate me from your own treasure house I will not accept.","p":[{"q":"What does Avram add by saying \"ואם אקח מכל אשר לך\" (nor shall I take anything of all that is yours)?","o":["That he will not take even a reward from the treasures of the king of Sodom","That he will not take even a small thing from the captives","That he will not take the people he rescued from captivity"]}]},"14:23.3":{"e":"Avram did not want the king of Sodom to boast that he had made him rich, since the Holy One, blessed be He, had already promised to make him wealthy, as it says \"ואברכך\" (and I will bless you).","pe":"Neither a thread nor a shoelace! And I will not take anything of yours, so you will not [be able] to say, I have made Avram wealthy.","re":"So you will not [be able] to say, etc. “For, God, has [already] promised me to make me wealthy,” as it is said: “And I will bless you, etc.”","p":[{"q":"Why did Avram not want the king of Sodom to say \"אני העשרתי את אברם\" (I made Avram rich)?","o":["Because the Holy One, blessed be He, had already promised to make him wealthy","Because he feared the king of Sodom would demand payment from him","Because he wanted the wealth to remain with the people of Sodom"]}]},"14:24.1":{"e":"\"הנערים\" (the young men) are Avram's servants who fought. Aner, Eshkol, and Mamre only guarded the baggage, and nevertheless they will receive a share. From here David learned that the one who goes down to battle and the one who stays with the baggage share equally, and this law was already established in Avram's days.","pe":"I am excluding myself; only what the lads have eaten, and the portion of the men who went with me, Aneir, Eshkol and Mamrei, they may take their portion.","re":"The lads. [Meaning:] my servants who went with me. In addition, “Aneir, Eshkol, and Mamrei, etc. Though it was my servants who took part in the war,” as it is said, “He and his servants smote them,” and, Aneir and his friends [only] stayed with the supplies to guard it, nevertheless, they will get their share. From him [Avram], Dovid learned a lesson when he said, “As the share of the participant in battle and as the share of the one that remains with the supplies — they will share together.” It is therefore said, “This was so from that day [and had been so] from earlier times and he [Dovid] made it an ordinance and a law.” It does not state and on, because the law had already been given in the days of Avram.","p":[{"q":"Why will Aner, Eshkol, and Mamre receive a share even though they did not fight?","o":["Because they guarded the baggage, and the guard also receives a share","Because they were Avram's allies and fought with him","Because Avram wanted to repay them for their advice"]},{"q":"Why does it say about David \"מהיום ההוא ומעלה\" (from that day onward) and not \"והלאה\" (and further)?","o":["Because the law had already been given in Avram's days","Because David annulled the law from that day","Because the law applied only in David's own days"]}]},"15:1.1":{"e":"\"אחר\" (after) means immediately, close to the miracle in which Avram killed the kings. Avram was worried that he had already received the reward for all his righteous deeds and that he might be punished for the people he killed, and Hashem reassured him that He would protect him from punishment and that his reward was very great.","pe":"After these events, the word of Adonoy came to Avram in a vision, saying: Fear not Avram, I am your shield [My Word is your strength], your reward is very great.","re":"After these events. Wherever אַחַר is used it signifies immediately [after]. [When] אַחֲרֵי [is used] [it means] long afterwards. [Thus, immediately] “after these events,” [i.e.,] after this miracle occurred to him that he killed the kings, he became anxious and said, “Maybe I have already received my reward for all my righteousness.” Therefore, God said to him… Fear not Avram, I am your shield. From punishment. [I.e.,] that you will not be punished for all the people that you killed. And as for you anxiety that you have already received you reward, “Your reward is very great.”","p":[{"q":"What does the word \"אחר\" (after) teach in the verse?","o":["That it happened immediately, close to the war of the kings","That it happened a long time after the war","That it happened before the war and was written after it"]},{"q":"What was Avram worried about, which led Hashem to say to him \"אל תירא\" (do not fear)?","o":["That he would be punished for those killed and that he had already received his reward","That the kings would return to fight him and Lot","That he would not merit children to inherit the land"]}]},"15:2.1":{"e":"Menachem ben Saruk explained that \"ערירי\" means lacking an heir. Rashi disagrees and explains that \"ערירי\" is an expression of destruction, like \"ערו ערו\" (raze it, raze it).","pe":"Avram said: My Master, God, what will You give me since I continue to be childless, and the manager of my household [this supplier who is in my house] is Eliezer of Damascus.","re":"Continue to be childless. Menachem ben Saruk explains it [עֲרִירִי] as meaning “heir,” comparable to עֵר וְעוֹנֶה. עֲרִירִי [would then mean] without an heir as you would say “It will תְשָׁרֵשׁ all my crops,” meaning, “it will tear up its roots.” Similarly עֲרִירִי means childless — in Old French desanfantez. [However,] it seems to me that עֵר וְעוֹנֶה is of the same derivation as וְלִבִּי עֵר, [meaning, “my heart is awake”], whereas וַעֲרִירִי means “destruction” as in “Destroy it, destroy it,” and as in “Destroying the foundation,” and as in “Shall be completely destroyed,” and as in “For the cedar will be destroyed.”","p":[{"q":"According to Rashi's own opinion, what is the meaning of \"ערירי\" (childless)?","o":["An expression of destruction, like \"ערו ערו\"","An expression of an heir, like \"ער וענה\"","An expression of arousal, like \"ולבי ער\""]}]},"15:2.2":{"e":"\"בן משק ביתי\" is the steward, by whose word all the members of the household are fed. Avram said: if I had a son, he would be appointed over my property.","pe":"Avram said: My Master, God, what will You give me since I continue to be childless, and the manager of my household [this supplier who is in my house] is Eliezer of Damascus.","re":"And the manager of my household. As Onkelos translates it, [meaning:] “That my entire household is fed by his orders,” as in “According to your orders shall they be fed.” [Avraham meant] “He is my steward. But, if I had a son then my son would be in charge of my possessions.”","p":[{"q":"What is the meaning of \"ובן משק ביתי\" (and the son of the steward of my house)?","o":["The steward by whose word all my household is fed","The servant who gives water to my household's flocks","The son born to me from one of the maidservants"]}]},"15:2.3":{"e":"According to the Targum, Eliezer was from Damascus. According to the Midrash, he was called this because he pursued the kings as far as Damascus, and in the Talmud they interpreted \"דמשק\" as an acronym for \"דולה ומשקה\" (draws and gives to drink) from his master's Torah to others.","pe":"Avram said: My Master, God, what will You give me since I continue to be childless, and the manager of my household [this supplier who is in my house] is Eliezer of Damascus.","re":"Damascus. According to Targum, he was from Damascus. But, according to Midrash Aggadah [he was so called] because he pursued the kings until Damascus. In the Talmud they explained it [דַּמֶּשֶׂק] as an acrostic of דּוֹלֶה וּמַשְׁקֶה [he draws water and gives to drink] from the Torah of his master, to others.","p":[{"q":"According to the Midrash, why was Eliezer called \"דמשק\" (Damascus)?","o":["Because he pursued the kings with Avram as far as Damascus","Because he was born in the city of Damascus and raised there","Because he drew and gave water to the camels"]}]},"15:3.1":{"e":"Avram said: if You have not given me offspring, what use is there for me in all that You will give me?","pe":"And Avram said: Behold, You have not given me children, and thus one of my household will be my heir.","re":"Behold, You have not given me children. And what benefit [is there] from all that you shall give to me?","p":[{"q":"What did Avram mean by the words \"הן לי לא נתתה זרע\" (behold, to me You have given no offspring)?","o":["That there is no benefit to him in anything Hashem will give him","That he wants to adopt Eliezer as his son","That he already despairs of all of Hashem's promises"]}]},"15:5.1":{"e":"According to the simple meaning, Hashem took Avram out of his tent to see the stars. According to the Midrash, He told him to go out from his astrology, since the constellations showed that he would not have a son: Avram will not have a son, but Avraham will; Sarai will not give birth, but Sarah will. Another explanation: He lifted him above the stars, which is why it says \"הבט\" (look), a looking from above to below.","pe":"He [then] took him outside and said: Look towards the heavens and count the stars if you are able to count them. He then said to him: So [numerous] will your descendants be.","re":"He [then] took him outside. According to the plain meaning: He took him from his tent, outside, to see the stars. However, according to its Midrash, He said to him, “Leave your astrological calculations that you have seen in the constellations that you are not destined to have a son. It is Avram who will have no son, but Avraham will have a son. Similarly, it is Sarai who will not give birth, but Sarah will give birth. By My calling you by a [different] name [your] destiny will change. An alternate explanation: He took him out of the terrestrial void and lifted him above the stars. This explains the use of the term הַבֶּט [which signifies looking] from above to below.","p":[{"q":"According to the Midrash, what is the meaning of \"ויוצא אתו החוצה\" (and He took him outside)?","o":["Go out from your astrology, in which you saw that you would not have a son","He took him out of the tent so that he could count the stars","He took him out of the land of Canaan to show him another land"]},{"q":"According to the other explanation, what does the word \"הבט\" (look) teach?","o":["That Avram looked at the stars from above to below","That Avram looked from the earth up to the heavens","That Avram looked at the constellations to know his future"]}]},"15:6.1":{"e":"Avram believed the promise of offspring without asking for a sign, but about inheriting the land he did ask for a sign, saying \"במה אדע\" (how will I know).","pe":"He believed in [the Word of] Adonoy, and this He accounted to him for righteousness.","re":"He believed in Adonoy. [Meaning:] he did not ask of Him a sign concerning this. Whereas, concerning the inheritance of the land he asked Him for a sign and said to Him, “With what [sign] will I know?”","p":[{"q":"What does the verse emphasize by saying \"והאמן ביהוה\" (and he believed in Hashem)?","o":["That he did not ask for a sign about the promise of offspring","That he did not ask for a sign even about inheriting the land","That he believed only after he saw the stars"]}]},"15:6.2":{"e":"The Holy One, blessed be He, reckoned Avram's faith to him as merit and righteousness. According to another explanation, \"במה אדע\" is not a request for a sign but a question: by what merit will his descendants endure in the land? Hashem answered: by the merit of the sacrifices.","pe":"He believed in [the Word of] Adonoy, and this He accounted to him for righteousness.","re":"And this He accounted to him for righteousness. [Meaning:] God considered it—for Avram— as merit and righteousness for the trust that he [Avram] placed in Him. An alternate explanation [of the question] “How will I know…?”: He did not ask for a sign but, rather, said to Him, “Tell me by what merit will they [my descendants] remain in it?” God replied to him, “In the merit of the sacrifices.”","p":[{"q":"According to Rashi, who reckoned the faith as righteousness, and to whom?","o":["The Holy One, blessed be He, reckoned it to Avram as merit","Avram reckoned His promise to Hashem as righteousness","Avram thought that Hashem was doing him a kindness"]},{"q":"According to the other explanation, what did Avram ask by saying \"במה אדע\" (how will I know)?","o":["By what merit his descendants would endure in the land","What sign would prove that he would inherit the land","Exactly when his descendants would inherit the land"]}]},"15:9.1":{"e":"\"עגלה משלשת\" is three calves, an allusion to three bulls: the bull of Yom Kippur, the bull for an unwitting communal error, and the eglah arufah.","pe":"He said to him: Bring Me [Sacrifice before Me] three heifers, three goats and three rams, a dove, and a young pigeon.","re":"Three heifers. Three heifers are a symbol for the three bulls: 1) the bull offered on Yom Kippur; 2) the bull [offered] when the law is “hidden” from the people; and 3) the heifer whose neck was broken.","p":[{"q":"What is the meaning of \"עגלה משלשת\" (a three-part heifer) according to Rashi?","o":["Three calves, an allusion to three bulls","One heifer that is three years old","A heifer that is the third her mother bore"]}]},"15:9.2":{"e":"The three goats allude to the goat whose blood is brought inside on Yom Kippur, the Musaf goats of the festivals, and the sin-offering goat of an individual.","pe":"He said to him: Bring Me [Sacrifice before Me] three heifers, three goats and three rams, a dove, and a young pigeon.","re":"Three goats. Symbolic of the goat that is offered inside [the Beis Hamikdosh]; and the goats of the added sacrifices of the holidays; and the goat offered as an individual’s sin-offering.","p":[{"q":"To which offerings do the three goats allude?","o":["The inner goat, the Musaf goats, and an individual's sin-offering goat","The scapegoat, the Rosh Chodesh goat, and the leader's goat","The definite guilt offering, the doubtful guilt offering, and an individual's sin-offering lamb"]}]},"15:9.3":{"e":"The three rams allude to the definite guilt offering, the doubtful guilt offering, and the sin-offering lamb of an individual.","pe":"He said to him: Bring Me [Sacrifice before Me] three heifers, three goats and three rams, a dove, and a young pigeon.","re":"And three rams. [Symbolizing] 1) a sin-offering [for certain offenses where the person is] certain [to have committed them]; 2) a sin-offering [where the person is] in doubt [whether he committed those offenses]; and 3) a ewe brought as an individual’s sin-offering.","p":[{"q":"To which offerings do the three rams allude?","o":["The definite guilt offering, the doubtful guilt offering, and an individual's sin-offering lamb","The daily burnt offering, the Musaf burnt offering, and a voluntary burnt offering","The inner goat, the Musaf goats, and an individual's sin offering"]}]},"15:9.4":{"e":"\"תור וגוזל\" (a turtledove and a young bird) are a turtledove and a young dove.","pe":"He said to him: Bring Me [Sacrifice before Me] three heifers, three goats and three rams, a dove, and a young pigeon.","re":"A dove and a young pigeon. [Meaning:] a turtle dove and a young pigeon.","p":[{"q":"What is the \"גוזל\" (young bird) mentioned in the verse?","o":["A young dove","A chick of a turtledove","A chick of any kosher bird"]}]},"15:10.1":{"e":"Avram divided each animal into two parts, as is the way of those who make a covenant, who pass between the pieces. Here Hashem made a covenant with him to give his descendants the land, and the smoking furnace and the flaming torch that passed between the pieces were the messenger of the Divine Presence.","pe":"He brought [sacrificed] all these to [before] Him; he split them in the middle [into two equal parts], and placed each piece opposite the other. The bird, however, he did not split.","re":"He split them. [Meaning:] he divided each into two parts. The verse does not exclude its literal meaning, since He was establishing a covenant with him that He would keep His promise to give possession of the land to his descendants, as is written: “On that day, Adonoy made a covenant with Avram, saying,” etc. And it is customary for the parties to a covenant to divide an animal and to pass through between its parts, as it is said: “Who passed through between the parts of the calf,” here, too, the smoking furnace and the flaming torch which passed through between the pieces was the representative of the Divine Presence which is referred to as “fire.”","p":[{"q":"Why did Avram divide the animals into two parts?","o":["This is the way of those who make a covenant, to pass between the pieces","In order to offer each part as a separate sacrifice","To allude that the land would be divided between his two sons"]}]},"15:10.2":{"e":"The nations were likened to bulls, rams, and goats, while Israel was likened to a dove. The cutting up of the animals alludes that the nations will perish and decline, and the not cutting up of the bird alludes that Israel will endure forever.","pe":"He brought [sacrificed] all these to [before] Him; he split them in the middle [into two equal parts], and placed each piece opposite the other. The bird, however, he did not split.","re":"The bird, however, he did not split. Because the idol-worshiping nations are compared to bulls, rams, and goats, as it is said: “Many bulls have surrounded me, etc.” And it says: “The ram that you saw with horns, they are the kings of Media and Persia.” And it says: “The he-goat is king of Greece.” Whereas Israel is compared to young doves, as it is said: “My dove, who is in the rock crevices.” It is for this reason that he split the animals to signify that the nations gradually perish. “The bird, however, he did not split,” signifies that Israel will exist forever.","p":[{"q":"Why did Avram not cut up the bird?","o":["An allusion that Israel, likened to a dove, will endure forever","Because it is not customary to cut up birds when offering them","An allusion that Avraham's descendants will never be exiled from the land"]}]},"15:11.1":{"e":"The \"עיט\" (ayit) is a bird, called this because it swoops and rushes at carcasses to eat, like \"ותעט אל השלל\" (and you swooped upon the spoil).","pe":"Birds of prey [vultures] descended upon the carcasses, but Avram drove them away.","re":"Birds of prey. It is the name of a bird so called because it swoops and is greedy for the carcasses to fly quickly upon its food as in, “And you swooped upon the spoils.”","p":[{"q":"Why is the bird called \"עיט\" (ayit)?","o":["Because it swoops and rushes at carcasses","Because it flies higher than all other birds","Because it eats only small birds"]}]},"15:11.2":{"e":"\"הפגרים\" (the carcasses) are the pieces. The correct Targum of \"פגרים\" is \"פגליא\", from the root of piggul, and one who translates it \"פלגיא\" like \"בתרים\" is mistaken.","pe":"Birds of prey [vultures] descended upon the carcasses, but Avram drove them away.","re":"Upon the carcasses. [Meaning:] on the pieces. Another version: the Targum of הַפְּגָרִים is פַּגְלַיָּא. But, since people have become accustomed to translate אִישׁ בִּתְרוֹ [v. 10] as “He placed the pieces,” they mistakenly confused פַּגְלַיָּא with פַּלְגַּיָּא and [therefore] translated הַפְּגָרִים as פַּלְגַיָּא. And whoever translates it thus is mistaken since you cannot equate pieces with carcasses because [only] בְּתָרִים should be translated פַּלְגַּיָּא and פְּגָרִים should be translated פַּגְלַיָּא from the word פִּיגּוּל [something loathsome] as in, “It is loathsome,” similar to פֶּגֶר [carcass].","p":[{"q":"According to Rashi, how should \"הפגרים\" (the carcasses) be translated?","o":["Pagliya, related to piggul (rejected offering)","Pelagya, like the word for pieces","Nevalya, related to nevelah (carcass)"]}]},"15:11.3":{"e":"\"וישב\" means he blew away, from the language of blowing wind. This alludes that David will want to destroy the nations, but from Heaven they will not let him until King Mashiach comes.","pe":"Birds of prey [vultures] descended upon the carcasses, but Avram drove them away.","re":"Drove away. Meaning blowing and making it fly away, as in, “He causes the wind to blow.” This symbolizing that Dovid ben Yishai will attempt to destroy them [the nations] but will not be permitted by Heaven [God] until the King Mashiach, will come.","p":[{"q":"What is the meaning of \"וישב\" in the verse?","o":["He blew them away, from the language of blowing wind","He sat next to them to guard them","He returned them to their original place"]},{"q":"What does the driving away of the bird of prey from the carcasses allude to?","o":["David will want to destroy the nations, but they will not let him until Mashiach","Israel will be exiled from their land and immediately return to it","Avram himself will defeat all the nations in his lifetime"]}]},"15:12.1":{"e":"The dread and darkness that fell upon Avram at the time of the covenant alluded to the troubles and darkness that his descendants would undergo in the exiles.","pe":"As the sun was setting, a deep sleep fell upon Avram; and behold, a dread of deep darkness fell upon him.","re":"And behold, a dread of deep darkness. Symbolizing the oppression and darkness of the exiles.","p":[{"q":"According to Rashi, what do the dread and darkness that fell upon Avram symbolize?","o":["The troubles and darkness of the exiles that will come upon his descendants","Avram's fear of the kings he fought","The natural darkness of sunset"]}]},"15:13.1":{"e":"The four hundred years are counted from the birth of Yitzchak and not from the descent to Egypt: from the birth of Yitzchak until Yaakov's descent 190 years passed, and in Egypt they were 210 years. They could not have been in Egypt itself for 400 years, since the calculation of the years of Kehat, Amram, and Moshe yields less than that.","pe":"And He [Adonoy] said to Avram: Know for sure that your descendants will be foreigners in a land that is not theirs. They will enslave them and oppress them [for] four hundred years.","re":"That your descendants will be foreigners. [The time] from Yitzchok’s birth until Israel left Egypt was four hundred years. How is this so? Yitzchok was 60 years old at Yaakov’s birth and when Yaakov descended to Egypt, he said, “The years of my temporary residence are one hundred and thirty years,” making a total of 190. They were in Egypt 210 [years] — the numerical value of רְדוּ, making a total of 400 years. If you might suggest that they were in Egypt 400 [years], [this could not be so] because Kehos was of those who descended to Egypt. If you calculate the [total] years of Kehos, Amram and the eighty years of Moshe when [the Israelites] left Egypt, you will find only [a total of] 350. And you must still subtract from that all the years that Kehos lived after Amram’s birth and that Amram lived after Moshe’s birth.","p":[{"q":"From what point does Rashi begin counting the four hundred years?","o":["From the birth of Yitzchak until the Exodus","From the descent of Yaakov and his sons to Egypt","From the beginning of the harsh bondage in Egypt"]},{"q":"How does Rashi prove that Israel were not in Egypt itself for four hundred years?","o":["From the years of Kehat, Amram, and Moshe, which total less than three hundred and fifty","From the Torah explicitly writing two hundred and ten years","From the fact that Yaakov lived in Egypt only seventeen years"]}]},"15:13.2":{"e":"The verse does not say \"in the land of Egypt\" but \"in a land not theirs,\" because the sojourning began already from the birth of Yitzchak, since Avraham, Yitzchak, and Yaakov were all called sojourners in the land.","pe":"And He [Adonoy] said to Avram: Know for sure that your descendants will be foreigners in a land that is not theirs. They will enslave them and oppress them [for] four hundred years.","re":"In a land that is not theirs. It does not state, “In the Land of Egypt,” but rather “In a land that is not theirs.” and from the time that Yitzchok was born, [it is written:] “And Avraham resided, etc.” And concerning Yitzchok [it says:] “Reside in this land.” “And Yaakov resided in the Land of Cham.” “We have come to live in the land temporarily.”","p":[{"q":"According to Rashi, why does it say \"בארץ לא להם\" (in a land not theirs) and not \"in the land of Egypt\"?","o":["Because the sojourning began from the birth of Yitzchak, even in the land of Canaan","Because Israel were exiled to other lands besides Egypt","Because the Torah did not want to mention the name of Egypt"]}]},"15:14.1":{"e":"The word \"וגם\" (and also) comes to include the four kingdoms, which will also perish for having enslaved Israel.","pe":"But also that nation whom they will serve I will judge; afterwards they will leave with great wealth.","re":"But also that nation. [The word] וְגַם [but also] includes the Four Kingdoms that will also perish because they enslaved Israel.","p":[{"q":"What does the word \"וגם\" (and also) come to include, according to Rashi?","o":["The four kingdoms, which will also be punished for enslaving Israel","The Egyptians, who will also afflict Israel","Israel themselves, who will also be judged for their sins"]}]},"15:14.2":{"e":"The judgment with which Hashem will judge Egypt is the ten plagues.","pe":"But also that nation whom they will serve I will judge; afterwards they will leave with great wealth.","re":"I will judge. With ten plagues.","p":[{"q":"According to Rashi, with what will Hashem judge the enslaving nation?","o":["With the ten plagues","With drowning in the Red Sea","With exile from its land"]}]},"15:14.3":{"e":"\"רכש גדול\" (great wealth) means a lot of money, as it says regarding the Exodus, \"וינצלו את מצרים\" (and they emptied Egypt).","pe":"But also that nation whom they will serve I will judge; afterwards they will leave with great wealth.","re":"With great wealth. [Meaning:] with much money, as it is said, “They emptied Egypt.”","p":[{"q":"What is the \"רכש גדול\" (great wealth) with which Israel left, according to Rashi?","o":["A great deal of money taken from Egypt","Very many cattle and flocks","Honor and a good name among the nations"]}]},"15:15.1":{"e":"Hashem promises Avram that he will die before all these troubles come, so he will not see them.","pe":"You will join your fathers in peace; you will be buried at a good old age.","re":"You will join. And will, therefore, not witness all this.","p":[{"q":"What does Rashi add to the promise \"ואתה תבוא\" (and you shall come)?","o":["That Avram will not see all the troubles mentioned","That Avram will merit to see the Exodus from Egypt","That Avram will be buried in Egypt with his descendants"]}]},"15:15.2":{"e":"Avram's father, Terach, was an idol worshipper, and yet Hashem tells Avram that he will go to him. From here we learn that Terach repented.","pe":"You will join your fathers in peace; you will be buried at a good old age.","re":"Your fathers. His father [Terach] was an idol-worshipper and He foretells that he will join him. This teaches you that Terach repented.","p":[{"q":"What does Rashi learn from Hashem telling Avram that he will come to his fathers?","o":["That his father Terach repented","That Avram would be buried in Haran next to his father","That Avram's ancestors were also prophets"]}]},"15:15.3":{"e":"\"שיבה טובה\" (a good old age) is the good news that Yishmael would repent in Avraham's days, and that Eisav would not go out to a bad culture in his days. Therefore Avraham died five years before his time, and on that very day Eisav rebelled.","pe":"You will join your fathers in peace; you will be buried at a good old age.","re":"You will be buried at a good old age. He [God] foretold that Yishmael will repent in his [Avraham’s] lifetime. and that Eisav would not embark on evil ways in his [Avraham’s] lifetime. It is for this reason that he [Avraham] died five years before his [appointed] time and it was on that very day that Eisav rebelled.","p":[{"q":"What makes Avram's old age a \"שיבה טובה\" (good old age) according to Rashi?","o":["That Yishmael would repent and Eisav would not sin in his days","That he would merit long life with health and wealth","That he would merit to see his descendants inherit the land"]},{"q":"According to Rashi, why did Avraham die five years before his time?","o":["So that he would not see Eisav go out to a bad culture","As a punishment for not praying for Sarah","Because Yishmael did not repent in time"]}]},"15:16.1":{"e":"After Israel go down to Egypt, there will be three generations there, and the fourth will return to the land of Canaan, where the covenant was made. And so it was: Yehudah, Peretz, Chetzron, and Calev son of Chetzron entered the land.","pe":"The fourth generation will return here, for the sin of the Emorites will not be complete until then [now].","re":"The fourth generation. [I.e.,] after they will have been exiled to Egypt they will remain there for three generations, and the fourth will return to this land. Because it was in the Land of Canaan that He spoke with him and established this covenant as is written: “To give you this land as an inheritance.” And so it was: Yaakov descended to Egypt. Now, go and count his generations. 1) Yehudah, 2) Peretz, 3) Chetzron and 4) Calev son of Chetzron [who was] of those who entered the Land.","p":[{"q":"From what point are the four generations counted according to Rashi, and who is the fourth generation?","o":["From the descent to Egypt, and the fourth is Calev son of Chetzron","From the birth of Yitzchak, and the fourth is Levi son of Yaakov","From the birth of Avram, and the fourth is Yehudah son of Yaakov"]}]},"15:16.2":{"e":"The Emorite's iniquity was not yet complete enough for him to be expelled from his land, because Hashem does not punish a nation until its measure is full.","pe":"The fourth generation will return here, for the sin of the Emorites will not be complete until then [now].","re":"For the sin of the Emorites will not be complete. To warrant being sent away from his land until that time. [This is] because God does not punish a nation until its measure [of evil] is filled, as it is said: “When her measure is filled, when You send her away, then will You contend with her.”","p":[{"q":"According to Rashi, why must they wait until \"עון האמרי\" (the iniquity of the Emorite) is complete?","o":["Because Hashem does not punish a nation until its measure is full","Because Israel were not yet worthy of receiving the land","Because the Emorite had not yet enslaved Israel"]}]},"15:17.1":{"e":"The expression \"ויהי השמש באה\" is similar to expressions like \"ויהי הם מריקים שקיהם\" (and it was, as they were emptying their sacks), and means: and this thing happened, that the sun set.","pe":"The sun set and it became very dark; and behold, a smoking furnace and a flaming torch had passed between these pieces.","re":"The sun set. This is similar to וַיְהִי הֵם מְרִיקִים שַׂקֵּיהֶם. וַיְהִי הֵם קוֹבְרִים אִישׁ, meaning: and this thing happened.","p":[{"q":"What is the meaning of the word \"ויהי\" in \"ויהי השמש באה\" according to Rashi?","o":["And this thing happened, namely that the sun set","And let the sun be, meaning the sun was created anew","And it was afterward, meaning a long time afterward"]}]},"15:17.2":{"e":"\"השמש באה\" means that the sun had set.","pe":"The sun set and it became very dark; and behold, a smoking furnace and a flaming torch had passed between these pieces.","re":"The sun set. [Meaning:] it set.","p":[{"q":"What is the meaning of \"השמש באה\" (the sun had come) according to Rashi?","o":["The sun had set","The sun had risen","The sun stood in the middle of the sky"]}]},"15:17.3":{"e":"\"עלטה\" (thick darkness) means that the day became dark.","pe":"The sun set and it became very dark; and behold, a smoking furnace and a flaming torch had passed between these pieces.","re":"And it became very dark. [Meaning:] darkness during the day.","p":[{"q":"What is the meaning of \"ועלטה היה\" (and there was thick darkness) according to Rashi?","o":["The day became dark","A heavy fog descended","A stormy wind blew"]}]},"15:17.4":{"e":"The smoking furnace alluded to Avram that the kingdoms that enslaved Israel would fall into Gehinnom.","pe":"The sun set and it became very dark; and behold, a smoking furnace and a flaming torch had passed between these pieces.","re":"And behold, a smoking furnace. He foretold to him symbolically that the [Four] Kingdoms will fall into hell.","p":[{"q":"According to Rashi, what did the \"תנור עשן\" (smoking furnace) allude to for Avram?","o":["That the kingdoms would fall into Gehinnom","That his descendants would be burned in the fiery furnace","That Hashem would accept his sacrifices"]}]},"15:17.5":{"e":"Here the word \"באה\" has its cantillation mark on the first syllable, so it is past tense: the sun had already set. It cannot be explained as setting right now, since it was already said earlier \"ויהי השמש לבוא\". This is a rule for every feminine word whose root is two letters: with the stress on the first syllable it is past tense, and with the stress on the last syllable it is present tense.","pe":"The sun set and it became very dark; and behold, a smoking furnace and a flaming torch had passed between these pieces.","re":"Set. The accent is on the first syllable. It is thus made clear that it [the sun] had already set. If the accent were on the last syllable, [i.e.,] on the letter aleph, it would mean “as it was setting,” an explanation which is not possible, for it has already stated: “As the sun was setting,” and the passing of the smoking furnace took place after this. Consequently [the sun] had already set. This difference [holds true] with every feminine word that has a two-letter root, such as, בָּא [come], קָם [rise], שָׁב [return]. When the accent is on the first syllable, it is past tense, such as in this case, and as in “Rachel came”; “My sheaf arose”; “Behold your sister-in-law has returned.” But, when the accent is on the last syllable, then it is in the present tense, denoting that which is now happening and is continuing to happen, as in “She is coming with the sheep” [or] “In the evening she comes and in the morning she returns.”","p":[{"q":"What does Rashi learn from the cantillation mark in the word \"באה\" being on the first syllable?","o":["That the sun had already fully set","That the sun was still setting at that moment","That the sun was about to set soon"]},{"q":"What is the rule Rashi establishes for words like \"באה\", \"קמה\", and \"שבה\"?","o":["Stress on the first syllable is past tense, and stress on the last syllable is present tense","Stress on the first syllable is present tense, and stress on the last syllable is past tense","Stress on the first syllable is future tense, and stress on the last syllable is imperative"]}]},"15:18.1":{"e":"Hashem says \"נתתי\" (I have given) in the past tense even though the giving has not yet taken place, because the word of the Holy One, blessed be He, is considered as though it has already been done.","pe":"On that day Adonoy made a covenant with Avram, saying: To your descendants I have given this land, from the river of Egypt as far as the great river, the Euphrates.","re":"To your descendants I have given. A promise from God is considered as if it has already happened.","p":[{"q":"Why is \"נתתי\" (I have given) said in the past tense, even though the land had not yet been given?","o":["Because the word of the Holy One, blessed be He, is considered as though already done","Because the land had already been given to Avram earlier","Because it is an expression of prayer and request by Avram"]}]},"15:18.2":{"e":"The Euphrates River is called \"great\" because it is adjacent to the Land of Israel, even though it is the last of the four rivers that go out from Eden. As the popular saying goes: a king's servant is like a king.","pe":"On that day Adonoy made a covenant with Avram, saying: To your descendants I have given this land, from the river of Egypt as far as the great river, the Euphrates.","re":"The great river. Since it is associated with the Land of Israel He refers to it as “great,” though it is the last one [mentioned] among the four rivers that flow from Eden, as it is said: “And the fourth river is P’ras [the Euphrates].” [This is analogous to] a common proverb: “A king’s servant is a king.” “Associate with the ruler and they will bow to you.”","p":[{"q":"Why is the Euphrates called \"הנהר הגדול\" (the great river) in the verse according to Rashi?","o":["Because it is adjacent to the Land of Israel","Because it is the greatest of the rivers of Eden","Because it is the first of
