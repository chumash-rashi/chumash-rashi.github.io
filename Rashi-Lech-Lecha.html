ת רבה):", "rashi_en": "[Meaning:] a turtle dove and a young pigeon.", "note": "", "points": [{"q": "'ותר וגוזל' — what kind מתוך bird is the 'גוזל'?", "options": ["A young pigeon", "A young eagle", "A wild sparrow"], "kasha": "'גוזל' just means a young bird — which kind?", "answer": "A turtledove and a young pigeon (בן יונה), per בראשית Rabbah."}]}, {"id": "15:10.1", "ch": 15, "v": 10, "n": 1, "dh": "ויבתר אתם", "pasuk_html": "וַיִּֽקַּֽח־ל֣וֹ אֶת־כׇּל־אֵ֗לֶּה <mark>וַיְבַתֵּ֤ר אֹתָם֙</mark> בַּתָּ֔וֶךְ וַיִּתֵּ֥ן אִישׁ־בִּתְר֖וֹ לִקְרַ֣את רֵעֵ֑הוּ וְאֶת־הַצִּפֹּ֖ר לֹ֥א בָתָֽר׃", "pasuk_en": "He brought [sacrificed] all these to [before] Him; he split them in the middle [into two equal parts], and placed each piece opposite the other. The bird, however, he did not split.", "rashi_he": "חָלַק כָּל אֶחָד לִשְׁנֵי חֲלָקִים; וְאֵין הַמִּקְרָא יוֹצֵא מִידֵי פְשׁוּטוֹ, לְפִי שֶׁהָיָה כוֹרֵת בְּרִית עִמּוֹ לִשְׁמֹר הַבְטָחָתוֹ לְהוֹרִיש לְבָנָיו אֶת הָאָרֶץ כְּדִכְתִיב בַּיּוֹם הַהוּא כָּרַת ה' אֶת אַבְרָם בְּרִית לֵאמֹר וְגוֹמֵר, וְדֶרֶך כּוֹרְתֵי בְרִית לְחַלֵּק בְּהֵמָה וְלַעֲבֹר בֵּין בְּתָרֶיהָ, כְּמַה שֶּׁנֶּאֱמַר לְהַלָּן הָעֹבְרִים בֵּין בִּתְרֵי הָעֵגֶל (ירמיה ל\"ד), אַף כָּאן תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הוּא שְׁלוּחוֹ שֶׁל שְׁכִינָה, שֶׁהוּא אֵשׁ.", "rashi_en": "[Meaning:] he divided each into two parts. The verse does not exclude its literal meaning, since He was establishing a covenant with him that He would keep His promise to give possession מתוך the land to his descendants, as is written: “On that day, Adonoy made a covenant with Avram, saying,” etc. And it is customary for the parties to a covenant to divide an animal and to pass through between its parts, as it is said: “Who passed through between the parts מתוך the calf,” here, too, the smoking furnace and the flaming torch which passed through between the pieces was the representative מתוך the Divine Presence which is referred to as “fire.”", "note": "", "points": [{"q": "'ויבתר אתם בתוך' — did Avram really cut the animals in half, or is it only a hint?", "options": ["Really — each split in two for a covenant", "Only a hint about dividing the land", "He cut them into many small pieces"], "kasha": "The whole vision is full מתוך hints — maybe the cutting is only symbolic too?", "answer": "He split each into two, literally: Hashem was making a covenant to keep His promise מתוך the land, as posuk 18 says, 'ביום ההוא כרת ה' את אברם ברית.'"}, {"q": "What does splitting animals have to do with making a covenant?", "options": ["Covenant makers pass between an animal's halves", "Each side takes home half the meat", "The halves are burned as a shared korban"], "kasha": "Why would a covenant need split animals?", "answer": "It was the custom מתוך those making a covenant to split an animal and pass between its pieces, as Yirmiyahu says: 'העוברים בין בתרי העגל.'"}, {"q": "In this covenant, who 'passed between the pieces'?", "options": ["The fire — the Shechinah's messenger", "Avram himself walked between them", "Malachim in the form מתוך men"], "kasha": "A covenant needs a party to pass between the pieces — who did here?", "answer": "The smoking furnace and flaming torch that passed between the pieces were the messenger מתוך the Shechinah, which is called fire."}]}, {"id": "15:10.2", "ch": 15, "v": 10, "n": 2, "dh": "ואת הצפור לא בתר", "pasuk_html": "וַיִּֽקַּֽח־ל֣וֹ אֶת־כׇּל־אֵ֗לֶּה וַיְבַתֵּ֤ר אֹתָם֙ בַּתָּ֔וֶךְ וַיִּתֵּ֥ן אִישׁ־בִּתְר֖וֹ לִקְרַ֣את רֵעֵ֑הוּ וְאֶת־הַצִּפֹּ֖ר לֹ֥א בָתָֽר׃", "pasuk_en": "He brought [sacrificed] all these to [before] Him; he split them in the middle [into two equal parts], and placed each piece opposite the other. The bird, however, he did not split.", "rashi_he": "לְפִי שֶׁהָאֻמּוֹת נִמְשְׁלוּ לְפָרִים וְאֵילִים וּשְֹעִירִים, שֶׁנֶּאֱמַר סְבָבוּנִי פָּרִים רַבִּים וְגוֹ' (תהל' כ\"ב), וְאוֹמֵר הָאַיִל אֲשֶׁר רָאִיתָ בַּעַל הַקְּרָנָיִם מַלְכֵי מָדַי וּפָרָס (דניאל ח'), וְאוֹמֵר וְהַצָּפִיר הַשָּׂעִיר מֶלֶךְ יָוָן (שם), וְיִשְֹרָאֵל נִמְשְׁלוּ לִבְנֵי יוֹנָה, שֶׁנֶּאֱמַר יוֹנָתִי בְּחַגְוֵי הַסֶּלַע (שיר השירים ב'), לְפִיכָךְ בִּתֵּר הַבְּהֵמוֹת, רֶמֶז שֶׁיִּהְיוּ הָאֻמּוֹת כָּלִים וְהוֹלְכִים, <b>ואת הצפור לא בתר</b>, רֶמֶז שֶׁיִּהְיוּ יִשְֹרָאֵל קַיָּמִין לְעוֹלָם:", "rashi_en": "Because the idol-worshiping nations are compared to bulls, rams, and goats, as it is said: “Many bulls have surrounded me, etc.” And it says: “The ram that you saw with horns, they are the kings מתוך Media and Persia.” And it says: “The he-goat is king מתוך Greece.” Whereas Israel is compared to young doves, as it is said: “My dove, who is in the rock crevices.” It is for this reason that he split the animals to signify that the nations gradually perish. “The bird, however, he did not split,” signifies that Israel will exist forever.", "note": "", "points": [{"q": "The animals were bulls, rams and goats; the bird a dove. Whom does Tanach compare to each?", "options": ["The nations to the animals, Yisroel to a dove", "Yisroel to the animals, the nations to a dove", "Kings to the animals, Kohanim to a dove"], "kasha": "Why split the animals but not the birds?", "answer": "Nations are compared to bulls ('סבבוני פרים רבים'), a ram (kings מתוך Madai and Paras) and a goat (king מתוך Yavan) in Daniel; Yisroel to a dove ('יונתי בחגוי הסלע')."}, {"q": "So what does splitting the animals, but not the bird, hint at?", "options": ["The nations will perish; Yisroel will last forever", "Yisroel will split into two kingdoms", "The nations will unite against Yisroel"], "kasha": "What message is in treating them differently?", "answer": "Splitting the animals hints that the nations will gradually perish; the unsplit bird hints that Yisroel will exist forever."}]}, {"id": "15:11.1", "ch": 15, "v": 11, "n": 1, "dh": "העיט", "pasuk_html": "וַיֵּ֥רֶד <mark>הָעַ֖יִט</mark> עַל־הַפְּגָרִ֑ים וַיַּשֵּׁ֥ב אֹתָ֖ם אַבְרָֽם׃", "pasuk_en": "Birds מתוך prey [vultures] descended upon the carcasses, but Avram drove them away.", "rashi_he": "הוּא עוֹף, עַל שֵׁם שֶׁהוּא עָט וְשׁוֹאֵף אֶל הַנְּבֵלוֹת לָטוּשׂ עֲלֵי אֹכֶל, כְּמוֹ וַתַּעַט אֶל הַשָּׁלָל (שמואל א ט\"ו):", "rashi_en": "It is the name מתוך a bird so called because it swoops and is greedy for the carcasses to fly quickly upon its food as in, “And you swooped upon the spoils.”", "note": "", "points": [{"q": "What is the 'עיט' that came down on the carcasses?", "options": ["A bird that swoops onto carcasses", "A wild dog that eats dead animals", "A swarm מתוך flies"], "kasha": "'העיט' is an unusual word — what does it mean?", "answer": "A bird מתוך prey, named for swooping (עט) greedily onto carcasses, like 'ותעט אל השלל.'"}]}, {"id": "15:11.2", "ch": 15, "v": 11, "n": 2, "dh": "על הפגרים", "pasuk_html": "וַיֵּ֥רֶד הָעַ֖יִט עַל־הַפְּגָרִ֑ים וַיַּשֵּׁ֥ב אֹתָ֖ם אַבְרָֽם׃", "pasuk_en": "Birds מתוך prey [vultures] descended upon the carcasses, but Avram drove them away.", "rashi_he": "עַל הַבְּתָרִים. הַפְּגָרִים מְתַרְגְּמִינָן פַּגְלַיָּא, אֶלָּא מִתּוֹךְ שֶׁהֻרְגְּלוּ לְתַרְגֵּם \"איש בִּתְרוֹ\" וִיהַב פַּלְגַּיָּא, נִתְחַלֵּף לָהֶם תֵּבַת פַּגְלַיָּא לְפַלְגַּיָּא, וְתִרְגְּמוּ הַפְּגָרִים פַּלְגַּיָּא; וְכָל הַמְתַרְגֵּם כֵּן טוֹעֶה, לְפִי שֶׁאֵין לְהַקִּיש בְּתָרִים לִפְגָרִים, שֶׁבְּתָרִים תַּרְגּוּמוֹ פַּלְגַּיָּא, וּפְגָרִים תַּרְגּוּמוֹ פַּגְלַיָּא, לְשׁוֹן פִּגּוּל, כְּמוֹ פִּגּוּל הוּא (ויקרא ז') לְ' פֶּגֶר:", "rashi_en": "[Meaning:] on the pieces. Another version: the Targum מתוך הַפְּגָרִים is פַּגְלַיָּא. But, since people have become accustomed to translate אִישׁ בִּתְרוֹ [v. 10] as “He placed the pieces,” they mistakenly confused פַּגְלַיָּא with פַּלְגַּיָּא and [therefore] translated הַפְּגָרִים as פַּלְגַיָּא. And whoever translates it thus is mistaken since you cannot equate pieces with carcasses because [only] בְּתָרִים should be translated פַּלְגַּיָּא and פְּגָרִים should be translated פַּגְלַיָּא from the word פִּיגּוּל [something loathsome] as in, “It is loathsome,” similar to פֶּגֶר [carcass].", "note": "", "points": [{"q": "The birds came down 'על הפגרים.' What are the 'פגרים' here?", "options": ["The split pieces מתוך the animals", "Dead soldiers from the war", "Avram's sleeping servants"], "kasha": "'פגרים' usually means corpses — what does it refer to here?", "answer": "On the pieces (בתרים) that Avram had split."}, {"q": "Some Targum texts render 'הפגרים' as 'פלגיא' (halves). What does רש״י say about that?", "options": ["It's a mistake — the נכון word is פגליא", "It's correct — פגרים means halves", "Both words mean the same thing"], "kasha": "The common Targum text translates פגרים as 'halves,' which doesn't fit the word.", "answer": "Targum is פגליא (carcasses, from פגול, like פגר). Used to 'פלגיא' for 'בתרו,' people swapped the letters. Whoever translates פלגיא is mistaken — בתרים and פגרים aren't the same."}]}, {"id": "15:11.3", "ch": 15, "v": 11, "n": 3, "dh": "וישב", "pasuk_html": "וַיֵּ֥רֶד הָעַ֖יִט עַל־הַפְּגָרִ֑ים <mark>וַיַּשֵּׁ֥ב</mark> אֹתָ֖ם אַבְרָֽם׃", "pasuk_en": "Birds מתוך prey [vultures] descended upon the carcasses, but Avram drove them away.", "rashi_he": "לְשׁוֹן נְשִׁיבָה וְהַפְרָחָה, כְּמוֹ יַשֵּׁב רוּחוֹ (תה' קמ\"ז), רֶמֶז שֶׁיָּבֹא דָוִד בֶּן יִשַּׁי לְכַלּוֹתָם, וְאֵין מַנִּיחִין אוֹתוֹ מִן הַשָּׁמַיִם עַד שֶׁיָּבֹא מֶלֶךְ הַמָּשִׁיחַ:", "rashi_en": "Meaning blowing and making it fly away, as in, “He causes the wind to blow.” This symbolizing that Dovid ben Yishai will attempt to destroy them [the nations] but will not be permitted by Heaven [God] until the King Mashiach, will come.", "note": "", "points": [{"q": "'וישב אתם אברם' — what does 'וישב' mean here?", "options": ["He blew them away", "He sat down among them", "He brought them back"], "kasha": "'וישב' can't mean 'sat' here.", "answer": "Blowing and making them fly away, like 'ישב רוחו' — He makes His wind blow."}, {"q": "What did Avram driving מתוךf the birds מתוך prey hint at for the future?", "options": ["Dovid will try to finish the nations; only Moshiach will", "Avram's children will always beat their enemies", "Yisroel will never be harmed in exile"], "kasha": "The whole vision is symbolic — what does chasing the birds mean?", "answer": "It hints that Dovid ben Yishai will come to destroy the nations, but Heaven won't let him until Melech HaMoshiach comes."}]}, {"id": "15:12.1", "ch": 15, "v": 12, "n": 1, "dh": "והנה אימה וגו'", "pasuk_html": "וַיְהִ֤י הַשֶּׁ֙מֶשׁ֙ לָב֔וֹא וְתַרְדֵּמָ֖ה נָפְלָ֣ה עַל־אַבְרָ֑ם וְהִנֵּ֥ה אֵימָ֛ה חֲשֵׁכָ֥ה גְדֹלָ֖ה נֹפֶ֥לֶת עָלָֽיו׃", "pasuk_en": "As the sun was setting, a deep sleep fell upon Avram; and behold, a dread מתוך deep darkness fell upon him.", "rashi_he": "רֶמֶז לְצָרוֹת וְחשֶׁךְ שֶׁל גָּלִיּוֹת:", "rashi_en": "Symbolizing the oppression and darkness מתוך the exiles.", "note": "", "points": [{"q": "What did the 'אימה חשכה גדלה,' a dread מתוך great darkness, symbolize?", "options": ["The troubles and darkness מתוך the exiles", "Avram's fear מתוך dying soon", "The coming night מתוך the covenant"], "kasha": "Why would a dark dread fall on Avram during a covenant?", "answer": "It hinted at the troubles and darkness מתוך the exiles."}]}, {"id": "15:13.1", "ch": 15, "v": 13, "n": 1, "dh": "כי גר יהיה זרעך", "pasuk_html": "וַיֹּ֣אמֶר לְאַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי־גֵ֣ר&thinsp;׀ יִהְיֶ֣ה זַרְעֲךָ֗ בְּאֶ֙רֶץ֙ לֹ֣א לָהֶ֔ם וַעֲבָד֖וּם וְעִנּ֣וּ אֹתָ֑ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה׃", "pasuk_en": "And He [Adonoy] said to Avram: Know for sure that your descendants will be foreigners in a land that is not theirs. They will enslave them and oppress them [for] four hundred years.", "rashi_he": "מִשֶּׁנּוֹלַד יִצְחָק עַד שֶׁיָּצְאוּ יִשְֹרָאֵל מִמִּצְרַיִם אַרְבַּע מֵאוֹת שָׁנָה כֵּיצַד? יִצְחָק בֶּן שִׁשִּׁים שָׁנָה כְּשֶׁנּוֹלַד יַעֲקֹב, וְיַעֲקֹב כְּשֶׁיָּרַד לְמִצְרַיִם אָמַר יְמֵי שְׁנֵי מְגוּרַי שְׁלֹשִׁים וּמְאַת שָׁנָה, הֲרֵי ק\"צ, וּבְמִצְרַיִם הָיוּ מָאתַיִם וְעֶשֶׂר כְּמִנְיַן רְד\"וּ, הֲרֵי אַרְבַּע מֵאוֹת שָׁנָה. וְאִם תֹּאמַר בְּמִצְרַיִם הָיוּ אַרְבַּע מֵאוֹת, הֲרֵי קְהָת מִיּוֹרְדֵי מִצְרַיִם הָיָה, צֵא וַחֲשֹׁב שְׁנוֹתָיו שֶׁל קְהָת וְשֶׁל עַמְרָם וּשְׁמוֹנִים שֶׁל משֶׁה שֶׁהָיָה כְּשֶׁיֶָּצְאוּ יִשְֹרָאֵל מִמִּצְרַיִם, אֵין אַתָּה מוֹצֵא אֶלָּא שְׁלֹשׁ מֵאוֹת וַחֲמִשִּׁים, וְאַתָּה צָרִיךְ לְהוֹצִיא מֵהֶן כָּל הַשָּׁנִים שֶׁחַי קְהָת אַחַר לֵדַת עַמְרָם וְשֶׁחַי עַמְרָם אַחַר לֵדַת משֶׁה:", "rashi_en": "[The time] from Yitzchok’s birth until Israel left Egypt was four hundred years. How is this so? Yitzchok was 60 years old at Yaakov’s birth and when Yaakov descended to Egypt, he said, “The years מתוך my temporary residence are one hundred and thirty years,” making a total מתוך 190. They were in Egypt 210 [years] — the numerical value מתוך רְדוּ, making a total מתוך 400 years. If you might suggest that they were in Egypt 400 [years], [this could not be so] because Kehos was מתוך those who descended to Egypt. If you calculate the [total] years מתוך Kehos, Amram and the eighty years מתוך Moshe when [the Israelites] left Egypt, you will find only [a total מתוך] 350. And you must still subtract from that all the years that Kehos lived after Amram’s birth and that Amram lived after Moshe’s birth.", "note": "", "points": [{"q": "'ארבע מאות שנה' — from when are the 400 years counted?", "options": ["From Yitzchok's birth", "From going down to Mitzrayim", "From Yaakov's birth"], "kasha": "Klal Yisroel was in Mitzrayim only 210 years, not 400.", "answer": "From Yitzchok's birth: he was 60 when Yaakov was born, Yaakov was 130 going down (190 total), and 210 years in Mitzrayim, like רד״ו — 400."}, {"q": "How does רש״י prove they couldn't have spent 400 years in Mitzrayim itself?", "options": ["Kehos, Amram and Moshe's years don't add up", "Yaakov was too old when he went down", "Pharaoh's dynasty didn't rule that long"], "kasha": "Maybe the posuk does mean 400 years in Mitzrayim itself?", "answer": "Kehos went down to Mitzrayim. His years, Amram's, and Moshe's 80 at the Exodus total only 350 — and the overlapping years must still be subtracted."}]}, {"id": "15:13.2", "ch": 15, "v": 13, "n": 2, "dh": "בארץ לא להם", "pasuk_html": "וַיֹּ֣אמֶר לְאַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי־גֵ֣ר&thinsp;׀ יִהְיֶ֣ה זַרְעֲךָ֗ <mark>בְּאֶ֙רֶץ֙ לֹ֣א לָהֶ֔ם</mark> וַעֲבָד֖וּם וְעִנּ֣וּ אֹתָ֑ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה׃", "pasuk_en": "And He [Adonoy] said to Avram: Know for sure that your descendants will be foreigners in a land that is not theirs. They will enslave them and oppress them [for] four hundred years.", "rashi_he": "לֹא נֶאֱמַר בְּאֶרֶץ מִצְרַיִם, אֶלָּא לֹא לָהֶם – וּמִשֶּׁנּוֹלַד יִצְחָק וַיָּגָר אַבְרָהָם וְגוֹ' (בר' כ\"א), וּבְיִצְחָק גּוּר בָּאָרֶץ הַזֹאת (שם כ\"ו), וְיַעֲקֹב גָּר בְּאֶרֶץ חָם (תה' ק\"ה), לָגוּר בָּאָרֶץ בָּאנוּ (בר' מ\"ז):", "rashi_en": "It does not state, “In the Land מתוך Egypt,” but rather “In a land that is not theirs.” and from the time that Yitzchok was born, [it is written:] “And Avraham resided, etc.” And concerning Yitzchok [it says:] “Reside in this land.” “And Yaakov resided in the Land מתוך Cham.” “We have come to live in the land temporarily.”", "note": "", "points": [{"q": "Why does the posuk say 'בארץ לא להם' instead מתוך 'בארץ מצרים'?", "options": ["Being strangers began with Yitzchok, even in Canaan", "Hashem hid from Avram where it would be", "The exile would really be in Bavel"], "kasha": "Why not just say 'in Mitzrayim'?", "answer": "It doesn't say Mitzrayim but 'a land not theirs' — which includes Canaan — from the time Yitzchok was born."}, {"q": "How do we see the Avos were 'strangers' even in Canaan?", "options": ["Each is described with the word 'גר'", "They paid tax to the Canaanite kings", "They were forbidden to buy land there"], "kasha": "The Avos lived in Canaan — were they really strangers there?", "answer": "Avraham: 'ויגר אברהם'; Yitzchok: 'גור בארץ הזאת'; Yaakov: 'גר בארץ חם'; and the brothers: 'לגור בארץ באנו.'"}]}, {"id": "15:14.1", "ch": 15, "v": 14, "n": 1, "dh": "וגם את הגוי", "pasuk_html": "וְגַ֧ם אֶת־הַגּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְאַחֲרֵי־כֵ֥ן יֵצְא֖וּ בִּרְכֻ֥שׁ גָּדֽוֹל׃", "pasuk_en": "But also that nation whom they will serve I will judge; afterwards they will leave with great wealth.", "rashi_he": "וְגַם לְרַבּוֹת ד' מַלְכֻיּוֹת, שֶׁאַף הֵן כָּלִים עַל שֶׁשִּׁעְבְּדוּ אֶת יִשְׂרָאֵל:", "rashi_en": "[The word] וְגַם [but also] includes the Four Kingdoms that will also perish because they enslaved Israel.", "note": "", "points": [{"q": "'וגם את הגוי' — what does the extra word 'וגם' (also) add?", "options": ["The Four Kingdoms will also be punished", "Mitzrayim's animals will also suffer", "Avram's enemies will also be judged"], "kasha": "'וגם' (also) seems unnecessary.", "answer": "It includes the Four Kingdoms, who will also perish for enslaving Yisroel."}]}, {"id": "15:14.2", "ch": 15, "v": 14, "n": 2, "dh": "דן אנכי", "pasuk_html": "וְגַ֧ם אֶת־הַגּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ <mark>דָּ֣ן אָנֹ֑כִי</mark> וְאַחֲרֵי־כֵ֥ן יֵצְא֖וּ בִּרְכֻ֥שׁ גָּדֽוֹל׃", "pasuk_en": "But also that nation whom they will serve I will judge; afterwards they will leave with great wealth.", "rashi_he": "בְּעֶשֶׂר מַכּוֹת:", "rashi_en": "With ten plagues.", "note": "", "points": [{"q": "Hashem says מתוך Mitzrayim 'דן אנכי' — I will judge. How?", "options": ["With the ten makkos", "With a great flood", "By punishing only Pharaoh"], "kasha": "'I will judge' is vague — what judgment?", "answer": "With the ten makkos."}]}, {"id": "15:14.3", "ch": 15, "v": 14, "n": 3, "dh": "ברכש גדול", "pasuk_html": "וְגַ֧ם אֶת־הַגּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְאַחֲרֵי־כֵ֥ן יֵצְא֖וּ <mark>בִּרְכֻ֥שׁ גָּדֽוֹל׃</mark>", "pasuk_en": "But also that nation whom they will serve I will judge; afterwards they will leave with great wealth.", "rashi_he": "בְּמָמוֹן גָּדוֹל, כְּמוֹ שֶׁנֶּאֱמַר וַיְנַצְּלוּ אֶת מִצְרָיִם (שמות י\"ב):", "rashi_en": "[Meaning:] with much money, as it is said, “They emptied Egypt.”", "note": "", "points": [{"q": "'ברכש גדול' — what is the 'great possession' they will leave with?", "options": ["Great wealth — lots מתוך money", "Many cattle and sheep", "Great honor among the nations"], "kasha": "What exactly is 'רכוש גדול'?", "answer": "Much money, as it says 'וינצלו את מצרים' — they emptied Mitzrayim."}]}, {"id": "15:15.1", "ch": 15, "v": 15, "n": 1, "dh": "ואתה תבוא", "pasuk_html": "<mark>וְאַתָּ֛ה תָּב֥וֹא</mark> אֶל־אֲבֹתֶ֖יךָ בְּשָׁל֑וֹם תִּקָּבֵ֖ר בְּשֵׂיבָ֥ה טוֹבָֽה׃", "pasuk_en": "You will join your fathers in peace; you will be buried at a good old age.", "rashi_he": "וְלֹא תִרְאֶה כָּל אֵלֶה:", "rashi_en": "And will, therefore, not witness all this.", "note": "", "points": [{"q": "Why does Hashem say 'ואתה תבוא אל אבתיך' נכון after describing the exile?", "options": ["Avram won't live to see these troubles", "Avram will lead them out himself", "Avram must be buried in Mitzrayim"], "kasha": "Why mention Avram's death in the middle מתוך the exile prophecy?", "answer": "Avram will pass away first and won't see any מתוך this."}]}, {"id": "15:15.2", "ch": 15, "v": 15, "n": 2, "dh": "אל אבותיך", "pasuk_html": "וְאַתָּ֛ה תָּב֥וֹא אֶל־אֲבֹתֶ֖יךָ בְּשָׁל֑וֹם תִּקָּבֵ֖ר בְּשֵׂיבָ֥ה טוֹבָֽה׃", "pasuk_en": "You will join your fathers in peace; you will be buried at a good old age.", "rashi_he": "אָבִיו עוֹבֵד עֲ\"זָ וְהוּא מְבַשְּׂרוֹ שֶׁיָּבֹא אֵלָיו? לִמֶּדְךָ שֶׁעָשָׂה תֶּרַח תְּשׁוּבָה:", "rashi_en": "His father [Terach] was an idol-worshipper and He foretells that he will join him. This teaches you that Terach repented.", "note": "", "points": [{"q": "Avram will join 'אבתיך' — his fathers — in peace. What's surprising about that?", "options": ["Terach worshipped idols, so he must have done teshuvah", "Avram's fathers were buried far away in Charan", "Avram was told he'd outlive all his children"], "kasha": "Terach was an idol worshipper — how can Avram join him in peace?", "answer": "This teaches that Terach did teshuvah."}]}, {"id": "15:15.3", "ch": 15, "v": 15, "n": 3, "dh": "תקבר בשיבה טובה", "pasuk_html": "וְאַתָּ֛ה תָּב֥וֹא אֶל־אֲבֹתֶ֖יךָ בְּשָׁל֑וֹם <mark>תִּקָּבֵ֖ר בְּשֵׂיבָ֥ה טוֹבָֽה׃</mark>", "pasuk_en": "You will join your fathers in peace; you will be buried at a good old age.", "rashi_he": "בִּשְּׂרוֹ שֶׁיַּעֲשֶׂה יִשְׁמָעֵאל תְּשׁוּבָה בְּיָמָיו, וְלֹא יֵצֵא עֵשָׂו לְתַרְבּוּת רָעָה בְּיָמָיו; וּלְפִיכָךְ מֵת ה' שָׁנִים קֹדֶם זְמַנּוֹ, וּבוֹ בַיּוֹם מָרַד עֵשָׂו:", "rashi_en": "He [God] foretold that Yishmael will repent in his [Avraham’s] lifetime. and that Eisav would not embark on evil ways in his [Avraham’s] lifetime. It is for this reason that he [Avraham] died five years before his [appointed] time and it was on that very day that Eisav rebelled.", "note": "", "points": [{"q": "'תקבר בשיבה טובה' — what made Avram's old age 'good'?", "options": ["Yishmael repented and Eisav didn't go bad yet", "He lived longer than any מתוך his ancestors", "He was buried beside Sarah in Eretz Yisroel"], "kasha": "Why add 'good' old age — what was good about it?", "answer": "Hashem told him that Yishmael would do teshuvah in his lifetime, and Eisav would not go מתוךf to evil ways in his lifetime."}, {"q": "Eisav did go bad eventually. How was Avraham spared from seeing it?", "options": ["Avraham died five years before his time", "Eisav was sent away from home", "Avraham lost his eyesight in old age"], "kasha": "How could Eisav not go bad in Avraham's lifetime?", "answer": "Avraham died five years before his appointed time, and on that very day Eisav rebelled."}]}, {"id": "15:16.1", "ch": 15, "v": 16, "n": 1, "dh": "ודור רביעי", "pasuk_html": "<mark>וְד֥וֹר רְבִיעִ֖י</mark> יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא־שָׁלֵ֛ם עֲוֺ֥ן הָאֱמֹרִ֖י עַד־הֵֽנָּה׃", "pasuk_en": "The fourth generation will return here, for the sin מתוך the Emorites will not be complete until then [now].", "rashi_he": "לְאַחַר שֶׁיִּגְלוּ לְמִצְרַיִם יִהְיוּ שָׁם ג' דּוֹרוֹת, וְהָרְבִיעִי יָשׁוּבוּ לָאָרֶץ הַזֹּאת, לְפִי שֶׁבְּאֶרֶץ כְּנַעַן הָיָה מְדַבֵּר עִמּוֹ, וְכָרַת בְּרִית זוֹ, כְּדִכְתִיב: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ. וְכֵן הָיָה: יַעֲקֹב יָרַד לְמִצְרַיִם, צֵא וַחֲשֹׁב דּוֹרוֹתָיו: יְהוּדָה, פֶּרֶץ, וְחֶצְרוֹן, וְכָלֵב בֶּן חֶצְרוֹן מִבָּאֵי הָאָרֶץ הָיָה:", "rashi_en": "[I.e.,] after they will have been exiled to Egypt they will remain there for three generations, and the fourth will return to this land. Because it was in the Land מתוך Canaan that He spoke with him and established this covenant as is written: “To give you this land as an inheritance.” And so it was: Yaakov descended to Egypt. Now, go and count his generations. 1) Yehudah, 2) Peretz, 3) Chetzron and 4) Calev son מתוך Chetzron [who was] מתוך those who entered the Land.", "note": "", "points": [{"q": "'ודור רביעי ישובו הנה' — the fourth generation counted from when?", "options": ["From going down to Mitzrayim", "From Avram's own generation", "From Yitzchok's birth"], "kasha": "Fourth generation from what point?", "answer": "After they are exiled to Mitzrayim they will be there three generations, and the fourth will return."}, {"q": "Where is 'הנה' — 'here' — that they will return to?", "options": ["Canaan, where Hashem spoke with Avram", "Charan, where Avram's family lived", "Mitzrayim, where the exile ends"], "kasha": "'Here' is vague — where was Avram during this vision?", "answer": "To this land, Canaan: Hashem spoke with him there and made this covenant, as it says 'לתת לך את הארץ הזאת לרשתה.'"}, {"q": "How did the 'fourth generation' promise come true?", "options": ["Yehudah, Peretz, Chetzron — then Calev entered the land", "Levi, Kehos, Amram — then Moshe entered the land", "Yosef, Ephraim, Nun — then Yehoshua entered the land"], "kasha": "Did they really return in the fourth generation?", "answer": "Yaakov went down; count his generations: Yehudah, Peretz, Chetzron — and Calev ben Chetzron was among those who entered the land."}]}, {"id": "15:16.2", "ch": 15, "v": 16, "n": 2, "dh": "כי לא שלם עון האמרי", "pasuk_html": "וְד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא־שָׁלֵ֛ם עֲוֺ֥ן הָאֱמֹרִ֖י עַד־הֵֽנָּה׃", "pasuk_en": "The fourth generation will return here, for the sin מתוך the Emorites will not be complete until then [now].", "rashi_he": "לִהְיוֹת מִשְׁתַּלֵּחַ מֵאַרְצוֹ עַד אוֹתוֹ זְמַן, שֶׁאֵין הַקָּבָּ\"ה נִפְרָע מֵאֻמָּה עַד שֶׁתִּתְמַלֵּא סְאָתָהּ, שֶׁנֶּאֱמַר בְּסַאסְּאָה בְּשַׁלְחָהּ תְּרִיבֶנָּה (יש' כ\"ז):", "rashi_en": "To warrant being sent away from his land until that time. [This is] because God does not punish a nation until its measure [מתוך evil] is filled, as it is said: “When her measure is filled, when You send her away, then will You contend with her.”", "note": "", "points": [{"q": "'כי לא שלם עון האמרי' — why wait for the Emori's sin to be 'complete'?", "options": ["Hashem doesn't punish a nation until its measure fills", "The Emori were too strong until then", "Yisroel needed time to become numerous"], "kasha": "What does the Emori's sin have to do with when Yisroel returns?", "answer": "Until then they don't deserve to be sent from their land: Hashem doesn't punish a nation until its measure is full, as it says 'בסאסאה בשלחה תריבנה.'"}]}, {"id": "15:17.1", "ch": 15, "v": 17, "n": 1, "dh": "ויהי השמש באה", "pasuk_html": "<mark>וַיְהִ֤י הַשֶּׁ֙מֶשׁ֙ בָּ֔אָה</mark> וַעֲלָטָ֖ה הָיָ֑ה וְהִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְלַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַגְּזָרִ֥ים הָאֵֽלֶּה׃", "pasuk_en": "The sun set and it became very dark; and behold, a smoking furnace and a flaming torch had passed between these pieces.", "rashi_he": "כְּמוֹ וַיְהִי הֵם מְרִיקִים שַׂקֵּיהֶם (בראשית מ\"ב), וַיְהִי הֵם קֹבְרִים אִישׁ (מלכים ב י\"ג), כְּלוֹמַר, וַיְהִי דָּבָר זֶה:", "rashi_en": "This is similar to וַיְהִי הֵם מְרִיקִים שַׂקֵּיהֶם. וַיְהִי הֵם קוֹבְרִים אִישׁ, meaning: and this thing happened.", "note": "", "points": [{"q": "'ויהי השמש באה' reads oddly. What does 'ויהי' mean here?", "options": ["'And this thing happened' — the sun set", "'And it will be' — a future sunset", "'And it was daytime' still"], "kasha": "The phrasing 'ויהי השמש באה' is awkward grammar.", "answer": "Like 'ויהי הם מריקים שקיהם' — it means 'and this thing happened': the sun set."}]}, {"id": "15:17.2", "ch": 15, "v": 17, "n": 2, "dh": "השמש באה", "pasuk_html": "וַיְהִ֤י <mark>הַשֶּׁ֙מֶשׁ֙ בָּ֔אָה</mark> וַעֲלָטָ֖ה הָיָ֑ה וְהִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְלַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַגְּזָרִ֥ים הָאֵֽלֶּה׃", "pasuk_en": "The sun set and it became very dark; and behold, a smoking furnace and a flaming torch had passed between these pieces.", "rashi_he": "שָׁקְעָה:", "rashi_en": "[Meaning:] it set.", "note": "", "points": [{"q": "'השמש באה' literally says the sun 'came.' What does it mean?", "options": ["It set", "It rose", "It came out from the clouds"], "kasha": "'באה' literally means 'came' — what does that mean for the sun?", "answer": "It set."}]}, {"id": "15:17.3", "ch": 15, "v": 17, "n": 3, "dh": "ועלטה היה", "pasuk_html": "וַיְהִ֤י הַשֶּׁ֙מֶשׁ֙ בָּ֔אָה <mark>וַעֲלָטָ֖ה הָיָ֑ה</mark> וְהִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְלַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַגְּזָרִ֥ים הָאֵֽלֶּה׃", "pasuk_en": "The sun set and it became very dark; and behold, a smoking furnace and a flaming torch had passed between these pieces.", "rashi_he": "חָשַׁךְ הַיּוֹם:", "rashi_en": "[Meaning:] darkness during the day.", "note": "", "points": [{"q": "What is 'עלטה' in 'ועלטה היה'?", "options": ["Darkness", "A heavy fog", "A strong wind"], "kasha": "'עלטה' is an unusual word — what does it mean?", "answer": "The day became dark."}]}, {"id": "15:17.4", "ch": 15, "v": 17, "n": 4, "dh": "והנה תנור עשן וגו'", "pasuk_html": "וַיְהִ֤י הַשֶּׁ֙מֶשׁ֙ בָּ֔אָה וַעֲלָטָ֖ה הָיָ֑ה וְהִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְלַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַגְּזָרִ֥ים הָאֵֽלֶּה׃", "pasuk_en": "The sun set and it became very dark; and behold, a smoking furnace and a flaming torch had passed between these pieces.", "rashi_he": "רָמַז לוֹ שֶׁיִּפְּלוּ הַמַּלְכֻיּוֹת בַּגֵּיהִנֹּם:", "rashi_en": "He foretold to him symbolically that the [Four] Kingdoms will fall into hell.", "note": "", "points": [{"q": "What did the 'תנור עשן,' the smoking furnace, hint to Avram?", "options": ["The kingdoms will fall into Gehinnom", "Yisroel will be slaves baking bricks", "Sodom will be burned with fire"], "kasha": "Why a smoking furnace — what does it symbolize?", "answer": "It hinted that the kingdoms will fall into Gehinnom."}]}, {"id": "15:17.5", "ch": 15, "v": 17, "n": 5, "dh": "באה", "pasuk_html": "וַיְהִ֤י הַשֶּׁ֙מֶשׁ֙ <mark>בָּ֔אָה</mark> וַעֲלָטָ֖ה הָיָ֑ה וְהִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְלַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַגְּזָרִ֥ים הָאֵֽלֶּה׃", "pasuk_en": "The sun set and it became very dark; and behold, a smoking furnace and a flaming torch had passed between these pieces.", "rashi_he": "טַעֲמוֹ לְמַעְלָה, לְכָךְ הוּא מְבֹאָר שֶׁבָּא כְבָר. וְאִם הָיָה טַעֲמוֹ לְמַטָּה, בָּאָלֶ\"ף, הָיָה מְבֹאָר כְּשֶׁהִיא שׁוֹקַעַת; וְאִ\"אֶ לוֹמַר כֵּן, שֶׁהֲרֵי כְבָר כְּתִיב וַיְהִי הַשֶּׁמֶשׁ לָבוֹא, וְהַעֲבָרַת תַּנּוּר עָשָׁן לְאַחַר מִכָּאן הָיְתָה, נִמְצָא שֶׁכְּבָר שָׁקְעָה; וְזֶה חִלּוּק בְּכָל תֵּבָה לְשׁוֹן נְקֵבָה שֶׁיְּסוֹדָהּ שְׁתֵּי אוֹתִיּוֹת, כְּמוֹ בָּא, קָם, שָׁב: כְּשֶׁהַטַּעַם לְמַעְלָה, לְשׁוֹן עָבַר הוּא, כְּגוֹן זֶה, וּכְגוֹן וְרָחֵל בָּאָה, קָמָה אֲלֻמָּתִי, הִנֵּה שָׁבָה יְבִמְתֵּךְ, וּכְשֶׁהַטַּעַם לְמַטָּה הוּא לְשׁוֹן הוֹוֶה, דָּבָר שֶׁנַּעֲשֶׂה עַכְשָׁו וְהוֹלֵךְ, כְּמוֹ בָּאָה עִם הַצֹּאן, בָּעֶרֶב הִיא בָאָה וּבַבֹּקֶר הִיא שָׁבָה:", "rashi_en": "The accent is on the first syllable. It is thus made clear that it [the sun] had already set. If the accent were on the last syllable, [i.e.,] on the letter aleph, it would mean “as it was setting,” an explanation which is not possible, for it has already stated: “As the sun was setting,” and the passing מתוך the smoking furnace took place after this. Consequently [the sun] had already set. This difference [holds true] with every feminine word that has a two-letter root, such as, בָּא [come], קָם [rise], שָׁב [return]. When the accent is on the first syllable, it is past tense, such as in this case, and as in “Rachel came”; “My sheaf arose”; “Behold your sister-in-law has returned.” But, when the accent is on the last syllable, then it is in the present tense, denoting that which is now happening and is continuing to happen, as in “She is coming with the sheep” [or] “In the evening she comes and in the morning she returns.”", "note": "", "points": [{"q": "Posuk 12 said the sun was about to set. Does 'באה' here mean 'setting' or 'already set'?", "options": ["Already set — accent on the first syllable", "Still setting — accent on the last syllable", "Rising — it's the next morning"], "kasha": "Posuk 12 already said 'השמש לבוא' — what's new in 'השמש באה'?", "answer": "The accent is on the ב (מלעיל), meaning past tense: already set. Accent on the א (מלרע) would mean 'setting now' — impossible, since posuk 12 already said that, and the furnace passed afterward."}, {"q": "רש״י gives a rule for feminine two-letter-root words like באה, קמה, שבה. What decides their tense?", "options": ["Accent on first syllable is past; on last, present", "Accent on first syllable is present; on last, past", "A vav before the word decides the tense"], "kasha": "Is this accent rule only for this word, or general?", "answer": "Accent up front is past: 'ורחל באה,' 'קמה אלומתי,' 'שבה יבמתך.' Accent at the end is present, happening now: 'באה עם הצאן,' 'בערב היא באה.'"}]}, {"id": "15:18.1", "ch": 15, "v": 18, "n": 1, "dh": "לזרעך נתתי", "pasuk_html": "בַּיּ֣וֹם הַה֗וּא כָּרַ֧ת יְהֹוָ֛ה אֶת־אַבְרָ֖ם בְּרִ֣ית לֵאמֹ֑ר <mark>לְזַרְעֲךָ֗ נָתַ֙תִּי֙</mark> אֶת־הָאָ֣רֶץ הַזֹּ֔את מִנְּהַ֣ר מִצְרַ֔יִם עַד־הַנָּהָ֥ר הַגָּדֹ֖ל נְהַר־פְּרָֽת׃", "pasuk_en": "On that day Adonoy made a covenant with Avram, saying: To your descendants I have given this land, from the river מתוך Egypt as far as the great river, the Euphrates.", "rashi_he": "אֲמִירָתוֹ שֶׁל הַקָּבָּ\"ה כְּאִלוּ הִיא עֲשׂוּיָה:", "rashi_en": "A promise from God is considered as if it has already happened.", "note": "", "points": [{"q": "Hashem says 'לזרעך נתתי' — 'I have given' — though they haven't received it. Why past tense?", "options": ["Hashem's promise is as good as done", "Avram already owned the whole land", "His children were already living there"], "kasha": "Past tense 'נתתי' is used for something still in the future.", "answer": "Hashem's word is considered as if it were already done."}]}, {"id": "15:18.2", "ch": 15, "v": 18, "n": 2, "dh": "הנהר הגדול", "pasuk_html": "בַּיּ֣וֹם הַה֗וּא כָּרַ֧ת יְהֹוָ֛ה אֶת־אַבְרָ֖ם בְּרִ֣ית לֵאמֹ֑ר לְזַרְעֲךָ֗ נָתַ֙תִּי֙ אֶת־הָאָ֣רֶץ הַזֹּ֔את מִנְּהַ֣ר מִצְרַ֔יִם עַד־הַנָּהָ֥ר הַגָּדֹ֖ל נְהַר־פְּרָֽת׃", "pasuk_en": "On that day Adonoy made a covenant with Avram, saying: To your descendants I have given this land, from the river מתוך Egypt as far as the great river, the Euphrates.", "rashi_he": "לְפִי שֶׁהוּא דָבוּק לְאֶרֶץ יִשְׂרָאֵל קוֹרְאֵהוּ גָּדוֹל, אַעַ\"פִּ שֶׁהוּא מְאֻחָר בְּאַרְבָּעָה נְהָרוֹת הַיּוֹצְאִים מֵעֵדֶן, שֶׁנֶּאֱמַר וְהַנָּהָר הָרְבִיעִי הוּא פְרָת. מָשָׁל הֶדְיוֹט: עֶבֶד מֶלֶךְ מֶלֶךְ, הִדָּבֵק לַשַּׁחֲוָר וְיִשְׁתַּחֲווּ לְךָ (בראשית רבה):", "rashi_en": "Since it is associated with the Land מתוך Israel He refers to it as “great,” though it is the last one [mentioned] among the four rivers that flow from Eden, as it is said: “And the fourth river is P’ras [the Euphrates].” [This is analogous to] a common proverb: “A king’s servant is a king.” “Associate with the ruler and they will bow to you.”", "note": "", "points": [{"q": "Why is the Prat called 'הנהר הגדל,' the great river?", "options": ["Because it borders Eretz Yisroel", "It's the widest river in the world", "It's the first river from Eden"], "kasha": "Prat is listed last מתוך Eden's four rivers — why call it 'great'?", "answer": "Because it is attached to Eretz Yisroel it's called great, though it's listed last מתוך the four rivers from Eden: 'והנהר הרביעי הוא פרת.'"}, {"q": "What popular saying does רש״י bring to explain this?", "options": ["A king's servant is a king", "A small stream becomes a great sea", "Still waters run deep"], "kasha": "How can being near Eretz Yisroel make a river 'great'?", "answer": "'A king's servant is a king'; 'cling to the ruler and people will bow to you.'"}]}, {"id": "15:19.1", "ch": 15, "v": 19, "n": 1, "dh": "את הקני", "pasuk_html": "אֶת־הַקֵּינִי֙ וְאֶת־הַקְּנִזִּ֔י וְאֵ֖ת הַקַּדְמֹנִֽי׃", "pasuk_en": "[The lands מתוך] the Kenites [Shalmites], Kenizites, Kadmonites,", "rashi_he": "עֶשֶׂר אֻמּוֹת יֵשׁ כָּאן וְלֹא נָתַן לָהֶם אֶלָּא שִׁבְעָה גוֹיִם, וְהַשְּׁלשָׁה אֱדוֹם וּמוֹאָב וְעַמּוֹן, וְהֵם קֵינִי, קְנִזִּי, וְקַדְּמוֹנִי עֲתִידִים לִהְיוֹת יְרֻשָּׁה לֶעָתִיד (בראשית רבה), שֶׁנֶּאֱמַר: אֱדוֹם וּמוֹאָב מִשְׁלוֹחַ יָדָם וּבְנֵי עַמּוֹן מִשְׁמַעְתָּם (ישעיה י\"א):", "rashi_en": "Ten nations are listed here, [yet] He gave to them only [the land] מתוך Seven Nations. The three [whose lands were not given], Edom, Moav, and Ammon which are [referred to here as]: Keini, Knizi, and Kadmoni are destined to be possessed in the future, as it is said: “They will overpower Edom and Moav and the Ammonites will obey them.”", "note": "", "points": [{"q": "Ten nations are listed, starting with 'הקיני,' but Yisroel received only seven. What about the other three?", "options": ["Edom, Moav and Ammon — to be inherited in the future", "They were wiped out before Yisroel arrived", "They merged into the seven nations"], "kasha": "Ten nations are promised here, but only seven lands were given.", "answer": "The other three — Keini, Knizi, Kadmoni — are Edom, Moav and Ammon, which will be inherited in the future."}, {"q": "Where do we see Edom, Moav and Ammon will belong to Yisroel in the future?", "options": ["Yeshayahu: Edom and Moav will be in their hand", "Devarim: do not provoke Moav or Ammon", "Yehoshua: the land was divided by lottery"], "kasha": "These lands weren't given yet — what shows they will be?", "answer": "Yeshayahu: 'אדום ומואב משלוח ידם ובני עמון משמעתם' — Edom and Moav will be in their grasp, and Ammon will obey them."}]}, {"id": "15:20.1", "ch": 15, "v": 20, "n": 1, "dh": "ואת הרפאים", "pasuk_html": "וְאֶת־הַחִתִּ֥י וְאֶת־הַפְּרִזִּ֖י וְאֶת־הָרְפָאִֽים׃", "pasuk_en": "The Chittites, Perizites, the Refa’im [the mighty ones],", "rashi_he": "אֶרֶץ עוֹג, שֶׁנֶּאֱמַר בָּהּ: הַהוּא יִקָּרֵא אֶרֶץ רְפָאִים (דברים ג'):", "rashi_en": "[Refers to] the Land מתוך Og [King מתוך Bashan] about which it is said: “That [Bashan] is called the land מתוך the Repha’im.”", "note": "", "points": [{"q": "Which land is meant by 'הרפאים' in this list?", "options": ["The land מתוך Og, king מתוך Bashan", "The land מתוך Sichon, king מתוך Cheshbon", "The land מתוך the Pelishtim"], "kasha": "Who are the 'רפאים' — which land is that?", "answer": "The land מתוך Og, as it says מתוך it: 'ההוא יקרא ארץ רפאים' (Devarim)."}]}, {"id": "16:1.1", "ch": 16, "v": 1, "n": 1, "dh": "שׁפחה מצרית", "pasuk_html": "וְשָׂרַי֙ אֵ֣שֶׁת אַבְרָ֔ם לֹ֥א יָלְדָ֖ה ל֑וֹ וְלָ֛הּ <mark>שִׁפְחָ֥ה מִצְרִ֖ית</mark> וּשְׁמָ֥הּ הָגָֽר׃", "pasuk_en": "Avram’s wife Sarai had not borne him children. She had an Egyptian handmaid whose name was Hagar.", "rashi_he": "בַּת פַּרְעֹה הָיְתָה, כְּשֶׁרָאָה נִסִּים שֶׁנַּעֲשׂוּ לְשָׂרָה אָמַר: מוּטָב שֶׁתְּהֵא בִתִּי שִׁפְחָה בְּבַיִת זֶה וְלֹא גְבִירָה בְּבַיִת אַחֵר:", "rashi_en": "She was Pharaoh’s daughter. When he [Pharaoh] saw the miracles that were performed for Sarah, he said: “Better that my daughter be a servant-maid in this house rather than the mistress מתוך another house.”", "note": "", "points": [{"q": "Sarai had a 'שפחה מצרית' — an Egyptian maid. Who was she?", "options": ["Pharaoh's daughter", "A maid Avram bought in Canaan", "Lot's servant from Sedom"], "kasha": "Why does the posuk stress that she was Egyptian — who was she?", "answer": "She was Pharaoh's daughter."}, {"q": "Why would Pharaoh give his own daughter to be a maid in Avram's house?", "options": ["He saw the miracles done for Sarai", "Avram demanded her as payment", "She had angered her father"], "kasha": "A king's daughter becoming a maid needs explaining.", "answer": "When Pharaoh saw the miracles done for Sarai, he said: better my daughter be a maid in this house than a mistress in another house."}]}, {"id": "16:2.1", "ch": 16, "v": 2, "n": 1, "dh": "אולי אבנה ממנה", "pasuk_html": "וַתֹּ֨אמֶר שָׂרַ֜י אֶל־אַבְרָ֗ם הִנֵּה־נָ֞א עֲצָרַ֤נִי יְהֹוָה֙ מִלֶּ֔דֶת בֹּא־נָא֙ אֶל־שִׁפְחָתִ֔י <mark>אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑נָּה</mark> וַיִּשְׁמַ֥ע אַבְרָ֖ם לְק֥וֹל שָׂרָֽי׃", "pasuk_en": "Sarai said to Avram: See now, Adonoy has restrained me from having children; pray [now], come to my handmaid perhaps I will be built-up through her. Avram hearkened to the voice מתוך Sarai.", "rashi_he": "לִמֵּד עַל מִי שֶׁאֵין לוֹ בָּנִים שֶׁאֵינוֹ בָנוּי אֶלָּא הָרוּס:", "rashi_en": "This teaches that a person with no children is not considered “built-up” but, rather, “demolished” [i.e., not established].", "note": "", "points": [{"q": "Sarai says 'אולי אבנה ממנה' — 'perhaps I will be built up.' Why call having children being 'built'?", "options": ["Someone without children is 'torn down', not built", "She planned to build a new house", "Hagar would build things for her"], "kasha": "Why does Sarai describe having children with the word 'built'?", "answer": "This teaches that a person without children is not 'built' but 'torn down.'"}]}, {"id": "16:2.2", "ch": 16, "v": 2, "n": 2, "dh": "אבנה ממנה", "pasuk_html": "וַתֹּ֨אמֶר שָׂרַ֜י אֶל־אַבְרָ֗ם הִנֵּה־נָ֞א עֲצָרַ֤נִי יְהֹוָה֙ מִלֶּ֔דֶת בֹּא־נָא֙ אֶל־שִׁפְחָתִ֔י אוּלַ֥י <mark>אִבָּנֶ֖ה מִמֶּ֑נָּה</mark> וַיִּשְׁמַ֥ע אַבְרָ֖ם לְק֥וֹל שָׂרָֽי׃", "pasuk_en": "Sarai said to Avram: See now, Adonoy has restrained me from having children; pray [now], come to my handmaid perhaps I will be built-up through her. Avram hearkened to the voice מתוך Sarai.", "rashi_he": "בִּזְכוּת שֶׁאַכְנִיס צָרָתִי לְתוֹךְ בֵּיתִי:", "rashi_en": "Because מתוך the merit מתוך admitting my rival into my home.", "note": "", "points": [{"q": "'אבנה ממנה' — how would Hagar's child help Sarai herself have children?", "options": ["In the merit מתוך bringing her rival into her home", "Hagar would pray for Sarai", "Hagar would teach her how to conceive"], "kasha": "Hagar having a child doesn't seem to give Sarai a child מתוך her own.", "answer": "In the merit מתוך bringing her rival into her home, Sarai hoped to be built up."}]}, {"id": "16:2.3", "ch": 16, "v": 2, "n": 3, "dh": "לקול שרי", "pasuk_html": "וַתֹּ֨אמֶר שָׂרַ֜י אֶל־אַבְרָ֗ם הִנֵּה־נָ֞א עֲצָרַ֤נִי יְהֹוָה֙ מִלֶּ֔דֶת בֹּא־נָא֙ אֶל־שִׁפְחָתִ֔י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑נָּה וַיִּשְׁמַ֥ע אַבְרָ֖ם <mark>לְק֥וֹל שָׂרָֽי׃</mark>", "pasuk_en": "Sarai said to Avram: See now, Adonoy has restrained me from having children; pray [now], come to my handmaid perhaps I will be built-up through her. Avram hearkened to the voice מתוך Sarai.", "rashi_he": "לְרוּחַ הַקֹּדֶשׁ שֶׁבָּהּ (בראשית רבה):", "rashi_en": "[Meaning:] to the prophecy that was within her.", "note": "", "points": [{"q": "Avram listened 'לקול שרי' — 'to the voice מתוך Sarai.' Why say 'voice' rather than just 'to Sarai'?", "options": ["He listened to the prophecy within her", "She shouted loudly at him", "He heard her through a wall"], "kasha": "Why 'the voice מתוך Sarai' and not simply 'to Sarai'?", "answer": "He listened to the רוח הקודש, the prophecy, that was in her (בראשית Rabbah)."}]}, {"id": "16:3.1", "ch": 16, "v": 3, "n": 1, "dh": "ותקח שרי", "pasuk_html": "<mark>וַתִּקַּ֞ח שָׂרַ֣י</mark> אֵֽשֶׁת־אַבְרָ֗ם אֶת־הָגָ֤ר הַמִּצְרִית֙ שִׁפְחָתָ֔הּ מִקֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְשֶׁ֥בֶת אַבְרָ֖ם בְּאֶ֣רֶץ כְּנָ֑עַן וַתִּתֵּ֥ן אֹתָ֛הּ לְאַבְרָ֥ם אִישָׁ֖הּ ל֥וֹ לְאִשָּֽׁה׃", "pasuk_en": "Sarai, the wife מתוך Avram took Hagar the Egyptian, her handmaid, at the end מתוך ten years that Avram had lived in the Land מתוך Canaan and gave her to Avram her husband to be his wife.", "rashi_he": "לְקָחַתָּהּ בִּדְבָרִים, אַשְׁרַיִךְ שֶׁזָּכִית לִדָּבֵק בְּגוּף קָדוֹשׁ כָּזֶה (בראשית רבה):", "rashi_en": "[Meaning:] she took her with [kind] words: “How fortunate you are that you are privileged to cleave to as holy a body as this.”", "note": "", "points": [{"q": "'ותקח שרי' — Sarai 'took' Hagar. How do you 'take' a person?", "options": ["She persuaded her with kind words", "She dragged her by force", "She bought her from Pharaoh"], "kasha": "'Took' is strange for a person — how did Sarai take her?", "answer": "She took her with words: 'Fortunate are you to merit cleaving to such a holy body' (בראשית Rabbah)."}]}, {"id": "16:3.2", "ch": 16, "v": 3, "n": 2, "dh": "מקץ עשר שנים", "pasuk_html": "וַתִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת־אַבְרָ֗ם אֶת־הָגָ֤ר הַמִּצְרִית֙ שִׁפְחָתָ֔הּ <mark>מִקֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים</mark> לְשֶׁ֥בֶת אַבְרָ֖ם בְּאֶ֣רֶץ כְּנָ֑עַן וַתִּתֵּ֥ן אֹתָ֛הּ לְאַבְרָ֥ם אִישָׁ֖הּ ל֥וֹ לְאִשָּֽׁה׃", "pasuk_en": "Sarai, the wife מתוך Avram took Hagar the Egyptian, her handmaid, at the end מתוך ten years that Avram had lived in the Land מתוך Canaan and gave her to Avram her husband to be his wife.", "rashi_he": "מוֹעֵד הַקָּבוּעַ לְאִשָּׁה שֶׁשָּׁהֲתָה עֶשֶׂר שָׁנִים וְלֹא יָלְדָה לְבַעֲלָהּ, חַיָּב לִשָֹּא אַחֶרֶת:", "rashi_en": "The time allotted to a woman for whom ten years have passed without having borne children to her husband. He is then obligated to marry another.", "note": "", "points": [{"q": "Why does the posuk mention 'מקץ עשר שנים' — after ten years?", "options": ["After ten childless years, a man must marry another", "Hagar only became מתוך age then", "Ten years is how long Avram owned her"], "kasha": "Why does the posuk tell us it was after ten years?", "answer": "Ten years is the set time: if a wife has not had children with her husband in ten years, he is obligated to marry another."}]}, {"id": "16:3.3", "ch": 16, "v": 3, "n": 3, "dh": "לשבת אברם וגו'", "pasuk_html": "וַתִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת־אַבְרָ֗ם אֶת־הָגָ֤ר הַמִּצְרִית֙ שִׁפְחָתָ֔הּ מִקֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְשֶׁ֥בֶת אַבְרָ֖ם בְּאֶ֣רֶץ כְּנָ֑עַן וַתִּתֵּ֥ן אֹתָ֛הּ לְאַבְרָ֥ם אִישָׁ֖הּ ל֥וֹ לְאִשָּֽׁה׃", "pasuk_en": "Sarai, the wife מתוך Avram took Hagar the Egyptian, her handmaid, at the end מתוך ten years that Avram had lived in the Land מתוך Canaan and gave her to Avram her husband to be his wife.", "rashi_he": "מַגִּיד שֶׁאֵין יְשִׁיבַת חוּצָה לָאָרֶץ עוֹלָה לוֹ מִן הַמִּנְיָן (יב' ס\"ד), לְפִי שֶׁלֹּא נֶאֱמַר לוֹ וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל, עַד שֶׁיָּבֹא לְאֶרֶץ יִשְֹרָאֵל:", "rashi_en": "This tells us that the years מתוך residence outside מתוך Eretz Yisrael do not count in this number, because he was not told: “And I shall make you into a great nation,” until he would come into Eretz Yisrael.", "note": "", "points": [{"q": "The ten years are counted 'לשבת אברם בארץ כנען' — from living in Canaan. What about their earlier years together?", "options": ["Years outside Eretz Yisroel don't count toward the ten", "They count double", "They were already counted earlier"], "kasha": "Avram and Sarai were married long before — why count only the years in Canaan?", "answer": "The posuk tells us that years מתוך living outside Eretz Yisroel are not counted toward the ten."}, {"q": "Why shouldn't the childless years outside Eretz Yisroel count?", "options": ["'I will make you a great nation' applied only in Eretz Yisroel", "They weren't married yet then", "Avram was too busy traveling"], "kasha": "Childless years are childless years — why should place matter?", "answer": "Avram was not told 'ואעשך לגוי גדול' until he would come to Eretz Yisroel."}]}, {"id": "16:4.1", "ch": 16, "v": 4, "n": 1, "dh": "ויבא אל הגר ותהר", "pasuk_html": "וַיָּבֹ֥א אֶל־הָגָ֖ר וַתַּ֑הַר וַתֵּ֙רֶא֙ כִּ֣י הָרָ֔תָה וַתֵּקַ֥ל גְּבִרְתָּ֖הּ בְּעֵינֶֽיהָ׃", "pasuk_en": "He came to Hagar and she conceived. When she realized that she was pregnant, her mistress became slighted in her eyes.", "rashi_he": "מִבִּיאָה רִאשׁוֹנָה (בראשית רבה):", "rashi_en": "From the first marital union.", "note": "", "points": [{"q": "'ויבא אל הגר ותהר' — what does putting 'conceived' נכון after 'came to Hagar' tell us?", "options": ["She conceived from the very first time", "She conceived after many years", "She conceived before marrying Avram"], "kasha": "The posuk joins 'he came' and 'she conceived' immediately, with nothing between.", "answer": "She conceived from the very first union (בראשית Rabbah)."}]}, {"id": "16:4.2", "ch": 16, "v": 4, "n": 2, "dh": "ותקל גברתה בעיניה", "pasuk_html": "וַיָּבֹ֥א אֶל־הָגָ֖ר וַתַּ֑הַר וַתֵּ֙רֶא֙ כִּ֣י הָרָ֔תָה <mark>וַתֵּקַ֥ל גְּבִרְתָּ֖הּ בְּעֵינֶֽיהָ׃</mark>", "pasuk_en": "He came to Hagar and she conceived. When she realized that she was pregnant, her mistress became slighted in her eyes.", "rashi_he": "אָמְרָה שָׂרַי זוֹ אֵין סִתְרָהּ כִּגְלוּיָהּ מַרְאָה עַצְמָהּ כְּאִלּוּ הִיא צַדֶּקֶת וְאֵינָהּ צַדֶּקֶת, שֶׁלֹּא זָכְתָה לְהֵרָיוֹן כָּל הַשָּׁנִים הַלָּלוּ, וַאֲנִי נִתְעַבַּרְתִּי מִבִּיאָה רִאשׁוֹנָה (בראשית רבה):", "rashi_en": "She [Hagar] thought: This [woman] Sarai is not the same in private as she is in public. She pretends to be a נכוןeous woman, but, is not [really] נכוןeous, because she was not privileged to conceive, all these years, whereas, I have become pregnant from the first marital union.", "note": "", "points": [{"q": "'ותקל גברתה בעיניה' — why did Sarai become slighted in Hagar's eyes?", "options": ["Hagar thought Sarai wasn't truly נכוןeous", "Sarai was poorer than Hagar", "Sarai didn't speak Egyptian"], "kasha": "Why would Hagar's pregnancy make her look down on Sarai?", "answer": "Hagar said: Sarai isn't inside what she shows outside; she only pretends to be נכוןeous, since she didn't conceive all these years, while I conceived from the first union (בראשית Rabbah)."}]}, {"id": "16:5.1", "ch": 16, "v": 5, "n": 1, "dh": "חמסי עליך", "pasuk_html": "וַתֹּ֨אמֶר שָׂרַ֣י אֶל־אַבְרָם֮ <mark>חֲמָסִ֣י עָלֶ֒יךָ֒</mark> אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִי֙ בְּחֵיקֶ֔ךָ וַתֵּ֙רֶא֙ כִּ֣י הָרָ֔תָה וָאֵקַ֖ל בְּעֵינֶ֑יהָ יִשְׁפֹּ֥ט יְהֹוָ֖ה בֵּינִ֥י וּבֵינֶֽיׄךָ׃", "pasuk_en": "Sarai said to Avram: The insult against me is your fault [I have a judgment against you]. I gave my maid to you and when she saw that she had conceived, I became slighted in her eyes. Let Adonoy judge between me and you.", "rashi_he": "חָמָס הֶעָשׂוּי לִי, עָלֶיךָ אֲנִי מֵטִיל הָעֹנֶשׁ; כְּשֶׁהִתְפַּלַּלְתָּ לְהַקָּבָּ\"ה מַה תִּתֶּן לִי וְאָנֹכִי הוֹלֵךְ עֲרִירִי, לֹא הִתְפַּלַּלְתָּ אֶלָּא עָלֶיךָ, וְהָיָה לְךָ לְהִתְפַּלֵּל עַל שְׁנֵינוּ, וְהָיִיתִי אֲנִי נִפְקֶדֶת עִמְּךָ, וְעוֹד דְּבָרֶיךָ אַתָּה חוֹמֵס מִמֶּנִי, שֶׁאַתָּה שׁוֹמֵעַ בִּזְיוֹנִי וְשׁוֹתֵק (בראשית רבה):", "rashi_en": "[Meaning:] for the wrong that had been done to me I call for you to be punished. [For] when you prayed to God: “What will You give me since I continue to be childless?” you prayed only for yourself. You should have prayed for us both and I would have been remembered along with you. Furthermore: “You have unנכוןfully withheld your words from me for you have heard my shame and remained silent.”", "note": "", "points": [{"q": "Sarai tells Avram 'חמסי עליך' — 'my wrong is on you.' What did Avram do wrong in his tefillah?", "options": ["He prayed only for himself, not for both", "He never prayed for children at all", "He prayed for Hagar instead מתוך Sarai"], "kasha": "Hagar insulted Sarai — why is it Avram's fault?", "answer": "When Avram prayed 'what will You give me, since I am childless,' he prayed only for himself. Had he prayed for both, she would have been remembered with him (בראשית Rabbah)."}, {"q": "Besides the tefillah, what else does Sarai say Avram 'withheld' from her?", "options": ["His words: he heard her shamed and stayed silent", "His money: he gave Hagar gifts", "His time: he was always traveling"], "kasha": "'חמסי' also means something was wrongfully held back from her.", "answer": "'You withhold your words from me': he heard her being disgraced and kept silent."}]}, {"id": "16:5.2", "ch": 16, "v": 5, "n": 2, "dh": "אנכי נתתי שפחתי וגו' ביני וביניך", "pasuk_html": "וַתֹּ֨אמֶר שָׂרַ֣י אֶל־אַבְרָם֮ חֲמָסִ֣י עָלֶ֒יךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִי֙ בְּחֵיקֶ֔ךָ וַתֵּ֙רֶא֙ כִּ֣י הָרָ֔תָה וָאֵקַ֖ל בְּעֵינֶ֑יהָ יִשְׁפֹּ֥ט יְהֹוָ֖ה בֵּינִ֥י וּבֵינֶֽיׄךָ׃", "pasuk_en": "Sarai said to Avram: The insult against me is your fault [I have a judgment against you]. I gave my maid to you and when she saw that she had conceived, I became slighted in her eyes. Let Adonoy judge between me and you.", "rashi_he": "כָּל בֵּינֶיךָ שֶׁבַּמִּקְרָא חָסֵר, וְזֶה מָלֵא, קְרִי בֵיהּ וּבָנַיִךְ, שֶׁהִכְנִיסָה עַיִן הָרָע בְּעִבּוּרָהּ שֶׁל הָגָר וְהִפִּילָה עֻבָּרָהּ; הוּא שֶׁהַמַּלְאָךְ אוֹמֵר לְהָגָר הִנָּךְ הָרָה, וְהֲלֹא כְבָר הָרְתָה, וְהוּא מְבַשֵּׁר לָהּ שֶׁתַּהַר? אֶלָּא מְלַמֵּד שֶׁהִפִּילָה הֵרָיוֹן הָרִאשׁוֹן:", "rashi_en": "Every בֵּינֶךָ that appears in Scripture is lacking [a second יו\"ד (בֵּינֶיךָ)], but, here, it is “full” [with the יו\"ד]. This is so that it be read וּבֵינֵיךְ, for she [Sarai] cast an evil eye upon Hagar’s pregnancy and [this time] she miscarried. It is this that the angel tells Hagar “Behold! you will conceive.” But, had she not already conceived? And yet he [the angel] announces to her that she will conceive? Therefore, this teaches that she miscarried the first pregnancy.", "note": "", "points": [{"q": "In 'ביני וביניך' the word 'וביניך' has an extra 'י'. What does it hint at?", "options": ["Sarai's evil eye made Hagar miscarry", "Sarai and Avram had two disputes", "Hashem would judge them twice"], "kasha": "Everywhere else 'ביניך' is written without the second 'י' — why is it spelled full here?", "answer": "Read it as 'ובניך' — 'and your child': Sarai cast an evil eye on Hagar's pregnancy and she miscarried."}, {"q": "Where does the Torah show that Hagar lost that first pregnancy?", "options": ["The angel later tells her 'הנך הרה' — you will conceive", "Hagar's son is never mentioned again", "Avram later says she was barren"], "kasha": "The miscarriage is never stated outנכון — what proves it?", "answer": "The angel tells Hagar 'הנך הרה,' announcing she will conceive — but she already had! This teaches that she miscarried the first pregnancy."}]}, {"id": "16:6.1", "ch": 16, "v": 6, "n": 1, "dh": "ותענה שׁרי", "pasuk_html": "וַיֹּ֨אמֶר אַבְרָ֜ם אֶל־שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵךְ֙ בְּיָדֵ֔ךְ עֲשִׂי־לָ֖הּ הַטּ֣וֹב בְּעֵינָ֑יִךְ <mark>וַתְּעַנֶּ֣הָ שָׂרַ֔י</mark> וַתִּבְרַ֖ח מִפָּנֶֽיהָ׃", "pasuk_en": "Avram said to Sarai: [The fate מתוך] your maid is in your hands, do with her as you see fit. Sarai dealt harshly with her, and she [Hagar] ran away from her.", "rashi_he": "הָיְתָה מְשַׁעְבֶּדֶת בָּהּ בְּקֹשִׁי (בראשית רבה):", "rashi_en": "She made her work hard.", "note": "", "points": [{"q": "'ותענה שרי' — Sarai 'afflicted' Hagar. What did she actually do?", "options": ["Made her do hard work", "Sent her out מתוך the house", "Refused to speak with her"], "kasha": "What does 'afflicted' mean here — what did Sarai do to her?", "answer": "She made her work hard (בראשית Rabbah)."}]}, {"id": "16:8.1", "ch": 16, "v": 8, "n": 1, "dh": "מזה באת", "pasuk_html": "וַיֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי־<mark>מִזֶּ֥ה בָ֖את</mark> וְאָ֣נָה תֵלֵ֑כִי וַתֹּ֕אמֶר מִפְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔י אָנֹכִ֖י בֹּרַֽחַת׃", "pasuk_en": "And he said: Hagar, handmaid מתוך Sarai, from where have you come and where are you going? She said: I am running away from my mistress, Sarai.", "rashi_he": "מֵהֵיכָן בָּאת? יוֹדֵע הָיָה, אֶלָּא לִתֵּן לָהּ פֶּתַח לִכָּנֵס עִמָּהּ בִּדְבָרִים. וּלְשׁוֹן אֵי מִזֶּה: אַיֵּה הַמָּקוֹם שֶׁתֹּאמַר עָלָיו מִזֶּה אֲנִי בָאָה?", "rashi_en": "[Meaning:] “From where have you come?” [Actually] he [the angel] knew. It was only to give her an opening— to enter into conversation with her. The expression אֵי מִזֶּה [means:] Where is the place about which you can say, “From this [place] I have come.”", "note": "", "points": [{"q": "The angel asks Hagar 'מזה באת' — 'from where have you come?' Didn't the angel know?", "options": ["He knew; he wanted to open a conversation", "No, angels don't know such things", "He was testing whether she'd lie"], "kasha": "An angel surely knew where she came from — why ask?", "answer": "He knew; he asked only to give her an opening to enter into conversation with her."}, {"q": "What exactly does the phrase 'אי מזה' mean?", "options": ["Where is the place you can say 'from this I came'?", "Why did you come here?", "Who sent you here?"], "kasha": "'אי מזה' — literally 'where from this' — is an odd phrase.", "answer": "'Where is the place about which you can say: from this place I came?'"}]}, {"id": "16:9.1", "ch": 16, "v": 9, "n": 1, "dh": "ויאמר לה מלאך וגו'", "pasuk_html": "וַיֹּ֤אמֶר לָהּ֙ מַלְאַ֣ךְ יְהֹוָ֔ה שׁ֖וּבִי אֶל־גְּבִרְתֵּ֑ךְ וְהִתְעַנִּ֖י תַּ֥חַת יָדֶֽיהָ׃", "pasuk_en": "The angel מתוך Adonoy said to her: Return to your mistress and submit yourself to her.", "rashi_he": "עַל כָּל אֲמִירָה הָיָה שָׁלוּחַ לָהּ מַלְאָךְ אַחֵר, לְכָךְ נֶאֱמַר מַלְאָךְ בְּכָל אֲמִירָה וַאֲמִירָה:", "rashi_en": "For each statement [מתוך these three verses] a different angel was sent to her. Therefore, “angel” is used for each and every statement.", "note": "", "points": [{"q": "'ויאמר לה מלאך' repeats in three posukim in a row. Why not just say 'and he said'?", "options": ["A different angel came for each statement", "To show the angel was angry", "Because Hagar didn't hear the first time"], "kasha": "Why repeat 'the angel מתוך Hashem said' each time instead מתוך 'he said'?", "answer": "For each statement a different angel was sent to her, so 'angel' is written with each one."}]}, {"id": "16:11.1", "ch": 16, "v": 11, "n": 1, "dh": "הנך הרה", "pasuk_html": "וַיֹּ֤אמֶר לָהּ֙ מַלְאַ֣ךְ יְהֹוָ֔ה <mark>הִנָּ֥ךְ הָרָ֖ה</mark> וְיֹלַ֣דְתְּ בֵּ֑ן וְקָרָ֤את שְׁמוֹ֙ יִשְׁמָעֵ֔אל כִּֽי־שָׁמַ֥ע יְהֹוָ֖ה אֶל־עׇנְיֵֽךְ׃", "pasuk_en": "The angel מתוך Adonoy said to her: Behold you will conceive, and give birth to a son. You shall name him Yishmael, for Adonoy has heard [accepted] your prayer.", "rashi_he": "כְּשֶׁתָּשׁוּבִי תַּהֲרִי, כְּמוֹ הִנָּךְ הָרָה דְאֵשֶׁת מָנוֹחַ:", "rashi_en": "[Meaning: “When you return you will conceive,” as in: “Behold you will conceive,” referring to Monoach’s wife.", "note": "", "points": [{"q": "The angel says 'הנך הרה' — 'you will conceive.' But wasn't Hagar already pregnant?", "options": ["It means: when you return, you will conceive", "It means she is still pregnant", "It refers to a different woman"], "kasha": "Hagar was already pregnant — why tell her she will conceive?", "answer": "It means 'when you return you will conceive,' just like 'הנך הרה' said to Manoach's wife."}]}, {"id": "16:11.2", "ch": 16, "v": 11, "n": 2, "dh": "וילדת בן", "pasuk_html": "וַיֹּ֤אמֶר לָהּ֙ מַלְאַ֣ךְ יְהֹוָ֔ה הִנָּ֥ךְ הָרָ֖ה <mark>וְיֹלַ֣דְתְּ בֵּ֑ן</mark> וְקָרָ֤את שְׁמוֹ֙ יִשְׁמָעֵ֔אל כִּֽי־שָׁמַ֥ע יְהֹוָ֖ה אֶל־עׇנְיֵֽךְ׃", "pasuk_en": "The angel מתוך Adonoy said to her: Behold you will conceive, and give birth to a son. You shall name him Yishmael, for Adonoy has heard [accepted] your prayer.", "rashi_he": "כְּמוֹ וְיוֹלֶדֶת, וְדוֹמֶה לוֹ יֹשַׁבְתְּ בַּלְּבָנוֹן מְקֻנַּנְתְּי בָּאֲרָזִים (ירמיה כ\"ב):", "rashi_en": "As if it were written וְיוֹלֶדֶת, This is similar to, “You who dwell in Levanon and are nestled in the cedars.”", "note": "", "points": [{"q": "'וילדת בן' is an unusual form. What does it mean?", "options": ["'And you will give birth' — like 'ויולדת'", "'And you gave birth' in the past", "'And you will raise' a son"], "kasha": "'וילדת' is an unusual grammatical form — what does it mean?", "answer": "It is like 'ויולדת' — 'and you will give birth,' similar to the form 'ישבת בלבנון' in Yirmiyahu."}]}, {"id": "16:11.3", "ch": 16, "v": 11, "n": 3, "dh": "וקראת שמו", "pasuk_html": "וַיֹּ֤אמֶר לָהּ֙ מַלְאַ֣ךְ יְהֹוָ֔ה הִנָּ֥ךְ הָרָ֖ה וְיֹלַ֣דְתְּ בֵּ֑ן <mark>וְקָרָ֤את שְׁמוֹ֙</mark> יִשְׁמָעֵ֔אל כִּֽי־שָׁמַ֥ע יְהֹוָ֖ה אֶל־עׇנְיֵֽךְ׃", "pasuk_en": "The angel מתוך Adonoy said to her: Behold you will conceive, and give birth to a son. You shall name him Yishmael, for Adonoy has heard [accepted] your prayer.", "rashi_he": "צִוּוּי הוּא, כְּמוֹ שֶׁאוֹמֵר לְזָכָר וְקָרָאתָ אֶת שְׁמוֹ יִצְחָק (בר' י\"ז):", "rashi_en": "This is a command [to a female] just as one would say to a male [וְקָרָאתָ] “And you will name him Yitzchok.”", "note": "", "points": [{"q": "'וקראת שמו ישמעאל' — is this a prediction, or something Hagar is told to do?", "options": ["A command to her to name him", "A prediction מתוך what others will call him", "A description מתוך what Avram did"], "kasha": "'וקראת' could be read as just a prediction — is it?", "answer": "It is a command, just as one says to a man 'וקראת את שמו יצחק.'"}]}, {"id": "16:12.1", "ch": 16, "v": 12, "n": 1, "dh": "פרא אדם", "pasuk_html": "וְה֤וּא יִהְיֶה֙ <mark>פֶּ֣רֶא אָדָ֔ם</mark> יָד֣וֹ בַכֹּ֔ל וְיַ֥ד כֹּ֖ל בּ֑וֹ וְעַל־פְּנֵ֥י כׇל־אֶחָ֖יו יִשְׁכֹּֽן׃", "pasuk_en": "He will be a wild, uncivilized man [rebel against people]. His hand [will be] against everyone [He will need everyone] and everyone’s hand will be against him [and everyone’s hand will need him]; and in the presence מתוך all his brothers he will dwell.", "rashi_he": "אוֹהֵב מִדְבָּרוֹת לָצוּד חַיּוֹת, כְּמוֹ שֶׁכָּתוּב וַיֵּשֶׁב בַּמִּדְבָּר וַיְהִי רֹבֶה קַשָּׁת (בראשית כ\"א):", "rashi_en": "One who loves the wilderness to hunt wild animals, as is written [concerning Yishmael]: “He settled in the wilderness מתוך Paran [where] he became an expert archer.”", "note": "", "points": [{"q": "Yishmael will be a 'פרא אדם' — a wild man. What does that mean?", "options": ["He'll love the wilderness, to hunt animals", "He'll be a fierce king", "He'll live among wild donkeys"], "kasha": "'פרא אדם' is an unclear description — what kind מתוך person is meant?", "answer": "One who loves the wilderness, to hunt wild animals."}, {"q": "Which later posuk about Yishmael shows he became this kind מתוך wilderness hunter?", "options": ["'He dwelled in the wilderness and became an archer'", "'He went out to the field to pray'", "'He was a man who dwelled in tents'"], "kasha": "How do we know 'פרא אדם' means a hunter in the wilderness?", "answer": "As it says about him later: 'וישב במדבר ויהי רובה קשת' — he dwelled in the wilderness and became an archer."}]}, {"id": "16:12.2", "ch": 16, "v": 12, "n": 2, "dh": "ידו בכל", "pasuk_html": "וְה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם <mark>יָד֣וֹ בַכֹּ֔ל</mark> וְיַ֥ד כֹּ֖ל בּ֑וֹ וְעַל־פְּנֵ֥י כׇל־אֶחָ֖יו יִשְׁכֹּֽן׃", "pasuk_en": "He will be a wild, uncivilized man [rebel against people]. His hand [will be] against everyone [He will need everyone] and everyone’s hand will be against him [and everyone’s hand will need him]; and in the presence מתוך all his brothers he will dwell.", "rashi_he": "לִסְטִים:", "rashi_en": "[Meaning:] a robber.", "note": "", "points": [{"q": "'ידו בכל' — 'his hand against everyone.' What does that describe?", "options": ["A robber", "A generous giver", "A skilled craftsman"], "kasha": "'His hand in everything' is unclear — what does it mean?", "answer": "He will be a robber."}]}, {"id": "16:12.3", "ch": 16, "v": 12, "n": 3, "dh": "ויד כל בו", "pasuk_html": "וְה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣וֹ בַכֹּ֔ל <mark>וְיַ֥ד כֹּ֖ל בּ֑וֹ</mark> וְעַל־פְּנֵ֥י כׇל־אֶחָ֖יו יִשְׁכֹּֽן׃", "pasuk_en": "He will be a wild, uncivilized man [rebel against people]. His hand [will be] against everyone [He will need everyone] and everyone’s hand will be against him [and everyone’s hand will need him]; and in the presence מתוך all his brothers he will dwell.", "rashi_he": "הַכֹּל שׂוֹנְאִין אוֹתוֹ וּמִתְגָּרִין בּוֹ:", "rashi_en": "[Meaning:] everyone will hate him and will attack him.", "note": "", "points": [{"q": "'ויד כל בו' — 'everyone's hand against him.' What does that mean?", "options": ["Everyone will hate him and attack him", "Everyone will help support him", "Everyone will shake his hand"], "kasha": "What does 'everyone's hand in him' mean?", "answer": "Everyone will hate him and fight with him."}]}, {"id": "16:12.4", "ch": 16, "v": 12, "n": 4, "dh": "ועל פני כל אחיו ישכון", "pasuk_html": "וְה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣וֹ בַכֹּ֔ל וְיַ֥ד כֹּ֖ל בּ֑וֹ וְעַל־פְּנֵ֥י כׇל־אֶחָ֖יו יִשְׁכֹּֽן׃", "pasuk_en": "He will be a wild, uncivilized man [rebel against people]. His hand [will be] against everyone [He will need everyone] and everyone’s hand will be against him [and everyone’s hand will need him]; and in the presence מתוך all his brothers he will dwell.", "rashi_he": "שֶׁיִּהְיֶה זַרְעוֹ גָּדוֹל (בראשית רבה):", "rashi_en": "[Meaning:] his descendants will be many.", "note": "", "points": [{"q": "'ועל פני כל אחיו ישכן' — 'he will dwell before all his brothers.' What is this a promise מתוך?", "options": ["His descendants will be many", "He will live near his brothers", "He will rule over his brothers"], "kasha": "What does 'dwelling before all his brothers' mean?", "answer": "His מתוךfspring will be great in number (בראשית Rabbah)."}]}, {"id": "16:13.1", "ch": 16, "v": 13, "n": 1, "dh": "אתה אל ראי", "pasuk_html": "וַתִּקְרָ֤א שֵׁם־יְהֹוָה֙ הַדֹּבֵ֣ר אֵלֶ֔יהָ <mark>אַתָּ֖ה אֵ֣ל רֳאִ֑י</mark> כִּ֣י אָֽמְרָ֗ה הֲגַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽי׃", "pasuk_en": "She called [She prayed in] the Name Adonoy Who had spoken to her: [She said] You are Almighty Who sees [everything], for she said: Have I also seen here [a vestige] after my having seen? [Have I also began to see here [a vestige] after it was revealed to me?]", "rashi_he": "נָקוּד חֲטַף קָמָץ, מִפְּנֵי שֶׁהוּא שֵׁם דָּבָר, אֱלוֹהַּ הָרְאִיָּה, שֶׁרוֹאֶה בְעֶלְבּוֹן שֶׁל עֲלוּבִין:", "rashi_en": "[The word רֳאִי] is punctuated with a chataf kometz because it is a noun, [i.e.,] a God מתוך seeing, because He sees the humiliation מתוך the humiliated.", "note": "", "points": [{"q": "Hagar calls Hashem 'אל רֳאי.' Why is 'ראי' vowelized with a chataf kamatz?", "options": ["It's a noun: 'seeing'", "It's a verb: 'I saw'", "It means 'my mirror'"], "kasha": "'רֳאי' has an unusual vowel — what kind מתוך word is it?", "answer": "It has a chataf kamatz because it is a noun: 'a G-d מתוך seeing.'"}, {"q": "What is Hashem 'seeing' that makes Hagar call Him 'a G-d מתוך seeing'?", "options": ["The humiliation מתוך the humiliated", "The future מתוך her son", "Everything hidden in the desert"], "kasha": "Why would Hagar, מתוך all people, praise Hashem specifically as One Who sees?", "answer": "He sees the humiliation מתוך those who are humiliated."}]}, {"id": "16:13.2", "ch": 16, "v": 13, "n": 2, "dh": "הגם הלם", "pasuk_html": "וַתִּקְרָ֤א שֵׁם־יְהֹוָה֙ הַדֹּבֵ֣ר אֵלֶ֔יהָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה <mark>הֲגַ֥ם הֲלֹ֛ם</mark> רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽי׃", "pasuk_en": "She called [She prayed in] the Name Adonoy Who had spoken to her: [She said] You are Almighty Who sees [everything], for she said: Have I also seen here [a vestige] after my having seen? [Have I also began to see here [a vestige] after it was revealed to me?]", "rashi_he": "לְשׁוֹן תֵּמַהּ; וְכִי סְבוּרָה הָיִיתִי שֶׁאַף הֲלוֹם בַּמִּדְבָּרוֹת רָאִיתִי שְׁלוּחוֹ שֶׁל מָקוֹם אַחֲרֵי רֹאִי אוֹתָם בְּבֵיתוֹ שֶׁל אַבְרָהָם שֶׁשָּׁם הָיִיתִי רְגִילָה לִרְאוֹת מַלְאָכִים? וְתֵדַע שֶׁהָיְתָה רְגִילָה לִרְאוֹתָם, שֶׁהֲרֵי מָנוֹחַ רָאָה אֶת הַמַּלְאָךְ פַּעַם אַחַת וְאָמַר מוֹת נָמוּת (שופ' י\"ג), וְזוֹ רָאֲתָה ד' זֶה אַחַר זֶה וְלֹא חָרְדָה:", "rashi_en": "It is an expression מתוך wonder: “Would I ever have thought that even here in the wilderness I would see messengers מתוך God after my having see them in the house מתוך Avraham where it was usual for me to see angels? You may know that she was used to seeing them, for Monoach saw an angel [only] once and he said, “We shall certainly die!,” whereas this [woman] saw [angels] four times one after another, and did not become fנכוןened.", "note": "", "points": [{"q": "Hagar says 'הגם הלם ראיתי אחרי ראי' — 'have I also seen here?' What is she expressing?", "options": ["Surprise at seeing angels even in the wilderness", "Fear that she would die", "Doubt whether it was really an angel"], "kasha": "What does 'have I also seen here after seeing' mean?", "answer": "It's wonder: would I have thought I'd see Hashem's messengers even here in the desert, after seeing them in Avraham's house, where I was used to seeing angels?"}, {"q": "How do we know Hagar was used to seeing angels?", "options": ["She saw four calmly; Manoach feared after one", "She told Sarai about them מתוךten", "Angels visited her in Mitzrayim"], "kasha": "The claim that she was accustomed to angels needs a proמתוך.", "answer": "Manoach saw an angel once and said 'we will surely die,' while Hagar saw four, one after another, and wasn't fנכוןened."}]}, {"id": "16:14.1", "ch": 16, "v": 14, "n": 1, "dh": "באר לחי", "pasuk_html": "עַל־כֵּן֙ קָרָ֣א לַבְּאֵ֔ר <mark>בְּאֵ֥ר לַחַ֖י</mark> רֹאִ֑י הִנֵּ֥ה בֵין־קָדֵ֖שׁ וּבֵ֥ין בָּֽרֶד׃", "pasuk_en": "Therefore the well was called: Be’er Lachai Ro’i [the well at which a living angel appeared]; it is between Kadeish [Rekem] and Bared [Chagar].", "rashi_he": "כְּתַרְגּוּמוֹ:", "rashi_en": "As he [Onkelos] translates: “A well that a living angel appeared upon it.”", "note": "", "points": [{"q": "What does the name 'באר לחי ראי' mean?", "options": ["A well where a living angel appeared", "A well that gives life to those who see", "A well named after Avram"], "kasha": "'באר לחי ראי' is an obscure name — what does it mean?", "answer": "As Onkelos translates it: a well upon which a living angel appeared."}]}, {"id": "16:15.1", "ch": 16, "v": 15, "n": 1, "dh": "ויקרא אברם שם וגו'", "pasuk_html": "וַתֵּ֧לֶד הָגָ֛ר לְאַבְרָ֖ם בֵּ֑ן וַיִּקְרָ֨א אַבְרָ֧ם שֶׁם־בְּנ֛וֹ אֲשֶׁר־יָלְדָ֥ה הָגָ֖ר יִשְׁמָעֵֽאל׃", "pasuk_en": "Hagar bore Avram a son and Avram named his son, that Hagar bore him, Yishmael.", "rashi_he": "אַעַ\"פִּ שֶׁלֹּא שָׁמַע אַבְרָם דִּבְרֵי הַמַּלְאָךְ שֶׁאָמַר וְקָרָאת שְׁמוֹ יִשְׁמָעֵאל, שָׁרְתָה רוּחַ הַקֹּדֶשׁ עָלָיו וּקְרָאוֹ יִשְׁמָעֵאל:", "rashi_en": "Though Avram did not hear the words מתוך the angel who said, “And call his name Yishmael,” yet, the spirit מתוך prophecy rested upon him and he called him Yishmael.", "note": "", "points": [{"q": "Avram names him 'ישמעאל.' How did Avram know that name — the angel told it to Hagar?", "options": ["Ruach hakodesh rested on him", "Hagar told him what the angel said", "It was a common family name"], "kasha": "The angel told the name to Hagar, not Avram — how did Avram know it?", "answer": "Though Avram didn't hear the angel, ruach hakodesh rested on him and he named him Yishmael."}]}, {"id": "16:16.1", "ch": 16, "v": 16, "n": 1, "dh": "ואברם בן שמונים וגו'", "pasuk_html": "וְאַבְרָ֕ם בֶּן־שְׁמֹנִ֥ים שָׁנָ֖ה וְשֵׁ֣שׁ שָׁנִ֑ים בְּלֶֽדֶת־הָגָ֥ר אֶת־יִשְׁמָעֵ֖אל לְאַבְרָֽם׃&nbsp;{ס}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "pasuk_en": "Avram was eighty-six years old when Hagar bore Yishmael to Avram.", "rashi_he": "לְשִׁבְחוֹ שֶׁל יִשְׁמָעֵאל נִכְתַּב, לְהוֹדִיעַ שֶׁהָיָה בֶּן י\"ג שָׁנָה כְּשֶׁנִּמּוֹל וְלֹא עִכֵּב:", "rashi_en": "This is written in praise מתוך Yishmael, to let us know that he was thirteen years old when he was circumcised and did not oppose it.", "note": "", "points": [{"q": "Why does the posuk tell us Avram was 'בן שמונים ושש' when Yishmael was born?", "options": ["To show Yishmael was thirteen at his bris", "To show Avram was very old", "To date the move to Canaan"], "kasha": "Why do we need Avram's age at Yishmael's birth?", "answer": "It's written in Yishmael's praise: it tells us he was thirteen when he had his bris and he didn't resist."}]}, {"id": "17:1.1", "ch": 17, "v": 1, "n": 1, "dh": "שׁדי", "pasuk_html": "וַיְהִ֣י אַבְרָ֔ם בֶּן־תִּשְׁעִ֥ים שָׁנָ֖ה וְתֵ֣שַׁע שָׁנִ֑ים וַיֵּרָ֨א יְהֹוָ֜ה אֶל־אַבְרָ֗ם וַיֹּ֤אמֶר אֵלָיו֙ אֲנִי־אֵ֣ל <mark>שַׁדַּ֔י</mark> הִתְהַלֵּ֥ךְ לְפָנַ֖י וֶהְיֵ֥ה תָמִֽים׃", "pasuk_en": "When Avram was ninety-nine years old, Adonoy appeared [became revealed] to Avram and said to him: I am Almighty Shaddai, walk [worship] before Me and be perfect.", "rashi_he": "אֲנִי הוּא שֶׁיֵּשׁ דַּי בֶּאֱלֹהוּתִי לְכָל בְּרִיָּה, לְפִיכָךְ הִתְהַלֵּךְ לְפָנַי וְאֶהְיֶה לְךָ לֶאֱלוֹהַּ ולְפַטְרוֹן; וְכֵן כָּל מָקוֹם שֶׁהוּא בַּמִּקְרָא פֵּרוּשׁוֹ כָּךְ: דַּי שֶׁלּוֹ, וְהַכֹּל לְפִי הָעִנְיָן:", "rashi_en": "[Meaning:] “I am the One Whose Godliness suffices for every creature. Therefore, walk before Me and I will be your God and Protector.” Similarly, wherever it appears in Scripture its explanation is thus: “He is sufficient.” However, it also depends on the context.", "note": "", "points": [{"q": "Hashem introduces Himself as 'אל שדי'. What does the name 'שדי' mean?", "options": ["His Godliness is enough for every creature", "He is the God מתוך the fields", "He destroys all His enemies"], "kasha": "'שדי' is an unusual name מתוך Hashem — what does it mean?", "answer": "'שדי' is from 'די' — enough: I am the One Whose Godliness suffices for every creature."}, {"q": "Why does Hashem mention 'שדי' נכון before saying 'התהלך לפני'?", "options": ["Since He suffices for all, Avram should serve Him", "To warn Avram He can punish him", "To announce a new place מתוך worship"], "kasha": "How does the name 'שדי' connect to the command that follows it?", "answer": "Since My Godliness suffices for all, therefore walk before Me, and I will be your God and Protector."}, {"q": "Does 'שדי' carry this meaning only here, or elsewhere in Tanach too?", "options": ["Everywhere — 'He is sufficient', fitted to the context", "Only here, in Hashem's words to Avram", "Elsewhere it means 'fields' instead"], "kasha": "The name appears in many places — is this explanation only for here?", "answer": "Wherever it appears in Tanach it means this — 'His is the sufficiency' — and everything is explained according to the context."}]}, {"id": "17:1.2", "ch": 17, "v": 1, "n": 2, "dh": "התהלך לפני", "pasuk_html": "וַיְהִ֣י אַבְרָ֔ם בֶּן־תִּשְׁעִ֥ים שָׁנָ֖ה וְתֵ֣שַׁע שָׁנִ֑ים וַיֵּרָ֨א יְהֹוָ֜ה אֶל־אַבְרָ֗ם וַיֹּ֤אמֶר אֵלָיו֙ אֲנִי־אֵ֣ל שַׁדַּ֔י <mark>הִתְהַלֵּ֥ךְ לְפָנַ֖י</mark> וֶהְיֵ֥ה תָמִֽים׃", "pasuk_en": "When Avram was ninety-nine years old, Adonoy appeared [became revealed] to Avram and said to him: I am Almighty Shaddai, walk [worship] before Me and be perfect.", "rashi_he": "כְּתַרְגּוּמוֹ פְּלַח קֳדָמַי, הִדַּבֵּק בַּעֲבוֹדָתִי:", "rashi_en": "As he [Onkelos] translates: “Worship Me.” Cling to My worship.", "note": "", "points": [{"q": "What does 'התהלך לפני' — 'walk before Me' — mean here?", "options": ["Serve Hashem and cling to His service", "Physically travel ahead מתוך Hashem", "Lead the people ahead מתוך everyone"], "kasha": "Walking 'before' Hashem can't be literal — what does it mean?", "answer": "As Onkelos translates, 'פלח קדמי' — serve Me; cling to My service."}]}, {"id": "17:1.3", "ch": 17, "v": 1, "n": 3, "dh": "והיה תמים", "pasuk_html": "וַיְהִ֣י אַבְרָ֔ם בֶּן־תִּשְׁעִ֥ים שָׁנָ֖ה וְתֵ֣שַׁע שָׁנִ֑ים וַיֵּרָ֨א יְהֹוָ֜ה אֶל־אַבְרָ֗ם וַיֹּ֤אמֶר אֵלָיו֙ אֲנִי־אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְפָנַ֖י <mark>וֶהְיֵ֥ה תָמִֽים׃</mark>", "pasuk_en": "When Avram was ninety-nine years old, Adonoy appeared [became revealed] to Avram and said to him: I am Almighty Shaddai, walk [worship] before Me and be perfect.", "rashi_he": "אַף זֶה צִוּוּי אַחַר צִוּוּי, הֱיֵה שָׁלֵם בְּכָל נִסְיוֹנוֹתַי; וּלְפִי מִדְרָשׁוֹ הִתְהַלֵּךְ לְפָנַי בְּמִצְוַת מִילָה, וּבַדָּבָר הַזֶּה תִהְיֶה תָּמִים, שֶׁכָּל זְמַן שֶׁהָעָרְלָה בְךָ אַתָּה בַּעַל מוּם לְפָנַי. דָּבָר אַחֵר וֶהְיֵה תָמִים, (עַכְשָׁו אַתָּה חָסֵר ה' אֵבָרִים, ב' עֵינַיִם, ב' אָזְנַיִם, וְרֹאשׁ הַגְּוִיָּה) שֶׁאוֹסִיף לְךָ אוֹת עַל שִׁמְךָ, וְיִהְיוּ מִנְיַן אוֹתִיּוֹתֶיךָ רמ\"ח כְּמִנְיַן אֵבָרֶיךָ:", "rashi_en": "This, too, is an imperative following an imperative, [i.e.,] “Be perfect in all the tests.” According to its Midrash: “Walk before Me” refers to the precept מתוך circumcision and as a result מתוך this you will become perfect. For as long as you are uncircumcised, I consider you imperfect. Another explanation מתוך וֶהְיֵה תָמִים: Now you are lacking [control over] five organs; two eyes, two ears, and the membrum; by adding one letter to your name the numerical value מתוך the letters [מתוך your name] will be two hundred and forty-eight corresponding to the number מתוך your organs.", "note": "", "points": [{"q": "Hashem tells Avram 'והיה תמים' — 'be perfect.' Simply, what is this?", "options": ["Another command: be whole in all My tests", "A promise that he'll become perfect", "A description מתוך how Avram already was"], "kasha": "'Be perfect' is vague — perfect in what?", "answer": "It's a second command after 'walk before Me': be whole and steadfast in all My tests."}, {"q": "According to the Midrash, how would Avram become 'תמים' — perfect?", "options": ["Through milah — uncircumcised he is blemished", "By passing the test מתוך the Akeida", "By teaching others about Hashem"], "kasha": "The posuk doesn't say what would make Avram perfect.", "answer": "Midrash: 'walk before Me' with the mitzvah מתוך milah, and through it you'll be perfect; as long as the orlah is on you, you are blemished before Me."}, {"q": "Another explanation מתוך 'והיה תמים' ties it to Avram's name. How?", "options": ["An added letter makes his name equal 248, his limbs", "His new name means 'perfect one'", "Removing a letter shows he is humble"], "kasha": "How could a name change make Avram 'complete'?", "answer": "Hashem will add a letter to his name, so its letters total 248 — the number מתוך his limbs."}]}, {"id": "17:2.1", "ch": 17, "v": 2, "n": 1, "dh": "ואתנה בריתי", "pasuk_html": "<mark>וְאֶתְּנָ֥ה בְרִיתִ֖י</mark> בֵּינִ֣י וּבֵינֶ֑ךָ וְאַרְבֶּ֥ה אוֹתְךָ֖ בִּמְאֹ֥ד מְאֹֽד׃", "pasuk_en": "I will give My covenant between Me [My Word] and you, and I will multiply you[r descendants] exceedingly.", "rashi_he": "בְּרִית שֶׁל אַהֲבָה וּבְרִית הָאָרֶץ לְהוֹרִישָׁהּ לְךָ עַל יְדֵי מִצְוָה זוֹ:", "rashi_en": "[This refers to] the covenant מתוך love and the covenant for you to possess the land by [your fulfilling] this precept.", "note": "", "points": [{"q": "'ואתנה בריתי' — which covenant is Hashem about to give Avram?", "options": ["A covenant מתוך love and מתוך inheriting the land", "The covenant מתוך the rainbow", "A covenant to defeat the four kings"], "kasha": "Which covenant is meant? Hashem already made a covenant with Avram earlier.", "answer": "A covenant מתוך love, and the covenant to inherit the land."}, {"q": "Through what would Avram be given the land under this covenant?", "options": ["Through the mitzvah מתוך milah", "Through conquering it in war", "Through buying it with money"], "kasha": "This covenant comes in the context מתוך milah — how are they linked?", "answer": "The land would be inherited through this mitzvah מתוך milah."}]}, {"id": "17:3.1", "ch": 17, "v": 3, "n": 1, "dh": "ויפל אברם על פניו", "pasuk_html": "וַיִּפֹּ֥ל אַבְרָ֖ם עַל־פָּנָ֑יו וַיְדַבֵּ֥ר אִתּ֛וֹ אֱלֹהִ֖ים לֵאמֹֽר׃", "pasuk_en": "Avram fell on his face. Elohim spoke with him, saying:", "rashi_he": "מִמּוֹרָא הַשְּׁכִינָה; שֶׁעַד שֶׁלֹּא מָל לֹא הָיָה בוֹ כֹחַ לַעֲמֹד וְרוּח הַקֹּדֶשׁ נִצֶּבֶת עָלָיו, וְזֶהוּ שֶׁנֶּאֱמַר בְּבִלְעָם נֹפֵל וּגְלוּי עֵינָיִם, בִּבְרַיְתָא דְרַבִּי אֱלִיעֶזֶר:", "rashi_en": "From fear מתוך the Divine Presence. Because prior to being circumcised he did not have the strength to stand while the Divine Presence stood over him. It is [to this reference] that it is stated concerning Bilam, “Fallen down and eyes open.” I found this in the Beraisa מתוך R. Eliezer.", "note": "", "points": [{"q": "Why did Avram fall 'על פניו' — on his face — when Hashem spoke?", "options": ["Uncircumcised, he couldn't stand before the Shechina", "He was bowing to thank Hashem", "He was weak from old age"], "kasha": "Why does the posuk tell us Avram fell down when Hashem appeared?", "answer": "From awe מתוך the Shechina: before his milah he lacked strength to stand while Ruach Hakodesh stood over him."}, {"q": "Which other uncircumcised prophet does רש״י show also fell when Hashem appeared?", "options": ["Bilam — 'נופל וגלוי עינים'", "Lavan — in his dream", "Avimelech — at night"], "kasha": "Is there a source that being uncircumcised causes falling before the Shechina?", "answer": "That's what is said about Bilam: 'נופל וגלוי עינים' — fallen, with eyes open (Beraisa מתוך R. Eliezer)."}]}, {"id": "17:5.1", "ch": 17, "v": 5, "n": 1, "dh": "כי אב המון גוים", "pasuk_html": "וְלֹא־יִקָּרֵ֥א ע֛וֹד אֶת־שִׁמְךָ֖ אַבְרָ֑ם וְהָיָ֤ה שִׁמְךָ֙ אַבְרָהָ֔ם כִּ֛י אַב־הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽיךָ׃", "pasuk_en": "No longer shall your name be called Avram, but your name shall be Avraham, for the father מתוך a multitude מתוך nations I have appointed you.", "rashi_he": "לְשׁוֹן נוֹטָרִיקוֹן שֶׁל שְׁמוֹ; וְרֵי\"ש שֶׁהָיְתָה בוֹ בַּתְּחִלָּה, שֶׁלֹּא הָיָה אָב אֶלָּא לַאֲרָם שֶׁהוּא מְקוֹמוֹ וְעַכְשָׁו אָב לְכָל הָעוֹלָם, לֹא זָזָה מִמְּקוֹמָהּ, שֶׁאַף יוֹ\"ד שֶׁל שָׂרַי נִתְרָעֲמָה עַל הַשְּׁכִינָה עַד שֶׁנִּתּוֹסְפָה לִיהוֹשֻׁעַ, שֶׁנֶּאֱמַר וַיִּקְרָא מֹשֶׁה לְהוֹשֵׁעַ בִּן נוּן יְהוֹשֻׁעַ (במדבר י\"ג):", "rashi_en": "This is an acrostic מתוך his name. The letter רי\"ש which was originally in [his name] signifying that he was a father only to Aram which was his [original] country, whereas, now he was a father to the entire world and even the letter רי\"ש, originally in his name, was, [nevertheless], not removed from its place. For even the letter יו\"ד מתוך Sarai’s name had complained to the Divine Presence until it was added to Yehoshua’s name as it is said: “Moshe called Hoshea bin Nun [by the name] Yehoshua.", "note": "", "points": [{"q": "Avram becomes 'אברהם' because he's 'אב המון גוים'. How does the name show this?", "options": ["The name abbreviates 'אב המון'", "It means 'exalted father' in Aramaic", "It was his grandfather's name"], "kasha": "'אברהם' doesn't spell out 'אב המון גוים' — how does it hint to it?", "answer": "The name is a נוטריקון — an abbreviation — מתוך 'אב המון'."}, {"q": "The old name 'אברם' meant father מתוך Aram. Why keep its ר in 'אברהם'?", "options": ["The ר was never removed from its place", "The ר stands for 'רב', great", "Without ר the name means nothing"], "kasha": "Now he's father מתוך the world, not just Aram — so why does the ר remain?", "answer": "The ר was there since he was father only to Aram, his place. Now he's father מתוך the whole world, yet the ר did not move from its place."}, {"q": "Why wasn't the ר simply dropped? Wha
