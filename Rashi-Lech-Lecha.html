, כי שרתה עליו רוח הקודש.", "note": "", "points": [{"q": "כֵּיצַד יָדַע אַבְרָם לִקְרֹוא לִבְנוֹ \"יִשְׁמָעֵאל\"?", "options": ["שָׁרְתָה עָלָיו רוּחַ הַקֹּודֶשׁ", "הָגָר סִיפְּרָה לוֹ אֶת דִּבְרֵי הַמַּלְאָךְ", "הַמַּלְאָךְ נִגְלָה גַּם אֵלָיו וְאָמַר לוֹ"], "kasha": "המלאך אמר להגר לקרוא לבן ישמעאל, ומדוע דווקא אברם הוא שקרא לו כך?", "answer": "אף על פי שאברם לא שמע את דברי המלאך, שרתה עליו רוח הקודש וקרא לו ישמעאל.", "kp": ["שלא שמע אברם דברי המלאך", "שרתה רוח הקדש עליו"]}]}, {"id": "16:16.1", "ch": 16, "v": 16, "n": 1, "dh": "ואברם בן שמונים וגו'", "pasuk_html": "<mark>וְאַבְרָ֕ם בֶּן־שְׁמֹנִ֥ים</mark> שָׁנָ֖ה וְשֵׁ֣שׁ שָׁנִ֑ים בְּלֶֽדֶת־הָגָ֥ר אֶת־יִשְׁמָעֵ֖אל לְאַבְרָֽם׃ (ס)", "pasuk_en": "וְאַבְרָם בֶּן־שְׁמֹנִים שָׁנָה וְשֵׁשׁ שָׁנִים בְּלֶדֶת־הָגָר אֶת־יִשְׁמָעֵאל לְאַבְרָם׃", "rashi_he": "ואברם בן שמונים וגו'. לְשִׁבְחוֹ שֶׁל יִשְׁמָעֵאל נִכְתַּב, לְהוֹדִיעַ שֶׁהָיָה בֶּן י\"ג שָׁנָה כְּשֶׁנִּמּוֹל וְלֹא עִכֵּב:", "rashi_en": "התורה מציינת את גיל אברם בלידת ישמעאל לשבחו של ישמעאל, כדי שנדע שהיה בן שלוש עשרה כשנימול ולא סירב.", "note": "", "points": [{"q": "מַדּוּעַ כּוֹתֶבֶת הַתּוֹרָה אֶת גִּיל אַבְרָם בְּלֵידַת יִשְׁמָעֵאל?", "options": ["לְשַׁבֵּחַ יִשְׁמָעֵאל, שֶׁנִּימּוֹל בֶּן שְׁלוֹשׁ עֶשְׂרֵה וְלֹא סֵירֵב", "לְלַמֵּד שֶׁאַבְרָם הָיָה זָקֵן מְאֹוד כְּשֶׁנּוֹלַד לוֹ בֵּן", "כְּדֵי לַחְשֹׁב כַּמָּה שָׁנִים עָבְרוּ עַד לֵידַת יִצְחָק"], "kasha": "מה הצורך לציין את גילו של אברם בלידת ישמעאל?", "answer": "זה נכתב לשבחו של ישמעאל, כדי להודיע שהיה בן שלוש עשרה כשנימול ולא עיכב.", "kp": ["לשבחו של ישמעאל נכתב", "ולא עכב"]}]}, {"id": "17:1.1", "ch": 17, "v": 1, "n": 1, "dh": "שׁדי", "pasuk_html": "וַיְהִ֣י אַבְרָ֔ם בֶּן־תִּשְׁעִ֥ים שָׁנָ֖ה וְתֵ֣שַׁע שָׁנִ֑ים וַיֵּרָ֨א יְהוָ֜ה אֶל־אַבְרָ֗ם וַיֹּ֤אמֶר אֵלָיו֙ אֲנִי־אֵ֣ל <mark>שַׁדַּ֔י</mark> הִתְהַלֵּ֥ךְ לְפָנַ֖י וֶהְיֵ֥ה תָמִֽים׃", "pasuk_en": "וַיְהִי אַבְרָם בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים וַיֵּרָא יְהוָה אֶל־אַבְרָם וַיֹּאמֶר אֵלָיו אֲנִי־אֵל שַׁדַּי הִתְהַלֵּךְ לְפָנַי וֶהְיֵה תָמִים׃", "rashi_he": "שׁדי. אֲנִי הוּא שֶׁיֵּשׁ דַּי בֶּאֱלֹהוּתִי לְכָל בְּרִיָּה, לְפִיכָךְ הִתְהַלֵּךְ לְפָנַי וְאֶהְיֶה לְךָ לֶאֱלוֹהַּ ולְפַטְרוֹן; וְכֵן כָּל מָקוֹם שֶׁהוּא בַּמִּקְרָא פֵּרוּשׁוֹ כָּךְ: דַּי שֶׁלּוֹ, וְהַכֹּל לְפִי הָעִנְיָן:", "rashi_en": "\"שדי\" פירושו: אני הוא שיש די באלוהותי לכל בריה, ולכן התהלך לפני ואהיה לך לאלוה ולמגן. כך מתפרש השם בכל מקום, לפי העניין.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַשֵּׁם \"שַׁדַּי\" לְפִי רַשִׁ\"י?", "options": ["שֶׁיֵּשׁ דֵּי בֶּאֱלוֹהוּתוֹ לְכָל בְּרִיָּה", "שֶׁהוּא שׁוֹלֵט עַל הַשָּׂדוֹת וְהָאֲרָצוֹת", "שֶׁהוּא מְשַׁדֵּד וּמַשְׁמִיד אֶת אוֹיְבָיו"], "kasha": "מה משמעות השם \"שדי\", ומדוע נאמר דווקא כאן לפני \"התהלך לפני\"?", "answer": "אני הוא שיש די באלוהותי לכל בריה, ולכן התהלך לפני ואהיה לך לאלוה ולפטרון.", "kp": ["שיש די באלהותי לכל בריה", "די שלו"]}]}, {"id": "17:1.2", "ch": 17, "v": 1, "n": 2, "dh": "התהלך לפני", "pasuk_html": "וַיְהִ֣י אַבְרָ֔ם בֶּן־תִּשְׁעִ֥ים שָׁנָ֖ה וְתֵ֣שַׁע שָׁנִ֑ים וַיֵּרָ֨א יְהוָ֜ה אֶל־אַבְרָ֗ם וַיֹּ֤אמֶר אֵלָיו֙ אֲנִי־אֵ֣ל שַׁדַּ֔י <mark>הִתְהַלֵּ֥ךְ לְפָנַ֖י</mark> וֶהְיֵ֥ה תָמִֽים׃", "pasuk_en": "וַיְהִי אַבְרָם בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים וַיֵּרָא יְהוָה אֶל־אַבְרָם וַיֹּאמֶר אֵלָיו אֲנִי־אֵל שַׁדַּי הִתְהַלֵּךְ לְפָנַי וֶהְיֵה תָמִים׃", "rashi_he": "התהלך לפני. כְּתַרְגּוּמוֹ פְּלַח קֳדָמַי, הִדַּבֵּק בַּעֲבוֹדָתִי:", "rashi_en": "\"התהלך לפני\" פירושו כתרגום אונקלוס \"פלח קדמי\": הידבק בעבודתי.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"הִתְהַלֵּךְ לְפָנַי\" לְפִי רַשִׁ\"י?", "options": ["הִידָּבֵק בַּעֲבוֹדָתִי", "לֵךְ לְפָנַי אֶל הַמָּקוֹם שֶׁאַרְאֶךָּ", "הִתְנַהֵג בְּעֲנָווָה וּבִצְנִיעוּת"], "kasha": "לא ברור מה פירוש ההליכה \"לפני\" ה'.", "answer": "כתרגומו \"פלח קדמי\", כלומר הידבק בעבודתי.", "kp": ["פלח קדמי", "הדבק בעבודתי"]}]}, {"id": "17:1.3", "ch": 17, "v": 1, "n": 3, "dh": "והיה תמים", "pasuk_html": "וַיְהִ֣י אַבְרָ֔ם בֶּן־תִּשְׁעִ֥ים שָׁנָ֖ה וְתֵ֣שַׁע שָׁנִ֑ים וַיֵּרָ֨א יְהוָ֜ה אֶל־אַבְרָ֗ם וַיֹּ֤אמֶר אֵלָיו֙ אֲנִי־אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְפָנַ֖י <mark>וֶהְיֵ֥ה תָמִֽים׃</mark>", "pasuk_en": "וַיְהִי אַבְרָם בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים וַיֵּרָא יְהוָה אֶל־אַבְרָם וַיֹּאמֶר אֵלָיו אֲנִי־אֵל שַׁדַּי הִתְהַלֵּךְ לְפָנַי וֶהְיֵה תָמִים׃", "rashi_he": "והיה תמים. אַף זֶה צִוּוּי אַחַר צִוּוּי, הֱיֵה שָׁלֵם בְּכָל נִסְיוֹנוֹתַי; וּלְפִי מִדְרָשׁוֹ הִתְהַלֵּךְ לְפָנַי בְּמִצְוַת מִילָה, וּבַדָּבָר הַזֶּה תִהְיֶה תָּמִים, שֶׁכָּל זְמַן שֶׁהָעָרְלָה בְךָ אַתָּה בַּעַל מוּם לְפָנַי. דָּבָר אַחֵר וֶהְיֵה תָמִים, (עַכְשָׁו אַתָּה חָסֵר ה' אֵבָרִים, ב' עֵינַיִם, ב' אָזְנַיִם, וְרֹאשׁ הַגְּוִיָּה) שֶׁאוֹסִיף לְךָ אוֹת עַל שִׁמְךָ, וְיִהְיוּ מִנְיַן אוֹתִיּוֹתֶיךָ רמ\"ח כְּמִנְיַן אֵבָרֶיךָ:", "rashi_en": "בפשט, \"והיה תמים\" הוא ציווי להיות שלם בכל הנסיונות. לפי המדרש, על ידי מצות מילה יהיה אברם תמים, כי הערלה היא מום. ועוד פירוש: ה' יוסיף אות לשמו, ומניין אותיותיו יהיה רמ\"ח כמניין איבריו.", "note": "", "points": [{"q": "לְפִי הַמִּדְרָשׁ, כֵּיצַד יִהְיֶה אַבְרָם \"תָמִים\"?", "options": ["עַל יְדֵי מִצְוַת מִילָה, כִּי הָעָרְלָה הִיא מוּם", "עַל יְדֵי שֶׁיַּקְרִיב קָרְבָּנוֹת לַה' בְּכָל יוֹם", "עַל יְדֵי שֶׁיִּתְרַחֵק מֵעוֹבְדֵי עֲבוֹדָה זָרָה"], "kasha": "מה פירוש הציווי \"והיה תמים\", ובמה חסר אברם כדי שיהיה שלם?", "answer": "\"התהלך לפני\" הוא מצות מילה, ובזה תהיה תמים, כי כל זמן שהערלה בך אתה בעל מום לפני.", "kp": ["שכל זמן שהערלה בך", "אתה בעל מום לפני"]}, {"q": "לְפִי הַפֵּירוּשׁ הָאַחֵר, כֵּיצַד קָשׁוּר \"וֶהְיֵה תָמִים\" לְשִׁינּוּי שְׁמוֹ שֶׁל אַבְרָם?", "options": ["אוֹת נוֹסֶפֶת תַּשְׁלִים אֶת מִנְיַין שְׁמוֹ לְרמ\"ח, כְּמִנְיַין אֵיבָרָיו", "הַשֵּׁם הֶחָדָשׁ יְלַמֵּד שֶׁהוּא אָב לְכָל הָעוֹלָם כֻּולּוֹ", "הָאוֹת הַנּוֹסֶפֶת תְּלַמֵּד שֶׁהוּא שָׁלֵם בְּמִידּוֹתָיו"], "kasha": "באיזה מובן נוסף יהיה אברם \"תמים\"?", "answer": "ה' יוסיף לו אות על שמו, ומניין אותיות שמו יהיה רמ\"ח כמניין איבריו.", "kp": ["שאוסיף לך אות על שמך", "רמ\"ח כמנין אבריך"]}]}, {"id": "17:2.1", "ch": 17, "v": 2, "n": 1, "dh": "ואתנה בריתי", "pasuk_html": "<mark>וְאֶתְּנָ֥ה בְרִיתִ֖י</mark> בֵּינִ֣י וּבֵינֶ֑ךָ וְאַרְבֶּ֥ה אוֹתְךָ֖ בִּמְאֹ֥ד מְאֹֽד׃", "pasuk_en": "וְאֶתְּנָה בְרִיתִי בֵּינִי וּבֵינֶךָ וְאַרְבֶּה אוֹתְךָ בִּמְאֹד מְאֹד׃", "rashi_he": "ואתנה בריתי. בְּרִית שֶׁל אַהֲבָה וּבְרִית הָאָרֶץ לְהוֹרִישָׁהּ לְךָ עַל יְדֵי מִצְוָה זוֹ:", "rashi_en": "הברית שה' נותן לאברם היא ברית של אהבה וברית של ירושת הארץ, שתבוא על ידי מצות המילה.", "note": "", "points": [{"q": "אֵיזוֹ בְּרִית נוֹתֵן ה' לְאַבְרָם כָּאן לְפִי רַשִׁ\"י?", "options": ["בְּרִית אַהֲבָה וּבְרִית יְרֻושַּׁת הָאָרֶץ עַל יְדֵי מִצְוַת הַמִּילָה", "בְּרִית שֶׁלֹּא יָבִיא עוֹד מַבּוּל עַל הָאָרֶץ", "בְּרִית עַל שִׁעְבּוּד זַרְעוֹ בְּמִצְרַיִם וִיצִיאָתָם מִשָּׁם"], "kasha": "לא מפורש בפסוק מהי הברית שה' נותן לאברם.", "answer": "ברית של אהבה וברית הארץ להורישה לו, על ידי מצוה זו.", "kp": ["ברית של אהבה", "וברית הארץ להורישה לך"]}]}, {"id": "17:3.1", "ch": 17, "v": 3, "n": 1, "dh": "ויפל אברם על פניו", "pasuk_html": "<mark>וַיִּפֹּ֥ל אַבְרָ֖ם עַל־פָּנָ֑יו</mark> וַיְדַבֵּ֥ר אִתּ֛וֹ אֱלֹהִ֖ים לֵאמֹֽר׃", "pasuk_en": "וַיִּפֹּל אַבְרָם עַל־פָּנָיו וַיְדַבֵּר אִתּוֹ אֱלֹהִים לֵאמֹר׃", "rashi_he": "ויפל אברם על פניו. מִמּוֹרָא הַשְּׁכִינָה; שֶׁעַד שֶׁלֹּא מָל לֹא הָיָה בוֹ כֹחַ לַעֲמֹד וְרוּח הַקֹּדֶשׁ נִצֶּבֶת עָלָיו, וְזֶהוּ שֶׁנֶּאֱמַר בְּבִלְעָם נֹפֵל וּגְלוּי עֵינָיִם, בִּבְרַיְתָא דְרַבִּי אֱלִיעֶזֶר:", "rashi_en": "אברם נפל על פניו מפחד השכינה, כי לפני שנימול לא היה בו כוח לעמוד כשהשכינה עליו, וכך נאמר גם על בלעם \"נופל וגלוי עינים\".", "note": "", "points": [{"q": "מַדּוּעַ נָפַל אַבְרָם עַל פָּנָיו לְפִי רַשִׁ\"י?", "options": ["מִפַּחַד הַשְּׁכִינָה, כִּי לִפְנֵי שֶׁנִּימּוֹל לֹא הָיָה בּוֹ כֹּוחַ לַעֲמֹוד", "כְּדֵי לְהִשְׁתַּחֲווֹת וּלְהוֹדוֹת לַה' עַל הַבְּרָכָה", "כִּי הָיָה זָקֵן וְחַלָּשׁ וְלֹא יָכוֹל לַעֲמוֹד"], "kasha": "מדוע נפל אברם על פניו בשעת הדיבור?", "answer": "ממורא השכינה, כי עד שלא מל לא היה בו כוח לעמוד כשרוח הקודש נצבת עליו.", "kp": ["ממורא השכינה", "שעד שלא מל לא היה בו כח לעמד"]}]}, {"id": "17:5.1", "ch": 17, "v": 5, "n": 1, "dh": "כי אב המון גוים", "pasuk_html": "וְלֹא־יִקָּרֵ֥א ע֛וֹד אֶת־שִׁמְךָ֖ אַבְרָ֑ם וְהָיָ֤ה שִׁמְךָ֙ אַבְרָהָ֔ם <mark>כִּ֛י אַב־הֲמ֥וֹן גּוֹיִ֖ם</mark> נְתַתִּֽיךָ׃", "pasuk_en": "וְלֹא־יִקָּרֵא עוֹד אֶת־שִׁמְךָ אַבְרָם וְהָיָה שִׁמְךָ אַבְרָהָם כִּי אַב־הֲמוֹן גּוֹיִם נְתַתִּיךָ׃", "rashi_he": "כי אב המון גוים. לְשׁוֹן נוֹטָרִיקוֹן שֶׁל שְׁמוֹ; וְרֵי\"ש שֶׁהָיְתָה בוֹ בַּתְּחִלָּה, שֶׁלֹּא הָיָה אָב אֶלָּא לַאֲרָם שֶׁהוּא מְקוֹמוֹ וְעַכְשָׁו אָב לְכָל הָעוֹלָם, לֹא זָזָה מִמְּקוֹמָהּ, שֶׁאַף יוֹ\"ד שֶׁל שָׂרַי נִתְרָעֲמָה עַל הַשְּׁכִינָה עַד שֶׁנִּתּוֹסְפָה לִיהוֹשֻׁעַ, שֶׁנֶּאֱמַר וַיִּקְרָא מֹשֶׁה לְהוֹשֵׁעַ בִּן נוּן יְהוֹשֻׁעַ (במדבר י\"ג):", "rashi_en": "השם \"אברהם\" הוא ראשי תיבות של \"אב המון\". הרי\"ש, שהייתה בשמו כשהיה אב לארם בלבד, לא הוסרה גם כשנעשה אב לכל העולם, כמו שהיו\"ד של שרי לא אבדה אלא נוספה לשמו של יהושע.", "note": "", "points": [{"q": "מַה הַקֶּשֶׁר בֵּין \"כִּי אַבְהֲמוֹן גּוֹיִם\" לְשֵׁם \"אַבְרָהָם\"?", "options": ["הַשֵּׁם \"אַבְרָהָם\" הוּא רָאשֵׁי תֵּיבוֹת שֶׁל \"אַב הֲמוֹן\"", "הַשֵּׁם \"אַבְרָהָם\" מְלַמֵּד שֶׁיִּמְלֹוךְ עַל הַגּוֹיִם", "הַשֵּׁם \"אַבְרָהָם\" נִיתַּן לוֹ עַל שֵׁם אֶרֶץ מוֹלַדְתּוֹ"], "kasha": "כיצד השם \"אברהם\" מבטא את היותו אב המון גוים?", "answer": "זו לשון נוטריקון של שמו: אב המון.", "kp": ["לשון נוטריקון של שמו"]}, {"q": "מַדּוּעַ נִשְׁאֲרָה הָרֵי\"שׁ בְּשֵׁם \"אַבְרָהָם\", אַף שֶׁאֵינוֹ עוֹד אָב לְאָרָם בִּלְבַד?", "options": ["כִּי אוֹת שֶׁהָייְתָה בַּשֵּׁם אֵינָהּ זָזָה מִמְּקוֹמָהּ, כְּמוֹ יוֹ\"ד שֶׁל שָׂרַי", "כִּי הָרֵי\"שׁ מְלַמֶּדֶת שֶׁהוּא נִשְׁאַר אָב לַאֲרָם בִּמְיֻוחָד", "כִּי בְּלִי הָרֵי\"שׁ לֹא הָיָה הַשֵּׁם נִשְׁמָע כָּרָאוּי"], "kasha": "הרי\"ש רמזה שהיה אב לארם בלבד, ומדוע לא הוסרה כשנעשה אב לכל העולם?", "answer": "הרי\"ש לא זזה ממקומה, שהרי אפילו היו\"ד של שרי התרעמה לפני השכינה עד שנוספה לשם יהושע.", "kp": ["לא זזה ממקומה", "יו\"ד של שרי נתרעמה על השכינה"]}]}, {"id": "17:6.1", "ch": 17, "v": 6, "n": 1, "dh": "ונתתיך לגוים", "pasuk_html": "וְהִפְרֵתִ֤י אֹֽתְךָ֙ בִּמְאֹ֣ד מְאֹ֔ד <mark>וּנְתַתִּ֖יךָ לְגוֹיִ֑ם</mark> וּמְלָכִ֖ים מִמְּךָ֥ יֵצֵֽאוּ׃", "pasuk_en": "וְהִפְרֵתִי אֹתְךָ בִּמְאֹד מְאֹד וּנְתַתִּיךָ לְגוֹיִם וּמְלָכִים מִמְּךָ יֵצֵאוּ׃", "rashi_he": "ונתתיך לגוים. יִשְׂרָאֵל וֶאֱדוֹם, שֶׁהֲרֵי יִשְׁמָעֵאל כְּבָר הָיָה לוֹ, וְלֹא הָיָה מְבַשְּׂרוֹ עָלָיו:", "rashi_en": "\"ונתתיך לגוים\" מכוון לישראל ולאדום, כי ישמעאל כבר נולד, וה' לא היה מבשר לאברהם על מה שכבר יש לו.", "note": "", "points": [{"q": "לְאֵילוּ גּוֹיִם מְכֻווָּן \"וּנְתַתִּיךָ לְגוֹיִם\" לְפִי רַשִׁ\"י?", "options": ["יִשְׂרָאֵל וֶאֱדוֹם", "יִשְׁמָעֵאל וֶאֱדוֹם", "יִשְׂרָאֵל וּבְנֵי קְטוּרָה"], "kasha": "מי הם הגוים שה' מבטיח לאברהם, והרי כבר יש לו את ישמעאל?", "answer": "ישראל ואדום, כי ישמעאל כבר היה לו, וה' לא היה מבשר לו עליו.", "kp": ["ישראל ואדום", "שהרי ישמעאל כבר היה לו"]}]}, {"id": "17:7.1", "ch": 17, "v": 7, "n": 1, "dh": "והקמתי את בריתי", "pasuk_html": "<mark>וַהֲקִמֹתִ֨י אֶת־בְּרִיתִ֜י</mark> בֵּינִ֣י וּבֵינֶ֗ךָ וּבֵ֨ין זַרְעֲךָ֧ אַחֲרֶ֛יךָ לְדֹרֹתָ֖ם לִבְרִ֣ית עוֹלָ֑ם לִהְי֤וֹת לְךָ֙ לֵֽאלֹהִ֔ים וּֽלְזַרְעֲךָ֖ אַחֲרֶֽיךָ׃", "pasuk_en": "וַהֲקִמֹתִי אֶת־בְּרִיתִי בֵּינִי וּבֵינֶךָ וּבֵין זַרְעֲךָ אַחֲרֶיךָ לְדֹרֹתָם לִבְרִית עוֹלָם לִהְיוֹת לְךָ לֵאלֹהִים וּלְזַרְעֲךָ אַחֲרֶיךָ׃", "rashi_he": "והקמתי את בריתי. וּמַה הִיא הַבְּרִית? לִהְיוֹת לְךָ לֵאלֹהִים:", "rashi_en": "הברית שה' מקים היא להיות לאלהים לאברהם ולזרעו.", "note": "", "points": [{"q": "מַהִי הַבְּרִית שֶׁה' מַבְטִיחַ לְהָקִים לְפִי רַשִׁ\"י?", "options": ["לִהְיוֹת לוֹ לֵאלֹהִים", "לָתֵת לוֹ מִיָּד אֶת אֶרֶץ כְּנָעַן", "לְהַרְבּוֹת אֶת זַרְעוֹ כְּחוֹל הַיָּם"], "kasha": "הפסוק אומר \"והקמתי את בריתי\" ולא מפרש מיד מה תוכנה של הברית.", "answer": "הברית היא להיות לו לאלהים.", "kp": ["ומה היא הברית", "להיות לך לאלהים"]}]}, {"id": "17:8.1", "ch": 17, "v": 8, "n": 1, "dh": "לאחזת עולם", "pasuk_html": "וְנָתַתִּ֣י לְ֠ךָ וּלְזַרְעֲךָ֨ אַחֲרֶ֜יךָ אֵ֣ת ׀ אֶ֣רֶץ מְגֻרֶ֗יךָ אֵ֚ת כָּל־אֶ֣רֶץ כְּנַ֔עַן <mark>לַאֲחֻזַּ֖ת עוֹלָ֑ם</mark> וְהָיִ֥יתִי לָהֶ֖ם לֵאלֹהִֽים׃", "pasuk_en": "וְנָתַתִּי לְךָ וּלְזַרְעֲךָ אַחֲרֶיךָ אֵת אֶרֶץ מְגֻרֶיךָ אֵת כָּל־אֶרֶץ כְּנַעַן לַאֲחֻזַּת עוֹלָם וְהָיִיתִי לָהֶם לֵאלֹהִים׃", "rashi_he": "לאחזת עולם. וְשָׁם אֶהְיֶה לָכֶם לֵאלֹהִים, אֲבָל הַדָּר בְּחוּצָה לָאָרֶץ דּוֹמֶה כְמִי שֶׁאֵין לוֹ אֱלוֹהַּ:", "rashi_en": "ה' יהיה לאלהים לישראל דווקא בארץ ישראל, ומי שגר בחוץ לארץ דומה כמי שאין לו אלוה.", "note": "", "points": [{"q": "מַה לוֹמֵד רַשִׁ\"י מִכָּךְ שֶׁ\"וְהָיִיתִי לָהֶם לֵאלֹהִים\" נֶאֱמַר אַחֲרֵי \"לַאֲחֻזַּת עוֹלָם\"?", "options": ["בְּאֶרֶץ יִשְׂרָאֵל דַּווְקָא יִהְיֶה לָהֶם לֵאלֹהִים", "ה' יִהְיֶה אֱלֹהֵיהֶם רַק אִם יִשְׁמְרוּ אֶת הַמִּצְווֹת", "הָאָרֶץ תִּהְיֶה שֶׁלָּהֶם גַּם בִּזְמַן שֶׁיִּגְלוּ מִמֶּנָּה"], "kasha": "מדוע נאמר \"והייתי להם לאלהים\" מיד אחרי הבטחת הארץ?", "answer": "שם בארץ אהיה לכם לאלהים, אבל הדר בחוץ לארץ דומה כמי שאין לו אלוה.", "kp": ["ושם אהיה לכם לאלהים", "כמי שאין לו אלוה"]}]}, {"id": "17:9.1", "ch": 17, "v": 9, "n": 1, "dh": "ואתה", "pasuk_html": "וַיֹּ֤אמֶר אֱלֹהִים֙ אֶל־אַבְרָהָ֔ם <mark>וְאַתָּ֖ה</mark> אֶת־בְּרִיתִ֣י תִשְׁמֹ֑ר אַתָּ֛ה וְזַרְעֲךָ֥ אַֽחֲרֶ֖יךָ לְדֹרֹתָֽם׃", "pasuk_en": "וַיֹּאמֶר אֱלֹהִים אֶל־אַבְרָהָם וְאַתָּה אֶת־בְּרִיתִי תִשְׁמֹר אַתָּה וְזַרְעֲךָ אַחֲרֶיךָ לְדֹרֹתָם׃", "rashi_he": "ואתה. וָי\"ו זוֹ מוֹסִיף עַל עִנְיָן רִאשׁוֹן, אֲנִי הִנֵּה בְרִיתִי אִתָּךְ, וְאַתָּה הֱוֵי זָהִיר לְשָׁמְרוֹ, וּמַה הִיא שְׁמִירָתוֹ? זֹאת בְּרִיתִי אֲשֶׁר תִּשְׁמְרוּ הִמּוֹל לָכֶם וְגוֹ':", "rashi_en": "הוי\"ו של \"ואתה\" מחברת לעניין הקודם: אני נתתי את בריתי איתך, ואתה היזהר לשמור אותה, והשמירה היא מצות המילה.", "note": "", "points": [{"q": "מַה מְלַמֶּדֶת הַוָּיְ\"ו שֶׁבַּמִּילָּה \"וְאַתָּה\" לְפִי רַשִׁ\"י?", "options": ["שֶׁהִיא מְחַבֶּרֶת לָעִנְייָן הַקּוֹדֵם: אֲנִי נוֹתֵן בְּרִית וְאַתָּה שְׁמוֹר אוֹתָהּ", "שֶׁהִיא פּוֹתַחַת עִנְייָן חָדָשׁ שֶׁאֵינוֹ קָשׁוּר לַקּוֹדֵם", "שֶׁהִיא מְצָרֶפֶת אֶת שָׂרָה לַבְּרִית יַחַד עִם אַבְרָהָם"], "kasha": "מדוע נאמר \"ואתה\" בוי\"ו החיבור, ועל מה הוא מוסיף?", "answer": "הוי\"ו מוסיפה על העניין הראשון: אני הנה בריתי אתך, ואתה היזהר לשמור אותה, והשמירה היא המילה.", "kp": ["מוסיף על ענין ראשון", "ואתה הוי זהיר לשמרו"]}]}, {"id": "17:10.1", "ch": 17, "v": 10, "n": 1, "dh": "ביני וביניכם וגו'", "pasuk_html": "זֹ֣את בְּרִיתִ֞י אֲשֶׁ֣ר תִּשְׁמְר֗וּ <mark>בֵּינִי֙ וּבֵ֣ינֵיכֶ֔ם</mark> וּבֵ֥ין זַרְעֲךָ֖ אַחֲרֶ֑יךָ הִמּ֥וֹל לָכֶ֖ם כָּל־זָכָֽר׃", "pasuk_en": "זֹאת בְּרִיתִי אֲשֶׁר תִּשְׁמְרוּ בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ הִמּוֹל לָכֶם כָּל־זָכָר׃", "rashi_he": "ביני וביניכם וגו'. אוֹתָם שֶׁל עַכְשָׁו:", "rashi_en": "\"ביני וביניכם\" מכוון לאלה שחיים עכשיו.", "note": "", "points": [{"q": "לְמִי מְכֻוָּונוֹת הַמִּילִּים \"בֵּינִי וּבֵינֵיכֶם\" לְפִי רַשִּׁ\"י?", "options": ["לְאֵלֶּה שֶׁחַיִּים עַכְשָׁיו", "לְאַבְרָהָם וְשָׂרָה בִּלְבַד", "לְכָל הַדּוֹרוֹת הָעֲתִידִים"], "kasha": "הפסוק מזכיר גם \"ביניכם\" וגם \"זרעך אחריך\", ויש להבחין ביניהם.", "answer": "\"ביני וביניכם\" הם אלה שחיים עכשיו.", "kp": ["אותם של עכשו"]}]}, {"id": "17:10.2", "ch": 17, "v": 10, "n": 2, "dh": "ובין זרעך אחריך", "pasuk_html": "זֹ֣את בְּרִיתִ֞י אֲשֶׁ֣ר תִּשְׁמְר֗וּ בֵּינִי֙ וּבֵ֣ינֵיכֶ֔ם <mark>וּבֵ֥ין זַרְעֲךָ֖ אַחֲרֶ֑יךָ</mark> הִמּ֥וֹל לָכֶ֖ם כָּל־זָכָֽר׃", "pasuk_en": "זֹאת בְּרִיתִי אֲשֶׁר תִּשְׁמְרוּ בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ הִמּוֹל לָכֶם כָּל־זָכָר׃", "rashi_he": "ובין זרעך אחריך. הָעֲתִידִין לְהִוָּלֵד:", "rashi_en": "\"ובין זרעך אחריך\" מכוון לאלה שעתידים להיוולד.", "note": "", "points": [{"q": "לְמִי מְכֻוָּונוֹת הַמִּילִּים \"וּבֵין זַרְעֲךָ אַחֲרֶיךָ\" לְפִי רַשִׁ\"י?", "options": ["לְאֵלֶּה שֶׁעֲתִידִים לְהִיוָּולֵד", "לִבְנֵי בֵיתוֹ שֶׁל אַבְרָהָם הַחַיִּים עַכְשָׁיו", "לַעֲבָדִים שֶׁנּוֹלְדוּ בְּבֵית אַבְרָהָם"], "kasha": "יש להבחין בין \"ביניכם\" לבין \"זרעך אחריך\" שבאותו פסוק.", "answer": "\"זרעך אחריך\" הם אלה שעתידים להיוולד.", "kp": ["העתידין להולד"]}]}, {"id": "17:10.3", "ch": 17, "v": 10, "n": 3, "dh": "המול", "pasuk_html": "זֹ֣את בְּרִיתִ֞י אֲשֶׁ֣ר תִּשְׁמְר֗וּ בֵּינִי֙ וּבֵ֣ינֵיכֶ֔ם וּבֵ֥ין זַרְעֲךָ֖ אַחֲרֶ֑יךָ <mark>הִמּ֥וֹל</mark> לָכֶ֖ם כָּל־זָכָֽר׃", "pasuk_en": "זֹאת בְּרִיתִי אֲשֶׁר תִּשְׁמְרוּ בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ הִמּוֹל לָכֶם כָּל־זָכָר׃", "rashi_he": "המול. כְּמוֹ לְהִמּוֹל, כְּמוֹ שֶׁאַתָּה אוֹמֵר עֲשׂוֹת, כְּמוֹ לַעֲשׂוֹת:", "rashi_en": "\"המול\" פירושו כמו \"להמול\", כמו ש\"עשות\" פירושו \"לעשות\".", "note": "", "points": [{"q": "מַה פֵּירוּשׁ הַמִּילָּה \"הִמּוֹל\" לְפִי רַשִׁ\"י?", "options": ["כְּמוֹ \"לְהִמּוֹל\", כְּמוֹ \"עֲשׂוֹת\" בִּמְקוֹם \"לַעֲשׂוֹת\"", "לְשׁוֹן עָבָר: כְּבָר נִימּוֹלוּ", "לְשׁוֹן עָתִיד: יִמּוֹלוּ בָּעָתִיד הָרָחוֹק"], "kasha": "צורת המילה \"המול\" אינה רגילה ולא ברור מה משמעותה.", "answer": "\"המול\" הוא כמו \"להמול\", כמו שאומרים \"עשות\" במקום \"לעשות\".", "kp": ["כמו להמול", "עשות, כמו לעשות"]}]}, {"id": "17:11.1", "ch": 17, "v": 11, "n": 1, "dh": "ונמלתם", "pasuk_html": "<mark>וּנְמַלְתֶּ֕ם</mark> אֵ֖ת בְּשַׂ֣ר עָרְלַתְכֶ֑ם וְהָיָה֙ לְא֣וֹת בְּרִ֔ית בֵּינִ֖י וּבֵינֵיכֶֽם׃", "pasuk_en": "וּנְמַלְתֶּם אֵת בְּשַׂר עָרְלַתְכֶם וְהָיָה לְאוֹת בְּרִית בֵּינִי וּבֵינֵיכֶם׃", "rashi_he": "ונמלתם. כְּמוֹ וּמַלְתֶּם, וְהַנּוּ\"ן בּוֹ יְתֵרָה לִיסוֹד הַנּוֹפֵל בּוֹ לִפְרָקִים, כְּגוֹן נ' שֶׁל נוֹשֵׁךְ ונ' שֶׁל נוֹשֵׂא, וּנְמַלְתֶּם, כְּמוֹ וּנְשָׂאתֶם; אֲבָל יִמּוֹל לְשׁוֹן יִפָּעֵל, כְּמוֹ יֵעָשֶׂה, יֵאָכֵל:", "rashi_en": "\"ונמלתם\" פירושו כמו \"ומלתם\", והנו\"ן נוספת, כמו הנו\"ן של \"נושך\" ו\"נושא\". אבל \"ימול\" הוא לשון סביל, כמו \"יעשה\" ו\"יאכל\".", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וּנְמַלְתֶּם\" וּמָה דִּין הַנּוּ\"ן שֶׁבּוֹ לְפִי רַשִׁ\"י?", "options": ["כְּמוֹ \"וּמַלְתֶּם\", וְהַנּוּ\"ן נוֹסֶפֶת כְּמוֹ בְּנוֹשֵׁךְ וְנוֹשֵׂא", "לְשׁוֹן סָבִיל: תִּהְיוּ נִימּוֹלִים בִּידֵי אֲחֵרִים", "הַנּוּ\"ן מְלַמֶּדֶת שֶׁהַמִּילָּה נַעֲשֵׂית בְּיוֹם הַשְּׁמִינִי"], "kasha": "המילה \"ונמלתם\" נראית כלשון סביל בגלל הנו\"ן, והרי זה ציווי למול.", "answer": "\"ונמלתם\" הוא כמו \"ומלתם\", והנו\"ן יתרה, כמו הנו\"ן של \"נושך\" ו\"נושא\"; כמו \"ונשאתם\".", "kp": ["כמו ומלתם", "והנו\"ן בו יתרה"]}]}, {"id": "17:12.1", "ch": 17, "v": 12, "n": 1, "dh": "יליד בית", "pasuk_html": "וּבֶן־שְׁמֹנַ֣ת יָמִ֗ים יִמּ֥וֹל לָכֶ֛ם כָּל־זָכָ֖ר לְדֹרֹתֵיכֶ֑ם <mark>יְלִ֣יד בָּ֔יִת</mark> וּמִקְנַת־כֶּ֙סֶף֙ מִכֹּ֣ל בֶּן־נֵכָ֔ר אֲשֶׁ֛ר לֹ֥א מִֽזַּרְעֲךָ֖ הֽוּא׃", "pasuk_en": "וּבֶן־שְׁמֹנַת יָמִים יִמּוֹל לָכֶם כָּל־זָכָר לְדֹרֹתֵיכֶם יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף מִכֹּל בֶּן־נֵכָר אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא׃", "rashi_he": "יליד בית. שֶׁיְּלָדַתּוּ הַשִּׁפְחָה בַּבַּיִת:", "rashi_en": "רש\"י מסביר ש\"יליד בית\" הוא עבד שנולד בבית האדון לשפחה שלו.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מִיהוּ \"יְלִיד בַּיִת\" שֶׁצָּרִיךְ לָמוּל אוֹתוֹ?", "options": ["עֶבֶד שֶׁנּוֹלַד לְשִׁפְחָה בְּתוֹךְ בֵּית הָאָדוֹן", "בֵּן שֶׁנּוֹלַד לַאדוֹן עַצְמוֹ מֵאִשְׁתּוֹ", "עֶבֶד שֶׁגָּדַל בַּבַּיִת אַחֲרֵי שֶׁנִּקְנָה בְּכֶסֶף"], "kasha": "לא ברור מה פירוש \"יליד בית\" ובמה הוא שונה ממקנת כסף.", "answer": "יליד בית הוא עבד שהשפחה ילדה אותו בבית האדון.", "kp": ["שילדתו השפחה בבית"]}]}, {"id": "17:12.2", "ch": 17, "v": 12, "n": 2, "dh": "מקנת כסף", "pasuk_html": "וּבֶן־שְׁמֹנַ֣ת יָמִ֗ים יִמּ֥וֹל לָכֶ֛ם כָּל־זָכָ֖ר לְדֹרֹתֵיכֶ֑ם יְלִ֣יד בָּ֔יִת <mark>וּמִקְנַת־כֶּ֙סֶף֙</mark> מִכֹּ֣ל בֶּן־נֵכָ֔ר אֲשֶׁ֛ר לֹ֥א מִֽזַּרְעֲךָ֖ הֽוּא׃", "pasuk_en": "וּבֶן־שְׁמֹנַת יָמִים יִמּוֹל לָכֶם כָּל־זָכָר לְדֹרֹתֵיכֶם יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף מִכֹּל בֶּן־נֵכָר אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא׃", "rashi_he": "מקנת כסף. שֶׁקְּנָאוֹ מִשֶּׁנּוֹלַד:", "rashi_en": "רש\"י מסביר שמקנת כסף הוא עבד שנקנה אחרי שנולד, ולא נולד בבית האדון.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מַהוּ עֶבֶד שֶׁנִּקְרָא מִקְנַת כֶּסֶף?", "options": ["עֶבֶד שֶׁנִּקְנָה בְּכֶסֶף אַחֲרֵי שֶׁכְּבָר נוֹלַד", "עֶבֶד שֶׁנּוֹלַד לְשִׁפְחָה שֶׁנִּקְנְתָה בְּכֶסֶף", "עֶבֶד שֶׁעוֹבֵד תְּמוּרַת שְׂכַר כֶּסֶף"], "kasha": "צריך להבין במה מקנת כסף שונה מיליד בית.", "answer": "מקנת כסף הוא עבד שהאדון קנה אותו משנולד, כלומר לא נולד ברשותו.", "kp": ["שקנאו משנולד"]}]}, {"id": "17:13.1", "ch": 17, "v": 13, "n": 1, "dh": "המול ימול יליד ביתך", "pasuk_html": "<mark>הִמּ֧וֹל ׀ יִמּ֛וֹל יְלִ֥יד בֵּֽיתְךָ֖</mark> וּמִקְנַ֣ת כַּסְפֶּ֑ךָ וְהָיְתָ֧ה בְרִיתִ֛י בִּבְשַׂרְכֶ֖ם לִבְרִ֥ית עוֹלָֽם׃", "pasuk_en": "הִמּוֹל יִמּוֹל יְלִיד בֵּיתְךָ וּמִקְנַת כַּסְפֶּךָ וְהָיְתָה בְרִיתִי בִּבְשַׂרְכֶם לִבְרִית עוֹלָם׃", "rashi_he": "המול ימול יליד ביתך. כָּאן כָּפַל עָלָיו וְלֹא אָמַר לִשְׁמוֹנָה יָמִים לְלַמֶּדְךָ שֶׁיֵּשׁ יְלִיד בַּיִת נִמּוֹל לְאַחַר שְׁמוֹנָה יָמִים (ס\"א לְאֶחָד) כְּמוֹ שֶׁמְּפֹרָשׁ בְּמַסֶּכֶת שַׁבָּת (דף קל\"ה ב'):", "rashi_en": "התורה חוזרת על מילת יליד בית ולא מזכירה כאן שמונה ימים, כדי ללמד שיש יליד בית שנימול אחרי שמונה ימים, כמבואר במסכת שבת.", "note": "", "points": [{"q": "לָמָּה חוֹזֶרֶת הַתּוֹרָה עַל מִילַת יְלִיד בַּיִת בְּלִי לְהַזְכִּיר שְׁמוֹנָה יָמִים?", "options": ["לְלַמֵּד שֶׁיֵּשׁ יְלִיד בַּיִת שֶׁנִּימּוֹל אַחֲרֵי שְׁמוֹנָה יָמִים", "לְלַמֵּד שֶׁיְּלִיד בַּיִת נִימּוֹל לִפְנֵי הַיּוֹם הַשְּׁמִינִי", "לְלַמֵּד שֶׁיְּלִיד בַּיִת פָּטוּר לְגַמְרֵי מִמִּילָה"], "kasha": "בפסוק הקודם כבר נאמר שיליד בית נימול לשמונה ימים, ולמה חוזר הכתוב על כך?", "answer": "הכפילות בלי הזכרת שמונה ימים מלמדת שיש מקרה של יליד בית שנימול אחרי שמונה ימים, כמו שמפורש במסכת שבת.", "kp": ["ולא אמר לשמונה ימים", "שיש יליד בית נמול לאחר שמונה ימים"]}]}, {"id": "17:14.1", "ch": 17, "v": 14, "n": 1, "dh": "וערל זכר", "pasuk_html": "<mark>וְעָרֵ֣ל ׀ זָכָ֗ר</mark> אֲשֶׁ֤ר לֹֽא־יִמּוֹל֙ אֶת־בְּשַׂ֣ר עָרְלָת֔וֹ וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מֵעַמֶּ֑יהָ אֶת־בְּרִיתִ֖י הֵפַֽר׃ (ס)", "pasuk_en": "וְעָרֵל זָכָר אֲשֶׁר לֹא־יִמּוֹל אֶת־בְּשַׂר עָרְלָתוֹ וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ אֶת־בְּרִיתִי הֵפַר׃", "rashi_he": "וערל זכר. כָּאן לִמֵּד שֶׁהַמִּילָה בְּאוֹתוֹ מָקוֹם שֶׁהוּא נִכָּר בֵּין זָכָר לִנְקֵבָה (בראשית רבה):", "rashi_en": "מהמילים \"וערל זכר\" לומדים שהמילה נעשית באותו מקום בגוף שבו ניכר ההבדל בין זכר לנקבה.", "note": "", "points": [{"q": "מַה לוֹמֵד רַשִׁ\"י מֵהַמִּילִּים \"וְעָרֵל זָכָר\"?", "options": ["שֶׁהַמִּילָה נַעֲשֵׂית בַּמָּקוֹם שֶׁנִּיכָּר בּוֹ הַהֶבְדֵּל בֵּין זָכָר לְנְקֵבָה", "שֶׁרַק זְכָרִים בּוֹגְרִים חַיָּיבִים בַּמִּילָה", "שֶׁנְּקֵבָה חַייֶּבֶת בְּסוּג אַחֵר שֶׁל בְּרִית"], "kasha": "התורה לא פירשה באיזה מקום בגוף עושים את המילה.", "answer": "המילה \"זכר\" מלמדת שהמילה היא באותו מקום שבו ניכר אם האדם זכר או נקבה.", "kp": ["שהמילה באותו מקום", "שהוא נכר בין זכר לנקבה"]}]}, {"id": "17:14.2", "ch": 17, "v": 14, "n": 2, "dh": "אשר לא ימול", "pasuk_html": "וְעָרֵ֣ל ׀ זָכָ֗ר <mark>אֲשֶׁ֤ר לֹֽא־יִמּוֹל֙</mark> אֶת־בְּשַׂ֣ר עָרְלָת֔וֹ וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מֵעַמֶּ֑יהָ אֶת־בְּרִיתִ֖י הֵפַֽר׃ (ס)", "pasuk_en": "וְעָרֵל זָכָר אֲשֶׁר לֹא־יִמּוֹל אֶת־בְּשַׂר עָרְלָתוֹ וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ אֶת־בְּרִיתִי הֵפַר׃", "rashi_he": "אשר לא ימול. מִשֶּׁיַּגִּיעַ לִכְלַל עֳנָשִׁין וְנִכְרְתָה; אֲבָל אָבִיו אֵין עָנוּשׁ עָלָיו כָּרֵת, אֲבָל עוֹבֵר בַּעֲשֵׂה:", "rashi_en": "עונש כרת חל על הערל עצמו רק משהגיע לגיל עונשין. אביו שלא מל אותו אינו נענש בכרת, אלא עובר על מצוות עשה.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, מֵמָּתַי נֶעֱנַשׁ הֶעָרֵל עַצְמוֹ בְּכָרֵת?", "options": ["מִשֶּׁהִגִּיעַ לְגִיל שֶׁבּוֹ הָאָדָם נֶעֱנַשׁ עַל מַעֲשָׂיו", "מֵהַיּוֹם הַשְּׁמִינִי לְלֵידָתוֹ", "מִיַּד כְּשֶׁאָבִיו נִמְנַע מִלָּמוּל אוֹתוֹ"], "kasha": "הפסוק מעניש בכרת את מי \"אשר לא ימול\", ולא ברור על מי ומאיזה גיל מדובר.", "answer": "הכרת חל על הערל משיגיע לכלל עונשין.", "kp": ["משיגיע לכלל ענשין"]}, {"q": "מַה דִּינוֹ שֶׁל אָב שֶׁלֹּא מָל אֶת בְּנוֹ, לְפִי רַשִׁ\"י?", "options": ["אֵינוֹ נֶעֱנַשׁ בְּכָרֵת, אֲבָל עוֹבֵר עַל מִצְוַות עֲשֵׂה", "נֶעֱנַשׁ בְּכָרֵת כְּמוֹ הַבֵּן עַצְמוֹ", "אֵינוֹ עוֹבֵר עַל שׁוּם אִיסּוּר כְּלָל"], "kasha": "צריך להבין אם גם האב שלא מל את בנו בכלל עונש הכרת.", "answer": "האב אינו ענוש כרת על כך, אבל הוא עובר על מצוות עשה.", "kp": ["אבל אביו אין ענוש עליו כרת", "אבל עובר בעשה"]}]}, {"id": "17:14.3", "ch": 17, "v": 14, "n": 3, "dh": "ונכרתה הנפש", "pasuk_html": "וְעָרֵ֣ל ׀ זָכָ֗ר אֲשֶׁ֤ר לֹֽא־יִמּוֹל֙ אֶת־בְּשַׂ֣ר עָרְלָת֔וֹ <mark>וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ</mark> הַהִ֖וא מֵעַמֶּ֑יהָ אֶת־בְּרִיתִ֖י הֵפַֽר׃ (ס)", "pasuk_en": "וְעָרֵל זָכָר אֲשֶׁר לֹא־יִמּוֹל אֶת־בְּשַׂר עָרְלָתוֹ וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ אֶת־בְּרִיתִי הֵפַר׃", "rashi_he": "ונכרתה הנפש. הוֹלֵךְ עֲרִירִי וּמֵת קֹדֶם זְמַנּוֹ (שבת כ\"ד):", "rashi_en": "רש\"י מסביר שעונש כרת פירושו שהאדם הולך בלי ילדים ומת לפני זמנו.", "note": "", "points": [{"q": "מַהוּ עֹונֶשׁ \"וְנִכְרְתָה הַנֶּפֶשׁ\" לְפִי רַשִׁ\"י?", "options": ["שֶׁהָאָדָם מֵת בְּלִי יְלָדִים וְלִפְנֵי זְמַנּוֹ", "שֶׁבֵּית הַדִּין מֵמִית אוֹתוֹ מִיָּד", "שֶׁהוּא מְגוּרָשׁ מֵאַרְצוֹ וּמֵעַמּוֹ לְעוֹלָם"], "kasha": "לא ברור מה פירוש המילים \"ונכרתה הנפש\" ומהו העונש בפועל.", "answer": "כרת הוא שהאדם הולך ערירי, בלי ילדים, ומת לפני זמנו.", "kp": ["הולך ערירי ומת קדם זמנו"]}]}, {"id": "17:15.1", "ch": 17, "v": 15, "n": 1, "dh": "לא תקרא את שמה שרי", "pasuk_html": "וַיֹּ֤אמֶר אֱלֹהִים֙ אֶל־אַבְרָהָ֔ם שָׂרַ֣י אִשְׁתְּךָ֔ <mark>לֹא־תִקְרָ֥א אֶת־שְׁמָ֖הּ שָׂרָ֑י</mark> כִּ֥י שָׂרָ֖ה שְׁמָֽהּ׃", "pasuk_en": "וַיֹּאמֶר אֱלֹהִים אֶל־אַבְרָהָם שָׂרַי אִשְׁתְּךָ לֹא־תִקְרָא אֶת־שְׁמָהּ שָׂרָי כִּי שָׂרָה שְׁמָהּ׃", "rashi_he": "לא תקרא את שמה שרי. דְּמַשְׁמַע שָׂרַי, לִי וְלֹא לְאַחֵרִים, כי שרה סְתָם שְׁמָהּ, שֶׁתְּהֵא שָׂרָה עַל כֹּל (ברכות י\"ג):", "rashi_en": "השם שרי משמעו \"השרה שלי\", כלומר שרה רק לאברהם. השם שרה הוא כללי, שתהיה שרה על כל העולם.", "note": "", "points": [{"q": "לָמָּה הוּחְלַף הַשֵּׁם שָׂרַי לְשָׂרָה, לְפִי רַשִׁ\"י?", "options": ["שָׂרַי הִיא שָׂרָה רַק לְאַבְרָהָם, וְשָׂרָה הִיא שָׂרָה לַכֻּולָּם", "שָׂרַי הוּא שֵׁם שֶׁל יַלְדָּה, וְשָׂרָה הוּא שֵׁם שֶׁל אִשָּׁה", "שָׂרַי הוּא שֵׁם מֵאֶרֶץ כְּנַעַן, וְשָׂרָה מֵאֶרֶץ חָרָן"], "kasha": "מה ההבדל בין השם שרי לשם שרה, ולמה היה צורך לשנות?", "answer": "שרי משמעו שרה לי ולא לאחרים, ואילו שרה סתם משמעו שתהיה שרה על הכל.", "kp": ["שרי, לי ולא לאחרים", "שתהא שרה על כל"]}]}, {"id": "17:16.1", "ch": 17, "v": 16, "n": 1, "dh": "וברכתי אותה", "pasuk_html": "<mark>וּבֵרַכְתִּ֣י אֹתָ֔הּ</mark> וְגַ֨ם נָתַ֧תִּי מִמֶּ֛נָּה לְךָ֖ בֵּ֑ן וּבֵֽרַכְתִּ֙יהָ֙ וְהָֽיְתָ֣ה לְגוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥נָּה יִהְיֽוּ׃", "pasuk_en": "וּבֵרַכְתִּי אֹתָהּ וְגַם נָתַתִּי מִמֶּנָּה לְךָ בֵּן וּבֵרַכְתִּיהָ וְהָיְתָה לְגוֹיִם מַלְכֵי עַמִּים מִמֶּנָּה יִהְיוּ׃", "rashi_he": "וברכתי אותה. וּמַה הִיא הַבְּרָכָה? שֶׁחָזְרָה לְנַעֲרוּתָהּ, שֶׁנֶּאֱמַר הָיְתָה לִּי עֶדְנָה (בר' י\"ח):", "rashi_en": "הברכה שבירך ה' את שרה היא שחזרה לימי נעוריה, כמו שאמרה \"היתה לי עדנה\".", "note": "", "points": [{"q": "מַהִי הַבְּרָכָה שֶׁבֵּירַךְ ה' אֶת שָׂרָה בַּמִּילִּים \"וּבֵרַכְתִּי אֹתָהּ\"?", "options": ["שֶׁחָזְרָה לִנְעוּרֶיהָ", "שֶׁזָּכְתָה לְעֹושֶׁר וְלְכָבוֹד רַב", "שֶׁזָּכְתָה לִחְיוֹת שָׁנִים רַבּוֹת"], "kasha": "הפסוק אומר שה' יברך את שרה, אבל לא מפרש מהי הברכה.", "answer": "הברכה היא ששרה חזרה לנעוריה, כמו שנאמר \"היתה לי עדנה\".", "kp": ["שחזרה לנערותה"]}]}, {"id": "17:16.2", "ch": 17, "v": 16, "n": 2, "dh": "וברכתיה", "pasuk_html": "וּבֵרַכְתִּ֣י אֹתָ֔הּ וְגַ֨ם נָתַ֧תִּי מִמֶּ֛נָּה לְךָ֖ בֵּ֑ן <mark>וּבֵֽרַכְתִּ֙יהָ֙</mark> וְהָֽיְתָ֣ה לְגוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥נָּה יִהְיֽוּ׃", "pasuk_en": "וּבֵרַכְתִּי אֹתָהּ וְגַם נָתַתִּי מִמֶּנָּה לְךָ בֵּן וּבֵרַכְתִּיהָ וְהָיְתָה לְגוֹיִם מַלְכֵי עַמִּים מִמֶּנָּה יִהְיוּ׃", "rashi_he": "וברכתיה. בַּהֲנָקַת שָׁדַיִם כְּשֶׁנִּצְרְכָה לְכָךְ בְּיוֹם מִשְׁתֶּה שֶׁל יִצְחָק, שֶׁהָיוּ מְרַנְּנִין עֲלֵיהֶם שֶׁהֵבִיאוּ אֲסוּפִי מִן הַשּׁוּק וְאוֹמְרִים בְּנֵנוּ הוּא, וְהֵבִיאָה כָל אַחַת בְּנָה עִמָּהּ וּמֵנִקְתָּהּ לֹא הֵבִיאָה, וְהִיא הֵנִיקָה אֶת כֻּלָּם; הוּא שֶׁנֶּאֱמַר הֵינִיקָה בָנִים שָׂרָה, בְּ\"ר רְמָזוֹ בְּמִקְצָת:", "rashi_en": "הברכה השנייה היא שהיה לשרה חלב להניק. ביום המשתה של יצחק טענו שהוא אסופי, וכל הנשים הביאו את תינוקותיהן בלי מינקת, ושרה הניקה את כולם.", "note": "", "points": [{"q": "מַהִי הַבְּרָכָה הַשְּׁנִייָּה, \"וּבֵרַכְתִּיהָ\", לְפִי רַשִׁ\"י?", "options": ["שֶׁהָיָה לָהּ חָלָב לְהֵנִיק בְּשָׁעָה שֶׁנִּצְרְכָה לְכָךְ", "שֶׁבְּנָהּ יִצְחָק יִהְיֶה צַדִּיק כְּמוֹ אָבִיו", "שֶׁתִּזְכֶּה לִרְאוֹת אֶת נְכָדֶיהָ וְנִכְדֵי נְכָדֶיהָ"], "kasha": "כבר נאמר \"וברכתי אתה\", ולמה חוזר הכתוב ואומר שוב \"וברכתיה\"?", "answer": "הברכה הנוספת היא בהנקת שדיים, כשהוצרכה לכך ביום המשתה של יצחק.", "kp": ["בהנקת שדים"]}, {"q": "לָמָּה הֻוצְרְכָה שָׂרָה לְהֵנִיק בְּיוֹם הַמִּשְׁתֶּה שֶׁל יִצְחָק?", "options": ["כְּדֵי לְהוֹכִיחַ שֶׁיִּצְחָק בְּנָהּ וְלֹא אָסוּפִי מִן הַשּׁוּק", "כִּי לֹא נִמְצְאָה מֵינֶקֶת שֶׁתַּסְכִּים לְהֵנִיק אֶת יִצְחָק", "כְּדֵי שֶׁיִּצְחָק יִגְדַּל רַק עַל חֲלֵב אִמּוֹ"], "kasha": "צריך להבין מה הייתה החשיבות של ההנקה דווקא ביום ההוא.", "answer": "היו שאמרו שהביאו אסופי מן השוק, ולכן הביאו הנשים את בניהן בלי מינקת, ושרה הניקה את כולם.", "kp": ["שהביאו אסופי מן השוק", "והיא הניקה את כלם"]}]}, {"id": "17:17.1", "ch": 17, "v": 17, "n": 1, "dh": "ויפל אברהם על פניו ויצחק", "pasuk_html": "<mark>וַיִּפֹּ֧ל אַבְרָהָ֛ם עַל־פָּנָ֖יו וַיִּצְחָ֑ק</mark> וַיֹּ֣אמֶר בְּלִבּ֗וֹ הַלְּבֶ֤ן מֵאָֽה־שָׁנָה֙ יִוָּלֵ֔ד וְאִ֨ם־שָׂרָ֔ה הֲבַת־תִּשְׁעִ֥ים שָׁנָ֖ה תֵּלֵֽד׃", "pasuk_en": "וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו וַיִּצְחָק וַיֹּאמֶר בְּלִבּוֹ הַלְּבֶן מֵאָה־שָׁנָה יִוָּלֵד וְאִם־שָׂרָה הֲבַת־תִּשְׁעִים שָׁנָה תֵּלֵד׃", "rashi_he": "ויפל אברהם על פניו ויצחק. זֶה תִּ\"אֻ, לְשׁוֹן שִׂמְחָה, וַחֲדִי, וְשֶׁל שָׂרָה לְשׁוֹן מָחוֹךְ; לָמַדְתָּ שֶׁאַבְרָהָם הֶאֱמִין וְשָׂמַח וְשָׂרָה לֹא הֶאֱמִינָה וְלִגְלְגָה, וְזֶהוּ שֶׁהִקְפִּיד הַקָּבָּ\"ה עַל שָׂרָה וְלֹא הִקְפִּיד עַל אַבְרָהָם:", "rashi_en": "הצחוק של אברהם הוא צחוק של שמחה, ואילו של שרה הוא צחוק של לעג. מכאן שאברהם האמין ושמח, ושרה לא האמינה, ולכן הקפיד ה' רק על שרה.", "note": "", "points": [{"q": "מָה פֵּירוּשׁ \"וַיִּצְחָק\" אֵצֶל אַבְרָהָם, לְפִי רַשִׁ\"י?", "options": ["צְחוֹק שֶׁל שִׂמְחָה", "צְחוֹק שֶׁל לַעַג וְזִלְזוּל", "צְחוֹק שֶׁל פַּחַד וּבֶהָלָה"], "kasha": "קשה לומר שאברהם צחק על דברי ה' בלעג.", "answer": "אונקלוס מתרגם \"וחדי\", לשון שמחה, ומכאן שאברהם האמין ושמח.", "kp": ["לשון שמחה", "שאברהם האמין ושמח"]}, {"q": "לָמָּה הִקְפִּיד ה' עַל צְחוֹקָהּ שֶׁל שָׂרָה וְלֹא עַל צְחוֹקוֹ שֶׁל אַבְרָהָם?", "options": ["כִּי שָׂרָה לֹא הֶאֱמִינָה וְלִגְלְגָה, וְאַבְרָהָם הֶאֱמִין וְשָׂמַח", "כִּי שָׂרָה צָחֲקָה בְּקוֹל, וְאַבְרָהָם צָחַק בְּלִבּוֹ", "כִּי אַבְרָהָם הָיָה נָבִיא, וְשָׂרָה לֹא הָיְיתָה נְבִיאָה"], "kasha": "שניהם צחקו כששמעו על הולדת הבן, ולמה רק על שרה הקפיד ה'?", "answer": "הצחוק של שרה היה לשון לעג, כי לא האמינה ולגלגה, ו ֶאוֹמֵר וַהֲקִמוֹתִי וְגוֹ', יָכוֹל בְּנֵי יִשְׁמָעֵאל וּבְנֵי קְטוּרָה בִּכְלַל הַקִּיּוּם, תַּ\"לֹ וַהֲקִמֹתִי אֶת בְּרִיתִי אִתּוֹ – וְלֹא עִם אֲחֵרִים: ואת בריתי אקים את יצחק. לָמָּה נֶאֱמַר? אֶלָּא לִמֵּד שֶׁהָיָה קָדוֹשׁ מִבֶּטֶן. דָּ\"אַ אָמַר רַ' אַבָּא, מִכָּאן לָמַד קַ\"וָ בֶּן הַגְּבִירָה מִבֶּן הָאָמָה; כְּתִיב הִנֵּה בֵּרַכְתִּי אֹתוֹ וְהִפְרֵיתִי אֹתוֹ וְהִרְבֵּיתִי אֹתוֹ, זֶה יִשְׁמָעֵאל, וְקַ\"וָ וְאֶת בְּרִיתִי אָקִים אֶת יִצְחָק:", "rashi_en": "הכתוב מדגיש שהברית תקום עם יצחק כדי שלא נחשוב שבני ישמעאל ובני קטורה נכללים בה. והחזרה על הברית עם יצחק מלמדת שהיה קדוש מבטן, או שיש כאן קל וחומר מברכת ישמעאל.", "note": "", "points": [{"q": "לָמָּה הִדְגִּישׁ ה' שֶׁהַבְּרִית תָּקוּם דַּוְוקָא \"אִתּוֹ\", עִם יִצְחָק?", "options": ["כְּדֵי שֶׁלֹּא נַחְשֹׁוב שֶׁבְּנֵי יִשְׁמָעֵאל וּבְנֵי קְטוּרָה בִּכְלַל הַבְּרִית", "כְּדֵי לְלַמֵּד שֶׁיִּצְחָק יְקַייֵּם אֶת הַבְּרִית לִפְנֵי אַבְרָהָם", "כְּדֵי לְלַמֵּד שֶׁהַבְּרִית עִם אַבְרָהָם עַצְמוֹ בָּטְלָה"], "kasha": "כבר נאמר לאברהם שהוא וזרעו ישמרו את הברית, ולמה צריך לומר שוב שהברית תקום עם יצחק?", "answer": "היה אפשר לחשוב שבני ישמעאל ובני קטורה בכלל קיום הברית, ולכן נאמר \"אתו\", ולא עם אחרים.", "kp": ["יכול בני ישמעאל ובני קטורה", "ולא עם אחרים"]}, {"q": "מַה לוֹמְדִים מֵהַחֲזָרָה \"וְאֶת בְּרִיתִי אָקִים אֶת יִצְחָק\" לְפִי הַפֵּירוּשׁ הָרִאשׁוֹן?", "options": ["שֶׁיִּצְחָק הָיָה קָדוֹשׁ מִבֶּטֶן אִמּוֹ", "שֶׁיִּצְחָק ייִמּוֹל בְּגִיל שְׁלוֹשׁ עֶשְׂרֵה", "שֶׁיִּצְחָק יְקַבֵּל אֶת הַבְּרִית רַק אַחֲרֵי מוֹת אַבְרָהָם"], "kasha": "הכתוב חוזר שוב על הקמת הברית עם יצחק, ולכאורה זו כפילות.", "answer": "החזרה מלמדת שיצחק היה קדוש מבטן. ולפי ר' אבא יש כאן קל וחומר: אם ישמעאל בן האמה התברך, קל וחומר שהברית תקום עם יצחק בן הגבירה.", "kp": ["שהיה קדוש מבטן", "בן הגבירה מבן האמה"]}]}, {"id": "17:19.4", "ch": 17, "v": 19, "n": 4, "dh": "ואת בריתי", "pasuk_html": "וַיֹּ֣אמֶר אֱלֹהִ֗ים אֲבָל֙ שָׂרָ֣ה אִשְׁתְּךָ֗ יֹלֶ֤דֶת לְךָ֙ בֵּ֔ן וְקָרָ֥אתָ אֶת־שְׁמ֖וֹ יִצְחָ֑ק וַהֲקִמֹתִ֨י <mark>אֶת־בְּרִיתִ֥י</mark> אִתּ֛וֹ לִבְרִ֥ית עוֹלָ֖ם לְזַרְע֥וֹ אַחֲרָֽיו׃", "pasuk_en": "וַיֹּאמֶר אֱלֹהִים אֲבָל שָׂרָה אִשְׁתְּךָ יֹלֶדֶת לְךָ בֵּן וְקָרָאתָ אֶת־שְׁמוֹ יִצְחָק וַהֲקִמֹתִי אֶת־בְּרִיתִי אִתּוֹ לִבְרִית עוֹלָם לְזַרְעוֹ אַחֲרָיו׃", "rashi_he": "ואת בריתי. בְּרִית הַמִּילָה תְּהֵא מְסוּרָה לְזַרְעוֹ שֶׁל יִצְחָק:", "rashi_en": "ברית המילה תימסר לזרעו של יצחק, ולא לזרעו של ישמעאל.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, לְמִי תִּימָּסֵר בְּרִית הַמִּילָה?", "options": ["לְזַרְעוֹ שֶׁל יִצְחָק", "לְכָל צֶאֱצָאֵי אַבְרָהָם בְּשָׁוֶוה", "לְזַרְעָם שֶׁל יִצְחָק וְיִשְׁמָעֵאל יַחַד"], "kasha": "צריך להבין איזו ברית תקום עם זרעו של יצחק אחריו.", "answer": "ברית המילה תהיה מסורה לזרעו של יצחק.", "kp": ["ברית המילה תהא מסורה לזרעו של יצחק"]}]}, {"id": "17:20.1", "ch": 17, "v": 20, "n": 1, "dh": "שנים עשר נשיאים", "pasuk_html": "וּֽלְיִשְׁמָעֵ֘אל שְׁמַעְתִּיךָ֒ הִנֵּ֣ה ׀ בֵּרַ֣כְתִּי אֹת֗וֹ וְהִפְרֵיתִ֥י אֹת֛וֹ וְהִרְבֵּיתִ֥י אֹת֖וֹ בִּמְאֹ֣ד מְאֹ֑ד <mark>שְׁנֵים־עָשָׂ֤ר נְשִׂיאִם֙</mark> יוֹלִ֔יד וּנְתַתִּ֖יו לְג֥וֹי גָּדֽוֹל׃", "pasuk_en": "וּלְיִשְׁמָעֵאל שְׁמַעְתִּיךָ הִנֵּה בֵּרַכְתִּי אֹתוֹ וְהִפְרֵיתִי אֹתוֹ וְהִרְבֵּיתִי אֹתוֹ בִּמְאֹד מְאֹד שְׁנֵים־עָשָׂר נְשִׂיאִם יוֹלִיד וּנְתַתִּיו לְגוֹי גָּדוֹל׃", "rashi_he": "שנים עשר נשיאים. כַּעֲנָנִים יִכְלוּ; כְּמוֹ נְשִׂיאִים וְרוּחַ (משלי כ\"ה):", "rashi_en": "המילה \"נשיאים\" רומזת לעננים, כלומר שנשיאי ישמעאל יכלו ויתפזרו כמו עננים, כמו \"נשיאים ורוח\".", "note": "", "points": [{"q": "מַה רוֹמֶזֶת הַמִּילָּה \"נְשִׂיאִם\" בַּבְּרָכָה לְיִשְׁמָעֵאל, לְפִי רַשִׁ\"י?", "options": ["שֶׁנְּשִׂיאָיו יִכְלוּ וְיִתְפַּזְּרוּ כְּמוֹ עֲנָנִים", "שֶׁנְשִׂיאָיו יִמְלְכוּ עַל כָּל הָעַמִּים לְעוֹלָם", "שֶׁנְשִׂיאָיו יִתְנַשְּׂאוּ מֵעַל בְּנֵי יִצְחָק"], "kasha": "קשה שישמעאל יקבל ברכה שלמה ונצחית כמו זרע יצחק.", "answer": "נשיאים הם עננים, כמו \"נשיאים ורוח\", ומכאן שהם יכלו כעננים.", "kp": ["כעננים יכלו"]}]}, {"id": "17:22.1", "ch": 17, "v": 22, "n": 1, "dh": "מעל אברהם", "pasuk_html": "וַיְכַ֖ל לְדַבֵּ֣ר אִתּ֑וֹ וַיַּ֣עַל אֱלֹהִ֔ים <mark>מֵעַ֖ל אַבְרָהָֽם׃</mark>", "pasuk_en": "וַיְכַל לְדַבֵּר אִתּוֹ וַיַּעַל אֱלֹהִים מֵעַל אַבְרָהָם׃", "rashi_he": "מעל אברהם. לְשׁוֹן נְקִיָּה הוּא כְּלַפֵּי שְׁכִינָה, וְלָמַדְנוּ שֶׁהַצַּדִּיקִים מֶרְכַּבְתּוֹ שֶׁל מָקוֹם (בראשית רבה):", "rashi_en": "הביטוי \"מעל אברהם\" הוא לשון מכובדת כלפי השכינה, ומכאן למדנו שהצדיקים הם מרכבה לשכינה.", "note": "", "points": [{"q": "מַה לוֹמֵד רַשִׁ\"י מֵהַמִּילִּים \"וַיַּעַל אֱלֹהִים מֵעַל אַבְרָהָם\"?", "options": ["שֶׁהַצַּדִּיקִים הֵם מֶרְכָּבָה לַשְּׁכִינָה", "שֶׁאַבְרָהָם עָלָה לַשָּׁמַיִם יַחַד עִם הַשְּׁכִינָה", "שֶׁה' כָּעַס עַל אַבְרָהָם וְהִסְתַּלֵּק מִמֶּנּוּ"], "kasha": "הלשון \"מעל אברהם\" משמעה שהשכינה הייתה מעליו, וזה צריך הסבר.", "answer": "זו לשון נקייה כלפי השכינה, ולמדנו ממנה שהצדיקים הם מרכבתו של מקום.", "kp": ["לשון נקיה הוא כלפי שכינה", "שהצדיקים מרכבתו של מקום"]}]}, {"id": "17:23.1", "ch": 17, "v": 23, "n": 1, "dh": "בעצם היום", "pasuk_html": "וַיִּקַּ֨ח אַבְרָהָ֜ם אֶת־יִשְׁמָעֵ֣אל בְּנ֗וֹ וְאֵ֨ת כָּל־יְלִידֵ֤י בֵיתוֹ֙ וְאֵת֙ כָּל־מִקְנַ֣ת כַּסְפּ֔וֹ כָּל־זָכָ֕ר בְּאַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַיָּ֜מָל אֶת־בְּשַׂ֣ר עָרְלָתָ֗ם <mark>בְּעֶ֙צֶם֙ הַיּ֣וֹם</mark> הַזֶּ֔ה כַּאֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖וֹ אֱלֹהִֽים׃", "pasuk_en": "וַיִּקַּח אַבְרָהָם אֶת־יִשְׁמָעֵאל בְּנוֹ וְאֵת כָּל־יְלִידֵי בֵיתוֹ וְאֵת כָּל־מִקְנַת כַּסְפּוֹ כָּל־זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם וַיָּמָל אֶת־בְּשַׂר עָרְלָתָם בְּעֶצֶם הַיּוֹם הַזֶּה כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים׃", "rashi_he": "בעצם היום. בּוֹ בַּיּוֹם שֶׁנִּצְטַוָּה, בַּיּוֹם וְלֹא בַּלַּיְלָה; לֹא נִתְיָרֵא לֹא מִן הַגּוֹיִם וְלֹא מִן הַלֵּצָנִים, וְשֶׁלֹּא יִהְיוּ אוֹיְבָיו וּבְנֵי דּוֹרוֹ אוֹמְרִים אִלּוּ רְאִינוּהוּ לֹא הִנַּחְנוּהוּ לָמוּל וּלְקַיֵּם מִצְוָתוֹ שֶׁל מָקוֹם:", "rashi_en": "אברהם מל באותו יום שנצטווה, ביום ולא בלילה. הוא לא פחד מהגויים ומהלצים, וכך לא יוכלו אויביו לומר שאילו ראו אותו היו מונעים ממנו.", "note": "", "points": [{"q": "מַה בָּא רַשִׁ\"י לְלַמֵּד מִכָּךְ שֶׁאַבְרָהָם מָל \"בְּעֶצֶם הַיּוֹם הַזֶּה\"?", "options": ["שֶׁמָּל בַּיּוֹם וּבְגָלוּי וְלֹא פָּחַד מֵאוֹיְבָיו", "שֶׁמָּל בַּלַּיְלָה כְּדֵי שֶׁלֹּא יִרְאוּ אוֹתוֹ", "שֶׁהִמְתִּין כַּמָּה יָמִים עַד שֶׁהִתְחַזֵּק לִפְנֵי הַמִּילָה"], "kasha": "המילים \"בעצם היום\" נראות מיותרות, ומה הן מלמדות?", "answer": "אברהם מל באותו יום שנצטווה, ביום ולא בלילה, ולא פחד מהגויים ומהלצים, כדי שלא יאמרו אויביו שאילו ראו אותו היו מונעים ממנו.", "kp": ["ביום ולא בלילה", "לא נתירא לא מן הגוים", "אלו ראינוהו לא הנחנוהו"]}]}, {"id": "17:23.2", "ch": 17, "v": 23, "n": 2, "dh": "וימל", "pasuk_html": "וַיִּקַּ֨ח אַבְרָהָ֜ם אֶת־יִשְׁמָעֵ֣אל בְּנ֗וֹ וְאֵ֨ת כָּל־יְלִידֵ֤י בֵיתוֹ֙ וְאֵת֙ כָּל־מִקְנַ֣ת כַּסְפּ֔וֹ כָּל־זָכָ֕ר בְּאַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם <mark>וַיָּ֜מָל</mark> אֶת־בְּשַׂ֣ר עָרְלָתָ֗ם בְּעֶ֙צֶם֙ הַיּ֣וֹם הַזֶּ֔ה כַּאֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖וֹ אֱלֹהִֽים׃", "pasuk_en": "וַיִּקַּח אַבְרָהָם אֶת־יִשְׁמָעֵאל בְּנוֹ וְאֵת כָּל־יְלִידֵי בֵיתוֹ וְאֵת כָּל־מִקְנַת כַּסְפּוֹ כָּל־זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם וַיָּמָל אֶת־בְּשַׂר עָרְלָתָם בְּעֶצֶם הַיּוֹם הַזֶּה כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים׃", "rashi_he": "וימל. לְשׁוֹן וַיִּפְעַל:", "rashi_en": "המילה \"וימל\" היא בבניין פעיל, כלומר אברהם עשה את המילה לאחרים.", "note": "", "points": [{"q": "מַה מְלַמֶּדֶת צוּרַת הַמִּילָּה \"וַיָּמָל\" לְפִי רַשִׁ\"י?", "options": ["שֶׁהִיא לְשׁוֹן פָּעִיל: אַבְרָהָם מָל אֶת הָאֲחֵרִים", "שֶׁהִיא לְשׁוֹן סָבִיל: הֵם נִימּוֹלוּ מֵעַצְמָם", "שֶׁהִיא לְשׁוֹן צִיּוּוי: אַבְרָהָם צִיווָּה אוֹתָם לָמוּל"], "kasha": "יש לברר אם \"וימל\" פירושו שאברהם מל אחרים או שנימול בעצמו.", "answer": "\"וימל\" הוא לשון \"ויפעל\", כלומר צורה פעילה שבה אברהם הוא העושה.", "kp": ["לשון ויפעל"]}]}, {"id": "17:24.1", "ch": 17, "v": 24, "n": 1, "dh": "בהמולו", "pasuk_html": "וְאַ֨בְרָהָ֔ם בֶּן־תִּשְׁעִ֥ים וָתֵ֖שַׁע שָׁנָ֑ה <mark>בְּהִמֹּל֖וֹ</mark> בְּשַׂ֥ר עָרְלָתֽוֹ׃", "pasuk_en": "וְאַבְרָהָם בֶּן־תִּשְׁעִים וָתֵשַׁע שָׁנָה בְּהִמֹּלוֹ בְּשַׂר עָרְלָתוֹ׃", "rashi_he": "בהמולו. בְּהִפָּעֲלוֹ, כְּמוֹ בְּהִבָּרְאָם (בראשית ב'):", "rashi_en": "המילה \"בהמלו\" היא לשון סביל, כלומר כשנימול, כמו \"בהבראם\" שפירושו כשנבראו.", "note": "", "points": [{"q": "מַה פֵּירוּשׁ \"בְּהִמֹּלוֹ\" אֵצֶל אַבְרָהָם לְפִי רַשִׁ\"י?", "options": ["כְּשֶׁנִּימּוֹל, בְּלָשׁוֹן סָבִיל", "כְּשֶׁמָּל אֶת אֲחֵרִים, בְּלָשׁוֹן פָּעִיל", "כְּשֶׁצִּיווָּה לָמוּל אֶת בְּנֵי בֵיתוֹ"], "kasha": "יש לברר אם \"בהמלו\" פירושו שאברהם מל או שנימול.", "answer": "\"בהמולו\" הוא לשון \"בהפעלו\", צורה סבילה, כמו \"בהבראם\".", "kp": ["בהפעלו", "כמו בהבראם"]}]}, {"id": "17:25.1", "ch": 17, "v": 25, "n": 1, "dh": "בהמולו את בשר ערלתו", "pasuk_html": "וְיִשְׁמָעֵ֣אל בְּנ֔וֹ בֶּן־שְׁלֹ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה <mark>בְּהִ֨מֹּל֔וֹ אֵ֖ת בְּשַׂ֥ר עָרְלָתֽוֹ׃</mark>", "pasuk_en": "וְיִשְׁמָעֵאל בְּנוֹ בֶּן־שְׁלֹשׁ עֶשְׂרֵה שָׁנָה בְּהִמֹּלוֹ אֵת בְּשַׂר עָרְלָתוֹ׃", "rashi_he": "בהמולו את בשר ערלתו. בְּאַבְרָהָם לֹא נֶאֱמַר \"אֵת\", לְפִי שֶׁלֹּא הָיָה חָסֵר אֶלָּא חִתּוּךְ בָּשָׂר, שֶׁכְּבָר נִתְמָעֵךְ עַל יְדֵי תַשְׁמִישׁ; אֲבָל יִשְׁמָעֵאל שֶׁהָיָה יֶלֶד, הֻזְקַק לַחְתֹּךְ עָרְלָה וְלִפְרֹעַ הַמִּילָה, לְכָךְ נֶאֱמַר בּוֹ \"אֵת\" (בראשית רבה):", "rashi_en": "אצל אברהם לא נאמרה המילה \"את\", כי הערלה שלו כבר נתמעכה והיה צריך רק חיתוך בשר. אבל ישמעאל היה ילד והוצרך לחיתוך הערלה ולפריעה, ולכן נאמר אצלו \"את\".", "note": "", "points": [{"q": "לָמָּה נֶאֱמְרָה הַמִּילָּה \"אֵת\" בְּמִילַת יִשְׁמָעֵאל וְלֹא בְּמִילַת אַבְרָהָם?", "options": ["כִּי יִשְׁמָעֵאל הֻוצְרַךְ לַחִיתּוּךְ הָעָרְלָה וְלַפְּרִיעָה", "כִּי יִשְׁמָעֵאל נִימּוֹל לִפְנֵי אַבְרָהָם בְּאוֹתוֹ יוֹם", "כִּי יִשְׁמָעֵאל נִימּוֹל בִּידֵי אָדָם אַחֵר וְלֹא בִּידֵי אָבִיו"], "kasha": "בפסוק על אברהם לא נאמר \"את\", ובפסוק על ישמעאל נאמר \"את\", ולמה השינוי?", "answer": "אצל אברהם הערלה כבר נתמעכה והיה חסר רק חיתוך בשר, ואילו ישמעאל הילד הוצרך לחיתוך הערלה ולפריעת המילה.", "kp": ["שכבר נתמעך על ידי תשמיש", "הזקק לחתך ערלה ולפרע המילה"]}]}, {"id": "17:26.1", "ch": 17, "v": 26, "n": 1, "dh": "בעצם היום הזה", "pasuk_html": "<mark>בְּעֶ֙צֶם֙ הַיּ֣וֹם הַזֶּ֔ה</mark> נִמּ֖וֹל אַבְרָהָ֑ם וְיִשְׁמָעֵ֖אל בְּנֽוֹ׃", "pasuk_en": "בְּעֶצֶם הַיּוֹם הַזֶּה נִמּוֹל אַבְרָהָם וְיִשְׁמָעֵאל בְּנוֹ׃", "rashi_he": "בעצם היום הזה. שֶׁמָּלְאוּ לְאַבְרָהָם צ\"ט שָׁנָה וּלְיִשְׁמָעֵאל י\"ג שָׁנִים נמול אברהם וישמעאל בנו:", "rashi_en": "\"בעצם היום הזה\" הוא היום שבו מלאו לאברהם תשעים ותשע שנים ולישמעאל שלוש עשרה שנים, ובו נימולו שניהם.", "note": "", "points": [{"q": "לְפִי רַשִׁ\"י, אֵיזֶה יוֹם הוּא \"בְּעֶצֶם הַיּוֹם הַזֶּה\" בַּפָּסוּק זֶּה?", "options": ["הַיּוֹם שֶׁבּוֹ מָלְאוּ לְאַבְרָהָם וּלְיִשְׁמָעֵאל שְׁנוֹתֵיהֶם", "הַיּוֹם שֶׁבּוֹ נוֹלַד יִצְחָק", "הַיּוֹם שֶׁבּוֹ נִכְרְתָה בְּרִית בֵּין הַבְּתָרִים"], "kasha": "כבר נאמר קודם שאברהם מל \"בעצם היום הזה\", ומה בא הפסוק להוסיף?", "answer": "זה היום שבו מלאו לאברהם תשעים ותשע שנים ולישמעאל שלוש עשרה שנים, ובו נימולו אברהם וישמעאל בנו.", "kp": ["שמלאו לאברהם", "נמול אברהם וישמעאל בנו"]}]}];
const EN = {"12:1.1":{"e":"Rashi explains that the extra word 'lech' means for your benefit and for your good. In the new land Avram would become a great nation and would merit children, which he would not merit here, and his good nature would also become known in the world.","pe":"Adonoy said to Avram, Go from your land, from your birthplace, and from your father’s house, [and go] to the land that I will show you.","re":"Go. [Meaning:] “For your own benefit, for your own good. It is there that I will make you into a great nation, [whereas] here you will not merit having children. Also, I will make your character known to the world.”","p":[{"q":"What does the doubled word 'לך' in the command to Avram teach, according to Rashi?","o":["That the journey is for Avram's own benefit and good","That he must go quickly without delaying on the way","That he must go alone, without his family"]}]},"12:2.1":{"e":"Travel causes three losses: it reduces children, it reduces wealth, and it reduces reputation. Therefore Hashem promised Avram three blessings corresponding to them: children, wealth and a name.","pe":"I will make you into a great nation, I will bless you and make your name great; and you will be a blessing [and you will be blessed].","re":"I will make you into a great nation. Since traveling causes three things: It inhibits the birth of children, and decreases one’s wealth and lessens one’s fame, therefore, these three blessings were necessary. He [God], promised him children, wealth and fame.","p":[{"q":"Why did Hashem need to bless Avram specifically with the three blessings in the verse?","o":["Because travel reduces children, wealth and reputation","Because Avram asked for three blessings in his prayer","Because three sons were destined to be born to him"]}]},"12:2.2":{"e":"The blessing 'ואברכך' is a blessing of wealth.","pe":"I will make you into a great nation, I will bless you and make your name great; and you will be a blessing [and you will be blessed].","re":"I will bless you. With wealth.","p":[{"q":"In what area is Avram blessed by the word 'ואברכך'?","o":["In money and wealth","In having many children","In health and long life"]}]},"12:2.3":{"e":"Until now the blessings were in Hashem's hands, and from now on they were handed over to Avram, who would bless whomever he wished. According to another explanation, the three blessings correspond to the three Patriarchs in the prayer, and 'והיה ברכה' teaches that we conclude the blessing with Avraham alone.","pe":"I will make you into a great nation, I will bless you and make your name great; and you will be a blessing [and you will be blessed].","re":"And you will be a blessing. [I.e.,] the blessings are entrusted to you. Until now they were in My hand; I blessed Adam and Noach. Henceforth, you shall bless whomever you desire. An alternate explanation: I will make you into a great nation. This [is the basis of the opening Shemoneh Esrei prayer], when we say: “God of Avraham.” I will bless you. This is the basis of saying: “God of Yitzchok.” And [I will] make your name great. This is the basis of saying: “God of Yaakov.” One might think [that the first berachah of Shemoneh Esrei] should be concluded by [mentioning] all [three]. The text, therefore, states … And you will be a blessing. Only with your mention is it concluded and not with them [Yitzchok and Yaakov].","p":[{"q":"What does 'והיה ברכה' mean according to the first explanation in Rashi?","o":["The blessings were handed to Avram, and he would bless whomever he wished","Avram would be blessed more than any other person in the world","Everyone who meets Avram will be blessed immediately"]},{"q":"According to the 'other explanation', what do we learn from 'והיה ברכה' about the first blessing in the prayer?","o":["That we conclude it with Avraham alone","That we conclude it with all three Patriarchs together","That Yitzchak and Yaakov are not mentioned in it at all"]}]},"12:2.4":{"e":"Avram had already left his land with his father and reached Charan, so the command 'מארצך' means that he should distance himself even further from there and leave his father's house as well.","pe":"I will make you into a great nation, I will bless you and make your name great; and you will be a blessing [and you will be blessed].","re":"From your land. But, had he not already left there with his father and come to Charan? But, He [in effect] was telling him, “Keep distancing yourself from there and leave your father’s house [as well].”","p":[{"q":"What difficulty does Rashi have with the command to go 'מארצך'?","o":["Avram had already left his land and reached Charan","It is unclear which land is his homeland","Avram did not yet know where to go"]}]},"12:2.5":{"e":"Hashem did not reveal to Avram immediately which land he would go to, so that the land would be dear in his eyes and to give him reward for every single word. So too with the Akeidah and with Yonah.","pe":"I will make you into a great nation, I will bless you and make your name great; and you will be a blessing [and you will be blessed].","re":"To the land that I will show you. He did not immediately reveal which land it was in order that it be precious in his eyes, as well as to reward him for every word. Similarly: “Your son, your only, the one you love, Yitzchok” Similarly: “On one of the mountains that I will tell you,” and similarly: “And proclaim to it the proclamation that I will tell you.”","p":[{"q":"Why did Hashem not immediately reveal to Avram the land to which he would go?","o":["To make it dear to him and to give him reward for every word","So that he would not tell the people of Charan where he was going","Because it had not yet been decided which land would be given to him"]}]},"12:3.1":{"e":"There are many aggadic interpretations, but the simple meaning is that a person will bless his son and say to him 'may you be like Avraham.' This is proven from the verse 'May God make you like Efrayim and Menasheh.'","pe":"I will bless those who bless you, and he who curses you, I will curse; and through you [and because of you], will be blessed all the families of the earth.","re":"And through you, will be blessed. There are many Aggadaic interpretations, but this is the simple meaning: A man says to his son, “May you be like Avraham.” This is the meaning every [time the expression] וְנִבְרְכוּ בְךָ [appears] in Scripture. The following [expression] proves this: “Through you shall [the People of] Israel bless, saying: May Elohim make you as Ephraim and Menasheh.”","p":[{"q":"What is the simple meaning of 'ונברכו בך' according to Rashi?","o":["A person will bless his son that he be like Avraham","The whole world will receive abundance in Avraham's merit","Avraham himself will bless all the families"]}]},"12:5.1":{"e":"According to the Midrash, these are the men and women whom Avraham and Sarah converted, and Scripture considers them as if they had made them. According to the simple meaning, they are the slaves and maidservants they acquired, and 'asah' is an expression of acquiring.","pe":"Avram took his wife Sarai, Lot, his brother’s son, all their possessions they had acquired, and the souls [people] that they had made [converted] in Charan, and they set out to go to the land of Canaan. They came to the land of Canaan.","re":"That they had made [converted] in Charan. [Meaning those souls] that he brought under the protective wings of the Divine Presence. Avraham would convert the men and Sarah would convert the women, and Scripture considers them as if they had “made” them. But, the plain meaning of the verse is [that this refers to] the slaves and maidservants whom they acquired for themselves, as in the verse, “He acquired all this wealth” [or,] “And Israel acquires wealth,” meaning acquiring and amassing.","p":[{"q":"According to the Midrash, who are the souls that Avram and Sarai 'made' in Charan?","o":["Men and women whom they converted and brought under the wings of the Divine Presence","Children born to them during the years they lived in Charan","Family members from Charan who joined them on the journey"]},{"q":"What does 'עשו' mean in the verse according to the simple meaning?","o":["They acquired slaves and maidservants, since 'asah' is an expression of acquiring","They bore sons and daughters while they lived in Charan","They converted men and women and brought them to faith"]}]},"12:6.1":{"e":"'ויעבר אברם בארץ' means that he entered into the land.","pe":"Avram passed [traveled] through the land until the place of Shechem, until the Plain of Moreh. The Canaanites were then in the land.","re":"Avram passed [traveled] through the land. [Meaning] he entered it.","p":[{"q":"What does 'ויעבר אברם בארץ' mean?","o":["He entered into the land","He passed through the land and left it","He passed along the borders of the land"]}]},"12:6.2":{"e":"Avram went as far as Shechem to pray there for the sons of Yaakov, who were destined to fight in Shechem.","pe":"Avram passed [traveled] through the land until the place of Shechem, until the Plain of Moreh. The Canaanites were then in the land.","re":"Until the place of Shechem. In order to pray for Yaakov’s sons when they will come to do battle against Shechem.","p":[{"q":"Why did Avram go specifically 'עד מקום שכם'?","o":["To pray for the sons of Yaakov who would fight in Shechem","Because Hashem showed him Mount Gerizim and Mount Eival there","Because he wanted to build his first altar there"]}]},"12:6.3":{"e":"Elon Moreh is Shechem. There Hashem showed Avram Mount Gerizim and Mount Eival, where Israel accepted the oath of the Torah.","pe":"Avram passed [traveled] through the land until the place of Shechem, until the Plain of Moreh. The Canaanites were then in the land.","re":"The Plain of Moreh. It is [another name for] Shechem. [It is so called because there] He showed him Mount Gerizim and Mount Eival where Israel accepted the oath to abide by the Torah.","p":[{"q":"What did Hashem show Avram at 'אלון מורה' according to Rashi?","o":["Mount Gerizim and Mount Eival","The whole land in its length and breadth","The place where the Temple would be built"]}]},"12:6.4":{"e":"At that time the Canaanite was conquering the Land of Israel from the descendants of Shem, in whose portion it fell when Noach divided the earth among his sons. Therefore Hashem promised Avram, who was of the seed of Shem, that He would return the land to his children.","pe":"Avram passed [traveled] through the land until the place of Shechem, until the Plain of Moreh. The Canaanites were then in the land.","re":"The Canaanites were then in the land. He [the Canaanite] gradually conquered Eretz Yisrael from the descendants of Sheim. For it fell to the share of Sheim when Noach apportioned the land to his sons as it is said: “Malki Zedek King of Shaleim.” For this reason—“Adonoy said to Avram, ‘to your descendants will I give this land,’” meaning, “In the future I will return it to your children who are descendants of Sheim.”","p":[{"q":"What does the Torah teach by saying 'והכנעני אז בארץ'?","o":["That at that time the Canaanite was conquering the land from the descendants of Shem","That the Canaanite had always lived in the land","That the Canaanite was about to leave the land at that time"]}]},"12:7.1":{"e":"Avram built an altar to give thanks for the two pieces of good news: that he would have offspring and that his offspring would inherit the Land of Israel.","pe":"Adonoy appeared [became revealed] to Avram and said: To your descendants I will give this land. There he built an altar to [before] Adonoy Who had appeared [been revealed] to him.","re":"There he built an altar. [In thanksgiving] for the tidings of [his having] children and for the tidings [that they would inherit] Eretz Yisrael.","p":[{"q":"For what did Avram build the altar in this verse?","o":["For the good news that he would have offspring and inherit the land","For being saved from the dangers of the road from Charan to Canaan","To pray for his sons who would stumble in the sin of Achan"]}]},"12:8.1":{"e":"'ויעתק' means that he moved his tent from place to place.","pe":"From there he moved [ascended] to the mountain that was east of Beis-Eil and set up his tent. Beis-Eil was to the west and Ai was to the east. There he built an altar to [before] Adonoy, and he proclaimed the Name, [and he prayed in the Name,] Adonoy.","re":"From there he moved. [This refers to] his tent.","p":[{"q":"What did Avram move from there?","o":["His tent","The altar he had built","His sheep and cattle"]}]},"12:8.2":{"e":"Avram pitched his tent to the east of Beit El, so that Beit El was to his west. Therefore it says 'Beit El from the west'.","pe":"From there he moved [ascended] to the mountain that was east of Beis-Eil and set up his tent. Beis-Eil was to the west and Ai was to the east. There he built an altar to [before] Adonoy, and he proclaimed the Name, [and he prayed in the Name,] Adonoy.","re":"That was east of Beis-Eil. Means east of Beis-Eil. Whereby Beis-Eil is located to his west, and that is what is meant by: “Beis-Eil in the west.”","p":[{"q":"What does 'מקדם לביתאל' mean?","o":["To the east of Beit El, with Beit El to his west","Before Avram reached Beit El","In ancient times, before Beit El was built"]}]},"12:8.3":{"e":"The verse has 'אהלה' written with a heh, to teach that Avram first pitched his wife's tent and only afterward his own.","pe":"From there he moved [ascended] to the mountain that was east of Beis-Eil and set up his tent. Beis-Eil was to the west and Ai was to the east. There he built an altar to [before] Adonoy, and he proclaimed the Name, [and he prayed in the Name,] Adonoy.","re":"His tent. It is written אהלה [her tent]. [The reason for this is because] he first pitched his wife’s tent and, afterwards, his own.","p":[{"q":"What do we learn from the fact that the verse wrote 'אהלה' with a heh?","o":["That he first pitched his wife's tent and then his own","That the tent belonged to Sarah and not Avram","That Avram and Sarah lived together in one tent"]}]},"12:8.4":{"e":"Avram saw prophetically that his sons were destined to stumble there because of the sin of Achan, and he built an altar there in order to pray for them.","pe":"From there he moved [ascended] to the mountain that was east of Beis-Eil and set up his tent. Beis-Eil was to the west and Ai was to the east. There he built an altar to [before] Adonoy, and he proclaimed the Name, [and he prayed in the Name,] Adonoy.","re":"There he built an altar. He prophetically saw that his descendants were destined to be weakened there through Achan’s transgression, so he prayed for them there.","p":[{"q":"Why did Avram build another altar in this place, between Beit El and Ai?","o":["To pray for his sons who would stumble there in the sin of Achan","To give thanks for the news of offspring and land","To publicize Hashem's name among the Canaanites"]}]},"12:9.1":{"e":"Avram traveled in stages: he would stay a month or more in one place and then travel on. All his journeys were southward, toward Jerusalem and Mount Moriah, which is in Yehudah's portion.","pe":"Avram journeyed, traveling steadily southward.","re":"Traveling steadily. At intervals. He would stay here a month or so, then travel and pitch his tent somewhere else. But, all his travels were southward [aimed at] going to the south of Eretz Yisrael, which is in the direction of Yerushalayim, which is in the territory of Yehudah, who took [his portion] in southern Eretz Yisrael to Mount Moriah which is his [Yehudah’s] possession.","p":[{"q":"What does 'הלוך ונסוע' mean?","o":["He traveled in stages, staying a month or more in each place","He traveled continuously without stopping anywhere","He alternated between walking and riding"]},{"q":"In which direction did Avram aim all his journeys 'הנגבה' (southward)?","o":["Toward Jerusalem and Mount Moriah, which is in Yehudah's portion","Toward Egypt, so as to go down there when necessary","Toward the Dead Sea and the cities of Sedom"]}]},"12:10.1":{"e":"The famine was only in the land of Canaan, in order to test Avram whether he would question Hashem's words, who had commanded him to go to Canaan and now forced him to leave it.","pe":"There was a famine in the land. Avram went down to Egypt to live there temporarily, for the famine was severe in the land.","re":"Famine in the land. In that land only. [This was] in order to test him [Avram] whether he will question the words of God who had told him to go to the Land of Canaan and now is forcing him to leave it.","p":[{"q":"According to Rashi, why did the famine come specifically in the land of Canaan?","o":["To test Avram whether he would question Hashem's words","To punish the Canaanites for their evil deeds","So that Avram would go down to Egypt and become wealthy there"]}]},"12:11.1":{"e":"According to the Midrash, until now Avram had not noticed Sarah's beauty because of the modesty of both of them. According to the simple meaning, he had known for a long time that she was beautiful, but now the time had come to worry, for they were coming among people who are dark and ugly and not accustomed to a beautiful woman.","pe":"As he came near and was about to enter Egypt, he said to his wife Sarai, Behold, I now realize that you are a woman of beautiful appearance.","re":"Behold, I now realize. The Aggadaic explanation is: Until now he had not been aware [of her beauty] due to the modesty of both of them. But, now, he became aware of her due to an event. Another explanation: It is usual that due to the hardship of travel a person becomes unattractive, but she had remained with her beauty. But, the simple explanation of this verse is, Behold I now realize [that] the time has come to be concerned over your beauty. I have known for a long time that you are beautiful. But, now we will be coming amongst black and repulsive people, brothers of the Kushim, who are not accustomed to [seeing] a beautiful woman. An example similar to this: “See now my lords, please turn.”","p":[{"q":"According to the simple meaning, what did Avram mean by saying 'ידעתי'?","o":["He had known for a long time that she was beautiful, and now the time had come to worry","Only now did he notice her beauty for the first time","He discovered that her beauty had not been harmed by the hardship of the road"]},{"q":"According to the Aggadic Midrash, why did Avram recognize Sarai's beauty only now?","o":["Out of modesty he had not noticed it until now","Because until now she was not so beautiful","Because only now did others tell him of her beauty"]}]},"12:13.1":{"e":"Avram hoped that in Sarai's merit they would give him gifts.","pe":"Please [Now] say [therefore] that you are my sister, so that it will go well with me for your sake, and my life will be spared because of you [through your words].","re":"So that it will go well with me for your sake. So that they give me gifts.","p":[{"q":"What benefit did Avram hope to receive on account of Sarai?","o":["That they would give him gifts","That they would honor him as an important person","That they would give him a place to live"]}]},"12:14.1":{"e":"It should have said 'when they came', since Sarai came with him. From here we learn that Avram hid her in a chest, and when they demanded customs duty from him, they opened it and saw her.","pe":"And it was when Avram was entering Egypt, that the Egyptians beheld the woman, because she was very beautiful.","re":"And it was when Avram was entering Egypt. It should have said, “When they came to Egypt.” But, this teaches that he hid her in a box and when they demanded the customs taxes they opened it and saw her.","p":[{"q":"What difficulty does Rashi have with the wording 'כבוא אברם מצרימה'?","o":["It should have said 'when they came', since Sarai came with him","It is unclear exactly when Avram arrived in Egypt","It was already stated earlier that Avram went down to Egypt"]}]},"12:15.1":{"e":"Pharaoh's officers praised Sarai among themselves and said that she was fitting for the king.","pe":"Pharaoh’s officials saw her and praised her to Pharaoh. The woman was taken to Pharaoh’s house.","re":"And praised her to Pharaoh. They praised her among themselves saying, “This [woman] is fit for the king.”","p":[{"q":"What does 'ויהללו אתה' mean according to Rashi?","o":["They praised her among themselves and said she was fitting for the king","They praised her in Pharaoh's hearing in his palace","Sarai praised Pharaoh before his officers"]}]},"12:16.1":{"e":"It was Pharaoh who treated Avram well, on account of Sarai.","pe":"He treated Avram well for her sake. He thus acquired sheep, oxen, donkeys, male and female slaves, female donkeys and camels.","re":"He treated Avram well, [“he” refers to] Pharaoh, for her sake.","p":[{"q":"Who treated Avram well on account of Sarai?","o":["Pharaoh","Pharaoh's officers","The Egyptians who saw her"]}]},"12:17.1":{"e":"Pharaoh was struck with a skin disease called 'rasan', because of which marital relations were painful for him.","pe":"Adonoy afflicted Pharaoh with severe plagues [brought severe plagues upon Pharaoh], and also his household, because of Sarai, Avram’s wife.","re":"Adonoy afflicted, etc. He was smitten with a kind of skin disease for which marital relations are harmful.","p":[{"q":"With what affliction was Pharaoh struck according to Rashi?","o":["With the 'rasan' disease, which made marital relations painful for him","With leprosy that spread over his whole body","With a plague that struck his animals"]}]},"12:17.2":{"e":"According to the Targum, 'ואת ביתו' means the members of his household. According to the Midrash, it also includes the walls of the house, its pillars and its vessels.","pe":"Adonoy afflicted Pharaoh with severe plagues [brought severe plagues upon Pharaoh], and also his household, because of Sarai, Avram’s wife.","re":"And also his household. [This should be interpreted] as its Targum: “And on the people of his house.” Its Midrashic interpretation [is that]: [וְאֶת בֵּיתוֹ] includes its walls, pillars and utensils.","p":[{"q":"According to the Midrash, what was included in the 'ואת ביתו' that was struck?","o":["Also the walls of the house, its pillars and its vessels","Only Pharaoh's close family members","Only Pharaoh's officers and servants"]}]},"12:17.3":{"e":"'על דבר שרי' means by her word: Sarai would say to the angel 'strike', and he would strike.","pe":"Adonoy afflicted Pharaoh with severe plagues [brought severe plagues upon Pharaoh], and also his household, because of Sarai, Avram’s wife.","re":"Because of Sarai. [Meaning:] according to her words, she tells the angel, “Strike [him]!” and he strikes [him].","p":[{"q":"What does 'על דבר שרי' mean according to Rashi?","o":["By her word: she would tell the angel to strike and he would strike","Because Pharaoh spoke with Sarai and asked to take her","Because Avram said that she was his sister"]}]},"12:19.1":{"e":"Pharaoh, unlike Avimelech who invited Avraham to stay in his land, told Avram to go and not remain, because the Egyptians are steeped in immorality.","pe":"Why did you say, She is my sister, so that I should take her to myself for a wife? Now here is your wife, take [her] and go.","re":"Take [her] and go. Unlike Avimelech who told him, “Here is my land before you.” But, [instead, Pharaoh] told him, “Go, do not remain here for the Egyptians are permeated with lewdness,” as it is said: “Their issue is the issue of horses.”","p":[{"q":"Why did Pharaoh say to Avram 'קח ולך' rather than offering him to stay?","o":["Because the Egyptians are steeped in immorality, and he should not remain there","Because Pharaoh was angry at Avram and wanted to punish him","Because Pharaoh knew the famine in Canaan had already ended"]}]},"12:20.1":{"e":"'ויצו עליו' means that Pharaoh commanded people concerning Avram, to escort him and guard him.","pe":"Pharaoh assigned men to him and they escorted him and his wife and all that was his.","re":"[He] assigned to him. [עָלָיו here means] concerning him, [i.e.,] to escort and protect him.","p":[{"q":"What does 'ויצו עליו' mean in this verse?","o":["He commanded people concerning him, to escort him and guard him","He commanded Avram to leave Egypt immediately","He appointed people to watch him like a prisoner"]}]},"12:20.2":{"e":"'וישלחו' means, as Onkelos translated, that they escorted him.","pe":"Pharaoh assigned men to him and they escorted him and his wife and all that was his.","re":"And they escorted him. As the Targum translates: “They escorted him.”","p":[{"q":"What does 'וישלחו' mean according to the Targum that Rashi cites?","o":["They escorted him on his way","They expelled him from the land","They sent him off with gifts"]}]},"13:1.1":{"e":"Avram went up from Egypt in order to reach the south of the Land of Israel, toward Mount Moriah. In practice he traveled from south to north, since Egypt is south of the Land of Israel.","pe":"Avram went up from Egypt; he, his wife, and all that he had, together with Lot into the south.","re":"Avram went up … into the south. [Meaning:] to arrive at the south of Eretz Yisrael, as it was stated above, “traveling steadily southward,” [meaning:] to Mount Moriah. Nevertheless, when one travels from Egypt to the Land of Canaan, he travels from south to north, for Egypt is south of Eretz Yisrael as can be shown by the “journeys” and at the boundaries of Eretz Yisrael.","p":[{"q":"According to Rashi, what does 'הנגבה' mean in the verse, if Egypt is south of the Land of Israel?","o":["That he went in order to reach the south of the Land of Israel, at Mount Moriah","That he went south from Egypt, away from the land of Canaan","That he went to the northern part of the Land of Israel"]}]},"13:2.1":{"e":"'כבד' here means that Avram was loaded with many burdens of possessions.","pe":"Avram was very wealthy in livestock, silver and gold.","re":"Very wealthy. [I.e.,] he was laden with baggage.","p":[{"q":"What does 'כבד מאד' mean according to Rashi?","o":["That he was loaded with many burdens of possessions","That he was greatly honored in the eyes of the Egyptians","That he was heavy in body from eating too much"]}]},"13:3.1":{"e":"On his way back from Egypt, Avram lodged in the same inns where he had lodged on his way to Egypt, which teaches proper conduct, that a person should not change his lodging place. Another explanation: on the way back he paid the debts he had incurred on his way there.","pe":"He continued on his travels from the south to Beis-Eil, until the place where he originally had [set up] his tent, between Beis-Eil and Ai.","re":"He continued on his travels. [This indicates] that when he returned from Egypt to the Land of Canaan he went and lodged in those inns in which he had lodged on his way to Egypt. This teaches that good manners [require] that a person not change his place of lodging. Another explanation: On his return trip he paid the debts he incurred.","p":[{"q":"What do we learn from the fact that Avram returned 'למסעיו', by the same route he had taken?","o":["That a person should not change his lodging place","That one should always return by the shortest route","That Avram was afraid to go by a road unfamiliar to him"]},{"q":"According to the second explanation in Rashi, what did Avram do on his way back?","o":["He paid the debts he had incurred on his way to Egypt","He built altars everywhere he passed","He bought much livestock from the innkeepers"]}]},"13:3.2":{"e":"'מנגב' means from Egypt, which is in the south of the land of Canaan.","pe":"He continued on his travels from the south to Beis-Eil, until the place where he originally had [set up] his tent, between Beis-Eil and Ai.","re":"From the south. [Meaning] from Egypt [and it is called מִנֶּגֶב because] [it is] south of the Land of Canaan.","p":[{"q":"What is the 'Negev' from which Avram went in this verse?","o":["The land of Egypt, which is south of the land of Canaan","The southern part of the land of Canaan","The desert between Egypt and the land of Canaan"]}]},"13:4.1":{"e":"The words 'ויקרא שם אברם בשם ה'' can continue the description of the place where Avram first called in Hashem's name, and it can also be explained that now he called there again in Hashem's name.","pe":"To the site of the altar which he made there at first; and there Avram called [prayed] in the Name of Adonoy.","re":"Which he made there at first, and he called. And where “Avram called in the Name of Hashem.” It can also be taken to mean, that “He now called there in the Name of Hashem.”","p":[{"q":"According to Rashi, to what do the words 'ויקרא שם אברם בשם ה'' refer?","o":["To a calling he made there in the past, or to a new calling he made now","Only to a calling he would make there in the future, when he returned","To a calling the people of the place had made before Avram"]}]},"13:5.1":{"e":"The verse emphasizes that Lot went with Avram, because that is what caused him to become wealthy.","pe":"Lot who accompanied Avram also had sheep, cattle and tents.","re":"Who accompanied Avram. What brought this about? The fact that he traveled with Avram.","p":[{"q":"Why did the verse emphasize that Lot was 'ההלך את אברם'?","o":["To teach that he became wealthy because he went with Avram","To teach that Lot was Avram's servant","To teach that Lot did not want to go alone"]}]},"13:6.1":{"e":"The land did not provide enough pasture for the livestock of Avram and Lot. The language is abbreviated and means 'the pasture of the land', and therefore 'נשא' is written in the masculine.","pe":"The land was unable to support them that they might dwell together, for their wealth was so great that they were unable to dwell together.","re":"[It] was unable to support them. [Meaning] It could not provide [enough] pasture for their cattle. The phrase is abbreviated and an additional [word] is needed: “The pasture of the land could not support them.” The text, therefore, reads וְלֹא נָשָׂא in the masculine form.","p":[{"q":"What does 'ולא נשא אתם הארץ' mean according to Rashi?","o":["The land did not provide enough pasture for the livestock of both of them","The land was not wide enough for their tents","The inhabitants of the land did not agree that they live together"]},{"q":"Why is 'נשא' written in the masculine, although the word 'הארץ' is feminine?","o":["Because it means 'the pasture of the land', and 'pasture' is masculine","Because it refers to Avram, who could not bear Lot","Because in Scripture the word 'eretz' is always masculine"]}]},"13:7.1":{"e":"Lot's shepherds were wicked and grazed their animals in other people's fields, and Avram's shepherds rebuked them for the theft. They claimed that the land was given to Avram, who has no heir, and Lot is his heir, so it is not theft. But the verse testifies that the Canaanite and Perizzite still lived in the land, and Avram had not yet acquired it.","pe":"There was a quarrel between the herdsmen of Avram’s flocks and the herdsmen of Lot’s flocks. The Canaanites and the Perizzites were then living in the land.","re":"There was a quarrel. Because Lot’s shepherds were wicked and grazed their animals in others’ fields. [When] Avram’s shepherds admonished them for [committing] robbery, they responded: “The land was given to Avram who has no heir. Lot, his nephew, is his heir and, [therefore,] this does not constitute robbery.” But, the verse states: “The Canaanites and Perizzites were then living in the land,” so that Avram did not yet possess it.","p":[{"q":"What was the quarrel between Avram's shepherds and Lot's shepherds about?","o":["Lot's shepherds grazed in other people's fields, and Avram's shepherds rebuked them for the theft","Both sides quarreled over the few water wells in the land","Avram's shepherds wanted to separate their livestock from Lot's"]},{"q":"Why does the verse mention here 'והכנעני והפרזי אז ישב בארץ'?","o":["To show that Avram had not yet acquired the land, so it was theft","To show that the land was crowded and therefore not enough for them","To show that the Canaanite and Perizzite caused the quarrel"]}]},"13:8.1":{"e":"'אחים' here means relatives. According to the Midrash, they resembled each other in their facial features.","pe":"Avram said to Lot: Please [Now], let there not be strife between me and you, and between my herdsmen and your herdsmen, for we are kinsmen.","re":"We are kinsmen. [Here meaning:] relatives. The Midrashic explanation is: they had similar facial features.","p":[{"q":"Why did Avram say to Lot 'אנשים אחים אנחנו', when Lot was his brother's son?","o":["Because 'brothers' here means relatives","Because Lot was also Sarah's brother","Because all people are considered brothers to one another"]}]},"13:9.1":{"e":"Avram told Lot that wherever he chose to settle, he would not distance himself from him and would stand by him as a shield and help. And in the end Lot did need him, when he was taken captive in the war.","pe":"Is not all the land before you? Please [Now] separate from me, if [you go] to the left [north], I [will go] to the right [south], and if [you go] to the right [south], I [will go] to the left [north].","re":"If [you go] to the left, I [will go] to the right. [Meaning:] wherever you may settle I will not go far from you and I will stand by you [to serve] as a shield and as a help. In the end he, indeed, needed him as it is said, “When Avram heard that his kinsman was taken captive.”","p":[{"q":"What did Avram mean by saying 'אם השמאל ואימנה'?","o":["That wherever Lot goes, Avram will not distance himself from him and will protect him","That Avram and Lot would go in opposite directions and never meet again","That Lot would choose first, and Avram would take the better portion"]}]},"13:9.2":{"e":"'ואימנה' means 'I will turn myself to the right', like 'ואשמאילה', which means 'I will turn myself to the left'. And although it would have been fitting to vocalize it 'ואימינה', we find elsewhere 'להמין' and not 'להימין'.","pe":"Is not all the land before you? Please [Now] separate from me, if [you go] to the left [north], I [will go] to the right [south], and if [you go] to the right [south], I [will go] to the left [north].","re":"I [will go] to the right. [Meaning:] “I will direct myself towards the right,” just as וְאַשְׂמְאִילָה [means] “I will direct myself towards the left.” If you may ask that it should have been vocalized וְאַיְמִינָה [you may be answered that] we find similarly in another place [in Scripture]: “Can one direct himself to the right?” and it is not vocalized לְהַיְמִין.","p":[{"q":"What does the word 'ואימנה' mean according to Rashi?","o":["I will turn myself to the right, like 'ואשמאילה' for the left","I will believe you and be faithful to you, from the word emunah","I will go south, since 'right' is a term for south"]}]},"13:10.1":{"e":"'כי כלה משקה' means that it was a land of water streams.","pe":"Lot raised his eyes and saw the entire Jordan Plain, that it was [an] abundantly watered [place]; before Adonoy destroyed Sedom and Amorah, it was like Adonoy’s garden, like the land of Egypt, going towards Zoar.","re":"That it was abundantly watered. A land of water streams.","p":[{"q":"What does 'כי כלה משקה' mean?","o":["That it was a land of water streams","That the whole land needed irrigation","That all the flocks of the region were watered there"]}]},"13:10.2":{"e":"The plain was well-watered and fertile like this before Hashem destroyed Sedom and Amorah.","pe":"Lot raised his eyes and saw the entire Jordan Plain, that it was [an] abundantly watered [place]; before Adonoy destroyed Sedom and Amorah, it was like Adonoy’s garden, like the land of Egypt, going towards Zoar.","re":"Before Adonoy destroyed Sedom and Amorah. That plain was …","p":[{"q":"According to Rashi, what do the words 'שחת ה' את סדם ואת עמרה' teach in the verse?","o":["That the plain was this fertile before Sedom and Amorah were destroyed","That Lot foresaw that Sedom and Amorah were destined to be destroyed","That the plain became fertile only after the destruction of Sedom"]}]},"13:10.3":{"e":"The plain was like the garden of Hashem in the abundance of trees in it.","pe":"Lot raised his eyes and saw the entire Jordan Plain, that it was [an] abundantly watered [place]; before Adonoy destroyed Sedom and Amorah, it was like Adonoy’s garden, like the land of Egypt, going towards Zoar.","re":"like Adonoy’s garden for [the growing of] trees …","p":[{"q":"In what way was the Jordan plain like 'גן ה''?","o":["In the abundance of trees that grew in it","In that no people lived in it at all","In the abundance of grains and vegetables that grew in it"]}]},"13:10.4":{"e":"The plain was like the land of Egypt in the abundance of grains that grew in it.","pe":"Lot raised his eyes and saw the entire Jordan Plain, that it was [an] abundantly watered [place]; before Adonoy destroyed Sedom and Amorah, it was like Adonoy’s garden, like the land of Egypt, going towards Zoar.","re":"like the Land of Egypt for [growing] grain and vegetables.","p":[{"q":"In what way was the Jordan plain like 'ארץ מצרים'?","o":["In the abundance of grains that grew in it","In the abundance of trees that grew in it","In the wickedness of the people who lived in it"]}]},"13:10.5":{"e":"'באכה צער' means as far as Tzo'ar. According to the Midrash it is a criticism: Lot chose to live in the neighborhood of the people of the place because they were steeped in immorality.","pe":"Lot raised his eyes and saw the entire Jordan Plain, that it was [an] abundantly watered [place]; before Adonoy destroyed Sedom and Amorah, it was like Adonoy’s garden, like the land of Egypt, going towards Zoar.","re":"Going toward Zoar. [Meaning:] until Zoar. The Midrashic interpretation explains it disparagingly. It was because they were permeated with immorality that Lot chose their locality.","p":[{"q":"What does 'באכה צער' mean according to the simple meaning?","o":["As far as Tzo'ar - the plain extended that far","W
